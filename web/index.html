    "id": "mcdonald-s-earnings-beat-but-traffic-to-af69bf58",
    "title": "McDonald's earnings beat, but traffic to its U.S. restaurants falls",
    "titleJa": "McDonald's earnings beat, but traffic to its U.S. restaurants falls",
    "summaryJa": "McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.",
    "bodyOriginal": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\nAt the company's investor day in September, executives said that same-store sales in July and August were slightly negative but they expected September to return to same-store sales growth.\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\nShares of the company rose more than 2% in premarket trading.\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n- Earnings per share: $3.57 adjusted vs. $3.38 expected\n- Revenue: $7.16 billion vs. $7.29 billion expected\nThe company reported third-quarter net income of $2.49 billion, or $3.51 per share, up from $2.28 billion, or $3.18 per share, a year earlier.\nExcluding restructuring charges and other items, McDonald's earned $3.57 per share.\nNet revenue rose 1% to $7.16 billion.\nThe company's same-store sales rose 1.5%, lifted by its international segments. That topped analysts' expectations of a 1.3% increase, according to StreetAccount.\nMcDonald's international developmental licensed markets business, which includes Japan and China, reported same-store sales growth of 4.2%. Wall Street was forecasting same-store sales to rise 2.1% for the division, based on StreetAccount estimates.\nThe company's international operated division, which includes top markets like Australia and Germany, saw same-store sales growth of 1.4%. Still, the business underperformed Wall Street's expectations. Analysts were projecting same-store sales would rise 2.1%, according to StreetAccount. France was a weak spot, McDonald's said.",
    "bodyJa": "McDonald's on Wednesday reported mixed quarterly results as traffic to its U.S. restaurants fell, leading to a slight decline in domestic same-store sales.\nThe fast-food giant reported a 0.2% decrease in sales at its U.S. restaurants that have been open at least 13 months. Even so, the segment performed better than the 0.5% decline that Wall Street anticipated, according to a survey of analysts by StreetAccount.\nAt the company's investor day in September, executives said that same-store sales in July and August were slightly negative but they expected September to return to same-store sales growth.\n\"In the U.S., we're encouraged by improvement as the quarter progressed following our intervention on value,\" McDonald's CEO Chris Kempczinski said in a statement.\nKempczinski said in August that the company's U.S. business was falling short on execution, particularly on the implementation of its value offerings. Like many restaurants, McDonald's has leaned into discounts to attract budget-conscious diners over the last two years.\nShares of the company rose more than 2% in premarket trading.\nHere's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG:\n- Earnings per share: $3.57 adjusted vs. $3.38 expected\n- Revenue: $7.16 billion vs. $7.29 billion expected\nThe company reported third-quarter net income of $2.49 billion, or $3.51 per share, up from $2.28 billion, or $3.18 per share, a year earlier.\nExcluding restructuring charges and other items, McDonald's earned $3.57 per share.\nNet revenue rose 1% to $7.16 billion.\nThe company's same-store sales rose 1.5%, lifted by its international segments. That topped analysts' expectations of a 1.3% increase, according to StreetAccount.\nMcDonald's international developmental licensed markets business, which includes Japan and China, reported same-store sales growth of 4.2%. Wall Street was forecasting same-store sales to rise 2.1% for the division, based on StreetAccount estimates.\nThe company's international operated division, which includes top markets like Australia and Germany, saw same-store sales growth of 1.4%. Still, the business underperformed Wall Street's expectations. Analysts were projecting same-store sales would rise 2.1%, according to StreetAccount. France was a weak spot, McDonald's said.",

  {
    "id": "5-midterm-election-takeaways-tech-billio-bd6216b4",
    "title": "5 midterm election takeaways: Tech billionaires suffer as Democrats drub Republicans",
    "titleJa": "5 midterm election takeaways: Tech billionaires suffer as Democrats drub Republicans",
    "summaryJa": "Elon Musk's spending may have become a liability as voters in exit polls raised concerns about government corruption and the growing influence of billionaires.",
    "bodyOriginal": "Democrats decisively took control of Congress Tuesday night, delivering a stinging rebuke to President Donald Trump and his economic record as voters voiced deep frustration with rising prices, government corruption and the AI data center build-out.\nThe party scored an extraordinary pair of victories in traditionally Republican Texas. James Talarico defeated Ken Paxton, becoming the first Democrat elected to the U.S. Senate from the state in nearly four decades. Gina Hinojosa defeated three-term Gov. Greg Abbott, making her the first Democratic governor of Texas since Ann Richards left office in 1995. Texas became the clearest measure of how far the blue wave reached: Democrats swept the state's marquee races in a Republican stronghold long considered beyond their grasp.\nThe victories were part of a broader wave of Democratic gains. In South Carolina, Democrat Annie Andrews upset Darline Graham in a race Republicans had expected to win. In Ohio, Sherrod Brown defeated Republican Sen. Jon Husted. Democrats also flipped Senate seats in Iowa and North Carolina and won key races in Georgia and New Hampshire.\nThe results marked a striking collapse for Trump's candidates. Paxton, Graham and Husted were among the president's prominent picks who lost after he made dozens of endorsements.\nThe election also sharpened the political fight over data centers and artificial intelligence infrastructure. Texas is a major center of planned data-center construction, and Hinojosa campaigned for a pause on new projects until the state adopts tougher rules. Her victory gives Democrats more influence over Texas' approach to the build-out, though the state Legislature remains in Republican hands.\nThe results also delivered a blow to the tech billionaires and corporate interest groups that poured hundreds of millions of dollars into backing Republican candidates who might be friendly to the massive AI data center projects they hope to build around the country. Elon Musk, the world's richest man and the cycle's largest individual political donor, spent record sums in a failed effort to help Republicans retain power, including in Texas.\nMusk's spending may have become a liability as voters raised concerns about government corruption and the growing influence of billionaires in exit polls. Talarico repeatedly attacked Musk on the campaign trail, accusing him of trying to buy \"his very own personal United States Senator.\"\n\"Tonight's results are a wake-up call for corporate special interests and billionaires who have been rigging the economy,\" said Rep. Chris Pappas, who defeated former Republican Sen. John Sununu to win an open Senate seat in New Hampshire.\nThe outcome is poised to reshape the technology sector's relationship with Washington. A more adversarial Congress is likely to intensify scrutiny of tech companies and the AI data center build-out. Markets reacted as the scale of Democratic gains became clear: Dow futures fell and S&P 500 futures slipped Tuesday evening.\nEconomic frustration was also central to Democratic gains. Many voters blamed Trump's tariffs and the war with Iran for worsening their economic situation, while the cost of living remained a persistent strain.\nDemocratic control of both chambers gives the party a powerful check on Trump in the final two years of his term, including the ability to block parts of his agenda and intensify congressional oversight. The results sent a clear warning: promises to bring down costs did not overcome voters' frustration with prices, corruption and the country's direction.\n1. Big tech loses as Democrats trounce after record-breaking spend\nSilicon Valley spent record sums trying to shape the election. Instead, it got a Democratic House promising to haul its CEOs before congressional investigators.\nMany of the winners ran against not just Trump, but the billionaire donors who helped bankroll Republicans. In North Carolina, Cooper told supporters that North Carolinians \"will always matter more than the billionaires and the insiders.\"\nIn Texas, Talarico defeated Paxton despite more than $200 million from SpaceX CEO Musk to stop him. On the same ballot, Hinojosa defeated Abbott after blaming him for the rapid buildout of data centers across Texas, saying the governor for putting Big Tech interests ahead of local communities.\nThe GOP had a commanding advantage among the election's biggest donors. According to a CNBC analysis of Federal Election Commission records, 14 of the 20 largest donor groups backed Republicans exclusively or nearly so. Crypto, AI, and online gambling interests poured more than $377 million into races.\nNot all of Silicon Valley's money ended up on the losing side. LinkedIn co-founder Reid Hoffman, one of Democrats' biggest donors, cast the results as \"an overwhelming wave against Trump and his cronies\" and took a direct shot at Musk.\n\"We should get money out of politics,\" Hoffman wrote on X late Tuesday. \"And while people like Elon are spending outrageous amounts to keep authoritarian clowns in power, those of us who believe in the ideals of America cannot yield.\"\n2. Business — especially tech — is going to have to adjust their Washington strategy\nWith control of the House comes the power to launch investigations, issue subpoenas and examine the Trump administration and its allies. That's going to be a challenge for tech companies to navigate as they find themselves in Democratic crosshairs.\nDemocrats are already calling for AI executives to testify under oath.\nAmong the first to seize on the results was Rep. Greg Casar, the Texas Democrat who chairs the Congressional Progressive Caucus.\n\"The House Democratic majority must make it a top priority to protect Americans' jobs, freedom, and lives from AI billionaires,\" Casar said in a statement after Democrats were projected to win the House. \"AI company CEOs should be called to testify under oath.\"\nRep. Robert Garcia, D-Calif., the presumptive next chair of the oversight committee, put it more simply: \"Lawyer up,\" he said in a statement.\nThe results also present headwinds for the infrastructure undergirding AI.\nThe Texas results appear to be a warning sign for the AI industry in a state projected to overtake Virginia as the world's biggest data center market by 2030, according to JLL. Abbott had long courted data center development before shifting his position this year as the backlash grew. Talarico and Hinojosa both seized on that anger, winning over Republican voters fed up with data centers going up in their communities. Hinojosa has promised to force lawmakers to regulate the industry.\nIn a CNBC Voter Poll, 56% of voters said data centers were a crucial or major factor in their decision, with Democrats ranking the issue higher than Republicans.\n3. Redistricting flopped\nTrump personally pushed states to redistrict their congressional seats mid-decade to cement a Republican majority in the House. The effort largely flopped.\nMany of the GOP's redrawn districts ended up falling to Democrats, despite the unprecedented effort to defend or flip them by redrawing boundaries mid-decade.\nThat includes seats in Texas, Florida and North Carolina, which Democrats won despite Republicans making them safer. In Texas, where Republicans began their redistricting war that then spread to other states, Democrats ended up winning most of the gerrymandered seats.\nThe redistricting push was always risky because no recent census was available when the maps were drawn.\n4. Trump's vengeance tour came back to bite him\nTrump rolled out the red carpet for Paxton, only for Republicans to lose a Senate seat in Texas for the first time in over three decades.\nTalarico's victory in Texas came after Trump endorsed Paxton over the incumbent Sen. John Cornyn, R-Texas, who held the seat for decades. In endorsing Paxton, Trump said Cornyn had not been sufficiently loyal.\nPaxton prevailed in a bitter primary, and Trump's move to tip the scales spurned Senate Republicans, who saw Cornyn as a better and less expensive candidate than Paxton — who had a laundry list of scandals that plagued his campaign.\nSen. Darline Graham, R-S.C., who Trump handpicked to replace her late brother Lindsey Graham, fell to Democrat Annie Andrews. And Republican Michael Whatley lost to former Gov. Roy Cooper in North Carolina.\n5. Democrats effectively tied corruption to affordability\nDemocrats linked voter concerns over the cost of living to corruption in government in the lead-up to their colossal victory. The mix of the two helped propel corruption to be a top voter issue rather than a downballot concern.\nPublic polling indicated before Tuesday night that the issue of corruption was landing with voters. CNBC's All-America Survey conducted in mid-October found corruption was voters' top concern. Exit polls on Tuesday also tied the two issues: 69% said benefits flow to the wealthy in CNBC's Voter Poll.\nThe issue of corruption has exploded into public view during the second Trump term, as reports of Trump family business deals and the president's own ballooning wealth while in office dominate headlines.\nIn victory speeches across the country, Democrats made clear they are committed to battling a \"rigged\" system — a line reminiscent of once-radical Bernie Sanders presidential campaigns.\n\"We must get big money out of our politics, so no billionaire or trillionaire can buy our elections. We must unrig this economic system that only benefits the top one percent,\" Talarico said. \"The real fight in this country is not left versus right. It is top versus bottom.\"",

ve to tip the scales spurned Senate Republicans, who saw Cornyn as a better and less expensive candidate than Paxton — who had a laundry list of scandals that plagued his campaign.\nSen. Darline Graham, R-S.C., who Trump handpicked to replace her late brother Lindsey Graham, fell to Democrat Annie Andrews. And Republican Michael Whatley lost to former Gov. Roy Cooper in North Carolina.\n5. Democrats effectively tied corruption to affordability\nDemocrats linked voter concerns over the cost of living to corruption in government in the lead-up to their colossal victory. The mix of the two helped propel corruption to be a top voter issue rather than a downballot concern.\nPublic polling indicated before Tuesday night that the issue of corruption was landing with voters. CNBC's All-America Survey conducted in mid-October found corruption was voters' top concern. Exit polls on Tuesday also tied the two issues: 69% said benefits flow to the wealthy in CNBC's Voter Poll.\nThe issue of corruption has exploded into public view during the second Trump term, as reports of Trump family business deals and the president's own ballooning wealth while in office dominate headlines.\nIn victory speeches across the country, Democrats made clear they are committed to battling a \"rigged\" system — a line reminiscent of once-radical Bernie Sanders presidential campaigns.\n\"We must get big money out of our politics, so no billionaire or trillionaire can buy our elections. We must unrig this economic system that only benefits the top one percent,\" Talarico said. \"The real fight in this country is not left versus right. It is top versus bottom.\"",

    "id": "no-more-rice-grains-in-kellogg-s-rice-kr-fde29da0",

    "titleJa": "No more rice grains in Kellogg's Rice Krispies due to changing weather",
    "summaryJa": "The new recipes mean cereal packaging will now include a 'contains wheat gluten' warning.",
    "bodyOriginal": "No more rice grains in Kellogg's Rice Krispies due to changing weather\n- Published\nBreakfast cereal giant Kellogg's has stopped using rice grains in Rice Krispies and Coco Pops in the UK due to \"changing weather conditions\" that have disrupted supplies.\nCorn flour and rice flour are being used instead, a Kellogg's spokesperson said on Tuesday, adding that the updated recipes have been \"carefully assessed\" and the firm has taken customer feedback into consideration.\nThose ingredients are replacing rice grains as crops have been hit by dry weather in key producing countries in Asia, reducing harvests and driving up prices.\nThe new recipes mean cereal packaging will now include a \"contains wheat gluten\" warning.\nRice Krispies products in the US and Canada will continue to be made with real rice with no changes to their recipes expected, a spokesperson for Kellogg's North American business told the BBC.\nThe recipe change in the UK will help \"maintain consistent quality at a time when changing weather conditions are affecting the quality and availability of some of the rice and grains used in our cereals,\" a Kellogg's spokesperson told the BBC.\n\"We appreciate that even small changes to a much-loved product can feel noticeable and that's why we have approached this with a lot of care and consideration.\"\nThe company also said that Rice Krispies and Coco Pops will continue to meet UK food standards on levels of fat, salt and sugar in food.\nThe cereals also contain no artificial colours, flavours or sweeteners and the nutritional benefits in each bowl, such as fibre, Vitamin D and iron are staying the same, the spokesperson added.\nWatch: How does El Niño affect world weather?\n- Published21 August\nThe Kellogg company separated into two distinct firms in 2023.\nThe largest is Kellanova, which focuses on snacks, cereals, noodles and other food products like Eggo, Pringles and Pop-Tarts sold globally. It is now owned by Mars, which makes confectionery and pet food.\nThe other business, WK Kellogg's, operates in North America and has since been taken over by Italian chocolate giant Ferrero.\nMost of the world's rice comes from Asia, many parts of which has been impacted by droughts, floods and heatwaves due to the El Niño weather phenomenon.\nThe weather event is expected to severely impact crop production from South East Asia in particular. The region produces more than a quarter of the world's rice.\nThe World Meteorological Agency expects the record-breaking El Niño will last until at least 2027.\nRelated topics\n- Published20 October",
    "bodyJa": "No more rice grains in Kellogg's Rice Krispies due to changing weather\n- Published\nBreakfast cereal giant Kellogg's has stopped using rice grains in Rice Krispies and Coco Pops in the UK due to \"changing weather conditions\" that have disrupted supplies.\nCorn flour and rice flour are being used instead, a Kellogg's spokesperson said on Tuesday, adding that the updated recipes have been \"carefully assessed\" and the firm has taken customer feedback into consideration.\nThose ingredients are replacing rice grains as crops have been hit by dry weather in key producing countries in Asia, reducing harvests and driving up prices.\nThe new recipes mean cereal packaging will now include a \"contains wheat gluten\" warning.\nRice Krispies products in the US and Canada will continue to be made with real rice with no changes to their recipes expected, a spokesperson for Kellogg's North American business told the BBC.\nThe recipe change in the UK will help \"maintain consistent quality at a time when changing weather conditions are affecting the quality and availability of some of the rice and grains used in our cereals,\" a Kellogg's spokesperson told the BBC.\n\"We appreciate that even small changes to a much-loved product can feel noticeable and that's why we have approached this with a lot of care and consideration.\"\nThe company also said that Rice Krispies and Coco Pops will continue to meet UK food standards on levels of fat, salt and sugar in food.\nThe cereals also contain no artificial colours, flavours or sweeteners and the nutritional benefits in each bowl, such as fibre, Vitamin D and iron are staying the same, the spokesperson added.\nWatch: How does El Niño affect world weather?\n- Published21 August\nThe Kellogg company separated into two distinct firms in 2023.\nThe largest is Kellanova, which focuses on snacks, cereals, noodles and other food products like Eggo, Pringles and Pop-Tarts sold globally. It is now owned by Mars, which makes con     "title": "Google responds to political backlash over removing search from schools that ban AI",
    "titleJa": "Google responds to political backlash over removing search from schools that ban AI",
    "summaryJa": "After elected officials voiced outrage over Google turning off search at schools that ban AI, the company said search can be turned back on with AI Overviews.",
    "bodyOriginal": "Google is playing defense on Tuesday after a political backlash to its new policy surrounding use of artificial intelligence in schools.\nIn a blog post titled \"Designing responsible AI for learning,\" Google said it's bringing AI into its Classroom offering with a product called Guided Learning. The New York Times published a story saying that the company will turn off search for schools that reject AI entirely.\nFollowing the Times' story, prominent left-leaning politicians, including Sen. Bernie Sanders from Vermont and New York Mayor Zohran Mamdani voiced their outrage on social media.\n\"Google is trying to use its monopoly power to force AI into our public schools,\" Mamdani wrote on X. Sanders wrote that \"Google is threatening schools,\" referring to the policy as \"extortion.\"\nGoogle responded later in the day. In a post on X, the company said its new policy was meant to give schools more choice over how students interact with AI. Google said its Gemini chatbot, Gemini Notebook and search are turned off by default, and that \"schools are in control,\" with the ability to turn them as they see fit.\n\"We are also updating Search for schools to make it better for learning,\" Google wrote. \"Specifically, AI Mode and AI Overviews will offer step-by-step guided learning through problems, so that students don't get quick answers to schoolwork.\"\nThe company's post didn't explicitly respond to the claim that access to search requires use of AI. However, Chris Phillips, vice president for education at Google, told the Times that \"Search and AI are deeply integrated.\"\nA Google spokesperson referred CNBC to the X post when asked for comment.\nGoogle's broader practices have come under fire in recent years, with the company losing antitrust cases over its search and advertising businesses. Former Federal Trade Commission Chair Lina Khan aggressively pursued Google and other tech giants, including Meta and Amazon.\nKhan said in a post on X on Tuesday that Google's new AI for learning policy highlights \"the danger of allowing an unregulated monopolist to control an essential service.\"\nIt's the latest controversy related to the impact of technology on children and the role leading internet companies are playing in delivering information.\nIn August, Meta reached a landmark $16.7 billion settlement in its child safety trial after a number of state attorneys general accused the company of misrepresenting the extent of child mental health harms caused by apps like Facebook and Instagram.\nThe same month, OpenAI launched ChatGPT for Teens after state attorneys general launched an investigation into the company's safety practices, with Florida Attorney General James Uthmeier, a Republican, filing a lawsuit in June.\nThe nonprofit Common Sense Media recently gave Google's AI overviews an \"unacceptable risk\" rating. Last month, Sens. Richard Blumenthal, D-Conn., and Josh Hawley, R-Mo., launched an inquiry over Google's push of AI into classrooms.\nGoogle introduced AI overviews as a search function in May 2024.\n— CNBC's MacKenzie Sigalos contributed to this report.\nWATCH: Meta settled its child safety lawsuit. Now comes the hard part.",
    "bodyJa": "Google is playing defense on Tuesday after a political backlash to its new policy surrounding use of artificial intelligence in schools.\nIn a blog post titled \"Designing responsible AI for learning,\" Google said it's bringing AI into its Classroom offering with a product called Guided Learning. The New York Times published a story saying that the company will turn off search for schools that reject AI entirely.\nFollowing the Times' story, prominent left-leaning politicians, including Sen. Bernie Sanders from Vermont and New York Mayor Zohran Mamdani voiced their outrage on social media.\n\"Google is trying to use its monopoly power to force AI into our public schools,\" Mamdani wrote on X. Sanders wrote that \"Google is threatening schools,\" referring to the policy as \"extortion.\"\nGoogle responded later in the day. In a post on X, the company said its new policy was meant to give schools more choice over how students interact with AI. Google said its Gemini chatbot, Gemini Notebook and search are turned off by default, and that \"schools are in control,\" with the ability to turn them as they see fit.\n\"We are also updating Search for schools to make it better for learning,\" Google wrote. \"Specifically, AI Mode and AI Overviews will offer step-by-step guided learning through problems, so that students don't get quick answers to schoolwork.\"\nThe company's post didn't explicitly respond to the claim that access to search requires use of AI. However, Chris Phillips, vice president for education at Google, told the Times that \"Search and AI are deeply integrated.\"\nA Google spokesperson referred CNBC to the X post when asked for comment.\nGoogle's broader practices have come under fire in recent years, with the company losing antitrust cases over its search and advertising businesses. Former Federal Trade Commission Chair Lina Khan aggressively pursued Google and other tech giants, including Meta and Amazon.\nKhan said in a post on X on Tuesday that Google's new AI for learning policy highlights \"the danger of allowing an unregulated monopolist to control an essential service.\"\nIt's the latest controversy related to the impact of technology on children and the role leading internet companies are playing in delivering information.\nIn August, Meta reached a landmark $16.7 billion settlement in its child safety trial after a number of state attorneys general accused the company of misrepresenting the extent of child mental health harms caused by apps like Facebook and Instagram.\nThe same month, OpenAI launched ChatGPT for Teens after state attorneys general launched an investigation into the company's safety practices, with Florida Attorney General James Uthmeier, a Republican, filing a lawsuit in June.\nThe nonprofit Common Sense Media recently gave Google's AI overviews an \"unacceptable risk\" rating. Last month, Sens. Richard Blumenthal, D-Conn., and Josh Hawley, R-Mo., launched an inquiry over Google's push of AI into classrooms.\nGoogle introduced AI overviews as a search function in May 2024.\n— CNBC's MacKenzie Sigalos contributed to this report.\nWATCH: Meta settled its child safety lawsuit. Now comes the hard part.",

    "id": "canva-announces-major-job-cuts-after-our-cd40382e",
    "title": "Canva announces major job cuts after 'our hardest year yet'",
    "titleJa": "Canva announces major job cuts after 'our hardest year yet'",
    "summaryJa": "CEO Melanie Perkins says more than 1,000 staff will either lose their jobs or be asked to change roles.",
    "bodyOriginal": "Canva announces major job cuts after 'our hardest year yet'\n- Published\nCanva, one of Australia's best known start-ups, has announced a shake up of the business that will affect 22% of its workers, including job cuts.\nIn what was \"without doubt the hardest moment in our thirteen-year history\" co-founder and CEO Melanie Perkins said 1,271 people would either lose their jobs, be asked to relocate or change roles.\nThe firm's value has reportedly dropped in the past year over concerns about the impact of artificial intelligence (AI) on its business as well as the cost of incorporating the technology into its platforms.\nIt had been \"our hardest year yet, and as we shared earlier this year, our growth has slowed for the first time in a decade,\" Perkins wrote to staff.\nThe \"incredibly hard decision\" meant \"significant changes,\" Perkins said.\n\"For some people, this will mean changes to their roles or being asked to relocate to centralised hubs. Sadly, it will also mean saying goodbye to teammates and friends who have helped build Canva into what it is today.\"\nThe company, which has staff in 37 countries, said Sydney would become the \"primary home\" for more of its product teams and that as of next year hybrid workers would be expected to spend two to three days in the office.\nEarlier this year two of its backers, Blackbird Ventures and Airtree, reportedly downgraded its valuation from A$60bn ($41.8bn; £31.1bn) at the end of last year to about A$49bn.\nCanva also reportedly cut its own internal valuation amid soaring AI expenses related to the roll out of new products.\n\"New technology is transforming what people can create, how they create it, and what they expect from the products they use,\" Perkins said in her note on Wednesday.\nPerkins, who left university at 19 to found her first venture, launched Canva in 2013.\nThe company offers a variety of templates and tools to help users without technical skills or a design background to create a range of professional-looking graphics and presentations, from wedding invitations to business pitch decks.",

    "title": "Graduates are managing AI - but are they learning much else?",
    "titleJa": "Graduates are managing AI - but are they learning much else?",
    "summaryJa": "Graduates are spending more time managing AI, but are they missing out on other work experience?",
    "bodyOriginal": "Graduates are managing AI - but are they learning much else?\n- Published\nRecent university graduate Lotte Underwood is a public relations executive with a twist - she spends more time using AI than actually doing PR.\nUnderwood, 25, joined London-based PR agency Fight or Flight in November last year, in the new role of \"AI associate\" after completing a degree and then a masters in marketing.\nShe's part of a recently established, dedicated AI team that has built around 30 AI agents. Specific tasks include industry research, client reporting, media interview preparation, helping clients create clearer briefs, and image generation.\nA big part of Underwood's job is to manage those agents, check their outputs and feed those to the team members who are dealing directly with clients and the media.\nAnother key responsibility of hers is to monitor how clients appear in the responses from AI tools like ChatGPT, Claude, Gemini and others.\n\"A huge part is being in client meetings and calls to work out what is actually going to be most helpful from these agents,\" says Underwood.\nAI is seen as one of the main factors behind graduate job cuts, but companies are also creating dedicated AI-specific graduate roles like Underwood's.\nDillan Patel, for example, joined engineering software company Stride 18 months ago as an intern. A business management graduate, he was put to work developing an internal chatbot designed to capture the knowledge of a senior staff member transitioning into retirement.\nPatel, 24, is now an AI automation analyst, tasked with developing further internal agents to provide specific information to individual teams, while also identifying which manual or repetitive tasks across the company could be done by AI.\n\"My role focuses on finding practical ways to use technology, automation, data and AI to improve how we operate,\" says Coventry-based Patel.\nSuch AI savvy graduates are also in demand from companies like ArvatoConnect, an outsourced contact centre company.\nCEO Debra Maxwell says the company's usual graduate intake is on hold this year, but she plans to resume it next year with a bigger focus on AI.\n\"We would be looking for more AI-disruptor type roles, where you can challenge us as an organisation to think more holistically about where AI can be applied and where we could grow our business from,\" says London-based Maxwell.\n\"We see our graduates as not filling administrative roles, but actually adding value to the organisation in a different way.\"\nMaxwell adds: \"For example, one of our recent graduates is using AI to do deep dives on specific markets, and provide more information for when we're bidding [for new contracts]. It's basically giving him a more rounded role.\"\nIf AI can make a graduate job bigger and more integral to the organisation, Maxwell argues that companies can create a more loyal, engaged workforce that is able to contribute more meaningfully, much earlier.\nResearch from consultancy PwC found that some graduate roles are assuming more responsibilities because of AI, as it allows companies to demand more senior abilities from junior hires.\nFor the consultancy's 2026 AI Jobs Barometer, external, it analysed 2.4 million entry-level jobs in the US. It found that the entry-level roles most influenced by AI are now seven times more likely to require traditionally senior-level skills. These include motivational leadership, strategic decision making and team building.\nThose entry-level roles with higher expectations have in fact grown 35% since 2019, PwC found, while other entry-level roles actually shrank by 10%.\nCian Clinton, who joined consultancy Valliance last September after graduating from a Bachelor of Science in 2024, says the incorporation of AI into his role makes him feel less like a graduate, and more like an equal team member. He uses around 10 AI agents daily for different tasks.\n\"Your ideas and your creativity are a lot more valued because you actually get to implement those firsthand, and the responsibility you take on is a lot greater because of that,\" says London-based Clinton, 23.\n\"I am now taking on responsibilities which would usually take me four or five years to get to.\"\nHis career progression, he believes, will now be faster as a result.\n\"AI is killing the 'pyramid' approach…progression is no longer based on your knowledge bank. Now it's more based on your critical thinking and understanding of the processes,\" says Clinton.\n'Learning the trade'\nThere's no doubt Underwood, Patel and Clinton are developing valuable AI knowledge which can help them across their careers.\nBut with their time at work so focused on AI, does it matter how much - or how little - time they're spending learning about the professional field they're supposed to be operating in?\nUnderwood says she'd like to still pick up the traditional PR skills her role isn't currently focused on, but is confident of her future in the agency's growing AI team.\n\"There's certain things that I haven't had the chance to do yet, like directly pitching to the media. I absolutely plan to do this,\" she says.\nGraduates becoming too AI-centric is an issue for Simon Pratt, chief operating officer at Portman Finance Group. He says being able to use AI effectively is important, but the company's two-year graduate programme is fully centred on \"learning the trade\".\n\"Our graduates rotate across four areas at six-month intervals, working directly alongside senior relationship managers to learn their trade,\" Northampton-based Pratt explains.\n\"They'll learn all of our financial products, how to draft credit papers for submission to lenders, and how to build meaningful relationships with our customers. They'll progress to running transactions from start to finish.\"\nClaire Reed, PwC UK's chief technology and innovation officer, believes graduate roles that are too AI heavy won't necessarily provide graduates long-term career progression.\n\"There will be no graduate job now that doesn't require a baseline of AI literacy,\" says Glasgow-based Reed.\n\"But AI skills on their own are not going to help you in your career. You've got to couple that with that sector knowledge of what that client actually wants.\"\nBack in Coventry, Dillan Patel is confident his AI work will continue to be valuable, and he wants to keep building on it.\n\"I don't think I'd want to explore different positions within the business. Through my involvement in AI-related projects, I already work closely with different areas of the business and I'm gaining valuable knowledge and experience along the way,\" he says.\nTechnology of Business\n- Published9 October\n- Published25 September\n- Published18 September",

    "title": "Poundland supplier 'will lose millions' if retailer collapses",
    "titleJa": "Poundland supplier 'will lose millions' if retailer collapses",
    "summaryJa": "One of Poundland's suppliers will lose millions if it collapses, while other suppliers have said they would go under.",
    "bodyOriginal": "Poundland supplier 'will lose millions' if retailer collapses\n- Published\nOne of Poundland's suppliers has said it will lose millions if the firm collapses.\nWhile that supplier will stay afloat, it is feared that some small and medium-sized suppliers could go under.\nThis is in addition to potentially thousands of job losses among staff.\nPoliticians have been putting questions to representatives of Poundland owners Gordon Brothers this week seeking \"clarity\" on plans for the retailer.\nAdam Turner, sales director at Highcrest Retail Brands - a family owned Bradford business - told the BBC that Poundland was one of Highcrest's biggest customers, and that the firms have had a relationship for decades.\nHighcrest mainly sells confectionary to Poundland, and turns over about £50m.\nIt will \"lose a few million\" if Poundland becomes insolvent, so it will have a gap in its balance sheet next year, he said.\nHighcrest was a \"longstanding business that can stomach this\", but other medium and small suppliers have told him that \"if Poundland goes under, so do they\", Mr Turner said.\nThis echoes a warning from Poundland founder Steve Smith on Monday that two or three thousand suppliers to the firm, which only work for Poundland, would be directly affected by its collapse.\nNot only 12,000 Poundland staff would be affected, but also potentially tens of thousands more, he said.\nIf Poundland's stores are sold to new buyers, some of the employees may get new jobs on the same premises. However, it is understood that buyers are only interested in about half the stores at present - meaning roughly 6,000 employees would not be re-employed.\nPoundland's founder offers to invest in firm\n- Published1 day ago\nHigh stock levels\nMr Turner said that the last three months of the year is the \"golden quarter\" for retailers. In terms of sweets, Poundland will get its Halloween stock in from July, and Christmas stock in from September.\nThese three months will be the time of year when suppliers will be owed the most by Poundland.\nIf Poundland goes under, suppliers will be getting \"pennies in the pound\" back from the administration, he said, which is \"very upsetting\" - although he still hopes a deal can be done so Poundland can remain solvent.\nPoundland owners Gordon Brothers will be a secured creditor, which means they are first in line to get their money back, and suppliers \"who have done nothing wrong\" will take the financial hit.\n\"It's sad. It's a nightmare for us all to be honest with you. It's not just the suppliers, it's the staff at Poundland, some of these guys have been there for many years.\n\"It's from the warehouse staff all the way to the shop staff to everybody within head office. It's a massive ripple effect through the supply chain,\" he added.\nMr Turner said he had no knowledge of whether Gordon Brothers had deliberately timed the process of Poundland going into administration so it could take advantage of having high stock levels, which it can then sell.\nOne of the ways Gordon Brothers makes money is through stock liquidations - selling off stock from collapsed businesses.\nOne insider familiar with the situation told the BBC that the timing of Poundland facing collapse was \"odd\" - most retailers don't fall over in the run-up to Christmas.\nGordon Brothers was approached for comment.\nMinisters' questions\nMeanwhile, business secretary Jonathan Reynolds will meet with Gordon Brothers later this week after he and Prime Minister Andy Burnham questioned why a solvent deal had not been made.\nBusiness minster Kate Dearden told MPs that government officials had also met with representatives from Gordon Brothers on Monday.\n\"I am deeply concerned about the uncertainty surrounding Poundland's future and the impact it could have on its staff and their families who are at the forefront of my mind,\" Dearden told the House of Commons.\n\"Poundland is not currently in administration and the business continues to trade, but this is a worrying time for employees, suppliers and communities\", she added.\nThe minister confirmed she would also be meeting with Poundland executives on Wednesday.\nShe said the government doesn't want to interfere with \"current ongoing commercial negotiations\", but said ministers would be seeking \"clarity\" on the plans for the retailer.\n\"It's absolutely legitimate for this government to ask the business if they're doing everything they can to protect employees and suppliers up and down the country,\" she added.\nDearden told MPs that the government would be ready to help the company's employees, should the current situation end in administration.\n\"We stand ready to support them if they need to move into new employment, however... our priority is always in protecting jobs and the Secretary of State and I will continue to engage with the company to secure the best possible outcome,\" she added.\nThe head of Gordon Brothers' European operations reportedly told the government that the firm stood by its stewardship and had given Poundland £85m in additional financing since its purchase in 2025.",
    "bodyJa": "Poundland supplier 'will lose millions' if retailer collapses\n- Published\nOne of Poundland's suppliers has said it will lose millions if the firm collapses.\nWhile that supplier will stay afloat, it is feared that some small and medium-sized suppliers could go under.\nThis is in addition to potentially thousands of job losses among staff.\nPoliticians have been putting questions to representatives of Poundland owners Gordon Brothers this week seeking \"clarity\" on plans for the retailer.\nAdam Turner, sales director at Highcrest Retail Brands - a family owned Bradford business - told the BBC that Poundland was one of Highcrest's biggest customers, and that the firms have had a relationship for decades.\nHighcrest mainly sells confectionary to Poundland, and turns over about £50m.\nIt will \"lose a few million\" if Poundland becomes insolvent, so it will have a gap in its balance sheet next year, he said.\nHighcrest was a \"longstanding business that can stomach this\", but other medium and small suppliers have told him that \"if Poundland goes under, so do they\", Mr Turner said.\nThis echoes a warning from Poundland founder Steve Smith on Monday that two or three thousand suppliers to the firm, which only work for Poundland, would be directly affected by its collapse.\nNot only 12,000 Poundland staff would be affected, but also potentially tens of thousands more, he said.\nIf Poundland's stores are sold to new buyers, some of the employees may get new jobs on the same premises. However, it is understood that buyers are only interested in about half the stores at present - meaning roughly 6,000 employees would not be re-employed.\nPoundland's founder offers to invest in firm\n- Published1 day ago\nHigh stock levels\nMr Turner said that the last three months of the year is the \"golden quarter\" for retailers. In terms of sweets, Poundland will get its Halloween stock in from July, and Christmas stock in from September.\nThese three months will be the time of year when suppliers will be owed the most by Poundland.\nIf Poundland goes under, suppliers will be getting \"pennies in the pound\" back from the administration, he said, which is \"very upsetting\" - although he still hopes a deal can be done so Poundland can remain solvent.\nPoundland owners Gordon Brothers will be a secured creditor, which means they are first in line to get their money back, and suppliers \"who have done nothing wrong\" will take the financial hit.\n\"It's sad. It's a nightmare for us all to be honest with you. It's not just the suppliers, it's the staff at Poundland, some of these guys have been there for many years.\n\"It's from the warehouse staff all the way to the shop staff to everybody within head office. It's a massive ripple effect through the supply chain,\" he added.\nMr Turner said he had no knowledge of whether Gordon Brothers had deliberately timed the process of Poundland going into administration so it could take advantage of having high stock levels, which it can then sell.\nOne of the ways Gordon Brothers makes money is through stock liquidations - selling off stock from collapsed businesses.\nOne insider familiar with the situation told the BBC that the timing of Poundland facing collapse was \"odd\" - most retailers don't fall over in the run-up to Christmas.\nGordon Brothers was approached for comment.\nMinisters' questions\nMeanwhile, business secretary Jonathan Reynolds will meet with Gordon Brothers later this week after he and Prime Minister Andy Burnham questioned why a solvent deal had not been made.\nBusiness minster Kate Dearden told MPs that government officials had also met with representatives from Gordon Brothers on Monday.\n\"I am deeply concerned about the uncertainty surrounding Poundland's future and the impact it could have on its staff and their families who are at the forefront of my mind,\" Dearden told the House of Commons.\n\"Poundland is not currently in administration and the business continues to trade, but this is a worrying time for employees, suppliers and communities\", she added.\nThe minister confirmed she would also be meeting with Poundland executives on Wednesday.\nShe said the government doesn't want to interfere with \"current ongoing commercial negotiations\", but said ministers would be seeking \"clarity\" on the plans for the retailer.\n\"It's absolutely legitimate for this government to ask the business if they're doing everything they can to protect employees and suppliers up and down the country,\" she added.\nDearden told MPs that the government would be ready to help the company's employees, should the current situation end in administration.\n\"We stand ready to support them if they need to move into new employment, however... our priority is always in protecting jobs and the Secretary of State and I will continue to engage with the company to secure the best possible outcome,\" she added.\nThe head of Gordon Brothers' European operations reportedly told the government that the firm stood by its stewardship and had given Poundland £85m in additional financing since its purchase in 2025.",

    "id": "amd-stock-jumps-8-on-earnings-as-data-ce-1f897f29",
    "title": "AMD stock jumps 8% on earnings as data center revenue nearly doubles",
    "titleJa": "AMD stock jumps 8% on earnings as data center revenue nearly doubles",
    "summaryJa": "AMD reported better-than-expected third-quarter results, driven by booming sales of AI chips",
    "bodyOriginal": "Advanced Micro Devices reported third-quarter earnings on Tuesday that beat Wall Street's expectations, with revenue jumping 45% and data center sales nearly doubling from a year earlier. The stock was up 8% in extended trading.\nHere's how the chipmaker did versus LSEG consensus estimates for the quarter:\n- Earnings per share: $2.09 adjusted vs. $1.95 expected\n- Revenue: $13.38 billion vs. $13.09 billion expected\nRevenue increased from $9.25 billion a year earlier, AMD said in a statement. Neoclouds like CoreWeave and Nebius rallied earlier Tuesday and remained higher after AMD reported results.\nCEO Lisa Su said on the earnings call that she expects server revenue to double year over year in 2027 and data center AI growth to accelerate even faster than the company had projected 90 days ago. The company expects data center to drive the majority of its revenue and earnings growth.\n\"We have worked across our supply chain to secure the wafers, substrates, advanced packaging, memory, and other key components needed to support much higher growth next year,\" Su said on the earnings call.\nAMD's report comes days after Intel disclosed similar data center growth, with revenue in that segment up 78% in the third quarter. But Intel's stock plummeted 29% on Friday over concerns about weak guidance and Intel's ability to meet demand.\nThe data center unit makes up the majority of AMD's business, accounting for 64% of overall revenue, up from 47% a year ago.\nAfter years spent chasing Nvidia in the market for artificial intelligence graphics processing units, or GPUs, AMD's central processing units, or CPUs, are experiencing a major resurgence with the rise of agentic AI apps like Meta's Muse. AMD's server CPUs are key for agentic apps because they power virtual machines and can run for hours on their own. Demand from agentic AI boosted AMD shares to a record in October.\n\"Adoption is just starting, and we expect demand to grow sharply as agents are deployed more broadly and take on more complex work,\" Su said on the earnings call with analysts.\nPC market struggles\nAMD's stock is up about 125% this year, but it saw three consecutive days of losses before rallying on Tuesday amid an industrywide sell-off tied to fears about overspending on AI.\nAMD is also a major player in the weakening PC market, which Intel blamed for its poor outlook last week. AMD and Intel are the largest makers of traditional x86 processors that power many laptops and desktops, while other laptops rely on Arm-based processors from the likes of Qualcomm and Apple.\nGlobal PC shipments declined 4% in the second quarter from a year earlier due to soaring costs for memory and other components, according to Counterpoint Research.\nAMD reports PC chip sales in a segment combined with gaming chips. Revenue in that business fell 8% from a year earlier to $3.7 billion. Gaming revenue was down 40% from a year ago.\nFor the fourth quarter, AMD said it expects about $17 billion in revenue, beating the $16.2 billion average analyst estimate, according to LSEG. AMD sees its gross margin for the quarter coming in at 55%, slightly below the average estimate of 55.3%, according to StreetAccount.\nAMD also sells data center GPUs and full rack-scale systems called Helios that compete directly with Nvidia's Grace Blackwell and Vera Rubin systems. Meta, Microsoft, Anthropic, OpenAI, and Oracle are all beginning to use AMD Helios in their data centers. Meta said last week that its Helios racks are up and running, and AMD agreed to invest $1 billion in Meta's equity offering.\nAMD has also committed to investing up to $5 billion in Anthropic, which unveiled its highly anticipated prospectus last week as it inches closer to a potentially historic initial public offering.\nDuring a visit to Taiwan in October, Su said she plans to \"substantially increase our supply in 2027.\" Su and Nvidia CEO Jensen Huang have both made multiple trips to Taiwan and South Korea this year, holding meetings with key suppliers like Taiwan Semiconductor Manufacturing Company and memory leaders SK Hynix and Samsung.\nIn September, AMD said it would acquire World Labs for $8.2 billion in an all-stock deal. The San Francisco-based AI lab, founded by industry pioneer Fei-Fei Li, is developing a so-called world model that simulates 3D environments to aid in developing robots and other physically grounded AI applications.\nWATCH: Helios is AMD’s first AI system to rival Nvidia Vera Rubin — we got an exclusive, first look",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
