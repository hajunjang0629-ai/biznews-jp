    "title": "France hit by worst unrest in years as attempts to rein in government spending meet citizen ire",
    "titleJa": "France hit by worst unrest in years as attempts to rein in government spending meet citizen ire",
    "summaryJa": "France’s worst unrest in years saw thousands arrested, prompting President Macron to vow an “uncompromising” response ahead of a critical budget vote.",
    "bodyOriginal": "France endured its worst unrest in years this weekend as nationwide protests over high living costs and declining public services turned violent ahead of a key government vote on the budget.\nDemonstrations erupted into riots on Saturday, with almost 2,400 people arrested, shops looted or damaged and buildings covered in graffiti as violent groups clashed with police in cities across the country, according to the interior ministry. Nearly 1,000 police officers and gendarmes were injured, the ministry said.\nPresident Emmanuel Macron, whose final months in office are increasingly defined by mounting political, fiscal and social discontent, ordered a review of whether there had been failings in intelligence gathering or police preparedness, and asked the government to bring together students, teachers, lawmakers, unions and business leaders this week to produce \"concrete proposals\" to address the crisis.\nThe unrest comes as Prime Minister Sébastien Lecornu's minority government seeks €54 billion ($61 billion) of fiscal savings in its 2027 budget as he tries to narrow the country's growing deficit. The National Assembly is due to hold a formal vote on the first part of the bill on Tuesday.\nFrance has in recent years struggled to rein in spending and a debt burden that has ballooned to a record €3.6 trillion in the second quarter, reaching 119% of GDP, and is becoming increasingly expensive to service as interest rates spike across the world.\nAbout 550,000 people marched in scores of cities Saturday, including 110,000 in Paris, according to authorities. The latest wave of demonstrations followed a month-long student movement over teacher shortages and school conditions, with broader anger from unions. While hundreds of thousands protested peacefully, violent fringe groups targeted public buildings, looted shops and attacked police.\nIn a televised address Sunday evening, Macron said: \"Looking at these images, we have all asked ourselves: What was going through their minds? How can French people do this to France?\"\n\"Nothing justifies it, nothing explains it, nothing excuses it,\" he said, pledging an \"uncompromising\" response to \"agitators from ultra-left fringe groups, joined by numerous delinquents.\"\nHe stopped short of declaring a state of emergency or imposing a curfew, but said prefects and mayors would be allowed to ban certain gatherings where necessary to protect public buildings and local businesses.\nThe 143-year-old town hall in Limoges, in central France, was set ablaze and largely destroyed after looters broke the window in an arson attack. \"There was a clear, premeditated intention to burn down the town hall, and the people inside feared for their lives,\" shaken Mayor Guillaume Guérin told Reuters on Sunday. Protesters forced their way into Marseille's city hall, and a tourist office in Lyon was set ablaze.\nInterior Minister Laurent Nuñez said Sunday that several hundred shops sustained considerable material damage, and Bordeaux Mayor Thomas Cazenave said up to 100 stores there were looted.\nOne protester died of cardiac arrest during demonstrations in Paris, police said in a statement, without providing further details. Police fired tear gas and stun grenades Sunday afternoon to break up the rally at Place de la République in Paris, and bicycles were set on fire.\nThe country's economy minister Roland Lescure has vowed government support for business owners who have suffered losses from the riots. \"Those who break things will pay, repair the damage and be held accountable for their intention to sow chaos,\" Reuters reported, citing a statement.\nFar-right opposition leader Marine Le Pen, frontrunner for next year's presidential campaign, said the troubles showed that Macron's government is \"running on fumes, exhausted and disoriented.\" Far-left leader Jean-Luc Mélenchon, who is also running for president, said Macron needed to answer the demands of protesting high-school students, and the country could be heading toward \"events that will eventually become uncontrollable.\"",

    "id": "china-s-growth-accelerates-as-ai-export-537bc09b",
    "title": "China's growth accelerates as AI export boom outweighs domestic weakness",
    "titleJa": "China's growth accelerates as AI export boom outweighs domestic weakness",
    "summaryJa": "Exports have helped offset weak spending at home, but trade tensions and AI doubts cloud its outlook.",
    "bodyOriginal": "China's growth accelerates as AI export boom outweighs domestic weakness\n- Published\nChina's economic growth picked up in the three months to the end of September, rebounding from a three-year low as the artificial intelligence (AI) boom helped boost exports.\nThe world's second largest economy grew by 4.5% in the third quarter, up from the previous period but below the 5% expansion recorded from January to March, according to official Chinese data.\nThe latest figure is at the bottom end of Beijing's annual growth target of 4.5%-5%, which analysts have said gives policymakers room to address the country's economic challenges.\nWhile exports have helped offset weak spending at home, global trade tensions and uncertainty over AI investments are clouding its outlook.\nChina's National Bureau of Statistics said on Monday that the economy \"sustained steady development against pressure\" and showed \"momentum with new growth drivers and improving structure\".\nWith exports climbing, China's trade surplus - the amount of goods and services it sells abroad compared to what it buys from other countries - is on track to overtake the record $1.2tn (£900bn) seen last year.\nBut property investment fell by more than 20% in the first nine months from the same period last year, official data also showed.\nOxford Economics researcher Sheana Yue said manufacturing and high-tech exports have boosted China's growth, despite weak investment and domestic spending.\nChina's economy has struggling to shake off a long-running property slump, after years of overbuilding and excessive borrowing by private developers.\nThere are still no signs that this trend will end soon, Yue said.\nTrade uncertainties and geopolitical issues have also made Chinese consumers more \"pessimistic\" and unwilling to spend, she added.\nThe technology industry has been a key driver of China's growth in recent quarters.\nGlobal demand for computer chips and other components used to build AI data centres has helped to ease pressure on Beijing and cushion the impact of sluggish domestic consumption.\nChinese businesses have leaned heavily on exports as a prolonged property slump, weak wage growth and high youth unemployment have weighed on consumer spending at home.\nIn September, Beijing unveiled a raft of support measures, including lower interest rates for some businesses and subsidies for property buyers, in an effort to boost the economy.\nBut Beijing is facing a backlash from Western economies - including the US and European Union - as manufacturers struggle to compete with large amounts of cheap Chinese goods.\nThere are also concerns over the billions of dollars being spent on AI infrastructure and whether the companies making those investments can deliver on their promises of generating huge profits.\n- Published18 March 2025\n- Published22 September",
    "bodyJa": "China's growth accelerates as AI export boom outweighs domestic weakness\n- Published\nChina's economic growth picked up in the three months to the end of September, rebounding from a three-year low as the artificial intelligence (AI) boom helped boost exports.\nThe world's second largest economy grew by 4.5% in the third quarter, up from the previous period but below the 5% expansion recorded from January to March, according to official Chinese data.\nThe latest figure is at the bottom end of Beijing's annual growth target of 4.5%-5%, which analysts have said gives policymakers room to address the country's economic challenges.\nWhile exports have helped offset weak spending at home, global trade tensions and uncertainty over AI investments are clouding its outlook.\nChina's National Bureau of Statistics said on Monday that the economy \"sustained steady development against pressure\" and showed \"momentum with new growth drivers and improving structure\".\nWith exports climbing, China's trade surplus - the amount of goods and services it sells abroad compared to what it buys from other countries - is on track to overtake the record $1.2tn (£900bn) seen last year.\nBut property investment fell by more than 20% in the first nine months from the same period last year, official data also showed.\nOxford Economics researcher Sheana Yue said manufacturing and high-tech exports have boosted China's growth, despite weak investment and domestic spending.\nChina's economy has struggling to shake off a long-running property slump, after years of overbuilding and excessive borrowing by private developers.\nThere are still no signs that this trend will end soon, Yue said.\nTrade uncertainties and geopolitical issues have also made Chinese consumers more \"pessimistic\" and unwilling to spend, she added.\nThe technology industry has been a key driver of China's growth in recent quarters.\nGlobal demand for computer chips and other components used to build AI data centres has helped to ease pressure on Beijing and cushion the impact of sluggish domestic consumption.\nChinese businesses have leaned heavily on exports as a prolonged property slump, weak wage growth and high youth unemployment have weighed on consumer spending at home.\nIn September, Beijing unveiled a raft of support measures, including lower interest rates for some businesses and subsidies for property buyers, in an effort to boost the economy.\nBut Beijing is facing a backlash from Western economies - including the US and European Union - as manufacturers struggle to compete with large amounts of cheap Chinese goods.\nThere are also concerns over the billions of dollars being spent on AI infrastructure and whether the companies making those investments can deliver on their promises of generating huge profits.\n- Published18 March 2025\n- Published22 September",

    "summaryJa": "The announcement comes as Anthropic lays the ground for a blockbuster stock market listing.",
    "bodyOriginal": "Anthropic says it will commit 5% of its shares to 'public benefit fund'\n- Published\nArtificial intelligence (AI) giant Anthropic says it will commit 5% of its shares to a fund that will make donations for the \"public good\".\nThe announcement comes as Anthropic lays the ground for a potential blockbuster stock market listing that could value the firm at more than $1tn (£750bn).\nThe AI industry has come under intense scrutiny recently over safety concerns and fears about its impact on society and the economy. Anthropic reportedly said in its initial public offering (IPO) filing that AI could pose \"catastrophic or existential risks to humanity\".\nAnthropic said its proposed fund could support nonprofit organisations, and efforts to address AI's impact on the jobs market.\nNone of the shares held by the the fund would be used for lobbying or political donations in the US or overseas, it added.\nAnthropic's Public Benefit Fund could also receive another 2% of the firm's shares at its board's discretion, the Claude developer said in a statement released on Sunday.\nTechnology billionaire Elon Musk responded to the announcement on social media with: \"I recommend giving the shares directly to the public.\" \"This is what I will be doing,\" he added.\nLast week, Anthropic told prospective investors that its revenue surged by 45% to $16.8bn (£12.6bn) in the three months to the end of September.\nIn common with other AI firms, it is seeking to position itself as being able to generate huge profits despite spending billions on developing the technology and building infrastructure to power its models.\nCompanies around the world, primarily technology firms, have cut thousands of jobs after investing in AI, with many pointing to higher efficiencies from its adoption.\nResearch by the International Monetary Fund (IMF) published in 2024 suggested that almost 40% of jobs around the world will be affected by AI, with that figure rising as high as 60% in advanced economies.\nRelated topics\n- Published17 September\n- Published9 October",

d economies.\nRelated topics\n- Published17 September\n- Published9 October",

    "titleJa": "People playing loud music on buses could face £100 fine",
    "summaryJa": "Antisocial behaviour on buses in England could lead to fines while a new campaign is also being launched for trains.\nA national campaign asking rail passengers \"share the carriage, not the noise\" is being launched.",
    "bodyOriginal": "People playing loud music on buses could face £100 fine\n- Published\nPassengers who play loud music on buses in England could be fined up to £100 under an attempt by the government to crack down on antisocial behaviour.\nThe measures also seek to tackle littering, vaping and threatening behaviour to help improve journeys on all forms of public transport.\nOffenders on buses could be issued with the fines under new powers for local authorities.\nA national campaign asking rail passengers \"share the carriage, not the noise\" is also being launched. The proposed crackdown has been welcomed by campaigners, but some have questioned how it can be enforced.\n\"We've all been on the train when someone starts blasting music or videos from their phone. It gets on your nerves and can quickly spoil the journey,\" said Prime Minister Andy Burnham.\nUnder existing powers, those who are asked to stop and refuse could be removed from a train or fined up to £1,000.\nThe phenomenon has been given many terms - including loudcasting or sodcasting - and in recent years, Ofcom, YouGov and Transport for London (TfL) have all published polls showing the vast majority of people dislike it.\nTransport Secretary Heidi Alexander said small changes in behaviour \"can make a massive difference to people's experience on public transport\".\nThe government said it had issued new guidance to local authorities on powers - which were introduced earlier this year - to help them crackdown on loud music and other antisocial behaviour on buses in England.\nThese new powers allow them to impose new rules on buses, but still need to be signed off by the Transport Secretary\nThose who commit offences could face fixed penalties of up to £100.\nThe government says bus drivers will not be responsible for enforcing the new rules. It says authorised officers, including Transport Safety Officers and the Police, will deal with the incidents.\nMeanwhile a new national campaign aims to remind rail passengers to \"share the carriage, not the noise\", to improve journeys for everyone\nThe campaign will be launched across operator websites, social media, and in carriages. The government said this would end the current \"patchwork\" of approaches across different rail operators, and help create \"a clear, consistent message across the network\".\nThe general secretary of the TSSA transport union, Maryam Eslamdoust, said tackling antisocial behaviour on public transport was \"a step in the right direction\".\nHowever, she added that the government must also \"urgently confront the violence, threats and abuse faced by passengers and transport workers\".\n\"Increasing the budget for British Transport Police is vital to protect people, respond to incidents and bring violent offenders to justice,\" she said.\nMichael Solomon Williams from the Campaign for Better Transport told the BBC antisocial behaviour could be a \"real deterrent\" to people using public transport, especially those with different accessibility needs.\nHe also questioned how the new measures will be enforced. \"When local authorities are required to do the enforcement there are perhaps some question marks about how a local police force might be called upon on bus services, for example, where we don't tend to see British Transport Police.\"\nRichard Holden MP, Shadow Transport Secretary, said: \"After we led the charge against antisocial behaviour on public transport last summer, Ministers have worked out that nobody wants to endure pounding techno or blaring hip hop on a packed train or bus.\n\"But passengers and railway staff face far more serious problems. Assaults against rail staff have risen by 68%, while prosecutions have slumped under Labour. It's time for Andy Burnham to get serious about enforcement, tackling violence and protecting those who work on our railways.\"\nLiberal Democrat Transport spokesperson, Olly Glover MP said: \"Tough talk means nothing without enforcement.\n\"Unless the Government funds transport safety officers on the ground, these new rules won't be worth the paper they're printed on.\"\nIndependent watchdog Transport Focus said research it had published in June showed personal safety and security was now fundamental to passengers' confidence in the railway.\n\"Four in 10 passengers say that anti-social behaviour has made them feel vulnerable when travelling,\" said Alex Campbell, Transport Focus's director of policy and insight.\n\"Measures that reduce nuisance behaviour, such as playing loud music and vaping, can help improve people's experience and encourage more people to choose public transport.\"\nRelated topics\n- Published6 August\n- Published24 September\n- Published11 July",

assengers to \"share the carriage, not the noise\", to improve journeys for everyone\nThe campaign will be launched across operator websites, social media, and in carriages. The government said this would end the current \"patchwork\" of approaches across different rail operators, and help create \"a clear, consistent message across the network\".\nThe general secretary of the TSSA transport union, Maryam Eslamdoust, said tackling antisocial behaviour on public transport was \"a step in the right direction\".\nHowever, she added that the government must also \"urgently confront the violence, threats and abuse faced by passengers and transport workers\".\n\"Increasing the budget for British Transport Police is vital to protect people, respond to incidents and bring violent offenders to justice,\" she said.\nMichael Solomon Williams from the Campaign for Better Transport told the BBC antisocial behaviour could be a \"real deterrent\" to people using public transport, especially those with different accessibility needs.\nHe also questioned how the new measures will be enforced. \"When local authorities are required to do the enforcement there are perhaps some question marks about how a local police force might be called upon on bus services, for example, where we don't tend to see British Transport Police.\"\nRichard Holden MP, Shadow Transport Secretary, said: \"After we led the charge against antisocial behaviour on public transport last summer, Ministers have worked out that nobody wants to endure pounding techno or blaring hip hop on a packed train or bus.\n\"But passengers and railway staff face far more serious problems. Assaults against rail staff have risen by 68%, while prosecutions have slumped under Labour. It's time for Andy Burnham to get serious about enforcement, tackling violence and protecting those who work on our railways.\"\nLiberal Democrat Transport spokesperson, Olly Glover MP said: \"Tough talk means nothing without enforcement.\n\"Unless the Government funds transport safety officers on the ground, these new rules won't be worth the paper they're printed on.\"\nIndependent watchdog Transport Focus said research it had published in June showed personal safety and security was now fundamental to passengers' confidence in the railway.\n\"Four in 10 passengers say that anti-social behaviour has made them feel vulnerable when travelling,\" said Alex Campbell, Transport Focus's director of policy and insight.\n\"Measures that reduce nuisance behaviour, such as playing loud music and vaping, can help improve people's experience and encourage more people to choose public transport.\"\nRelated topics\n- Published6 August\n- Published24 September\n- Published11 July",

    "id": "don-t-fall-for-this-how-to-protect-yours-ff6ae921",
    "title": "Don't fall for this - how to protect yourself from AI scams",
    "titleJa": "Don't fall for this - how to protect yourself from AI scams",
    "summaryJa": "Trading standards officers say AI is \"super-charging\" existing scams through clones and fake websites.",
    "bodyOriginal": "Don't fall for this - how to protect yourself from AI scams\n- Published\nBe careful where you buy from, shoppers are being warned as criminals use AI to supercharge scams.\nSome fraudsters have made websites for fake retailers that claim to be family-owned firms selling quality UK-made products. Images may show a UK High Street with Union Jack flags in shot.\nIf you order you're likely to find a product either never arrives, or is a cheap, mass-produced item from a country such as China, trading standards officers say.\nAI-generated images like this, as well as voice cloning and deepfake videos are increasingly being used to trick people out of their money, according to National Trading Standards.\nFor the first time, it has drawn up an AI scam watchlist, external highlighting some of the tools and techniques criminals are using.\nWhat are the tricks to look out for?\nTricks include:\nCloned or new websites that look polished and professional in rapid time and at a low cost\nRomance scams in which AI is used to remember victims' personal details and keep conversations going over weeks or months\nAI-generated deepfake videos and voice-cloned audio is used to impersonate family members or close friends asking for money in an \"emergency\"\nError-free, personalised phishing emails, text messages and social media posts can be generated by AI on a huge scale\nHow can I protect myself?\nSome of the old scam-avoidance techniques may now be less successful due to the benefits of AI.\nTypos or grammatical errors can no longer be relied on to spot scams, says consumer group Which?.\nSome of the ways to protect yourself, according to trading standards, include:\nNever sending money, gift cards or personal or financial information to someone you have not met in person\nDoing your research - such as checking whether a shop's address is real, using the Financial Conduct Authority's Firm Checker, external, to ensure a company is authorised to give financial advice, and contacting a business directly to check whether a job advert is real\nNot assuming someone is genuine just because you've heard their voice or seen them on a video call\nIn general, they say stop and think before paying, sharing personal information or taking action. You should be especially wary of pressure or urgency because criminals want you to act before you have time to think.\nFraud and scams can be reported to Report Fraud, external or by calling on 0300 1232040, or you can call the Citizens Advice Consumer Helpline on 0808 223 1133 for advice.\n- Published7 days ago\n- Published9 October\n- Published6 October",
    "bodyJa": "Don't fall for this - how to protect yourself from AI scams\n- Published\nBe careful where you buy from, shoppers are being warned as criminals use AI to supercharge scams.\nSome fraudsters have made websites for fake retailers that claim to be family-owned firms selling quality UK-made products. Images may show a UK High Street with Union Jack flags in shot.\nIf you order you're likely to find a product either never arrives, or is a cheap, mass-produced item from a country such as China, trading standards officers say.\nAI-generated images like this, as well as voice cloning and deepfake videos are increasingly being used to trick people out of their money, according to National Trading Standards.\nFor the first time, it has drawn up an AI scam watchlist, external highlighting some of the tools and techniques criminals are using.\nWhat are the tricks to look out for?\nTricks include:\nCloned or new websites that look polished and professional in rapid time and at a low cost\nRomance scams in which AI is used to remember victims' personal details and keep conversations going over weeks or months\nAI-generated deepfake videos and voice-cloned audio is used to impersonate family members or close friends asking for money in an \"emergency\"\nError-free, personalised phishing emails, text messages and social media posts can be generated by AI on a huge scale\nHow can I protect myself?\nSome of the old scam-avoidance techniques may now be less successful due to the benefits of AI.\nTypos or grammatical errors can no longer be relied on to spot scams, says consumer group Which?.\nSome of the ways to protect yourself, according to trading standards, include:\nNever sending money, gift cards or personal or financial information to someone you have not met in person\nDoing your research - such as checking whether a shop's address is real, using the Financial Conduct Authority's Firm Checker, external, to ensure a company is authorised to give financial advice, and contacting a business directly to check whether a job advert is real\nNot assuming someone is genuine just because you've heard their voice or seen them on a video call\nIn general, they say stop and think before paying, sharing personal information or taking action. You should be especially wary of pressure or urgency because criminals want you to act before you have time to think.\nFraud and scams can be reported to Report Fraud, external or by calling on 0300 1232040, or you can call the Citizens Advice Consumer Helpline on 0808 223 1133 for advice.\n- Published7 days ago\n- Published9 October\n- Published6 October",

    "id": "home-sellers-cut-asking-prices-on-3-000-58d9321d",
    "title": "Home sellers cut asking prices on 3,000 properties a day",
    "titleJa": "Home sellers cut asking prices on 3,000 properties a day",
    "summaryJa": "More property asking prices are being cut than at any time in 15 years, data shared with the BBC shows.",
    "bodyOriginal": "Home sellers cut asking prices on 3,000 properties a day\n- Published\nHome sellers cut asking prices on more than 3,000 properties a day on average in Britain during September, according to figures from Rightmove shared exclusively with the BBC.\nThe property website said the total was the highest of any month for 15 years and was driven, in part, by a glut of homes on the market and some sellers setting unrealistic expectations.\nThe proportion of listed homes that eventually had a price cut peaked in 2023 and has remained relatively high since.\nProperty portals say buyers are now having to be choosy, with many working to a tight budget as mortgage rates have risen to three-year highs.\n\"Once a home has been on the market for a while and then has a price reduction, some buyers start asking questions, even when there is nothing wrong with the property,\" said Colleen Babcock of Rightmove.\n\"In a market with so much choice, first impressions matter.\"\nRightmove data said the average price reduction was nearly 7% - the equivalent of nearly £21,000 cut from a typically valued home.\nIts data showed that homes that had a price reduction typically took 119 days to find a buyer, compared with 39 days for those listed at one price.\nThe proportion of listed homes that had a price reduction stood at 34% in last month, only slightly lower than the recent peak of 36% seen in September 2023.\nRival property portal Zoopla said that buyers were in the driving seat, and were being more cautious and selective about the properties they viewed.\nWith mortgage rates at a three-year high, Zoopla said buyers needed to keep monthly mortgage payments affordable.\nSo, while the number of homes for sale was up 5% in September compared with a year earlier, the number of sales agreed had fallen by 9% over the same period, its figures showed.\nSeptember also tends to be the month with the most cuts to asking prices as sellers often want to complete a sale by the end of the year.\nZoopla's data showed that a quarter of newly-listed homes in September had previously been listed for sale in the last year. Six in 10 were returning at a lower asking price.\nThe problem for sellers was that these homes were taking longer to sell.\nProperties that needed a price reduction were half as likely to find a buyer within the normal three-month timeframe, according to Richard Donnell, executive director of research at Rightmove.\n'Our flat has been for sale for four years': Why is the market so weak?\n- Published19 September\nYou need £17,000 for a first home - here's how to save it\n- Published28 September\nSellers who have contacted the BBC's Your Voice have pointed to the difficulties created by lots of homes on the market, and extra problems for those selling leasehold properties in England.\nOne, who was selling his late father's home in south Wales, said: \"The market is dead. Lots for sale; no-one buying. No-one thinks it's going to get easier.\"\nTarah Lourens, chief operating officer at Rightmove, said that \"emotional\" factors influenced sellers pricing a home - as they \"put a value on the time and money they have invested in their home\".\nBut she said that buyers simply considered everything they could buy at their budget.\nAgents said that valuations now drew on huge amounts of data. Craig Webster, of Tiger Sales and Lettings in Blackpool, said that getting an initial price correct when new to the market was crucial.\n\"That's when you have the greatest opportunity to capture the attention of active buyers,\" he said.\nKatie Griffin, from surveyors Sawdye and Harris in Devon, said that having to correct a price could ultimately lead to a seller accepting less than even a revised asking price.\n\"The property may already have been online for several months and buyers can start asking why it has not sold,\" she said.\nBut Andrew Boast, chief executive of SAM Conveyancing, said sellers might still not be losing out, if they had negotiated aggressively when buying the home and had seen it rise in value while they owned it.\nIn Scotland, the Home Report system, external requires an independent valuation of a home before it is put on the market.\nDonnell, from Zoopla, said the system gave sellers a guide to pricing. As a result homes sold at a faster rate than anywhere else in Britain.\nHis data showed that 74% of homes in Scotland listed during April, May and June sold within three months, compared with 30% in London.\nHe said that higher prices, stamp duty and some people - including landlords - not needing to sell meant that listed homes were less likely to sell in southern England.\nGraphics by BBC data journalist Tommy Lumby\nGet in touch\nHave you had to reduce the asking price when selling a property?",
    "bodyJa": "Home sellers cut asking prices on 3,000 properties a day\n- Published\nHome sellers cut asking prices on more than 3,000 properties a day on average in Britain during September, according to figures from Rightmove shared exclusively with the BBC.\nThe property website said the total was the highest of any month for 15 years and was driven, in part, by a glut of homes on the market and some sellers setting unrealistic expectations.\nThe proportion of listed homes that eventually had a price cut peaked in 2023 and has remained relatively high since.\nProperty portals say buyers are now having to be choosy, with many working to a tight budget as mortgage rates have risen to three-year highs.\n\"Once a home has been on the market for a while and then has a price reduction, some buyers start asking questions, even when there is nothing wrong with the property,\" said Colleen Babcock of Rightmove.\n\"In a market with so much choice, first impressions matter.\"\nRightmove data said the average price reduction was nearly 7% - the equivalent of nearly £21,000 cut from a typically valued home.\nIts data showed that homes that had a price reduction typically took 119 days to find a buyer, compared with 39 days for those listed at one price.\nThe proportion of listed homes that had a price reduction stood at 34% in last month, only slightly lower than the recent peak of 36% seen in September 2023.\nRival property portal Zoopla said that buyers were in the driving seat, and were being more cautious and selective about the properties they viewed.\nWith mortgage rates at a three-year high, Zoopla said buyers needed to keep monthly mortgage payments affordable.\nSo, while the number of homes for sale was up 5% in September compared with a year earlier, the number of sales agreed had fallen by 9% over the same period, its figures showed.\nSeptember also tends to be the month with the most cuts to asking prices as sellers often want to complete a sale by the end of the year.\nZoopla's data showed that a quarter of newly-listed homes in September had previously been listed for sale in the last year. Six in 10 were returning at a lower asking price.\nThe problem for sellers was that these homes were taking longer to sell.\nProperties that needed a price reduction were half as likely to find a buyer within the normal three-month timeframe, according to Richard Donnell, executive director of research at Rightmove.\n'Our flat has been for sale for four years': Why is the market so weak?\n- Published19 September\nYou need £17,000 for a first home - here's how to save it\n- Published28 September\nSellers who have contacted the BBC's Your Voice have pointed to the difficulties created by lots of homes on the market, and extra problems for those selling leasehold properties in England.\nOne, who was selling his late father's home in south Wales, said: \"The market is dead. Lots for sale; no-one buying. No-one thinks it's going to get easier.\"\nTarah Lourens, chief operating officer at Rightmove, said that \"emotional\" factors influenced sellers pricing a home - as they \"put a value on the time and money they have invested in their home\".\nBut she said that buyers simply considered everything they could buy at their budget.\nAgents said that valuations now drew on huge amounts of data. Craig Webster, of Tiger Sales and Lettings in Blackpool, said that getting an initial price correct when new to the market was crucial.\n\"That's when you have the greatest opportunity to capture the attention of active buyers,\" he said.\nKatie Griffin, from surveyors Sawdye and Harris in Devon, said that having to correct a price could ultimately lead to a seller accepting less than even a revised asking price.\n\"The property may already have been online for several months and buyers can start asking why it has not sold,\" she said.\nBut Andrew Boast, chief executive of SAM Conveyancing, said sellers might still not be losing out, if they had negotiated aggressively when buying the home and had seen it rise in value while they owned it.\nIn Scotland, the Home Report system, external requires an independent valuation of a home before it is put on the market.\nDonnell, from Zoopla, said the system gave sellers a guide to pricing. As a result homes sold at a faster rate than anywhere else in Britain.\nHis data showed that 74% of homes in Scotland listed during April, May and June sold within three months, compared with 30% in London.\nHe said that higher prices, stamp duty and some people - including landlords - not needing to sell meant that listed homes were less likely to sell in southern England.\nGraphics by BBC data journalist Tommy Lumby\nGet in touch\nHave you had to reduce the asking price when selling a property?",

    "summaryJa": "Boy, that was awful; a nightmare. Last week wasn't just a rout; it was an obliteration. We had a lot of streaks and milestones noted — semiconductors, down nine straight days. Egads. CoreWeave back to where it was when it plummeted last time. Oh no. Memory implosion. It can't be. But the simple truth is that this market acted, especially Friday, as if the data center story, the $1.2 trillion or $12 trillion \"super-cycle\" — in itself a kiss-of-death term, like the coal super-cycle or the fracking",
    "bodyOriginal": "Boy, that was awful; a nightmare. Last week wasn't just a rout; it was an obliteration. We had a lot of streaks and milestones noted — semiconductors, down nine straight days. Egads. CoreWeave back to where it was when it plummeted last time. Oh no. Memory implosion. It can't be. But the simple truth is that this market acted, especially Friday, as if the data center story, the $1.2 trillion or $12 trillion \"super-cycle\" — in itself a kiss-of-death term, like the coal super-cycle or the fracking super-cycle — is over. That the greatest stock story ever told is over; and you better take every penny and buy Colgate-Palmolive , Coca-Cola , Procter & Gamble and, hopefully, Club name Kimberly-Clark . And all of those AI factories we need? \"Desolation Row.\" Bob Dylan, say it isn't so. How did this happen so quickly? Where were the buyers? I have some answers. Wrong reaction? Let's start by figuring out the reaction ahead of the cause because it might be the wrong reaction. When I look at the breakdown, the concentration of what was being sold last week, culminating in Friday's devastation, it lined up rather perfectly with all of the components of the data center/AI thesis that represents about 25% of the market's market cap, albeit not its absolute percentage, which is far smaller than that. Why the reaction and not the cause? Cart before the horse? No, I don't think so. I believe that what happened last week we will find is an unwind of certain firms' positions coupled with the collapse of some hedge fund we have never heard of that borrowed billions that we don't know about from a firm that hasn't disclosed its own losses yet for lending the manager the money. I could argue that, as my great friend and original TheStreet.com hire, Herb Greenberg, is fond of: This is the end of the line for the debt-fueled hyperscale-hoax. The trillion-dollar con, spawned by Nvidia CEO Jensen Huang's induced moxie to give everyone money so they could buy the latest and greatest graphic processing units (GPUs) from Nvidia, led to CoreWeave's spike in corporate bond yields. That the marginal buyer is now being margined out by the cruel bond market. Reserve judgment Don't be so quick to judge Jensen. Which brings me to the two narratives that we live with every day of our investing life. They are worth parsing. They deserve critical analysis. Let's use last week's action as a paradigm. When Jensen first stumbled on the concept of accelerated computing, he realized that it could be the accelerant needed for something that really didn't exist: gigantic, instant recognition of patterns that unlocked the ability for machines to adopt thinking. Instant pattern recognition of everything. His pal, Sam Altman of OpenAI, saw ways to profit from those who need intelligence artificially. You would think that everyone would have recognized that people would pay for that, but only a few did — and do. Most big tech companies just thought of the back end, the cloud, the pipes, the service to those who wanted to charge for outcomes. As it stands now, only OpenAI, Anthropic and, to a lesser extent, portfolio holding Alphabet via Google's Gemini have capitalized on the movement at scale. But boy, oh boy, have they capitalized on it. Right now, though, given that neither OpenAI nor Anthropic has gone public, there is a universe of activity mostly funded by Nvidia, a longtime Club name, that has allowed the artificial and generative artificial, and now agentic artificial intelligence, to flourish. If Nvidia hadn't provided the seed money, maybe it would have happened eventually. Jensen wants to win. He wants Nvidia shareholders to win. He wants the United States to win. So, he opened his vault and helped fund companies the way venture capital funds help start new enterprises. The skeptics, the critics, the people who depend on things falling apart and the center not holding, just view Jensen's activities as one big legacy of Lucent, the telco equipment company from the turn of the century that did the most to mask how weak things really were by financing their one world of clients until it was obvious that there was very little business to be had without it. Or, to put it in a way Greenberg and his acolytes believe, passionately, Jensen is playing a game of Lazy Susan. He puts the money on the table, he spins it, you take it, and then you buy product from him, and everyone's happy. Having been on the other side of the Lazy Susan table, both when my mother served the turkey and the gravy and when I ran TheStreet.com, my first instinct was to blow the whistle on the activity, and so I did. It was so obviously dirty. I didn't need the goods. I didn't want them. I didn't want the bogus investment, either. Now is not like then The difference between back then and now? Back then, circa 2000, it was obvious that what was known as \"vendor finance\" was simply benefitting the vendor, as we didn't need the end product of what the vendor was providing. That's the actual crux of the indictment, again. Nvidia is no more than the second-coming of Lucent, and Jensen is simply Rich McGinn, the charlatan who always made the quarter with increasingly preposterous new clients that you never dreamed had the money for the purchases. Brazilian Telco. But of course, they didn't, and it was just Lucent with a chimerical bankroll. In the end, you wondered, was anything even purchased, or did the money never even come off the Lazy Susan at all; it was just spun right back. You have to believe the Lucent paradigm if you think that all of this current-day edifice is worthless or worth a lot less. It fits so perfectly, so elegantly that it comes under the short-selling rubric: too good to check out. The beauty of it all: the whole build-out really got going with Michael Intrator, a former bitcoin miner turned CEO of CoreWeave, taking billions of dollars from Nvidia in return for buying a ton of Nvidia chips to put up data centers, first largely for Microsoft, but now for most of the hyperscalers. This whole circular song, according to the bears — to let up on Greenberg, who is simply the most vocal of the negative narrators — only worked if CoreWeave, run by a darned bitcoin miner, was able to con enough public debt customers into giving it money to hold up its side of the Lazy Susan. It's almost poetry in motion. The poetry stopped this week when CoreWeave's debt yields blew up to over 15%, where the rate of return on CoreWeave's spend is too low to justify the build. If there is no new build, then there are no new Nvidia orders. If there are no new Nvidia orders, then it is game over. That was the storyline. It held up throughout the week even as there was a nice bounce from Thursday's bottom. The collapse on Friday that wiped out the Thursday reversal foretold, some would say, what happens Monday morning. Friday's session devolved into a case of \"get out now\" for all but the owners of Phillip Morris, Merck , and Club name Johnson & Johnson . But, at the risk of being right, let me offer you the alternative narrative. The bounce Thursday came about from something Jensen said when asked what to do about CoreWeave. The answer was simple: Don't need to do anything; in fact, things were better than we thought. The answer was brilliant: any other wording that said Jensen was ready to backstop — like he was the \"Federal Reserve of Nvidia\" — and we would know the Lazy Susan table was still in play and Jensen was blissfully ignorant of the now all-powerful critics. I covered the Jonestown mass murder when I was a homicide reporter in Los Angeles. I talked to the relatives of the deceased who drank the original Kool-Aid. So call me someone who knows the Kool-Aid, what it looks like, what it does to you. Nvidia does not market Kool-Aid. Jensen has something that neither Jim Jones nor the bears now had and have: credibility. The fact is, while the public debt market, the one CoreWeave needs to get bigger and bigger, may be halted for now, Jensen knows something to be true that is denied repeatedly by the haters: Nvidia's chips hold up. They may hold their value for 10 years. That's a godsend for Intrator because Jensen is lending against them for about five years. When that period is up, he takes them back. If their prices hold up and they have — he can sell them; he can lease them again. There is no doubt that they hold up. There are benchmarks of truth. There will be a two-way market in these things soon, like mortgage-backed and auto loan-backed bonds. The loan market knows that now. Intrator has borrowed against them already at much lower rates than the public markets offer. It is rare to say the public markets are wrong or manipulated or both. But I think that's the case with CoreWeave, as it is the linchpin to the thesis that the buildout isn't at its end. You either believe it, or you don't. If you believe it, you are tempted to buy Monday morning as the group is ridiculously oversold. If you think it is all one big sham, then short away or sell. Bottom line I don't think it's a sham. Let me repeat that: I don't think it's a sham. CoreWeave is not Lucent. Nvidia is not Nortel, the almighty vendor of that era. We can step back and say this is just some skirmish in the giant war for or against the data center. The big battle will come with the midterm election if it turns out that data centers really fall behind in the election to the point that even Texas and Pennsylvania don't want them. Last week made it look like a one-two punch of the market's tapped out and the election is going against the data center. I think that neither is the case. I think the market is taking a well-deserved breather, and there will always be localities that welcome data centers. I think that the ultimate build-out will come to $10 trillion to $12 trillion, like Morgan Stanley CEO Ted Pick threw out in CNBC Leslie Picker's excellent interview . Moreover, I think that both Anthropic and OpenAI will come public, and anyone who needs to get paid will get paid. And, I think that the states that ban the data centers will rue the day they turned down all the money that is now going to flow to the remaining states that haven't voted or voted in favor. The deals the hyperscalers will offer are insane. Full circle: My view has many believers. Too many. Because obviously many of them borrowed money to make, not that investment, but that bet. They may not even understand the sophisticated chain that gets us to where we are now. They are, alas, the problem. Broken hedge funds, not broken paradigms. If I am right, then the morass clears up pretty quickly; the bigger hedge funds that had their positions sold out underneath them will be revealed. The price of CoreWeave's debt goes down, as it was always juiced by credit default swap buying ; and even Oracle's stock goes up. Don't get complacent. The bears need to make their year, too. But be aware of how long Nvidia's chips last. Understand that there will soon be a public market trading compute because BlackRock , the largest repository of assets, has willed it to be. Recognize that generative artificial intelligence, no matter what the threat to mankind, will triumph. And accept that history will be littered with people who thought about the fourth industrial revolution too aggressively or were thinly capitalized or not competitive — like the overused rail analogy from the 1870s — and didn't make it to the promised land. (See here for a full list of the stocks in Jim Cramer's Charitable Trust.) As a subscriber to the CNBC Investing Club with Jim Cramer, you will receive a trade alert before Jim makes a trade. Jim waits 45 minutes after sending a trade alert before buying or selling a stock in his charitable trust's portfolio. If Jim has talked about a stock on CNBC TV, he waits 72 hours after issuing the trade alert before executing the trade. THE ABOVE INVESTING CLUB INFORMATION IS SUBJECT TO OUR TE     "summaryJa": "French President Emmanuel Macron made a national television address after rioting caused widespread damage.",
    "bodyOriginal": "Macron calls for calm in France and warns rioting must not escalate\n- Published\nFrench President Emmanuel Macron has called for \"calm and order\" after a major day of protests turned into rioting and looting on Saturday, and as some disorder continued in Paris on Sunday.\nIn a national address from the Élysée Palace, he warned those who had taken part not to \"escalate\", adding: \"We all feel anger and shame.\"\nSome 550,000 demonstrators took to the streets for largely peaceful protests against rising fuel prices, the cost of living and deteriorating public services, including schools.\nMacron said a distinction must be drawn between the \"legitimate demands\" of protesters and \"those who destroyed, smashed and looted\".\nPolice have arrested about 2,400 people, according to France's interior ministry.\nThe French president said \"nothing justifies\" the \"unbridled\" violence seen and said those involved would face justice.\nGroups of rioters, some dressed in black and wearing masks and balaclavas, also came out in Paris, Marseille and other towns and cities, with some setting fire to cars and buildings.\nOn Sunday, looting and clashes with police continued on a smaller scale in parts of the capital and Lyon.\nTear gas and stun grenades were fired at hundreds of people in Paris, according to the AFP news agency, and bottles and rocks were again hurled at police.\nSunday saw cities across the country confront the impact of what developed into one of the worst bouts of disorder in modern French history.\nIn Limoges, the ornate 19th Century city hall was gutted by a fire started by rioters on Saturday, its clock tower and roof collapsing and the flames took hold.\nSpeaking near the ruined building, Annèyse said: \"This is very upsetting. Harming heritage buildings just because you are angry at the government is selfish, I think. It's hurting everybody.\"\n\"It's awful and unbelievable,\" said another man who gave his name as Gerrard. \"We are very sad and I think it will be a long time to put it back as it was before.\"\nShopkeepers were seen early on Sunday morning picking up large shards of glass in Paris as rubbish trucks cleared up debris on some of the larger streets.\nWidespread looting took place across the cities of Paris, Marseille and Lille, as well as other areas.\nMacron said local prefects and mayors would draft measures to protections in place for shops and civic buildings.\nThe president also said there would be \"full transparency\" over the police response to the demonstrations.\nTear gas and water cannon were turned on crowds over the weekend and riot police were seen hitting people with batons in several places.\nFrance's interior ministry said about 1,000 police officers were injured on Saturday, seven of them seriously.",

    "title": "What we know so far about deadly fire at Canadian military base",
    "titleJa": "What we know so far about deadly fire at Canadian military base",
    "summaryJa": "At least four people are confirmed to have died after a huge fire swept through the base.",
    "bodyOriginal": "What we know so far about deadly fire at Canadian military base\n- Published\nA huge fire swept through a Canadian military base on Saturday, killing at least four people and seriously injuring dozens more.\nPrime Minister Mark Carney described it as one of the worst peace time tragedies on Canadian soil in the history of the military.\nHere is what we know about the deadly incident so far.\nHow did the fire start?\nFew details about what triggered the deadly fire at Canadian Forces Base Wainwright, which broke out at around 16:00 local time (22:00 GMT), have been confirmed by authorities so far.\nLocal media reported it may have been started when a gas main was struck during a live firing exercise taking place on the grounds.\nCarney said a \"violent, fast-moving fire swept through the base\" without confirming what started it.\nThe Municipal District of Wainwright posted on social media that the fire had \"spread rapidly due to high winds\".\nThe prime minister said military and civilian fire crews \"fought this fire throughout the night in some of the worst conditions imaginable, risking their lives to protect their fellow Canadians\".\nThe Canadian defence ministry has said the cause remains under investigation, and \"at this time, there are no indications that it was the result of any terrorist activity\".\nIt has not been confirmed if those injured were on the base's sprawling ranges where exercises are carried out, or whether the fire spread to living quarters.\nHow many people have been killed?\nFour service members are confirmed to have died, Carney said on Sunday.\nHe also said \"dozens\" had been \"seriously wounded\", without providing further information on their conditions.\nPrior to Carney addressing the nation, Canadian media reported the death toll as seven citing unnamed military sources.\nThe prime minister did not indicate whether or not the government expects the death toll to rise.\nThe names of those who lost their lives have not been identified but their families have been informed.\nOn Saturday evening, Royal Alexandra Hospital in Edmonton declared a code orange - a disaster response protocol for a high-casualty incident. It was stood down on Sunday afternoon.\nAlberta's health service said the emergency response lasted for 10 hours, and involved 22 ambulances and eight aircraft.\nOngoing care for the injured is expected to be \"intensive\", a statement continued.\nA stream of ambulances were seen arriving at the hospital and one doctor told Canadian public broadcaster CBC that the facility had been \"completely overwhelmed\" by the number of patients.\nWhere is the base?\nCanadian Forces Base Wainwright is located in a rural area of the western province of Alberta - around 120 miles (193km) from Edmonton and 180 miles (290km) from Calgary, the province's two largest cities.\nIt is one of Canadian Army's busiest military training bases and its airfield is also used by the Royal Canadian Air Force.\nIt population fluctuates but more than 1,000 people can be based there at any given time.",
    "bodyJa": "What we know so far about deadly fire at Canadian military base\n- Published\nA huge fire swept through a Canadian military base on Saturday, killing at least four people and seriously injuring dozens more.\nPrime Minister Mark Carney described it as one of the worst peace time tragedies on Canadian soil in the history of the military.\nHere is what we know about the deadly incident so far.\nHow did the fire start?\nFew details about what triggered the deadly fire at Canadian Forces Base Wainwright, which broke out at around 16:00 local time (22:00 GMT), have been confirmed by authorities so far.\nLocal media reported it may have been started when a gas main was struck during a live firing exercise taking place on the grounds.\nCarney said a \"violent, fast-moving fire swept through the base\" without confirming what started it.\nThe Municipal District of Wainwright posted on social media that the fire had \"spread rapidly due to high winds\".\nThe prime minister said military and civilian fire crews \"fought this fire throughout the night in some of the worst conditions imaginable, risking their lives to protect their fellow Canadians\".\nThe Canadian defence ministry has said the cause remains under investigation, and \"at this time, there are no indications that it was the result of any terrorist activity\".\nIt has not been confirmed if those injured were on the base's sprawling ranges where exercises are carried out, or whether the fire spread to living quarters.\nHow many people have been killed?\nFour service members are confirmed to have died, Carney said on Sunday.\nHe also said \"dozens\" had been \"seriously wounded\", without providing further information on their conditions.\nPrior to Carney addressing the nation, Canadian media reported the death toll as seven citing unnamed military sources.\nThe prime minister did not indicate whether or not the government expects the death toll to rise.\nThe names of those who lost their lives have not been identified but their families have been informed.\nOn Saturday evening, Royal Alexandra Hospital in Edmonton declared a code orange - a disaster response protocol for a high-casualty incident. It was stood down on Sunday afternoon.\nAlberta's health service said the emergency response lasted for 10 hours, and involved 22 ambulances and eight aircraft.\nOngoing care for the injured is expected to be \"intensive\", a statement continued.\nA stream of ambulances were seen arriving at the hospital and one doctor told Canadian public broadcaster CBC that the facility had been \"completely overwhelmed\" by the number of patients.\nWhere is the base?\nCanadian Forces Base Wainwright is located in a rural area of the western province of Alberta - around 120 miles (193km) from Edmonton and 180 miles (290km) from Calgary, the province's two largest cities.\nIt is one of Canadian Army's busiest military training bases and its airfield is also used by the Royal Canadian Air Force.\nIt population fluctuates but more than 1,000 people can be based there at any given time.",

    "titleJa": "Microsoft pulls out of UK's largest AI data centre",
    "summaryJa": "Microsoft pulls out of UK's largest AI data centre- Published",
    "bodyOriginal": "Microsoft pulls out of UK's largest AI data centre\n- Published\nA tech company has said it still plans to build the UK's largest AI data centre despite Microsoft pulling out of the project.\nNscale announced last year it had pledged £2bn to build and open a pioneering facility in Loughton, Essex.\nHowever, the BBC understands that Microsoft, which said it would fund a supercomputer at the site, has terminated its involvement.\nA spokesperson for Nscale said it was exploring alternative power sources and its relationship with Microsoft remained strong for their other projects together overseas. Microsoft declined to comment.\n\"We remain committed to both the Loughton project and the UK and we are exploring alternative power sources for the site, in addition to other expansion sites in the UK,\" Nscale said.\n\"Our relationship with Microsoft remains strong and long-term.\"\nWhat is the new AI supercomputer planned for Essex?\n- Published18 September 2025\nThe data centre was due to receive its power supply at the end of the year.\nBut as first reported by the Telegraph on Sunday, external, Nscale has been told this will not happen until the 2030s.\n\"This unfortunate London-wide grid issue has no impact on our other contracts,\" Nscale told the BBC.\nNscale and Microsoft are still working together on projects in Norway, Portugal and the United States.\nThe Loughton site is expected to create 250 permanent jobs when it eventually opens.\nOnly last month, Microsoft announced that some of the $30bn (£22bn) it was investing in the UK would be used to fund the Loughton supercomputer.\nDo you have a story suggestion for Essex? Contact us below.\nGet in touch\nYour Voice\nFollow Essex news on BBC Sounds, Facebook, external, Instagram, external and X, external.\nRelated topics\n- Published17 September 2025\n- Published16 January 2025",

    "id": "oil-facilities-hit-in-deadly-overnight-a-c2f7e73d",
    "title": "Oil facilities hit in deadly overnight attack on St Petersburg",
    "titleJa": "Oil facilities hit in deadly overnight attack on St Petersburg",
    "summaryJa": "At least one person was killed in the strikes, which also hit a data centre used by Russia's equivalent of Facebook.",
    "bodyOriginal": "Oil facilities hit in deadly overnight attack on St Petersburg\n- Published\nAt least one person has been killed in an overnight attack on St Petersburg that successfully targeted two of the city's oil facilities.\nThe region's Governor Alexander Beglov said fires were being extinguished at the St Petersburg Oil Terminal and the Ruchyi oil depot following the attack, which also injured at least five.\nA logistics centre belonging to Ozon - known as Russia's Amazon - and a data centre belonging to Facebook equivalent VKontakte were also hit.\nKyiv has not yet commented on the strikes. Ukrainian President Volodymyr Zelensky said on Saturday morning that Russia had targeted his country's energy sector 76 times since Donald Trump declared an \"energy ceasefire\" last week.\nUkraine had paused its strikes on Russian oil facilities - which it says are to limit the main revenue stream for Moscow's war effort - for three days after the announcement, while accusing Russia of continuing.\nIt then resumed strikes earlier this week, drawing the ire of Trump, who called for a truce to facilitate a deal he struck with his Russian counterpart Vladimir Putin to supply diesel.\nUkraine has struck St Petersburg before, though regions closer to Ukraine are threatened more often. The city's oil terminal was last hit in July.\nRussia's defence ministry said it had shot down more than 1,000 Ukrainian drones over Russian territory overnight into Sunday.\nSt Petersburg's governor said 12 apartment buildings and two homes were damaged in the attacks on the city, while Pulkovo Airport was temporarily closed.\nHe also said mobile internet service disruption was possible.\nSocial network VK confirmed a drone had targeted its regional data centre, but stressed its services were available \"as usual\" after users reported outages in the early hours of the morning.\nOzon also confirmed its local logistics centre had been targeted by a drone, sparking a fire.\nIt said staff were evacuated and no one was injured, and that it was not accepting shipments from sellers at the location \"as it is currently serving other operational purposes\".\nAs well as numerous oil facilities across Russia, Ukraine has also mounted strikes aimed at disrupting the Russian economy more broadly. Earlier this month, it launched a series of attacks on Yandex, Russia's largest search engine, that led to service disruptions.\nRelations between Washington and Kyiv have frayed since the US struck a controversial deal to import Russian diesel in the hope of bringing down US energy prices, which have skyrocketed during the Iran war, ahead of the midterm elections.\nZelensky suggested the deal was tantamount to the US investing in Russia's war effort.\nTrump's decision to temporarily suspend a raft of sanctions against Russia has brought fresh criticism, including from some US Republicans.\nHowever, on Sunday, Zelensky said on Telegram he had had conversations with Trump's top negotiators Steve Witkoff and Jared Kushner.\nHe said their teams are in constant communication and preparing the next diplomatic steps.\nBoth Russia and Ukraine have been striking one another's energy infrastructure with increasing intensity ahead of the winter, as Moscow's full-scale invasion drags on in its fifth year.\nRussia says it hits targets used by Ukraine's military, though the UN noted on Friday that the first two weeks of October had been the deadliest for Ukrainian civilians in years.\nRussian strikes on energy facilities have left hundreds of thousands without power, raising concerns about civilians enduring another freezing winter.\nZelensky said on Saturday that tens of thousands of people were still without power. Russia launched nearly 2,700 drones, 1,700 aerial bombs and 66 missiles in the past week, most of which were aimed at energy facilities, he said.\nRelated topics\n- Published4 July",

cuated and no one was injured, and that it was not accepting shipments from sellers at the location \"as it is currently serving other operational purposes\".\nAs well as numerous oil facilities across Russia, Ukraine has also mounted strikes aimed at disrupting the Russian economy more broadly. Earlier this month, it launched a series of attacks on Yandex, Russia's largest search engine, that led to service disruptions.\nRelations between Washington and Kyiv have frayed since the US struck a controversial deal to import Russian diesel in the hope of bringing down US energy prices, which have skyrocketed during the Iran war, ahead of the midterm elections.\nZelensky suggested the deal was tantamount to the US investing in Russia's war effort.\nTrump's decision to temporarily suspend a raft of sanctions against Russia has brought fresh criticism, including from some US Republicans.\nHowever, on Sunday, Zelensky said on Telegram he had had conversations with Trump's top negotiators Steve Witkoff and Jared Kushner.\nHe said their teams are in constant communication and preparing the next diplomatic steps.\nBoth Russia and Ukraine have been striking one another's energy infrastructure with increasing intensity ahead of the winter, as Moscow's full-scale invasion drags on in its fifth year.\nRussia says it hits targets used by Ukraine's military, though the UN noted on Friday that the first two weeks of October had been the deadliest for Ukrainian civilians in years.\nRussian strikes on energy facilities have left hundreds of thousands without power, raising concerns about civilians enduring another freezing winter.\nZelensky said on Saturday that tens of thousands of people were still without power. Russia launched nearly 2,700 drones, 1,700 aerial bombs and 66 missiles in the past week, most of which were aimed at energy facilities, he said.\nRelated topics\n- Published4 July",

  {
    "id": "bessent-warns-zelenskyy-to-be-very-caref-bad6da9a",
    "title": "Bessent warns Zelenskyy to 'be very careful' about claims U.S. is throttling Starlink",
    "titleJa": "Bessent warns Zelenskyy to 'be very careful' about claims U.S. is throttling Starlink",
    "summaryJa": "Starlink, high-speed satellite internet provided by Elon Musk's SpaceX, is critical to Ukraine's defense.",
    "bodyOriginal": "U.S. Treasury Secretary Scott Bessent on Sunday warned Ukrainian President Volodymyr Zelenskyy to \"be careful\" in public statements about U.S. support for Ukraine.\nU.S.-provided Starlink internet recently slowed in Ukraine, hindering the war-torn country's ability to respond to Russian assaults. Ukraine uses Starshield, the military and government-controlled version of the commercial Starlink, to conduct military operations.\nIn an earlier interview on NBC's \"Meet the Press,\" Zelenskyy said he believed the U.S. government was responsible for the slowdown, and that Ukraine was \"blocked\" from U.S. intelligence for a period of time.\nBessent cautioned Zelenskyy about making those claims.\n\"President [Donald] Trump and Secretary [Marco] Rubio have categorically said that no one under the Trump administration did that, and I think it is very reckless for President Zelenskyy to make such a charge,\" Bessent said on \"Meet the Press.\"\n\"President Zelenskyy should be very careful about making statements like this that aren't true,\" he added.\nStarlink, high-speed satellite internet provided by Elon Musk's SpaceX, is critical to Ukraine's defense. Musk himself said in a post on X last week that the U.S. government and President Donald Trump are \"ultimately\" responsible for any slowdowns to the military version of Starlink known as Starshield.\n\"Starshield systems are owned and controlled by the US government,\" Musk wrote. \"Any limits on speed or usage are decided by the US military and ultimately POTUS.\"\nTrump has denied responsibility for the slowdown.\n\"Well, I don't know if it was anybody because it wasn't me, and I don't think it was Elon,\" the president said last week. \"And from what I understand, it's the same as it's always been.\"\nThe U.S. relationship with Ukraine has been highly scrutinized throughout Trump's second term, as he has frequently antagonized the war-torn country while pushing for a peace deal.\nTrump has recently expressed frustration over Ukrainian strikes on Russian oil refineries as he faces pressure from voters over sky-high gasoline and diesel prices ahead of the U.S. midterm elections. The president has even personally blamed Zelenskyy for the rise in energy prices: \"He wants to make problems for the world. He wants to make problems for our farmers, our ranchers, with diesel fuel,\" Trump said.\nSoaring energy prices are largely due to the U.S. war with Iran, which severely disrupted the Strait of Hormuz and choked oil shipments from the Persian Gulf. The national average for a gallon of gas in the U.S. was nearly $4.30 on Sunday, according to AAA. Diesel was roughly $6.32 per gallon, about 20 cents off September's record high.\nTrump has tried to offset the energy pinch by importing Russian diesel. In a post on Truth Social earlier in the month, he said: \"Diesel Prices for Americans and, indeed, the World, will be COMING DOWN, IN RECORD NUMBERS, AND FAST!\"\nMany U.S. lawmakers, including Republicans, have condemned the president's plan to buy Russian diesel. Congress recently sent Trump an overwhelmingly bipartisan sanctions package aimed at crippling Russia's energy industry. Trump signed the bill into law, but waived portions of it over the weekend, citing the national interest in an explanation to Congress.\n\"Beyond irresponsible. What part of enforcing a law passed 86-11 by the Senate does the President and his advisors not understand?\" Sen. Thom Tillis, R-N.C., said in a post on X. \"It's unconscionable that this administration is capitulating to a Russian dictator who illegally invaded Ukraine and butchers innocent civilians every single day.\"\nThis story is developing. Please check back for updates.",

pressed frustration over Ukrainian strikes on Russian oil refineries as he faces pressure from voters over sky-high gasoline and diesel prices ahead of the U.S. midterm elections. The president has even personally blamed Zelenskyy for the rise in energy prices: \"He wants to make problems for the world. He wants to make problems for our farmers, our ranchers, with diesel fuel,\" Trump said.\nSoaring energy prices are largely due to the U.S. war with Iran, which severely disrupted the Strait of Hormuz and choked oil shipments from the Persian Gulf. The national average for a gallon of gas in the U.S. was nearly $4.30 on Sunday, according to AAA. Diesel was roughly $6.32 per gallon, about 20 cents off September's record high.\nTrump has tried to offset the energy pinch by importing Russian diesel. In a post on Truth Social earlier in the month, he said: \"Diesel Prices for Americans and, indeed, the World, will be COMING DOWN, IN RECORD NUMBERS, AND FAST!\"\nMany U.S. lawmakers, including Republicans, have condemned the president's plan to buy Russian diesel. Congress recently sent Trump an overwhelmingly bipartisan sanctions package aimed at crippling Russia's energy industry. Trump signed the bill into law, but waived portions of it over the weekend, citing the national interest in an explanation to Congress.\n\"Beyond irresponsible. What part of enforcing a law passed 86-11 by the Senate does the President and his advisors not understand?\" Sen. Thom Tillis, R-N.C., said in a post on X. \"It's unconscionable that this administration is capitulating to a Russian dictator who illegally invaded Ukraine and butchers innocent civilians every single day.\"\nThis story is developing. Please check back for updates.",

    "title": "Iran says it has a 'new operational plan' if the U.S. resumes attacks, as shipping vessels report strikes",
    "titleJa": "Iran says it has a 'new operational plan' if the U.S. resumes attacks, as shipping vessels report strikes",
    "summaryJa": "Mohsen Rezaei, secretary of Iran's Supreme National Security Council, said the country's military has prepared a response to any new attacks.",
    "bodyOriginal": "A senior Iranian security official warned Sunday that Tehran has prepared a new response plan for any renewed U.S.-Israeli attack, as maritime authorities reported several separate attacks on commercial vessels around the Arabian Peninsula.\n\"Iran's armed forces have prepared a response to any new act of adventurism that would be far more devastating than the 12-day and 40-day wars,\" Mohsen Rezaei, secretary of Iran's Supreme National Security Council, said in a post on X, referring to attacks by Israel in June 2025, and the conflict triggered by the U.S. and Israel in February.\n\"Iran's new operational plan will not follow the rules with which they are familiar,\" Rezaei said in comments translated by Google.\nPresident Donald Trump said last week that he does not intend to use nuclear weapons against Iran or foresee deploying ground troops in the country.\nSpeaking in an interview with Newsmax, broadcast Thursday evening, he said: \"I wouldn't use nuclear. We don't have to. We're the greatest nuclear power in the world.\"\nThe right-wing cable outlet asked Trump about reports that Washington was considering using the GBU-43/B Massive Ordnance Air Blast, or MOAB, widely known as the \"Mother of All Bombs.\"\nIranian state media agency IRNA quoted Foreign Minister Abbas Araghchi as saying that while Iran would not surrender its sovereign rights under pressure, it remains ready for dialogue.\nVessels under fire\nMeanwhile, shipping vessels operating in waters around the Arabian Peninsula reported coming under fire in recent days.\nThe British Navy-affiliated UK Maritime Trade Operations (UKMTO) said a tug traveling south northeast of the United Arab Emirates was hit by two unknown projectiles on Sunday.\nOn Saturday, a master of a liquefied natural gas tanker southwest of Yemen reported \"being approached by a small skiff with seven persons onboard,\" UKMTO said. The skiff fired twice, and the tanker's security team responded with two warning shots, it said.\nAnother tanker northeast of Saudi Arabia reported being hit by a rocket-propelled grenade fired from a small boat on Friday.\nCrude oil prices rose sharply Friday amid rising tensions in the Middle East, while Ukraine vowed to keep striking Russian refineries.\nBrent futures hit a session high of $110 per barrel for the first time since May before easing slightly to settle at $109.86, a 3.7% gain.\nU.S. West Texas Intermediate rose 3.5% to settle at $101.41 per barrel. WTI added more than 10% last week while Brent advanced nearly 5%.\nSaudi Arabia intercepted several missiles fired over the Red Sea on Friday, including one that was heading toward the oil export terminal Yanbu, a military spokesman said. Three drones were also destroyed in the kingdom's Riyadh and southern regions, the military said.\nIran-allied Houthi militants in Yemen repeatedly fired at Saudi Arabia last week. The kingdom's energy ministry said oil giant Aramco came under attack when militants hit one of its administrative buildings in Dhahran on Tuesday.",

 it said.\nAnother tanker northeast of Saudi Arabia reported being hit by a rocket-propelled grenade fired from a small boat on Friday.\nCrude oil prices rose sharply Friday amid rising tensions in the Middle East, while Ukraine vowed to keep striking Russian refineries.\nBrent futures hit a session high of $110 per barrel for the first time since May before easing slightly to settle at $109.86, a 3.7% gain.\nU.S. West Texas Intermediate rose 3.5% to settle at $101.41 per barrel. WTI added more than 10% last week while Brent advanced nearly 5%.\nSaudi Arabia intercepted several missiles fired over the Red Sea on Friday, including one that was heading toward the oil export terminal Yanbu, a military spokesman said. Three drones were also destroyed in the kingdom's Riyadh and southern regions, the military said.\nIran-allied Houthi militants in Yemen repeatedly fired at Saudi Arabia last week. The kingdom's energy ministry said oil giant Aramco came under attack when militants hit one of its administrative buildings in Dhahran on Tuesday.",
