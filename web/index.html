    "bodyOriginal": "'We screwed up': Doordash admits underpaying New York workers\n- Published\nDoorDash has agreed to pay a $131.5m (£99m) settlement to New York City regulators after the food delivery giant admitted failing to compensate thousands of workers correctly or on time.\n\"Simply put, we screwed up,\" DoorDash said. \"Our mistakes meant some Dashers were underpaid or paid late.\"\nThe agreement with the Department of Consumer and Worker Protection follows a city investigation into wage violations, with a significant share of the payout addressing how DoorDash calculates compensation for the time delivery drivers spend waiting for orders.\nThe settlement marks another chapter in an ongoing battle between so-called gig economy platforms and municipal leaders.\nThe likes of Uber Eats and Grubhub have repeatedly clashed with city officials over tipping laws, minimum wages and data-sharing requirements.\nSan Francisco-based DoorDash blamed \"complex\" changes to the minimum wage in New York state introduced in 2023.\nUnder the landmark minimum pay standard for app-based delivery workers, wages differ depending on the county, tipping and how many people work for the employer.\nDoorDash also cited technical glitches and multi-stop delivery routes for causing the firm to underpay workers or delay wages.\nThe company said: \"While these mistakes weren't intentional, that doesn't make them okay.\"\nDoorDash said local workers earn roughly $30 per active hour on average. It said it has now patched the software bugs responsible for the mistakes.\nThe business said the errors hit roughly 264,000 workers, though it insisted the issues affected under 1% of overall local transactions.\nSystemic errors caused around $6.6m wages to never reach workers at all, and another $5.7m arrived days or weeks late.",

    "id": "trump-slams-iran-and-cuba-defends-ai-gro-8f5f482e",
    "title": "Trump slams Iran and Cuba, defends AI growth and recounts record in UN speech",
    "titleJa": "Trump slams Iran and Cuba, defends AI growth and recounts record in UN speech",
    "summaryJa": "The U.S. \"will no longer permit threats to America to gain a foothold anywhere in the Western Hemisphere,\" Trump told the UN leaders.",
    "bodyOriginal": "President Donald Trump on Tuesday focused on a wide range of threats the U.S. faces from abroad during a frequently boastful address to the United Nations General Assembly in Manhattan.\nTrump, in a roughly 37-minute speech, also directly criticized the UN itself, and reaffirmed his view that the U.S. artificial intelligence industry should continue its rapid growth with few restraints or guardrails.\nTrump defended his decision to launch a war against Iran, accusing the Islamic Republic of seeking to erect a defensive missile arsenal before making a \"mad dash to a nuclear bomb.\"\nAs the war approaches its eighth month with no clear end in sight, Trump said he is poised to make a \"big decision\" on whether to make a deal or quickly \"annihilate\" the country.\nHe then predicted once again that a deal will be made \"right after\" the Nov. 3 midterm elections, claiming \"it doesn't make sense for them not to.\"\n\"They're waiting to see how I do in the midterm election,\" he said. \"What they don't realize is that I'm not running.\"\n\"I gave absolutely no credence and will not give credence to the election when it comes to Iran. It doesn't even enter my mind. The only thing that does is that Iran will never have a nuclear weapon,\" Trump said.\nHe also touted a military deal with Greenland and Denmark, saying it gives the U.S. \"the complete ability to do what is necessary to defend the American continent, and also Europe and other places.\" That agreement was signed at a trilateral meeting later Tuesday morning.\nTrump called Cuba an \"absolutely failed state\" and accused it of \"coordinating with left-wing radicals and Communist networks\" in the U.S.\n\"Communism will never be coming to America, but freedom will be coming to Cuba,\" Trump told the assembled leaders. He said Secretary of State Marco Rubio is in negotiations with the island nation.\nAs he spoke, the Cuban delegation stood up and left the hall.\n\"The United States will no longer permit threats to America to gain a foothold anywhere in the Western Hemisphere,\" Trump said, pointing to his administration's intervention in Venezuela this year as proof.\n\"And if necessary, we will use our unmatched military might to secure the vital national interests of the United States,\" he said.\nToward the end of the speech, Trump turned to AI — first by debuting his attempt to rebrand it \"super intelligence\" and also whipsawing on the U.S. government's role in putting guardrails on the technology.\nThe president then compared those raising concerns about AI — a group that includes some tech leaders — with those warning about climate change, which Trump also denies is a problem.\n\"These are the same people that are now saying that AI is going to kill us all, that robots are going to attack us, and that everything is going to be a total disaster,\" Trump said.\nHe reiterated his view that winning the race for AI superiority is the key to U.S. global dominance.\n\"That's the group that wins, and we're leading now over China by a lot, and everyone else, and we're going to keep it that way,\" he said. \"We're going to keep it very, very straight and very strong. I'm not going to stifle growth of something that will be bigger than the industrial revolution.\"\nThe government will \"rein things in\" if needed and will lead the sector \"safely and responsibly,\" Trump said.\nBut he also said, \"We will only encourage superintelligence. We're going to encourage it, not rein it in.\"",

    "id": "davey-promises-tax-cuts-for-millions-if-494b2550",
    "title": "Davey promises tax cuts for millions if UK rejoins EU single market",
    "titleJa": "Davey promises tax cuts for millions if UK rejoins EU single market",
    "summaryJa": "The Lib Dem leader vows to raise tax thresholds if he becomes PM, in a speech to his party conference.",
    "bodyOriginal": "Davey promises tax cuts for millions if UK rejoins EU single market\n- Published\nThe Liberal Democrats will fight the next general election on a promise to cut taxes for millions of workers, Sir Ed Davey has said in a speech to his party conference.\nThe Lib Dem leader said that if he gained power, he would raise the annual tax-free personal allowance to £15,000.\nHe would also raise the 40p income tax threshold from £50,270 to £56,000, in a £17bn package funded by the economic boost he says would come from the UK rejoining the EU single market and customs union.\nHe claimed the plan would mean a £680 cut for \"most taxpayers\" but it would not come into full effect until the fifth year of a Lib Dem government - potentially up to eight years away.\nThe announcement was greeted with sustained applause by Lib Dem MPs and activists in the Brighton conference centre.\nThe £12,570 income tax allowance was frozen by the Conservatives in 2021, resulting in more people being dragged into paying the tax, and Labour has so far resisted calls from trade unions and some of its MPs to unfreeze it.\nThe Lib Dems said they would raise the threshold to £15,000 a year, and increase the starting point for paying employee National Insurance (NI) to the same level.\nAt their conference earlier this month, Reform UK promised to increase the income tax personal allowance to £15,000 within 100 days if they won power.\nSir Ed told the Lib Dem faithful \"the difference between us and Reform\" is that \"their tax cut is paid for through cruelty.\"\nHe said \"Reform's figures show they'd pay for it by ripping £22bn of crucial support away from disabled people.\"\nUnder the Lib Dem plan, based on research by think tank Frontier Economics, external, the economic boost from rejoining the single market would allow the party to spend £17bn on tax cuts by the end of the next Parliament.\nThe party says it would unfreeze personal allowances in the second year of a Lib Dem government, allowing them to rise with inflation, before bringing in big tax cuts in year five when the economic benefits of closer trading with the EU had kicked in.\nHowever, the move would depend on the party being able to negotiate a closer trading arrangement with the EU in just 12 months.\nStuart Adam, of the Institute for Fiscal Studies think tank, told BBC Verify the Lib Dem package would cost \"much more\" than the £17bn quoted by the party.\nReform has estimated that its policy, to raise the starting threshold to £15,000 just for income tax, would cost £21bn by the fifth year.\nThe Lib Dems say their policy would be funded by an extra £27bn from its plans for a \"growth and defence pact\" with the EU.\n'British values'\nSir Ed has been under pressure this week to set out bolder policies, with his party languishing in fourth or fifth place in national opinion polls.\nHe began his speech with a sombre and punchy attack on Reform UK leader Nigel Farage.\nHe stopped short of calling Reform fascists, but drew a link between the fascists in Britain in the 1930s with what he called \"thugs, in black shirts and balaclavas\" in reference to the protests in Dover and Portsmouth in recent weeks.\n\"This is a far-right movement that is given oxygen, and heat, and fuel by politicians and parties who claim to be serious contenders to lead our country,\" said the Lib Dem leader.\nThe solution, he said, was \"community politics\" that he argued was the hallmark of the Lib Dems.\n\"It will take more than a manifesto. It will take a movement, rooted in decency, fairness and community. British values. Liberal values,\" he said.\nRepositioning the Lib Dems as a tax cutting party is aimed at appealing to voters they are targeting in traditional Tory heartlands.\nAnd Sir Ed used his speech to attack Tory leader Kemi Badenoch over her policy shifts on climate change and human rights law.\n\"Millions of decent, moderate Conservative voters are getting her message, and they're turning away – increasingly, to us,\" he told the audience in Brighton.\nHe took a swipe at Prime Minister Andy Burnham for failing to commit to rejoining the EU single market, something the Lib Dems say they would do in their first year in government.\nLib Dem sources refused to say whether the income tax plan would be a condition of joining a coalition government with Labour or another party, saying the party's aim was to get as many MPs as possible.\nSir Ed has ruled out a coalition with Reform UK, and dismissed suggestions he could do a deal with the Conservatives, as his party did in 2010.\nThe Lib Dem leader also addressed the potential threat posed by AI in his speech, saying that \"handled badly, it concentrates more power in fewer hands than at any point in human history.\"\nHe said Burnham's AI partnership with US president Donald Trump \"doesn't come close to meeting the scale of this threat\" and called for \"a global treaty to press pause on super-intelligent AI now\".\nHe proposed \"a new International AI Safety Agency - like we have for nuclear - to stop anyone from developing this technology recklessly.\"\nAdditional reporting: Alice Aitken\nLib Dems vow to end 'computer says no' economy to boost growth\n- Published2 days ago\nLib Dems sleepwalking to irrelevance under Davey, says council leader\n- Published2 days ago\nLib Dems call for one-to-one midwife care during childbirth\n- Published1 day ago\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.",

    "id": "sullivan-wall-street-admits-it-doesn-t-k-f86209ad",
    "title": "Sullivan: Wall Street admits it doesn't know where oil is headed. There's one stock they do agree on",
    "titleJa": "Sullivan: Wall Street admits it doesn't know where oil is headed. There's one stock they do agree on",
    "summaryJa": "JPMorgan’s commodity team admitted what many are thinking on the Iran situation and oil: We just don't know.",
    "bodyOriginal": "POWER POINT\nWhat I'm hearing from energy insiders\n\"I don't know.\"\nThe three hardest words for anyone on Wall Street to utter. Knowing things — or at least knowing enough to make a solid estimate — is one of Wall Street's core jobs. Analysts, bankers and traders have access to the best information and systems. They are paid very handsomely to know more than we do.\nSo it's refreshingly honest to hear someone on Wall Street admit they don't know. Which is exactly what the team at JPMorgan just did. They write:\n\"For the first time since the start of the Iran conflict, we don't have a baseline view. We simply don't know how to model the endgame. At the onset, we thought we did. We assumed there were economic red lines the U.S. administration would be unwilling to cross: $100 oil, gasoline near $5 a gallon, 4% headline inflation or a 5-handle on the 10-year Treasury yield. Those constraints gave us an implicit timeline, and we expected that by June there would be some form of agreement to reopen the Strait.\"\nNatasha Kaneva and her team continue:\n\"Six months later, many of those lines have been crossed, yet the exit strategy is less clear, not more. Oil is above $100 and the 10-year yield has a 5-handle. Gasoline, at $4.37, remains at record seasonally adjusted levels even though peak driving season is behind us. More concerning, diesel is at an all-time high of $6.31 a gallon heading into winter — the period of peak seasonal demand — while inventories sit at all-time lows.\"\nThis is one of the best and most useful research pieces I've read in years. That may sound counterintuitive, but let's be direct with each other: no one really knows what is going to happen or how this is all going to play out. No one.\nI'm sorry if that's not useful. We in the media and broadcast business also like to be sure of things. It's not in our best interest to say, \"We don't know,\" but sometimes we just have to admit it. This is one of those times. In fact, there are only four things I am relatively certain about right now.\nOne: nobody knows how this plays out. Kaneva is correct. It has now been six months since the Iran war/conflict began. It could be another six months before it is over. Or it could be six days, or six weeks. Or maybe it is never really \"over\" and simply burns out and slowly fades away. Or it could escalate dramatically.\nPresident Trump has said that oil and gasoline prices will not fall until after the November 3 elections in America. What exactly did he mean by that? Why would those elections — which will determine the balance of power in Congress —matter to Iran? We don't know for sure, but some sources I speak with believe that, after those elections are over, Trump will feel free to become hyper-aggressive, potentially destroying or taking control of Iranian oil and energy assets. If so, that would spike prices in the short term, but the market would anticipate higher oil exports later, bringing prices down. That may sound odd, but it's what some of my smarter sources are whispering about.\nTwo: this could go on longer than many think. Yes, Iran is suffering. Its economy is hurting, its currency is collapsing and whatever news we get from inside the closed kingdom implies tough times. But historically, Iran has a way of toughing through things and figuring out workarounds, like ship-to-ship oil transfers—a \"trick\" the U.S. has adopted.\nThree: the market really, really wants oil prices to go lower. Oil futures are hovering right around $100, and the cost to buy an actual barrel of oil in the Middle East is much higher than that. But oil is not at $125, $150 or more, despite many very smart people making a good argument that it should be.\nI mean, Saudi Arabia's massive East-West pipeline was hit in a drone attack. Oil is flowing through Hormuz, but at levels far below where they were when the war began. So why isn't oil higher? It sure seems that \"the market\" wants to push it lower. Whether that's because of demand destruction, a belief that this \"ends\" sooner rather than later, Saudi engineers getting the East-West pipeline back up and running soon, higher actual flows than are being recorded, or some combination of all those things — who knows? Oil could easily be at $150 per barrel. But it's not. That should tell you something.\nFour: Russia may be more important to global markets than Iran right now. Oil is a problem, but diesel fuel prices and supply are a more immediate threat. Russia is a massive refiner of diesel fuel. Ukraine has been systematically bombing some of those refineries, severely curtailing the global supply of diesel fuel. This has sent nominal diesel prices to record highs, though it has been higher when adjusted for inflation. In some areas of Europe, diesel fuel is over $10 per gallon and moving higher. The world runs on Rudolf Diesel's invention, and it's possible some areas won't be running much longer if prices keep going up and supply keeps going down.\nInsider take → Next week's Power Insider will dive deeper into Europe's natural gas woes. You can get a sneak peek below in this week's Inside Line interview with the co-founder of Venture Global.\nFour things I'm certain of. At least, I'm pretty sure I am. Maybe. These days, certainty is a rare commodity, and history has shown that anything having to do with Iran is often far from certain.\nSee you Monday through Friday at 2 p.m. ET on CNBC's Power Lunch!\nThanks for reading,\nBrian\nWALL STREET'S TAKE\nWhile parts of Wall Street struggle to figure out what's going to happen around Iran, oil and energy, stock analysts were busy making calls this week.\nThe biggest stock getting some analyst love is Chevron (CVX). Goldman Sachs reiterates a buy rating and raises its 12-month target by $15 to $240. Venezuela — which we wrote about extensively last week — plays a role here. The Goldman team notes that Venezuelan production is expected to double to about 600,000 b/d by 2031. The firm is also bullish on Chevron's power generation opportunities. The $240 target is above Wall Street's median target of $223 and about 17% where the stock is trading today.\nAlso watch BP (BP). The British energy giant continues to evolve, and Evercore ISI is here for it. The firm added BP to its Tactical Outperform list, though keeping its $52 the same. Analyst Stephen Richardson notes that BP's balance sheet \"promises to be one of the most transformed\" in the second half of this year. He likes the commodity \"tailwind\" and that BP is cutting debt levels to narrow the \"valuation gap.\" BP may be the most interesting company and stock to watch in 'big oil' over the next 12 months. After aggressively pivoting away from oil and gas, the company is now aggressively pivoting back toward oil and gas. It has a new(ish) CEO in Meg O'Neill, who is likely to keep driving BP back toward its core competencies in energy. Watch this space (and watch the stock!).\nThe calls are also coming on smaller cap stocks. Truist is bullish Crescent Energy (CRGY). It's got a buy rating and $19 target. Crescent is an oil producer that Truist analyst Gabe Daoud likes because it trades at an earnings discount to its peers. The firm adds that Crescent is doing \"more with less rock\" and has a nice free cash flow yield to its enterprise value. The $4.5 billion company operates mostly in the Permian Basin and Eagle Ford Shale regions of Texas. Truist's $19 target is high relative to Wall Street's median target of $17.44, though research firm Stephens takes the top spot with its $21 price for CRGY. The stock is trading around $13 currently.\nThe big macro stock story right now remains around refiners. They moved lower to start the week as oil fell, but otherwise have been hitting new highs nearly every day. Valero (VLO), HF Sinclair (DINO), and Marathon Petroleum (MPC) just hit new highs last week, while Phillips 66 (PSX), Par Pacific (PARR), PBF Energy (PBF) and Delek (DK) also remain close to record highs. They are benefitting from the jump in crack spreads. The EIA helpfully defines the term as the difference between the price of oil and the price of refined products, and notes that it helps determine the \"relative value\" of those products. Investors have figured out that the real value may be the earnings of these companies, bidding up the stocks massively in the last few months.\nThat said, caveat emptor around the crack spread! With the exception of Delek and Par Pacific, the refining stocks are all above their Wall Street price target.\nThe big question mark around these companies is whether the White House pushes through a ban or restriction on diesel fuel exports. As Citigroup notes, calls for restrictions are \"intensifying,\" and the firm says that if a complete ban were enacted, refineries would \"likely reduce throughput in response to sharply lower margins, which would have a cascading impact on the price of gasoline and jet fuel\" … but, worse, if a complete ban on exports were to happen, it would likely \"spell the end to [the] historical run in refining margins and share prices.\"\nIn other words - if you own any of the stocks below, pay close attention to any headlines around a possible diesel fuel export ban.\nMy take → Industry contacts all whisper to me that a diesel ban would ultimately have the opposite intended impact on higher prices as refiners cut their output to manage storage levels. Diesel fuel isn't like other products that can be easily rerouted; the distribution systems are locked in. That's the industry view anyway, and you can believe it or not … but it's a battle going on behind the scenes.\nTAKE A LOOK\nIt's not just about the price of oil itself. It's about getting oil from where it's produced to where it needs to go. That price is soaring. So much so that you almost can't even believe how much shipping costs have gone up. Well, believe it. And here it is.\nINSIDE LINE\nThis week's Inside Line is with Venture Global CEO Mike Sabel. We discuss the company's new China Gas deal, rising demand for U.S. LNG and the impact of Middle East disruptions.\nLOOKING FOR MORE?\nCatch up with more on energy including interviews and video content from CNBC and Power Insider.\nRead the last issue of Power Insider here.",
    "bodyJa": "POWER POINT\nWhat I'm hearing from energy insiders\n\"I don't know.\"\nThe three hardest words for anyone on Wall Street to utter. Knowing things — or at least knowing enough to make a solid estimate — is one of Wall Street's core jobs. Analysts, bankers and traders have access to the best information and systems. They are paid very handsomely to know more than we do.\nSo it's refreshingly honest to hear someone on Wall Street admit they don't know. Which is exactly what the team at JPMorgan just did. They write:\n\"For the first time since the start of the Iran conflict, we don't have a baseline view. We simply don't know how to model the endgame. At the onset, we thought we did. We assumed there were economic red lines the U.S. administration would be unwilling to cross: $100 oil, gasoline near $5 a gallon, 4% headline inflation or a 5-handle on the 10-year Treasury yield. Those constraints gave us an implicit timeline, and we expected that by June there would be some form of agreement to reopen the Strait.\"\nNatasha Kaneva and her team continue:\n\"Six months later, many of those lines have been crossed, yet the exit strategy is less clear, not more. Oil is above $100 and the 10-year yield has a 5-handle. Gasoline, at $4.37, remains at record seasonally adjusted levels even though peak driving season is behind us. More concerning, diesel is at an all-time high of $6.31 a gallon heading into winter — the period of peak seasonal demand — while inventories sit at all-time lows.\"\nThis is one of the best and most useful research pieces I've read in years. That may sound counterintuitive, but let's be direct with each other: no one really knows what is going to happen or how this is all going to play out. No one.\nI'm sorry if that's not useful. We in the media and broadcast business also like to be sure of things. It's not in our best interest to say, \"We don't know,\" but sometimes we just have to admit it. This is one of those times. In fact, there are only four things I am relatively certain about right now.\nOne: nobody knows how this plays out. Kaneva is correct. It has now been six months since the Iran war/conflict began. It could be another six months before it is over. Or it could be six days, or six weeks. Or maybe it is never really \"over\" and simply burns out and slowly fades away. Or it could escalate dramatically.\nPresident Trump has said that oil and gasoline prices will not fall until after the November 3 elections in America. What exactly did he mean by that? Why would those elections — which will determine the balance of power in Congress —matter to Iran? We don't know for sure, but some sources I speak with believe that, after those elections are over, Trump will feel free to become hyper-aggressive, potentially destroying or taking control of Iranian oil and energy assets. If so, that would spike prices in the short term, but the market would anticipate higher oil exports later, bringing prices down. That may sound odd, but it's what some of my smarter sources are whispering about.\nTwo: this could go on longer than many think. Yes, Iran is suffering. Its economy is hurting, its currency is collapsing and whatever news we get from inside the closed kingdom implies tough times. But historically, Iran has a way of toughing through things and figuring out workarounds, like ship-to-ship oil transfers—a \"trick\" the U.S. has adopted.\nThree: the market really, really wants oil prices to go lower. Oil futures are hovering right around $100, and the cost to buy an actual barrel of oil in the Middle East is much higher than that. But oil is not at $125, $150 or more, despite many very smart people making a good argument that it should be.\nI mean, Saudi Arabia's massive East-West pipeline was hit in a drone attack. Oil is flowing through Hormuz, but at levels far below where they were when the war began. So why isn't oil higher? It sure seems that \"the market\" wants to push it lower. Whether that's because of demand destruction, a belief that this \"ends\" sooner rather than later, Saudi engineers getting the East-West pipeline back up and running soon, higher actual flows than are being recorded, or some combination of all those things — who knows? Oil could easily be at $150 per barrel. But it's not. That should tell you something.\nFour: Russia may be more important to global markets than Iran right now. Oil is a problem, but diesel fuel prices and supply are a more immediate threat. Russia is a massive refiner of diesel fuel. Ukraine has been systematically bombing some of those refineries, severely curtailing the global supply of diesel fuel. This has sent nominal diesel prices to record highs, though it has been higher when adjusted for inflation. In some areas of Europe, diesel fuel is over $10 per gallon and moving higher. The world runs on Rudolf Diesel's invention, and it's possible some areas won't be running much longer if prices keep going up and supply keeps going down.\nInsider take → Next week's Power Insider will dive deeper into Europe's natural gas woes. You can get a sneak peek below in this week's Inside Line interview with the co-founder of Venture Global.\nFour things I'm certain of. At least, I'm pretty sure I am. Maybe. These days, certainty is a rare commodity, and history has shown that anything having to do with Iran is often far from certain.\nSee you Monday through Friday at 2 p.m. ET on CNBC's Power Lunch!\nThanks for reading,\nBrian\nWALL STREET'S TAKE\nWhile parts of Wall Street struggle to figure out what's going to happen around Iran, oil and energy, stock analysts were busy making calls this week.\nThe biggest stock getting some analyst love is Chevron (CVX). Goldman Sachs reiterates a buy rating and raises its 12-month target by $15 to $240. Venezuela — which we wrote about extensively last week — plays a role here. The Goldman team notes that Venezuelan production is expected to double to about 600,000 b/d by 2031. The firm is also bullish on Chevron's power generation opportunities. The $240 target is above Wall Street's median target of $223 and about 17% where the stock is trading today.\nAlso watch BP (BP). The British energy giant continues to evolve, and Evercore ISI is here for it. The firm added BP to its Tactical Outperform list, though keeping its $52 the same. Analyst Stephen Richardson notes that BP's balance sheet \"promises to be one of the most transformed\" in the second half of this year. He likes the commodity \"tailwind\" and that BP is cutting debt levels to narrow the \"valuation gap.\" BP may be the most interesting company and stock to watch in 'big oil' over the next 12 months. After aggressively pivoting away from oil and gas, the company is now aggressively pivoting back toward oil and gas. It has a new(ish) CEO in Meg O'Neill, who is likely to keep driving BP back toward its core competencies in energy. Watch this space (and watch the stock!).\nThe calls are also coming on smaller cap stocks. Truist is bullish Crescent Energy (CRGY). It's got a buy rating and $19 target. Crescent is an oil producer that Truist analyst Gabe Daoud likes because it trades at an earnings discount to its peers. The firm adds that Crescent is doing \"more with less rock\" and has a nice free cash flow yield to its enterprise value. The $4.5 billion company operates mostly in the Permian Basin and Eagle Ford Shale regions of Texas. Truist's $19 target is high relative to Wall Street's median target of $17.44, though research firm Stephens takes the top spot with its $21 price for CRGY. The stock is trading around $13 currently.\nThe big macro stock story right now remains around refiners. They moved lower to start the week as oil fell, but otherwise have been hitting new highs nearly every day. Valero (VLO), HF Sinclair (DINO), and Marathon Petroleum (MPC) just hit new highs last week, while Phillips 66 (PSX), Par Pacific (PARR), PBF Energy (PBF) and Delek (DK) also remain close to record highs. They are benefitting from the jump in crack spreads. The EIA helpfully defines the term as the difference between the price of oil and the price of refined products, and notes that it helps determine the \"relative value\" of those products. Investors have figured out that the real value may be the earnings of these companies, bidding up the stocks massively in the last few months.\nThat said, caveat emptor around the crack spread! With the exception of Delek and Par Pacific, the refining stocks are all above their Wall Street price target.\nThe big question mark around these companies is whether the White House pushes through a ban or restriction on diesel fuel exports. As Citigroup notes, calls for restrictions are \"intensifying,\" and the firm says that if a complete ban were enacted, refineries would \"likely reduce throughput in response to sharply lower margins, which would have a cascading impact on the price of gasoline and jet fuel\" … but, worse, if a complete ban on exports were to happen, it would likely \"spell the end to [the] historical run in refining margins and share prices.\"\nIn other words - if you own any of the stocks below, pay close attention to any headlines around a possible diesel fuel export ban.\nMy take → Industry contacts all whisper to me that a diesel ban would ultimately have the opposite intended impact on higher prices as refiners cut their output to manage storage levels. Diesel fuel isn't like other products that can be easily rerouted; the distribution systems are locked in. That's the industry view anyway, and you can believe it or not … but it's a battle going on behind the scenes.\nTAKE A LOOK\nIt's not just about the price of oil itself. It's about getting oil from where it's produced to where it needs to go. That price is soaring. So much so that you almost can't even believe how much shipping costs have gone up. Well, believe it. And here it is.\nINSIDE LINE\nThis week's Inside Line is with Venture Global CEO Mike Sabel. We discuss the company's new China Gas deal, rising demand for U.S. LNG and the impact of Middle East disruptions.\nLOOKING FOR MORE?\nCatch up with more on energy including interviews and video content from CNBC and Power Insider.\nRead the last issue of Power Insider here.",

    "id": "democrats-lead-the-polls-republicans-lea-f4d8d901",
    "title": "Democrats lead the polls. Republicans lead in cash heading into the midterms",
    "titleJa": "Democrats lead the polls. Republicans lead in cash heading into the midterms",
    "summaryJa": "Republicans hold a $103 million cash advantage across national party committees as the fight for control of Congress enters its final six weeks.",
    "bodyOriginal": "Republicans are entering the final sprint to the 2026 midterm election trailing Democrats in national and battleground polls and defending much of the most competitive terrain in Congress. But on one critical measure, they hold a clear advantage: cash.\nThe GOP's three national committees entered September with roughly $233.4 million in cash on hand, nearly double the $130.4 million held by their Democratic counterparts, according to a CNBC analysis of newly filed Federal Election Commission reports.\nAnd that does not include the biggest Republican-aligned war chest: President Donald Trump's MAGA Inc. super PAC, which entered September with nearly $416 million in the bank. Two Trump-linked groups, No Going Back PAC Inc. and Safety & Affordability PAC Inc., have also reserved at least $126 million in advertising, according to AdImpact data.\nThe advantage gives Republicans more flexibility to reinforce vulnerable candidates or target late-breaking races with six weeks until Election Day. Republicans are defending 16 of the 21 House races rated \"Toss Ups\" by the Cook Political Report with Amy Walter, alongside six of the nine core battleground Senate seats.\nThe sharpest disparity is between the national parties.\nThe Republican National Committee ended August with $125.6 million, according to a FEC filing. The Democratic National Committee had $16.9 million, while carrying $17.6 million in debt, according to a FEC filing. The RNC alone had more than seven times as much cash.\nParty cash also carries more weight this election cycle after the Supreme Court struck down limits in June on how much parties can spend in coordination with their candidates.\nHouse Republicans held a smaller but record advantage. The National Republican Congressional Committee had about $89.1 million, roughly $13 million more than the Democratic Congressional Campaign Committee's $75.9 million, according to FEC filings.\nThe Senate committees are the exception.\nThe Democratic Senatorial Campaign Committee entered September with $37.6 million, compared with $18.7 million for the National Republican Senatorial Committee, according to FEC filings. But the NRSC had already begun spending heavily, disbursing $50.3 million in August, including about $45.9 million in coordinated spending, which helped draw its cash down from $56.2 million at the end of July.\nGoing into the closing weeks, Republicans and their allies have about $888 million in advertising planned through Election Day, compared with roughly $666 million for Democrats and their allies, according to AdImpact.",
    "bodyJa": "Republicans are entering the final sprint to the 2026 midterm election trailing Democrats in national and battleground polls and defending much of the most competitive terrain in Congress. But on one critical measure, they hold a clear advantage: cash.\nThe GOP's three national committees entered September with roughly $233.4 million in cash on hand, nearly double the $130.4 million held by their Democratic counterparts, according to a CNBC analysis of newly filed Federal Election Commission reports.\nAnd that does not include the biggest Republican-aligned war chest: President Donald Trump's MAGA Inc. super PAC, which entered September with nearly $416 million in the bank. Two Trump-linked groups, No Going Back PAC Inc. and Safety & Affordability PAC Inc., have also reserved at least $126 million in advertising, according to AdImpact data.\nThe advantage gives Republicans more flexibility to reinforce vulnerable candidates or target late-breaking races with six weeks until Election Day. Republicans are defending 16 of the 21 House races rated \"Toss Ups\" by the Cook Political Report with Amy Walter, alongside six of the nine core battleground Senate seats.\nThe sharpest disparity is between the national parties.\nThe Republican National Committee ended August with $125.6 million, according to a FEC filing. The Democratic National Committee had $16.9 million, while carrying $17.6 million in debt, according to a FEC filing. The RNC alone had more than seven times as much cash.\nParty cash also carries more weight this election cycle after the Supreme Court struck down limits in June on how much parties can spend in coordination with their candidates.\nHouse Republicans held a smaller but record advantage. The National Republican Congressional Committee had about $89.1 million, roughly $13 million more than the Democratic Congressional Campaign Committee's $75.9 million, according to FEC filings.\nThe Senate committees are the exception.\nThe Democratic Senatorial Campaign Committee entered September with $37.6 million, compared with $18.7 million for the National Republican Senatorial Committee, according to FEC filings. But the NRSC had already begun spending heavily, disbursing $50.3 million in August, including about $45.9 million in coordinated spending, which helped draw its cash down from $56.2 million at the end of July.\nGoing into the closing weeks, Republicans and their allies have about $888 million in advertising planned through Election Day, compared with roughly $666 million for Democrats and their allies, according to AdImpact.",

    "id": "altman-and-amodei-expected-to-join-un-se-de93e0ae",
    "title": "Altman and Amodei expected to join UN Security Council meeting about AI",
    "titleJa": "Altman and Amodei expected to join UN Security Council meeting about AI",
    "summaryJa": "President Donald Trump addressed the U.N. General Assembly on Tuesday and pledged to support AI, despite calls to pace advanced models.",
    "bodyOriginal": "OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei are expected to address the U.N. Security Council for a meeting about artificial intelligence this week, a U.N. spokesperson confirmed on Tuesday.\nHugging Face CEO Clément Delangue is also set to join, along with Yoshua Bengio, a professor at Université de Montréal who co-chairs the Independent International Scientific Panel of the United Nations on AI, said Stephane Dujarric, spokesperson for the Secretary-General.\nThe meeting is set for Wednesday, according to Bloomberg, which was first to report the news.\nThe U.N. General Assembly in New York this week comes as the debate around AI safety and regulation has reached a boiling point following warnings from researchers about the dire risks to humanity.\nPresident Donald Trump, who has repeatedly dismissed the warnings as a \"hoax\" and \"scam\" over the past week, addressed the assembly on Tuesday and pledged to \"encourage\" the nascent technology, despite calls from Amodei and Altman to pace the development of advanced models.\n\"I'm not going to stifle growth of something that will be bigger than the industrial revolution,\" Trump said. \"Many say bigger than the industrial revolution or the internet itself.\"\nOpenAI's disclosure in July that its AI models broke out of a testing environment and autonomously hacked into open-source developer platform Hugging Face set off a wave of concerns about the rise of advanced models and how much they can be contained.\nSince then, Anthropic has also disclosed cyber incidents with its models, and OpenAI has revealed further \"concerning model behavior\" by autonomous agents. Last week, Google said that its Gemini model hacked into three other companies.\n—CNBC's Jim Forkin contributed to this article.",
    "bodyJa": "OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei are expected to address the U.N. Security Council for a meeting about artificial intelligence this week, a U.N. spokesperson confirmed on Tuesday.\nHugging Face CEO Clément Delangue is also set to join, along with Yoshua Bengio, a professor at Université de Montréal who co-chairs the Independent International Scientific Panel of the United Nations on AI, said Stephane Dujarric, spokesperson for the Secretary-General.\nThe meeting is set for Wednesday, according to Bloomberg, which was first to report the news.\nThe U.N. General Assembly in New York this week comes as the debate around AI safety and regulation has reached a boiling point following warnings from researchers about the dire risks to humanity.\nPresident Donald Trump, who has repeatedly dismissed the warnings as a \"hoax\" and \"scam\" over the past week, addressed the assembly on Tuesday and pledged to \"encourage\" the nascent technology, despite calls from Amodei and Altman to pace the development of advanced models.\n\"I'm not going to stifle growth of something that will be bigger than the industrial revolution,\" Trump said. \"Many say bigger than the industrial revolution or the internet itself.\"\nOpenAI's disclosure in July that its AI models broke out of a testing environment and autonomously hacked into open-source developer platform Hugging Face set off a wave of concerns about the rise of advanced models and how much they can be contained.\nSince then, Anthropic has also disclosed cyber incidents with its models, and OpenAI has revealed further \"concerning model behavior\" by autonomous agents. Last week, Google said that its Gemini model hacked into three other companies.\n—CNBC's Jim Forkin contributed to this article.",

    "title": "New EU industry rules would damage UK, warns Burnham",
    "titleJa": "New EU industry rules would damage UK, warns Burnham",
    "summaryJa": "The prime minister says he will raise his concerns when he meets the European Commission President later.",
    "bodyOriginal": "New EU industry rules would damage UK, warns Burnham\n- Published\nAndy Burnham has warned that planned EU rules to help European manufacturers would damage the UK, ahead of a meeting later with European Commission President Ursula von der Leyen.\nThe proposals aim to protect EU industry from Chinese competitors by giving companies inside the bloc priority for public contracts and subsidies.\nThe prime minister said he was concerned about how British industry and supply chains could be affected, and would raise the subject with von der Leyen when he meets her during a UN summit in New York.\nSpeaking on the flight to the US, Burnham also declined to rule out committing to rejoining the EU in Labour's next manifesto, saying it was an issue \"for another day\".\nHe said his immediate priority was to rebuild the relationship with the EU and reach an agreement that would boost the British economy.\nThe Made In Europe scheme - formally called the Industrial Accelerator Act (IAA) - is yet to be finalised, but the EU's car industry has called for the UK to be included to prevent disruption to its supply chains.\nTensions over the proposed scheme have reportedly further delayed this year's planned EU-UK summit, which had already been postponed in the wake of Sir Keir Starmer's resignation as prime minister in July.\nBurnham said: \"We have considerable support among the member states for the position we are taking, because Europe's argument is not with us.\n\"We both suffer the same effects as other countries, particularly steel and the issue it raises for the steel industry in Europe and in Britain.\n\"We are making the argument 'we are not your enemies here… we are not the problem'. Made in Europe is dealing with a different problem.\n\"We are making the argument that 'let's avoid collateral damage'.\"\nBurnham expects to find 'common ground' with Trump in first meeting\n- Published10 hours ago\nWatch: What to expect from the UN General Assembly\n- Published12 hours ago\nTen years on, Brexit's economic impact is becoming clearer\n- Published14 September\nBurnham told reporters his own speech to the UN General Assembly later would reflect on the decade since the Brexit vote and the \"turbulence comes when outside actors seek to manipulate, to distort facts, influence the British democratic process\".\n\"Going into the next decade, we need to be clear-eyed about that and become stronger and more on the front foot about challenging that,\" he said.\nAsked if he would rule out making a pledge to rejoin the EU at the next general election, Burnham said: \"Our focus at the moment is on a UK-EU summit which we hope will take place later this year.\n\"My immediate priority is to build on the good work that Keir [Starmer] did in rebuilding bridges, because those bridges were broken in the early part of this decade.\"\nHe added: \"What we have got to do is now go to the next level in terms of reaching practical agreement that will further boost the British economy, and those issues are the substance of the summit alongside EU requests around youth mobility.\"\nHe said questions about rejoining the EU were for \"another day\".\nSpeaking at the Liberal Democrat conference in Brighton on Monday, the EU's new ambassador to the UK was asked whether the UK could rejoin the EU or be granted associate membership.\nJukka Salovaara said: \"The doors are open but it's very much up to the UK public to identify and decide on its level of ambition when it comes to deepening cooperation with the EU.\"\nLast September, Burnham said he would like to see the UK back in the EU in his lifetime.\nEarlier this year, he said Brexit had been \"damaging\" but \"the last thing we should do right now is re-run those arguments\".\nThe EU has recently suggested Canada could become the bloc's first \"associate member\".\nAsked if this could be an option for the UK, Burnham said: \"The European Union made it clear that that wasn't open to us.\"\nAdditional reporting by Brian Wheeler\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

eporting by Brian Wheeler\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "title": "Sir Jim Ratcliffe suspends production at key UK plants blaming high gas prices",
    "titleJa": "Sir Jim Ratcliffe suspends production at key UK plants blaming high gas prices",
    "summaryJa": "Sir Jim Ratcliffe suspends production at key UK plants blaming high gas prices- Published",
    "bodyOriginal": "Sir Jim Ratcliffe suspends production at key UK plants blaming high gas prices\n- Published\nBillionaire Sir Jim Ratcliffe's industrial giant Ineos is pausing production at its three plants in Hull, blaming high UK gas prices.\nThe firm said gas prices in the UK are twelve times higher than in the US, and eight times more expensive than the coal-based processes used by Chinese competitors.\nSir Jim said: \"We are being forced to mothball some of the most efficient plants in Europe, but with gas prices now 12 times the level in the US and 8 times that of China, we just cannot compete.\"\nThe facilities produce raw materials used to make pharmaceuticals, clothing, cosmetics, detergents, construction materials and military explosives in the UK and Europe. Gas is a key ingredient in production.\nIneos said the move will affect up to 1,000 of its staff, of whom 245 work directly at the site.\nBut the BBC understands workers across the sites will be kept on while Ineos tries to buy liquefied natural gas (LNG) directly from the US at lower prices - which could take up to a year - or waits for gas prices to go down.\nIneos is asking governments in the UK and the EU — where most of its products are exported to — to put in tariff protections against Chinese products.\nOne plant makes acetic acid, which is used in vinegar, paint and glue. Another makes acetic anhydride, a key ingredient of aspirin, and the third makes ethyl acetate, which is used as a solvent and for decaffeinating tea and coffee.\nHe said the current government's energy policy was \"economic vandalism on an industrial scale\".\nThe wholesale price of natural gas — used for heating homes and generating electricity — has almost doubled in the UK and Europe since July.\nThe disruption of supplies of oil and gas through the Strait of Hormuz following the US-Israel war in Iran has pushed up prices around the world.\nIneos says that its plants in Humberside are \"among the most efficient in the world\", producing materials with half the carbon footprint of US rivals, and only one eighth the footprint of Chinese equivalents.\nTwo plants are already shut and a third will stop production in the coming days, the company said.\nIt's the second time in less than a week that Sir Jim, who also owns a large stake in Manchester United, has heavily criticised government policy.\nHe told BBC News last week that he has lost confidence in the UK, describing the country as \"on the slide\", which he blamed on high taxes and high immigration.\nSir Jim, whose wealth is estimated to be around £15bn, has prompted controversy in the past with his comments on immigration. He was a supporter of Brexit but has been a tax resident in Monaco since 2020.\nThe Department for Business, Innovation, Science and Trade has been approached for comment.",

    "id": "mcdonald-s-is-hosting-an-investor-day-as-940fad3d",
    "title": "McDonald's is hosting an investor day as its U.S. business struggles. Here are 4 things to expect",
    "titleJa": "McDonald's is hosting an investor day as its U.S. business struggles. Here are 4 things to expect",
    "summaryJa": "The presentation comes as McDonald's U.S. business disappointed in its most recent quarter.",
    "bodyOriginal": "McDonald's is expected to share more details about its new strategy to win back diners at its investor day on Wednesday in Chicago.\nThe company unveiled its new global growth plan, called McDonald's > NEXT, in June at its biennial worldwide convention for franchisees. Pillars of the strategy include a new restaurant design, better-tasting food and drinks and consumer-led innovation. But executives have otherwise offered few details, holding back until Wednesday's event.\nNearly three years after McDonald's previous investor day, the presentation comes after McDonald's U.S. business disappointed in its most recent quarter. The chain's same-store sales increased just 0.8%, and traffic to its restaurants fell.\nCEO Chris Kempczinski said that the problems were due to shortcomings in execution, like a mixed implementation of its value offerings, rather than issues with the chain's overall strategy. Skye Anderson, who was tapped as president of McDonald's U.S. business in the wake of the weak quarter, will likely speak on Wednesday.\nKempczinski, Anderson and the rest of the McDonald's executive team will have to win over investors, who are increasingly skeptical that the fast-food giant can win over diners in the near term.\nOver the past 12 months, the stock has fallen 18%, dragging McDonald's market value down to about $175 billion. The S&P 500 has climbed 16% in the same period, as optimism about artificial intelligence has offset concerns about the financial health of consumers.\nLoading chart...\nHere's what McDonald's presentation is expected to cover:\n1) Value strategy\nOver the past two years, value has become all-important to restaurants, which are competing over a smaller pool of customers who care about both price and experience. While chains like Taco Bell and Chili's have thrived, McDonald's has struggled recently as its value offerings got lost among its other promotional messages.\nPlus, its franchisees have pushed back against discounts, which grow sales but eat into operators' profits, especially as high beef prices raise expenses. Only about two-thirds of McDonald's U.S. franchisees implemented its recent \"under $3 menu,\" executives said in August. For its part, McDonald's lets franchisees set their own prices, but the company assesses how operators' menu prices help deliver value.\nAnalysts expect that McDonald's will continue to emphasize value, and franchisees' cooperation will be key to its success.\n\"We expect MCD to use this event to make it clear to franchisees that adherence to pricing recommendations will be a key factor in evaluating agreement renewals,\" Citi Research analyst Jon Tower wrote in a note to clients with his investor day predictions.\nTower also cut his price target for the company to $310 per share from $345 a share, citing investor concerns about franchisees' buy-in for the company's overall strategy.\n2) Menu updates\nBesides value, McDonald's is also looking to attract diners through menu offerings with elevated taste and quality.\nIn recent years, McDonald's has shifted its menu to include more chicken options, as beef prices have risen and rivals like Chick-fil-A threaten its sales. At the franchisee convention, executives shared that the next evolution of its chicken offerings will be hand-breaded. Chick-fil-A, Raising Cane's and Popeyes all hand bread or batter their chicken rather than using a machine. The technique usually results in a crispier exterior, but it takes more time and labor.\nIn addition to chicken, McDonald's has also leaned into expanded beverage options recently. After winding down CosMc's, its drink-focused spinoff, McDonald's has rolled out a variety of beverage options in the U.S., including crafted sodas, refreshers and energy drinks. A handful of international markets, like Germany, have also been rolling out more drink offerings.\n\"What's important — we'll talk a lot more about this at investor day — is beverages,\" Chief Financial Officer Ian Borden said on the company's earnings conference call in August.\n3) Restaurant remodels\nRoughly every decade, McDonald's mandates that franchisees remodel their restaurants to fit new aesthetic guidelines and improve their technology and equipment.\nAnd it looks like another round of restaurant renovations is coming as part of the growth strategy. At the convention, franchisees got the first look at the new restaurant design.\nTypically, McDonald's chips in some support for franchisees who are remodeling their restaurants. While upgraded locations usually generate higher sales, operators have to fund the remodels at a time when borrowing costs are elevated. And thanks to tariffs and high energy prices, construction costs are increasing, too.\nAs a result of the remodel program, McDonald's capital expenditures could increase by $600 million to $900 million in 2027 and 2028 from its projected spending in 2026, according to a research note from BMO Capital Markets analyst Andrew Strelzik. But executives are expected to share the company's own projected costs for the remodel program at investor day.\n4) Cost cuts\nWhile McDonald's will likely spend more on capital expenditures over the next two years, the company will likely try to cut costs elsewhere.\nMcDonald's will share its outlook for general and administrative spending during investor day, Borden said in August.\nMcDonald's could target G&A spending to be less than 2% of its systemwide sales, down from its current goal of 2.2%, Bernstein analyst Danilo Gargiulo wrote in a note to clients. In recent years, the company's workforce has shrunk as part of a reorganization effort.\nIndirectly, McDonald's will also cut costs by refranchising some of its company-owned restaurants.\nSelling locations to franchisees means that McDonald's will not be responsible for the operational costs or capital expenditures required to run a restaurant successfully. The company will also share more details about those plans at the investor day, according to Borden.",

    "id": "peloton-is-revamping-its-treadmills-with-9d825d2e",
    "title": "Peloton is revamping its treadmills with new features in the next phase of its turnaround",
    "titleJa": "Peloton is revamping its treadmills with new features in the next phase of its turnaround",
    "summaryJa": "With its new treadmills, Peloton aims to appeal to customers from casual workers to more serious athletes.",
    "bodyOriginal": "Peloton is betting that revamped treadmills, AI and new distribution channels can bring it back to sustained growth.\nThe connected fitness company on Tuesday unveiled three new treadmills and new features for its Peloton IQ artificial intelligence platform with tools for runners, walkers and hikers. Peloton aims to widen its customer base, from people looking for a more affordable, space-saving treadmill to more experienced athletes looking for personalized coaching.\n\"From record marathon turnouts around the world to the rise of local run clubs, we're rediscovering the joy of running, walking and hiking,\" said CEO Peter Stern in a press release.\nBut the stakes remain higher than simply selling new equipment. Shares have dropped 43% since Stern stepped into the role in January 2025.\nPeloton has spent the past several years cutting costs, restructuring its operations and repairing its balance sheet after the pandemic-era boom in connected fitness gave way to a sharp slowdown in demand. The company has returned to profitability and improved its cash generation, but revenue growth is a challenge as subscriptions trend lower.\nNow Stern is putting more emphasis on widening the company's potential revenue sources.\n\"Expanding our treadmill portfolio and launching AI-powered software for runners will allow us to connect with a much wider audience,\" Stern said.\nThe treadmill relaunch, Peloton said, is also addressing the company's long-standing challenge getting consumers to buy high-cost equipment that takes up a lot of space.\nThe Tread Flex will start at $2,195, making it Peloton's lowest-cost treadmill of the new hardware and its first folding model. The new treadmill can contract by nearly half its size, potentially broadening the product's appeal among consumers with less space or lower equipment budgets\nAt the other end of its lineup, Peloton is keeping the $6,695 Tread+ Vision the same price. It is also increasing the price of the middle model, the Tread Vision, by $200, to $3,495.\nThe higher-end products include movement-tracking cameras that provide insights on a user's running form. The Tread+ Vision also includes Sled Mode, meant to allow users to add up to 300 pounds of resistance for strength training as hybrid races like Hyrox become more popular.\nAn AI-powered running coach\nThe wider range of prices brings questions about how Peloton will keep buyers engaged.\nThat is where Peloton IQ comes in.\nPeloton launched the service last year as an AI-powered software system for personalized recommendations and coaching. The company is now expanding it with features specifically aimed at runners.\nThe new Run Analysis feature uses live video to score running efficiency and provide personalized pace, form and heart-rate guidance, similar to feedback from an in-person coach.\nThe strategy moves Peloton further away from simply being a screen attached to a piece of exercise equipment. The company is positioning its hardware, content and data as a connected training system.\n\"The Peloton advantage has always been the sum of its parts,\" said Chief Product Officer Nick Caldwell in the release. \"It's about the instructors and content you love, the software that simplifies wellness and equipment that fits seamlessly into your life and transforms your routine.\"\nThat could be particularly important as Peloton tries to reach more experienced and affluent athletes who may already use products from Garmin, Whoop and other fitness platforms.\nPeloton already integrates with Apple Health, Fitbit and Garmin Connect. It is now adding Whoop, allowing members to connect their accounts and have Peloton workouts contribute to personalized insights in the Whoop app.\nThe company is leaning further into the broader running boom, offering more than 17,000 Tread-specific classes and adding race-training programs designed to take members through full training for events like the New York City Marathon.\nFor investors, however, the key question isn't whether the new products offer a better exercise experience than the old ones. It is whether they can change Peloton's growth trajectory.\nTruist analyst Youssef Squali told CNBC in a statement that the firm expects \"revenue to remain pretty muted given continuous headwinds to subscriber growth.\" He said the firm anticipates next calendar year will be better for Peloton as its hardware and software improves and it refinances its debt.\nSquali has a \"buy\" rating on the stock and a $9 price target, compared with its Monday closing price of $4.95 a share.\nThe equipment changes add to a range of efforts Peloton is making to boost its business.\nThe company also recently expanded its content distribution through a partnership with Spotify, putting more than 1,400 Peloton strength and wellness classes in front of Spotify Premium subscribers. It is also building a commercial fitness business, selling more durable versions of its equipment to hotels, apartment buildings, gyms and other high-use environments.\nAfter years of focusing on cost cutting and financial stability, Peloton is now trying to convince investors that it can grow the business again.\nThe holiday season will be an early test of that strategy.",

el, the Tread Vision, by $200, to $3,495.\nThe higher-end products include movement-tracking cameras that provide insights on a user's running form. The Tread+ Vision also includes Sled Mode, meant to allow users to add up to 300 pounds of resistance for strength training as hybrid races like Hyrox become more popular.\nAn AI-powered running coach\nThe wider range of prices brings questions about how Peloton will keep buyers engaged.\nThat is where Peloton IQ comes in.\nPeloton launched the service last year as an AI-powered software system for personalized recommendations and coaching. The company is now expanding it with features specifically aimed at runners.\nThe new Run Analysis feature uses live video to score running efficiency and provide personalized pace, form and heart-rate guidance, similar to feedback from an in-person coach.\nThe strategy moves Peloton further away from simply being a screen attached to a piece of exercise equipment. The company is positioning its hardware, content and data as a connected training system.\n\"The Peloton advantage has always been the sum of its parts,\" said Chief Product Officer Nick Caldwell in the release. \"It's about the instructors and content you love, the software that simplifies wellness and equipment that fits seamlessly into your life and transforms your routine.\"\nThat could be particularly important as Peloton tries to reach more experienced and affluent athletes who may already use products from Garmin, Whoop and other fitness platforms.\nPeloton already integrates with Apple Health, Fitbit and Garmin Connect. It is now adding Whoop, allowing members to connect their accounts and have Peloton workouts contribute to personalized insights in the Whoop app.\nThe company is leaning further into the broader running boom, offering more than 17,000 Tread-specific classes and adding race-training programs designed to take members through full training for events like the New York City Marathon.\nFor investors, however, the key question isn't whether the new products offer a better exercise experience than the old ones. It is whether they can change Peloton's growth trajectory.\nTruist analyst Youssef Squali told CNBC in a statement that the firm expects \"revenue to remain pretty muted given continuous headwinds to subscriber growth.\" He said the firm anticipates next calendar year will be better for Peloton as its hardware and software improves and it refinances its debt.\nSquali has a \"buy\" rating on the stock and a $9 price target, compared with its Monday closing price of $4.95 a share.\nThe equipment changes add to a range of efforts Peloton is making to boost its business.\nThe company also recently expanded its content distribution through a partnership with Spotify, putting more than 1,400 Peloton strength and wellness classes in front of Spotify Premium subscribers. It is also building a commercial fitness business, selling more durable versions of its equipment to hotels, apartment buildings, gyms and other high-use environments.\nAfter years of focusing on cost cutting and financial stability, Peloton is now trying to convince investors that it can grow the business again.\nThe holiday season will be an early test of that strategy.",
