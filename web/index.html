    "summaryJa": "From its intraday low to high Thursday, VIX moved more than 11 points, the biggest one-day move since April 9.",
    "bodyOriginal": "Whether it's a referendum on the midterms or just a continuation of a bear market in semiconductors that dates back to the group's peak in June, one thing's clear from the options action Thursday: few traders saw this coming.\nThat's evident in the surge in Cboe Volatility index (VIX), which jumped as much as 5.7 points to above 28 about 90 minutes after the opening bell on Thursday. It's the highest reading on VIX since March 31, the day after the S&P 500 bottomed after selling off as tensions between Iran, Israel and the U.S. reached fever pitch.\nFrom its intraday low to high Thursday, VIX moved more than 11 points, the biggest one-day move since April 9. Yet with the S&P 500 down 3%, there's an argument to be made that volatility should be higher. Traders use a rule of thumb that 16 points for the VIX equate to a 1% move in the index.\nThe S&P 500 was headed for its worst decline since April 2025.\n\"My data says to de-risk, but my gut says this is a blowout that could create a dip-buying opportunity\" said Noel Smith, \"I do not see macro stuff causing this, like oil or rates. Those things are relatively unchanged. The tape looks like a liquidation and that's exactly what it is according to what I'm hearing with regards to a hedge fund.\"\nLooking at Wednesday's response to the selloff in semiconductors adds a wrinkle for traders that pointed to a too-calm VIX despite Wednesday's tech-stock wreck. With the VanEck Semiconductor ETF down 3%, it was the first day in market history that the VIX concurrently fell more than 4 points, according to data from the X account \"OddStats.\"\nAs of midday, nearly 800,000 calls traded on the VIX, 3.5 times higher than 30-day average, according to Cboe data.",

    "titleJa": "Trump's energy deals are about to face a wave of investigations by Democrats",
    "summaryJa": "Democrats are certain to scrutinize the U.S. intervention in Venezuela, administration mineral deals and the cancellation of previously funded energy projects.",
    "bodyOriginal": "President Donald Trump is expected to face a wave of investigations when Democrats take control of Congress in January. His sweeping deal-making in the energy sector is likely to become a central focus.\nDemocrats have pressed the White House for months on the legality of its intervention in Venezuela's oil sector and its cancellation of renewable energy projects funded by the Biden administration. They have raised conflict of interest concerns over numerous deals in the minerals sector.\nBut, until now, the opposition party could do little more than send strongly worded letters to administration officials. When the next Congress convenes in January, the Democrats will wield the subpoena power that comes with committee control, giving them the authority to compel testimony and the disclosure of documents.\nThe House Energy and Commerce Committee in the next Congress intends to pursue an aggressive oversight agenda to root out corruption, Rep. Frank Pallone, the New Jersey Democrat who will likely chair the panel, said in a statement.\nWith comfortable majorities in the House and Senate, Democrats will likely pass a war powers resolution that demands an end to the conflict, which has hiked fuel prices in the U.S. and around the world.\n1. Iran war\nCrude oil prices sold off sharply Wednesday as the market expected the election defeat to push Trump to cut a deal with Iran. Vice President JD Vance blamed the Republican loss directly on the war, raising questions about whether there is support inside the administration to continue the conflict.\nHouse Minority Leader Hakeem Jeffries, who will likely take over the House speaker's gavel in January, said Wednesday that Democrats will \"end this reckless and costly war of choice that has skyrocketed gas prices all across the country.\"\nThe new Congress will try to rein in the administration by passing legislation to stop the conflict, said Rep. Ted Lieu, vice chairman of the Democratic caucus. Jeffries has said Democrats will pass a war powers resolution, though Trump will almost certainly wield his veto. It is unclear whether Democrats will try to restrict funding for the war as well.\nNevertheless, tumbling crude prices could push gasoline below $4 per gallon in the next week and diesel under $6 by Thanksgiving, said Patrick De Haan, head of petroleum analysis at GasBuddy, in a social media post Wednesday.\nBut the odds still favor military escalation in the Middle East, warned Bob McNally, president of Rapidan Energy and a former energy advisor to President George W. Bush.\n\"Iran is hardened in its uncompromising position,\" McNally said. \"Trump, having now paid a huge price for his determination to prevent Iran from obtaining a nuclear weapon, is unlikely to let go of this legacy goal and walk away.\"\n2. Venezuela's oil\nDemocratic lawmakers have pressed the Trump administration for months to provide Congress with an accounting of how Venezuela's oil revenues have been spent — to no avail.\nWashington seized control of Venezuela's oil exports in January after ousting former President Nicolás Maduro in a military raid. The Pentagon took a stake in an obscure oil company, North American Blue Energy Partners, or NABEP, that is supposed to develop Venezuelan oil reserves. The deal supposedly gives the U.S. control over 65 billion barrels of oil.\nDemocratic House members warned the oil industry in January that entering into an agreement with the U.S. on Venezuelan oil could expose the industry to \"legal risk, including civil liability from creditors who hold nearly $200 billion worth of debt to Venezuela and their various state-owned entities.\"\nDemocratic senators subsequently sent a letter in September to Defense Secretary Pete Hegseth and Energy Secretary Chris Wright questioning the legal basis for the U.S. government's deal with NABEP.\nEnergy analysts warned when the NABEP deal was announced in August that it might not survive if Democrats take power in Washington.\n3. Deals for critical minerals\nDemocrats have also raised conflict of interest concerns over the Trump administration's series of deals in the critical minerals sector.\nThe White House has justified the deals, often involving government equity stakes in private companies, as necessary to support a segment of the mining industry that's critical to U.S. national security and that has been undercut by competitors in China.\nBut Democratic senators have pointed to the involvement of Cantor Fitzgerald in a number of those deals as cause for concern. Commerce Secretary Howard Lutnick ran Cantor before joining the Trump administration. He personally divested from Cantor after joining the Cabinet and turned over control to his sons.\nThe Democratic senators demanded in a July letter that the federal government preserve any records related to deals involving 14 companies.\nFor his part, the Commerce secretary dismissed the allegations. \"If the Democrats send me letters, I will respond to the letters but they don't matter, since when you do nothing wrong, you don't worry about it and you don't care,\" Lutnick told CNBC in a September interview.\n\"You just answer their silly questions and you move on,\" Lutnick said. \"This is a waste of time trying to create something that doesn't exist.\"\nOthers are less cavalier. USA Rare Earth, one of the companies named in the senators' letter, has warned investors that its deal making the U.S. government one of its stockholders has few precedents.\nAs a consequence, the company could be subject to litigation, political scrutiny and a change in federal priorities, it said in a March filing with the Securities and Exchange Commission.\n4. Canceled energy projects\nThe Trump administration has favored fossil fuels and waged a relentless campaign against renewable energy, particularly wind power, since taking office.\nDemocrats are unlikely to restore tax credits phased out by Trump's big tax bill due to the president's veto power. But they are certain to press the administration on the nearly $8 billion of energy projects it has canceled in states that supported Vice President Kamala Harris in the 2024 presidential election.\nEnergy Secretary Chris Wright has told Congress that the projects were not canceled based on political considerations. Several House Democrats have accused Wright of giving false testimony, an allegation the Energy Department has denied.\nDemocrats are also scrutinizing the administration's efforts to kill offshore wind power in the U.S. The Interior Department has tried to buy out leases for several such projects, for example, paying TotalEnergies nearly $1 billion to cancel an offshore wind project and stop investing in any similar projects in the U.S. in the future. Total agreed to invest in natural gas instead.\nReps. Jared Huffman and Jamie Raskin, the ranking Democrats on the natural resources and judiciary committees, respectively, called the TotalEnergies deal unlawful and launched an investigation in April.",

wer. But they are certain to press the administration on the nearly $8 billion of energy projects it has canceled in states that supported Vice President Kamala Harris in the 2024 presidential election.\nEnergy Secretary Chris Wright has told Congress that the projects were not canceled based on political considerations. Several House Democrats have accused Wright of giving false testimony, an allegation the Energy Department has denied.\nDemocrats are also scrutinizing the administration's efforts to kill offshore wind power in the U.S. The Interior Department has tried to buy out leases for several such projects, for example, paying TotalEnergies nearly $1 billion to cancel an offshore wind project and stop investing in any similar projects in the U.S. in the future. Total agreed to invest in natural gas instead.\nReps. Jared Huffman and Jamie Raskin, the ranking Democrats on the natural resources and judiciary committees, respectively, called the TotalEnergies deal unlawful and launched an investigation in April.",

    "id": "shares-in-musk-s-spacex-plunge-as-tech-a-3945e2d3",
    "title": "Shares in Musk's SpaceX plunge as tech and AI stocks fall",
    "titleJa": "Shares in Musk's SpaceX plunge as tech and AI stocks fall",
    "summaryJa": "The market has been reacting to possible tougher scrutiny of data centre construction and the AI industry following the US mid-terms",
    "bodyOriginal": "Shares in Musk's SpaceX plunge as tech and AI stocks fall\n- Published\nShares in Elon Musk's SpaceX have plunged as tech and artificial intelligence stocks more broadly plummeted a day after the Democrats swept to victory in the midterms.\nThose losses dragged the tech-heavy Nasdaq Composite stock index down, which had fallen by more than 5% at one point in early trading.\nThe market has been reacting to possible tougher scrutiny of data centre construction and the artificial intelligence (AI) industry following Democrat wins in key data centre states including Texas.\nFollowing the election, some tech leaders have acknowledged they need to improve their communication around data centres and the benefits of AI.\nSpaceX shares were down more than 9% in by lunchtime in Thursday trading, while Tesla shares dropped more than 11%.\nMusk had spent nearly $450m backing Republican campaigns, including at least $45m in support of Ken Paxton for the Texas senate seat, but Texas was turned blue in the Democratic tsunami on Tuesday night.\nTexas governor-elect Gina Hinojosa campaigned heavily against data centres, pledging a moratorium on new construction in the sector.\nShares in chipmakers have been suffering, with AMD dropping more than 14% on Thursday, while Micron shares had dropped by as much as 17% before recovering slightly.\nIntel shares are down by more than 7% and shares in Nvidia have fallen nearly 9%, while the Philadelphia Semiconductor Index had fallen by 10%.\nThe stock falls also hit the S&P 500 index, which dropped by 3.8% by lunchtime.\nSusannah Streeter, chief investment strategist at Wealth Club, said the steep sell-off on the Nasdaq and the S&P 500 was sending shockwaves into other markets.\n\"Fresh panic over the AI trade has hit Wall Street hard,\" she said.\n\"Fears that the vast sums poured into AI infrastructure may not deliver the returns investors have been banking on are now colliding with the prospect of a sharp slowdown in data centre construction.\"\nSome tech leaders have said they were caught off guard by the backlash against data centres in the midterms.\nOpenAI president and co-founder Greg Brockman said he believed everyone had been surprised by the reaction to data centres, and more work needed to be done to ensure communities were on board.\n\"A lot of our shift over the course of this year has really been to realise that from San Francisco trying to build infrastructure in Texas, Georgia, and other places, you can't just tweet and say: 'This is going to be good.' You need to be in those communities,\" Brockman said at the WSJ Tech conference in Napa, California on Wednesday evening.\nMeta's president Dina Powell McCormick agreed that the industry needed to improve their communication about the benefits of AI.\n\"I think we need to double and triple down on telling the story,\" she told the WSJ conference.\nAlongside the immediate impacts of the US mid-term elections, some investors have become concerned that AI shares could be in a bubble that is due a correction.",
    "bodyJa": "Shares in Musk's SpaceX plunge as tech and AI stocks fall\n- Published\nShares in Elon Musk's SpaceX have plunged as tech and artificial intelligence stocks more broadly plummeted a day after the Democrats swept to victory in the midterms.\nThose losses dragged the tech-heavy Nasdaq Composite stock index down, which had fallen by more than 5% at one point in early trading.\nThe market has been reacting to possible tougher scrutiny of data centre construction and the artificial intelligence (AI) industry following Democrat wins in key data centre states including Texas.\nFollowing the election, some tech leaders have acknowledged they need to improve their communication around data centres and the benefits of AI.\nSpaceX shares were down more than 9% in by lunchtime in Thursday trading, while Tesla shares dropped more than 11%.\nMusk had spent nearly $450m backing Republican campaigns, including at least $45m in support of Ken Paxton for the Texas senate seat, but Texas was turned blue in the Democratic tsunami on Tuesday night.\nTexas governor-elect Gina Hinojosa campaigned heavily against data centres, pledging a moratorium on new construction in the sector.\nShares in chipmakers have been suffering, with AMD dropping more than 14% on Thursday, while Micron shares had dropped by as much as 17% before recovering slightly.\nIntel shares are down by more than 7% and shares in Nvidia have fallen nearly 9%, while the Philadelphia Semiconductor Index had fallen by 10%.\nThe stock falls also hit the S&P 500 index, which dropped by 3.8% by lunchtime.\nSusannah Streeter, chief investment strategist at Wealth Club, said the steep sell-off on the Nasdaq and the S&P 500 was sending shockwaves into other markets.\n\"Fresh panic over the AI trade has hit Wall Street hard,\" she said.\n\"Fears that the vast sums poured into AI infrastructure may not deliver the returns investors have been banking on are now colliding with the prospect of a sharp slowdown in data centre construction.\"\nSome tech leaders have said they were caught off guard by the backlash against data centres in the midterms.\nOpenAI president and co-founder Greg Brockman said he believed everyone had been surprised by the reaction to data centres, and more work needed to be done to ensure communities were on board.\n\"A lot of our shift over the course of this year has really been to realise that from San Francisco trying to build infrastructure in Texas, Georgia, and other places, you can't just tweet and say: 'This is going to be good.' You need to be in those communities,\" Brockman said at the WSJ Tech conference in Napa, California on Wednesday evening.\nMeta's president Dina Powell McCormick agreed that the industry needed to improve their communication about the benefits of AI.\n\"I think we need to double and triple down on telling the story,\" she told the WSJ conference.\nAlongside the immediate impacts of the US mid-term elections, some investors have become concerned that AI shares could be in a bubble that is due a correction.",

    "id": "drunk-and-dangerous-e-bike-riders-face-o-be6b192b",
    "title": "Drunk and dangerous e-bike riders face on-the-spot fines under crackdown",
    "titleJa": "Drunk and dangerous e-bike riders face on-the-spot fines under crackdown",
    "summaryJa": "A consultation will consider fines and other ways to clamp down on dangerous e-bike riders.",
    "bodyOriginal": "Drunk and dangerous e-bike riders face on-the-spot fines under crackdown\n- Published\nPeople riding drunk or dangerously on e-bikes – and those who jump red lights - could face on-the-spot fines under plans to curb anti-social behaviour.\nFirms which run shared e-bike schemes will also be expected to manage their fleets better and provide designated parking areas to keep pavements safe.\nThey could also be required to take out insurance so people can claim compensation if they are hit by someone on a shared bike.\nIt's part of a crackdown on what ministers called the \"wild west\" of e-biking – with a patchwork of rules across the country often leaving the streets unsafe for pedestrians.\nA consultation launched on Thursday sets out proposed national standards to make journeys safer for everyone and keep pavements clear, particularly for wheelchair users and families with prams.\nThe first e-bikes were launched in Exeter in 2016 and arrived in London a year later, growing to become a popular commuter option.\nAccording to the Greater London Authority, 37 million trips were taken on dockless e-bikes last year – a third more than the previous year.\nShared e-bikes - such as Lime, Voi, Beryl, Dott, Forest and Bolt - make short journeys quick and convenient.\nWhile some areas enforce rules that mean shared bikes can only be left in specific areas, others have looser rules.\nUnder the government's proposals, local leaders will be able to license schemes in their area, allowing them to enforce minimum standards and better integrate e-bikes into existing transport networks.\nMeasures could include requiring operators to have a parking plan and to manage fleet sizes and operating areas, so bikes aren't overcrowding streets.\nThe consultation will also consider ways to tackle antisocial and illegal behaviour, to prevent users from riding shared cycles drunk, underage, or on pavements. There will also be clear consequences set out – such as fines - for this type of behaviour.\nThe government is also consulting on whether local leaders should have extra powers, including setting fees and requirements for operators to share data to improve enforcement and journey planning.\nThe consultation will last for eight weeks after which the government will draw up legislation to implement the changes.\n'Dumped e-scooters force blind people into road'\n- Published1 April\nRed light jumping cyclists offered film over fine\n- Published14 October\n'Our lives will never be the same again after Lime bike crash'\n- Published29 June\nPrime Minister Andy Burnham said the e-bike clampdown was a \"small but important everyday fix\" which would make streets safer.\nTransport Secretary Heidi Alexander said the government wanted e-bike schemes to \"grow in popularity\" but acknowledged they were \"causing a little bit of nuisance at the moment\".\nAsked how punishments for dangerous cycling could be enforced, Alexander said licensing rules could allow for fines but added: \"What you can't do is legislate for every eventuality, you can't legislate for idiots.\"\n\"The police enforce the rules of the road to stop cyclists when they are behaving recklessly but police have got a lot on their plate so individuals have to take some responsibility,\" she added.\nBosses at Lime, Voi and Bolt all welcomed the proposals, adding that consistent standards being applied across the country would provide clarity and certainty for operators, riders and the general public.\nMike Wordingham from the Royal National Institute for the Blind said 92% of blind and partially sighted people had been forced to walk into roads due to e-bikes blocking pavements.\nHe welcomed the government's announced but warned that tackling rider behaviour would be \"difficult\" and said a locally-led approach shouldn't lead to \"a patchwork of regulations and inconsistency in implementing them\".\nGet in touch\nHave you been affected by the issues raised in this story? Let us know",

pe of behaviour.\nThe government is also consulting on whether local leaders should have extra powers, including setting fees and requirements for operators to share data to improve enforcement and journey planning.\nThe consultation will last for eight weeks after which the government will draw up legislation to implement the changes.\n'Dumped e-scooters force blind people into road'\n- Published1 April\nRed light jumping cyclists offered film over fine\n- Published14 October\n'Our lives will never be the same again after Lime bike crash'\n- Published29 June\nPrime Minister Andy Burnham said the e-bike clampdown was a \"small but important everyday fix\" which would make streets safer.\nTransport Secretary Heidi Alexander said the government wanted e-bike schemes to \"grow in popularity\" but acknowledged they were \"causing a little bit of nuisance at the moment\".\nAsked how punishments for dangerous cycling could be enforced, Alexander said licensing rules could allow for fines but added: \"What you can't do is legislate for every eventuality, you can't legislate for idiots.\"\n\"The police enforce the rules of the road to stop cyclists when they are behaving recklessly but police have got a lot on their plate so individuals have to take some responsibility,\" she added.\nBosses at Lime, Voi and Bolt all welcomed the proposals, adding that consistent standards being applied across the country would provide clarity and certainty for operators, riders and the general public.\nMike Wordingham from the Royal National Institute for the Blind said 92% of blind and partially sighted people had been forced to walk into roads due to e-bikes blocking pavements.\nHe welcomed the government's announced but warned that tackling rider behaviour would be \"difficult\" and said a locally-led approach shouldn't lead to \"a patchwork of regulations and inconsistency in implementing them\".\nGet in touch\nHave you been affected by the issues raised in this story? Let us know",

    "titleJa": "Here's what the Democratic election rout could mean for the U.S. economy",
    "summaryJa": "The biggest forces shaping the economy aren't going to change just because the party in power did.",
    "bodyOriginal": "The Democratic midterm election sweep could result in changes in economic policies related to trade, spending priorities and artificial intelligence. But the biggest forces shaping the economy aren't going to change just because the party in power did.\nAffordability pressures, heavy levels of government spending and growth that is dependent on the artificial intelligence tail wind are likely to persist, economists say. And all of those factors pose risks to the economy.\n\"It's in a very kind of fragile place, and I don't know that it would take a lot to push the economy off the rails, and recession becomes a much greater risk,\" said Mark Zandi, chief economist at Moody's Analytics. \"That isn't the case at the moment, but I don't think that's gone away.\"\nZandi said he had been worried before the election that the economy was under threat from inflation, an underwhelming labor market and geopolitical dangers, and remains concerned now.\nDemocrats romped to upset wins in not only House and Senate races but also governor and other state races. But economic and foreign policy is largely set in the executive branch, and President Donald Trump remains far apart from his Democratic adversaries, though he said Wednesday he anticipates working with them.\n\"I don't expect any change in economic policy. The Iran war, the tariffs and trade policy, the heavy-handed immigration policy, all are done under executive order. They're not legislatively driven,\" Zandi said.\n\"The president thought they were good policies before the election. I don't know why he'd change his mind after the election,\" Zandi added. \"So I think they will continue to be policies that restrain growth and add to inflationary pressures and interest rates.\"\nZandi sees the AI hyperscaler buildout as a key to economic growth, but also a source of potential peril.\n\"The risks are decidedly to the downside because the growth is so dependent on AI, and the AI growth effects are so dependent on the equity market, and the equity market is so dependent on the valuations,\" he said. \"It just feels like kind of a very fragile place, and the labor market is not well functioning.\"\nLocal opposition to data centers was a fairly significant issue in the election, particularly for Democrats, according to CNBC polling, so that could be a further economic headwind, though the issue ranked below cost of living, corruption and several others.\nTwo economies\nThe election happened amid a dichotomy in economic views.\nTop-line numbers such as gross domestic product, consumer spending and the unemployment rate tell the story of an economy growing briskly while consumers spend and most Americans who want jobs are at work. GDP accelerated at a 3.4% annualized pace in the third quarter while consumer spending grew 3.8%. The unemployment rate is at 4.2% while layoffs are around their lowest level since 1969.\nHowever, rising prices have overshadowed those otherwise solid metrics.\nThe inflation rate in September as judged by the consumer price index was 3.7% — up sharply from 2.3% in April 2025 when Trump announced an aggressive round of so-called reciprocal tariffs against U.S. trading partners. The Iran war has only aggravated those conditions. The CPI was at just 2.4% when the U.S. and Israel launched attacks on Iran in late February, a war that has caused gas prices to soar.\nAnd wages aren't keeping up with rising costs. Wage growth when adjusted for inflation has turned negative, down 0.7% from a year ago in September, according to the Bureau of Labor Statistics.\nOne area where the two sides of the political divide could come together is tariffs.\nCongressional Democrats haven't been reflexively opposed to tariff efforts aimed at leveling the playing field. But the Trump tariffs have been criticized for their sweeping nature.\nGary Cohn, who served as director of the National Economic Council during Trump's first term, said Wednesday that he sees room for movement on trade issues.\n\"There's become a much more universal view on tariffs and what they're good for,\" Cohn said during a CNBC interview. \"Protecting U.S. workers and protecting manufacturing, protecting jobs in the United States, specifically from China, more than anything, is good and has been good policy.\"\nWhile Cohn noted that \"shutting down the borders between Canada and Mexico and the United States has probably not been so good for policy,\" he thinks \"there's a compromise that could be reached where we actually have tariffs put through the legislative system and they become law. They wouldn't become executive orders that can be rescinded the minute the next president walks off the podium.\"\nAddressing affordability\nDemocrats would also likely look to roll back spending cuts to SNAP food stamp benefits and Medicaid that were approved by the Republican-controlled Congress under the One Big Beautiful Bill Act, Morgan Stanley analysts said in a client note. But other policies that Democrats oppose would be harder to reverse.\n\"We think policy uncertainty since the beginning of President Trump's second term has been tied to executive, not legislative, action,\" the firm said. \"Policies on tariffs, geopolitics, trade ... deregulation, and export controls are all likely to persist, meaning we should expect a certain level of policy uncertainty to continue.\"\nHigh levels of government debt and budget deficits also are likely to remain.\nThe national debt currently stands at $40.5 trillion, up more than $4 trillion since Trump took office in January 2025. Net interest on the debt totaled $1.05 trillion in fiscal 2026, higher than spending on any other category except Social Security and Medicare.\nThe U.S. ended the year with a deficit just shy of $2 trillion, or about 6.1% of GDP. Morgan Stanley expects that level to persist even with some Democratic officials preaching fiscal discipline.\nWhile there are concerns that the change in power could result in standoffs over the debt ceiling, \"Democrats are likely to leverage [an impasse] to win policy concessions,\" Jan Hatzius, chief economist at Goldman Sachs, said in a note.\n\"It is not yet clear what Democrats will seek in return, but limiting the war with Iran, tariff rollbacks, the reversal of spending cuts, and expanded health benefits appear to be high on the list of priorities,\" he said.\nDespite the various headwinds and political uncertainty, most of Wall Street expects the growth in the economy to continue — if not without hiccups and lingering issues over the cost of living.\n\"My sense is that the economic expansion will continue to roll on, featuring above trend growth near 2½ percent,\" said Joseph Brusuelas, chief economist at RSM.\nBrusuelas also sees the opportunity to \"reset\" the trade agreement between the U.S., Mexico and Canada after a year and a half of tension from the Trump tariffs and reprisals.\n\"We only have a 15% probability of recession over the next 12 months,\" he said. \"The outcome of the election was immaterial to that estimate.\"",

    "id": "faisal-islam-how-high-will-interest-rate-84f66c3a",
    "title": "Faisal Islam: How high will interest rates go?",
    "titleJa": "Faisal Islam: How high will interest rates go?",
    "summaryJa": "The BBC's economics editor views one more interest rate as likely, but thinks that will be all.",
    "bodyOriginal": "Faisal Islam: How high will interest rates go?\n- Published\nInterest rates have risen to 4% and the Bank of England has indicated there are more rises to come. The question is how many? There is a split on the rate-setting committee here.\nThree of the nine voting members referred to \"rises\" plural. One member voted for a bigger increase, to 4.25%. Three referred to just one more including governor Andrew Bailey.\nMy read on this is that the expectation is for one more rise in February. Two and done, but it depends.\nIt is painful for those on variable mortgages, but should not be seen as the start of a cycle of hikes.\nPredicting where interest rates will go is like throwing darts at a board that constantly moves around the wall, with expectations of how long the Iran War will last and its impact on the economy and prices lurching from day to day.\nAt least there is no blindfold.\nThe Bank's forecasts indicate inflation is heading to just under 5% next spring as a typical household energy bill surges by 27% in January to £2,150 a year.\nWhy now?\nWhy have they raised now? High and rising inflation risks a further cycle of self fulfilling expectations of rising prices. It hasn't been seen so far, however. The war has lasted for 9 months, and led to oil prices used in the forecast averaging $108 a barrel.\nAnd yet on the day they have announced the rate rise, the oil price is actually 13% lower than that having fallen in the run up and after the US mid term elections, reflecting expectations or guesses that President Trump will now retreat or deescalate from the Iran war.\nThe other notable factor is that the UK economy is performing much better than forecasts and expectations. This is underlined by the Bank of England's latest forecasts.\nGrowth has been 0.6%, and 0.5% in the first two quarters of the year. It is heading for 0.7%, the Bank said, between July and September, before slowing in the three months to the end of the year. Unemployment has stabilised, actually falling a little.\nSome of this has fed through into a better performing currency, with sterling at its highest level since the Brexit referendum, when measured against a basket of currencies. This can help rein in inflation by making imports cheaper.\nSo, this is an unusual type of uncertainty. Even the expected further rise, probably in February next year is conditional on the war continuing.\nThe Bank of England stopped waiting for President Trump's war to end today, but perhaps the Democrats' resounding victory in the US midterm elections will stop the inflationary wave? The Bank has thrown a tentative first dart, and there is probably another to come.",
    "bodyJa": "Faisal Islam: How high will interest rates go?\n- Published\nInterest rates have risen to 4% and the Bank of England has indicated there are more rises to come. The question is how many? There is a split on the rate-setting committee here.\nThree of the nine voting members referred to \"rises\" plural. One member voted for a bigger increase, to 4.25%. Three referred to just one more including governor Andrew Bailey.\nMy read on this is that the expectation is for one more rise in February. Two and done, but it depends.\nIt is painful for those on variable mortgages, but should not be seen as the start of a cycle of hikes.\nPredicting where interest rates will go is like throwing darts at a board that constantly moves around the wall, with expectations of how long the Iran War will last and its impact on the economy and prices lurching from day to day.\nAt least there is no blindfold.\nThe Bank's forecasts indicate inflation is heading to just under 5% next spring as a typical household energy bill surges by 27% in January to £2,150 a year.\nWhy now?\nWhy have they raised now? High and rising inflation risks a further cycle of self fulfilling expectations of rising prices. It hasn't been seen so far, however. The war has lasted for 9 months, and led to oil prices used in the forecast averaging $108 a barrel.\nAnd yet on the day they have announced the rate rise, the oil price is actually 13% lower than that having fallen in the run up and after the US mid term elections, reflecting expectations or guesses that President Trump will now retreat or deescalate from the Iran war.\nThe other notable factor is that the UK economy is performing much better than forecasts and expectations. This is underlined by the Bank of England's latest forecasts.\nGrowth has been 0.6%, and 0.5% in the first two quarters of the year. It is heading for 0.7%, the Bank said, between July and September, before slowing in the three months to the end of the year. Unemployment has stabilised, actually falling a little.\nSome of this has fed through into a better performing currency, with sterling at its highest level since the Brexit referendum, when measured against a basket of currencies. This can help rein in inflation by making imports cheaper.\nSo, this is an unusual type of uncertainty. Even the expected further rise, probably in February next year is conditional on the war continuing.\nThe Bank of England stopped waiting for President Trump's war to end today, but perhaps the Democrats' resounding victory in the US midterm elections will stop the inflationary wave? The Bank has thrown a tentative first dart, and there is probably another to come.",

    "id": "three-ways-the-interest-rate-rise-could-542d6a55",
    "title": "Three ways the interest rate rise could affect you",
    "titleJa": "Three ways the interest rate rise could affect you",
    "summaryJa": "Job, loans and savings are all affected by the rise in interest rates announced by the Bank of England.",
    "bodyOriginal": "Three ways the interest rate rise could affect you\n- Published\nInterest rates have been raised for the first time in more than three years - and it could be good and bad news for you.\nHere are three ways the increase to 4% from 3.75% could affect you.\n1. Jobs and pay\nRate-setters at the Bank make changes to interest rates to fulfil their role of keeping price rises at a steady level.\nHigher rates are meant to encourage people to spend less, reducing demand for goods and services and limiting price rises.\nThis impacts businesses in two ways - less money to spend among their customers may mean they sell less, but also the cost of borrowing to invest as a company goes up.\nMany businesses, particularly small ones, have variable rate loans which are influenced by the Bank rate.\nFirms say higher rates limit their ability to offer new jobs and wage rises.\nMitchell Barnes, founder and chief executive of Ryse 3D, which manufactures 3D parts for the defence and automotive sectors, said the \"reality\" of rising interest rates was to look at the cost of employees and people.\nThat could include greater use of robots rather than workers.\n\"It's going to cause issues with, I suppose, employment across all sectors for people,\" he said.\n\"You're going to see reduced employment, more automation, more robotics being put into facilities, just in order to increase efficiency and make that money go further.\"\n2. Boost to savings\nThe Bank rate - and where it is expected to go in future - has a significant impact on the interest rates customers are offered on savings products.\nSo, if you're saving up for something quite expensive, like a holiday, or very expensive, like a home, then a rate rise could be good news.\nWhen interest rates were low throughout the 2010s, the returns for savers were poor, but borrowing costs were low too.\nThe answer then and now, according to experts, is to make sure you move your savings to benefit from the best possible rates.\nYou need £17,000 for a first home - here's how to save it\n- Published28 September\nFaisal Islam: How high will interest rates go?\n- Published6 hours ago\nLeaving your savings in an old account (a product not offered to new customers), rather than shopping around, can mean you are penalised for your loyalty.\n\"Savers have endured years of unrewarded loyalty, with those leaving [a £20,000 cash pot] in closed accounts losing out on an extra £139 over the past three years compared to on-sale easy access accounts,\" said Rachel Springall, from financial information service Moneyfacts.\nShe also said locking away your money for longer, with a fixed-term deal, is usually more lucrative.\nThe other flipside is that renting while you save could get more expensive, because a rising Bank rate may well increase costs for landlords.\n3. Mortgages and loans\nThe big losers from a rate rise are those who borrow money, and specifically those on variable rate mortgages.\nAbout 500,000 homeowners have a mortgage that \"tracks\" the Bank of England's rate.\nAny rise in the Bank rate means an increase in the monthly repayments on their outstanding loan. For a typical loan, the cost is going up by about £31 a month now the Bank has raised the base rate, but it depends on the size of people's loans.\nAn additional 500,000 homeowners on standard variable rates (SVRs) must wait to see if their lender chooses to pass on any Bank rate rise. Typically, this would mean a £14 increase per month in repayments for a 0.25 percentage points rates rise.\nIf you, like 87% of mortgage-holders, have a fixed-rate deal, then the payments will stay the same until the end of your current deal, which is usually two or five years.\nWhile monthly payments are not immediately affected by a rate change, future deals are. Lenders had already \"priced in\" the latest rate rise when quoting new deals. Expectations for the Bank rate into next year are crucial on what they offer next.\nThe average rate on fixed deals are much higher now than was predicted at the start of the year. It means those remortgaging, possibly after the post-Covid boom in the housing market, are facing the prospect of higher mortgage payments.\nSome people have been choosing to move onto tracker deals instead, taking a view - including some risk - of the Bank rate not moving towards a series of further hikes.\nGet in touch\nDo you have a mortgage, a credit card, a car finance agreement? How are interest rates affecting you?",
    "bodyJa": "Three ways the interest rate rise could affect you\n- Published\nInterest rates have been raised for the first time in more than three years - and it could be good and bad news for you.\nHere are three ways the increase to 4% from 3.75% could affect you.\n1. Jobs and pay\nRate-setters at the Bank make changes to interest rates to fulfil their role of keeping price rises at a steady level.\nHigher rates are meant to encourage people to spend less, reducing demand for goods and services and limiting price rises.\nThis impacts businesses in two ways - less money to spend among their customers may mean they sell less, but also the cost of borrowing to invest as a company goes up.\nMany businesses, particularly small ones, have variable rate loans which are influenced by the Bank rate.\nFirms say higher rates limit their ability to offer new jobs and wage rises.\nMitchell Barnes, founder and chief executive of Ryse 3D, which manufactures 3D parts for the defence and automotive sectors, said the \"reality\" of rising interest rates was to look at the cost of employees and people.\nThat could include greater use of robots rather than workers.\n\"It's going to cause issues with, I suppose, employment across all sectors for people,\" he said.\n\"You're going to see reduced employment, more automation, more robotics being put into facilities, just in order to increase efficiency and make that money go further.\"\n2. Boost to savings\nThe Bank rate - and where it is expected to go in future - has a significant impact on the interest rates customers are offered on savings products.\nSo, if you're saving up for something quite expensive, like a holiday, or very expensive, like a home, then a rate rise could be good news.\nWhen interest rates were low throughout the 2010s, the returns for savers were poor, but borrowing costs were low too.\nThe answer then and now, according to experts, is to make sure you move your savings to benefit from the best possible rates.\nYou need £17,000 for a first home - here's how to save it\n- Published28 September\nFaisal Islam: How high will interest rates go?\n- Published6 hours ago\nLeaving your savings in an old account (a product not offered to new customers), rather than shopping around, can mean you are penalised for your loyalty.\n\"Savers have endured years of unrewarded loyalty, with those leaving [a £20,000 cash pot] in closed accounts losing out on an extra £139 over the past three years compared to on-sale easy access accounts,\" said Rachel Springall, from financial information service Moneyfacts.\nShe also said locking away your money for longer, with a fixed-term deal, is usually more lucrative.\nThe other flipside is that renting while you save could get more expensive, because a rising Bank rate may well increase costs for landlords.\n3. Mortgages and loans\nThe big losers from a rate rise are those who borrow money, and specifically those on variable rate mortgages.\nAbout 500,000 homeowners have a mortgage that \"tracks\" the Bank of England's rate.\nAny rise in the Bank rate means an increase in the monthly repayments on their outstanding loan. For a typical loan, the cost is going up by about £31 a month now the Bank has raised the base rate, but it depends on the size of people's loans.\nAn additional 500,000 homeowners on standard variable rates (SVRs) must wait to see if their lender chooses to pass on any Bank rate rise. Typically, this would mean a £14 increase per month in repayments for a 0.25 percentage points rates rise.\nIf you, like 87% of mortgage-holders, have a fixed-rate deal, then the payments will stay the same until the end of your current deal, which is usually two or five years.\nWhile monthly payments are not immediately affected by a rate change, future deals are. Lenders had already \"priced in\" the latest rate rise when quoting new deals. Expectations for the Bank rate into next year are crucial on what they offer next.\nThe average rate on fixed deals are much higher now than was predicted at the start of the year. It means those remortgaging, possibly after the post-Covid boom in the housing market, are facing the prospect of higher mortgage payments.\nSome people have been choosing to move onto tracker deals instead, taking a view - including some risk - of the Bank rate not moving towards a series of further hikes.\nGet in touch\nDo you have a mortgage, a credit card, a car finance agreement? How are interest rates affecting you?",

    "summaryJa": "U.S. midterm results could slow data center development, raising the value of existing AI capacity while increasing pressure on debt-funded neoclouds.",
    "bodyOriginal": "The U.S. midterms could widen the AI divide: tighter data center rules may reward tech giants with capacity in hand and squeeze debt-funded companies trying to catch up.\nDemocratic victories in key gubernatorial races raised the prospect of tougher scrutiny for data center projects, adding to investor concerns about how quickly new capacity can be built and financed.\nIn Texas, Democratic governor-elect Gina Hinojosa has proposed a statewide moratorium on new data center permits, although projects already under construction would reportedly be exempt.\nAs the markets digested the results on Wednesday, Microsoft and Amazon each surged more than 6%, while AI infrastructure provider CoreWeave plunged around 10%. Chipmakers Micron and Nvidia fell 7% and 3.17%, respectively.\nDifferences in borrowing costs are playing a key role in the split, James Sullivan, managing director and co-head of global fundamental research at JPMorgan, told CNBC's \"Squawk Box Asia\" on Thursday.\nSullivan said borrowing spreads have widened significantly for neocloud companies, leaving their cost of additional capital substantially higher than that of hyperscalers that benefit from more diversified customers and revenue streams.\n\"The fact that you're seeing this bifurcation in equity performance is largely driven by the view that existing capacity is significantly more valuable now because of incremental supply constraints,\" he said.\nData center risks\nThe midterm results could reinforce that view if they make new projects more vulnerable to permitting delays.\nBMI warned that a sharp slowdown in data center construction and AI investment could produce a greater-than-expected decline in overall investment, The Business Times reported, citing the firm's post-midterm analysis.\nThe potential impact is uneven across the construction pipeline. Much of the data center capacity expected to come online in 2027 is already under construction, limiting the near-term impact of new restrictions.\nProjects planned for 2028 face greater exposure to permitting delays and regulatory uncertainty, investment bank Nomura said in a note Wednesday about the midterm results.\nTighter regulations on data center construction could become a more significant headwind to AI investment from 2028, the firm said.\nAI financing gap\nShares of Nvidia-backed neocloud CoreWeave, Nebius and Iren fell at least 30% in October, as tightening credit markets raised questions about how AI infrastructure projects would be financed. CoreWeave's five-year credit default swap spread has surged past 1,100 basis points, reflecting rising costs for investors seeking protection against a potential default.\nThe distinction may be how well companies can absorb delays and fund the capacity they do build. Hyperscalers have broader cloud businesses and more internally generated cash flow, while lower-rated neoclouds face greater exposure to borrowing costs, energy prices and refinancing conditions, JPMorgan Asset Management said in an Oct. 20 research note.\nThe asset manager said financially stronger hyperscalers could also secure cheaper capacity or acquire assets if weaker operators scale back.",
    "bodyJa": "The U.S. midterms could widen the AI divide: tighter data center rules may reward tech giants with capacity in hand and squeeze debt-funded companies trying to catch up.\nDemocratic victories in key gubernatorial races raised the prospect of tougher scrutiny for data center projects, adding to investor concerns about how quickly new capacity can be built and financed.\nIn Texas, Democratic governor-elect Gina Hinojosa has proposed a statewide moratorium on new data center permits, although projects already under construction would reportedly be exempt.\nAs the markets digested the results on Wednesday, Microsoft and Amazon each surged more than 6%, while AI infrastructure provider CoreWeave plunged around 10%. Chipmakers Micron and Nvidia fell 7% and 3.17%, respectively.\nDifferences in borrowing costs are playing a key role in the split, James Sullivan, managing director and co-head of global fundamental research at JPMorgan, told CNBC's \"Squawk Box Asia\" on Thursday.\nSullivan said borrowing spreads have widened significantly for neocloud companies, leaving their cost of additional capital substantially higher than that of hyperscalers that benefit from more diversified customers and revenue streams.\n\"The fact that you're seeing this bifurcation in equity performance is largely driven by the view that existing capacity is significantly more valuable now because of incremental supply constraints,\" he said.\nData center risks\nThe midterm results could reinforce that view if they make new projects more vulnerable to permitting delays.\nBMI warned that a sharp slowdown in data center construction and AI investment could produce a greater-than-expected decline in overall investment, The Business Times reported, citing the firm's post-midterm analysis.\nThe potential impact is uneven across the construction pipeline. Much of the data center capacity expected to come online in 2027 is already under construction, limiting the near-term impact of new restrictions.\nProjects planned for 2028 face greater exposure to permitting delays and regulatory uncertainty, investment bank Nomura said in a note Wednesday about the midterm results.\nTighter regulations on data center construction could become a more significant headwind to AI investment from 2028, the firm said.\nAI financing gap\nShares of Nvidia-backed neocloud CoreWeave, Nebius and Iren fell at least 30% in October, as tightening credit markets raised questions about how AI infrastructure projects would be financed. CoreWeave's five-year credit default swap spread has surged past 1,100 basis points, reflecting rising costs for investors seeking protection against a potential default.\nThe distinction may be how well companies can absorb delays and fund the capacity they do build. Hyperscalers have broader cloud businesses and more internally generated cash flow, while lower-rated neoclouds face greater exposure to borrowing costs, energy prices and refinancing conditions, JPMorgan Asset Management said in an Oct. 20 research note.\nThe asset manager said financially stronger hyperscalers could also secure cheaper capacity or acquire assets if weaker operators scale back.",

    "title": "Democrats won on affordability. Can they deliver it?",
    "titleJa": "Democrats won on affordability. Can they deliver it?",
    "summaryJa": "Democrats will hold Congress but President Donald Trump still has the power to block their plans.",
    "bodyOriginal": "Democrats won on affordability. Can they deliver it?\n- Published\nTwo business owners, half a country apart, want the same thing for different reasons.\nIn Texas, Kim Hanks, who owns Tillies, a hotel, restaurant and spa business near Austin, says rising grocery and fuel costs are forcing her to raise wages for her 300 staff.\n\"It's been such a moving target for us on affordability,\" she told the BBC World Service.\nIn Indiana, Danny Reynolds, who runs Stephenson's of Elkhart, a clothing and bridalwear store, simply wants Washington to get its act together.\n\"My hope is that we can just find some consistency, some working together,\" he said.\nDemocrats say they heard both messages.\n\"We ran on affordability, we won on affordability, and now it's our job to govern on affordability,\" said House Democratic leader Hakeem Jeffries on MS Now's Morning Joe.\nBut here comes the difficult part. Democrats will hold Congress. Donald Trump still has the power to block their plans.\nA message that cut through\nThe scale of the win was bigger than most forecasters expected, with at least seven Republican-held Senate seats changing hands.\nBehind the result was a striking mood: just 21% of Americans are satisfied with the direction of the country, even though the economy looks healthy on paper.\nVoters weren't looking at the statistics. They were looking at their grocery bills, electricity bills and the price at the petrol pump.\nIn rural Texas, rising costs were even hurting Republicans in their own backyard. Sid Miller, the outgoing Republican agriculture commissioner, told me ranchers are getting $300 to $500 less for each head of cattle, while also facing record fertiliser costs.\n\"They felt betrayed,\" he said.\nThis was more than a blue wave. It was a vote about the cost of living. So what can Democrats actually do about it?\nThe affordability plan\nUnder the banner \"Fighting for an Affordable America,\" Democrats say healthcare is their first priority.\nThey want to bring back the extra financial help that made health insurance cheaper under the Affordable Care Act and reverse the cuts to Medicaid signed by President Trump in 2025.\nNext come tariffs and energy. Democrats want to scrap the president's import taxes, which they say add thousands of dollars a year to the cost of groceries, fertiliser and building materials.\nThey also want to end the war in Iran, which they link to petrol prices averaging $4.18 a gallon, marking an increase of nearly 40%.\nHousing is next. Some Democrats want to build four million new homes over the next decade.\nOn tax, they want to make billionaires pay more and increase tax credits for families with children.\nIt's a long list. But how much of it can they actually deliver?\nWhat can they actually pass?\nInvestor Ken Fisher, founder of Fisher Investments, puts it bluntly:\n\"Congress can't get anything past a presidential veto. President Trump can't get anything he wants.\"\nThe result, he says, is likely to be two years of relative quiet on the legislative and regulatory front.\nIn other words, winning in Congress does not give Democrats a free hand. President Trump can still block legislation, and getting around a presidential veto requires a two-thirds majority in both the House and Senate.\nWhat Democrats can and can't do with their new power after taking Congress\n- Published12 hours ago\nFor voters hoping for lower bills, that may be a disappointing result. They didn't vote for political deadlock.\nTake tariffs. Trump is unlikely to abandon a trade policy that is central to his agenda. Democrats will need Republican support if they want to change it.\nBernard Yaros, deputy chief US economist at Oxford Economics, expects the average tariff rate on imports to stay around 10% for the rest of Trump's term.\nAnd there's another complication.\nTariffs are bringing in more money for the government. Import taxes accounted for just over 1% of federal revenue in 2024. This year, they account for more than 5%.\nThat growing contribution to government income, Yaros argues, will make tariffs \"tough for a future administration to fully dismantle.\"\nStill, there are bargains to be struck.\nWhere the deals might be\nPresident Trump told CNBC he could work with Democrats on \"many more things than people understand\".\nHealthcare might be one of them.\nYaros sees the possibility of a big political trade-off: Democrats agree to extend Republican tax cuts in return for restoring health insurance subsidies. But he doesn't expect a deal until late 2027, with the economic benefits arriving in 2028. That's a long time to wait for anyone struggling with bills today.\nDemocrats could also turn up the pressure on businesses.\nHenrietta Treyz of consultants Veda Partners says Democrats will question companies that passed on the cost of tariffs to customers.\nAfter the Supreme Court ruling in February, she says, the question will be: \"Did you turn around, take that tariff rebate, and then lower prices for consumers?\"\nCompanies will also be asked: \"What did you get in exchange?\"\nDemocrats, she adds, will \"pick and choose very carefully.\"\nIn the Senate, Ron Wyden, the Oregon Democrat set to chair the Finance Committee, has summed up his approach in five words: \"affordability for us, accountability for them.\"\nHe says he will use the committee to \"reassert congressional authority\" over trade policy. Insurers, drugmakers and banks should expect to be called to explain themselves.\nAnd some of the biggest changes may happen closer to home. State governors and regulators have a say in electricity prices, while local authorities decide where new homes can be built.\nDemocrats have won governorships in Texas, Ohio and Georgia, where the rising cost of electricity for data centres is already a concern.\nThe part they can't control\nThe hardest test may be something Democrats cannot fix with a new law.\nThe price of petrol, diesel and fertiliser will depend heavily on what happens in the war with Iran. And forecasters disagree about what comes next.\nOxford Economics warns that with the election over, further escalation \"appears more likely,\" because petrol prices will no longer be as much of a political concern for the president.\nAnd here's the awkward part. If prices come down, Democrats may struggle to claim the credit. If they go up, they may share the blame.\nThere is an immediate test, too. Government funding runs out after 11 December, and the chances of another shutdown look uncomfortably high.\nDemocrats won the argument. Now they have to show they can make life cheaper.",

    "id": "russia-china-may-be-more-aggressive-if-t-cab74c8c",
    "title": "Russia, China may be more aggressive if they feel Trump is on 'his way out': Brookings",
    "titleJa": "Russia, China may be more aggressive if they feel Trump is on 'his way out': Brookings",
    "summaryJa": "Russia and China may be more aggressive if they feel that U.S. President Donald Trump is on \"his way out\" after the Democratic Party flipped the midterms.",
    "bodyOriginal": "Russia and China could become more aggressive over the next two years if they conclude that President Donald Trump is politically weakened and on \"his way out\" after Democrats won control of both chambers of Congress, Brookings Institution senior fellow Robert Kagan told CNBC.\nSpeaking on \"Squawk Box Asia,\" Kagan said the war with Iran had also exposed how Washington has \"proved itself rather incapable militarily\" in terms of capacity, which would be critical in Asia.\n\"Everybody can see how much our stocks are depleted in terms of interceptors and missiles, which are of vital interest in the Asian theater,\" he said.\nCongressional Budget Office reports have estimated that the conflict depleted as much as two-thirds of U.S. missile-defense interceptors since June 2025, largely because of efforts to defend Israel against Iranian attacks. This could leave the U.S. with constrained inventories for several years.\nKagan said the deployment of three U.S. aircraft carriers to the Middle East had reduced the U.S. naval presence available in Asia, potentially giving China more room to act assertively in the region.\n\"I think Trump's only interest right now is in cutting economic deals with China. I don't think he has any real interest in confronting China, but that is going to lead China to be even more aggressive,\" he said.\nIn December, Trump approved an $11 billion arms package for Taiwan, but later held back on a second package worth about $14 billion, calling it a \"bargaining chip\" in talks with China.\nChina claims self-governing Taiwan as its territory. While Washington does not have a mutual defense treaty with the island, U.S. law requires it to provide Taiwan with the means to defend itself.\nFormer CIA Director William Burns said in 2023 that Chinese President Xi Jinping had instructed the military to be ready to invade Taiwan by 2027, while stressing that this did not mean Xi had decided to launch an invasion that year or at all.\nKagan's comments come as U.S., China and Russia discuss a possible trilateral summit between Trump, Xi and President Vladimir Putin at the APEC Leaders' meeting in Shenzhen later this month.\nChinese Foreign Ministry spokesperson Mao Ning said Wednesday that Beijing was \"in communication with relevant parties regarding a meeting between the three heads of state,\" although no agenda has been announced.\nPutin had reportedly floated the idea of a three-way summit with Trump and Xi in October to discuss ending the war in Ukraine, without Ukrainian President Volodymyr Zelenskyy at the table.\n\"If it's clear that Donald Trump is on his way out, and the United States may be returning to something like normal, I don't want to overstate that, but they may feel both of them, both Russia and China, may feel that the time to move is in the next two years,\" Kagan said.",
    "bodyJa": "Russia and China could become more aggressive over the next two years if they conclude that President Donald Trump is politically weakened and on \"his way out\" after Democrats won control of both chambers of Congress, Brookings Institution senior fellow Robert Kagan told CNBC.\nSpeaking on \"Squawk Box Asia,\" Kagan said the war with Iran had also exposed how Washington has \"proved itself rather incapable militarily\" in terms of capacity, which would be critical in Asia.\n\"Everybody can see how much our stocks are depleted in terms of interceptors and missiles, which are of vital interest in the Asian theater,\" he said.\nCongressional Budget Office reports have estimated that the conflict depleted as much as two-thirds of U.S. missile-defense interceptors since June 2025, largely because of efforts to defend Israel against Iranian attacks. This could leave the U.S. with constrained inventories for several years.\nKagan said the deployment of three U.S. aircraft carriers to the Middle East had reduced the U.S. naval presence available in Asia, potentially giving China more room to act assertively in the region.\n\"I think Trump's only interest right now is in cutting economic deals with China. I don't think he has any real interest in confronting China, but that is going to lead China to be even more aggressive,\" he said.\nIn December, Trump approved an $11 billion arms package for Taiwan, but later held back on a second package worth about $14 billion, calling it a \"bargaining chip\" in talks with China.\nChina claims self-governing Taiwan as its territory. While Washington does not have a mutual defense treaty with the island, U.S. law requires it to provide Taiwan with the means to defend itself.\nFormer CIA Director William Burns said in 2023 that Chinese President Xi Jinping had instructed the military to be ready to invade Taiwan by 2027, while stressing that this did not mean Xi had decided to launch an invasion that year or at all.\nKagan's comments come as U.S., China and Russia discuss a possible trilateral summit between Trump, Xi and President Vladimir Putin at the APEC Leaders' meeting in Shenzhen later this month.\nChinese Foreign Ministry spokesperson Mao Ning said Wednesday that Beijing was \"in communication with relevant parties regarding a meeting between the three heads of state,\" although no agenda has been announced.\nPutin had reportedly floated the idea of a three-way summit with Trump and Xi in October to discuss ending the war in Ukraine, without Ukrainian President Volodymyr Zelenskyy at the table.\n\"If it's clear that Donald Trump is on his way out, and the United States may be returning to something like normal, I don't want to overstate that, but they may feel both of them, both Russia and China, may feel that the time to move is in the next two years,\" Kagan said.",

    "title": "Inside the chip talent war: Trade secrets and rising Chinese rivals",
    "titleJa": "Inside the chip talent war: Trade secrets and rising Chinese rivals",
    "summaryJa": "Growing competition for semiconductor talent is fueling a battle over trade secrets as Chinese chipmakers gain ground.",
    "bodyOriginal": "A former Samsung Electronics employee who later joined Chinese memory chipmaker ChangXin Memory Technologies, or CXMT, was reportedly sentenced by the Seoul High Court on Oct. 22 to five years in prison for leaking Samsung's technology.\nThe sentence was reduced from seven years at his first trial in April. The former employee had joined CXMT in 2016.\nThe case highlights an intensifying battle over semiconductor know-how as Chinese chipmakers narrow the gap with established rivals, putting the race for top engineering talent increasingly at odds with efforts to protect trade secrets.\nIn 2023, a South Korean court granted Samsung's request to block a former DRAM researcher from joining U.S. rival Micron. It ruled that the two-year non-compete was not excessive and was necessary to protect Samsung's technology and business information, JoongAng Ilbo reported.\nClosing the gap\nA decade ago, Chinese memory chipmakers were not Samsung's biggest concern when it came to losing experienced engineers.\nInstead, the South Korean company was more focused on employees leaving for established rivals such as SK Hynix and Micron, according to a former employee who asked not to be identified because the information was private.\nSamsung has been monitoring where certain departing employees went — to signal to remaining staff that moving to competitors would be difficult — according to a former employee.\nThe company also used non-compete agreements restricting employees from joining rivals for two years, as part of their employment contracts, with senior employees holding valuable technical expertise likely facing closer scrutiny.\nBut Samsung's concern extended beyond individual departures.\n\"It wasn't just about one employee leaving. The company wanted to send a message to those who stayed that moving to a competitor wouldn't be easy,\" the former employee said.\nMeanwhile, Chinese semiconductor companies have sought to close the technology gap by recruiting experienced overseas engineers with high salaries, stock options, housing and family support, according to Jeongku Choi, a senior analyst at Counterpoint Research.\nTheir expertise has helped Chinese chipmakers overcome technical bottlenecks, particularly as U.S. export restrictions have limited China's access to advanced chipmaking equipment, Choi said.\nOnce viewed as unlikely to catch up with established players, Chinese manufacturers are now seen as \"meaningful competitors,\" she added.\nCounterpoint's Memory Tracker for the second quarter of 2026 projected CXMT's share of global DRAM revenue would reach 10%.\nEstablished chipmakers are strengthening legal protections and internal security measures while adjusting compensation packages to retain key engineers, according to Choi.\nSouth Korea has also designated certain semiconductor manufacturing technologies as \"National Core Technologies,\" raising the penalties for unauthorized leaks of those technologies, Choi said.\nThe legal battle could intensify as Chinese memory companies expand beyond their home market.\n\"I believe that this management of trade secrets will expand its scope even further to IP and legal areas once Chinese memory companies move beyond the Chinese market and begin to expand their exports,\" Choi said.\nProtecting trade secrets\nThe growing competition is putting greater focus on how semiconductor companies protect the knowledge accumulated by engineers working on complex manufacturing processes.\nIn Taiwan, home to the world's largest contract chipmaker TSMC, protections for trade secrets have evolved alongside the semiconductor industry’s growing strategic importance.\nJamie J. Yang, a partner specializing in antitrust and intellectual property at Innovatus Law, said Taiwan limits post-employment non-compete agreements to two years and requires employers to compensate former employees at least half their average monthly salary during the restricted period.\nYang added that the complexity of semiconductor manufacturing makes it difficult for any single engineer to possess enough knowledge to replicate an entire production line elsewhere.\n\"There is just very little chance that one person ... will know enough to replicate that line in any of the other companies,\" Yang said.\nMoves by engineers between rival semiconductor companies could increase modestly as competition for top talent intensifies, while trade secret litigation is also likely to rise as firms seek to protect their technological edge, she added.\nBut the challenges extend beyond Taiwan.\nIn Singapore, Zechariah Chan, a partner at law firm Lee & Lee, said protecting trade secrets can be particularly difficult in the semiconductor industry, where proprietary knowledge often involves intangible manufacturing techniques and methods.\nYou cannot 'take' the information back after the engineer has become aware of it.Zechariah ChanPartner, Lee & Lee Law Firm\nProving that a competitor has used proprietary manufacturing techniques can also be difficult, as outsiders generally see only the final product, according to Chan.\n\"There is no bright line between an engineer's expertise and proprietary information,\" he said. General skills and knowledge stay with the engineer, while trade secrets remain with the company.\nIn Singapore, non-compete clauses are enforceable only if they protect legitimate business interests and are reasonable in scope, geographical area and duration.\nIn Hong Kong, courts generally take a restrictive approach to non-compete clauses, enforcing them only when they protect legitimate business interests and go no further than necessary, according to Jezamine Fewins, head of litigation at Lewis Silkin in Hong Kong.\nCourts are more willing to protect trade secrets through court injunctions, Fewins said.\n\"The difficulty is that often the trade secret is carried in the employee's head,\" she added. Information is more likely to qualify as a trade secret if its disclosure to a competitor could cause significant harm to the former employer and the company has taken steps to restrict access.\nFor chipmakers, Fewins said the key is to clearly define what constitutes a trade secret, make employees aware of that information and put safeguards in place to limit access.\nSamsung and CXMT did not respond to CNBC's request for comment.",

y of semiconductor manufacturing makes it difficult for any single engineer to possess enough knowledge to replicate an entire production line elsewhere.\n\"There is just very little chance that one person ... will know enough to replicate that line in any of the other companies,\" Yang said.\nMoves by engineers between rival semiconductor companies could increase modestly as competition for top talent intensifies, while trade secret litigation is also likely to rise as firms seek to protect their technological edge, she added.\nBut the challenges extend beyond Taiwan.\nIn Singapore, Zechariah Chan, a partner at law firm Lee & Lee, said protecting trade secrets can be particularly difficult in the semiconductor industry, where proprietary knowledge often involves intangible manufacturing techniques and methods.\nYou cannot 'take' the information back after the engineer has become aware of it.Zechariah ChanPartner, Lee & Lee Law Firm\nProving that a competitor has used proprietary manufacturing techniques can also be difficult, as outsiders generally see only the final product, according to Chan.\n\"There is no bright line between an engineer's expertise and proprietary information,\" he said. General skills and knowledge stay with the engineer, while trade secrets remain with the company.\nIn Singapore, non-compete clauses are enforceable only if they protect legitimate business interests and are reasonable in scope, geographical area and duration.\nIn Hong Kong, courts generally take a restrictive approach to non-compete clauses, enforcing them only when they protect legitimate business interests and go no further than necessary, according to Jezamine Fewins, head of litigation at Lewis Silkin in Hong Kong.\nCourts are more willing to protect trade secrets through court injunctions, Fewins said.\n\"The difficulty is that often the trade secret is carried in the employee's head,\" she added. Information is more likely to qualify as a trade secret if its disclosure to a competitor could cause significant harm to the former employer and the company has taken steps to restrict access.\nFor chipmakers, Fewins said the key is to clearly define what constitutes a trade secret, make employees aware of that information and put safeguards in place to limit access.\nSamsung and CXMT did not respond to CNBC's request for comment.",

    "title": "LIV Golf faces liquidation after BC Partners scraps rescue plan",
    "titleJa": "LIV Golf faces liquidation after BC Partners scraps rescue plan",
    "summaryJa": "LIV Golf faces liquidation after BC Partners dropped a proposed $300 million rescue plan amid insufficient player commitments.",
    "bodyOriginal": "LIV Golf could be headed for liquidation after BC Partners Credit reportedly dropped plans to finance a relaunch of the breakaway league.\nThe investment firm had pledged up to $300 million for a revamped version of LIV, known as LIV 2.0, but withdrew the plan after LIV Golf failed to secure enough player commitments, according to the Associated Press.\nLIV is scheduled to appear in U.S. bankruptcy court Thursday, with the hearing now expected to focus on liquidation of its assets. The league's ultimate fate remains unclear.\nLIV Golf and BC Partners did not immediately respond to CNBC's requests for comment.\nLIV filed for Chapter 11 bankruptcy protection in September after Saudi Arabia's Public Investment Fund said it would stop funding the league after the 2026 season.\nPIF had invested more than $5 billion since LIV launched in 2022, according to its Chapter 11 filing.\nBC Partners' proposed relaunch would have made players majority owners of the reorganized league and featured a scaled-back schedule.\nBut LIV has lost several prominent players, including Jon Rahm and Sergio Garcia, as it sought commitments for the new venture.\nRahm said Tuesday that uncertainty over the league's future and proposed changes to its format influenced his decision to leave.\n\"There were too many unknowns at the time, and there's still quite a few,\" he told reporters ahead of the Abu Dhabi Championship. Rahm added that the revamped competition appeared to be moving away from the team format that initially attracted him.\nGarcia, who secured a release from his LIV contract in October, has outlined plans to return to the DP World Tour and explore a possible return to the PGA Tour.\nOnly four players had publicly committed to LIV 2.0: Richard Bland, Cameron Tringale, Brendan Steele and Ben Campbell, according to Golf Digest.\nLIV launched in 2022 as a challenger to the PGA Tour, recruiting prominent players including Phil Mickelson, Dustin Johnson and Bryson DeChambeau with lucrative contracts.\nIts arrival split men's professional golf, with the PGA Tour suspending members who competed in LIV events. The disputes later spilled into the courts, with players challenging suspensions and the rival organizations pursuing competing legal claims.\nThe PGA Tour denied the allegations, while LIV dismissed the counterclaims.\nA June 2023 framework agreement between the PGA Tour, DP World Tour and PIF ended their litigation and proposed combining their commercial businesses, although the deal was never completed.",
