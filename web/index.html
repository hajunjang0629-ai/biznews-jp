    "titleJa": "スペースXはルイジアナ州に1000億ドル規模の宇宙港を建設する計画",
    "summaryJa": "イーロン・マスク氏は、彼の航空宇宙・技術複合企業スペースXとともに米国南部への進出を続けており、ルイジアナ州に1000億ドル規模の新しい打ち上げ施設を計画している。ルイジアナ州経済開発局は共同声明の中で、スペースXが「年間数千回の打ち上げを支援する」ため、ルイジアナ州バーミリオン教区にスターベースを設立すると述べた。",
    "bodyOriginal": "Elon Musk is continuing his push into the Southern U.S. with SpaceX, his aerospace and tech conglomerate, planning a $100 billion new launch facility in Louisiana.\nIn a joint statement, the Louisiana Economic Development office said that SpaceX will establish its Starbase, Louisiana in Vermillion Parish to, \"support thousands of launches annually.\"\nShares of SpaceX rose about 2.5% on Tuesday after the announcement.\nOnce built, Starbase, LA will serve as the main launch facility for Starship, SpaceX's in-development rocket that is the largest ever built or flown, and which is designed to be fully re-usable.\nMusk has ambitions to massively expand SpaceX's Starlink satellite network, to launch orbital data centers, and someday colonize Mars. Those ambitions, and justification for SpaceX's nearly $2 trillion market cap, hinge on the success of Starship.\nSpaceX said, in a video posted to its website on Tuesday, that the search for a site to build launch pads and have access to ample fuel for its operations took about 7 years. Musk said in the video that the company would bring \"probably 10,000 really exciting jobs\" to Louisiana with the spaceport.\nIn the Tuesday announcement, SpaceX said it would work on a \"historic coastal restoration\" in Louisiana, in partnership with the state to \"bring the marsh back\" and ensure the wetlands around its new facility will have \"storm protection.\"\nPreviously, SpaceX has faced community backlash, lawsuits and fines following environmental violations at its first Starbase facility in Boca Chica, Texas, in the company town now known as Starbase.\nIn its first test flight of Starship in April 2023 in Texas, energy from the rocket caused SpaceX's concrete launchpad to explode, and its spacecraft to blow up in mid-air. Chunks of concrete were flung into a nesting and migration site important to some endangered species nearby and a fire chewed through around 4 acres of Boca Chica State Park Land south of the Texas launchpad.\nIn 2024, SpaceX was also found to have violated the Clean Water Act at the Texas launch facility by repeatedly releasing pollutants into or near bodies of water in Texas, a state agency said in a notice of violation focused on its water deluge system.\nSpaceX's work in Louisiana follows Musk's move from California into Texas, Tennessee and Mississippi. The company said Louisiana was its fourth launch site.\nMusk's AI venture, now known as SpaceXAI, built out its Colossus data centers and a power plant in Greater Memphis. Before that, Musk relocated the headquarters of his automaker, Tesla, from California to Austin, Texas. Tesla now operates a massive vehicle assembly plant in Austin and is testing its driverless, Robotaxi service and Cybercab vehicles in the region.\nTesla and SpaceX, in partnership with Intel, also plan to build a massive AI chip factory in Grimes County, Texas.\nCNBC's Kif Leswing contributed to this story.",
    "bodyJa": "イーロン・マスク氏は、彼の航空宇宙・技術複合企業スペースXとともに米国南部への進出を続けており、ルイジアナ州に1000億ドル規模の新しい打ち上げ施設を計画している。\nルイジアナ州経済開発局は共同声明の中で、スペースXが「年間数千回の打ち上げを支援する」ため、ルイジアナ州バーミリオン教区にスターベースを設立すると述べた。\nこの発表を受けてスペースXの株価は火曜日に約2.5％上昇した。\nロサンゼルスのスターベースが建設されると、スターシップの主要な打ち上げ施設として機能します。スターシップは、これまでに建造または飛行された中で最大の、完全に再利用できるように設計されたスペースXの開発中のロケットです。\nマスク氏は、スペースXのスターリンク衛星ネットワークを大規模に拡張し、軌道上データセンターを立ち上げ、いつかは火星に植民地化するという野望を抱いている。こうした野心と、スペースX社の2兆ドル近い時価総額の正当性は、スターシップの成功にかかっている。\nスペースXは火曜日にウェブサイトに投稿したビデオの中で、発射台を建設し、運用に必要な十分な燃料を入手できる場所の探索には約7年かかったと述べた。マスク氏はビデオの中で、同社は宇宙港によってルイジアナ州に「おそらく1万人の本当に刺激的な雇用」をもたらすだろうと語った。\n火曜日の発表でスペースXは、州と協力してルイジアナ州の「歴史的な海岸修復」に取り組み、「湿地を取り戻し」、新施設周辺の湿地が「暴風雨から守る」ことを確保すると発表した。\nスペースXはこれまで、テキサス州ボカチカにある同社初のスターベース施設（現在はスターベースとして知られる企業街）での環境違反を受けて、地域社会の反発、訴訟、罰金に直面していた。\n2023年4月にテキサス州で行われたスターシップの最初の試験飛行では、ロケットからのエネルギーによりスペースX社のコンクリート発射台が爆発し、宇宙船は空中で爆発した。近くのいくつかの絶滅危惧種にとって重要な営巣地と移動地にコンクリートの塊が投げ込まれ、火災はテキサス州発射台の南にあるボカチカ州立公園の土地約4エーカーを焼き尽くした。\n2024年には、スペースX社がテキサス州の水域内またはその近くに汚染物質を繰り返し放出し、テキサス州の打ち上げ施設で浄水法に違反したことも判明したと、州当局は水氾濫システムに焦点を当てた違反通告の中で述べた。\nスペースXのルイジアナでの取り組みは、マスク氏がカリフォルニアからテキサス、テネシー、ミシシッピに移ったことに続くものである。同社は、ルイジアナ州が4番目の発射場であると述べた。\n現在SpaceXAIとして知られるマスク氏のAIベンチャーは、グレーターメンフィスにColossusデータセンターと発電所を建設した。その前に、マスク氏は自動車メーカー、テスラの本社をカリフォルニアからテキサス州オースティンに移転した。テスラは現在、オースティンで大規模な車両組立工場を運営しており、同地域で無人運転車、ロボタクシーサービス、サイバーキャブ車両をテストしている。\nテスラとスペースXはインテルと提携し、テキサス州グライムズ郡に大規模なAIチップ工場を建設する計画もある。\nCNBC のキフ・レスウィングがこの記事に寄稿しました。",

    "bodyOriginal": "Iran and Oman on Tuesday discussed a proposal to establish a temporary joint shipping route through the Strait of Hormuz as well as a mission to clear mines from the key oil export corridor.\nOman's Foreign Minister Sayyid Badr bin Hamad Albusaidi said he was hopeful a corridor through Hormuz and \"practical arrangements to restore safe navigation\" will be announced soon. He described talks with Iran's top diplomat Seyed Abbas Araghchi in Tehran as constructive.\n\"Future management of the Strait and a permanent solution will follow in due course,\" Oman's foreign minister said in a social media post. \"Discussions with regional partners will be conducted in support of peace and cooperation, stability and freedom of navigation.\"\nThe proposed framework with Iran includes a joint project to clear the strait of mines, Oman's Foreign Ministry said in a social media post after the diplomats' meeting. Muscat and Tehran would continue talks to reach an agreement on a permanent corridor and administration system for the strait, the ministry said.\nOman's reference to a mine clearing mission appeared to contradict President Donald Trump's statement earlier Tuesday that the U.S. Navy informed him all mines had been removed from international waters in Hormuz.\nOman's discussions with Iran come a day after Treasury Secretary Scott Bessent said the U.S. will sanction any entity that does business with the Islamic Republic. Trump threatened to bomb Oman earlier this month when Fox News asked him about Muscat's talks with Tehran on Hormuz.\nIran and Oman are holding talks under a provision in the memorandum of understanding signed by Washington and Tehran on June 17. The interim deal said Iran and Oman would hold talks to \"define the future administration and maritime services\" in Hormuz.\nBut the MOU quickly collapsed as the U.S. and Iran started fighting over shipping lanes. The U.S. military protects ships that use a southern route along Oman's coast. U.S. Central Command has said more than 660 million barrels of crude oil have exited Hormuz under its protection since May.\nIran demands that ships use a northern route through its territorial waters to transit the strait or risk coming under attack.\nAn oil tanker was struck by an unknown projectile and disabled near Oman on Monday, according to an incident report from the United Kingdom Maritime Trade Operations Centre. Two cargo ships came under attack in Hormuz last week resulting in the deaths of two sailors.",

    "id": "is-the-k-shaped-economy-ending-finance-p-02fcc1c8",
    "title": "Is the K-shaped economy ending? Finance pros weigh in",
    "titleJa": "K字型経済は終わるのか？金融の専門家が意見を言う",
    "summaryJa": "K 字型経済は、拡大する永続的な経済格差の略語となっています。つまり、高所得のアメリカ人が富、支出、経済的安全の面でさらに先を行っている一方で、多くの低所得世帯が追いつくのに苦労しています。今、その形は変わりつつあるのかもしれない。",
    "bodyOriginal": "The K-shaped economy has become shorthand for a widening, persistent economic divide: higher-income Americans pulling further ahead — in wealth, spending, and financial security — while many lower-income households struggle to keep up.\nNow, that shape may be shifting.\n\"I got sick of hearing about this K-shaped economy,\" Treasury Secretary Scott Bessent told CNBC's \"Squawk Box\" earlier this month. \"I can say here definitively, the K-shaped economy is over.\"\n\"We're seeing more of a 'C' economy where the lower end of wage earners are finally clawing it back,\" Bessent said.\nWhat is a K-shaped economy?\nThe \"shape\" of the economy refers to the shape of the letter.\nIn a K-shaped economy, for example — a term that emerged during the Covid-19 pandemic — the arm and leg of the K widen, representing divergent experiences for low- and high-earning households.\nSome recent data shows wage and spending gaps between most higher-income and lower-income households are beginning to close. In other words, they are starting to converge, like the ends of the letter \"C.\"\nThat matters because it could signal a meaningful change in the distribution of economic strength, some experts said. Instead of growth being concentrated at the top, gains may be becoming more broadly shared.\nFor example, lower-income households saw their after-tax wages grow at an average 5.2% annual pace in July, surpassing growth for higher-income households for the first time since December 2024, according to data published this month by the Bank of America Institute.\nDebit and credit card spending also converged across income groups last month, according to the think tank.\nLower-income households' spending grew 5.4% year-over-year in July, supported by stronger after-tax wage growth, outpacing spending growth among middle-income households, according to the Bank of America Institute.\nWhy all households are under financial pressure\nBut lower-income consumers are not necessarily gaining ground, economists said — challenging the notion of a shift away from a K-shaped economy.\nFor example, borrowers with low FICO scores — a barometer of consumer credit scores — are showing greater signs of stress.\n\"For those lowest-scoring consumers, we are seeing slight upticks in the 90-plus delinquency rate for mortgage and auto loans,\" said Ethan Dornhelm, FICO's vice president of scores and predictive analytics, referring to consumers who are 90 days or more past due on their required payments.\nI got sick of hearing about this K-shaped economy. I can say here definitively, the K-shaped economy is over.Scott BessentTreasury Secretary\nMany Americans at all income levels are still under pressure, economists said.\nEven higher earners \"are dialing back some of their spending and being more cautious with how they spend, where they spend their money,\" said EY-Parthenon chief economist Gregory Daco.\nWhile consumers' concerns about gas prices are easing, housing affordability has emerged as a large source of financial pressure, according to a new report from J.D. Power. Worries over housing costs have nearly eclipsed gasoline prices as the second-largest source of financial stress, behind groceries, it found.\nThe average first-time homebuyer's monthly mortgage payment hit $2,563, up 57% since April 2019 and far ahead of the 30% general inflation rate over that period, according to FICO's latest Credit Insights report.\nForty-three percent of homeowners said their total monthly housing costs have made it harder to keep up with other expenses, said FICO, which surveyed 2,078 U.S. adults ages 18 and older in July.\nThe ability to afford a home has declined since the beginning of the year, according to data from the Federal Reserve Bank of Atlanta. Affordability has broadly been depressed since 2022, when mortgage rates started increasing significantly, according to Atlanta Fed data.\nStudent-loan repayment is another source of strain: 56% of borrowers said it caused them to rely more heavily on credit cards or other loans to stay on top of bills over the past year, according to the FICO report.\nCould an X-shaped economy be on the horizon?\nOther economists said the economy may be taking on different shapes beyond a \"K\" or a \"C.\"\nFor example, an E-shape describes three economic tiers: high-income households, a squeezed middle and a struggling bottom.\nAn X shape could be next, if lower-income spending growth persistently exceeds that of higher-income spending growth, economists said.\n\"There is a slight risk of an X developing here,\" said David Tinsley, senior economist at the Bank of America Institute.\n\"It seems that lower-income household spending growth could accelerate past higher-income households for a time, and so we could actually be talking about a crossover,\" he said.\nA downturn in the stock market could cause higher-income households, which are more likely to own stocks, to pull back on spending, experts said.\nSuch a dynamic \"could become a key catalyst to slower consumer spending growth and an economy that might be stalling,\" said Daco of EY-Parthenon.\nThe alphabet soup of economic labels may have its limits, economists said.\nFor example, age and life stage may be a more useful way to understand who is feeling the most economic pressure in the months ahead, they said.\nStruggling Gen Z consumers in their 20s are very different from Gen X, the mid-career cohort roughly in their mid-40s to early 60s, who are also feeling a financial squeeze, experts said.\nHousing costs remain a particular pressure point for younger Gen Z consumers, especially renters, they said.\nMeanwhile, \"Gen X consumers are supporting their children while also perhaps supporting and helping their parents while also trying to save for retirement,\" said FICO's Dornhelm.\n\"I think there might be an age dimension coming into the discussion.\" Tinsley said, \"I think we are kind of broadly done with the alphabet.\"\nSIGN UP: Money 101 is an 8-week learning course on financial freedom, delivered weekly to your inbox. Sign up here. It is also available in Spanish.",
    "bodyJa": "K 字型経済は、拡大する永続的な経済格差の略語となっています。つまり、高所得のアメリカ人が富、支出、経済的安全の面でさらに先を行っている一方で、多くの低所得世帯が追いつくのに苦労しています。\n今、その形は変わりつつあるのかもしれない。\n「このK字型経済については聞き飽きた」とスコット・ベッセント財務長官は今月初め、CNBCの「スコークボックス」で語った。 「ここではっきりと言えるのは、K字型経済は終わったということです。」\n「我々は、下位の賃金労働者が最終的にそれを取り戻しつつある『C』経済の状況をさらに見ている」とベッセント氏は語った。\nK字型経済とは何ですか？\n経済の「形」とは文字の形を指します。\nたとえば、K字型経済（新型コロナウイルス感染症のパンデミック中に登場した用語）では、Kの腕と脚が広がり、低所得世帯と高所得世帯の異なる経験を表している。\n一部の最近のデータは、大部分の高所得世帯と低所得世帯の間の賃金と支出の差が縮まり始めていることを示しています。つまり、文字「C」の両端のように、収束し始めています。\n一部の専門家は、経済力の分布に意味のある変化を示す可能性があるため、これは重要だと述べた。成長がトップに集中するのではなく、利益はより広範囲に共有されるようになるかもしれない。\n例えば、バンク・オブ・アメリカ研究所が今月発表したデータによると、低所得世帯の税引後賃金は7月に年平均5.2％のペースで伸び、2024年12月以来初めて高所得世帯の伸びを上回った。\n同シンクタンクによると、デビットカードとクレジットカードの支出も先月、所得階層全体で集中したという。\nバンク・オブ・アメリカ研究所によると、7月の低所得世帯の支出は、税引後賃金の伸びの堅調に支えられ前年同月比5.4％増加し、中間所得世帯の支出の伸びを上回った。\nなぜすべての世帯が経済的プレッシャーにさらされているのか\nしかし、経済学者らは、低所得の消費者が必ずしも支持を得ているわけではなく、K字型経済からの転換という概念に異議を唱えていると述べた。\nたとえば、消費者信用スコアのバロメーターである FICO スコアが低い借り手は、より大きなストレスの兆候を示しています。\nFICOのスコアおよび予測分析担当バイスプレジデント、イーサン・ドーンヘルム氏は、必要な支払い期限を90日以上過ぎている消費者について言及し、「最もスコアの低い消費者については、住宅ローンや自動車ローンの90年以上の延滞率がわずかに上昇しているのが見られる」と述べた。\nこのK字型経済の話は聞き飽きた。ここではっきりと言えるのは、K字型経済は終わったことだ。スコット・ベッセント財務長官\nエコノミストらによると、多くの米国人はあらゆる所得水準において依然として圧力にさらされているという。\nEYパルテノンの首席エコノミスト、グレゴリー・ダコ氏は、高所得者でも「支出の一部を減らし、お金の使い方やお金の使い方にさらに慎重になっている」と述べた。\nJ.D.パワーの新しいレポートによると、ガソリン価格に対する消費者の懸念は和らぎつつあるものの、住宅の手頃な価格が大きな経済的圧力の原因となっているという。住宅費を巡る懸念が、食料品に次ぐ財政ストレスの第２位の原因として、ガソリン価格をほぼ上回っていることが判明した。\nFICOの最新のCredit Insightsレポートによると、初めて住宅を購入する人の平均月々の住宅ローン支払額は2,563ドルに達し、2019年4月以来57％増加し、同期間の一般的なインフレ率30％を大きく上回っている。\n7月に18歳以上の米国成人2,078人を対象に調査を行ったFICOによると、住宅所有者の43％が、月々の住宅費の合計により、他の出費を維持するのが困難になったと回答したという。\nアトランタ連邦準備銀行のデータによると、住宅を購入する能力は年初以来低下している。アトランタ連銀のデータによると、住宅ローン金利が大幅に上昇し始めた2022年以降、住宅価格の手頃な価格は全般的に低迷している。\n学生ローンの返済も負担の原因となっている。FICOの報告書によると、借り手の56％は、そのせいで過去1年間、生活費をやりくりするためにクレジットカードやその他のローンにもっと依存するようになったと答えている。\nX字型の経済が到来する可能性はあるでしょうか?\n他のエコノミストは、経済は「K」や「C」を超えて異なる形をとっている可能性があると述べた。\nたとえば、E 字型は、高所得世帯、圧迫された中間層、苦境にある底辺という 3 つの経済層を表します。\nエコノミストらによると、低所得層の支出の伸びが高所得層の支出の伸びを継続的に上回れば、次はＸ字型になる可能性があるという。\nバンク・オブ・アメリカ研究所のシニアエコノミスト、デビッド・ティンズリー氏は「ここでXが発展するリスクはわずかにある」と述べた。\n同氏は「低所得世帯の支出の伸びが一時的に高所得世帯を上回るペースで加速する可能性があり、実際にクロスオーバーについて話している可能性がある」と述べた。\n専門家らによると、株式市場の低迷により、株式を保有する可能性が高い高所得世帯が支出を控える可能性がある。\nＥＹパルテノンのダコ氏は、こうした動きは「個人消費の伸びを鈍化させ、経済を失速させる重要な触媒となる可能性がある」と述べた。\nエコノミストらは、経済ラベルのアルファベットスープには限界があるかもしれないと述べた。\nたとえば、今後数か月間で誰が最も経済的プレッシャーを感じているかを理解するには、年齢とライフステージのほうが役立つかもしれない、と研究者らは述べた。\n専門家らによると、苦境に立たされている20代のZ世代の消費者は、同じく経済的逼迫を感じているおよそ40代半ばから60代前半の中堅層であるX世代とは大きく異なるという。\nZ世代の若い消費者、特に賃貸人にとって住宅費は依然として特別なプレッシャーとなっている、と彼らは述べた。\n一方、FICOのドーンヘルム氏は、「X世代の消費者は、子供たちをサポートすると同時に、おそらく両親をサポートし援助しながら、退職後の資金を貯めようとしている」と述べた。\n「議論には年齢の要素が含まれる可能性があると思います。」ティンズリー氏は、「アルファベットについてはほぼ完成したと思う」と語った。\nサインアップ: Money 101 は経済的自由に関する 8 週間の学習コースで、毎週あなたの受信箱に配信されます。ここからサインアップしてください。スペイン語でも利用可能です。",

    "summaryJa": "ドナルド・トランプ大統領は火曜日、サウスカロライナ州共和党のダーリン・グラハム上院議員が、亡き弟のリンゼー・グラハム氏の後任として上院議員任期6年を目指して特別共和党予備選決選投票でラルフ・ノーマン下院議員と対決する中、自身の支持力を試すことになる。この選挙戦ではトランプ氏の同盟者２人が互いに争う。ノーマンは下院自由議員団の強硬派メンバー。しかし、2024年の共和党大統領予備選で同氏が当初サウスカロライナ州知事ニッキー・ヘイリー氏を支持していたことや、大統領の優先事項の一部について財政上の懸念を表明する傾向があったため、トランプ氏との関係は時折緊張した。大統領はこの選挙サイクルを通じて、自分や彼の政策に反対する共和党議員をターゲットにしてきた。",
    "bodyOriginal": "President Donald Trump on Tuesday will test his endorsement power as South Carolina GOP Sen. Darline Graham squares off against Rep. Ralph Norman in a special Republican primary runoff election in her bid to replace her late brother Lindsey Graham for a full six-year Senate term.\nThe race pits two Trump allies against each other. Norman is a hard-line member of the House Freedom Caucus. But his initial support for former South Carolina Gov. Nikki Haley in the 2024 GOP presidential primaries and his tendency to raise fiscal concerns about some of the president's priorities have at times strained his relationship with Trump. The president throughout this election cycle has targeted fellow Republican lawmakers who have opposed him or his policies.\nGraham, who has a brief political track record, has enjoyed Trump's enthusiastic support since the days after her brother died unexpectedly in July. Trump, who had a close relationship with Lindsey Graham, traveled to South Carolina to campaign with Graham last week and held a tele-rally for her on Monday.\nThe winner of Tuesday's runoff will face Democrat Annie Andrews in November's general election. The Cook Political Report with Amy Walter labels the race \"Solid R.\" Lindsey Graham was favored to win reelection before his death.\n\"[T]here is nobody better to honor the legacy of her beloved brother, Lindsey. Darline, who comes from an absolutely incredible family, has been a WINNER all of her life, and has my Complete and Total Endorsement in the Special Election for U.S. Senate in South Carolina,\" Trump posted to TruthSocial on Monday.\nTrump's full-throated support of Graham, however, could prove risky for the president, who is the de facto head of the party and who has traditionally played kingmaker, but has suffered a series of recent losses.\nGraham, who has never been elected to office but was appointed by South Carolina Gov. Henry McMaster in July to serve out the remainder of her brother's term, suffered an embarrassing moment in a debate with Norman last week.\nAsked to comment on the importance of Taiwan to U.S. interests, Graham copped that she was \"not that informed on national security,\" raising questions about her fitness for the job. Graham has since defended her performance, arguing during an appearance on Fox News that she doesn't \"speak politician.\"\nNorman, who launched an unsuccessful bid for South Carolina governor earlier this year, seized on the moment, casting himself as the proven conservative in the race.\n\"My opponent is unknown. She's being backed by the Washington establishment,\" Norman said in a recent appearance on Fox News. \"She's a propped-up candidate. You could tell that during the debates. This is an important job. There is no training on the job that you can effectively do.\"\nThe stakes are high for Trump, some of whose picks in South Carolina, as well as other parts of the country, have fallen short of late.\nTrump in May endorsed South Carolina Lt. Gov. Pamela Evette in the GOP primary for governor, though he eventually co-endorsed state Attorney General Alan Wilson, who bested Evette in a runoff in June. GOP lawmakers in the South Carolina legislature also dealt a blow to Trump in May when they scuttled his push for partisan mid-decade redistricting.\nElsewhere, too, Trump's once-powerful endorsement has come up short. Rep. Randy Feenstra, R-Iowa, in June lost to Zach Lahn in the state's GOP gubernatorial primary, despite notching support from Trump.\nA Trump-endorsed candidate lost this month in Wyoming's Republican gubernatorial primary. And two candidates Trump had backed for the House in Florida — Rep. Cory Mills and Catalina Lauf — lost their respective primaries earlier this month.\nIn total, 10 Trump-endorsed candidates have lost their races this election cycle, equal to the total number of Trump-backed candidates who lost in 2018, 2020 and 2024 primaries combined, according to a CNN analysis.",
    "bodyJa": "ドナルド・トランプ大統領は火曜日、サウスカロライナ州共和党のダーリン・グラハム上院議員が、亡き弟のリンゼー・グラハム氏の後任として上院議員任期6年を目指して特別共和党予備選決選投票でラルフ・ノーマン下院議員と対決する中、自身の支持力を試すことになる。\nこの選挙戦ではトランプ氏の同盟者２人が互いに争う。ノーマンは下院自由議員団の強硬派メンバー。しかし、2024年の共和党大統領予備選で同氏が当初サウスカロライナ州知事ニッキー・ヘイリー氏を支持していたことや、大統領の優先事項の一部について財政上の懸念を表明する傾向があったため、トランプ氏との関係は時折緊張した。大統領はこの選挙サイクルを通じて、自分や彼の政策に反対する共和党議員をターゲットにしてきた。\nグラハム氏は短期間の政治的実績しかないが、7月に弟が急死して以来、トランプ氏の熱狂的な支持を享受してきた。リンジー・グラハム氏と親密な関係にあったトランプ氏は先週、グラハム氏との選挙運動のためサウスカロライナ州を訪れ、月曜日には彼女のために電話集会を開催した。\n火曜日の決選投票の勝者は11月の本選挙で民主党のアニー・アンドリュースと対戦することになる。エイミー・ウォルターとのクック・ポリティカル・レポートでは、この人種を「ソリッドR」と名付けている。リンジー・グラハムは生前に再選が有力視されていた。\nトランプ大統領は月曜、トゥルースソーシャルに「最愛の兄リンジーの功績を讃えるのにこれ以上の人はいない。ダーリンは本当に素晴らしい家族の出身で、生涯ずっと勝者であり、サウスカロライナ州の上院特別選挙で私が完全かつ全面的に支持している」と投稿した。\nしかし、トランプ大統領がグラハム氏を全力で支持することは、事実上の党首であり、伝統的にキングメーカーの役割を果たしてきたが、最近一連の敗北を喫している大統領にとっては危険であると判明する可能性がある。\nグラハム氏はこれまで一度も議員に選出されたことがないが、7月にサウスカロライナ州知事ヘンリー・マクマスター氏によって兄の残りの任期を務めるために任命されたが、先週のノーマン氏との討論会で恥ずかしい瞬間を迎えた。\n米国の国益にとっての台湾の重要性についてコメントを求められたグラハム氏は、「国家安全保障についてはあまり知識がない」と答え、その職への適性について疑問が生じた。それ以来、グラハムは自身のパフォーマンスを擁護し、FOXニュース出演中に彼女は「政治家の言葉を話さない」と主張した。\nノーマン氏は今年初めにサウスカロライナ州知事に立候補したが失敗に終わったが、この機を捉えて自らを選挙戦で実証済みの保守派に据えた。\nノーマン氏は最近出演したFOXニュースで、「私の対戦相手は不明だ。彼女はワシントン支配層の支援を受けている」と語った。 「彼女はしっかりとした候補者だ。討論会中にそれがわかるだろう。これは重要な仕事だ。効果的に実行できる職務訓練はない。」\nトランプ氏にとって賭け金は高く、サウスカロライナ州や国内の他の地域での候補者の一部が最近及ばなかった。\nトランプ大統領は5月、サウスカロライナ州知事選の共和党予備選でサウスカロライナ州副知事のパメラ・エヴェット氏を支持したが、最終的には6月の決選投票でエヴェット氏を破ったアラン・ウィルソン州司法長官と共同支持した。サウスカロライナ州議会の共和党議員らも5月、党派による10年半ばの選挙区再編推進を阻止し、トランプ大統領に打撃を与えた。\n他の地域でも、かつては強力だったトランプ氏の支持は失墜している。ランディ・フェーンストラ下院議員（共和党、アイオワ州）は6月、トランプ大統領からの支持を集めたにもかかわらず、同州の共和党知事予備選でザック・ラーン氏に敗れた。\n今月行われたワイオミング州の共和党知事予備選で、トランプ大統領が推薦した候補者が敗れた。そしてトランプ氏がフロリダ州下院で支援した２人の候補者、コリー・ミルズ下院議員とカタリナ・ラウフ下院議員は今月初め、それぞれの予備選で敗れた。\nCNNの分析によると、今回の選挙サイクルでトランプ支持の候補者が落選したのは合計10人で、これは2018年、2020年、2024年の予備選で敗退したトランプ支持の候補者の総数に等しい。",

    "title": "Stanley Druckenmiller leads doubters who think Bessent's bond ploys will fail",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.他の一部の人々と同様、スウィフト氏は最近の利回り上昇についてそれほど憂慮すべきことは何も考えておらず、インフレ、失業、市場のボラティリティに加え、FRBの指標金利や中央銀行への期待に基づくと、30年債は「ファンダメンタルズ公正価値」に近いと述べた。",
    "bodyOriginal": "Treasury Secretary Scott Bessent's bond market interventions have generated a modest decline in yields along with a growing chorus of derision from those who think they won't work over the long haul and could have dangerous repercussions.\nWall Street has been generally skeptical that Treasury has enough firepower to manage a fixed income market that saw some $4.8 trillion in debt issued in 2025 alone, a level that could be exceeded this year.\nBessent has proposed at least doubling the department's buyback efforts for longer-dated debt issues. Treasury also intervened in currency markets in late July to support the yen so the Bank of Japan didn't have to sell Treasurys, which likely would have raised yields on U.S. debt.\nThe efforts have pushed longer-dated yields off recent peaks that were the highest since before the global financial crisis in 2008, but market experts see the moves as doomed to fail, particularly if the U.S. does not address a fiscal situation in which total debt just eclipsed $40 trillion and the budget deficit is well on its way to top $2 trillion for 2026.\nThe latest critic to pile on: Stanley Druckenmiller, the prominent head of Duquesne Family Office and, perhaps more significantly, Bessent's investing mentor. The two, along with George Soros, famously orchestrated the bet against the U.K. pound in the early 1990s.\nDruckenmiller warned that without fiscal discipline, efforts to tamp down yields are dangerous for markets — and also for the Treasury Department's credibility.\n\"If the 30-year must trade at 5.5% to clear, that isn't a crisis. It is an invoice,\" he wrote in a Wall Street Journal op-ed piece. \"Then do the only thing that durably lowers long-term yields: address the primary deficit.\"\n'A subsidy to procrastination'\nIn the essay, titled \"Let the Bond Market Speak,\" Druckenmiller urged Bessent to abandon the buyback scheme announced Aug. 19 and allow the market the opportunity, free of the government's hand, to set the proper price for government debt.\n\"Every basis point of artificial yield suppression is a subsidy to procrastination,\" he wrote. \"Once markets believe Treasury is defending a price, every rise in yields becomes a test of official resolve, and the operations must grow to survive the tests.\"\n\"Governments defending prices against fundamentals always lose. The only variable is how much they spend before conceding,\" he added.\nThe Treasury Department didn't immediately respond to a CNBC request for comment on Druckenmiller's column.\nBessent's initial plan was to double Treasury's usual $2 billion buybacks of off-the-run — or previously issued — securities, a program begun two years ago under his predecessor, Janet Yellen.\nIn addition, Treasury sources this week told CNBC that the department also could use its $935 billion general account to fund fixed income purchases.\nStill, there was skepticism that even going that route would be enough. The general account is essentially Treasury's checkbook which it uses to fund government operations and has been utilized during the multiple debt ceiling impasses in Congress, and as such has limits.\nThe recent moves have been compared to tools the Federal Reserve has used in the past to provide liquidity to debt markets and to hold rates in check. One, called Operation Twist, entails selling shorter-term debt and buying longer-term securities. The other, called quantitative easing, is when the Fed simply uses its own resources to buy up fixed income.\nThe difference: Unlike Treasury, the Fed isn't constrained by a finite cash balance and can create reserves to finance its purchases.\nThe Fed's position\n\"If the U.S. government is serious about yield suppression, the Federal Reserve must be involved,\" Ryan Swift, chief strategist at BCA, said in a client note. \"Unless the Federal Reserve deploys its balance sheet, any efforts by the U.S. government to suppress bond yields will fail. In fact, they could even be counterproductive if investors start to sniff out that the administration is getting desperate.\"\nBut Swift thinks Fed Chairman Kevin Warsh will be reluctant to get involved. During his short time heading the central bank, Warsh has stressed the importance of allowing the market to employ price discovery.\n\"Market participants are learning to play the ball, not the referee — and market prices will continue to respond in the direction and magnitude they see fit,\" Warsh said after the July Fed meeting.\nLike some others, Swift doesn't see anything terribly alarming about the recent rise in yields, saying the 30-year-long bond is near \"fundamental fair value\" based on the Fed's benchmark rate and expectations for the central bank, along with inflation, unemployment and market volatility.\nThe 30-year bond is only trading slightly above its 50-year average around 5.16%. The benchmark 10-year note as of Tuesday morning actually traded exactly in line with its 4.64% historical average going back to the early 1960s.\n\"The bond market's message is straightforward: fiscal or monetary policy should be tighter,\" wrote Nohshad Shah, head of fixed income sales for Europe, the Middle East and Africa at Citadel Securities. \"Preventing Treasuries from clearing at lower prices does not eliminate that pressure … it merely shifts it elsewhere.\"\nThe Fed will get its say next when it meets Sept. 15-16, with markets pricing in about a 40% chance of a rate hike, according to CME Group calculations. Warsh will speak Friday at the Fed's Jackson Hole, Wyoming, symposium and could address the Treasury issue then.\nKrishna Guha, head of economics and central bank policy at Evercore ISI, said the chairman could try to avoid getting involved.\n\"It will not be easy for Warsh to comment on yields in a way that is reassuring to markets while at the same time avoiding contradicting Bessent's unconventional actions, and Warsh might just decide to take a pass,\" Guha wrote.\nCorrection: This story has been revised to reflect that the fixed income market saw some $4.8 trillion in debt issued in 2025. A previous version misstated the amount of debt issued.",
    "bodyJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n他の一部の人々と同様、スウィフト氏は最近の利回り上昇についてそれほど憂慮すべきことは何も考えておらず、インフレ、失業、市場のボラティリティに加え、FRBの指標金利や中央銀行への期待に基づくと、30年債は「ファンダメンタルズ公正価値」に近いと述べた。\n３０年債は５０年債平均の約５．１６％をわずかに上回っているだけだ。火曜日朝の時点で指標となる10年債は実際、1960年代初頭まで遡る歴史的平均の4.64％と全く同じ水準で取引されている。\nシタデル・セキュリティーズの欧州・中東・アフリカ債券セールス責任者、ノーシャド・シャー氏は「債券市場のメッセージは単純明快だ。財政政策あるいは金融政策をより引き締めるべきだ」と述べた。 「米国債が低価格で決済されるのを阻止しても、その圧力は排除されない。圧力が他の場所に移されるだけだ。」\nＣＭＥグループの試算によると、ＦＲＢが次に発言権を得るのは９月１５─１６日の会合で、市場は利上げの可能性を約４０％織り込んでいる。ウォーシュ氏は金曜日にワイオミング州ジャクソンホール連銀のシンポジウムで講演する予定で、その際に財務省問題に言及する可能性がある。\nエバーコアＩＳＩの経済・中央銀行政策責任者のクリシュナ・グハ氏は、議長が関与を避けようとする可能性があると述べた。\n「ウォーシュ氏が、ベッセント氏の型破りな行動との矛盾を避けながら、市場に安心感を与える形で利回りについてコメントするのは容易ではないだろう。ウォーシュ氏は見送る決断を下すかもしれない」とグハ氏は書いた。\n訂正: この記事は、2025 年に債券市場で約 4 兆 8,000 億ドルの債券が発行されたことを反映して修正されました。以前のバージョンでは、債券発行額が誤って記載されていました。",

    "id": "hhs-plans-new-fda-deputy-commissioner-ro-6989cfd5",
    "title": "HHS plans new FDA deputy commissioner roles for technology and drugs, sources say",
    "titleJa": "HHSはテクノロジーと医薬品分野でFDA副長官の役割を新たに計画していると関係者が語る",
    "summaryJa": "CNBCの報道によると、保健福祉省は食品医薬品局に新たに2つの副局長職を創設する予定で、そのうちの1つはテクノロジーと健康と人工知能の交差点に焦点を当てることになるという。この計画に詳しい関係者２人によると、もう１つの新たなポストは麻薬担当副長官だという。同庁にはすでに食料担当副長官代理を含む複数の副長官がいるが、誰がその役割に恒久的に就任するかは不明だ。",
    "bodyOriginal": "The Department of Health and Human Services is planning to create two new deputy commissioner roles at the Food and Drug Administration, one of which would focus on technology and the intersection of health and artificial intelligence, CNBC has learned.\nThe other new position is for a deputy commissioner for drugs, according to two sources familiar with the plan. The agency already has several deputy commissioners, including an acting deputy commissioner for food, though it is unclear who will step into that role permanently.\nHHS officials would appoint the new leaders in what some in the Trump administration view as a bid to exert greater influence over the agency, according to the sources, who asked to remain anonymous because they were not authorized to speak publicly.\nNo final decisions or formal announcements about the new roles have been made, the sources said.\nJared Seehafer, a senior advisor to the FDA and medical devices industry veteran, is the leading candidate for the technology role, according to three people familiar with the matter. Seehafer is a co-founder and former CEO of Enzyme, a life sciences compliance software company, and most recently worked at a venture capital firm in San Francisco before stepping into his FDA advisory role in August of last year.\nKyle Diamantas was most recently the deputy commissioner for food before stepping in as the acting FDA commissioner in May after Marty Makary's resignation over the agency's authorization of fruit-flavored vapes. It's unclear if Diamantas would return to that role.\nCNBC could not learn of any specific candidates for the deputy commissioner for drugs role.\nThe two new positions would report to President Donald Trump's pick for FDA commissioner, Heidi Overton, who still needs to be confirmed by the Senate, according to two people familiar with the plan.\nHHS did not respond to multiple requests for comment.\nThe new leadership structure would come after a tumultuous stretch for the FDA.\nThe agency has faced intense scrutiny over its handling of a multistate cyclospora outbreak linked to iceberg lettuce, which exacerbated broader concerns about federal budget and staff cuts hindering the agency's ability to rein in foodborne outbreaks.\nThe FDA has also been under the spotlight for a series of decisions around certain new drug products.\nFor example, the FDA earlier this month granted accelerated approval to Replimune for its melanoma drug, Tudriqev, following a high-profile regulatory battle with the company and two prior rejections of the treatment.\nIn March, the FDA also drew sharp backlash from the biotech industry after demanding an extra clinical trial – including a fake or \"sham\" brain surgery placebo – for an experimental Huntington's disease treatment from UniQure. The agency later reversed its stance and greenlit UniQure to file for accelerated approval based on mid-stage data.\nAnd on Monday, the FDA granted a three-month review extension for Capricor Therapeutics' experimental Duchenne muscular dystrophy drug to consider additional data, which came after an advisory committee to the agency voted 9-3 against recommending approval of that product.\nMeanwhile, the FDA has increasingly turned to artificial intelligence to help employees with internal operations, including via its Elsa generative AI tool, which the agency has used for tasks such as document summarization and drafting. At the same time, FDA regulators are responsible for evaluating the safety and effectiveness of medical products that incorporate AI.\nLast week, the FDA released a discussion paper outlining potential approaches for regulating generative AI-enabled medical devices. Instead of issuing formal guidance, the agency seeks input from patients, clinicians, developers and other stakeholders.\nThe new deputy commissioner for technology would oversee both the agency's own internal use of AI and its review of AI-enabled products, according to the people familiar with the matter.",
    "bodyJa": "CNBCの報道によると、保健福祉省は食品医薬品局に新たに2つの副局長職を創設する予定で、そのうちの1つはテクノロジーと健康と人工知能の交差点に焦点を当てることになるという。\nこの計画に詳しい関係者２人によると、もう１つの新たなポストは麻薬担当副長官だという。同庁にはすでに食料担当副長官代理を含む複数の副長官がいるが、誰がその役割に恒久的に就任するかは不明だ。\n関係者らによると、HHS当局者らは公の場で発言する権限がないため匿名を条件に、トランプ政権の一部が同局に対する影響力を拡大する狙いがあると見ており、新指導者を任命することになるという。\n関係者によると、新しい役割に関する最終決定や正式な発表はまだ行われていない。\n事情に詳しい関係者3人によると、FDAの上級顧問で医療機器業界のベテランであるジャレッド・シーハーファー氏が、この技術職の最有力候補だという。 Seehafer 氏は、ライフ サイエンスのコンプライアンス ソフトウェア会社である Enzyme の共同創設者兼元 CEO であり、昨年 8 月に FDA の顧問の役割に就く前は、最近までサンフランシスコのベンチャー キャピタル会社で働いていました。\nカイル・ディアマンタス氏は、つい最近まで食品担当副長官を務めていたが、フルーツ風味の電子タバコの認可をめぐるマーティ・マカリー氏の辞任を受けて5月にFDA長官代理に就任した。ディアマンタスがその役割に戻るかどうかは不明だ。\nCNBCは麻薬担当副長官の具体的な候補者については知ることができなかった。\nこの計画に詳しい関係者２人によると、この２つの新たな役職は、ドナルド・トランプ大統領がＦＤＡ長官に指名したハイディ・オヴァートン氏の直属となるが、同氏はまだ上院の承認を必要としている。\nHHSは複数のコメント要請に応じなかった。\n新しい指導体制は、FDAにとって波瀾万丈の期間を経て誕生することになる。\n同庁は、アイスバーグレタスに関連した複数の州で発生したシクロスポラの発生への対応をめぐって厳しい監視にさらされており、連邦予算と人員削減により食品由来の発生を抑制する当局の能力が妨げられているという広範な懸念がさらに高まっている。\nFDAは、特定の新薬製品に関する一連の決定でも注目を集めている。\n例えば、FDAは今月初め、レプリミューンとの注目を集めた規制上の争いと、これまでの2回の治療薬拒否を受けて、レプリミューンの黒色腫治療薬「トゥドリゲフ」の早期承認を認めた。\nFDAは3月にも、ユニキュア社の実験的なハンチントン病治療薬について、偽のまたは「偽」脳手術用プラセボを含む追加の臨床試験を要求し、バイオテクノロジー業界からの激しい反発も招いた。その後、当局は立場を転換し、UniQure が中間段階のデータに基づいて早期承認を申請することにゴーサインを出した。\nそして月曜日、FDAは、Capricor Therapeuticsの実験用デュシェンヌ型筋ジストロフィー薬について、追加データを検討するため3か月の審査延長を認めた。これは、FDAの諮問委員会が同製品の承認推奨に9対3で反対票を投じたことを受けてのことだった。\n一方、FDA は従業員の内部業務を支援するために人工知能の利用をますます増やしており、その中には、同庁が文書の要約や草案作成などのタスクに使用している Elsa 生成 AI ツールも含まれます。同時に、FDA 規制当局は AI を組み込んだ医療製品の安全性と有効性を評価する責任があります。\n先週、FDAは生成型AI対応医療機器を規制するための潜在的なアプローチを概説したディスカッションペーパーを発表した。同庁は正式なガイダンスを発行する代わりに、患者、臨床医、開発者、その他の関係者からの意見を求めている。\n関係者によると、新たな技術担当副長官は、同庁自身の内部でのAI利用とAI対応製品の審査の両方を監督することになる。",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Who does Iran trade with and what could Trump's 'economic D-Day' mean?\n- Published\nThe US has said \"the single greatest financial offensive ever\" will help it and Israel end their ongoing war with Iran.\nHowever, Iran is no stranger to these tactics.\nThe regime has faced near continuous US sanctions since the Islamic Revolution of 1979. In that time, it has developed deep trade ties with several countries which either have a history of ignoring US economic pressure themselves or cannot afford to stop trading with Iran.\nAs a result, Iran says it is \"fully prepared\" for the new US sanctions and many economists argue the impact of Washington's latest move will be limited.\nSo, who does Iran trade with? And could what the US has called an \"economic D-Day\" have any real impact on Iran?\nChina\nChina is the biggest buyer of Iranian goods, making up 26.9% of its exports in 2025, according data from the International Trade Centre (ITC), a subsidiary of the United Nations and the World Trade Organisation.\nThere a few caveats to ITC's data, which covers a period before the US-Israel war with Iran began.\nFirst, several economists believe that even before the conflict started, a lot of Iranian oil sales, particularly to China, were underreported for political reasons.\nSecond, the ITC tallies Iran's exports using mostly the import numbers reported by its trading partners - owing to the difficulty in getting up to date export data from Iran.\nThird, import data for some of Iran's trading partners, such as Iraq, is incomplete.\nDespite this, Iranian trade's importance to China is clear from its response to the US announcement of \"economic D-Day\".\nIt said that it was firmly opposed to what it called \"illegal unilateral sanctions\", that economic pressure tactics would not help resolve problems and that Beijing would safeguard its own interests.\nTurkey\nTurkey is another large trading partner of Iran, according to ITC data, but it has a much friendlier relationship with the US than China.\nThis puts it in a challenging position. The US has threatened to punish those who continue to trade with Iran as part of its economic pressure tactics.\nHowever, economists point out that Turkey cannot stop trading with it without significant damage to its economy, which is already struggling with inflation running at 31.8%, according to official data, external.\nIn short, as the only Nato member to share a border with Iran, Turkey has to balance its relationship with military allies and maintaining a relationship with its close economic neighbour.\nPakistan\nLike Turkey, Pakistan borders Iran and is one of its biggest export partners, according to ITC data, while also being keen to maintain a good relationship with the US.\nBut unlike Turkey, Pakistan's top export partner is instead the US, meaning it has more to lose from any economic punishment imposed by Washington.\nIt is also a key mediator in peace talks between the US and Iran, meaning a breakdown in its relationship with either country could make finding a solution to the conflict even more challenging.\nThe other complicating factor is that not all of Pakistan's trade with Iran is within the Pakistan government's control.\nThe BBC has seen evidence that oil is being smuggled across the border from Iran to Pakistan en masse by bikers, some as young as 15.\nThis was the case before the Iran war began, but data suggests the practice has picked up since.\nAnd though the US and Pakistan's oil firms have pressured Pakistan's government to clamp down on the practice, it has struggled to police remote parts of the 900km border.\nThe BBC has previously asked the Iranian government to comment on the allegation that it is involved in the fuel smuggling. It did not respond.\nArmenia\nArmenia is another major trading partner of Iran, according to the ITC data.\nWhere it differs the most from others is that its top export partner is Russia, which accounts for 34.9% of all goods sold by Armenia in 2025.\nThis is despite the fact that Russia has faced sanctions from the US and its allies since its full-scale invasion of Ukraine in 2022.\nThis suggests Armenia may be willing to continue trading with Iran despite mounting US pressure.\nThe end result\nUS Treasury Secretary Scott Bessent said the sanctions against Iran will \"tighten the noose and block every potential source of revenue\".\nYet, many experts disagree. Advisory firm Oxford Economics said the direct impact on Iran's revenues would be \"somewhat of a damp squib\".\nAli Vaez, deputy director at the International Crisis Group, said: \"Anything that moves in Iran has already been sanctioned by multiple layers of sanctions, in fact.\n\"So the question now is one of enforcement. Does the United States have what it takes to impose fines and levies on countries that continue to trade with Iran?\"\nHe noted how the US started an economic war with China, Iran's biggest trading partner, last year but \"backed out of it\".\nFormer senior advisor at the state department Aya Ibrahim said the US's overreliance on them \"incentivises countries to find ways around that system\".\nShe also raised concerns that the sanctions may have the biggest affect on people, rather than economies, as they \"deny people necessities to stay alive\".\nMeanwhile, global markets have had a muted response to the announcement.\nGlobal oil prices fell following the announcement, but are still far higher than pre-war levels.\nStock traders were even less moved by the news, with the major indexes of the biggest companies listed in the US, Europe, and Asia barely shifting.\nThe US will has a way to go before it convinces economists, investors, and the nations trading with Iran that its sanctions threat is to be taken seriously.\nAdditional reporting by Miguel Roca-Terry\n- Published10 hours ago",

    "title": "China needs U.S. dollars but is building a hedge against Washington’s sanctions",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "BEIJING — The U.S. is threatening to cut businesses that help Iran evade sanctions off from the American financial system. It puts China's banks in an uncomfortable position: Beijing can reject the demands, but its biggest lenders still have strong incentives to preserve access to U.S. dollars.\nU.S. Treasury Secretary Scott Bessent announced on Monday that any entity facilitating \"money laundering or sanctions evasion on behalf of Iran risks being cut off from the U.S. financial system.\" It was part of the \"Economic D-Day\" against Iran announced by U.S. President Donald Trump.\nWhen asked specifically about Chinese banks, Bessent said: \"If they facilitate transactions and are part of the ecosystem that turns Iranian oil into money, into repression, they will be targeted.\"\nChina said Tuesday it would \"take all necessary measures\" to protect itself.\n\"China has made clear on many occasions its firm opposition to illicit unilateral sanctions that have no basis in international law or the authorization of the UN Security Council,\" a Chinese foreign ministry spokesperson said on Tuesday in response to questions.\nBefore the war, China bought around 90% of Iran's exported oil — about 12% of China's total crude imports — making it Iran's largest trading partner, per analysts at the U.S.-China Economic and Security Review Commission in March.\nDubbed \"Operation Economic Outcast,\" the expanded U.S. sanctions identified several China-based companies and individuals as having allegedly assisted the Iranian military.\nThe U.S. said it would give countries a timeline to shut down identified activities, but didn't share dates publicly. When CNBC asked about communication regarding the timeline, China's foreign ministry said it was closely monitoring the situation and reiterated that Beijing would protect its interests.\nIt's tough talk as a summit between Trump and Chinese President Xi Jinping is looming.\nBut analysts emphasize China will do what it can to stay in the U.S. dollar financing system. The U.S. has raised the bar for China and other countries that want to use the greenback — boosting their incentive to diversify. And the complexities of the U.S.-China economic rivalry make an \"Economic D-Day\" a tough order for the Trump administration.\nHow China's CIPS offers a hedge to the dollar\nPeter Alexander, Shanghai-based managing director of advisory Z-Ben, told CNBC that China's Cross-Border Interbank Payment System (CIPS) showed it was trying to diversify from dollar-centered finance, without abandoning it altogether.\nThe People's Bank of China began building the CIPS in 2012 — the same year the U.S. Treasury sanctioned China's relatively small Bank of Kunlun over illicit Iran activities. Its transactions have picked up since the Russia-Ukraine war in 2022, and generally grown this year, according to official figures.\nThe system lists 210 direct participating institutions globally, mostly affiliates of state-owned Chinese banks.\nAlexander also said that Argentina and Australia this month renewed bilateral currency swap agreements with China that enable the exchange of tens of billions of dollars' worth of Chinese yuan between the countries' central banks.\n\"The emerging financial system isn't necessarily one in which countries abandon the USD,\" Alexander said. \"It is a geopolitical hedging instrument.\"\nThe dollar's dominance\nThe U.S. dollar still accounted for over half of global payments in July, while China's yuan ranks fifth at 3.1%, according to Swift, the secure bank messaging system that underpins international banking. That's down from over 4% in early 2025.\nIn trade finance, the U.S. dollar accounted for nearly 80% that month, while China's yuan ranked second at 8.4%, the Swift data showed.\n\"China definitely wants to stay in the dollar system which benefits its trade engine, but that doesn't mean it will do everything [to] comply with expanding U.S. sanctions,\" Tianchen Xu, senior economist at the Economist Intelligence Unit, told CNBC.\nHe said he expected China to use rare earth controls and other measures to retaliate against sanctions on major Chinese businesses.\nBut the U.S. also wants access to critical minerals that China has, incentivising it to keep the relationship stable.\nTrump and Xi are still due to meet next month\nTrump and China's Xi are expected to meet in the U.S. late next month, following Trump's visit to Beijing in May. Eurasia Group's China director Dan Wang said the U.S. doesn't want to derail the summit.\n\"The core of China-U.S. relation is more about [the] Taiwan situation ... [the] China-Iran tie is not nearly as close as outsiders have imagined,\" she said, noting Beijing has essentially halted state-backed infrastructure investment since 2018.\nRemoving a major Chinese bank from the SWIFT system would significantly increase devaluation pressure on the Chinese yuan, which is “not acceptable\" to Beijing, she told CNBC's \"The China Connection\" on Tuesday.\nThe U.S. dollar index has strengthened since the Iran war began on Feb. 28, up by about 1.5%.\nThe Chinese yuan has gained nearly 2% against the U.S. dollar in that time, and more than 3% against the euro.\nEarlier this year, China helped broker initial peace talks between Iran and the U.S. in Pakistan.\nBut analysts at the time cautioned that Beijing had neither the capability nor inclination to pressure either side into negotiating.\n\"Beijing hasn't even begun to play hard ball with America,\" Alexander said.\nAs for the U.S. response, \"the question isn't what could be done,\" he told CNBC in an email, \"the question is whether anything WILL be done.\"",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Oil prices fell more than 3% on Tuesday, after the New York Times reported the State Department plans to return evacuated diplomats to the Middle East, in a sign the U.S. does not expect a return to full-scale war.\nBrent crude oil futures were last seen trading 3.4% lower at $89.05 per barrel, its lowest since Aug. 13. U.S. West Texas Intermediate crude fell 3.6% to trade around $81.99 a barrel.\nTuesday's moves extended declines from Monday, when Brent fell by 3%.\nWhile U.S. strikes in the Middle East have quieted in recent weeks, Washington has instead made moves to exert huge economic pressure on Iran.\nThe U.S. government unveiled a fresh raft of sanctions on Iran this week, as well as so-called \"enablers\" that continue to trade with the country.\nThe White House has labeled its efforts an \"economic D-Day,\" with Treasury Secretary Scott Bessent touting the initiative as \"the single greatest financial offensive ever\" on Monday.\nMeanwhile, U.S. Defense Secretary Pete Hegseth told reporters on Monday that the prospect of further American strikes in the Middle East remained on the table.\n\"If we need to use kinetic strikes, we'll use them,\" he said. \"If Iran is foolish enough to overplay their hand or mess with the American military, we'll do what we need to do.\"\n\"Economic pressure hurts them the most right now,\" he said of the Iranian regime. \"But by no means are we foreclosing using kinetic strikes anywhere in the Strait of Hormuz or around Iran.\"\nIranian Economy Minister Ali Madanizadeh said on state television that Tehran is \"fully prepared\" to withstand more U.S. sanctions.\n\"The government is and was ready and has a two-year plan to manage these events,\" he said. \"We have our own tools and we know how to play the game.\"\nChina vows to defend its interests\nChina, one of Iran's largest trading partners, has repeatedly called for a diplomatic end to the U.S.-Iran war. Under the new \"economic D-Day\" plans, China could face ramifications for continuing to buy Iranian oil.\nOn Tuesday, Chinese Foreign Ministry Spokesperson Lin Jian told reporters Beijing would \"do everything necessary to firmly safeguard its rights and interests.\"\n\"China has made clear on many occasions its firm opposition to illicit unilateral sanctions that have no basis in international law or the authorization of the UN Security Council,\" he said. \"Economic warfare and maximum pressure provide no solution.\"\nHe added that China's cooperation with Iran is conducted within the framework of international law, and should therefore not be disrupted.\nIn a Tuesday note, BBH strategists said the Trump administration's latest tactics were \"more of a warning shot than a decisive blow.\"\n\"The U.S. expanded sanctions on Iran but stopped short of any immediate secondary sanctions against other countries sustaining Iran's trade. China is the critical pressure point — it is Iran's largest trading partner and buys roughly 90% of its oil exports — and the biggest constraint on making the sanctions credible.\"\nThey added that targeting China as a trading partner of Iran would mean targeting major Chinese banks and refiners, \"risking financial disruption, Chinese retaliation, and the fragile US-China détente.\"",

    "bodyOriginal": "Nvidia has been the profit engine of the artificial intelligence boom, filling up data centers with its graphics processing units, which are also powering the biggest AI models.\nBut if there's one persistent concern among investors regarding Nvidia's ability to build on its $5 trillion market cap, it's customer concentration. Nvidia counts on the group known as the hyperscalers — Amazon, Google and Microsoft — for an outsized amount of revenue, as those companies buy GPUs in bulk for their own workloads, and sell access to them through their giant cloud businesses.\nAdd to that Meta and SpaceX, which have also been massive buyers as they build their own models, while also starting to rent out some of their Nvidia capacity to other companies that need it right away.\nIn its last earnings report in May, Nvidia changed the way it reports financials to split out hyperscalers from the rest of the pack, which it now groups as AI clouds, industrial and enterprise, or ACIE. Nvidia doesn't specify which companies fall into the former group, but CEO Jensen Huang has defined the group pretty clearly.\n\"The easiest go-to-market, of course, is the hyperscaler, because there are only five or six of them,\" Huang said on the May earnings call. \"The rest of them, the rest of the industry, represents 250,000 companies around the world.\"\nAs Wall Street gears up for Nvidia's fiscal second-quarter earnings report after the bell on Wednesday, the ACIE portion of the customer base is coming under the microscope. In the first quarter, the two segments were almost equal, with Nvidia reporting $37.9 billion in hyperscaler sales and nearly $37.5 billion in ACIE revenue. Nvidia highlighted that its ACIE revenue grew at 31% from the prior period, topping 12% growth from hyperscalers.\nSkepticism has started seeping into the stock. The shares fell 2.9% on Monday, dropping for a seventh straight day, the longest losing streak since 2022. They're down 7.5% over that stretch.\nNvidia stakeholders want the company to become less reliant on a small subset of customers, and they also worry about the ability of those companies to further bolster their spending. Amazon and Alphabet turned cash flow negative in the second quarter, and Meta's cash generation dwindled by more than 90% from a year earlier. Both of Elon Musk's public companies — SpaceX and Tesla — reported negative free cash flow as they pursue AI expansions.\n\"This story underneath the surface is investors' concern about just how sustainable the run has been for Nvidia, and feeling like the hyperscalers just can't give much more,\" Gene Munster, managing partner at Deepwater Asset Management, said in an interview. \"They want to start to see the other segment starting to kick in.\"\nOther business to grow faster\nNvidia in May provided nine restated quarters of history on its website, showing hyperscalers making up about 55% of data center revenue in the past year. Hyperscaler revenue soared 115% from a year earlier in the most recent quarter, topping the 74% growth from ACIE customers.\nAnalysts expect the trend to flip going forward. The ACIE side of the business is expected to show 149% annual growth over the past year to $43 billion in the second quarter, while hyperscaler revenue is likely to show growth of 83% to $43.6 billion, according to StreetAccount. One potential big driver for the hyperscaler business is SpaceX, which aims to rapidly build out Nvidia-based data centers over the next year, Munster said.\nIn total, analysts see Nvidia's revenue almost doubling from a year earlier to $92.2 billion, according to LSEG. Data center continues to account for a bigger chunk of sales, with that division expected to reach $86.3 billion, based on StreetAccount estimates. That would be 94% of the total, up from 92% in the first quarter.\nFor the full year, analysts expect 83% revenue growth to $396 billion, before slowing to 44% expansion next year, according to LSEG.\nIn its effort to diversify, Nvidia is being proactive rather than waiting for new customers to arrive. Recognizing that very few companies have the cash or balance sheet to support purchases of its rack-scale systems, Nvidia is working with Wall Street to turn GPUs into an asset class.\nEarlier this month, Nvidia unveiled a program with six leading financial firms that could pull together up to $500 billion in financing from investors who view chips as an investable asset, like real estate. Such a project, Huang said, could enable more companies to borrow money for GPU purchases at lower rates, because the chips will generate returns.\nNvidia said in the announcement that it had signed a memorandum of understanding with the investment firms. Few specifics have been presented.\n\"There's been a lot of headlines and big numbers and not a lot of details on how this stuff is going to work yet,\" Stacy Rasgon, an analyst at Bernstein, told CNBC last week. \"Color that they could give on that would be helpful to put some investors' minds at ease.\"\nAnother crucial number in Nvidia's earnings report will be sales of Vera Rubin systems, which have just recently started to ramp up. Earlier this year, Huang told attendees at the company's GTC conference that he expects $1 trillion in sales through 2027 from current-generation Blackwell and Vera Rubin.\nQuestions about the long tail of the customer base could ease if Vera Rubin looks like an even bigger success than projected.\n\"We expect Nvidia to report strong results and guidance with ramping Rubin GPU shipments representing the key drivers of upside,\" KeyBanc analysts, who recommend buying the stock, wrote in a note over the weekend.",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Dick's Sporting Goods on Tuesday reported quarterly earnings that missed Wall Street expectations and lowered its outlook for Foot Locker amid what it called a \"challenging athletic footwear and apparel marketplace.\"\nDick's stock fell roughly 15% in premarket trading Tuesday.\nThe company said Dick's stores saw 4.9% comparable sales growth for the quarter driven by \"broad-based growth\" across categories, including strong results from the World Cup.\nHowever, Dick's said Foot Locker saw comparable sales decline by 3.6%, leading the company to revise its outlook to for the Foot Locker business to a range of flat to down 2%. It still expects the Dick's business to grow between 2.5% and 4%, but the company lowered its overall net sales outlook for the year from a range of between $22.1 billion and $22.4 billion to a range of between $21.9 billion and $22.2 billion.\nThe company lowered its consolidated operating income outlook from a previous range of between $1.69 billion and $1.81 billion to a range of $1.45 billion to $1.55 billion.\nHere's how Dick's performed in its second fiscal quarter compared with what Wall Street was expecting, according to a survey of analysts by LSEG:\n- Earnings per share: $3.53 adjusted vs. $3.76 expected\n- Revenue: $5.59 billion vs. $5.65 billion expected\nFor the period ended Aug. 1, Dick's reported net income of $315 million, or $3.50 per share, down from $381 million, or $4.71 per share, the year prior. Adjusting for one-time items, including its Foot Locker acquisition, Dick's reported $3.53 per share.\nSales rose to $5.59 billion from $3.65 billion in the year-ago period.\n\"While we are taking a more cautious view of the balance of the year, we remain highly confident in the strength of the DICK'S Business and our long-term opportunity at Foot Locker,\" CEO Lauren Hobart said in a statement.\nThe company also said it received $59 million in tariff refunds during the quarter and $2.1 million in related interest income.\nThe earnings come as Dick's is in the midst of implementing a turnaround for Foot Locker, which has previously weighed on the company's bottom line. Dick's has sought to refine Foot Locker's strategy to return to growth, especially at a time when sportswear is booming.\nDick's acquired Foot Locker for $2.4 billion in 2025, saying at the time that it planned to use the deal to expand its international presence and better position itself against its competitors.",

    "title": "The 'debasement trade' returns after Bessent bond maneuver. Crypto and gold are back in style",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "The debasement trade is gaining new traction on Wall Street as concern over the size and cost of the budget deficit mounts.\nThe conventional wisdom behind the trade is that perceived hard assets, like cryptocurrencies and precious metals, gain as investors try to hedge against a weaker U.S. dollar and Treasury debt in the face of ballooning government spending. Those fears reached a fever pitch last week before, and after, the Treasury Department's unusual step of increasing debt buybacks under Secretary Scott Bessent.\n\"The size of the Treasury purchases announced so far by Bessent are trivial in comparison to the size of the overall market, but the [signaling] effect was very powerful,\" said Stephen Coltman, head of macro at 21Shares, a crypto-focused creator of exchange-traded funds.\nGold touched three-month highs Monday, building on last week's advance of more than 5%. The yellow metal has climbed for five straight weeks and in August is on track for its biggest monthly rise since 1999.\nBitcoin added 2% Monday, to the highest since May. Last week, the digital currency soared 22%, its biggest three-day rally since 2023. Overnight Tuesday, the crypto touched $80,000.\nConversely, investors fled the dollar.\nThe U.S. dollar index, which tracks the dollar against six other leading currencies, hit three-month lows last week and recorded its third down week in the last four. The index was little changed on Monday as investors expressed little appetite to bid up the greenback.\n'Message' in markets\nThe Treasury Department said last week that it would double the maximum size of its bond buyback, to at least $4 billion from $2 billion. Two senior Treasury officials told CNBC Monday that the department could use its General Account to help fund the plans.\nLast week's announcement followed news that the monthly U.S. budget deficit in July reached a five-year high and came at the same time as total federal government debt topped $40 trillion. Bessent told CNBC last week that he wields a \"big toolkit\" to calm the government bond market amid concerns about the government's financial health.\nLong-dated U.S. Treasury yields surged last week, at one point sending the 30-year yield to almost a 20-year high of 5.34%, up from 4.82% in late June. Yields dipped and then rebounded in the wake of the Treasury buyback move, a signal that bond investors believed Bessent's moves were inadequate.\n\"Markets are saying something,\" the billionaire philanthropist and former energy trader John Arnold said in a Friday post on X. The weaker dollar, lower Treasury prices and strengthening hard assets, are \"all part of the debasement trade,\" he wrote.\nThe Treasury's moves could aid the bond market, but also translate into outsized pain for the dollar, according to Nohshad Shah, Citadel's head of fixed income sales for Europe, the Middle East and Africa.\nThe stakes are high for monetary policymakers, as a weaker greenback can ease financial conditions, Shah said. U.S. inflation — above the Federal Reserve's 2% target for five years — could worsen.\nThe Fed might need to hike interest rates in response, Shah said. Fed funds futures reflect about a 56% chance the central bank raises borrowing costs at its October meeting, up more than seven percentage points from a week ago, according to CME's FedWatch tool.\n\"The bond market's message is straightforward: fiscal or monetary policy should be tighter,\" Shah said in a Monday note. \"Households may ultimately pay for policymakers' unwillingness to fix the roof whilst the sun is shining.\"\nColtman at 21Shares said the appetite for alternative stores of value also stems from mounting geopolitical tension. The U.S. on Monday rolled out a global sanctions program focused on segregating Iran from the global economy, days after slapping 50% tariffs on billions of dollars in Canadian exports.\n'Inflection point'\nStill, assets that would benefit from a debasement trade have recently received votes of confidence on Wall Street.\nDeutsche Bank analyst Michael Hsueh said in a Monday note that gold could surpass his target price of $4,800 an ounce. Already, that level suggests the precious metal only need to rise another 3% or so from where it closed on Friday. \"We see the Treasury policy change as underlining the gold constructive view,\" Hsueh said.\nBillionaire investor Ray Dalio recommended investors remain overweight gold and bitcoin ahead of what he warned could become a debt crisis in the U.S. as a result of unchecked government spending. Gold could account for as much as 15% of a model portfolio, the Bridgewater Associates founder said.\n\"The government's financial condition is at an inflection point,\" Dalio wrote on LinkedIn Friday. \"If this is not dealt with now, the debts will build up to levels where they can't be managed without great trauma.\"\nOthers are less sure, devaluing the notion of a debasement trade.\nIt's probably too early to endorse the idea unless it's clear that the Fed will go along with the Treasury Department, said Alexander Lis, investing chief at Social Discovery Ventures.",

    "bodyOriginal": "OnlyFans owner was paid over $700m before his death\n- Published\nThe late owner of streaming platform OnlyFans was paid more than $700m (£513m) in dividends before his death from cancer earlier this year.\nFenix International Ltd, the British company that owns OnlyFans, made $714m in profit before tax last year, it said in its annual report. This is an increase of 5% from 2024.\nThe site hosts a range of subscription-based content from cooking to fitness videos, but it is best known for pornography and is credited with transforming online adult content by encouraging personal connection between sex workers and subscribers.\nIts owner Leonid Radvinsky, who died earlier this year aged 43, bought the site from its British founders in 2018.\nOnlyFans employs just 47 people. Companies with such high profits rarely have such small staff - for example, British retail giant Marks and Spencer, which employs over 65,000 people, made £671m in profit last year.\nFenix International's company results show that it paid dividends of $535m for the year ending 30 November 2025, with further dividends payments totalling $174m between then and 26 March 2026.\nRadvinsky, who was born in Ukraine and raised in the US, died on 23 March. The company is now owned by his widow, Yekaterina 'Katie' Chudnovsky.\nOnlyFans surged in popularity during the Covid-19 pandemic, landing Radvinsky on Forbes' annual list of billionaires just three years later.\nThe site is known for the way it encourages creators and fans to connect through livestreams, personalised messages, and direct requests for custom-made photos and videos.\nIn return for hosting the material, OnlyFans takes a 20% share of all payments.\nThe site had 132 million paying subscribers and 2.5 million active creators in 2025.\nThe boom in size and popularity under Radvinsky's ownership also brought scrutiny from lawmakers and regulators over its adult content — a recent BBC Three documentary uncovered allegations of exploitation, coercion and violence committed against OnlyFans creators.\nIn 2024, British regulators launched an investigation into whether children were accessing porn, an issue that the company at the time blamed on a technical issue.\nOfcom ultimately dropped that probe, but it fined the firm about £1m, external for failing to respond accurately to its requests for information about the measures it had in place to check the age of its users, who in theory must be 18 or over.\nCreators have also debunked the narrative that making explicit videos on the site is a get-rich-quick scheme.\nKeily Blair, the chief executive of OnlyFans, said on Tuesday that the company had paid over $30bn to creators since launching a decade ago.\n\"OnlyFans provides real opportunities to real people by creating a safe, regulated space where people can monetise their content with a global fan base,\" she said.\n\"As a UK-based business we have also made a significant contribution to the UK economy, paying over £600 million in corporate taxes from 2016 to date.\"\nRelated topics\n- Published23 March\n- Published9 April 2025",

    "id": "burnham-refuses-to-rule-out-tax-rises-in-fde4d4df",
    "title": "Burnham refuses to rule out tax rises in autumn Budget",
    "titleJa": "バーナム氏、秋予算での増税の可能性を排除せず",
    "summaryJa": "バーナム氏、秋予算での増税の可能性を排除せず- 公開されました",
    "bodyOriginal": "Burnham refuses to rule out tax rises in autumn Budget\n- Published\nAndy Burnham has refused to rule out tax rises in the upcoming autumn Budget, saying he \"won't be unrealistic\" about the \"challenging\" state of public finances.\nThe prime minister said he would take a \"careful approach\" to the economy, and defended his previously announced cost of living pledges as funded spending commitments.\nBurnham became prime minister in July promising to give people breathing space and help with the cost of living, but questions remain over how major policies such as social care reforms will be funded.\nExperts have previously warned that he and Chancellor John Healey will have little financial room to manoeuvre in their first Budget on 28 October.\nSpeaking during his first visit to Ukraine, Burnham said the policies announced so far including capping bus fares at £2 and cutting VAT on household electricity bills were \"the first steps that I've felt able to make\", and were doable because he was able to reprioritise funding from elsewhere.\n\"I took the decision early on that digital ID wasn't the top priority for now. And so we've reprioritised funding to other priorities,\" he said in an interview with ITV.\nAsked if the public needed to accept some of the new policies would have to be paid for in tax rises, Burnham said they wouldn't necessarily have to accept that.\nPushed on whether he would need to raise taxes to cover spending gaps, he said: \"I will always take a careful approach to things. I ran Greater Manchester for 10 years and we ran a very tight ship with rock solid finances.\n\"Nothing will change as I come into this role as prime minister. I won't take risks with people's jobs or their livelihoods or their family finances.\n\"I will try to help them in whatever way I can, I have already done some things that will help them.\"\nBurnham previously told the BBC he accepts his earlier announcements aimed at tackling the cost of living are not enough on their own and hinted at further support.\nSpeaking during his first official overseas visit on Monday, he said while he would do what he could, \"I won't be unrealistic and people really need to understand that.\n\"We are in a challenging position, whatever I do will be carefully thought through, it will be funded and there will be more to come as we go into the autumn.\"\nLast week official figures showed the the government borrowed more than expected in July, despite a record month for income tax receipts.\nInflation also reached a four-month high of 2.9% in July and is expected to rise further due to the ongoing impact of the Iran war, which has hit energy prices and fuel costs.\nExperts have warned Burnham and Healey that they need to either raise taxes or cut spending elsewhere as pressure on the public finances has left no room for extra borrowing.\nBoth the prime minister and chancellor have vowed to stick to the fiscal rules set by former chancellor Rachel Reeves.\nThe rules are designed to ensure day-to-day spending is funded through tax revenue by the end of the Parliament, and to reduce debt as a proportion of GDP.\nRain Newton-Smith, the chief executive of the Confederation of British Industry, said business owners wanted to create opportunities for young people but \"the cost of employing people has gone up so much\".\n\"The business leaders I speak to say that the cost of doing business has gone up so much that it's holding them back from creating opportunities,\" she told the Today programme.\nShe said targeted support for businesses would create \"more growth and more opportunities that saves money for the government and ultimately leads to higher tax receipts\".\nGet in touch\nDo you have any views, comments or questions about this story?\nRelated topics\n- Published12 August\n- Published12 August",
    "bodyJa": "バーナム氏、秋予算での増税の可能性を排除せず\n- 公開されました\nアンディ・バーナム氏は、財政の「困難な」状況について「非現実的ではない」と述べ、次期秋予算での増税の可能性を排除することを拒否した。\n首相は経済に対して「慎重なアプローチ」を取ると述べ、以前に発表した生活費の公約は財源を充てた支出の公約であると擁護した。\nバーナム氏は7月に首相に就任し、人々に息抜きのスペースを与え、生活費を援助すると約束したが、社会保障改革などの主要政策にどのように資金が投入されるのかについては疑問が残っている。\n専門家らは以前、同首相とジョン・ヒーリー首相が10月28日の最初の予算案で財政的に機動できる余地はほとんどないと警告していた。\nバーナム氏は初のウクライナ訪問中に講演し、バス運賃の上限2ポンドや家庭用電気代の付加価値税引き下げなど、これまでに発表された政策は「実行可能だと感じた最初の一歩」であり、他国からの資金の優先順位を再設定できたため実行可能だったと述べた。\n同氏はITVとのインタビューで、「デジタルIDは現時点では最優先事項ではないと早い段階で判断した。そのため、資金調達の優先順位を他の優先事項に変更した」と述べた。\nバーナム氏は、新たな政策の一部は増税で賄わなければならないことを国民が受け入れる必要があるかとの質問に対し、必ずしも受け入れる必要はない、と述べた。\n歳出不足を補うために増税が必要かどうかについては、「私は常に慎重に物事に取り組むつもりだ。私はグレーター・マンチェスターを10年間経営してきたが、我々は盤石な財政で非常にタイトな船を経営していた」と語った。\n「私が首相としてこの役割に就いても何も変わりません。私は人々の仕事、生計、家計に関してリスクを負いません。\n「私はできる限りの方法で彼らを助けようとします。私はすでに彼らを助けるためにいくつかのことをしました。」\nバーナム氏は以前BBCに対し、生活費対策だけでは十分ではないとの初期の発表を受け入れ、さらなる支援を示唆したと語った。\n月曜日の初の海外公式訪問で演説した同氏は、できる限りのことを行うとしながらも、「非現実的なことはしないし、人々はそれを本当に理解する必要がある」と述べた。\n「私たちは難しい立場にいます。私が何をするにしても慎重に検討され、資金も提供され、秋に向けてさらに多くのことが起こるでしょう。」\n先週の公式統計は、所得税収入が記録的な月となったにもかかわらず、政府が７月に予想を上回る借入を行ったことを示した。\nインフレ率も7月には2.9％と4カ月ぶりの高水準に達しており、エネルギー価格や燃料費に打撃を与えているイラン戦争の影響が続いているため、さらに上昇すると予想されている。\n専門家らはバーナム氏とヒーリー氏に、財政への圧力により追加借入の余地がなくなったため、増税するか他の支出を削減する必要があると警告している。\n首相も首相も、レイチェル・リーブス前首相が定めた財政ルールを堅持すると誓った。\nこの規則は、議会終了までに日々の支出が税収によって確実に賄われ、GDPに占める債務を削減することを目的としている。\n英国産業連盟のレイン・ニュートン・スミス最高経営責任者（CEO）は、経営者らは若者に機会を創出したいと考えているが、「人材の雇用コストが大幅に上昇している」と述べた。\n「私が話を聞いたビジネスリーダーたちは、事業コストが上がりすぎて機会を生み出すことが妨げられていると言っています」と彼女はトゥデイ番組で語った。\n同氏は、企業への的を絞った支援が「さらなる成長とより多くの機会を生み出し、政府の資金を節約し、最終的には税収の増加につながる」と述べた。\n連絡する\nこの話に関して何かご意見、ご意見、ご質問はありますか？\n関連トピック\n- 8 月 12 日発行\n- 8 月 12 日発行",
