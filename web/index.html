    "id": "roth-conversions-when-the-juice-isn-t-re-c795ebcb",
    "title": "Roth conversions: When the ‘juice isn't really worth the squeeze,’ according to a top-ranked advisor",
    "titleJa": "Roth conversions: When the ‘juice isn't really worth the squeeze,’ according to a top-ranked advisor",
    "summaryJa": "If you're considering a year-end Roth conversion for 2026, there are some key things to know, experts say.",
    "bodyOriginal": "Roth individual retirement account conversions can potentially reduce lifetime taxes. But the strategy isn't right for everyone, and the choice is now more complex amid updates from President Donald Trump's \"big beautiful bill\" and other changes.\nRoth conversions transfer pretax or nondeductible IRA funds into a Roth IRA, which kick-starts tax-free growth. The trade-off is that they can trigger more income in the year of the conversion.\nThe move can be attractive if you have large pretax retirement balances and you expect higher tax rates when it's time to withdraw the funds, experts say.\nAt year-end 2025, IRA-owning households in the U.S. had $15.9 trillion in assets in traditional IRAs, compared with $2.4 trillion in after-tax Roth IRAs, according to a 2026 report from the Investment Company Institute, an investing trade organization.\nWeighing Roth conversions, or partial Roth conversions, is \"a strategy that continues to be very popular year-over-year,\" said Charissa Anderson, a certified financial planner who is an executive vice president at Ferguson Wellman Capital Management in Portland, Oregon. Her firm ranked No. 52 on CNBC's Financial Advisor 100 list for 2026.\nAs of March 31, Roth conversions were up 41% this year compared with the same period in 2025, according to the latest Fidelity data, based on an analysis of 19.6 million IRA accounts.\nBut experts say the strategy isn't right for everyone.\n\"There are just so many variables\" when analyzing a possible Roth conversion, said Tommy Lucas, a CFP at Moisand Fitzgerald Tamayo in Orlando, Florida. His firm is ranked No. 44 on CNBC's Financial Advisor 100 list for 2026.\nThese could include when you claim Social Security, your life expectancy and legacy goals, among other factors, he said.\nDepending on your tax bracket, \"sometimes the juice isn't really worth the squeeze,\" said Lucas. \"And we're going to have to squeeze every single year\" because multiple factors can change the analysis.\nIf you're eyeing a Roth conversion before year-end, here are some key things to consider.\nRoth conversions impact tax benefits\nWhen deciding on a Roth conversion, projections should include the current year's taxes, along with an analysis of future years, financial advisors say.\n\"The [tax] bracket you see isn't always the rate you pay,\" because more income could phase out, or reduce, other tax benefits, according to CFP Tommy Blackburn, senior financial planner and partner at Mason and Associates in Newport News, Virginia. He is also a certified public accountant.\nAs an example, Blackburn pointed to a client in the 22% tax bracket with a child in college. Income from a conversion could trigger taxes above 30% because the client would lose an education tax credit, which is subtracted from their taxes owed, he said.\nBy comparison, a client in the 10% tax bracket could convert a limited amount under their standard deduction without owing additional taxes for the current year, he said.\nMore income could also impact temporary tax deductions enacted via Trump's \"big beautiful bill,\" which have varying income phaseouts.\nThese could include the bigger federal deduction limit for state and local taxes, known as SALT, worth up to $40,400 for 2026, or the $6,000 senior \"bonus\" deduction, among others.\nRetirees should also consider income-related monthly adjustment amounts, or IRMAAs, which increase Medicare Part B and Part D premiums once income exceeds a certain level. The surcharge is based on modified adjusted gross income from two years prior.\nACA enrollees should 'proceed with caution'\nBoosting your AGI with Roth conversions can also reduce the premium tax credit, which makes Affordable Care Act marketplace health insurance less expensive.\nEarning even $1 more than a certain income limit can threaten eligibility for the credit — known as the \"ACA cliff\" — and enrollees could owe full premiums for health coverage.\nThe cliff affects ACA enrollees when household income exceeds 400% of the federal poverty line, which varies by family size. For 2026, those limits are about $63,000 for a single person or $129,000 for a family of four.\nThat's why marketplace health insurance enrollees should \"proceed with caution\" before completing a Roth conversion, said CFP Bill Shafransky, a senior wealth advisor with Moneco Advisors in New Canaan, Connecticut.\n\"This is one of those financial strategies where you really want to dot your i's and cross your t's before acting,\" he said.\nCNBC receives no compensation from placing financial advisory firms on our Financial Advisor 100 list. Additionally, a firm's or advisor's appearance in our ranking does not constitute an individual endorsement by CNBC of any firm or advisor.",
    "bodyJa": "Roth individual retirement account conversions can potentially reduce lifetime taxes. But the strategy isn't right for everyone, and the choice is now more complex amid updates from President Donald Trump's \"big beautiful bill\" and other changes.\nRoth conversions transfer pretax or nondeductible IRA funds into a Roth IRA, which kick-starts tax-free growth. The trade-off is that they can trigger more income in the year of the conversion.\nThe move can be attractive if you have large pretax retirement balances and you expect higher tax rates when it's time to withdraw the funds, experts say.\nAt year-end 2025, IRA-owning households in the U.S. had $15.9 trillion in assets in traditional IRAs, compared with $2.4 trillion in after-tax Roth IRAs, according to a 2026 report from the Investment Company Institute, an investing trade organization.\nWeighing Roth conversions, or partial Roth conversions, is \"a strategy that continues to be very popular year-over-year,\" said Charissa Anderson, a certified financial planner who is an executive vice president at Ferguson Wellman Capital Management in Portland, Oregon. Her firm ranked No. 52 on CNBC's Financial Advisor 100 list for 2026.\nAs of March 31, Roth conversions were up 41% this year compared with the same period in 2025, according to the latest Fidelity data, based on an analysis of 19.6 million IRA accounts.\nBut experts say the strategy isn't right for everyone.\n\"There are just so many variables\" when analyzing a possible Roth conversion, said Tommy Lucas, a CFP at Moisand Fitzgerald Tamayo in Orlando, Florida. His firm is ranked No. 44 on CNBC's Financial Advisor 100 list for 2026.\nThese could include when you claim Social Security, your life expectancy and legacy goals, among other factors, he said.\nDepending on your tax bracket, \"sometimes the juice isn't really worth the squeeze,\" said Lucas. \"And we're going to have to squeeze every single year\" because multiple factors can change the lees when household income exceeds 400% of the federal poverty line, which varies by family size. For 2026, those limits are about $63,000 for a single person or $129,000 for a family of four.\nThat's why marketplace health insurance enrollees should \"proceed with caution\" before completing a Roth conversion, said CFP Bill Shafransky, a senior wealth advisor with Moneco Advisors in New Canaan, Connecticut.\n\"This is one of those financial strategies where you really want to dot your i's and cross your t's before acting,\" he said.\nCNBC receives no compensation from placing financial advisory firms on our Financial Advisor 100 list. Additionally, a firm's or advisor's appearance in our ranking does not constitute an individual endorsement by CNBC of any firm or advisor.",

  {
    "id": "boomers-are-buying-into-the-promise-of-m-1ea8fac5",
    "title": "Boomers are buying into the promise of monthly income from options ETFs, but there's a tax catch",
    "titleJa": "Boomers are buying into the promise of monthly income from options ETFs, but there's a tax catch",
    "summaryJa": "Covered call ETFs have been widely adopted by baby boomers to meet monthly income needs, but unlike most ETFs, the tax implications can be significant.",
    "bodyOriginal": "Covered call ETFs have gained a following for their ability to generate monthly cash flow. But a tax surprise could be lurking for many investors.\nThese actively managed funds have different underlying assets and strategies. But the premise is generally the same. Covered call funds hold equities and sell call options or use related derivatives to generate income. Investors receive attractive income yields in exchange for limited capital upside. The tax piece is more complicated, however.\nA fund that realizes option premiums, short-term gains or other income still has taxable amounts to distribute. The tax hit can be easy — and costly — for investors to miss, especially since ETFs are typically understood to be tax-efficient investment vehicles, and especially since most investors aren't looking at the tax implications until they receive a 1099-DIV at tax time, the IRS tax document issued by financial services companies to report dividends and related distributions paid to investors during a tax year.\nEven if a fund has good returns and a favorable 30-day SEC yield — which measures the net investment income of bond funds or equity funds and is annualized to reflect the yield an investor would expect to earn over the course of a full year — investors need to look under the hood and understand the tax implications of covered call ETFs. \"The after-tax net total return might fall below your expectations,\" said Matthew Smart, chief investment officer at WWM Investments in Chicago.\nHere's what investors need to know about covered call ETFs and taxes:\nNot all income distributions are created equal\nDistributions from covered call funds come in several forms: dividends, capital gain distributions, or non-dividend distributions. The distribution mix can vary by fund and change year to year. Non-dividend distributions are commonly known as return of capital — payment or distribution from a portion of an investor's original principal rather than an economic profit, capital gain, or dividend earnings. And this is where it can get confusing for investors because ROC distributions aren't treated as current income. Instead, they reduce the investment's cost basis by the distribution amount, so they are tax-deferred until shares are sold.\nCovered call ETFs take different approaches to distributions. \"Some covered call strategies make distributions characterized only as ordinary dividends. Other strategies make distributions that may include all three types. And since investors' individual tax rates vary significantly, there can be a large difference between what investors receive in fund distributions on a pre-tax basis, and what they keep after paying taxes,\" ProShares wrote in a blog on covered call strategy and tax efficiency.\nInvestors surprised by cost-basis and delayed taxes\nSome covered call ETF investors are surprised at tax time by the magnitude of the qualified dividends and ordinary income, said Edwin Retter, senior wealth advisor in the Melbourne, Florida, office of Mission Wealth.\nThey are also confused by the ROC concept. While it seems favorable from a distribution standpoint in the short term, it's investors' own money coming back to them, which reduces the cost basis. Having a lower cost basis generally increases the investor's capital gains tax liability at the time of sale.\n\"You're not avoiding the taxes; you're just delaying it until you sell,\" said Aaron Brachman, wealth manager at the Washington Wealth Group of Steward Partners in Washington, D.C.\nUse of tax-deferred accounts is recommended\nInvestors who decide to purchase a covered call ETF should ideally do so within a tax-deferred account such as a traditional IRA, Retter said. \"I don't know how many investors give so much thought to that. They just find out at tax time that they've put it in a less tax-desirable account.\"\nBy investing in a covered call ETF through a traditional IRA, investors don't have to worry about taxes until they pull money out of the account. \"You can really save a lot of time and taxes by putting it in the right account structure,\" Retter said.\nTax-cost ratio is a key measure to evaluate\nInvestors who want to better understand how taxes come into play in a covered call ETF can use a measurement known as the tax-cost ratio. The Morningstar Tax Cost Ratio measures how much a fund's annualized return is reduced by the taxes investors pay on distributions. Investors can type in the ticker of the fund they are researching on Morningstar.com, click on the price tab, and scroll down to see the tax-cost ratio.\n\"It is a flexible tool that can help investors easily compare different time periods, different funds, and different categories. Investors pay taxes when they receive a taxable distribution and these costs are just as relevant as the expense ratio in reducing an investor's take-home return,\" Morningstar wrote in a paper explaining the methodology for the calculation.\nFor instance, the JPMorgan Equity Premium Income ETF (JEPI) has a three-year tax cost ratio of 3.11, according to Morningstar. That means after-tax returns are reduced by about 3.11 percentage points annually for investors in the highest tax brackets.\nAnother example is the JPMorgan Nasdaq Equity Premium Income ETF (JEPQ). The fund's three-year tax cost ratio is 4.30. By contrast, the Neos S&P 500(R) High Income ETF (SPYI) has a three-year tax cost ratio of 0.48.\nThe tax picture can be very ETF-specific because it depends on how the fund is structured, said Brent Sullivan, an independent tax analyst at Tax Alpha Insider. SPYI has a higher return of capital than some of its peers, lowering the more immediate tax consequences, but there's still a cost-basis and fund growth issue for investors to consider, he added.\nPay attention to NAV\nIt's not just taxes investors have to consider with these funds. \"It's good to look at the portfolio returns, and it's good to look at tax consequences, but NAV has to grow faster than the distribution rate,\" Sullivan said. \"The fund's NAV must keep going up to sustain those distributions. It's not magic. The money has to come from somewhere, and it can't just come from new investors,\" he said.\nInvestors should also look at a fund's 30-day SEC yield to get a sense of what the company is generating in terms of income. JEPI has a 30-day SEC yield of 7.45%, compared with JEPQ's 11.56%, and SPYI's 0.45%.\nConsider other income-generation alternatives\nSeveral financial advisors said they aren't fans of covered call ETFs for tax, complexity and other reasons.\nWith the 10-year U.S. Treasury continuing to hover around 5%, there are more opportunities for investors to find attractive income in bonds, from ultra-short bond funds to corporate bonds.\n\"I'd rather have a person in a portfolio that's predominantly fixed income and hedge the interest rate risk with 20% to 40% of the portfolio in high-quality growth stocks,\" said Andrew Urbanski, founder and chief investment officer at N10 Assets in Greenwich, Connecticut. \"If the income isn't enough, draw on the principal from the bond or stock portion of the portfolio in a way that's more risk and cost-efficient,\" he said.\nCovered call ETFs do cap an investor's upside. In a taxable account, an investor might instead buy an S&P 500 ETF — or a total market ETF to get more small and mid-cap exposure — collect the dividends, and make systematic withdrawals through small periodic share sales after a year for tax-efficiency reasons, Retter said.\nIndex-based ETFs generally have lower expense ratios than their actively managed counterparts. The Vanguard S&P 500 ETF (VOO) has an expense ratio of 0.03%. The Vanguard Morningstar Total Stock Market ETF (VTI) also has an expense ratio of 0.03%.\nBy contrast, JEPI and JEPQ each have an annual expense ratio of 0.35%. SPYI has an expense ratio of 0.68%.\nMeanwhile, many of the covered call ETF funds include the large tech stocks such as Nvidia, Apple, Microsoft, Alphabet, Amazon and Meta that have been driving the market's growth, so it is important for investors to know whether these stocks are already well represented in their portfolio.",
    "bodyJa": "Covered call ETFs have gained a following for their ability to generate monthly cash flow. But a tax surprise could be lurking for many investors.\nThese actively managed funds have different underlying assets and strategies. But the premise is generally the same. Covered call funds hold equities and sell call options or use related derivatives to generate income. Investors receive attractive income yields in exchange for limited capital upside. The tax piece is more complicated, however.\nA fund that realizes option premiums, short-term gains or other income still has taxable amounts to distribute. The tax hit can be easy — and costly — for investors to miss, especially since ETFs are typically understood to be tax-efficient investment vehicles, and especially since most investors aren't looking at the tax implications until they receive a 1099-DIV at tax time, the IRS tax document issued by financial services companies to report dividends and related distributions paid to investors during a tax year.\nEven if a fund has good returns and a favorable 30-day SEC yield — which measures the net investment income of bond funds or equity funds and is annualized to reflect the yield an investor would expect to earn over the course of a full year — investors need to look under the hood and understand the tax implications of covered call ETFs. \"The after-tax net total return might fall below your expectations,\" said Matthew Smart, chief investment officer at WWM Investments in Chicago.\nHere's what investors need to know about covered call ETFs and taxes:\nNot all income distributions are created equal\nDistributions from covered call funds come in several forms: dividends, capital gain distributions, or non-dividend distributions. The distribution mix can vary by fund and change year to year. Non-dividend distributions are commonly known as return of capital — payment or distribution from a portion of an investor's original principal rather than an economic profit, capital gain, or dividend earnings. And this is where it can get confusing for investors because ROC distributions aren't treated as current income. Instead, they reduce the investment's cost basis by the distribution amount, so they are tax-deferred until shares are sold.\nCovered call ETFs take different approaches to distributions. \"Some covered call strategies make distributions characterized only as ordinary dividends. Other strategies make distributions that may include all three types. And since investors' individual tax rates vary significantly, there can be a large difference between what investors receive in fund distributions on a pre-tax basis, and what they keep after paying taxes,\" ProShares wrote in a blog on covered call strategy and tax efficiency.\nInvestors surprised by cost-basis and delayed taxes\nSome covered call ETF investors are surprised at tax time by the magnitude of the qualified dividends and ordinary income, said Edwin Retter, senior wealth advisor in the Melbourne, Florida, office of Mission Wealth.\nThey are also confused by the ROC concept. While it seems favorable from a distribution standpoint in the short term, it's investors' own money coming back to them, which reduces the cost basis. Having a lower cost basis generally increases the investor's capital gains tax liability at the time of sale.\n\"You're not avoiding the taxes; you're just delaying it until you sell,\" said Aaron Brachman, wealth manager at the Washington Wealth Group of Steward Partners in Washington, D.C.\nUse of tax-deferred accounts is recommended\nInvestors who decide to purchase a covered call ETF should ideally do so within a tax-deferred account such as a traditional IRA, Retter said. \"I don't know how many investors give so much thought to that. They just find out at tax time that they've put it in a less tax-desirable account.\"\nBy investing in a covered call ETF through a traditional IRA, investors don't have to worry about taxes until they pull money out of the account. \"You can really save a lot of time and taxes by putting it in the right account structure,\" Retter said.\nTax-cost ratio is a key measure to evaluate\nInvestors who want to better understand how taxes come into play in a covered call ETF can use a measurement known as the tax-cost ratio. The Morningstar Tax Cost Ratio measures how much a fund's annualized return is reduced by the taxes investors pay on distributions. Investors can type in the ticker of the fund they are researching on Morningstar.com, click on the price tab, and scroll down to see the tax-cost ratio.\n\"It is a flexible tool that can help investors easily compare different time periods, different funds, and different categories. Investors pay taxes when they receive a taxable distribution and these costs are just as relevant as the expense ratio in reducing an investor's take-home return,\" Morningstar wrote in a paper explaining the methodology for the calculation.\nFor instance, the JPMorgan Equity Premium Income ETF (JEPI) has a three-year tax cost ratio of 3.11, according to Morningstar. That means after-tax returns are reduced by about 3.11 percentage points annually for investors in the highest tax brackets.\nAnother example is the JPMorgan Nasdaq Equity Premium Income ETF (JEPQ). The fund's three-year tax cost ratio is 4.30. By contrast, the Neos S&P 500(R) High Income ETF (SPYI) has a three-year tax cost ratio of 0.48.\nThe tax picture can be very ETF-specific because it depends on how the fund is structured, said Brent Sullivan, an independent tax analyst at Tax Alpha Insider. SPYI has a higher return of capital than some of its peers, lowering the more immediate tax consequences, but there's still a cost-basis and fund growth issue for investors to consider, he added.\nPay attention to NAV\nIt's not just taxes investors have to consider with these funds. \"It's good to look at the portfolio returns, and it's good to look at tax consequences, but NAV has to grow faster than the distribution rate,\" Sullivan said. \"The fund's NAV must keep going up to sustain those distributions. It's not magic. The money has to come from somewhere, and it can't just come from new investors,\" he said.\nInvestors should also look at a fund's 30-day SEC yield to get a sense of what the company is generating in terms of income. JEPI has a 30-day SEC yield of 7.45%, compared with JEPQ's 11.56%, and SPYI's 0.45%.\nConsider other income-generation alternatives\nSeveral financial advisors said they aren't fans of covered call ETFs for tax, complexity and other reasons.\nWith the 10-year U.S. Treasury continuing to hover around 5%, there are more opportunities for investors to find attractive income in bonds, from ultra-short bond funds to corporate bonds.\n\"I'd rather have a person in a portfolio that's predominantly fixed income and hedge the interest rate risk with 20% to 40% of the portfolio in high-quality growth stocks,\" said Andrew Urbanski, founder and chief investment officer at N10 Assets in Greenwich, Connecticut. \"If the income isn't enough, draw on the principal from the bond or stock portion of the portfolio in a way that's more risk and cost-efficient,\" he said.\nCovered call ETFs do cap an investor's upside. In a taxable account, an investor might instead buy an S&P 500 ETF — or a total market ETF to get more small and mid-cap exposure — collect the dividends, and make systematic withdrawals through small periodic share sales after a year for tax-efficiency reasons, Retter said.\nIndex-based ETFs generally have lower expense ratios than their actively managed counterparts. The Vanguard S&P 500 ETF (VOO) has an expense ratio of 0.03%. The Vanguard Morningstar Total Stock Market ETF (VTI) also has an expense ratio of 0.03%.\nBy contrast, JEPI and JEPQ each have an annual expense ratio of 0.35%. SPYI has an expense ratio of 0.68%.\nMeanwhile, many of the covered call ETF funds include the large tech stocks such as Nvidia, Apple, Microsoft, Alphabet, Amazon and Meta that have been driving the market's growth, so it is important for investors to know whether these stocks are already well represented in their portfolio.",

    "title": "Burnt out cars and shattered glass on Paris streets after protests turn to riots and looting",
    "titleJa": "Burnt out cars and shattered glass on Paris streets after protests turn to riots and looting",
    "summaryJa": "About 1,800 people were arrested after nationwide protests saw outbreaks of violence and vandalism.",
    "bodyOriginal": "Burnt out cars and shattered glass on Paris streets after protests turn to riots and looting\n- Published\nFrance awoke to scenes of widespread damage on Sunday after a day of riots and demonstrations, with shopfronts shattered, burnt out cars, charred bikes, and piles of glass and debris on the pavements of Paris.\nPolice arrested about 1,800 people on Saturday as some 550,000 demonstrators took to the streets for protests that were largely peaceful.\nThey were demonstrating against rising fuel prices, the cost of living and deteriorating public services, including schools.\nGroups of rioters, some dressed in black and wearing masks and balaclavas, also came out in Paris, Marseille and other towns and cities, with some setting fire to cars and buildings.\nWidespread looting took place across the cities of Paris, Marseille and Lille, as well as other areas.\nPresident Emmanuel Macron was due to address the nation at 20:00 local time on Sunday after what has been described as one of the worst outbreaks of disorder in modern French history.\nIn Paris, protesters clashed with riot police, who turned tear gas and water cannon on the crowds. During the day, some groups lit fires in the street and torched vehicles. At least one restaurant was gutted by fire, and the BBC saw fighting breaking out among some of the groups.\nRiot police were seen charging at one crowd in central Paris and hitting several people with batons.\n\"It's like we had a war,\" Paris resident Mehmet Ozeden told news agency AFP.\nAnother resident, Anita GrasIt, said it was \"terrifying\" to see groups of young people \"smashing everything, with total impunity\".\nThe looters were \"proudly carrying supermarket baskets filled with goods and laughing about their thefts\", Maryse, a woman living nearby who gave only her first name, told the BBC.\nFurther south in Marseille, protesters broke into the city hall by using a metal fence as a battering ram. In Lille, a McDonalds was set on fire, police said, and an Apple store in the city was broken into and looted.\nMore than 500 police officers, gendarmes and firefighters were injured in the unrest on Saturday, France's interior ministry said.\nAbout 1,500 shops and retailers were also damaged in the disturbances, the Retail and Trade Federation said.\nOn Sunday morning in Paris, residents surveyed the aftermath, which included the smashed glass frontages of designer stores including Ralph Lauren, Gucci and Versace.\nShopkeepers were out early with brooms, picking up large shards of glass as they began the clean-up. Rubbish trucks worked their way down some of the larger streets to clear some of the debris.\nMany shops were daubed with graffiti, some reading \"tax the rich\" and \"eat the rich.\"\nThe BBC visited a clothes shop close to the Place de la République which had been ransacked, with piles of clothes and furniture scattered across the shop floor.\nThe shop's distraught owner told the BBC he saw looters on the CCTV who were in the shop for just over an hour and a half, and that during that time he saw no police in the process.\nThe owner - who asked not to be identified - told the BBC he did not believe any of those who robbed the shop were genuine protesters against school conditions or the cost of living. He said the looters were taking advantage of the demonstrations.\nClose to the Place de la République, a BBC reporter visited the Good Vibes bakery, whose glass front was completely shattered, and the Nicolas wine store, where every bottle was either stolen or smashed, leaving smell of alcohol lingering in the street.\nCCTV footage shown on France's Channel 2 shows groups of teenagers, mostly wearing masks, in a shop selling mobile phones helping themselves to items from the shelves.\nStudent protests in France have seen hundreds of thousands take to the streets since they began late last month. Protesters have been demanding additional investment in their schools, criticising the lack of teachers and staff, overcrowded classrooms and run-down buildings.\nFrance's Interior Minister Laurent Nuñez said that while demonstrating was a fundamental right, there were \"outrages\" committed by \"several thousand far-left individuals\" who were determined to target public buildings and confront the police.\nLater, they were joined by \"delinquents who looted and ransacked numerous businesses in several cities in France\", he said.\nIn the city of Lyon, Mayor Grégory Doucet said the burning of the city's tourist office was \"a tragedy\", telling French outlet BFMTV that \"it breaks our hearts because it's a very iconic, well-known historic building\".\nLocal police said \"hostile individuals\" prevented firefighters from safely tackling the blaze.\nFire crews also battled a fire at Limoges town hall, which caused part of the building to collapse. Local officials said the town hall was \"largely lost.\"\n\"A wild horde\" had \"deliberately\" set fire to the 143-year-old building, said Maurice Barate, the prefect for the Haute-Vienne department.\nElsewhere, a young man \"had his hand blown off\" by a small explosive in Saint-Étienne, the south-eastern city's Mayor Régis Juanico said on social media.\n\"Such a tragedy should never have happened,\" he said.\nFrance's interior ministry said Saturday's protests involved \"targeted acts of violence\" from \"hooded individuals\" in places, including parts of the capital and also in Marseille, Rennes, Toulouse, and the western city of Angers.\nDamage to buildings was reported across France, including in Grenoble, Avignon, Pau, Montpellier and Valence.\nRelated topics\n- Published1 day ago",

    "id": "always-on-always-listening-new-ai-device-fda3b8e3",
    "title": "Always on, always listening: New AI devices are pushing legal limits and could put users in jeopardy",
    "titleJa": "Always on, always listening: New AI devices are pushing legal limits and could put users in jeopardy",
    "summaryJa": "AI always-listening wearables from Apple, Amazon, Meta and other startups are getting creative with privacy rules and fueling concerns about covert recordings.",
    "bodyOriginal": "Chris Thomas is all-in on AI gadgets.\nThomas, 43, wears a pair of Meta's camera-equipped glasses, a Fieldy note-taking pendant around his neck and a wristband from Amazon's Bee, all of which record his daily life. A Pittsburgh-based business owner and a livestreamer, Thomas relies on the devices to help him stay organized, pay bills on time and set reminders.\n\"I'm forgetful AF,\" Thomas said in an interview. \"My life is so crazy that not having to remember to remember is fantastic.\"\nNot everyone is on board with his lifestyle. Earlier this week, a bystander at a local bar noticed his Meta Glasses.\n\"He was like, 'I don't feel comfortable,'\" Thomas said. \"I don't turn it off, I take it off completely because people don't really believe it's off.\"\nIt's the type of interaction users are increasingly navigating as more tech companies introduce AI-powered, always-listening devices and features, which have been marketed as useful tools to transcribe meetings, keep track of conversations, set reminders and offer personalized recommendations.\nThe latest example of these gadgets arrived Thursday with Amazon's Bee Frontier wearable and Bee Eclipse, a card-shaped device that attaches to a smartphone. Both devices are designed to record, transcribe and analyze a user's day.\nApple's latest Apple Watch Series 12, unveiled in September, will have Siri Recap, which \"ambiently\" takes notes throughout the day and generates summaries of conversations. Another feature called Live Rewind can recap 15 seconds of a conversation via a text transcription.\nMeta's popular smart glasses can take photos, capture video and record voice notes or reminders. Startups including Plaud and Pocket also developed card-sized note-taking devices, while Friend offers an AI necklace.\nThe devices have fueled concerns that they could erode privacy, by enabling covert recording without obtaining bystanders' consent and collecting sensitive data that's potentially accessible to others.\nAmazon, Google and other makers of voice-activated smart speakers faced similar privacy concerns when their devices first hit the market, in some cases leading to lawsuits and regulatory fines.\nBut this new generation of AI devices is also testing the limits of privacy law.\nUnlike earlier smart speakers that were activated via a so-called \"wake word\" and sometimes stored recordings or sent audio to the cloud, some of these products can continuously listen, interpret speech, and extract its meaning without retaining the underlying audio. This capability has raised a largely untested question about whether that processing itself can amount to an unlawful interception.\n\"With new technology like this, my statement is always to embrace with caution,\" Karen Panetta, dean of graduate education at Tufts' School of Engineering and a fellow at the Institute of Electrical and Electronics Engineers, said.\nShe added, \"If I'm giving permission for myself to be recorded, or for everything I look at to be recorded, that doesn't mean everybody else around you has given that consent.\"\nThe gray area\nApple and Amazon appear to have sidestepped some of the privacy concerns that dogged earlier voice assistants.\nApple says the feature does not store audio, send recordings to its servers, or involve human review. Amazon has said it doesn't store audio from Bee devices, and conversations are processed in a secure environment \"where no one, including Amazon, can access your data.\"\nBut that may not resolve the legal question.\nMany state wiretap and eavesdropping laws are written around whether a private communication was intercepted or its contents were acquired — not simply whether a conventional audio recording was created.\nColin Zick, a privacy and data security attorney at Foley Hoag, said Apple appears to have learned from the first wave of litigation over voice assistants. But the new technology raises questions those earlier cases never had to answer: Can a system that is continuously listening, interpreting speech and turning it into a summary still amount to an interception if it never saves the underlying audio?\nSome state laws define interception broadly. Massachusetts, for example, defines an intercepting device to include equipment capable of \"transmitting, receiving, amplifying, or recording\" a communication, while the \"contents\" of a communication can include its substance and meaning.\nIn Zick's view, a device that continuously receives speech and produces a written summary could potentially fall within that language even without retaining an audio file.\nAnd in some states, the bigger legal risk may fall not on Apple, Amazon or other AI gadget makers but on the person wearing the device.\n\"A non-wearer did not buy the watch, agree to Apple's terms, or choose to have their conversation summarized in the app,\" Zick said.\nDaniel Pi, an associate professor at the University of New Hampshire Franklin Pierce School of Law, said New Hampshire's statute is broad enough that he believes the Watch's new audio-intelligence features would qualify as an interception. The law covers not only recordings, but the \"aural or other acquisition\" of the contents of a communication.\nThat could create an unusual situation in which an ordinary consumer turns on a feature built into a mainstream device and, at least technically, runs afoul of state law by using it during a private conversation without everyone's consent.\nPi said a user in New Hampshire could potentially face civil or criminal liability for doing so, though he stressed that the practical risk of prosecution is far lower. It could be difficult to know whether someone had the feature enabled in the first place, and he said he would be surprised to see prosecutors pursue cases involving a bare statutory violation where no one was harmed.\nThe legal questions are also different from those raised by earlier smart speakers and voice assistants. Those cases often centered on devices mistakenly activating or capturing speech that was not intended as a command. Here, the feature is designed to acquire and interpret the substance of a conversation — and the user has deliberately opted in.\nThat changes the analysis, Pi said, and could also shift responsibility toward the wearer rather than the technology company itself.\nThe bystanders\nThe broader privacy concern extends beyond who is legally responsible.\nMichael Stokes, a former CIA officer and senior vice president of emerging technologies at Veilant, said the bigger shift is that people can be swept into AI-powered surveillance without owning or knowingly interacting with the device doing the collecting.\n\"I think the bystander problem is really the concern I have — that you can be surveilled without owning the technology,\" Stokes said.\nHe pointed to the growing number of cameras, microphones, and sensors embedded in consumer devices, from smart glasses to watches and AI recorders. The difference now, he said, is that AI can rapidly interpret what those devices collect and draw meaning from far larger volumes of information than earlier generations of consumer technology.\nFor Stokes, that makes the Apple Watch part of a much larger change in the privacy landscape. During his time at the CIA, he helped develop the concept of ubiquitous technical surveillance, describing a world in which everyday devices continuously generate information that can reveal identities, locations, and associations.\nThe concern is not simply that more data can be collected, he said, but that the cost of making sense of it has fallen dramatically.\nIn the past, Stokes said, intelligence collection could require thousands of hours of work to gather, sort and analyze information about a person. AI increasingly automates that process, making it cheaper and easier to extract useful information from data that may have been gathered incidentally.\nThat creates a new kind of exposure for people who never opted into the technology in the first place — whether it is a private conversation picked up by a nearby wearable or information collected by a device they do not own.\n\"We no longer have these pockets of small privacy that we thought we did in the past,\" Stokes said.\nAida Baradari, founder of the startup Deveillance, is trying to give some control back to people worried about being recorded without their consent.\nThe company created a hockey puck-shaped gadget, called the Spectre I, that uses AI to scan for nearby devices and sends out \"adversarial signals\" that scramble a person's speech before microphones can process it.\nBaradari said she watched as more AI wearables hit the market and felt users should have a greater say in how they interact with them.\n\"We need to be able to use technology while not giving up our core values or rights,\" she said.",
    "bodyJa": "Chris Thomas is all-in on AI gadgets.\nThomas, 43, wears a pair of Meta's camera-equipped glasses, a Fieldy note-taking pendant around his neck and a wristband from Amazon's Bee, all of which record his daily life. A Pittsburgh-based business owner and a livestreamer, Thomas relies on the devices to help him stay organized, pay bills on time and set reminders.\n\"I'm forgetful AF,\" Thomas said in an interview. \"My life is so crazy that not having to remember to remember is fantastic.\"\nNot everyone is on board with his lifestyle. Earlier this week, a bystander at a local bar noticed his Meta Glasses.\n\"He was like, 'I don't feel comfortable,'\" Thomas said. \"I don't turn it off, I take it off completely because people don't really believe it's off.\"\nIt's the type of interaction users are increasingly navigating as more tech companies introduce AI-powered, always-listening devices and features, which have been marketed as useful tools to transcribe meetings, keep track of conversations, set reminders and offer personalized recommendations.\nThe latest example of these gadgets arrived Thursday with Amazon's Bee Frontier wearable and Bee Eclipse, a card-shaped device that attaches to a smartphone. Both devices are designed to record, transcribe and analyze a user's day.\nApple's latest Apple Watch Series 12, unveiled in September, will have Siri Recap, which \"ambiently\" takes notes throughout the day and generates summaries of conversations. Another feature called Live Rewind can recap 15 seconds of a conversation via a text transcription.\nMeta's popular smart glasses can take photos, capture video and record voice notes or reminders. Startups including Plaud and Pocket also developed card-sized note-taking devices, while Friend offers an AI necklace.\nThe devices have fueled concerns that they could erode privacy, by enabling covert recording without obtaining bystanders' consent and collecting sensitive data that's potentially accessible to others.\nAmazon, Google and other makers of voice-activated smart speakers faced similar privacy concerns when their devices first hit the market, in some cases leading to lawsuits and regulatory fines.\nBut this new generation of AI devices is also testing the limits of privacy law.\nUnlike earlier smart speakers that were activated via a so-called \"wake word\" and sometimes stored recordings or sent audio to the cloud, some of these products can continuously listen, interpret speech, and extract its meaning without retaining the underlying audio. This capability has raised a largely untested question about whether that processing itself can amount to an unlawful interception.\n\"With new technology like this, my statement is always to embrace with caution,\" Karen Panetta, dean of graduate education at Tufts' School of Engineering and a fellow at the Institute of Electrical and Electronics Engineers, said.\nShe added, \"If I'm giving permission for myself to be recorded, or for everything I look at to be recorded, that doesn't mean everybody else around you has given that consent.\"\nThe gray area\nApple and Amazon appear to have sidestepped some of the privacy concerns that dogged earlier voice assistants.\nApple says the feature does not store audio, send recordings to its servers, or involve human review. Amazon has said it doesn't store audio from Bee devices, and conversations are processed in a secure environment \"where no one, including Amazon, can access your data.\"\nBut that may not resolve the legal question.\nMany state wiretap and eavesdropping laws are written around whether a private communication was intercepted or its contents were acquired — not simply whether a conventional audio recording was created.\nColin Zick, a privacy and data security attorney at Foley Hoag, said Apple appears to have learned from the first wave of litigation over voice assistants. But the new technology raises questions those earlier cases never had to answer: Can a system that is continuously listening, interpreting speech and turning it into a summary still amount to an interception if it never saves the underlying audio?\nSome state laws define interception broadly. Massachusetts, for example, defines an intercepting device to include equipment capable of \"transmitting, receiving, amplifying, or recording\" a communication, while the \"contents\" of a communication can include its substance and meaning.\nIn Zick's view, a device that continuously receives speech and produces a written summary could potentially fall within that language even without retaining an audio file.\nAnd in some states, the bigger legal risk may fall not on Apple, Amazon or other AI gadget makers but on the person wearing the device.\n\"A non-wearer did not buy the watch, agree to Apple's terms, or choose to have their conversation summarized in the app,\" Zick said.\nDaniel Pi, an associate professor at the University of New Hampshire Franklin Pierce School of Law, said New Hampshire's statute is broad enough that he believes the Watch's new audio-intelligence features would qualify as an interception. The law covers not only recordings, but the \"aural or other acquisition\" of the contents of a communication.\nThat could create an unusual situation in which an ordinary consumer turns on a feature built into a mainstream device and, at least technically, runs afoul of state law by using it during a private conversation without everyone's consent.\nPi said a user in New Hampshire could potentially face civil or criminal liability for doing so, though he stressed that the practical risk of prosecution is far lower. It could be difficult to know whether someone had the feature enabled in the first place, and he said he would be surprised to see prosecutors pursue cases involving a bare statutory violation where no one was harmed.\nThe legal questions are also different from those raised by earlier smart speakers and voice assistants. Those cases often centered on devices mistakenly activating or capturing speech that was not intended as a command. Here, the feature is designed to acquire and interpret the substance of a conversation — and the user has deliberately opted in.\nThat changes the analysis, Pi said, and could also shift responsibility toward the wearer rather than the technology company itself.\nThe bystanders\nThe broader privacy concern extends beyond who is legally responsible.\nMichael Stokes, a former CIA officer and senior vice president of emerging technologies at Veilant, said the bigger shift is that people can be swept into AI-powered surveillance without owning or knowingly interacting with the device doing the collecting.\n\"I think the bystander problem is really the concern I have — that you can be surveilled without owning the technology,\" Stokes said.\nHe pointed to the growing number of cameras, microphones, and sensors embedded in consumer devices, from smart glasses to watches and AI recorders. The difference now, he said, is that AI can rapidly interpret what those devices collect and draw meaning from far larger volumes of information than earlier generations of consumer technology.\nFor Stokes, that makes the Apple Watch part of a much larger change in the privacy landscape. During his time at the CIA, he helped develop the concept of ubiquitous technical surveillance, describing a world in which everyday devices continuously generate information that can reveal identities, locations, and associations.\nThe concern is not simply that more data can be collected, he said, but that the cost of making sense of it has fallen dramatically.\nIn the past, Stokes said, intelligence collection could require thousands of hours of work to gather, sort and analyze information about a person. AI increasingly automates that process, making it cheaper and easier to extract useful information from data that may have been gathered incidentally.\nThat creates a new kind of exposure for people who never opted into the technology in the first place — whether it is a private conversation picked up by a nearby wearable or information collected by a device they do not own.\n\"We no longer have these pockets of small privacy that we thought we did in the past,\" Stokes said.\nAida Baradari, founder of the startup Deveillance, is trying to give some control back to people worried about being recorded without their consent.\nThe company created a hockey puck-shaped gadget, called the Spectre I, that uses AI to scan for nearby devices and sends out \"adversarial signals\" that scramble a person's speech before microphones can process it.\nBaradari said she watched as more AI wearables hit the market and felt users should have a greater say in how they interact with them.\n\"We need to be able to use technology while not giving up our core values or rights,\" she said.",

    "summaryJa": "What is the Budget and what could be in it?- Published",
    "bodyOriginal": "What is the Budget and what could be in it?\n- Published\nChancellor John Healey will set out Labour's tax and spending plans when he delivers his first Budget on 28 October.\nHe has refused to rule out tax increases after acknowledging government borrowing costs are at \"historic highs\".\nBut the government's room for manoeuvre on tax is limited.\nBefore the 2024 general election, Labour promised not to increase three big revenue earners for the government: income tax, National Insurance and VAT.\nWhat is the Budget?\nIn his statement, delivered to MPs in the House of Commons, Healey will set out how the government plans to raise or lower taxes.\nAlongside the Budget, the Treasury will publish details about the measures and their costs.\nThe independent Office for Budget Responsibility (OBR), which monitors government spending, will also publish an assessment of the health of the UK economy and a forecast of what it thinks will happen in the future.\nWhat might be in the Budget?\nThe run-up to the Budget typically generates speculation about what might be in it, which the government is trying to keep to a minimum this year.\nHealey and Prime Minister Andy Burnham face a difficult balancing act, trying to offer more support to households and meet commitments on defence spending, while also sticking to Labour's manifesto commitments on tax and the government's self-imposed fiscal rules.\nThe previous chancellor, Rachel Reeves, set out two main rules, which the new leadership has vowed to follow. These are:\nNot to borrow to fund day-to-day public spending by the end of this parliament\nTo get government debt falling as a share of national income by the end of this parliament\nIn March, the OBR calculated that the first rule would be met with a gap - or headroom - of £23.6bn. However, this headroom is expected to have shrunk.\nAnalysts are divided on how much it may have fallen by. KPMG believe it could have fallen to £12bn, mainly due to the rise in government borrowing costs this year.\nThe Institute for Fiscal Studies (IFS) also forecasts that debt interest will significantly reduce headroom. But it also suggests higher inflation could push up tax revenues as pay rises drag people into higher tax thresholds.\nIt estimates the buffer could still shrink but to a comparatively less severe £20bn.\nOne option that has been floated is that Healey could decide to accept a smaller buffer, reducing the need to increase taxes in the Budget.\nBank taxes\nBank bosses have told the BBC they expect Healey to raise taxes on the sector. UK banks have been reporting bumper profits, leading to calls from unions for higher taxes.\nThe Treasury has options: it could raise a 3% surcharge on profits which was lowered from 8% under the previous Conservative government, or it could raise the bank levy that is based on the size of their balance sheets.\nYour First Home scheme\nFurther details on the \"Your First Home\" scheme, aimed at helping first-time buyers in England to purchase a property, are expected to be announced in the Budget.\nThe scheme will allow people to buy a new-build home with a deposit of 2.5%. It would provide them with a loan worth 20% of their property's value to help pay for the purchase.\nCapital Gains Tax\nThere has been speculation that Capital Gains Tax (CGT) - which is imposed on the profit people make when they sell an asset that has increased in value - could be changed, through either higher rates or by removing or amending exemptions.\nAt the moment, if you pay income tax at the basic rate then CGT is charged at 18%. For higher and additional rate income tax payers, the CGT rate is 24%.\nThe FT has reported, external that Healey has rejected proposals to raise CGT to the same rates as income tax.\nTax on businesses\nThe Times has reported, external that online retail giants such as Amazon and eBay are expected to be made responsible for collecting tax owed by traders using their platforms.\nThe paper said the money raised is expected to be used by the government to cut business rates for High Street shops, by raising the threshold at which small companies start paying rates from £12,000 to £18,000.\nFuel duty\nFuel duty was frozen under the Conservatives in March 2022 and Sir Keir Starmer's government continued the freeze, deciding in May to push back a planned 3p increase in September until the end of this year.\nHealey told the BBC in late September that the \"place\" and \"time\" for dealing with rising petrol and diesel costs was the Budget, but would not give details on whether the freeze would be extended again.\nEnergy bills\nHousehold energy bills are set to see their biggest rise in four years in January, with a typical annual bill forecast to jump by £276.\nThere has been speculation, external that Healey is planning energy bill help for households on certain benefits.\nMansion Tax\nThe High Value Council Tax Surcharge - dubbed the Mansion Tax - was announced in last year's Budget and will apply to properties in England valued above £2m from April 2028.\nThere had been speculation that the government was considering extending it to properties worth more than £1.5m. However, reports now suggest, external Healey has ruled this out.\nHow is the economy doing?\nIn the first three months of the year, the UK's economy grew by 0.6%, while in the April-to-June quarter it grew by 0.5%.\nThe most recent data showed the economy grew by 0.1% in August after growth of 0.4% in July, with both figures being stronger than expected.\nAnalysts say the UK economy is proving resilient in the face of energy price shocks caused by the US-Israel war with Iran.\nThe conflict has led to the effective closure of the Strait of Hormuz, a key waterway for oil and gas trade. This caused a sharp jump in oil prices, which has fed through to higher energy and fuel prices.\nEconomists expect UK growth to slow in the months ahead as those costs continue to weigh on households and businesses.\nPrices for goods and services are still rising faster than wanted. Inflation hit 3.1% in the year to August, the highest rate in five months and above the Bank of England's 2% target, driven by higher petrol and diesel prices.\nThe Bank of England held interest rates at 3.75% for the sixth time in a row in September, but said they were likely to rise if high energy prices persist.\nWhat time is the Budget and what happens afterwards?\nThe Budget speech usually starts at about 12:30 UK time - after Prime Minister's Questions - and lasts about an hour.\nIt will be broadcast live on the BBC iPlayer and on the BBC News website.\nThe Leader of the Opposition, Conservative MP Kemi Badenoch, will respond to the speech in the House of Commons.\nMPs debate the measures for four days, before voting on them.\nIf approved by MPs, tax changes can come into effect immediately.\nHowever, the government must pass a finance bill to make them permanent.\nGet in touch\nDo you have any views, comments or questions about this story?",

said the money raised is expected to be used by the government to cut business rates for High Street shops, by raising the threshold at which small companies start paying rates from £12,000 to £18,000.\nFuel duty\nFuel duty was frozen under the Conservatives in March 2022 and Sir Keir Starmer's government continued the freeze, deciding in May to push back a planned 3p increase in September until the end of this year.\nHealey told the BBC in late September that the \"place\" and \"time\" for dealing with rising petrol and diesel costs was the Budget, but would not give details on whether the freeze would be extended again.\nEnergy bills\nHousehold energy bills are set to see their biggest rise in four years in January, with a typical annual bill forecast to jump by £276.\nThere has been speculation, external that Healey is planning energy bill help for households on certain benefits.\nMansion Tax\nThe High Value Council Tax Surcharge - dubbed the Mansion Tax - was announced in last year's Budget and will apply to properties in England valued above £2m from April 2028.\nThere had been speculation that the government was considering extending it to properties worth more than £1.5m. However, reports now suggest, external Healey has ruled this out.\nHow is the economy doing?\nIn the first three months of the year, the UK's economy grew by 0.6%, while in the April-to-June quarter it grew by 0.5%.\nThe most recent data showed the economy grew by 0.1% in August after growth of 0.4% in July, with both figures being stronger than expected.\nAnalysts say the UK economy is proving resilient in the face of energy price shocks caused by the US-Israel war with Iran.\nThe conflict has led to the effective closure of the Strait of Hormuz, a key waterway for oil and gas trade. This caused a sharp jump in oil prices, which has fed through to higher energy and fuel prices.\nEconomists expect UK growth to slow in the months ahead as those costs continue to weigh on households and businesses.\nPrices for goods and services are still rising faster than wanted. Inflation hit 3.1% in the year to August, the highest rate in five months and above the Bank of England's 2% target, driven by higher petrol and diesel prices.\nThe Bank of England held interest rates at 3.75% for the sixth time in a row in September, but said they were likely to rise if high energy prices persist.\nWhat time is the Budget and what happens afterwards?\nThe Budget speech usually starts at about 12:30 UK time - after Prime Minister's Questions - and lasts about an hour.\nIt will be broadcast live on the BBC iPlayer and on the BBC News website.\nThe Leader of the Opposition, Conservative MP Kemi Badenoch, will respond to the speech in the House of Commons.\nMPs debate the measures for four days, before voting on them.\nIf approved by MPs, tax changes can come into effect immediately.\nHowever, the government must pass a finance bill to make them permanent.\nGet in touch\nDo you have any views, comments or questions about this story?",

    "title": "Turning the tides: Could hidden sea power energise our coastal towns?",
    "titleJa": "Turning the tides: Could hidden sea power energise our coastal towns?",
    "summaryJa": "Engineer David Mummery has developed a tidal energy generator that he says can change lives for people living in coastal communities.",
    "bodyOriginal": "Turning the tides: Could hidden sea power energise our coastal towns?\n- Published\nIn a secret location in the Highlands of Scotland, there's a fast-flowing river that's the key to understanding the massive power of water.\nIt's where engineer David Mummery found himself more than a decade ago.\nWith a length of cord tied tightly across the river, he swam out, gripped firmly, and let the unstoppable current rush over as he sunk his head below the surface.\n\"As an engineer we do the maths and stuff,\" he says, \"but sometimes you can get a lot more from actually touching the water and feeling it\".\nAs he lay down in the powerful rapids, he visualised a new type of small-scale tidal energy generator.\nIt's an innovation he says could change lives for people in coastal communities.\n\"I'd be under the river, feeling the turbulence of the water rushing over me.\n\"Trying to envisage how this turbine needed to interact with that environment - to understand the way the water was working.\"\nMummery's idea became the Swimmer Turbine - a 50kw tidal generator named after his experience in the river.\nAnchored to the sea floor, the fiberglass and steel device lies invisible below the water's surface. It can generate enough electricity to power about 30 homes.\nHe began tests in the river in early 2010s. On a patent lawyer's advice he found a secret location, far from curious Highland tourists and their cameras.\n\"You're trying to be quite discreet because you're working with new technology,\" he says.\nIt was in the first years of his company, Flex Marine Power, long before Britain was gripped by the soaring costs of an energy crisis.\nThe size of the Swimmer Turbine is what sets it apart from large tidal projects dotted around Scottish waters.\nScotland is a world leader in the sector at sites including:\nNova Innovation - The world's first tidal stream array, deployed in 2016 in Bluemull Sound in Shetland\nMeyGen - The world's largest tidal array, with four large 1.5MW turbines on the seabed of the Pentland Firth\nOrbital O2 - The world's most powerful floating turbine, generating 2MW, anchored at Fall of Warness in the Orkney Islands\nMummery's turbine is ultra compact and low cost compared to these giant machines. Fishermen and local workers can build and install it themselves from their own village harbour.\n\"Can you imagine like an Ikea furniture kit? You get a shipping container and you'll open it up and it will be about 20 components.\n\"You'll bolt them all together and then you've got your turbine ready.\n\"There'll be a launch plan, you follow these instructions, then you'll be in the water.\"\nMummery's work did not always focus on small-scale power. Originally from Guildford, he studied mechanical engineering at Surrey University.\nBefore founding Flex Marine Power, he was a sought-after consultant in the UK energy sector. For a time he specialised in nuclear work and decommissioning, designing robots for pulling material out of contaminated tanks.\nHe moved north after falling in love with a girl studying at Glasgow University. Jo became his wife and they now live in the city suburbs with three young children.\nConveniently, Mummery's relocation came at a time when Scotland was establishing its reputation as a centre for marine power expertise.\nIn 2010 he took a secondment at Scottish Power Renewables on the ground-breaking Pelamis project in Orkney.\nThe 180m-long (591ft) Pelamis P2 - nicknamed the sea snake - was the first deep-water, floating wave energy machine to generate power for the national grid.\nUltimately, Pelamis went into administration in 2014, but the ill-fated device remains celebrated as a milestone in marine power innovation.\n\"The industry is littered with these examples of fantastic technologies and teams that do brave things that take decades,\" Mummery says.\n\"But at some point the market doesn't step up and they falter. Some really good ones have lasted the course, but others have not and it's sad.\"\nMummery says the UK has \"phenomenal waters for tidal power\" and he loved being a part of major projects - but couldn't shake a discomfort.\nHis work felt incongruous to the many small coastal communities he found himself in.\n\"I'd be going out on boats around Scotland doing sonar surveys with all these really expensive pieces of kit.\n\"But the equipment was all really big, utility-scale stuff that would weigh hundreds of tonnes, shipped by people from the mainland.\n\"All the people I was meeting in harbours or in the pub were fishermen. And they were knowledgeable and they were interested.\n\"I thought 'we've got to do this in a way that they can take the lead'.\"\nThat, he says, is what motivated his Swimmer Turbine idea.\nIn 2011 he left big projects behind to found Flex Marine Power and focus on his turbine concept.\nHe spent hours at his desk sketching, working out how to make the technology smaller and lighter.\nHe hired a student employee and found a sleek, glass office space outside Glasgow - which he quickly discovered wasn't entirely suited to an engineer and his tools.\n\"It was a lovely place, but I wasn't allowed to take a hammer drill into the office.\n\"We were trying to make prototype turbines under the desk so the landlord wouldn't see them when he came in.\"\nMummery turned to Clydeside's shipbuilding past in search of a more suitable workspace.\nHe presented a plan to convert former shipyards for marine technology research, and was invited to Greenock by Inverclyde's redevelopment authority.\n\"There were lots of empty sheds that hadn't been used for years,\" he says.\n\"They basically said 'we'll walk you around, you can pick a shed'. So I got the pick of the bunch right on the quayside.\"\nMummery now had direct access to the River Clyde for sea trials to test his models.\nHe developed a prototype which he successfully trialled in 2015 on the island of Luing, in the Firth of Lorn, near Oban.\nIt secured Flex Marine's first major investment and expansion the following year.\nThe next major step was in Northern Ireland in 2020, at Strangford Narrows in County Down.\nMummery worked with Queen's University Belfast who had an academic license to test tidal equipment at sea.\n\"Me and Mark, my accountant, lifted all of the components into a shipping container and sent it out on a lorry.\n\"We were introduced to a bunch of local mariners. We pulled off a full-scale tidal turbine installation out of a container deposited in a farmyard.\"\nGenerating electricity while tethered to the back of a boat, Mummery says it was the full-scale proof-of-concept that \"finally put us on the map\".\nIt helped Flex Marine Power secure £968,000 from the UK government's Energy Entrepreneurs Fund for a team of nine people to develop a commercial turbine model.\nThis version would not be tied to a boat.\nThe Swimmer Turbine would launch directly from shore and remain absolutely hidden, generating electricity below the surface of the water.\nMummery took it through months of testing last year on the island of Islay - famous for its many whisky distilleries and coastal waters that are perfect for tidal power.\nHe rented space at a boatyard where \"talented local people\" were taught how to assemble and launch the device.\nFinally, after his years of work, came the defining moment.\n\"I was standing at the end of the slipway, seeing our machine, without any of my guys touching it.\n\"It was all local people. Fishermen, using their own tractor, launching it down their own slipway. This was my vision in a nutshell.\"\nThe next stage is putting the power to good use. Mummery will return to Islay next year with a plan to generate electricity for the island.\n\"The sea is a very big space and these things are invisible. There could be different tidal arrays in different parts of the island, all owned by different people.\n\"In those real coastal communities, they don't have flashy cranes and heavy lifting capabilities and big corporate companies with big pockets.\n\"But what they do have is knowledge and work ethic and a deep understanding of their environment and the sea.\n\"We're trying to equip real people to thrive by giving them access to the power that's in the tides.\"\nRelated topics\n- Published4 August 2023\n- Published28 July 2021\n- Published6 July 2017",

ur large 1.5MW turbines on the seabed of the Pentland Firth\nOrbital O2 - The world's most powerful floating turbine, generating 2MW, anchored at Fall of Warness in the Orkney Islands\nMummery's turbine is ultra compact and low cost compared to these giant machines. Fishermen and local workers can build and install it themselves from their own village harbour.\n\"Can you imagine like an Ikea furniture kit? You get a shipping container and you'll open it up and it will be about 20 components.\n\"You'll bolt them all together and then you've got your turbine ready.\n\"There'll be a launch plan, you follow these instructions, then you'll be in the water.\"\nMummery's work did not always focus on small-scale power. Originally from Guildford, he studied mechanical engineering at Surrey University.\nBefore founding Flex Marine Power, he was a sought-after consultant in the UK energy sector. For a time he specialised in nuclear work and decommissioning, designing robots for pulling material out of contaminated tanks.\nHe moved north after falling in love with a girl studying at Glasgow University. Jo became his wife and they now live in the city suburbs with three young children.\nConveniently, Mummery's relocation came at a time when Scotland was establishing its reputation as a centre for marine power expertise.\nIn 2010 he took a secondment at Scottish Power Renewables on the ground-breaking Pelamis project in Orkney.\nThe 180m-long (591ft) Pelamis P2 - nicknamed the sea snake - was the first deep-water, floating wave energy machine to generate power for the national grid.\nUltimately, Pelamis went into administration in 2014, but the ill-fated device remains celebrated as a milestone in marine power innovation.\n\"The industry is littered with these examples of fantastic technologies and teams that do brave things that take decades,\" Mummery says.\n\"But at some point the market doesn't step up and they falter. Some really good ones have lasted the course, but others have not and it's sad.\"\nMummery says the UK has \"phenomenal waters for tidal power\" and he loved being a part of major projects - but couldn't shake a discomfort.\nHis work felt incongruous to the many small coastal communities he found himself in.\n\"I'd be going out on boats around Scotland doing sonar surveys with all these really expensive pieces of kit.\n\"But the equipment was all really big, utility-scale stuff that would weigh hundreds of tonnes, shipped by people from the mainland.\n\"All the people I was meeting in harbours or in the pub were fishermen. And they were knowledgeable and they were interested.\n\"I thought 'we've got to do this in a way that they can take the lead'.\"\nThat, he says, is what motivated his Swimmer Turbine idea.\nIn 2011 he left big projects behind to found Flex Marine Power and focus on his turbine concept.\nHe spent hours at his desk sketching, working out how to make the technology smaller and lighter.\nHe hired a student employee and found a sleek, glass office space outside Glasgow - which he quickly discovered wasn't entirely suited to an engineer and his tools.\n\"It was a lovely place, but I wasn't allowed to take a hammer drill into the office.\n\"We were trying to make prototype turbines under the desk so the landlord wouldn't see them when he came in.\"\nMummery turned to Clydeside's shipbuilding past in search of a more suitable workspace.\nHe presented a plan to convert former shipyards for marine technology research, and was invited to Greenock by Inverclyde's redevelopment authority.\n\"There were lots of empty sheds that hadn't been used for years,\" he says.\n\"They basically said 'we'll walk you around, you can pick a shed'. So I got the pick of the bunch right on the quayside.\"\nMummery now had direct access to the River Clyde for sea trials to test his models.\nHe developed a prototype which he successfully trialled in 2015 on the island of Luing, in the Firth of Lorn, near Oban.\nIt secured Flex Marine's first major investment and expansion the following year.\nThe next major step was in Northern Ireland in 2020, at Strangford Narrows in County Down.\nMummery worked with Queen's University Belfast who had an academic license to test tidal equipment at sea.\n\"Me and Mark, my accountant, lifted all of the components into a shipping container and sent it out on a lorry.\n\"We were introduced to a bunch of local mariners. We pulled off a full-scale tidal turbine installation out of a container deposited in a farmyard.\"\nGenerating electricity while tethered to the back of a boat, Mummery says it was the full-scale proof-of-concept that \"finally put us on the map\".\nIt helped Flex Marine Power secure £968,000 from the UK government's Energy Entrepreneurs Fund for a team of nine people to develop a commercial turbine model.\nThis version would not be tied to a boat.\nThe Swimmer Turbine would launch directly from shore and remain absolutely hidden, generating electricity below the surface of the water.\nMummery took it through months of testing last year on the island of Islay - famous for its many whisky distilleries and coastal waters that are perfect for tidal power.\nHe rented space at a boatyard where \"talented local people\" were taught how to assemble and launch the device.\nFinally, after his years of work, came the defining moment.\n\"I was standing at the end of the slipway, seeing our machine, without any of my guys touching it.\n\"It was all local people. Fishermen, using their own tractor, launching it down their own slipway. This was my vision in a nutshell.\"\nThe next stage is putting the power to good use. Mummery will return to Islay next year with a plan to generate electricity for the island.\n\"The sea is a very big space and these things are invisible. There could be different tidal arrays in different parts of the island, all owned by different people.\n\"In those real coastal communities, they don't have flashy cranes and heavy lifting capabilities and big corporate companies with big pockets.\n\"But what they do have is knowledge and work ethic and a deep understanding of their environment and the sea.\n\"We're trying to equip real people to thrive by giving them access to the power that's in the tides.\"\nRelated topics\n- Published4 August 2023\n- Published28 July 2021\n- Published6 July 2017",

    "title": "Trump's Russia diesel deal may offer Putin more than money — and spell trouble for Ukraine",
