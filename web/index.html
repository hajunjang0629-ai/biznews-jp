    "bodyOriginal": "BEIJING — The U.S. is threatening to cut businesses that help Iran evade sanctions off from the American financial system. It puts China's banks in an uncomfortable position: Beijing can reject the demands, but its biggest lenders still have strong incentives to preserve access to U.S. dollars.\nU.S. Treasury Secretary Scott Bessent announced on Monday that any entity facilitating \"money laundering or sanctions evasion on behalf of Iran risks being cut off from the U.S. financial system.\" It was part of the \"Economic D-Day\" against Iran announced by U.S. President Donald Trump.\nWhen asked specifically about Chinese banks, Bessent said: \"If they facilitate transactions and are part of the ecosystem that turns Iranian oil into money, into repression, they will be targeted.\"\nChina said Tuesday it would \"take all necessary measures\" to protect itself.\n\"China has made clear on many occasions its firm opposition to illicit unilateral sanctions that have no basis in international law or the authorization of the UN Security Council,\" a Chinese foreign ministry spokesperson said on Tuesday in response to questions.\nBefore the war, China bought around 90% of Iran's exported oil — about 12% of China's total crude imports — making it Iran's largest trading partner, per analysts at the U.S.-China Economic and Security Review Commission in March.\nDubbed \"Operation Economic Outcast,\" the expanded U.S. sanctions identified several China-based companies and individuals as having allegedly assisted the Iranian military.\nThe U.S. said it would give countries a timeline to shut down identified activities, but didn't share dates publicly. When CNBC asked about communication regarding the timeline, China's foreign ministry said it was closely monitoring the situation and reiterated that Beijing would protect its interests.\nIt's tough talk as a summit between Trump and Chinese President Xi Jinping is looming.\nBut analysts emphasize China will do what it can to stay in the U.S. dollar financing system. The U.S. has raised the bar for China and other countries that want to use the greenback — boosting their incentive to diversify. And the complexities of the U.S.-China economic rivalry make an \"Economic D-Day\" a tough order for the Trump administration.\nHow China's CIPS offers a hedge to the dollar\nPeter Alexander, Shanghai-based managing director of advisory Z-Ben, told CNBC that China's Cross-Border Interbank Payment System (CIPS) showed it was trying to diversify from dollar-centered finance, without abandoning it altogether.\nThe People's Bank of China began building the CIPS in 2012 — the same year the U.S. Treasury sanctioned China's relatively small Bank of Kunlun over illicit Iran activities. Its transactions have picked up since the Russia-Ukraine war in 2022, and generally grown this year, according to official figures.\nThe system lists 210 direct participating institutions globally, mostly affiliates of state-owned Chinese banks.\nAlexander also said that Argentina and Australia this month renewed bilateral currency swap agreements with China that enable the exchange of tens of billions of dollars' worth of Chinese yuan between the countries' central banks.\n\"The emerging financial system isn't necessarily one in which countries abandon the USD,\" Alexander said. \"It is a geopolitical hedging instrument.\"\nThe dollar's dominance\nThe U.S. dollar still accounted for over half of global payments in July, while China's yuan ranks fifth at 3.1%, according to Swift, the secure bank messaging system that underpins international banking. That's down from over 4% in early 2025.\nIn trade finance, the U.S. dollar accounted for nearly 80% that month, while China's yuan ranked second at 8.4%, the Swift data showed.\n\"China definitely wants to stay in the dollar system which benefits its trade engine, but that doesn't mean it will do everything [to] comply with expanding U.S. sanctions,\" Tianchen Xu, senior economist at the Economist Intelligence Unit, told CNBC.\nHe said he expected China to use rare earth controls and other measures to retaliate against sanctions on major Chinese businesses.\nBut the U.S. also wants access to critical minerals that China has, incentivising it to keep the relationship stable.\nTrump and Xi are still due to meet next month\nTrump and China's Xi are expected to meet in the U.S. late next month, following Trump's visit to Beijing in May. Eurasia Group's China director Dan Wang said the U.S. doesn't want to derail the summit.\n\"The core of China-U.S. relation is more about [the] Taiwan situation ... [the] China-Iran tie is not nearly as close as outsiders have imagined,\" she said, noting Beijing has essentially halted state-backed infrastructure investment since 2018.\nRemoving a major Chinese bank from the SWIFT system would significantly increase devaluation pressure on the Chinese yuan, which is “not acceptable\" to Beijing, she told CNBC's \"The China Connection\" on Tuesday.\nThe U.S. dollar index has strengthened since the Iran war began on Feb. 28, up by about 1.5%.\nThe Chinese yuan has gained nearly 2% against the U.S. dollar in that time, and more than 3% against the euro.\nEarlier this year, China helped broker initial peace talks between Iran and the U.S. in Pakistan.\nBut analysts at the time cautioned that Beijing had neither the capability nor inclination to pressure either side into negotiating.\n\"Beijing hasn't even begun to play hard ball with America,\" Alexander said.\nAs for the U.S. response, \"the question isn't what could be done,\" he told CNBC in an email, \"the question is whether anything WILL be done.\"",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Oil prices fell more than 3% on Tuesday, after the New York Times reported the State Department plans to return evacuated diplomats to the Middle East, in a sign the U.S. does not expect a return to full-scale war.\nBrent crude oil futures were last seen trading 3.4% lower at $89.05 per barrel, its lowest since Aug. 13. U.S. West Texas Intermediate crude fell 3.6% to trade around $81.99 a barrel.\nTuesday's moves extended declines from Monday, when Brent fell by 3%.\nWhile U.S. strikes in the Middle East have quieted in recent weeks, Washington has instead made moves to exert huge economic pressure on Iran.\nThe U.S. government unveiled a fresh raft of sanctions on Iran this week, as well as so-called \"enablers\" that continue to trade with the country.\nThe White House has labeled its efforts an \"economic D-Day,\" with Treasury Secretary Scott Bessent touting the initiative as \"the single greatest financial offensive ever\" on Monday.\nMeanwhile, U.S. Defense Secretary Pete Hegseth told reporters on Monday that the prospect of further American strikes in the Middle East remained on the table.\n\"If we need to use kinetic strikes, we'll use them,\" he said. \"If Iran is foolish enough to overplay their hand or mess with the American military, we'll do what we need to do.\"\n\"Economic pressure hurts them the most right now,\" he said of the Iranian regime. \"But by no means are we foreclosing using kinetic strikes anywhere in the Strait of Hormuz or around Iran.\"\nIranian Economy Minister Ali Madanizadeh said on state television that Tehran is \"fully prepared\" to withstand more U.S. sanctions.\n\"The government is and was ready and has a two-year plan to manage these events,\" he said. \"We have our own tools and we know how to play the game.\"\nChina vows to defend its interests\nChina, one of Iran's largest trading partners, has repeatedly called for a diplomatic end to the U.S.-Iran war. Under the new \"economic D-Day\" plans, China could face ramifications for continuing to buy Iranian oil.\nOn Tuesday, Chinese Foreign Ministry Spokesperson Lin Jian told reporters Beijing would \"do everything necessary to firmly safeguard its rights and interests.\"\n\"China has made clear on many occasions its firm opposition to illicit unilateral sanctions that have no basis in international law or the authorization of the UN Security Council,\" he said. \"Economic warfare and maximum pressure provide no solution.\"\nHe added that China's cooperation with Iran is conducted within the framework of international law, and should therefore not be disrupted.\nIn a Tuesday note, BBH strategists said the Trump administration's latest tactics were \"more of a warning shot than a decisive blow.\"\n\"The U.S. expanded sanctions on Iran but stopped short of any immediate secondary sanctions against other countries sustaining Iran's trade. China is the critical pressure point — it is Iran's largest trading partner and buys roughly 90% of its oil exports — and the biggest constraint on making the sanctions credible.\"\nThey added that targeting China as a trading partner of Iran would mean targeting major Chinese banks and refiners, \"risking financial disruption, Chinese retaliation, and the fragile US-China détente.\"",

    "bodyOriginal": "Nvidia has been the profit engine of the artificial intelligence boom, filling up data centers with its graphics processing units, which are also powering the biggest AI models.\nBut if there's one persistent concern among investors regarding Nvidia's ability to build on its $5 trillion market cap, it's customer concentration. Nvidia counts on the group known as the hyperscalers — Amazon, Google and Microsoft — for an outsized amount of revenue, as those companies buy GPUs in bulk for their own workloads, and sell access to them through their giant cloud businesses.\nAdd to that Meta and SpaceX, which have also been massive buyers as they build their own models, while also starting to rent out some of their Nvidia capacity to other companies that need it right away.\nIn its last earnings report in May, Nvidia changed the way it reports financials to split out hyperscalers from the rest of the pack, which it now groups as AI clouds, industrial and enterprise, or ACIE. Nvidia doesn't specify which companies fall into the former group, but CEO Jensen Huang has defined the group pretty clearly.\n\"The easiest go-to-market, of course, is the hyperscaler, because there are only five or six of them,\" Huang said on the May earnings call. \"The rest of them, the rest of the industry, represents 250,000 companies around the world.\"\nAs Wall Street gears up for Nvidia's fiscal second-quarter earnings report after the bell on Wednesday, the ACIE portion of the customer base is coming under the microscope. In the first quarter, the two segments were almost equal, with Nvidia reporting $37.9 billion in hyperscaler sales and nearly $37.5 billion in ACIE revenue. Nvidia highlighted that its ACIE revenue grew at 31% from the prior period, topping 12% growth from hyperscalers.\nSkepticism has started seeping into the stock. The shares fell 2.9% on Monday, dropping for a seventh straight day, the longest losing streak since 2022. They're down 7.5% over that stretch.\nNvidia stakeholders want the company to become less reliant on a small subset of customers, and they also worry about the ability of those companies to further bolster their spending. Amazon and Alphabet turned cash flow negative in the second quarter, and Meta's cash generation dwindled by more than 90% from a year earlier. Both of Elon Musk's public companies — SpaceX and Tesla — reported negative free cash flow as they pursue AI expansions.\n\"This story underneath the surface is investors' concern about just how sustainable the run has been for Nvidia, and feeling like the hyperscalers just can't give much more,\" Gene Munster, managing partner at Deepwater Asset Management, said in an interview. \"They want to start to see the other segment starting to kick in.\"\nOther business to grow faster\nNvidia in May provided nine restated quarters of history on its website, showing hyperscalers making up about 55% of data center revenue in the past year. Hyperscaler revenue soared 115% from a year earlier in the most recent quarter, topping the 74% growth from ACIE customers.\nAnalysts expect the trend to flip going forward. The ACIE side of the business is expected to show 149% annual growth over the past year to $43 billion in the second quarter, while hyperscaler revenue is likely to show growth of 83% to $43.6 billion, according to StreetAccount. One potential big driver for the hyperscaler business is SpaceX, which aims to rapidly build out Nvidia-based data centers over the next year, Munster said.\nIn total, analysts see Nvidia's revenue almost doubling from a year earlier to $92.2 billion, according to LSEG. Data center continues to account for a bigger chunk of sales, with that division expected to reach $86.3 billion, based on StreetAccount estimates. That would be 94% of the total, up from 92% in the first quarter.\nFor the full year, analysts expect 83% revenue growth to $396 billion, before slowing to 44% expansion next year, according to LSEG.\nIn its effort to diversify, Nvidia is being proactive rather than waiting for new customers to arrive. Recognizing that very few companies have the cash or balance sheet to support purchases of its rack-scale systems, Nvidia is working with Wall Street to turn GPUs into an asset class.\nEarlier this month, Nvidia unveiled a program with six leading financial firms that could pull together up to $500 billion in financing from investors who view chips as an investable asset, like real estate. Such a project, Huang said, could enable more companies to borrow money for GPU purchases at lower rates, because the chips will generate returns.\nNvidia said in the announcement that it had signed a memorandum of understanding with the investment firms. Few specifics have been presented.\n\"There's been a lot of headlines and big numbers and not a lot of details on how this stuff is going to work yet,\" Stacy Rasgon, an analyst at Bernstein, told CNBC last week. \"Color that they could give on that would be helpful to put some investors' minds at ease.\"\nAnother crucial number in Nvidia's earnings report will be sales of Vera Rubin systems, which have just recently started to ramp up. Earlier this year, Huang told attendees at the company's GTC conference that he expects $1 trillion in sales through 2027 from current-generation Blackwell and Vera Rubin.\nQuestions about the long tail of the customer base could ease if Vera Rubin looks like an even bigger success than projected.\n\"We expect Nvidia to report strong results and guidance with ramping Rubin GPU shipments representing the key drivers of upside,\" KeyBanc analysts, who recommend buying the stock, wrote in a note over the weekend.",

    "bodyOriginal": "Dick's Sporting Goods on Tuesday reported quarterly earnings that missed Wall Street expectations and lowered its outlook for Foot Locker amid what it called a \"challenging athletic footwear and apparel marketplace.\"\nDick's stock fell roughly 15% in premarket trading Tuesday.\nThe company said Dick's stores saw 4.9% comparable sales growth for the quarter driven by \"broad-based growth\" across categories, including strong results from the World Cup.\nHowever, Dick's said Foot Locker saw comparable sales decline by 3.6%, leading the company to revise its outlook to for the Foot Locker business to a range of flat to down 2%. It still expects the Dick's business to grow between 2.5% and 4%, but the company lowered its overall net sales outlook for the year from a range of between $22.1 billion and $22.4 billion to a range of between $21.9 billion and $22.2 billion.\nThe company lowered its consolidated operating income outlook from a previous range of between $1.69 billion and $1.81 billion to a range of $1.45 billion to $1.55 billion.\nHere's how Dick's performed in its second fiscal quarter compared with what Wall Street was expecting, according to a survey of analysts by LSEG:\n- Earnings per share: $3.53 adjusted vs. $3.76 expected\n- Revenue: $5.59 billion vs. $5.65 billion expected\nFor the period ended Aug. 1, Dick's reported net income of $315 million, or $3.50 per share, down from $381 million, or $4.71 per share, the year prior. Adjusting for one-time items, including its Foot Locker acquisition, Dick's reported $3.53 per share.\nSales rose to $5.59 billion from $3.65 billion in the year-ago period.\n\"While we are taking a more cautious view of the balance of the year, we remain highly confident in the strength of the DICK'S Business and our long-term opportunity at Foot Locker,\" CEO Lauren Hobart said in a statement.\nThe company also said it received $59 million in tariff refunds during the quarter and $2.1 million in related interest income.\nThe earnings come as Dick's is in the midst of implementing a turnaround for Foot Locker, which has previously weighed on the company's bottom line. Dick's has sought to refine Foot Locker's strategy to return to growth, especially at a time when sportswear is booming.\nDick's acquired Foot Locker for $2.4 billion in 2025, saying at the time that it planned to use the deal to expand its international presence and better position itself against its competitors.",

    "id": "the-debasement-trade-returns-after-besse-d547f1f4",
    "title": "The 'debasement trade' returns after Bessent bond maneuver. Crypto and gold are back in style",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "The debasement trade is gaining new traction on Wall Street as concern over the size and cost of the budget deficit mounts.\nThe conventional wisdom behind the trade is that perceived hard assets, like cryptocurrencies and precious metals, gain as investors try to hedge against a weaker U.S. dollar and Treasury debt in the face of ballooning government spending. Those fears reached a fever pitch last week before, and after, the Treasury Department's unusual step of increasing debt buybacks under Secretary Scott Bessent.\n\"The size of the Treasury purchases announced so far by Bessent are trivial in comparison to the size of the overall market, but the [signaling] effect was very powerful,\" said Stephen Coltman, head of macro at 21Shares, a crypto-focused creator of exchange-traded funds.\nGold touched three-month highs Monday, building on last week's advance of more than 5%. The yellow metal has climbed for five straight weeks and in August is on track for its biggest monthly rise since 1999.\nBitcoin added 2% Monday, to the highest since May. Last week, the digital currency soared 22%, its biggest three-day rally since 2023. Overnight Tuesday, the crypto touched $80,000.\nConversely, investors fled the dollar.\nThe U.S. dollar index, which tracks the dollar against six other leading currencies, hit three-month lows last week and recorded its third down week in the last four. The index was little changed on Monday as investors expressed little appetite to bid up the greenback.\n'Message' in markets\nThe Treasury Department said last week that it would double the maximum size of its bond buyback, to at least $4 billion from $2 billion. Two senior Treasury officials told CNBC Monday that the department could use its General Account to help fund the plans.\nLast week's announcement followed news that the monthly U.S. budget deficit in July reached a five-year high and came at the same time as total federal government debt topped $40 trillion. Bessent told CNBC last week that he wields a \"big toolkit\" to calm the government bond market amid concerns about the government's financial health.\nLong-dated U.S. Treasury yields surged last week, at one point sending the 30-year yield to almost a 20-year high of 5.34%, up from 4.82% in late June. Yields dipped and then rebounded in the wake of the Treasury buyback move, a signal that bond investors believed Bessent's moves were inadequate.\n\"Markets are saying something,\" the billionaire philanthropist and former energy trader John Arnold said in a Friday post on X. The weaker dollar, lower Treasury prices and strengthening hard assets, are \"all part of the debasement trade,\" he wrote.\nThe Treasury's moves could aid the bond market, but also translate into outsized pain for the dollar, according to Nohshad Shah, Citadel's head of fixed income sales for Europe, the Middle East and Africa.\nThe stakes are high for monetary policymakers, as a weaker greenback can ease financial conditions, Shah said. U.S. inflation — above the Federal Reserve's 2% target for five years — could worsen.\nThe Fed might need to hike interest rates in response, Shah said. Fed funds futures reflect about a 56% chance the central bank raises borrowing costs at its October meeting, up more than seven percentage points from a week ago, according to CME's FedWatch tool.\n\"The bond market's message is straightforward: fiscal or monetary policy should be tighter,\" Shah said in a Monday note. \"Households may ultimately pay for policymakers' unwillingness to fix the roof whilst the sun is shining.\"\nColtman at 21Shares said the appetite for alternative stores of value also stems from mounting geopolitical tension. The U.S. on Monday rolled out a global sanctions program focused on segregating Iran from the global economy, days after slapping 50% tariffs on billions of dollars in Canadian exports.\n'Inflection point'\nStill, assets that would benefit from a debasement trade have recently received votes of confidence on Wall Street.\nDeutsche Bank analyst Michael Hsueh said in a Monday note that gold could surpass his target price of $4,800 an ounce. Already, that level suggests the precious metal only need to rise another 3% or so from where it closed on Friday. \"We see the Treasury policy change as underlining the gold constructive view,\" Hsueh said.\nBillionaire investor Ray Dalio recommended investors remain overweight gold and bitcoin ahead of what he warned could become a debt crisis in the U.S. as a result of unchecked government spending. Gold could account for as much as 15% of a model portfolio, the Bridgewater Associates founder said.\n\"The government's financial condition is at an inflection point,\" Dalio wrote on LinkedIn Friday. \"If this is not dealt with now, the debts will build up to levels where they can't be managed without great trauma.\"\nOthers are less sure, devaluing the notion of a debasement trade.\nIt's probably too early to endorse the idea unless it's clear that the Fed will go along with the Treasury Department, said Alexander Lis, investing chief at Social Discovery Ventures.",

    "bodyOriginal": "OnlyFans owner was paid over $700m before his death\n- Published\nThe late owner of streaming platform OnlyFans was paid more than $700m (£513m) in dividends before his death from cancer earlier this year.\nFenix International Ltd, the British company that owns OnlyFans, made $714m in profit before tax last year, it said in its annual report. This is an increase of 5% from 2024.\nThe site hosts a range of subscription-based content from cooking to fitness videos, but it is best known for pornography and is credited with transforming online adult content by encouraging personal connection between sex workers and subscribers.\nIts owner Leonid Radvinsky, who died earlier this year aged 43, bought the site from its British founders in 2018.\nOnlyFans employs just 47 people. Companies with such high profits rarely have such small staff - for example, British retail giant Marks and Spencer, which employs over 65,000 people, made £671m in profit last year.\nFenix International's company results show that it paid dividends of $535m for the year ending 30 November 2025, with further dividends payments totalling $174m between then and 26 March 2026.\nRadvinsky, who was born in Ukraine and raised in the US, died on 23 March. The company is now owned by his widow, Yekaterina 'Katie' Chudnovsky.\nOnlyFans surged in popularity during the Covid-19 pandemic, landing Radvinsky on Forbes' annual list of billionaires just three years later.\nThe site is known for the way it encourages creators and fans to connect through livestreams, personalised messages, and direct requests for custom-made photos and videos.\nIn return for hosting the material, OnlyFans takes a 20% share of all payments.\nThe site had 132 million paying subscribers and 2.5 million active creators in 2025.\nThe boom in size and popularity under Radvinsky's ownership also brought scrutiny from lawmakers and regulators over its adult content — a recent BBC Three documentary uncovered allegations of exploitation, coercion and violence committed against OnlyFans creators.\nIn 2024, British regulators launched an investigation into whether children were accessing porn, an issue that the company at the time blamed on a technical issue.\nOfcom ultimately dropped that probe, but it fined the firm about £1m, external for failing to respond accurately to its requests for information about the measures it had in place to check the age of its users, who in theory must be 18 or over.\nCreators have also debunked the narrative that making explicit videos on the site is a get-rich-quick scheme.\nKeily Blair, the chief executive of OnlyFans, said on Tuesday that the company had paid over $30bn to creators since launching a decade ago.\n\"OnlyFans provides real opportunities to real people by creating a safe, regulated space where people can monetise their content with a global fan base,\" she said.\n\"As a UK-based business we have also made a significant contribution to the UK economy, paying over £600 million in corporate taxes from 2016 to date.\"\nRelated topics\n- Published23 March\n- Published9 April 2025",

    "summaryJa": "バーナム氏、秋予算での増税の可能性を排除せず- 公開されました",
    "bodyOriginal": "Burnham refuses to rule out tax rises in autumn Budget\n- Published\nAndy Burnham has refused to rule out tax rises in the upcoming autumn Budget, saying he \"won't be unrealistic\" about the \"challenging\" state of public finances.\nThe prime minister said he would take a \"careful approach\" to the economy, and defended his previously announced cost of living pledges as funded spending commitments.\nBurnham became prime minister in July promising to give people breathing space and help with the cost of living, but questions remain over how major policies such as social care reforms will be funded.\nExperts have previously warned that he and Chancellor John Healey will have little financial room to manoeuvre in their first Budget on 28 October.\nSpeaking during his first visit to Ukraine, Burnham said the policies announced so far including capping bus fares at £2 and cutting VAT on household electricity bills were \"the first steps that I've felt able to make\", and were doable because he was able to reprioritise funding from elsewhere.\n\"I took the decision early on that digital ID wasn't the top priority for now. And so we've reprioritised funding to other priorities,\" he said in an interview with ITV.\nAsked if the public needed to accept some of the new policies would have to be paid for in tax rises, Burnham said they wouldn't necessarily have to accept that.\nPushed on whether he would need to raise taxes to cover spending gaps, he said: \"I will always take a careful approach to things. I ran Greater Manchester for 10 years and we ran a very tight ship with rock solid finances.\n\"Nothing will change as I come into this role as prime minister. I won't take risks with people's jobs or their livelihoods or their family finances.\n\"I will try to help them in whatever way I can, I have already done some things that will help them.\"\nBurnham previously told the BBC he accepts his earlier announcements aimed at tackling the cost of living are not enough on their own and hinted at further support.\nSpeaking during his first official overseas visit on Monday, he said while he would do what he could, \"I won't be unrealistic and people really need to understand that.\n\"We are in a challenging position, whatever I do will be carefully thought through, it will be funded and there will be more to come as we go into the autumn.\"\nLast week official figures showed the the government borrowed more than expected in July, despite a record month for income tax receipts.\nInflation also reached a four-month high of 2.9% in July and is expected to rise further due to the ongoing impact of the Iran war, which has hit energy prices and fuel costs.\nExperts have warned Burnham and Healey that they need to either raise taxes or cut spending elsewhere as pressure on the public finances has left no room for extra borrowing.\nBoth the prime minister and chancellor have vowed to stick to the fiscal rules set by former chancellor Rachel Reeves.\nThe rules are designed to ensure day-to-day spending is funded through tax revenue by the end of the Parliament, and to reduce debt as a proportion of GDP.\nRain Newton-Smith, the chief executive of the Confederation of British Industry, said business owners wanted to create opportunities for young people but \"the cost of employing people has gone up so much\".\n\"The business leaders I speak to say that the cost of doing business has gone up so much that it's holding them back from creating opportunities,\" she told the Today programme.\nShe said targeted support for businesses would create \"more growth and more opportunities that saves money for the government and ultimately leads to higher tax receipts\".\nGet in touch\nDo you have any views, comments or questions about this story?\nRelated topics\n- Published12 August\n- Published12 August",
    "bodyJa": "バーナム氏、秋予算での増税の可能性を排除せず\n- 公開されました\nアンディ・バーナム氏は、財政の「困難な」状況について「非現実的ではない」と述べ、次期秋予算での増税の可能性を排除することを拒否した。\n首相は経済に対して「慎重なアプローチ」を取ると述べ、以前に発表した生活費の公約は財源を充てた支出の公約であると擁護した。\nバーナム氏は7月に首相に就任し、人々に息抜きのスペースを与え、生活費を援助すると約束したが、社会保障改革などの主要政策にどのように資金が投入されるのかについては疑問が残っている。\n専門家らは以前、同首相とジョン・ヒーリー首相が10月28日の最初の予算案で財政的に機動できる余地はほとんどないと警告していた。\nバーナム氏は初のウクライナ訪問中に講演し、バス運賃の上限2ポンドや家庭用電気代の付加価値税引き下げなど、これまでに発表された政策は「実行可能だと感じた最初の一歩」であり、他国からの資金の優先順位を再設定できたため実行可能だったと述べた。\n同氏はITVとのインタビューで、「デジタルIDは現時点では最優先事項ではないと早い段階で判断した。そのため、資金調達の優先順位を他の優先事項に変更した」と述べた。\nバーナム氏は、新たな政策の一部は増税で賄わなければならないことを国民が受け入れる必要があるかとの質問に対し、必ずしも受け入れる必要はない、と述べた。\n歳出不足を補うために増税が必要かどうかについては、「私は常に慎重に物事に取り組むつもりだ。私はグレーター・マンチェスターを10年間経営してきたが、我々は盤石な財政で非常にタイトな船を経営していた」と語った。\n「私が首相としてこの役割に就いても何も変わりません。私は人々の仕事、生計、家計に関してリスクを負いません。\n「私はできる限りの方法で彼らを助けようとします。私はすでに彼らを助けるためにいくつかのことをしました。」\nバーナム氏は以前BBCに対し、生活費対策だけでは十分ではないとの初期の発表を受け入れ、さらなる支援を示唆したと語った。\n月曜日の初の海外公式訪問で演説した同氏は、できる限りのことを行うとしながらも、「非現実的なことはしないし、人々はそれを本当に理解する必要がある」と述べた。\n「私たちは難しい立場にいます。私が何をするにしても慎重に検討され、資金も提供され、秋に向けてさらに多くのことが起こるでしょう。」\n先週の公式統計は、所得税収入が記録的な月となったにもかかわらず、政府が７月に予想を上回る借入を行ったことを示した。\nインフレ率も7月には2.9％と4カ月ぶりの高水準に達しており、エネルギー価格や燃料費に打撃を与えているイラン戦争の影響が続いているため、さらに上昇すると予想されている。\n専門家らはバーナム氏とヒーリー氏に、財政への圧力により追加借入の余地がなくなったため、増税するか他の支出を削減する必要があると警告している。\n首相も首相も、レイチェル・リーブス前首相が定めた財政ルールを堅持すると誓った。\nこの規則は、議会終了までに日々の支出が税収によって確実に賄われ、GDPに占める債務を削減することを目的としている。\n英国産業連盟のレイン・ニュートン・スミス最高経営責任者（CEO）は、経営者らは若者に機会を創出したいと考えているが、「人材の雇用コストが大幅に上昇している」と述べた。\n「私が話を聞いたビジネスリーダーたちは、事業コストが上がりすぎて機会を生み出すことが妨げられていると言っています」と彼女はトゥデイ番組で語った。\n同氏は、企業への的を絞った支援が「さらなる成長とより多くの機会を生み出し、政府の資金を節約し、最終的には税収の増加につながる」と述べた。\n連絡する\nこの話に関して何かご意見、ご意見、ご質問はありますか？\n関連トピック\n- 8 月 12 日発行\n- 8 月 12 日発行",

    "id": "trump-targets-iran-s-trade-lifelines-her-1795f5e6",
    "title": "Trump targets Iran’s trade lifelines — here are the countries most exposed",
    "titleJa": "トランプ大統領、イランの貿易ライフラインを標的に - 最も危険にさらされている国は次のとおり",
    "summaryJa": "米国は月曜日、イランを世界経済から孤立させるための「経済Dデー」キャンペーンを発表し、イランとの取引を続ける「イネーブラー」に対する罰則を脅迫した。この動きは、約6か月にわたる戦争を通じてテヘラン経済を支えてきた貿易のライフラインを切断するというワシントンの取り組みの一環である。",
    "bodyOriginal": "The U.S. announced an \"economic D-Day\" campaign Monday to isolate Iran from the global economy, threatening penalties against \"enablers\" that continue doing business with Tehran.\nThe move is part of Washington's bid to sever the trade lifeline that has sustained Tehran's economy through nearly six months of war.\nWhile enforcement details are sketchy, the threat could still put the U.S. on a collision course with some of Tehran's major trade partners.\nChina\nChina is the biggest buyer of Iranian oil and serves as a crucial link to the global economy for Tehran, accounting for about 90% of its oil exports, according to the U.S. government.\nChina reported $9.96 billion in bilateral trade with Iran in 2025, excluding the roughly $31.2 billion in unreported Iranian crude oil exports to China that year, according to the U.S.-China Economic and Security Review Commission.\nIndependent Chinese refiners take in the bulk of it, often rebranded as Malaysian or Indonesian crude and settled through intermediaries outside the dollar system, according to Kpler. The U.S. Treasury has sanctioned several of those refineries this year for Iranian oil purchases, while sparing Chinese financial institutions.\nBeijing has openly opposed U.S. sanctions against Iran, arguing that economic pressure will not resolve the disputes. In May, China ordered domestic firms to disregard U.S. sanctions on five refiners linked to the Iranian oil trade.\nWhile Beijing is unlikely to push back directly on Washington's sanctions push, it will \"quietly step up compliance\" among state banks and oil companies to avoid getting caught in the net, said Dan Wang, China director at Eurasia Group, pointing to “a dichotomy between the official statement and the private practice.”\n\"Chinese authorities care more about dollar access in financing and market entry to the U.S.,\" she said.\nUnited Arab Emirates\nThe Emirates, located just 50 miles from Iran across the Persian Gulf, has long been a major trading hub for Iran.\nThe bilateral trade amounted to around $28 billion in 2024, when the Emirates was its largest source of imports, contributing over 30%, according to the World Trade Organization data. The UAE was also Iran's third-largest export destination, making up 12% of its shipments, totaling more than $7 billion.\nThat relationship hit a snag last week as the UAE moved to suspend all trade and financial transactions with Iran, following two ballistic missiles fired toward Emirati territory, one of which targeted UAE-owned tankers.\nIran has relied on UAE banks and its financial system to access the world economy through illicit, often murky transactions, and cutting off Iran would require more forceful actions from Emirati authorities to crack down on opaque financial and trading activity, according to U.S.-based think tank The Washington Institute.\n\"The majority of Iran's transshipment, smuggling, and shadow banking activity takes place in Dubai, so Washington must do what it can to help the UAE's national leaders in Abu Dhabi convince and cajole Dubai's leaders to play ball,\" Matthew Levitt, a former U.S. Treasury official, wrote in a note on Monday.\nTurkey\nTurkey maintains significant commercial ties with Tehran, importing Iranian natural gas and exporting manufactured goods south.\nThe Turkey-Iran bilateral trade reached $5.7 billion in 2024, according to the Turkish Ministry of Foreign Affairs, with Ankara exporting mostly machinery and parts, chemical and agricultural products, while importing energy products from Tehran.\nMeanwhile, under a 25-year gas supply contract between the two countries that expired at the end of July, Turkey's imports of Iranian gas spiked this year while Iran's share of Turkey's total natural gas imports rose to 18.6%, according to local media.\nWhile Ankara has sought to diversify toward other suppliers, expanding pipeline imports from Azerbaijan and Russia, it has, so far, not signaled that it intends to cut Iran off.\nIraq\nIraq, dependent on Iranian electricity and gas, has historically traded billions with Tehran.\nIran renewed a five-year contract in March 2024 to supply Iraq with up to nearly 660 billion cubic feet of natural gas a year, and electricity imports from Iran accounted for more than 30% of its electricity generation in 2023, according to the U.S. Energy Information Administration.\nIraq-Iran trade reached more than $10 billion in 2025, according to Reuters, with Tehran exporting food, consumer goods and other products to the Iraqi market. The trade has dwindled this year amid increased security risks in the region and intermittent disruptions along border crossings since the war started in late February.\nIraq reportedly pays Iran around $4 billion to $5 billion a year for natural gas for electricity generation. The fresh U.S. sanctions could curtail Baghdad's payments for Iranian energy.\nIndia\nIndia, among Iran's top five trading partners, has seen its bilateral trade with Iran fall in recent years to around $1.6 billion in the year ending March 2026, according to India's Department of Commerce, down from $2.3 billion in the year through to March 2023.\nNew Delhi primarily exports rice, tea, sugar and pharmaceuticals to Iran, and imports dry and fresh fruits from Iran.\nIn April, India resumed importing crude oil from Iran following a seven-year halt, after the U.S. temporarily lifted sanctions on Iranian crude exports.\nBut those trades now will be tested if Washington makes good on its threat to sanction any entity, including Indian refiners, that have procured Iranian energy.",
    "bodyJa": "米国は月曜日、イランを世界経済から孤立させるための「経済Dデー」キャンペーンを発表し、イランとの取引を続ける「イネーブラー」に対する罰則を脅迫した。\nこの動きは、約6か月にわたる戦争を通じてテヘラン経済を支えてきた貿易のライフラインを切断するというワシントンの取り組みの一環である。\n施行の詳細は不透明だが、この脅威により米国はイランの一部の主要貿易相手国と衝突する可能性がある。\n中国\n米国政府によると、中国はイラン石油の最大の買い手であり、イラン石油輸出の約90％を占め、テヘランにとって世界経済への重要なつながりとなっている。\n米中経済安全保障検討委員会によると、中国は2025年のイランとの二国間貿易額が99億6000万ドルと報告したが、これを除く同年の未報告のイラン原油輸出額約312億ドルは含まれていない。\nKpler氏によると、中国の独立系精製業者がその大部分を引き取り、多くの場合、マレーシア産やインドネシア産原油としてブランド名を変更され、ドル制度外の仲介業者を通じて決済される。米財務省は今年、中国の金融機関を温存しながら、イラン産原油購入を理由にこれら製油所のいくつかを制裁した。\n中国政府は、経済的圧力では紛争は解決しないと主張し、米国の対イラン制裁に公然と反対している。中国は5月、イラン石油取引に関連する精製業者5社に対する米国の制裁を無視するよう国内企業に命令した。\nユーラシア・グループの中国ディレクター、ダン・ワン氏は、中国政府が米国の制裁推進に直接反発する可能性は低いが、網に引っかかることを避けるために国営銀行と石油会社の間で「静かに順守を強化する」だろうと述べ、「公式声明と民間慣行の間の二項対立」を指摘した。\n同氏は「中国当局は米国への資金調達や市場参入におけるドルのアクセスをより重視している」と述べた。\nアラブ首長国連邦\nエミレーツ航空はイランからペルシャ湾を挟んでわずか80マイルの距離にあり、長年にわたりイランの主要な貿易拠点であった。\n世界貿易機関のデータによると、エミレーツが最大の輸入元であった2024年の二国間貿易は約280億ドルに達し、30％以上を占めた。 UAEはイランにとって3番目に大きな輸出先でもあり、輸出総額の12％を占め、総額70億ドル以上となっている。\n先週、UAE領内に向けて2発の弾道ミサイルが発射され、うち1発がUAE所有のタンカーを標的としたことを受け、UAEがイランとの貿易・金融取引をすべて停止する措置を取ったことで、この関係は暗礁に乗り上げた。\n米国に本拠を置くシンクタンク、ワシントン研究所によると、イランはUAEの銀行とその金融システムに依存し、不法でしばしば不透明な取引を通じて世界経済にアクセスしており、イランとの関係を遮断するには、不透明な金融・貿易活動を取り締まる首長国当局のより強力な行動が必要となるだろう。\n元米財務省職員のマシュー・レビット氏は月曜のメモで、「イランの積み替え、密輸、影の銀行活動の大部分はドバイで行われているため、米国政府はアブダビのUAE国家指導者らがドバイの指導者たちを説得し、なだめてボールを戦わせるのを助けるためにできる限りのことをしなければならない」と述べた。\nトルコ\nトルコはイランとの重要な商業関係を維持しており、イランの天然ガスを輸入し、工業製品を南に輸出している。\nトルコ外務省によると、トルコとイランの二国間貿易は2024年に57億ドルに達し、トルコ政府は主に機械や部品、化学製品や農産物を輸出し、テヘランからはエネルギー製品を輸入している。\n一方、7月末に期限切れとなった両国間の25年間のガス供給契約に基づき、トルコによるイラン産ガス輸入は今年急増し、トルコの天然ガス総輸入量に占めるイランの割合は18.6％に上昇したと地元メディアが報じた。\nトルコ政府はアゼルバイジャンやロシアからのパイプライン輸入を拡大し、他の供給国への多角化を目指しているが、これまでのところイランとの関係を遮断する意向を示していない。\nイラク\nイラクはイランの電力とガスに依存しており、歴史的にテヘランと数十億ドルの取引を行ってきた。\nイランは2024年3月に年間最大6600億立方フィート近くの天然ガスをイラクに供給する5年契約を更新しており、米国エネルギー情報局によると、2023年にはイランからの電力輸入が発電量の30％以上を占めることになる。\nロイター通信によると、イラクとイランの貿易は２０２５年に１００億ドル以上に達し、テヘランは食料、消費財、その他の製品をイラク市場に輸出している。 2月下旬に内戦が始まって以来、地域の治安リスクの高まりと国境検問所での断続的な混乱を受けて、今年の貿易は縮小している。\nイラクはイランに対し、発電用の天然ガスとして年間約40億ドルから50億ドルを支払っていると伝えられている。米国の新たな制裁により、バグダッドによるイランエネルギーへの支払いが削減される可能性がある。\nインド\nインド商務省によると、イランの貿易相手国トップ5に入るインドは近年、イランとの二国間貿易が2023年3月までの1年間の23億ドルから2026年3月までの1年間で約16億ドルに減少している。\nニューデリーは主に米、茶、砂糖、医薬品をイランに輸出し、乾燥果物や生の果物をイランから輸入している。\n米国がイラン原油輸出に対する制裁を一時解除したことを受け、インドは4月、7年間停止していたイランからの原油輸入を再開した。\nしかし、イランのエネルギーを調達しているインドの精製業者を含むあらゆる企業を制裁するというアメリカ政府の脅しを実行するかどうか、これらの取引は今試されることになる。",

    "title": "Bitcoin surges past $80,000 as crypto rally gathers pace",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "スポットビットコインETFへの新たな流入とリスク選好の改善により仮想通貨の最近の上昇が拡大し、ビットコインは火曜日に8万ドルの節目を超えて急騰した。主力の暗号通貨は最後に2％超急騰し、80,501ドルとなった。",
    "bodyOriginal": "Bitcoin surged past the $80,000 mark on Tuesday, as renewed inflows into spot bitcoin ETFs and improving risk appetite extended the cryptocurrency's recent rally.\nThe flagship cryptocurrency last jumped over 2% to $80,501.\nThe latest move extends a sharp rally that began last week, when bitcoin surged more than 20% in three days, its biggest three-day gain since 2023. The rally was fueled partly by a short squeeze, with more than $4 billion in bearish crypto positions liquidated as prices rose.\nThe gains followed the U.S. Treasury's announcement that it would double its purchases of longer-dated government bonds. The move briefly pushed yields lower and revived demand for risk assets, while growing concern over inflation and government debt also boosted interest in assets perceived as scarce.\nInstitutional demand has also returned. U.S. spot bitcoin exchange-traded funds attracted $1.92 billion in net inflows last week, their largest weekly haul since October, when bitcoin reached its previous cycle peak.\nStill, questions remain over whether the breakout can last. Bitcoin has been in a prolonged slump since October, and BTIG noted that a similar surge in January 2023 initially faded before the cryptocurrency found support around its 200-day moving average.\nIn a note on Monday, Fundstrat said the buying that followed last week's short squeeze suggests bitcoin's rally may be \"more durable than a tactical bounce.\" It pointed to strong inflows into bitcoin and ether ETFs, increased trading, and the creation of more stablecoins which investors often use to buy cryptocurrencies.\nEther last traded 1.17% higher at $2,498.\nXRP rose 2.6% to $1.52. It's up about 50% in the past seven days, according to pricing from CoinGecko.\nActivity in the options market also suggests investors are becoming more confident that the rally can last, the research firm highlighted. Unlike earlier rebounds, when traders mainly bet on short-term price gains, investors are now paying for exposure to bitcoin gains further into the future.\nFundstrat also noted that bitcoin rallied without fresh purchases from Strategy, the world's largest corporate holder of the cryptocurrency. Strategy has not bought bitcoin for two weeks. If it starts buying again while ETF demand remains strong, that could provide another boost to prices.",
    "bodyJa": "スポットビットコインETFへの新たな流入とリスク選好の改善により仮想通貨の最近の上昇が拡大し、ビットコインは火曜日に8万ドルの節目を超えて急騰した。\n主力の暗号通貨は最後に2％超急騰し、80,501ドルとなった。\n今回の動きは、ビットコインが3日間で20％以上急騰し、2023年以来最大の3日間の上昇幅となった先週から始まった急騰を延長するものである。この上昇は部分的にはショートスクイーズによって促進され、価格上昇に伴って40億ドル以上の仮想通貨の弱気ポジションが清算された。\n米財務省が長期国債の買い入れ額を倍増すると発表したことを受けて上昇した。この動きにより一時的に利回りが低下し、リスク資産への需要が復活する一方、インフレや政府債務に対する懸念の高まりも希少とみなされる資産への関心を高めた。\n機関投資家の需要も戻ってきました。先週、米国のスポットビットコイン上場投資信託には19億2000万ドルの純流入があり、ビットコインが前回のサイクルピークに達した10月以来最大の週間流入額となった。\nそれでも、ブレイクアウトが持続できるかどうかについては疑問が残っている。ビットコインは10月以来長期にわたる低迷に陥っており、BTIGは、2023年1月の同様の上昇は当初、ビットコインが200日移動平均付近でサポートを見つける前に静まったと指摘した。\nファンドストラット氏は月曜日のメモで、先週のショートスクイーズに続く買いはビットコインの上昇が「戦術的な反発よりも持続性がある」可能性があることを示唆していると述べた。それは、ビットコインとイーサETFへの強い流入、取引の増加、そして投資家が仮想通貨の購入によく使用するステーブルコインの増加を指摘した。\nイーサは前回1.17％高の2,498ドルで取引された。\nXRPは2.6％上昇して1.52ドルとなった。 CoinGeckoの価格設定によると、過去7日間で約50％上昇した。\nオプション市場の活動は、投資家が上昇相場が続くとの確信を強めていることを示唆していると調査会社は強調した。トレーダーが主に短期的な価格上昇に賭けていた以前のリバウンドとは異なり、投資家は現在、さらに将来のビットコインの上昇に対するエクスポージャーの対価を支払っている。\nファンドストラット氏はまた、仮想通貨の世界最大の企業保有者であるストラテジー社から新たに購入することなくビットコインが反発したと指摘した。ストラテジーは2週間ビットコインを購入していません。 ETF需要が依然として強いうちに再び買いを始めれば、価格がさらに押し上げられる可能性がある。",

    "summaryJa": "ポルシェはインド最大のITサービス会社タタ・コンサルタンシー・サービシズと、人工知能に関する12億5000万ユーロ（14億6000万ドル）相当の5年契約を結んだ。契約の一環として、TCSはポルシェのITコンサルティング事業MHPを3億2000万ユーロで買収すると同社はリリースで述べた。",
    "bodyOriginal": "Porsche has signed a five-year contract worth 1.25 billion euros ($1.46 billion) for artificial intelligence with India's largest IT services firm, Tata Consultancy Services.\nAs part of the deal, TCS will acquire Porsche's IT consulting business, MHP, for 320 million euros, the company said in a release.\nThis will combine Porsche's \"automotive expertise with TCS's digital and AI capabilities,\" Michael Leiters, chairman of Porsche, said in the press release. The partnership will boost the European sports-car maker's innovation, efficiency and competitiveness \"in an increasingly data- and software-driven world of mobility.\"\nSince the start of the year, TCS has secured multiple AI-led business transformation deals and has said its annualized AI revenues were $2.6 billion in the June quarter, up 13.6% from a quarter earlier.\nAI is widely expected to hurt the business prospects of Indian IT services companies. The Nifty IT index, a benchmark for stocks of IT service companies, is down nearly 20% from the beginning of the year, as compared to the Nifty 50, which has slipped just over 7%.\nThe deal with Porsche will be effective once the Indian software giant completes the acquisition of MHP, which employs around 4,500 people. With this acquisition, TCS aims to \"industrialize AI at scale for Porsche,\" said K. Krithivasan, chief executive and managing director of TCS.\nIt will also enhance the presence of the Indian software service company in the German market and among European automotive and industrial customers.\nThe sale of MHP is part of Porsche's \"Sportwagenschmiede 35\" strategy, which aims to improve the profitability and cash flow of the automaker. \"We are firmly aligning our company with our core business,\" Leiters said last month, adding that the key element of the strategy would be to streamline the operations at all levels",
    "bodyJa": "ポルシェはインド最大のITサービス会社タタ・コンサルタンシー・サービシズと、人工知能に関する12億5000万ユーロ（14億6000万ドル）相当の5年契約を結んだ。\n契約の一環として、TCSはポルシェのITコンサルティング事業MHPを3億2000万ユーロで買収すると同社はリリースで述べた。\nこれにより、ポルシェの「自動車専門知識とTCSのデジタルおよびAI能力」が統合されると、ポルシェ会長のマイケル・ライタース氏はプレスリリースで述べた。この提携により、「ますますデータとソフトウェア主導のモビリティの世界において」欧州スポーツカーメーカーの革新性、効率性、競争力が強化されることになる。\nTCSは年初以来、複数のAI主導のビジネス変革契約を獲得しており、6月四半期のAI売上高は年換算で26億ドルで、前四半期比13.6％増加したと発表した。\nAI はインドの IT サービス企業の業績見通しに悪影響を与えると広く予想されています。 ITサービス企業の株価のベンチマークであるニフティIT指数は年初から20％近く下落しているのに対し、ニフティ50は7％強下落している。\nポルシェとの契約は、インドのソフトウェア大手が約4,500人を雇用するMHPの買収を完了した時点で有効となる。 TCS の最高経営責任者兼マネージング ディレクターの K. クリティバサン氏は、この買収により TCS は「ポルシェ向けに AI を大規模に工業化する」ことを目指していると述べた。\nまた、これにより、ドイツ市場および欧州の自動車および産業顧客の間でインドのソフトウェアサービス会社の存在感が高まることになる。\nMHPの売却は、自動車メーカーの収益性とキャッシュフローの改善を目的としたポルシェの「スポーツワーゲンシュミーデ35」戦略の一環である。ライターズ氏は先月、「当社は中核事業としっかりと連携している」と述べ、戦略の重要な要素はあらゆるレベルで業務を合理化することだと付け加えた",

    "id": "gold-hits-over-three-month-high-on-dolla-07e714c0",
    "title": "Gold hits over three-month high on dollar weakness, Treasury bond buyback plans",
    "titleJa": "ドル安を受けて金は3カ月ぶりの高値を更新、米国債の買い戻し計画も",
    "summaryJa": "火曜日の金価格は、米ドル安に支えられ、また米財務省の債券買い取り計画により利回りが抑制されていることから、３カ月ぶりの高値に上昇した。金スポットは0.6％上昇して1オンス当たり4,677.19ドルと、5月半ば以来の高値を付け、UOBは金が「1999年9月以来の月間上昇率」を目指す軌道に乗っていると予想した。イエローメタルは今月これまでに15％以上上昇した。",
    "bodyOriginal": "Gold prices on Tuesday rose to their highest in more than three months, supported by a weaker U.S. dollar and as the U.S. Treasury's bond buyback plans keep the lid on yields.\nSpot gold gained 0.6% to $4,677.19 per ounce, its highest since mid-May, with UOB forecasting that gold was on track \"for its strongest monthly gain since September 1999.\" The yellow metal has gained over 15% so far this month.\nGold futures were up 0.5% at 4,720.3, also a more than three month high.\nThe strength in the gold also spilled over to silver whose spot price gained 0.4% to $69.19 per ounce.\nA softer dollar makes greenback-priced gold attractive to holders of foreign currencies, while lower Treasury yields reduce the opportunity cost of buying bullion.\nThe dollar index has lost 0.8% so far this month, and while Treasury yields have been elevated for the better part of August, government plan to buyback bonds has managed to keep a lid on them — down 3 basis points this month.\nInvestors' focus will also be on the upcoming speech by U.S. Fed Chair Warsh ahead of the Jackson Hole Symposium later this week, as they look for more clues on the outlook for interest rates.\nWhile a hawkish Warsh speech will likely bring the ongoing gold rally to a halt, a dovish surprise at Jackson Hole will be ultra-bullish for gold, \"as the market will not only continue to price out Fed rate hikes but also refocus on the debasement trade amid renewed concerns on Fed independence and US debt sustainability issues,\" Citi said in a note.",
    "bodyJa": "火曜日の金価格は、米ドル安に支えられ、また米財務省の債券買い取り計画により利回りが抑制されていることから、３カ月ぶりの高値に上昇した。\n金スポットは0.6％上昇して1オンス当たり4,677.19ドルと、5月半ば以来の高値を付け、UOBは金が「1999年9月以来の月間上昇率」を目指す軌道に乗っていると予想した。イエローメタルは今月これまでに15％以上上昇した。\n金先物は0.5％上昇し4,720.3と、こちらも3カ月以上ぶりの高値となった。\n金の強さは銀にも波及し、スポット価格は0.4％上昇し、オンスあたり69.19ドルとなった。\nドル安は外貨保有者にとって米ドル価格の金を魅力的にする一方、米国債利回りの低下により地金購入の機会費用が減少する。\nドル指数は今月これまでに0.8％下落しており、米国債利回りは8月の大部分にわたって上昇しているものの、政府の国債買い戻し計画によりなんとか抑制されており、今月は3ベーシスポイント低下した。\n投資家らは金利見通しに関するさらなる手がかりを求めて、今週後半に開催されるジャクソンホール・シンポジウムに先立って行われるウォーシュ米連銀議長の講演にも注目している。\nタカ派のウォーシュ演説は進行中の金の上昇に終止符を打つ公算が大きいが、ジャクソンホールでのハト派的なサプライズは金にとって極めて強気となるだろう、「市場は引き続きFRBの利上げを織り込むだけでなく、FRBの独立性や米債務の持続可能性問題に対する新たな懸念の中で地盤下落取引に再び注目するだろう」とシティはノートで述べた。",

    "bodyOriginal": "How Canada could hit back to hurt the US economy - and Trump\n- Published\nWhat leverage does Canada, which sells about 70% of its goods to the US, actually have in this spiralling trade dispute with its southern neighbour, who also happens to be the world's largest economy?\nCanada is the top customer for 26 US states, including Maine, Michigan, and Wisconsin. And it is in the top three for 45 of the 50 American states, suggesting Prime Minister Mark Carney has room to manoeuvre in a trade fight.\nFor now, Carney's planned Canadian retaliatory duties are strategic \"dollar-for-dollar\" countermeasures focused on steel, dairy, appliances, agricultural equipment, electronics, pulp and paper - though the list is still being finalised.\nPolls suggest a majority of Canadians would be unhappy if his government went in the other direction and made significant concessions to the US. That sentiment is shared by Ontario Premier Doug Ford, one of Trump's most vocal critics north of the border, who responded to the tariff threats by telling the US president to \"kiss my ass\".\nHere are some areas that Canada can apply economic pressure.\nEnergy and critical minerals\nCarney noted on Saturday that Canada supplies the vast majority of US natural gas and electricity imports and about 60% of crude oil imports.\n\"I don't think they want us to stop sending any of that energy,\" he said.\nSqueezing the US on energy is not in the current countermeasures, although various political officials have said explicitly it wasn't ruled out - and not all provincial premiers have been keen to use that leverage.\nFord, whose Ontario province is home to Canada's auto manufacturing industry, is open to how far the dispute could go and said that an \"energy surcharge is on the table\".\nHe briefly floated a 25% surcharge in 2025 on all electricity exports to the United States, which his government estimated would have impacted 1.5 million homes and businesses in Michigan, Minnesota and New York.\nThe country is also a major source of important commodities including potash - a product in fertiliser for which Canada is the world's top supplier.\n\"I'd love to see [Trump] run cars without any oil. I'll love to see him grow vegetables and fruit without the potash,\" Ford said on Monday. \"President Trump underestimates us, and that's the biggest mistake.\"\nCanada also has significant reserves of critical minerals like lithium, nickel and graphite.\nThe US is Canada's top destination for overall mineral exports, another point where Ottawa could apply pressure.\nFord here also took the lead, saying in an interview with the Associated Press that the US \"won't get a grain of sand out of Ontario\".\nPurchasing power\nCanada has already proven that it can cause economic pain in the US.\nEven before trade talks broke down, a decision by most provinces to ban US alcohol from liquor store shelves - in response to the first wave of US tariffs early last year - dealt a devastating blow to that industry in the US.\nAmerican wine had a significant collapse in exports, one the Wine Institute called the \"most significant market disruption in decades\".\nUS wine exports to Canada fell 78% year over year, a $357m (C$494m; £261m) loss in export value, according to government data. The distillers association reported similar numbers - saying provincial bans have caused exports of American spirits to drop by more than 70%.\nThat boycott remains in place in 11 of the 13 Canadian provinces and territories. The ban is a point of significant frustration for the Trump administration.\nWhile that alcohol boycott has been put in place by political leaders, there are also grassroots decisions by many Canadians that have hurt their neighbour's economy - such as avoiding travel to the US.\nEven with a slight uptick in road trips to the US in April, Canadians made 800,000 fewer trips that month compared to the same time in 2024, before Trump returned to office, according to national data.\nThe travel boycott has meant a loss of about C$3.3bn ($2.35bn; £1.75bn) in revenue for the US last year. Some American cities and states have appealed for Canadians to return through targeted advertisements and special deals.\n'Half my business will be gone' - firms in Canada and US fear trade war\n- Published15 hours ago\nCarney faces crucial test after walking away from Trump's deal\n- Published2 days ago\nPolitical pressure\nTiming and Canadian political will could also be a tool for negotiations.\nCanadians know they will feel economic pain in this dispute - financial analysists estimated the most recent tariffs of 50% on about $20bn of Canadian imports could trim between 0.3% to 0.6% off the country's GDP in the short term.\nStill, a majority in the country broadly back Ottawa's decision to drive a hard bargain against the Trump administration, and other Canadian political leaders have shown a united front.\nA weekend poll from Angus Reid indicated that some 76% of Canadians support Ottawa's decision to walk away from trade negotiations even as they worry for their own job security.\nThe US midterm elections are fast approaching, with the economy front and centre for voters and the Republican hold on Congress looking tenuous.\nTwo of the biggest Senate races are in Michigan and Maine, which both border Canada and send most of their exports there.\nThe Yale Budget Lab calculates that under current law, Trump's global tariffs will cost American households about $1,100 annually.\nAny further increase in the costs of goods and the wider impact of the trade dispute on businesses could further sour the American public on the economy.\nOn Monday, Carney said that US workers will be hurt by Trump's most recent threat to increase tariff on autos and auto parts from Canada to 50% after 1 January.\n\"What is the message sent out to the workers in Michigan, Ohio, Kentucky, Alabama? These workers depend absolutely on Canada, their largest consumer,\" he said, adding that Canada buys more American cars than the EU and other countries.\nOn CNN on Monday, British Columbia Premier David Eby noted US consumers will see the impact of the US tariffs in any number of goods.\n\"If you're building a new home, on plywood, if you're replacing your floor, on veneers, if you're getting married, on cut flowers, if you're going out fishing, on fishing poles,\" he said.\n\"It is a bizarre policy for Americans. It's going to hurt them.\"\nFord, one of the most vocal Canadian leaders opposing the Trump administration's tariffs, also did not rule out specifically targeting Republican US states with retaliatory measures and \"making sure America's economy feels the pain\".\nAs for the coming midterms, Ford said: \"If I were allowed to, I'd be down there door-knocking\".",

    "bodyOriginal": "70,000 social and affordable homes to be built across England as part of £39bn plan\n- Published\nMinisters have announced where 70,000 social and affordable homes will be built in England over the next 10 years, in a bid to address the housing crisis.\nFunding has been granted to Greater Manchester, the West Midlands, West Yorkshire, South Yorkshire, North East England, and Liverpool, as well as £6bn for London.\nIt is the first part of a wider plan to build 300,000 social and affordable homes across the nation, under the government's £39bn social housebuilding programme.\nHousing charities welcomed the news but said it was still not enough to meet demand, while the Conservatives said it was an \"unfunded spending commitment\".\nOf the new homes announced on Monday, 60% would be for social rent - which means the cost of the unit is about half that of market rents and there are strict criteria for who can apply for it.\nPrime Minister Andy Burnham said: \"No child should be raised in a hostel room and no family should wait 10 years for a front door of their own. I have said from my first day in this job that everything starts with a good home.\"\nEarlier this year, before he became prime minister, Burnham had called for the entire 10-year £39bn affordable housing budget for England to be spent on homes for social rent.\nUnder Labour, homeless figures have continued to rise to record levels.\nData released earlier this month suggested 177,530 children were homeless in temporary accommodation.\nNatasha, who has been living in a hotel in Milton Keynes for the last four months with her son Zayd, is one of those waiting for a permanent home.\nThe 22-year-old spent the final months of her pregnancy and the first weeks of her son's life living in a hotel.\nShe says she has no idea how long she will be expected to stay there but was told it would only be temporary.\n\"I'm just scared when he gets older, when he starts crawling around, I can't even allow him to crawl in such a place like that because it's so dirty,\" she says.\nWhile pregnant, Natasha says her room became infested with ants, which she repeatedly reported before eventually being moved into another room.\nBut her problems didn't end there.\nWhile Natasha has her own bathroom, she shares a kitchen with around 60 other residents. She says the hotel is home to a mix of people, not just mothers and babies, and that she does not always feel safe using the shared space with Zayd.\nNatasha describes living there as feeling \"like a prison\". She says visitors are not allowed, meaning friends and family can not come to help her with her five-week-old boy.\n\"I just want somewhere peaceful for him and calm. Somewhere nice where I can bring him up,\" she says.\nShe is one of the 1.34 million households on social housing waiting lists as of March 2025, the latest government figures.\nLondon will see the largest share of funding, although no figure has been given for how many homes will be built in the capital.\nMinisters said Monday's allocation was the first stage of the 10-year programme and more than £16bn remains to be allocated outside London.\nHousing Secretary Angela Rayner suggested some of the new homes will be built by councils, saying she and the prime minister were \"doing everything we can to get councils building once again\".\nBurnham had previously promised \"the biggest council house building programme since the post-war period\", and the government said millions extra would be given to councils to support their housebuilding plans and help with expertise.\nBut the announcement stops short of clarifying how the funding will be split between council homes and those provided by housing associations.\nIn the 1950s, councils were building almost 200,000 new council homes a year, but half of councils do not currently own or build their own homes.\nIn 2024-25, there were just over 12,000 homes built for social rent - the highest since 2013 -14, but organisations like the National Housing Federation and homeless charities have previously agreed that at least 90,000 social homes would need to be built each year to meet demand.\nSocial housing provides affordable homes at a low cost, managed by social landlords. It includes affordable rented properties as well as low-cost home ownership, such as shared ownership, and can be provided by local authorities and housing associations.\nCharlie Berry, policy manager at housing charity Shelter, said the announcement was \"not near the level we need to truly tackle that backlog and end homelessness\".\nBut she said it was a \"significant improvement\", and added she would \"love\" Rayner to commit to a target of how many socially rented homes will be built annually.\nAs well as promise and funding to build more social homes, the Labour government pledged to build 1.5 million homes by 2029.\nDespite statements like \"build, baby, build\", coined by former housing secretary Steve Reed, so far Labour is not on track to meet that target.\nBBC Verify has been tracking the target using government statistics on the number of Energy Performance Certificates (EPC) issued by each local authority. Each newly created dwelling must have an EPC by law, making it the most timely indicator of new homes being built.\nThe latest EPC data suggests about 203,000 new homes were delivered in England in the 12 months ending June 2026. To reach the government's target of 1.5 million homes over five years, there would need to be at least 300,000.\nConservative shadow housing secretary Sir James Cleverly described the announcement as \"sleight of hand\", saying: \"The small print shows homes won't have to be delivered until 2039.\"\nHe said: \"Fewer homes will be delivered than previous programmes in this Parliament as social rent is more expensive. Labour have scaled back their affordable housing programme and expect us to thank them for it.\"\nThe Conservatives have said they would end the provision of social housing for foreign nationals in England if they win power at the next election which they estimated would \"free up\" 228,144 homes for \"British families\". On Monday, Reform announced similar plans to prioritise British-born workers under 35 when allocating social housing if it were to enter government.\nShelter said there were \"already strict rules on who can access social housing\" and neither plan addressed the underlying cause of the problems.\nRelated topics\n- Published23 February\n- Published10 February\n- Published13 hours ago",

    "title": "US-Canada trade war escalates as Trump threatens tariff hike on autos after Carney vows to retaliate",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "US-Canada trade war escalates as Trump threatens tariff hike on autos after Carney vows to retaliate\n- Published\nPresident Donald Trump has threatened to hike US tariffs on automobiles originating in Canada, as the trade war between the two neighbours continues to heat up.\nTrump said on Monday that he will increase tariffs on Canadian cars and trucks, as well as auto parts, from 25% to 50% as of 1 January.\nIt comes after US-Canada trade talks collapsed late last week, with each side accusing the other of making unreasonable last-minute demands.\nPrime Minister Mark Carney called Trump's latest levy threat unsurprising and accused the president of wanting to destroy Canada's auto industry. He added that Canada is ready to resume talks if the US comes with the \"right attitude\".\nThe war of words followed several US and Canadian officials saying that talks are suspended with no set date to resume.\nCanada walked away from trade negotiations late Friday night, moments before a US-imposed deadline that would add a 50% levy on nearly $20bn (C$28bn; £14bn) of Canadian imports.\nThe collapse in talks marked a significant change in tone from earlier in the week, when both sides appeared optimistic that a new US-Canada trade deal could be reached.\nCanadian officials have said the US introduced last-minute demands that were \"unacceptable\", including a clause limiting which countries Canada could sign trade deals with.\nUS officials, meanwhile, said it was Canada that introduced last-minute changes.\n\"They wanted more,\" US Trade Representative Jamieson Greer said in an interview with CNBC on Monday.\nThe breakdown led to growing tensions as both sides publicly dug in their heels.\nOn Monday, Trump's tariff threats to Canada's auto industry followed Carney declaring the country would counter his levies with reciprocal tariffs on US goods \"dollar for dollar\".\nCarney said he was focused on supporting Canadian businesses impacted by new 50% US tariffs after the Friday deadline expired, as well as building infrastructure to diversify Canada's trade, which historically has relied heavily on the US.\nCarney announced funding of C$11bn ($7.95bn; £5.83bn) to build six icebreakers at a Quebec shipyard for the Canadian Coast Guard that will replace its medium and heavy ageing fleet.\nThe icebreakers will be used to open winter shipping routes through Canada's northern and Atlantic waters.\nMeanwhile, Ontario's outspoken premier, Doug Ford, whose province is home to Canada's auto manufacturing industry, responded to Trump's tariffs and threats by telling the US president to \"kiss my ass\".\nFord also suggested that Canada should charge the US extra for its oil and gas, as well as electricity and critical minerals, adding that he will be speaking to Carney on ways to \"fight back\".\nHis comments appeared to catch the attention of Trump, who in a Truth Social post accused Ford of \"bluster\" and wrote: \"Someone should get these clowns to 'fall in line' or, the consequences for Canada will be far WORSE!\".\nCanada accounts for 60% of total US crude oil imports and close to 100% of US natural gas exports, according to Canadian government data.\nBusinesses on both sides have warned that they stand to be hurt by the new wave of US tariffs on Canada, as well as the retaliatory tariffs that Canada plans to impose on 8 September.\nIn Portland, Oregon, Mike Roach and Kim Osgood, owners of Paloma Clothing say the price of one of their best-selling items - specially designed pillows made in Canada - could shoot up by around 50% to $90. For now, they are holding out on keeping the prices steady, hoping that the \"tariff problem\" is worked out soon, said Roach.\n\"It would be one thing if we had three months' notice - that would be something you could plan around, do some work with the vendors,\" he said. \"But when it happens literally overnight you're really stuck.\"\nThe rapidly escalating trade war is also raising questions about the other country in North America - Mexico - and the trade pact between the three neighbours known as the USMCA.\nBoth Canada and Mexico have said they want the USMCA extended for another 16 years, but the US has said it will not renew in its current form. The pact underpins $1.6tn in North American Trade.\nEscalating trade tensions mean \"the risk of the USMCA unravelling has increased\", experts from the Oxford Economics forecasting firm warned on Monday. That, in turn, \"would plunge Canada into recession and leave it on a permanently lower growth path\".\nAdditional reporting by Ana Faguy.\nRelated topics\n- Published15 hours ago\n- Published2 days ago",

    "id": "paramount-ceo-david-ellison-is-at-the-fi-b47dd56a",
    "title": "Paramount CEO David Ellison is at the final hurdle before buying WBD. So far, he can't clear it",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "David Ellison — the founder of a film production company and son of billionaire Larry Ellison — has been at the helm of Paramount Skydance for just over a year. He's been fighting to acquire Warner Bros. Discovery for nearly as long.\nThe latest roadblock in his path, a group of state attorneys general seeking to stop the deal, may be his toughest yet. The antitrust hurdle and related delay have left the CEO hunting for avenues to get the deal done.\nThe delay in closing Paramount's acquisition of WBD could add hefty costs on top of the $110 billion proposed price tag at a time when media companies across the landscape are under intense pressure.\nYet, with a trial in the antitrust case set for March, Ellison has never felt more confident that the deal not only makes sense, but will get completed, according to a person familiar with his thinking, who asked to remain unnamed to speak candidly.\n\"The company believes strongly in this,\" Paramount's lead trial attorney Jeffrey Kessler said on CNBC in July, adding the company was prepared to bring the matter to the Supreme Court if necessary.\nStill, Ellison appears to be making little ground with California Attorney General Rob Bonta, who is leading the states' charge in court. Both sides have said they are eager to make amends outside of the courtroom.\n\"I think the whole issue there is, will the state AGs be interested in settling, and I'm not quite sure there's any real incentive for them to settle given the fact the California home constituency here is overwhelmingly against the transaction,\" said Tom Rogers, a media veteran who's currently senior advisor to Versant Media Group and executive chairman of AI film and TV production company Fountain 0.\nA Paramount spokesperson declined to comment for this article.\nThe final threat\nEllison's pursuit of WBD began last September with three unsolicited bids to take over the storied entertainment company, which includes the legendary film studio, a portfolio of pay TV networks and the HBO Max streaming business.\nEllison's interest ultimately spurred a formal sale process that superseded a plan by WBD to split in two. When Warner Bros. Discovery crowned Netflix the bidding war winner, Ellison went hostile and promised WBD shareholders a premium.\nIn February, Netflix abandoned its pending transaction and Paramount entered into an agreement to buy the entirety of WBD. The deal has won approval from all global regulators, including the Antitrust Division of the U.S. Department of Justice.\nThat leaves Bonta and the other 11 suing states as the final threat to Ellison's long-sought-after acquisition.\nBonta has said his aim is in part to take up the baton where he feels President Donald Trump's administration has fallen short on regulation. He has said Trump has gotten \"involved improperly\" in other merger situations.\nMeanwhile, the Ellison family's ties to Trump have drawn criticism. Larry Ellison is a longtime supporter of Trump, and the president has said publicly he'd like to see Warner Bros. Discovery's CNN land in Paramount's hands.\nWhen speculation began in the spring that a group of states would seek to challenge the merger — putting particular focus on two segments of the combination: their extensive portfolios of pay TV networks and powerhouse film studios — Ellison's Paramount immediately began its outreach to Bonta's office, according to the person familiar with the matter. By mid-May the company had sent a list of potential concessions to Bonta, added the person.\nFollowing a preliminary injunction granted by the California district court, which paused any movement on the deal for 14 days, Paramount said it was willing to officially delay the deal and move to a trial to fight its case for the merger.\nHowever, the March trial date was later than company executives had hoped for, according to two people familiar with the matter.\nIn the ensuing weeks, Paramount went on the offensive.\nParamount's playbook\nShortly after the lawsuit hit in mid-July, Ellison took his argument for the deal public, writing a New York Times op-ed. That piece followed others from industry leaders arguing both for and against the merger, expanding the debate beyond legal filings.\nEllison has also sought to win over Hollywood exhibitors with contracts guaranteeing that a combined Paramount-WBD would release a a minimum 30 films a year with 45-day theatrical windows for a period of at least three years, according to a person familiar with the contracts, who spoke on the condition of anonymity because they were not authorized to speak publicly.\nAnd, reports surfaced that Paramount was considering relocating its studio and headquarters outside of California in response to Bonta's challenge. One of the people familiar with the matter told CNBC a move to Tennessee was on the table.\nThat suggestion largely backfired, with Bonta calling the threat to relocate \"blackmail.\"\nLast Thursday, the California AG said in a CNBC interview that he would be willing to hold talks outside of the courtroom, but that a settlement would require \"robust structural remedies.\"\nThe following day a meeting was held at Bonta's office, according to a statement from the government official's spokesperson. While another meeting was slated for Monday, media reports of the meeting and what an eventual settlement could entrail — such as divesting some pay TV networks — led Bonta to call off the discussions, his office said.\nOn Monday, a Bonta spokesperson alleged that Paramount was behind the \"leak\" of the parties' discussions, which it further said were misrepresented, and said it demonstrated a \"lack of good faith.\"\n\"As soon as Paramount stops playing games and engages sincerely, my office is happy to meet again,\" Bonta said.\nParamount responded later Monday denying it was the source of the leak.\n\"We remain hopeful and stand ready to continue good faith discussions to resolve the Attorneys General suit and move forward with our plans for increased competition and increased output to the benefit of the talent and entertainment workers,\" the company said in a statement.\nComing to the negotiating table\nWhile the contents of Paramount's list of concessions — as sent to Bonta's office back in May — remain unclear, they appear to be in contrast to what Bonta and his peers have raised red flags about.\n″[Paramount] wanted to talk about everything except for what this case is about. They want to talk about the streaming market, which we don't allege in our complaint. They want to talk about CNN, which is not a focus of our complaint. They want to talk about the foreign regulators. We want to talk about the three markets that we set forth in our complaint, where we think there's antitrust violation,\" Bonta said in an interview with David Faber on CNBC last week.\nParamount has declined to discuss what possible remedies it set forth, with the exception of the commitments it's made to the film industry.\nIn a July interview on CNBC, Paramount attorney Kessler said the company had been willing to put in writing that it would commit to 30 films per year, legitimatizing an earlier promise made by Ellison that struck some as unrealistic given Hollywood track records.\nIf Paramount were to fall short of that promise, it'd be opening itself up to litigation, Kessler said. That commitment became the underpinning for Paramount's offer to sign contracts with Hollywood exhibitors, at least one of which took the offer, according to the person familiar.\nIn recent days, the Wall Street Journal reported the state AGs were seeking a divestiture of some of the pay TV networks included in the merger. The combination of Paramount and WBD would create the biggest portfolio of networks in the industry, and the states have argued that no matter the state of the business, that scale creates outsized power.\n\"Whether the market is shrinking or growing is really irrelevant,\" Bonta said on CNBC last week, adding a combined Paramount-WBD would create a \"presumptively illegal market concentration\" in film and TV.\nBut the ongoing industry challenges — particularly for these two companies — has been the basis for Ellison's push to merge. And it may be a better argument than Bonta would admit.\nBetter together\nIndustry analysts, experts and insiders have consistently poked holes in the states' argument that the combination of TV networks would create antitrust issues.\n\"The merger does create a larger competitor, but size alone is not evidence of market position. Neither company has possessed the scale necessary to compete effectively against much larger global streaming platforms and well-funded technology companies,\" Bernstein analysts said in a recent note.\nMedia companies' most recent earnings reports — including those from WBD and Paramount — once again put on display the ongoing losses for pay TV advertising and distribution revenue streams.\nParamount's chosen remedy is scale.\nBoth companies' portfolios are made up of dozens of TV networks, with Paramount's offering including channels like Nickelodeon, MTV and BET, and WBD owning channels like TNT, CNN, TBS and the Discovery Channel. Paramount also owns the broadcast network CBS.\n\"The economics of Pay-TV are being dictated by consumer behavior rather than consolidation. The merger may change the scale of a participant, but it does not change the direction of the industry's secular trajectory,\" the Bernstein analysts said.\nIt's a similar story in streaming and films, where Paramount would similarly combined the two companies portfolios.\nEllison has said upon completion of the merger, Paramount+ and HBO Max would become one service. And the combined entity would encompass two major film studios. And yet neither company is dominating in either category.\n\"The states also argue that the combined company would control approximately 27% of US theatrical releases and roughly 30% of blockbuster film distribution. Those figures are certainly meaningful, but they fall well short of establishing a dominant market position. More importantly, theatrical market share is dependent on annual content slates,\" the Bernstein analysts wrote.\nPay TV profits\nExecutives at the company believe the rate of pay TV decline is beginning to stabilize.\n\"The rate of decline of subscribers is starting to ebb, meaning we're not quite there yet, but an ascent to where we're going to steadily see a base of subscribers, I would say, probably in the mid-30 million range in the country,\" said Andy Gordon, chief strategy officer and chief operating officer at Paramount, in a recent interview.\nStill, a recent report from S&P Global Ratings notes that while the rate of cord cutting has improved in the U.S., it doesn't see much improvement to leverage for these companies over the next couple of years, meaning media companies won't have as much power in distribution discussions with pay TV operators.\nAnd in general, despite subscriber losses, these channels are still profitable and often used to fund other parts of media businesses, such as building out streaming services or paying down heavy debt loads.\nSince Warner Bros. and Discovery combined in 2022, the company has been aggressively repaying the debt that largely stemmed from that merger.\nIf Paramount's acquisition of WBD were to close, the combined company would have nearly $80 billion in debt.\nDelays past Sept. 30 would only increase the amount of expenses on Paramount's plate as the company becomes responsible for a \"ticking fee\" due to WBD shareholders. Paramount has requested that the court force the suing states to post a bond of $1.88 billion to cover the fees and costs associated with the delay.\n— CNBC's Sarah Whitten contributed to this report.",
