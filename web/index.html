    "title": "Berkshire Hathaway boosts Alphabet to a top three holding, ups Delta and housing bets",
    "titleJa": "バークシャー・ハサウェイがアルファベットを保有株トップ3に押し上げ、デルタと住宅への賭けも上昇",
    "summaryJa": "バークシャー・ハサウェイは第2四半期にアルファベットへの出資比率を大幅に引き上げ、親会社であるグーグルを3大株式保有者に押し上げた。この広大な複合企業は、デルタ航空やさまざまな住宅建設会社への投資の規模も拡大しました。金曜日に発表された規制当局への提出書類によると、バークシャーは現在最高経営責任者（CEO）グレッグ・アベルの下で事業を展開しており、6月末時点で379億ドル相当のアルファベット株約1億600万株を保有していた。ポジションの規模は最新四半期に83％急増し、アルファベットはオマハに本拠を置くバークシャーの米国上場株式を時価総額で3番目に多く保有する企業となった。 Apple と American Express への投資だけが規模が大きくなります。",
    "bodyOriginal": "Berkshire Hathaway sharply increased its stake in Alphabet in the second quarter, vaulting the Google parent into its three biggest stock holdings. The sprawling conglomerate also added to the size of its investments in Delta Air Lines and various homebuilders.\nBerkshire, now operating under CEO Greg Abel, owned about 106 million Alphabet shares worth $37.9 billion at the end of June, according to a regulatory filing released Friday. The size of the position jumped 83% in the latest quarter, making Alphabet the third-largest U.S.-listed equity holding at Omaha-based Berkshire by market value. Only investments in Apple and American Express are larger.\nThe increase largely reflects a $10 billion private stock purchase announced in early June, when Alphabet sought fresh capital to finance its massive AI infrastructure buildout.\nWarren Buffett, now chairman at Berkshire, told CNBC he had been behind the bullish view on Alphabet, with Abel's support.\nBerkshire also continued to build a sizable wager on the airline industry, a past favorite of Buffett's. The holding in Delta Air Lines climbed 44% during the quarter, to 57.3 million shares, valued at about $5.4 billion at the end of June. Berkshire had only recently returned to Delta after famously selling its airline holdings in the early days of the pandemic.\nHousing was another cyclical business where Berkshire increased its exposure, boosting its holding of Class A shares of Lennar by nearly 30%, to 13.1 million shares, worth about $1.19 billion, while Class B holdings rose 25% to roughly 298,000 shares. Berkshire also disclosed a small new position in D.R. Horton, holding 3,600 shares at the end of June.\nBerkshire ended a long streak of net stock sales, emerging as a buyer of equities in the second quarter with nearly $20 billion in net purchases. Berkshire had been a net seller for 14 straight quarters before the latest three-month period.\nThe conglomerate's cash level fell to $365.5 billion at the end of June from a record $397.4 billion three months earlier, as Berkshire began putting more of its capital to work through investments and share repurchases. The quarter also saw the completion of Berkshire's acquisition of Taylor Morrison, a Scottsdale, Arizona-based homebuilder.",
    "bodyJa": "バークシャー・ハサウェイは第2四半期にアルファベットへの出資比率を大幅に引き上げ、親会社であるグーグルを3大株式保有者に押し上げた。この広大な複合企業は、デルタ航空やさまざまな住宅建設会社への投資の規模も拡大しました。\n金曜日に発表された規制当局への提出書類によると、バークシャーは現在最高経営責任者（CEO）グレッグ・アベルの下で事業を展開しており、6月末時点で379億ドル相当のアルファベット株約1億600万株を保有していた。ポジションの規模は最新四半期に83％急増し、アルファベットはオマハに本拠を置くバークシャーの米国上場株式を時価総額で3番目に多く保有する企業となった。 Apple と American Express への投資だけが規模が大きくなります。\nこの増加は主に、アルファベットが大規模なAIインフラ構築に資金を提供するための新たな資金を求めていた6月初旬に発表した100億ドルの未公開株購入を反映している。\n現在バークシャーの会長を務めるウォーレン・バフェット氏はCNBCに対し、アルファベットに対する強気の見方を支えたのはアベル氏の支援だったと語った。\nバークシャーはまた、バフェット氏のかつてのお気に入りだった航空業界に巨額の賭け金を積み続けた。デルタ航空の保有株は同四半期中に44％増加し、5,730万株となり、6月末時点で約54億ドル相当となった。バークシャーは、パンデミックの初期に航空会社の保有株を売却したことは有名であったが、デルタ航空に戻ったのはつい最近だった。\n住宅もまた景気循環事業で、バークシャーはエクスポージャーを増やし、レナーのクラスA株の保有を30％近く増やして1310万株（約11億9000万ドル相当）とした一方、クラスBの保有株は25％増の約29万8000株となった。バークシャーはまた、DRにおける小規模な新たなポジションも明らかにした。ホートンは6月末時点で3,600株を保有。\nバークシャーは、第2四半期には200億ドル近くの純購入で株式の買い手として浮上し、長期にわたる株式の純売却記録に終止符を打った。バークシャーは直近の３カ月期までは１４四半期連続で売り越しとなっていた。\nバークシャーが投資や自社株買いを通じてより多くの資本を活用し始めたため、複合企業の現金水準は3カ月前の過去最高だった3974億ドルから6月末時点で3655億ドルに減少した。同四半期には、バークシャーによるアリゾナ州スコッツデールに本拠を置く住宅建設会社テイラー・モリソンの買収も完了した。",

    "title": "Regulators and banks step up scrutiny of prediction markets",

    "summaryJa": "商品先物取引委員会は予測プラットフォーム上の「メンション市場」について内部調査を行っていると、状況に詳しい関係者が金曜日CNBCに語った。メンション市場は、特定の単語がスピーチ、アナリストや投資家との企業決算会見、またはテレビ放送で使用されるかどうかをトレーダーが推測する契約で構成されています。",
    "bodyOriginal": "The Commodity Futures Trading Commission is conducting an internal review into \"mention markets\" on prediction platforms, people familiar with the situation told CNBC Friday.\nMention markets are made up of contracts where traders speculate on whether specific words will be used in a speech, a corporate earnings call with analysts and investors or a television broadcast.\nOne of the people familiar with the matter said the CFTC first alerted platform Kalshi of the review several weeks ago. The platform removed sports-related mention markets around the same time the CFTC — the federal regulator for prediction markets — alerted the company, the person said. NPR first reported an inquiry into mention markets late Thursday.\nIt's unclear if the inquiry only applies to sports-related mention markets, or all of them regardless of topic.\nKalshi and the CFTC declined to comment.\nMost scrutinized\nMention markets are some of prediction markets' most scrutinized offerings. Critics view them as easily manipulable by one individual, and some platforms don't offer them. Mention markets saw about $3.3 million in trading volume on Kalshi last month, according to Dune Analytics, far behind larger markets such as those devoted to cryptocurrencies.\nIn July, the CFTC said it was investigating a former teleprompter operator for President Donald Trump who allegedly made $90,000 in profits on Kalshi betting on the content of Trump's speeches.\nCoinbase CEO Brian Armstrong last December rattled off a series of random words at the end of an earnings call to demonstrate how easily prediction market wagers can be manipulated. \"I just want to add here the words bitcoin, ethereum, blockchain, staking and Web3 to make sure we get those in before the end of the call,\" he said.\nProponents of mention markets argue words by powerful individuals have the power to move billions of dollars of money across traditional markets, making it useful to have attach predictive power to them.\n\"The suggestion that Mentions Markets create 'new' manipulation incentives is, on close inspection, overstated,\" Kalshi head of market operations Arjun Sawai wrote in a letter to the CFTC as part of a public comment period last month. \"They merely add a marginal, regulated, transparent, position-limited, surveilled increment to a vastly larger existing incentive structure.\"\nPlatform Polymarket does not have mention markets on its CFTC-regulated U.S. exchange, but offers them overseas.\nMeeting next week\nThe probe into prediction market contracts comes ahead of a meeting of the CFTC's Innovation Advisory Committee on Aug. 20. The committee will discuss prediction markets, as well as artificial intelligence and cryptocurrency, according to a public agenda.\nThe latest investigation also comes after the CFTC increased scrutiny of prediction market platforms in recent weeks, even as it supports the event contract exchanges in a battle with states over sports-related wagers and gambling. The commission has sued nine states to defend what it sees as its exclusive jurisdiction to regulate event contracts.\nLast month, the CFTC invited public comments on vertical integration among regulated entities, warning platforms to avoid sending broadly-worded, self-certified event contracts. The agency also sent letters to the platforms last week, reminding them not to present their odds in a casino-style format.\nA Washington state judge on Thursday issued an order blocking several of Kalshi's markets from operating there, including mention markets, sports, elections and other high volume categories. Kalshi is likely violating state law by operating as an illegal gambling operation, according to the order.\nWashington becomes the fourth state blocking Kalshi, joining Michigan, Nevada and Massachusetts. A federal judge in Minnesota last month overturned a potential statewide ban on prediction market platforms.\nThe Financial Times reported Friday that Polymarket was cut off from financial services by JPMorgan last October over concerns about government regulation. A Polymarket spokesperson told CNBC it's still maintaining a relationship with the largest U.S. bank.\n\"We maintain a close, active relationship with JPMorgan across multiple entities, operational integrations, and material handling customer fund flows; the strength of our relationship is highlighted by our CEO speaking at three of their flagship events in the past year alone,\" a Polymarket spokesperson said in a statement. \"Any suggestion otherwise fundamentally mischaracterizes our relationship.\"\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.",
    "bodyJa": "商品先物取引委員会は予測プラットフォーム上の「メンション市場」について内部調査を行っていると、状況に詳しい関係者が金曜日CNBCに語った。\nメンション市場は、特定の単語がスピーチ、アナリストや投資家との企業決算会見、またはテレビ放送で使用されるかどうかをトレーダーが推測する契約で構成されています。\n関係者の１人によると、ＣＦＴＣは数週間前にプラットフォームのカルシに初めてこの見直しについて警告した。この関係者によると、予測市場の連邦規制当局であるCFTCが同社に警告したのとほぼ同時に、同プラットフォームはスポーツ関連の言及市場を削除したという。 NPRは木曜遅くにメンション市場への調査を初めて報じた。\nこの調査がスポーツ関連の言及市場のみに適用されるのか、それとも話題に関係なくすべての市場に適用されるのかは不明である。\nカルシとCFTCはコメントを控えた。\n最も精査されている\nメンション マーケットは、予測マーケットの中でも最も精査されたサービスの一部です。批評家は、それらは個人によって簡単に操作できるものとみなしており、一部のプラットフォームではそれらを提供していません。デューン・アナリティクスによると、先月のカルシのメンション市場の取引高は約330万ドルで、仮想通貨専用の市場などの大規模市場に大きく及ばない。\nCFTCは7月、トランプ大統領の演説内容に賭けてカルシで9万ドルの利益を得た疑いで、ドナルド・トランプ大統領の元テレプロンプターオペレーターを捜査していると発表した。\nコインベースのCEOブライアン・アームストロング氏は昨年12月、決算会見の最後にランダムな言葉を連発して、予測市場の賭け金がいかに簡単に操作できるかを実証した。 「電話が終わる前にそれらを確実に理解できるように、ビットコイン、イーサリアム、ブロックチェーン、ステーキング、Web3という言葉をここに追加したいと思います」と彼は述べた。\n言及市場の支持者は、有力な個人の言葉には従来の市場全体で数十億ドルの資金を動かす力があり、それに予測力を持たせることが有益であると主張する。\n「メンション市場が『新たな』操作インセンティブを生み出すという提案は、よく調べてみると誇張されている」とカルシの市場運営責任者アルジュン・サワイ氏は先月のパブリックコメント期間の一環としてCFTCに宛てた書簡の中で述べた。 「それらは、非常に大規模な既存のインセンティブ構造に、限界的で、規制され、透明性があり、ポジションが限定され、監視されている増分を追加するだけです。」\nプラットフォーム Polymarket は、CFTC 規制の米国取引所に市場を記載していませんが、海外では市場を提供しています。\n来週の会議\n予測市場契約に関する調査は、8月20日に開催されるCFTCのイノベーション諮問委員会の会合に先立って行われる。公開議題によると、同委員会では予測市場のほか、人工知能や仮想通貨についても議論される予定だという。\n今回の調査は、CFTCがスポーツ関連の賭博や賭博を巡る各国との争いでイベント契約の取り交わしを支持しながらも、ここ数週間で予想市場プラットフォームへの監視を強化したことを受けて行われた。同委員会は、イベント契約を規制する独占的管轄権を擁護するために9つの州を訴えた。\nCFTCは先月、規制対象事業体間の垂直統合に関するパブリックコメントを募集し、広義の自己認証イベント契約書の送付を避けるようプラットフォームに警告した。同庁は先週、各プラットフォームに書簡を送り、オッズをカジノ形式の形式で提示しないよう注意を促した。\nワシントン州の判事は木曜日、言及市場、スポーツ、選挙、その他の取引量の多いカテゴリーを含むカルシのいくつかの市場のそこでの運営を阻止する命令を出した。命令によると、カルシ氏は違法賭博事業として州法に違反している可能性があるという。\nワシントン州はミシガン州、ネバダ州、マサチューセッツ州に続き、カルシを阻止する4番目の州となる。ミネソタ州の連邦判事は先月、予測市場プラットフォームに対する州全体の禁止の可能性を覆した。\nフィナンシャル・タイムズ紙は金曜日、ポリマーケットが政府規制への懸念を理由に昨年10月にJPモルガンによって金融サービスから切り離されたと報じた。ポリマーケットの広報担当者はＣＮＢＣに対し、米最大手銀行との関係は引き続き維持していると語った。\nポリマーケットの広報担当者は声明で、「当社は、複数の事業体、業務統合、顧客の資金の流れのマテリアルハンドリングにおいて、JPモルガンと緊密かつ積極的な関係を維持している。当社の関係の強さは、当社のCEOが過去1年だけで3つの主力イベントで講演したことからも明らかだ」と述べた。 「それ以外のいかなる提案も、私たちの関係を根本的に誤ったものにしてしまいます。」\n開示: CNBC とカルシには、顧客の獲得と少数出資を含む商業関係があります。",

  {
    "id": "mangione-admits-killing-healthcare-ceo-a-989a69b7",
    "title": "Mangione admits killing healthcare CEO and pleads guilty to federal charges",
    "titleJa": "マンジョーネ氏、ヘルスケアCEO殺害を認め、連邦容疑で有罪を認める",
    "summaryJa": "マンジョーネ氏、ヘルスケアCEO殺害を認め、連邦容疑で有罪を認める- 公開されました",
    "bodyOriginal": "Mangione admits killing healthcare CEO and pleads guilty to federal charges\n- Published\nLuigi Mangione has admitted to killing UnitedHealthcare CEO Brian Thompson, pleading pleaded guilty to federal charges of interstate stalking resulting in death.\n\"I shot Mr Thompson in Manhattan and he died,\" the 28-year-old admitted in federal court in Manhattan on Friday.\nThompson, a 50-year-old father of two, was shot from behind on 4 December 2024 as he walked into a hotel in midtown Manhattan. Following the plea hearing, his family issued a statement calling it \"an important step toward justice for Brian and for our family\".\nMangione faces a maximum sentence of life in prison. He also faces state charges, although his lawyers are seeking to get those dismissed following his guilty plea.\nMangione had initially pleaded not guilty in both the federal and state cases against him over the fatal shooting of Thompson.\nHis lawyers announced that he intended to plead guilty to the two federal charges against him at Friday's federal court hearing.\nWearing a beige prison outfit, Mangione appeared solemn and serious throughout the hearing.\nReading a statement aloud to the court, he admitted to planning the attack ahead of time, crossing state lines with the intent to kill and using a gun he printed using a 3D printer and equipped with a silencer and magazine.\nHe told the court he was driven to kill Thompson because of his experience with the healthcare system \"after years of enduring severe pains from a broken back\".\nMangione stated that he had learned UnitedHealthcare would be holding an annual investor conference in Manhattan in December 2024.\nHe then travelled to New York for the event, he told the court.\nHe also said he emailed UnitedHealthcare prior to the conference \"posing as an investor\" and asking questions about the event.\n\"I emailed UnitedHealthcare with the intent to shoot Brian Thompson,\" Mangione said in his statement. \"On the morning of Dec. 4, 2024 I shot Mr. Thompson in Manhattan in his back.\"\nThe sentencing for the federal charges is scheduled for 18 December.\nThompson's family said in a statement that they will continue to seek justice in both New York state and Pennsylvania, where Mangione was arrested.\n\"While nothing will ease the pain of losing him, we are grateful that the federal justice system has held the person responsible for this heinous act accountable,\" they said.\n\"Now we look to the court to ensure that sentencing reflects the severity of this crime.\"\nProsecutors have recommended Mangione serve 24-30 years in prison. But Judge Margaret Garnett said in court that she would ultimately decide his sentence.\nGarnett explained to Mangione that the recommendation was not binding and that the maximum sentence was life in prison along with financial penalties. There is no parole in the federal system.\nMangione's guilty plea could now throw a wrench into his New York state case.\nWith the trial scheduled to begin in September, he faces eight state charges including second degree murder, possession of a forged instrument (for alleged fake driver's licence) and six counts of criminal possession of a weapon.\nOn the steps of the court on Friday, his lawyers argued that because he had already pleaded guilty to federal charges, the state case ran afoul of double jeopardy – a constitutional protection that prevents an individual from being prosecuted twice for the same crime.\n\"New York law does not permit a person to be prosecuted and punished twice for the exact same crime,\" his lawyer Karen Friedman Agnifilo said.\nShe also said that, in making a guilty plea in federal court, Mangione has accepted \"full responsibility\" for the death of Brian Thompson.\nBut the Manhattan District Attorney's office says it is prepared to go ahead with the state prosecution.\n\"We are encouraged that Mr Thompson's family received a measure of accountability today,\" the statement said.\n\"While federal sentencing is pending, we are prepared to litigate the defence motions. The Manhattan DA's Office remains committed to seeking justice for Mr Thompson and his family.\"\nRelated topics\n- Published8 hours ago",
    "bodyJa": "マンジョーネ氏、ヘルスケアCEO殺害を認め、連邦容疑で有罪を認める\n- 公開されました\nルイージ・マンジョーネ氏は、ユナイテッドヘルスケアCEOのブライアン・トンプソン氏を殺害したことを認め、州間ストーカー致死事件の連邦容疑で有罪を認めた。\n金曜日、マンハッタンの連邦裁判所で28歳の彼は「私がマンハッタンでトンプソン氏を撃って死亡した」と認めた。\n2人の子供の父親である50歳のトンプソンさんは、2024年12月4日にマンハッタンのミッドタウンのホテルに入ったところを後ろから撃たれた。司法審問の後、彼の家族は声明を発表し、これは「ブライアンと私たちの家族にとって正義への重要な一歩」であると述べた。\nマンジョーネ氏には最高で終身刑が言い渡される可能性がある。同氏は国家告訴にも直面しているが、弁護士らは有罪答弁を受けてこれらの告発を却下するよう求めている。\nマンジョーネ氏は当初、トンプソン射殺事件を巡る連邦訴訟と州訴訟の両方で無罪を主張していた。\n同氏の弁護士は、金曜日の連邦裁判所公聴会で同氏に対する2件の連邦告訴について有罪を認めるつもりであると発表した。\nベージュの囚人服を着たマンジョーネ氏は公聴会中、終始厳粛かつ真剣な表情を浮かべていた。\n法廷で陳述書を読み上げた同氏は、事前に攻撃を計画し、殺害の目的で州境を越え、3Dプリンターで印刷しサイレンサーと弾倉を取り付けた銃を使用したことを認めた。\n同被告は法廷で、「腰痛によるひどい痛みに何年も耐えた後」、医療制度での経験が原因でトンプソンさんを殺害する衝動に駆られたと述べた。\nマンジョーネ氏は、ユナイテッドヘルスケアが2024年12月にマンハッタンで年次投資家会議を開催することを知ったと述べた。\nその後、イベントのためにニューヨークに旅行したと彼は法廷で語った。\n同氏はカンファレンス開催前に「投資家を装って」ユナイテッドヘルスケアに電子メールを送り、イベントに関する質問をしたとも述べた。\nマンジョーネ氏は声明で「ブライアン・トンプソン氏を射殺するつもりでユナイテッドヘルスケアにメールを送った」と述べた。 「2024年12月4日の朝、私はマンハッタンでトンプソン氏の背中を撃った。」\n連邦罪に対する判決は12月18日に予定されている。\nトンプソンさんの家族は声明で、マンジョーネさんが逮捕されたニューヨーク州とペンシルベニア州の両方で正義を求め続けると述べた。\n「彼を失った悲しみを和らげるものは何もないが、連邦司法制度がこの凶悪な行為の責任者を責めてくれたことに感謝している」と彼らは述べた。\n「我々は現在、この犯罪の重大さを反映した量刑が下されるよう法廷に期待している。」\n検察はマンジョーネ氏に２４年から３０年の懲役を勧告した。しかし、マーガレット・ガーネット判事は法廷で、最終的には自分が判決を下すだろうと述べた。\nガーネット氏はマンジョーネ氏に対し、この勧告には拘束力はなく、最高刑は終身刑と金銭的罰金であると説明した。連邦制度には仮釈放はありません。\nマンジョーネ氏の有罪答弁は、ニューヨーク州の訴訟に大きな影響を与える可能性がある。\n裁判は9月に始まる予定で、同氏は第2級殺人、偽造器具所持（偽造運転免許証の疑い）、武器所持の6件を含む8件の州罪に直面している。\n金曜日の法廷で、弁護士らは、同氏がすでに連邦政府の告訴に対して有罪を認めているため、この州の訴訟は二重の危険、つまり同一の罪で個人が二度訴追されることを防ぐ憲法上の保護に抵触していると主張した。\n同氏の弁護士カレン・フリードマン・アグニフィロ氏は、「ニューヨーク州の法律では、まったく同じ犯罪で人を二度起訴し、処罰することは認められていない」と述べた。\nまた、マンジョーネ氏は連邦裁判所で有罪を認め、ブライアン・トンプソン氏の死に対する「全責任」を認めたと述べた。\nしかしマンハッタン地方検事局は州訴追を進める用意があると述べている。\n「トンプソン氏の家族が本日一定の説明責任を負ったことを心強く思う」と声明で述べた。\n「連邦刑の判決は係争中であるが、我々は弁護申し立てを訴訟する用意がある。マンハッタン検察局はトンプソン氏とその家族に対する正義の追求に引き続き尽力する。」\n関連トピック\n- 8 時間前に公開",

    "id": "luigi-mangione-pleads-guilty-in-federal-28ce02b1",
    "title": "Luigi Mangione pleads guilty in federal case related to UnitedHealthcare CEO killing",
    "titleJa": "ルイージ・マンジョーネ氏、ユナイテッドヘルスケアCEO殺害に関する連邦訴訟で有罪を認める",
    "summaryJa": "マンジョーネ氏の弁護士らは、マンジョーネ氏の連邦申し立てにより、ニューヨーク州二重危険法によりブライアン・トンプソン氏殺害の州裁判所での殺人罪での起訴が妨げられると主張している。",
    "bodyOriginal": "Luigi Mangione pleaded guilty Friday in New York federal court to stalking UnitedHealthcare CEO Brian Thompson before fatally shooting him on a midtown Manhattan street in December 2024.\nMangione's lawyers immediately afterward filed a motion in New York state court saying that charges of murder and multiple firearms counts against the Ivy League graduate in that court for Thompson's slaying should be tossed out under the state's double jeopardy law because of his federal plea.\nMangione, 28, said Friday in Manhattan U.S. District Court that he traveled to New York with the intention of killing Thompson after reaching out to UnitedHealthcare and pretending to be an investor ahead of a company conference at a Manhattan hotel.\n\"I shot Mr. Thompson in Manhattan, and he died,\" Mangione said, according to MS NOW. \"I knew what I was doing was illegal.\"\nThompson's company, which is a division of UnitedHealth Group, is the largest health insurer in the United States. Thompson was gunned down on the sidewalk outside the Hilton hotel on Dec. 4, 2024.\nMangione, a 2020 graduate of the University of Pennsylvania, was apprehended by local police five days later in a McDonald's in Altoona, Pennsylvania, after someone recognized him from a surveillance photo.\nMangione, who told District Court Judge Margaret Garnett that he was motivated after suffering years of pain from a broken back, faces a maximum possible sentence of life in prison. Sentencing is scheduled for Dec. 18.\nManhattan U.S. Attorney Jamie McDonald said he will seek a sentence of life for the charges of interstate stalking resulting in Thompson's death, and use of electronic communications to stalk the 50-year-old CEO.\nMcDonald and Amanda Houle, chief of the office's criminal division, were sitting in the front row of court next to Thompson's widow and family during Friday's plea hearing, MS NOW reported. UnitedHealthcare executives sat in the row behind them.\n\"Today's guilty plea marks an important step toward justice for Brian and for our family,\" Thompson's family said in a statement. \"While nothing will ease the pain of losing him, we are grateful that the federal justice system has held the person responsible for this heinous act accountable.\"\n\"Now we look to the court to ensure that sentencing reflects the severity of this crime,\" the family said. \"We remain mindful that additional proceedings in New York and Pennsylvania are still to come, and we will continue to seek the justice Brian deserves.\"\nMangione's plea came weeks before jury selection is scheduled to start for his Manhattan Supreme Court trial on a charge of murdering Thompson.\nIt is not clear if that trial will begin on Sept. 8 given defense attorneys' new motion asking a judge to toss the state charges because of Friday's plea in federal court.\nUnder New York's double jeopardy law, a person cannot be separately prosecuted for offenses based upon the same criminal act, a state appeals court has held.\n\"Despite this being a single isolated event, Mr. Mangione has been unfairly treated since the outset in every way,\" his lawyer, Karen Friedman Agnifilo, told reporters after the plea hearing.\n\"He's been treated differently from every other defendant charged with this offense in New York,\" Friedman Agnifilo said.\n\"As Luigi explained in court today, he endured years of severe, debilitating pain following a broken back while struggling to navigate our healthcare and health insurance systems,\" she said. \"Like the thousands of people who have reached out since this tragedy to share their own experiences, he believed that system had failed him and destroyed his life.\"\nA spokeswoman for Manhattan District Attorney Alvin Bragg, whose office is prosecuting Mangione in state court, said in a statement the office would fight the effort to dismiss the case.\n\"Since December 2024, the Manhattan D.A.'s Office has been tirelessly preparing to pursue a trial conviction in New York State Supreme Court for the alleged cold-blooded murder of Brian Thompson,\" the spokeswoman said.\n\"We are encouraged that Mr. Thompson's family received a measure of accountability today. While federal sentencing is pending, we are prepared to litigate the defense motions,\" the spokeswoman said. \"The Manhattan D.A.'s Office remains committed to seeking justice for Mr. Thompson and his family.\"\nUnitedHealth Group, in a statement after the plea hearing, said, \"Brian Thompson's life was cut short by an act of violence that devastated everyone who knew and loved him.\"\n\"We are grateful to law enforcement for bringing Brian's murderer to justice, and our thoughts remain with Brian's family and loved ones during this difficult time,\" the company said.",
    "bodyJa": "ルイージ・マンジョーネ氏は金曜日、ニューヨーク連邦裁判所で、ユナイテッドヘルスケアCEOのブライアン・トンプソン氏をストーカー行為し、2024年12月にマンハッタンのミッドタウンの通りで同氏を射殺したとして有罪を認めた。\nその直後、マンジョーネ氏の弁護士らはニューヨーク州裁判所に申し立てを行い、トンプソン氏殺害に関して同法廷で提起されているアイビーリーグ卒業生のマンジョーネ氏に対する殺人と複数の銃器の罪は、連邦政府の嘆願を理由に州の二重危険法に基づき破棄されるべきであるとの申し立てを行った。\n28歳のマンジョーネ被告は金曜日、マンハッタン連邦地方裁判所で、マンハッタンのホテルでの社内会議を前にユナイテッドヘルスケアに連絡を取り、投資家のふりをした後、トンプソンさんを殺害する目的でニューヨークに旅行したと述べた。\nMS NOWによると、マンジョーネ氏は「マンハッタンでトンプソン氏を射殺し、彼は死亡した」と語った。 「自分のやっていることは違法であることは分かっていました。」\nトンプソン氏の会社はユナイテッドヘルス・グループの一部門で、米国最大の医療保険会社である。トンプソンさんは2024年12月4日にヒルトンホテルの外の歩道で銃撃された。\nペンシルベニア大学を2020年に卒業したマンジョーネ氏は、5日後にペンシルベニア州アルトゥーナのマクドナルドで、何者かが監視写真からマンジョーネ氏を認識したとして地元警察に逮捕された。\nマンジョーネ被告は地方裁判所のマーガレット・ガーネット判事に対し、腰の骨折による長年の痛みに苦しんだ後に動機を与えたと語ったが、最高で終身刑が言い渡される可能性がある。判決は12月18日に予定されている。\nマンハッタンのジェイミー・マクドナルド連邦検事は、トンプソン氏を死亡させた州間ストーカー行為と、50歳のCEOをストーカーするために電子通信を使用した罪で終身刑を求刑すると述べた。\nMS NOWの報道によると、マクドナルド氏と同局刑事部門の責任者アマンダ・ホール氏は金曜日の司法弁論中、法廷の最前列でトンプソン氏の未亡人と家族の隣に座っていた。ユナイテッドヘルスケアの幹部らは彼らの後ろの列に座っていた。\nトンプソンさんの遺族は声明で「今日の有罪答弁は、ブライアンと私たち家族にとって、正義への重要な一歩となる」と述べた。 「彼を失った悲しみを和らげるものは何もありませんが、連邦司法制度がこの凶悪な行為の責任者を責めてくれたことに感謝しています。」\n遺族は「現在、私たちは判決がこの犯罪の重大さを反映しているかどうか裁判所に期待している」と述べた。 「我々はニューヨークとペンシルベニアでの追加訴訟が今後も続くことを念頭に置き、ブライアンにふさわしい正義を求め続けていく」と述べた。\nマンジョーネ氏の嘆願は、トンプソン氏殺害の容疑でマンハッタン最高裁判所で行われる裁判の陪審員選びが始まる数週間前に行われた。\n金曜日の連邦裁判所での嘆願を理由に裁判官に州罪を破棄するよう求める弁護人の新たな申し立てを考慮すると、その裁判が9月8日に始まるかどうかは不明である。\nニューヨーク州の二重危険法の下では、同じ犯罪行為に基づく犯罪で人を別々に訴追することはできないと州控訴裁判所が判断した。\n弁護人のカレン・フリードマン・アグニフィロ氏は、弁護団後、「これは単独の出来事であるにもかかわらず、マンジョーネ氏は最初からあらゆる面で不当な扱いを受けてきた」と記者団に語った。\nフリードマン・アグニフィロ氏は、「彼はニューヨークでこの罪で起訴された他のすべての被告とは異なる扱いを受けてきた」と語った。\n「ルイージさんが今日法廷で説明したように、彼は腰痛を患い、医療制度や健康保険制度をうまく使いこなすのに苦労しながら、何年も重度の衰弱性の痛みに耐えてきた」と彼女は述べた。 「この悲劇以来、自分の経験を分かち合うために手を差し伸べた何千人もの人々と同じように、彼はシステムが自分を失望させ、自分の人生を破壊したと信じていました。」\n州裁判所でマンジョーネ氏を訴追しているマンハッタン地方検事アルビン・ブラッグ氏の広報担当者は声明で、同局は訴訟の却下に向けた取り組みと戦うと述べた。\n「2024年12月以来、マンハッタン検察局は、ブライアン・トンプソン氏の冷酷な殺人容疑について、ニューヨーク州最高裁判所で有罪判決を得るべく精力的に準備を進めてきた」と広報担当者は述べた。\n「トンプソン氏の家族が本日、一定の説明責任を負ったことを心強く思っている。連邦判決は保留中だが、弁護動議を訴訟する用意がある」と広報担当者は述べた。 「マンハッタン検察局は、トンプソン氏とその家族に対する正義の追求に引き続き尽力する。」\nユナイテッドヘルス・グループは司法審問後の声明で、「ブライアン・トンプソンさんの命は暴力行為によって短くされ、彼を知り愛していたすべての人に衝撃を与えた」と述べた。\n同社は「ブライアンを殺害した犯人に裁判を起こしてくれた法執行機関に感謝しており、この困難な時期にブライアンの家族や愛する人たちに思いを馳せ続ける」と述べた。",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
