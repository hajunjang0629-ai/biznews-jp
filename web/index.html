    "id": "trump-to-be-sued-by-ms-now-cnn-politico-3790439f",
    "title": "Trump to be sued by MS NOW, CNN, Politico to reverse White House ban",
    "titleJa": "Trump to be sued by MS NOW, CNN, Politico to reverse White House ban",
    "summaryJa": "President Trump cited what he called \"cumulative stories\" by the three media outlets for his ban of them, saying, \"You get sick of it.\"",
    "bodyOriginal": "MS NOW, CNN and Politico are set to sue President Donald Trump on Monday morning and to ask a federal judge to reverse his total ban on those three media outlets from the White House.\nJournalists from the outlets were prevented from entering the White House on Saturday, a day after Trump announced he would bar them from working there.\n\"This ban could not be a more direct assault on the First Amendment nor a more blatant violation of our most fundamental constitutional principles,\" the lawsuit says, arguing that the ban has already \"severely impeded the ability of\" the three outlets to cover Trump and his administration.\n\"Presidents from the earliest days of the Republic have disagreed with and complained about the tenor and content of press coverage of their administrations,\" the civil complaint, set to be filed in U.S. District Court in Washington, notes.\nBut \"the Constitution protects the liberty and property interests that news organizations and White House reporters have in their press credentials and the access those credentials afford them to cover the White House for the benefit of the public,\" the suit says. \"No official can deprive Plaintiffs of those interests on a whim — with no notice, no process, and no warning — as the President did here.\"\nTrump, in announcing the ban in a Truth Social post Friday, accused the outlets of writing fiction and lies about him, and warned, \"Other Fake News Media Outlets to follow.\" The president cited what he called \"cumulative stories\" by the three news organizations, adding, \"You get sick of it.\"\nOn Monday morning, after the lawsuit was announced, Trump in a Truth Social post said, \"The White House is not instituting an assault on the Free Press, something which I cherish.\"\n\"It is instituting an assault on the FAKE NEWS, something that has grown like Cancer in our beloved United States of America,\" Trump wrote. \"It is corrupt, purposeful, pervasive, fully coordinated, and totally out of control.\"\n\"It is a threat to our National Security, and must be stopped, NOW!\" he said. Trump had not previously cited national security in justifying the ban.\nThe suit alleges the ban violates the Due Process Clause of the U.S. Constitution by failing to give the outlets advance notice and an opportunity to challenge it, without establishing clear standards for Trump's decision.\nThe complaint also says the ban violates the Constitution's First Amendment by retaliating \"against protected newsgathering and speech.\"\nAnd it says the ban violates the First Amendment for a separate reason: it bars the three media outlets \"from a nonpublic forum for unlawful reasons.\" Those reasons include so-called viewpoint discrimination, or targeting the outlets for their perceived \"motivating ideology or the opinion or perspective.\"\nIn a joint statement on Monday, the three outlets said, \"This morning, we notified the government that we are filing a lawsuit today to protect our First Amendment rights and defend the principle that the government does not decide what the press reports or publishes.\"\nWithout notice or process, the White House revoked our journalists' credentials because it objected to our reporting,\" the statement said. \"Left unchallenged, this threatens press freedom and the public's right to independent journalism free from government interference.\"\nThe White House and the Department of Justice did not immediately respond to a request for comment from CNBC about the lawsuit.\nThe three outlets will file a joint motion asking a judge to issue a temporary restraining order barring Trump and other defendants from taking further action to enforce the ban and requiring them to immediately restore so-called hard pass press credentials to the plaintiffs, which give their reporters access to the White House.\nIn addition to Trump, the defendants are his assistant for communications, Steven Cheung, White House Chief of Staff Susan Wiles, and Sean Curran, director of the U.S. Secret Service.\nThe named plaintiffs are the three outlets and three White House reporters: Akayla Gardner of MS NOW; Betsy Klein of CNN; and Politico's Cheyenne Haslett. All three journalists were denied entry to the White House on Saturday and had their hard passes taken away by a Secret Service officer there, the suit says.\nOn Sunday night, the White House removed CNN from its scheduled rotation as the pool network for the White House travel pool. The pool is set to travel Monday with Trump for his visit to New York for the United Nations General Assembly.\nThe lawsuit cites the White House's removal of CNN from Monday's pool schedule as an example of the ban \"causing irreparable harm to\" the outlets.\nThe suit is being filed in the same court where The Associated Press has a pending lawsuit against the White House for a ban on that wire service's journalists working in certain restricted spaces in the White House, including the Oval Office and on Air Force One. The White House's partial ban on the AP came in February 2025 after the wire service refused to reflect Trump's renaming of the Gulf of Mexico to the Gulf of America in how it routinely refers to that international body of water.\nTrump told reporters on Friday that the latest ban is worth implementing, even if it is overturned by a judge.\n\"I think it's good to point it out, whether it survives or doesn't,\" he said.\nThe Knight First Amendment Institute at Columbia University, in a statement after Trump's announcement, suggested he would lose a legal challenge to the ban because of the U.S. Constitution's First Amendment protections for the media.\n\"The First Amendment prohibits the president from punishing journalists because he doesn't like their coverage, just as it prohibits him from punishing universities because he doesn't like the courses they offer, or from punishing law firms because he doesn't like the clients they represent,\" said Jameel Jaffer, executive director of the institute.\n\"With so many courts having ruled against him on exactly this point, you'd think President Trump would have learned this lesson by now,\" Jaffer said.\nMS NOW, in a statement Saturday, had said, \"The White House belongs to the American people and the decisions made inside are funded by our tax dollars.\"\n\"MS NOW intends to take any and all steps necessary to defend our First Amendment rights and the essential role of independent journalism in our democracy,\" the network said. MS NOW also vowed to \"continue to report on the President, the administration, and the issues that impact the American people.\"\nCNN and Politico issued similar statements, which referred to their constitutional right to report news without government interference.\nWhite House Correspondents' Association President Jacqui Heinrich, in a statement Saturday, said, \"The American people, through a free and independent press, must be able to scrutinize those elected to power, regardless of whether government officials view it favorably.\"\n\"That's why courts have repeatedly held that once the White House provides access to journalists, it cannot deny that access arbitrarily or based on the content of their reporting,\" Heinrich, a Fox News correspondent, said.\nIn the AP's lawsuit, Judge Trevor McFadden ruled in April 2025 that Trump's partial ban of the agency's journalists violated the First Amendment and ordered that the AP be given the same access as other members of the presidential press pool to the Oval Office, other restricted areas of the White House and Air Force One.\n\"The Court simply holds that under the First Amendment, if the Government opens its doors to some journalists — be it to the Oval Office, the East Room, or elsewhere — it cannot then shut those doors to other journalists because of their viewpoints,\" wrote McFadden, who was appointed to the federal bench by Trump.\n\"The Constitution requires no less,\" the judge said.\nRather than allowing The Associated Press access to places the White House press pool goes to cover the president, the White House said it would abolish the so-called wire pool, which included the AP, Bloomberg and Reuters. The wire pool for decades had traveled with presidents to bring news coverage to news consumers around the world. It has not been reinstated.\nA three-judge panel of the U.S. Court of Appeals for the District of Columbia Circuit, in a 2-1 vote in June 2025, blocked McFadden's ruling from taking effect while Trump appealed it.\nThe panel heard oral arguments in the appeal in November, but has not issued a decision.\nDisclosure: CNBC and MS NOW are divisions of Versant Media.",

ng The Associated Press access to places the White House press pool goes to cover the president, the White House said it would abolish the so-called wire pool, which included the AP, Bloomberg and Reuters. The wire pool for decades had traveled with presidents to bring news coverage to news consumers around the world. It has not been reinstated.\nA three-judge panel of the U.S. Court of Appeals for the District of Columbia Circuit, in a 2-1 vote in June 2025, blocked McFadden's ruling from taking effect while Trump appealed it.\nThe panel heard oral arguments in the appeal in November, but has not issued a decision.\nDisclosure: CNBC and MS NOW are divisions of Versant Media.",

    "id": "bitcoin-hits-highest-level-since-january-5c6c3621",
    "title": "Bitcoin hits highest level since January at $85,000, as the market debates whether the 'crypto winter' is over",
    "titleJa": "Bitcoin hits highest level since January at $85,000, as the market debates whether the 'crypto winter' is over",
    "summaryJa": "Bitcoin rose above $85,000 on Monday as the cryptocurrency continued its sharp rally over the past few days.Bitcoin was trading at $84,256 at around 06:35 a.m. ET, up around 3.8%, according to CoinMetrics. Earlier in the day, the cryptocurrency rose as high as $85,229, its highest level since late January.",
    "bodyOriginal": "Bitcoin rose above $85,000 on Monday as the cryptocurrency continued its sharp rally over the past few days.\nBitcoin was trading at $84,256 at around 06:35 a.m. ET, up around 3.8%, according to CoinMetrics. Earlier in the day, the cryptocurrency rose as high as $85,229, its highest level since late January.\nInvestors are assessing whether the \"crypto winter\" — a depressed period of digital asset prices — which began after bitcoin hit an all-time high of over $126,000 in October 2025, is over.\n\"I do think it's over, it's crypto spring, the crocuses are blooming,\" Matt Hougan, CIO at Bitwise, told CNBC's \"Squawk Box Europe\" on Monday.\n\"I think this will actually be the strongest and longest-running bull market in crypto's history.\"\nWhile bitcoin is still down this year, it has risen more than 7% in the last 5 days and nearly 35% over the last 3 months. It is still well off its record high.\nHougan said even though the market was down for a while, the \"fundamentals went up\" in cryptocurrency, pointing to more transactions across blockchains and involvement from major firms like BlackRock.\n\"So I think we had this unusual situation where you had a cyclical decline in prices even as you had a secular improvement in fundamentals. And now I suspect that prices are going to catch up toward the end of the year,\" Hougan said.\n\"I don't think if I came back next year, we'd still be below those all-time highs.\"\nAnalysts at BTIG said in a note on Sunday that, as long as the $75,000 level of bitcoin holds, \"bulls can target a push through 82k on the way to\" $90,000.\nCrypto-related stocks, including Strategy and Coinbase, were higher in U.S. premarket trading on Monday.\nAI rotation?\nThe rally comes even as the U.S. Senate last week blocked the Clarity Act from advancing. It would have set up a framework for crypto in the U.S. and divided industry oversight between the Securities and Exchange Commission (SEC) and the Commodity Futures Trading Commission (CFTC).\nMore regulation in the U.S., such as the Genius Act that was passed last year, has supported crypto prices. But the Clarity Act failing to pass could still boost prices, as the SEC and CFTC will set the rules for now, Hougan said.\n\"It's the most pro-crypto SEC in the history of the U.S.; it's the most pro-crypto CFTC in the history of the U.S. So ironically, in the absence of Clarity passing, we may actually have stronger pro-crypto regulation,\" Hougan said.\nThe Bitwise CIO also said that investors are rotating out of AI stocks back into crypto.\nHe added that the AI boom had \"sucked all the oxygen out of the room. Any investor who was a momentum-driven investor was focused on that. Now that that has sort of levelled off, you're seeing that money rotate back into crypto.\"\n- CNBC's Tanaya Macheel and Garrett Downs contributed to this report.",

    "summaryJa": "Nissan has two production shifts at its assembly plant in Smyrna, Tennessee, and adding another could mean hundreds, if not thousands, of new jobs.",
    "bodyOriginal": "Nissan Motor is looking to increase its U.S. production as it launches the 2027 Rogue crossover, including with a new hybrid model that the company views as a crucial offering for American consumers.\n\"We're now maxing out the production capacity in the U.S.,\" Christian Meunier, chairman of Nissan Americas, told CNBC. \"The next step is going to be three shifts, and I'm pretty optimistic that with the launch of the new Rogue that is happening in the next couple months, we'll be able to do that pretty quickly with the launch of the hybrid.\"\nThe Japanese automaker currently produces the Rogue alongside other Nissan and Infiniti crossovers at a 6 million-square-foot assembly plant on two production shifts in Smyrna, Tennessee. It also has another large manufacturing plant producing the Nissan Altima sedan and Frontier midsize pickup truck in Canton, Mississippi.\nAdditional production at assembly plants typically means hundreds, if not thousands, of new jobs. Nissan's moves come as the Trump administration has been focused on increasing employment and domestic production in the U.S. auto industry.\nU.S. manufacturing of the hybrid is expected to start next year after the spring production launch of the 2027 Rogue with a traditional gas engine at the Tennessee plant.\nIn the meantime, Meunier said Nissan plans to import the vehicles from Japan as a way to get them to market more quickly to lift sales and help with an ongoing global turnaround plan for the company.\nMeunier said if Nissan can add a third shift to each of its assembly plants, it would boost the automaker's U.S. production to roughly 1 million units annually, up from nearly 487,000 in 2025.\nNissan has a target to produce 80% of the vehicles it sells in the U.S. domestically by 2030, but the company has no plans for a new plant as of now.\n\"I think we're very well equipped to succeed without major investment and a new factory and everything else. Maybe after 2030,\" he said. \"Over the next four or five years, we'll see.\"\nNissan e-Power\nNissan on Monday officially revealed the 2027 Rogue with its new \"e-Power\" technology for the U.S., which is the first hybrid of its kind for the American market.\nThe \"e-Power\" system is called a series hybrid.\nIt uses the engine as a generator to power the vehicle's electric motors that then propel the vehicle. It operates like emerging extended-range electric vehicles, or EREVs, but has a smaller battery and doesn't require a plug. It also does not use the engine to power the wheels, just electric motors.\nMeunier said the Rogue hybrid and resurrecting the Xterra off-road SUV were his top vehicle priorities when he rejoined Nissan in January 2025 after four and a half years with Jeep. That included pulling ahead the Rogue hybrid twice for the U.S.\nThe Rogue is a sales leader for the company in the U.S. It competes in the highly competitive small crossover segment against the Toyota RAV4 and Honda CR-V, which have the best-selling hybrid options in that category.\n\"The hybrid power that we're launching on Rogue is going to really be the boost to our performance,\" Meunier said. \"It's been quite remarkable to be able to grow without having a hybrid in the U.S. because the hybrids are obviously becoming more and more popular.\"\nMeunier said Nissan plans to position the Rogue e-Power squarely against the Toyota RAV4. He said that may include an unconventional sales option to allow potential customers to test drive both vehicles at Nissan dealerships, which wouldn't typically have a Toyota available.\nThe focus on the Rogue hybrid comes after Nissan and other automakers lost billions of dollars on all-electric vehicles amid a pullback in regulatory support as well as lackluster consumer demand.\nNissan has said the e-Power is a better solution than EVs or even traditional hybrids for U.S. consumers, especially amid inflated fuel prices due to the Iran war.\n\"It's going to make people look at Nissan with different eyes,\" Meunier said. \"A lot of customers that didn't even consider us until the hybrid comes to market.\"\nNissan turnaround\nNissan's renewed focus on the U.S. comes amid a global turnaround plan.\nUnder the strategy, the Japanese automaker intends to streamline its automobile lineup by getting rid of low-performing models and increasing its use of technologies such as artificial intelligence.\nThe plan includes the company targeting 1 million vehicle sales for its Nissan brand in both the U.S. and China by the 2030 financial year and growing its annual sales volume in Japan to 550,000 cars by that time.\nFor the U.S., Meunier said he is satisfied with the progress Nissan has made since he returned to the automaker last year.\nAfter several years of struggling sales, Nissan's U.S. sales through the first half of the year were up roughly 10% compared with Cox Automotive reporting a roughly 3% decline for the broader industry during that time.\n\"I think the next few months are going to be pretty good. Pretty tough, but pretty good,\" Meunier said. \"We're going to have a strong close of the calendar year in December.\"",

    "id": "novo-shares-slide-as-drugmaker-lays-out-c3d35f76",
    "title": "Novo shares slide as drugmaker lays out post-Wegovy growth strategy",
    "titleJa": "Novo shares slide as drugmaker lays out post-Wegovy growth strategy",
    "summaryJa": "The Danish company seeks to convince investors it can compete in an increasingly crowded field it helped pioneer.",
    "bodyOriginal": "Novo shares plummeted on Monday after the company's new long-term goals failed to ease investor concerns about its ability to compete in the increasingly crowded weight loss market it helped pioneer.\nThe Danish drugmaker said it aims to launch more than five drugs with \"multi-blockbuster\" potential by 2030 and generate more than 150 billion Danish kroner ($23 billion) in risk-adjusted pipeline sales by 2035, including current assets.\nIt also expects revenue growth between 2026 and 2030 to be in line with industry peers, without giving further details.\nCopenhagen-listed shares fell as much as 7% but later pared some losses to trade 5.4% lower at 12:30 pm local time.\n\"Investors hoped for a project 'miracle' that could turn the momentum around short term,\" Per Hansen, savings economist at Nordnet, told CNBC. \"For obvious reasons that miracle does not exist.\"\n'The elephant in the room'\nCEO Mike Doustdar told investors at the company's Capital Markets Day in London that the \"elephant in the room\" was that semaglutide, the active ingredient in weight-loss and diabetes medicines Wegovy and Ozempic, will lose key patent exclusivity starting early next decade. The semaglutide patent expires in 2032 in the U.S., a market that accounted for more than half of Novo's overall sales last year.\nThis loss of exclusivity \"is what's on most people's mind, and rightfully so,\" Doustdar said.\n\"We created an incredibly attractive market, and now almost every other single pharma company, big or small, is trying to come and compete with us. We need to be ready for that,\" he added.\nDoustdar also laid out plans to diversify the company, adding that the company did not \"belittle\" the loss of exclusivity \"or the challenges that comes with it, related to the price pressure.\"\n\"We plan to come on the other side of the LOE as a bigger company than we are today and a much more diversified version of it,\" he said.\nAhead of the opening bell on Monday, Novo shares had fallen 27% over the past 12 months, while its chief rival Eli Lilly shares have gained 52% over the same period.\nLilly has managed to grab a majority market share in the injectable GLP-1 space with Mounjaro and Zepbound, despite launching years after Novo's drugs.\nWhile Novo's launched its Wegovy pill in the U.S. at the beginning of this year to great success, investors are still cautious around the drugmaker's prospects of regaining ground. It has begun to roll out the Wegovy pill in other markets as well, but it still represents a small portion of its total sales.\nA series of clinical setbacks and leadership upheavals over the past year has added to investors' concerns.\nLast week, Novo said it is rebranding from Novo Nordisk to Novo and updating its corporate culture. Doustdar told CNBC the rebrand and culture revamp were \"parts of the same package\" to meet fierce competition from Lilly.\nInvestors wanted more\nEven as Novo indicates stable operating margins, Monday's announcement lacks the financial ambition the market wanted to see, Jacob Pedersen, investment strategist at Danish bank Middelfart Sparekasse, told CNBC.\n\"The investors, they are very particular in what they want from Novo, and this doesn't add up to it,\" Pedersen said, adding that Novo's target for growth in line with a broad group of pharma peers suggests slower growth than investors have historically come to expect from the company.\nIn August, Novo said it expects adjusted sales and operating profit to both be down 6% to flat in 2026, at constant exchange rates.\nAnalysts and investors have had mixed views on whether Novo should broaden its portfolio significantly, or focus on its existing therapy areas.\n\"It hasn't been long since the company wanted to focus more, and now they want to broaden out,\" Pedersen said.\nThe push to diversify marks a shift in the strategy Doustdar laid out after taking over as CEO last year, when Novo sharpened its focus on its core obesity and diabetes businesses and moved away from expanding into new areas.\nNovo said Monday it is now moving beyond its core areas of obesity and diabetes. Doustdar said those remain Novo's foundation, but that the company now wants to build out its portfolio around blood and endocrine disorders, liver disease, and cardiovascular disease.\nHe also said Novo will be more active in business development, which was not included in the 2030 sales target.\n- CNBC's Charlotte Reed and Mike Considine contributed to this report.",
    "bodyJa": "Novo shares plummeted on Monday after the company's new long-term goals failed to ease investor concerns about its ability to compete in the increasingly crowded weight loss market it helped pioneer.\nThe Danish drugmaker said it aims to launch more than five drugs with \"multi-blockbuster\" potential by 2030 and generate more than 150 billion Danish kroner ($23 billion) in risk-adjusted pipeline sales by 2035, including current assets.\nIt also expects revenue growth between 2026 and 2030 to be in line with industry peers, without giving further details.\nCopenhagen-listed shares fell as much as 7% but later pared some losses to trade 5.4% lower at 12:30 pm local time.\n\"Investors hoped for a project 'miracle' that could turn the momentum around short term,\" Per Hansen, savings economist at Nordnet, told CNBC. \"For obvious reasons that miracle does not exist.\"\n'The elephant in the room'\nCEO Mike Doustdar told investors at the company's Capital Markets Day in London that the \"elephant in the room\" was that semaglutide, the active ingredient in weight-loss and diabetes medicines Wegovy and Ozempic, will lose key patent exclusivity starting early next decade. The semaglutide patent expires in 2032 in the U.S., a market that accounted for more than half of Novo's overall sales last year.\nThis loss of exclusivity \"is what's on most people's mind, and rightfully so,\" Doustdar said.\n\"We created an incredibly attractive market, and now almost every other single pharma company, big or small, is trying to come and compete with us. We need to be ready for that,\" he added.\nDoustdar also laid out plans to diversify the company, adding that the company did not \"belittle\" the loss of exclusivity \"or the challenges that comes with it, related to the price pressure.\"\n\"We plan to come on the other side of the LOE as a bigger company than we are today and a much more diversified version of it,\" he said.\nAhead of the opening bell on Monday, Novo shares had fallen 27% over the past 12 months, while its chief rival Eli Lilly shares have gained 52% over the same period.\nLilly has managed to grab a majority market share in the injectable GLP-1 space with Mounjaro and Zepbound, despite launching years after Novo's drugs.\nWhile Novo's launched its Wegovy pill in the U.S. at the beginning of this year to great success, investors are still cautious around the drugmaker's prospects of regaining ground. It has begun to roll out the Wegovy pill in other markets as well, but it still represents a small portion of its total sales.\nA series of clinical setbacks and leadership upheavals over the past year has added to investors' concerns.\nLast week, Novo said it is rebranding from Novo Nordisk to Novo and updating its corporate culture. Doustdar told CNBC the rebrand and culture revamp were \"parts of the same package\" to meet fierce competition from Lilly.\nInvestors wanted more\nEven as Novo indicates stable operating margins, Monday's announcement lacks the financial ambition the market wanted to see, Jacob Pedersen, investment strategist at Danish bank Middelfart Sparekasse, told CNBC.\n\"The investors, they are very particular in what they want from Novo, and this doesn't add up to it,\" Pedersen said, adding that Novo's target for growth in line with a broad group of pharma peers suggests slower growth than investors have historically come to expect from the company.\nIn August, Novo said it expects adjusted sales and operating profit to both be down 6% to flat in 2026, at constant exchange rates.\nAnalysts and investors have had mixed views on whether Novo should broaden its portfolio significantly, or focus on its existing therapy areas.\n\"It hasn't been long since the company wanted to focus more, and now they want to broaden out,\" Pedersen said.\nThe push to diversify marks a shift in the strategy Doustdar laid out after taking over as CEO last year, when Novo sharpened its focus on its core obesity and diabetes businesses and moved away from expanding into new areas.\nNovo said Monday it is now moving beyond its core areas of obesity and diabetes. Doustdar said those remain Novo's foundation, but that the company now wants to build out its portfolio around blood and endocrine disorders, liver disease, and cardiovascular disease.\nHe also said Novo will be more active in business development, which was not included in the 2030 sales target.\n- CNBC's Charlotte Reed and Mike Considine contributed to this report.",

    "title": "Tories pledge to bring back tax-free shopping for tourists",
    "titleJa": "Tories pledge to bring back tax-free shopping for tourists",
    "summaryJa": "The party says scrapping the scheme in 2021 left the UK less competitive than European destinations.",
    "bodyOriginal": "Tories pledge to bring back tax-free shopping for tourists\n- Published\nThe Conservative Party has pledged to bring back tax-free shopping for tourists from outside the European Union.\nThe Tories said the decision to scrap the scheme in 2021 left the UK less competitive than European destinations.\nLeader Kemi Badenoch, who was a Treasury minister when the tax relief was abolished, said businesses were being \"let down by a tax policy that is chasing their customers away\".\nBut Labour accused the party of \"a spectacular U-turn\".\nThe VAT Retail Export Scheme - which allowed overseas visitors to get a VAT refund on items they had bought in Great Britain and took home in their luggage - was scrapped for non-EU visitors under the previous Conservative government in 2021, while it was also not extended for EU visitors.\nAt the time, Badenoch said it was \"a costly relief which does not benefit the whole of GB equally\".\nHowever, the Conservatives have now set out plans to restore VAT refunds for eligible visitors from outside the EU.\nThe party said that if evidence confirms the scheme \"pays its way\", this would be extended to visitors from the EU by the end of the next Parliament.\nIt said the cost of reintroducing the scheme would be offset by cracking down on \"NHS health tourism\", including more consistent charging of patients ineligible for free treatment, minimum recovery targets for debts and requiring full repayment of debts before visa applications or renewals will be considered.\nThe remaining costs would be funded from a package of savings set out by the Tories last year.\nReinstate VAT-free tourist shopping, businesses say\n- Published7 September 2023\nBring back duty-free perk to boost London - mayor\n- Published2 February 2023\nThe party also argued the move would benefit shops, hotels, restaurants and the wider tourism industry.\nIt pointed to research by the Centre for Economics and Business Research (Cebr), which suggested fully restoring tax-free shopping for tourists could attract up to 2.35 million extra visitors and generate £4.1bn in extra spending.\nThe report from earlier this month also estimated that for every £1 of VAT refunded, this could generate £1.54 in other taxes.\nBadenoch said: \"We have iconic retailers, inventive designers and brilliant manufacturers, but they are being let down by a tax policy that is chasing their customers away.\n\"Holidaymakers are choosing rival cities in other countries for the simple reason that it saves them money.\"\nBusinesses have long called for tax-free shopping for tourists to be reintroduced, arguing they are at a disadvantage to other European countries.\nEU countries offer VAT refunds for non-EU visitors, while other European countries such as Switzerland have similar schemes.\nHelen Dickinson, chief executive at the British Retail Consortium, said: \"Introducing a modern tax-free shopping scheme would help attract more international spending to the UK, supporting high streets, jobs and investment in towns and cities across the country.\n\"Done properly, it would boost economic growth and deliver a net benefit to the Exchequer.\"\nHowever, a Labour spokesperson said: \"Kemi Badenoch used to say tax-free shopping was a costly giveaway and now she's trying to sell it as an economic miracle.\n\"If they really think it's such a great idea, they should explain why they scrapped it in the first place and how they'd pay for bringing it back.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "summaryJa": "Flights are affected again owing to air traffic control problems, so what are your rights if you're affected?",
    "bodyOriginal": "What are my rights if my flight is cancelled or delayed?\n- Published\nFlights in Scotland, Northern Ireland and northern England have been affected by air traffic control issues – the second major disruption at UK airports in a few weeks.\nWhen a flight is cancelled or delayed, passengers affected have various rights, such as a refund or an alternative flight at no extra cost. However, these can vary depending on which carrier you are flying with and from where.\nExtra compensation is payable only when an airline is at fault, which is not the case with air traffic control problems.\nHere's what it means for you.\nWhat do airlines have to offer passengers?\nUnder UK law, airlines have a duty to look after you when flights are delayed or cancelled.\nThe reason for the delay or cancellation does not matter. So anyone affected by the air transport delays will be eligible.\nThat includes providing meals and accommodation, if necessary, and getting you to your destination. The airline should organise putting you on an alternative flight at no extra cost.\nAdditional losses, such as unused accommodation, might require a claim to a credit card provider, if that was the payment option used.\nAfter that, a claim may need to go to your travel insurance provider, but there is no standard definition of what is covered.\nIt may require a close look at the details of the policy to see what is covered and in which circumstances.\nPassengers are also being urged to heed travel advice from the UK government, external, as this can also affect travel insurance rights.\nDoes UK law apply to my flight?\nUK law generally applies to your flight if you are flying from a UK airport on any airline, arriving at a UK airport on an EU or UK airline, or arriving at an airport in the EU on a UK airline.\nIf your flight was coming into the UK on a non-UK or EU airline, then you should check the terms and conditions of your booking.\nIf my flight is cancelled, can I get a refund or another flight?\nIf your flight is covered by UK law, your airline must let you choose between either getting a refund or being booked on to an alternative flight.\nThat's regardless of how far in advance the cancellation was made.\nYou can get your money back for any part of the ticket you have not used.\nSo, if you booked a return flight and the outbound leg is cancelled, you can get the full cost of the return ticket refunded.\nIf you still want to travel, your airline must find you an alternative flight.\nIf another airline is flying to your destination significantly sooner, or there are other suitable modes of transport, then you have a right to be booked on to that alternative transport instead.\nWill the airline pay for food and accommodation?\nIf you are stuck abroad or at the airport because of a flight cancellation, airlines covered by UK legislation must also provide you with other assistance.\nThis includes the following:\na reasonable amount of food and drink (often in the form of vouchers)\na way for you to communicate (often by refunding the cost of calls)\nfree accommodation, if you have to stay overnight to fly the next day\ntransport to and from the accommodation\nIf your airline is unable to arrange assistance, you have the right to organise this yourself and claim back the cost later.\nThe Civil Aviation Authority advises people to keep receipts and not spend more than necessary.\nYou are entitled to the same assistance as for a cancellation if your flight is delayed by more than two hours for a short-haul flight, three hours for a medium-haul, or four hours for a long-haul.\nIf you are delayed by more than five hours and no longer want to travel, you can get a full refund.\nWhat are my rights if I have booked a package holiday?\nIf you booked a package holiday with a company that is an ABTA member and your flight is cancelled, you are entitled to a suitable alternative flight or a full refund.\nCan I claim extra compensation for disruption?\nDisruption caused by \"extraordinary circumstances\" – which includes things like air traffic control issues, bad weather, strikes by airport staff, or conflict – does not entitle you to extra compensation.\nHowever, in other circumstances, when it is considered to be the airline's fault, you have a number of rights, external if your flight is covered under UK law.\nWhat you are entitled to depends on what caused the cancellation and how much notice you are given.\nIf your flight is cancelled with less than two weeks' notice, you may be able to claim compensation based on the timings of the alternative flight you are offered.\nThe amount you are entitled to also depends on how far you were travelling:\nfor flights under 1,500km, such as Glasgow to Amsterdam, you can claim up to £220 per person\nfor flights of 1,500km to 3,500km, such as East Midlands to Marrakesh, you can claim up to £350 per person\nfor flights over 3,500km, such as London to New York, you can claim up to £520 per person\nWhat if flight delays mean I am late for work?\nAirlines will not refund you for loss of earnings. Travel insurance policies will not usually cover loss of earnings either.\nIf you think you're going to be late back at work because of flight delays, you have a responsibility to let your employer know, legal experts say.\nYou should agree with your employer how to deal with the absence – for example, by using annual leave or taking unpaid leave.\nEmployers have no legal obligation to pay employees who are absent in this situation, experts say, unless it is stated in their contract.\nGet in touch\nHave your travel plans been disrupted? Share your experience.",

    "bodyOriginal": "US and China discuss AI safety plan ahead of Trump-Xi summit\n- Published\nTop US and Chinese officials have discussed creating a new \"notification mechanism\" for AI incidents that could affect national security, Treasury Secretary Scott Bessent told reporters on Sunday.\nBessent made the comments after what he called \"successful\" talks with Chinese Vice Premier He Lifeng in New York.\nThe meeting came as US President Donald Trump and his Chinese counterpart Xi Jinping are due to hold a summit in Washington later this week.\nAI has come under intense scrutiny in recent days after researchers warned of the potential risks posed by the technology and some of the industry's most high profile figures called for developers to take a more cautious approach.\n\"We think that, just like with any cross-border activity, that moving from opaque to more transparency between the number one and the number two AI powers in the world is very important,\" Bessent told reporters after the talks.\nHe said the meeting also covered other topics, including plans to \"operationalise\" a process to identify potential tariff cuts on goods called the Board of Trade.\nA truce in the tariffs war between the world's two biggest economies is due to expire on 10 November.\nThe BBC has contacted the Chinese embassy in the US for comment.\nChinese state news agency Xinhua said the two sides had \"candid, in-depth and constructive exchanges on key economic and trade issues\", noting that they had discussed AI.\nBessent said in a post on X on Sunday that the talks \"help lay the groundwork for President Trump to advance America's economic interests and deliver results for the American people.\"\nThe US and China are locked in a race to dominate the AI and technology industries.\nIn recent days Washington has faced calls to slow down the development of AI over fears abouts its potential negative impact on humanity.\nTrump has largely dismissed those concerns, arguing that there are sufficient policies around AI and that the US cannot lose its edge to China.\nHe said earlier this month \"whoever wins in AI, wins.\"\nIn May, when Xi hosted Trump in Beijing, ways to collaborate on AI was one of the issues the two leaders discussed.\nThose talks ended with an agreement that China would buy Boeing jets and US agricultural goods in exchange for lower tariffs.\n- Published5 days ago\n- Published5 days ago",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>

      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});
