  {
    "id": "microsoft-offers-voluntary-buyouts-to-60-3912b107",
    "title": "Microsoft offers voluntary buyouts to 60,000 employees as AI leads to efficiency push",
    "titleJa": "Microsoft offers voluntary buyouts to 60,000 employees as AI leads to efficiency push",
    "summaryJa": "Microsoft is trying to balance a rapid AI infrastructure build-out with capital efficiency.",
    "bodyOriginal": "Microsoft said Monday that it's offering buyouts to a wide swath of employees as it strives to balance a costly artificial intelligence infrastructure build-out with capital efficiency.\nThe software maker announced a new voluntary exit offer for certain workers in the U.S., Canada, India and the United Kingdom at its experience level of 70 or below.\nAround 60,000 people are eligible, according to a person familiar with the matter, who asked not to be named while discussing an internal matter. The effort affects about 27% of Microsoft's total workforce of 223,000 people.\nMicrosoft has been ramping up spending on data centers to accommodate high AI computing demand, supplying cloud services to Anthropic, OpenAI and a slew of other companies. Capital expenditures for the September quarter should exceed $50 billion, Microsoft said in July. In the same quarter a year ago, capital spending and finance leases came to $34.9 billion.\nThat's put a strain on Microsoft's finances. In April, it announced a first-ever voluntary retirement program that around 7% of U.S. employees were eligible for. Then, in July, Microsoft announced plans to lay off 4,800 employees.\n\"The Voluntary Exit Offer reflects an important part of how we're evolving our approach to change: creating greater flexibility and, where possible, more ways for employees to shape their next chapter,\" Amy Coleman, Microsoft's executive vice president and chief people officer, wrote in a memo to employees. \"This builds on what we learned earlier this year through the Voluntary Retirement Program.\"\nMicrosoft is in the midst of a business model transformation, increasingly trying to charge clients based on how much AI they actually use. It has armed programmers, sellers and supply chain workers with AI tools and observed noticeable results. At the same time, the 51-year-old maker of Windows and Office wants to ensure that it has the right talent to go after its most compelling new growth opportunities.\nThe idea is to make the shift without weakening Microsoft's financial profile. In the second quarter, cloud rivals Alphabet and Amazon both reported negative free cash flow, but Microsoft showed $19.64 billion in positive free cash flow for the period, down 23% year over year.\nSome marketing, sales and engineering teams have decided not to participate in the new buyout, the person said. Employees must decide whether to take the offer in early December, and those participating will leave on Dec. 31, the person added.\nMore than 30% of those who could join the voluntary retirement program went ahead with it, Microsoft said in July. But that was open to those at the senior director level and below, while the new initiative goes higher, to the vice president level, said the person briefed on the new plan. The person said Microsoft does not have a target in mind this time around.\nOn Wednesday, Microsoft is scheduled to report third-quarter results.\nWATCH: Amazon, Microsoft earnings key to gauging AI investment returns: CIO",
    "bodyJa": "Microsoft said Monday that it's offering buyouts to a wide swath of employees as it strives to balance a costly artificial intelligence infrastructure build-out with capital efficiency.\nThe software maker announced a new voluntary exit offer for certain workers in the U.S., Canada, India and the United Kingdom at its experience level of 70 or below.\nAround 60,000 people are eligible, according to a person familiar with the matter, who asked not to be named while discussing an internal matter. The effort affects about 27% of Microsoft's total workforce of 223,000 people.\nMicrosoft has been ramping up spending on data centers to accommodate high AI computing demand, supplying cloud services to Anthropic, OpenAI and a slew of other companies. Capital expenditures for the September quarter should exceed $50 billion, Microsoft said in July. In the same quarter a year ago, capital spending and finance leases came to $34.9 billion.\nThat's put a strain on Microsoft's finances. In April, it announced a first-ever voluntary retirement program that around 7% of U.S. employees were eligible for. Then, in July, Microsoft announced plans to lay off 4,800 employees.\n\"The Voluntary Exit Offer reflects an important part of how we're evolving our approach to change: creating greater flexibility and, where possible, more ways for employees to shape their next chapter,\" Amy Coleman, Microsoft's executive vice president and chief people officer, wrote in a memo to employees. \"This builds on what we learned earlier this year through the Voluntary Retirement Program.\"\nMicrosoft is in the midst of a business model transformation, increasingly trying to charge clients based on how much AI they actually use. It has armed programmers, sellers and supply chain workers with AI tools and observed noticeable results. At the same time, the 51-year-old maker of Windows and Office wants to ensure that it has the right talent to go after its most compelling new growth opportunities.\nThe idea is to make the shift without weakening Microsoft's financial profile. In the second quarter, cloud rivals Alphabet and Amazon both reported negative free cash flow, but Microsoft showed $19.64 billion in positive free cash flow for the period, down 23% year over year.\nSome marketing, sales and engineering teams have decided not to participate in the new buyout, the person said. Employees must decide whether to take the offer in early December, and those participating will leave on Dec. 31, the person added.\nMore than 30% of those who could join the voluntary retirement program went ahead with it, Microsoft said in July. But that was open to those at the senior director level and below, while the new initiative goes higher, to the vice president level, said the person briefed on the new plan. The person said Microsoft does not have a target in mind this time around.\nOn Wednesday, Microsoft is scheduled to report third-quarter results.\nWATCH: Amazon, Microsoft earnings key to gauging AI investment returns: CIO",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/10/26/microsoft-msft-voluntary-buyouts.html",
    "publishedAt": "2026-10-26T20:44:50+00:00",
    "category": "テクノロジー",
    "imageUrl": "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&q=80",
    "readTime": 8
  },
  {
    "id": "anthropic-s-blockbuster-share-listing-5-c14c5f2f",
    "title": "Anthropic's blockbuster share listing - 5 surprising things we now know",
    "titleJa": "Anthropic's blockbuster share listing - 5 surprising things we now know",
    "summaryJa": "Anthropic’s IPO prospectus is 355 pages and full of never before disclosed company information.",
    "bodyOriginal": "Anthropic's blockbuster share listing - 5 surprising things we now know\n- Published\nArtificial intelligence (AI) firm Anthropic just released the required paperwork ahead of its long-anticipated debut on the US stock market.\nThe 335-page document included fresh details of how the Claude chatbot owner makes money, what it spends that money on and who it is controlled by.\nAnthropic also detailed some of the the risks it claimed AI technology poses, including how it could take human lives. That information sat alongside the many purported benefits of the technology.\nHere are five key points worth highlighting from the filing.\n1. Armageddon is an occupational hazard\nEvery public company has to tell potential investors how things could go wrong.\nAnthropic's \"risk factors\" were unique, also disclosing how the AI technology it is developing could doom humanity as a whole.\n\"Sufficiently advanced AI systems could, if not developed, deployed, and operated with appropriate safeguards, oversight, and security measures, pose catastrophic or existential risks to humanity,\" Anthropic said.\nIt noted that less than a year ago, a hacking group Anthropic believed to be sponsored by China \"manipulated\" Claude to successfully intrude on a number of institutions, including large technology companies, financial institutions, chemical manufacturing companies and government agencies.\nBut Anthropic said its success is dependent on its ability to constantly \"develop, improve, and deploy the most advanced, capable, and useful AI models\".\nOne of the most significant risks to that ability is Anthropic's access to infrastructure it needs, including computer chips and data centres, to build, train and operate the models that underpin its technology.\n2. The company is haemorrhaging cash\nAnthropic has yet to disclose a target share price for its stock listing.\nThe company is widely expected to debut with a market valuation of $2 trillion or more, making it the largest stock listing in history. But the figure will be heavily influenced by its financial performance.\nAnthropic lost $80.7bn (£60bn) in the first half of this year, double what it lost across 2025 altogether.\nThe company's overall revenue was $16.2bn billion for the six-month period. Revenues are rising rapidly, but the firm has a long way to go before it breaks even.\nTroy Hooper, co-head of equity capital markets at Mergermarket, said Anthropic's revenue growth is \"exceptional\". But investors are \"less forgiving\" of tech companies promising huge future returns than they were even months ago, he added.\nAnthropic's debt picture is also unclear given it has a huge amount of accounting charges related to certain forms of investment.\n\"As a result, investors do not yet have a clear view of Anthropic's underlying profitability or whether its rate of cash generation is sufficient to support the business as it scales,\" Hooper added.\n3. But luckily it has plenty of cash on hand\nDespite losing money, Anthropic has heaps of cash lying about.\nAt $131.6bn, almost all of its cash in hand is defined as \"working capital\", meaning it can use the money to fund its operations day-to-day.\nCurrently, Anthropic has more cash on hand than Meta and Google combined.\nAnthropic's costs could rise as it faces fierce competition for top staff and computing power from other AI giants.\nThe leasing of data centres alone is costing the company $321.4bn so far this year.\nHooper said such large costs are expected to grow. Even with this kind of cash, it won't be enough to maintain its business growth.\nAny investors in Anthropic \"will be paying for future dominance, not present-day economics\", he said.\n4. Anthropic relies on a few big customers\nAnthropic sees boundless ways it can sell its technology to customers.\nA large portion of its current business comes from just 250 major enterprise customers, which it says have paid it at least $10mn in the past year.\nAn even smaller number, just five enterprise customers, make up a quarter of its current business.\nMichael Monaghan, portfolio manager of Founder ETF, pointed out that \"many top Anthropic customers have no long-term contract\".\nThe company's level of business concentration leaves Anthropic dependent on a small fraction of its paying customers to support its growth, with no guarantee it will continue.\nAnthropic also has enterprise relationships with the likes of Google and Amazon, both of which are also investors in the company \"and competitors\", creating potential business conflicts in the future, Monaghan noted.\nAnthropic said its overall enterprise customer base has grown rapidly, going from roughly 1,500 customers last year to almost 12,000 this year.\nPart of its growth strategy is offering Claude tools for free before working to \"convert these users into paying customers over time\".\nThe strategy has led to Claude seeing \"the fastest enterprise adoption of any technology in history\", the company claimed.\n5. AI promises 'extraordinary' benefits to the world\nFor all of the risks Anthropic has said AI poses, it also reiterated its claim AI will produce an \"extraordinary\" amount of good.\n\"Achieving our mission means the world gains the enormous benefits of frontier AI while mitigating the most significant risks,\" the company said.\nThat mission is defined as: \"The responsible development and maintenance of advanced AI for the long-term benefit of humanity.\"\n\"We do not pursue projects based on commercial opportunity or research novelty alone; our efforts must advance our mission. \"\nSuch hypothetical benefits include progress in healthcare, like the development of bespoke treatments for illnesses and improved disease detection, tailored education and legal advice and making more efficient power grids and batteries.\nDecades of scientific progress could be condensed into years, accelerating drug discovery, disease detection, and the delivery of personalized therapy.\nAnthropic said AI could provide individually tailored education and expert financial and legal advice, advance power grids and battery design for greater efficiency and reliability and help the \"developing world\" build more technological capabilities.\n\"Ultimately, we believe frontier AI will help drive global economic growth,\" the company said.",

    "summaryJa": "President Trump forged an extraordinary coalition to win office in 2024. A new CNBC survey shows that coalition is now seriously weakened.",
    "bodyOriginal": "President Donald Trump forged an extraordinary coalition to win office in 2024, stitching together his base with unusual support from some traditional Democratic groups like Hispanics and young people. It was enough to sweep the battleground states and catapult him into office for a second term.\nThe latest CNBC All-America Economic Survey shows that coalition is now seriously weakened.\nSince the beginning of his second term, the president's net approval rating among Latino voters has dropped from -22 to -38, and declined from -28 to -53 among 18- to 34-year olds. Black respondents have moved from -55 to -67.\nAmong all registered voters, his approval has fallen from -7 at the start of his term to -19 in the most recent survey.\nThe decline in the president's approval carries over into the Republican base. Approval from self-described Trump voters has fallen from a net +85 in 2025 to a net of +65. Net approval has even turned negative in the South, from +2 in 2025 to -20 in the latest survey.\nThe results of the latest poll show why Republicans are facing an uphill battle in the midterm elections next week. Trump is not on the ballot — but his presence will be felt.\nRead the full survey results here.\nTo be sure, Republicans in the survey still give the president an 82% approval rating, and those who say they identify with the MAGA movement are at 90%. But interest in the election is 10 points lower among Republicans than it is for Democrats, and in tight races, the party that better turns out its voters will have an advantage.\nThe survey of 1,000 registered voters nationwide found 44% of respondents say their biggest worry if Republicans control Congress is allowing President Trump to operate beyond his constitutional power. By contrast, 28% say their biggest worry for Democratic control is passing policies of Democratic Socialists. For either party's control, registered voters worry that Congress won't do enough to bring down prices.\nThe survey was conducted Oct. 14-18, and was co-led by Democratic pollster Hart Research Associates and Republican pollster Public Opinion Strategies. It carries a margin of error of plus or minus 3.1 percentage points.\nAs a second-term president who had skipped four years between terms, Trump's arc of approval has followed an unusual path. The president left office above water on the economy, with 48% approving and 41% disapproving — high numbers for a president whose last year was overwhelmed by the Covid pandemic.\nBut there was no second-term honeymoon. Trump was immediately underwater in his economic approval rating in the April 2025 CNBC survey. That could have reflected immediate public discontent with the tariff regime and resulting market turmoil. The president's economic approval rating remained negative through most of his first year.\nThe bottom dropped out, however, with the launch of the Iran war. By April 2026, the president's net economic approval rating was plying depths last seen under President Joe Biden amid the aftermath of the pandemic, when the country was facing high inflation and elevated unemployment.\nIn the first quarter of this year, Trump's net economic approval dropped 10 points to -21. It has plunged to -31 in the latest survey. Economic disapproval rose to 65%, the highest for any president CNBC has measured back to President Barack Obama, and one point higher than Biden's worst showing. The survey shows increasing disapproval of Trump's handling of inflation. Over the same time, shooting of Americans by Immigration and Customs Enforcement officers began to dominate headlines, eroding support for one of the president's major policy initiatives.\nThe survey this quarter appeared to pick up growing frustration with a host of issues, from immigration to the economy, among those demographic groups that had supported the president in unusual numbers in 2024, with sharp declines in economic and overall approval among Latinos, young people and those in the $50,000 to $75,000 income group.\nMost ominously for the president, views on the economic outlook fell 22 points for Republicans. Though still net positive, it was the lowest level of economic optimism for Republicans since Biden.\nThese downbeat views on the economy do not automatically translate to votes for Democrats. The survey showed a 7-point preference for Democratic control of Congress, a 3-point gain from the July survey. While Republican economic pessimism grew, so did their preference for a Republican-controlled Congress, from 85% in July to 87% in October.\nBlue-collar workers show how the president has maintained his base amid growing concern about the economy. Their net economic approval of the president has plunged 22 points to -15 from the beginning of Trump's term to now. But their overall presidential approval remains +6, just a four-point drop. They still prefer a Republican-controlled Congress by 21 points, though that is down from 33 points in July.\nThe days and weeks leading up to the election have seen the president barnstorming through red states, a sign of concern with the base's enthusiasm. But it also creates the possibility that he could fire up his base and bring them out to stanch potential Democratic gains.\nThe survey shows that the extra votes from the coalition that put Trump in the White House in 2024 would be a reach for Republican congressional candidates in 2026.",

    "summaryJa": "The company will be the first true artificial intelligence company to go public as tech firms continue to invest heavily in AI.",
    "bodyOriginal": "Anthropic warns of 'catastrophic risk' to humankind ahead of blockbuster share listing\n- Published\nAnthropic has warned artificial intelligence (AI) could pose \"catastrophic or existential risks to humanity\" as it unveiled details of its planned blockbuster stock market listing in the US.\nThe firm's valuation is expected to exceed that of SpaceX, which was the biggest-ever listing at an initial valuation of about $1.8 trillion in the summer.\nAnthropic has not yet disclosed the number of shares to be released, their price range, or a date for the listing.\nThe Claude chatbot developer reported $16.3bn (£12.2bn) of revenue in the first half of the year, with losses of more than $80.7bn.\nAnthropic, which said it will list on the Nasdaq under the symbol ANT, will be the first fully AI-focused company to go public, making it a test case for the future of the technology.\nIn a filing ahead of its listing, Anthropic said concerns had been raised by policymakers, regulators and researchers as well as by people within its organisation that AI systems posed a significant risk to humanity.\nIt said advanced AI systems \"could, if not developed, deployed, and operated with appropriate safeguards, oversight, and security measures, pose catastrophic or existential risks to humanity, particularly if such systems were misused, replicated, weaponised, or allowed to operate with a high degree of autonomy\".\nAnthropic was founded five years ago by chief executive Dario Amodei, his sister Daniela Amodei and five others, and announced its intention to go public in June.\nIts main rival, OpenAI, quickly followed suit. That listing is now expected to occur early next year, according to a person familiar with OpenAI's plans.\nThose announcements were followed by a wave of cyber-security and other technological breaches involving their AI agents - bots designed to operate somewhat autonomously.\nCurrent and former staff of both companies also warned AI technology was being developed without the ability to protect humanity from possible future harms enacted by AI tools.\nAs Anthropic revealed its stock debut plans on Monday, the owners of the rights to Elvis Presley's music sued the AI firm accusing it of using hundreds of the rock-and-roll star's songs to train its chatbot Claude.\nAnthropic's blockbuster share listing - 5 surprising things we now know\n- Published2 hours ago\n'Bold but sane'\nIn Anthropic's new documents, it reiterated promises it has made in the past to develop AI in a way that is beneficial to people, while at the same time warning investors of its dangers.\nAnthropic detailed losses in its financial filings that exceeded its revenue for the first half of the year, but said it would often make forward investments \"that may seem irresponsibly large at first glance\".\n\"In general, we will aim to be bold but sane, and to win trust with a track record of successful bets,\" the tech giant said.\nIts success depends largely on its ability to develop the most advanced AI models, Anthropic said, adding, \"any failure to do so could adversely affect our business\".\nAcross about 90 pages detailing possible risk factors, Anthropic set out the potential threats to its ability to safely and competitively develop AI.\nAnthropic warned it relies on a cluster of cloud computing providers, Taiwanese chipmakers already facing huge demand and data centres concentrated in the US.\nIt also warned of \"regulatory action arising from harms associated with our AI models\" - citing concerns over AI being used by children or individuals at risk of suicide - and uncertainty about where and how it might be held liable for actions taken by its systems.\nHowever, Anthropic also used the filing to laud the potential benefits of the tech itself, envisioning it unlocking \"millions of virtual agents with the ability to revolutionise every area of human endeavour\" across a range of fields.\n\"We believe that AI is one of the most consequential technologies in human history,\" the firm said.\nAnthropic said AI would also \"profoundly accelerate the rate of progress in biology and medicine\", potentially finding cures to diseases including cancer and Alzheimer's.\nThe firm added it could also establish \"sustained acceleration in economic growth\" by boosting productivity.\n'Significant milestone'\nMatt Orton, chief market strategist at investment management firm Raymond James Investment, said investors expected to see rapid growth as well as rapid financial losses in Anthropic's finances, so Monday's filing would not come as a surprise.\n\"Getting the details from this filing, I think will help provide the market with more visibility, because we need to know where its revenue growth is coming from,\" he told the BBC.\nPeter Andersen, founder of Andersen Capital Management, told Reuters that Anthropic's plans to list was \"a significant milestone in the development of artificial intelligence\".\nHe added that the outcome of its stock market debut would be \"fairly indicative of the sentiment\" among investors to continue ploughing cash into AI development.\nWhy are there concerns AI could threaten humanity, and how real are they?\n- Published17 September\nOwners of Elvis music rights sue Anthropic for copyright violations\n- Published7 hours ago\nMusk and Anthropic pledge public share giveaways\n- Published7 days ago\nAI giant Anthropic woos potential investors ahead of stock market debut\n- Published15 October\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

ential technologies in human history,\" the firm said.\nAnthropic said AI would also \"profoundly accelerate the rate of progress in biology and medicine\", potentially finding cures to diseases including cancer and Alzheimer's.\nThe firm added it could also establish \"sustained acceleration in economic growth\" by boosting productivity.\n'Significant milestone'\nMatt Orton, chief market strategist at investment management firm Raymond James Investment, said investors expected to see rapid growth as well as rapid financial losses in Anthropic's finances, so Monday's filing would not come as a surprise.\n\"Getting the details from this filing, I think will help provide the market with more visibility, because we need to know where its revenue growth is coming from,\" he told the BBC.\nPeter Andersen, founder of Andersen Capital Management, told Reuters that Anthropic's plans to list was \"a significant milestone in the development of artificial intelligence\".\nHe added that the outcome of its stock market debut would be \"fairly indicative of the sentiment\" among investors to continue ploughing cash into AI development.\nWhy are there concerns AI could threaten humanity, and how real are they?\n- Published17 September\nOwners of Elvis music rights sue Anthropic for copyright violations\n- Published7 hours ago\nMusk and Anthropic pledge public share giveaways\n- Published7 days ago\nAI giant Anthropic woos potential investors ahead of stock market debut\n- Published15 October\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

    "titleJa": "Investors are doing just as well this year by shunning AI. How to invest if the tech trade keeps fizzling",
    "summaryJa": "An S&amp;P 500 index without AI stocks is beating the traditional index. These sectors and stocks could be winners if the AI trade keeps fraying.",
    "bodyOriginal": "A version of the S&P 500 without AI briefly pulled ahead of the traditional index this year and is now neck-and-neck as investors rotate into other areas of the market.\nA proprietary Goldman Sachs index tracking the S&P 500 without stocks classified as \"AI enablers\" was up 12.4% through Oct. 22, edging ahead of the standard S&P 500's 12% gain. The Goldman index is now neck-and-neck with the S&P 500 as tech rallied in Monday trading.\nTech and AI-related companies make up about 45% of the S&P 500. That heavy weighting has helped power the index for years, but it's turned into a liability lately; the S&P 500 tech sector is down about 7% this month while other sectors have held up.\nInvestors have soured on debt and equity issued by companies like CoreWeave and Oracle. Shares of Meta Platforms sank almost 7% Thursday after it outlined more plans to spend heavily on capex and issue additional shares.\nCompanies supplying power and equipment for the buildout have been hit hard — names like GE Vernova, Bloom Energy, Vistra and Quanta Services all suffered steep declines during the recent selloff.\nGoldman, which launched the measure earlier this year with S&P, uses the S&P 500 as its starting universe and excludes companies perceived to be enablers of AI before applying S&P 500 Index weighting methodology to the remaining universe of companies.\nAI trade loses steam\nThe ex-AI index lagged the S&P 500 for most of the year as investors continued to favor chipmakers, cloud-computing companies and other firms benefiting from heavy AI spending. However, that advantage has been narrowing and it disappeared last week.\nMeanwhile, investors are rotating into defensive areas. ETFs like State Street Consumer Staples Select Sector SPDR ETF, State Street Health Select SPDR ETF and State Street Utilities Select Sector SPDR ETF are up 7% to 10% this month. Energy is ahead 10% too, though that's more related to the war in Iran.\nSome analysts recommend sticking with non-AI companies for diversification and protection against more pain in tech. The \"AI pendulum has swung back in favor of non-AI exposure over the last two weeks,\" Oppenheimer technical analyst Ari Wald said in a note on Oct. 24.\nTwo industries that Oppenheimer favors now are commercial services and insurance. The firm upgraded those industries to overweight last week, recommending Republic Services, Cintas, Verisk Analytics, Broadridge Financial Solutions, MetLife and Arthur J. Gallagher.\nBerkshire Hathaway is also capitalizing on the rotation out of tech. Its Class B shares are up 8% this month, though it's still lagging behind the S&P 500 this year.\nBerkshire owns a wide swath of operating companies, including insurance giant Geico and Burlington Northern Santa Fe railroad. It also has a $364 billion stock portfolio including companies like Apple, Coca-Cola, Alphabet and Bank of America. That diversification may help Berkshire continue to outperform if the tech sector drags down the S&P 500.\nTrivector Research sees potential in \"non-tech compounders.\" Healthcare giant Eli Lilly is one idea. The stock is up 22% on the strength of Lilly's weight-loss drugs. The company has more in the pipeline, including a next-generation obesity drug that Lilly plans to file for FDA approval early in 2027.\nViking Holdings, a cruise operator, is also proving durable. The company said on its August earnings call that 40% of its river capacity and 60% of its ocean capacity was already booked for 2027. \"Based on recent events, we've seen our guests have proved to be resilient and are continuing to book 2027 and future seasons,\" the company told investors.\nViking stock is up 15% this year but it may still have upside. The average Wall Street target is $109, above recent prices around $82. Barclays recently upgraded the cruise operator to overweight with a $102 target, citing the company's \"compelling risk/reward.\"",

    "title": "Meta announces $95 billion stock offering to fund AI expansion",
    "titleJa": "Meta announces $95 billion stock offering to fund AI expansion",
    "summaryJa": "Meta plans to raise $95 billion to fund AI infrastructure and superintelligence, as Nvidia, AMD and Broadcom eye up to $5 billion in shares.",
    "bodyOriginal": "Meta said Monday it is planning to raise a total of $95 billion to support its investments in AI infrastructure and superintelligence.\nThe stock was up 1.6% in premarket trading after the announcement. Nvidia, AMD and Broadcom were interested in purchasing up to $5 billion in shares, Meta said in a statement.\nThe tech giant will initially raise $35 billion in underwritten public equity offerings, before raising an additional $60 billion with an at-the-market program.\nThe news comes as hyperscalers pour record sums into the AI infrastructure buildout. Goldman Sachs estimates that AI-related capital spending could total about $7.6 trillion from 2026 through 2031, across compute, data centers and power.\nMeta's planned investments will support \"emerging AI opportunities\" including its family of apps, its AI agent Muse and its data center business, the company said Monday.\nIt plans to balance funding for these investments through a mix of operating cash flow, investment-grade debt, partnerships and equity capital.\nMeta racing to secure AI infrastructure\nMeta is among the major hyperscalers that are increasingly tapping debt to fund the expensive infrastructure required for the AI boom.\nLast week, Meta posted third-quarter results showing revenue jumped 26% year-on-year: $64.60 billion versus the $63.37 billion analysts expected. However, investors focused more on the tech company's negative free cash flow and its higher full-year capital expenditure forecast.\nIt now expects its full-year capex to range from $135 billion to $145 billion, raising the bottom of the range from $130 billion. That sent shares lower on the day.\nMeta is building four \"superclusters\" with more than one gigawatt of capacity each and is on track to nearly double total infrastructure capacity in 2026 on a year-over-year basis, the company said.\nThe decision to raise more money \"reflects the eye-watering levels of investment required to keep up in the AI arms race,\" Ben Wood, senior partner at CCS Insight, told CNBC.\n\"Meta offering more stock comes at a time when numerous companies, such as Google, SpaceX and soon, Anthropic, are going to the markets to raise funds.\"\nAlphabet, Google's parent company, said it would look to raise $85 billion in June. SpaceX has closed a $40 billion debt financing to purchase graphics processing units. Anthropic is preparing for an IPO.\nTikTok U.S. is looking to secure multiple gigawatts of computing capacity over the coming years, CNBC reported on Friday.",

n Wood, senior partner at CCS Insight, told CNBC.\n\"Meta offering more stock comes at a time when numerous companies, such as Google, SpaceX and soon, Anthropic, are going to the markets to raise funds.\"\nAlphabet, Google's parent company, said it would look to raise $85 billion in June. SpaceX has closed a $40 billion debt financing to purchase graphics processing units. Anthropic is preparing for an IPO.\nTikTok U.S. is looking to secure multiple gigawatts of computing capacity over the coming years, CNBC reported on Friday.",

    "id": "neocloud-stocks-fall-as-elon-musk-says-m-a4172a4f",
    "title": "Neocloud stocks fall as Elon Musk says more than 200 of them face 'guppy-level death'",
    "titleJa": "Neocloud stocks fall as Elon Musk says more than 200 of them face 'guppy-level death'",
    "summaryJa": "Investors are already questioning the debt-fueled expansion of neoclouds and whether the large AI infrastructure build-out will generate long-term returns.",
    "bodyOriginal": "Shares of major neocloud stocks fell on Monday after Elon Musk said that more than 200 companies in the sector could collapse.\nNebius, CoreWeave and Iren all dropped more than 4% in early premarket trading, adding pressure to a sector already facing investor concerns about debt-fueled expansion and whether the large AI infrastructure buildout will generate returns. However, these stocks have since pared some of the losses. Nebius is roughly flat while CoreWeave and Iren are down around 2%.\n\"As of the past few weeks, debt markets have almost entirely shut off access to money for any company that doesn't have substantial revenue independent of AI data centers,\" Musk, CEO of SpaceX and Tesla, said on a post on X on Sunday.\n\"That means the 200+ neoclouds are going to see guppy-level death and consolidation. Some will make it through, but not many,\" he added.\nMusk's SpaceX operates its own data centers through which it sells computing capacity. SpaceX is a direct competitor to the neoclouds which also rent compute.\nMusk was replying to a post on X by Chamath Palihapitiya, the founder of Social Capital, who laid out his views on the state of the data center buildout. He suggested that there will be \"a lot of partially stranded compute and compute sitting in inventory in 2027 than is currently forecasted,\" which will be \"bought and paid for but effectively underearning (below total cost of capital) or collecting dust.\"\n\"2027 will be a turbulent year because it will clear out a bunch of wrong/bad bets. It will also be a consolidation year for a few,\" Palihapitiya said.\nNeocloud stocks have taken a hammering over the past month, with CoreWeave and Nebius down more than 30% while Iren has tanked 40%. The sell-off started earlier this month after the spread on CoreWeave's five-year credit default swaps hit levels generally viewed as signs of distress. The yields on CoreWeave's bonds also climbed.\nInvestors have grown jittery over companies that are borrowing heavily to fund the purchase of expensive Nvidia chips, build data centers, and rent out computing power.\nNvidia, neoclouds defend demand\nNvidia, an investor in several neoclouds, looked to shore up the sector last week at its GTC event in Berlin, Germany.\nIn an interview with CNBC, Nvidia CEO Jensen Huang said the demand for neoclouds is \"off the charts.\"\n\"What is missing in the middle is the working capital to fuel that growth… because there's just so much demand across so many sectors of AI, there's a scarcity of capital,\" Huang said.\n\"The demand of the capital is much greater than the availability of the capital. That's going to get solved,\" he added.\nMarc Boroditsky, chief revenue officer at Nebius, distanced his company from concerns surrounding CoreWeave, saying \"we're not carrying the kind of debt that they are,\" in an interview with CNBC. Boroditsky said that if the AI infrastructure company brought its 2027 capacity online, it would sell out. And there could be \"the same type of dynamic\" in 2028.\nIren Co-CEO Daniel Roberts also defended demand.\n\"We understand the increased focus from investors, but when we're talking from customers, nothing has changed. The demand is still there,\" Roberts told CNBC last week.\n\"Next year, we are having conversations with customers covering multiples of all the capacity we possibly bring online, and in the last month or so, 2028 is now coming into focus. But the demand is there,\" he added.",
    "bodyJa": "Shares of major neocloud stocks fell on Monday after Elon Musk said that more than 200 companies in the sector could collapse.\nNebius, CoreWeave and Iren all dropped more than 4% in early premarket trading, adding pressure to a sector already facing investor concerns about debt-fueled expansion and whether the large AI infrastructure buildout will generate returns. However, these stocks have since pared some of the losses. Nebius is roughly flat while CoreWeave and Iren are down around 2%.\n\"As of the past few weeks, debt markets have almost entirely shut off access to money for any company that doesn't have substantial revenue independent of AI data centers,\" Musk, CEO of SpaceX and Tesla, said on a post on X on Sunday.\n\"That means the 200+ neoclouds are going to see guppy-level death and consolidation. Some will make it through, but not many,\" he added.\nMusk's SpaceX operates its own data centers through which it sells computing capacity. SpaceX is a direct competitor to the neoclouds which also rent compute.\nMusk was replying to a post on X by Chamath Palihapitiya, the founder of Social Capital, who laid out his views on the state of the data center buildout. He suggested that there will be \"a lot of partially stranded compute and compute sitting in inventory in 2027 than is currently forecasted,\" which will be \"bought and paid for but effectively underearning (below total cost of capital) or collecting dust.\"\n\"2027 will be a turbulent year because it will clear out a bunch of wrong/bad bets. It will also be a consolidation year for a few,\" Palihapitiya said.\nNeocloud stocks have taken a hammering over the past month, with CoreWeave and Nebius down more than 30% while Iren has tanked 40%. The sell-off started earlier this month after the spread on CoreWeave's five-year credit default swaps hit levels generally viewed as signs of distress. The yields on CoreWeave's bonds also climbed.\nInvestors have grown jittery over companies that are borrowing heavily to fund the purchase of expensive Nvidia chips, build data centers, and rent out computing power.\nNvidia, neoclouds defend demand\nNvidia, an investor in several neoclouds, looked to shore up the sector last week at its GTC event in Berlin, Germany.\nIn an interview with CNBC, Nvidia CEO Jensen Huang said the demand for neoclouds is \"off the charts.\"\n\"What is missing in the middle is the working capital to fuel that growth… because there's just so much demand across so many sectors of AI, there's a scarcity of capital,\" Huang said.\n\"The demand of the capital is much greater than the availability of the capital. That's going to get solved,\" he added.\nMarc Boroditsky, chief revenue officer at Nebius, distanced his company from concerns surrounding CoreWeave, saying \"we're not carrying the kind of debt that they are,\" in an interview with CNBC. Boroditsky said that if the AI infrastructure company brought its 2027 capacity online, it would sell out. And there could be \"the same type of dynamic\" in 2028.\nIren Co-CEO Daniel Roberts also defended demand.\n\"We understand the increased focus from investors, but when we're talking from customers, nothing has changed. The demand is still there,\" Roberts told CNBC last week.\n\"Next year, we are having conversations with customers covering multiples of all the capacity we possibly bring online, and in the last month or so, 2028 is now coming into focus. But the demand is there,\" he added.",

    "id": "cracking-ai-trade-has-wall-street-lookin-5149347c",
    "title": "Cracking AI trade has Wall Street looking for a hedge. An ex-Citadel quant may have the answer",
    "titleJa": "Cracking AI trade has Wall Street looking for a hedge. An ex-Citadel quant may have the answer",
    "summaryJa": "Jasper Zhang runs Hyperbolic, a GPU exchange building a software for \"physical\" AI futures",
    "bodyOriginal": "As CoreWeave shares plummet, taking much of the AI complex with it, investors face a simple question: what's the best way to hedge AI risk?\nAn ex-Citadel quant might have the answer.\nJasper Zhang is an ex-Citadel Securities quantitative researcher who now leads Hyperbolic. It's a 50-person financial technology startup building a spot marketplace for tradable GPU computing power, a tool that would allow traders to hedge against a decline in AI demand.\nThe platform allows investors to buy and sell GPU clusters, the units that power AI compute. This is done through Hyperbolic's Forge software, which virtually logs into clusters worldwide and makes technical tweaks so that mismatched clusters work better together, allowing traders to not just buy and sell a standardized unit of compute, but also control the underlying GPUs for their own purposes.\nZhang says it's as good as being in the data center itself, and sees the technology as the first building block of \"physically\" settled GPU futures, which, upon settlement, would offer contract owners complete control over a cluster with known characteristics. In other words, it would allow investors a new way to hedge against a decline in AI demand by trading the hardware itself.\nCurrently, GPU architecture varies wildly depending on how they are assembled, leading to various levels of output. Every data center is different. Networking, memory, and security all affect GPU performance. At the same time, financing agreements often prevent builders from sharing prices, meaning a survey-based index may average setup costs while missing outlier expenses.\nIn the futures world, that's called \"basis risk.\" It's a problem for market-makers to solve, and a void Zhang hopes Hyperbolic can fill.\nThe 31-year-old Zhang came to America with several Chinese math medals and finished a math doctorate at U.C. Berkeley in just two years before taking a job at Citadel Securities building trading models. Hyperbolic's head of finance, Hong Chan Kim is a hedge fund veteran, having worked at Point72, Balyasny Asset Management and Citadel LLC, the hedge fund.\nHyperbolic has raised $20 million since its launch in 2022, is in the midst of another funding round, and expects a $150 million annualized run rate by year-end. As of today, the company says it has about 250,000 users and an estimated $200 million worth of annual GPU compute connected to its platform.\nEmerging market\nOther big players see a similar opportunity in the marketplace for AI hedging tools.\nCME Group plans to offer a cash-settled futures product that is tied to GPU pricing maintained by Silicon Data, an index-provider backed by DRW, one of the biggest prop-trading firms in Chicago.\n\"There's a ton of demand and capital flowing into this ecosystem so there's a lot of risk,\" Don Wilson, founder and CEO of DRW, said in a call. \"Cash futures are a great first building block. There are plenty of electricity futures that are cash-settled, oil futures that are cash-settled, so I think you can start these things either way.\"\nThe CME product is currently under review with the CFTC, but the commission recently extended that review period to November 9th, likely also tying up another futures contract proposed by Intercontinental Exchange and data-provider Ornn, backed by Andreessen Horowitz's a16z crypto fund.\n\"Our guess is when the cash-settled futures come out they're not going to be reflective of what's going on in reality,\" says Hyperbolic's Kim. \"Physical usage is what will tether that connection between the reality and the derivatives.\"\nThe bigger issue is that cash futures are an imperfect hedge for real-world risk. If AI demand hits a wall, AI rent-a-centers like CoreWeave could end up sitting on billions of dollars in AI hardware with little to no way to cash out.\n\"Indices are a normalized global number,\" said Carmen Li, CEO of Silicon data and DRW-backed Compute Exchange, a marketplace for buying and selling GPUs that is also laying groundwork for physically-settled futures. \"You get financially hedged, but if you're looking for procurement, that's not going to help you.\"\nWhat the AI complex needs most – in particular smaller startups that don't have the capital or credit to risk making big hardware purchases – is a virtual pipeline to physical hardware, contends Zhang.\n\"CoreWeave's debt situation would be less concerning if providers had more ways to monetize available GPU capacity during a slowdown, especially when long-term contracts carry thin margins,\" said Zhang. \"Cash-settled futures can help falling prices, but they do not by themselves put idle GPUs to work.\"",
    "bodyJa": "As CoreWeave shares plummet, taking much of the AI complex with it, investors face a simple question: what's the best way to hedge AI risk?\nAn ex-Citadel quant might have the answer.\nJasper Zhang is an ex-Citadel Securities quantitative researcher who now leads Hyperbolic. It's a 50-person financial technology startup building a spot marketplace for tradable GPU computing power, a tool that would allow traders to hedge against a decline in AI demand.\nThe platform allows investors to buy and sell GPU clusters, the units that power AI compute. This is done through Hyperbolic's Forge software, which virtually logs into clusters worldwide and makes technical tweaks so that mismatched clusters work better together, allowing traders to not just buy and sell a standardized unit of compute, but also control the underlying GPUs for their own purposes.\nZhang says it's as good as being in the data center itself, and sees the technology as the first building block of \"physically\" settled GPU futures, which, upon settlement, would offer contract owners complete control over a cluster with known characteristics. In other words, it would allow investors a new way to hedge against a decline in AI demand by trading the hardware itself.\nCurrently, GPU architecture varies wildly depending on how they are assembled, leading to various levels of output. Every data center is different. Networking, memory, and security all affect GPU performance. At the same time, financing agreements often prevent builders from sharing prices, meaning a survey-based index may average setup costs while missing outlier expenses.\nIn the futures world, that's called \"basis risk.\" It's a problem for market-makers to solve, and a void Zhang hopes Hyperbolic can fill.\nThe 31-year-old Zhang came to America with several Chinese math medals and finished a math doctorate at U.C. Berkeley in just two years before taking a job at Citadel Securities building trading models. Hyperbolic's head of finance, Hong Chan Kim is a hedge fund veteran, having worked at Point72, Balyasny Asset Management and Citadel LLC, the hedge fund.\nHyperbolic has raised $20 million since its launch in 2022, is in the midst of another funding round, and expects a $150 million annualized run rate by year-end. As of today, the company says it has about 250,000 users and an estimated $200 million worth of annual GPU compute connected to its platform.\nEmerging market\nOther big players see a similar opportunity in the marketplace for AI hedging tools.\nCME Group plans to offer a cash-settled futures product that is tied to GPU pricing maintained by Silicon Data, an index-provider backed by DRW, one of the biggest prop-trading firms in Chicago.\n\"There's a ton of demand and capital flowing into this ecosystem so there's a lot of risk,\" Don Wilson, founder and CEO of DRW, said in a call. \"Cash futures are a great first building block. There are plenty of electricity futures that are cash-settled, oil futures that are cash-settled, so I think you can start these things either way.\"\nThe CME product is currently under review with the CFTC, but the commission recently extended that review period to November 9th, likely also tying up another futures contract proposed by Intercontinental Exchange and data-provider Ornn, backed by Andreessen Horowitz's a16z crypto fund.\n\"Our guess is when the cash-settled futures come out they're not going to be reflective of what's going on in reality,\" says Hyperbolic's Kim. \"Physical usage is what will tether that connection between the reality and the derivatives.\"\nThe bigger issue is that cash futures are an imperfect hedge for real-world risk. If AI demand hits a wall, AI rent-a-centers like CoreWeave could end up sitting on billions of dollars in AI hardware with little to no way to cash out.\n\"Indices are a normalized global number,\" said Carmen Li, CEO of Silicon data and DRW-backed Compute Exchange, a marketplace for buying and selling GPUs that is also laying groundwork for physically-settled futures. \"You get financially hedged, but if you're looking for procurement, that's not going to help you.\"\nWhat the AI complex needs most – in particular smaller startups that don't have the capital or credit to risk making big hardware purchases – is a virtual pipeline to physical hardware, contends Zhang.\n\"CoreWeave's debt situation would be less concerning if providers had more ways to monetize available GPU capacity during a slowdown, especially when long-term contracts carry thin margins,\" said Zhang. \"Cash-settled futures can help falling prices, but they do not by themselves put idle GPUs to work.\"",

    "id": "trump-says-he-ll-soon-decide-whether-to-9f5bcced",
    "title": "Trump says he'll soon decide whether to ‘make a deal’ with Iran or ‘finish it off'",
    "titleJa": "Trump says he'll soon decide whether to ‘make a deal’ with Iran or ‘finish it off'",
    "summaryJa": "Trump said he is weighing a deal with Iran against renewed military action as tensions escalate across the Middle East.",
    "bodyOriginal": "U.S. President Donald Trump has said he was deciding whether to \"make a deal\" with Iran or \"finish it off\" as investors weigh heightened tensions across the Middle East.\n\"Do I finish it off, which would be very easy to do, or do I make a deal? It's getting to be decision time,\" Trump said in a Fox News interview on Sunday.\nMediators from Qatar, which has played a key role in efforts to negotiate an agreement between Washington and Tehran, visited Tehran on Sunday, per Reuters. It comes as attacks by Iran-backed Houthi militants on Saudi Arabia continued over the weekend.\nThe last confirmed U.S. strikes on Iran were on Sept. 1. Trump previously said strikes would not resume until after the Nov. 3 midterm elections. Tehran says it is preparing a military response to any U.S. attacks.\nA potential U.S. target could be Pickaxe Mountain, a deeply buried site linked to Iran's nuclear program, Trump said in the Sunday interview.\n\"We can read the badge on somebody's shirt from space, okay? We know exactly what's going on at Pickaxe Mountain. We know the other three [nuclear sites] are obliterated,\" Trump said.\nTrump also repeated the claim that the U.S. controls the Strait of Hormuz, a key waterway for global trade and a major flashpoint in the conflict, citing that crude oil flows have returned to pre-war levels.\nEnergy prices nonetheless remain elevated amid the disruption and a global refining squeeze.\nWashington and Tehran have both repeatedly claimed they control the route, where overall trade flows remain severely curtailed, impacting consumer prices.\nA Singapore-flagged container ship sank in the strait earlier this month after being struck by an unidentified projectile and catching fire.\nIran Revolutionary Guard navy chief Ali Ozmaei said earlier this month that Tehran is \"counting the moments\" until it can sink American warships.\nRegional powers seek Iran talks\nSenior officials from Saudi Arabia, Turkey and Pakistan are meeting Iran's leadership in Tehran on Monday\nThe three countries signed the Makkah Joint Defence Agreement in August, committing to closer defense cooperation and stipulating that an armed attack against one member would be regarded as an attack against all.\nIt is the first meeting of the group since Houthi missiles and drones targeted sites across Saudi Arabia, including Riyadh airport and an administrative building belonging to oil giant Saudi Aramco.\nSaudi Arabia last week postponed its flagship Future Investment Initiative conference until 2027 due to security concerns after a string of fatal strikes.",

ran's leadership in Tehran on Monday\nThe three countries signed the Makkah Joint Defence Agreement in August, committing to closer defense cooperation and stipulating that an armed attack against one member would be regarded as an attack against all.\nIt is the first meeting of the group since Houthi missiles and drones targeted sites across Saudi Arabia, including Riyadh airport and an administrative building belonging to oil giant Saudi Aramco.\nSaudi Arabia last week postponed its flagship Future Investment Initiative conference until 2027 due to security concerns after a string of fatal strikes.",

    "id": "apollo-to-buy-nearly-10-stake-in-abu-dha-8e0ab19a",
    "title": "Apollo to buy nearly 10% stake in Abu Dhabi-backed alternative asset manager Mubadala Capital",
    "titleJa": "Apollo to buy nearly 10% stake in Abu Dhabi-backed alternative asset manager Mubadala Capital",
    "summaryJa": "The deal further advances Apollo Global's ambitions in Abu Dhabi, often called the \"capital of capital.\"",
    "bodyOriginal": "Investing giant Apollo Global Management is finalizing a deal to buy nearly a 10% stake in Mubadala Capital, the alternative asset manager subsidiary of Abu Dhabi's sovereign wealth fund, Mubadala Investment Company, according to people familiar with the matter who spoke on condition of anonymity.\nThe deal is expected to be announced later Monday morning, they said. Financial terms were not immediately known.\nThe transaction is significant on multiple fronts. It further advances Apollo's ambitions in Abu Dhabi, often called the \"capital of capital.\" The firm has spent the past 15 years building key strategic relationships there, with both the country's investment arm and its core leadership.\nApollo already has a multibillion-dollar partnership with Mubadala Investment Company, first established in 2022 and extended two years ago. At the time of that extension, Apollo said the agreement would strengthen the firm's Capital Solutions platform by enabling the firms to jointly source and provide customized debt and equity financing to companies worldwide.\nIn 2023, the institutions formed a $2.5 billion joint venture designed specifically to co-invest in global private credit opportunities over a five-year horizon.\nFor Mubadala Capital specifically — the region's only large-scale asset manager, advising and administering over $755 billion in assets — the deal further advances its growth strategy under the direction of CEO Hani Barhoush, and its relevance on the global investing stage. It also marks an inflection point for the company's core alternatives business, which has grown to more than $60 billion.\nJohn Zito, co-president of Apollo's Asset Management arm, and Barhoush have worked closely together over the past several years and, according to sources, their close-knit relationship and the success of prior partnerships led to talks of deepening ties. So did the belief that scale in the asset management business matters more than ever.\n\"Capital as a moat is a big thing,\" said one person familiar with the deal.\nImportantly, the deal also continues a notable shift in the relationship between American investment firms and the Middle East. While the region, and Abu Dhabi specifically, has long been a sought-after source of capital, this deal further reverses that dynamic, with Apollo making a significant direct investment in the country and its investment vision.\nMubadala Capital's international offices include London, New York, Rio de Janeiro and San Francisco.\nApollo's investment in Mubadala Capital is similar to deals the firm has done with other asset management platforms, including Diameter Capital, Thoreau, Motive Partners and others.\nSpokespersons for both firms declined to comment.",

    "title": "Salon owners urge Budget VAT cut as staffing pressures grow",
    "titleJa": "Salon owners urge Budget VAT cut as staffing pressures grow",
    "summaryJa": "Marcus Perkins, who owns a hair and beauty salon in Brierley Hill, says he is scared for the future.",
    "bodyOriginal": "Salon owners urge Budget VAT cut as staffing pressures grow\n- Published\nAfter 22 years running a salon, Marcus Perkins says he is increasingly worried about the future of the hair and beauty industry.\nRising costs are making it harder for businesses to employ staff and invest in apprenticeships, he says, while more salons are turning to self-employed models to survive.\n\"Seeing salons close on the high street is very scary,\" he said. \"I'm very scared myself. Luckily it hasn't happened yet but who knows what the future holds?\"\nPerkins is among more than 2,000 salon owners who have signed an open letter calling on the Chancellor John Healey to cut VAT on hair and beauty services from 20% to 10% in this week's Budget.\nThe letter is backed by the British Hair Consortium (BHC), which argues rising business costs are placing increasing pressure on traditional salon employers.\nHowever, the industry has also seen growing numbers of stylists move into self-employed arrangements, with hairdressers often renting a chair within a salon rather than being directly employed.\nWith salon ownership perceived to be out of reach for many, self-employment offered independence, flexibility and higher earnings, industry research suggested, external.\nA Treasury spokesperson said hair and beauty businesses played an important role in supporting jobs, apprenticeships and thriving high streets.\nThey added that the sector had benefited from reforms to business rates.\nWhile traditional salons said they faced rising pressures, a recent report from the British Beauty Council found that hair and beauty salons and shops made up almost a third of all leisure sites across UK retail centres.\nIt added that those businesses now accounted for greater share of smaller high streets and were equivalent to pubs, bars and cafes combined.\nThere were 50,400 VAT or PAYE registered hair and beauty salons in the UK as of March 2025, according to the Office for National Statistics, external. That compared to 49,300 in March 2024.\nSalon owners say they have also been affected by increases in wage, pension and National Insurance (NI) costs.\nThe government's changes to employers' NI contributions and increases to the minimum wage have been defended by ministers as part of wider efforts to improve pay, support public services and drive economic growth.\nThe BHC said a reduction in VAT would help businesses take on more staff, invest in training and keep more salons trading on the high street.\nWhat is the Budget and what could be in it?\n- Published10 hours ago\nPerkins believed it would make a significant difference.\n\"We can grow the business and employ more people,\" he said.\nThe salon owner runs M&M Spa in Quarry Bank, near Brierley Hill, where he says he has trained more than a dozen young people over the past two decades.\nAmong them is 21-year-old stylist Trearna Hart, who said many of her peers had struggled to establish careers after leaving college.\nShe said she was fortunate to find an employer willing to invest in her development.\nThis year alone, Perkins said he had spent about £2,000 on courses and travel costs to support her training.\n\"It's upsetting really,\" he said. \"We help people, we train, we nurture, we mentor. We help the next generation because if we don't help the next generation, what happens to our future?\"\nThe BHC claimed apprenticeship numbers had fallen sharply and warned the trend could worsen if pressures on employer-run salons continued.\nFinancial pressures and concerns over inconsistent training standards had led salons to take on fewer apprentices, with 53% of salon owners reporting a reduction, external in the number they trained, according to a Future of Hairdressing report.\nPerkins believes businesses that employ and train staff are increasingly competing against models centred on self-employed workers.\nHe argues that creates an \"unlevel playing field\" because traditional salons often shoulder the costs of training future hairdressers.\nHart said the number of salons disappearing from high streets was a concern.\n\"At the rate it's going we're not going to have many salons left open and there's no-one going to be able to do hair,\" she said.\nThe challenges facing the sector are also worrying some customers.\nResearch from the British Beauty Council highlighted the role hair and beauty businesses play in supporting local high streets, encouraging spending and providing opportunities for social connection.\nDorothy Senior has visited M&M for hair and beauty treatments for the past 20 years.\nShe said the salon was about much more than appearances.\n\"Every time I come in I go home feeling so much better,\" she said. \"It isn't just having nails and hair done, it's the whole package.\"\nGet in touch\nTell us which stories we should cover in Birmingham and the Black Country\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.\nRelated topics\n- Published28 January\n- Published25 April 2025\n- Published3 September 2025",

e costs of training future hairdressers.\nHart said the number of salons disappearing from high streets was a concern.\n\"At the rate it's going we're not going to have many salons left open and there's no-one going to be able to do hair,\" she said.\nThe challenges facing the sector are also worrying some customers.\nResearch from the British Beauty Council highlighted the role hair and beauty businesses play in supporting local high streets, encouraging spending and providing opportunities for social connection.\nDorothy Senior has visited M&M for hair and beauty treatments for the past 20 years.\nShe said the salon was about much more than appearances.\n\"Every time I come in I go home feeling so much better,\" she said. \"It isn't just having nails and hair done, it's the whole package.\"\nGet in touch\nTell us which stories we should cover in Birmingham and the Black Country\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.\nRelated topics\n- Published28 January\n- Published25 April 2025\n- Published3 September 2025",

    "id": "healey-to-shield-low-income-pensioners-f-53d6abfa",
    "title": "Healey to shield low-income pensioners from income tax in the Budget",
    "titleJa": "Healey to shield low-income pensioners from income tax in the Budget",
    "summaryJa": "Changes are needed to prevent the full, flat-rate state pension becoming liable for income tax after it rises in April.",
    "bodyOriginal": "Healey to shield low-income pensioners from income tax in the Budget\n- Published\nPensioners on low incomes will be shielded from income tax by Chancellor John Healey in his first Budget on Wednesday.\nThe full, flat-rate state pension is expected to increase by 3.9% to £13,036.40 a year from April. This would take the payment above the £12,570 personal tax allowance and therefore be liable for income tax if no changes are made.\nThe government had already committed to not taxing people who only get an income from the state pension. Healey will explain this pledge will be met by plans for a new tax allowance for low-income pensioners.\nHealey's plans come as the Conservatives and Reform UK unveil their alternative Budget proposals, including deep cuts to the welfare bill.\nWhat is the Budget and what could be in it?\n- Published10 hours ago\nAn insider's guide to Budget Day: 'Don't fall off the kerb'\n- Published6 hours ago\nThe chancellor's allies argue his plans for pensioners will mean they do not need to face an administrative burden just to pay a small amount of tax.\nMore specific details, including how many pensioners this will affect, have yet to be confirmed by the Treasury.\nThe Budget is due to be printed this evening, with Healey's speech likely to be fine-tuned right up until it is delivered on Wednesday lunchtime.\nTreasury sources concede it will not involve the scale of tax and spending announcements seen from Labour and Conservative governments in recent years.\nThe Tories are calling on the chancellor to cut green taxes, red tape and benefits to bring down energy bills.\nReform is recommending the chancellor adopts 60 policies which they claim will create jobs - including approving the controversial Rosebank oil field - a project Healey is understood to back.\nLiberal Democrat Treasury spokeswoman Daisy Cooper has called on the government to agree a new growth and defence partnership with the EU, including joining the single market. She argued this would help \"ease the huge tax burden weighing people down\".\nThe Green Party has urged Healey to use his first Budget to \"make the UK affordable\", including by funding energy bill support by ending a tax relief for data centres.\nSenior Green politicians, including leader Zack Polanski, MPs and peers, made clear their suggestions in a letter to Healey.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",
    "bodyJa": "Healey to shield low-income pensioners from income tax in the Budget\n- Published\nPensioners on low incomes will be shielded from income tax by Chancellor John Healey in his first Budget on Wednesday.\nThe full, flat-rate state pension is expected to increase by 3.9% to £13,036.40 a year from April. This would take the payment above the £12,570 personal tax allowance and therefore be liable for income tax if no changes are made.\nThe government had already committed to not taxing people who only get an income from the state pension. Healey will explain this pledge will be met by plans for a new tax allowance for low-income pensioners.\nHealey's plans come as the Conservatives and Reform UK unveil their alternative Budget proposals, including deep cuts to the welfare bill.\nWhat is the Budget and what could be in it?\n- Published10 hours ago\nAn insider's guide to Budget Day: 'Don't fall off the kerb'\n- Published6 hours ago\nThe chancellor's allies argue his plans for pensioners will mean they do not need to face an administrative burden just to pay a small amount of tax.\nMore specific details, including how many pensioners this will affect, have yet to be confirmed by the Treasury.\nThe Budget is due to be printed this evening, with Healey's speech likely to be fine-tuned right up until it is delivered on Wednesday lunchtime.\nTreasury sources concede it will not involve the scale of tax and spending announcements seen from Labour and Conservative governments in recent years.\nThe Tories are calling on the chancellor to cut green taxes, red tape and benefits to bring down energy bills.\nReform is recommending the chancellor adopts 60 policies which they claim will create jobs - including approving the controversial Rosebank oil field - a project Healey is understood to back.\nLiberal Democrat Treasury spokeswoman Daisy Cooper has called on the government to agree a new growth and defence partnership with the EU, including joining the single market. She argued this would help \"ease the huge tax burden weighing people down\".\nThe Green Party has urged Healey to use his first Budget to \"make the UK affordable\", including by funding energy bill support by ending a tax relief for data centres.\nSenior Green politicians, including leader Zack Polanski, MPs and peers, made clear their suggestions in a letter to Healey.\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "id": "brazil-s-lula-wins-historic-presidential-7191eef2",
    "title": "Brazil's Lula wins historic presidential election; Bolsonaro reportedly refuses to concede",
    "titleJa": "Brazil's Lula wins historic presidential election; Bolsonaro reportedly refuses to concede",
    "summaryJa": "It's the first time since Brazil returned to direct elections in 1989 that a candidate has won the final runoff after losing in the first round.",
    "bodyOriginal": "Luiz Inácio Lula da Silva has won an unprecedented fourth term as Brazil's president, overturning a first-round deficit to beat Senator Flávio Bolsonaro in a runoff that split the country almost evenly.\nLula took 51.8% of valid votes to Bolsonaro's 48.2%, according to the Superior Electoral Court, with nearly all ballots counted on Sunday.\nThe results are also historic as it's the first time since Brazil returned to direct elections in 1989 that a candidate has won the final runoff after losing in the first round.\nBolsonaro refused to concede defeat, saying he would seek the annulment of the outcome, Reuters reported. He also said a ruling by the Supreme Court Justice Cristiano Zanin to extend voting for two hours was \"unacceptable,\" according to the report.\nThe election process was marred by allegations of voter suppression, with Lula's campaign reporting suspended public transportation in some key areas, prompting the court to extend voting by two hours. Bolsonaro's campaign had also requested an extension, citing heavy rains that shut polling stations in the south, a right-wing stronghold.\nThe victory of the 80-year-old leftist, who had trailed in the first round, blocks a rightward shift in Latin America that U.S. President Donald Trump has backed.\nTrump, who had labeled Bolsonaro's lead in the first round as \"a very, very big victory,\" would have preferred a Brazilian in closer alignment to U.S. foreign policy as Washington makes efforts to project U.S. power across the Americas, according to Daniela Portella Sampaio, senior research fellow for Latin American Security at the U.K. think tank Royal United Services Institute.\nLula, who has publicly sparred with Trump, is set to govern from 2027 to 2030, facing a Congress where Bolsonaro's Liberal Party holds the largest bench in decades, and with a substantial public debt that he would need to stabilize.\nBrazil, under Lula's leadership, has grappled with worsening fiscal health and mounting public debt driven by double-digit interest rates, elevated cost of servicing the debt, and rigid mandatory spending. Gross debt reached 82.9% of the country's GDP in August, the highest since March 2021, according to the Central Bank of Brazil.\nMarkets bracing for rout?\nInvestors are bracing for heightened volatility across Brazilian markets on Monday following Lula's victory as the right-wing Bolsonaro was seen as more likely to push for fiscal austerity and deregulation.\nThe iShares MSCI Brazil ETF (EWZ) plunged nearly 20% in overnight trading following election results.\nAnalysts had expected a rally in Brazilian assets before Sunday's election results, with Bolsonaro holding a narrow lead earlier this month. Chris Turner, Global Head of Markets and Regional Head of Research for UK & CEE at ING, had forecast both the currency and bond markets to rally if Bolsonaro won.\nThe new president will need to convince investors that Brazil can stabilize its debt trajectory, said Alejo Czerwonko, a fellow at the Atlantic Council. Lula's administration will likely extend the more \"gradual approach,\" building on the existing fiscal framework while seeking to preserve public investment and social spending, Czerwonko said.\nGoldman Sachs analysts expect \"modest measures\" to contain the government's spending growth, alongside further increases in an already high tax burden, while major structural reforms remain unlikely.\nLeaders from across Latin America largely congratulated Lula's historic win.\nPeruvian President Keiko Fujimori, in a post on X late Sunday, hailed Lula's victory, calling it a \"democratic day\" for the Brazilian people. Uruguay President Orsi Yamandu congratulated Lula over a call, calling the Brazilian president a \"friend.\"\nLula's victory came the same day as Serbia's long-serving strongman leader, Aleksandar Vucic, conceded defeat in a parliamentary election to the student-led opposition movement, ending 14 years of leadership.\n— CNBC's Matthew Tan contributed to this report.",
    "bodyJa": "Luiz Inácio Lula da Silva has won an unprecedented fourth term as Brazil's president, overturning a first-round deficit to beat Senator Flávio Bolsonaro in a runoff that split the country almost evenly.\nLula took 51.8% of valid votes to Bolsonaro's 48.2%, according to the Superior Electoral Court, with nearly all ballots counted on Sunday.\nThe results are also historic as it's the first time since Brazil returned to direct elections in 1989 that a candidate has won the final runoff after losing in the first round.\nBolsonaro refused to concede defeat, saying he would seek the annulment of the outcome, Reuters reported. He also said a ruling by the Supreme Court Justice Cristiano Zanin to extend voting for two hours was \"unacceptable,\" according to the report.\nThe election process was marred by allegations of voter suppression, with Lula's campaign reporting suspended public transportation in some key areas, prompting the court to extend voting by two hours. Bolsonaro's campaign had also requested an extension, citing heavy rains that shut polling stations in the south, a right-wing stronghold.\nThe victory of the 80-year-old leftist, who had trailed in the first round, blocks a rightward shift in Latin America that U.S. President Donald Trump has backed.\nTrump, who had labeled Bolsonaro's lead in the first round as \"a very, very big victory,\" would have preferred a Brazilian in closer alignment to U.S. foreign policy as Washington makes efforts to project U.S. power across the Americas, according to Daniela Portella Sampaio, senior research fellow for Latin American Security at the U.K. think tank Royal United Services Institute.\nLula, who has publicly sparred with Trump, is set to govern from 2027 to 2030, facing a Congress where Bolsonaro's Liberal Party holds the largest bench in decades, and with a substantial public debt that he would need to stabilize.\nBrazil, under Lula's leadership, has grappled with worsening fiscal health and mounting public debt driven by double-digit interest rates, elevated cost of servicing the debt, and rigid mandatory spending. Gross debt reached 82.9% of the country's GDP in August, the highest since March 2021, according to the Central Bank of Brazil.\nMarkets bracing for rout?\nInvestors are bracing for heightened volatility across Brazilian markets on Monday following Lula's victory as the right-wing Bolsonaro was seen as more likely to push for fiscal austerity and deregulation.\nThe iShares MSCI Brazil ETF (EWZ) plunged nearly 20% in overnight trading following election results.\nAnalysts had expected a rally in Brazilian assets before Sunday's election results, with Bolsonaro holding a narrow lead earlier this month. Chris Turner, Global Head of Markets and Regional Head of Research for UK & CEE at ING, had forecast both the currency and bond markets to rally if Bolsonaro won.\nThe new president will need to convince investors that Brazil can stabilize its debt trajectory, said Alejo Czerwonko, a fellow at the Atlantic Council. Lula's administration will likely extend the more \"gradual approach,\" building on the existing fiscal framework while seeking to preserve public investment and social spending, Czerwonko said.\nGoldman Sachs analysts expect \"modest measures\" to contain the government's spending growth, alongside further increases in an already high tax burden, while major structural reforms remain unlikely.\nLeaders from across Latin America largely congratulated Lula's historic win.\nPeruvian President Keiko Fujimori, in a post on X late Sunday, hailed Lula's victory, calling it a \"democratic day\" for the Brazilian people. Uruguay President Orsi Yamandu congratulated Lula over a call, calling the Brazilian president a \"friend.\"\nLula's victory came the same day as Serbia's long-serving strongman leader, Aleksandar Vucic, conceded defeat in a parliamentary election to the student-led opposition movement, ending 14 years of leadership.\n— CNBC's Matthew Tan contributed to this report.",
