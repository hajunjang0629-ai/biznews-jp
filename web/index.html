    "bodyOriginal": "Travelodge failed sex assault victim 'at every stage'\n- Published\nA woman who was sexually assaulted by a man given a key to her hotel room was \"fundamentally failed\" by Travelodge \"at every stage\", an independent review has found.\nBarrister Paul Greaney KC said the chain's security policies at the time of the attack at its Maidenhead hotel in December 2022 were \"not fit for the purpose of keeping guests safe\".\nHe found guests were still not as safe as they should be, with room intrusions reported at nearly one-in-10 Travelodge hotels this summer, and no policy in place on violence against women and girls.\nTravelodge apologised \"unreservedly\" to the woman. The review did credit the company with making changes since March.\nKyran Smith, who obtained the key by falsely claiming to be the woman's boyfriend, was jailed for seven-and-a-half years in January.\nThe review found he was handed the key less than three minutes after approaching the reception desk, by a receptionist who had received no training in key security.\nGreaney said blame rested with Travelodge as an organisation rather than with individual staff, and a culture had developed in which room intrusions were regarded as \"one of those things\".\nThe woman emailed a complaint to Travelodge in January 2023, addressed to chief executive Jo Boydell and others.\nThe review concluded the email was handled by her office without her knowledge, and did not come to Boydell's attention until March 2026.\nThe woman's complaint was instead investigated by a manager who was himself criticised in it, and the customer services team offered her a refund for her night's stay, which she understood to be £30.\nBoydell stepped down as chief executive in August following criticism over the company's handling of safety complaints. The review said she deserved credit for driving improvements from March.\nThe attack became national news in March after the woman contacted the BBC, saying the case raised serious questions about room security at Travelodge hotels.\nSince then, dozens of people have shared experiences of strangers entering their rooms, including a domestic abuse victim whose abuser was given a key to her room at a Travelodge in London.\nThen-Prime Minister Sir Keir Starmer wrote to Boydell in March urging her to \"seriously engage\" with the government over security. Greaney was appointed to lead the review the following month.\nThe review makes 38 recommendations, including moving towards a system that requires guests to show ID to get a room key, which Travelodge has been trialling at some hotels since May.\nIt also calls for body-worn cameras for reception staff, better checks that staff have understood their training, and for housekeepers to always send guests to reception.\nGreaney said Travelodge must \"urgently\" create a policy on violence against women and girls, drawn up with the Suzy Lamplugh Trust, and train all staff in it.\nThe review said changes made this year had been done quickly \"albeit years too late\" and its new key security policy would prevent a repeat of the Maidenhead attack if applied correctly.\nBut it found the policy was \"not being applied with anything like sufficient consistency on the ground\".\nMystery shoppers were able to get into rooms through housekeeping staff at all five hotels tested, including Maidenhead, without being sent to reception or asked for proof they were entitled to enter.\nAt three of the hotels, staff confirmed a guest was staying there, and at two, room numbers were said out loud at check-in. The Maidenhead hotel scored worst of the five.\nOther recommendations included networked CCTV across the chain and key card-controlled access to all residential corridors.\nGreaney said room intrusions were a problem across the hotel sector.\nHe praised the woman's courage and determination, saying the problems would have remained \"beneath the surface\" had she not shared her experience.\nFreddie van Mierlo, the Liberal Democrat MP for Henley and Thame, where Travelodge is based, said he was worried the company was \"still trying to do safety on the cheap\".\nHe said the review's recommendations would require \"significant capital investment\", and Travelodge needed to make clear it was prepared to deliver that.\nRay Reidy, Travelodge's interim chief executive, said the review made clear there were failures in its policies and in the way customers had been treated.\n\"I apologise unreservedly on behalf of Travelodge to all guests where we have failed,\" he said.\n\"We have made significant progress in preventing and addressing these issues over the past six months, and we recognise we still have further to go.\"\nTravelodge said a new board committee would oversee the changes, with independent assessments of its progress after six and 12 months.\nGet in touch\nDo you have a story BBC Berkshire should cover?",

serious questions about room security at Travelodge hotels.\nSince then, dozens of people have shared experiences of strangers entering their rooms, including a domestic abuse victim whose abuser was given a key to her room at a Travelodge in London.\nThen-Prime Minister Sir Keir Starmer wrote to Boydell in March urging her to \"seriously engage\" with the government over security. Greaney was appointed to lead the review the following month.\nThe review makes 38 recommendations, including moving towards a system that requires guests to show ID to get a room key, which Travelodge has been trialling at some hotels since May.\nIt also calls for body-worn cameras for reception staff, better checks that staff have understood their training, and for housekeepers to always send guests to reception.\nGreaney said Travelodge must \"urgently\" create a policy on violence against women and girls, drawn up with the Suzy Lamplugh Trust, and train all staff in it.\nThe review said changes made this year had been done quickly \"albeit years too late\" and its new key security policy would prevent a repeat of the Maidenhead attack if applied correctly.\nBut it found the policy was \"not being applied with anything like sufficient consistency on the ground\".\nMystery shoppers were able to get into rooms through housekeeping staff at all five hotels tested, including Maidenhead, without being sent to reception or asked for proof they were entitled to enter.\nAt three of the hotels, staff confirmed a guest was staying there, and at two, room numbers were said out loud at check-in. The Maidenhead hotel scored worst of the five.\nOther recommendations included networked CCTV across the chain and key card-controlled access to all residential corridors.\nGreaney said room intrusions were a problem across the hotel sector.\nHe praised the woman's courage and determination, saying the problems would have remained \"beneath the surface\" had she not shared her experience.\nFreddie van Mierlo, the Liberal Democrat MP for Henley and Thame, where Travelodge is based, said he was worried the company was \"still trying to do safety on the cheap\".\nHe said the review's recommendations would require \"significant capital investment\", and Travelodge needed to make clear it was prepared to deliver that.\nRay Reidy, Travelodge's interim chief executive, said the review made clear there were failures in its policies and in the way customers had been treated.\n\"I apologise unreservedly on behalf of Travelodge to all guests where we have failed,\" he said.\n\"We have made significant progress in preventing and addressing these issues over the past six months, and we recognise we still have further to go.\"\nTravelodge said a new board committee would oversee the changes, with independent assessments of its progress after six and 12 months.\nGet in touch\nDo you have a story BBC Berkshire should cover?",

    "titleJa": "Trump's AI rebrand causes 'unprecedented' demand for Slovenian website names",
    "summaryJa": "The president wants AI to be called super intelligence - or SI - the same initials used by Slovenian domains.",
    "bodyOriginal": "Trump's AI rebrand causes 'unprecedented' demand for Slovenian website names\n- Published\nPresident Donald Trump's push to rename AI may be behind an \"unprecedented\" rise in registrations for domain names in Slovenia, according to its official national registry.\nThe president wants AI to be called super intelligence - or SI - the same initials used by Slovenian websites.\nRegister.si spokesperson Klara Herman said 44,000 web addresses with the .si suffix had been registered in September, compared to less than 2,000 in August - an increase of more than 2,100%.\nShe said the scale of activity in late September was \"unprecedented\" compared to the previous 12 months.\nPresident Trump called for the technology to be renamed during his speech to the United Nations General Assembly in New York on 11 September.\n\"The use of the word artificial makes it sound fake,\" he said.\n\"It's not fake, it's actually amazing. But we have to be careful... welcome to the new world of super intelligence.\"\nInternet domains are the unique human-readable addresses people type into their web browsers to access websites - like bbc.co.uk.\nHerman said registrations for .si web addresses in September stood out \"very clearly\" against the other months in the year, although she was \"cautious\" about attributing the entire increase to only President Trump's comments.\nShe said on 30 September alone, 11,000 new registrations were recorded.\nOne possible explanation for the purchases is cyber-squatting - where people speculatively register specific domain names in case they increase in value later on and can be sold for a profit.\nFor example, in 1997 Rick Schwartz, known as \"The Domain King\", bought the domain name men.com for $15,000 (£11,300). He sold it for $1.32 million seven years later.\nOn Tuesday, President Trump hosted a meeting of top technology bosses for what he called \"an extraordinary gathering\" of the people \"building America's Golden Age\".\nHe signed an executive order instructing US government departments and agencies to start using the terms \"SI\" and \"Super Intelligence\" and they should no longer acknowledge the use of the term AI.\nSI will take the place of AI in \"official correspondence\", websites, reports and other forms of communication, the order said.\nImages of the signatures for the order were mocked online, external however - when it was discovered \"United States\" had been spelt incorrectly underneath President Trump's signature.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n- Published1 day ago\n- Published1 day ago",

    "id": "japan-s-prime-minister-says-her-policies-d3407673",
    "title": "Japan's prime minister says her policies will boost confidence in the yen after U.S. intervention falls short",
    "titleJa": "Japan's prime minister says her policies will boost confidence in the yen after U.S. intervention falls short",
    "summaryJa": "Japan's Prime Minister said her government's policies will lift confidence in the yen, following underwhelming success in prior efforts to boost the currency.",
    "bodyOriginal": "Japan's Prime Minister said on Thursday that her government's policies will lift market confidence in the yen, after previous efforts to boost the currency, including U.S. intervention, underwhelmed.\nSanae Takaichi told Nippon Television, in comments translated by Reuters, that she told U.S. President Donald Trump that the currency's undervaluation was a problem when the pair spoke last month.\n\"Our economic policy is not aimed at manipulating exchange rates,\" Takaichi said.\n\"My administration aims to boost Japan's growth potential by increasing the economy's supply capacity through bold investment in crisis management and growth areas.\"\n\"Such efforts would strengthen Japan's global competitiveness, thereby helping ensure market confidence in the yen.\"\nA joint U.S.-Japan intervention to support the yen, along with the Bank of Japan's 25 basis point September rate hike, helped make the yen the G10's top-performing currency in the third quarter, adding 3.3% against the dollar, according to Deutsche Bank data.\nThe dollar traded at 158.37 yen, as of 5.57 a.m. ET Thursday, down from a peak above 163 in late July but up by around 7.65% over the last year.\nSociete Generale's chief FX strategist, Kit Juckes, wrote in a Wednesday note that there is \"a strong market perception that further USD/JPY intervention is likely in the near future,\" with current pricing reflecting investors' \"reluctance to be caught out by intervention.\"\n\"Another spike in oil prices could easily reverse the recent improvement in risk sentiment, however, and caution still seems warranted,\" he added.\nFX strategists at OCBC Group Research, Sim Moh Siong and Christopher Wong, said in a Monday note that the yen's \"cheap valuation has done little to ease depreciation pressures.\"\n\"While the threat of further intervention should limit disorderly depreciation, intervention alone is unlikely to deliver a sustained recovery without support from domestic policy changes,\" they added.\nYen weakness is a headache for Japan's policymakers\nThe yen's weakness has pushed up Japanese import costs and broader inflation, with Takaichi's spending plans blamed by critics for pressure on the currency and higher bond yields.\nU.S. policymakers are thought to be concerned about yen weakness as it could prompt Japan to sell down its Treasury holdings.\nJapan holds the largest share of Treasurys among foreign buyers, according to the Treasury Department, with more than $1.1 trillion of U.S. debt.\nThe Japanese government will set spending at levels consistent with lowering Japan's debt-to-GDP ratio and \"appropriately manage\" the size of bond issuances, Takaichi said.\n\"We will secure funding in responding to fiscal needs,\" she added.",

ey added.\nYen weakness is a headache for Japan's policymakers\nThe yen's weakness has pushed up Japanese import costs and broader inflation, with Takaichi's spending plans blamed by critics for pressure on the currency and higher bond yields.\nU.S. policymakers are thought to be concerned about yen weakness as it could prompt Japan to sell down its Treasury holdings.\nJapan holds the largest share of Treasurys among foreign buyers, according to the Treasury Department, with more than $1.1 trillion of U.S. debt.\nThe Japanese government will set spending at levels consistent with lowering Japan's debt-to-GDP ratio and \"appropriately manage\" the size of bond issuances, Takaichi said.\n\"We will secure funding in responding to fiscal needs,\" she added.",

    "id": "10-year-treasury-yield-hits-highest-leve-ebe0a571",
    "title": "10-year Treasury yield hits highest level since 2002 as global bond rout gathers pace",
    "titleJa": "10-year Treasury yield hits highest level since 2002 as global bond rout gathers pace",
    "summaryJa": "Treasury yields were higher on Thursday amid a global sell-off in government debt.",
    "bodyOriginal": "U.S. Treasury yields hit their highest level in more than two decades on Thursday as a global bond sell-off deepened.\nThe 10-year Treasury yield breached a level last seen in April 2002, rising 4 basis points to 5.3338%, according to LSEG data. The figure is key to rates for mortgage borrowing, auto loans and credit card debt.\nThe yield on the 30-year Treasury bond jumped 3 basis points to 5.6702%, its highest level since July 2002. The 2-year yield was 2 basis points higher at 4.91%.\nYields and prices move inversely. One basis point equals 0.01%.\nLoading chart...\nGovernment borrowing costs rose around the world on Thursday, continuing a months-long trend as investors express concerns over a lack of political action to tackle fiscal deficits, while inflation remains sticky and interest rates rise.\nMajor economies face \"persistently large deficits and rising interest expenses — challenges long associated with debt-distressed emerging market sovereigns,\" the Institute of International Finance said last week.\nJapan's 10-year yield was last seen at 3.126%, the highest level in three decades. Japan's globally influential debt has come under pressure from a weaker yen and rate hikes by the Bank of Japan.\nThe yield on the German 10-year bund, the benchmark for the euro area, was up 4 basis points at 3.6179% — its highest since 2008. Elsewhere in Europe, the French 10-year popped 11 basis points to 4.9501%, Italy's 10-year was up 10 basis points to 4.7171%, while the U.K.'s 10-year yield was up 5 basis points to 5.483%.\nBonds are increasingly moving in lockstep with oil prices, which have been turbulent amid the U.S. and Israel's war with Iran obstructing crude exports from the Middle East. Crude oil prices were higher on Thursday, with international benchmark Brent Crude back above $100 a barrel.\n\"We could see [bond] buyers come in effectively to take advantage of those yields, which would have the effect of causing them to go down, but also one of the things that has kept the volatility in those yields in the long end of the curve has been what's going on with oil, what's going on with inflation,\" Nomi Prins, founder of Prinsights Global, told CNBC's \"Squawk Box Europe\" on Thursday.\nBut sovereign wealth funds and central banks, among the main long-term holders of Treasury debt, are unlikely to do this, Prins said.\n\"We could see movement ... in Treasury yields going down if oil prices go down significantly, if there's a resolution\" in the Middle East, Prins added.",
    "bodyJa": "U.S. Treasury yields hit their highest level in more than two decades on Thursday as a global bond sell-off deepened.\nThe 10-year Treasury yield breached a level last seen in April 2002, rising 4 basis points to 5.3338%, according to LSEG data. The figure is key to rates for mortgage borrowing, auto loans and credit card debt.\nThe yield on the 30-year Treasury bond jumped 3 basis points to 5.6702%, its highest level since July 2002. The 2-year yield was 2 basis points higher at 4.91%.\nYields and prices move inversely. One basis point equals 0.01%.\nLoading chart...\nGovernment borrowing costs rose around the world on Thursday, continuing a months-long trend as investors express concerns over a lack of political action to tackle fiscal deficits, while inflation remains sticky and interest rates rise.\nMajor economies face \"persistently large deficits and rising interest expenses — challenges long associated with debt-distressed emerging market sovereigns,\" the Institute of International Finance said last week.\nJapan's 10-year yield was last seen at 3.126%, the highest level in three decades. Japan's globally influential debt has come under pressure from a weaker yen and rate hikes by the Bank of Japan.\nThe yield on the German 10-year bund, the benchmark for the euro area, was up 4 basis points at 3.6179% — its highest since 2008. Elsewhere in Europe, the French 10-year popped 11 basis points to 4.9501%, Italy's 10-year was up 10 basis points to 4.7171%, while the U.K.'s 10-year yield was up 5 basis points to 5.483%.\nBonds are increasingly moving in lockstep with oil prices, which have been turbulent amid the U.S. and Israel's war with Iran obstructing crude exports from the Middle East. Crude oil prices were higher on Thursday, with international benchmark Brent Crude back above $100 a barrel.\n\"We could see [bond] buyers come in effectively to take advantage of those yields, which would have the effect of causing them to go down, but also one of the things that has kept the volatility in those yields in the long end of the curve has been what's going on with oil, what's going on with inflation,\" Nomi Prins, founder of Prinsights Global, told CNBC's \"Squawk Box Europe\" on Thursday.\nBut sovereign wealth funds and central banks, among the main long-term holders of Treasury debt, are unlikely to do this, Prins said.\n\"We could see movement ... in Treasury yields going down if oil prices go down significantly, if there's a resolution\" in the Middle East, Prins added.",

    "id": "the-u-s-just-made-it-much-easier-for-ret-232f171c",
    "title": "The U.S. just made it much easier for retail investors to access private markets",
    "titleJa": "The U.S. just made it much easier for retail investors to access private markets",
    "summaryJa": "The Securities and Exchange Commission has approved new plans to open private markets up to retail investors.",
    "bodyOriginal": "The Securities and Exchange Commission has greenlit sweeping plans to widen access to private markets to individual investors — just as the industry's rush into retail faces sharper scrutiny.\nSEC chairman Paul Atkins said investor demand for private market investment opportunities is growing, adding that exposure to \"one of the great engines of American enterprise\" should \"not be reserved for the wealthiest or for those deemed to be the most sophisticated.\"\nThe proposals, approved Wednesday by the U.S. regulator, would seek to expand the number and type of ways for individuals to qualify as accredited investors.\n\"One of my priorities for the Commission is to explore ways to facilitate the ability of individual investors to participate in private markets, while at the same time protecting those investors from bad actors and fraud,\" Atkins said in a statement.\nThe SEC proposals include permitting registered investment advisers (RIAs) to charge performance fees of up to 20% — a level comparable to fees historically used in the hedge fund and alternatives space — to draw more private asset managers into the retail wealth space.\nThe Trump administration has been keen to ease regulatory guardrails on private markets and expand access to ordinary investors. Last August, U.S. President Donald Trump signed an executive order, titled 'Democratizing Access to Alternative Assets for 401(k) Investors', which allows Americans to put more of their retirement plans into private equity and other alternatives.\nRetail investors in the private space\nBut the move comes as the private assets industry's push into the retail wealth space has drawn closer scrutiny, largely because the harder-to-sell, higher-yielding assets on offer do not fit neatly with retail investors' expectations of easy access to their money.\nSome so-called \"semi-liquid\" private credit business development vehicles saw a surge in redemption requests earlier this year, as investors — including retail clients — scrambled to withdraw their money amid concerns over risky software debt.\nIn February, Blue Owl Capital paused regular quarterly cash redemptions in its U.S. retail-focused Blue Owl Capital Corporation II fund, after a rise in investor withdrawal requests.\nOther private credit managers, including Blackstone and Apollo, also received repurchase requests that exceeded their funds' existing quarterly limits.\nBlackstone's Chief Operating Officer and President Jon Gray told CNBC in March that gating measures are \"really a feature, not a bug\" of private credit vehicles.",
    "bodyJa": "The Securities and Exchange Commission has greenlit sweeping plans to widen access to private markets to individual investors — just as the industry's rush into retail faces sharper scrutiny.\nSEC chairman Paul Atkins said investor demand for private market investment opportunities is growing, adding that exposure to \"one of the great engines of American enterprise\" should \"not be reserved for the wealthiest or for those deemed to be the most sophisticated.\"\nThe proposals, approved Wednesday by the U.S. regulator, would seek to expand the number and type of ways for individuals to qualify as accredited investors.\n\"One of my priorities for the Commission is to explore ways to facilitate the ability of individual investors to participate in private markets, while at the same time protecting those investors from bad actors and fraud,\" Atkins said in a statement.\nThe SEC proposals include permitting registered investment advisers (RIAs) to charge performance fees of up to 20% — a level comparable to fees historically used in the hedge fund and alternatives space — to draw more private asset managers into the retail wealth space.\nThe Trump administration has been keen to ease regulatory guardrails on private markets and expand access to ordinary investors. Last August, U.S. President Donald Trump signed an executive order, titled 'Democratizing Access to Alternative Assets for 401(k) Investors', which allows Americans to put more of their retirement plans into private equity and other alternatives.\nRetail investors in the private space\nBut the move comes as the private assets industry's push into the retail wealth space has drawn closer scrutiny, largely because the harder-to-sell, higher-yielding assets on offer do not fit neatly with retail investors' expectations of easy access to their money.\nSome so-called \"semi-liquid\" private credit business development vehicles saw a surge in redemption requests earlier this year, as investors — including retail clients — scrambled to withdraw their money amid concerns over risky software debt.\nIn February, Blue Owl Capital paused regular quarterly cash redemptions in its U.S. retail-focused Blue Owl Capital Corporation II fund, after a rise in investor withdrawal requests.\nOther private credit managers, including Blackstone and Apollo, also received repurchase requests that exceeded their funds' existing quarterly limits.\nBlackstone's Chief Operating Officer and President Jon Gray told CNBC in March that gating measures are \"really a feature, not a bug\" of private credit vehicles.",

    "summaryJa": "The author of a major report into youth activity in the UK says children as young as four should be learning about careers.",
    "bodyOriginal": "Employers should teach primary-age children about work, says Milburn\n- Published\nChildren should be introduced to the world of work at the start of primary school, says the author of a major report into youth activity in the UK.\nFormer minister Alan Milburn says children as young as four should be learning about different careers, with work experience placements made mandatory for 14- to 16-year-olds.\nHowever, teaching unions warn of the \"significant pressure\" already facing primary schools and say practical considerations must ensure all schools have access to the support.\nThe latest data from the Office for National Statistics (ONS) suggests 981,000 people aged 16 to 24 in the UK were not in education, employment or training (known as Neet), between April and June 2026.\nMilburn told the BBC \"in primary school, it's really about opening their eyes and giving them a sense about what is possible\".\nDespite a push towards apprenticeships and work experience in Years 10 and 11, for many the journey towards becoming Neet starts well before their 16th birthday.\nAs a result, Milburn says children should be introduced to the world of work much earlier in their school journey, with dedicated space in the curriculum to \"broaden horizons\".\nHe told the BBC this could be achieved by employers giving talks in primary schools and offering taster sessions to children.\n\"It'd be good if employers came into schools and said, 'Look, this is what's going on, these are things that are possible.'\"\nMilburn says that for Key Stage 4 pupils - aged between 14 and 16 - experience must be given in a real workplace with employer feedback.\n\"Work experience needs to be mandatory. It makes a big difference,\" he told the BBC.\nMilburn also emphasised the difficulty some young people face when trying to find work experience placements.\n\"There are about four in ten people aged 14-16 who aren't getting any work experience at all,\" he said. \"In other schools, students are told to go off and find their own work experience and that often relies on the network of Mum and Dad.\"\nPolitical Thinking with Nick Robinson\nWe're failing the next generation: Alan Milburn on getting young people into work\nThese recommendations are due to be published in the final instalment of his government-commissioned report into the issue, which is expected to be published in the autumn.\nEducation is devolved in the UK, so while Milburn's review looks at the picture in all four nations, his recommendations regarding education are specific to England.\nCurrently in England, careers guidance must be offered to students aged 11-18 and work experience is not statutory.\nThe government has said its vision, external is to \"guarantee two weeks' worth of work experience for every young person\" in England.\nIn both Scotland and Wales, career-based learning is already a requirement in schools for students as young as three.\nEmma, from Kirklees, has grandchildren in Years 1, 2 and 4 and thinks primary school is too young to be introducing careers talks.\n\"In primary school, there is too much trying to get little kids to grow up too quickly,\" she says.\n\"Just let them be little kids. I know they have to learn and the world's changing, but still, give them a chance to be kids.\"\nBut Zoe, another parent, disagrees.\n\"I think it's a good idea,\" she says. \"It's something that everyone has to do, so if you learn early, it's something they don't have to learn later on.\"\nTeaching unions have responded positively to the idea of introducing career-based learning into schools at a younger age, but have warned about the burden this could place on primary schools in particular.\nPaul Whiteman, general secretary of school leaders' union National Association of Head Teachers (NAHT), warns of the \"significant pressure\" already facing primary schools.\n\"Whenever new mandatory requirements are proposed, it is important to be clear about what might have to give way to make room for them,\" he says.\nWhiteman also highlights the value of existing programmes such as \"Primary Futures\", which bring in volunteers from different professions into schools to \"challenge stereotypes and raise aspirations\".\n\"The earlier young people can begin to make connections between what they learn in school and the possibilities that lie ahead, the better,\" Whiteman says.\nPepe Di'Iasio, general secretary of the Association of School and College Leaders (ASCL), says having someone come into the classroom can really \"enlighten [children's] motivation... and give them that sense of passion for all the opportunities beyond the classroom\". Although he acknowledges that finding opportunities in rural areas could be more challenging.\nGet in touch\nAre you affected by issues covered in this story?\nRelated topics\n- Published17 September",
    "bodyJa": "Employers should teach primary-age children about work, says Milburn\n- Published\nChildren should be introduced to the world of work at the start of primary school, says the author of a major report into youth activity in the UK.\nFormer minister Alan Milburn says children as young as four should be learning about different careers, with work experience placements made mandatory for 14- to 16-year-olds.\nHowever, teaching unions warn of the \"significant pressure\" already facing primary schools and say practical considerations must ensure all schools have access to the support.\nThe latest data from the Office for National Statistics (ONS) suggests 981,000 people aged 16 to 24 in the UK were not in education, employment or training (known as Neet), between April and June 2026.\nMilburn told the BBC \"in primary school, it's really about opening their eyes and giving them a sense about what is possible\".\nDespite a push towards apprenticeships and work experience in Years 10 and 11, for many the journey towards becoming Neet starts well before their 16th birthday.\nAs a result, Milburn says children should be introduced to the world of work much earlier in their school journey, with dedicated space in the curriculum to \"broaden horizons\".\nHe told the BBC this could be achieved by employers giving talks in primary schools and offering taster sessions to children.\n\"It'd be good if employers came into schools and said, 'Look, this is what's going on, these are things that are possible.'\"\nMilburn says that for Key Stage 4 pupils - aged between 14 and 16 - experience must be given in a real workplace with employer feedback.\n\"Work experience needs to be mandatory. It makes a big difference,\" he told the BBC.\nMilburn also emphasised the difficulty some young people face when trying to find work experience placements.\n\"There are about four in ten people aged 14-16 who aren't getting any work experience at all,\" he said. \"In other schools, students are told to go off and find their own work experience and that often relies on the network of Mum and Dad.\"\nPolitical Thinking with Nick Robinson\nWe're failing the next generation: Alan Milburn on getting young people into work\nThese recommendations are due to be published in the final instalment of his government-commissioned report into the issue, which is expected to be published in the autumn.\nEducation is devolved in the UK, so while Milburn's review looks at the picture in all four nations, his recommendations regarding education are specific to England.\nCurrently in England, careers guidance must be offered to students aged 11-18 and work experience is not statutory.\nThe government has said its vision, external is to \"guarantee two weeks' worth of work experience for every young person\" in England.\nIn both Scotland and Wales, career-based learning is already a requirement in schools for students as young as three.\nEmma, from Kirklees, has grandchildren in Years 1, 2 and 4 and thinks primary school is too young to be introducing careers talks.\n\"In primary school, there is too much trying to get little kids to grow up too quickly,\" she says.\n\"Just let them be little kids. I know they have to learn and the world's changing, but still, give them a chance to be kids.\"\nBut Zoe, another parent, disagrees.\n\"I think it's a good idea,\" she says. \"It's something that everyone has to do, so if you learn early, it's something they don't have to learn later on.\"\nTeaching unions have responded positively to the idea of introducing career-based learning into schools at a younger age, but have warned about the burden this could place on primary schools in particular.\nPaul Whiteman, general secretary of school leaders' union National Association of Head Teachers (NAHT), warns of the \"significant pressure\" already facing primary schools.\n\"Whenever new mandatory requirements are proposed, it is important to be clear about what might have to give way to make room for them,\" he says.\nWhiteman also highlights the value of existing programmes such as \"Primary Futures\", which bring in volunteers from different professions into schools to \"challenge stereotypes and raise aspirations\".\n\"The earlier young people can begin to make connections between what they learn in school and the possibilities that lie ahead, the better,\" Whiteman says.\nPepe Di'Iasio, general secretary of the Association of School and College Leaders (ASCL), says having someone come into the classroom can really \"enlighten [children's] motivation... and give them that sense of passion for all the opportunities beyond the classroom\". Although he acknowledges that finding opportunities in rural areas could be more challenging.\nGet in touch\nAre you affected by issues covered in this story?\nRelated topics\n- Published17 September",

    "title": "UK Prime Minister Burnham says Iran 'played a part' in British air base incident",
    "titleJa": "UK Prime Minister Burnham says Iran 'played a part' in British air base incident",
    "summaryJa": "RAF Fairford has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.",
    "bodyOriginal": "United Kingdom Prime Minister Andy Burnham said Iran was involved in the incident at the Royal Air Force base in Fairford on Sunday that led to the arrest of five men on suspicion of explosive and terrorism offences.\nSpeaking to the BBC Wednesday, Burnham said that \"There are strong indications that Iran played a part in what happened over the weekend at RAF Fairford,\" without providing additional details. In response, Iranian Foreign Minister Abbas Araghchi said on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, located in Gloucestershire, has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.\nLondon had initially denied the U.S. permission to use UK bases for its war on Iran, but former Prime Minister Keir Starmer had allowed it for \"defensive strikes.\"\nBurnham's BBC interview comes as U.S. Secretary of State Marco Rubio told Fox News on Monday that the incident at RAF Fairford \"clearly involves the hands of a foreign actor,\" without giving any details or evidence.\nThe Iranian Embassy in London on Monday \"categorically\" rejected speculation linking the country to the alleged plot.\nAll the five arrested suspects are UK nationals aged between 23 and 25, and one reportedly called the police himself. They have been released on bail.\nIran UNGA delegation leaves U.S.\nSeparately, a U.S. official told MS NOW that Rubio \"kicked out\" the Iranian delegation as the United Nations General Assembly was over, saying that they had \"overstayed their welcome.\"\nThe officials, including Aragachi, left on Monday morning U.S. time. \"UNGA was over, so it was time for them to go,\" the official added.\nIndirect negotiations between Washington and Tehran over Iran's nuclear program and the Strait of Hormuz failed to bear any fruit over the course of the U.N. General Assembly.\nTehran had proposed a seven-day deal at the UNGA, under which the Strait of Hormuz would be opened and nuclear talks resumed with the U.S. if Washington returned to the terms of the Islamabad deal framework.\nThe Islamabad memorandum of understanding in June led to a ceasefire agreement between the U.S. and Iran that collapsed in early July. The Trump administration is unwilling to return to the terms of the June agreement, according to a report by the Wall Street Journal.\nPresident Donald Trump on Sunday called the latest Iranian proposal \"unacceptable,\" telling reporters that Tehran wants a swift deal because of the economic pressure it is under.\n— CNBC's Anniek Bao contributed to this report.",
    "bodyJa": "United Kingdom Prime Minister Andy Burnham said Iran was involved in the incident at the Royal Air Force base in Fairford on Sunday that led to the arrest of five men on suspicion of explosive and terrorism offences.\nSpeaking to the BBC Wednesday, Burnham said that \"There are strong indications that Iran played a part in what happened over the weekend at RAF Fairford,\" without providing additional details. In response, Iranian Foreign Minister Abbas Araghchi said on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, located in Gloucestershire, has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.\nLondon had initially denied the U.S. permission to use UK bases for its war on Iran, but former Prime Minister Keir Starmer had allowed it for \"defensive strikes.\"\nBurnham's BBC interview comes as U.S. Secretary of State Marco Rubio told Fox News on Monday that the incident at RAF Fairford \"clearly involves the hands of a foreign actor,\" without giving any details or evidence.\nThe Iranian Embassy in London on Monday \"categorically\" rejected speculation linking the country to the alleged plot.\nAll the five arrested suspects are UK nationals aged between 23 and 25, and one reportedly called the police himself. They have been released on bail.\nIran UNGA delegation leaves U.S.\nSeparately, a U.S. official told MS NOW that Rubio \"kicked out\" the Iranian delegation as the United Nations General Assembly was over, saying that they had \"overstayed their welcome.\"\nThe officials, including Aragachi, left on Monday morning U.S. time. \"UNGA was over, so it was time for them to go,\" the official added.\nIndirect negotiations between Washington and Tehran over Iran's nuclear program and the Strait of Hormuz failed to bear any fruit over the course of the U.N. General Assembly.\nTehran had proposed a seven-day deal at the UNGA, under which the Strait of Hormuz would be opened and nuclear talks resumed with the U.S. if Washington returned to the terms of the Islamabad deal framework.\nThe Islamabad memorandum of understanding in June led to a ceasefire agreement between the U.S. and Iran that collapsed in early July. The Trump administration is unwilling to return to the terms of the June agreement, according to a report by the Wall Street Journal.\nPresident Donald Trump on Sunday called the latest Iranian proposal \"unacceptable,\" telling reporters that Tehran wants a swift deal because of the economic pressure it is under.\n— CNBC's Anniek Bao contributed to this report.",

    "title": "AI boom could trigger market shocks, Bank of England boss warns",
    "titleJa": "AI boom could trigger market shocks, Bank of England boss warns",
    "summaryJa": "Andrew Bailey says the central bank is watching the waves of cash being invested in artificial intelligence \"very carefully\".",
    "bodyOriginal": "AI boom could trigger market shocks, Bank of England boss warns\n- Published\nArtificial intelligence (AI) could trigger financial market shocks and the UK needs to be prepared for them, the governor of the Bank of England has warned.\nAndrew Bailey said the central bank is watching the huge amounts of money being invested in AI \"very carefully\" and cautioned that \"not everybody always wins\".\nThe money that has been spent on and loaned to AI firms over the last few years in the hope of large returns is causing markets to value some of them as multi-trillion dollar businesses.\nAsked if he believed an AI bubble could burst, Bailey said: \"You could see some correction of asset prices at some point.\"\nHe was speaking exclusively to the BBC about what the risks and benefits of AI could be for the UK economy.\nBailey said he believed the technology has \"great potential to strengthen growth in our economies\", adding that this was something the country needed.\n\"But it also brings with it substantial risks and so we have to be on top of both of those.\"\nOne such risk is what happens if the big bets being made on AI don't pay off.\nAI chipmaker Nvidia is currently the world's most valuable listed company, with a market valuation of $5.5tn (£4.14tn), thanks largely to investors who believe in the big profits AI could create.\nMeanwhile, tech giants Alphabet, Meta, Microsoft, and Amazon are spending hundreds of billions of dollars on the technology.\nAnd two of the largest AI companies in the world – Anthropic and OpenAI – are also preparing to sell shares in their firms on the US stock market in moves which many believe will lead to hundreds of billions of dollars more flowing into the industry.\n\"There is a large, very large, amount of investment going into this sector now, and of course that's natural because it's a major area of growth,\" said Bailey.\n\"And of course you see that the asset prices of the companies that are developing it have gone up a lot and that reflects the fact that there are high expectations of what it can deliver.\"\n\"Everybody is currently priced to be a winner,\" he added, but warned that \"you look back at the past, not everybody is a winner\".\n\"Google was not the first market leader in internet search. It was Netscape. Nobody can remember Netscape today. It doesn't exist. So not everybody always wins.\n\"We are prepared for the fact that there will be, I think, some shocks come along to markets and we have to deal with that. We have to make sure the system is resilient.\"\nCyber attacks, deepfakes, and interest rates\nBailey also pointed to other risks from AI, such as from the technology being used for cyber attacks.\nHe said AI has created a \"much more powerful way of uncovering vulnerabilities\".\n\"It's revealing things that have been in bits of operating software that we've had, and all of us have had.\"\n\"In the wrong hands... it's a very powerful, potentially very powerful, weapon,\" he added.\nAnother risk is the rise of deepfakes – AI-made pictures and videos of people that look real – which can be used to fool the public.\nBailey has had first-hand experience of this. In June, deepfake images depicting him and Nigel Farage having a physical fight were promoted on social media platform X.\nHe told the BBC that the fake images were being done in such a way that the Bank has struggled to find out where they came from.\n\"We've got to be able to trace these things back. And we need a lot of help from the tech sector to do that,\" he said.\nHowever, Bailey said a big potential benefit from AI is its ability of \"speeding up the work that supports the Monetary Policy Committee [MPC]\" which sets interest rates.\n\"It's not taking a decision, but it's a tool in the hands of the policy maker and that's good,\" he said.\n- Published15 hours ago\n- Published1 day ago",
    "bodyJa": "AI boom could trigger market shocks, Bank of England boss warns\n- Published\nArtificial intelligence (AI) could trigger financial market shocks and the UK needs to be prepared for them, the governor of the Bank of England has warned.\nAndrew Bailey said the central bank is watching the huge amounts of money being invested in AI \"very carefully\" and cautioned that \"not everybody always wins\".\nThe money that has been spent on and loaned to AI firms over the last few years in the hope of large returns is causing markets to value some of them as multi-trillion dollar businesses.\nAsked if he believed an AI bubble could burst, Bailey said: \"You could see some correction of asset prices at some point.\"\nHe was speaking exclusively to the BBC about what the risks and benefits of AI could be for the UK economy.\nBailey said he believed the technology has \"great potential to strengthen growth in our economies\", adding that this was something the country needed.\n\"But it also brings with it substantial risks and so we have to be on top of both of those.\"\nOne such risk is what happens if the big bets being made on AI don't pay off.\nAI chipmaker Nvidia is currently the world's most valuable listed company, with a market valuation of $5.5tn (£4.14tn), thanks largely to investors who believe in the big profits AI could create.\nMeanwhile, tech giants Alphabet, Meta, Microsoft, and Amazon are spending hundreds of billions of dollars on the technology.\nAnd two of the largest AI companies in the world – Anthropic and OpenAI – are also preparing to sell shares in their firms on the US stock market in moves which many believe will lead to hundreds of billions of dollars more flowing into the industry.\n\"There is a large, very large, amount of investment going into this sector now, and of course that's natural because it's a major area of growth,\" said Bailey.\n\"And of course you see that the asset prices of the companies that are developing it have gone up a lot and that reflects the fact that there are high expectations of what it can deliver.\"\n\"Everybody is currently priced to be a winner,\" he added, but warned that \"you look back at the past, not everybody is a winner\".\n\"Google was not the first market leader in internet search. It was Netscape. Nobody can remember Netscape today. It doesn't exist. So not everybody always wins.\n\"We are prepared for the fact that there will be, I think, some shocks come along to markets and we have to deal with that. We have to make sure the system is resilient.\"\nCyber attacks, deepfakes, and interest rates\nBailey also pointed to other risks from AI, such as from the technology being used for cyber attacks.\nHe said AI has created a \"much more powerful way of uncovering vulnerabilities\".\n\"It's revealing things that have been in bits of operating software that we've had, and all of us have had.\"\n\"In the wrong hands... it's a very powerful, potentially very powerful, weapon,\" he added.\nAnother risk is the rise of deepfakes – AI-made pictures and videos of people that look real – which can be used to fool the public.\nBailey has had first-hand experience of this. In June, deepfake images depicting him and Nigel Farage having a physical fight were promoted on social media platform X.\nHe told the BBC that the fake images were being done in such a way that the Bank has struggled to find out where they came from.\n\"We've got to be able to trace these things back. And we need a lot of help from the tech sector to do that,\" he said.\nHowever, Bailey said a big potential benefit from AI is its ability of \"speeding up the work that supports the Monetary Policy Committee [MPC]\" which sets interest rates.\n\"It's not taking a decision, but it's a tool in the hands of the policy maker and that's good,\" he said.\n- Published15 hours ago\n- Published1 day ago",

    "title": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation",
    "titleJa": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation",
    "summaryJa": "The U.S. announced plans for up to $200 billion in South Korean investment, though Seoul has yet to finalize the participation in the Alaska LNG project.",
    "bodyOriginal": "South Korea's \"historic\" $200 billion investment into the U.S., which President Donald Trump said would transform his country \"for generations,\" is not a done deal in totality.\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\nThe joint joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.\nOverall, the investment package includes $22.3 billion for a 6,472-megawatt natural gas power facility in Encinal, Texas, that will supply electricity to co-located data centers. The project will be led by developer Related Companies and U.S. power company NextEra Energy, with the first phase expected to begin commercial operations in 2029 and the full facility coming online in stages by 2032.\nTrump said the investments would turn South Korea's commitments into \"huge construction projects\" and create \"tens of thousands of American jobs.\"\n\"These are massive energy projects, adding power capacity in the United States,\" Trump said. \"This is new construction, new manufacturing, and great jobs for American workers.\"\nThe two countries said they would seek to expand Korean companies' participation in the Texas project across equipment supply, engineering and construction, as well as long-term operations and maintenance. The U.S. also intends to give Korean companies opportunities to supply equipment, including turbines, to similar projects in the country.\nAnother $120 billion has been allocated to plans for eight large-scale nuclear reactors in the U.S. Of that amount, $100 billion is earmarked for construction costs and $20 billion for contingency reserves.\nThe nuclear agreement was signed by both governments as well as Westinghouse Electric, Korea Electric Power Corp. and Korea Hydro & Nuclear Power. The plan also calls for pursuing a potential significant minority investment in Westinghouse by Korean companies, with the terms subject to commercial negotiations.",
    "bodyJa": "South Korea's \"historic\" $200 billion investment into the U.S., which President Donald Trump said would transform his country \"for generations,\" is not a done deal in totality.\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\nThe joint joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.\nOverall, the investment package includes $22.3 billion for a 6,472-megawatt natural gas power facility in Encinal, Texas, that will supply electricity to co-located data centers. The project will be led by developer Related Companies and U.S. power company NextEra Energy, with the first phase expected to begin commercial operations in 2029 and the full facility coming online in stages by 2032.\nTrump said the investments would turn South Korea's commitments into \"huge construction projects\" and create \"tens of thousands of American jobs.\"\n\"These are massive energy projects, adding power capacity in the United States,\" Trump said. \"This is new construction, new manufacturing, and great jobs for American workers.\"\nThe two countries said they would seek to expand Korean companies' participation in the Texas project across equipment supply, engineering and construction, as well as long-term operations and maintenance. The U.S. also intends to give Korean companies opportunities to supply equipment, including turbines, to similar projects in the country.\nAnother $120 billion has been allocated to plans for eight large-scale nuclear reactors in the U.S. Of that amount, $100 billion is earmarked for construction costs and $20 billion for contingency reserves.\nThe nuclear agreement was signed by both governments as well as Westinghouse Electric, Korea Electric Power Corp. and Korea Hydro & Nuclear Power. The plan also calls for pursuing a potential significant minority investment in Westinghouse by Korean companies, with the terms subject to commercial negotiations.",

    "id": "passengers-and-crew-foil-co-pilot-s-appa-4c364129",
    "title": "Passengers and crew foil co-pilot's apparent attempt to crash FlyDubai flight to Israel",
    "titleJa": "Passengers and crew foil co-pilot's apparent attempt to crash FlyDubai flight to Israel",
    "summaryJa": "One of the pilots on a FlyDubai flight headed for Israel stabbed the second pilot, according to Israeli Prime Minister Benjamin Netanyahu.",
    "bodyOriginal": "On-duty flight crew and passengers managed to foil a pilot's apparent attempt to crash a FlyDubai flight, after reports emerged of a fight in the cockpit.\nThe incident on flight FZ1073 from Dubai to Tel Aviv happened when a co-pilot stabbed a pilot, according to Israeli Prime Minister Benjamin Netanyahu, who praised the victim's quick thinking.\n\"Despite being stabbed and seriously injured, he fought back, resisted, opened the cockpit door, and enabled passengers and crew to overpower the attacker — preventing a catastrophic mid-air disaster. He saved the lives of 174 people, including Israeli citizens and other nationals,\" Netanyahu wrote in a post on X.\nFZ1073 was diverted to the Tabuk airport in Saudi Arabia, the airline said, after being successfully secured and diverted by flight crew.\nFlyDubai in a statement said that an \"altercation\" occurred on the flight deck of the plane, but did not mention a stabbing.\nHowever, the airline added that the underlying reasons and motives for the clash is currently unknown, urging all parties to refrain from speculation.\nThe injured pilot was identified by Netanyahu as Indian national Smit Machchhar. No details have been released on the identity of the attacker, except that he was being interrogated by Saudi authorities.\nThe Indian embassy in Riyadh said on X that Machchhar is in a hospital in Tabuk, and is reported to be in stable condition.\nThe Israeli Prime Minister also identified the passenger who broke into the cockpit as Yaniv Hayun, calling him a \"hero\" and adding he deserved \"a global medal of honor.\"\nFlight data from tracking site FlightRadar24 showed that the plane had experienced extreme altitude fluctuations before broadcasting a \"general emergency\" squawk code.\nFZ1073 had dropped from over 14,000 feet in just 29 seconds, and FlightRadar24 also added that vertical speeds ranging from approximately -30,000 to +10,000 feet per minute were observed from the transponder data.\nFor context, vertical speeds during normal operations rarely exceed plus or minus 4,000 feet per minute, it added.",

    "title": "California Gov. Gavin Newsom bans AI 'robo bosses' in landmark state law, reversing his earlier veto",
    "titleJa": "California Gov. Gavin Newsom bans AI 'robo bosses' in landmark state law, reversing his earlier veto",
    "summaryJa": "California Governor Gavin Newsom has banned 'robo-bosses' from firing workers, the first U.S. state with such a law.",
    "bodyOriginal": "California Governor Gavin Newsom has signed a landmark AI law banning Golden State employers from relying solely on artificial intelligence to fire or discipline workers.\nSB 947, dubbed the No Robo Bosses Act, prevents businesses around the state from exclusively using \"automated decision-making systems\" in matters of employee discipline and termination. It also restricts their capacity to use AI as a principal tool in such decisions.\nUnder the bill, employers that rely \"primarily\" on AI output to make termination or disciplinary decisions must now have a human reviewer corroborate those decisions using additional information, such as managerial evaluations, peer reviews, and personnel files. Additionally, affected employees must be provided with written notice that AI was \"primarily used\" in their termination or disciplinary decision, a description of the employee data used by the system, and a human point of contact who can further explain the decision.\n\"No worker should ever be fired or disciplined by a machine, AI or not. Artificial intelligence systems have the potential to boost productivity, but they've also made errors and misjudgments and exhibited bias,\" California State Senator Jerry McNerney, the bill's author, told CNBC. \"AI must remain a tool controlled by humans, not the other way around.\"\nMcNerney, a Democrat, first introduced the act in 2025, following a concerted push by organized labor in the state to erect guardrails around management's ability to use AI in taking adverse action against workers.\n\"When working people organize, we get results. Workers across California have demanded that our state lead the way in regulating AI in our workplaces. And today, we see that begin to happen,\" said Lorena Gonzalez, president of the California Federation of Labor Unions, AFL-CIO and lead sponsor of No Robo Bosses Act, in a statement after Newsom signed it. \"Today, California's workers and our unions have changed the national narrative on how Americans can fight back and win against AI taking over our jobs and workplaces.\"\nNewsom has taken a flurry of recent actions on AI, including signing a broader executive order earlier this month addressing the potential existential risks posed by AI models \"before it's too late,\" and a measure to provide a state framework for independent evaluation and auditing of AI models. Newsom said of the broad EO that the federal government was abdicating \"its responsibility to protect Americans.\"\nThe U.S. is leading the way globally in adoption of automated management software and systems, according to survey results from the OECD published late last year. It found that algorithmic management software is being widely adopted across countries, but nowhere as widely as in the U.S., where 90% of managers say their firms have adopted at least one tool to \"instruct, monitor or evaluate workers.\"\nMeta is facing a lawsuit, filed in July, in which former employees allege AI-assisted systems were used to rank and select workers for layoffs, disproportionately affecting employees who had taken medical or family leave. Meta has denied the allegations.\nWalmart and Amazon workers are increasingly concerned that HR decisions are being automated, according to a May survey released by nonprofit United for Respect, which has its roots in the labor movement and retail sector specifically. The nonprofit failed in an effort last summer to convince Walmart shareholders to approve a measure requiring company management to disclose more on use of AI with the workforce.\nCalifornia's No Robo Bosses Act saw its momentum hit a wall in October when Newsom vetoed it despite clearing both of the state's legislative chambers with overwhelming majority support. Among his concerns, Newsom cited a requirement that would have compelled businesses to alert workers in advance whenever an AI system was in use that could affect work conditions.\n\"I share the author's concern that in certain cases unregulated use of ADS [automated decision-making software] by employers can be harmful to workers,\" the governor noted in his explanation, previewing future willingness to accept similar legislation. \"However,\" he continued, \"rather than addressing the specific ways employers misuse this technology, the bill imposes unfocused notification requirements on any business using even the most innocuous tools.\"\nUpon re-introducing the bill in February after Newsom's resistance, McNerney removed the pre-notification requirement and stripped language that would have extended the Act's protections to gig workers, which had drawn heavy criticism from rideshare giants such as Uber and Lyft. Although these modifications have somewhat blunted the fierce lobbying efforts by tech and commerce groups that played a role in dooming the act's 2025 counterpart, California business leaders still rallied against SB 947 in the weeks leading up to its enactment.\n\"The bill's obligations generally apply when an employer 'primarily relies' on an automated decision system, but that critical term is never defined. Employers are given no objective standard for determining when a technology has moved from merely informing a decision to being a primary basis for it,\" Robert Singleton, the Chamber of Progress' senior director of policy and public affairs for California and US West, wrote in a letter to Newsom earlier this month, urging the governor to veto the bill. \"Uncertainty about whether ordinary tools qualify as regulated automated decision systems could discourage employers from using technologies that improve consistency, identify safety risks, or help managers make better-informed decisions,\" he added.\nFirst such law in nation as public turns on AI ahead of elections\nWhile the aforementioned changes were made specifically to gain Newsom's approval, No Robo Bosses backers also benefitted from the fact that, this time around, the bill hit the governor's desk amidst all-time high public distrust surrounding AI's introduction and continued presence in the workplace. A July Gallup poll found that 39% of Americans believe that AI does more harm than good, an 8% increase from the 31% who felt similarly in 2025. Pew Research, in a study released this past August, similarly found that 71% of Americans think AI will \"take people's jobs,\" an increase of around 7% from around two years ago.\nThis trend has solidified as Newsom weighs running for president in 2028, an election in which AI policy is expected to be a hot-button issue, particularly among Democratic hopefuls. But Democrats aren't alone on the issue. Earlier this month, Steve Hilton, California's Republican nominee for governor, came out in full support of the No Robo Bosses Act.\n\"The California Chamber…says rules requiring human review and basic accountability are too burdensome for employers. What a ridiculous thing for them to say,\" Hilton wrote in an open letter to Gonzalez. \"In some ways, I don't think SB 947 goes far enough,\" he wrote. \"Employers should not be allowed to use AI to decide whether someone is fired, demoted, loses regular hours, or is shut out of the program they rely on for income.\"\nCalifornia businesses will be the first to navigate its distinct regulatory framework, which establishes a largely unprecedented level of oversight over workplace AI use. Some local regulations throughout the past five years have imposed restrictions on how AI can be used in employment decisions, perhaps most notably Illinois' Public Act 103-0804, which also requires employers to notify workers when they use AI for a set of specified employment purposes. However, these restrictions have never gone to the lengths now seen under California law. Even the Illinois law, which went into effect this past January, stops short of an outright prohibition on deploying agentic digital systems for employment decisions.\nWhile the No Robo Bosses Act is the first of its kind to become law, many other bills currently sit in limbo across the nation, designed to fulfill the very same purpose. This past June, U.S. Senators Ed Markey (D.-Mass.) and Brian Schatz (D.-Hawaii), both Democrats, introduced federal legislation donning the same name, which would bar employers from \"relying on automated decision systems to make work-related decisions.\" Markey's bill, presented to a Congress that has been slow to develop any sort of legislation regulating AI, was effectively dead on arrival. A number of states, including New York, Louisiana, and New Jersey, have seen similar legislation be proposed but have yet to act on their own accord.\nEarlier this year, New York became the first state in the nation to enact a ban on the construction of new AI data centers.\nCalifornia's action may have just provided the push other states need to move on workplace AI legislation.\nLeft-leaning civil liberties nonprofit Electronic Frontier Foundation said in a statement to CNBC that signing the law is a \"strong step toward giving workers the protections they need in workplaces that use automated decisionmaking systems\" and it planned to continue its work with labor groups to \"advance policies that protect human dignity in the workplace.\"",

    "id": "the-ai-telling-farmers-when-to-harvest-ab1be124",
    "title": "The AI telling farmers when to harvest",
    "titleJa": "The AI telling farmers when to harvest",
    "summaryJa": "Will farmers want AI tools to help judge when to pick fruit, or is their own intuition enough?",
    "bodyOriginal": "The AI telling farmers when to harvest\n- Published\nWhen the first day of the apple harvest rolled around in Washington State last year, the fruit was ripe and the pickers were ready – but the weather had other ideas.\n\"It was like 38C… it's not safe for people to work in that heat,\" recalls Joel Carter at Okanagan Specialty Fruits. \"We had to stop at 10 o'clock in the morning.\"\nHe says that artificial intelligence (AI) models that forecast ideal harvest dates, taking into account the weather, would be useful. \"You need to know more than just when your fruit is going to be ripe. How long do you have to pick it?\" he says. \"That's where these models are really helpful.\"\nCarter's company has more than 1,250 acres of apple orchards in Washington, and the fruit is grown for sliced apple portions – often sold to hotels and schools, for example. The firm is investing in technology with the hope of maximising productivity. Even the apples are genetically engineered so that they don't brown easily once cut.\nBut planning a harvest is tricky. New tools that count and analyse fruit on the tree or vine, and predict when crops will ripen, are emerging. It matters because prices for fruit, especially high-value berries such as strawberries or blueberries can fluctuate wildly. Getting the harvest date wrong means you book seasonal workers when you don't actually need them, and risk missing out on the biggest profits.\nOkanagan Specialty Fruits is already experimenting with cameras from a Canadian firm called Vivid Machines. The cameras are mounted atop tractors and they scoop up imagery of the apple trees as the tractor trundles by. AI identifies buds, flowers or fruit in that footage.\n\"Right now, Vivid is telling us crop estimates and harvest dates,\" says Carter. He notes that the system is good at picking out very tiny flower buds, which are hard to see at a glance with the naked eye.\nBut the accuracy of forecasts is noticeably dependent on the quality of historical information fed in to the system, adds Carter. \"This isn't something where an AI can scrape the internet and figure out what's the average [yield] for Granny Smith,\" he explains. \"It's going to be bespoke to your farm.\"\nApples are at least somewhat forgiving – the harvest window for those Granny Smiths is three weeks long, says Carter. For other fruit, such as berries, you might only have a few days.\n\"If a strawberry crop is on, you have to harvest it – otherwise your entire crop gets diseased very, very quickly,\" says Raymond Martin, co-founder and chief operating officer of FruitCast, a UK company that offers harvest forecasts to fruit growers here.\nHis firm offers growers crop predictions for strawberries and also raspberries, blackberries, blueberries and tomatoes. \"We're moving on to grapes next year,\" adds Martin.\nDon't experienced farmers know when their fruit will be ripe, I ask? Martin says they generally do – but not necessarily across their entire farm, which might be many acres in size, or have both outdoor and indoor growing areas. \"We do exactly what the farmers could do but we just do it on a scale that they can't.\"\nThe system analyses footage of ripening fruit that can be captured by drones, someone walking up and down a field with a smartphone, or a camera mounted on a farm vehicle.\nThis year has been challenging, notes Martin, with hot weather and severe drought hitting much of the UK. This has stressed many fruit plants, putting them into thermal dormancy and slowing down fruit production.\nThe FruitCast model accounts for weather and irrigation conditions in its forecasts. The company says, \"our forecasts land within 10% of actual picked volume one week out (90% accurate) and within 17% three weeks out (83% accurate). We guarantee less than 20% error…\"\nAngus Soft Fruits is one company that has worked with FruitCast. AI tech for forecasting fruit ripeness is not yet \"a finished solution\" says operations director Neill Finlayson: \"This journey is still ongoing and, whilst significant progress has been made, the industry remains some way from achieving a fully integrated forecasting ecosystem.\"\nDriscoll's, a California headquartered fruit seller with a big operation in the UK, also confirmed to BBC News that some of its independent fruit growers in the UK have used FruitCast's technology.\nResearchers are also exploring new ways of analysing fruit in intense detail. Many farmers already use handheld brix meters to gauge the sugar content of their crop. These devices work by measuring how much light has changed direction, or refracted, after passing through a liquid – indicating the volume of solids present.\nSome such meters use infrared light, meaning there's no need to cut into the fruit to take measurements. But Yasaman Ghasempour at Princeton University says millimetre waves, high frequency radio waves, can penetrate deeper \"They basically respond very well to humidity, water [and sugar],\" she says.\nShe and her students have come up with a millimetre wave-based ripeness detector, external that could be used by farmers – or even customers searching for perfectly ripe fruit in shops. Her students tried it out at a local market in New Jersey. \"[Staff] there got kind of scared that we were doing something shady,\" laughs Ghasempour.\nSuch fine-grained analysis of fruit, if currently unripe, could also help inform forecasts of when it will be ripe.\nBut while some growers, such as Carter, are interested in trying out new tech, many will wonder whether investing in it is really worthwhile. \"Adoption is very complicated,\" says Jing Zhang at North Carolina State University. \"The grower has to have confidence in the research and whether or not it works.\"\nZhang has been working on a system to automatically count the number of blueberries, external captured in smartphone images of blueberry bushes.\nThe simplest systems need not be expensive. Kevin Wang at the University of Florida has developed another crop-counting tool that can harvest imagery, external from $100 (£74) drones.\nIn the future, such information could feed in to ripeness predictions. However, he points out that some farmers might be uneasy about sharing commercially sensitive information about their growing strategies, such as fertiliser and irrigation plans, with third parties and AI models.\nBen Palone is senior director of automation and commercialisation at Western Growers, an association that represents farmers in the western US. He says harvest forecasts have some potential as \"an optimisation tool\".\nBut farmers will likely continue to rely on human intelligence. \"Growers like to have people in the mix to make some of those very critical decisions – especially when it comes to harvests,\" he says.\n- Published19 August\n- Published12 August\n- Published7 August",
