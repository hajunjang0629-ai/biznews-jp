    "title": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election",
    "titleJa": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election",
    "summaryJa": "The Student List has emerged from almost two years of anti-corruption protests to form the biggest challenge to Vučić's rule.",
    "bodyOriginal": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election\n- Published\nIf Sunday's parliamentary elections really are a battle for the heart of Serbia, then who better than a cardiologist to be one of the leading figures in the race.\nIlija Srdanović appears an unlikely opponent for Serbia's long-serving leader, Aleksandar Vučić, arriving for an interview by motorbike sporting a fluorescent yellow jacket emblazoned with pro-student slogans.\nHe has been selected as top candidate for an opposition movement posing the most serious challenge to Vučić since the Serbian Progressive Party (SNS) entered government in 2012.\nThe Student List has emerged from almost two years of anti-corruption protests led by young Serbians, outraged by the deaths of 16 people when a railway station's canopy collapsed in Serbia's second city Novi Sad.\nWhat you need to know about Serbia's pivotal election\n- Published1 day ago\nInstead of running for office themselves, student-led assemblies at the country's university faculties have chosen 250 candidates to stand in the parliamentary election, with Srdanović, professor at Novi Sad University, heading the list.\n\"It is absolutely normal to stand with my students to help them in their fair struggle,\" Srdanović told the BBC.\nThe Student List is up against a Serbian leader who has served successively as deputy prime minister, prime minister and president since 2012. When he called these snap elections last month, he stood down as president to run again for the role of prime minister.\nWhatever Vučić's title, there has never been any doubt that he was the man in charge – an image enthusiastically promoted by Serbia's largely uncritical media.\nHe retains strong support among a significant section of Serbia's population. They view him as a strong leader who stands up for the country's interests. He can also point to significant economic growth over the past decade and numerous improvements in infrastructure.\nVučić has painted the student movement as foreign-backed and seeking to \"bring down our state\". \"Let us always protect and defend it,\" he told supporters at a final campaign rally.\nJust like the protest movement from which it developed, the Student List has no hierarchy or nominated leader. This makes it a proposition unlike any other in Serbia's relatively short democratic history.\nReliable polls are thin on the ground, but analysts are predicting an extremely tight vote.\nIlija Srdanović may head the list of candidates – but he is not the movement's leader and would not necessarily be first choice prime minister if they won.\nSrdanović insists that the Student List has a clear vision: \"We offer to our citizens the core values of civilised society, which this previous regime has taken away from our citizens for the last time.\"\nThe other candidates on the Student List range from academics to athletes – and economists to engineers. None of them has a political background. But the students who selected them believe that is a strength, rather than a weakness.\n\"We've gathered people who are actually the best in their fields, and we really think that they are competent enough to rule the country,\" says Aleksandra, a student at Novi Sad University who only wants to give her first name.\n\"All of them are gathered around the same vision of a country where the freedom of speech is ruling, where you can walk to your home in the middle of the night and you will not be beaten up by some hooligans,\" she adds.\nThe Student List and its supporters say that Aleksandar Vučić and the SNS dominate state institutions and media coverage.\nAt the last parliamentary election in 2023, the International Election Observation Mission noted \"overwhelming ruling party advantage\" due to \"bias in the media\" and \"misuse of public office and resources\".\nThe BBC approached leading figures in the SNS for an interview but was not offered a response.\nFor the past 18 months, there has also been a full-time, pro-SNS camp in the small park between the National Assembly and the Presidency building in the centre of Belgrade. Its residents have repeatedly attacked journalists and made the park a no-go zone for local people.\nVučić has called the camp \"a symbol of resistance\" against those who \"cannot stand different opinions\".\nBut his major challenge remains what happened outside Novi Sad railway station two years ago.\nThe station's renovation was a key part of his signature infrastructure project – the high-speed line linking Belgrade and Budapest. So it has been difficult for Vučić to distance himself from the disaster.\nProtests followed, with participants accusing the authorities of corruption and having \"blood on their hands\".\n\"This is a problem for the government,\" says Magda Anastasijevic, the Eastern Europe analyst for the conflict monitor, ACLED.\n\"Vučić has survived this in the past, he was always able to find a scapegoat and blame whatever problems on them. This was not the case for the canopy.\"\nOn the diplomatic front, he has performed a delicate balancing act.\nMembership talks with the EU continue, albeit fitfully, even as Serbia retains close ties with Russia and China – both countries that refuse to recognise Kosovo's unilateral declaration of independence from Serbia.\nVučić has warned those links could be severed if the Student List took power.\n\"When you ask them: will you impose sanctions on Russia? Silence, umming and ah-ing, but no answer,\" he told the audience at a pre-election rally.\n\"You know what the Chinese think, you've heard what Vladimir Putin said. So you decide. Think about who has our best interests at heart.\"\nThe final rallies of the campaign saw the SNS stage an event at Belgrade Arena, with Aleksandar Vučić as the only speaker. But on the other side of the Sava River, the Student List attracted a reported 150,000 people in Slavija Square to listen to a mixture of students and candidates.\nThe contrasting visions were clear to see: the strong, sole leader – or a collective approach. Now Serbia's electorate must decide which they prefer.",

e contrasting visions were clear to see: the strong, sole leader – or a collective approach. Now Serbia's electorate must decide which they prefer.",

    "id": "moody-s-holds-steady-on-france-s-credit-35a7a7d0",
    "title": "Moody's holds steady on France's credit rating as country grapples with turmoil and higher yields",
    "titleJa": "Moody's holds steady on France's credit rating as country grapples with turmoil and higher yields",
    "summaryJa": "Moody's left its credit rating on France at Aa3, giving the country some relief in a week of unrest.",
    "bodyOriginal": "Moody's opted to maintain its credit rating on France as the country contended with a week of civil unrest and rising political risk.\nThe agency kept France's credit rating at Aa3, a level Moody's still deems \"high grade,\" but it also maintained its negative outlook on the nation.\n\"The negative outlook reflects the increased risk that the fragmentation of France's political landscape will continue to impair the functioning of the country's legislative institutions,\" Moody's said in its report.\nMoody's noted that it could return France's outlook to stable if its institutions can narrow the deficit.\nInvestors were anticipating Moody's rating decision as France, the second-largest economy in the euro zone, grappled with protests and a sharp surge in bond yields.\n\"This political instability, also visible in the current social tensions, risks hampering the French government's ability to address key policy challenges such as an elevated fiscal deficit, rising debt burden, and durable increase in borrowing costs, thus leading to a more rapid weakening in the sovereign's key credit metrics than we currently expect,\" Moody's said in its report Friday.\nThis week, the nation's 10-year bond yield surpassed 5% for the first time since 2002. The spread against German bunds is also at a 15-year peak.\nCurrently, France's deficit-to-GDP ratio is at roughly 5.5% of its GDP, sharply above the 3% limit for member nations in the European Union. The country faces more than $1 trillion of debt that will mature by 2030. Just a month ago, the French finance ministry warned that the nation's debt-to-GDP ratio is expected to hit 121.7% in 2027.\nAt the same time, France has been rocked by protests. Last weekend, more than 500,000 people marched to express their frustration against declining public services and high costs of living.\nS&P Global and Fitch cut their ratings on France in 2025.",
    "bodyJa": "Moody's opted to maintain its credit rating on France as the country contended with a week of civil unrest and rising political risk.\nThe agency kept France's credit rating at Aa3, a level Moody's still deems \"high grade,\" but it also maintained its negative outlook on the nation.\n\"The negative outlook reflects the increased risk that the fragmentation of France's political landscape will continue to impair the functioning of the country's legislative institutions,\" Moody's said in its report.\nMoody's noted that it could return France's outlook to stable if its institutions can narrow the deficit.\nInvestors were anticipating Moody's rating decision as France, the second-largest economy in the euro zone, grappled with protests and a sharp surge in bond yields.\n\"This political instability, also visible in the current social tensions, risks hampering the French government's ability to address key policy challenges such as an elevated fiscal deficit, rising debt burden, and durable increase in borrowing costs, thus leading to a more rapid weakening in the sovereign's key credit metrics than we currently expect,\" Moody's said in its report Friday.\nThis week, the nation's 10-year bond yield surpassed 5% for the first time since 2002. The spread against German bunds is also at a 15-year peak.\nCurrently, France's deficit-to-GDP ratio is at roughly 5.5% of its GDP, sharply above the 3% limit for member nations in the European Union. The country faces more than $1 trillion of debt that will mature by 2030. Just a month ago, the French finance ministry warned that the nation's debt-to-GDP ratio is expected to hit 121.7% in 2027.\nAt the same time, France has been rocked by protests. Last weekend, more than 500,000 people marched to express their frustration against declining public services and high costs of living.\nS&P Global and Fitch cut their ratings on France in 2025.",

    "id": "father-who-killed-oregon-school-gunman-d-47a21698",
    "title": "Father who killed Oregon school gunman describes anguish over children he couldn't save",
    "titleJa": "Father who killed Oregon school gunman describes anguish over children he couldn't save",
    "summaryJa": "Kaylub Giamanco has been hailed as a hero for killing a teenager who fatally shot three children and a teacher.",
    "bodyOriginal": "Father who killed Oregon school gunman describes anguish over children he couldn't save\n- Published\nA father who fatally shot a gunman at his daughters' school in the US state of Oregon has described his anguish over being unable to save more pupils after \"hearing children pleading for their lives\".\nThree students and a teacher were killed by a 16-year-old former student at Silver Rail Elementary School earlier this month. The attacker was then killed by Kaylub Giamanco.\n\"I want to apologise for not saving their babies,\" Giamanco, who has been hailed as a hero, said of his thoughts for the parents of the children killed, in an interview with Oregon Public Broadcasting (OPB) that aired on Friday.\n\"The gratitude for saving people's children is awesome, but there were ones that I didn't save.\"\nGiamanco, 36, said he wanted to meet the victims' families and \"cry with them and hold them\".\nHe credited a teacher who fought the attacker with giving him the chance to intervene without losing his own life.\n\"I would love to give her a hug because that's a real true hero,\" he said.\nThe students who were killed were all boys, aged five, eight and 11. They were among six people in total who were shot in a classroom at the school, police said. Alongside the teacher who was killed, another child and a teacher were wounded.\nGiamanco told OPB that the day of the attack began with breakfast and making packed lunches. He and his wife had spent extra time getting their daughters ready because it was school picture day.\nThe carpenter had taken lunch to work but decided to go home to eat with his wife instead. That decision brought him past the school as the attack began.\nHe initially wondered whether someone carrying a long gun was playing a prank. Then he saw him fire at a pickup truck and head towards the school.\nGiamanco retrieved a handgun from his vehicle and called emergency services.\n\"I said, 'I'm sorry, I have to go in. People are going to die',\" he told the broadcaster.\nHe followed the attacker, who shot through the school's locked glass doors. Hearing children pleading for their lives and more gunfire, Giamanco crawled towards the building.\n\"I told myself this is probably the last thing that I'm ever going to do,\" he said.\nGiamanco crawled through a shattered window and reached the classroom, where a teacher was locked in a struggle with the gunman. He opened the door and fired.\nGiamanco told OPB he fired again when the attacker reached for his weapon. He then placed his own gun on the ground and raised his hands as an officer appeared.\nHe described feeling like the \"last line of defence\" between the children and the gunman, and said he \"was supposed to be there\" that day.\nAfterwards, he called his wife to say he would not be home for lunch and that she needed to get to the school immediately. He then called his mother to tell her what had happened.\n\"Mum, I just had to take the life of what I think is might be a child because he ran into my daughter's school with a gun,\" he said.\nPolice identified the gunman as Griffin J John II - a former pupil who had attended special education classes at the school. His motive remains under investigation.\nPolice said the teacher who confronted the attacker had thrown her phone at him, tackled him and fought to take his shotgun. Bend Police Chief Mike Krantz said she \"almost certainly helped prevent more bloodshed\".\nThe youngest victim was Rhoam Summer, aged five. His father said the family was \"broken and lost\".\nMegan Lambert, 25, the teacher who was killed, was working in what her family described as her \"dream job\".\n\"She always fought for the underdog and those with special needs,\" they said.\nThe other two boys have not been publicly named at their families' request.\nThe injured teacher has been named as Becky Drury, 54. She said in a statement shared with US media that the gunman shot her as she tried to shut her classroom door.\nGiamanco's name became public less than a day after the shooting. His mother, Kenda Freeman, read a family statement saying he was not seeking recognition and asking for privacy.\nShortly after the attack, Oregon Governor Tina Kotek praised his intervention while acknowledging its emotional cost.\n\"Your actions carry a heavy emotional burden, and I just want you to know that my thoughts are with you as well,\" she said.\nGiamanco told OPB he now lies awake after his family goes to bed, replaying the attack.\n\"I relive, I see faces, I hear voices, I hear screams.\"",
    "bodyJa": "Father who killed Oregon school gunman describes anguish over children he couldn't save\n- Published\nA father who fatally shot a gunman at his daughters' school in the US state of Oregon has described his anguish over being unable to save more pupils after \"hearing children pleading for their lives\".\nThree students and a teacher were killed by a 16-year-old former student at Silver Rail Elementary School earlier this month. The attacker was then killed by Kaylub Giamanco.\n\"I want to apologise for not saving their babies,\" Giamanco, who has been hailed as a hero, said of his thoughts for the parents of the children killed, in an interview with Oregon Public Broadcasting (OPB) that aired on Friday.\n\"The gratitude for saving people's children is awesome, but there were ones that I didn't save.\"\nGiamanco, 36, said he wanted to meet the victims' families and \"cry with them and hold them\".\nHe credited a teacher who fought the attacker with giving him the chance to intervene without losing his own life.\n\"I would love to give her a hug because that's a real true hero,\" he said.\nThe students who were killed were all boys, aged five, eight and 11. They were among six people in total who were shot in a classroom at the school, police said. Alongside the teacher who was killed, another child and a teacher were wounded.\nGiamanco told OPB that the day of the attack began with breakfast and making packed lunches. He and his wife had spent extra time getting their daughters ready because it was school picture day.\nThe carpenter had taken lunch to work but decided to go home to eat with his wife instead. That decision brought him past the school as the attack began.\nHe initially wondered whether someone carrying a long gun was playing a prank. Then he saw him fire at a pickup truck and head towards the school.\nGiamanco retrieved a handgun from his vehicle and called emergency services.\n\"I said, 'I'm sorry, I have to go in. People are going to die',\" he told the broadcaster.\nHe followed the attacker, who shot through the school's locked glass doors. Hearing children pleading for their lives and more gunfire, Giamanco crawled towards the building.\n\"I told myself this is probably the last thing that I'm ever going to do,\" he said.\nGiamanco crawled through a shattered window and reached the classroom, where a teacher was locked in a struggle with the gunman. He opened the door and fired.\nGiamanco told OPB he fired again when the attacker reached for his weapon. He then placed his own gun on the ground and raised his hands as an officer appeared.\nHe described feeling like the \"last line of defence\" between the children and the gunman, and said he \"was supposed to be there\" that day.\nAfterwards, he called his wife to say he would not be home for lunch and that she needed to get to the school immediately. He then called his mother to tell her what had happened.\n\"Mum, I just had to take the life of what I think is might be a child because he ran into my daughter's school with a gun,\" he said.\nPolice identified the gunman as Griffin J John II - a former pupil who had attended special education classes at the school. His motive remains under investigation.\nPolice said the teacher who confronted the attacker had thrown her phone at him, tackled him and fought to take his shotgun. Bend Police Chief Mike Krantz said she \"almost certainly helped prevent more bloodshed\".\nThe youngest victim was Rhoam Summer, aged five. His father said the family was \"broken and lost\".\nMegan Lambert, 25, the teacher who was killed, was working in what her family described as her \"dream job\".\n\"She always fought for the underdog and those with special needs,\" they said.\nThe other two boys have not been publicly named at their families' request.\nThe injured teacher has been named as Becky Drury, 54. She said in a statement shared with US media that the gunman shot her as she tried to shut her classroom door.\nGiamanco's name became public less than a day after the shooting. His mother, Kenda Freeman, read a family statement saying he was not seeking recognition and asking for privacy.\nShortly after the attack, Oregon Governor Tina Kotek praised his intervention while acknowledging its emotional cost.\n\"Your actions carry a heavy emotional burden, and I just want you to know that my thoughts are with you as well,\" she said.\nGiamanco told OPB he now lies awake after his family goes to bed, replaying the attack.\n\"I relive, I see faces, I hear voices, I hear screams.\"",

    "id": "trump-dropping-some-canada-tariffs-but-r-28339fe6",
    "title": "Trump dropping some Canada tariffs but 'replacing' them with other products",
    "titleJa": "Trump dropping some Canada tariffs but 'replacing' them with other products",
    "summaryJa": "Sen. Susan Collins announced Canada was dropping Canadian tariffs, but the White House later said it was \"replacing\" the ones removed from the list.",
    "bodyOriginal": "The White House on Friday said it would drop tariffs on some Canadian goods, but replace them with other products from the major U.S. trade partner.\nThe move was revealed after Sen. Susan Collins, R-Maine, took credit for pushing the Trump administration to issue tariff exemptions on several categories of Canadian imports she says are \"crucial\" for her state's industries.\nBut Collins' announcement, which The Wall Street Journal first reported, did not mention that while tariffs would be removed for some Canadian products, new ones would be added to the list of goods subject to steep U.S. duties. The White House announced the new tariffs less than an hour after Collins touted the new exemptions to the tariffs, which are unpopular in the state where she's fighting for reelection.\nPresident Donald Trump earlier Friday signed a proclamation \"removing certain products\" from the list of items that he slapped 50% tariffs on over the summer using a 96-year-old trade law.\nBut he is \"replacing those products with certain valves, carpets, waste products, and others,\" according to a White House fact sheet detailing the proclamation.\nThe changes are being made to \"further refine the scope of the tariffs on certain Canadian products,\" according to the fact sheet, which does not mention Maine.\nThe new additions and removals from the list of goods covered by the \"Section 338\" tariffs will take effect Oct. 30, four days before the Nov. 3 U.S. election, the fact sheet said.\nAsked what Collins had agreed to in her conversations pushing Trump administration officials for lower tariffs on products affecting her state, her spokeswoman Phoebe Keller told CNBC that the senator \"requested exemptions for products that are important to Maine and will continue to do so.\"\nBefore the fact sheet was made public, Collins' office sent a press release crediting the senator with securing the new tariff exemptions on \"nine categories of products crucial for Maine's agricultural industries.\"\nThat announcement came as voters have already started casting ballots in the pivotal Maine Senate race, where Trump's unpopular tariffs have been a top issue.\nCollins' Democratic opponent, fifth-generation Maine logger Troy Jackson, quickly pushed back, insisting Collins deserves blame for enabling Trump's tariff policies.\n\"Trump's trade wars have made life harder and more expensive for Mainers. Susan Collins enabled this chaos, voted to confirm the people behind it, and now wants credit for bringing a cup of water to put out the fire,\" Jackson said in a statement.\nTrump has slapped heavy tariffs on a wide range of Canadian goods during his second term as president as he has escalated a trade war against the top U.S. economic partner. Many of those tariffs have put considerable strain on businesses in Maine, which imports far more products from Canada than from any other country.\nWhite House spokesman Matthew Middleton told CNBC in a statement Friday afternoon that Trump's latest tariff proclamation is part of his efforts to \"address Canada's discriminatory treatment of U.S. commerce.\"\n\"The President is taking action in response to Canada's continued discrimination against and additional retaliation targeting U.S. commerce, with the goal of protecting American farmers, manufacturers, and workers,\" said Middleton. \"This administration will continue to use every available tool to restore reciprocity in our bilateral trade relationships and safeguard the economic prosperity and national security of the American people.\"\nCollins has previously touted her efforts to push back on the president's protectionist trade policies. In the first televised debate between Collins and Jackson on Oct. 6, the GOP incumbent took credit for removing some items from Trump's list of tariffs on Canadian goods, including road salt.\nJackson fired back, \"What about everything else? We can't eat road salt.\"\nIn her press release Friday, Collins said she has asked U.S. Trade Representative Jamieson Greer and Commerce Secretary Howard Lutnick \"for tariff relief\" for the Maine-centric products, stressing the \"burdens additional costs impose on Maine businesses and families.\"\n\"I will continue working directly with Administration officials to seek additional relief from tariffs and encourage a broader trade agreement with Canada, our neighbor, ally and largest trading partner,\" she said.\nAccording to the U.S. Census Bureau, Mexico is the largest U.S. trading partner.\nThe products being exempted from the Section 338 tariffs include corrugated paper, plastic boxes and packing bags, refrigeration equipment, multiple forms of machinery and seaweed and algae products, according to Collins.",

    "id": "white-house-says-the-us-is-lifting-tarif-716b45e8",
    "title": "White House says the US is lifting tariffs on some Canadian goods",
    "titleJa": "White House says the US is lifting tariffs on some Canadian goods",
    "summaryJa": "Susan Collins, a Republican in a tight race to keep her senate seat in next month's elections, said she had been working with the White House on tariff relief.",
    "bodyOriginal": "White House says the US is lifting tariffs on some Canadian goods\n- Published\nThe US is lifting some of its 50% tariffs on Canadian goods, with the White House saying on Friday it was working to \"protect the economic prosperity and national security of the American people\".\nThe exemptions could also boost Republican candidates in the midterms elections on 3 November, as many US voters list affordability and economic pressures as top issues.\nRepublican Senator Susan Collins, who is in a tight race in Maine to keep her seat in the election, first announced the exemptions, saying they would help her state's agriculture industry.\nAfter trade talks collapsed this summer, the US and Canada started an escalating tariff war that has affected both sides of the border.\nThe White House, in a statement, said that starting 30 October the US would remove certain products from the list of Canadian goods it taxes, such as plywood sheets, some paper products, certain machinery and refrigeration equipment, and certain packing crates and boxes.\nIt added those items would be replaced with certain valves, carpets, waste products, among others.\nThe White House said the action reflects President Trump's \"continued efforts to defend American workers and ensure fair trade\", as well as \"offsetting the burden and disadvantage on U.S. commerce from Canada's discriminatory treatment\".\nThe BBC has contacted the White House, US commerce department and trade representative for further comment.\nAlso on Friday, President Donald Trump said that Canada is \"working very hard\" on a trade deal with the US.\nCanadian Prime Minister Mark Carney said on Friday that Canada is open to a mutually beneficial deal, but is willing to wait it out.\n\"We could sign it this afternoon if the US were there. If it has to be months from now or longer than that, or another administration, before a proper deal comes into place, we will do that,\" he said, according to CBC.\nCanada's internal trade minister Dominic LeBlanc confirmed on Thursday that a delegation met with members of the Canada-United States Economic Relations Advisory Committee - the ninth meeting since April 2026. The committee members discussed the ongoing impact of US tariffs in Canada.\nSo far, Canada has not commented on the White House's announcement.\nLeBlanc's office did not immediately respond on Friday to the BBC's request for comment.\nThe US-Canada trade war in 5 charts\n- Published31 August\nThe Wall Street Journal had reported that the exemptions, largely focused on Canadian agricultural and forestry, were made in a bid to help Collins and other Republicans in the upcoming midterm elections.\nThe reductions could be offset by raising levies on other Canadian goods, the Journal reported.\nIn a statement Collins put out before the White House announcement, the incumbent lawmaker, who is trying to clinch her sixth term, said she had \"secured additional tariff exemptions products crucial to Maine's agricultural industries, including blueberry, potato, apple, and seaweed producers\".\n\"Many of our farmers and growers rely on specialized equipment, packaging materials, and other products from Canada that are either unavailable from American suppliers or cannot be replaced without incurring significant expense,\" she posted on X.\nCollins said she has asked US officials and senior administration officials to seek additional relief and encourage a broader trade agreement with Canada.\nMaine's economy, as well as that of other border states, is deeply linked to Canada and they have felt the effects of the month-long trade war.\nMichigan lawmaker Mike Rogers, also a Republican, has called on Trump to end the standoff after spending months supporting the policy in recent advertisements airing in his trade-reliant state.\nRelated topics\n- Published1 day ago",

  {
    "id": "scalpers-offer-apple-iphone-duo-buyers-h-835609fe",
    "title": "Scalpers offer Apple iPhone Duo buyers hundreds extra outside Beijing launch",
    "titleJa": "Scalpers offer Apple iPhone Duo buyers hundreds extra outside Beijing launch",
    "summaryJa": "Apple's global launch of the foldable iPhone Duo brought scalpers to the Beijing flagship store looking to pay big for the already pricey devices.",
    "bodyOriginal": "The iPhone Duo has an eye-popping price tag, but initial interest in Apple's first foldable phone in China appears solid.\nOn the day of the global launch on Friday, scalpers like Alex Wang stood outside the flagship store in Beijing's popular shopping area, Sanlitun, offering to pay customers an extra 3,000 Chinese yuan ($448) to buy their newly purchased phones on the spot.\n\"I feel the Duo can be sold with a higher price for half a month,\" he told CNBC while watching the lines of Duo customers who had pre-booked their phones. \"The main reason is the tight supply.\"\nThough foldables are still a niche product globally, China's market is the single largest, according to Counterpoint Research.\nApple fan Mary Tong, who was first in a line of about 100 people at the Sanlitun store, showed up at 6 a.m. to pick up her foldable device.\n\"Apple has been the laggard,\" she said. \"I think many Chinese do prefer foldable phones.\"\nHuawei is promoting its own AI assistant XiaoYi to boost the Chinese smartphone maker's competitiveness against Apple and other homegrown rivals. Huawei, which already has a broad lineup of foldable phones, launched a new trifold called the Mate XT2 that is priced at about $3,000 on Sept. 7, two days before Apple's Duo announcement.\nChina's Xiaomi unveiled its own pricey foldable, the 18 Fold, around the same time.\nEven before the Beijing Apple store's regular opening hours, customers without a reservation showed up to test their luck to get their hands on the new phone. Apple had said the Duo would not be available for walk-in purchase on launch day in mainland China and would be \"limited\" in other countries. Each online purchase was restricted to two phones.\nZhang Zheng said he had tried to order one on the site but was discouraged by the delivery timeline, which stretched to January 2027. He said he still wants to buy one.\n\"I think it will be useful for work and it's cool to look at,\" he said.\nWhile there was buzz about the device itself, expectations for Apple Intelligence were negligible. The company said a version of the AI system is set for beta testing this month for the mainland China market and will include features like live translation, Clean Up in photos, and writing tools.\nOn Oct. 14, Beijing approved Alibaba AI models for use in Duo and other Apple devices as part of the U.S. tech giant's pending AI rollout in the country. Apple received Chinese regulatory clearance over the summer.\nChinese official media cited ex-CEO Tim Cook on a recent China trip as saying Apple's revamped Siri AI would not be available in the country yet.\nDuo customer John Zhao said he had tried Apple Intelligence while working overseas, and it was \"nice but not beyond imagination.\" He expects the Chinese version to be less exciting.",

    "summaryJa": "Trump's executive order on housing aims to lower mortgage costs. Here's what it means for homeowners and buyers.",
    "bodyOriginal": "President Donald Trump has signed an executive order that aims to reduce mortgage costs as rising interest rates and inflation make homeownership less affordable.\nThe order, titled \"Decreasing Housing Costs for the American People,\" directs federal agencies to proactively cancel mortgage insurance on eligible future loans and expand a program to make refinancing cheaper, among other actions.\nIn an X post on Thursday, Federal Housing Finance Agency director Bill Pulte said \"millions of Americans will save thousands and thousands of dollars.\"\nBut it's difficult to know the future consumer impact without more details, according to Keith Gumbinger, vice president of mortgage website HSH.\nTrump's executive order comes less than two weeks before the Nov. 3 midterm elections, with rising costs and housing affordability a major concern among voters. It builds on previous orders to restrict Wall Street firms from buying single-family homes, among other actions.\nHomeownership has become less affordable in recent years. In 2025, the monthly payment for a 30-year fixed-rate mortgage on a median-priced home was roughly 33% of the median family's income, up from 26% in 2022, according to the Federal Reserve's latest Survey of Consumer Finances published in early October.\nWhether you're a current homeowner or future buyer, here are some of the key things to know about the new executive order.\nMortgage insurance changes\nConventional loans — mortgages not insured or backed by U.S. government programs — typically require private mortgage insurance, or PMI, when a down payment is less than 20% of the home's purchase price. By contrast, Federal Housing Administration mortgages require mortgage insurance on all loans.\nTrump's executive order directs the FHFA to create a pilot program that cancels eligible borrowers' mortgage insurance \"proactively\" once their home equity reaches a certain threshold, according to the White House. This would apply to mortgages originated after the pilot program launches.\nCurrently, conventional loan borrowers can generally remove PMI once their loan balance is below 80% of the purchase price or once they have reached 20% equity, according to Fannie Mae. Once your balance is below 80%, you can ask your loan servicer if you're eligible to remove PMI, or they may remove it automatically when your balance reaches 78% of the original value.\nIn a statement Thursday, Seth Appleton, president of U.S. mortgage insurers, an industry trade organization, said: \"We commend the President's focus on lowering costs for future homeowners, and the private mortgage insurance industry is proud to already be delivering on that goal.\"\nTypically, the cost of PMI can be 0.2% to 2% of the loan annually, but varies based on your down payment size, credit score, amount borrowed and other factors, according to Fannie Mae.\nFor example, if you purchased a $600,000 home with a 10% down payment and a 30-year fixed-rate mortgage at 7.3%, your monthly mortgage insurance could be $351, according to a private mortgage calculator from Freddie Mac.\n\"Most mortgages ... are carrying PMI at this point in time, especially with the way home prices have been and down payments being as small as they've been in recent years,\" Gumbinger said.\nDuring the second quarter of 2026, the median home down payment was 13.7% of the home's purchase price, or $27,100, according to a September report from Realtor.com.\nMortgage refinancing costs\nTrump's executive order also aims to reduce mortgage refinancing costs by making permanent the FHFA's pilot program that waives the lender's title insurance policy and allows \"cost-friendly alternatives,\" according to the White House.\n\"I don't know that it's necessarily a game-changer in terms of the cost of housing, which is dictated by home price and mortgage rates at the moment,\" Gumbinger said. \"But you know, every little bit certainly helps.\"\nAs of Oct. 23, mortgage interest rates for 30-year fixed-rate mortgages were 7.32%, according to Freddie Mac, and refinance demand was down 59% in mid-October, compared to the same week the previous year.\nOriginally planned through November 2027, the FHFA pilot was \"limited in scope,\" for refinances with a loan-to-value ratio below 80%, in a handful of states, former FHFA director Sandra Thompson said during a Congressional hearing in April 2024.\nThompson estimated that consumers could save $500 to $1,500 in closing costs for loans sold under the pilot program.\nMaking the program permanent could save borrowers because the lender's title insurance policy, which is usually required for new loans and refinances, \"has always been fairly pricey,\" Gumbinger said.\nThe lender's title and title insurance-related fees generally make up the largest share of mortgage closing costs, according to a 2025 Urban Institute report.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
