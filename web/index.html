    "id": "chinese-ai-tool-told-researchers-how-to-0d1e5aec",
    "title": "Chinese AI tool told researchers how to make bioweapons",
    "titleJa": "Chinese AI tool told researchers how to make bioweapons",
    "summaryJa": "Mindgard said it discovered in July that Kimi models K2.6 and K3 Swarm could evade developer's safety limits.",
    "bodyOriginal": "Chinese AI tool told researchers how to make bioweapons\n- Published\nChinese AI developer Moonshot is conducting an internal review after researchers were able to persuade two of its popular Kimi models to tell them how to make biological weapons and carry out assassinations.\nMindgard, which tests the security of AI systems, told the BBC it discovered in July that Kimi K2.6 and K3 Swarm could evade safety limits put in place by developers.\nIt arose during a process called \"jailbreaking\", where researchers use a series of complex instructions to see if AI tools ignore guardrails - which Mindgard said should have stopped Kimi from discussing concerning topics.\nMoonshot told the BBC it welcomed third-party input \"as a key pillar for building better and safer AI\".\nThe company also told the BBC it was in discussion with Mindgard about its findings.\nMindgard's founder Peter Garraghan told the BBC World Service programme Tech Life that its findings about Kimi K2.6 and K3 Swarm were concerning.\n\"Once the jailbreak works it will talk about any topic, it will even freely offer up recommendations about other topics that are also nefarious and it will be inventive and creative,\" he said.\nJailbreaks present a different kind of risk to those seen with the recent slew of high-profile AI incidents.\nThese have seen autonomous AI tools known as agents, developed by US firms including OpenAI, Meta and Anthropic, hack some online services.\nWhile jailbreaks are complex processes that can take a lot of time and determination some experts fear hackers and other bad actors could try to use them to cause harm.\nAnthropic recently said it had identified and disrupted attempts to use one of its AI model for \"malicious activity\" that could support the development of biological weapons.\nCyber-attack launchpad\nMindgard has not proven whether the answers supplied by Kimi on concerning topics would work.\nBut it argued guardrails should have prevented the models in question from entering into discussion with users on such subjects.\nThe firm said it was also confident a jailbroken Kimi 2.6 could allow hackers to run code on its computing resources and connect to the internet - making it a potential launchpad for cyber-attacks.\nGarraghan defended Mindgard's decision to publicly discuss its jailbreak of Moonshot's systems, saying it had informed the developer and was not revealing key details about how it got the firm's models to ignore guardrails.\nMindgard alerted Moonshot to the jailbreak in an email on 27 July, following up about a week later.\nIt then published a blog about the issue on 12 September.\nBut the company said Moonshot only made contact recently, after it was approached by the BBC for comment.\nIn part of an email to Mindgard asking for more details, shared with the BBC by Moonshot, it said its model had generally shown \"a high refusal rate for these types of requests\" in internal evaluations.\nWhat is AI, how does it work and why are some people concerned about it?\n- Published14 September\nPreventing jailbreaks\nThe findings come as the AI industry continues to be split on whether closed, proprietary models - like those powering ChatGPT and Anthropic's Claude systems - or open-source tools are the best or safest way forward.\nKimi is an open-weight model, meaning someone could in theory take the model and run it themselves on their own computing infrastructure.\nProf Alan Woodward, of the University of Surrey, told the BBC there was a risk open-source models might end up in the wrong hands, but they could also be harnessed for cyber-defence.\nHe noted that AI firm Hugging Face used a Chinese open-source model to understand a hack later revealed to have been carried out by OpenAI agents.\nProf Woodward said international regulation was unlikely to match the pace of AI development, saying: \"It's taken us decades to agree on the format of telephone numbers.\"\nLike Mindgard founder Garraghan, Prof Woodward believes there should be a greater focus on identifying and prosecuting humans who misuse AI.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n- Published22 September\n- Published6 days ago",
    "bodyJa": "Chinese AI tool told researchers how to make bioweapons\n- Published\nChinese AI developer Moonshot is conducting an internal review after researchers were able to persuade two of its popular Kimi models to tell them how to make biological weapons and carry out assassinations.\nMindgard, which tests the security of AI systems, told the BBC it discovered in July that Kimi K2.6 and K3 Swarm could evade safety limits put in place by developers.\nIt arose during a process called \"jailbreaking\", where researchers use a series of complex instructions to see if AI tools ignore guardrails - which Mindgard said should have stopped Kimi from discussing concerning topics.\nMoonshot told the BBC it welcomed third-party input \"as a key pillar for building better and safer AI\".\nThe company also told the BBC it was in discussion with Mindgard about its findings.\nMindgard's founder Peter Garraghan told the BBC World Service programme Tech Life that its findings about Kimi K2.6 and K3 Swarm were concerning.\n\"Once the jailbreak works it will talk about any topic, it will even freely offer up recommendations about other topics that are also nefarious and it will be inventive and creative,\" he said.\nJailbreaks present a different kind of risk to those seen with the recent slew of high-profile AI incidents.\nThese have seen autonomous AI tools known as agents, developed by US firms including OpenAI, Meta and Anthropic, hack some online services.\nWhile jailbreaks are complex processes that can take a lot of time and determination some experts fear hackers and other bad actors could try to use them to cause harm.\nAnthropic recently said it had identified and disrupted attempts to use one of its AI model for \"malicious activity\" that could support the development of biological weapons.\nCyber-attack launchpad\nMindgard has not proven whether the answers supplied by Kimi on concerning topics would work.\nBut it argued guardrails should have prevented the models in question from entering into discussion with users on such subjects.\nThe firm said it was also confident a jailbroken Kimi 2.6 could allow hackers to run code on its computing resources and connect to the internet - making it a potential launchpad for cyber-attacks.\nGarraghan defended Mindgard's decision to publicly discuss its jailbreak of Moonshot's systems, saying it had informed the developer and was not revealing key details about how it got the firm's models to ignore guardrails.\nMindgard alerted Moonshot to the jailbreak in an email on 27 July, following up about a week later.\nIt then published a blog about the issue on 12 September.\nBut the company said Moonshot only made contact recently, after it was approached by the BBC for comment.\nIn part of an email to Mindgard asking for more details, shared with the BBC by Moonshot, it said its model had generally shown \"a high refusal rate for these types of requests\" in internal evaluations.\nWhat is AI, how does it work and why are some people concerned about it?\n- Published14 September\nPreventing jailbreaks\nThe findings come as the AI industry continues to be split on whether closed, proprietary models - like those powering ChatGPT and Anthropic's Claude systems - or open-source tools are the best or safest way forward.\nKimi is an open-weight model, meaning someone could in theory take the model and run it themselves on their own computing infrastructure.\nProf Alan Woodward, of the University of Surrey, told the BBC there was a risk open-source models might end up in the wrong hands, but they could also be harnessed for cyber-defence.\nHe noted that AI firm Hugging Face used a Chinese open-source model to understand a hack later revealed to have been carried out by OpenAI agents.\nProf Woodward said international regulation was unlikely to match the pace of AI development, saying: \"It's taken us decades to agree on the format of telephone numbers.\"\nLike Mindgard founder Garraghan, Prof Woodward believes there should be a greater focus on identifying and prosecuting humans who misuse AI.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n- Published22 September\n- Published6 days ago",

    "summaryJa": "Batteries based on sodium-ion technology could be made in the US with locally sourced materials.",
    "bodyOriginal": "The start-ups hoping to return battery making to the US\n- Published\nAs heatwaves scorched Europe this summer, workers at a US battery company noticed an uptick in demand.\nSan Diego-based Unigrid sells a nine kilowatt hour battery for people's homes. Sweltering European homeowners were apparently looking for ways of storing power when it was available from the grid at lower rates. They could then run air conditioners more cheaply, off the battery, during the worst heat of the day.\n\"We have requests coming from Spain, France, Germany, The Netherlands,\" says Darren Tan, co-founder and chief executive. \"We've shipped the first 100 units and [expect to ship] 1,000 before the end of the year.\"\nUnigrid's battery is an emerging technology – it's a sodium ion, rather than lithium ion device. Sodium ion batteries have got energy storage experts excited because they could end up much cheaper to build and operate than lithium ion.\nThey're potentially less likely to catch fire and should also work in a wider range of temperatures, even down to lows of minus 40C, external.\nBut there's a debate over what constitutes the best, and safest, sodium ion battery design. Plus, more than one, external US company working in this space has floundered in recent years, external.\nChina leads the world in sodium ion battery manufacturing at present so US competitors are going to have to work hard to keep up.\nThe prize that awaits is the possibility of batteries made in the US with 100% US-sourced materials. This is unlike lithium ion batteries, where China dominates the materials, external supply chain as well as manufacturing.\nFor Tan, China has helped his company get to market. The Unigrid battery currently uses sodium ion cells made there, rather than in the US. \"We can switch back and forth and choose what battery we want to work with,\" says Tan, explaining that, in future, his firm might source cells from the US – though these may come at a different cost.\nThere's another consideration. Unigrid's battery contains chromium-3 in its cathode. In a battery, electrons flow from cathode to anode, external when charging and in the opposite direction when discharging or providing power.\nProf Dame Clare Grey at the University of Cambridge, who is co-founder of battery firm Nyobolt, points out that under certain conditions chromium-3 may form chromium-6, a toxic, cancer-causing material., external\n\"If you're going to go for sodium […] and you're going to sell safety, then don't start putting elements in that are going to raise red flags,\" she tells the BBC.\nIvana Hasa at the University of Warwick, who has no connection to Unigrid, agrees that it is possible for chromium-3 to form chromium-6 at very high states of charge, though she says this can be mitigated by how voltage is controlled within the battery. \"Safety tests reported on the cell chemistry are very promising,\" she says of Unigrid's tech.\nTan says concerns around toxicity of the battery's materials are \"overblown\" and emphasises that Unigrid's battery has passed certification and safety tests for sale in Europe and is currently undergoing such evaluations for the US market.\nThird-party tests have not been able to get the battery to form chromium-6, he says. \"We've tried very hard to try and produce it, we've overcharged it as much as we can... We were unsuccessful in generating chromium-6.\"\nThe choice of cathode material, or how the electrolyte – which separates cathode and anode – is formulated are key details influencing the performance and longevity of sodium ion batteries. Some manufacturers are not using chromium for their cathode but hard carbon instead, or sodium iron phosphate pyrophosphate (NFPP).\nIn general, confidence around sodium ion batteries' reliability has increased during the last few years, says Prof Dame Grey, meaning they are now finding their way into grid storage applications.\nLast December, LFP batteries – a relatively cheap form of lithium ion battery – were trading at $81 per kilowatt hour, external (kWh) whereas Unigrid's sodium ion battery pricing is roughly $100 kWh, external.\nSome companies that spoke to the BBC suggested sodium ion might reach as low as $30 per kWh but analysts say significantly lower costs could be many years away, external.\nSodium ion batteries are also not as energy dense as lithium ion batteries, meaning they must be slightly bigger and heavier in order to provide the same amount of power.\nThe technology has been improving, external on this front in recent years but, even so, you're not likely to see sodium ion cells in small, energy hungry devices such as smartphones. Larger energy storage solutions are where most people expect sodium ion to dominate.\n\"We think sodium ion […] is going to make up 80% of the market,\" says David Bell, co-founder and chief executive of Seattle-based Emerald Battery Labs.\nBell declined to share details of the battery design his firm is working on, though he says Emerald too is currently relying on China-sourced sodium ion cells as they develop their initial product: 12 volt auxiliary batteries for vehicles, currently supplied to unnamed commercial fleets in the US.\n\"We took a look at the market and said 'Hey, no-one's trying to attack this space, let's have Emerald Battery Labs attack it',\" says Bell. The firm's next goal is to develop new anodes for US-produced sodium ion cells.\nAnother company, Peak Energy, based in California and Colorado, announced a partnership with General Motors (GM) in June. The pair aim to develop a US supply chain for sodium ion batteries, in order to enable large-scale energy storage for electricity grids.\nPeak Energy is also, at present, relying on China-sourced cells for its first installations, but hopes to help GM launch a US-based production facility in Michigan \"by the end of 2028\", says Cameron Wiles, president and co-founder. \"China does not have an insurmountable lead in sodium ion batteries,\" he says.\nOne reason US companies feel they can compete is because of the electricity demand boom from data centres, which are contributing to rising greenhouse gas emissions in the US. Data centre-driven demand is also rising in other places around the world, including the UK.\nThis is an \"opportunity\" says Drew Buckley, chief executive at ESS Tech, headquartered in Oregon. He points out that sodium ion batteries could help distribute renewable energy to data centres. And those batteries should be cheaper to run than lithium ion alternatives, since they are not expected to require as much cooling.\nESS Tech is working with Alsym, another US firm that is planning to ship \"hundreds\" of megawatt hours' worth of sodium ion batteries – made in the US – by 2027.\nHasa says that it will be \"challenging\" for companies to establish mass production of sodium ion batteries. And she also notes that, while this type of battery is often touted as much safer than lithium ion, they do not come with zero fire risk.\nBut if any firms can succeed in this space, they could enable new strategic choices, she adds – helping to avoid wastage of renewable electricity and potentially keeping energy costs low. \"I'm a strong believer in the technology,\" says Hasa.\nRelated topics\n- Published19 August\n- Published12 August\n- Published7 August",

    "title": "'I like proving people wrong': The women taking up DIY and plumbing",
    "titleJa": "'I like proving people wrong': The women taking up DIY and plumbing",
    "summaryJa": "Female DIY experts and tradeswomen talk about their experiences of a traditionally male-dominated domain.",
    "bodyOriginal": "'I like proving people wrong': The women taking up DIY and plumbing\n- Published\nIt's hard to miss the explosion of DIY content that has hit our social media feeds over the last decade.\nFrom quick reels on how to fix cracks in walls, to complicated YouTube tutorials on building alcove seating from scratch, the internet is chock-a-block with seemingly endless home improvement demos.\nWhile DIY was once seen as more of a male domain, female influencers are inspiring a new generation of women to take matters into their own hands.\nMeanwhile, demand for female professionals is rising, while some women are changing careers to take up trades which they see as more AI-proof than their desk jobs.\nEight months pregnant and building wardrobes\nDIY influencer Jasmine Gurney has documented an impressive and exhausting sounding list of tasks on Instagram.\nShe has torn down partition walls, replaced flooring, erected a fence, insulated and boarded her loft, built an outdoor workshop, made custom cabinetry, moved plug sockets, made her son his first bed and has been building him a treehouse.\nEight months pregnant, the former marketer is now racing to finish building a fitted wardrobe before the new baby arrives.\n\"I like proving people wrong,\" says Jasmine, 33, from Bedfordshire, who says she's been trolled by people questioning her techniques but they just \"spur me on more\".\n\"I'm showing and empowering other women to do it,\" she says.\n\"I've shown me doing things whilst pregnant, I've had my firstborn strapped to me in a baby carrier while doing things.\n\"I'm just showing that we are capable, we are interested in this sort of stuff and... we're sick of waiting around for six months for our husbands to pick up the tools and do it in most cases.\"\nJasmine says her page really took off during Covid when people couldn't get professionals in so needed to learn to do jobs themselves.\nWhile the lockdowns are long over, demand for content like hers has stuck, she believes, because there aren't enough tradespeople to meet demand, and cost of living pressures are squeezing budgets.\nGen Z leads the way\nGen Z women are \"leading the charge in challenging gendered DIY stereotypes\", according to a 2024 report by B&Q.\nAround three-quarters of Gen Z women surveyed said they enjoy DIY, compared to 60% of all female respondents.\nAnd 82% of Gen Z women said seeing women doing more complex home DIY on social media had inspired them to do more themselves, versus 60% of women in general.\nOf course, not all jobs are DIY. Sometimes you'll need to GSI (get someone in).\nBliss Cunneen walked away from an Anthropology university course in 2020 to train as a plumber.\nThe 28-year-old from south London says trying the trade on a whim is the \"best thing I've ever done\", and she loves the freedom and flexibility of running a business.\nWhile she has experienced doubt from some customers when she turns up at their door - and has even once been mistaken for the receptionist - \"once you start working and you show you're confident and you know what you're doing, they're okay\".\nShe says the explosion of content online has \"definitely helped\" with broadening attitudes to women taking up DIY or a trade.\nRising demand for tradeswomen\nAnna Moynihan set up TaskHer, a platform connecting female tradies with customers who need jobs done, after feeling frustrated when tradesmen she had booked for renovation work would address her husband rather than her.\nFive years ago she says she couldn't find any stock photographs of tradeswomen to use for marketing. Even the word \"tradeswoman\" would get autocorrected to \"tradesman\".\n\"It's those little things that, you know, ultimately you don't feel welcome into that environment.\n\"It's already hard enough to become a tradeswoman, a woman in an industry where you're massively under-represented.\"\nEnquiries on the site have more than doubled so far this year compared to 2025, while the number of tradeswomen signing up has almost quadrupled, Anna says.\nPeople might prefer a tradeswoman for a range of reasons - industry surveys suggest they may feel more at ease with a woman entering their home, external, feel a woman would be more respectful, or want to support women working in traditionally male roles.\nAnecdotally, Anna says more women are joining her platform after leaving white-collar jobs, adding three Oxford University-educated tradeswomen have signed up in the last month.\nShe says some had always wanted to take up a trade but felt unable to up until now because of their gender.\nOthers, she says, want the flexibility of working for themselves in a role less likely to be directly impacted by the rapid advance of AI.\n'You can't be what you can't see'\nDespite the buzz, women make up a tiny proportion of the UK's construction workforce - around 4%, according to the Federation of Master Builders.\nBut there are encouraging signs. One in 10 people who started a construction apprenticeship in 2024-25 was a woman, up from around one in 14 five years earlier.\nDIY influencer Jasmine hopes women who see online content such as hers will be inspired to give a project a go, or consider entering a trade.\n\"The more women who are seen online doing these sorts of things, the more normal it becomes.\"\nAnna agrees. \"You can't be what you can't see, and anything that shows women and girls that they can do something is fantastic.\"\nRelated topics\n- Published6 September\n- Published22 June\n- Published26 January",

    "id": "huel-ad-banned-for-suggesting-its-produc-800d672e",
    "title": "Huel ad banned for suggesting its products could replace all conventional food",
    "titleJa": "Huel ad banned for suggesting its products could replace all conventional food",
    "summaryJa": "The advertising watchdog said that viewers could assume from the ad that replacing all normal food with Huel was \"nutritionally appropriate\".",
    "bodyOriginal": "Huel ad banned for suggesting its products could replace all conventional food\n- Published\nAn advert for Huel meal replacement shakes has been banned by the advertising watchdog for encouraging or condoning \"irresponsible\" dietary practices.\nThe ad featured Huel brand ambassador Spencer Matthews sharing an anecdote of a person he met who \"only eats Huel\" and who won a 260km race \"by miles\".\nThe Advertising Standards Authority (ASA) said that viewers could assume from the ad that replacing all conventional food with Huel was \"nutritionally appropriate\" and was compatible with elite physical performance.\nHuel said Matthews' anecdote was not \"a recommendation or instruction\" and the purpose of the ad was to challenge the misconception that Huel could replace every meal\".\nThe video, which appeared as a sponsored Instagram post and YouTube pre-roll ad, featured Matthews speaking to Huel founder Julian Hearn in the style of a podcast.\nThe Instagram post included the caption: \"Here's how our founder uses Huel. Spoiler alert it's not for every meal.\"\nIn the video Hearn said that he has Huel products for breakfast and lunch during the working week, but has a \"traditional meal\" when he goes home.\nIn response, Matthews said that when he was competing in an ultramarathon, he met a man who \"only eats Huel\".\nMatthews said he was initially sceptical that the man would be able to manage the race, but then said: \"He won it by miles, like literally just left us all in the dirt.\"\nHearn replied: \"In an ideal world, you should have nutritionally complete whole food.\n\"Most people either don't do that or can't have the time to do that, and therefore that's where Huel fits in the gap.\"\nHuel, which is based in Hertfordshire, was founded by Hearn in 2015. It is currently in the process of being bought by French conglomerate Danone.\nThe market for so-called complete nutrition products, aimed at time-poor, health-conscious consumers, is thought to be worth $5.9bn (£4.4bn).\nThe ASA received four complaints about the advert, which challenged whether the content was irresponsible. Two of the complainants also challenged whether the health claims in the ad breached the ASA's advertising code.\nThe ASA acknowledged in its ruling that the ad \"did not explicitly recommend that consumers replace all conventional foods with Huel\", but consumers could nonetheless interpret the anecdote as \"an acceptable dietary practice\".\n\"By presenting exclusive consumption of Huel in that context, the ads suggested that the complete replacement of conventional food with Huel was nutritionally appropriate and presented no barrier to achieving a high level of physical performance,\" the ruling said.\nThe ASA also upheld the complaint regarding the health claims as it ruled Matthews' anecdote about the ultramarathon athlete \"implied a beneficial relationship between consuming Huel and the ability to sustain exceptionally high levels of physical and endurance performance\".\nIn its response to the complaints, Huel said the advert \"unambiguously positioned Huel as part of a balanced diet for occasions when preparing whole food was not practicable\".\nThe company pointed to Matthews reacting with \"extreme scepticism and disbelief\" to the idea of a person solely consuming Huel.\n\"The anecdote was recounted as a remarkable and unexpected occurrence, not as a representative outcome or a recommendation or instruction to consumers to replicate.\n\"At no point in the ads did either speaker suggest that consumers should adopt a 100% Huel diet.\"\nIt is not the first time that Huel has landed in hot water with the ASA over the use of its products as a replacement for conventional food.\nAdditionally, some experts have questioned the effectiveness of replacing meals with nutritionally rich drinks.\nHuel told BBC News that it had complied with the ASA ruling.\n\"We do not position Huel as a complete diet replacement or claim that it improves athletic performance,\" a spokesperson said.\n- Published20 August\n- Published5 days ago",

    "bodyOriginal": "Household energy bills forecast to see biggest rise in four years\n- Published\nHousehold energy prices are set to soar in January, with a typical annual bill forecast to jump by £276, figures shared with the BBC reveal.\nThe 16% predicted increase would hit millions of households at the coldest time of year, and would mark the biggest rise in bills for four years.\nThe forecast from consultancy Cornwall Insight comes a day before prices go up under regulator Ofgem's October price cap and puts increased pressure on the government to support those who will struggle to pay.\nMeanwhile, the boss of supplier EDF Simone Rossi has warned the UK is \"walking into a second energy crisis\" and called for an extension to the VAT cut on electricity which kicks in on Thursday.\nEnergy prices bite in winter\nAbout 20 million households in England, Scotland and Wales are on variable energy tariffs set by Ofgem's price cap, which puts a maximum price on each unit of gas and electricity.\nThose homes will see a 4% increase in prices on Thursday, the equivalent of about £60 per year – or £5 per month – taking an annual bill to £1,723 for the typical household using both electricity and gas and paying by direct debit if this level was sustained for a year.\nThat rise would have been higher without the government's VAT cut, which knocks the equivalent of about £45 a year off a typical bill.\nBut forecasts show a far greater increase is possible for bills in January. Cornwall Insight said its latest forecast suggests the typical annual bill would rise to £1,999.\nThe forecast 16% rise will come at the worst time of year, according to Craig Lowrey, principal consultant at Cornwall Insight.\n\"These prices are going to hit households hard. January is already a difficult month for many, with cold weather and bank balances still recovering from Christmas,\" he said.\nThe predicted rise is the result of disruption of gas supplies owing to the conflict in the Middle East, and the resulting low gas storage levels in Europe. Rebuilding those stocks could mean high bills \"well beyond the winter\", the forecaster said.\nCornwall Insight has a strong track record on forecasts and is widely respected across the industry and politics. Similar forecasts have been made by energy suppliers.\nWhat will the energy cap changes mean for my bills?\n- Published1 day ago\nFour ways to keep your energy bills down\n- Published1 day ago\nThis remains only a prediction at this stage. Ofgem will not announce the actual January price change until late November.\nWhile an easing of tensions in the Middle East could lessen the pain for billpayers, the price setting period for the January cap is already halfway through.\nWith little sign of a truce or lower international energy costs, a big increase in prices for those not on a fixed tariff looks highly likely. Lowrey said a January rise was \"all but certain\".\n'Everything's going up'\nThat will be tough for people like Aaron Richards from Maidenhead.\n\"I try to eat less takeaways, work more overtime, and try to budget a bit better, but at the same time, we shouldn't have to,\" he said.\nAaron drives a diesel car, and so is paying record high prices to travel to and from work.\n\"I just feel like everything's going up. How far is it going to go? Someone's got to step in,\" he said.\n\"I know people who can't afford to heat their house and they're struggling at the moment. Housing and eating are two of life's essentials that everyone should have. It shouldn't be a challenge to have any of those things.\"\nYears of relatively high domestic energy bills have left some people facing big sums in unpaid bills.\nRecent data from Ofgem showed that customers collectively owe more than £5bn in unpaid bills and charges to suppliers.\nThe regulator has a proposed debt relief scheme on the table, and campaigners keep telling them to get on with it, urging the government to provide funding for it to be implemented.\n\"This is unsustainable, not just for households but also for the market as a whole,\" said Adam Scorer, chief executive of fuel poverty charity National Energy Action.\n\"The Budget must deliver additional targeted support for households most at risk this winter, alongside action to tackle energy debt and improve the least energy-efficient homes.\"\nAmong others calling for government help for struggling billpayers is Simone Rossi, chief executive of supplier EDF Energy.\nSpeaking exclusively to the BBC's Big Boss Interview podcast, Mr Rossi said: \"We are actually walking into a second significant energy crisis after the one we experienced just four years ago.\"\nHe said that the government should extend the cut in VAT on electricity bills from 5% to 0% beyond April, when it is due to expire.\nHe also urged ministers to give the go-ahead to the new Jackdaw gas field off the coast of Aberdeen, and the Rosebank oil field off Shetland.\nThe government has consistently said that it will consider ways to offer breathing space to billpayers on the cost of living.\nAdditional reporting by Oliver Smith and Paul Seddon. Graphics by Miguel Roca-Terry.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});
