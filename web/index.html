    "titleJa": "フィンテックブローカーのクリアストリートが投資家に1880億ドルのAI大手データブリックスへのIPO前のアクセスを提供",
    "summaryJa": "フィンテック証券会社の Clear Street は、投資家が後期段階のスタートアップへのアクセスを増やすために、Databricks 株を皮切りにプライベート マーケット プラットフォームを立ち上げています。",
    "bodyOriginal": "Clear Street, the prime brokerage startup that recently shelved plans for its own IPO, is now aiming to give investors access to some of Silicon Valley's hottest private companies before they go public.\nThe firm is close to announcing a new platform designed to let accredited investors buy interests in late-stage private companies, starting with AI software titan Databricks, valued this month at $188 billion, CNBC is first to report.\n\"The goal is to remove friction and give more people the ability to invest in more products,\" Uri Cohen, CEO and co-founder of Clear Street, said in an interview. \"A lot of the wealth creation has been in private markets, and more and more retail investors and smaller investors want to be part of that.\"\nMore startups are staying private for longer, meaning much of their value creation is taking place before an initial public offering. That has fueled growing demand from rich investors seeking exposure to companies like Databricks, Anthropic and OpenAI before they debut on public markets.\nLast week, CNBC reported that Goldman Sachs has created a new platform to expand its offerings for wealthy clients and family offices who increasingly want direct stakes in fast-growing private companies.\nClear Street, by handling the asset servicing and risk management internally, can offer margin loans against the pre-IPO holdings, a rarity in private markets, said Cohen.\nThe fintech firm will have as many as 30 startups on its platform by yearend, mostly tech firms in the $5 billion to $20 billion valuation range that are roughly six months to two years out from an IPO, he said.\nTo support the push, Clear Street is also launching dedicated private company equity research headed by analyst Owen Lau, in what Cohen called an effort to bring public-market-style transparency to traditionally opaque private markets.\nThe expansion comes at a key moment for Clear Street, itself.\nThe firm, which was last valued at nearly $12 billion in a private funding round earlier this year, in February paused its own IPO plans amid broader market volatility that hit broker and fintech multiples.\nDespite putting its listing on hold, the firm is cash-flow positive and bolstered its liquidity with a $400 million investment-grade bond offering, giving it the runway to build out its private market infrastructure, Cohen said.\n\"We're in a position of strength, so the decision was shelved for better timing,\" Cohen said. \"We're definitely going to look towards a '27 listing, depending on the market conditions.\"",
    "bodyJa": "最近自社のIPO計画を棚上げしたプライム・ブローカレッジの新興企業クリア・ストリートは現在、株式公開前に投資家にシリコンバレーで最も人気のある非公開企業のいくつかにアクセスできるようにすることを目指している。\n同社は、認定投資家がレイターステージの非公開企業の権益を購入できるように設計された新しいプラットフォームの発表に近づいていると、今月評価額1,880億ドルと評価されたAIソフトウェア大手データブリックスをはじめとしているとCNBCが最初に報じた。\n「目標は、摩擦を取り除き、より多くの人がより多くの製品に投資できるようにすることです」とクリアストリートのCEO兼共同創設者であるウリ・コーエン氏はインタビューで語った。 「富の創出の多くは非公開市場で行われており、その参加を望む個人投資家や小規模投資家がますます増えている。」\nより多くのスタートアップが非公開のままでいる期間が長くなり、その価値創造の多くが新規株式公開前に行われることを意味します。これにより、Databricks、Anthropic、OpenAIなどの企業が公開市場にデビューする前にエクスポージャーを求める裕福な投資家からの需要が高まっています。\nCNBCは先週、ゴールドマン・サックスが、急成長する非公開企業への直接出資をますます求める富裕層の顧客やファミリーオフィス向けのサービスを拡大するための新たなプラットフォームを創設したと報じた。\nコーエン氏によると、クリアストリートは資産のサービシングとリスク管理を社内で行うことで、IPO前の保有株に対する証拠金融資を提供できるが、これは民間市場では珍しいことだという。\n同フィンテック企業のプラットフォームには年末までに最大30社の新興企業が参加する予定で、そのほとんどが評価額50億ドルから200億ドルの範囲にあるテクノロジー企業で、IPOからおよそ半年から2年かかると同氏は述べた。\nこの動きを支援するために、クリアストリートはまた、アナリストのオーウェン・ラウ氏が率いる専門の未公開企業株式調査を立ち上げている。これは、コーエン氏の言うところの、従来不透明な未公開市場に公開市場型の透明性をもたらす取り組みである。\nこの拡張は、クリアストリート自体にとって重要な時期に行われる。\n同社は今年初めの非公開資金調達ラウンドで最後に120億ドル近くと評価されていたが、ブローカーやフィンテックのマルチプルに打撃を与えた広範な市場のボラティリティの中、2月に自社のIPO計画を一時停止した。\n上場を保留しているにもかかわらず、同社のキャッシュフローはプラスであり、4億ドルの投資適格社債の発行で流動性を強化し、プライベート市場インフラを構築する滑走路を与えたとコーエン氏は述べた。\n「我々は強い立場にあるので、より良いタイミングを図るために決定は棚上げされた」とコーエン氏は語った。 「市場の状況次第ではありますが、27年の上場を目指すつもりです。」",

    "title": "Analysis: Markets heard a dovish Kevin Warsh. The Fed chairman's own words suggest a rate hike",
    "titleJa": "分析：市場はハト派のケビン・ウォーシュ氏の発言を聞いた。 FRB議長自身の発言が利上げを示唆",
    "summaryJa": "米連邦準備制度理事会（FRB）のケビン・ウォーシュ議長の水曜日のコメントに対する圧倒的な反応は、同議長がインフレには緩和するというものだった。これに応じて債券利回りを押し上げた投資家は注意が必要だ。同氏の発言をよく観察すると、ウォーシュ氏は広く信じられているほどハト派ではないかもしれない。インフレ率が引き続き目標を上回れば、ウォーシュ氏自身の言葉から判断すると、経済を抑制するためにすぐに行動を起こさざるをえないと感じるかもしれない。聞いたことに基づいて行動する投資家は、利上げが目前に迫っている場合に盲目になってしまう危険がある。",
    "bodyOriginal": "The overwhelming response to Federal Reserve Chairman Kevin Warsh's comments on Wednesday was that he would go easy on inflation. Investors who drove up bond yields in response should be careful.\nLooking closely at what he said, Warsh may not be as dovish as widely believed. If inflation continues to come in above target, then Warsh — judging by his own words — may feel compelled to act soon to restrain the economy. Investors who act on what they thought they heard risk being blindsided if a rate increase is around the corner.\nCrucially, Warsh opted not to celebrate a soft inflation print that had come in prior to the meeting. Had he wanted to present a dovish message, he could have seized on that data. Instead, he wrote it off.\nWarsh's muddled performance Wednesday at his second press conference scrambled many investors' view of the Federal Reserve. Some saw a man who had been long perceived as an inflation hawk appear to talk down worries about inflation. He answered reporters' questions with vague statements and left many confused.\nSome concluded Warsh is in thrall to President Donald Trump, who continues to ask the Fed for lower interest rates, despite the central bank's statutory independence and pledges from both the president and Warsh that independence remains.\nA chorus of market analysts said Warsh performance called his credibility into question. Long-term treasury yields rose, while the dollar fell and gold rose.\nBut if the market is misreading the Fed chairman as a dove, it could be in for further violent moves when traders are forced to unwind their positions. It helps to look at the prepared statement Warsh read out at the beginning of the press conference that reflected the message he went into the room intending to send — rather than what emerged from the back-and-forth with reporters.\nAhead of the meeting, the consumer price index showed a rare decline, with prices falling by 0.4% in June from the month before.\nWarsh was muted on that point. \"We understand that the five-plus years of inflation above target cannot be cured in nine weeks — or by a single month of modest price decreases,\" he said Wednesday, speaking for the Federal Open Market Committee, which sets the Fed's benchmark interest rate.\nThe words of Fed chairs are among the most carefully parsed remarks in the world. Warsh's performance Wednesday shows he hasn't yet figured out how to rhetorically separate the short-term and long-term challenges. Nor did his exchanges with reporters bolster his prepared remarks. Instead, he undermined himself and his carefully crafted message.\nInvestors were hoping to hear a chairman who would strike a hasty blow against fast-rising prices and speak up to a president who continues to bear down on the Fed. Investors didn't get that on Wednesday. Instead they heard about his plans to tinker with inflation measurements, and panicked.\nBut that isn't to say Warsh didn't try or intend to deliver the message that he was willing to raise rates.\n\"Where necessary and appropriate, we will not hesitate to act,\" Warsh said in his prepared remarks.\nIt is easy to dismiss that kind of language as empty hand-waving. But in 2012, then-Chairman Ben Bernanke — one of Warsh's mentors — pledged to \"provide additional policy accommodation as needed,\" and then proceeded to launch a new round of massive asset purchases. In May 2022, Jerome Powell told reporters that \"we will not hesitate\" to raise interest rates if necessary. In June, he hiked rates by three-quarters of a point.\nTangled language on inflation\nWarsh has often spoken of the tremendous promise of AI to produce growth without inflation. But in his prepared remarks, Warsh was more circumspect. He said it wasn't clear when the economy's productive capacity would be able to jump in response to all the spending that's happening now. As he put it, \"the precise timing and magnitude of effects on the supply side remain hard to predict.\"\nWarsh also spoke more clearly in his opening remarks about a point some analysts seized on in his later responses to reporters. The Fed's formal commitment on prices is to achieve 2% annual inflation over the long run as measured by the personal consumption expenditures index.\nAsked about PCE, Warsh gave some observers the impression that he might change the 2% target. We are sticking with PCE for now, Warsh said. But, \"who knows, come after next January, what we might say about strategy.\"\nBut Warsh showed no ambiguity in his prepared remarks. \"There is no soft inflation target, there is no soft implicit target — not on this Committee's watch. There is only a target, and it is 2 percent.\"\nSo what is the Fed chairman prepared to do about it? There, too, his opening remarks dropped hints. The FOMC didn't just discuss interest rates, Warsh said. \"We discussed monetary policy tools and strategies for achieving stable prices.\" The committee, Warsh explained, asked, \"how much accommodation are we getting from the balance sheet?\"\nIn other words, Warsh has already begun the task of moving the FOMC toward his long-stated goal of shrinking the Fed's balance sheet. As he has said elsewhere, that would effectively tighten financial conditions, similar to the effects of raising interest rates.\nThe issue of the balance sheet speaks to Warsh's challenge: He doesn't have the power to quickly push through the changes he wants. Warsh came into the Fed with an agenda for \"regime change,\" as he described it. But the mechanism to achieve that change is a set of slow-moving task forces that he believes will sooner or later nudge the Fed into his preferred reforms. He wants to reduce the balance sheet, find alternate ways to measure inflation and get ready for an economy reshaped by AI.\nBut the task forces won't report back before the end of the year at the earliest. The committee clearly isn't ready to take action on the balance sheet. Warsh's explicit discussion of the Fed's \"tools\" is a strong indication he will take the earliest possible opportunity to use the balance sheet to tighten monetary policy, in addition to anything he might do on interest rates.\nMeanwhile Warsh has to deal with an economy battered by tariffs and high energy prices that he can't influence directly, and by an AI boom whose potential fruits are still over the horizon.\nWarsh has spent decades studying the leaders of the Fed and their failures. Credibility is paramount to him. His words suggest he may be further down the path to a rate hike than investors interpreted following Wednesday's meeting — and might just be waiting for the two inflation reports that come before the FOMC gathers next in September.\nGiven the beating he took in the aftermath of this meeting, it likely won't take him much to pull the trigger on a rate increase at the next one.",
    "bodyJa": "米連邦準備制度理事会（FRB）のケビン・ウォーシュ議長の水曜日のコメントに対する圧倒的な反応は、同議長がインフレには緩和するというものだった。これに応じて債券利回りを押し上げた投資家は注意が必要だ。\n同氏の発言をよく観察すると、ウォーシュ氏は広く信じられているほどハト派ではないかもしれない。インフレ率が引き続き目標を上回れば、ウォーシュ氏自身の言葉から判断すると、経済を抑制するためにすぐに行動を起こさざるをえないと感じるかもしれない。聞いたことに基づいて行動する投資家は、利上げが目前に迫っている場合に盲目になってしまう危険がある。\n重要なのは、ウォーシュ氏が会合前に提出されたソフトインフレ報告を祝わないことを選択したことだ。もし彼がハト派的なメッセージを提示したかったのであれば、そのデータを利用できたかもしれない。代わりに、彼はそれを帳消しにした。\n水曜日の2回目の記者会見でのウォーシュ氏の混乱したパフォーマンスは、FRBに対する多くの投資家の見方を混乱させた。長い間インフレタカ派とみなされてきた人物がインフレ懸念を抑え込んでいるように見えるとの見方もあった。彼は記者の質問に曖昧な言葉で答え、多くの人を困惑させた。\n中銀の法定の独立性と大統領とウォーシュ氏の両者が独立性を維持すると約束しているにもかかわらず、ウォーシュ氏はFRBに金利引き下げを要求し続けているドナルド・トランプ大統領の虜になっていると結論付ける人もいる。\n市場アナリストらは、ウォーシュ氏のパフォーマンスが同氏の信頼性に疑問を投げかけていると述べた。長期国債利回りが上昇する一方、ドルは下落し、金は上昇した。\nしかし、市場がFRB議長をハト派と誤読すれば、トレーダーがポジションの巻き戻しを余儀なくされ、さらなる暴力的な動きに陥る可能性がある。記者会見の冒頭でウォーシュ氏が読み上げた準備済みの声明を見ると、ウォーシュ氏が伝えようとして部屋に入ったメッセージが反映されており、記者たちとのやりとりから浮かび上がったものではなく、そのメッセージを反映している。\n会合を前に、消費者物価指数はまれに見る下落を示し、6月の物価は前月比0.4％下落した。\nウォーシュ氏はその点について沈黙を保った。同氏は水曜、FRBの基準金利を設定する連邦公開市場委員会の代表として、「5年以上にわたって目標を上回ったインフレは9週間では、あるいは1カ月の小幅な物価下落では回復できないことを我々は理解している」と述べた。\nFRB議長の言葉は、世界で最も注意深く解析された発言の一つである。ウォーシュ氏の水曜日のパフォーマンスは、彼が短期的な課題と長期的な課題を修辞的に区別する方法をまだ理解していないことを示している。記者たちとのやり取りも、準備していた発言を裏付けるものではなかった。代わりに、彼は自分自身と彼の慎重に作成されたメッセージを傷つけました。\n投資家らは、物価の急騰に速攻で打撃を与え、FRBに圧力をかけ続ける大統領に声を上げる議長の発言を期待していた。投資家は水曜日にはそれを理解できなかった。代わりに、彼らはインフレ測定をいじるという彼の計画について聞き、パニックに陥りました。\nしかしそれは、ウォーシュ氏が利上げに前向きであるというメッセージを伝えようとしなかった、あるいは伝えるつもりがなかったということではない。\nウォーシュ氏は準備した発言の中で、「必要かつ適切な場合には、ためらうことなく行動する」と述べた。\nそのような言葉を空振りとして無視するのは簡単です。しかし2012年、ウォーシュ氏の指導者の一人であるベン・バーナンキ議長（当時）は「必要に応じて追加の政策緩和を提供する」と約束し、新たな大規模な資産買い入れの開始に着手した。 2022年5月、ジェローム・パウエル議長は記者団に対し、必要であれば利上げを「ためらわない」と語った。 ６月には４分の３ポイント利上げした。\nインフレに関する言葉が錯綜している\nウォーシュ氏は、AIがインフレを起こさずに成長をもたらすという大きな約束について頻繁に語っている。しかし、ウォーシュ氏は準備した発言の中で、より慎重な態度をとった。同氏は、現在起きているあらゆる支出に応じて経済の生産能力がいつ急上昇できるかは不透明だと述べた。同氏の言葉を借りれば、「供給側への影響の正確なタイミングと規模を予測するのは依然として難しい」という。\nウォーシュ氏はまた、冒頭の挨拶で、その後の記者への返答で一部のアナリストが捉えた点について、より明確に語った。 FRBの物価に関する正式な公約は、個人消費支出指数で測定した長期的に年間2％のインフレを達成することである。\nPCEについて質問されたウォーシュ氏は、一部の観察者に2％の目標を変更する可能性があるという印象を与えた。ウォーシュ氏は、「我々は今のところPCEに固執する」と述べた。しかし、「来年1月以降、戦略について何を言えるかは誰にも分からない」。\nしかし、ウォーシュ氏は準備した発言に曖昧さを一切示さなかった。 「ソフトなインフレ目標はなく、ソフトな暗黙の目標も存在しない。当委員会は監視していない。目標があるだけで、それは２％だ。」\nそれでは、FRB議長はそれに対して何をする用意があるのでしょうか?そこでも、彼の冒頭の発言がヒントを落とし込んだ。ウォーシュ氏は、FOMCは金利についてのみ議論したわけではないと述べた。 「我々は物価の安定を達成するための金融政策手段と戦略について議論した。」ウォーシュ氏の説明によると、委員会は「貸借対照表からどれだけの緩和が得られるのか？」と尋ねたという。\n言い換えれば、ウォーシュ氏はすでに、FRBのバランスシートを縮小するという長年の目標に向けてFOMCを動かすという任務を開始しているということだ。同氏が他の場所でも述べたように、それは金利引き上げの効果と同様に、事実上金融環境を引き締めることになるだろう。\nバランスシートの問題は、ウォーシュ氏の課題を物語っている。彼には、望む変化を迅速に押し進める力がないのだ。ウォーシュ氏は「体制変革」を掲げてFRB入りしたと述べた。しかし、その変化を達成するためのメカニズムは、遅かれ早かれFRBを自身の望む改革に押し込むだろうと同氏が信じている一連のゆっくりとした動きのタスクフォースである。彼はバランスシートを削減し、インフレを測定する別の方法を見つけて、AI によって再形成される経済に備えたいと考えています。\nしかし、対策本部は早くても年末までには報告しない見通しだ。委員会が貸借対照表に関して行動を起こす準備ができていないのは明らかだ。ウォーシュ氏がFRBの「手段」について明確に議論していることは、同氏が金利に関するあらゆる手段に加えて、バランスシートを利用して金融政策を引き締めるという可能な限り早い機会を利用するという強い示唆である。\n一方、ウォーシュ氏は、直接影響力を及ぼすことのできない関税やエネルギー価格の高さ、そしてその潜在的な成果がまだ見えていないAIブームによって打撃を受けた経済に対処しなければならない。\nウォーシュ氏は何十年もかけてFRBの指導者とその失敗を研究してきた。彼にとっては信頼性が最優先だ。同氏の言葉は、水曜日の会合後に投資家が解釈したよりも同氏が利上げへの道をさらに進んでいる可能性を示唆しており、次回9月に開催されるFOMCの前に発表される2つのインフレ報告を待っているだけかもしれない。\n今回の会合後に同氏が受けた暴行を考慮すると、次回会合で利上げの引き金を引くのにそれほど時間はかからないだろう。",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {

  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

  main.innerHTML = `

    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
