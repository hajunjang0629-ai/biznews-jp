    "summaryJa": "株式市場が不可避の低迷に向かい、10年国債などの長期債券がこれまでポートフォリオ内で提供してきた分散効果が得られないという根強い懸念のなか、多くの投資家が短期投資、特に超短期債券ファンドに目を向けている。過去 10 年間の株式市場のリターンは好調で、S&P 500 指数は過去 10 年間のほとんどで 2 桁の上昇を記録しました。 「マグ7」テクノロジー株とAIブームに支えられ、ここ数年は特に堅調だった。",
    "bodyOriginal": "Many investors are turning to short-term investments, particularly ultra-short bond funds, amid persistent concerns that the equity market is headed for an inevitable downturn and long-term bonds like the 10-year treasury are not providing the diversification benefits that they have provided within portfolios historically.\nStock market returns have been strong over the past decade, with the S&P 500 Index delivering double-digit gains for most of the past decade. The last several years have been especially robust, buoyed by the \"Mag 7\" technology stocks and the AI boom.\n\"Investors have enjoyed one of the strongest equity markets in history, and they're starting to get worried about downside risk,\" said Christopher Coolidge, chief investment officer at Brookwood Investment Group in Phoenix.\nAs investors take some money off the table, bank deposits are paying next to nothing with an average yield well under 1%, and long-term bonds are losing money in an uncertain rate environment. The iShares 20+ Year Treasury Bond ETF (TLT), for example, has posted an average annual return of negative 6.7% over the past five years, while its 7-10 Year Treasury Bond ETF (IEF) has posted an average annual decline of 1%.\nInvestors are looking for other safety trades to beat inflation. With their attractive yields and less downside risk, short-term investments are getting more attention.\nHow much is being moved into cash-like investments\nSome financial professionals have been moving a larger portion of their clients' portfolios to cash-like investments. Brookwood Investment Group's model portfolios, for instance, generally consist of about 5% cash. That's up from about 2% in June. \"We've become more defensive as equity markets continue to hit all-time highs,\" Coolidge said.\nFor the cash portion of their portfolios, Brookwood creates a basket of ultra-short ETFs, combining treasury exposure, floating rate securities, ETFs with active credit management and option-enhanced income strategies. A client can also opt to be 100% invested in the ultra-short basket for a little while, or even 50% or 20%, depending on their comfort level, Coolidge said.\nCyrus Amini, chief investment officer at Hyphen Wealth Management in Lafayette, California, also uses a combination of short-duration bond funds and money market funds for liquidity. \"I don't see the need to take duration risk in this market,\" he said.\nWhy ultra-short bond funds are big winners\nOften, when investors are concerned about the equity market, they look to bond funds, but there are concerns here too that go beyond the recent poor performance numbers. The long end of the bond market has become much more volatile amid inflation concerns, geopolitical fears and the belief that the Federal Reserve may have to raise rates before the end of the year, Coolidge said. Though recent inflation data, combined with unexpectedly soft jobs market data, have lowered the market odds that rate hikes are just ahead.\nBut ultra-short bond funds are proving popular as a short-term place to park money. These funds primarily invest in fixed-income securities with maturities typically under one year. This can include investments in government bonds, investment-grade corporate debt, asset-backed securities and commercial paper.\nUltra-short bond ETFs saw inflows of $12.8 billion in July, according to Morningstar Direct. These funds add slightly more yield than money market ETFs or mutual funds, with only a bit more risk, according to financial strategists. \"The ultrashorts are adding anywhere from 75 to 110 basis points over money market ETFs with comparable duration and interest rate sensitivity,\" Coolidge said.\nThe best ultra-short bond funds to buy in 2026 include the Baird Ultra Short Bond Fund (BUBIX) and the JPMorgan Ultra-Short Income ETF (JPST), according to Morningstar.\nMoney market funds eliminate rate risk\nUltra-short bond funds still carry some interest rate risk. If that bothers investors, they can purchase money market ETFs or mutual funds instead. \"It's all about your comfort level,\" said Brian Huckstep, chief investment officer of Advyzon Investment Management in Lisle, Illinois.\nMoney market ETFs are still relatively new, but they're gaining popularity. The first of these ETFs started trading in 2024, and there are only nine in the U.S., said Daniel Sotiroff, associate director of ETF and passive strategies research for North America at Morningstar Research Services. They're small compared with their mutual fund peers. Assets totaled $24 billion across the nine ETFs at the end of July, compared with $7.7 trillion held in money market mutual funds, according to Morningstar data.\nNonetheless, net flows into money market ETFs have been positive every month since inception except for June and July 2026, and they've been gaining traction, according to Morningstar Direct. From January through July, money market ETFs had net inflows of $18.7 billion, compared with $2.8 billion for money market mutual funds.\nThe largest money market ETF is the ProShares GENIUS Money Market ETF (IQMM). That fund had $17.4 billion in assets at the end of July, according to Morningstar Direct.\nA focus on rebalancing, reducing risk after big stock gains\nThe run-up in equities means that many investors' target asset allocations are off-kilter, Amini said, and he added that makes it a good time to be prudent about rebalancing to reduce portfolio risk. This could mean putting more into short-duration fixed income and money markets, with the idea that as long as the investments earn slightly above inflation, it's a win, Amini said. He's been spending more time with clients talking about locking in gains — incrementally taking some of the equity gains off the table and putting them in money market funds or ultra-short bond funds. \"I would rather be more prudent ahead of time than worry about things once a potential drawdown has occurred,\" he said.\nAnother reason clients may want to shift out of equities is that their goals have changed. \"If you plan to make a down payment on a house in eight months, that money shouldn't be in the stock market,\" said Mike Bisaro, president and chief executive at StraightLine, an investment advisory firm in Troy, Michigan. However, investors should feel comfortable investing in an ultra-short bond fund or money market fund. \"They're at least doing a better job of holding your buying power than a bank where you're effectively losing money,\" he said.\nNever just 'go to cash'\nAlthough investors have been turning to safer investments, the percentage of assets in money market funds has been relatively consistent compared with stock and bond funds since the aftermath of the Covid-19 pandemic, according to Sotiroff. The proportion of money invested in money markets has been around 18% to 20% over the past several years. At the end of June, around 64% of money was in stock funds, 18% in bond funds, and 17.5% in money markets, according to Morningstar data.\nInvestors shouldn't try to time the market. They should also ensure they keep a healthy percentage of equities in their portfolio, based on factors such as age, assets, liabilities and risk tolerance. \"The problem with going completely to cash is that you've introduced the element of timing to your portfolio,\" Bisaro said. Investors sometimes say they'll reinvest in equities when things get better. \"Who's to say when that will be?\"",
    "bodyJa": "株式市場が不可避の低迷に向かい、10年国債などの長期債券がこれまでポートフォリオ内で提供してきた分散効果が得られないという根強い懸念のなか、多くの投資家が短期投資、特に超短期債券ファンドに目を向けている。\n過去 10 年間の株式市場のリターンは好調で、S&P 500 指数は過去 10 年間のほとんどで 2 桁の上昇を記録しました。 「マグ7」テクノロジー株とAIブームに支えられ、ここ数年は特に堅調だった。\nブルックウッド・インベストメント・グループ（フェニックス）の最高投資責任者クリストファー・クーリッジ氏は「投資家は史上最も強い株式市場の一つを享受しており、下値リスクを懸念し始めている」と述べた。\n投資家が資金を手放す中、銀行預金は平均利回りが1％をはるかに下回る水準でほとんど支払われず、不確実な金利環境で長期債券は損失を被っている。例えば、iシェアーズの20年以上国債ETF（TLT）は過去5年間で年平均リターンがマイナス6.7％となっている一方、7～10年国債ETF（IEF）は年平均1％の下落を記録している。\n投資家はインフレに打ち勝つための他の安全取引を模索している。利回りが魅力的で下値リスクが少ないため、短期投資への注目が高まっています。\nどれだけが現金同様の投資に振り込まれているか\n一部の金融専門家は、顧客のポートフォリオの大部分を現金同様の投資に移しています。たとえば、ブルックウッド・インベストメント・グループのモデルポートフォリオは通常、約5％の現金で構成されている。 ６月の約２％から上昇した。クーリッジ氏は「株式市場が過去最高値を更新し続ける中、われわれはより守りの姿勢になっている」と述べた。\nブルックウッドは、ポートフォリオの現金部分について、国債エクスポージャー、変動利付証券、アクティブな信用管理とオプション強化インカム戦略を備えたETFを組み合わせた超短期ETFのバスケットを作成しています。顧客は、快適さのレベルに応じて、しばらくの間超短バスケットに 100% 投資することも、50% または 20% を投資することも選択できる、とクーリッジ氏は述べた。\nカリフォルニア州ラファイエットのハイフン・ウェルス・マネジメントの最高投資責任者であるサイラス・アミニ氏も、流動性確保のために短期債券ファンドとマネーマーケットファンドを組み合わせて利用している。同氏は「この市場ではデュレーションリスクを取る必要性は感じられない」と述べた。\n超短期債券ファンドが大きな勝者となる理由\n多くの場合、投資家は株式市場を懸念する場合、債券ファンドに目を向けますが、ここでも最近のパフォーマンスの悪さの数字を超えた懸念があります。クーリッジ氏は、インフレ懸念や地政学的な懸念、米連邦準備理事会（ＦＲＢ）が年末までに利上げが必要になるかもしれないとの見方を背景に、債券市場の長期金利はさらに不安定になっていると述べた。しかし、最近のインフレ統計は、予想外に軟調な雇用市場データと相まって、利上げが目前に迫っているという市場の確率を低下させている。\nしかし、超短期債券ファンドは短期的な資金の保管場所として人気が高まっている。これらのファンドは主に満期が通常 1 年未満の債券に投資します。これには、国債、投資適格社債、資産担保証券、コマーシャルペーパーへの投資が含まれます。\nモーニングスター・ダイレクトによると、超短期債券ＥＴＦには７月に１２８億ドルの流入があった。金融ストラテジストによれば、これらのファンドは短期金融市場のETFや投資信託よりも利回りが若干高くなりますが、リスクはわずかに高いだけです。クーリッジ氏は「ウルトラショートは、同等のデュレーションと金利感応度を備えた短期金融市場ETFに比べて75〜110ベーシスポイント上昇している」と述べた。\nモーニングスターによると、2026年に購入するのに最適な超短期債券ファンドには、ベアード・ウルトラショート債券ファンド（BUBIX）とJPモルガン・ウルトラショート・インカムETF（JPST）が含まれるという。\nマネーマーケットファンドは金利リスクを排除します\n超短期債券ファンドには依然としてある程度の金利リスクが伴います。それが投資家にとって気になる場合は、代わりにマネーマーケットETFや投資信託を購入することもできます。イリノイ州ライルにあるアドビゾン・インベストメント・マネジメントの最高投資責任者ブライアン・ハックステップ氏は、「すべては自分の快適さのレベルだ」と語る。\nマネーマーケット ETF はまだ比較的新しいものですが、人気が高まっています。モーニングスター・リサーチ・サービシズの北米向けETFおよびパッシブ戦略調査アソシエートディレクター、ダニエル・ソティロフ氏によると、これらのETFの最初のものは2024年に取引が開始され、米国には9つしかないという。同業の投資信託と比較すると規模は小さい。モーニングスターのデータによると、7月末時点で9つのETF全体の資産総額は240億ドルだったのに対し、マネーマーケット・ミューチュアルファンドの保有資産は7兆7000億ドルだった。\nそれにもかかわらず、モーニングスター・ダイレクトによると、短期金融市場ETFへの純流入額は2026年6月と7月を除き、開始以来毎月プラスとなっており、勢いを増しているという。 1月から7月までのマネーマーケットETFの純流入額は187億ドルで、マネーマーケットミューチュアルファンドの純流入額は28億ドルだった。\n最大のマネーマーケットETFはProShares GENIUS Money Market ETF (IQMM)です。モーニングスター・ダイレクトによると、同ファンドの7月末時点の資産は174億ドルだった。\nリバランスに重点を置き、株価が大幅に上昇した後のリスクを軽減\nアミニ氏は、株式の急騰は多くの投資家の目標資産配分がずれていることを意味しており、ポートフォリオのリスクを軽減するためのリバランスについて慎重になる良い時期だと付け加えた。アミニ氏は、これは、投資収益がインフレをわずかに上回っていれば勝ちだという考えのもと、短期債券や短期金融市場への投資を増やすことを意味する可能性があると述べた。同氏は、利益の確定について顧客と話す時間を増やしており、株式利益の一部を段階的にテーブルから外し、マネーマーケットファンドや超短期債券ファンドに移している。同氏は「潜在的な下落が起きてから心配するよりも、事前に慎重になりたい」と述べた。\n顧客が株式からのシフトを希望するもう 1 つの理由は、目標が変化したことです。ミシガン州トロイの投資顧問会社ストレートラインの社長兼最高経営責任者マイク・ビサロ氏は、「8カ月以内に住宅の頭金を支払うつもりなら、そのお金は株式市場に出すべきではない」と語る。ただし、投資家は超短期債券ファンドやマネーマーケットファンドに安心して投資できるはずです。 「少なくとも事実上損失を被っている銀行よりも、彼らは購買力を維持するという点でうまく機能している」と同氏は語った。\n決して「現金に行く」だけではない\nソティロフ氏によると、投資家はより安全な投資に目を向けているが、新型コロナウイルス感染症パンデミック（世界的大流行）の余波以来、マネーマーケットファンドの資産に占める割合は株式や債券ファンドに比べて比較的安定しているという。過去数年間、短期金融市場に投資される資金の割合は約18％から20％であった。モーニングスターのデータによると、６月末時点で資金の約６４％が株式ファンド、１８％が債券ファンド、１７．５％が短期金融市場に投じられていた。\n投資家は市場のタイミングを計ろうとすべきではありません。また、年齢、資産、負債、リスク許容度などの要素に基づいて、ポートフォリオ内の株式の健全な割合を維持する必要もあります。 「完全に現金化する場合の問題は、ポートフォリオにタイミングの要素を持ち込んでいることだ」とビサロ氏は言う。投資家は時々、状況が良くなったら株式に再投資すると言います。 「それがいつになるか誰が言えるでしょうか？」",

    "id": "eleven-killed-in-israeli-strikes-on-sout-36042447",
    "title": "Eleven killed in Israeli strikes on southern Lebanon, authorities say",
    "titleJa": "イスラエル軍によるレバノン南部攻撃で11人死亡、当局発表",
    "summaryJa": "イスラエル軍によるレバノン南部攻撃で11人死亡、当局発表- 公開されました",
    "bodyOriginal": "Eleven killed in Israeli strikes on southern Lebanon, authorities say\n- Published\nEleven people have been killed in Israeli strikes in southern Lebanon, authorities say, in one of the deadliest days of attacks since an agreement aimed at reducing hostilities was announced in June.\nLebanon's prime minister said seven people were killed in a strike on a house on the outskirts of Ansar in the Nabatieh district, which state media reported included three children and two women.\nLater on Saturday, another round of strikes hit the town of Deir al-Zahrani, killing four and wounding five others, the Lebanese Ministry of Health said.\nIsrael's military said it had struck \"Hezbollah terror infrastructure\" in response to what it described as an earlier action against its soldiers.\nAuthorities say the strike in Ansar at around 04:30 (01:30 GMT) occurred where displaced families were living. Footage on social media shows large plumes of smoke permeating through the streets of the village as sirens ring out.\nLebanon's Prime Minister Nawaf Salam condemned the attacks, saying the seven civilians killed were not \"military infrastructure\".\n\"Israel must halt this escalation,\" he said. \"For the security of our people and their right to life on their land are not subject to negotiation or bargaining.\"\nThe Israel Defense Forces (IDF) said the incident that had prompted its strike on Ansar took place in the Ali al-Taher Ridge, a strategic high ground overlooking much of south-eastern Lebanon and of the war's most fiercely contested positions.\nLebanon's state-run National News Agency (NNA) also reported a series of strikes around the ridge.\nNear the border, several homes were reportedly destroyed in Bint Jbeil, while Israeli forces opened heavy machine gun fire towards houses, according to NNA.\nLebanon was drawn into the war between Israel, the US and Iran on 2 March, when Hezbollah - the armed group affiliated with Iran - launched rockets into Israel in retaliation for a strike that killed Iran's supreme leader.\nIsrael responded by launching a bombing campaign across Lebanon and invading a significant part of the country's south. Its forces continue to occupy roughly 5% of Lebanese territory.\nThe June ceasefire framework calls for Hezbollah to disarm, Israeli forces to withdraw gradually from southern Lebanon and the Lebanese army to deploy across the area.\nLebanon's President Joseph Aoun condemned the Israeli strikes that had killed an entire family in Ansar and its \"repeated violations\" of the framework, which he said sent a \"clear message\" to the US-led negotiations.\nHezbollah was not involved in the agreement and has rejected direct negotiations.\nThe IDF says it will continue to remove threats to Israeli citizens and soldiers operating in the security zone - the 10km-deep military buffer in southern Lebanon occupied by Israel.\nDespite a reduction in fighting following the June agreements, Israeli strikes and demolitions in southern Lebanon have continued.\nOn Friday, Hezbollah leader Naim Qassem criticised the Lebanese authorities over the implementation of the framework, accusing them of putting pressure on the Lebanese army while Israeli attacks continued.\n\"How can you accept this ongoing humiliation of the Lebanese army, exposing it to bombardment and Israeli pressures, instead of acting as its protectors?\" he said.\nLebanese and Israeli negotiators are set to meet for an eighth round of negotiations in September, but a final date has not been set.\n- Published6 August",
    "bodyJa": "イスラエル軍によるレバノン南部攻撃で11人死亡、当局発表\n- 公開されました\n当局によると、レバノン南部でのイスラエル軍の攻撃で11人が死亡、6月に敵対関係の縮小を目的とした合意が発表されて以来、最も死者数の多い攻撃となった。\nレバノン首相は、ナバティエ地区のアンサール郊外の家屋へのストライキで７人が死亡し、国営メディアの報道によると、その中には子供３人と女性２人が含まれていたと述べた。\nレバノン保健省によると、土曜遅くに別の空爆がデリ・アル・ザフラニの町を襲い、４人が死亡、５人が負傷した。\nイスラエル軍は、兵士に対する以前の行為と称する行為に対抗して「ヒズボラのテロインフラ」を攻撃したと発表した。\n当局によると、アンサールでのストライキは午前４時３０分（日本時間午後１時３０分）ごろ、避難民の家族が住んでいる場所で発生した。ソーシャルメディア上の映像には、サイレンが鳴り響く中、村の通りに大きな煙が立ち込める様子が映っている。\nレバノンのナワフ・サラーム首相は、殺害された民間人７人は「軍事インフラ」ではないと述べ、攻撃を非難した。\n「イスラエルはこのエスカレーションを止めなければならない」と彼は言った。 「なぜなら、我が国民の安全とその土地で生きる権利は交渉や交渉の対象ではないからです。」\nイスラエル国防軍（IDF）は、アンサール攻撃のきっかけとなった事件は、レバノン南東部の大部分と戦争で最も激戦となった陣地を見下ろす戦略的な高台であるアリ・アル・タヘル尾根で発生したと発表した。\nレバノン国営通信社（NNA）も尾根周辺での一連の攻撃を報じた。\nＮＮＡによると、国境近くのビント・ジュベイルでは数軒の家が破壊され、イスラエル軍は家に向けて重機関銃を発砲したという。\n3月2日、イラン系武装組織ヒズボラがイラン最高指導者を殺害した攻撃への報復としてイスラエルにロケット弾を発射し、レバノンはイスラエル、米国、イラン間の戦争に巻き込まれた。\nイスラエルはレバノン全土で爆撃作戦を開始し、同国の南部の大部分を侵攻することでこれに応じた。同軍はレバノン領土の約５％を占領し続けている。\n６月の停戦枠組みでは、ヒズボラの武装解除、イスラエル軍の南レバノンからの段階的撤退、レバノン軍の地域全域への展開が求められている。\nレバノンのジョセフ・アウン大統領は、アンサールで一家全員を殺害したイスラエルの空爆と枠組みへの「度重なる違反」を非難し、これは米国主導の交渉に「明確なメッセージ」を送ったと述べた。\nヒズボラは合意には関与しておらず、直接交渉を拒否している。\nイスラエル国防軍は、イスラエルが占領するレバノン南部の深さ10キロメートルの軍事緩衝地帯である安全地帯で活動するイスラエル国民と兵士に対する脅威を除去し続けると述べた。\n6月の合意を受けて戦闘は減少したにもかかわらず、レバノン南部でのイスラエルによる攻撃と破壊は続いている。\n金曜日、ヒズボラ指導者ナイム・カセムは枠組みの実施をめぐりレバノン当局を批判し、イスラエルによる攻撃が続く中レバノン軍に圧力をかけていると非難した。\n「レバノン軍を保護者として振る舞わず、砲撃やイスラエルの圧力にさらし続けているレバノン軍の屈辱をどうして受け入れることができるのか？」彼は言い​​ました。\nレバノンとイスラエルの交渉担当者は９月に第８回交渉に向けて会合する予定だが、最終日はまだ決まっていない。\n- 8 月 6 日発行",

    "id": "iran-rebuffs-trump-s-claim-over-strait-o-03518306",
    "title": "Iran rebuffs Trump's claim over Strait of Hormuz amid report of another ship being struck",
    "titleJa": "別の船舶が衝突されたとの報告を受けて、イランはホルムズ海峡に関するトランプ大統領の主張を拒否",
    "summaryJa": "イランは、ホルムズ海峡が間もなく米国の領土になるというドナルド・トランプ米大統領の主張を拒否した。重要な水路で船舶が衝突されたと伝えられ、イランとの交渉再開は間近に見えないためだ。イランのカゼム・ガリババディ外務次官は金曜日遅くのＸ通信への投稿で、「ホルムズ海峡はこれまでもイランのものであり、イランのものであり、これからもイランのものであり続ける。この海峡はイランの指揮下でのみ閉鎖され、開放されるだろう」と述べた。 「ホルムズ海峡はツイートや空母、命令や選挙演説によって占領することはできない。」",
    "bodyOriginal": "Iran rebuffed U.S. President Donald Trump's claim that the Strait of Hormuz would soon become U.S. territory, as a ship in the crucial waterway was reportedly struck and negotiations with Tehran appeared no nearer to resuming.\n\"The Strait of Hormuz has been Iranian, is Iranian, and will remain Iranian; this strait will only be closed and opened under Iran's command,\" Iran's Deputy Foreign Minister Kazem Gharibabadi said in a post on X late Friday. \"The Strait of Hormuz cannot be seized by tweet, nor by aircraft carrier, nor by issuing an order, nor by an election speech.\"\nEarlier, Trump claimed that after the U.S. defeats Iran, \"pretty soon I'll be declaring the Hormuz Strait a territory of the United States.\"\nTrump, known to cite the phrase \"to the victor belong the spoils,\" has floated the possibility that the U.S. could impose tolls in the strait once the conflict ends, though he later dropped the idea. The strait was an open, un-tolled international waterway before the U.S. and Israel started the war on Feb. 28 by launching strikes against Iran.\nIran's foreign minister was quoted as saying the two sides do \"not have anything like a ceasefire.\"\n\"No negotiations have been held between us and the United States at this time,\" Iranian news outlet Shahrara News quoted Seyed Abbas Araghchi as saying early Saturday. \"Qatar and Pakistan are exchanging messages between the parties and are in contact with us, but this does not mean negotiations.\"\nSeparately, the United Kingdom Maritime Trade Operations Centre (UKMTO) — an organization backed by the British Navy — said Saturday it received a verified report of a bulk carrier \"being struck by an unknown projectile which has hit the hull.\"\nFollowing the breakdown of an interim ceasefire in June, shipping in the strait has repeatedly come under fire from Iranian projectiles and the U.S. has struck Iranian targets as part of its blockade of Iranian ports.\nA 'tiny little bit more' for gas\nAmid the military and diplomatic stalemate, energy prices remain elevated compared to pre-war levels.\nTrump said Friday that Americans would need to tolerate slightly higher fuel prices while the U.S. punishes Iran.\n\"So for you to pay a tiny little bit more for your gasoline, just remember you're doing it so that a very evil country cannot have, a country that really is the number one state sponsor of terror in the world,\" Trump said in his speech.\n\"We don't want to have them have a nuclear weapon. So remember that, when you have to pay a little bit more, you're at four dollars,\" Trump said.\nThe average price of a gallon of gasoline across the U.S. was $4.07 on Saturday, according to the American Automobile Association, higher than the year-ago average price of $3.15.\nThe U.S. is also maintaining a tough sanctions regime against Iran.\nTreasury Secretary Scott Bessent said the U.S. will be applying economic measures \"that have never been seen on Iran.\"\n\"It will be a combination of economic isolation like the world has never seen before, and the continued blockade in the Strait of Hormuz that will keep anything from going in or out of the Iranian ports,\" Bessent said in a Newsmax interview Thursday night, without elaborating further.\nIndefinite naval blockade\nBessent's comments came as U.S. Defense Secretary Pete Hegseth reportedly said late Thursday that the military can keep a naval blockade of Iran going \"indefinitely.\" The Navy will rotate ships in and out \"as we have, and we'll continue to,\" Hegseth told reporters.\nMedia reports have said that the U.S. aircraft carrier USS George Washington was headed to replace the USS Abraham Lincoln, which has been deployed for more than 250 days in the Middle East. Its deployment had been expected to end in May.\nThe George Washington strike group departed Vietnam on Aug. 12, the Navy said in a statement.\nHegseth claimed that reports about poor conditions aboard the Lincoln, including food shortages, declining morale and even attempts by sailors to jump overboard, were \"completely misrepresented.\"\nAfter Hegseth's comments, Rep. Mike Levin, D-Calif., said on X that he had sent a letter to Hegseth and acting Secretary of the Navy Hung Cao to express serious concerns about conditions aboard the Lincoln.\n\"The reports coming from military families and loved ones about the conditions aboard the USS Lincoln are simply unacceptable. Reports include concerns of moldy showers, broken toilets, lack of hot water, lack of access to fresh produce, and supply shortages,\" the letter said.\nSailors and Marines are also said to have an \"overwhelming workload,\" which is contributing to \"extreme fatigue and burnout,\" it said.\nIn a post on X, U.S. Central Command said that reports alleging a brawl aboard the carrier were false, and that no service members have died.\nThis came after Iranian media claimed on Tuesday that seven U.S. Navy personnel have been killed and several wounded \"in a violent clash\" on the Lincoln.\n— CNBC's Kevin Breuninger and Lim Hui Jie contributed to this report.",
    "bodyJa": "イランは、ホルムズ海峡が間もなく米国の領土になるというドナルド・トランプ米大統領の主張を拒否した。重要な水路で船舶が衝突されたと伝えられ、イランとの交渉再開は間近に見えないためだ。\nイランのカゼム・ガリババディ外務次官は金曜日遅くのＸ通信への投稿で、「ホルムズ海峡はこれまでもイランのものであり、イランのものであり、これからもイランのものであり続ける。この海峡はイランの指揮下でのみ閉鎖され、開放されるだろう」と述べた。 「ホルムズ海峡はツイートや空母、命令や選挙演説によって占領することはできない。」\nこれに先立ち、トランプ大統領は米国がイランに勝利した後、「近いうちにホルムズ海峡を米国の領土と宣言するだろう」と主張した。\n「戦利品は勝者のもの」という言葉を引用することで知られるトランプ大統領は、紛争終結後に米国が海峡に通行料を課す可能性を示唆したが、後にその考えを取り下げた。米国とイスラエルが2月28日にイランへの攻撃を開始して戦争を開始するまで、この海峡は開放された有料の国際水路だった。\nイランの外相は、両国には「停戦のようなものはない」と述べたと伝えられた。\nイラン報道機関シャハラ・​​ニュースは、土曜日早朝のシード・アッバス・アラグチ氏の発言として、「現時点では我々と米国の間で交渉は行われていない」と伝えた。 「カタールとパキスタンは当事国間でメッセージを交換し、我々と連絡を取り合っているが、これは交渉を意味するものではない」\nこれとは別に、英国海軍が支援する組織である英国海事貿易業務センター（UKMTO）は土曜日、ばら積み貨物船が「船体に衝突した未知の飛翔体に衝突した」という検証済みの報告を受けたと発表した。\n6月の暫定停戦の決裂後、海峡の船舶は繰り返しイランの飛翔体による砲撃にさらされており、米国はイランの港湾封鎖の一環としてイランの目標を攻撃している。\nガスの「もう少し」\n軍事的・外交的行き詰まりの中で、エネルギー価格は戦前の水準に比べて依然として上昇している。\nトランプ大統領は金曜日、米国がイランを懲罰している間、米国人は燃料価格の若干の上昇を容認する必要があると述べた。\nトランプ大統領は演説の中で、「だから、ガソリン代を少しだけ多く払うのは、本当に極悪な国、まさに世界で一番のテロ支援国家ではありえないようにするためにそうしているということを忘れないでほしい」と述べた。\nトランプ大統領は「われわれは彼らに核兵器を持たせたくない。だから、もう少しお金を払わなければならないときは4ドルになることを覚えておいてほしい」と語った。\n米国自動車協会によると、土曜日の全米のガソリン１ガロンの平均価格は４．０７ドルで、前年の平均価格３．１５ドルを上回った。\n米国はイランに対しても厳しい制裁体制を維持している。\nスコット・ベッセント財務長官は、米国は「イランに対してこれまでにない」経済措置を適用すると述べた。\nベッセント氏は木曜夜のニュースマックスのインタビューで、「これは世界がこれまでに見たことのないような経済的孤立と、イランの港への物の出入りを阻止するホルムズ海峡の継続的な封鎖の組み合わせになるだろう」と述べたが、それ以上詳しくは述べなかった。\n無期限の海上封鎖\nベッセント氏のコメントは、ピート・ヘグセス米国防長官が木曜日遅く、軍はイランに対する海上封鎖を「無期限」に継続することが可能だと述べたと報じられた中で出た。ヘグセス氏は記者団に対し、海軍は「これまでと同様、今後も船舶の出入りをローテーションする」と語った。\nメディアの報道によると、米国の空母ジョージ・ワシントンは、中東に250日以上配備されている空母エイブラハム・リンカーンの後継として向かう予定だという。その配備は5月に終了すると予想されていた。\n海軍は声明で、ジョージ・ワシントン打撃群は8月12日にベトナムを出発したと発表した。\nヘグセス氏は、食糧不足、士気の低下、さらには船員による飛び降りの試みなど、リンカーン号の劣悪な船内の状況に関する報道は「完全に誤って伝えられている」と主張した。\nヘグセス氏のコメントを受けて、マイク・レビン下院議員（民主党、カリフォルニア州）はＸで、ヘグセス氏とフン・カオ海軍長官代理に書簡を送り、リンカーン艦内の状況について深刻な懸念を表明したと述べた。\n書簡には「USSリンカーンの船内の状況について軍人の家族や愛する人たちから寄せられた報告はまったく受け入れられない。報告にはカビの生えたシャワー、壊れたトイレ、お湯の不足、生鮮食品へのアクセスの欠如、物資不足などの懸念が含まれている」と述べた。\n船員と海兵隊員は「圧倒的な仕事量」を抱えているとも言われており、それが「極度の疲労と燃え尽き症候群」の一因となっているという。\n米中央軍はＸへの投稿で、空母内で乱闘があったとする報道は虚偽であり、軍人は死亡していないと述べた。\nこれは、イランメディアが火曜日、リンカーン号での「暴力的な衝突」で米海軍関係者７人が死亡、数人が負傷したと主張したことを受けてのことだった。\n— CNBC の Kevin Breuninger と Lim Hui Jie がこのレポートに貢献しました。",

    "id": "at-least-14-dead-after-7-7-magnitude-ear-7be922b8",
    "title": "At least 14 dead after 7.7-magnitude earthquake strikes Indonesia",
    "titleJa": "インドネシアでマグニチュード7.7の地震が発生、少なくとも14人死亡",
    "summaryJa": "インドネシアでマグニチュード7.7の地震が発生、少なくとも14人死亡- 公開されました",
    "bodyOriginal": "At least 14 dead after 7.7-magnitude earthquake strikes Indonesia\n- Published\nAt least fourteen people have died after a 7.7-magnitude earthquake struck Indonesia early on Saturday, the nation's disaster mitigation agency has said.\nBPBD said that others had been injured to varying degrees, cautioning that the figures were preliminary while search and rescue operations were ongoing.\nTeams are working to free anyone trapped in buildings damaged by the quake and the dozens of aftershocks that followed. A tsunami warning was issued but lifted around three hours after the initial jolt.\nThe quake struck the island of Flores shortly before 05:00 local time on Saturday (23:00 GMT on Friday). It had a depth of 15km, Indonesia's meteorology and geophysics agency stated.\nThe shallower an earthquake is, the more destructive its effects on the surface tend to be.\nStrong aftershocks were felt in the same area, including one with a magnitude of 6.1.\nVideo taken at the port in Maumere showed large chunks of concrete breaking off the terminal building onto passengers waiting to board an inter-island ferry. Some were thrown into the sea when the gangway to a ship collapsed.\nEmanuel Melkiades Laka Lena, governor of East Nusa Tenggara province, told a news conference that they were killed in their sleep by collapsing rubble.\nA stream of people could be seen moving inland on motorbikes after authorities issued a tsunami warning. BNPB said 2,000 people had evacuated or relocated on their own.\nBut it will take time to assess the full extent of the destruction in the region, which is remote and mountainous.\nBNPB advised people to remain calm and stay away from coastal areas.\n\"Residents should also avoid entering buildings, especially those that have already sustained cracks or structural damage,\" BNPB said.\n\"A rapid assessment is currently underway to determine the number of casualties and the extent of the impact. We will provide that information after the data has been verified.\"\nAbout 2,000 residents in Nagekeo were evacuated with damage reported to a number of buildings.\nArnold Welianto, who lives in Talibura village, Sikka, East Nusa Tenggara, told the BBC that he was still asleep when he felt the \"very strong shaking\".\n\"I was startled awake and immediately went to my child's room,\" he said.\n\"Once we were outside, residents in our neighbourhood, which is located close to the shoreline, had already fled their homes and were heading toward the hills and crowding the roads, while some other residents were standing along the roadside because the sea had also receded.\n\"The water remained low for quite some time, so everyone panicked and ran - I went around to the community health centre, and the people there had already been evacuated.\"\nWelianto said many residents were choosing to remain outdoors as ongoing aftershocks meant they were afraid to return home.\nIndonesia is prone to earthquakes and volcanic activity, lying along the meeting point of three major tectonic plates.",
    "bodyJa": "インドネシアでマグニチュード7.7の地震が発生、少なくとも14人死亡\n- 公開されました\n土曜日早朝にインドネシアを襲ったマグニチュード7.7の地震により、少なくとも14人が死亡したと同国の防災当局が発表した。\nBPBDは、他にもさまざまな程度の負傷者が出ていると述べ、この数字は捜索救助活動が進行中の暫定的なものであると警告した。\nチームは、地震とその後の数十回の余震によって被害を受けた建物に閉じ込められた人々を救出するために取り組んでいる。津波警報は発令されたが、最初の揺れから約３時間後に解除された。\n地震は土曜日の現地時間午前５時（金曜日の日本時間午後２３時）直前にフローレス島を襲った。インドネシアの気象・地球物理庁によると、その深さは15キロメートルだった。\n地震の深さが浅いほど、地表への破壊的な影響が大きくなる傾向があります。\n同じ地域で強い余震が感じられ、その中にはマグニチュード6.1の地震もあった。\nマウメレの港で撮影されたビデオには、大きなコンクリートの塊がターミナルビルから島間フェリーの乗船を待つ乗客の上に突き破られる様子が映っていた。船への通路が崩壊し、海に投げ出された人もいた。\n東ヌサトゥンガラ州知事エマヌエル・メルキアデス・ラカ・レナ氏は記者会見で、彼らは崩れた瓦礫によって睡眠中に死亡したと語った。\n当局が津波警報を発令した後、バイクで内陸部に移動する人々の流れが見られた。 ＢＮＰＢは、２０００人が自力で避難または移住したと発表した。\nしかし、遠隔地で山岳地帯にあるこの地域の破壊の全容を評価するには時間がかかるだろう。\nBNPBは人々に対し、落ち着いて沿岸地域に近づかないよう勧告した。\nBNPBは「住民は建物、特にすでに亀裂や構造的損傷を受けている建物への立ち入りも避けるべきだ」と述べた。\n「死傷者の数と影響の範囲を決定するための迅速な評価が現在進行中です。データが検証された後、その情報を提供します。」\nナゲケオでは、多くの建物に被害が報告され、住民約2,000人が避難した。\n東ヌサトゥンガラ州シッカ州タリブラ村に住むアーノルド・ウェリアントさんはBBCに対し、「非常に強い揺れ」を感じたときはまだ眠っていたと語った。\n「私はびっくりして目が覚めて、すぐに子供部屋に行きました」と彼は語った。\n「私たちが外に出ると、海岸線近くに位置する近所の住民はすでに家から逃げ出し、丘に向かって道路に混雑しており、海も引いていたため他の住民の中には道端に立っていた人もいました。\n「かなり長い間、水位が下がったままだったので、みんなパニックになって逃げ出した。私は地域の保健センターに行ってみたが、そこにいる人々はすでに避難していた。」\nウェリアント氏は、余震が続いているため、多くの住民が自宅に戻るのを恐れ、屋外に留まることを選択していると述べた。\nインドネシアは 3 つの主要なプレートの合流点に沿って位置しており、地震と火山活動が発生しやすい国です。",

    "id": "beijing-is-said-to-move-to-clarify-tax-r-d9c2fb18",
    "title": "Beijing is said to move to clarify tax rules stoking confusion among China's ultra-wealthy",
    "titleJa": "中国政府は中国の超富裕層の間で混乱を招いている税制の明確化に動いていると言われている",
    "summaryJa": "この政策が中国人富裕層やアドバイザーの間で混乱を招いたことを受け、中国政府はオフショア信託に関する新たな課税規則のあいまいさを明確にする方向で動いていると言われている。",
    "bodyOriginal": "Beijing is moving to clarify new tax rules on offshore trusts that have sowed confusion among wealthy Chinese citizens and their advisers.\nChina's State Taxation Administration is conducting large-scale training for local tax officers to align on how the levy on offshore trusts – some of them set up decades ago – should be applied, according to several onshore and offshore tax lawyers.\nThe tax agency has also sent out draft guidelines to onshore law and accounting firms, and plans consultation sessions with lawyers in the coming weeks, according to multiple lawyers and advisors who didn't want to be named discussing sensitive policy matters. Some of those people expect more draft guidance to follow, with the documents eventually made public.\nThe STA has been conducting internal trainings at the provincial, municipal and county level to align interpretation across local tax offices, said Windson Li, co-head of tax for Asia at DLA Piper.\nThe Chinese Embassy in Singapore, and tax bureaus in Beijing, Shanghai and Guangdong, did not respond to CNBC's request for comments.\nBeijing last month imposed a 20% tax on offshore trusts – a structure long used by China's wealthy families to hold hundreds of billions of dollars outside the country. The move set off a panic rush for tax and legal advice, and a scramble for cash to meet the bill.\nThe levy applies at nearly every stage of a trust's life, from establishment to profit distribution and wind-up. Individuals must also declare and settle outstanding taxes on assets already transferred into such structures within 90 days of the rules' release – by Oct. 21 – or face surcharges for late filing or non-payment.\nConfusion\nWhile the rules ended decades of regulatory ambiguity about the vehicles, they have also created fresh confusion over implementation.\nTrusts established after 2023 face the 20% charge at inception, but it remains unclear how many years back owners of older structures, which are subject to an annual recurring tax, must declare, said Yuan Cao, Beijing-based partner of law firm Yingke.\nAdvisors also warn that many trust assets could fall afoul of foreign-investment reporting rules issued in July, potentially inviting scrutiny from foreign-exchange authorities over how the money left China in the first place.\nSome questions include whether the standard statute of limitations of three to five years applies to offshore trusts that were set up before 2023; how extensive documentation must be for a filing to be accepted, or rejected; and whether the October deadline is the cut-off for declaration or full tax payment, DLA Piper's Li said.\nLocal authorities are expected to become broadly aligned with the STA's interpretation of those details over the coming weeks, he added.\nIt is not uncommon for China's central government to fine-tune major policy announcements through follow-up circulars. However, time spent waiting for clarification on the rules also eats into the 90-day window.\nThere had been widely different approaches from different local authorities before last month's rules, said a Hong Kong-based lawyer, who asked not to be named due to the sensitivity of the matter. The lawyer added that the STA recognizes there is uncertainty.\nSome wealthy individuals have negotiated previous lump-sum settlements with provincial tax offices to resolve their liabilities, and it's unclear whether those remain valid under Beijing's new rules, according to multiple lawyers.\nA gathering storm\nThe tax push comes as Beijing hunts for new sources of fiscal revenue. Land sales, long a mainstay of local government finances, have collapsed amid the property downturn.\nPersonal income tax will become an increasingly important source of fiscal revenue, as Beijing broadens the tax base to capture wealthier individuals and offshore wealth, while enforcement improves, said Dan Wang, China director at Eurasia Group.\nChinese tax residents are required to pay tax on their worldwide income, including taxable returns from overseas insurance products, officials said earlier this month.\nIn the first half of this year, personal income tax collected reached roughly 900 billion yuan ($133.5 billion) up 13% from a year earlier — the largest absolute increase among major Chinese tax categories, Wang noted.\nOfficials have also toughened their stance on capital leaving the country. Beijing banned three cross-border online brokerages from serving mainland users earlier this year, and some cities, including Beijing and Hangzhou, have begun taxing overseas insurance proceeds received by Chinese citizens, according to Chinese local media.\n\"These measures can easily create a sense that a storm is gathering,\" said Neo Wang, chief China strategist at Evercore ISI, who added that these concerns may be overdone.\nChina's State Council in late July also issued new exit and entry regulations – effective in September – that expand the circumstances under which citizens can be barred from leaving the country, including for violations of export-control rules that could endanger national technology and industrial security.\nThe framework could give local authorities firmer legal ground to restrict departures by people they consider to owe tax, some advisors said.\n\"Barring people with outstanding taxes from leaving China isn't new, and some had been stopped at the border before the latest rules were announced,\" said Max Li, a director at U.K.-headquartered advisory firm EIK Business. \"The latest regulations tighten an existing practice, and shouldn't come as a surprise.\"",
    "bodyJa": "中国政府は、裕福な中国国民とそのアドバイザーの間で混乱を招いているオフショア信託に関する新たな課税ルールを明確にする方向で動いている。\n数人のオンショアおよびオフショア税務弁護士によると、中国国家税務局は、オフショア信託（一部は数十年前に設立されたもの）に対する課税の適用方法について調整するため、地方税務職員を対象に大規模な研修を実施している。\n匿名を希望しなかった複数の弁護士や顧問らによると、国税庁は国内の法律事務所や会計事務所にもガイドライン草案を送付しており、今後数週間以内に弁護士との協議会を計画しているという。そうした人々の中には、さらなるガイダンス草案が出され、最終的には文書が公開されることを期待する人もいる。\nDLAパイパーのアジア税務共同責任者ウィンソン・リー氏によると、STAは地方税務署全体で解釈を統一するために、省、市、郡レベルで内部研修を実施しているという。\nシンガポールの中国大使館と北京、上海、広東省の税務局はCNBCのコメント要請に応じなかった。\n中国政府は先月、中国の富裕層が数千億ドルを国外に保有するために長年利用してきたオフショア信託に20％の税金を課した。この動きにより、税金や法律に関する相談がパニックに陥り、請求額を満たすための現金の争奪戦が始まった。\n賦課金は、設立から利益分配、清算に至るまで、信託の存続期間のほぼすべての段階で適用されます。個人はまた、そのような構造物にすでに移管されている資産に対する未払いの税金を、規則の発表から90日以内（10月21日まで）に申告し、清算しなければならない。さもなければ、申告が遅れたり滞納した場合には追加料金が課せられることになる。\n混乱\nこの規則は車両に関する数十年にわたる規制上の曖昧さに終止符を打ったが、施行に関して新たな混乱も引き起こした。\n2023年以降に設立された信託には開始時に20％の手数料が課せられるが、毎年の経常税の対象となる古い建物の所有者が何年前に申告しなければならないかは依然として不明だと法律事務所英科の北京を拠点とするパートナー、袁操氏は述べた。\n顧問らはまた、多くの信託資産が7月に発行された外国投資報告規則に違反する可能性があり、そもそも資金がどのようにして中国から流出したのかについて外為当局の精査を招く可能性があると警告している。\nいくつかの疑問には、3年から5年の標準時効が2023年より前に設立されたオフショア信託に適用されるかどうかが含まれる。申請が受理されるか拒否されるためには、どの程度の広範な文書が必要か。 DLAパイパーのリー氏は、10月の期限が申告期限なのか全額納税期限なのかについても言及した。\n同氏は、今後数週間のうちに地方当局がこれらの詳細に関するSTAの解釈にほぼ一致することが予想されると付け加えた。\n中国の中央政府がフォローアップ回覧を通じて主要な政策発表を微調整することは珍しいことではない。ただし、ルールの明確化を待つ時間も 90 日の枠を侵食します。\n問題の機密性を理由に匿名を求めた香港在住の弁護士は、先月の規則が制定される前には、さまざまな地方自治体から大きく異なるアプローチがあったと述べた。同弁護士は、STAも不確実性があることを認識していると付け加えた。\n複数の弁護士によると、一部の富裕層は債務を解決するために省税務署と過去に一括和解金の交渉を行っているが、それが中国政府の新規則の下でも有効かどうかは不明だという。\n集まる嵐\n増税の推進は、中国政府が新たな財政収入源を模索している中で行われている。長らく地方政府財政の柱であった土地販売は、不動産不況のあおりで崩壊した。\nユーラシア・グループの中国ディレクター、ダン・ワン氏は、中国政府が富裕層やオフショア資産を獲得するために課税ベースを拡大する一方、執行が改善されるにつれ、個人所得税はますます重要な財政収入源になるだろうと述べた。\n中国の納税居住者は、海外の保険商品からの課税申告書を含め、世界中の所得に対して税金を支払う必要があると当局者が今月初めに発表した。\n今年上半期に徴収された個人所得税は前年比13％増の約9000億元（1335億ドル）に達し、中国の主要税分類の中で絶対的な増加額としては最大だと王氏は指摘した。\n当局者らも資本の国外流出に対する姿勢を厳格化している。中国の地元メディアによると、中国政府は今年初め、国境を越えたオンライン証券会社3社に対し本土のユーザーへのサービス提供を禁止し、北京市や杭州市など一部の都市は中国人が受け取った海外の保険金に課税し始めたという。\nエバーコアＩＳＩのチーフ中国ストラテジスト、ネオ・ワン氏は「こうした措置は、嵐が巻き起こっているという感覚を容易に生み出す可能性がある」と述べ、こうした懸念は行き過ぎの可能性があると付け加えた。\n中国国務院も7月下旬、国家技術や産業安全保障を危険にさらす恐れのある輸出管理規則違反など、国民の出国を禁止できる状況を拡大する新たな出入国規制を発令し（9月発効）としている。\nこの枠組みにより、地方自治体は納税義務があるとみなされる人々の出国を制限するためのより強固な法的根拠が得られる可能性があると一部の顧問は述べた。\n英国に本社を置く顧問会社EIKビジネスのディレクター、マックス・リー氏は、「税金を滞納している人の中国出国を禁止するのは新しいことではなく、最新の規則が発表される前に国境で止められた人もいた」と述べた。 「最新の規制は既存の慣行を強化するものであり、驚くべきことではない。」",

    "id": "russia-s-economy-has-defied-the-skeptics-24c31e8b",
    "title": "Russia's economy has defied the skeptics. Cracks are getting harder to hide",
    "titleJa": "ロシア経済は懐疑論を無視した。亀裂を隠すのが難しくなっている",
    "summaryJa": "4年半にわたるウクライナとの全面戦争を経て、ロシアは二層経済となった。コンサルティング会社ユーラシア・グループの欧州担当ディレクター、アレックス・コリャンドル氏はＣＮＢＣに対し、「幸運で戦車製造会社に雇用されていれば、すべてうまくいく。そうでなければ、おそらく問題に直面しているだろう」と語った。",
    "bodyOriginal": "After four-and-a-half years of full-scale war with Ukraine, Russia has become a two-tier economy.\n\"If you are lucky and you're employed by a tank production company, then everything's good. Otherwise, you are probably facing problems,\" Alex Kolyandr, director for Europe at consulting firm Eurasia Group, told CNBC.\nRussia's wartime economy has been brought into sharper focus in recent weeks by Ukraine's long-range drone attacks on oil refineries and delivery warehouses.\nThough it has defied expectations and is even growing slowly, according to recent data, analysts say this masks problems, such as the Kremlin's reliance on military spending, higher taxes and subsidized bank lending.\nBut they question whether this will drive Russia to give up its war. Indeed, Kolyandr warned the worsening economy could incentivize President Vladimir Putin to escalate the conflict.\n\"If I were Putin, God forbid, I would probably decide that it is in my interest to escalate now and try to finish the war on my terms, than wait until the money ends sometime in the future,\" Kolyandr said.\nThe Russian Embassy in London and Russia's Foreign Ministry did not immediately respond to CNBC's request for comment.\nKolyandr said the Kremlin could balance the books with some \"bookkeeping acrobatics,\" but its economic problems \"will not go away and are still mounting.\"\nHe added: \"It has already started, through inflation, through the slowdown in the non-military economy, through higher interest rates.\"\nTwo standout metrics for Russia's economy\nFor the first time since 2023, Russia's economy returned to growth in the April to June period. The country's gross domestic product grew 1.3% year-on-year in the second quarter, according to official data published this week, while GDP expanded by 0.6% through the first half of the year. The second-quarter figures surpassed government and central bank forecasts.\nThe data suggest that government spending on its industrial-military complex and a recent boost in oil and gas prices have helped prop up Russia's wartime economy.\nBut Charles Lichfield, director of economic foresight and analysis at the Atlantic Council's GeoEconomics Center, said the best metrics for understanding what's going on are the deficit and inflation.\n\"They are on course to double the deficit they had in 2025 and that was already double what they had in 2024,\" Lichfield said, highlighting the country's depressed energy revenues, despite higher fossil fuel prices in recent months.\nIn the first half of 2026, oil and gas revenues were 64% of their level in the same period two years ago. Sustained Ukrainian drone strikes have hit Russia's refineries, and tougher Western sanctions have started to bite, like the lower European Union oil price cap and measures targeting Russia's shadow-fleet enablers.\n\"On inflation, they managed to bring it down to basically the target of 4% late last year, which was a big achievement given all the internal and external inflationary pressures, but it looks like that will not last,\" Lichfield said.\nWhat Russians' cookie buying says about the economy\nEarlier in the year, the country's largest retailer said citizens were increasingly switching to low-cost and store-brand food products.\n\"We recently noticed that cookie consumption has risen — almost two and a half times,\" X5 Group President Yekaterina Lobacheva told RBC News in April, according to a translation by The Moscow Times. \"It's something sweet, a small indulgence, but cheaper than chocolate and other confectionery.\"\nRead more\nAsked what levers the Kremlin can pull to mitigate the situation, Lichfield said the Russian government could tax oil and gas companies more than the current tax code suggests, try to borrow money internationally, or potentially mobilize the half of the central bank's reserves that remain beyond Western sanctions.\nAlongside roughly $300 billion frozen after the war began, Russia's central bank is estimated to have around $300 billion in reserves, either in Russia or in jurisdictions not under sanctions. The money could technically be used to plug some fiscal gaps, Lichfield said, although this could undermine confidence in the central bank's commitment to fighting inflation.\nLichfield said he doesn't expect Russia to end the war for economic reasons, despite the pressure it faces.\nRussia's economy unlikely to determine Ukraine war\nElina Ribakova, senior fellow at Peterson Institute for International Economics, also said Russia's economy was unlikely to force it to end the war when it was getting a boost from higher oil prices.\n\"It has to get much more dire,\" Ribakova told CNBC in a phone interview. \"If you tell me that we will have oil prices at $35 or $40 for the next year, then it might decide. But at the moment, especially given the war between Israel, the U.S. and Iran, it is unlikely.\"\nRibakova said the conversation was different when oil prices were much lower in January and February and the Russian government was talking about revising its 2026 budget, even though the year had only just begun, suggesting serious trouble.\nShe added that Putin had \"staked so much\" on the war \"that he almost feels as like he has to keep on going.\"",
    "bodyJa": "4年半にわたるウクライナとの全面戦争を経て、ロシアは二層経済となった。\nコンサルティング会社ユーラシア・グループの欧州担当ディレクター、アレックス・コリャンドル氏はＣＮＢＣに対し、「幸運で戦車製造会社に雇用されていれば、すべてうまくいく。そうでなければ、おそらく問題に直面しているだろう」と語った。\nロシアの戦時経済はここ数週間、ウクライナによる製油所や配送倉庫への長距離無人機攻撃によって、さらに焦点が当てられている。\n最近のデータによると、予想に反して成長は緩やかでさえあるが、アナリストらは、このことがクレムリンの軍事費への依存、増税、補助金付き銀行融資などの問題を覆い隠していると指摘している。\nしかし彼らは、これがロシアを戦争放棄に駆り立てるのかどうか疑問を抱いている。実際、コリャンドル氏は、経済悪化がウラジーミル・プーチン大統領に紛争激化を促す可能性があると警告した。\n「もし私がプーチン大統領だったら、そんなことは許されませんが、将来お金がなくなるまで待つよりも、今すぐエスカレートして、自分の条件で戦争を終わらせることが自分の利益になると判断するでしょう」とコリャンドル氏は語った。\nロンドンのロシア大使館とロシア外務省はCNBCのコメント要請にすぐには応じなかった。\nコリャンドル氏は、クレムリンは「簿記の曲芸」で帳尻を合わせることができるが、経済問題は「解消されることはなく、依然として深刻化している」と述べた。\n同氏はさらに、「インフレ、非軍事経済の減速、金利上昇などを通じて、それはすでに始まっている」と付け加えた。\nロシア経済の 2 つの顕著な指標\nロシア経済は4～6月期に2023年以来初めて成長に戻った。今週発表された公式データによると、同国の第２・四半期の国内総生産（ＧＤＰ）は前年同期比１．３％増加し、ＧＤＰは上半期までに０．６％拡大した。第２・四半期の数字は政府や中央銀行の予想を上回った。\nデータは、政府の産軍複合体への支出と最近の石油とガス価格の上昇が戦時中のロシア経済の下支えに役立っていることを示唆している。\nしかし、大西洋評議会地経学センターの経済予測・分析担当ディレクター、チャールズ・リッチフィールド氏は、何が起こっているかを理解するための最良の指標は財政赤字とインフレだと述べた。\nリッチフィールド氏は、ここ数カ月の化石燃料価格の高騰にもかかわらず、同国のエネルギー収入が落ち込んでいることを強調し、「２０２５年の赤字を２倍にする勢いで進んでおり、その赤字はすでに２０２４年の２倍だった」と述べた。\n２０２６年上半期の石油・ガス収入は２年前の同時期の６４％だった。ウクライナの持続的な無人機攻撃がロシアの製油所を襲い、欧州連合（EU）の原油価格上限引き下げやロシアの影の艦隊を可能にする者を対象とした措置など、より厳しい西側制裁が影響を及ぼし始めている。\nリッチフィールド氏は「インフレに関しては、昨年末にインフレ率を基本的に目標の４％まで下げることに成功した。内外のインフレ圧力を考慮すると大きな成果だったが、それは長くは続かないようだ」と述べた。\nロシア人のクッキー購入が経済について語ること\n同国最大の小売業者は今年初め、国民が低価格の店舗ブランドの食品への切り替えを強めていると述べた。\nモスクワ・タイムズ紙の翻訳によると、X5グループのエカテリーナ・ロバチョワ社長は4月にRBCニュースに対し、「クッキーの消費量がほぼ2.5倍に増加していることに最近気づいた」と語った。 「それは甘いもので、ちょっとした贅沢ですが、チョコレートや他の菓子よりも安いです。」\n続きを読む\n状況を緩和するためにクレムリンがどのような手段を講じることができるかとの質問に対し、リッチフィールド氏は、ロシア政府は石油・ガス会社に現在の税法が示す以上に課税するか、国際的に資金を借り入れようとするか、あるいは西側の制裁を超えて残っている中央銀行準備金の半分を動員する可能性があると述べた。\n戦争開始後に凍結された約3,000億ドルに加えて、ロシア中央銀行はロシア国内または制裁を受けていない管轄区域に約3,000億ドルの準備金を保有していると推定されている。リッチフィールド氏は、この資金は技術的には財政上のギャップを埋めるために使用できる可能性があるが、そうなればインフレとの戦いに対する中銀の取り組みに対する信頼が損なわれる可能性があると述べた。\nリッチフィールド氏は、ロシアが直面している圧力にもかかわらず、経済的理由で戦争を終わらせるとは予想していない、と述べた。\nロシア経済がウクライナ戦争を決定づける可能性は低い\nピーターソン国際経済研究所の上級研究員エリナ・リバコバ氏も、原油価格の上昇でロシア経済が追い風になっている状況では、ロシア経済が戦争終結を強いられる可能性は低いと述べた。\nリバコバ氏はCNBCの電話インタビューで、「事態はさらに悲惨なものになるはずだ」と語った。 「来年の原油価格が35ドルか40ドルになると言われれば、それが決まるかもしれない。しかし現時点では、特にイスラエル、米国、イラン間の戦争を考慮すると、その可能性は低い。」\nリバコワ氏は、1月と2月に原油価格が大幅に下落し、年が始まったばかりにもかかわらずロシア政府が2026年予算の見直しについて話していたときは話が違っていたと述べ、深刻な問題を示唆していると述べた。\n彼女は、プーチン大統領が戦争に「あまりにも大きな賭けをしていた」ため、「このまま戦争を続けなければならないと感じているほどだ」と付け加えた。",

    "title": "Extreme heat spurs earliest-ever Champagne harvest, putting its famous taste to the test",
    "titleJa": "猛暑が史上最も早いシャンパンの収穫に拍車をかけ、その有名な味わいが試される",
    "summaryJa": "うだるような夏の気温により、シャンパンの収穫は記録上最も早く、おそらく最も困難なものの一つとなりそうだ。フランス地域のワインメーカーは、作物の収量の低下、消費者の需要の低迷、そしてこの象徴的な飲み物の有名な新鮮な味に対する脅威に直面しています。今年のシャンパーニュの正式なシーズンは8月15日に始まり、収穫の大部分は8月20日から25日の間に行われる予定で、近年の例年より約2週間早い。 2000 年代初頭までは、昨年の販売収入 66 億ドルをもたらしたスパークリング ワインのブドウの収穫は、ほとんどの場合 9 月か 10 月に行われていました。",
    "bodyOriginal": "Sweltering summer temperatures look set to spur the earliest Champagne harvest on record and potentially one of the most challenging. The French region's winemakers face lower crop yields, weaker consumer demand and a threat to the iconic drink's famed fresh taste.\nThe Champagne season officially starts on Aug. 15 this year, with the majority of picking expected between Aug. 20 and 25, around two weeks earlier than usual in recent years. Before the early 2000s, harvesting the grapes of the sparkling wine — which brought in $6.6 billion in sales revenues last year — almost always took place in September or October.\nBut hotter springs and summers are accelerating the grape-ripening process, creating more sugary fruit and narrowing the optimum picking window for Champagne.\nWinemakers are torn between harvesting early to reduce the amount of sugar in the fruit, but risking the ability to achieve the correct balance of acidity and so-called \"phenolic ripeness,\" the point when tannins and other compounds have matured enough to deliver the desired flavor and texture.\n\"With great wine grapes, you want the maturation process to be slow. This is true with most fruit,\" said Linda Johnson-Bell, founder of the Wine & Climate Change Institute consultancy.\nA short growing window can be more easily disguised in red wines, many of which have increased their alcohol content in recent years due to more sugary grapes. But it is a particular challenge in Champagne, where the drink's \"identity is its tautness, its high acidity, low sugar, its finesse, its elegance,\" Johnson-Bell said.\nAdapt to survive\nAlong with a warming trend pushing harvesting seasons earlier, European wine growers are up against drought, freak weather events such as spring hailstorms and frost which wiped out many buds, and wildfires.\nIn the macro picture they also face waning demand for alcoholic drinks, higher labor and fuel costs, and the complication of tariffs in the U.S., Champagne's largest export market.\nSome winemakers are reacting by pulling out vineyards, changing their grape varieties, moving further north or introducing irrigation systems. But high-end variants such as Champagne are restricted by their appellation, which protects where its grapes can be grown and how, including a ban on the watering of adult vines.\nChampagne growers are developing various techniques to protect grape clusters, a representative from trade association Comité Champagne told CNBC. Those include the use of insect-proof greenhouses and experimenting with new grape varieties, along with the creation of an R&D center to explore further solutions.\nProducers have also trimmed their quota of yield permitted for sale this year, a decision made to help balance stocks, maintain quality and preserve vineyards amid \"challenging\" weather conditions and \"sluggish\" French demand, the Comité Champagne said in a release last month.\nThe businesses which sell their end product will be little-concerned by this year's harvest since the \"quality seems promising, and the industry could do with lower inventory,\" Bernstein's global head of luxury goods, Luca Solca, said by email.\nJean-Claude Mas, founder of Domaines Paul Mas-Coté Mas, which produces reds, whites and rosés in the southern French region of Languedoc, said his vineyards had so far defied gloomy expectations since he began harvesting earlier this month and were looking \"beautiful.\"\n\"In 30 years I've never seen a year like this. We've had an accumulation of heat since the end of May. I was so stressed, but this year it looks like we could have a really good harvest. My analysis of that is just the incredible capacity to adjust of nature,\" he said.\nA sparkling opportunity for English winemakers?\nThe earlier grape harvesting season is also being observed in the U.K., which has a relatively small but growing wine industry that produced roughly 16.5 million bottles last year and increased its exports by 55%, according to official data.\n\"It's quite astonishing how far forward the harvesting has come in a generation,\" Fergus Elias, director of wine at Balfour Winery, said from a vineyard in Suffolk, England. As a child, he recalls his winemaker father's harvests never starting before early October and finishing as late as mid-November.\n\"If I really wanted to, I could pick these vines and make a passable wine with them,\" he said this week.\n\"But in England our growing season is still long enough... I'm quite excited,\" he added.\nA warmer climate is allowing new varieties of grape to grow in Britain's chalky soil, which is similar to that of northern France. The opportunity has even attracted the attention of French producers, with Champagne house Taittinger acquiring land in Kent to make an English sparkling wine.\n\"Climate change is talked about as something that makes English wine more sustainable, although it does come with a lot of challenges,\" Elias said. \"This year we had a late spring frost in mid-May, but we're lucky to have sites across the country which gives some geographic security.\"\nIndustry players are meanwhile convinced that Champagne's innovation will be enough to preserve the drink's status and quality long into the future.\n\"The Champenois will do absolutely everything to safeguard that product, they've been onto these issues for decades,\" Linda Johnson-Bell said. \"Maybe I'm romantic but I just see Champagne always surviving.\"",
    "bodyJa": "うだるような夏の気温により、シャンパンの収穫は記録上最も早く、おそらく最も困難なものの一つとなりそうだ。フランス地域のワインメーカーは、作物の収量の低下、消費者の需要の低迷、そしてこの象徴的な飲み物の有名な新鮮な味に対する脅威に直面しています。\n今年のシャンパーニュの正式なシーズンは8月15日に始まり、収穫の大部分は8月20日から25日の間に行われる予定で、近年の例年より約2週間早い。 2000 年代初頭までは、昨年の販売収入 66 億ドルをもたらしたスパークリング ワインのブドウの収穫は、ほとんどの場合 9 月か 10 月に行われていました。\nしかし、春と夏の暑さによりブドウの成熟プロセスが加速され、糖分の多い果実が増え、シャンパーニュに最適な収穫期間が狭まっています。\nワインメーカーは、果実に含まれる糖分の量を減らすために早めに収穫するか、酸性度の適切なバランスと、タンニンやその他の化合物が望ましいフレーバーやテクスチャーを提供するのに十分に成熟するいわゆる「フェノールの成熟度」を達成できるかどうかを危険にさらすかどうかで悩んでいます。\n「素晴らしいワイン用ブドウの場合は、成熟プロセスをゆっくりとさせたいものです。これはほとんどの果物に当てはまります」と、コンサルタント会社ワイン＆気候変動研究所の創設者リンダ・ジョンソン・ベル氏は言う。\n赤ワインでは、成長期間が短いことをより簡単に隠すことができますが、その多くは近年ブドウの糖分が増えたためアルコール含有量が増加しています。しかし、それはシャンパーニュにおいては特別な課題であり、シャンパーニュではこの飲み物の「アイデンティティはその緊張感、高い酸味、低糖度、フィネス、エレガンスである」とジョンソン・ベル氏は語った。\n生き残るために適応する\n温暖化傾向により収穫時期が早まることに加え、ヨーロッパのワイン生産者は干ばつ、春のひょう嵐や多くの芽を吹き飛ばす霜などの異常気象、そして山火事に直面している。\nマクロ的に見ると、アルコール飲料の需要の減退、人件費と燃料費の高騰、そしてシャンパーニュ最大の輸出市場である米国での関税の複雑化にも直面している。\n一部のワインメーカーは、ブドウ畑を撤去したり、ブドウ品種を変更したり、さらに北に移転したり、灌漑システムを導入したりすることで対応している。しかし、シャンパーニュなどの高級品種は、成ブドウへの水やりの禁止など、ブドウの栽培場所と栽培方法が保護されているアペラシオンによって制限されている。\n業界団体コミテ・シャンパーニュの代表者がCNBCに語ったところによると、シャンパン生産者はブドウの房を保護するためのさまざまな技術を開発している。これらには、防虫温室の使用や新しいブドウ品種の実験、さらなる解決策を探るための研究開発センターの設立などが含まれます。\n生産者らは今年販売が許可される収穫量の割り当ても削減したが、これは「厳しい」気象条件とフランスの「低迷する」需要の中、在庫のバランスを保ち、品質を維持し、ブドウ畑を保護するために行われた決定であると、シャンパーニュ委員会は先月のリリースで述べた。\nバーンスタインの高級品グローバル責任者、ルカ・ソルカ氏は電子メールで、「品質は期待できそうだし、業界は在庫を減らしても大丈夫だろう」ため、最終製品を販売する企業は今年の収穫についてほとんど心配しないだろうと述べた。\nフランス南部ラングドック地方で赤、白、ロゼを生産するドメーヌ・ポール・マス・コテ・マスの創設者、ジャン・クロード・マス氏は、今月初めに収穫を始めて以来、これまでのところ彼のブドウ畑は暗い期待を裏切って「美しく」見えていると語った。\n「この30年間、こんな年は見たことがない。5月末から猛暑が続いた。とてもストレスを感じていたが、今年は本当に豊作が期待できるようだ。それについての私の分析は、自然の適応能力が驚異的だということだ」と彼は語った。\n英国のワインメーカーにとって輝かしいチャンス?\n公式データによると、ブドウの収穫時期の早期化は英国でも見られており、英国では比較的規模は小さいものの成長を続けるワイン産業があり、昨年は約1650万本を生産し、輸出量が55％増加した。\nバルフォア・ワイナリーのワイン部門ディレクター、ファーガス・エリアス氏は、英国サフォーク州のブドウ園から「収穫がここ一世代でこんなに早くなったのは驚くべきことだ」と語った。子供の頃、ワイン生産者の父親は 10 月初旬までに収穫を開始し、遅くとも 11 月中旬までに収穫を終えていたことを思い出します。\n「本当にその気になれば、これらのブドウの木を摘んで、それでまずまずのワインを造ることができるだろう」と彼は今週語った。\n「しかし、イングランドでは成長期はまだ十分に長い…とても興奮している」と彼は付け加えた。\n気候が温暖なため、フランス北部と似た英国の石灰質土壌で新品種のブドウが栽培できるようになっている。この機会はフランスの生産者からも注目を集めており、シャンパンハウスのテタンジェ社は英国のスパークリングワインを製造するためにケント州の土地を取得しました。\n「気候変動はイギリスワインをより持続可能なものにするものとして話題になっていますが、それには多くの課題が伴います」とエリアス氏は言う。 「今年は5月中旬に春の遅霜が降りましたが、幸運なことに全国に拠点があり、地理的にはある程度安全です。」\n一方、業界関係者は、シャンパーニュの革新がこの飲み物の地位と品質を将来にわたって維持するのに十分であると確信している。\n「シャンパーニュ家はその製品を守るためにあらゆることをするつもりだ。彼らは何十年もこの問題に取り組んできた」とリンダ・ジョンソン・ベル氏は語った。 「私はロマンチックなのかもしれないけど、シャンパーニュが常に生き残っているのを見ているだけなのよ。」",

    "id": "bbc-seeks-to-subpoena-trump-s-family-mem-02200b66",
    "title": "BBC seeks to subpoena Trump's family members in Panorama lawsuit",
    "titleJa": "BBC、パノラマ訴訟でトランプ大統領の家族への召喚を求める",
    "summaryJa": "BBC、パノラマ訴訟でトランプ大統領の家族への召喚を求める- 公開されました",
    "bodyOriginal": "BBC seeks to subpoena Trump's family members in Panorama lawsuit\n- Published\nThe BBC has sought to subpoena members of Donald Trump's family for documents and testimony as it defends against the US president's $10bn (£7.4bn) defamation lawsuit against the broadcaster.\nCourt filings show that representatives for the BBC's legal team attempted in May to serve subpoenas to the president's son Donald Trump Jr, his daughter Ivanka Trump and son-in-law Jared Kushner.\nThe president is suing the BBC over an episode of Panorama that edited together two different sections of a speech he gave before the 2021 Capitol riots.\nThe BBC has previously apologised for the edit but denied it was grounds for defamation.\nThe BBC's lawyers argue in the latest filing that Trump's family members had \"personal knowledge\" of his intentions in delivering the speech, making their testimony and documents relevant to the president's defamation claim.\nDrawing on evidence previously gathered by a US congressional committee, the filing says Donald Trump Jr and Ivanka Trump were present when their father revised and delivered his speech, adding that Jared Kushner drafted a proposed statement for him that would have condemned the use of violence.\nThe filing asks the court to allow the subpoenas to be served by email and certified mail, saying attempts to serve them by hand were unsuccessful.\nIn one instance, according to the document, a representative for the BBC's legal team tried to deliver a subpoena for Ivanka Trump and Jared Kushner at their home in Florida, but was refused entry at a police checkpoint and was later told by the Secret Service that the agency could not accept the subpoenas.\nSimilarly, according to the filing, a representative tried to serve a subpoena for Donald Trump Jr at Trump Tower in New York but was told by the concierge that the person who normally took such documents may have been at lunch.\nDuring another attempt two days later, the representative was told the \"legal department\" was not in that day, according to the filing.\nPresident Trump's legal team has been approached for comment. The BBC press office declined to comment.\nLast December, Trump sued the BBC and subsidiaries BBC Studios Productions and BBC Studios Distribution over the 2024 Panorama episode.\nTrump's lawsuit - filed in Florida - accuses the BBC of \"intentionally, maliciously and deceptively doctoring\" the speech he gave outside the Capitol on 6 January 2021.\nThe BBC has apologised for an editing error that gave \"the mistaken impression that President Trump had made a direct call for violent action\".\nHowever, the BBC has asked the court to dismiss the lawsuit, arguing that the programme did not meet the legal criteria for defamation and was not made available on its US platforms.\nLast month, Trump's lawyers admitted they had no evidence that the documentary was available in the US on the BBC's BritBox subscription service, as they had originally claimed, or on BBC.com, BBC Select or through US broadcasters.\nTrump also recently agreed to drop the BBC's commercial arm BBC Studios from his lawsuit, after the BBC argued the company had \"no role in creating or producing the documentary\".\nEarlier this month, the judge in the case granted Trump's request for a delay in him handing over a financial documents to the broadcaster as part of the suit.\nThe BBC has asked for some of Trump's financial records in relation to his argument that the documentary damaged the president's business interests.\nThe president's legal team said disclosure of the financial records would cause him \"irreparable harm\".\nA trial date in February 2027 has been scheduled, should the case progress.\nBBC News is editorially independent from the wider corporation.\n- Published16 March",
    "bodyJa": "BBC、パノラマ訴訟でトランプ大統領の家族への召喚を求める\n- 公開されました\nBBCは、米大統領による同放送局に対する100億ドル（74億ポンド）の名誉毀損訴訟を弁護するため、ドナルド・トランプ大統領の家族らに文書と証言を求める召喚を求めている。\n裁判所への提出文書によると、BBCの法務チームの代表者らは5月、大統領の息子ドナルド・トランプ・ジュニア氏、娘のイヴァンカ・トランプ氏、義理の息子ジャレッド・クシュナー氏に召喚状を送達しようとした。\n大統領は、2021年の国会議事堂暴動前に行った演説の2つの異なるセクションを編集した『パノラマ』のエピソードをめぐってBBCを訴えている。\nBBCは以前、この編集について謝罪したが、名誉毀損の理由にはならないと否定した。\nBBCの弁護士らは最新の提出書類の中で、トランプ氏の家族はトランプ氏の演説の意図を「個人的に知っていた」ため、彼らの証言や文書は大統領の名誉毀損の主張に関連すると主張した。\n提出書類は、米議会委員会が以前に収集した証拠に基づいて、ドナルド・トランプ・ジュニアとイヴァンカ・トランプが父親が演説を修正して発表した際に同席していたとし、ジャレッド・クシュナーが暴力の使用を非難する声明案を父親のために起草したと付け加えた。\n提出書類は裁判所に対し、召喚状を電子メールや内容証明郵便で送達することを許可するよう求めており、手書きで送達する試みは失敗したとしている。\n文書によると、ある例では、BBCの法務チームの代表者がイヴァンカ・トランプ氏とジャレッド・クシュナー氏のフロリダ州の自宅で召喚状を届けようとしたが、警察の検問所で立ち入りを拒否され、その後シークレットサービスから召喚状を受理できないと言われたという。\n同様に、提出書類によると、代理人はニューヨークのトランプタワーでドナルド・トランプ・ジュニアへの召喚状を送ろうとしたが、コンシェルジュから、通常そのような書類を受け取った人物は昼食中だった可能性があると言われたという。\n提出書類によると、2日後の別の試みの際、代理人はその日は「法務部門」が来ていないと告げられたという。\nトランプ大統領の法務チームにコメントを求めた。 BBC報道局はコメントを控えた。\n昨年12月、トランプ大統領は2024年の『パノラマ』エピソードをめぐり、BBCとその子会社であるBBCスタジオ・プロダクションズおよびBBCスタジオ・ディストリビューションを訴えた。\nフロリダ州で起こされたトランプ氏の訴訟は、2021年1月6日に連邦議会議事堂前で行った演説を「意図的、悪意を持って欺瞞的に改ざんした」としてBBCを非難している。\nBBCは「トランプ大統領が暴力行為を直接呼びかけたかのような誤った印象」を与えた編集ミスを謝罪した。\nしかし、BBCは、番組が名誉毀損の法的基準を満たしておらず、米国のプラットフォームで視聴可能になっていないとして、裁判所に訴訟の却下を求めた。\n先月、トランプ氏の弁護士らは、このドキュメンタリーが当初主張していたBBCの購読サービス「ブリットボックス」や、BBC.com、BBCセレクト、あるいは米国の放送局を通じて米国で視聴可能だったという証拠はないと認めた。\nトランプ大統領は最近、BBCのコマーシャル部門であるBBCスタジオが「ドキュメンタリーの制作や制作に何の役割も果たしていない」とBBCが主張したことを受け、訴訟から取り下げることに同意した。\n今月初め、この訴訟の判事は、訴訟の一環として同放送局への財務書類の引き渡しの遅延を求めるトランプ氏の要求を認めた。\nBBCは、このドキュメンタリーが大統領のビジネス上の利益を損なったというトランプ大統領の主張に関連して、トランプ大統領の財務記録の一部の提出を求めた。\n大統領の弁護団は、財務記録の開示は大統領に「取り返しのつかない損害」を与えるだろうと述べた。\n訴訟が進展すれば、2027年2月に公判期日が予定されている。\nBBC ニュースは編集上、一般企業から独立しています。\n- 3 月 16 日公開",

    "id": "trump-family-backed-crypto-firm-world-li-b90d4663",
    "title": "Trump family-backed crypto firm World Liberty gets conditional bank charter approval",
    "titleJa": "トランプ一族が支援する仮想通貨会社ワールド・リバティが条件付きで銀行設立認可を取得",
    "summaryJa": "OCCはワールド・リバティ・トラスト社の全国信託銀行設立を条件付きで承認した。そうすれば、トランプ氏一族が支援する企業がステーブルコインを発行できるようになる。",
    "bodyOriginal": "A federal financial regulator has conditionally approved an application for a bank charter by an entity connected to World Liberty Financial, a crypto firm partially owned by President Donald Trump's family.\nThe Office of the Comptroller of the Currency on Friday gave conditional approval to World Liberty Trust Co.'s application for a national trust bank, according to a letter posted on the OCC's website. The trust company is sponsored by World Liberty Financial, which says on its website it is 38% owned by \"an entity affiliated with Donald J. Trump and certain of his family members.\"\nThe banking charter will enable World Liberty to issue stablecoins, a type of cryptocurrency that is backed by safe reserve assets such as U.S. Treasurys and is convertible one-to-one into U.S. dollars. World Liberty currently relies on a third party, BitGo, for some stablecoin services. Bringing those services in house could be lucrative.\nThe charter application process won't be fully complete until the company completes additional steps, including raising capital. The OCC under Trump has emphasized its support for new bank charter applications, which are reviewed by career staff. It has received 40 applications since 2025, a sharp increase compared with President Joe Biden's term, according to agency data. Many are tied to crypto projects.\n\"We welcome continuous scrutiny from Federal regulators for many years to come,\" World Liberty Financial CEO Zach Witkoff said in a statement. Witkoff is also chairman of the OCC-regulated trust company.\nWitkoff is the son of Trump's Middle East negotiator Steven Witkoff.\nSome congressional Democrats have refused to support the Clarity Act, a bill to regulate the crypto industry, because it doesn't impose strict limits on the president's ability to profit from crypto ventures.\nSen. Elizabeth Warren, D-Mass., had previously urged the OCC not to approve World Liberty's application unless the president divested of his interests in the company.\n\"President Trump is now the first President in history to approve, operate, and supervise his own bank,\" Warren said in a statement after the OCC approval.\n\"This is the most brazen act of self-dealing our financial system has ever seen — and Congress cannot allow it to stand.\"\nWarren said she and several colleagues would introduce legislation to prevent presidents and senior government officials from owning or controlling banks.\nThe OCC declined to comment on the approval.\nCorrection: OCC applications are reviewed entirely by career staff at the agency. An earlier version understated their role.",
    "bodyJa": "連邦金融規制当局は、ドナルド・トランプ大統領の家族が一部所有する仮想通貨会社ワールド・リバティ・ファイナンシャルに関連する団体による銀行設立の申請を条件付きで承認した。\nOCCのウェブサイトに掲載された書簡によると、金曜日、通貨監督庁はワールド・リバティ・トラスト社による国内信託銀行への申請を条件付きで承認した。この信託会社はワールド・リバティ・ファイナンシャルによって後援されており、同社のウェブサイトでは、同社の38％が「ドナルド・J・トランプとその家族の一部と関連する団体」によって所有されていると述べている。\nこの銀行憲章により、ワールド・リバティは、米国債などの安全準備資産に裏付けられ、1対1で米ドルに交換できる一種の暗号通貨であるステーブルコインを発行できるようになる。 World Liberty は現在、一部のステーブルコイン サービスをサードパーティの BitGo に依存しています。こうしたサービスを自社に導入すれば、儲かる可能性がある。\nチャーター申請プロセスは、同社が資金調達を含む追加の手順を完了するまで完全には完了しません。トランプ政権下のOCCは、キャリアスタッフが審査する新規銀行認可申請への支持を強調してきた。当局のデータによると、2025年以降に40件の申請があり、ジョー・バイデン大統領の任期と比べて大幅に増加した。その多くは暗号プロジェクトに関連しています。\nワールド・リバティ・ファイナンシャルのザック・ウィトコフ最高経営責任者（CEO）は声明で、「連邦規制当局による今後長年にわたる継続的な監視を歓迎する」と述べた。ウィトコフ氏は、OCC規制の信託会社の会長でもある。\nウィトコフ氏は、トランプ大統領の中東交渉担当者スティーブン・ウィトコフ氏の息子である。\n議会民主党の一部は、大統領が仮想通貨ベンチャーから利益を上げる能力に厳格な制限を課していないとして、仮想通貨業界を規制する法案であるクラリティ法への支持を拒否している。\nマサチューセッツ州民主党のエリザベス・ウォーレン上院議員は以前、大統領がワールド・リバティ社に対する権益を放棄しない限り、ワールド・リバティ社の申請を承認しないようOCCに要請していた。\nウォーレン氏はＯＣＣ承認後の声明で「トランプ大統領は自身の銀行を承認、運営、監督した史上初の大統領となった」と述べた。\n「これは我が国の金融システムがこれまで見た中で最も厚かましい自己取引行為であり、議会はこれを放置することはできない。」\nウォーレン氏は、数人の同僚とともに、大統領や政府高官が銀行を所有したり支配したりすることを防ぐ法案を提出するつもりだと述べた。\nOCCは承認についてコメントを控えた。\n訂正: OCC の申請は、代理店のキャリア スタッフによって完全に審査されます。以前のバージョンでは、その役割が控えめに説明されていました。",

    "id": "nvidia-discloses-21-billion-stake-in-spa-49cff152",
    "title": "Nvidia discloses $21 billion stake in SpaceX at end of second quarter",
    "titleJa": "Nvidia、第 2 四半期末に SpaceX への 210 億ドルの株式を公開",
    "summaryJa": "エヌビディアは金曜日、イーロン・マスク氏のスペースXへの自社株が第2四半期末時点で約210億ドル相当だったと明らかにした。半導体メーカーは証券取引委員会への提出書類の中で、6月に公開市場デビューを果たしたイーロン・マスク氏のロケットメーカーのクラスA株1億2,280万株を所有していると述べた。",
    "bodyOriginal": "Nvidia disclosed on Friday that its stake in Elon Musk's SpaceX was worth about $21 billion at the end of the second quarter.\nThe chipmaker said in a filing with the Securities and Exchange Commission that it owns 122.8 million Class A shares in Elon Musk's rocket maker, which held its public market debut in June.\nSpaceX's stock closed at $140 on Friday, down from $170.86 at the end of June, so the value of Nvidia's shares have declined to about $17.2 billion.\nIt's Nvidia's second biggest holding behind its stake in Intel, which is currently worth about $22 billion, down from $30 billion when the quarter ended. That represents a massive return on Nvidia's $5 billion investment less than a year ago.\nNvidia is the sixth biggest investor in SpaceX, based on data from FactSet. Musk is by far the largest owner with a stake worth about $850 billion. Alphabet is second at roughly $78 billion.\nNvidia's shares in SpaceX came from the company's $10 billion investment in Musk's xAI as part of a $20 billion round in January, according to a person familiar with knowledge of the matter who asked not to be named because the exact size of the deal wasn't made public. SpaceX acquired xAI in February in a deal valued at $1.25 trillion.\nMusk said on SpaceX's second-quarter earnings call earlier this month that the company will exclusively use Nvidia chips in its AI data centers. He said Nvidia's graphics processing units have the \"best architecture\" for training and inference of AI models, and related products and services.\nMusk also said, on the call that he expects SpaceX will receive a \"significant allocation\" of Nvidia's Vera Rubin GPUs next year.",
    "bodyJa": "エヌビディアは金曜日、イーロン・マスク氏のスペースXへの自社株が第2四半期末時点で約210億ドル相当だったと明らかにした。\n半導体メーカーは証券取引委員会への提出書類の中で、6月に公開市場デビューを果たしたイーロン・マスク氏のロケットメーカーのクラスA株1億2,280万株を所有していると述べた。\nスペースX株の金曜終値は140ドルで、6月末の170.86ドルから下落したため、エヌビディア株の価値は約172億ドルまで減少した。\nこれは、NVIDIA がインテル株に次いで 2 番目に大きい保有株であり、現在の価値は約 220 億ドルで、四半期終了時の 300 億ドルから減少しました。これは、1 年以内に Nvidia が行った 50 億ドルの投資に対する巨額の利益を意味します。\nファクトセットのデータに基づくと、NVIDIA は SpaceX への 6 番目に大きな投資家です。マスク氏は約8500億ドル相当の株式を保有する最大のオーナーだ。アルファベットは約780億ドルで2位だ。\n取引の正確な規模が公表されていないため匿名を希望したこの件に詳しい関係者によると、NVIDIAのSpaceX株は、1月の200億ドルラウンドの一環として同社がマスク氏のxAIに100億ドル投資したことによるものだという。 SpaceXは2月に1兆2500億ドル相当の契約でxAIを買収した。\nマスク氏は今月初めのSpaceXの第2四半期決算会見で、同社のAIデータセンターではNvidiaチップのみを使用すると述べた。同氏は、Nvidiaのグラフィックス処理装置はAIモデルのトレーニングや推論、関連製品やサービスに「最高のアーキテクチャ」を備えていると述べた。\nマスク氏はまた、電話会議で、SpaceXが来年、NvidiaのVera Rubin GPUの「大幅な割り当て」を受けるだろうと予想しているとも述べた。",

    "id": "protein-or-pickled-garlic-what-s-new-in-eb9e483e",
    "title": "Protein or pickled garlic? What's new in ice cream",
    "titleJa": "プロテインかニンニクのピクルスか？アイスクリームの最新情報",
    "summaryJa": "プロテインかニンニクのピクルスか？アイスクリームの最新情報- 公開されました",
    "bodyOriginal": "Protein or pickled garlic? What's new in ice cream\n- Published\nI'm at the research and development centre of the world's biggest publicly listed ice-cream maker, Magnum. Near Bedford in the UK, it's where the company's researchers dream up new recipes and develop their production processes.\nWhat really catches my eye is a pale yellow glow in the corner of the room. The light emanates from a glow-in-the-dark ice lolly.\nLaunched in the clubbing capital of Ibiza, it's targeted toward clubbers and festival-goers, and one of its ingredients, vitamin B2, is naturally luminescent and glows under UV club lights.\nWhile a luminescent product may seem a bit of a gimmick, ice cream is a serious business and innovation is crucial to staying ahead of the game.\nThere's tough competition from other giants including Häagen-Dazs owner, Froneri, and Baskin-Robbins, the world's largest chain of ice cream specialty shops, not to mention smaller artisan ice cream makers that are popping up all the time.\nThey're all dealing with a notoriously unpredictable market and with fluctuating commodity and energy prices. No one can afford to stand still.\n\"We've had five years of price volatility impacted by war in Ukraine, Covid, the cost of living crisis. We've now got the Strait of Hormuz. We've just been in this constant state of instability when it comes to pricing,\" says Georgia Rose, principal analyst at global market research company, Kantar Retail IQ.\nAnd those price fluctuations affect multiple areas of the ice-cream making process.\n\"Manufacturers have been hit by higher prices for dairy, cream, eggs; the ingredients that make ice-cream bases. And then you've got the flavours; vanilla, chocolate, sugar, fruit. And something that often gets forgotten is the cold-chain energy costs and storage,\" she says.\nRising costs are something The Magnum Ice Cream Company is battling with. It was spun off from parent firm Unilever last year and owns brands including Cornetto, Twister, Solero and of course, Magnum.\nAs the largest stock market-listed ice cream company in the world, with a market capitalisation of around £8bn, it has the funds to innovate.\nOne area under constant development is refrigeration - globally Magnum owns three million fridges, (designed and built by a third party), and some are fitted with cameras taking images to be uploaded to data centres.\nFrom the pictures, AI identifies each product and it's also trained in depth-recognition, which means it can estimate how many units of a particular ice cream have been sold and when a fridge needs to be restocked. This equates to less empty space and more targeted supplies.\nMeanwhile, the fridges themselves have been made more energy efficient.\nZbigniew Lewicki, Magnum's chief research, design & innovation officer says innovations like this aren't just a nice-to-have, they're crucial to the business' bottom line.\n\"If you look at the freezers we had in 2010, the ones we have now are 40% more efficient. Will we ever be able to absorb every shock? I can't say, but it's definitely one way of making the business long-term resilient.\"\nFridge technology isn't something the average consumer will notice, but new products on the shelf are a different story. When it comes to innovation, a lot of attention is turning to Asia according to Lewicki.\n\"The inspiration and trends come from the East. There's an incredible intensity of innovation in places like Japan, Korea and China and the markets are growing and expanding in a phenomenal way.\"\nOne of the products inspired by Lewicki's trips is Volcanics which has launched in the UK and Europe. It comprises a chocolate shell with biscuit pieces, chocolate and vanilla ice cream layers, and a caramel lava centre which he describes as \"four dimensional\".\nShanghai-based, Neil Yan is a researcher of market trends for consumer and sensory specialists, MMR. She agrees that Asia is now the centre of ice-cream innovation, and says there are some deeper cultural reasons for this,\n\"In China, ice cream is no longer a niche story. It's not just for Instagram. It's not just a summer treat. It's a new centre of gravity, representing a part of Chinese people's lifestyle.\"\nAnd Yan says this affects the whole market: \"[We are in] an era where everyone is experimenting with the flavours and the format, and blending it with what China, or the border term, Asian nationality, represents.\"\nAnd within the context of flavour experimentation, pretty much anything goes.\n\"We have ham, pickled garlic, tahini, and stinky tofu and liquor. Just below my office is a shop whose speciality is vodka, foie gras and apple in one scoop,\" says Yan.\n\"The reason why people are so excited and so experimental is basically the ability to think beyond just the flavours that have been offered by the Western market for the past two or three decades.\"\nInnovation in ice cream is not just limited to flavour, according to Honorata Jarocka, associate director at market intelligence company, Mintel. She says that products with added health angles are becoming increasingly popular.\nTake protein for example, which has made its way into cereal bars and milkshakes over the last few years and now ice cream.\n\"It's not only about building your muscles, it's more about satiety because with the GLP1 user movement, [incorporating weight loss drugs such as Ozempic and Mounjaro], people are drawn to products that are more filling. Protein is really an important factor and ice-cream is a great place to use that.\"\nBut protein-packed ice cream often doesn't come cheap. David bars made by US company David Protein - and with a whopping 20g of protein - come in at $39.99 (£30) for a 12-pack, more than double the price of Magnum's Yasso frozen yoghurt bars.\nBut they've been a hit says Jarocka, because consumers are choosing \"high quality, smaller portions, and are able to maybe pay a bit more for products with extra benefits because they are spending less on grocery items overall.\"\nBack in Bedford, Magnum researchers are tinkering with their core product, with a little robotic help. The goal is to find the perfect viscosity of chocolate on Magnum bars, for the perfect crunch.\nHelping with that is a robot called Eric, who does something that even the most dedicated ice cream consumer could not - collecting data on ice cream 24 hours a day.\nMore Technology of Business\n- Published3 July\n- Published12 June\n- Published26 June",
    "bodyJa": "プロテインかニンニクのピクルスか？アイスクリームの最新情報\n- 公開されました\n私は世界最大の上場アイスクリームメーカー、マグナムの研究開発センターにいます。英国のベッドフォードの近くにあるここは、同社の研究者が新しいレシピを考案し、生産プロセスを開発する場所です。\n私の目を引いたのは、部屋の隅にある淡い黄色の光です。暗闇で光るアイスキャンディーから光が発せられます。\nクラブの首都イビサで発売されたこの製品は、クラバーやフェスティバルに参加する人をターゲットにしており、その成分の 1 つであるビタミン B2 は天然発光性で、UV クラブ ライトの下で光ります。\n発光する製品というとちょっとした仕掛けのように思えるかもしれませんが、アイスクリームは真剣なビジネスであり、業界の一歩先を行くためにはイノベーションが不可欠です。\nハーゲンダッツのオーナーであるフロネリ社や、世界最大のアイスクリーム専門店チェーンであるバスキン・ロビンス社を含む他の大手企業との激しい競争があり、言うまでもなく、続々と登場する小規模な手作りアイスクリームメーカーもある。\nそれらはすべて、悪名高い予測不可能な市場と、変動する商品やエネルギーの価格に対処しています。誰も立ち止まっているわけにはいきません。\n世界的な市場調査会社カンター・リテールIQの主席アナリスト、ジョージア・ローズ氏は「ウクライナ戦争、新型コロナウイルス、生活費危機の影響で価格変動がここ5年続いた。今ではホルムズ海峡もある。価格設定に関しては常に不安定な状態にあるだけだ」と語る。\nそして、こうした価格変動はアイスクリーム製造プロセスの複数の領域に影響を与えます。\n「メーカーは、アイスクリームのベースを作る材料である乳製品、クリーム、卵の価格高騰に見舞われています。そして、バニラ、チョコレート、砂糖、フルーツなどのフレーバーも用意されています。そして忘れられがちなのが、コールドチェーンのエネルギーコストと貯蔵です」と彼女は言う。\nマグナム・アイスクリーム・カンパニーはコストの上昇と戦っている。同社は昨年親会社ユニリーバから独立し、Cornetto、Twister、Solero、そしてもちろんMagnumなどのブランドを所有している。\n株式市場に上場している世界最大のアイスクリーム会社であり、時価総額は約80億ポンドであり、イノベーションを起こすための資金を持っています。\n絶え間なく開発が進められている分野の 1 つは冷凍です。マグナムは世界中で 300 万台の冷蔵庫 (サードパーティによって設計および製造されたもの) を所有しており、一部にはデータセンターにアップロードする画像を撮影するカメラが取り付けられています。\nAI は写真から各製品を識別し、奥行き認識のトレーニングも受けているため、特定のアイスクリームが何個売れたのか、いつ冷蔵庫に補充する必要があるのか​​を推定できます。これは、空きスペースが減り、対象を絞った供給が増えることを意味します。\n一方で、冷蔵庫自体のエネルギー効率も向上しました。\nマグナム社の主任研究・設計・イノベーション責任者であるズビグネフ・レヴィツキ氏は、このようなイノベーションは単にあると便利なものではなく、ビジネスの収益にとって極めて重要であると語る。\n「2010 年に当社が使用していた冷凍庫を見てみると、現在使用している冷凍庫は効率が 40% 向上しています。すべての衝撃を吸収できるようになるでしょうか? 私には言えませんが、それがビジネスを長期的に回復力のあるものにする 1 つの方法であることは間違いありません。」\n冷蔵庫のテクノロジーは一般の消費者が目にするものではありませんが、棚に並ぶ新製品となると話は別です。ルウィッキー氏によると、イノベーションに関してはアジアに多くの注目が集まっているという。\n「インスピレーションとトレンドは東洋から来ています。日本、韓国、中国などの地域では信じられないほどのイノベーションの激しさがあり、市場は驚異的な方法で成長し、拡大しています。」\nLewicki の旅からインスピレーションを得た製品の 1 つが Volcanics で、英国とヨーロッパで発売されました。これは、ビスケット片が入ったチョコレートのシェル、チョコレートとバニラのアイスクリームの層、そして彼が「四次元」と表現するキャラメル溶岩の中心で構成されています。\n上海を拠点とするニール・ヤンは、消費者および感覚の専門家である MMR の市場動向の研究者です。彼女はアジアが現在アイスクリームの革新の中心地であることに同意し、これにはより深い文化的理由があると述べています。\n「中国では、アイスクリームはもはやニッチな話題ではありません。それはインスタグラムのためだけのものではありません。単なる夏のごちそうではありません。アイスクリームは中国人のライフスタイルの一部を代表する新たな重心です。」\nそしてヤン氏は、これが市場全体に影響を及ぼしていると述べ、「誰もが味やフォーマットを実験し、それを中国、あるいは国境用語であるアジアの国籍が表すものと融合させている時代だ」と語った。\nそして、フレーバーの実験という文脈では、ほとんど何でも可能です。\n「ハム、ニンニクのピクルス、タヒニ、臭豆腐、酒などを取り揃えています。私のオフィスのすぐ下に、ウォッカ、フォアグラ、リンゴをひとさじに入れた名物店があります」とヤンさんは言います。\n「人々がこれほど興奮し、実験的に取り組む理由は、基本的に、過去 20 ～ 30 年にわたって西洋市場で提供されてきたフレーバーだけを超えて考える能力にあるのです。」\nマーケット・インテリジェンス会社ミンテルのアソシエイト・ディレクター、オノラタ・ジャロッカ氏によると、アイスクリームの革新は味だけに限定されるものではありません。彼女は、健康に関する視点を加えた製品の人気が高まっていると述べています。\nプロテインを例に挙げてみましょう。プロテインはここ数年でシリアルバーやミルクセーキ、そして今ではアイスクリームにまで浸透しています。\n「筋肉を増強するだけではなく、満腹感が重要です。GLP1ユーザー運動（オゼンピックやムンジャロなどの減量薬を組み込む）により、人々はより満腹感のある製品に惹かれるからです。プロテインは本当に重要な要素であり、アイスクリームはそれを利用するのに最適な場所です。」\nしかし、プロテインたっぷりのアイスクリームは安くないことが多いです。米国の企業デビッド・プロテインが製造するデビッド・バーは、なんと20gのプロテインが入っており、12パックで39.99ドル（約30ポンド）で、マグナムのヤッソ・フローズン・ヨーグルト・バーの2倍以上の価格だ。\nしかしジャロッカ氏は、消費者が「高品質で量が少なく、食料品への支出が全体的に減っているため、特典付きの商品には多少高くても買える」ことを選択しているため、ヒット商品になっていると述べた。\nベッドフォードに戻ったマグナムの研究者たちは、ロボットの助けを借りながら、中核となる製品をいじっています。目標は、完璧なクランチを実現するために、マグナムバー上のチョコレートの完璧な粘度を見つけることです。\nそれを支援するのがエリックと呼ばれるロボットで、アイスクリームのデータを 24 時間収集するという、最も熱心なアイスクリーム消費者ですら不可能なことを行っています。\nビジネスのさらなるテクノロジー\n- 7 月 3 日発行\n- 6 月 12 日発行\n- 6 月 26 日発行",
