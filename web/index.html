    "summaryJa": "Vice President JD Vance's White House Task Force to Eliminate Fraud estimates the action will save roughly $2.2 billion in taxpayer-funded subsidies.",
    "bodyOriginal": "The Centers for Medicare and Medicaid Services said on Tuesday it canceled roughly 315,000 Affordable Care Act marketplace enrollments covering about 760,000 people last month, alleging unauthorized enrollments, characterized by Vice President JD Vance as \"rampant fraud.\"\nThe enforcement action also involves verifying roughly 419,000 people to ensure they are legal U.S. residents and meet the income threshold requirements to receive benefits from the public exchanges of the ACA, also known as Obamacare, according to a CMS release.\nThe vice president's White House Task Force to Eliminate Fraud led the cancellations, and it estimates the action will save roughly $2.2 billion in taxpayer-funded subsidies. Speaking at a Tuesday briefing, Vance accused the Biden administration of maintaining a system that enabled fraud.\n\"You have a system where, on the one hand, brokers are paid money to feed patients into the system, while on the other hand, the government isn't even checking whether the people enrolled are actually eligible for the program. What do you have? Of course, rampant, rampant fraud,\" Vance said.\nIt is unclear how many of those 315,000 enrollments involved people who were not eligible to receive coverage, or whether the Biden administration hadn't actually verified they could enroll. The action comes as the Trump administration has made widespread accusations of fraud in U.S. health programs and restricted funding and eligibility for the federal-state Medicaid program.\nDuring the briefing Tuesday, CMS Administrator Dr. Mehmet Oz claimed that around 35% of people currently in the Obamacare system \"have never used the program.\" He said those people never used a prescription or saw a doctor.\nThe law has an individual mandate, or requirement that most people buy insurance, in part because having healthier people who use less care in the patient pool makes the system more affordable. However, the federal penalty for going without coverage has been $0 since 2019.\nObamacare plans, created by President Barack Obama's Affordable Care Act, offer subsidies based on household size and estimated yearly income. President Donald Trump failed to overturn the legislation during his first term, but has proposed modifications that would make those insurance plans less comprehensive.\nOz argued that bad actors were attracted to ACA marketplace subsidies during the Covid-19 pandemic, when federal spending surged dramatically. He pointed to enrollment growth from about 10 million people before the pandemic to roughly 22 million after, arguing that weakened safeguards and a lack of enforcement by the Biden administration contributed to improper enrollments.\nObamacare plans experienced \"unprecedented enrollment growth from 2021 to 2024,\" according to a June report from the Office of the Assistant Secretary for Planning and Evaluation, the principal advisor to the Secretary of the Department of Health and Human Services on policy development. The report said of this enrollment that \"nearly half ... was suspected to be improper, phantom, or fraudulent.\" The report defined improper or fraudulent enrollment as individuals misstating their income to gain access to free plans.\nThe spike in enrollment came after the American Rescue Plan, a Covid response bill passed in 2021, enhanced available subsidies to make healthcare more affordable during the crisis. Those broader credits were extended but later expired at the end of 2025, raising premiums for many covered by ACA exchanges.\nAn estimated 19.2 million Americans are currently enrolled in Obamacare plans, according to the report.",
    "bodyJa": "The Centers for Medicare and Medicaid Services said on Tuesday it canceled roughly 315,000 Affordable Care Act marketplace enrollments covering about 760,000 people last month, alleging unauthorized enrollments, characterized by Vice President JD Vance as \"rampant fraud.\"\nThe enforcement action also involves verifying roughly 419,000 people to ensure they are legal U.S. residents and meet the income threshold requirements to receive benefits from the public exchanges of the ACA, also known as Obamacare, according to a CMS release.\nThe vice president's White House Task Force to Eliminate Fraud led the cancellations, and it estimates the action will save roughly $2.2 billion in taxpayer-funded subsidies. Speaking at a Tuesday briefing, Vance accused the Biden administration of maintaining a system that enabled fraud.\n\"You have a system where, on the one hand, brokers are paid money to feed patients into the system, while on the other hand, the government isn't even checking whether the people enrolled are actually eligible for the program. What do you have? Of course, rampant, rampant fraud,\" Vance said.\nIt is unclear how many of those 315,000 enrollments involved people who were not eligible to receive coverage, or whether the Biden administration hadn't actually verified they could enroll. The action comes as the Trump administration has made widespread accusations of fraud in U.S. health programs and restricted funding and eligibility for the federal-state Medicaid program.\nDuring the briefing Tuesday, CMS Administrator Dr. Mehmet Oz claimed that around 35% of people currently in the Obamacare system \"have never used the program.\" He said those people never used a prescription or saw a doctor.\nThe law has an individual mandate, or requirement that most people buy insurance, in part because having healthier people who use less care in the patient pool makes the system more affordable. However, the federal penalty for going without coverage has been $0 since 2019.\nObamacare plans, created by President Barack Obama's Affordable Care Act, offer subsidies based on household size and estimated yearly income. President Donald Trump failed to overturn the legislation during his first term, but has proposed modifications that would make those insurance plans less comprehensive.\nOz argued that bad actors were attracted to ACA marketplace subsidies during the Covid-19 pandemic, when federal spending surged dramatically. He pointed to enrollment growth from about 10 million people before the pandemic to roughly 22 million after, arguing that weakened safeguards and a lack of enforcement by the Biden administration contributed to improper enrollments.\nObamacare plans experienced \"unprecedented enrollment growth from 2021 to 2024,\" according to a June report from the Office of the Assistant Secretary for Planning and Evaluation, the principal advisor to the Secretary of the Department of Health and Human Services on policy development. The report said of this enrollment that \"nearly half ... was suspected to be improper, phantom, or fraudulent.\" The report defined improper or fraudulent enrollment as individuals misstating their income to gain access to free plans.\nThe spike in enrollment came after the American Rescue Plan, a Covid response bill passed in 2021, enhanced available subsidies to make healthcare more affordable during the crisis. Those broader credits were extended but later expired at the end of 2025, raising premiums for many covered by ACA exchanges.\nAn estimated 19.2 million Americans are currently enrolled in Obamacare plans, according to the report.",

    "titleJa": "Cisco stock sinks 5% after Piper Sandler cuts price target on growth concerns",
    "summaryJa": "Cisco stock hit a record over the summer, but Piper Sandler analysts expressed concerns that growth is peaking in the industry.",
    "bodyOriginal": "Cisco stock dropped almost 5% on Tuesday as Piper Sandler cut its price target for the networking equipment vendor to $125 from $132.\nPiper analysts cited lower price-to-earnings multiple expectations stemming from concerns that growth is peaking in the industry.\nThe stock hit a record high in June, and is up 57% over the past 12 months as revenue has surged along with the artificial intelligence boom. The shares closed on Tuesday at $106.44.\nLast month, Cisco posted strong fourth-quarter earnings that beat estimates, reporting $17.25 billion in revenue that topped a $16.8 billion estimate, according to LSEG.\nThe company issued strong guidance for its FY2027 during its last earnings call in August, but shares sank as it was met with a lackluster reception from analysts.\nWhile Cisco projected nearly 15% revenue growth, analysts argued sales growth would dip back into single digits. Piper analysts called the projection \"conservative\" in the context of greater market demand.\n\"We're starting a new fiscal year. We're operating in incredible markets,\" Robbins told CNBC's Jim Cramer last month. \"But it's also a time that we're going to start the year being a little bit prudent.\"\nHyperscalers made up about $4 billion in revenue in fiscal year 2026, and Cisco expects that number to almost double in fiscal 2027 to $7.5 billion.\nWATCH: AI agents need supervision",

    "id": "u-s-regulators-rush-to-write-crypto-rule-eee791f6",
    "title": "U.S. regulators rush to write crypto rulebook after Clarity Act stalls in Senate",
    "titleJa": "U.S. regulators rush to write crypto rulebook after Clarity Act stalls in Senate",
    "summaryJa": "State and federal regulators are rushing to fill the void after comprehensive crypto rules failed to clear the Senate.",
    "bodyOriginal": "State and federal regulators are rushing to fill the void in U.S. cryptocurrency regulation after the Clarity Act, a comprehensive set of proposed rules for digital assets, stalled in the Senate.\nJust two days after the Clarity Act failed to advance in the Senate, the Securities and Exchange Commission expanded its crypto rulebook under its existing authority. The agency issued an order creating a temporary pathway for trading certain tokenized stocks, inching financial markets closer to 24/7 trading.\nThe same day, the Commodity Futures Trading Commission submitted a crypto rulemaking proposal to the White House for review. The details of the proposal weren't made public, but a post by the Office of Management and Budget confirmed the rules were pending review.\nThe crypto industry, which had supported the Clarity Act, says it is eager for regulatory guidelines for the developing industry, as it has worked to shape the regulatory environment to its liking.\n\"When you're thinking about traditional finance entering in and using some of this technology, they're being held back right now because there is this regulatory uncertainty,\" Summer Mersinger, CEO of the Blockchain Association and a former CFTC commissioner, said. \"Having the regulators provide some sort of certainty is going to really open up the industry to more investment, more integration into traditional finance, and really grow the sector.\"\nAnd Coinbase CEO Brian Armstrong, who is a key industry player urging Congress to act on the Clarity Act, told CNBC after a failed Senate procedural vote on Sept. 15: \"At this point, I don't think we can wait on Congress and the Senate.\" Senate banking committee Chairman Tim Scott, R-S.C., also called on federal agencies to set \"clear rules of the road\" for digital assets until Congress legislates.\nBut new rules from federal agencies don't come quickly.\nWhen asked how the agency plans to regulate crypto, the CFTC pointed CNBC to Chair Michael Selig's Sept. 16 statement where he said, \"President Trump promised to deliver a future-proof crypto asset regulatory market structure one way or the other, and we will help him get the job done using our existing statutory authorities.\"\nCNBC also reached out to the SEC regarding next steps for regulating the digital asset industry, and a spokesperson said the agency will consider a proposal to \"modernize the rules around custody of investment adviser client assets and fund assets, including to address crypto assets.\"\nCaroline Pham, who served as acting CFTC chair from the day President Donald Trump took office for his second term until December, told CNBC that \"a plan B to move forward at the agency level was always in the cards.\" Pham is now the CEO of MoonPay Institutional and chief legal officer and chief administrative officer for MoonPay, a crypto services provider.\n\"You have to have a contingency plan,\" she said, explaining that the CFTC and SEC took that into account with the work the agencies have been doing since Trump's second term began. That includes the \"Project Crypto\" initiative introduced in July 2025 to modernize securities regulations and align the SEC and CFTC's crypto rules.\nIn August 2025, Pham announced the CFTC would start implementing the recommendations from the President's Working Group on Digital Asset Markets.\nStates target crypto scams\nAs Washington grapples with crypto regulation, states are also fighting for the chance to regulate the asset class.\nIn a Sept. 14 letter, a bipartisan coalition of state attorneys general urged the Senate Banking Committee to oppose the Clarity Act, arguing the bill displaces states' abilities to regulate securities markets.\n\"We write to urge the Senate to expressly preserve the police powers of the states and ensure that the states remain armed with the tools necessary to protect the American people from predatory scammers,\" they wrote to Scott and the panel's top Democrat Sen. Elizabeth Warren, of Massachusetts.\nAaron Klein, senior fellow in economic studies at the Brookings Institution, told CNBC he doesn't think states are best positioned to regulate national and international capital markets.\n\"Capital market regulation, I think, needs to be done at the federal level,\" Klein, who was previously a top staff member for the Senate banking committee, said. \"In terms of stopping fraud and scams, states have a lot of authority.\"\nHe said that in the absence of a federal framework for crypto, states should be more aggressively monitoring payment processing and prosecuting criminals.\nMersinger noted that state enforcement comes after a crime is already committed.\n\"What we really need is the oversight from the federal side to make sure that we're not having these situations where [a] state AG has to come in and file a lawsuit because there was some bad actor involved or some of their constituents in their state were somehow harmed,\" she said.\nThe midterm election is now taking center stage, but lawmakers haven't completely abandoned the Clarity Act. Sen. Thom Tillis, R-N.C., revised his vote to oppose the bill, allowing him to bring a motion to reconsider the legislation in the Senate.\n— CNBC's Tanaya Macheel and Garrett Downs contributed to this report.",
    "bodyJa": "State and federal regulators are rushing to fill the void in U.S. cryptocurrency regulation after the Clarity Act, a comprehensive set of proposed rules for digital assets, stalled in the Senate.\nJust two days after the Clarity Act failed to advance in the Senate, the Securities and Exchange Commission expanded its crypto rulebook under its existing authority. The agency issued an order creating a temporary pathway for trading certain tokenized stocks, inching financial markets closer to 24/7 trading.\nThe same day, the Commodity Futures Trading Commission submitted a crypto rulemaking proposal to the White House for review. The details of the proposal weren't made public, but a post by the Office of Management and Budget confirmed the rules were pending review.\nThe crypto industry, which had supported the Clarity Act, says it is eager for regulatory guidelines for the developing industry, as it has worked to shape the regulatory environment to its liking.\n\"When you're thinking about traditional finance entering in and using some of this technology, they're being held back right now because there is this regulatory uncertainty,\" Summer Mersinger, CEO of the Blockchain Association and a former CFTC commissioner, said. \"Having the regulators provide some sort of certainty is going to really open up the industry to more investment, more integration into traditional finance, and really grow the sector.\"\nAnd Coinbase CEO Brian Armstrong, who is a key industry player urging Congress to act on the Clarity Act, told CNBC after a failed Senate procedural vote on Sept. 15: \"At this point, I don't think we can wait on Congress and the Senate.\" Senate banking committee Chairman Tim Scott, R-S.C., also called on federal agencies to set \"clear rules of the road\" for digital assets until Congress legislates.\nBut new rules from federal agencies don't come quickly.\nWhen asked how the agency plans to regulate crypto, the CFTC pointed CNBC to Chair Michael Selig's Sept. 16 statement where he said, \"President Trump promised to deliver a future-proof crypto asset regulatory market structure one way or the other, and we will help him get the job done using our existing statutory authorities.\"\nCNBC also reached out to the SEC regarding next steps for regulating the digital asset industry, and a spokesperson said the agency will consider a proposal to \"modernize the rules around custody of investment adviser client assets and fund assets, including to address crypto assets.\"\nCaroline Pham, who served as acting CFTC chair from the day President Donald Trump took office for his second term until December, told CNBC that \"a plan B to move forward at the agency level was always in the cards.\" Pham is now the CEO of MoonPay Institutional and chief legal officer and chief administrative officer for MoonPay, a crypto services provider.\n\"You have to have a contingency plan,\" she said, explaining that the CFTC and SEC took that into account with the work the agencies have been doing since Trump's second term began. That includes the \"Project Crypto\" initiative introduced in July 2025 to modernize securities regulations and align the SEC and CFTC's crypto rules.\nIn August 2025, Pham announced the CFTC would start implementing the recommendations from the President's Working Group on Digital Asset Markets.\nStates target crypto scams\nAs Washington grapples with crypto regulation, states are also fighting for the chance to regulate the asset class.\nIn a Sept. 14 letter, a bipartisan coalition of state attorneys general urged the Senate Banking Committee to oppose the Clarity Act, arguing the bill displaces states' abilities to regulate securities markets.\n\"We write to urge the Senate to expressly preserve the police powers of the states and ensure that the states remain armed with the tools necessary to protect the American people from predatory scammers,\" they wrote to Scott and the panel's top Democrat Sen. Elizabeth Warren, of Massachusetts.\nAaron Klein, senior fellow in economic studies at the Brookings Institution, told CNBC he doesn't think states are best positioned to regulate national and international capital markets.\n\"Capital market regulation, I think, needs to be done at the federal level,\" Klein, who was previously a top staff member for the Senate banking committee, said. \"In terms of stopping fraud and scams, states have a lot of authority.\"\nHe said that in the absence of a federal framework for crypto, states should be more aggressively monitoring payment processing and prosecuting criminals.\nMersinger noted that state enforcement comes after a crime is already committed.\n\"What we really need is the oversight from the federal side to make sure that we're not having these situations where [a] state AG has to come in and file a lawsuit because there was some bad actor involved or some of their constituents in their state were somehow harmed,\" she said.\nThe midterm election is now taking center stage, but lawmakers haven't completely abandoned the Clarity Act. Sen. Thom Tillis, R-N.C., revised his vote to oppose the bill, allowing him to bring a motion to reconsider the legislation in the Senate.\n— CNBC's Tanaya Macheel and Garrett Downs contributed to this report.",

    "id": "trump-says-he-would-back-ban-on-diesel-e-096679cf",
    "title": "Trump says he would back ban on diesel exports",
    "titleJa": "Trump says he would back ban on diesel exports",
    "summaryJa": "Republicans lawmakers have put pressure on the president to curb exports as diesel prices soar to record highs in the US.",
    "bodyOriginal": "Trump says he would back ban on diesel exports\n- Published\nUS President Donald Trump has said he would back proposals to halt American diesel exports in a bid to ease prices for drivers at the pumps.\nHis comments come after Republicans lawmakers put pressure on the president ahead of November's mid-term elections to curb exports, as diesel prices soar to record highs in the US.\nSpeaking on the sidelines at the United Nations General Assembly, Trump suggested keeping domestic supplies inside the US could also ease broader petrol prices.\n\"I've called for that too. I've said let's not send out the diesel. We make a lot of diesel. That could have a little bit of an effect on regular automobile gasoline,\" he said .\nUS Treasury Secretary Scott Bessent confirmed officials were assessing \"whether a full or partial ban would work\" without disrupting refinery capabilities.\nNational average diesel prices surpassed $6.50 (£4.87) a gallon on Tuesday according to AAA data, a new high.\nThe conflict in the Middle East has constrained global oil supplies, putting pressure on pump prices.\nThe surge in the cost of diesel has sparked political urgency ahead of crucial mid-term elections on 3 November, with several Republicans pressing the administration to restrict the fuel's export to ease financial strain on voters.\nUS Representative Ashley Hinson, a Republican running for Senate in Iowa, said on Monday that the state's consumers were \"being squeezed and shouldn't have to foot the bill at the pump.\"\nIn Alaska on Tuesday, Senator Dan Sullivan similarly urged for a \"temporary pause of American diesel and exports\" to rebuild domestic reserves.\nAdding to the global market volatility, Ukraine's targeting of Russian energy facilities has knocked out the country's refining capacity.\n\"It is a serious hit on the Russians,\" Trump said during a meeting with Ukrainian counterpart Volodymyr Zelensky on Tuesday. \"It's also a serious hit on the price of diesel.\"\nTrump confirmed he would discuss the strikes with the Ukrainian president, alongside broader efforts to negotiate an end to the conflict. \"I think it's going to happen,\" he said.\nKyiv has intensified drone attacks on Russian processing plants in recent months to choke off the Kremlin's primary source of war funding.\nBecause Russia ranks among the world's leading diesel suppliers, reduced refining capacity – combined with Moscow's own strict export bans – has severely squeezed global reserves.\nWhile restricting US exports could offer short-term relief for American drivers, a ban may risk pushing up prices internationally.\nThe US exports roughly 1.3 million barrels of diesel per day – nearly a quarter of its refining output.\nCutting these shipments could put pressure on supplies for Western allies, including the UK and the Netherlands, which have relied on American fuel to cover deficits left by sanctions on Russian energy.\nRelated topics\n- Published1 hour ago\n- Published2 hours ago",
    "bodyJa": "Trump says he would back ban on diesel exports\n- Published\nUS President Donald Trump has said he would back proposals to halt American diesel exports in a bid to ease prices for drivers at the pumps.\nHis comments come after Republicans lawmakers put pressure on the president ahead of November's mid-term elections to curb exports, as diesel prices soar to record highs in the US.\nSpeaking on the sidelines at the United Nations General Assembly, Trump suggested keeping domestic supplies inside the US could also ease broader petrol prices.\n\"I've called for that too. I've said let's not send out the diesel. We make a lot of diesel. That could have a little bit of an effect on regular automobile gasoline,\" he said .\nUS Treasury Secretary Scott Bessent confirmed officials were assessing \"whether a full or partial ban would work\" without disrupting refinery capabilities.\nNational average diesel prices surpassed $6.50 (£4.87) a gallon on Tuesday according to AAA data, a new high.\nThe conflict in the Middle East has constrained global oil supplies, putting pressure on pump prices.\nThe surge in the cost of diesel has sparked political urgency ahead of crucial mid-term elections on 3 November, with several Republicans pressing the administration to restrict the fuel's export to ease financial strain on voters.\nUS Representative Ashley Hinson, a Republican running for Senate in Iowa, said on Monday that the state's consumers were \"being squeezed and shouldn't have to foot the bill at the pump.\"\nIn Alaska on Tuesday, Senator Dan Sullivan similarly urged for a \"temporary pause of American diesel and exports\" to rebuild domestic reserves.\nAdding to the global market volatility, Ukraine's targeting of Russian energy facilities has knocked out the country's refining capacity.\n\"It is a serious hit on the Russians,\" Trump said during a meeting with Ukrainian counterpart Volodymyr Zelensky on Tuesday. \"It's also a serious hit on the price of diesel.\"\nTrump confirmed he would discuss the strikes with the Ukrainian president, alongside broader efforts to negotiate an end to the conflict. \"I think it's going to happen,\" he said.\nKyiv has intensified drone attacks on Russian processing plants in recent months to choke off the Kremlin's primary source of war funding.\nBecause Russia ranks among the world's leading diesel suppliers, reduced refining capacity – combined with Moscow's own strict export bans – has severely squeezed global reserves.\nWhile restricting US exports could offer short-term relief for American drivers, a ban may risk pushing up prices internationally.\nThe US exports roughly 1.3 million barrels of diesel per day – nearly a quarter of its refining output.\nCutting these shipments could put pressure on supplies for Western allies, including the UK and the Netherlands, which have relied on American fuel to cover deficits left by sanctions on Russian energy.\nRelated topics\n- Published1 hour ago\n- Published2 hours ago",

    "id": "trump-administration-is-examining-whethe-5a38137f",
    "title": "Trump administration is examining whether a diesel export ban is feasible, Treasury Secretary says",
    "titleJa": "Trump administration is examining whether a diesel export ban is feasible, Treasury Secretary says",
    "summaryJa": "Republican lawmakers have called for an export ban as high diesel prices hit farmers and truckers ahead of the November midterm elections.",
    "bodyOriginal": "The Trump administration is looking into whether implementing a diesel export ban would ease record high prices for the critical fuel, Treasury Secretary Scott Bessent said Tuesday.\n\"We're examining whether it's feasible in terms of the overall refining capacity and whether a full or partial ban would work,\" Bessent said at a bilateral meeting between President Donald Trump and Ukrainian President Volodymyr Zelenskyy at the United Nations.\nTrump said Tuesday he's advocated for a diesel export ban during internal administration deliberations. The president said a decision would quickly be made \"one way or another\" on whether to implement a ban.\n\"I've said let's not send out the diesel. We make a lot of diesel,\" Trump told reporters. Republican lawmakers including Sen. Chuck Grassley of Iowa have called for an export ban as high diesel prices hit farmers and truckers ahead of the November midterm elections.\nDiesel in the U.S. has surged to a record high $6.53 per gallon, almost $3 above the level last year, according to data from AAA. In California, diesel costs $8.44 per gallon.\nFuel prices have jumped as the wars in Eastern Europe and the Middle East have slashed global refining capacity.\nUkraine's attacks on Russian refineries have forced Moscow to implement a diesel export ban. Refineries in the Middle East have also come under attack from Iran and its Houthi allies. And product exports through the Strait of Hormuz are constrained due to Iranian threats to tankers.\nU.S. refiners have rushed to take advantage, ramping up diesel exports to help supply the world and reap sky-high profits. Diesel cost around $207 a barrel Tuesday, more than $100 above the price of crude oil.\nDiesel plays an essential role in the economy. It fuels the trucks and trains that deliver goods to market and the farm equipment that harvests crops. Higher diesel prices trickle down to consumers in higher grocery bills and what they pay for consumer products.",
    "bodyJa": "The Trump administration is looking into whether implementing a diesel export ban would ease record high prices for the critical fuel, Treasury Secretary Scott Bessent said Tuesday.\n\"We're examining whether it's feasible in terms of the overall refining capacity and whether a full or partial ban would work,\" Bessent said at a bilateral meeting between President Donald Trump and Ukrainian President Volodymyr Zelenskyy at the United Nations.\nTrump said Tuesday he's advocated for a diesel export ban during internal administration deliberations. The president said a decision would quickly be made \"one way or another\" on whether to implement a ban.\n\"I've said let's not send out the diesel. We make a lot of diesel,\" Trump told reporters. Republican lawmakers including Sen. Chuck Grassley of Iowa have called for an export ban as high diesel prices hit farmers and truckers ahead of the November midterm elections.\nDiesel in the U.S. has surged to a record high $6.53 per gallon, almost $3 above the level last year, according to data from AAA. In California, diesel costs $8.44 per gallon.\nFuel prices have jumped as the wars in Eastern Europe and the Middle East have slashed global refining capacity.\nUkraine's attacks on Russian refineries have forced Moscow to implement a diesel export ban. Refineries in the Middle East have also come under attack from Iran and its Houthi allies. And product exports through the Strait of Hormuz are constrained due to Iranian threats to tankers.\nU.S. refiners have rushed to take advantage, ramping up diesel exports to help supply the world and reap sky-high profits. Diesel cost around $207 a barrel Tuesday, more than $100 above the price of crude oil.\nDiesel plays an essential role in the economy. It fuels the trucks and trains that deliver goods to market and the farm equipment that harvests crops. Higher diesel prices trickle down to consumers in higher grocery bills and what they pay for consumer products.",

    "title": "Royal Caribbean nears $3 billion deal to take 50% equity stake in Sandals",
    "titleJa": "Royal Caribbean nears $3 billion deal to take 50% equity stake in Sandals",
    "summaryJa": "Royal Caribbean has been trying to diversify beyond cruises and become a leader overall in vacations.",
    "bodyOriginal": "Royal Caribbean is nearing a $3 billion deal to take a 50% equity stake in Sandals, according to a person familiar with the matter.\nThe person, who spoke on the condition of anonymity to discuss talks that had not been made public, said the deal values the Caribbean resort chain at $6 billion and that it was expected to boost for growth for both companies. The talks are ongoing and may not result in a deal, according to the person.\nRoyal Caribbean shares fell roughly 6% on the news, which was first reported by the Financial Times.\nThe company's stock is down roughly 25% over the past year after it trimmed its forecasts for revenue growth on softer demand for European sailings.\nThe cruise company has been intent on diversifying beyond cruises and becoming a leader overall in vacations. Royal Caribbean already operates several private destinations for its cruise passengers, but it has been working to build out those land offerings.\nSandals and its Beaches brand, meanwhile, have more than a dozen properties across the Caribbean, which would give Royal Caribbean a foothold in all-inclusive options.\nNeither Royal Caribbean nor Sandals immediately responded to a request for comment.",
    "bodyJa": "Royal Caribbean is nearing a $3 billion deal to take a 50% equity stake in Sandals, according to a person familiar with the matter.\nThe person, who spoke on the condition of anonymity to discuss talks that had not been made public, said the deal values the Caribbean resort chain at $6 billion and that it was expected to boost for growth for both companies. The talks are ongoing and may not result in a deal, according to the person.\nRoyal Caribbean shares fell roughly 6% on the news, which was first reported by the Financial Times.\nThe company's stock is down roughly 25% over the past year after it trimmed its forecasts for revenue growth on softer demand for European sailings.\nThe cruise company has been intent on diversifying beyond cruises and becoming a leader overall in vacations. Royal Caribbean already operates several private destinations for its cruise passengers, but it has been working to build out those land offerings.\nSandals and its Beaches brand, meanwhile, have more than a dozen properties across the Caribbean, which would give Royal Caribbean a foothold in all-inclusive options.\nNeither Royal Caribbean nor Sandals immediately responded to a request for comment.",

    "summaryJa": "Trump sold tech stocks including Amazon and Microsoft when the Mag 7 stocks popped on July 20, adding $291 billion in market value in one day.",
    "bodyOriginal": "President Donald Trump disclosed, in a filing released Tuesday, more than 1,100 securities transactions made on his behalf in July, including sales of as much as $25 million each of Microsoft and Amazon shares, as his sprawling investment portfolio underwent another month of heavy trading.\nThe 1,156 purchases and sales totaled between roughly $79 million and $270 million, according to a CNBC analysis of Trump's latest financial disclosure. Purchases totaled at least $43.6 million, while sales came to at least $35.6 million, CNBC calculated, in what appears to be a broad reshuffling of his portfolio.\nThe largest transactions were July 20 sales of between $5 million and $25 million each of Microsoft and Amazon, according to the filing. Three days later, Trump reported buying between $100,001 and $250,000 of Microsoft and between $1,001 and $15,000 of Amazon.\nThe same July 20 entries show sales of between $1 million and $5 million of Oracle, along with purchases that included between $500,001 and $1 million of Nvidia.\nThe filing also shows a $250,001 to $500,000 sale of Northrop Grumman that day, when Trump signed an executive order tightening supply chain requirements for defense contractors and restricting waivers for certain critical materials sourced from China and other covered countries. The disclosure does not show what time the trade occurred or who made the investment decision.\nWhile the filing shows activity conducted on Trump's behalf, broad value ranges obscure his exact holdings. Still, heavy trading has been a feature of his second term. In June, Trump disclosed 1,051 transactions totaling between $78.1 million and $263.1 million, including purchases and sales of stocks, bonds and exchange-traded funds.\nThe president's 2025 annual financial disclosure showed more than 21,000 securities trades across eight accounts holding at least $858 million, compared with 86 stock transactions disclosed during his first year in office in 2017.\nThe White House has repeatedly defended the trades and said independent advisors manage the portfolio without input from Trump or his family. Recent presidents, however, have generally divested individual stocks or relied on blind trusts or diversified funds to avoid even the appearance of conflicts of interest.\n\"President Trump's stock and bond portfolio is independently managed by third-party financial institutions,\" White House spokesman Davis Ingle said in response to CNBC's questions about Trump's latest disclosure. \"Neither President Trump nor any member of his family has any ability to direct, influence, or provide input regarding how the portfolio is invested or when investments are bought or sold.\"\nThe Trump Organization did not immediately respond to a request for comment on the latest disclosure.\nThe July 20 transactions were part of a wider rotation including purchases of between $1 million and $5 million each of Intuit, Marvell Technology, Salesforce and Church & Dwight. Trump also bought between $250,000 and $500,000 of taser maker Axon Enterprises, which works frequently with Immigration and Customs Enforcement.\nThe president also continued moving money among ETFs.\nOn July 8, Trump disclosed purchases worth between $1 million and $5 million each of the State Street SPDR Bloomberg International Treasury Bond ETF, Fidelity MSCI Communication Services Index ETF, Vanguard Short-Term Bond Index Fund ETF and Vanguard Dividend Appreciation Index Fund ETF.\nThat same day, he sold between $1 million and $5 million each of the iShares U.S. Treasury Bond ETF, State Street Communication Services Select Sector SPDR ETF and iShares International Treasury Bond ETF.\nTen-year yields climbed on July 8, led by soaring oil prices, after Trump said at the NATO summit in Turkey that he thought a ceasefire with Iran was over.\nTrump also made several large purchases of municipal and other bonds. The filing shows purchases worth between $1 million and $5 million each of two Miami-Dade County aviation revenue bonds, a St. Louis County school district bond and a Main Street Natural Gas bond.",

    "id": "we-screwed-up-doordash-admits-underpayi-f9bb04f7",
    "title": "'We screwed up': Doordash admits underpaying New York workers",
    "titleJa": "'We screwed up': Doordash admits underpaying New York workers",
    "summaryJa": "The food delivery giant will pay a $131.5m settlement following a city probe into wage violations.",
    "bodyOriginal": "'We screwed up': Doordash admits underpaying New York workers\n- Published\nDoorDash has agreed to pay a $131.5m (£99m) settlement to New York City regulators after the food delivery giant admitted failing to compensate thousands of workers correctly or on time.\n\"Simply put, we screwed up,\" DoorDash said. \"Our mistakes meant some Dashers were underpaid or paid late.\"\nThe agreement with the Department of Consumer and Worker Protection follows a city investigation into wage violations, with a significant share of the payout addressing how DoorDash calculates compensation for the time delivery drivers spend waiting for orders.\nThe settlement marks another chapter in an ongoing battle between so-called gig economy platforms and municipal leaders.\nThe likes of Uber Eats and Grubhub have repeatedly clashed with city officials over tipping laws, minimum wages and data-sharing requirements.\nSan Francisco-based DoorDash blamed \"complex\" changes to the minimum wage in New York state introduced in 2023.\nUnder the landmark minimum pay standard for app-based delivery workers, wages differ depending on the county, tipping and how many people work for the employer.\nDoorDash also cited technical glitches and multi-stop delivery routes for causing the firm to underpay workers or delay wages.\nThe company said: \"While these mistakes weren't intentional, that doesn't make them okay.\"\nDoorDash said local workers earn roughly $30 per active hour on average. It said it has now patched the software bugs responsible for the mistakes.\nThe business said the errors hit roughly 264,000 workers, though it insisted the issues affected under 1% of overall local transactions.\nSystemic errors caused around $6.6m wages to never reach workers at all, and another $5.7m arrived days or weeks late.",

    "id": "trump-slams-iran-and-cuba-defends-ai-gro-8f5f482e",
    "title": "Trump slams Iran and Cuba, defends AI growth and recounts record in UN speech",
    "titleJa": "Trump slams Iran and Cuba, defends AI growth and recounts record in UN speech",
    "summaryJa": "The U.S. \"will no longer permit threats to America to gain a foothold anywhere in the Western Hemisphere,\" Trump told the UN leaders.",
    "bodyOriginal": "President Donald Trump on Tuesday focused on a wide range of threats the U.S. faces from abroad during a frequently boastful address to the United Nations General Assembly in Manhattan.\nTrump, in a roughly 37-minute speech, also directly criticized the UN itself, and reaffirmed his view that the U.S. artificial intelligence industry should continue its rapid growth with few restraints or guardrails.\nTrump defended his decision to launch a war against Iran, accusing the Islamic Republic of seeking to erect a defensive missile arsenal before making a \"mad dash to a nuclear bomb.\"\nAs the war approaches its eighth month with no clear end in sight, Trump said he is poised to make a \"big decision\" on whether to make a deal or quickly \"annihilate\" the country.\nHe then predicted once again that a deal will be made \"right after\" the Nov. 3 midterm elections, claiming \"it doesn't make sense for them not to.\"\n\"They're waiting to see how I do in the midterm election,\" he said. \"What they don't realize is that I'm not running.\"\n\"I gave absolutely no credence and will not give credence to the election when it comes to Iran. It doesn't even enter my mind. The only thing that does is that Iran will never have a nuclear weapon,\" Trump said.\nHe also touted a military deal with Greenland and Denmark, saying it gives the U.S. \"the complete ability to do what is necessary to defend the American continent, and also Europe and other places.\" That agreement was signed at a trilateral meeting later Tuesday morning.\nTrump called Cuba an \"absolutely failed state\" and accused it of \"coordinating with left-wing radicals and Communist networks\" in the U.S.\n\"Communism will never be coming to America, but freedom will be coming to Cuba,\" Trump told the assembled leaders. He said Secretary of State Marco Rubio is in negotiations with the island nation.\nAs he spoke, the Cuban delegation stood up and left the hall.\n\"The United States will no longer permit threats to America to gain a foothold anywhere in the Western Hemisphere,\" Trump said, pointing to his administration's intervention in Venezuela this year as proof.\n\"And if necessary, we will use our unmatched military might to secure the vital national interests of the United States,\" he said.\nToward the end of the speech, Trump turned to AI — first by debuting his attempt to rebrand it \"super intelligence\" and also whipsawing on the U.S. government's role in putting guardrails on the technology.\nThe president then compared those raising concerns about AI — a group that includes some tech leaders — with those warning about climate change, which Trump also denies is a problem.\n\"These are the same people that are now saying that AI is going to kill us all, that robots are going to attack us, and that everything is going to be a total disaster,\" Trump said.\nHe reiterated his view that winning the race for AI superiority is the key to U.S. global dominance.\n\"That's the group that wins, and we're leading now over China by a lot, and everyone else, and we're going to keep it that way,\" he said. \"We're going to keep it very, very straight and very strong. I'm not going to stifle growth of something that will be bigger than the industrial revolution.\"\nThe government will \"rein things in\" if needed and will lead the sector \"safely and responsibly,\" Trump said.\nBut he also said, \"We will only encourage superintelligence. We're going to encourage it, not rein it in.\"",

ermit threats to America to gain a foothold anywhere in the Western Hemisphere,\" Trump said, pointing to his administration's intervention in Venezuela this year as proof.\n\"And if necessary, we will use our unmatched military might to secure the vital national interests of the United States,\" he said.\nToward the end of the speech, Trump turned to AI — first by debuting his attempt to rebrand it \"super intelligence\" and also whipsawing on the U.S. government's role in putting guardrails on the technology.\nThe president then compared those raising concerns about AI — a group that includes some tech leaders — with those warning about climate change, which Trump also denies is a problem.\n\"These are the same people that are now saying that AI is going to kill us all, that robots are going to attack us, and that everything is going to be a total disaster,\" Trump said.\nHe reiterated his view that winning the race for AI superiority is the key to U.S. global dominance.\n\"That's the group that wins, and we're leading now over China by a lot, and everyone else, and we're going to keep it that way,\" he said. \"We're going to keep it very, very straight and very strong. I'm not going to stifle growth of something that will be bigger than the industrial revolution.\"\nThe government will \"rein things in\" if needed and will lead the sector \"safely and responsibly,\" Trump said.\nBut he also said, \"We will only encourage superintelligence. We're going to encourage it, not rein it in.\"",

    "id": "davey-promises-tax-cuts-for-millions-if-494b2550",
    "title": "Davey promises tax cuts for millions if UK rejoins EU single market",
    "titleJa": "Davey promises tax cuts for millions if UK rejoins EU single market",
    "summaryJa": "The Lib Dem leader vows to raise tax thresholds if he becomes PM, in a speech to his party conference.",
    "bodyOriginal": "Davey promises tax cuts for millions if UK rejoins EU single market\n- Published\nThe Liberal Democrats will fight the next general election on a promise to cut taxes for millions of workers, Sir Ed Davey has said in a speech to his party conference.\nThe Lib Dem leader said that if he gained power, he would raise the annual tax-free personal allowance to £15,000.\nHe would also raise the 40p income tax threshold from £50,270 to £56,000, in a £17bn package funded by the economic boost he says would come from the UK rejoining the EU single market and customs union.\nHe claimed the plan would mean a £680 cut for \"most taxpayers\" but it would not come into full effect until the fifth year of a Lib Dem government - potentially up to eight years away.\nThe announcement was greeted with sustained applause by Lib Dem MPs and activists in the Brighton conference centre.\nThe £12,570 income tax allowance was frozen by the Conservatives in 2021, resulting in more people being dragged into paying the tax, and Labour has so far resisted calls from trade unions and some of its MPs to unfreeze it.\nThe Lib Dems said they would raise the threshold to £15,000 a year, and increase the starting point for paying employee National Insurance (NI) to the same level.\nAt their conference earlier this month, Reform UK promised to increase the income tax personal allowance to £15,000 within 100 days if they won power.\nSir Ed told the Lib Dem faithful \"the difference between us and Reform\" is that \"their tax cut is paid for through cruelty.\"\nHe said \"Reform's figures show they'd pay for it by ripping £22bn of crucial support away from disabled people.\"\nUnder the Lib Dem plan, based on research by think tank Frontier Economics, external, the economic boost from rejoining the single market would allow the party to spend £17bn on tax cuts by the end of the next Parliament.\nThe party says it would unfreeze personal allowances in the second year of a Lib Dem government, allowing them to rise with inflation, before bringing in big tax cuts in year five when the economic benefits of closer trading with the EU had kicked in.\nHowever, the move would depend on the party being able to negotiate a closer trading arrangement with the EU in just 12 months.\nStuart Adam, of the Institute for Fiscal Studies think tank, told BBC Verify the Lib Dem package would cost \"much more\" than the £17bn quoted by the party.\nReform has estimated that its policy, to raise the starting threshold to £15,000 just for income tax, would cost £21bn by the fifth year.\nThe Lib Dems say their policy would be funded by an extra £27bn from its plans for a \"growth and defence pact\" with the EU.\n'British values'\nSir Ed has been under pressure this week to set out bolder policies, with his party languishing in fourth or fifth place in national opinion polls.\nHe began his speech with a sombre and punchy attack on Reform UK leader Nigel Farage.\nHe stopped short of calling Reform fascists, but drew a link between the fascists in Britain in the 1930s with what he called \"thugs, in black shirts and balaclavas\" in reference to the protests in Dover and Portsmouth in recent weeks.\n\"This is a far-right movement that is given oxygen, and heat, and fuel by politicians and parties who claim to be serious contenders to lead our country,\" said the Lib Dem leader.\nThe solution, he said, was \"community politics\" that he argued was the hallmark of the Lib Dems.\n\"It will take more than a manifesto. It will take a movement, rooted in decency, fairness and community. British values. Liberal values,\" he said.\nRepositioning the Lib Dems as a tax cutting party is aimed at appealing to voters they are targeting in traditional Tory heartlands.\nAnd Sir Ed used his speech to attack Tory leader Kemi Badenoch over her policy shifts on climate change and human rights law.\n\"Millions of decent, moderate Conservative voters are getting her message, and they're turning away – increasingly, to us,\" he told the audience in Brighton.\nHe took a swipe at Prime Minister Andy Burnham for failing to commit to rejoining the EU single market, something the Lib Dems say they would do in their first year in government.\nLib Dem sources refused to say whether the income tax plan would be a condition of joining a coalition government with Labour or another party, saying the party's aim was to get as many MPs as possible.\nSir Ed has ruled out a coalition with Reform UK, and dismissed suggestions he could do a deal with the Conservatives, as his party did in 2010.\nThe Lib Dem leader also addressed the potential threat posed by AI in his speech, saying that \"handled badly, it concentrates more power in fewer hands than at any point in human history.\"\nHe said Burnham's AI partnership with US president Donald Trump \"doesn't come close to meeting the scale of this threat\" and called for \"a global treaty to press pause on super-intelligent AI now\".\nHe proposed \"a new International AI Safety Agency - like we have for nuclear - to stop anyone from developing this technology recklessly.\"\nAdditional reporting: Alice Aitken\nLib Dems vow to end 'computer says no' economy to boost growth\n- Published2 days ago\nLib Dems sleepwalking to irrelevance under Davey, says council leader\n- Published2 days ago\nLib Dems call for one-to-one midwife care during childbirth\n- Published1 day ago\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.",

    "title": "Sullivan: Wall Street admits it doesn't know where oil is headed. There's one stock they do agree on",
    "titleJa": "Sullivan: Wall Street admits it doesn't know where oil is headed. There's one stock they do agree on",
    "summaryJa": "JPMorgan’s commodity team admitted what many are thinking on the Iran situation and oil: We just don't know.",
    "bodyOriginal": "POWER POINT\nWhat I'm hearing from energy insiders\n\"I don't know.\"\nThe three hardest words for anyone on Wall Street to utter. Knowing things — or at least knowing enough to make a solid estimate — is one of Wall Street's core jobs. Analysts, bankers and traders have access to the best information and systems. They are paid very handsomely to know more than we do.\nSo it's refreshingly honest to hear someone on Wall Street admit they don't know. Which is exactly what the team at JPMorgan just did. They write:\n\"For the first time since the start of the Iran conflict, we don't have a baseline view. We simply don't know how to model the endgame. At the onset, we thought we did. We assumed there were economic red lines the U.S. administration would be unwilling to cross: $100 oil, gasoline near $5 a gallon, 4% headline inflation or a 5-handle on the 10-year Treasury yield. Those constraints gave us an implicit timeline, and we expected that by June there would be some form of agreement to reopen the Strait.\"\nNatasha Kaneva and her team continue:\n\"Six months later, many of those lines have been crossed, yet the exit strategy is less clear, not more. Oil is above $100 and the 10-year yield has a 5-handle. Gasoline, at $4.37, remains at record seasonally adjusted levels even though peak driving season is behind us. More concerning, diesel is at an all-time high of $6.31 a gallon heading into winter — the period of peak seasonal demand — while inventories sit at all-time lows.\"\nThis is one of the best and most useful research pieces I've read in years. That may sound counterintuitive, but let's be direct with each other: no one really knows what is going to happen or how this is all going to play out. No one.\nI'm sorry if that's not useful. We in the media and broadcast business also like to be sure of things. It's not in our best interest to say, \"We don't know,\" but sometimes we just have to admit it. This is one of those times. In fact, there are only four things I am relatively certain about right now.\nOne: nobody knows how this plays out. Kaneva is correct. It has now been six months since the Iran war/conflict began. It could be another six months before it is over. Or it could be six days, or six weeks. Or maybe it is never really \"over\" and simply burns out and slowly fades away. Or it could escalate dramatically.\nPresident Trump has said that oil and gasoline prices will not fall until after the November 3 elections in America. What exactly did he mean by that? Why would those elections — which will determine the balance of power in Congress —matter to Iran? We don't know for sure, but some sources I speak with believe that, after those elections are over, Trump will feel free to become hyper-aggressive, potentially destroying or taking control of Iranian oil and energy assets. If so, that would spike prices in the short term, but the market would anticipate higher oil exports later, bringing prices down. That may sound odd, but it's what some of my smarter sources are whispering about.\nTwo: this could go on longer than many think. Yes, Iran is suffering. Its economy is hurting, its currency is collapsing and whatever news we get from inside the closed kingdom implies tough times. But historically, Iran has a way of toughing through things and figuring out workarounds, like ship-to-ship oil transfers—a \"trick\" the U.S. has adopted.\nThree: the market really, really wants oil prices to go lower. Oil futures are hovering right around $100, and the cost to buy an actual barrel of oil in the Middle East is much higher than that. But oil is not at $125, $150 or more, despite many very smart people making a good argument that it should be.\nI mean, Saudi Arabia's massive East-West pipeline was hit in a drone attack. Oil is flowing through Hormuz, but at levels far below where they were when the war began. So why isn't oil higher? It sure seems that \"the market\" wants to push it lower. Whether that's because of demand destruction, a belief that this \"ends\" sooner rather than later, Saudi engineers getting the East-West pipeline back up and running soon, higher actual flows than are being recorded, or some combination of all those things — who knows? Oil could easily be at $150 per barrel. But it's not. That should tell you something.\nFour: Russia may be more important to global markets than Iran right now. Oil is a problem, but diesel fuel prices and supply are a more immediate threat. Russia is a massive refiner of diesel fuel. Ukraine has been systematically bombing some of those refineries, severely curtailing the global supply of diesel fuel. This has sent nominal diesel prices to record highs, though it has been higher when adjusted for inflation. In some areas of Europe, diesel fuel is over $10 per gallon and moving higher. The world runs on Rudolf Diesel's invention, and it's possible some areas won't be running much longer if prices keep going up and supply keeps going down.\nInsider take → Next week's Power Insider will dive deeper into Europe's natural gas woes. You can get a sneak peek below in this week's Inside Line interview with the co-founder of Venture Global.\nFour things I'm certain of. At least, I'm pretty sure I am. Maybe. These days, certainty is a rare commodity, and history has shown that anything having to do with Iran is often far from certain.\nSee you Monday through Friday at 2 p.m. ET on CNBC's Power Lunch!\nThanks for reading,\nBrian\nWALL STREET'S TAKE\nWhile parts of Wall Street struggle to figure out what's going to happen around Iran, oil and energy, stock analysts were busy making calls this week.\nThe biggest stock getting some analyst love is Chevron (CVX). Goldman Sachs reiterates a buy rating and raises its 12-month target by $15 to $240. Venezuela — which we wrote about extensively last week — plays a role here. The Goldman team notes that Venezuelan production is expected to double to about 600,000 b/d by 2031. The firm is also bullish on Chevron's power generation opportunities. The $240 target is above Wall Street's median target of $223 and about 17% where the stock is trading today.\nAlso watch BP (BP). The British energy giant continues to evolve, and Evercore ISI is here for it. The firm added BP to its Tactical Outperform list, though keeping its $52 the same. Analyst Stephen Richardson notes that BP's balance sheet \"promises to be one of the most transformed\" in the second half of this year. He likes the commodity \"tailwind\" and that BP is cutting debt levels to narrow the \"valuation gap.\" BP may be the most interesting company and stock to watch in 'big oil' over the next 12 months. After aggressively pivoting away from oil and gas, the company is now aggressively pivoting back toward oil and gas. It has a new(ish) CEO in Meg O'Neill, who is likely to keep driving BP back toward its core competencies in energy. Watch this space (and watch the stock!).\nThe calls are also coming on smaller cap stocks. Truist is bullish Crescent Energy (CRGY). It's got a buy rating and $19 target. Crescent is an oil producer that Truist analyst Gabe Daoud likes because it trades at an earnings discount to its peers. The firm adds that Crescent is doing \"more with less rock\" and has a nice free cash flow yield to its enterprise value. The $4.5 billion company operates mostly in the Permian Basin and Eagle Ford Shale regions of Texas. Truist's $19 target is high relative to Wall Street's median target of $17.44, though research firm Stephens takes the top spot with its $21 price for CRGY. The stock is trading around $13 currently.\nThe big macro stock story right now remains around refiners. They moved lower to start the week as oil fell, but otherwise have been hitting new highs nearly every day. Valero (VLO), HF Sinclair (DINO), and Marathon Petroleum (MPC) just hit new highs last week, while Phillips 66 (PSX), Par Pacific (PARR), PBF Energy (PBF) and Delek (DK) also remain close to record highs. They are benefitting from the jump in crack spreads. The EIA helpfully defines the term as the difference between the price of oil and the price of refined products, and notes that it helps determine the \"relative value\" of those products. Investors have figured out that the real value may be the earnings of these companies, bidding up the stocks massively in the last few months.\nThat said, caveat emptor around the crack spread! With the exception of Delek and Par Pacific, the refining stocks are all above their Wall Street price target.\nThe big question mark around these companies is whether the White House pushes through a ban or restriction on diesel fuel exports. As Citigroup notes, calls for restrictions are \"intensifying,\" and the firm says that if a complete ban were enacted, refineries would \"likely reduce throughput in response to sharply lower margins, which would have a cascading impact on the price of gasoline and jet fuel\" … but, worse, if a complete ban on exports were to happen, it would likely \"spell the end to [the] historical run in refining margins and share prices.\"\nIn other words - if you own any of the stocks below, pay close attention to any headlines around a possible diesel fuel export ban.\nMy take → Industry contacts all whisper to me that a diesel ban would ultimately have the opposite intended impact on higher prices as refiners cut their output to manage storage levels. Diesel fuel isn't like other products that can be easily rerouted; the distribution systems are locked in. That's the industry view anyway, and you can believe it or not … but it's a battle going on behind the scenes.\nTAKE A LOOK\nIt's not just about the price of oil itself. It's about getting oil from where it's produced to where it needs to go. That price is soaring. So much so that you almost can't even believe how much shipping costs have gone up. Well, believe it. And here it is.\nINSIDE LINE\nThis week's Inside Line is with Venture Global CEO Mike Sabel. We discuss the company's new China Gas deal, rising demand for U.S. LNG and the impact of Middle East disruptions.\nLOOKING FOR MORE?\nCatch up with more on energy including interviews and video content from CNBC and Power Insider.\nRead the last issue of Power Insider here.",

    "id": "democrats-lead-the-polls-republicans-lea-f4d8d901",
    "title": "Democrats lead the polls. Republicans lead in cash heading into the midterms",
    "titleJa": "Democrats lead the polls. Republicans lead in cash heading into the midterms",
    "summaryJa": "Republicans hold a $103 million cash advantage across national party committees as the fight for control of Congress enters its final six weeks.",
    "bodyOriginal": "Republicans are entering the final sprint to the 2026 midterm election trailing Democrats in national and battleground polls and defending much of the most competitive terrain in Congress. But on one critical measure, they hold a clear advantage: cash.\nThe GOP's three national committees entered September with roughly $233.4 million in cash on hand, nearly double the $130.4 million held by their Democratic counterparts, according to a CNBC analysis of newly filed Federal Election Commission reports.\nAnd that does not include the biggest Republican-aligned war chest: President Donald Trump's MAGA Inc. super PAC, which entered September with nearly $416 million in the bank. Two Trump-linked groups, No Going Back PAC Inc. and Safety & Affordability PAC Inc., have also reserved at least $126 million in advertising, according to AdImpact data.\nThe advantage gives Republicans more flexibility to reinforce vulnerable candidates or target late-breaking races with six weeks until Election Day. Republicans are defending 16 of the 21 House races rated \"Toss Ups\" by the Cook Political Report with Amy Walter, alongside six of the nine core battleground Senate seats.\nThe sharpest disparity is between the national parties.\nThe Republican National Committee ended August with $125.6 million, according to a FEC filing. The Democratic National Committee had $16.9 million, while carrying $17.6 million in debt, according to a FEC filing. The RNC alone had more than seven times as much cash.\nParty cash also carries more weight this election cycle after the Supreme Court struck down limits in June on how much parties can spend in coordination with their candidates.\nHouse Republicans held a smaller but record advantage. The National Republican Congressional Committee had about $89.1 million, roughly $13 million more than the Democratic Congressional Campaign Committee's $75.9 million, according to FEC filings.\nThe Senate committees are the exception.\nThe Democratic Senatorial Campaign Committee entered September with $37.6 million, compared with $18.7 million for the National Republican Senatorial Committee, according to FEC filings. But the NRSC had already begun spending heavily, disbursing $50.3 million in August, including about $45.9 million in coordinated spending, which helped draw its cash down from $56.2 million at the end of July.\nGoing into the closing weeks, Republicans and their allies have about $888 million in advertising planned through Election Day, compared with roughly $666 million for Democrats and their allies, according to AdImpact.",
    "bodyJa": "Republicans are entering the final sprint to the 2026 midterm election trailing Democrats in national and battleground polls and defending much of the most competitive terrain in Congress. But on one critical measure, they hold a clear advantage: cash.\nThe GOP's three national committees entered September with roughly $233.4 million in cash on hand, nearly double the $130.4 million held by their Democratic counterparts, according to a CNBC analysis of newly filed Federal Election Commission reports.\nAnd that does not include the biggest Republican-aligned war chest: President Donald Trump's MAGA Inc. super PAC, which entered September with nearly $416 million in the bank. Two Trump-linked groups, No Going Back PAC Inc. and Safety & Affordability PAC Inc., have also reserved at least $126 million in advertising, according to AdImpact data.\nThe advantage gives Republicans more flexibility to reinforce vulnerable candidates or target late-breaking races with six weeks until Election Day. Republicans are defending 16 of the 21 House races rated \"Toss Ups\" by the Cook Political Report with Amy Walter, alongside six of the nine core battleground Senate seats.\nThe sharpest disparity is between the national parties.\nThe Republican National Committee ended August with $125.6 million, according to a FEC filing. The Democratic National Committee had $16.9 million, while carrying $17.6 million in debt, according to a FEC filing. The RNC alone had more than seven times as much cash.\nParty cash also carries more weight this election cycle after the Supreme Court struck down limits in June on how much parties can spend in coordination with their candidates.\nHouse Republicans held a smaller but record advantage. The National Republican Congressional Committee had about $89.1 million, roughly $13 million more than the Democratic Congressional Campaign Committee's $75.9 million, according to FEC filings.\nThe Senate committees are the exception.\nThe Democratic Senatorial Campaign Committee entered September with $37.6 million, compared with $18.7 million for the National Republican Senatorial Committee, according to FEC filings. But the NRSC had already begun spending heavily, disbursing $50.3 million in August, including about $45.9 million in coordinated spending, which helped draw its cash down from $56.2 million at the end of July.\nGoing into the closing weeks, Republicans and their allies have about $888 million in advertising planned through Election Day, compared with roughly $666 million for Democrats and their allies, according to AdImpact.",

    "id": "altman-and-amodei-expected-to-join-un-se-de93e0ae",
    "title": "Altman and Amodei expected to join UN Security Council meeting about AI",
    "titleJa": "Altman and Amodei expected to join UN Security Council meeting about AI",
    "summaryJa": "President Donald Trump addressed the U.N. General Assembly on Tuesday and pledged to support AI, despite calls to pace advanced models.",
    "bodyOriginal": "OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei are expected to address the U.N. Security Council for a meeting about artificial intelligence this week, a U.N. spokesperson confirmed on Tuesday.\nHugging Face CEO Clément Delangue is also set to join, along with Yoshua Bengio, a professor at Université de Montréal who co-chairs the Independent International Scientific Panel of the United Nations on AI, said Stephane Dujarric, spokesperson for the Secretary-General.\nThe meeting is set for Wednesday, according to Bloomberg, which was first to report the news.\nThe U.N. General Assembly in New York this week comes as the debate around AI safety and regulation has reached a boiling point following warnings from researchers about the dire risks to humanity.\nPresident Donald Trump, who has repeatedly dismissed the warnings as a \"hoax\" and \"scam\" over the past week, addressed the assembly on Tuesday and pledged to \"encourage\" the nascent technology, despite calls from Amodei and Altman to pace the development of advanced models.\n\"I'm not going to stifle growth of something that will be bigger than the industrial revolution,\" Trump said. \"Many say bigger than the industrial revolution or the internet itself.\"\nOpenAI's disclosure in July that its AI models broke out of a testing environment and autonomously hacked into open-source developer platform Hugging Face set off a wave of concerns about the rise of advanced models and how much they can be contained.\nSince then, Anthropic has also disclosed cyber incidents with its models, and OpenAI has revealed further \"concerning model behavior\" by autonomous agents. Last week, Google said that its Gemini model hacked into three other companies.\n—CNBC's Jim Forkin contributed to this article.",
    "bodyJa": "OpenAI CEO Sam Altman and Anthropic CEO Dario Amodei are expected to address the U.N. Security Council for a meeting about artificial intelligence this week, a U.N. spokesperson confirmed on Tuesday.\nHugging Face CEO Clément Delangue is also set to join, along with Yoshua Bengio, a professor at Université de Montréal who co-chairs the Independent International Scientific Panel of the United Nations on AI, said Stephane Dujarric, spokesperson for the Secretary-General.\nThe meeting is set for Wednesday, according to Bloomberg, which was first to report the news.\nThe U.N. General Assembly in New York this week comes as the debate around AI safety and regulation has reached a boiling point following warnings from researchers about the dire risks to humanity.\nPresident Donald Trump, who has repeatedly dismissed the warnings as a \"hoax\" and \"scam\" over the past week, addressed the assembly on Tuesday and pledged to \"encourage\" the nascent technology, despite calls from Amodei and Altman to pace the development of advanced models.\n\"I'm not going to stifle growth of something that will be bigger than the industrial revolution,\" Trump said. \"Many say bigger than the industrial revolution or the internet itself.\"\nOpenAI's disclosure in July that its AI models broke out of a testing environment and autonomously hacked into open-source developer platform Hugging Face set off a wave of concerns about the rise of advanced models and how much they can be contained.\nSince then, Anthropic has also disclosed cyber incidents with its models, and OpenAI has revealed further \"concerning model behavior\" by autonomous agents. Last week, Google said that its Gemini model hacked into three other companies.\n—CNBC's Jim Forkin contributed to this article.",

    "title": "New EU industry rules would damage UK, warns Burnham",
    "titleJa": "New EU industry rules would damage UK, warns Burnham",
    "summaryJa": "The prime minister says he will raise his concerns when he meets the European Commission President later.",
    "bodyOriginal": "New EU industry rules would damage UK, warns Burnham\n- Published\nAndy Burnham has warned that planned EU rules to help European manufacturers would damage the UK, ahead of a meeting later with European Commission President Ursula von der Leyen.\nThe proposals aim to protect EU industry from Chinese competitors by giving companies inside the bloc priority for public contracts and subsidies.\nThe prime minister said he was concerned about how British industry and supply chains could be affected, and would raise the subject with von der Leyen when he meets her during a UN summit in New York.\nSpeaking on the flight to the US, Burnham also declined to rule out committing to rejoining the EU in Labour's next manifesto, saying it was an issue \"for another day\".\nHe said his immediate priority was to rebuild the relationship with the EU and reach an agreement that would boost the British economy.\nThe Made In Europe scheme - formally called the Industrial Accelerator Act (IAA) - is yet to be finalised, but the EU's car industry has called for the UK to be included to prevent disruption to its supply chains.\nTensions over the proposed scheme have reportedly further delayed this year's planned EU-UK summit, which had already been postponed in the wake of Sir Keir Starmer's resignation as prime minister in July.\nBurnham said: \"We have considerable support among the member states for the position we are taking, because Europe's argument is not with us.\n\"We both suffer the same effects as other countries, particularly steel and the issue it raises for the steel industry in Europe and in Britain.\n\"We are making the argument 'we are not your enemies here… we are not the problem'. Made in Europe is dealing with a different problem.\n\"We are making the argument that 'let's avoid collateral damage'.\"\nBurnham expects to find 'common ground' with Trump in first meeting\n- Published10 hours ago\nWatch: What to expect from the UN General Assembly\n- Published12 hours ago\nTen years on, Brexit's economic impact is becoming clearer\n- Published14 September\nBurnham told reporters his own speech to the UN General Assembly later would reflect on the decade since the Brexit vote and the \"turbulence comes when outside actors seek to manipulate, to distort facts, influence the British democratic process\".\n\"Going into the next decade, we need to be clear-eyed about that and become stronger and more on the front foot about challenging that,\" he said.\nAsked if he would rule out making a pledge to rejoin the EU at the next general election, Burnham said: \"Our focus at the moment is on a UK-EU summit which we hope will take place later this year.\n\"My immediate priority is to build on the good work that Keir [Starmer] did in rebuilding bridges, because those bridges were broken in the early part of this decade.\"\nHe added: \"What we have got to do is now go to the next level in terms of reaching practical agreement that will further boost the British economy, and those issues are the substance of the summit alongside EU requests around youth mobility.\"\nHe said questions about rejoining the EU were for \"another day\".\nSpeaking at the Liberal Democrat conference in Brighton on Monday, the EU's new ambassador to the UK was asked whether the UK could rejoin the EU or be granted associate membership.\nJukka Salovaara said: \"The doors are open but it's very much up to the UK public to identify and decide on its level of ambition when it comes to deepening cooperation with the EU.\"\nLast September, Burnham said he would like to see the UK back in the EU in his lifetime.\nEarlier this year, he said Brexit had been \"damaging\" but \"the last thing we should do right now is re-run those arguments\".\nThe EU has recently suggested Canada could become the bloc's first \"associate member\".\nAsked if this could be an option for the UK, Burnham said: \"The European Union made it clear that that wasn't open to us.\"\nAdditional reporting by Brian Wheeler\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",
