    "bodyOriginal": "Almost 1,000 arrested as clashes follow another day of mass protests across France\n- Published\nNearly 1,000 arrests were made as hundreds of thousands of people took part in another day of protests across France which were followed by some clashes late on Saturday, officials have said.\nAfter a day of largely peaceful demonstrations, police fired tear gas and water cannon to disperse protesters in a number of cities including Paris, while barricades were set alight in Marseille and people ripped boards from a shop in Bordeaux.\nBut officials have so far managed to avoid rioting and looting on the scale seen last weekend, which resulted in some of the worst scenes of disorder in France's modern history.\nThe interior ministry said an estimated 410,000 people protested on Saturday, while the unions put the number at about 800,000.\nSome 70,000 police officers were deployed and restrictions imposed in several cities to prevent the latest protests over the cost of living and poor school conditions from descending into the kind of chaos which saw officers outnumbered, hundreds of businesses looted and buildings torched.\nPresident Emmanuel Macron had decreed earlier this week that only demonstrations organised by a recognised trade unions would be permitted. Hundreds of people have been jailed for vandalism, arson and looting after fast-track court hearings in recent days.\nClashes between protesters and riot police in Paris erupted at the end of a peaceful march from the city's Porte d'Italie towards Porte de Vincennes on Saturday, where the police operation included an elite unit that usually deals with organised crime and counter-terrorism.\nSome protesters were seen erecting makeshift barricades and pelting officers with projectiles, while police baton-charged groups of masked youths who were smashing the windows of a car dealership.\nFrench Interior Minister Laurent Nuñez said that \"several thousand radical activists gathered at the rear of the march, including around 500 individuals identified as rioters\", the AFP news agency reported.\nIn the southern port of Marseille, rubbish bins were set ablaze and metal sheets used to block streets. A law enforcement vehicle was seen driving through a burning barricade in France's second-largest city.\nMeanwhile, some protesters in dark clothing and face coverings were seen taking boards off a building to build a street barricade in the southern city of Bordeaux.\nIn Lyon, police used tear gas grenades to disperse a crowd which had reportedly gathered in an area deemed off-limits by the local prefecture.\n\"There were around 150 of us, mostly secondary school and university students. Then the tear gas came almost immediately. You could barely see anything in the street,\" said one protester in France's third-largest city.\nNuñez said late in the day that nearly 1,000 people had been arrested, a number he said would increase.\nThe minister also said two people had been \"seriously injured\": one in the south-western city of Toulouse, and another one in Clermont-Ferrand, central France.\nEarlier, a peaceful protester in Paris who gave her name as Zelie told the BBC people had taken to the streets because they were \"really frustrated\" and had been \"suffering a lot\" since Macron came to office.\n\"They keep us quiet. They take our money, they tax us a lot and we can't say anything. Today we are in the streets because it's been too long, it's been too much,\" the 26-year-old said.\nTwo masked teenage protesters, who did not want to give their names, also said their generation was in despair and felt abandoned by the government.\n\"I think looting is really not good,\" one of the demonstrators said of last Saturday's disorder. \"But it's because of poverty and the violence of the police.\"\nHe added that the protests would end \"when we have a response to our demands. We really want a change in France\".\nMeanwhile, some 13,000 people joined a rally against the hard-right National Rally party in the north-central city of Orléans which proceeded peacefully.\nMass protests triggered by similar issues as in France also rocked several other European cities on Saturday.\nIn Barcelona, more than 100 people were arrested after a student protest descended into what local authorities described as \"gratuitous violence\".\nIn Albania's capital Tirana, riot police fired tear gas to disperse thousands of anti-government demonstrators, while clashes were also reported in Belgium's capital Brussels.\nIn Milan, northern Italy, a major security operation including hundreds of soldiers alongside police prevented protesters gathering in the city. Many had feared a repeat of violent scenes last week when some started fires, smashed windows and looted shops.\nAround 550,000 people took part in last weekend's demonstrations against rising fuel prices and the cost of living, with frustrations escalating after weeks of student protests. The chaos which followed resulted in more than 2,500 arrests.\nMarches were initially largely peaceful but became marred by scenes of violence, looting and destruction, with more than 2,000 shops and other businesses across France said to have been directly impacted. The damage was estimated \"at hundreds of millions euros\", France's Chambers of Commerce and Industry (CCI) said.\nOne demonstrator's hand was blown off by a police crowd-control grenade, according to the AFP news agency, while about 1,000 police officers were injured.\nThe French authorities later said they were forced to impose overnight curfews in Paris and other cities.\nThe continuing protests come ahead of France's presidential elections in six months' time, and leading contenders have levelled the blame at Macron and his ministers.",

    "id": "rosebank-life-on-the-oil-field-at-the-ce-dea9f335",
    "title": "Rosebank: Life on the oil field at the centre of a political storm",
    "titleJa": "Rosebank: Life on the oil field at the centre of a political storm",
    "summaryJa": "Scotland editor James Cook finds out what life is like on board a ship in an untapped oil field awaiting its fate.",
    "bodyOriginal": "Rosebank: Life on the oil field at the centre of a political storm\n- Published\nWhen we landed by helicopter at Rosebank, this oil field was at the centre of a political storm - and set to be in the path of a real one.\nWe arrived on Wednesday morning, just a few hours after the UK government had granted consent for the production of gas from the Jackdaw field in the North Sea.\nBut already attention was shifting to this wild and windy patch of the North Atlantic – the next big decision for Energy Secretary Miatta Fahnbulleh.\nRosebank is bigger than Jackdaw, it would generate higher greenhouse gas emissions, and it could be far more lucrative for its owners, Adura and Ithaca.\nThis summer, along with a camera crew, I travelled to Jackdaw, 150 miles east of Aberdeen.\nNow we were the first journalists to visit Rosebank.\nWe came here - days before Storm Boelo arrived with strong winds and heavy rain - to scrutinise a controversial project which is at the heart of a national debate about climate change, energy policy and the economy.\nBut we also hoped for a rare glimpse into life offshore.\n\"It's good fun, it's interesting, every day can change,\" said Nicola Boyd, who runs the helideck, and greeted us as we struggled out of our lifejackets and survival suits.\nBoyd has worked offshore for nearly a decade, including a year on Rosebank - where she spends two weeks at a time followed by three weeks' leave.\n\"It's a job I love,\" she added.\nIt's also a job that calls for steady legs and a strong stomach.\nUnlike the fixed Jackdaw platform, this installation – 80 miles north west of Shetland – is a large ship, a floating production, storage and offloading vessel (FPSO) named the Petrojarl Rosebank.\nIt's been chartered by the field's owners from Aberdeen-based Altera and, during my 48 hours on board, it was constantly but gently rolling on the North Atlantic swell.\nThose conditions may be misleading.\nWith the understatement typical of an Orkney islander, lead mechanical technician Ewan Leonard told me the winter weather could be \"a bit of a challenge.\"\n\"Last week we had a 30m heave coming through,\" he said, referring to the swell, \"so we'll probably suffer more of that as the winter goes on.\"\nAltera CEO Chris Brett told me that in the industry the environment west of Shetland is considered \"as harsh as you get anywhere in the world.\"\nWhatever your view on that industry, the sheer scale of what humans have achieved in such conditions is impressive.\nThe deep reserves of skill, ingenuity and engineering prowess among the 122 people on board are obvious.\nThe jobs are well-paid and, according to Ewan Leonard, the facilities are excellent.\n\"We have single-man cabins, there's good gym facilities, there's a lot of rec rooms here.\"\nDouglas Hogge, a production supervisor in charge of a team responsible for the safe extraction of oil and gas, agrees.\n\"There's the gym, the sauna,\" he said, adding \"you can obviously go and get some fresh air. There's plenty of fresh air out there.\"\nThere's even a cinema.\n\"As you've seen yourself, the food is fantastic on board, so no complaints.\" added Leonard.\nEveryone we spoke to agreed with that, praising the talented chefs who sent out all sorts of delicious dishes, from braised ox cheek to mackerel to pork loin, day and night.\nAs dusk gathers and the nightshift get ready for work with a strange breakfast of fillet steak and chocolate brownie pudding, the vessel begins to glow in the gloom.\nIt is a strange sight, the decks criss-crossed by a bewilderingly complex array of pipes, valves and bright yellow steelwork.\nThe ship doesn't move far, rotating around a fixed central point called the turret to face into the weather, making life a little easier for those on board.\nIf production is approved, oil and gas will be pumped up through the turret from wells in the field below, which contains an estimated 300m to 500m barrels, enough for perhaps 25 years.\n\"For myself and a lot of the guys, that would see us out to retirement,\" said Douglas Hogge.\n\"We need to see this approved,\" he added.\nEnvironmental campaigners strongly disagree. They've been trying to stop Rosebank for years, with some success.\n\"The future of the energy sector in the UK is renewable energy,\" said Tessa Khan, executive director of the campaigning group Uplift.\nConsent for production at Rosebank was first granted under the Conservative government in 2023.\nBut in 2025, after a challenge by Greenpeace and Uplift, the Court of Session in Edinburgh ruled the approvals of the UK's largest known untapped oil field and Jackdaw were unlawful because they had failed to take into account the climate impact of actually burning the fossil fuels in cars, homes and factories.\nThe judge, Lord Ericht, said the fields' developers could carry on with work short of producing oil and gas while they provided more detailed environmental assessments for the government and regulators to consider.\n\"We think Rosebank would be a disastrous decision and a terrible deal for ordinary people across this country,\" said Khan, urging prime minister Andy Burnham to prioritise renewables in his quest to re-industrialise the nation.\n\"If the government's interested in building investor confidence, giving the green light to a major new oil field is going to do the opposite,\" she argued.\nWhatever happens with Rosebank and Jackdaw, the long-term trend for the industry is clear and it is one of decline.\nIt's a quarter of a century since oil production peaked and in recent years jobs in oil and gas have been disappearing much faster than they're being created in renewable energy such as wind and solar power.\nThe timeline of Jackdaw and Rosebank\nThe oil from Rosebank would be loaded onto tankers via a gigantic hose and nozzle, which looks like the super-sized pump of an enormous floating filling station.\nFrom there it would be sold on the international market and, most likely, taken to continental Europe for refining.\nOpponents say that proves the project is of little benefit to the UK and should be rejected.\nSupporters argue that's not the case because UK and European energy markets are co-dependent, adding that Rosebank will generate millions in tax for the Treasury.\nNeil McCulloch, chief executive of Adura – which owns 80% of Rosebank and is a joint venture between Shell and the Norwegian state energy firm, Equinor – is optimistic.\nHe points out that Rosebank contains not just oil but gas which would be piped to Shetland and on to the St Fergus terminal in Aberdeenshire, with the potential to heat 500,000 British homes at peak production.\nApproval of this project, argues McCulloch, could pave the way for four more Jackdaw-sized gas developments in the waters west of Shetland – Tornado, Tornado East, Tobermory and Suilven.\n\"We would like to proceed with them,\" he said.\nA surge in fossil fuel production if Rosebank is approved is exactly what campaigners fear.\nIt would, argues Tessa Khan, exacerbate the deadly and damaging impact of climate change for British teachers, nurses, firefighters and families worried about their children while making \"huge profits for companies that are already incredibly profitable\".\nWhen it comes to the impending UK government decision – which sources have told BBC News should come before Christmas – there is a strange mood at Rosebank.\nThe decision in favour of Jackdaw has clearly encouraged many on board but it has also highlighted the jeopardy they are facing.\nFor now, most workers we spoke to said they were just focusing on the job, with its strange rhythms and unusual restrictions – no ability to pop to the shops, no alcohol, a lot of special occasions missed.\nAnd for some on board, very particular cravings.\nFor steward Liam Davidson, it is a desire to see his French bulldog, Bailey, at the end of his fortnight on board.\n\"My wee dog's at the heliport when I arrive,\" he said, \"I do miss her.\"\nFor Nicola Boyd, it's her double bed and a pizza delivery.\n\"I love seeing the family, but for me, it's the pizza,\" she told me.\nBut this time there might be a delay in delivering Boyd herself.\nShe is coming to the end of her fortnight but, as she helped us into our survival suits, the Met Office issued an amber weather warning for much of Scotland.\nFor Rosebank, it seems, there are stormy seas ahead, one way or the another.\nRelated topics\n- Published2 days ago",

    "id": "after-spacex-restores-high-speed-service-f220935e",
    "title": "After SpaceX restores high-speed service, Musk claims Ukraine violated Starlink agreement",
    "titleJa": "After SpaceX restores high-speed service, Musk claims Ukraine violated Starlink agreement",
    "summaryJa": "Ukraine says restrictions on Starlink and Starshield have been lifted, restoring connectivity to fast-moving military systems after disruptions.",
    "bodyOriginal": "SpaceX CEO Elon Musk on Saturday said the company restricted Ukraine's access to its high-speed technology because Kyiv violated Starlink's terms of service.\nIn a post on X, Musk said: \"Ukraine military violated Starlink terms of service and used it for offensive drone strikes to kill people. That loophole was closed last week.\"\nHe added: \"SpaceX has done more to defend Ukraine than any private company on Earth BY FAR.\"\nUkraine officials said earlier in the day that SpaceX's Starlink and Starshield satellite communication systems had restored high-speed service, a day after they said the service remained throttled. Ukrainian official said the service disruption left the country vulnerable to Russian attacks.\n\"The monitoring systems of the Ministry of Defense of Ukraine officially record the restoration of the speed of Starlink/Starshield,\" it said in a statement. \"The connection remains stable [while equipment is moving] at speeds over 400 km/h (249 miles per hour).\"\n\"Previously, monitoring systems recorded limitations in the operation of Starlink/Starshield. Now the speed indicators have been restored,\" the ministry added.\nStarlink is SpaceX's broader commercial satellite internet network, while Starshield is the company's government operations built on Starlink technology.\nBefore Musk's announcement, confusion lingered over who ordered the high-speed service restrictions, with Musk initially claiming in a social media post the U.S. government was responsible, while President Donald Trump had said he had no knowledge of it.\nOn Saturday, speaking to White House reporters in Florida, Trump confirmed a Wall Street Journal report this week that said he had asked Musk to ease the restrictions: \"I have spoken to Elon Musk.\"\nSpaceX did not immediately respond to CNBC's request for comment.\nSince Oct. 14, Ukrainian officials have accused SpaceX of undermining the country's ability to defend itself by imposing speed limits on Starshield, the military-grade offering of its Starlink satellite internet service. Officials said any drone traveling above 100 mph lost its connection, disrupting some missions.\nUkraine's Starshield terminals continued to experience problems on Friday, said Dmitri Alperovitch, chairman of the Silverado Policy Accelerator, a Washington, D.C., think tank focused on energy, defense tech and global trade.\n'Things have become harder'\nUkrainian President Volodymyr Zelenskyy said in a Friday post on X that the restrictions on Starlink and Starshield \"are still there,\" and added, \"The speed has not been restored.\" He noted that the country is also waiting for the U.S. to deliver missile interceptors \"that were already agreed on.\"\n\"Things have become harder — partly because of the Starlink and Starshield policies and speed limits,\" Zelenskyy wrote. \"But our frontline is still holding and I am proud of how strong our people are.\"\nUkraine's Ministry of Defense said it continues to monitor the systems' operations.\n\"This result is, above all, important for our front, for the military, the work of drones, logistics, and communications,\" Defense Minister Yevgeny Khmara said in the statement.\nLawmakers in the U.S. from both parties have called for a formal probe into Musk and SpaceX over alleged unilateral changes the company made to its services in Ukraine.",
    "bodyJa": "SpaceX CEO Elon Musk on Saturday said the company restricted Ukraine's access to its high-speed technology because Kyiv violated Starlink's terms of service.\nIn a post on X, Musk said: \"Ukraine military violated Starlink terms of service and used it for offensive drone strikes to kill people. That loophole was closed last week.\"\nHe added: \"SpaceX has done more to defend Ukraine than any private company on Earth BY FAR.\"\nUkraine officials said earlier in the day that SpaceX's Starlink and Starshield satellite communication systems had restored high-speed service, a day after they said the service remained throttled. Ukrainian official said the service disruption left the country vulnerable to Russian attacks.\n\"The monitoring systems of the Ministry of Defense of Ukraine officially record the restoration of the speed of Starlink/Starshield,\" it said in a statement. \"The connection remains stable [while equipment is moving] at speeds over 400 km/h (249 miles per hour).\"\n\"Previously, monitoring systems recorded limitations in the operation of Starlink/Starshield. Now the speed indicators have been restored,\" the ministry added.\nStarlink is SpaceX's broader commercial satellite internet network, while Starshield is the company's government operations built on Starlink technology.\nBefore Musk's announcement, confusion lingered over who ordered the high-speed service restrictions, with Musk initially claiming in a social media post the U.S. government was responsible, while President Donald Trump had said he had no knowledge of it.\nOn Saturday, speaking to White House reporters in Florida, Trump confirmed a Wall Street Journal report this week that said he had asked Musk to ease the restrictions: \"I have spoken to Elon Musk.\"\nSpaceX did not immediately respond to CNBC's request for comment.\nSince Oct. 14, Ukrainian officials have accused SpaceX of undermining the country's ability to defend itself by imposing speed limits on Starshield, the military-grade offering of its Starlink satellite internet service. Officials said any drone traveling above 100 mph lost its connection, disrupting some missions.\nUkraine's Starshield terminals continued to experience problems on Friday, said Dmitri Alperovitch, chairman of the Silverado Policy Accelerator, a Washington, D.C., think tank focused on energy, defense tech and global trade.\n'Things have become harder'\nUkrainian President Volodymyr Zelenskyy said in a Friday post on X that the restrictions on Starlink and Starshield \"are still there,\" and added, \"The speed has not been restored.\" He noted that the country is also waiting for the U.S. to deliver missile interceptors \"that were already agreed on.\"\n\"Things have become harder — partly because of the Starlink and Starshield policies and speed limits,\" Zelenskyy wrote. \"But our frontline is still holding and I am proud of how strong our people are.\"\nUkraine's Ministry of Defense said it continues to monitor the systems' operations.\n\"This result is, above all, important for our front, for the military, the work of drones, logistics, and communications,\" Defense Minister Yevgeny Khmara said in the statement.\nLawmakers in the U.S. from both parties have called for a formal probe into Musk and SpaceX over alleged unilateral changes the company made to its services in Ukraine.",

    "titleJa": "Democrats, voting-rights groups challenge Trump's bid to block Alaska Senate certification",
    "summaryJa": "Lawsuits filed by candidate Mary Peltola and a voters' rights group challenge Trump's preemptive efforts to block a Democratic Senate victory in Alaska.",
    "bodyOriginal": "Democratic groups and voting-rights advocates are seeking to join a federal lawsuit to stop the Justice Department's effort to prevent Alaska from certifying its U.S. Senate election results if Republican Sen. Dan Sullivan loses.\nThe requests come from Alaskans for Mary, the campaign for Democratic Senate candidate Mary Peltola, the Democratic Party's Senate campaign committee, and a separate group including the League of Women Voters of Alaska, Common Cause and two individual voters.\nTogether, the groups argue that the executive branch lacks legal authority to intervene in state-run elections and is attempting an unprecedented override of state election administration with early voting already underway.\nIn court filings submitted Friday, the groups contend that the litigation — which President Donald Trump confirmed he personally ordered — seeks an extraordinary remedy: an investigation into whether voters who selected another candidate named Daniel J. Sullivan actually intended to vote for the incumbent senator.\nTrump told reporters on Friday that he directed the Justice Department to file the lawsuit: \"I'm the one that said 'do it.'\"\nThe move drew swift bipartisan backlash, including from Alaska's Republican Senator Lisa Murkowski, who said on social media, \"The Department of Justice should never have filed this lawsuit.\"\nTwo Sullivans\nThe legal battle centers on Daniel J. Sullivan, a non-incumbent challenger sharing a near-identical name with incumbent GOP Senator Daniel S. Sullivan. Alaska election officials initially removed the challenger from the ballot after a complaint from the state Republican Party, but state courts ordered his inclusion on the ballot.\nIn June, the Alaska Supreme Court affirmed that decision and directed election officials to clearly distinguish the two men.\nThe ballot now lists Sen. Sullivan as the \"incumbent\" and Republican, while the other Sullivan has no party registration.\nThe Justice Department filed its lawsuit on Oct. 22, seeking an order to prevent Alaska from certifying the Senate election if the incumbent loses.\nThe proposed intervenors say the department's approach would force Alaska voters to choose between electing the president's preferred candidate and risking the state being barred from certifying its election results.\nPeltola's campaign and the Democratic Senatorial Campaign Committee argue that the lawsuit directly threatens their interests because it could prevent Peltola from taking office even if she wins the election under Alaska's ranked-choice system.\nThey also question whether Alaska state officials will mount a sufficiently vigorous defense, given that the state's Division of Elections previously tried to exclude Daniel J. Sullivan from the ballot before a state court overturned the move.\nThe DSCC and Alaskans for Mary are asking the court to grant them defendant-intervenor status so they can formally file motions to dismiss the lawsuit.\nSevere hazards\nThe Democrats argue that while the DOJ has cited the National Voter Registration Act as the legal basis for its lawsuit, the statute contains no provision authorizing the federal government to dictate candidate eligibility or ballot layout, which are state matters under the Constitution.\nLegal experts have echoed those concerns, noting that relying on the NVRA's general preamble language to halt state election certification lacks precedent.\nThe League of Women Voters of Alaska and Common Cause filed separately, warning that the DOJ's demand to investigate voter intent presents severe constitutional hazards.\nThe filings note that the DOJ has offered no mechanism to determine whether voters who selected Daniel J. Sullivan intended to vote for the incumbent.\nBlocking certification, the groups argue, would disenfranchise Alaskans by denying them representation and injecting chaos into the election outcome.\nBoth organizations are asking the court for permission to join the case as defendants. The Democratic groups say they intend to seek dismissal if the court grants their motion.",

its lawsuit on Oct. 22, seeking an order to prevent Alaska from certifying the Senate election if the incumbent loses.\nThe proposed intervenors say the department's approach would force Alaska voters to choose between electing the president's preferred candidate and risking the state being barred from certifying its election results.\nPeltola's campaign and the Democratic Senatorial Campaign Committee argue that the lawsuit directly threatens their interests because it could prevent Peltola from taking office even if she wins the election under Alaska's ranked-choice system.\nThey also question whether Alaska state officials will mount a sufficiently vigorous defense, given that the state's Division of Elections previously tried to exclude Daniel J. Sullivan from the ballot before a state court overturned the move.\nThe DSCC and Alaskans for Mary are asking the court to grant them defendant-intervenor status so they can formally file motions to dismiss the lawsuit.\nSevere hazards\nThe Democrats argue that while the DOJ has cited the National Voter Registration Act as the legal basis for its lawsuit, the statute contains no provision authorizing the federal government to dictate candidate eligibility or ballot layout, which are state matters under the Constitution.\nLegal experts have echoed those concerns, noting that relying on the NVRA's general preamble language to halt state election certification lacks precedent.\nThe League of Women Voters of Alaska and Common Cause filed separately, warning that the DOJ's demand to investigate voter intent presents severe constitutional hazards.\nThe filings note that the DOJ has offered no mechanism to determine whether voters who selected Daniel J. Sullivan intended to vote for the incumbent.\nBlocking certification, the groups argue, would disenfranchise Alaskans by denying them representation and injecting chaos into the election outcome.\nBoth organizations are asking the court for permission to join the case as defendants. The Democratic groups say they intend to seek dismissal if the court grants their motion.",

    "id": "biotech-stocks-are-surging-how-investors-77eb71d3",
    "title": "Biotech stocks are surging. How investors can play the new drug innovation boom",
    "titleJa": "Biotech stocks are surging. How investors can play the new drug innovation boom",
    "summaryJa": "Biotech stocks are rallying as clinical wins, M&amp;A and new drug technologies revive the sector. Here are the ETFs and stocks analysts favor.",
    "bodyOriginal": "Moderna gave investors a scare as its stock plunged on Thursday. But it's still one of the hottest biotechs this year. And it's hardly alone – the sector is on a roll and looks poised for more gains.\nThe iShares Biotechnology ETF (IBB) is up 24% through October 23, building on a 28% gain in 2025. Two dozen of the ETF's 233 holdings have more than doubled year-to-date. Moderna leads the pack with a 587% surge — even after an 18% decline following a leak of clinical data for its cancer vaccine (which was actually positive).\nAnalysts say a new biotech cycle is underway, fueled by clinical trial results, M&A activity, and promising technologies such as genomics, mRNA — and AI.\n\"We're in the midst of a powerful innovation cycle,\" said John Hall, portfolio manager of the T. Rowe Price Biotechnology ETF. \"What's super exciting is we're seeing newer modalities start to make it to market.\" Companies \"understand the disease biology better,\" he adds, and that could ultimately lead to more novel drugs making it to market.\nInvestors are excited about technologies like mRNA and genomics, along with a steady stream of new drug approvals. The FDA approved about a dozen novel biologic drugs in 2025, out of 46 approvals in total. Roughly 66 novel drugs are in the pipeline for FDA approval, including potential blockbusters like Moderna and Merck's cancer drug for melanoma, and a next-generation obesity drug from Eli Lilly.\nAnalysts say AI could also lead to more approvals as companies deploy the software to speed up drug development.\n\"Biotech is a phenomenal application for artificial intelligence and machine learning,\" says Piper Sandler analyst Ted Tenthoff. \"You can set up exciting predictive models that, frankly, can do things that we've never been able to do in the space in terms of novel drug discovery.\"\nGranted, the industry is recovering from a fallow period. The sector's last strong performance was during the Covid era when ultra-low interest rates encouraged investment in early-stage drug developers, and mRNA vaccines fueled a revenue surge for companies like Moderna, Pfizer and Biontech.\nThe sector then went cold as many early-stage companies fizzled. Demand for Covid vaccines evaporated, and surging interest rates put a chill in IPOs and M&A.\nThe risks haven't evaporated – this is still a sector whose products take years to develop, resulting in far more failures than successes. But analysts say the outlook is healthier now. While that's reflected in strong performance and richer valuations, there's still good reason to invest.\nInnovating is paying off\nRecent clinical trial results are stoking excitement that novel drugs in the works could tackle some of the toughest problems in medicine.\nModerna and Merck's melanoma drug, for instance, uses mRNA to trigger an immune response in patients, targeting tumors that have been surgically removed and genetically analyzed. It's not a preventive vaccine, but it uses a similar immunology mechanism and showed a 42% reduction in cancer recurrence or death (used in conjunction with Merck's cancer drug Keytruda).\nWhile the Phase 3 results disappointed Wall Street, oncologists say the outcomes were still highly positive. And they see the technology as a potential game changer, ushering in an era of personalized treatments for cancers. Moderna and Merck have said they aim to submit the drug for FDA approval and get it launched in 2027.\nInflammation treatment is another promising area. AstraZeneca and Amgen recently released positive Phase 3 results for another use for their drug Tezspire, an injectable approved for nasal polyps and asthma. In clinical trials, it showed that it successfully relieved swallowing symptoms and healed microscopic and visual tissue damage in patients with severe throat inflammation.\nRoche, meanwhile, notched a win after the FDA approved its drug Enspryng, a therapy to treat rare inflammatory and autoimmune diseases. It became the first and only at-home injection for adults with thyroid eye disease.\nObesity drugs are also advancing beyond the first generation of GLP-1s. Eli Lilly's retatrutide, a \"triple agonist\" targeting three different hormone receptors, cleared two more clinical trials over the summer. The drug produced 28%-30% weight loss at the highest doses in the study, Lilly said. The company plans to submit the drug for FDA approval in the first quarter of 2027.\nHigh-tech tools and M&A\nMuch of the innovation isn't just happening in drug-making – it's also in areas like gene sequencing, mRNA, and high-tech instruments.\nIllumina has more than doubled this year. The DNA and gene sequencing company is seeing accelerating demand for its NovaSeq X high-end sequencing platform. Pharmaceutical companies including Bristol-Myers Squibb, Merck and Kura are working with Illumina to develop precision oncology solutions.\nAnother big winner is 10x Genomics, up more than 300%. The biotech firm offers its lab instruments to help scientists research cancer, immunology and neuroscience. The company's Atera platform is helping produce data sets to train AI models, a process that helps accelerate personalized therapies.\nOn the AI front, companies are using the technology for more efficient drug discovery, says Shreefāl Mehta, president of Guidant BioTherapeutics. Using AI, \"you can now bring a drug to clinical trials with less capital. More investment is also going into companies that are demonstrating that,\" he said.\nGlobal AI in drug discovery will grow from a $20 billion market in 2025 to more than $160 billion by 2035, according to forecasts by Towards Health, a research and consulting firm.\nOne other catalyst for the sector could be M&A. Dealmaking for biopharma hit $134 billion in the first half of 2026, up from $112 billion for all of 2025, notes Jeet Mukherjee, biotech analyst at BTIG. That's a positive signal, indicating more drugs in development are showing clinical promise.\nIt also helps that Big Pharma has a \"patent cliff\" ahead. Products representing $180 billion of revenue will lose exclusivity by 2030, according to research firm RTW Institute. Companies with looming expiries \"are looking for novel products and innovative products to put into their pipeline,\" Mehta says.\nGLP-1 blockbusters have also left some companies flush with cash for acquisitions. Eli Lilly alone has completed 10 acquisition deals in 2026 worth $25 billion.\nWhere to invest in biotech now\nETFs can capture the investing theme, though they aren't all alike. The iShares Biotech ETF is one of the lower cost funds. It tracks a market-cap weighted index of biotech stocks, led by companies like Gilead Sciences, Amgen, Vertex Pharmaceuticals, and Moderna.\nThe State Street SPDR S&P Biotech ETF holds stocks in equal weight, offering more exposure to small- and mid-cap names. Its top holdings are Moderna, Natera, Twist Bioscience and Halozyme Therapeutics.\nPiper Sandler calls Illumina and 10x Genomics the \"primary infrastructure plays\" in the life science arena, saying their technologies are \"driving the next generation of precision medicine.\"\nPiper analyst David Westenberg has a buy rating and $305 target on Illumina, implying 14% gains from recent prices around $267. He has a hold rating on 10X with an $80 target, above recent prices around $70.\nTwist Bioscience is another name to consider. The company makes customized synthetic DNA and sells DNA sequencing tools. Twist has partnered with Eli Lilly's AI and machine-learning platform and linked up with Anthropic in August to start testing its AI model, Claude, for protein development.\nTwist isn't expected to turn an EPS profit until 2029, according to consensus forecasts. But revenue is expected to go from $572 million in 2027 to $833 million in 2029. Analysts have an average target of $168 on the stock, implying 21% returns from recent prices around $138.\nIn the small-cap space, Piper Sandler's Tenthoff likes Monte Rosa Therapeutics, a pioneer in protein degradation that selectively destroys disease-causing proteins.\nThe firm has partnered with Novartis to develop a drug for inflammatory conditions and autoimmune diseases. The companies announced a Phase 2 clinical study in September for an autoimmune disease treatment, which has been \"triggering milestones to Monte Rosa,\" Tenthoff said.\nTenthoff has a buy rating and $37 target on the stock, which recently traded around $10.70.\nAlso in the small-cap arena, BTIG's Mukherjee recommends Faeth Therapeutics.\nThe biotech is developing a novel two-drug regimen to treat breast cancer and other tumors. The regimen \"has the potential to address safety and dosing limitations of another recently approved drug for breast cancer,\" he says. And it could become \"a mainstay of the future breast cancer treatment paradigm and other cancers.\"\nFaeth is a clinical-stage company that has yet to bring a drug to market. Yet the stock is up 93% year-to-date on positive clinical trial results, trading around $18. Mukherjee has a $55 target on it.\nKymera Therapeutics is worth considering too. The company is developing an oral version of the blockbuster drug Dupixent (made and co-developed by Regeneron Pharmaceuticals and Sanofi). Dupixent is an injectable, however, and oral agents \"are frequently preferred by patients,\" Mukherjee says. \"The drug has the potential to not only take share from patients taking Dupixent for numerous immunological diseases but also expanding the market to those not taking systemic biologic drugs,\" he tells CNBC.\nKymera has said it doesn't expect a patent fight over Dupixent because its drug is distinct, not a biosimilar or biologic copy.\nT. Rowe's Hall also likes Kymera for its potential \"to unlock disease targets that have been classically considered un-druggable.\" The stock is the second largest holding in T. Rowe's Biotech ETF, accounting for 4.2% of the portfolio.",

    "titleJa": "Palestinian families displaced as Israeli forces demolish Hebron homes",
    "summaryJa": "The crackdown follows the killing of two Israeli soldiers by two Palestinian gunmen on Friday - and comes just days ahead of Israel's election.",
    "bodyOriginal": "Palestinian families displaced as Israeli forces demolish Hebron homes\n- Published\nThe Israeli military has launched a sweeping crackdown in the occupied West Bank, demolishing homes and businesses in the city of Hebron and displacing hundreds of families, according to local officials.\nFootage shared online showed destruction caused by Israeli bulldozers, with at least one whole street appearing to have been flattened. The military has also cordoned off the city, heavily restricting the movement of its 200,000 residents.\nThe operation was announced by Prime Minister Benjamin Netanyahu on Friday, in response to the killing of two Israeli soldiers by two Palestinian gunmen in an attack on a checkpoint. Three other Israeli soldiers were injured, and the gunmen were also killed.\nNetanyahu said on Friday that buildings around the site of the attack and the neighbourhoods that the two gunmen were from would be \"destroyed\".\nHebron's Mayor Youssef al-Jaabari said more than 1,000 people had been displaced by the operation, which centred on the Ein Deir Baha and Farsh al-Hawa neighbourhoods, and targeted homes, businesses, industrial sites and infrastructure.\nHe said dozens of families had been forced to spend the night outside, with some told to leave without taking their vehicles, while homes were marked for demolition with spray paint.\nHe added that he believed the military planned to displace a total of 2,500 people from about 0.35 sq km of urban land. The city's governor and deputy mayor meanwhile said at least 200 families had been displaced.\nThe Israel Defense Forces (IDF) did not respond immediately to the BBC's request for comment. It said in a statement on social media that it had dozens of targets across the West Bank and that its operations would last for several days.\n1 of 3\nIt is common practice for Israeli forces to demolish the homes of Palestinians who are suspected of carrying out attacks on Israelis in the West Bank - a practice Israeli rights groups have criticised as collective punishment.\nNetanyahu likened the operation to previous operations in Palestinian refugee camps in the north of the territory, when the Israeli military demolished hundreds of homes and displaced tens of thousands in 2025.\nFriday's shooting came during a tense time for the region, with Israel's general election taking place in four days' time.\nNetanyahu - who has built his campaign on the promise of security - cancelled his party's campaign events for Friday morning and headed to Hebron, wearing protective armour and posting a video on social media from the scene.\n\"We will evacuate the residents, go house to house, remove the weapons we find there, and deal with and destroy all terrorist infrastructure,\" he said.\nHe also announced he had reviewed plans for the largest military operation in the West Bank since 1967 - though did not say when it could be carried out. It is not clear whether the ongoing Hebron operation forms part of that.\nIn an interview with Israel's i24 television channel released on Saturday, he threatened \"a very big surprise\" for the Palestinian Authority (PA), which governs parts of the territory.\nIn a statement, the PA called for \"urgent international action that went beyond condemnation\" to prevent further forced displacement.\nMeanwhile, his far-right Finance Minister Bezalel Smotrich called for Israel to launch a campaign in the West Bank \"exactly like in Gaza or Lebanon,\" while far-right National Security Minister Itamar Ben Gvir called for Israel to dismantle the PA.\nSpeaking to journalists, Hebron's mayor said the operation was \"driven by the elections,\" and that Netanyahu and his ministers were attempting to secure the votes of the far-right and the settlers.\n- Published2 days ago\n- Published2 days ago",

    "title": "British woman dies after trying to rescue sons swept away at sea in the Bahamas",
    "titleJa": "British woman dies after trying to rescue sons swept away at sea in the Bahamas",
    "summaryJa": "Nathan Gregory says the loss of childhood sweetheart Leanne \"is unimaginable for our family\".",
    "bodyOriginal": "Mum who died trying to save sons was hero, husband says\n- Published\nThe husband of a British woman who died rescuing their sons when they were swept away to sea in the Bahamas says she was a \"hero... in life and in death\".\nLeanne Gregory, from Stapleford in Nottinghamshire, had been snorkelling with her family when the boys were swept away by a strong current, police said.\nAlthough the children were rescued from the water off the island of Bimini on Tuesday, their mother was unable to be saved, the Royal Bahamas Police Force said.\nNathan Gregory said the loss of his 36-year-old \"childhood sweetheart\" was \"unimaginable for our family\".\n'Absolute hero'\n\"She was the purest, most amazing wife, mother and friend to have ever walked this Earth,\" her husband said in a Facebook post.\n\"I will never get over this, she was my soulmate, my childhood sweetheart, my one and only. The foundation of my entire family and the strength that held us all together.\n\"My boys had to witness something nobody should ever have to see of any age, but they know Mum died an absolute hero.\"\nGregory said he had also set up a fundraising page \"for my sons and security after the tragic loss\".\nIn the post on that page he described how his wife, who he had been with for 22 years, had held on to their son until he was rescued \"but didn't have the energy to save herself\".\nHe added: \"I just have to be thankful for the hero she was in life and in death, and totally grateful for the fact my boys got out safely.\"\nIn a statement posted on social media, the Royal Bahamas Police Force said officers received reports shortly after 10:00 local time on Tuesday that a woman had been found unresponsive at the North Bimini Ferry Dock.\nIt added after she was swept away, she was brought to the ferry dock where CPR was given.\nMrs Gregory was then taken to a local medical clinic but was confirmed dead there, the police force said.\nIt said an autopsy would be conducted but \"foul play is not suspected\".\nA spokesperson for the Foreign Office added: \"Our thoughts are with the family of a British woman who has died in the Bahamas.\n\"We are in contact with the local authorities and providing support to her family.\"\nGet in touch\nTell us which stories we should cover in Nottingham\nListen to BBC Radio Nottingham on Sounds and follow BBC Nottingham on Facebook, external, on X, external, or on Instagram, external. Send your story ideas to eastmidsnews@bbc.co.uk, external or via WhatsApp, external on 0808 100 2210.",

    "id": "why-popular-airplanes-are-getting-scrapp-658b15a1",
    "title": "Why popular airplanes are getting scrapped years early",
    "titleJa": "Why popular airplanes are getting scrapped years early",
    "summaryJa": "Airplanes are getting dismantled for parts years ahead of schedule because engines and other components are in short supply.",
    "bodyOriginal": "GOODYEAR, Ariz. — An Airbus A320neo, one of the world's most popular planes, rolled off the Mobile, Alabama, factory line in July 2022, painted bright yellow for its next destination: Spirit Airlines.\nIt was built to fly for decades. But this May, less than four years later, it was stripped for parts worth millions and crushed, the steel teeth of an excavator tearing through its fuselage at a facility on the outskirts of Phoenix.\nMore aircraft are getting dismantled years, if not decades, earlier than expected, industry executives told CNBC. It is the result of a shortage of parts, none more precious and expensive than aircraft engines, that has exasperated airlines and driven up costs for years.\nEven after the engines are removed, firms are looking for parts as varied as landing gear and antennae to sell.\n\"It's the first time in my career that involved purchasing an aircraft that's less than five years since date of manufacture,\" said Bill Thompson, vice president who leads aircraft and engine acquisition for the Americas at aviation asset management and trading firm EirTrade Aviation, which bought the less than 4-year-old Airbus A320neo earlier this year.\nHe said the company paid \"single-digit\" millions each for that airplane and a similarly aged one, and it expects to make a profit from selling the more than 1,000 parts it took off them before they were crushed.\n\"I don't know if you're going to sell the coffee makers but you never know. Sometimes you do,\" he said.\n'Don't fall in love with the metal'\nTwenty-one newest-generation aircraft were torn down from June 2025 through this past August, according to aviation data and advisory firm IBA Group. The scrapped planes were 6.4 years old on average, and included mostly Airbus but also some Boeing planes. That compares with an average retirement age for narrow-body airplanes of 21.7 years, IBA said.\n\"Anytime that you end up with any period of market softness in aircraft availability, engine availability, it's going to cause investors to look at other options,\" said Simon Goodson, CEO of AerFin, a company that buys, sells, repairs and leases aircraft and parts. \"We always say to our aircraft and engine traders, 'Please don't fall in love with the metal.'\"\nHundreds of aircraft are retired each year as manufacturers ramp up production for airlines, so older planes are swapped out for newer, more fuel-efficient models.\nBut aside from retiring aging planes, some owners don't want to wait around for replacement parts or repairs on younger jets.\n\"A year might not sound that long, but does three or four years?\" said Dave Querio, CEO of Ascent Aviation Services, a company that repairs, modifies, stores and disassembles aircraft, based in Marana, Arizona, outside of Tucson. \"That's the issue for the aircraft that came in in '23, '24 and '25.\"\nIn some cases, owners can reap more for the parts than they can selling the plane or paying storage costs and waiting for it to get back in the air again.\nQuerio said he hasn't seen \"the volume of younger aircraft being torn down as I'm seeing today.\"\nHot engine market\nA major reason for the young retirements is the long wait and rising prices for jet engines.\nOne problem is that cutting-edge engines that burn hotter and use less fuel are coming up for maintenance far earlier than airlines expected.\nThe maintenance requests have kept engine repair and overhaul facilities backed up, from those owned by manufacturing giants GE Aerospace and RTX unit Pratt & Whitney to smaller, independent ones. Airlines and leasing firms have been hunting for spare parts and engines anywhere they can find them, like here in Goodyear, Arizona.\nThe trend has added more fuel to the already hot secondhand parts market. An engine fan blade could cost $50,000 or even more than $100,000 for bigger jets, Goodson said. Engines that power some Airbus A320neo aircraft have 20 of those blades. A disc for the engine, meanwhile, could cost between $1 million and $2 million.\nAn engine recall because of a manufacturing defect has backed up repair shops and grounded hundreds of Airbus planes around the world. Spirit Airlines bore the brunt of that problem in the United States, years before the airline collapsed.\nThe engine is made by Pratt & Whitney, which issued the recall in 2023 after discovering contaminated powdered metal used in making some parts. Those engines are worth close to $17 million this year at the high end, up 60% from the upper end of the range in 2019, according to IBA.\nAirlines are removing some engines off retired planes to keep current aircraft flying while they wait for engines to come back from the shop.\n\"So you're just playing Legos and moving engines on and off aircraft,\" said Mike Stengel, a partner at AeroDynamic Advisory, an aerospace consulting firm.\nThe problems are driving up the cost to buy or rent one of the popular engines to record levels.\nRenting one is ranging from about $160,000 to $180,000 a month, according to IBA data. A competing engine for the A320neo family made by CFM International, a joint venture of GE Aerospace and France's Safran, is far from a bargain, renting in a similar range of $130,000 to $180,000 a month.\nSpirit Airlines' ghost planes\nThe problems with young retirements predate Spirit's collapse.\nThe 4-year-old Airbus plane that was torn down outside Phoenix in May is a key example. The aircraft was put in storage because of the engine recall, and it stayed until it was torn apart.\nBut the company's demise has brought more of its Airbus fleet to the market, forcing owners to figure out if it's worth the wait for engines or other parts.\nCNBC visited AerSale's facility in Goodyear on a scorching day in late June, less than two months after Spirit collapsed, where dozens of the idle yellow planes were stored. It was so soon after the airline's demise that a former Detroit-based Spirit captain, Glenn Zecchin, popped in and asked about opportunities to ferry Spirit's aircraft to the desert, and to peek in on his former airline's planes.\n\"I knew the airplanes were there, and I wanted to see what happened,\" said Zecchin, who is now flying corporate jets.\nA jet parked at the storage facility and maintenance hangar still had Spirit in-flight menus and safety cards in the bungee cord seatbacks. Pilot manuals were still in the cockpit.\nNot all of these aircraft will be destroyed. Some companies that owned Spirit's planes before bankruptcy will just sell their parts, but some may keep the planes in storage. Other aircraft may go on to fly for other airlines, with potential carriers ripping out Spirit's tight 28-inch seat pitch for something roomier.\nBut as long as they're not flying, it means paying storage fees, which vary by aircraft type. Some planes in desert facilities — selected because the arid climate can preserve the aircraft better and avoid corrosion — can sit for decades.\nOthers won't make it back into the air if there's enough demand for the parts and too long of a wait to get the plane flying again.\n\"After you get rid of all the valuable equipment and sell it back into the aftermarket, what's really left is just a metal carcass that you will literally take a crane and crush,\" said AeroDynamic's Stengel. Then the owner can \"sell it to recyclers that will make of it what they will, maybe into beer cans or something outside of aerospace.\"\nAscent's Querio said some owners opt to take that route.\n\"It's a little melancholy to watch it at times,\" he said. \"But sometimes, it's kind of a thrill to ... see how fast an aircraft can be crunched up and sent off to the smelter.\"\n— CNBC's Erin Black contributed to this report.",

    "summaryJa": "Retail investors trying to beat the market by buying individual stocks and complex exchange-traded funds may be better off with broad market index funds.",
    "bodyOriginal": "Retail investors who are trying to beat the market by buying individual stocks and complex exchange-traded funds may be better off with broad market index funds, according to Elm Wealth's Victor Haghani.\n\"I'm not sure that investors are that much more sophisticated than they were 30 years ago,\" the firm's founder and chief investment officer told CNBC's \"ETF Edge\" this week. \"We still are human beings and we're subject to certain kinds of biases — particularly extrapolation bias where whatever has happened recently in the past we tend to believe that it's going to continue into the future.\"\nHaghani, who was a founding partner at hedge fund Long-Term Capital Management, emphasizes cost-effective investment strategies as a priority at his current firm.\n\"It's an environment that continues to be tough for individual non-professionals to generate alpha,\" he said. \"[Retail investors are] just very well served by having some exposure to broader index funds overall.\"\nAccording to Haghani, access to elaborate strategies doesn't necessarily provide advantages.\n\"Whether it's Citadel or Jane Street or Hudson River Trading, they're just minting money every single day. So, it's an opportunity-rich environment — if you happen to have a billion dollars to spend on tech each year,\" he said. \"If you're a retail investor sitting at home and trying to find opportunities, you have to realize that probably on the other side of your trades is [Citadel CEO] Ken Griffin or whoever, and it's probably not going to end all that well.\"\n'More choice is ultimately a good thing'\nHowever, RBC Capital Markets' Valerie Grimba sees sophisticated funds playing a strategic role in retail investors' portfolios.\n\"More choice is ultimately a good thing,\" the firm's director of global ETF strategy said in the same interview.\nShe said funds holding 10 to 15 stocks can help investors participate in specific investment themes without having to identify their eventual biggest winner, while derivative-based products can be used to generate income in various ways.\nBut Grimba also emphasized that investors need to understand the holdings and trade-offs of the strategies they choose.\n\"It's more important than ever for an individual investor to understand what they're buying,\" she said. \"You should be able to explain to your friend what it is in the ETF and what you're buying.\"",

    "title": "Amgen says drug combo cuts risk of death by 58% in patients with aggressive lung cancer",
    "titleJa": "Amgen says drug combo cuts risk of death by 58% in patients with aggressive lung cancer",
    "summaryJa": "A drug from Amgen could give patients with an aggressive form of lung cancer significantly more time to live when added to an immunotherapy from AstraZeneca.",
    "bodyOriginal": "A drug from Amgen could give patients with a notoriously aggressive form of lung cancer significantly more time to live when added to an immunotherapy from AstraZeneca, a study found.\nFull results from a late-stage trial released Saturday show that adding Amgen's immunotherapy Imdelltra to AstraZeneca's Imfinzi drug slashed the risk of death by 58% in patients with extensive-stage small cell lung cancer, a fast-growing disease that has spread beyond the lung where it began.\nThe drug combination extended their median overall survival to 21.1 months compared with 12.7 months with AstraZeneca's drug alone, the trial found.\nThat means half of patients in the group that took the combination regimen were alive for at least roughly 21 months. The trial tested the combo as a maintenance therapy in patients who received initial treatment with Imfinzi and chemotherapy, and whose cancer had not progressed.\n\"I think there are moments in medicine when you see a piece of data that is so profound that it's going to transform the standard of care for patients, and I think, honestly, we're at that moment,\" said Dr. Paul Burton, Amgen's chief medical officer, in an interview.\nThe combination \"has the potential to take on one of the most aggressive cancers that we deal with today, and almost convert it into a chronic disease,\" he said, adding that \"these data say that's a possibility.\"\nThe results also suggest a greater commercial opportunity for Imdelltra, which posted $288 million in sales during the second quarter, up 115% year over year. The drug already generated $627 million in global sales in 2025 and appears to be on its way to becoming a blockbuster medicine, or hitting the $1 billion sales threshold.\nSmall cell lung cancer remains difficult to treat because, even if chemotherapy initially works well for most patients, the disease often returns or progresses within months, said lead trial investigator Dr. Jacob Sands, who is the associate chief of the Lowe Center for Thoracic Oncology at Dana-Farber Cancer Institute.\nHe said immunotherapy has helped a small subset of patients achieve years of disease control, but most have not experienced similarly durable benefits, highlighting the need for better treatments. There are roughly 31,000 new small cell lung cancer cases in the U.S. each year, and an estimated 60% to 70% of those people are diagnosed with extensive-stage disease.\nSands said the benefits in the trial were seen across subgroups of patients, including those whose cancer spread to the brain or liver. Disease that has spread to those organs is associated with poorer treatment outcomes.\nHe added that with longer-term follow-up data on the patients, the 21-month figure \"may evolve further and hopefully will substantially improve,\" similar to what Amgen saw in a Phase 1 trial on the immunotherapy combination. In that early-stage trial on a smaller number of patients, a long-term follow-up showed the benefit was sustained for years.\nUsing Imdelltra earlier\nAmgen said the findings also suggest that using Imdelltra earlier in a patient's treatment could meaningfully alter the trajectory of the disease. Imdelltra is currently approved for patients whose small cell lung cancer has progressed while they are on, or after, platinum-based chemotherapy.\nResearchers specifically tested whether adding Imdelltra could help patients live longer than continuing Imfinzi alone, which is already approved as a first treatment for this type of lung cancer. Amgen said nearly 80% of patients who started taking both drugs were alive at one year compared with 53% receiving Imfinzi alone.\nImdelltra's \"big impact\" on controlling the disease and ultimately how long people live highlights the importance of including it in first-line maintenance treatment, Sands said. That refers to ongoing therapy given after an initial heavy treatment, such as chemotherapy or surgery.\nBurton added that it positions Amgen's drug to be an \"indispensable backbone therapy\" for small cell lung cancer, regardless of the other immunotherapy that can be paired with it.\nImdelltra binds to DLL3, a protein on cancer cells, and CD3, a protein on T cells, which are a type of immune cell that can kill cancer. By binding to both, Imdelltra brings T cells into close contact with tumor cells, helping the immune system destroy the cancer.\nImfinzi, made by AstraZeneca, is an immunotherapy that blocks a protein called PD-L1, which cancer cells use to evade the immune system. The drugs work together in complementary ways: Imfinzi helps remove the brakes on the immune response, while Imdelltra brings T cells directly to cancer cells and helps activate them to attack the tumor.\nThe study, which was presented at a major cancer meeting called the European Society for Medical Oncology Congress, did not test whether the combination was better than other first-line treatment approaches.\nStill, the findings suggest Amgen's drug could be another option offered to small cell lung cancer patients earlier in their treatment. Kate Brenan, a 44-year-old mother of two from Denver, sees that as a win on its own.\nShe was diagnosed with extensive-stage small cell lung cancer in early January 2024. Brenan underwent six rounds of a common combination chemotherapy, followed by chest radiation and later whole-brain radiation after the cancer spread.\nIn September 2024, she started Imdelltra and has had no evidence of disease ever since.\n\"I think that it's remarkable how quickly things are changing in the world of small cancer treatment options,\" Brenan told CNBC, adding that Imdelltra potentially becoming an earlier treatment option \"can only be a good thing for the patients moving forward, and I'm really excited about that.\"",

    "id": "ukraine-says-starlink-connection-now-sta-fbfc9c6b",
    "title": "Ukraine says Starlink connection 'now stable' after network limits",
    "titleJa": "Ukraine says Starlink connection 'now stable' after network limits",
    "summaryJa": "The slowed Starlink connections had affected the Ukraine's military and drone operations for a week.",
    "bodyOriginal": "Ukraine says Starlink connection 'now stable' after network limits\n- Published\nUkraine now has a \"stable connection\" to Starlink, its defence minister has said, after its military suffered days of restricted connectivity on the satellite internet network.\nKyiv relies on the Starlink and its military-grade counterpart Starshield for piloting drones and operations within Ukraine, but last week accused US President Donald Trump of telling owner Elon Musk to place limits on it.\nThis meant drones would lose connection when travelling at 161km/h (100mph) or more, it said. Trump denied doing so before saying Musk had \"put it back\".\nDefence Minister Yevhenii Khmara said that speeds of more than 400km/h were now possible on the network, indicating that full capability had been restored.\n\"This result is above all important for our front, for our soldiers, for the operation of drones, for logistics and for communications,\" he said in a statement on Saturday.\nUkraine's military uses the network of 10,000 low Earth orbit satellites extensively for military operations, particularly in remote areas on the battlefield.\nUkraine uses both the civilian service Starlink and the more secure Starshield, which Musk said was controlled by the US military when he suggested the Pentagon could be behind the recent issues.\nRussia is not authorised to use Starlink, so when Ukraine sends long-range missiles or drones deep into Russia to hit oil refineries, the network does not work.\nThe debacle over Starlink began last week, and emerged during a broader diplomatic row between Trump and his Ukrainian counterpart Volodymyr Zelensky over Ukrainian strikes on Russian oil infrastructure.\nFaced with midterm elections next month, Trump has waived some sanctions on Russia and agreed a deal to import Russian diesel for the US market - a move criticised by Ukraine and its European allies.\nTrump said the strikes on Russian oil refineries, which Kyiv says are crucial to stemming the main revenue source for Moscow's war effort, have pushed global prices higher.\nWhile the attacks have had an impact on global fuel prices, rises seen this year have primarily been due to the Iran war.\nZelensky said that, as well as seemingly limiting Starlink capability in Ukraine, the US had also threatened to withdraw intelligence sharing if the strikes did not stop, something Trump also denied.\nMeanwhile, fighting on the ground continues.\nRussia's ministry of defence wrote on Telegram on Saturday that their air defences shot down 616 Ukrainian fixed-wing drones, striking a number of regions across the country, including Russian-annexed Crimea.\nSergey Aksyonov, the region's Moscow-backed governor, said restrictions on electricity and water had been put in place because of power cuts caused by the drone strike.\nMeanwhile, Ukrainian authorities said they struck a missile component manufacturer, a chemical plant and an aircraft at a military airfield inside Russia in the past 24 hours.\nThey also said that Russia carried out 88 air strikes using 309 glide bombs and 10,270 kamikaze drones on Friday.\nRelated topics\n- Published15 October",
    "bodyJa": "Ukraine says Starlink connection 'now stable' after network limits\n- Published\nUkraine now has a \"stable connection\" to Starlink, its defence minister has said, after its military suffered days of restricted connectivity on the satellite internet network.\nKyiv relies on the Starlink and its military-grade counterpart Starshield for piloting drones and operations within Ukraine, but last week accused US President Donald Trump of telling owner Elon Musk to place limits on it.\nThis meant drones would lose connection when travelling at 161km/h (100mph) or more, it said. Trump denied doing so before saying Musk had \"put it back\".\nDefence Minister Yevhenii Khmara said that speeds of more than 400km/h were now possible on the network, indicating that full capability had been restored.\n\"This result is above all important for our front, for our soldiers, for the operation of drones, for logistics and for communications,\" he said in a statement on Saturday.\nUkraine's military uses the network of 10,000 low Earth orbit satellites extensively for military operations, particularly in remote areas on the battlefield.\nUkraine uses both the civilian service Starlink and the more secure Starshield, which Musk said was controlled by the US military when he suggested the Pentagon could be behind the recent issues.\nRussia is not authorised to use Starlink, so when Ukraine sends long-range missiles or drones deep into Russia to hit oil refineries, the network does not work.\nThe debacle over Starlink began last week, and emerged during a broader diplomatic row between Trump and his Ukrainian counterpart Volodymyr Zelensky over Ukrainian strikes on Russian oil infrastructure.\nFaced with midterm elections next month, Trump has waived some sanctions on Russia and agreed a deal to import Russian diesel for the US market - a move criticised by Ukraine and its European allies.\nTrump said the strikes on Russian oil refineries, which Kyiv says are crucial to stemming the main revenue source for Moscow's war effort, have pushed global prices higher.\nWhile the attacks have had an impact on global fuel prices, rises seen this year have primarily been due to the Iran war.\nZelensky said that, as well as seemingly limiting Starlink capability in Ukraine, the US had also threatened to withdraw intelligence sharing if the strikes did not stop, something Trump also denied.\nMeanwhile, fighting on the ground continues.\nRussia's ministry of defence wrote on Telegram on Saturday that their air defences shot down 616 Ukrainian fixed-wing drones, striking a number of regions across the country, including Russian-annexed Crimea.\nSergey Aksyonov, the region's Moscow-backed governor, said restrictions on electricity and water had been put in place because of power cuts caused by the drone strike.\nMeanwhile, Ukrainian authorities said they struck a missile component manufacturer, a chemical plant and an aircraft at a military airfield inside Russia in the past 24 hours.\nThey also said that Russia carried out 88 air strikes using 309 glide bombs and 10,270 kamikaze drones on Friday.\nRelated topics\n- Published15 October",
