    "summaryJa": "中東の地政学的な緊張とAIブームの持続可能性への懸念の中で、株式市場は引き続きボラティリティーとの闘いが続いている。この不確実性を考慮すると、安定した収入を求める投資家は、高配当株をポートフォリオに追加することができます。ウォール街のトップアナリストの推奨事項を追跡することは、投資家が適切な配当銘柄を選択するのに役立ちます。これらの専門家は、企業の財務状況と配当を安定的に支払う能力を詳細に分析した後に格付けを割り当てるからです。",
    "bodyOriginal": "The stock market continues to grapple with volatility amid geopolitical tensions in the Middle East and concerns about the sustainability of the AI boom. Given this uncertainty, investors looking for steady income can add dividend-paying stocks to their portfolios.\nTracking the recommendations of top Wall Street analysts can help investors pick the right dividend stocks, as these experts assign their ratings after an in-depth analysis of a company's financials and ability to pay dividends consistently.\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\nPhillips 66\nDownstream energy company Phillips 66 (PSX) is this week's first dividend pick. With a quarterly dividend $1.27 per share (annualized dividend of $5.08), PSX offers a yield of 2.25%. The company recently reported solid Q2 earnings, as the Middle East conflict affected global supplies and drove up refining margins.\nFollowing the Q2 print, TD Cowen analyst Jason Gabelman reiterated a buy rating on Phillips 66 and raised his price target to $255 from $240, reflecting higher 2026 earnings expectations and lower interest expense next year.\nGabelman highlighted the quarter-over-quarter reduction in Phillips 66's net debt, noting management's optimism at achieving its estimated $15.5 billion net debt target one year ahead of schedule. The 5-star analyst expects the company to end 2026 with a net debt of $14.6 billion.\n\"The [balance sheet] improvement could re-establish PSX as a go-to defensive refiner,\" said Gabelman.\nManagement agreed that PSX's payout ratio lagged year-to-date, but expects buybacks to increase in the second half. Gabelman said Phillps indicated the possibility of a larger dividend hike following an annual increase of 5% over the past two years.\nGabelman ranks No. 554 among more than 12,400 analysts tracked by TipRanks. His ratings have been profitable 66% of the time, delivering an average return of 14.9%. See Phillips 66 Statistics on TipRanks.\nCrescent Energy\nCrescent Energy (CRGY) is an exploration and production company with activities focused in the Eagle Ford, Permian and Uinta Basins. Earlier this month, the company reported better-than-expected Q2 earnings and announced a quarterly dividend of $0.12 per share, payable on August 31. At an annualized dividend of $0.48 per share, CRGY boasts a dividend yield of about 4%.\nIn reaction to Q2 results, Evercore analyst Stephen Richardson reaffirmed a buy rating on Crescent Energy stock with a price target of $18. He noted continued strength in the company's performance, with second-quarter oil production and cash flow surpassing the Street's expectations.\n\"CRGY's cash flow exceeded expectations by 10%, reinforcing its trajectory of capital efficiency,\" said Richardson.\nThe 5-star analyst highlighted that Crescent raised its full-year oil production guidance, citing the effective integration of the Vital Energy acquisition. Specifically, Crescent tripled its synergy target from the Vital Energy deal to as much as $300 million, significantly reducing the effective purchase price. This reflects Crescent's solid execution following the acquisition, Richardson said.\nAdditionally, the analyst noted that Crescent's capital spending is and heading toward the lower end of management's prior guidance, indicating disciplined financial controls.\nRichardson ranks No. 579 among more than 12,400 analysts tracked by TipRanks. His ratings have been successful 65% of the time, delivering an average return of 12.5%. See Crescent Energy Ownership Structure on TipRanks.\nViper Energy\nFinally, Viper Energy (VNOM) is effectively controlled by Diamondback Energy. Viper owns and acquires mineral and royalty interests in oil-weighted basins, mainly the Permian in West Texas. Viper recently announced its Q2 2026 results and declared a 32% hike in its base dividend, effective in the third quarter of 2026. The new base dividend indicates a 4.5% annualized yield.\nViper also removed its quarterly commitment to return at least 75% of cash available for distribution. The company believes that this move will ensure increased flexibility to make opportunistic share repurchases and pursue accretive mergers and acquisitions.\nFollowing the Q2 results, TD Cowen analyst Aaron Bilkoski reiterated a buy rating on Viper, slightly raising his price target to $59 from $58. Bilkoski said Viper's solid Q2 performance supports his view that the strength in oil prices and rising operator activity are driving higher production.\n\"Viper has delivered, and we forecast will continue to deliver, one of the highest production per share growth profiles in our royalty universe\" through the end of 2027, said Bilkoski. He believes Viper deserves a premium valuation, given its above-average growth.\nThe 5-star analyst said that while the biggest surprise in the quarter was Viper's revision to its shareholder return framework, he doesn't believe that the move indicates a significant change to its underlying strategy. Under the new framework, a larger portion of excess free cash flow is expected to be allocated to share repurchases than to variable dividends, Bilkoski said.\nBilkoski ranks No. 719 among more than 12,400 analysts tracked by TipRanks. His ratings have been profitable 57% of the time, delivering an average return of 12%. See Viper Energy Financials on TipRanks.",
    "bodyJa": "中東の地政学的な緊張とAIブームの持続可能性への懸念の中で、株式市場は引き続きボラティリティーとの闘いが続いている。この不確実性を考慮すると、安定した収入を求める投資家は、高配当株をポートフォリオに追加することができます。\nウォール街のトップアナリストの推奨事項を追跡することは、投資家が適切な配当銘柄を選択するのに役立ちます。これらの専門家は、企業の財務状況と配当を安定的に支払う能力を詳細に分析した後に格付けを割り当てるからです。\n過去のパフォーマンスに基づいてアナリストをランク付けするプラットフォームであるTipRanksが追跡した、ウォール街のトッププロによって注目されている高配当株3つを紹介します。\nフィリップス66\n今週の最初の配当候補は下流エネルギー会社フィリップス 66 (PSX) です。 PSX の四半期配当は 1 株あたり 1.27 ドル (年換算配当は 5.08 ドル) で、利回りは 2.25% です。中東紛争が世界的な供給に影響を及ぼし、精製マージンを押し上げたため、同社は最近第2四半期の堅調な収益を報告した。\n第2四半期の記事に続いて、TDコーウェンのアナリスト、ジェイソン・ゲーベルマン氏はフィリップス66の買い評価を繰り返し、2026年の収益予想の上昇と来年の支払利息の低下を反映して目標株価を240ドルから255ドルに引き上げた。\nガベルマン氏は、フィリップス66の純負債が前四半期比で減少していることを強調し、予定より1年前倒しして推定155億ドルの純負債目標を達成することに経営陣が楽観的であることを指摘した。五つ星アナリストは、同社が2026年末に純負債146億ドルを抱えると予想している。\n「（バランスシートの）改善により、PSXは頼りになるディフェンスのリファインナーとして再確立される可能性がある」とガベルマン氏は語った。\n経営陣は、PSXの配当性向が年初来で遅れていることに同意したが、下半期には自社株買いが増加すると予想している。ガベルマン氏は、過去２年間の年間５％増配に続き、フィリップスがさらに増配の可能性を示唆したと述べた。\nガベルマン氏は、TipRanks が追跡する 12,400 人以上のアナリストの中で 554 位にランクされています。彼の評価は 66% の確率で利益を上げており、平均リターンは 14.9% です。 TipRanks の Phillips 66 統計を参照してください。\nクレセントエネルギー\nCrescent Energy (CRGY) は、イーグルフォード、パーミアン、ウインタ盆地に重点を置いて活動を行う探査および生産会社です。今月初め、同社は予想を上回る第2四半期利益を報告し、8月31日に支払われる1株当たり0.12ドルの四半期配当を発表した。年換算配当金は1株当たり0.48ドルで、CRGYは約4％の配当利回りを誇る。\n第2四半期の結果を受けて、エバーコアのアナリスト、スティーブン・リチャードソン氏は、クレセント・エナジー株の目標株価を18ドルとして買いとの評価を再確認した。同氏は、第２四半期の石油生産とキャッシュフローがストリートの予想を上回っており、同社の業績が引き続き好調であると指摘した。\nリチャードソン氏は「ＣＲＧＹのキャッシュフローは予想を１０％上回り、資本効率の軌道を強化した」と述べた。\n五つ星アナリストは、バイタル・エナジー買収の効果的な統合を理由に、クレセントが通年の石油生産見通しを引き上げたことを強調した。具体的には、クレセントはバイタル・エナジーとの契約によるシナジー目標を3倍の最大3億ドルに引き上げ、実質的な買収価格を大幅に引き下げた。リチャードソン氏は、これは買収後のクレセントの堅実な実行を反映していると述べた。\nさらに、アナリストは、クレセントの設備投資が経営陣の以前のガイダンスの下限に向かっており、規律ある財務管理を示していると指摘した。\nリチャードソン氏は、TipRanks が追跡する 12,400 人以上のアナリストの中で 579 位にランクされています。彼の評価は 65% の確率で成功し、平均 12.5% のリターンをもたらしました。 TipRanks の Crescent Energy の所有構造を参照してください。\nバイパーエネルギー\n最後に、Viper Energy (VNOM) は、Diamondback Energy によって事実上管理されています。バイパーは、主にテキサス州西部のペルム紀の石油加重盆地の鉱物権益とロイヤルティ権益を所有し、取得しています。バイパーは最近、2026年第2四半期の決算を発表し、2026年の第3四半期から基本配当を32％引き上げることを宣言した。新しい基本配当は年率4.5％の利回りを示している。\nバイパーはまた、分配可能な現金の少なくとも75％を還元するという四半期ごとの約束も解除した。同社は、この動きにより、機会を捉えた自社株買いや、拡大的な合併・買収を推進するための柔軟性が確実に高まると考えています。\n第2四半期の決算を受けて、TDコーウェンのアナリスト、アーロン・ビルコスキー氏はバイパーの買い評価を繰り返し、目標株価を58ドルから59ドルに若干引き上げた。ビルコスキー氏は、バイパーの第2四半期堅調な業績は、原油価格の堅調とオペレーターの活動の活発化が増産を推進しているという同氏の見解を裏付けていると述べた。\nビルコスキー氏は、「バイパーは、2027年末まで当社ロイヤルティ分野で最も高い一株当たり生産高の成長プロファイルを実現しており、今後も実現し続けると予測している」と述べた。同氏は、平均を上回る成長を考えると、バイパーはプレミアム評価を受けるに値すると考えている。\n同５つ星のアナリストは、当四半期最大の驚きはバイパーの株主還元枠組みの改定だったが、この動きが同社の基本的な戦略の大幅な変更を示すものだとは考えていない、と述べた。新しい枠組みの下では、超過フリーキャッシュフローの大部分が変動配当よりも自社株買いに割り当てられるとビルコスキー氏は述べた。\nビルコスキー氏は、TipRanks が追跡する 12,400 人以上のアナリストの中で 719 位にランクされています。彼の評価は 57% の確率で利益を上げており、平均リターンは 12% です。 TipRanks で Viper Energy の財務状況をご覧ください。",

    "titleJa": "隠れたアウトパフォーム企業: 愛されていない株式市場に関する「神話」を払拭する",
    "summaryJa": "欧州株は歴史的に、米国株や一部の急成長するアジア市場が享受するような投資家の熱狂を呼び起こすのに苦労してきた。この大陸には高成長企業が少なく、資本市場が浅く、長期的な利益成長のストーリーに説得力がないと考えられている。しかし、2025 年初頭の政府の財政支出の急増により、市場は活気を取り戻しました。今年の話はより微妙だが、汎欧州のStoxx 600指数は驚くほど回復力があることが証明された。",
    "bodyOriginal": "European equities have historically struggled to ignite the kind of investor enthusiasm enjoyed by U.S. stocks and certain fast-growing Asian markets. The continent has fewer high-growth companies, shallower capital markets and is thought to have a less compelling long-term earnings growth story.\nA spike in governments' fiscal spending at the beginning of 2025, however, brought the market to life. This year, the story is more nuanced, but the pan-European Stoxx 600 index has proved remarkably resilient.\nEurope's headline index tracks 600 large, medium, and small capitalization companies across 17 European countries, and is essentially the continent's equivalent of the S&P 500. The Stoxx 600 is up 10% in 2026 so far, slightly behind its North American counterpart, which has returned 13.5% over the same period.\nEuropean markets tend to fly under the radar when compared with larger and more liquid U.S. markets, but Goldman Sachs last week attempted to dispel some of the \"myths\" about investing in Europe.\n\"Performance [in Europe] has been far more mixed than the market narrative, or most investors realize,\" the analysts wrote in a August 10 note. \"Since 2022, European banks have considerably outperformed the Magnificent 7. Since the start of 2025 — and despite both the tariff shock and an energy supply crisis, Europe's Stoxx has outperformed the S&P 500.\"\nAnother \"myth\" cited by Goldman is the notion that Chinese competition is a major headwind for Europe's companies.\n\"The stock market is not the economy and the largest sectors — financials, pharma, tech, energy, utilities, telecoms, aerospace and defense — are not especially vulnerable to low-cost China imports,\" Goldman added. \"Autos are just 1% of Europe's market cap.\"\nThe European autos sector has been much maligned, as the industry finds itself mired in a years-long structural crisis. Slowing demand for electric vehicles, lost market share to Chinese competitors and higher borrowing costs have created the perfect storm over the past five years, as sales volumes continue to slump well below pre-pandemic levels.\nThen, the Stoxx Autos index is down 16% year-to-date. Volkswagen AG and Stellantis are among the worst performers, falling 27.6% and 51.9%, respectively.\nDoes Europe need to embrace AI?\nBNP Paribas believes Europe is more likely to be an AI beneficiary rather than a developer, with the autos sector among those that stand to benefit.\n\"At this point the sector is so cheap that no one is really thinking about the potential upside in there,\" Sophie Huynh, portfolio manager and strategist at BNP Paribas Asset Management, told CNBC.\n\"It's about trying to understand when markets are going to start talking about this because you can sit on these deep value sectors for one or two years before the market consensus starts to realize it's going to work.\"\nHuynh added that a lot of good news about U.S. consumption is already priced in, \"so the momentum of the U.S. economy is slowing down when Europe has just started to pick up.\"\nGoldman acknowledged that Europe is behind on several fronts, including data center rollouts, as well as frontier modelling, \"all of which could have negatives for security or longer-term productivity and growth.\"\nBut the bank's strategists said that Europe being behind on the AI trade may not be such a bad thing.\nThe market provides a hedge for investors worried about some of the risks around AI, especially around China competition, they wrote.",
    "bodyJa": "欧州株は歴史的に、米国株や一部の急成長するアジア市場が享受するような投資家の熱狂を呼び起こすのに苦労してきた。この大陸には高成長企業が少なく、資本市場が浅く、長期的な利益成長のストーリーに説得力がないと考えられている。\nしかし、2025 年初頭の政府の財政支出の急増により、市場は活気を取り戻しました。今年の話はより微妙だが、汎欧州のStoxx 600指数は驚くほど回復力があることが証明された。\nヨーロッパのヘッドライン指数は、ヨーロッパ 17 か国の大​​中小資本企業 600 社を追跡しており、基本的に欧州大陸の S&P 500 に相当します。Stoxx 600 は 2026 年現在までに 10% 上昇しており、同期間に 13.5% のリターンを記録した北米の指数にわずかに遅れています。\n欧州市場は、規模が大きく流動性の高い米国市場と比較すると目立たない傾向にあるが、ゴールドマン・サックスは先週、欧州への投資に関する「神話」の一部を払拭しようと試みた。\nアナリストらは8月10日のメモで「（欧州の）業績は市場の物語、あるいは大半の投資家が認識しているよりもはるかにまちまちだった」と述べた。 「2022年以降、欧州の銀行はマグニフィセント7を大幅に上回るパフォーマンスを見せている。2025年の初め以降、関税ショックとエネルギー供給危機にもかかわらず、欧州のStoxxはS&P500をアウトパフォームしている。」\nゴールドマン氏が挙げたもう一つの「神話」は、中国の競争が欧州企業にとって大きな逆風となっているという考えだ。\n「株式市場は経済ではないし、金融、製薬、テクノロジー、エネルギー、公益事業、通信、航空宇宙、防衛といった最大のセクターは、低コストの中国からの輸入品に対して特に脆弱ではない」とゴールドマン氏は付け加えた。 「自動車は欧州の時価総額のわずか1％にすぎない。」\n欧州の自動車セクターは、長年にわたる構造的危機に陥っているため、非常に中傷されている。電気自動車の需要の鈍化、中国の競合他社への市場シェアの喪失、借入コストの上昇により、販売台数はパンデミック前の水準を大幅に下回って低迷し続けており、過去5年間に完全な嵐を引き起こした。\n次に、ストックス自動車指数は年初から16％下落しています。フォルクスワーゲンAGとステランティスは、それぞれ27.6％と51.9％下落し、最も業績が悪化した企業の一つとなった。\nヨーロッパは AI を受け入れる必要があるか?\nBNPパリバは、ヨーロッパは開発者ではなくAIの受益者となる可能性が高く、その恩恵を受けるのは自動車セクターであると考えている。\nBNPパリバ・アセット・マネジメントのポートフォリオマネジャー兼ストラテジスト、ソフィー・フイン氏はCNBCに対し、「現時点でこのセクターは非常に割安なので、そこに上値が生じる可能性については誰も真剣に考えていない」と語った。\n「市場がいつこの問題について議論し始めるかを理解しようとすることが重要だ。なぜなら、市場のコンセンサスがそれがうまくいくと認識し始めるまで、これらのディープバリューセクターに1〜2年間座ることができるからである。」\nフイン氏は、米国の消費に関する多くの良いニュースはすでに織り込まれており、「そのため、欧州が回復し始めたばかりのときに米国経済の勢いは鈍化しつつある」と付け加えた。\nゴールドマンは、欧州がデータセンターの展開やフロンティアモデリングなどのいくつかの面で遅れをとっており、「そのすべてがセキュリティや長期的な生産性と成長にマイナスとなる可能性がある」と認めた。\nしかし同行のストラテジストらは、欧州がAI貿易で遅れていることはそれほど悪いことではないかもしれないと述べた。\nAI、特に中国との競争に関するリスクを懸念する投資家にとって、市場はヘッジ手段となると彼らは書いている。",

    "titleJa": "私は大ヒットした新作ゲームで首相として 2 年間生き延びましたが、内閣は私を見捨てました。",
    "summaryJa": "モバイル ゲーム 第 10 位: Full Confidence は最近、英国の App Store 有料ゲーム チャートで Minecraft よりも上位にランクされました",
    "bodyOriginal": "I survived two years as prime minister in a hit new game - then my cabinet deserted me\n- Published\nA mobile game made by a developer in Manchester has recently beaten the global phenomenon Minecraft to top Apple's paid games chart.\nIts success is perhaps even more surprising given its subject matter - UK politics.\nNo 10: Full Confidence by Benjamin Brewis sees players take on the role of prime minister, making decisions through a wave of parliamentary scenarios and trying to remain in power for as long as possible.\nThe success of Brewis's app, and the creation of others like it, suggests the dramatic recent ebb and flow of Westminster may have inspired a popular new sub-genre.\nIn No 10: Full Confidence, external, players who take on the precarious position of prime minister must balance the moods of four factions - their cabinet, backbenchers, the media, and the public - to remain in the game. Decisions are made across more than 300 fictional political scenarios, handwritten by Brewis.\nThe storylines range from the mundane - dealing with GP appointment waiting times - to the absurd.\n\"I have a two or three-part storyline where a dog is let loose into the House of Lords by a lobbyist during a vet bill and that spirals out of control,\" Brewis said.\nEach scenario asks players to pick one action from three choices on the screen, with each potentially upsetting or pleasing the different factions.\nMuch like in real life, if one side completely turns against you your political career is finished.\nWhile some situations may sound farcical, Brewis said he had plenty of real life examples to draw on as inspiration.\n\"I'd remember that MP who had a spider that he'd threaten MPs with, or when Boris Johnson walked into a fridge. I'm frantically writing them all down.\"\nNot my finest hour\nMy first attempt at playing prime minister in No 10: Full Confidence hasn't left me considering a Westminster career.\nAs my chosen candidate, Verity Grimshaw, I start off strong, managing to survive a crisis in which thousands of A-level students receive the wrong grades.\nI only manage to stay in the post for one year and nine months, taken out - somewhat ironically given my actual job - by a complete lack of trust by the press.\nUnfortunately, a cabinet minister resigns and publishes a three-page-long letter that contains the phrase \"the PM was warned\" four times.\nThis letter being read out in full on BBC Radio 4 turns out to be the last straw for poor Verity.\nMy final choice in the game of \"respond directly, address every point, don't let it sit unanswered\", seemingly does not go down very well.\nBrewis says some users have fared a lot better than my sorry effort.\n\"Someone has stayed in for 1,885 months, which is 157 years,\" he says. \"I'm not sure if that's a democracy any more.\"\nBrewis said he was inspired to begin creating the app around December 2025, when \"it was all kicking off\" with former Prime Minister Sir Keir Starmer, and talk of potential challenges to his leadership was starting to grow.\n\"I remember thinking at the time, someone should just start taking the mick out of this,\" he said. \"We've had so many prime ministers - it's funny now.\"\nFive different people have occupied No 10 since 2016 - three in the space of just over three years, and one for just 49 days.\nDr Russell Foster, a lecturer in British and International Politics at King's College London, said the \"churn of prime ministers\" and growing presence of politics on social media could also help explain why Westminster is suddenly appearing on our devices.\nNo 10: Full Confidence is not the only game based around Westminster's wheeling and dealing.\nFantasy Parliament, external is a browser-based game designed by another UK-based developer, Evan Roberts, which lets players draft their own fantasy league of real-world MPs, scoring points based on their real-life media coverage.\nWith the strategy game's Policy Tester, players can even type in proposals to a ChatGPT-style AI model, which then replies in the style of how it believes different groups of voters - such as Coastal Keith or Graduate Gemma - would react.\nMeanwhile, UK Politics Simulator, \"built on real UK data down to ward level\", is reportedly due out later this year for PC, made by the Scarborough-based company Black Cannon Games.\nDespite the success of his own venture, currently ranking 5th in Apple's UK paid games charts - above Monopoly Go - Brewis said he does not know if any politicians have actually played his game.\nHowever, he has received some feedback on how accurately the game depicts UK political life, from his friends who work in the civil service.\n\"It's exactly like this,\" they told him, \"but worse.\"\nMore weekend picks\nGrand Theft Auto made him a legend. His latest game was a disaster\n- Published19 October 2025\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",
    "bodyJa": "私は大ヒットした新作ゲームで首相として 2 年間生き延びましたが、内閣は私を見捨てました。\n- 公開されました\nマンチェスターの開発者が作ったモバイル ゲームが最近、世界的な現象である Minecraft を破って Apple の有料ゲーム チャートのトップに立った。\n英国政治という主題を考えると、その成功はおそらくさらに驚くべきことである。\n第 10 位: ベンジャミン ブリューイスの「全幅の信頼」では、プレーヤーが首相の役割を引き受け、議会の一連のシナリオを通じて決定を下し、できるだけ長く権力の座に留まろうとします。\nBrewis のアプリの成功と、同様のアプリの作成は、最近のウェストミンスターの劇的な栄枯盛衰が、人気のある新しいサブジャンルにインスピレーションを与えた可能性があることを示唆しています。\nNo 10: Full Confidence では、首相という不安定な立場を引き受ける外部のプレイヤーは、ゲームに残るために、閣僚、バックベンチャー、メディア、国民の 4 つの派閥のムードのバランスをとらなければなりません。ブリューウィスが手書きした 300 以上の架空の政治シナリオに基づいて意思決定が行われます。\nストーリーは、一般医の予約の待ち時間に対処するというありふれたものから、不条理なものまで多岐にわたります。\n「獣医師法案の最中にロビイストによって貴族院に犬が放たれ、制御不能になるという2、3部構成のストーリーラインがある」とブリューウィス氏は語った。\n各シナリオでは、プレイヤーは画面上の 3 つの選択肢から 1 つのアクションを選択するよう求められ、それぞれのアクションが異なる派閥を動揺させたり喜ばせたりする可能性があります。\n実生活と同じように、一方の側が完全に敵に回れば、あなたの政治家としてのキャリアは終わります。\n状況によっては茶番に聞こえるかもしれないが、ブリューウィス氏はインスピレーションとして参考になる実例がたくさんあると語った。\n「クモを飼って国会議員を脅したあの国会議員のことや、ボリス・ジョンソンが冷蔵庫に入ったときのことを思い出します。私はそれらをすべて必死で書き留めています。」\n私の最高の時間ではない\n『No.10: Full Confidence』で初めて首相役に挑戦しましたが、ウェストミンスターでのキャリアを考えることはできませんでした。\n私が選んだ候補者、ベリティ グリムショーとして、私は好調なスタートを切り、何千人もの A レベルの生徒が間違った成績を受けるという危機をなんとか乗り切りました。\n私がそのポストに留まり続けられたのはわずか1年9カ月で、実際の仕事を考えると皮肉なことに、マスコミからの信頼が完全に欠如していたことが影響した。\n残念なことに、ある閣僚が辞任し、「首相は警告された」という文言を4回も含む3ページにわたる書簡を公表した。\nBBCラジオ4で全文読み上げられたこの手紙は、哀れなヴェリティにとって最後の藁となった。\n「直接応答し、すべての点に対処し、未回答のまま放置しない」というゲームにおける私の最終的な選択は、どうやらあまりうまくいかないようです。\nBrewis 氏は、一部のユーザーは私の残念な努力よりもはるかに良い結果をもたらしたと述べています。\n「1,885か月、つまり157年間も滞在した人がいます」と彼は言う。 「それが民主主義なのかどうかはもうわかりません。」\nブリューウィス氏は、2025年12月頃にアプリの作成を開始するきっかけとなったのは、キア・スターマー元首相との「すべてが始まった」頃であり、同氏のリーダーシップに対する潜在的な課題についての話が高まり始めていたと語った。\n「その時、誰かがこの事件からマイクを取り出すべきだと思ったのを覚えている」と彼は語った。 「これまでたくさんの首相が誕生してきたが、今となってはおかしな話だ」\n2016 年以来、5 人の異なる人物が 10 位を占めています。そのうち 3 人は 3 年あまりの間に、1 人はわずか 49 日間でした。\nキングス・カレッジ・ロンドンで英国・国際政治の講師を務めるラッセル・フォスター博士は、「首相の交代」とソーシャルメディア上での政治の存在感の増大も、なぜウェストミンスターが突然私たちのデバイスに表示されるのかを説明するのに役立つかもしれないと述べた。\nNo 10: Full Confidence は、ウェストミンスターのウィーリングとディーリングをベースにした唯一のゲームではありません。\n『Fantasy Parliament, external』は、英国を拠点とする別の開発者である Evan Roberts によって設計されたブラウザ ベースのゲームで、プレイヤーは現実世界の国会議員から成る独自のファンタジー リーグをドラフトし、現実のメディア報道に基づいてポイントを獲得できます。\nこの戦略ゲームの Policy Tester を使用すると、プレイヤーは ChatGPT スタイルの AI モデルに提案を入力することもでき、AI モデルはさまざまな有権者グループ (Coastal Keith や Graduate Gemma など) がどのように反応するかを考えるスタイルで返信します。\n一方、「区レベルまで英国の実際のデータに基づいて構築された」UK Politics Simulator は、スカーバラに本拠を置く企業 Black Cannon Games によって作られ、今年後半に PC 向けにリリースされる予定であると伝えられています。\nブリュース氏は自身の事業が成功し、現在アップルの英国有料ゲームチャートでモノポリーゴーを上回り第５位にランクされているにもかかわらず、実際に彼のゲームをプレイした政治家がいるかどうかは分からないと述べた。\nしかし、彼は公務員として働く友人たちから、このゲームがイギリスの政治生活をいかに正確に描いているかについてのフィードバックを受け取りました。\n「まさにこれと同じです」と彼らは彼に言いました。「しかし、さらに悪いことです。」\nその他の週末のおすすめ\nグランド・セフト・オートは彼を伝説にしました。彼の最新の試合は大惨事だった\n- 2025 年 10 月 19 日公開\nTech Decoded ニュースレターに登録して、世界のトップテクノロジーのストーリーやトレンドをフォローしてください。英国外ですか？ここからサインアップしてください。",

    "title": "Rescuers search for survivors of powerful Indonesia earthquake",
    "titleJa": "インドネシアの大地震で生存者を捜索する救助隊",
    "summaryJa": "インドネシアの大地震で生存者を捜索する救助隊- 公開されました",
    "bodyOriginal": "Rescuers search for survivors of powerful Indonesia earthquake\n- Published\nRescue teams in Indonesia have been searching for survivors of Saturday's major earthquake which left at least 47 people dead.\nThe magnitude 7.7 quake struck the island of Flores shortly before 05:00 (22:00 GMT on Friday) and had a depth of 15km, Indonesia's meteorology and geophysics agency stated.\nPreliminary reports indicate hundreds of buildings have been severely damaged by the quake and the dozens of aftershocks that followed.\nHowever, the full scale of the disaster is still unclear, and news of a second earthquake of magnitude 6.9 at the other end of Indonesia served as a reminder of why they call this region the ring of fire.\nTremors from Saturday's powerful earthquake were reportedly felt by residents as far west as Bima Regency and City, the National Disaster Management Agency (BNPB) agency said, but the Manggarai province is among the most affected.\nPreliminary data shows that 24 fatalities had been recorded there, meanwhile 17 deaths were recorded in East Manggarai province, three in Sikka province, and at least one in each of the Ngada, Ende and West Manggarai provinces.\nAt least two others had been seriously injured and 11 slightly injured.\nThe BNPB said aid was being sent to the affected areas with 10,500 packages arriving at the base operations so far.\nIt will take time to assess the full extent of the destruction in the region, which is remote and mountainous.\nHowever, early reports indicate more than 150 houses had been severely damaged, as well as dozens of educational institutions, a number of healthcare facilities, places of worship, offices, and several other public facilities.\nVideo taken at the port in Maumere - the largest town in Flores - showed large chunks of concrete breaking off the terminal building onto passengers waiting to board an inter-island ferry. Some were thrown into the sea when the gangway to a ship collapsed.\nEmanuel Melkiades Laka Lena, governor of East Nusa Tenggara province, told a news conference that they were killed in their sleep by collapsing rubble.\nOthers, like Arnold Welianto, who lives in Talibura, a village near the coastline in Sikka, East Nusa Tenggara, were shaken out of their beds.\n\"I was startled awake and immediately went to my child's room.\" He said.\nHe also told the BBC that many people had already fled into the hills because the sea had also receded.\nWhile a tsunami warning was initially issued - leading some 2,000 people to self-evacuate - it was lifted around three hours after the initial jolt, when no significant sea level rise was detected.\nLandslides, however, did block access to some villages but the experienced rescue teams worked tirelessly through the day to free those trapped under the rubble.\nIn Ruteng, a temporary medical tent was also assembled outside of a hospital to treat earthquake victims.\nThe ongoing advice from BNPB is for people to remain calm and to stay away from coastal areas and structures showing signs of damage.\nIndonesia is prone to earthquakes and volcanic activity, lying along the meeting point of three major tectonic plates.",
    "bodyJa": "インドネシアの大地震で生存者を捜索する救助隊\n- 公開されました\nインドネシアの救助チームは、少なくとも47人が死亡した土曜日の大地震で生存者の捜索を行っている。\nインドネシアの気象・地球物理庁によると、マグニチュード7.7の地震は午前5時（金曜日日本時間午後22時）直前にフローレス島を襲い、深さは15キロに達した。\n暫定報告によると、地震とその後の数十回の余震によって数百棟の建物が深刻な被害を受けた。\nしかし、災害の全規模はいまだ不明であり、インドネシアの反対側でマグニチュード6.9の二度目の地震が発生したというニュースは、なぜこの地域を環太平洋火山帯と呼ぶのかを思い出させるものとなった。\n国家災害管理庁（BNPB）によると、土曜日の強力な地震による揺れは、遠く西のビマ県とビマ市までの住民が感じたと伝えられているが、マンガライ県は最も大きな被害を受けたものの一つである。\n暫定データによると、そこでは24人の死亡者が記録され、一方、東マンガライ県で17人、シッカ県で3人、ンガダ、エンデ、西マンガライ県でそれぞれ少なくとも1人の死亡が記録されている。\n他に少なくとも2人が重傷、11人が軽傷を負った。\nBNPBは、これまでに基地運営に1万500個の荷物が到着し、支援物資が被災地に送られていると述べた。\n遠隔地で山岳地帯にあるこの地域の破壊の全容を把握するには時間がかかるだろう。\nしかし、初期の報告によると、150戸以上の家屋のほか、数十の教育機関、多数の医療施設、礼拝所、オフィス、その他いくつかの公共施設が大きな被害を受けた。\nフローレス島最大の町、マウメレの港で撮影されたビデオには、ターミナルビルから島間フェリーの乗船を待つ乗客の上にコンクリートの大きな塊が飛び散る様子が映っていた。船への通路が崩壊し、海に投げ出された人もいた。\n東ヌサトゥンガラ州知事エマヌエル・メルキアデス・ラカ・レナ氏は記者会見で、彼らは崩れた瓦礫によって睡眠中に死亡したと語った。\n東ヌサトゥンガラ州シッカの海岸線近くの村タリブラに住むアーノルド・ウェリアントさんのように、ベッドから振り落とされた人もいる。\n「私はびっくりして目が覚めてすぐに子供部屋に行きました。」彼は言い​​ました。\n同氏はまた、海も後退したため、多くの人々がすでに丘に避難しているとBBCに語った。\n当初、津波警報が発令され、約2,000人が自主避難を余儀なくされたが、最初の揺れから約3時間後に大きな海面上昇が検出されず、警報は解除された。\nしかし、地滑りにより一部の村へのアクセスが遮断されたが、経験豊富な救助チームは瓦礫の下敷きになった人々を救出するために一日中精力的に活動した。\nルテンでは、地震犠牲者を治療するために病院の外に臨時の医療テントも建てられた。\nBNPB からの継続的なアドバイスは、人々が落ち着いて行動し、被害の兆候のある海岸地域や建造物に近づかないようにすることです。\nインドネシアは 3 つの主要なプレートの合流点に沿って位置しており、地震と火山活動が起こりやすい国です。",

    "id": "qatar-denies-capturing-three-iranian-pil-c4ec5792",
    "title": "Qatar denies capturing three Iranian pilots after downing fighter jets",
    "titleJa": "カタール、戦闘機撃墜後のイラン人パイロット３人の拘束を否定",
    "summaryJa": "カタール、戦闘機撃墜後のイラン人パイロット３人の拘束を否定- 公開されました",
    "bodyOriginal": "Qatar denies capturing three Iranian pilots after downing fighter jets\n- Published\nIran has called for the release of three pilots it said were captured by Qatar after two of its fighter jets were hit by air defences during a military operation at the start of the US-Iran war.\nIn a letter to the head of the International Committee of the Red Cross (ICRC), Iran's Brig Gen Mohammad Bagherzadeh said the pilots - Javad Salehi, Abdul Majid Dashtian and Imran Behroshian - had been held captive for six months.\nHe said the body of a fourth pilot, Majid Kazemi, had been returned after he was killed in the same operation on 2 March 2026 - the third day of the war.\nQatar \"categorically denied\" Iran's claims and said it was \"surprised by these misleading statements\".\nGen Bagherzadeh said the three pilots had been captured by Qatar after they ejected from their jets during a combat mission targeting a Qatari military base.\nIn the letter to ICRC chief Mirjana Spoljaric, published by Iranian media, he accused Qatar of violating \"the inalienable rights of these prisoners, contrary to all international laws and regulations\".\nThe letter also claimed the three pilots had not been allowed to meet or contact their families.\nQatar's foreign affairs spokesperson Majed Mohammed Al Ansari said contact had been made with the pilots \"after they violated Qatari airspace\", but that it had not received a response.\n\"The necessary measures were taken to defend our territory in accordance with international law,\" he added in a statement on X.\nAl Ansari said Qatar's search and rescue teams \"carried out their duties to the fullest extent in searching for the pilots' remains\".\nHe said Qatar contacted Iran to \"co-ordinate the handover of the remains of one of the pilots that were recovered\" and that Tehran had yet to respond to an invitation to review details of the search and rescue operation.\nRelated topics\n- Published4 days ago",
    "bodyJa": "カタール、戦闘機撃墜後のイラン人パイロット３人の拘束を否定\n- 公開されました\nイランは、米イラン戦争開始時の軍事作戦中にカタールの戦闘機２機が防空攻撃を受けた後、カタールに捕らえられたとしてパイロット３人の釈放を求めた。\nイランのモハマド・バゲルザデ准将は、赤十字国際委員会（ICRC）委員長に宛てた書簡の中で、パイロットのジャバド・サレヒ氏、アブドゥル・マジッド・ダシュティアン氏、イムラン・ベーロシアン氏が6か月間拘束されていたと述べた。\n同氏は、4人目のパイロット、マジッド・カゼミの遺体が、戦争開始3日目の2026年3月2日に同じ作戦で死亡した後、返還されたと述べた。\nカタールはイランの主張を「断固否定」し、「誤解を招く発言に驚いている」と述べた。\nバゲルザデ将軍は、パイロット３名がカタールの軍事基地を標的とした戦闘任務中にジェット機から脱出した後、カタールに捕らえられたと述べた。\nイランのメディアが発表したICRC長官ミルジャナ・スポルジャリッチへの書簡の中で、同氏はカタールが「すべての国際法と規制に反して、これら捕虜の譲ることのできない権利」を侵害していると非難した。\n書簡はまた、パイロット３人が家族との面会や連絡を許されていなかったと主張した。\nカタール外交報道官マジェド・モハメド・アル・アンサリ氏は、パイロットらが「カタールの領空を侵犯した後」接触があったが、返答はなかったと述べた。\n同氏はXに関する声明で「国際法に従って我が国の領土を守るために必要な措置が取られた」と付け加えた。\nアル・アンサリ氏は、カタールの捜索救助チームは「パイロットの遺体捜索で最大限の任務を遂行した」と述べた。\n同氏は、カタールが「回収されたパイロットのうち１人の遺体の引き渡しを調整する」ためにイランに連絡しており、イランは捜索救助活動の詳細を検討するよう要請にまだ応じていないと述べた。\n関連トピック\n- 4 日前に公開",

    "id": "morocco-detains-dozens-of-migrants-tryin-4b8c4b3a",
    "title": "Morocco detains dozens of migrants trying to cross into Ceuta, reports say",
    "titleJa": "モロッコ、セウタに渡ろうとした数十人の移民を拘束 報道によると",
    "summaryJa": "モロッコ、セウタに渡ろうとした数十人の移民を拘束 報道によると- 公開されました",
    "bodyOriginal": "Morocco detains dozens of migrants trying to cross into Ceuta, reports say\n- Published\nMoroccan authorities have intercepted dozens of migrants seeking to cross into the Spanish North African exclave of Ceuta, reports say.\nMore than 100 people were blocked trying to make their way to the border on the outskirts of the town of Fnideq, according to Moroccan security sources cited by Spanish media and the Reuters news agency.\nIt comes a fortnight after roughly 78,000 migrants arrived in the exclave by sea in a matter of hours - 100 of whom died, according to the city's mayor, who also said the vast majority of arrivals had returned to Morocco.\nSecurity had been stepped up in the area after the influx and amid suggestions on social media of a second mass crossing attempt this weekend.\nThe security sources said 111 people had been detained in or around Fnideq - known in Spanish as Castillejos - about 3km (1.8 miles) from the border, the majority of whom were from sub-Saharan Africa.\nMoroccan police - including some in riot gear - reportedly used tear gas to disperse groups of migrants gathered on nearby hills.\nEarlier this week, Morocco's government said it was monitoring \"the circulation of social media posts and messages of unknown origin\" calling for a mass crossing on Saturday, and warned that it would prosecute organisers and participants.\nSecurity at the breakwater entrance was \"10 times stronger than the previous day\", Spanish newspaper El País reported.\nMorocco had dispatched army officers, navy speedboats and drones to the border on Saturday, it said.\nMadrid meanwhile deployed more than 1,500 security officers to patrol the area.\nSpain has also installed a metal fence and a floating barrier following last month's influx.\nThe crisis had calmed since breaking out in late July, but it has sparked tensions between EU nations which share open borders as well as criticism of the Spanish government.\nItaly suspended the 29-member Schengen arrangement of free movement with Spain and introduced border checks on arrivals from Spain.\nItaly was backed by Finland and Denmark, while the Czech Republic called for Spain's membership to be temporarily suspended.\nSpain reacted angrily, with Prime Minister Pedro Sánchez noting Ceuta was not part of the Schengen area - and the migrants, therefore, had not arrived on the Spanish mainland and could travel to any other European country.\nIt urged Italy to drop its border controls - and introduced its own when Rome refused, citing the possibility of a new influx on 15 August.\nOn Saturday, Italy's Foreign Minister Antonio Tajani said his country had been afraid of a \"risk of a new wave of arrivals in Ceuta\".\n\"We're not waging any kind of 'battle' against Spain; we're simply carefully controlling arrivals,\" he said.\n\"Instead of worrying about us, Spain should worry about Morocco: that's where the problems are coming from, certainly not from our controls.\"",
    "bodyJa": "モロッコ、セウタに渡ろうとした数十人の移民を拘束 報道によると\n- 公開されました\n報道によると、モロッコ当局はスペイン領北アフリカの飛び地セウタへの入国を目指す数十人の移民を阻止した。\nスペインメディアとロイター通信が引用したモロッコ治安筋の情報によると、フニデク町郊外で国境に行こうとして100人以上が阻止されたという。\n約7万8000人の移民が海路で数時間以内に飛び地に到着してから2週間が経ったが、市長によればそのうち100人が死亡し、到着者の大多数はモロッコに戻ったと述べた。\n流入後、ソーシャルメディア上で今週末に2度目の集団横断が試みられる可能性が示唆される中、同地域では警備が強化されていた。\n治安関係者によると、国境から約３キロ離れたフニデク（スペイン語でカスティジェホス）またはその周辺で１１１人が拘束されており、その大半がサハラ以南のアフリカ出身者だった。\nモロッコ警察（一部は暴動鎮圧服を着ている人もいた）は、近くの丘に集まった移民グループを解散させるために催涙ガスを使用したと伝えられている。\n今週初め、モロッコ政府は土曜日の集団横断を求める「ソーシャルメディアの投稿や出所不明のメッセージの流通」を監視していると発表し、主催者と参加者を訴追すると警告した。\nスペイン紙エル・パイスは、防波堤入り口の警備は「前日より10倍強化された」と報じた。\nモロッコは土曜日、国境に陸軍将校、海軍のスピードボート、ドローンを派遣したと発表した。\n一方、マドリードは1,500人以上の治安職員を派遣して地域を巡回させた。\nスペインも先月の流入を受けて金属フェンスと浮遊柵を設置した。\n危機は7月下旬に発生して以来沈静化したが、開かれた国境を共有するEU諸国間の緊張やスペイン政府への批判を引き起こした。\nイタリアはスペインとの自由移動に関する29加盟国シェンゲン協定を一時停止し、スペインからの入国者に国境検査を導入した。\nイタリアはフィンランドとデンマークの支持を得たが、チェコ共和国はスペインの加盟を一時的に停止するよう求めた。\nスペインはこれに激怒し、ペドロ・サンチェス首相は、セウタはシェンゲン圏内には含まれておらず、したがって移民たちはスペイン本土に到着しておらず、他のヨーロッパ諸国に渡航できると指摘した。\nイタリアに対し、国境管理を撤廃するよう求めたが、ローマが8月15日に新たな流入の可能性を理由に拒否すると、独自の国境管理を導入した。\n土曜日、イタリアのアントニオ・タジャーニ外相は、同国は「セウタに新たな到着者の波が訪れるリスク」を懸念していると述べた。\n同氏は「われわれはスペインに対していかなる『戦い』も行っていない。ただ入国者を注意深く管理しているだけだ」と述べた。\n「スペインは我々のことを心配するのではなく、モロッコのことを心配すべきだ。問題はモロッコから来ているのであって、我々のコントロールからでは決してない。」",
    "source": "BBC",
    "sourceUrl": "https://www.bbc.co.uk/news/articles/ckg44x2ey1ro?at_medium=RSS&at_campaign=rss",

    "id": "liechtenstein-changes-succession-rule-to-72fe293d",
    "title": "Liechtenstein changes succession rule to allow women to ascend the throne",
    "titleJa": "リヒテンシュタイン、女性の王位継承を認めるために継承規則を変更",
    "summaryJa": "リヒテンシュタイン、女性の王位継承を認めるために継承規則を変更- 公開されました",
    "bodyOriginal": "Liechtenstein changes succession rule to allow women to ascend the throne\n- Published\nLiechtenstein has announced that it has changed royal succession rules to allow women to ascend the throne.\nThe declaration was made on the national day of the central European country, which has a population of just 44,000.\nLiechtenstein's current ruler, Prince Hans-Adam II, has been the head of their royal family since 1989. The rule change will not affect his heir, Hereditary Prince Alois, who was his first-born.\nAlois has carried out most official royal duties for the last two decades.\n\"The order of succession is being changed from male primogeniture to absolute primogeniture,\" the House of Liechtenstein said in a statement.\n\"This means that in future the first-born child, regardless of sex, will become heir to the throne and later princess or prince of Liechtenstein.\"\nThe change will not affect Liechtenstein's succession line for now - it will only apply to descendants of the four children of Hereditary Prince Alois and his wife, Hereditary Princess Sophie.\nIn a statement, Alois said: \"With this change in the law, we want to ensure that both the Principality of Liechtenstein and the Princely House are led by the person who has been best prepared for this responsibility.\"\nLiechtenstein is a tiny, doubly-landlocked country tucked away between Switzerland and Austria, whose ruler enjoys sweeping political powers, unlike many of his counterparts in Europe.\nIn 2011, Britain changed its succession laws to allow first-born daughters of a monarch to inherit the throne.\nRelated topics\n- Published12 July 2023\n- Published28 October 2011",
    "bodyJa": "リヒテンシュタイン、女性の王位継承を認めるために継承規則を変更\n- 公開されました\nリヒテンシュタインは、女性の王位継承を認めるために王位継承規則を変更したと発表した。\nこの宣言は、人口わずか4万4000人の中央ヨーロッパの国、建国記念日に行われた。\nリヒテンシュタインの現統治者であるハンス＝アダム2世王子は、1989年以来リヒテンシュタイン王室の長を務めている。この規則の変更は、彼の後継者である彼の長男である世襲王子アロイスには影響を及ぼさない。\nアロイスは過去20年間、王室の公務のほとんどを遂行してきた。\nリヒテンシュタイン下院は声明で、「相続の順序は男系長子相続から絶対長子相続に変更される」と述べた。\n「これは、将来、性別に関係なく、第一子が王位継承者となり、後にはリヒテンシュタインの王女か王子になることを意味する。」\nこの変更は今のところリヒテンシュタインの王位継承には影響せず、世襲王子アロイスとその妻である世襲王女ソフィーの4人の子供の子孫にのみ適用される。\nアロイス氏は声明で、「今回の法改正により、リヒテンシュタイン公国と皇太子院の両方が、この責任に対して最もよく準備された人物によって指導されることを確保したいと考えている」と述べた。\nリヒテンシュタインはスイスとオーストリアの間に挟まれた小さな二重内陸国で、その統治者はヨーロッパの多くの同国とは異なり、圧倒的な政治権力を享受している。\n英国は２０１１年に王位継承法を改正し、君主の長女が王位を継承できるようにした。\n関連トピック\n- 2023 年 7 月 12 日公開\n- 2011 年 10 月 28 日発行",
    "source": "BBC",

    "id": "multiple-suspects-at-large-after-five-sh-059adcf1",
    "title": "Multiple suspects at large after five shot at Virginia State University, police say",
    "titleJa": "バージニア州立大学で5人が銃撃され、複数の容疑者が逃走中と警察が発表",
    "summaryJa": "バージニア州立大学で5人が銃撃され、複数の容疑者が逃走中と警察が発表- 公開されました",
    "bodyOriginal": "Multiple suspects at large after five shot at Virginia State University, police say\n- Published\nFive people have been injured, one critically, in a shooting at Virginia State University (VSU) involving multiple suspects.\nOfficers responded to the incident outside a residence halls at about 01:28 local time (05:28 GMT) on Saturday, the university said.\nFive individuals, who were all found with gunshot wounds, were taken to local hospitals. Four had injuries that were deemed not to be life-threatening, according to the VSU, which is one of the country's historically black colleges and universities.\nLocal police told the BBC that they believe more than one shooter was involved, but that no arrests had been made.\nA temporary lockdown on the campus has since been lifted, but a \"significant\" law enforcement presence was still on site, the university confirmed in a statement.\nIt added that Chesterfield County Police were leading the investigation with help from other local law enforcement and campus police.\nClasses for the new term were set to begin on Monday and campus dormitories opened for returning students on Friday, according to the university's website.\nLt James R Lamb of Chesterfield County Police Department told the BBC that one of the victims was a student and another was under 18.\nThe university stated that the student victim had \"sustained non-life-threatening injuries\" and had been discharged from hospital.\n\"We don't have anybody in custody,\" Lamb said. \"We know there was more than one shooter, so I would say the suspects are still at large.\"\nHe said investigators were still reviewing surveillance video and were not currently treating any of the five people who were injured as suspects.\nVSU has about 5,000 students and is just over 20 miles (32km) south of Richmond, the state capital of Virginia.\nSuch institutions were created to provide higher education to disenfranchised African Americans, who were otherwise prohibited from attending most colleges.",
    "bodyJa": "バージニア州立大学で5人が銃撃され、複数の容疑者が逃走中と警察が発表\n- 公開されました\nバージニア州立大学（VSU）で複数の容疑者が関与した銃撃事件で、5人が負傷し、1人が重体となった。\n大学によると、現地時間土曜午前１時２８分（日本時間午後５時２８分）ごろ、警察官らが寮の外で事件に対応した。\n5人は全員銃撃による傷を負った状態で発見され、地元の病院に搬送された。国内の歴史的に黒人大学の一つであるVSUによると、4人は命に別状はないとみなされる負傷を負った。\n地元警察はBBCに対し、複数の銃撃犯が関与したと考えているが、逮捕はされていないと語った。\nその後、キャンパスの一時的な封鎖は解除されたが、「相当な」法執行機関が依然として現場​​に存在していたと大学は声明で認めた。\nチェスターフィールド郡警察は他の地元警察やキャンパス警察の協力を得て捜査を主導していると付け加えた。\n大学のウェブサイトによると、新学期の授業は月曜日に始まる予定で、金曜日には帰国生のためにキャンパスの寮が開設された。\nチェスターフィールド郡警察署のジェームズ・R・ラム警部補はBBCに対し、犠牲者の1人は学生、もう1人は18歳未満だったと語った。\n大学は、被害学生は「生命を脅かすものではない怪我を負い」、退院したと発表した。\n「我々には誰も拘留されていない」とラム氏は語った。 「複数の銃撃犯がいたことがわかっているので、容疑者はまだ逃走中だと思います。」\n同氏は、捜査当局がまだ監視ビデオを調査中であり、負傷した５人のうち誰も容疑者として現在扱っていないと述べた。\nVSU には約 5,000 人の学生がおり、バージニア州の州都リッチモンドから南に 20 マイル (32 km) 強の場所にあります。\nこのような教育機関は、ほとんどの大学に通うことが禁じられ、権利を剥奪されたアフリカ系アメリカ人に高等教育を提供するために創設された。",

    "id": "marijuana-reform-is-emerging-as-a-midter-4ec8c770",
    "title": "Marijuana reform is emerging as a midterm elections issue on both sides of the aisle",
    "titleJa": "マリファナ改革が中間選挙の争点として両側で浮上している",
    "summaryJa": "過去1世紀にわたり、米国ではマリファナは法的、政治的、文化的に、中傷と容認の間で揺れ動く浮き沈みの歴史を歩んできた。 1996年以来、40の州とコロンビア特別区が医療用または娯楽目的の成人向け大麻を合法化した。しかし、マリファナの原料となる葉物植物である大麻は、1970 年の規制物質法で定義されているように、依然として連邦政府の違法なスケジュール I 薬物です。11月の極めて重要な中間選挙が近づく中、大麻改革が重要な問題として浮上している。マサチューセッツ州とアイダホ州の２州は合法化に関する投票の取り組みについて投票する予定で、カンザス州やアイオワ州など他のいくつかの州では知事候補が大麻問題について議論している。",
    "bodyOriginal": "Marijuana has had a history of highs and lows in the U.S. over the past century — legally, politically and culturally — teetering between vilification and acceptance. Since 1996, 40 states and the District of Columbia have legalized either medical or recreational adult-use marijuana. Yet cannabis, the leafy plant from which marijuana is derived, is still a federally illegal Schedule I drug as defined by the 1970 Controlled Substances Act.\nWith November's pivotal midterm elections fast approaching, cannabis reform is emerging as an important issue. Two states, Massachusetts and Idaho, will vote on ballot initiatives regarding legalization, and in several others, including Kansas and Iowa, gubernatorial candidates are debating cannabis matters.\nMarijuana may not be as critical to voters as the economy, immigration, the war with Iran and the build-out of AI data centers. But it will likely be on the minds of Democrats and Republicans over the next few months.\n\"It's certainly a very popular issue among voters,\" said Morgan Fox, political director for NORML, a non-profit group that advocates for cannabis legalization. \"It's possible that it could become a more important issue as we get closer to the midterms, particularly if Republicans are worried about losing one or both chambers.\"\nPresident Donald Trump shined a political grow light on the issue last December when he urged the Justice Department to expedite the reclassification of marijuana from Schedule I to Schedule III, a category that includes Tylenol with codeine, ketamine and testosterone.\nThe timing of Trump's announcement — coupled with his administration's recent order to fast-track approval of psychedelic drugs, as well the president's slumping approval rating — could be seen as a tactic to boost Republican voters who support loosening drug restrictions. It also steals thunder from Democrats, who had failed to reschedule cannabis during Biden's tenure.\nTrump's switch came to fruition, at least partially, in April. Acting Attorney General Todd Blanche signed an order to reschedule state-licensed medical marijuana to Schedule III, thereby easing research restraints and federal tax burdens on companies operating in the $30-billion legal cannabis industry. In a probable nod to voters, outgoing White House press secretary Karoline Leavitt said that rescheduling is \"overwhelmingly popular with the vast majority of Americans.\"\nPublic support for legal marijuana\nSixty-four percent of U.S. adults think the use of marijuana should be legal, according to a November Gallup poll.\nBut that popularity may not translate directly into votes, according to Kevin Sabet, CEO of Smart Approaches to Marijuana, a non-profit that opposes marijuana legalization and commercialization. He believes that cannabis reform will be a low-priority issue come November. \"It's traditionally let down the politicians who thought they were going to be scoring some cheap votes,\" he said, \"most recently, the president.\"\nThe Gallup data shows public support has declined from 70% in 2023, a trend that can be interpreted as politically motivated. Support for legalization among Republicans has fallen 13 points over the past year, to 40% from 53% — despite Trump's warming relationship with the industry — while it's been consistent among Democrats (85%) and independents (66%) in recent years.\nAt the federal level, \"cannabis will still be illegal,\" Fox said of the rescheduling efforts. \"The most concrete benefit of moving to Schedule III is 280E tax relief for cannabis businesses,\" he said, referring to the IRS code that prohibits legal cannabis companies from deducting otherwise established business expenses, such as payroll, rent and utilities, from gross income.\n\"280E has always been one of those things that you just have to operate around,\" said Matthew Melander, president of Sun Theory, a vertically integrated company that cultivates cannabis and operates dispensaries and markets branded edibles. \"We know that if [it] does go away, that inherently makes the industry more profitable.\"\nSabet concedes that the industry would benefit from the removal of 280E. \"I just don't think it's a good thing,\" he said. \"The last thing pot companies need are tax breaks.\"\nIn fact, the prospect of rescheduling stoked Trump supporters in the industry who have lobbied the administration for federal and state reforms to onerous cannabis regulations. Most prominent among them is Kim Rivers, CEO of Trulieve, one of the largest U.S. cannabis companies, who donated $750,000 to the president's inauguration last year and attended a private $1 million-per-plate fundraiser at Trump's New Jersey golf club, where she urged the president to follow through on marijuana rescheduling and expand medical-cannabis research, according to the Wall Street Journal.\nTo date, Trulieve and other industry leaders, including Curaleaf, Green Thumb Industries and Verano Holdings, have contributed roughly $11.5 million into the Trump-aligned super PAC America First Agriculture Action Inc. ahead of the midterms, according to filings with the Federal Election Commission.\nNonetheless, many Republican lawmakers oppose cannabis reforms. More than 20 GOP senators and several House members signed letters urging the White House to halt reclassification. In August 2025, Rep. Paul Gosar (R-AZ) wrote, \"Marijuana rescheduling will … not be the boon to the Republicans' midterm chances like Big Weed claims. In fact, reclassifying marijuana as a Schedule III drug would be a self-own for the Republican Party in 2026.\"\nAcross the aisle, Congressional Democrats tepidly endorsed the order, labelling it a partial solution that fell short of full legalization, a policy that many in the party favor. Last month, 17 Senate Democrats, led by Cory Booker (NJ), Chuck Schumer (NY) and Ron Wyden (OR), reintroduced the Cannabis Administration and Opportunity Act, for the second time. If it passes, the legislation calls for completely removing cannabis from the Controlled Substances Act and ending its federal prohibition.\n\"Voters across the country have made it clear they want cannabis legalized, and Trump's half measures aren't fooling anyone,\" Sen. Wyden said in an email statement to CNBC. \"Anything less than full descheduling at the federal level is an attempt to juice Trump's numbers ahead of November, because he knows his platform of driving up gas prices and giving tax breaks to billionaires is about to lose him the midterms. The best path forward is passing\" the CAOA, he said.\nEven so, in its most recent party platform, issued in 2024, Democrats stopped short of officially endorsing federal recreational legalization or complete descheduling of marijuana. The 2024 Republican Party platform did not take a clear position on cannabis legalization or rescheduling.\nHistorically, marijuana is no stranger to controversy. The Marihuana Tax Act of 1937 effectively criminalized what until then had been legal cannabis. Two years later, \"Reefer Madness\" terrified movie-going parents. That set the tone decades later for President Richard Nixon to sign the Controlled Substance Act, condemning marijuana as a Schedule I drug alongside heroin and LSD.\nAmericans kept lighting up, though, even after draconian federal and state anti-drug laws were enacted during the 1990s. Millions of people were arrested for possessing and selling marijuana and hundreds of thousands were incarcerated, some receiving life sentences. In 1996, 75% of the public opposed legalization.\nThat same year, however, California breached the War on Drugs barricades, becoming the first state to legalize medical marijuana. Fifteen states have since followed suit. Then in 2012, Colorado and Washington became the first states to legalize recreational adult-use cannabis. To date, only Idaho and Kansas ban marijuana outright.\nIdaho, Kansas, Massachusetts among cannabis battleground states\nIdaho voters will have a chance in November to decide whether or not to keep it that way. An amendment on the ballot would grant the state legislature exclusive authority to prohibit citizen-initiated ballot measures on marijuana, narcotics and psychoactive substances. An initiative to legalize only medical cannabis failed to make the ballot, despite the fact that nearly three-quarters of surveyed voters favored the measure.\nMarijuana is not on the ballot in Kansas, though it may well come up in the race for governor. The Democratic candidate, Cindy Holscher, publicly endorsed recreational marijuana legalization during her primary campaign. Her GOP opponent, state senate president Ty Masterson, objects to legalization of recreational marijuana and has consistently blocked medical marijuana legislation from moving forward.\nSimilarly, in nearby Iowa, where medical marijuana has been legal since 2017, the gubernatorial candidates are on opposite sides of the legalization issue. The GOP's Zach Lahn has clearly stated that he would not support legalizing recreational marijuana, while Democrat Rob Sand said in April, \"I'm announcing my plan to legalize, tax and regulate adult-use cannabis.\"\nThe electorate in Massachusetts is facing a more peculiar, and contentious, ballot measure. \"An Act to Restore a Sensible Marijuana Policy\" would retain the Bay State's medical marijuana program, overwhelmingly approved in 2012, while repealing its 2016 vote to legalize recreational marijuana sales and cultivation, which passed by a margin of 54% to 46%. This current initiative would mark the first time a voter-approved legalization measure was overturned.\n\"It's a total uphill battle, definitely David and Goliath,\" Sabet said. \"The marijuana industry can't believe it qualified, but at the same time [is] mobilizing very strongly to get this to fail.\"\nSabet said that SAM was \"one of the donors for that ballot initiative.\" The Massachusetts Office of Campaign and Political Finance filings show that the coalition behind the initiative received the entirety of its $1.5 million in fund-raising from SAM. There have been additional contributions to the coalition since then, which will be reported in September. A group opposing the measure, \"Stop the Repeal,\" challenged the signature process, but the State Ballot Law Commission denied its petition.\nRegardless, said Fox, \"It's pretty clear that this is not something people actually want.\"\nA University of New Hampshire poll released in February found that 63% of Massachusetts voters oppose the measure, including 41% of Republicans surveyed. NORML will be heavily involved in working against it. \"We want to make sure that this thing goes down in flames,\" he said.\nThere's plenty of time between now and the November 3 elections for voters to weigh key issues. Whether rescheduling, legalizing or restricting marijuana rises in importance remains to be seen. \"There is definitely an impetus among folks that are supportive of cannabis policy reform to put their marker down before the midterms,\" Fox said. The various state initiatives and races being considered, in his view, indicate \"a recognition that this is a politically popular issue.\"",
    "bodyJa": "過去1世紀にわたり、米国ではマリファナは法的、政治的、文化的に、中傷と容認の間で揺れ動く浮き沈みの歴史を歩んできた。 1996年以来、40の州とコロンビア特別区が医療用または娯楽目的の成人向け大麻を合法化した。しかし、マリファナの原料となる葉物植物である大麻は、1970 年の規制物質法で定義されているように、依然として連邦政府の違法なスケジュール I 薬物です。\n11月の極めて重要な中間選挙が近づく中、大麻改革が重要な問題として浮上している。マサチューセッツ州とアイダホ州の２州は合法化に関する投票の取り組みについて投票する予定で、カンザス州やアイオワ州など他のいくつかの州では知事候補が大麻問題について議論している。\n有権者にとってマリファナは、経済、移民、イランとの戦争、AIデータセンターの建設ほど重要ではないかもしれない。しかし、今後数カ月間は民主党と共和党の両方がこの問題を気にすることになるだろう。\n「有権者の間で非常に人気のある問題であることは確かだ」と大麻合法化を主張する非営利団体NORMLの政治ディレクター、モーガン・フォックス氏は語った。 「中間選挙が近づくにつれて、特に共和党が片方または両院での敗北を懸念している場合には、この問題がより重要な問題になる可能性がある。」\nドナルド・トランプ大統領は昨年12月、マリファナをスケジュールIからコデイン、ケタミン、テストステロンを含むタイレノールを含むカテゴリーであるスケジュールIIIに再分類するよう司法省に要請し、この問題に政治的な光を当てた。\nトランプ大統領の発表のタイミングは、幻覚剤の承認を急ぐという同政権の最近の命令や大統領の支持率低迷と相まって、薬物規制緩和を支持する共和党有権者を押し上げるための戦術とみなされる可能性がある。また、バイデンの任期中に大麻の再スケジュールに失敗した民主党からも雷を盗むことになる。\nトランプ大統領の方針転換は4月に少なくとも部分的には実を結んだ。トッド・ブランシュ司法長官代理は、州認可の医療用大麻のスケジュールをスケジュールIIIに変更する命令に署名し、これにより研究制限や300億ドル規模の合法大麻産業で活動する企業に対する連邦税の負担が緩和された。退任するホワイトハウス報道官のキャロライン・リービット氏は、有権者におそらくうなずいて、日程変更は「大多数のアメリカ人に圧倒的に人気がある」と述べた。\n合法大麻に対する公的支援\n11月のギャラップ世論調査によると、米国成人の64％がマリファナの使用は合法であるべきだと考えている。\nしかし、マリファナの合法化と商業化に反対する非営利団体、スマート・アプローチズ・トゥ・マリファナの最高経営責任者（CEO）ケビン・サベット氏によると、その人気は直接的に投票には結びつかない可能性があるという。同氏は、大麻改革は11月には優先順位が低い問題になるだろうと考えている。同氏は、「伝統的に、安い票を獲得できると考えていた政治家を失望させてきたが、最近では大統領もそうだ」と述べた。\nギャラップのデータによると、国民の支持率は2023年の70％から低下しており、この傾向は政治的動機によるものと解釈できる。トランプ大統領と業界との友好関係にもかかわらず、共和党員の間での合法化支持率は過去1年間で53％から40％に13ポイント低下したが、近年は民主党員（85％）と無党派層（66％）の間で一貫している。\nフォックス氏は、連邦レベルでは「大麻は引き続き違法となる」とスケジュール変更の取り組みについて述べた。 「スケジュールIIIへの移行の最も具体的な利点は、大麻ビジネスに対する280Eの減税だ」と同氏は、合法大麻会社が給与、家賃、光熱費などの別途定められた事業経費を総収入から差し引くことを禁じているIRS法に触れながら述べた。\n「280Eは常に、ただ操作しなければならないものの1つでした」と、大麻の栽培、薬局の運営、ブランド食品の販売を行う垂直統合型企業であるサン・セオリーの社長マシュー・メランダー氏は語る。 「私たちは、もしそれがなくなってしまえば、本質的に業界の収益性が高まることを知っています。」\nSabet 氏は、業界が 280E の廃止によって恩恵を受けることを認めています。 「それが良いことだとは思えない」と彼は言った。 「大麻企業が最も必要としているのは減税だ。」\n実際、日程変更の見通しは業界のトランプ支持者らを興奮させ、連邦政府や州政府に面倒な大麻規制の改革を求めてきた。ウォール・ストリート・ジャーナル紙によると、その中で最も著名なのは米国最大の大麻会社の一つ、トゥルリーブのキム・リバース最高経営責任者（CEO）で、昨年の大統領就任式に75万ドルを寄付し、トランプ大統領のニュージャージー・ゴルフクラブで行われた1皿当たり100万ドルの非公開募金活動に参加し、大統領に大麻のスケジュール変更を順守し、医療用大麻の研究を拡大するよう訴えたという。\n連邦選挙管理委員会への提出書類によると、トゥルリベ氏と、キュラリーフ、グリーンサム・インダストリーズ、ヴェラーノ・ホールディングスなどの業界リーダーは、中間選挙に先立ち、これまでにトランプ氏と連携するスーパーPACアメリカ・ファースト・アグリカルチャー・アクション社に約1150万ドルを寄付している。\nそれにもかかわらず、多くの共和党議員は大麻改革に反対している。 20人以上の共和党上院議員と数人の下院議員がホワイトハウスに再分類の停止を求める書簡に署名した。 2025年8月、ポール・ゴサール下院議員（共和党、アリゾナ州）は、「マリファナのスケジュール変更は、ビッグ・ウィードの主張のように共和党の中期的チャンスに恩恵をもたらすものではない。実際、マリファナをスケジュールIIIの薬物に再分類することは、2026年には共和党にとって自業自得となるだろう。」と書いた。\n通路を挟んだ反対側の議会民主党議員らは、党内の多くが支持する政策である完全合法化には至らない部分的な解決策であるとして、この命令を冷ややかに支持した。先月、コーリー・ブッカー氏（ニュージャージー州）、チャック・シューマー氏（ニューヨーク州）、ロン・ワイデン氏（オレゴン州）率いる17名の上院民主党議員が2度目となる大麻管理・機会法を再導入した。この法律が可決されれば、規制物質法から大麻を完全に削除し、連邦政府による禁止を終了することが求められる。\nワイデン上院議員はCNBCへの電子メール声明で、「全米の有権者は大麻の合法化を望んでいることを明らかにしており、トランプ大統領の中途半端な措置は誰もだまされていない」と述べた。 「連邦レベルでの完全な日程調整以外のことは、11月に先立ってトランプ大統領の数字を搾り取ろうとする試みだ。なぜなら、ガソリン価格をつり上げ、億万長者に減税を与えるというトランプ大統領の政策が中間選挙で負けることを彼は知っているからだ。前に進む最良の道は可決することだ」とCAOAは述べた。\nそれでも、2024年に発表された最新の党綱領では、民主党は連邦レクリエーション合法化やマリファナの完全な延期を正式に支持するまでには至らなかった。 2024年の共和党綱領では、大麻合法化やスケジュール変更について明確な立場は示されていない。\n歴史的に、マリファナには論争がつきものです。 1937 年のマリファナ税法は、それまで合法だった大麻を事実上犯罪化しました。 2 年後、「リーファー マッドネス」は映画を見に行く親たちを恐怖に陥れました。このことが数十年後、リチャード・ニクソン大統領がヘロインやLSDと並んでマリファナをスケジュールI薬物として非難する規制薬物法に署名する流れを作った。\nしかし、1990年代に厳格な連邦および州の麻薬取締法が制定された後も、アメリカ人は問題を提起し続けた。数百万人がマリファナの所持と販売で逮捕され、数十万人が投獄され、終身刑を受けた人もいる。 1996年には国民の75％が合法化に反対した。\nしかし同年、カリフォルニア州は麻薬戦争のバリケードを突破し、医療大麻を合法化した最初の州となった。その後、15の州がこれに追随した。そして2012年、コロラド州とワシントン州が成人向け娯楽目的の大麻使用を合法化した最初の州となった。現在までにマリファナを完全に禁止しているのはアイダホ州とカンザス州だけである。\n大麻激戦州のアイダホ、カンザス、マサチューセッツ\nアイダホ州の有権者は11月に現状を維持するかどうか決定する機会を迎えることになる。投票用紙の修正案により、マリファナ、麻薬、向精神性物質に関する住民主導の投票措置を禁止する独占的権限が州議会に与えられることになる。医療用大麻のみを合法化する取り組みは、調査対象の有権者のほぼ4分の3がこの法案を支持したという事実にもかかわらず、投票に至らなかった。\nカンザス州ではマリファナは投票用紙に載っていないが、州知事選ではマリファナが取り上げられる可能性は十分にある。民主党候補者シンディ・ホルシャーは、予備選挙期間中に娯楽用大麻の合法化を公に支持した。彼女の共和党の対抗馬、タイ・マスターソン州上院議長は娯楽用大麻の合法化に反対し、医療用大麻法案の前進を一貫して阻止してきた。\n同様に、2017年から医療大麻が合法化された近隣のアイオワ州でも、知事候補たちは合法化問題に関して反対の立場にある。共和党のザック・ラーン氏は娯楽用大麻の合法化には支持しないと明言しているが、民主党のロブ・サンド氏は4月に「成人向け大麻を合法化し、課税し、規制する計画を発表する」と述べた。\nマサチューセッツ州の有権者は、より特異で議論の多い投票制度に直面している。 「賢明なマリファナ政策を回復するための法案」は、2012年に圧倒的多数で承認されたベイ州の医療用マリファナプログラムを維持する一方、54％対46％の僅差で可決された嗜好用マリファナの販売と栽培の合法化に関する2016年の投票を廃止する内容となっている。この現在の取り組みは、有権者によって承認された合法化措置が覆される初めてのこととなる。\n「まったくの困難な戦いだ、間違いなくダビデとゴリアテだ」とサベット氏は語った。 「マリファナ業界は、自分たちが適格であるとは信じられないが、同時に、これを失敗させるために非常に強力に結集している。」\nサベット氏は、SAMは「その投票活動への寄付者の一人」だと述べた。マサチューセッツ州選挙・政治資金局の提出書類によると、この構想を支えた連合が資金調達の150万ドル全額をSAMから受け取ったことが判明した。それ以来、連合への追加の拠出があり、それは9月に報告される予定である。この法案に反対する団体「廃止を阻止せよ」が署名手続きに異議を唱えたが、州投票法委員会はその請願を却下した。\nいずれにせよ、フォックス氏は「これが人々が実際に望んでいることではないことは明らかだ」と述べた。\n2月に発表されたニューハンプシャー大学の世論調査では、マサチューセッツ州の有権者の63％がこの法案に反対しており、その中には調査対象となった共和党員の41％が含まれている。 NORML はこれに対抗する活動に深く関与する予定です。 「私たちはこの問題が炎上するのを確実にしたいと思っています」と彼は言いました。\n今から11月3日の選挙までには、有権者が主要な争点を検討する時間は十分にある。大麻のスケジュール変更、合法化、制限の重要性が高まるかどうかはまだ分からない。 「大麻政策改革を支持する人々の間には、中間選挙前に政策を撤回しようという機運が確実にある」とフォックス氏は語った。同氏の見解では、検討されているさまざまな州の取り組みや人種は「これが政治的に人気のある問題であるという認識」を示しているという。",

    "titleJa": "予測市場とスポーツ賭博: この英国の取引所が米国でどのようにその両方を実現しようとしているか",
    "summaryJa": "英国に本拠を置く賭博取引所である Smarkets は、2 つの別々の道を追求して米国に進出しています。2008年に設立された同社は3月に商品先物取引委員会にライセンスを申請した。 Smarketsの創設者ジェイソン・トロスト氏によると、生涯取引高が600億ドルを超えるこのプラットフォームは、イリノイ州、アイオワ州、ミシガン州でスポーツブックとして運営するための申請も保留中だという。",
    "bodyOriginal": "Smarkets, a UK-based betting exchange, is making its way into the U.S. by pursuing two separate avenues.\nThe company, which was founded in 2008, filed for a license with the Commodity Futures Trading Commission in March. The platform — which has over $60 billion in lifetime trading volume — also has pending applications to operate as a sportsbook in Illinois, Iowa and Michigan, according to Smarkets founder Jason Trost.\n\"The reason we're doing the dual track is because the legal situation is unclear if the CFTC has federal preemption or not,\" Trost said. Just like prediction market platforms Kalshi and Polymarket, sports also drives Smarkets' volume, he added.\nA growing number of states have argued prediction markets are operating as illegal gambling platforms. The CFTC has hit back, however, suing multiple states to block efforts looking to regulate the platforms. Last month, 44 state attorneys general also wrote that the federal agency cannot be the exclusive regulator of sports-related event contracts found on exchanges.\nPrediction market platform Kalshi called it \"political theater\" when New York filed a lawsuit against the platform in July.\n\"States can't just shut down a federally licensed exchange. This would also just hurt New Yorkers, who would be driven offshore,\" Kalshi said.\nAs the tug-of-war on regulatory jurisdiction continues, Smarkets is trying to cooperate with states. The Susquehanna-backed platform applied as a sportsbook in Illinois and Michigan, two states where regulators have categorized prediction markets as unlicensed sports betting operators. Smarkets already operates as a sportsbook in Indiana.\nSome of my competitors are in danger of ruining the reputation of this industry because I think they're acting irresponsibly [and] not following regulation closely enough.Jason TrostSmarkets founder\nThe first choice, though, would be for Smarkets to run as a prediction markets exchange regulated under the CFTC, Trost said. He agrees with what some states argue against, that sports-event contracts should be identified as swaps and be federally regulated.\n\"We view it more as a hedge rather than we want to be active on a state level. You know, our preference is to be active on the federal level,\" Trost said.\nSmarkets isn't the first one taking this dual-track approach. Sports betting platforms like DraftKings and FanDuel have launched prediction markets late last year. During last week's earnings call, FanDuel's parent company, Flutter, noted its prediction market platform can gain customers faster in states where sportsbooks are still under scrutiny.\nSmarkets has had to confront each state's provisions for its platform to operate as sportsbooks, including abiding to high compliance and tax costs.\nStill, Trost said he's willing to take the rough terrain and make Smarkets a leading \"good actor\" in the business. He noted the platform runs in four European countries, including Ireland, Malta and Sweden, which has helped the UK-based betting exchange know how to respond to contrasting regulatory landscapes.\nWithout specifying which operators, Trost added platforms within the space also have a responsibility in following regulation, rather than working around it.\n\"Some of my competitors are in danger of ruining the reputation of this industry because I think they're acting irresponsibly [and] not following regulation closely enough,\" he said.\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.",
    "bodyJa": "英国に本拠を置く賭博取引所である Smarkets は、2 つの別々の道を追求して米国に進出しています。\n2008年に設立された同社は3月に商品先物取引委員会にライセンスを申請した。 Smarketsの創設者ジェイソン・トロスト氏によると、生涯取引高が600億ドルを超えるこのプラットフォームは、イリノイ州、アイオワ州、ミシガン州でスポーツブックとして運営するための申請も保留中だという。\nトロスト氏は「われわれがデュアルトラックを行う理由は、ＣＦＴＣに連邦による先取り権があるかどうか、法的状況が不透明だからだ」と述べた。予測市場プラットフォームの Kalshi や Polymarket と同様に、スポーツも Smarkets の取引高を押し上げている、と同氏は付け加えた。\n予測市場が違法な賭博プラットフォームとして運営されていると主張する州が増えている。しかしCFTCはこれに反撃し、プラットフォームを規制しようとする取り組みを阻止するよう複数の州を訴えた。先月、44の州司法長官も、連邦機関は取引所で見つかったスポーツ関連イベント契約の独占的な規制者にはなれない、と書いた。\n予測市場プラットフォームのカルシは、ニューヨーク州が7月に同プラットフォームに対して訴訟を起こした際、これを「政治劇場」と呼んだ。\n「各州は、連邦認可を受けた取引所を簡単に閉鎖することはできない。これでは、ニューヨーカーが国外に追放されるだけで損害を被るだろう」とカルシ氏は語った。\n規制管轄権を巡る綱引きが続く中、スマーケッツは州と協力しようとしている。サスケハナが支援するプラットフォームは、規制当局が予想市場を無認可のスポーツ賭博事業者に分類しているイリノイ州とミシガン州でスポーツブックとして適用された。 Smarkets はすでにインディアナ州でスポーツブックとして運営されています。\n私の競合他社の一部は、無責任な行動をしており、規制を十分に遵守していないと思われるため、この業界の評判を台無しにする危険にさらされています。Jason TrostSmarkets 創設者\nしかし、最初の選択肢は、SmarketsがCFTCのもとで規制される予測市場取引所として運営されることだろうとトロスト氏は述べた。同氏は、一部の州が反対している、スポーツイベント契約はスワップとして特定され、連邦政府によって規制されるべきであるという意見に同意している。\n「私たちは州レベルで積極的に活動したいというよりは、むしろヘッジとして考えています。ご存知のとおり、私たちの好みは連邦レベルで活動することです」とトロスト氏は語った。\nこの二重軌道アプローチを採用したのは Smarkets が最初ではない。 DraftKings や FanDuel などのスポーツ賭博プラットフォームは、昨年末に予想市場を立ち上げました。先週の決算会見で、FanDuelの親会社Flutterは、同社の予測市場プラットフォームは、スポーツブックが依然として精査されている州でより早く顧客を獲得できると述べた。\nスマーケッツは、プラットフォームをスポーツブックとして運営するために、高いコンプライアンスや税金コストの順守など、各州の規定に直面する必要があった。\nそれでもトロスト氏は、困難な状況を乗り越えて、スマーケッツを業界の主要な「善良な俳優」にするつもりだと語った。同氏は、このプラットフォームはアイルランド、マルタ、スウェーデンを含むヨーロッパの4か国で運営されており、これが英国に本拠を置く賭博取引所が対照的な規制状況に対応する方法のノウハウに役立っていると指摘した。\nどの事業者かは明らかにしなかったが、トロストはこの分野にプラットフォームを追加し、規制を回避するのではなく、規制に従う責任も負っていると述べた。\n「競合他社の一部は、無責任な行動をしており、規制を十分に遵守していないため、この業界の評判を損なう危険にさらされています」と同氏は述べた。\n開示: CNBC とカルシには、顧客の獲得と少数出資を含む商業関係があります。",

    "id": "anthropic-revenue-reportedly-jumps-to-mo-84f9dbe8",
    "title": "Anthropic revenue reportedly jumps to more than $11.5 billion in second quarter",
    "titleJa": "伝えられるところによると、人類の収益は第 2 四半期に 115 億ドル以上に急増",
    "summaryJa": "ブルームバーグニュースが金曜日に報じた第2四半期のAnthropicの収益は前年同期比で14倍以上に急増し、大ヒットとなる可能性のある新規株式公開の準備を進めているクロードチャットボットメーカーの急速な成長を浮き彫りにした。ブルームバーグ・ニュースが閲覧した文書によると、同社は直近完了四半期の暫定収益が115億ドル以上と報告しており、前年同期の7億8,700万ドル、2026年第1四半期の47億3,000万ドルから増加した。",
    "bodyOriginal": "Anthropic's revenue surged more than 14-fold in the second quarter from a year earlier, Bloomberg News reported Friday, underscoring the rapid growth of the Claude chatbot maker as it prepares for a potential blockbuster initial public offering.\nThe AI company reported preliminary revenue of more than $11.5 billion for its latest completed quarter, up from $787 million in the same period last year and $4.73 billion in the first quarter of 2026, according to documents viewed by Bloomberg News.\nAnthropic also posted positive adjusted operating income in the second quarter, according to the documents. The figures are preliminary and could still change, Bloomberg reported.\nAn Anthropic spokesperson did not immediately respond to a CNBC request for comment.\nThe jump in revenue comes as Anthropic competes with OpenAI for corporate customers and has gained traction among professionals using its software for tasks including coding.\nAnthropic said in May that its run-rate revenue crossed $47 billion, up from roughly $10 billion in revenue in all of 2025.\nAnthropic's early meetings with prospective investors ahead of its potential IPO have been high-level and have not included discussions about specific financials or a valuation, sources told CNBC's David Faber on Thursday. Anthropic CFO Krishna Rao is leading the meetings, the sources said.\nAn IPO as soon as this fall could make Anthropic one of the first major private AI companies to tap public markets. That debut would unlock access to billions of dollars in additional capital, providing the immense financial runway required to fund escalating compute infrastructure costs, secure advanced hardware, and build specialized data centers.",
    "bodyJa": "ブルームバーグニュースが金曜日に報じた第2四半期のAnthropicの収益は前年同期比で14倍以上に急増し、大ヒットとなる可能性のある新規株式公開の準備を進めているクロードチャットボットメーカーの急速な成長を浮き彫りにした。\nブルームバーグ・ニュースが閲覧した文書によると、同社は直近完了四半期の暫定収益が115億ドル以上と報告しており、前年同期の7億8,700万ドル、2026年第1四半期の47億3,000万ドルから増加した。\n文書によると、アンスロピックは第２・四半期に調整後営業利益もプラスとなった。ブルームバーグによると、この数字は暫定的なものであり、まだ変更される可能性がある。\nアントロピックの広報担当者はCNBCのコメント要請にすぐには応じなかった。\n収益の急増は、Anthropic が企業顧客向けに OpenAI と競合し、コーディングなどのタスクに同社のソフトウェアを使用する専門家の間で注目を集めていることによるものです。\nアンスロピックは5月、ランレート収益が470億ドルを超え、2025年通年の収益が約100億ドルだったと発表した。\nアンスロピックの潜在的なIPOに先立って行われた見込み投資家との初期の会合はハイレベルなものであり、特定の財務内容や評価額に関する議論は含まれていなかったと関係者が木曜CNBCのデービッド・フェイバーに語った。関係者によると、Anthropic CFOのクリシュナ・ラオ氏が会議を主導しているという。\n今秋にもIPOが実現すれば、アンスロピックは公開市場を開拓する最初の大手民間AI企業の1つとなる可能性がある。このデビューにより、数十億ドルの追加資本へのアクセスが可能になり、増大するコンピューティング インフラストラクチャのコストに資金を提供し、高度なハードウェアを確保し、専用のデータ センターを構築するために必要な莫大な財政滑走路が提供されます。",

    "id": "depleted-strategic-oil-reserve-nears-lev-2fd02e73",
    "title": "Depleted strategic oil reserve nears level that raises concerns about damage to caverns, operations",
    "titleJa": "枯渇した戦略的石油埋蔵量は、洞窟や操業への被害が懸念されるレベルに近づいている",
    "summaryJa": "在庫が40年ぶりの低水準に達する中、専門家らは今週、米国の戦略的石油埋蔵量を保管する洞窟が、イラン戦争に対応した急速な備蓄放出によって損害を受ける可能性があると警告した。専門家らは、洞窟が損傷すれば、将来のエネルギー緊急事態への対応がさらに困難になるだろうと述べた。戦略石油備蓄（SPR）の石油は、ルイジアナ州とテキサス州の湾岸沿いの主要な4か所の地下数千フィートにある60の塩の洞窟に保管されている。",
    "bodyOriginal": "The caverns that hold the U.S. strategic oil reserves could get damaged by the rapid release of stockpiles in response to the Iran war, experts warned this week as inventories hit a four-decade low.\nDamage to the caverns would make it more difficult to respond to future energy emergencies, the experts said. The oil in the Strategic Petroleum Reserve (SPR) is stored at 60 salt caverns thousands of feet underground at four major sites along the Gulf Coast in Louisiana and Texas.\nThe SPR has tumbled below 300 million barrels for the first time since it was filled in the early 1980s, according to Department of Energy data released Monday. Inventories are depleting as the U.S. releases 172 million barrels in response to the supply disruption caused by the Iran war. The SPR will sit at around 243 million barrels after the drawdown is finished.\nThe Energy Department has said at least 70 million barrels must remain in the reserve to safely manage the caverns. Amos Hochstein, a senior energy advisor to President Joe Biden, disputed that figure this week.\n\"Don't believe the people out of the government that are saying the SPR can go to 70 million barrels. It's nonsense,\" Hochstein told CNBC's \"Squawk Box\" Thursday. At that level, the reserve would be depleted to \"the point of never resurrecting it,\" he said.\nDepleting the reserve below 300 million barrels risks damage to the caverns, the former Biden administration official warned in June.\n\"I don't know anyone who believes we can go below 300,\" Hochstein told CNBC's Brian Sullivan at an Atlantic Council event. \"I know plenty of people who think we can't get near 300 because physically you will damage the caverns where the oil is stored.\"\nEnergy Department spokesman Ben Dietderich said claims that the SPR's storage caverns are at risk of collapse as oil is drawn down are false.\n\"The caverns are always full. All that changes is the ratio of oil and water that is filling them,\" Dietderich told CNBC in a statement. The Trump administration is \"responsibly managing the SPR as the critical national security asset it was designed to be,\" he said.\nBoth sides of the political aisle have voiced worries about the integrity of the salt caverns. Republican lawmakers raised those concerns when the Biden administration released a record 180 million barrels in response to Russia's invasion of Ukraine in 2022. The SPR fell below 350 million barrels in 2023 under Biden. It was refilled to around 415 million barrels before the Iran war.\nThe Government Accountability Office said in a May report that \"repeated partial drawdowns followed by refill can leach a single part of a cavern repeatedly, leading to undesirable shapes.\"\nThe majority of the SPR's caverns were found to be in \"very good condition\" after the 2022 drawdown, according to the GAO.\n\"However, every drawdown cycle expands cavern volume and reduces the spacing between caverns within the salt dome, which ultimately reduces their long-term viability,\" it said.\nOperational floor\nTo release oil from the SPR, operators pump water into the bottom of the caverns to displace the crude to the surface and pump it through wells into pipelines.\nSeventy million barrels is the strict physical minimum needed at the top of the caverns to keep the extraction pipes safely submerged in oil rather than water, said Siddharth Misra, a petroleum engineering professor at Texas A&M University.\nBut \"the practical operational floor for the crude inventory is between 250 million and 300 million barrels,\" Misra said in an email to CNBC. At current inventory levels, \"cavern integrity and overall operational capability are at an elevated risk,\" he said.\nWhen the inventory drops below 300 million barrels, the SPR loses its ability to pump oil at rapid speeds to address emergencies, Misra said. The system's pipes and pumps could also get damaged as the oil layer thins at the top and sludge rises toward the extraction intake at the cavern ceiling, he said.\nFresh water is often pumped into the caverns during rapid drawdowns, which dissolves the salt walls, Misra said. This \"creates flatter, less stable roof and severely thins the critical salt pillars that separate adjacent caverns, greatly increasing the geological risk of a structural cave-in,\" he said.\nThe SPR was originally designed for five full drawdowns. Instead, it has executed dozens of large and small releases over the past 40 years, Misra said.\n\"Because the system was not designed for this many cycles, the repeated injection of water and extraction of oil have caused severe cavern deformation, accelerated the rate of massive salt falls from the ceilings, and significantly weakened the overall structural integrity of the aging reserve,\" he said.\nEnergy Department officials told the GAO that they are \"holding the SPR infrastructure together with 'Band-Aids,' and that it is uncertain how long they will hold.\" More than a quarter of the SPR inventory was \"not available for drawdown due to a combination of construction outages and cavern outages\" as of December 2025, the GAO found.\nAnalysts at Rapidan Energy, for their part, estimated the SPR has a \"soft-ish floor\" of around 170 million barrels, below which \"cavern integrity and pumping infrastructure limitations argue against further draws.\nHochstein said a hurricane in Florida or Louisiana could put the U.S. in a tough position at current SPR levels. \"Below 300 million, which is where we are now, it is not that we can't do it, but it slows the flow and puts us in danger,\" he said.",
    "bodyJa": "在庫が40年ぶりの低水準に達する中、専門家らは今週、米国の戦略的石油埋蔵量を保管する洞窟が、イラン戦争に対応した急速な備蓄放出によって損害を受ける可能性があると警告した。\n専門家らは、洞窟が損傷すれば、将来のエネルギー緊急事態への対応がさらに困難になるだろうと述べた。戦略石油備蓄（SPR）の石油は、ルイジアナ州とテキサス州の湾岸沿いの主要な4か所の地下数千フィートにある60の塩の洞窟に保管されている。\nエネルギー省が月曜日に発表したデータによると、SPRは1980年代初頭に埋め立てられて以来初めて3億バレルを下回った。イラン戦争による供給混乱への対応として米国が１億７２００万バレルを放出しているため、在庫は減少している。ドローダウン終了後のＳＰＲは約２億４３００万バレルとなる。\nエネルギー省は、洞窟を安全に管理するには少なくとも7,000万バレルを埋蔵量に残しておく必要があると述べた。ジョー・バイデン大統領の上級エネルギー顧問エイモス・ホッホシュタイン氏は今週、この数字に異議を唱えた。\nホホシュタイン氏は木曜日、CNBCの番組「スコークボックス」で、「SPRが7000万バレルまで増量できると言っている政府関係者を信じてはいけない。ナンセンスだ」と語った。その水準に達すると、埋蔵量は「二度と復活できないほど」まで枯渇するだろうと同氏は述べた。\n埋蔵量が3億バレルを下回ると、洞窟が損傷する危険があるとバイデン政権の元高官は6月に警告した。\nホホスタイン氏はアトランティック・カウンシルのイベントでCNBCのブライアン・サリバンに対し、「300人を下回る可能性があると信じている人を私は知らない」と語った。 「物理的に石油が保管されている洞窟にダメージを与えることになるため、300 に近づくことは不可能だと考えている人をたくさん知っています。」\nエネルギー省報道官のベン・ディーデリヒ氏は、SPRの貯蔵洞窟が石油の採取により崩壊の危険にさらされているという主張は誤りであると述べた。\n「洞窟は常に満杯だ。変化するのは洞窟を満たしている油と水の比率だけだ」とディートデリッヒ氏はCNBCに声明で語った。トランプ政権は「国家安全保障の重要資産として設計されたSPRを責任を持って管理している」と述べた。\n政治界のどちらの側も、塩の洞窟の完全性について懸念を表明している。 2022年のロシアのウクライナ侵攻に対抗してバイデン政権が過去最高となる1億8000万バレルを放出した際、共和党議員らはこうした懸念を表明した。バイデン政権下の2023年にはSPRは3億5000万バレルを下回った。イラン戦争前には約４億１５００万バレルまで補充された。\n政府会計検査院は5月の報告書で、「部分的なドローダウンとその後の埋め戻しを繰り返すと、空洞の単一部分が繰り返し浸出する可能性があり、望ましくない形状につながる可能性がある」と述べた。\nGAOによると、SPRの洞窟の大部分は2022年の枯渇後も「非常に良好な状態」であることが判明したという。\n「しかし、ドローダウンサイクルごとに空洞の容積が拡大し、塩ドーム内の空洞間の間隔が狭くなり、最終的には長期的な生存可能性が低下する」と研究報告書は述べている。\nオペレーションフロア\nSPR から石油を放出するために、オペレーターは空洞の底に水を汲み上げて原油を地表に移動させ、井戸を通してパイプラインに送り込みます。\nテキサスA&M大学の石油工学教授シッダース・ミスラ氏によると、抽出パイプを水ではなく油に安全に浸すために洞窟の頂上で必要な物理的厳密な最低量は7000万バレルだという。\nしかしミスラ氏はCNBCへの電子メールで、「原油在庫の実質的な運用フロアは2億5000万バレルから3億バレルの間だ」と述べた。現在の在庫レベルでは、「洞窟の完全性と全体的な運営能力は高いリスクにさらされている」と同氏は述べた。\n在庫が3億バレルを下回ると、SPRは緊急事態に対処するために高速で石油を汲み出す能力を失う、とミスラ氏は語った。また、上部の油層が薄くなり、洞窟の天井にある取水口に向かってスラッジが上昇するため、システムのパイプとポンプが損傷する可能性があると同氏は述べた。\nミスラ氏によると、急速な水位低下の際には真水が洞窟にポンプで送り込まれることが多く、塩の壁が溶けてしまうという。これにより、「屋根がより平らになり、安定性が低くなり、隣接する洞窟を隔てる重要な塩の柱が大幅に薄くなり、構造的陥没の地質学的リスクが大幅に増加する」と同氏は述べた。\nSPR は当初、5 回のフルドローダウン向けに設計されました。その代わりに、過去 40 年間に大小問わず数十のリリースを実行してきたとミスラ氏は語った。\n同氏は、「このシステムはこれほど多くのサイクルを想定して設計されていないため、水の注入と石油の抽出を繰り返すことで洞窟に深刻な変形を引き起こし、天井から大量の塩が落ちる速度が加速し、老朽化し​​た埋蔵量の全体的な構造的健全性が著しく弱体化した」と述べた。\nエネルギー省当局者らはGAOに対し、「SPRインフラを『絆創膏』と一緒に保管しているが、どれくらいの期間保管するかは不透明だ」と語った。 GAOの調査によると、2025年12月の時点でSPR在庫の4分の1以上が「建設の停止と洞窟の停止の組み合わせにより取り崩しができない」という。\nラピダン・エナジー社のアナリストらは、SPRの「軟弱底」は約1億7000万バレルで、それを下回ると「洞窟の完全性とポンプインフラの制限により、これ以上の汲み出しには反対する」と推定した。\nホホスタイン氏は、フロリダ州やルイジアナ州でハリケーンが発生すれば、現在のSPRレベルでは米国は厳しい立場に陥る可能性があると述べた。 「我々が現在いる3億人以下では、それができないわけではないが、流れが遅くなり、我々を危険にさらすことになる」と同氏は語った。",
