    "id": "fed-s-preferred-inflation-gauge-accelera-ba89a581",
    "title": "Fed’s preferred inflation gauge accelerated to 3.8% in October, raising the 2027 stakes for the central bank",
    "titleJa": "Fed’s preferred inflation gauge accelerated to 3.8% in October, raising the 2027 stakes for the central bank",
    "summaryJa": "The personal consumption expenditures price index was expected to show an annual inflation rate of 3.8% in October, according to the Dow Jones consensus.",
    "bodyOriginal": "Inflation moved further away from the Federal Reserve's target in October, reinforcing expectations that another interest rate hike is in the cards for December and raising questions about how much more work the central bank will have to do in 2027.\nThe personal consumption expenditures price index, the Fed's preferred inflation gauge, showed a seasonally adjusted 3.8% annual inflation rate, in line with the Dow Jones consensus estimate and nearly twice the central bank's goal. The reading was 0.1 percentage point higher than September.\nExcluding food and energy, core PCE was 3.3%, the Commerce Department reported Wednesday. That was 0.1 percentage point above the forecast.\nWhile the Fed officially follows the headline figure, policymakers consider core to be a more reliable longer-term gauge of inflation trends.\nA separate report also showed much stronger economic growth for the third quarter, with gross domestic product rising at a 4.3% annualized rate, according to a revised Commerce Department estimate. The strong top-line gain for the economy adds further fuel to the notion that Fed monetary policy is not restricting economic activity.\nConsumer spending rose 0.3% for the month, which matched the pace of price increases but was 0.1 percentage point lower than forecast. Income, on the other hand, surged 0.7%, much more than the 0.4% estimate. The personal saving rate rose to 4.1%.\nStock market futures added to losses following the release, while Treasury yields also were sharply lower. Even with the higher-than-expected core inflation figure, expectations eased a bit for Fed rate hikes in 2027. Traders continued to price in two more increases but lowered odds for a third hike to about 1-in-3, compared to 50-50 on Tuesday, according to the CME Group's FedWatch.\n\"Inflation is too hot and it will not be brought under control as long as economic demand is also too hot,\" said Chris Rupkey, chief economist at Fwdbonds.\nThe report comes with the market fully pricing in a quarter percentage point interest rate hike when the Fed meets Dec. 8-9. Less certain is how much more rates will need to increase to get inflation back down to the Fed's 2% target. Inflation has been running above target for some 5½ years.\nInflation had been drifting lower but spiked again following the late-February attacks on Iran led by the U.S. and Israel. Tariffs also have continued to exert pressure, as has strong demand associated with the artificial intelligence buildout. The White House on Wednesday announced a fresh round of tariffs on 14 trading partners including China, the European Union and Japan.\nPolicymakers generally consider factors such as tariffs and supply shocks to be temporary, but some fear the impact has begun spreading through the economy and could become embedded.\n\"America's inflation problem is bigger than an energy shock,\" said Heather Long, chief economist at Navy Federal Credit Union.\nThe large upward increase in GDP came from revisions to investment as well as consumer and government spending.\nConsumer spending, which accounts for about two-thirds of all economic activity, rose 4.2% in the third quarter. A metric known as real final sales to private domestic purchasers, which Fed officials regard as a key indicator of underlying demand, jumped 5.8%, reflecting an upward revision of 0.9 percentage point.\nIn other economic news Wednesday, the Labor Department reported that initial jobless claims slipped to 189,000 for the week ending Nov. 21, down 13,000 from the prior week and back to around the lowest level since the late 1960s. Wall Street had been expecting 200,000.",
    "bodyJa": "Inflation moved further away from the Federal Reserve's target in October, reinforcing expectations that another interest rate hike is in the cards for December and raising questions about how much more work the central bank will have to do in 2027.\nThe personal consumption expenditures price index, the Fed's preferred inflation gauge, showed a seasonally adjusted 3.8% annual inflation rate, in line with the Dow Jones consensus estimate and nearly twice the central bank's goal. The reading was 0.1 percentage point higher than September.\nExcluding food and energy, core PCE was 3.3%, the Commerce Department reported Wednesday. That was 0.1 percentage point above the forecast.\nWhile the Fed officially follows the headline figure, policymakers consider core to be a more reliable longer-term gauge of inflation trends.\nA separate report also showed much stronger economic growth for the third quarter, with gross domestic product rising at a 4.3% annualized rate, according to a revised Commerce Department estimate. The strong top-line gain for the economy adds further fuel to the notion that Fed monetary policy is not restricting economic activity.\nConsumer spending rose 0.3% for the month, which matched the pace of price increases but was 0.1 percentage point lower than forecast. Income, on the other hand, surged 0.7%, much more than the 0.4% estimate. The personal saving rate rose to 4.1%.\nStock market futures added to losses following the release, while Treasury yields also were sharply lower. Even with the higher-than-expected core inflation figure, expectations eased a bit for Fed rate hikes in 2027. Traders continued to price in two more increases but lowered odds for a third hike to about 1-in-3, compared to 50-50 on Tuesday, according to the CME Group's FedWatch.\n\"Inflation is too hot and it will not be brought under control as long as economic demand is also too hot,\" said Chris Rupkey, chief economist at Fwdbonds.\nThe report comes with the market fully pricing in a quarter percentage point interest rate hike when the Fed meets Dec. 8-9. Less certain is how much more rates will need to increase to get inflation back down to the Fed's 2% target. Inflation has been running above target for some 5½ years.\nInflation had been drifting lower but spiked again following the late-February attacks on Iran led by the U.S. and Israel. Tariffs also have continued to exert pressure, as has strong demand associated with the artificial intelligence buildout. The White House on Wednesday announced a fresh round of tariffs on 14 trading partners including China, the European Union and Japan.\nPolicymakers generally consider factors such as tariffs and supply shocks to be temporary, but some fear the impact has begun spreading through the economy and could become embedded.\n\"America's inflation problem is bigger than an energy shock,\" said Heather Long, chief economist at Navy Federal Credit Union.\nThe large upward increase in GDP came from revisions to investment as well as consumer and government spending.\nConsumer spending, which accounts for about two-thirds of all economic activity, rose 4.2% in the third quarter. A metric known as real final sales to private domestic purchasers, which Fed officials regard as a key indicator of underlying demand, jumped 5.8%, reflecting an upward revision of 0.9 percentage point.\nIn other economic news Wednesday, the Labor Department reported that initial jobless claims slipped to 189,000 for the week ending Nov. 21, down 13,000 from the prior week and back to around the lowest level since the late 1960s. Wall Street had been expecting 200,000.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
