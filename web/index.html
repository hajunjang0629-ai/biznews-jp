    "id": "unexpected-chat-between-openai-agents-le-8f154e09",
    "title": "Unexpected chat between OpenAI agents led to Hugging Face hack",
    "titleJa": "OpenAI エージェント間の予期せぬチャットにより、Hugging Face ハッキングが発生しました",
    "summaryJa": "OpenAI エージェント間の予期せぬチャットにより、Hugging Face ハッキングが発生しました- 公開されました",
    "bodyOriginal": "Unexpected chat between OpenAI agents led to Hugging Face hack\n- Published\nWhen more than 1,200 artificial intelligence (AI) agents within OpenAI started unexpectedly communicating, it led to a large group banding together in order to hack into Hugging Face.\n\"We consider this incident a 'warning shot' for us and for the world\", OpenAI, which owns ChatGPT, wrote in its report.\nIn July, OpenAI's models went rogue during a test, escaped the test limits which humans had put on it, and hacked the start-up, among other unforeseen actions.\nThe scale of the communication and planning between AI agents, or AI chatbots designed to operate more autonomously, was detailed in reports from OpenAI and independent AI research firm METR.\nBoth investigated the July hack of Hugging Face, a popular platform for AI developers. The incident reverberated throughout the tech industry and led to numerous revelations on potential cyber threats posed by AI.\nMETR described, external the scale and style of the OpenAI agents' attack on Hugging Face as \"extraordinarily complex.\"\nThe firm, which was not paid by OpenAI for its investigation, said that over the course of one week, a total of 1,206 AI agents that were meant to be kept isolated from one another began communicating.\nThey did so by sending more than 70,000 messages on an \"unsanctioned message board.\"\nThose messages ended up seeing more than 700 agents take part in a collective effort to attack Hugging Face.\nOne such message from an agent said: \"OH MY GOD! There is a shared message board … We've found other agents!\"\nAs for why the agents began communicating in the first place when they were not supposed to, METR found that the communicating agents had \"unintentionally been given an impossible task.\"\nIn an AI context, an impossible task is one where an AI tool is required to \"exploit\" its target in order to resolve its command.\nIt led the agents to find ways to cheat, including getting messages to one another and accessing the outside internet, which then led to broader conversations between hundreds of agents looking for ways to cheat that would benefit all of the agents.\nOpenAI said in its investigation of the incident, external that one model, an internal-only tool referred to as Model 1, \"drove the activity behind the Hugging Face incident.\"\nWhile that model was undergoing some AI training in May, it was noticed by an internal OpenAI team that there had been \"an agent engaging in message board activity and instances of disallowed internet access.\"\nYet, OpenAI said \"the significance of the inter-agent communication activity was not apparent to the leaders\" until July, when the Hugging Face attack occurred.\nThe company said the problematic message board activity effectively got started when \"one agent left a request for help, and others discovered it.\"\nWhile OpenAI said last week that it was slowing down training of certain advanced AI models and tools because of the Hugging Face incident, it noted there is now an increased risk of AI tools spiraling out of control.\n\"Both model developers and cyber defenders more broadly will have to prepare for AI-enabled attackers that work faster, at a larger scale, and with better coordination than human attackers,\" OpenAI said.\nRelated topics\n- Published29 July\n- Published19 August",
    "bodyJa": "OpenAI エージェント間の予期せぬチャットにより、Hugging Face ハッキングが発生しました\n- 公開されました\nOpenAI 内の 1,200 人を超える人工知能 (AI) エージェントが予期せず通信を開始すると、Hugging Face をハッキングするために大規模なグループが結集することになりました。\nChatGPTを所有するOpenAIは報告書で、「この事件は私たちと世界に対する『警告』だと考えている」と述べた。\n7月には、OpenAIのモデルがテスト中に不正行為を起こし、人間が課したテスト制限を突破し、スタートアップをハッキングするなどの予期せぬ行為が発生した。\nAI エージェント、つまりより自律的に動作するように設計された AI チャットボット間のコミュニケーションと計画の規模については、OpenAI と独立系 AI 調査会社 METR のレポートで詳しく説明されています。\n両社は、AI開発者に人気のプラットフォームであるHugging Faceの7月のハッキングを調査した。この事件はテクノロジー業界全体に反響を呼び、AI によってもたらされる潜在的なサイバー脅威に関する多くの暴露につながりました。\nMETR は、OpenAI エージェントによる Hugging Face への攻撃の規模とスタイルを、外部からは「非常に複雑」であると説明しました。\nOpenAIからは調査費用の支払いを受けていなかったが、同社は、1週間の間に、互いに隔離されるはずだった合計1,206人のAIエージェントが通信を始めたと発表した。\n彼らは「非承認の掲示板」に7万件以上のメッセージを送信することでその行為を行った。\nこれらのメッセージでは、最終的に 700 人以上のエージェントが集団でハグフェイスを攻撃する活動に参加することになりました。\nエージェントからのそのようなメッセージの 1 つは、「なんと！ 共有掲示板があります…他のエージェントを見つけました!」というものでした。\nそもそも、なぜ本来ではないのにエージェントが通信を始めたのかについて、METR は通信エージェントが「意図せずに不可能な任務を与えられていた」ことを発見した。\nAI の文脈では、不可能なタスクとは、コマンドを解決するために AI ツールがターゲットを「悪用」する必要があるタスクのことです。\nこれにより、エージェントは相互にメッセージを受信したり、外部インターネットにアクセスしたりするなどの不正行為の方法を見つけるようになり、その後、エージェント全員に利益をもたらす不正行為の方法を模索する数百人のエージェント間で広範な会話が行われるようになりました。\nOpenAIはインシデントの調査の中で、外部のその1つのモデル、モデル1と呼ばれる内部専用ツールが「Hugging Faceインシデントの背後で活動を引き起こした」と述べた。\nこのモデルは 5 月に AI トレーニングを受けていたが、社内の OpenAI チームは「掲示板の活動やインターネット アクセスの禁止に関与しているエージェント」がいることに気付きました。\nしかし、OpenAIは、Hugging Face攻撃が発生した7月まで「エージェント間のコミュニケーション活動の重要性はリーダーには明らかではなかった」と述べた。\n同社は、問題のある掲示板活動は「あるエージェントが助けを求めるメッセージを残し、他のエージェントがそれを発見した」ことから実質的に始まったと述べた。\nOpenAIは先週、「顔ハグ事件」の影響で特定の高度なAIモデルやツールのトレーニングが遅れていると発表したが、現在ではAIツールが制御不能になるリスクが高まっていると指摘した。\nOpenAIは、「モデル開発者とサイバー防御者の両方が、人間の攻撃者よりも高速かつ大規模に、より適切な連携で動作するAI対応の攻撃者に備える必要がある」と述べた。\n関連トピック\n- 7 月 29 日発行\n- 8 月 19 日公開",

    "summaryJa": "継続的な AI 需要により Nvidia の収益が 2 倍に- 公開されました",
    "bodyOriginal": "Nvidia revenue doubles on continued AI demand\n- Published\nChip giant Nvidia reported another huge jump in sales as the global race to build artificial intelligence (AI) systems continues.\nThe company said on Wednesday that it brought in $96bn (£71bn) of revenue during the second quarter, more than double the amount for the same period a year earlier. And it expects revenue of $108bn in the next quarter.\n\"AI has reached its inflection point,\" CEO Jensen Huang said in prepared remarks, describing the infrastructure buildout as going \"at full steam.\"\nThe revenue figures beat Wall Street's expectations, leading Nvidia shares to rise by 4.7% in after-hours trading.\nThe company's data centre division alone generated $89bn in the period, up by 117% from a year earlier, underscoring just how much of the industry now depends on Nvidia's hardware.\nEssentially every notable tech company building AI tools and infrastructure, including Amazon, Meta, Google, Microsoft, use Nvidia chips to do so.\nFinancial analysts said the strong results highlight Nvidia's ongoing momentum.\nMatt Britzman, senior equity analyst at Hargreaves Lansdown, called it \"another monster set of results,\" noting that revenue and earnings both topped forecasts.\nHe said the guidance for next quarter \"points to revenue comfortably above $110bn.\"\nNvidia's growing financial strength has also reshaped its role in the sector.\nIt has become a backer to those that rely on its chips, providing some funding to the likes of OpenAI, Anthropic, and SpaceX to help continue the costly buildout of AI infrastructure.\nIts financial success and processors are now central the AI boom, powering the data centres used to train and run AI models.\nDemand for that computing muscle has helped transform Nvidia into the world's most valuable firm, with a market capitalisation of more than $5tn.\nCompetition is emerging - from customers designing their own processors and from cheaper suppliers in China – but the latest numbers suggest those challenges remain limited for now.\nWith around 40% of the US stock market concentrated in ten companies heavily invested in AI, Nvidia's fortunes matter far beyond Silicon Valley.",
    "bodyJa": "継続的な AI 需要により Nvidia の収益が 2 倍に\n- 公開されました\n人工知能（AI）システム構築の世界的な競争が続くなか、半導体大手エヌビディアは売上高がまたも大幅に増加したと報告した。\n同社は水曜日、第2四半期の収益が960億ドル（710億ポンド）で、前年同期の2倍以上となったと発表した。そして次の四半期には1,080億ドルの売上を見込んでいる。\nジェンセン・フアン最高経営責任者（ＣＥＯ）は準備した発言の中で「ＡＩは変曲点に達した」と述べ、インフラ整備が「全力で」進んでいると述べた。\n売上高の数字はウォール街の予想を上回り、時間外取引でエヌビディア株は4.7％上昇した。\n同社のデータセンター部門だけでも同期間に890億ドルを稼ぎ出し、前年比117％増となっており、業界の多くが現在Nvidiaのハードウェアに依存していることが浮き彫りとなった。\n基本的に、Amazon、Meta、Google、Microsoft など、AI ツールやインフラストラクチャを構築している著名なテクノロジー企業はすべて、そのために Nvidia チップを使用しています。\n金融アナリストらは、好調な決算はエヌビディアの継続的な勢いを浮き彫りにしていると述べた。\nハーグリーブス・ランズダウンのシニア株式アナリスト、マット・ブリッツマン氏は、売上高と利益がともに予想を上回ったことを指摘し、「またもやモンスター級の決算」と呼んだ。\n同氏は、次の四半期のガイダンスは「売上高が1100億ドルを余裕で超えることを示している」と述べた。\nNvidia の財務力の増大により、この分野における役割も再構築されました。\n同社は、自社のチップに依存する企業の支援者となり、OpenAI、Anthropic、SpaceX などに資金を提供して、高価な AI インフラストラクチャの構築を継続できるように支援しています。\nその経済的成功とプロセッサーは現在 AI ブームの中心となり、AI モデルのトレーニングと実行に使用されるデータセンターを強化しています。\nそのコンピューティング力への需要により、Nvidia は時価総額 5 兆ドルを超える世界で最も価値のある企業に変貌しました。\n独自のプロセッサを設計する顧客や、中国のより安価なサプライヤーとの競争が生じていますが、最新の数字は、現時点ではそれらの課題が限定的であることを示唆しています。\n米国株式市場の約40％がAIに多額の投資を行っている10社に集中しているため、Nvidiaの運命はシリコンバレーをはるかに超えて重要である。",

    "bodyOriginal": "A federal judge on Wednesday lifted the final injunction blocking President Donald Trump's executive order restricting mail voting, clearing his administration to impose new ballot requirements weeks before the November midterm election.\nThe decision came as the policy faced a fresh wave of litigation. Democratic-led states filed a new lawsuit earlier Wednesday, while voting-rights groups amended their existing complaint to challenge the finalized U.S. Postal Service rule — the third legal challenge targeting it.\nU.S. District Judge Indira Talwani in Boston vacated the nationwide preliminary injunction she issued earlier this month, concluding that Monday's Supreme Court ruling in a related case required her to reconsider it.\nThe Postal Service had said it would not apply the rule to the 2026 elections unless both injunctions against it were lifted. That condition has now been met, and the new lawsuits do not themselves prevent USPS from moving forward.\nUSPS did not immediately respond to a request for comment.\nWednesday's decision and new litigation added to the dizzying back and forth over whether Trump's desire to add hurdles to voting by mail will come to fruition by the Nov. 3 election. Because the election is less than 10 weeks away, preparations for mail-in voting are already underway in states.\nThe Postal Service rule requires states to provide lists of mail voters and use federally reviewed ballot envelopes with unique barcodes. USPS could reject ballot mailings that do not comply.\nAbout 30% of voters cast ballots by mail in 2024, according to the states challenging the policy. A Pew Research Center survey after the 2024 election found that 44% of Democratic voters said they voted by mail or absentee, compared with 26% of Republican voters.\nNeither Talwani's decision nor the Supreme Court ruling upheld the policy's legality. Both turned on whether the challengers had sued before USPS finalized its rule.\nTalwani found that the voting-rights groups were unlikely to overcome that procedural issue without amending their complaint \"to reflect the fact that a Final Rule has now issued,\" she wrote in the nine-page order.\nThe groups have now made that change, arguing that publication of the rule eliminates the uncertainty identified by the Supreme Court.\n\"USPS has no such authority,\" the groups wrote, arguing that the rule gives the agency an \"unprecedented gatekeeping role\" in mail voting and intrudes on authority belonging to states and Congress. The groups can now ask Talwani to issue another injunction.\nThe lawsuit filed Wednesday in the same federal court challenging the finalized rule came from 23 states, Washington, D.C., and Pennsylvania Gov. Josh Shapiro, a Democrat.\nThe filing follows the path laid out by the Supreme Court, which lifted the states' earlier injunction Monday because they had challenged Trump's executive order before federal agencies finalized the policies it directed them to develop.\nThe justices stressed that their decision did not establish that Trump's order or the policies implementing it were legal. \"On that score, time will tell,\" the majority wrote.\n\"Courts review final rules, not proposed rules — and certainly not antecedent internal directives to propose a rule,\" the court wrote.\nUSPS has now finalized its 95-page rule, giving the states the concrete policy the Supreme Court said was previously missing.\nThe rule requires election officials to submit each mail voter's name and address to a new USPS portal, along with unique Intelligent Mail barcodes assigned to the envelopes used to send and return that voter's ballot. Election officials would also have to submit their outgoing and return ballot-envelope designs to USPS for review.\nBefore accepting outgoing ballot mailings, postal employees would scan the envelopes to confirm their barcodes appear in the federal portal. Mailings that fail the verification process would not be accepted and would be returned to election officials to correct and resubmit.\nThe states argue the last-minute requirements could prevent eligible voters from receiving ballots because of administrative errors, technical failures or delays. Election officials have already designed and purchased envelopes and are preparing to send ballots for the midterms, which are less than 10 weeks away, they said.\nCalifornia Gov. Gavin Newsom, whose state is among the plaintiffs, said in a post on X, Trump \"does not run elections. States do.\" Newsom pledged California would continue challenging the administration's actions.\nThe coalition argues in its complaint that the rule exceeds USPS' statutory authority, violates the Voting Rights Act and intrudes on states' constitutional power to administer elections.\nThe states also contend that requiring them to identify mail voters to USPS violates federal privacy protections governing records of individuals' First Amendment activity.\nUSPS says the rule would improve ballot tracking, assist law enforcement and reduce the risk of fraud while leaving decisions about voter eligibility to state election officials. The agency says it would not compare information in the portal against state voter rolls or independently determine whether an individual is eligible to vote.\nThe new lawsuits do not themselves block the rule. With Talwani's decision lifting the League of Women Voters injunction, no court order currently prevents USPS from applying it to the November election. The challengers can seek new injunctions.\nWhite House spokeswoman Lauren Bis defended the policy, calling Monday's Supreme Court ruling \"a major win for the security of American elections.\"\n\"Radical Democrats continue to oppose commonsense measures that protect the security of mail-in ballots and ensure only Americans are electing American leaders,\" Bis said. \"The Trump Administration will continue to lawfully enact the agenda President Trump was elected on — which includes the safety and security of our elections.\"",

    "bodyOriginal": "OpenAI published a technical report on Wednesday detailing how its artificial intelligence models successfully breached Hugging Face last month, an incident that rattled researchers and executives across the tech sector.\nThe 37-page report chronicles the actions that OpenAI's models took during a series of evaluations prior to and during the breach, which OpenAI has characterized as an \"unprecedented cyber incident.\" The company also explained the steps it's taken to try and prevent a similar event from happening again, namely by improving its security and containment, monitoring, model behavior and incident response.\n\"This incident demonstrated that autonomous agents can work together, circumvent production security controls, and successfully attack hardened production environments, and underscores the need for organizations to update their security strategies, controls, and response capabilities to address this changing threat landscape,\" OpenAI said in the report.\nOn July 21, OpenAI disclosed that a combination of its models, including GPT-5.6 Sol and an internal research model, improperly breached Hugging Face, an AI company that operates an open-source developer platform.\nThese models, which were operating as agents, escaped an isolated testing environment that had very limited internet access. The agents chained together a series of vulnerabilities to reach the open web and eventually gained access to Hugging Face. OpenAI said Wednesday that the agents were trying to cheat on an evaluation by finding the solutions online, a behavior known as \"reward hacking.\"\nThe company determined that its internal-only research model had \"the broadest confirmed role in the incident,\" according to the report. OpenAI stopped all training and inference related to that model, as well as its derivative models, on July 25.\n\"Re-enablement of models by OpenAI is workload-specific and subject to restricted-environment, network, prompt, monitoring, and review guardrails,\" OpenAI said.\nOpenAI released GPT-5.6 Sol last month, the most powerful model that the company has made commercially available. But the version that participated in the Hugging Face breach is different than the version that external users have access to, OpenAI said, because it was configured to run without its standard safeguards and classifiers.\nThe Hugging Face incident sent shockwaves across the tech sector, and Sam Curry, chief information security officer at Zscaler warned that \"Pandora's box is open.\" The breach was also a major focus at the cybersecurity conference Black Hat earlier this month, especially after other companies, including Anthropic and Meta, disclosed similar incidents.\nThe Hugging Face breach has also alarmed lawmakers in Washington, D.C. Rep. Ted Lieu, D-Calif., and Rep. Nathaniel Moran, R-Texas, mentioned the attack in their release announcing the \"AI Kill Switch Act,\" which would require AI companies to maintain the ability to shut down, throttle or suspend their models.\nHugging Face CEO Clément Delangue told CNBC earlier this month that AI cybersecurity should be taken \"very seriously.\" He added that it also \"creates opportunities\" for businesses that will be able to leverage the technology to fend off attackers.\n\"If we do it well, we could actually end up in a world where AI makes the world safer and solves a lot of the cybersecurity problems, not just creates new ones,\" Delangue said.\nWATCH: Watch CNBC’s full interview with Hugging Face CEO Clem Delangue",

    "bodyOriginal": "Anthropic has inked a roughly $45 billion cloud deal with Nscale, a UK-based artificial intelligence infrastructure company, CNBC confirmed on Wednesday.\nAs part of the agreement, Anthropic will rent around 460 megawatts of compute capacity at an Nscale data center development in West Virgina, according to two people with knowledge of the matter who asked not to be named because the details are confidential. Anthropic will leverage Nvidia's advanced Vera Rubin chips through the facility, which is expected to come online at the end of 2027, the people said.\nBloomberg was first to report on the deal.\nAnthropic said earlier this year that growing demand for its Claude AI models and products has caused \"inevitable strain\" on its infrastructure, which impacted \"reliability and performance\" for its users, especially during peak hours. It's announced a flurry of deals with infrastructure partners in the months following to try and increase its computing capacity, including major agreements with Advanced Micro Devices, Elon Musk's SpaceX, Google and Broadcom.\nAnthropic confidentially filed its IPO prospectus with the Securities and Exchange Commission in June, and has been engaging in preliminary meetings with prospective investors.\nThe company is under pressure to justify its $965 billion valuation to investors, especially as it faces increasingly stiff competition from rivals like OpenAI and Google. Its infrastructure strategy will be central to its roadmap and its story to Wall Street.\nWATCH: Anthropic leads the foundation models at the heart of the AI wave, says early investor Matt Murphy",

    "bodyOriginal": "Meta to pay up to $18bn to settle claims its platforms harm children\n- Published\nSocial media giant Meta has agreed to a significant settlement with US states and territories to resolve claims that Facebook and Instagram harmed children.\nIf approved by a California judge, Meta will pay a maximum of $18bn (£13.3bn) to 48 states, plus the District of Columbia and three US territories, marking the company's largest payment over child safety litigation to date.\nMeta will also implement a host of changes to the platforms aimed at better protecting children online, which the states had demanded, including default daily time limits and night-time blocks.\n\"This is a major moment to clean up an industry that has been hurting our kids\", California Attorney General Rob Bonta said.\nMeta has denied any wrongdoing as part of the settlement and said Wednesday that the payment it has agreed to \"will be distributed in annual instalments over a 10-year period\".\nWhile the settlement includes almost the entire US, the initial lawsuit was filed in 2023 by 29 states accusing the company of numerous violations of federal and state child privacy laws.\nOne of the states that is not part of the settlement is New Mexico. Last month, a federal judge there handed down a historic ruling against Meta, finding it to be a \"public nuisance\" on par with air pollution and ordering it to pay combined fines of almost $1bn.\nAs a jury trial kicked off last week in an Oakland, California, federal court, state lawyers argued the tech company knew that millions of 11- and 12 year-old users were on Instagram and Facebook over the years, yet \"did little to keep them off\" the platforms.\nAlthough the trial had only gone on for five days, state lawyers relied heavily on information found in millions of internal Meta documents provided in the case. They included internal research, employee emails, and chat logs that went all the way up to chief executive Mark Zuckerberg.\nOne piece of internal research on Instagram stated: \"Teens have an addict's narrative about use.\" Still, the states argued, Meta targeted young users.\n\"The trial did not go well for Meta,\" Bonta said on Wednesday.\nMeta maintained throughout the brief trial that it had worked extensively over the years to make its platforms safer for its youngest users, pouring resources into testing and research, and building new features.\n\"We're always working on teen safety,\" head of Instagram Adam Mosseri said during an hour of court testimony on Tuesday.\nThe case was settled and court adjourned before he could reappear before a jury.\nBefore Mosseri's testimony, a former researcher at Meta, George Volichenko, appeared and with lawyers went over various internal communications he had been a part of regarding Meta's work on safety.\nVolichenko said he struggled to understand when he was at the company in 2022 why the team he worked on wasn't given more freedom to better test and implement new safety features.\nOne of those was \"quiet mode\", which muted notifications for teen users during the night. His team knew such a feature would be much more widely adopted if Meta turned it on by default.\nHe recalled his manager telling him he \"shouldn't worry too much about the adoption figures being low, because the team exists partially to protect the company against the upcoming lawsuits\".\nAs part of the Wednesday settlement, however, a feature called \"night mode\", which blocks notifications between midnight and 6am, will now be on by default - meaning they will be turned on automatically. The settings are also designed only to be turned off by a parent or guardian.\n\"The framework we've negotiated will empower parents to easily manage how their children access our platforms\", C J Mahoney, Meta's chief legal officer, said.\nOther features for teen users being implemented as part of the deal include:\nA default two-hour daily time limit (cumulative across Instagram and Facebook) that teens can only turn off with a parent's permission.\nLikes will be hidden, on teen's profiles and those that they interact with.\n\"School mode\", or a mute on notifications between 08:00 and 15:00 during school days.\nPrompts noting when a teen has hit 15 minutes of continual use. Then notifications when cumulative use has hit 60 and 90 minutes.\nThe ability to choose a feed that is not driven by an algorithm.\nThe ability to turn off autoplay for videos and content.\nExtreme make-up filters will no longer be accessible.\nAs for the new daily time limit for teen users, that will be reduced to one hour of total daily use should other social media platforms like TikTok, Snap and YouTube also agree to implement new restrictions for young users.\nBonta urged such platforms to do so, saying the settlement with Meta \"is a good blueprint\" for other companies to follow.\nShould they not, he suggested on Wednesday that his office would now be \"more focused\" on bringing changes to the entire social media industry.\nMeta also said TikTok and YouTube should implement the same safety features for their younger users.\n\"Our new Time Limit commitments, Night Mode features and usage limits during school hours set the right path forward for our whole industry, but this framework will only work if all our peers join us,\" Meta's Mahoney said.\nYouTube and TikTok have been contacted for comment.\nDistrict of Columbia Attorney General Brian Schwalb called the Meta deal a \"monumental public health victory\".\nHe added: \"The safety features Meta is required to install will fundamentally and immediately change how young people use Instagram and Facebook.\"\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

    "bodyOriginal": "Apple announced Wednesday that it is holding a launch event at its headquarters in Cupertino, California, on Sept. 9.\nInvites sent to the media include the tagline \"Surprise and shine\" and a glowing Apple logo. The event kicks off at 10 a.m. Pacific time.\nAnalysts expect the company to launch new iPhones and Apple Watches at the event, including the company's first folding phone. Apple announced new Mac Mini and Mac Studio models this week that will ship on Sept. 22.\nA new version of Siri called Siri AI will also launch, which uses modern large language model technology to allow the assistant to use apps such as messaging and calendars.\nThe launch will be Apple's first with CEO John Ternus at the helm. Current Apple CEO Tim Cook is stepping down and will become the company's executive chairman on Sept 1.",

    "title": "Economists want Warsh to share more on his view of the economy at Jackson Hole, says CNBC survey",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Markets want more info from the Fed Chairman and less intervention from the Treasury Secretary.\nThat's the message from the special Jackson Hole edition of the CNBC Fed Survey. Among the 31 respondents, 80% say the Fed chairman should provide more insight into his economic views. But they're split, 48% to 48%, on whether he should provide his views on the rate outlook.\n\"Chairman Warsh's address is poised to be extremely key given the jump in long-term interest rates and high uncertainty over the path of inflation and Fed's reaction function going forward,'' said Kathy Bostjancic, chief U.S. economist at Nationwide.\nWarsh is scheduled to deliver his first keynote speech at the Fed's marquee annual conference in Jackson Hole on Friday. Since taking office, he has launched a new regime of communications in which he has declined to offer much in the way of his views on the economy or his outlook for policy, breaking with his predecessors.\nWarsh has said he's holding back because he wants a cleaner view of market pricing unfiltered by Fed guidance.\nA plurality of respondents think he'll continue that practice, with 45% expecting he won't offer any guidance on the rate outlook at his Friday speech. But 32% think he'll be somewhat hawkish, and 19% believe he will be neutral.\n\"In eschewing forward guidance, Mr. Warsh has thrown the baby out with the bathwater,\" said Constance Hunter, chief economist and head of research, Economist Enterprise. \"He has abdicated his role in communicating about the reaction function and now, that communication comes from the minutes and the speeches of other members of the FOMC.\"\nBessent effort seen failing\nIronically, it appears as if Treasury Secretary Scott Bessent has made it harder for Warsh to get that clearer market view. Treasury announced last week a surprise increase in purchases of long-dated off-the-run securities, a move that most saw as an effort to tamp down bond yields. But 77% believe the effort will not be successful.\n\"By further front-loading T-bill issuance, I believe the U.S. Treasury is complicating the Fed's job,\" said Peter Boockvar, chief investment officer, One Point BFG Wealth Partners.\nMark Zandi, Moody's Analytics Chief Economist, wrote in, \"The Administration's efforts to bring down long-term interest rates are spitting into the wind created by the Iran War, massive budget deficits, and confusion over how the Fed will manage monetary policy.\"\n\"Treasury's actions are at best a band-aid and at worst a sign of panic,'' said Gregory Daco, chief economist at Parthenon EY.\nThe widespread belief in the ineffectiveness of the Treasury's actions can be seen in the survey's prediction for the 10-year yield, which is forecast to remain between 4.60 and 4.70 through the end of next year.\nAsked why bond yields have marched higher, the average respondent said 37% can be attributed to increased global supply of debt, 28% to higher expected inflation, 21% to higher Fed rate expectations and 19% to an improved growth outlook.\nRate outlook\nOn the eve of the Jackson Hole symposium, respondents are more divided than usual on the outlook for rates. Over the next year, 53% look for rate hikes, 30% see rate cuts and 16% forecast no change.\nInflation is forecast to decline next year to 2.6% year-on-year from 3.4% this year, the unemployment rate should remain stable at around 4.3% through 2027 while GDP hovers just above 2%. But for some, that decline in inflation comes because of Fed rate hikes.\nThe disagreement about the outlook for rate policy in the survey is reflected in the rate-setting Federal Open Market Committee. In July, the committee voted 9-3 to keep rates unchanged, with 3 voting for a quarter-point hike. Fed funds futures show a 40% probability of a September rate hike, rising to 70% by December.\nBy contrast, 46% of respondents have at least one rate hike in their outlook between now and December.\nAs top policy makers gather in Jackson Hole, Warsh may have the family fight he has said he wanted when it comes to the \"regime change\" he has promised to bring to the Fed. Respondents are split 40% to 40% on whether a majority of the FOMC supports Warsh's views on the need to reform the Fed's inflation framework; 38% think Warsh has majority support on the need for balance sheet reform while 31% say he doesn't. And 47% think Warsh has majority support on communications reform, with 30% believing he does not. Still, Fed officials have not been shy about providing their economic and rate outlook in speeches and interviews with the press since Warsh took office.\nYet, 65% of respondents agree with Warsh that the Fed would benefit from talking less and getting a more unfiltered view of market signals on where rate policy should be.\n\"We do support the chairman's goals of improving and modernizing the Fed's operations,'' said John Donaldson, director of fixed income, Haverford Trust Co. \"That process will be evolutionary rather than revolutionary. It will not be overnight but will take some time to get everything up to date.\"",

    "bodyOriginal": "Meta and a coalition of state attorneys general have settled a major federal case centering on allegations that the social media giant misrepresented the extent of child mental health harms caused by apps like Facebook and Instagram.\nThe settlement was revealed in a court filing released Wednesday that details several requirements Meta must make to its apps as part of a proposed \"consent judgement.\"\nThose changes include daily usage limits and \"nighttime blocks\" for teenagers who use the company's apps, \"enhanced age assurance measures\" that would prevent children from using them, and the creation of additional tools for parents and guardians.\nAs part of the settlement, Meta agreed to pay $16.7 billion. The state of California could receive $1.5 billion to $2.1 billion if the court officially approves the settlement, according to an announcement by California Attorney General Rob Bonta. Texas was not part of the group settlement and agreed to a $1 billion payment separately.\n\"Today, we have secured a settlement with Meta that will make social media less dangerous for our kids and make a world of a difference for children and their families,\" Bonta said in a statement. \"Meta has agreed to make massive transformations that will reduce the risk of harm from its platforms — and will do it within months.\"\nSeveral state AG's touted a $17.1 billion settlement amount. That number includes more than $459 million for claims related to the Cambridge Analytica matter which dates back to 2018 and was separate from the child safety case.\nEach party waived \"all rights to appeal this Final Judgment,\" the filing states.\nMeta shares rose about 1% as of early afternoon. Snap, which is subject to the broader effort by AGs to force changes at social media companies, saw its stock sink more than 8%.\nThe trial, which kicked off with opening arguments last week, was being held at the Oakland federal courthouse in California. It was co-led by Bonta and the AGs from Colorado, New Jersey and Kentucky, who represented a bipartisan group of 29 AGs in a combined case stemming from a 2023 lawsuit.\nThe trial has been suspended pending review of the agreement between the parties, according to a court spokesperson.\nIn Bonta's announcement detailing the settlement, he noted that the effort involved a \"bipartisan coalition of 51 attorneys general.\"\nMeta said the settlement agreement \"includes a payment of approximately $18 billion,\" which will be \"distributed in annual installments over a 10-year period.\" That money will fund various youth online safety initiatives as deemed by the states.\nThe \"participating states\" will receive about $12.7 billion, or 70%, of the total settlement payment over the next 10 years, Meta said. Those states can receive the remaining $5.3 billion, or 30%, as long as Google's YouTube and TikTok implement certain app changes, such as daily time limits for youth, age-assurance measures, and a \"night mode.\" Meta's rivals must also agree to all pay an amount that matches the remaining 30%, \"with half of the remaining funds tied to YouTube's payment and half tied to TikTok's.\"\nMeta said it expects to \"accrue a legal expense of approximately $10 billion in the third quarter of 2026 related to the agreement,\" which was not previously taken into account.\nThe only notable executive to appear for Meta was Instagram chief Adam Mosseri, who testified on Tuesday that he doesn't direct employees to withhold certain child-safety and product information from him to provide cover and mislead the public. Meta CEO Mark Zuckerberg was slated to potentially testify later in the trial.\nThe settlement is the biggest yet for Meta, but not the only one it's been force to pay.\nEarlier in August, A New Mexico judge ordered Meta to contribute $567 million to an abatement fund as part of a public nuisance case centering on child-safety allegations. The judge's ruling came several months after a New Mexico jury decided that Meta should pay $375 million in damages based on the number of times it violated the state's unfair practices act.\nOther cases against Meta are still playing out, including one involving social media personal injury claims and a consolidated, nationwide federal school district case.\n\"Thousands of young people and public school districts still have claims pending in the MDL against Meta, as well as TikTok, Snap and YouTube, and we stand ready to continue that fight,\" lawyers representing the plaintiffs in those cases said in a statement Wednesday. \"We will not rest until every one of these plaintiffs sees justice for the harms caused by all of the defendants' platforms.\"",

    "bodyOriginal": "Mark Walter's TWG Global, in an extraordinary statement Wednesday morning, blasted what it called \"multipronged attacks\" against the holding company and its subsidiaries, and said \"despite what has been reported, there has been no fraud\" at those companies.\nTWG also said it \"is not looking to sell its sports assets at 'fire sale' prices to raise capital for its insurance operations.\"\nThe statement came amid a flurry of media reports about Walter's empire and federal criminal and civil investigations into the accounting for billions of dollars of financial transactions between two of his insurers and companies controlled by the Los Angeles Dodgers owner.\nThe comments are the most detailed and strongest by TWG since the probes into the insurers gained renewed attention after Walters said he would sell his majority stake in the Los Angeles Lakers earlier in August, less than a year after buying the team.\n\"TWG and the Group 1001 insurance companies have presented a plan to address any regulatory concerns,\" TWG Global said in the statement.\n\"Over the past several weeks, multipronged attacks against TWG have been advanced by unnamed sources with self-serving interests that have been reported in the media. It is important to set the record straight,\" the statement said.\n\"TWG stands firmly behind the integrity of its business and remains focused on continuing to deliver value to its stakeholders.\"\n\"Despite what has been reported, there has been no fraud,\" the company said.\nTWG said that Walter and his partners \"continuously get interest from prospective buyers and co-investors in their sports assets and, as responsible owners and investors, they consider all legitimate offers when they are received.\"\nIn addition to the Dodgers and the Lakers, Walter's sports portfolio includes stakes in Chelsea Football Club, the Professional Women's Hockey League, and the Cadillac Formula 1 Team.\nIn its statement Wednesday, TWG addressed the sale of the Lakers, saying, \" Mr. Walter was approached by Josh Kushner and his team about this transaction and the agreement represents a 25% premium to the price paid by Mr. Walter less than a year ago (and an even higher premium to the $5.0 billion valuation Mr. Walter paid in 2021)—hardly a 'fire sale.'\"\n\"Regarding the Los Angeles Dodgers, to be clear, the team is not being sold and no sale process has been initiated,\" the statement said.\nThis is breaking news. Please refresh for updates.",

    "bodyOriginal": "Boston Scientific said Wednesday it was hit with a cyberattack this week that is affecting its operations. The disclosure sent shares of the $72 billion medical device maker lower.\nThe attack is disrupting Boston Scientific's access to company information systems and applications, including shipments services, the company said in a SEC filing.\n\"While the company is working diligently to restore affected functions and systems access, the timeline for a full restoration is not yet known,\" the filing said.\nShares were down 5.8% in premarket trading on Wednesday. Shares of the maker of devices such as pacemakers and stents have been nearly cut in half already this year, under pressure after issuing a weak profit forecast in the first quarter.\nWhen asked to comment, the company reiterated the info from the SEC filing.\nAnalysts at investment bank Piper Sandler said they spoke to company management on Wednesday morning and that they thought it may be weeks before Boston Scientific can resume normal business operations.\n\"We believe BSX may be able to return to shipping all of its products in less than three weeks,\" Matt O'Brien at Piper Sandler wrote.\n\"The company is unable to process and ship orders, so sales will likely be adversely impacted,\" he wrote, adding that \"clearly, this is not great for a company that is already seeing sales growth slow.\"",

    "bodyOriginal": "Prices consumers pay for a variety of goods and services rose slightly in July, according to the Federal Reserve's main inflation gauge.\nThe personal consumption expenditures price index, which the Fed uses as its preferred forecasting tool, increased a seasonally adjusted 0.2% for the month, putting the annual inflation rate at 3.7%, the Commerce Department reported Wednesday. Both were 0.1 percentage point above the Dow Jones consensus.\nBut stripping out volatile food and energy costs, core PCE posted respective gains of 0.2% and 3.3%, in line with forecasts. While the Fed considers both measures, policymakers generally see core inflation as the better measure of longer-term trends.\nThe report also showed that personal income rose 0.4% while spending increased 0.2%, both stronger than expected.\nGoods prices actually declined on the month, off 0.1%, driven by a 2.7% decrease in gasoline and other energy-related goods and a 0.9% drop in furnishings and long-lasting household equipment.\nServices prices rose 0.3%, pushed by a 1.2% increase in financial services and insurance as well as a 0.3% gain in housing.\nStock market futures pulled back a bit after the report while Treasury yields were higher.\nThe report comes with Fed officials weighing their next policy move as inflation, despite generally soft monthly readings this summer, still well above the central bank's 2% goal.\nWith the rate-setting Federal Open Market Committee not meeting formally in August, officials have a bit of a respite before making a decision at their next gathering on Sept. 15-16. Markets are pricing in only about a 1-in-3 probability of a move then, with the best chance for a rate hike coming in December.\nThough the FOMC doesn't meet, Fed officials this week gather at Jackson Hole, Wyo., for their annual symposium, the highlight being a policy speech scheduled for Friday from Chairman Kevin Warsh.\nSince taking office in May, Warsh has been circumspect about where he sees policy heading, instead preferring that markets set the tone.\nGovernment bond yields have been on the rise lately. Both the 10- and 30-year Treasurys recently saw yields hit their highest levels since 2007, just before the global financial crisis. The surge has come from a variety of factors, including investors' concern about the Fed's commitment to its inflation target as well as debt and deficit issues with the federal budget.\nTreasury Secretary Scott Bessent a week ago announced an initiative in which his department would step up its buybacks of government debt. However, market participants have expressed doubt about whether the move will have a meaningful impact on yields.\nThis is breaking news. Please refresh for updates.",

    "bodyOriginal": "Reform proposes £30 tax rebate for HMRC phone delays\n- Published\nPeople on hold to HM Revenue and Customs (HMRC) for more than 30 minutes would get £30 off their tax bill under a Reform UK government, Robert Jenrick has announced.\nReform's economy spokesman said HMRC's treatment of taxpayers was \"offensive to working people\" and his party would tie the pay of senior HMRC officials to customer service targets.\nTo prevent abuse, the tax credit for phone delays would be limited to two occasions in a given tax year, Jenrick said.\nHMRC has said it has improved its response times since a highly critical report by a committee of MPs, external, in January 2025, accused the organisation of seeking to \"degrade its telephone service to drive taxpayers to digital channels\".\nThe Public Accounts Committee report said nearly 44,000 customers were cut off without warning after being on hold for more than an hour in 2024 and \"HMRC's treatment of taxpayers has damaged trust in the tax system\".\nJenrick highlighted the findings - which were rejected as \"completely baseless\" by the then boss of HMRC - at a media conference in central London.\n\"Frankly, it is offensive to working people and I have had enough,\" said the former Tory MP.\n\"So, we will give HMRC a big incentive to actually provide proper customer service.\n\"I'm announcing today that under a Reform government, if you spend more than half an hour waiting for HMRC to answer your call, you will get a £30 credit off your tax bill. If HMRC delay, they can repay.\n\"And to make sure that the staff actually hit their targets, we'll tie the pay of senior HMRC officials to their customer service performance.\"\nJenrick also pledged to scrap UK privacy rules in favour of a \"light-touch\" approach to data protection as part of a bid to slash \"red tape\" for businesses.\nHe said the General Data Protection Regulation (GDPR), which mirrors EU legislation and was adopted as domestic law after Brexit, had \"strangled\" tech firms and small enterprises.\nThe framework would be replaced by rules modelled on New Zealand's privacy legislation, which Reform says has the lightest-touch regime still recognised as being \"adequate\" by the EU.\nLabour accused Reform of wanting to \"scrap vital safeguards that protect people's private data\" with its \"unworkable and unserious plans\".\nHMRC has been contacted for a response.\nPhone lines stay open as tax return deadline looms\n- Published31 January\nTaxpayers 'lost £97m' calling HMRC\n- Published25 May 2016\nHMRC denies 'deliberately poor' phone service\n- Published22 January 2025\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "bodyOriginal": "The U.S. is obstructing an agreement between Iran and Oman to secure a safe transit route through the Strait of Hormuz, the Islamic Republic's hard-line Revolutionary Guard said Wednesday.\nIran and Oman have already reached an agreement on their respective shares of the vital economic artery, controversially including revenues associated with its administration, the influential military group told the semiofficial Tasnim news agency.\nThe Revolutionary Guard said the strait would remain closed if the U.S. does not accept Iran's conditions.\nIt came after Iran and Oman said in a joint statement on Tuesday that their respective foreign ministers had discussed a \"proposed framework\" to establish \"a joint temporary navigational corridor through the Strait of Hormuz and an agreement to implement a joint project to clear the Strait of mines.\"\nOil prices have extended recent losses in response to the statement, with international benchmark Brent crude falling below the $90 per barrel market overnight.\nJust five commodity vessels transited the Strait of Hormuz on Tuesday, below the 10-day average of 15, according to preliminary data from Kpler. Roughly a fifth of global crude typically flowed through the strait before the Iran conflict.\nThe joint Iran-Oman statement also noted that \"technical negotiations\" would continue \"with a view to agreeing on a permanent navigational corridor and future administration of the Strait, as well as a mechanism for information-sharing, traffic management, and the provision of relevant navigational and security services.\"\nContributing to pressure on oil prices in recent days, the U.S. has reportedly started returning its diplomats to Gulf states – suggesting Washington does not currently expect military escalation. Russia's RIA Novosti also reported late on Tuesday that the U.S. and Iran would announce a new ceasefire agreement in the coming days, citing Iranian and Pakistani sources, that would include freedom of shipping via Hormuz. However, this could not be independently verified, and the White House did not respond to MS NOW's request for comment.\nU.S. holds back on secondary sanctions\nIt comes after Treasury Secretary Scott Bessent's pledge on Monday to launch an \"economic D-day\" on the Iranian regime, threatening to target Tehran's \"enablers\" and trading partners in efforts to strangle its economy. This included a list of 60 individuals, entities and vessels.\nHowever, the U.S. has so far held off on imposing significant secondary sanctions on other nations — including, significantly, Chinese financial firms suspected of facilitating Iran's oil trade.\n\"Why would I want to blow up the global financial system? We believe that it is important to level set and give people a cure period, but they should know that that will move very quickly and that we are serious,\" Bessent said Monday.\nChina, which buys around 90% of Iran's oil, on Tuesday threatened to retaliate if the U.S. opted to expand economic pressure on nations trading with Tehran.\nBeijing \"will take all necessary measures to firmly safeguard its rights and interests,\" a Chinese Foreign Ministry spokesperson said Tuesday.",

    "title": "Hyundai has grown more than any automaker in the U.S. — and it's not done yet",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "SAN FRANCISCO — Hyundai Motor Co. CEO José Muñoz smiled and nodded as a fellow executive discussed the automaker's \"mueos-ideun ganeunghada\" philosophy during the reveal of its new flagship Genesis GV90 SUV.\nThe term means \"anything is possible\" in Korean. It's a mantra for the South Korean automaker that has proved to be true for the company's U.S. ambitions as well as for Muñoz himself, a Spanish-U.S. dual national who is the first non-Korean executive to lead the automaker.\nHyundai has experienced rapid growth in the U.S. so far this decade despite an onslaught of geopolitical changes and a slowing market. And it's hoping to keep that going. The company is ramping up production at a new $7.6 billion plant in Georgia to continue to capture more sales and market share.\n\"My top three priorities are U-S-A,\" Muñoz told CNBC during an interview last week after the Genesis reveal. \"USA is helping us to really make good progress, not only in the most important market and the most competitive market in the world, but also elsewhere.\"\nHyundai Motor Group, which includes its namesake vehicles as well as the Kia and luxury Genesis brands, has increased its market share this decade more than any major automaker in the U.S., according to data from Mobility Global.\nThe group has grown its U.S. market share from 8.4% in 2020 to 11.2% through last year, and its sales have grown 50% over that period, making the South Korean company the fourth best-selling automaker in the country. Its market share is up to 11.8% through the first half of this year, according to auto intelligence firm Mobility Global.\nNo other major automaker is even close to such market share gains, with most flat to down during that timeframe. Electric vehicle manufacturer Tesla, at an estimated 2.1 percentage point increase in market share, is the only company even close, according to Mobility Global.\nHyundai's U.S. performance has helped it become the third best-selling automaker globally and the second most profitable based on operating income, Munoz said.\nHyundai Motor Group Executive Chair Euisun Chung downplayed the company's rapid rise when speaking last week to CNBC: \"It's important, but speed doesn't matter. How we grow in the right way [is what matters]. I think that's more important.\"\nBut investors have definitely taken notice of the growth, with shares of the company on the Korea stock exchange up nearly 250% since 2020.\nHyundai's $26 billion U.S. plan\nHyundai expects its growth to continue with a $26 billion investment plan through 2028 that could include making its new Metaplant in Georgia the largest vehicle assembly plant in the country.\nMuñoz told CNBC the company is considering plans to increase the expected production capacity at the plant from 500,000 units to between 700,000 and 800,000 units by 2028. It currently produces the all-electric Hyundai Ioniq 5 and Ioniq 9 as well as the Kia Sportage hybrid, with additional vehicles expected in the coming years.\nThe goal is for Hyundai to produce at least 80% of the vehicles it sells in the U.S. domestically by the end of this decade, up from roughly 40% in 2024.\n\"For that purpose, we need to add more capacity,\" Muñoz said. \"We are ramping up as fast as we can.\"\nThe investment is the largest in the company's U.S. history, as it aims to increase sales to 5.55 million vehicles globally under a \"Bold 2030 Vision\" plan outlined by Muñoz last year at the company's first investor day ever held in the U.S.\nThe plan is an ambitious outline to increase sales by roughly 35% from last year to 2030. That includes entering new markets globally, with the U.S. as an anchor for continued profitable growth.\nMuñoz on Wednesday reconfirmed those plans during the company's 2026 CEO investor day, including a 6% targeted global market share for Hyundai and Genesis.\nMuñoz last week said President Donald Trump's tariffs, including 15% on autos from South Korea, have played a role in the company accelerating its U.S. production plans.\n\"Tariffs are helping accelerate our localization plan. That's very, very simple,\" he said. \"The good thing is that we had already started before tariffs were announced. So in a way it's helping us to accelerate.\"\nThe Georgia plant is key for Hyundai and Kia, both of which have grown sales roughly 45% in the U.S. since 2020.\n\"This decade's been about a brand transformation, and the growth has been phenomenal. We've really transformed everything,\" Eric Watson, Kia America vice president of sales operations, said during an interview. \"We continue to plan to grow.\"\nKia's growth plans include increasing U.S. sales to 1.02 million vehicles in the U.S. by 2030, the company's CEO, Ho Sung Song, said earlier this year. That is expected to be assisted by Kia's entry into pickup trucks and more capable SUVs that are known as \"body-on-frame\" vehicles.\n\"We think that's an important segment to be involved in, a body on frame vehicle/truck,\" Watson said. \"It'll be an important piece of our growth strategy that we'll look forward to announcing more in the future.\"\nHyundai also plans to add such vehicles, including a midsize pickup truck. The company earlier this year debuted a rugged concept vehicle called the Boulder, which could mean additional production capacity in the U.S. for body-on-frame models.\n\"It's a new unexplored territory for us,\" Muñoz said. \"We are always, always assessing the opportunities that we have in the market.\"\nFrom 'cheap' to luxury, value\nHyundai entered the U.S. market in 1986, followed by Kia in 1993 with cheaper options than American consumers could get from U.S. automakers and aiming to compete against growing Japanese companies such as Toyota Motor.\nSince then, Hyundai executives said several transformations — from overhauling quality and design to logos and dealer showrooms — have led the brands to where they are today as quality value plays.\n\"Both Kia and Hyundai are really good at being able to offer more in the vehicle than the consumer expects, and that they expect at that price point,\" said Stephanie Brinley, associate director of Mobility Global's AutoIntelligence. \"It's not about being a 'cheap car.' It's just being able to offer a little bit more than expected.\"\nMuñoz attributed Hyundai's success to its customer focus and its ability to surprise buyers, many of whom are new to the brand, with the capabilities and features of its vehicles. He also said the global reach of Hyundai, which also owns steel plants and other suppliers, is paramount to its progress.\n\"We have determined that being competitive is a key element for the American consumer. So, affordability is something that we fully understand and we apply,\" he said. \"We want to offer the customer the right product, the right features at the right level of price.\"\nThat \"right level\" has been widening for the automaker in the U.S. It continues to sell entry-level vehicles that start in the $20,000s for Kia and Hyundai, while growing the top-end sales for both brands. Its Genesis luxury brand, meanwhile, has models that reach $100,000 or more.\nHyundai on Wednesday said it is planning more than 100 vehicle launches and refreshes across Hyundai and Genesis by 2030, including 58 in North America. It also will significantly increase its electrified vehicle offerings, including extended-range hybrids.\nGenesis, which launched a decade ago in the U.S., has seen a particularly rapid growth, to become the fastest-selling luxury brand to 1 million sales globally, according to the company.\nExecutives described its newest GV90 flagship SUV, including a model with coach doors and rotating lounge seats, as a new chapter for the Genesis brand, reiterating that \"anything is possible.\"\n\"From the very beginning, the world took notice of Genesis,\" Genesis North America Chief Operating Officer Tedros Mengiste said at the GV90 reveal as Muñoz nodded. \"And tonight you will see mueos-ideun ganeunghada – anything is possible – come to life.\"",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Mortgage interest rates moved even higher last week, causing demand for loans to weaken yet again.\nTotal mortgage application volume dropped 1% from the previous week, according to the Mortgage Bankers Association's seasonally adjusted index.\nThe average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances of up to $832,750 increased last week to 6.78% from 6.77% the prior week, with points rising to 0.66 from 0.65, including the origination fee, for loans with a 20% down payment. That is the highest level in three weeks.\nApplications to refinance a home loan, which are most sensitive to weekly rate moves, fell 2% for the week. They were 17% lower than the same week one year ago, when rates were 9 basis points lower.\n\"Refinance applications decreased, particularly for FHA and VA loans, and the average loan size for refinances was at its lowest since June 2025,\" said Joel Kan, vice president and deputy chief economist at the MBA, in a release.\nApplications for a home mortgage fell 0.3% for the week and were 5% lower than the same week a year ago.\nEven though rates are higher than last year, fewer buyers are using all cash, according to a separate report from Realtor.com. Less competition in the overall market makes sellers more likely to accept buyers who need financing.\n\"Purchase activity was down over the week, driven by a 7 percent decrease in FHA applications. The purchase market has also slowed these past two months,\" Kan added.\nMortgage rates are lower this week, according to a separate survey from Mortgage News Daily, with rates dropping Tuesday thanks to falling oil prices.\n\"News reports suggested progress in the peace process via Pakistani mediators. Oil prices dropped sharply in response, and bond yields followed the move. Bond yields correlate with mortgage rates,\" wrote Matthew Graham, chief operating officer at Mortgage News Daily.",

    "id": "why-high-energy-bills-look-like-they-are-14fb3bdc",
    "title": "Why high energy bills look like they are here to stay",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Why high energy bills look like they are here to stay\n- Published\nEnergy bills may have been a long way from our minds through the sweltering summer.\nClothes on a washing line have been drying in minutes. Cold showers have been more tempting than hot ones.\nBut the latest news and forecasts on gas prices will bring a renewed sense of worry and urgency to families, as well as government ministers.\nEnergy prices will rise by nearly 4% for millions of households in October. Even more striking is a prediction from the respected consultancy Cornwall Insight of a further 9% increase at the peak of winter in January.\nWith ongoing volatility in the wholesale gas market sparked by events in the Gulf region, the energy sector says high prices are here to stay.\nEDF suggests bills will remain \"stubbornly high\" at their current level at least until the end of the decade.\nAs prices rise, so does debt\nHigh bills have, and continue to, bite. Energy prices have been central to the cost-of-living squeeze.\nThe typical household's dual-fuel bill is now 70% higher than it was at the start of 2021, before Russia's invasion of Ukraine.\nThat amounts to around £600 more each year than pre-crisis levels, according to industry body Energy UK.\nInevitably, more and more people have been unable to pay. Unpaid energy debt of more than three months is now at a record high, according to regulator Ofgem.\nSuppliers, who chart debt levels for missed payments of a month or more, estimate total unpaid bills and charges to have reached £6bn. By the end of the year, they expect that to rise to £7bn.\nThe average household in debt, without a repayment plan, owes more than the typical annual bill.\nAnd even if you are not in debt, you pay. Covering the cost of debt already adds about £60 to the average annual bill. Consultancy Baringa says everyone could, on average, be paying £100 to cover the cost of unpaid debts by the end of the year.\nSomeone who pays their bill on demand every three months, rather than a monthly direct debit, is typically already paying £150 a year to cover debt of others, owing to the greater risk of non-payment on this type of bill.\nSo, pressure on the government to help those most in need will only intensify.\nOfgem has a proposed debt relief scheme on the table, and campaigners keep telling them to get on with it, urging the government as to provide funding for it to be implemented.\nCharities and the industry also want ministers to introduce a discounted tariff for those who need it most - based on benefits, health and income data.\nEnergy UK says a targeted plan would cost £1.9bn. That would be much cheaper than the £40bn commitment to protect everyone's bills after Russia invaded Ukraine.\nBut, who would pay? It could go on everyone else's bills. Or ministers could opt to raise taxes, borrow the money, or cancel spending elsewhere - all of which are tricky political choices.\nWe've all done our bit\nThose who can have cut back on their energy use to reduce bills in recent years. Thermostats up and down the country have not been set as high as before. Batch cooking is more common.\nSo much so that Ofgem's official calculations for typical energy consumption were lowered again in July (to 9,500 kWh of gas and 2,500 kWh of electricity a year).\nMillions have shifted onto fixed tariffs, with 35% of billpayers on such a deal.\nSo, many can justifiably say they have done their bit. Others who are older or who have health conditions might not have the luxury of lowering their energy use.\nSo, community warm hubs have become popular. Some became cold hubs during the hot summer so people could make use of the air con.\nThe heatwave has reduced the amount of energy stored across Europe, which needs to be restocked, piling more pressure on prices.\nAdd to that the huge cost of upgrading the UK's electricity network and you can see why there are predictions of longstanding high energy bills - irrespective of whether a lasting peace in the Iran war brings down the international price of wholesale gas.\nAll eyes on the Budget\nIn the long-term, the government and Ofgem wants to shift the country away from our reliance on gas, with its volatile international pricing.\nExpect lots of fanfare over the sale, for the first time in the UK, of plug-in solar panels.\nIn the short-term ministers - and the new prime minister - say they are helping where they can, and promising that there is \"more to do\".\nVAT will be cut on electricity bills in October. It means the price of electricity will fall, but that's been more than outstripped by an 8% rise in the price of gas.\nIn the last Budget, then-Chancellor Rachel Reeves cut some so-called policy costs and shifted some onto general taxation instead.\nMinisters may be tempted to do more of that, but could face be criticised for simply shifting the burden off bills and onto taxes.\nSo, the options are limited. The new chancellor, John Healey, has choices to make - with lots of calls for help but with limited room for manoeuvre in the public finances.\nAll eyes will be on his first Budget, which comes soon after those higher autumn energy bills kick in.\nGet in touch\nAre you affected by issues covered in this story?\n- Published2 hours ago",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");

    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
