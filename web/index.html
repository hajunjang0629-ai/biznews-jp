    "id": "rivian-lucid-scout-ceos-aren-t-counting-2e4a7c72",
    "title": "Rivian, Lucid, Scout CEOs aren’t counting on Democrats to restore EV federal support after midterm wins",
    "titleJa": "Rivian, Lucid, Scout CEOs aren’t counting on Democrats to restore EV federal support after midterm wins",
    "summaryJa": "EV makers have had to contend with flip-flopping regulatory support from Washington over the years.",
    "bodyOriginal": "Leaders of several U.S. electric vehicle manufacturers said they're not counting on increased federal support for their businesses once Democrats gain control of Congress in January, but they said they'll gladly take it if it does happen.\nThat was the overall sentiment from CEOs of Rivian Automotive, Lucid Group and EV startup Scout Motors during interviews with CNBC after Democrats' historic midterm election wins.\n\"We've honestly constructed Scout from day one to be in an environment where we're not going to count on, let's say, legislation or count on things that may or may not be there,\" Scout CEO Scott Keogh, an automotive veteran, told CNBC on Wednesday.\nEV makers have had to contend with flip-flopping support from Washington over the years. The Trump administration has ended or rolled back support for climate change initiatives and EVs that were supported by the Biden administration, including an up to $7,500 customer incentive for purchasing an EV.\nLegacy automakers such as General Motors and EV startups alike had counted on such credits to help them boost their sales and assist in electric vehicle profitability. But now they don't have that same level of federal assistance.\n'Plan for the worst'\nRivian CEO RJ Scaringe said it's his hope that the Democratic-controlled Congress and Republican President Donald Trump can find middle ground to make progress for the EV industry, but Rivian's not counting on that.\n\"We try not to plan for those sort of things. The reality is it's probably going to have less of an impact than we think,\" Scaringe said Nov. 6 following the election results. \"I think we're going to actually have a lot of challenges getting things done.\"\nFellow EV manufacturer Lucid, which is backed by Saudi Arabia's Public Investment Fund, is taking a similar approach.\n\"You know, they say, 'Plan for the worst and … hope for the best.' That's all we can say,\" Lucid CEO Silvio Napoli told CNBC on Monday. \"Anything positive, we'll take it.\"\nThe lack of expected support comes as Democrats seem to be more focused on hot topics such as healthcare and data centers rather than climate change and support for alternative energy technologies such as EVs.\nCNBC previously reported that House Democrats plan to bring to the floor bills reinstating the enhanced health insurance subsidies that expired under the GOP-held Congress and reversing the Medicaid cuts Trump signed into law last year. They also plan to focus on oversight of the Trump administration and affordability.\nRachel McCleery, executive director of the nonprofit policy advisory Coalition for Reimagined Mobility at SAFE, said she believes affordability concerns also could include the cost of vehicles, including EVs.\n\"I fully expect there will be legislative debates over what to do moving forward, including on EV and EV supply chain incentives,\" McCleery, a former U.S. Department of Treasury senior advisor and Ford Motor policy director, said. \"Bringing down the cost of vehicles for U.S. consumers is top of mind for Democratic policymakers, and electric vehicles are a critical aspect of this agenda because of the multiple challenges greater EV adoption solves for.\"\nAffordability concerns\nScout's Keogh said if legislators decide to offer any type of support, he would prefer it to be for EV production, which could then have a trickle-down effect on vehicle pricing and help companies amid inflated costs.\n\"I always prefer it on the production side,\" Keogh said. \"Anything that can drive down production cost is going to, of course, get passed along to the customer.\"\nAffordability has been a concern for EV adoption as the vehicles typically cost more than traditional models with internal combustion engines.\nSales of EVs spiked last year ahead of the Trump administration ending the up to $7,500 incentive after September 2025, but have since come down from that high.\nCox Automotive reports the average price for a new electric vehicle as of September was more than $54,800, according to the most recent available data. That compared to the average overall industry at just over $51,100 last month.\n\"Ultimately, incentives can help accelerate adoption, but the industry can't build its long-term strategy around them,\" Stephanie Valdez Streaty, Cox director of industry insight, said Friday. \"The goal has to be making EVs affordable and compelling enough that they make sense for more consumers with or without an incentive.\"",

ips that Anthropic will rent. Broadcom has provided a backstop with a maximum liability of $43 billion.\nThat's a lot of silicon and a massive bet for a five-year-old company that's never lived through a technology downturn.\n\"It's not a risk-free prospect, but I would call it smart investing,\" said David Tollen, founder of Sycamore Legal, where he specializes in IT contracts. \"They're investing, in a sense, in themselves. They're putting money into something that if it succeeds, they get a piece of the action.\"\nWATCH: Buying Anthropic means betting its explosive growth can outpace its expenses, says Jim Cramer",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `

  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>

      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">

    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("popstate", render);
