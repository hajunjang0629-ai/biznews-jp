    "summaryJa": "Trump's diesel deal may do little for Russia's finances, but it raises bigger questions about Ukraine's leverage, U.S. support and Putin's next moves.",
    "bodyOriginal": "Ukraine is facing increasing uncertainty over its ability to sustain the war against Russia as a series of moves by U.S. President Donald Trump has raised fresh questions about Washington's reliability as Kyiv's most important military partner.\nTrump's agreement with Putin to ease sanctions for Russia to provide global markets with diesel, as well as restrictions on U.S. intelligence sharing with Ukrainian forces, has put President Volodymyr Zelenskyy in a difficult position as winter looms.\nOn Saturday, Zelenskyy condemned the White House's waiver of key provisions of a recently enacted package of sanctions aimed at curbing Russia's ability to prosecute its war against Ukraine.\n″... The decision to undo all of this, to block all of it, seems wrong to me,\" Zelenskyy said in a post on X. \"And it definitely helps only the Russians. It only fuels their satisfaction and their desire to keep killing people.\"\nHigher diesel prices – essential to transporting goods and agricultural production – tend to drive up costs across the wider economy and fuel inflation. With November's U.S. midterm elections approaching, Trump is under pressure to bring fuel costs down.\nBut experts told CNBC that the diesel deal would deliver only a marginal financial benefit to Russia, and not move the needle much on global energy prices. Its wider political implications may be more significant, potentially reinforcing the Kremlin's belief that it can secure concessions from Washington without making compromises over Ukraine.\n\"Russia's main gain is political: Trump's decision eases sanctions pressure and undermines Western unity,\" Sergey Aleksashenko, senior research fellow and head of economics at the NEST Centre, told CNBC.\nDiesel deal\nTrump's agreement with Putin was for Russia to supply the global market with 4.8 million metric tons of diesel, the equivalent of about ten days of U.S. domestic demand, or about a single day of global demand. Experts say it will do little to affect prices.\n\"It does not even touch the sides – it is very, very small,\" Neil Atkinson, former head of the IEA's oil industry and markets division, told CNBC's \"Squawk Box Europe\" on Monday.\nAleksashenko estimated that the initial part of the phased agreement that covers 1.8 million metric tons of diesel could generate up to $1.25 billion in additional export revenue over three months, equivalent to around 1% of Russia's commodity export revenues during that period.\nHowever, the benefit to Russia's federal budget would be substantially smaller, at less than $30 million per month, or under 0.07% of monthly federal revenues.\nThe deal was therefore unlikely to meaningfully strengthen Russia's war finances, Aleksashenko said. Instead, its main benefit to Moscow is political, because it eased sanctions pressure and undermined Western unity without requiring Putin to make concessions over Ukraine, he told CNBC.\nThe research fellow also argued that the additional Russian diesel entering global markets is not sufficient to produce a noticeable reduction in consumer fuel prices in the short term.\n\"Funding the war is currently Putin's priority, and he is prepared to increase that funding even if it means cutting all other expenditures,\" Aleksashenko added, pointing to Russia's draft budget for 2027.\nThe bigger problem for Ukraine\n\"Rather than encouraging compromise, the [diesel] deal likely boosts Moscow's belief that continued pressure will eventually yield further Western concessions,\" Maria Snegovaya, senior fellow at the Center for Strategic and International Studies, told CNBC.\nSpeaking to reporters in Brussels on Friday, Zelenskyy also warned that the diesel agreement could set a precedent for further sanctions relief, while highlighting Ukraine's continued reliance on U.S. military technology and intelligence despite efforts to develop alternatives.\n\"Sanctions will be lifted after gas,\" Zelenskyy said. \"They will be lifted on something else. Then this will come to the banking system, certain individuals, chemical industry.\"\nEarlier this week, reports emerged that SpaceX's Starlink military application Starshield has been restricted in Ukraine. SpaceX CEO Elon Musk said in a post on X that the U.S. government and president were ultimately responsible for any curbs on the network.\nThe order to limit Starshield for Ukraine came from inside White House, according to a Reuters report citing three officials familiar with the matter. CNBC has contacted the White House for comment.\nThe consequences were felt sharply in Ukraine. As Starlink's speed limits were lowered, Ukraine became incapable of shooting down some Russian drones. This week, Ukraine also did not receive advanced warning from partners of incoming ballistic missiles, resulting in civilian deaths, according to Ukrainian officials.\nAccording to Serhiy Derkach, Ukraine's first deputy minister for recovery, infrastructure and transport, Starlink restrictions emboldened Russia to intensify attacks on Ukraine.\n\"With U.S. limiting the use of Starlinks on the battlefield, Russia feels that this is their moment to try and inflict even more pain and suffering on Ukraine's civilian infrastructure,\" Derkach told CNBC on Friday.\nRussian authorities didn't respond to multiple CNBC requests for comment.\nA political blow\nThe diesel deal was a political and moral blow to Ukraine and the Western coalition, according to Snegovaya. The U.S. sanctions exemption, which runs until April 2027, could facilitate Russian diesel exports beyond the initially announced shipment, potentially increasing Moscow's economic gains, she warned.\n\"If [the] White House uses its military and intelligence support as leverage to constrain Ukraine's strikes, the implications could become far more significant,\" Snegovaya said, adding that Ukraine's attacks on Russian oil refineries have inflicted substantial economic costs on Moscow.\nSuch a move could have far greater consequences for Ukraine's efforts to weaken Russia's war economy, she added.\nThe diesel deal further undermines Washington's credibility as a mediator in the eyes of Ukraine and its European allies, as it appears to reward Moscow without securing concessions while increasing pressure on Kyiv, she said.\nThe problem, Snegovaya said, is that achieving military autonomy for Europe and Ukraine is extremely difficult in the short term, and Europe has been slow to develop the necessary capabilities.\n\"Almost five years into the war, Ukraine and its European partners remain heavily dependent on the U.S. in critical areas, like intelligence and missile defense. These dependencies are unlikely to be overcome during the remaining years of the Trump administration,\" she told CNBC.",

quences for Ukraine's efforts to weaken Russia's war economy, she added.\nThe diesel deal further undermines Washington's credibility as a mediator in the eyes of Ukraine and its European allies, as it appears to reward Moscow without securing concessions while increasing pressure on Kyiv, she said.\nThe problem, Snegovaya said, is that achieving military autonomy for Europe and Ukraine is extremely difficult in the short term, and Europe has been slow to develop the necessary capabilities.\n\"Almost five years into the war, Ukraine and its European partners remain heavily dependent on the U.S. in critical areas, like intelligence and missile defense. These dependencies are unlikely to be overcome during the remaining years of the Trump administration,\" she told CNBC.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}
