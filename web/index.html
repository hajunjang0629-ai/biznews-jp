    "bodyOriginal": "Trump says FBI investigating Nvidia boss's affair with alleged Chinese spy\n- Published\nUS President Donald Trump has said the FBI is investigating the affair between the chief executive of Nvidia and an alleged Chinese spy.\nTrump said he spoke to Jensen Huang on Monday following reports that the US believed he had been targeted in a Chinese espionage campaign.\n\"I asked him that question, 'Did you have any idea she was a spy?' He said 'I had no idea she was a spy' and I really believe him,\" Trump told reporters.\nBeijing has rejected claims that Huang was targeted, with its foreign ministry saying the allegations were \"entirely groundless, speculative and intended to smear and malign China\".\nNvidia, which has commissioned an independent investigation into the affair involving Alice Huang, alleged to be a Chinese spy, said it had no reason to believe the company's secrets or national security were compromised.\nThe revelations knocked about $250bn (£190bn) off the value of Nvidia during trading on Monday as the firm's share price fell by more than 4%.\nTrump later told reporters at the White House that the FBI was now looking into the issue, but did not elaborate on the probe or when it was launched. The FBI declined to comment when contacted by the BBC.\nUS intelligence officials believe Alice Huang, also known as Huang Le, was a spy for Beijing, according to a New York Times report.\nThe report said Secretary of State Marco Rubio sent a memo to top officials in Washington last spring warning that the Nvidia boss was in a close relationship with a Chinese spy.\nAlice Huang was managing director of Singaporean company Megaspeed, which has had dealings with Nvidia, the company at the centre at the development of AI worldwide through its microchips. She is not related to the Nvidia chief.\nTrump's remarks are the first indication of whether Nvidia's Huang knew about the woman's alleged ties to Chinese espionage.\nThe American firm, co-founded by Huang, is also a major focus in the AI rivalry between the US and China, with officials in Washington treating the company's exports to Beijing as a matter of national security.\nHuang and Nvidia were also sued on Monday in a proposed class action lawsuit in California accusing them of defrauding shareholders by concealing the chief executive's ties with a suspected Chinese spy.\nThe lawsuit alleges that the firm lied to the media about Huang's relationship with Alice Huang, \"who is suspected of seeking to help smuggle Nvidia products to China.\"\nThe BBC has contacted Nvidia for comment on the lawsuit.\n'He said he had no idea she was a spy'\nAt the White House, Trump was asked multiple times, including by the BBC, when he was made aware of the relationship. He said he was informed \"over a period of time\" but was not specific.\nTrump said he thought Huang was an \"honorable guy and I feel very confident that he will be in good shape\" after the investigations.\n\"I hope there's no problem, I believe he is suffering greatly,\" the president said.\nHe said he spoke to Huang on the phone on Monday \"just to see if he's feeling alright, how you doing, and I asked him about that and he said he absolutely had no idea that the person in question was a spy\".\nNvidia designs advanced computer chips that power AI models and is at the centre of the US and China's technology race - a key reason why Huang's affair has sparked national security fears.\nTrump has raised concerns that allowing China to lead in AI would supercharge Beijing's military and surveillance capabilities.\nThe president added he was \"sure\" Chinese leader Xi Jinping would \"ask me about it\" when they next met.\nHuang has admitted he was \"unfaithful\" to his wife and apologised for hurting her and their children.\nHe said on Monday that he was \"committed to protecting Nvidia and supporting America's national security\" and would cooperate with the investigation the company had launched.\nHuang has also been requested to appear for a joint closed-door briefing for several Congressional committees next week.\nIn the letter, the chairmen of the committees said they were seeking a briefing \"on Nvidia's security protocols against foreign adversary espionage and your interactions with a publicly reported People's Republic of China (PRC) intelligence asset: Megaspeed executive Alice Huang\".\nIt is unclear whether Huang will appear. Nvidia has declined to comment, while the the BBC has also contacted the committees.\nWhat we know so far about Jensen Huang's affair with suspected Chinese spy\n- Published1 hour ago\nZoe Kleinman: Nvidia CEO's affair will cause ripples across US and beyond\n- Published3 hours ago\nNvidia has been around for decades, with Huang founding it with two other engineers in 1993, but its rise to one of the world's most valuable and powerful companies has only been recent.\nIt originally designed computer chips for gaming, but its decision to shift focus to AI development turned it into the powerhouse it is today.\nIts chips have become so valuable to the AI buildout that the White House previously imposed controls on where its advanced products could be sold.\nThe H200, Nvidia's second most advanced semiconductor, had previously been restricted over concerns that it would give China's technology industry an edge over the US.\nBut Huang has long been against restricting sales to China, arguing that it would be better for the global rollout of AI to be powered by US technology.\nIn January, the Trump administration said it would allow the company to sell its H200 chips to Chinese customers under certain conditions.",

    "title": "Trump says Jensen Huang told him Monday he didn't know paramour 'was a spy'",
    "titleJa": "Trump says Jensen Huang told him Monday he didn't know paramour 'was a spy'",
    "summaryJa": "President Donald Trump suggested he had only recently learned of allegations that Alice Huang was a Chinese spy.",
    "bodyOriginal": "President Donald Trump said he spoke to Nvidia CEO Jensen Huang on Monday, and that Huang denied knowing that the woman he admitted having an extramarital affair with \"was a spy\" for China.\nTrump told reporters at the White House that he was \"amazed\" by the allegations against Huang, which led Nvidia's board to initiate an independent investigation.\nTrump suggested he had only recently learned of allegations that Megaspeed International executive Alice Huang was a Chinese spy.\n\"I didn't hear about it then, but a lot of people have heard about it, and Jensen totally denies that,\" Trump said.\n\"I asked him today because I did speak to him today just to see if he's feeling all right. 'How you doing?'\" Trump said.\n\"And I asked him about that, and he ... said he had absolutely no idea that the person in question was a spy,\" the president said. \"I asked him that question: 'Did you have any idea that she was a spy?' He said, 'I had no idea that she was a spy.' \"\n\"I really believe him,\" Trump said.\nThe New York Times on Oct. 29 reported that Alice Huang had been eyed by U.S. spy agencies \"for possibly steering advanced Nvidia A.I. chips to China,\" and that \"American officials had concluded she was a Chinese intelligence asset, funneling information to Beijing.\"\nThe Times reported that about a year ago, Trump was briefed about the intelligence findings \"and chose not to do anything with the information.\" The newspaper noted that Trump has been reluctant to disrupt chip sales by Nvdia, which are boosting the U.S. stock market.\nOn Friday, The Times reported that a memo that circulated last spring among top Trump administration policymakers \"cited intelligence that a Chinese businesswoman who had a close relationship with Nvidia's chief executive was a spy for China's Ministry of State Security.\"\nThe Times said the memo reported that Alice Huang was recruited to collect intelligence on the Nvidia CEO \"as part of a drive by Beijing's top spy agency to learn more about American A.I. chips and potentially influence the company to push for its most advanced chips to be made available to China.\"\n\"I've been reading a little bit about it over a period of time, but not too long ago,\" Trump said Monday. \"We'll look into it. I know the FBI is looking into it in terms of something else, and I think that he'll be in good shape.\"\nTrump on Monday said of Jensen Huang, \"He's suffering greatly.\"\n\"I believe he's suffering greatly. I read his statement, and I believe he's suffering greatly, more so because of his family, his wife, who he loves, and his family. But he is definitely suffering.\"\nAsked if he would bring up the issue involving Huang with Chinese President Xi Jinping when the two leaders meet next week at the Asia-Pacific Economic Cooperation summit in Shenzhen, China, Trump said, \"I don't think so.\"\n\"I mean, maybe I'm sure President Xi will ask me about it,\" Trump said. \"I just know Jensen very well. I just think he's a very honorable, honorable man. I mean ... he built a great company, American company, and I think he's a very honorable guy, and I feel very confident that he'll be in good shape.\"",
    "bodyJa": "President Donald Trump said he spoke to Nvidia CEO Jensen Huang on Monday, and that Huang denied knowing that the woman he admitted having an extramarital affair with \"was a spy\" for China.\nTrump told reporters at the White House that he was \"amazed\" by the allegations against Huang, which led Nvidia's board to initiate an independent investigation.\nTrump suggested he had only recently learned of allegations that Megaspeed International executive Alice Huang was a Chinese spy.\n\"I didn't hear about it then, but a lot of people have heard about it, and Jensen totally denies that,\" Trump said.\n\"I asked him today because I did speak to him today just to see if he's feeling all right. 'How you doing?'\" Trump said.\n\"And I asked him about that, and he ... said he had absolutely no idea that the person in question was a spy,\" the president said. \"I asked him that question: 'Did you have any idea that she was a spy?' He said, 'I had no idea that she was a spy.' \"\n\"I really believe him,\" Trump said.\nThe New York Times on Oct. 29 reported that Alice Huang had been eyed by U.S. spy agencies \"for possibly steering advanced Nvidia A.I. chips to China,\" and that \"American officials had concluded she was a Chinese intelligence asset, funneling information to Beijing.\"\nThe Times reported that about a year ago, Trump was briefed about the intelligence findings \"and chose not to do anything with the information.\" The newspaper noted that Trump has been reluctant to disrupt chip sales by Nvdia, which are boosting the U.S. stock market.\nOn Friday, The Times reported that a memo that circulated last spring among top Trump administration policymakers \"cited intelligence that a Chinese businesswoman who had a close relationship with Nvidia's chief executive was a spy for China's Ministry of State Security.\"\nThe Times said the memo reported that Alice Huang was recruited to collect intelligence on the Nvidia CEO \"as part of a drive by Beijing's top spy agency to learn more about American A.I. chips and potentially influence the company to push for its most advanced chips to be made available to China.\"\n\"I've been reading a little bit about it over a period of time, but not too long ago,\" Trump said Monday. \"We'll look into it. I know the FBI is looking into it in terms of something else, and I think that he'll be in good shape.\"\nTrump on Monday said of Jensen Huang, \"He's suffering greatly.\"\n\"I believe he's suffering greatly. I read his statement, and I believe he's suffering greatly, more so because of his family, his wife, who he loves, and his family. But he is definitely suffering.\"\nAsked if he would bring up the issue involving Huang with Chinese President Xi Jinping when the two leaders meet next week at the Asia-Pacific Economic Cooperation summit in Shenzhen, China, Trump said, \"I don't think so.\"\n\"I mean, maybe I'm sure President Xi will ask me about it,\" Trump said. \"I just know Jensen very well. I just think he's a very honorable, honorable man. I mean ... he built a great company, American company, and I think he's a very honorable guy, and I feel very confident that he'll be in good shape.\"",

    "title": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO",
    "titleJa": "Jensen Huang affair puts Nvidia's future at risk, with no clear successor to the renowned CEO",
    "summaryJa": "Jensen Huang is practically synonymous with Nvidia, the chipmaker he co-founded in 1993 and turned into one of the most valuable companies on the planet.",
    "bodyOriginal": "Nvidia CEO Jensen Huang's admission of an affair with a purported Chinese spy has raised questions about his future at the company, and what happens if the 63-year-old co-founder, who built the chipmaker into one of the most valuable businesses on the planet, is forced out.\nShares of Nvidia sank more than 4% on Monday, even as the broader market rallied sharply, after Huang acknowledged the affair in a message to staff on Sunday, and said that the board was launching an investigation into whether he was targeted by a foreign intelligence agency. The board said it has \"confidence in Jensen,\" and that it has \"no reason to believe that either national security or Nvidia secrets were compromised.\"\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\nWhile Nvidia says Huang will continue to lead the company during the probe, pressure is rapidly mounting on the chipmaker, whose technology has powered the first four years of the generative artificial intelligence boom. Leaders from both parties are calling for briefings, and Democrats poised to take control of both houses of Congress are calling for investigations and new legislation \"to stop advanced AI chips from fueling China's military,\" Sen. Elizabeth Warren of Massachusetts wrote in a post on X on Monday.\nHuang has outsized influence over Nvidia, and is the sole face of the company with no clear second-in-command. He's also among the loudest champions of AI in the country, is critical to the financing of the broader infrastructure buildout and has a close relationship with President Donald Trump, giving Nvidia a front-row seat when it comes to discussions on AI policy, safety and regulation.\n\"The issue at Nvidia is that there is no clear successor to Jensen, and we had expected him to stay in this role for at least 10 more years,\" analysts at Melius Research said in a Monday research note.\nStacy Rasgon, an analyst at Bernstein, told CNBC's \"Squawk on the Street\" on Monday that, \"Jensen is Nvidia. Nvidia is Jensen.\" He added that Huang \"runs the thing pretty much top down,\" and \"sort of pulls all the strings.\"\nNvidia didn't immediately respond to a request for comment.\nNvidia has long maintained a flat, non-hierarchical organizational structure. Huang has deep involvement in the company's day-to-day operations and frequently serves as its spokesperson in front of world leaders and at industry conferences. In addition to being co-founder and CEO, Huang is also Nvidia's president.\nIn September of 2025, Huang told CNBC's Becky Quick that he had as many as 60 direct reports. Internal records reviewed by CNBC reveal that, as of this week, he had 33 direct reports, including CFO Colette Kress, influential Chief Scientist Bill Dally, senior vice president of software engineering Dwight Diercks, and Ian Buck, best known as the inventor of Nvidia's CUDA software.\nHuang's limited ownership\nHowever, relative to some of his founder peers in tech like Meta's Mark Zuckerberg and Elon Musk at SpaceX, Huang has minimal actual control. He owns just over 3% of the outstanding shares and is one of 11 members on a board that has no official chair.\nAnd in the risk factors of Nvidia's financial filings, Huang isn't specifically identified as a key person. Rather, the company says, \"we are highly dependent on the services of our longstanding executive team.\"\n\"Failure to ensure effective succession planning, transfer of knowledge, and smooth transitions involving executives and key employees could hinder our strategic planning, execution, and long-term success,\" Nvidia says.\nStill, Huang's influence is undeniable, so much so that the question of succession is one that's hardly broached among analysts and investors.\nTimm Schulze-Melander, an analyst at Rothschild & Co. Redburn, wrote in a Monday note that Huang could be forced to step back from the CEO role if the board's investigation reveals \"something materially more serious\" than an undisclosed relationship.\nBut Schulze-Melander said Huang's potential resignation isn't a foregone conclusion of the investigation, pointing to the importance of his leadership at the company.\nNvidia's board \"needs to demonstrate independence and protect shareholders without destabilizing a company whose success is unusually dependent on its founder,\" Schulze-Melander wrote. \"Its initial statement suggests it is attempting to achieve both.\"\nSeveral analysts said the investigation could lead to governance changes at Nvidia, including putting a transition contingency plan in place.\nThe Melius analysts wrote that Nvidia has a \"strong bench\" of executive talent across its networking, hyperscale and high-performance computing businesses, along with \"technical expertise\" stemming from Chief Technology Officer Michael Kagan as well as Dally, the chief scientist.\n\"While these folks can keep the engine running, Jensen is one of a kind, and his energy will be needed to maintain confidence in the AI trade,\" the analysts wrote.\n— CNBC's Kif Leswing, Kristina Partsinevelos and Michael Bloom contributed to this report.\nWATCH: Here's how experts are reacting to the Nvidia probe into Jensen Huang",

d him to stay in this role for at least 10 more years,\" analysts at Melius Research said in a Monday research note.\nStacy Rasgon, an analyst at Bernstein, told CNBC's \"Squawk on the Street\" on Monday that, \"Jensen is Nvidia. Nvidia is Jensen.\" He added that Huang \"runs the thing pretty much top down,\" and \"sort of pulls all the strings.\"\nNvidia didn't immediately respond to a request for comment.\nNvidia has long maintained a flat, non-hierarchical organizational structure. Huang has deep involvement in the company's day-to-day operations and frequently serves as its spokesperson in front of world leaders and at industry conferences. In addition to being co-founder and CEO, Huang is also Nvidia's president.\nIn September of 2025, Huang told CNBC's Becky Quick that he had as many as 60 direct reports. Internal records reviewed by CNBC reveal that, as of this week, he had 33 direct reports, including CFO Colette Kress, influential Chief Scientist Bill Dally, senior vice president of software engineering Dwight Diercks, and Ian Buck, best known as the inventor of Nvidia's CUDA software.\nHuang's limited ownership\nHowever, relative to some of his founder peers in tech like Meta's Mark Zuckerberg and Elon Musk at SpaceX, Huang has minimal actual control. He owns just over 3% of the outstanding shares and is one of 11 members on a board that has no official chair.\nAnd in the risk factors of Nvidia's financial filings, Huang isn't specifically identified as a key person. Rather, the company says, \"we are highly dependent on the services of our longstanding executive team.\"\n\"Failure to ensure effective succession planning, transfer of knowledge, and smooth transitions involving executives and key employees could hinder our strategic planning, execution, and long-term success,\" Nvidia says.\nStill, Huang's influence is undeniable, so much so that the question of succession is one that's hardly broached among analysts and investors.\nTimm Schulze-Melander, an analyst at Rothschild & Co. Redburn, wrote in a Monday note that Huang could be forced to step back from the CEO role if the board's investigation reveals \"something materially more serious\" than an undisclosed relationship.\nBut Schulze-Melander said Huang's potential resignation isn't a foregone conclusion of the investigation, pointing to the importance of his leadership at the company.\nNvidia's board \"needs to demonstrate independence and protect shareholders without destabilizing a company whose success is unusually dependent on its founder,\" Schulze-Melander wrote. \"Its initial statement suggests it is attempting to achieve both.\"\nSeveral analysts said the investigation could lead to governance changes at Nvidia, including putting a transition contingency plan in place.\nThe Melius analysts wrote that Nvidia has a \"strong bench\" of executive talent across its networking, hyperscale and high-performance computing businesses, along with \"technical expertise\" stemming from Chief Technology Officer Michael Kagan as well as Dally, the chief scientist.\n\"While these folks can keep the engine running, Jensen is one of a kind, and his energy will be needed to maintain confidence in the AI trade,\" the analysts wrote.\n— CNBC's Kif Leswing, Kristina Partsinevelos and Michael Bloom contributed to this report.\nWATCH: Here's how experts are reacting to the Nvidia probe into Jensen Huang",

    "title": "Hegseth impeachment articles introduced by Rep. Massie",
    "titleJa": "Hegseth impeachment articles introduced by Rep. Massie",
    "summaryJa": "The House is likely to vote this week on articles of impeachment against Defense Secretary Pete Hegseth filed by Republican Rep. Thomas Masie.",
    "bodyOriginal": "Rep. Thomas Massie, R-Ky., on Monday introduced articles of impeachment against Defense Secretary Pete Hegseth, triggering a vote in the House of Representatives as early as this week.\nThe unusual impeachment push against Hegseth by a member of his own party comes after Democrats swept to majorities in both the House and Senate during last week's midterm elections. Many Republicans, including Vice President JD Vance, have cited the Iran war Hegseth has led as a reason for the electoral bludgeoning.\nMassie, who lost his reelection bid in a Republican primary in May, introduced eight articles of impeachment against Hegseth. They include waging war in contravention of war powers resolutions Congress passed to limit war, extrajudicial killings tied to boat strikes in the Caribbean that purported to target drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a veteran.\n\"Wherefore, Secretary of Defense Peter Hegseth, by such conduct, has demonstrated that he will remain a threat to the Constitution if allowed to remain in office, and has acted in a manner grossly incompatible with his duties and the rule of law,\" the articles, which Massie read from the House floor, read. \"Peter Brian Hegseth thus warrants impeachment and trial, removal from office, and disqualification to hold and enjoy any office of honor, trust, or profit under the United States.\"\nMassie's resolution will force House Republican leaders to put the measure up for a vote by the end of this week. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\nPresident Donald Trump once again defended Hegseth later Monday, telling reporters at the White House he will stand by the secretary even if he is impeached.\n\"He won two wars. He was in charge,\" said Trump, who was impeached twice in his first presidential term.\nTrump also credited Hegseth with boosting military recruitment, claiming there are \"waiting lists of people trying to get in.\"\n\"He's done a very good job,\" Trump said.\nCongress has the authority to impeach Cabinet secretaries, though it is a highly unusual move. Republican leadership in the House has not yet laid out how they plan to deal with the Hegseth impeachment, and it is unclear whether they have the votes to dispose of Massie's measure following the election.\nThe last Cabinet Secretary to be impeached was Homeland Security Secretary Alejandro Mayorkas in 2024 over his handling of the U.S.-Mexico border. Before Mayorkas, a Cabinet secretary had not been impeached since Secretary of War William Belknap in 1876. Neither was convicted by the Senate.\nIf the House votes to impeach Hegseth, the Senate would be tasked with holding a trial and voting on removing the secretary from office. If convicted by a two-thirds majority of the Senate, Hegseth would be removed from office.\nRepublicans hold a razor-thin 218-214 majority in the House, meaning only a handful of Republican defections could result in Hegseth's impeachment.\nHouse Minority Leader Hakeem Jeffries, D-N.Y., reiterated his support for impeaching Hegseth on Monday at his first press conference at the Capitol since last Tuesday's elections. \"Pete Hegseth has abused his power, undermined America's national security, and he's the architect of the reckless and costly failed war of choice in Iran,\" Jeffries said.\nHegseth has appeared to be preparing for an impeachment fight. The secretary put out a video last week defending his actions atop the Pentagon, and the department has led a media campaign to \"Stand. Fight. Defend the Republic.\"\nHegseth on Monday announced he would hold a press conference Tuesday morning at the Pentagon. His most recent press conference way May 5, just over two months after the Iran war began.",

    "summaryJa": "Jensen Huang is being investigated by his own company over an extramarital affair with a woman alleged to be a Chinese spy.",
    "bodyOriginal": "Zoe Kleinman: Nvidia CEO's affair will cause ripples across US and beyond\n- Published\nThe tech world has spent the day digesting the extraordinary news that Jensen Huang - the charismatic, leather-jacket wearing chief executive of the multi-trillion dollar firm Nvidia - is being investigated by his own company over an extramarital affair with a woman alleged to be a Chinese spy.\nNone of us had that on our bingo cards for 2026.\nHuang's alleged romantic affair with Alice Huang (no relation), the former CEO of a Singapore-based data centre company, has cast ripples far beyond his immediate family - undoubtedly on an emotional rollercoaster of their own - taking us to a crossroads at which technology, geopolitics and national security intersect.\nIn a nutshell, this is about the bitter rivalry between the US and China, as well as whether Jensen Huang has betrayed the US as well as his wife.\nThe US is locked in a fierce race with China to develop the best AI models.\n\"Whoever wins AI, wins,\" as US President Donald Trump puts it. He thinks that the country with the more dominant AI technology will benefit the most from it and, ultimately, will be the most powerful in the world. He may well be right.\nNvidia happens to make the best chips in the business for AI – so much so that it has been overwhelmed with demand.\nIt sets its prices accordingly: a single unit of the firm's latest kit for data centres starts at £37,000 ($50,000). A medium or large site might have hundreds of them.\nThe US administration initially slapped an export ban on Nvidia's more recent devices to prevent China from taking advantage of their superior capabilities. It has since softened the rules a little.\nBut there are suggestions that Alice Huang's company, Megaspeed, may have been involved in sneaking them into the country while she was in charge. Bloomberg reported that the firm bought billions of dollars worth of Nvidia tech in November 2025. Megaspeed denies that it was used illegitimately.\nFor his part, Jensen Huang has lobbied heavily for the export rules between the two countries to be relaxed, arguing against the weight of general opinion that the AI race doesn't matter and that it would be no bad thing for China to become dependent on US tech.\n\"President Trump wants American to win and President Xi wants China to win, and it's possible for both of them to do so,\" he told the BBC last year.\nIt think it's safe to assume that neither country sees it that way.\nCould this be the end of 'Jensanity'\n- Published18 hours ago\nThe difficult questions Nvidia now has to try to answer include whether Alice gained special access to the firm's latest technology, either deliberately or not, via Jensen - and, if so, whether she shared it with Beijing or others.\nWe don't know when their affair began or ended, but there are numerous photos and videos of Jensen and Alice together at events. It is feasible that there were moments when they spent quite a lot of time together and Jensen has talked about always having an eye on his work.\nChina denies that she was engaged in espionage.\nInterest in economic espionage is neither new nor unique to China. But many Western countries say that China does it on a grand scale, using a combination of technology tools and agents embedded in various organisations - including private companies.\nChina having access to significant enough numbers of Nvidia's chips to make use of them, or stripping them down and learning how to make its own versions, would infuriate the Trump administration, which is trying to keep its AI technology close to its chest.\nSome models have even been withheld from the UK-based AI Safety Institute on the grounds that they are potentially too dangerous to be shared. The US does not want anyone having a headstart or misusing its innovations.\nAnother potential bombshell lies in the form of any national security information to which Jensen Huang may have been privy.\nHe is a man operating at the very top of the US elite - one of a handful of people who could probably walk into the White House unannounced and have tea with Trump. He has influence, he has access and he has powerful friends. It's quite possible that secrets were shared with him.\nNvidia says there's no evidence so far that he passed anything on and the firm has launched an internal investigation. Huang says he will co-operate and wants to keep his job - though if nothing else, he has broken Nvidia's own code of conduct, which states that company members should not have relationships with clients.\nBut can he survive?\nAt present, he has the backing of both the Nvidia board and Trump, who described him as \"honourable\" and speculated that there must have been a reason for what had transpired. In other words, he's not throwing his tech boss buddy under the bus.\nNvidia's share price has fallen but has not tanked spectacularly, suggesting shareholders are not abandoning the company under his stewardship in their droves either.\nAn AI industry with a weakened Nvidia would undoubtedly be a slower one.\nAnd there isn't really a natural successor waiting in the wings to replace Jensen were he forced out.\nHuang has run Nvidia for more than 30 years - to many, he is Nvidia. He has steered it through multiple crises and it was his decision for the firm to focus on AI before it was trendy.\nHe is known to be a demanding boss who expects staff to work long hours and to high standards. There are stories about him calling all-staff meetings to tell off individuals who had made mistakes. He has said this was to prevent others making the same errors – but you can only imagine how it felt for those on the receiving end.\nWhile he awaits the conclusion of the investigation into his actions, Huang must hope that, despite not tolerating the mistakes of his colleagues in the past, they will be gracious about his own failings.\nAnd he must also live with the irony that he was potentially caught out not by a sophisticated high-tech sting, but by the oldest trick in the book: a honey trap.",

ating at the very top of the US elite - one of a handful of people who could probably walk into the White House unannounced and have tea with Trump. He has influence, he has access and he has powerful friends. It's quite possible that secrets were shared with him.\nNvidia says there's no evidence so far that he passed anything on and the firm has launched an internal investigation. Huang says he will co-operate and wants to keep his job - though if nothing else, he has broken Nvidia's own code of conduct, which states that company members should not have relationships with clients.\nBut can he survive?\nAt present, he has the backing of both the Nvidia board and Trump, who described him as \"honourable\" and speculated that there must have been a reason for what had transpired. In other words, he's not throwing his tech boss buddy under the bus.\nNvidia's share price has fallen but has not tanked spectacularly, suggesting shareholders are not abandoning the company under his stewardship in their droves either.\nAn AI industry with a weakened Nvidia would undoubtedly be a slower one.\nAnd there isn't really a natural successor waiting in the wings to replace Jensen were he forced out.\nHuang has run Nvidia for more than 30 years - to many, he is Nvidia. He has steered it through multiple crises and it was his decision for the firm to focus on AI before it was trendy.\nHe is known to be a demanding boss who expects staff to work long hours and to high standards. There are stories about him calling all-staff meetings to tell off individuals who had made mistakes. He has said this was to prevent others making the same errors – but you can only imagine how it felt for those on the receiving end.\nWhile he awaits the conclusion of the investigation into his actions, Huang must hope that, despite not tolerating the mistakes of his colleagues in the past, they will be gracious about his own failings.\nAnd he must also live with the irony that he was potentially caught out not by a sophisticated high-tech sting, but by the oldest trick in the book: a honey trap.",

    "summaryJa": "The share price dropped wiped hundreds of billions of dollars from the value of Nvidia.",
    "bodyOriginal": "Nvidia shares tumble over investigation into Huang's affair with alleged Chinese spy\n- Published\nHundreds of billions of dollars have been wiped off the value of Nvidia after the US chipmaker announced an independent investigation would be carried out into its chief executive's affair with an alleged Chinese spy.\nThe tech firm saw its shares fall by about 4% by close of trade on Monday after Jensen Huang admitted having an extramarital affair.\nNvidia's probe came after reports that the US believed the Nvidia boss had been targeted in an espionage campaign by China.\nHowever, China has rejected the claims, with its foreign ministry saying allegations about Chinese spies were \"entirely groundless, speculative and intended to smear and malign China\".\nNvidia said it had no reason to believe the company's secrets or national security were compromised, but a statement by the firm's board of directors said it would begin an investigation in \"light of recent reporting that founder and chief executive Jensen Huang has been the target of a foreign intelligence effort\".\nUS intelligence officials believe Alice Huang, also known as Huang Le, was a spy for Beijing, according to a New York Times report, external.\nThe report said Secretary of State Marco Rubio sent a memo to top officials in Washington last spring warning that the Nvidia boss was in a close relationship with a Chinese spy.\nAlice Huang was managing director of Singaporean company Megaspeed, which has had dealings with Nvidia.\nJensen Huang admitted he was \"unfaithful\" to his wife and apologised for hurting her and their children. He added he was \"committed to protecting Nvidia and supporting America's national security\" and would cooperate with the investigation.\nThe Nvidia co-founder has also been requested to appear for a joint closed-door briefing for several Congressional committees next week.\nMembers of the US House Foreign Affairs Committee last week asked Jensen Huang to appear for a closed-door briefing on his interactions with Alice Huang, as well as Nvidia's security protocols around espionage.\n\"Recent reports raise significant national security concerns regarding the PRC's [China's] access to sensitive US technology and information,\" congressmen Brian Mast, John Moolenaar, and Rick Crawford wrote in a letter.\n\"It is vital that Congress determines the extent to which US national security has been placed at risk.\"\nAfter Nvidia's investigation was announced, other big tech bosses, including Elon Musk, came out in support of Jensen Huang to continue leading the firm.\nUS President Donald Trump said the Nvidia boss was an \"honourable guy\".\nHowever, the news sparked a sell-off in Nvidia's shares, with about $250bn (£190bn) wiped of the company's market value.\nWhile Nvidia shares fell, the US stock market opened the week on a positive note after last week's turmoil, with Nvidia's rival chipmakers benefiting.\nBut analysts suggested the hit to the company would be short-lived. Victoria Fernandez, chief market strategist at Crossmark Global Investments said investors would not abandon Nvidia, because the chipmaker was so important to the AI industry.\n\"Nvidia is the core of this AI trade, and without them, all these other pieces start to fall apart because the financing's not there,\" she told the BBC.\nJensen Huang co-founded Nvidia, which is central to making the hardware for emerging AI technologies, with two other engineers in 1993.\nIts chips were initially designed for gaming, but he decided to turn its focus on AI development, turning it into the world's second most valuable company.\nHuang's position vulnerable unlike other tech bosses\nA key concern for investors going forward is what would happen to Nvidia if Jensen Huang was removed from the company, as Fernandez said there was \"no natural successor\" to the chief executive.\nJensen Huang, unlike other founders in the tech industry, is vulnerable to any move by Nvidia's board of directors to oust him.\nHe owns only around 3.5% of the company, and Nvidia operates on a single class voting structure, meaning his stake would not be enough to act as a veto power over any board decision.\nBy contrast, many tech founders who lead their companies, including Mark Zuckerberg of Meta and Musk of Tesla and SpaceX, hold significant percentages of multiple types of stock in their companies.\nFernandez said she does not believe the board will remove Jensen Huang as chief executive, unless there is glaring evidence of wrongdoing related to national security or intellectual property, \"but I bet they start bringing someone up as his number two, to have there for the future.\"\nThe modest fall in its shares mean investors believe it is unlikely he will step down or be removed as chief executive, but that the outcome of the investigation will be closely watched.\nEven people who do not directly own shares in Nvidia can be affected by rises and falls in its value. Pensions or savings invested in pots which have stakes in the company through index tracking funds can be impacted, for example.\nWhat we know so far about Jensen Huang's affair with suspected Chinese spy\n- Published1 hour ago\nNvidia chips have been a major focus of the AI race between the US and China and the White House has previously imposed controls on where its advanced products can be sold.\nThe H200, Nvidia's second most advanced semiconductor, had previously been restricted by Washington over concerns that it would give China's technology industry an edge over the US.\nBut Jensen Huang has been against restricting the sale of Nvidia's chips to China, arguing that it would be better for the global rollout of AI to be powered by US technology.\nIn January, the Trump administration said it would allow the company to sell its H200 chips to Chinese customers under certain conditions.\nAdditional reporter by Samira Hussain, North America business correspondent.",

r for a closed-door briefing on his interactions with Alice Huang, as well as Nvidia's security protocols around espionage.\n\"Recent reports raise significant national security concerns regarding the PRC's [China's] access to sensitive US technology and information,\" congressmen Brian Mast, John Moolenaar, and Rick Crawford wrote in a letter.\n\"It is vital that Congress determines the extent to which US national security has been placed at risk.\"\nAfter Nvidia's investigation was announced, other big tech bosses, including Elon Musk, came out in support of Jensen Huang to continue leading the firm.\nUS President Donald Trump said the Nvidia boss was an \"honourable guy\".\nHowever, the news sparked a sell-off in Nvidia's shares, with about $250bn (£190bn) wiped of the company's market value.\nWhile Nvidia shares fell, the US stock market opened the week on a positive note after last week's turmoil, with Nvidia's rival chipmakers benefiting.\nBut analysts suggested the hit to the company would be short-lived. Victoria Fernandez, chief market strategist at Crossmark Global Investments said investors would not abandon Nvidia, because the chipmaker was so important to the AI industry.\n\"Nvidia is the core of this AI trade, and without them, all these other pieces start to fall apart because the financing's not there,\" she told the BBC.\nJensen Huang co-founded Nvidia, which is central to making the hardware for emerging AI technologies, with two other engineers in 1993.\nIts chips were initially designed for gaming, but he decided to turn its focus on AI development, turning it into the world's second most valuable company.\nHuang's position vulnerable unlike other tech bosses\nA key concern for investors going forward is what would happen to Nvidia if Jensen Huang was removed from the company, as Fernandez said there was \"no natural successor\" to the chief executive.\nJensen Huang, unlike other founders in the tech industry, is vulnerable to any move by Nvidia's board of directors to oust him.\nHe owns only around 3.5% of the company, and Nvidia operates on a single class voting structure, meaning his stake would not be enough to act as a veto power over any board decision.\nBy contrast, many tech founders who lead their companies, including Mark Zuckerberg of Meta and Musk of Tesla and SpaceX, hold significant percentages of multiple types of stock in their companies.\nFernandez said she does not believe the board will remove Jensen Huang as chief executive, unless there is glaring evidence of wrongdoing related to national security or intellectual property, \"but I bet they start bringing someone up as his number two, to have there for the future.\"\nThe modest fall in its shares mean investors believe it is unlikely he will step down or be removed as chief executive, but that the outcome of the investigation will be closely watched.\nEven people who do not directly own shares in Nvidia can be affected by rises and falls in its value. Pensions or savings invested in pots which have stakes in the company through index tracking funds can be impacted, for example.\nWhat we know so far about Jensen Huang's affair with suspected Chinese spy\n- Published1 hour ago\nNvidia chips have been a major focus of the AI race between the US and China and the White House has previously imposed controls on where its advanced products can be sold.\nThe H200, Nvidia's second most advanced semiconductor, had previously been restricted by Washington over concerns that it would give China's technology industry an edge over the US.\nBut Jensen Huang has been against restricting the sale of Nvidia's chips to China, arguing that it would be better for the global rollout of AI to be powered by US technology.\nIn January, the Trump administration said it would allow the company to sell its H200 chips to Chinese customers under certain conditions.\nAdditional reporter by Samira Hussain, North America business correspondent.",

    "id": "how-a-civil-servant-got-away-with-juggli-14d6f657",
    "title": "How a civil servant got away with juggling five jobs for so long",
    "titleJa": "How a civil servant got away with juggling five jobs for so long",
    "summaryJa": "Kashim Chowdhury has been convicted of fraud after pocketing £284,000 of taxpayers' money over three years.",
    "bodyOriginal": "How a civil servant got away with juggling five jobs for so long\n- Published\nAleesha Adams joined a video call with Kashim Chowdhury in May 2023.\nHe'd been on sick leave from his job at the UK Health Security Agency (UKHSA) for nearly three months and Adams, his line manager, wanted to put a plan in action to ease him back into work.\nAt the start of the call, Chowdhury was coughing and waving tissues up to the camera in an attempt to show how ill he was. But what really caught Adams' attention was how pale he looked.\nShe noticed white powder had started separating from his forehead. \"He was sweating, it was like rubbing off, so it was darker underneath and darker on the neck,\" she told his trial.\nShe claimed he was wearing white make-up to look sick. Something he denied in court.\nFraudulent behaviour went undetected\nLittle did she know UKHSA was not Chowdhury's only employer.\nThat month, he was also being paid to work full-time for the Department for the Environment, Food and Rural Affairs (Defra), the Department for Business and Trade, the Food Standards Agency and the Home Office. He was contracted to work 183 hours a week – more than the number of hours in seven days. He fraudulently earned more than £284,000 of taxpayers' money.\nIn total, he had eight overlapping full-time public-sector jobs between 2020 and 2023. During that time, this relatively junior civil servant was paid £350,000.\nSoon after her call with Chowdhury, Adams discovered that he had logged into the call using a Defra email address. When she challenged him about it, he blamed it on a technical error. She told the jury at his trial at Southwark Crown Court: \"I believed he was lying.\" She escalated her concerns up the chain.\nBut his fraudulent behaviour remained undetected. Chowdhury was able to keep working multiple government jobs until September 2023 when he left the Civil Service.\nHe was finally caught in 2024 by the government's National Fraud Initiative, which conducts searches of Civil Service databases, such as payroll, every two years to look for anomalies.\nOn Monday he was found guilty of nine counts of fraud and told by the judge that he would be facing a \"very substantial custodial sentence\".\nChowdhury, 56, arrived each day at court alone. He is married, yet there never seemed to be any friends or family there to support him.\nHe would often make his way down the corridors of the court building carrying two plastic carrier bags, with a bobble hat perched on his head.\nHe sometimes looked bewildered in the witness box.\nChowdhury, who had a diagnosis of PTSD in 2015, said that he had taken on so many roles because he feared losing his livelihood after experiencing insecure employment. He said he'd been forced out of a job at the Department for Education in 2013.\nHe said he hadn't been thinking clearly when applying for jobs ''because of my stress, distress and trauma and due to my panic at the time\".\nBut the prosecution argued his behaviour was \"deliberate\" and \"intentional dishonesty\" and that he had exploited the system.\nHowever, the case raises important questions for the Civil Service. How was he able to get away with it for so long?\nPart of the explanation is that the Civil Service's human resources system is not centralised. Chowdhury did not declare on government application forms that he was already a civil servant, so the system did not spot the duplication.\nHannah Keenan, who works at the Institute for Government, says the system clearly failed. \"Government departments are taking hiring decisions independently of each other and without systems that join up,\" she said.\n\"That the model and the culture surrounding it aren't working shouldn't be a surprise though - we've known for a long time about poor performers flying under the radar by shuffling between jobs.\"\nThere are more than 550,000 people employed across the Civil Service, many in offices in Whitehall, in central London. They are responsible for carrying out government policy and the daily administration of the country.\nAnother reason why Chowdhury's fraud went undetected is that he was working entirely from the east London house he shared with his mother. In 2023, she had dementia and terminal cancer, and he told his employers that he needed to be at home to look after her.\nBut rather than reducing his workload to concentrate on her care, he took on more jobs. He covered up his impossible daily schedule by getting sick notes from his GP.\nIn April 2023, he was off with what he called \"mixed anxiety and depressive disorder\" from Defra, the UKHSA, the Department for Business and Trade and the Food Standards Agency.\nWhile the sick notes were shown to the jury, they were not given evidence about what caused the depressive disorder or of a psychiatric assessment having been done during this period.\nHis sickness did not prevent him from starting yet another job – this time at the Home Office. He did not mention to them he was ill, nor did he tell them he was working elsewhere.\nUnsurprisingly, a succession of his line managers told the jury he had not been very good at his jobs.\nEspecially damning was the evidence given by Dan McCartney, who managed Chowdhury at Defra. He said he had to \"effectively tell him what to do the whole time\" and that Chowdhury kept his camera off during video calls for four months, claiming technical problems.\nBut because Chowdhury was not subject to any formal performance measures at Defra, he was given a permanent job. He remained there for two years.\nIn September 2023, Chowdhury was found to have more than £40,000 in his bank accounts as well as significant investments, including £45,000 in premium bonds.\n'Risk averse' Civil Service\nA recent survey of 1,700 civil servants by the independent think tank Re:State found 76% of respondents thought it did not do a good job of tackling poor performers.\nAn ex-senior civil servant told the BBC that much of the Civil Service is culturally averse to performance management.\n\"Whitehall's known for ages it has to be less risk averse. Shrinking the Civil Service and the adoption of artificial intelligence technology make that more vital,\" they said.\n\"But don't underestimate the fear factor: fear of drawn-out grievances and fear of being accused of wasting taxpayers' money if the Civil Service was to do what big private sector firms do, which is cut to get rid of poor performers by offering some money and a settlement agreement.\"\nA Defra spokesperson said: \"Kashim Chowdhury abused the trust placed in him as a public servant and defrauded taxpayers out of almost £285,000. He will now rightly face the consequences for his actions.\n\"This conviction is the result of a thorough and painstaking investigation led by the Defra Counter Fraud and Investigations team. It sends a clear message that fraud against the public purse will not be tolerated and those responsible will be held to account.\"\nThe spokesperson said Defra would use \"all available avenues to recover the proceeds of Chowdhury's offending on behalf of taxpayers\".\nChowdhury's case also illustrates a wider issue.\nHe was engaged in what is being called \"polygamous working\", where people hold down several jobs secretly. Websites have even been set up offering people advice on how to keep their employers in the dark.\nIts rise has been blamed on larger numbers of people working from home.\nThe government's National Fraud Initiative has identified 23 cases of \"polygamous working\" across London in its most recent report. It uncovered £500,000 of overpaid salaries over a period of a few months.\nAlongside the fraud case, Chowdhury is involved in a legal dispute with his three siblings, who accuse him of ''bullying'' their mother into signing over half of her £2.1m home to him in the final days of her life. He denies it.\nAt times during his criminal trial, Chowdhury appeared confused by what he was hearing and blamed trauma for the web of lies he had spun. The jury took seven hours to reach their verdict and decided he was motivated by personal gain - stealing tens of thousands of pounds from the taxpayer.\nChowdhury now faces a significant custodial sentence.\nRelated topics\n- Published8 hours ago",

    "id": "poundland-unable-to-buy-new-stock-as-fea-9538a9ef",
    "title": "Poundland unable to buy new stock as fears over collapse grow",
    "titleJa": "Poundland unable to buy new stock as fears over collapse grow",
    "summaryJa": "The discount chain is continuing to edge towards collapse and is said to be \"running on fumes\", according to one insider.",
    "bodyOriginal": "Poundland unable to buy new stock as fears over collapse grow\n- Published\nPoundland is unable to buy new stock to fill its shelves after being blocked by its owners from accessing cash in its bank accounts.\nThe discount chain is on the brink of collapse with one insider describing it as \"running on fumes\". It has until Thursday to secure a rescue deal.\nAbout £50m has been frozen by its American owner Gordon Brothers, the BBC understands, meaning its 600 shops are running out of stock.\nPressure is building on Gordon Brothers, which bought Poundland for £1 last June, after the owner rejected a takeover bid that could have saved the thousands of jobs currently at risk. Gordon Brothers has been approached for comment.\nPoundland has filed a notice of intention to appoint administrators, which protects it from its creditors until Thursday.\nAccess to funds was limited because of a tension between Gordon Brothers' dual role as both creditor and shareholder, a source said, but added they expected a relaxation of funds in the next two days.\nLast week, Poundland boss Barry Williams told staff like-for-like sales, which exclude new store openings, were up 11.4% last week, which included Halloween, but said this was £1.5m ahead of budget.\nHe said the business made a profit of £18.1m in the year to September, which was a \"strong recovery\" from the previous year where the business made losses of £68m.\nThe latest annual accounts have yet to be audited.\nBurnham 'ready to support' Poundland staff as retailer faces collapse\n- Published29 October\nPoundland staff protest after chain approach administrators\n- Published29 October\nHowever, Gordon Brothers has painted a different picture of the business, saying the chain remains \"challenged and vulnerable to any potential downturn in future trading\".\nIt said it had provided significant funding to support the company's ability to trade since it acquired the business.\nIt has also made £18m, from a combination of debt interest payments and other fees and charges.\nOn Wednesday, executives from Gordon Brothers will appear before the Business Select Committee with MPs probing whether they are genuinely pursuing a solvent rescue of the business, which has 11,000 employees, and whether every realistic step is being taken to protect jobs and stores.\nThe session is being held in private given commercially sensitive discussions are still under way with bidders.\nUncertain future\nOn Thursday, the 10-day moratorium to protect Poundland from its creditors expires, but if there is a prospect of a solvent deal, the deadline could be extended.\nIf not, Poundland is set to collapse into administration and could be broken up.\nA source familiar with the sales process said London-based Xyra Group was making \"significant progress\" in its last minute bid to buy Poundland and could now be the front runner.\nAn extension of Thursday's deadline now seems an increasingly likely scenario. But such a case would be difficult to put forward if Gordon Brothers continues to block funding.\nOne observer remarked \"if Gordon Brothers is going in front of that committee, you don't want to be giving the message we're pulling up the drawbridge\".\nEven if a deal is agreed to sell the business as a whole, there is no guarantee a new owner would not reduce the number of stores, but suppliers to Poundland would prefer that outcome to hundreds of sites being sold off to other retailers.\nThere has been interest from the likes of Poundstretcher, Tesco and B&M in picking up stores which could mean continuing employment for many workers.\nThe central issue is whether a piecemeal sale would protect more jobs than a buyer willing to keep Poundland trading as a national chain.",
    "bodyJa": "Poundland unable to buy new stock as fears over collapse grow\n- Published\nPoundland is unable to buy new stock to fill its shelves after being blocked by its owners from accessing cash in its bank accounts.\nThe discount chain is on the brink of collapse with one insider describing it as \"running on fumes\". It has until Thursday to secure a rescue deal.\nAbout £50m has been frozen by its American owner Gordon Brothers, the BBC understands, meaning its 600 shops are running out of stock.\nPressure is building on Gordon Brothers, which bought Poundland for £1 last June, after the owner rejected a takeover bid that could have saved the thousands of jobs currently at risk. Gordon Brothers has been approached for comment.\nPoundland has filed a notice of intention to appoint administrators, which protects it from its creditors until Thursday.\nAccess to funds was limited because of a tension between Gordon Brothers' dual role as both creditor and shareholder, a source said, but added they expected a relaxation of funds in the next two days.\nLast week, Poundland boss Barry Williams told staff like-for-like sales, which exclude new store openings, were up 11.4% last week, which included Halloween, but said this was £1.5m ahead of budget.\nHe said the business made a profit of £18.1m in the year to September, which was a \"strong recovery\" from the previous year where the business made losses of £68m.\nThe latest annual accounts have yet to be audited.\nBurnham 'ready to support' Poundland staff as retailer faces collapse\n- Published29 October\nPoundland staff protest after chain approach administrators\n- Published29 October\nHowever, Gordon Brothers has painted a different picture of the business, saying the chain remains \"challenged and vulnerable to any potential downturn in future trading\".\nIt said it had provided significant funding to support the company's ability to trade since it acquired the business.\nIt has also made £18m, from a combination of debt interest payments and other fees and charges.\nOn Wednesday, executives from Gordon Brothers will appear before the Business Select Committee with MPs probing whether they are genuinely pursuing a solvent rescue of the business, which has 11,000 employees, and whether every realistic step is being taken to protect jobs and stores.\nThe session is being held in private given commercially sensitive discussions are still under way with bidders.\nUncertain future\nOn Thursday, the 10-day moratorium to protect Poundland from its creditors expires, but if there is a prospect of a solvent deal, the deadline could be extended.\nIf not, Poundland is set to collapse into administration and could be broken up.\nA source familiar with the sales process said London-based Xyra Group was making \"significant progress\" in its last minute bid to buy Poundland and could now be the front runner.\nAn extension of Thursday's deadline now seems an increasingly likely scenario. But such a case would be difficult to put forward if Gordon Brothers continues to block funding.\nOne observer remarked \"if Gordon Brothers is going in front of that committee, you don't want to be giving the message we're pulling up the drawbridge\".\nEven if a deal is agreed to sell the business as a whole, there is no guarantee a new owner would not reduce the number of stores, but suppliers to Poundland would prefer that outcome to hundreds of sites being sold off to other retailers.\nThere has been interest from the likes of Poundstretcher, Tesco and B&M in picking up stores which could mean continuing employment for many workers.\nThe central issue is whether a piecemeal sale would protect more jobs than a buyer willing to keep Poundland trading as a national chain.",

    "id": "nvidia-s-ceo-turmoil-gives-newly-empower-d88cd9ae",
    "title": "Nvidia's CEO turmoil gives newly empowered Democrats fresh ammunition in pursuit of oversight",
    "titleJa": "Nvidia's CEO turmoil gives newly empowered Democrats fresh ammunition in pursuit of oversight",
    "summaryJa": "Nvidia CEO Jensen Huang's extramarital affair with an alleged Chinese spy comes as the company is already about to face heightened scrutiny.",
    "bodyOriginal": "Nvidia CEO Jensen Huang's close ties to the U.S. government were already poised to loosen with Democrats winning control of Congress and promising far more oversight of AI development than what the chip giant has experienced under Republican leadership.\nThat was before Huang admitted on Sunday to having an extramarital affair with a businesswoman who intelligence agencies say is a Chinese spy. The woman, Alice Huang, is affiliated with an Nvidia customer called Megaspeed that's been accused of helping restricted Chinese companies acquire Nvidia's artificial intelligence chips.\nHuang apologized to staffers in a note on Sunday for being \"unfaithful to my wife,\" and said the company's board was investigating any related national security concerns. Nvidia's board said it has \"confidence in Jensen,\" who co-founded the company in 1993 and has led it ever since, building a net worth of more than $150 billion in the process.\nEven before last week's midterm elections, which saw Democrats win sweeping majorities in the House and Senate, vocal party leaders wanted answers from Huang about China's access to advanced Nvidia chips and his company's lobbying for favorable legislation. Sen. Elizabeth Warren of Massachusetts said days before the election, when the spy story was first surfacing, that \"we must pass bipartisan legislation to keep our advanced AI technology out of China's hands.\" Months before that, in June, Huang declined an invitation from Warren to testify before the Senate Banking Committee.\nWith Democrats about to take the gavel, Delaware Sen. Chris Coons, who is in line to chair the Senate Foreign Relations Committee, wrote on X on Saturday that \"Congress will investigate and get answers,\" following the allegations that appeared in a New York Times report Friday.\nIt's a sharp reversal for Huang, who gained first-name status with President Donald Trump and has been closely allied with the administration in trying to limit AI regulation. Nvidia shares plunged 12% in the two days after the election, pacing a drop in AI-related stocks, on fears that incoming lawmakers, at the federal and state levels, and a host of newly passed ballot measures will slow the buildout and halt the AI boom.\nHuang is a singular voice in the AI industry, as his company's technology is used to train nearly all major AI models. He's also turned Nvidia into an essential source of financing for AI startups, and pulled together some of the biggest names on Wall Street into a group that announced plans in August to raise $500 billion for investing in the buildout.\nAt Nvidia, Huang is the sole public face of the company and has no clear second-in-command. He decides which projects are a strategic priority, and frequently sends short emails to individual engineers about details. Huang has said he has 60 direct reports and reviews every employee's salary. Meanwhile, he packs his calendar with meetings with world leaders and CEOs, alongside keynote speeches at conferences and trade shows.\n\"Nvidia is not an ordinary company and Jensen is not an ordinary CEO; he IS Nvidia,\" Bernstein analyst Stacy Rasgon wrote in a note on Sunday, adding that it's not clear who would succeed him.\nPatrick Moorhead, CEO at Moor Insights & Strategy, said in an email that \"Jensen holding so much power is why Nvidia moves faster than anyone.\"\nChange is on the way\nUnlike many of his tech peers, Huang is not chairman of the board. Rather, he's one of 11 board members, and there's no designated chair.\nOne investor close to Huang told CNBC that, depending on what the board's investigation finds, he could foresee Huang taking a leave of absence.\n\"Today's news will not slow Nvidia,\" a company spokesperson said in a statement. \"Jensen is committed to continuing to lead Nvidia as CEO without interruption.\"\nBut scrutiny of Nvidia is set to intensify on Wall Street and in Washington, where Huang's level of influence is almost certain to change.\nHe has been a major advocate for more chip exports to China, arguing that it's better for AI labs there to build on American technology than to encourage the development of domestic alternatives. Huang joined Trump on Air Force One in May on a China trip that's now raised additional questions about what the administration and Huang knew about Chinese spying at the time.\nOne question Democrats are likely to probe is whether the Trump administration was aware of Huang's relationship with the alleged Chinese spy, and whether the Nvidia CEO influenced American policy, said Sam Bresnick, a research fellow at the Center for Security and Emerging Technology.\n\"That is going to be very high up on the Democrats' lists of people to investigate to try to figure out to what extent was the Trump administration aware of what was going on,\" Bresnick said.\nBut pressure isn't just coming from Democrats. House Republican leaders have already asked Huang for a closed-door briefing on Chinese spying issues later this month.\nTrump has continued to back Huang, telling reporters on Sunday that he's an \"honorable guy\" and has \"done an amazing job for our country.\"\n\"I think he probably has an excuse for it,\" Trump said of the incident.\nCritical time on Wall Street\nAmid all the noise about the election results and the spying revelations, Nvidia is facing a crucial stretch on the markets.\nNeoclouds CoreWeave and Nebius, which are both backed by Nvidia and are big buyers of its chips, are scheduled to report earnings this week after their stocks lost roughly half their value over the past month. Investors are particularly concerned about their hefty debt loads and how they'll continue to fund their buildouts with interest rates rising and lenders turning skittish.\nNvidia has its own earnings report coming on Nov. 17, when Huang, assuming he sticks with the typical format, will face questions from analysts. And then there's the Anthropic initial public offering, which is critical for Nvidia as it's both an investor in the Claude creator and counts the AI lab as a significant customer.\nA couple of weeks after earnings, Nvidia is hosting a large conference in Washington, D.C., where Huang is scheduled to give the keynote on Dec. 1.\nBullish investors and analysts can still point to the insatiable demand for Nvidia's technology. The company recently projected 70% sales growth in its upcoming fiscal year. Analysts polled by FactSet expect nearly $694 billion in fiscal 2028 sales.\n\"We believe demand for the company's products seems unlikely to be affected,\" Rasgon wrote. \"But it seems plausible to postulate increased risks (regulatory etc.) as AI buildouts become an increasingly political issue.\"\n— CNBC's Seema Mody, Katie Tarasov, Ashley Capoot and MacKenzie Sigalos contributed reporting to this report.",
    "bodyJa": "Nvidia CEO Jensen Huang's close ties to the U.S. government were already poised to loosen with Democrats winning control of Congress and promising far more oversight of AI development than what the chip giant has experienced under Republican leadership.\nThat was before Huang admitted on Sunday to having an extramarital affair with a businesswoman who intelligence agencies say is a Chinese spy. The woman, Alice Huang, is affiliated with an Nvidia customer called Megaspeed that's been accused of helping restricted Chinese companies acquire Nvidia's artificial intelligence chips.\nHuang apologized to staffers in a note on Sunday for being \"unfaithful to my wife,\" and said the company's board was investigating any related national security concerns. Nvidia's board said it has \"confidence in Jensen,\" who co-founded the company in 1993 and has led it ever since, building a net worth of more than $150 billion in the process.\nEven before last week's midterm elections, which saw Democrats win sweeping majorities in the House and Senate, vocal party leaders wanted answers from Huang about China's access to advanced Nvidia chips and his company's lobbying for favorable legislation. Sen. Elizabeth Warren of Massachusetts said days before the election, when the spy story was first surfacing, that \"we must pass bipartisan legislation to keep our advanced AI technology out of China's hands.\" Months before that, in June, Huang declined an invitation from Warren to testify before the Senate Banking Committee.\nWith Democrats about to take the gavel, Delaware Sen. Chris Coons, who is in line to chair the Senate Foreign Relations Committee, wrote on X on Saturday that \"Congress will investigate and get answers,\" following the allegations that appeared in a New York Times report Friday.\nIt's a sharp reversal for Huang, who gained first-name status with President Donald Trump and has been closely allied with the administration in trying to limit AI regulation. Nvidia shares plunged 12% in the two days after the election, pacing a drop in AI-related stocks, on fears that incoming lawmakers, at the federal and state levels, and a host of newly passed ballot measures will slow the buildout and halt the AI boom.\nHuang is a singular voice in the AI industry, as his company's technology is used to train nearly all major AI models. He's also turned Nvidia into an essential source of financing for AI startups, and pulled together some of the biggest names on Wall Street into a group that announced plans in August to raise $500 billion for investing in the buildout.\nAt Nvidia, Huang is the sole public face of the company and has no clear second-in-command. He decides which projects are a strategic priority, and frequently sends short emails to individual engineers about details. Huang has said he has 60 direct reports and reviews every employee's salary. Meanwhile, he packs his calendar with meetings with world leaders and CEOs, alongside keynote speeches at conferences and trade shows.\n\"Nvidia is not an ordinary company and Jensen is not an ordinary CEO; he IS Nvidia,\" Bernstein analyst Stacy Rasgon wrote in a note on Sunday, adding that it's not clear who would succeed him.\nPatrick Moorhead, CEO at Moor Insights & Strategy, said in an email that \"Jensen holding so much power is why Nvidia moves faster than anyone.\"\nChange is on the way\nUnlike many of his tech peers, Huang is not chairman of the board. Rather, he's one of 11 board members, and there's no designated chair.\nOne investor close to Huang told CNBC that, depending on what the board's investigation finds, he could foresee Huang taking a leave of absence.\n\"Today's news will not slow Nvidia,\" a company spokesperson said in a statement. \"Jensen is committed to continuing to lead Nvidia as CEO without interruption.\"\nBut scrutiny of Nvidia is set to intensify on Wall Street and in Washington, where Huang's level of influence is almost certain to change.\nHe has been a major advocate for more chip exports to China, arguing that it's better for AI labs there to build on American technology than to encourage the development of domestic alternatives. Huang joined Trump on Air Force One in May on a China trip that's now raised additional questions about what the administration and Huang knew about Chinese spying at the time.\nOne question Democrats are likely to probe is whether the Trump administration was aware of Huang's relationship with the alleged Chinese spy, and whether the Nvidia CEO influenced American policy, said Sam Bresnick, a research fellow at the Center for Security and Emerging Technology.\n\"That is going to be very high up on the Democrats' lists of people to investigate to try to figure out to what extent was the Trump administration aware of what was going on,\" Bresnick said.\nBut pressure isn't just coming from Democrats. House Republican leaders have already asked Huang for a closed-door briefing on Chinese spying issues later this month.\nTrump has continued to back Huang, telling reporters on Sunday that he's an \"honorable guy\" and has \"done an amazing job for our country.\"\n\"I think he probably has an excuse for it,\" Trump said of the incident.\nCritical time on Wall Street\nAmid all the noise about the election results and the spying revelations, Nvidia is facing a crucial stretch on the markets.\nNeoclouds CoreWeave and Nebius, which are both backed by Nvidia and are big buyers of its chips, are scheduled to report earnings this week after their stocks lost roughly half their value over the past month. Investors are particularly concerned about their hefty debt loads and how they'll continue to fund their buildouts with interest rates rising and lenders turning skittish.\nNvidia has its own earnings report coming on Nov. 17, when Huang, assuming he sticks with the typical format, will face questions from analysts. And then there's the Anthropic initial public offering, which is critical for Nvidia as it's both an investor in the Claude creator and counts the AI lab as a significant customer.\nA couple of weeks after earnings, Nvidia is hosting a large conference in Washington, D.C., where Huang is scheduled to give the keynote on Dec. 1.\nBullish investors and analysts can still point to the insatiable demand for Nvidia's technology. The company recently projected 70% sales growth in its upcoming fiscal year. Analysts polled by FactSet expect nearly $694 billion in fiscal 2028 sales.\n\"We believe demand for the company's products seems unlikely to be affected,\" Rasgon wrote. \"But it seems plausible to postulate increased risks (regulatory etc.) as AI buildouts become an increasingly political issue.\"\n— CNBC's Seema Mody, Katie Tarasov, Ashley Capoot and MacKenzie Sigalos contributed reporting to this report.",
