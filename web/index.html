    "bodyOriginal": "Iran's foreign minister said on Friday that a return to diplomatic negotiations with the U.S. is not out of the question, as Tehran set out its conditions for the reopening of the strategically vital Strait of Hormuz.\nThe U.S.-Iran war has been raging for six months and talks between the belligerents appear to have collapsed, but Seyed Abbas Araghchi wrote in an X post that \"putting diplomacy back on track isn't impossible.\"\nAraghchi said that following \"creative discussions\" with Qatari officials on Thursday to reopen a safe transit route through the Strait of Hormuz, the potential for renewed negotiations with Washington \"hinges on U.S. understanding of one simple fact: pressure doesn't work.\"\nHe added: \"The U.S. should build trust, speak respectfully, acknowledge our rights, and uphold commitments.\"\nThe comments come shortly after U.S. President Donald Trump said Washington was not currently talking with Iran as it continues to focus on its economic campaign against the regime.\n\"We don't want to speak to them. We're not looking to meet or anything,\" Trump told reporters in the Oval Office on Thursday.\nOil prices traded slightly lower on Friday as energy market participants continued to closely monitor crude flows through the Strait of Hormuz.\nInternational benchmark Brent crude futures with October delivery dipped 0.1% to $89.63 per barrel, while U.S. West Texas Intermediate futures with October delivery fell 0.5% to $83.11.\nTehran: Lebanon, Gaza and Syrian conflicts must cease\nIn an interview on Thursday, Mohsen Rezaei, secretary of Iran's Supreme National Security Council, told Lebanese media outlet Al Manar TV that any understanding on the Strait of Hormuz with the U.S. will include an end to wars and military operations in Lebanon, Gaza and Syria.\nHe added that the conflict in the Gaza Strip has to end, while demanding that Israel withdraw from Lebanon and halt attacks on Syria.\nRezaei said that the Strait of Hormuz cannot be separated from the broader regional conflict, adding that the U.S. must \"prove its seriousness\" in implementing these commitments \"before any new trust could be established.\"\nHowever, a return to diplomacy does not seem imminent. The Wall Street Journal reported on Thursday that the Trump administration has no interest in going back to the terms of the memorandum of understanding it reached with Iran in June.\nCiting people familiar with the matter, the Journal said that Trump was no longer interested in the June deal framework, and is instead waiting to see if his administration's strategy of pressuring Iran economically will work.\nThe U.S. on Monday announced an \"economic D-Day\" campaign against Teheran, threatening countries that do business with the Islamic Republic, shifting its focus from military action to economic pressure.\nTemporary relief\nIran is now allowing a \"temporary and limited\" corridor for ships to pass through the Hormuz, and the future of maritime traffic will depend on developments in understandings with Washington, according to Rezaei.\nEarlier this week, Oman and Iran discussed a proposal to establish a temporary joint shipping route through the Strait of Hormuz as well as a mission to clear mines from the key oil export corridor.\nHowever, a video posted on X late Thursday stateside by Admiral Brad Cooper, commander of U.S. Central Command credited U.S. forces for clearing the mines from the strait.\nCentcom forces have helped facilitate the transit of approximately 1,500 commercial vessels and 750 million barrels of crude oil over the past several months, Cooper said. \"Today, international shipping lanes are open, and momentum is building.\"\nHowever, the latest available Kpler data showed that only five ships crossed Hormuz on Tuesday, a far cry from the approximately 130 ships that used to transit the crucial waterway before the war broke out in February.",

    "title": "Marvell shares tumble 8% as outlook underwhelms despite 37% revenue growth",
    "titleJa": "マーベル株は37%の売上成長にもかかわらず見通しが厳しいため8%下落",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Marvell Technology shares fell 8% in premarket trading despite a second-quarter revenue beat, as its raised fiscal 2028 outlook failed to meet investors' elevated expectations.\nThe chipmaker said it now expects revenue to grow about 50% year-on-year to around $18 billion, higher than its previous forecast of $16.5 billion.\nRevenue rose 37% to $2.7 billion in its fiscal second quarter. That came in $39 million above the company guidance provided in May.\nMarvell, which makes networking, connectivity and custom chips used in AI data centers, offered limited detail on its fiscal 2028 outlook, dampening investor sentiment after hopes that a Google partnership worth up to $12.2 billion in shares would further boost earnings.\nThe stock was last trading down 8%. It's up 184% this year, buoyed by demand for its products used in AI infrastructure.\nMarvell's Chairman and CEO Matt Murphy said the results were driven by continued strong demand across the company's data center portfolio, where revenue growth accelerated to 46% year over year.\n\"AI-related bookings remain exceptionally robust, and we expect our revenue growth to accelerate further through the remainder of fiscal 2027,\" Murphy added.\nThe Google partnership, announced last week, allows the tech giant to buy up to 58.97 million Marvell shares at $206.58 each, subject to purchase targets through fiscal 2033.\nMarvell said the agreement covers products that work with Google's TPU systems, including AI inference chips, storage controllers and network interface controllers.\nGoldman Sachs analysts noted \"high investor expectations\" ahead of the quarter.\n\"We believe investor expectations were elevated heading into the quarter based on robust spending at key customers, as well as the previously disclosed Google relationship,\" the analysts said in a Thursday note.\nThe results were an \"incremental positive\" for the stock, they added. Goldman Sachs remains neutral on Marvell as the investment bank noted that it trades at a higher valuation than its peers and there is less certainty about its ability to add custom-chip customers.",
    "bodyJa": "マーベル・テクノロジー株は、上方修正された2028年度見通しが投資家の高い期待に応えられなかったため、第2四半期の売上高が伸びたにもかかわらず、市場前の取引で8％下落した。\n同社は、売上高が前年比約50％増の約180億ドルになると予想しており、従来予想の165億ドルを上回っていると述べた。\n第 2 四半期の売上高は 37% 増加して 27 億ドルになりました。これは5月に提示された企業指針を3900万ドル上回った。\nAIデータセンターで使用されるネットワーキング、接続、カスタムチップを製造するマーベルは、2028会計年度の見通しについて限定的な詳細しか示さず、最大122億ドル相当の株式相当のグーグルとの提携により収益がさらに押し上げられるとの期待を受けて投資家心理を冷やした。\n同株価は直近の取引で８％下落していた。 AIインフラで使用される同社製品の需要に支えられ、今年は184％上昇した。\nマーベルの会長兼最高経営責任者（CEO）のマット・マーフィー氏は、この業績は同社のデータセンターポートフォリオ全体での引き続き強い需要によってもたらされたもので、収益の伸びが前年比46％に加速したと述べた。\n「AI関連の予約は引き続き非常に堅調であり、当社の収益成長は2027会計年度の残りまでさらに加速すると予想しています」とマーフィー氏は付け加えた。\n先週発表されたGoogleとの提携により、テクノロジー大手は2033会計年度までの購入目標を条件として、マーベル株を1株あたり206.58ドルで最大5,897万株購入することができる。\nマーベルによると、この契約はAI推論チップ、ストレージコントローラ、ネットワークインターフェースコントローラなど、GoogleのTPUシステムと連携する製品を対象としているという。\nゴールドマン・サックスのアナリストらは、今四半期を前に「投資家の期待が高い」と指摘した。\nアナリストらは木曜日のメモで、「主要顧客への堅調な支出や、以前に開示されたグーグルとの関係に基づいて、投資家の期待が四半期に向けて高まったと考えている」と述べた。\nその結果、株価は「徐々にプラス」になったと彼らは付け加えた。ゴールドマン・サックスは、マーベルが同業他社よりも高い評価で取引されており、カスタムチップの顧客を追加する能力については確実性が低いと同投資銀行が指摘したため、マーベルに対して中立を保っている。",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Russian forces have intensified attacks within Ukraine's so-called \"fortress belt\" of industrial cities in the eastern Donetsk region, seeking to ramp up pressure on critical Ukrainian strongholds after more than four and a half years of full-scale war.\nRussian forces have long targeted the strategic cities of Kostyantynivka, Kramatorsk and Sloviansk as part of a push to completely capture the Donetsk Oblast, one of the Kremlin's key objectives in the conflict.\nSpeaking at an undisclosed location on Thursday, Russia's Chief of the General Staff Valery Gerasimov said Russian forces had advanced to a position just four kilometers (2.5 miles) from the eastern outskirts of Sloviansk.\nGerasimov also claimed Russian troops had overcome the first defensive line of the Sloviansk-Kramatorsk fortified region in certain areas and that operations were currently advancing along a 160-kilometer front.\nThe report comes shortly after data from Ukrainian open-source mapping group Deep State found that the most active battlefield actions were taking place around Kostyantynivka, which is seen as the gateway to the rest of the Donbas region.\nAnalysts at the Washington-based Institute for the Study of War (ISW) said earlier this week that Russian forces had intensified efforts to advance toward Sloviansk from the east and southeast following unsuccessful attempts from the northeast.\nIn its latest assessment of the Ukraine war, ISW challenged Gerasimov's recent claims of battlefield advances, however, saying they appeared to be designed to construct a narrative of \"pervasive\" Russian military success and \"remain divorced from reality.\"\nAway from the front line, Ukraine's Foreign Minister Andrii Sybiha on Friday welcomed a fresh push from four European Union member states seeking to leverage frozen Russian assets to fund Ukraine's war effort.\n\"It is only fair and logical to use Russian assets, rather than only European taxpayers money', to cover additional costs of defending Ukraine and the rest of Europe from the Russian threat,\" Sybiha said in a social media post.\n\"This discussion needs to be rational, not emotional,\" he added.\nMinisters representing Spain, Sweden, Poland and the Netherlands on Thursday sent a letter to the European Commission, the EU's executive arm, calling on Brussels to restart work on plans to use more than 200 billion euros ($232.9 billion) in Russian central bank assets immobilized under EU sanctions.\nTalks on the initiative, which Russia considers \"blatantly illegal,\" collapsed last year when Belgium blocked the move over liability concerns.",

    "id": "not-far-enough-us-parents-and-teens-on-b55454d8",
    "title": "'Not far enough' - US parents and teens on Meta's new limits for young users",
    "titleJa": "「まだ十分ではない」 - 米国の親と十代の若者、メタの若年ユーザー向けの新しい制限について",
    "summaryJa": "「まだ十分ではない」 - 米国の親と十代の若者、メタの若年ユーザー向けの新しい制限について- 公開されました",
    "bodyOriginal": "'Not far enough' - US parents and teens on Meta's new limits for young users\n- Published\nFor Elizabeth Cardner, a mother of two girls in Houston, Texas, Meta's new limits on how teenagers can use its platforms are a welcome sign that more people are aware of social media's potential dangers.\nBut, she tells the BBC, they probably won't help much in the long-term.\n\"It will save a few arguments at home, but it doesn't go far enough,\" she says.\nThis week, Meta announced new restrictions on its platforms - which include Instagram, Facebook and Whatsapp - as part of an $18bn (£13.25bn) settlement with US states in a lawsuit on social media's effects on children.\nThe company said it would set a daily two-hour time limit, hide the number of likes that a post receives, remove autoplay on videos, mute push notifications during school hours, and ban extreme make-up filters.\nIt also announced changes to its age-verification process and parental controls as well as agreeing to appoint an independent auditor to check the measures are implemented and maintained.\nMany parents across the US see the restrictions as helpful, but are still sceptical. Those who spoke to the BBC described feeling stuck - where they feel they can't cut their children off from social media but also can't protect them from the harms they believe it causes - and they are waiting to see how much of a difference these new rules will make.\nCardner's 14-year-old, Paige, believes the restrictions will lead to \"more real-life scenarios\" and less \"fake content\", which she says dominates social media. She and her sister both approve of hiding the numbers of likes and restricting filters.\nBut Paige sees those gains as short-lived, \"since AI is evolving\".\n\"People will find new ways to have fake filters, and correct certain parts of their videos or pictures,\" she says. \"So I think it'll help until people use other resources to try and find new ways to do that.\"\nCardner says banning her daughters entirely from social media would only result in them being left out by their peers.\n\"Damned if you do, damned if you don't,\" she says. \"I don't think there's any winning on it.\"\nWhat the Meta settlement means for the UK, and other questions after the deal\n- Published21 hours ago\nMeta to pay up to $18bn to settle claims its platforms harm children\n- Published1 day ago\nAnother mother of two teens, Andria Rose, told the BBC that she feels defenceless and \"no matter how much I protect my kids, Facebook, Instagram - they're coming in and literally, like, taking them out of their rooms\".\nEven though she calls Meta's changes \"fantastic\", Rose, who lives near Boston, Massachusetts, doesn't believe they are fully addressing the problem.\n\"They're trying to limit the drug, but they're not controlling the drug,\" she says. \"They're still dealing.\"\nRose notes her personal use of social media costs her sleep at night.\n\"I'm hooked,\" she says. \"So what do you think is going to happen to a kid?\"\nThe settlement was announced on Wednesday in the middle of a highly-anticipated trial, where Meta owner Mark Zuckerberg was expected to testify. The settlement did not include any admission of fault.\nThe lawsuit was originally filed in 2023 by 29 US states, alleging Meta deliberately designed its platforms to be addictive and lied about risks. They also accused it of violating a federal law on collecting children's personal information.\nThe settlement - announced this week - included 48 states, plus the District of Columbia and three US territories.\nSeveral studies have found social media to be harmful to mental health, especially for children. Last year, a BBC investigation found children were being exposed to content about bullying, suicide and weapons on social media platforms.\nFor Rose, Meta's settlement payment \"is like throwing a couple of dollar bills at a problem\", given how much money the company makes and how much she believes the industry profited from children during the pandemic.\nJoanie Story, a mother of four boys in Long Island, takes issue with another part of Meta's announcement - its conditions involving other platforms.\nThe company will withhold $5bn of the settlement, and only release it if YouTube, TikTok and others also enter into similar agreements.\nIt also said it would further tighten its time limit to one hour if other platforms implement similar restrictions. Story sees that as \"petty\".\n\"That's like saying: 'You know, we have the ability to fix what is broken, but we're only gonna fix it halfway,'\" she says.\nStill, Story is greeting the new rules as \"good controls\". She says she saw what a lack of controls could do when two of her sons were accidentally exposed to explicit content on a non-Meta platform. One boy has been in therapy for four years, she says.\n\"It's almost like being abused,\" says Story.\nMark SooHoo, a father of three who lives in the suburbs of Chicago, says social media and smartphones go hand-in-hand, and that both are harmful to young people.\nHe belongs to Wait Until 8th, an organisation where parents pledge to not give their kids smartphones until the end of eighth grade, when most have finished middle school and are 13 or 14 years old.\nMost parents want to give their children smartphones so they aren't left out, he says.\n\"And our message is very clear: We do want them to be left out. We want them to be left out of all the negative impacts of social media,\" SooHoo says.\nInstead of looking to the companies to address potential harms, SooHoo believes more parents should sign the smartphone pledge.\n\"A communal problem requires a communal solution,\" he says.\nReform of all social media should come with Meta changes, UN says\n- Published15 hours ago\nMeta hooked children on Facebook and Instagram, US court hears\n- Published18 August\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",
    "bodyJa": "「まだ十分ではない」 - 米国の親と十代の若者、メタの若年ユーザー向けの新しい制限について\n- 公開されました\nテキサス州ヒューストンに住む2人の女の子の母親であるエリザベス・カードナーさんにとって、ティーンエイジャーのプラットフォーム利用に対するメタの新たな制限は、ソーシャルメディアの潜在的な危険性をより多くの人が認識するようになるという歓迎すべき兆候だ。\nしかし、彼女はBBCに対し、長期的にはおそらくあまり役​​に立たないと語った。\n「これで家庭内での口論は多少は避けられますが、十分ではありません」と彼女は言う。\nメタ社は今週、ソーシャルメディアが子供に与える影響に関する訴訟における米国各州との180億ドル（132億5000万ポンド）の和解の一環として、インスタグラム、フェイスブック、ワッツアップなどの自社プラットフォームに対する新たな制限を発表した。\n同社は、1日あたり2時間の時間制限を設け、投稿に受け取った「いいね！」の数を非表示にし、動画の自動再生を削除し、授業時間中はプッシュ通知をミュートし、過激なメイクフィルターを禁止すると発表した。\nまた、年齢確認プロセスとペアレンタルコントロールの変更を発表するとともに、対策の実施と維持をチェックする独立監査人を任命することに同意したと発表した。\n米国中の多くの親は、この制限は有益だと考えているが、依然として懐疑的だ。 BBCの取材に応じた人たちは、子供たちをソーシャルメディアから切り離すことはできないが、ソーシャルメディアが引き起こすと信じている危害から子供たちを守ることもできないと感じ、行き詰まりを感じていると述べ、これらの新しい規則がどれだけの違いを生むのかを待っているという。\nカードナーさんの14歳のペイジさんは、この制限により「より現実的なシナリオ」が増え、ソーシャルメディアを支配していると彼女が言う「偽のコンテンツ」が減ると信じている。彼女も妹も、「いいね！」の数を非表示にしたりフィルターを制限したりすることに賛成しています。\nしかしペイジ氏は、「AIは進化しているため」、こうした利益は長続きしないと見ている。\n「人々は偽のフィルターを使用したり、ビデオや写真の特定の部分を修正したりする新しい方法を見つけるでしょう」と彼女は言います。 「ですから、人々が他のリソースを使って新しい方法を見つけ出すまでは、役に立つと思います。」\nカードナーさんは、娘たちをソーシャルメディアから完全に禁止しても、娘たちは仲間から疎外されるだけだと言う。\n「もしそうするならひどい、あなたがしないならひどい」と彼女は言います。 「これで勝ち目はないと思います。」\nメタ和解が英国にとって何を意味するか、そして合意後のその他の疑問\n- 21 時間前に公開\nメタ、自社のプラットフォームが子供たちに悪影響を与えるとの訴訟で和解金として最大180億ドルを支払う\n- 1 日前に公開\n10代の2人の子どもを持つ別の母親、アンドリア・ローズさんもBBCに対し、自分は無防備だと感じており、「私がどれだけ子どもたちやフェイスブック、インスタグラムを守っていても、彼らは入ってきて、文字通り、子どもたちを部屋から連れ出そうとしている」と語った。\nマサチューセッツ州ボストン近郊に住むローズさんは、メタの変化を「素晴らしい」と呼びながらも、彼らがこの問題に完全に対処しているとは信じていない。\n「彼らは薬物を制限しようとしているが、薬物を管理していない」と彼女は言う。 「彼らはまだ取引中だ。」\nローズさんは、ソーシャル メディアを個人的に使用すると夜の睡眠時間が犠牲になると指摘しています。\n「もう夢中です」と彼女は言う。 「それで、子供はどうなると思いますか？」\nこの和解は水曜日、メタ社のオーナーであるマーク・ザッカーバーグ氏が証言する予定となっていた待望の裁判の最中に発表された。和解には過失を認める内容は含まれていなかった。\nこの訴訟はもともと2023年に米国の29の州によって起こされ、メタ社が意図的に中毒性のあるプラットフォームを設計し、リスクについて嘘をついたと主張した。子どもの個人情報の収集に関する連邦法に違反しているとも非難した。\n今週発表された和解案には、48の州に加え、コロンビア特別区と米国の3つの準州が含まれていた。\nいくつかの研究では、ソーシャルメディアが精神的健康、特に子供にとって有害で​​あることが判明しています。昨年、BBCの調査では、子どもたちがソーシャルメディアプラットフォーム上でいじめ、自殺、武器に関するコンテンツにさらされていることが判明した。\nローズ氏にとって、会社がどれだけの利益を上げているか、そしてパンデミック中に業界が子供たちからどれだけの利益を得たかを考えると、メタの和解金は「問題に数ドル紙幣を投げるようなもの」だ。\nロングアイランドに住む4人の男の子の母親であるジョアニー・ストーリーさんは、メタ社の発表の別の部分、つまり他のプラットフォームに関わる条件について異議を唱えている。\n同社は和解金のうち50億ドルを保留し、YouTubeやTikTokなども同様の契約を結んだ場合にのみ解放する予定だ。\nまた、他のプラットフォームでも同様の制限が実施された場合には、制限時間をさらに1時間に強化すると述べた。ストーリーはそれを「つまらない」と見なします。\n「それは、『ほら、私たちには壊れたものを直す能力があるけど、中途半端にしか直さないよ』と言っているようなものです」と彼女は言う。\nそれでも、Story は新しいルールを「優れたコントロール」として歓迎しています。彼女は、息子 2 人が非メタ プラットフォームで露骨なコンテンツに誤ってさらされたとき、管理が欠如していると何が起こるかを見たと言います。ある少年は4年間セラピーを受けている、と彼女は言う。\n「まるで虐待されているようなものです」とストーリーさんは言う。\nシカゴ郊外に住む 3 人の子供の父親であるマーク・スーフーさんは、ソーシャルメディアとスマートフォンは密接な関係にあり、どちらも若者にとって有害で​​あると語ります。\n彼は「8日まで待つ」という団体に所属している。この団体は、親たちが8年生の終わりまでは子どもにスマートフォンを与えないことを誓約する団体で、8年生の終わりまでは子どもにスマートフォンを与えないことを誓約している。\nほとんどの親は、子どもたちが取り残されないよう、子どもたちにスマートフォンを与えたいと考えている、と同氏は言う。\n「そして私たちのメッセージは非常に明確です。私たちは彼らを排除してほしいと思っています。私たちは彼らをソーシャルメディアのあらゆる悪影響から排除したいのです」とスーフー氏は言う。\nSooHoo 氏は、潜在的な損害への対処を企業に期待するのではなく、より多くの親がスマートフォンの誓約書に署名すべきだと考えています。\n「共同体の問題には共同体による解決策が必要です」と彼は言います。\nすべてのソーシャルメディアの改革にはメタの変更が伴うべきだと国連が主張\n- 15 時間前に公開\nFacebookとInstagramに子供たちがメタに夢中、米国の裁判所が審理\n- 8 月 18 日公開\nTech Decoded ニュースレターに登録して、世界のトップのテクノロジー ストーリーやトレンドをフォローしてください。英国外ですか？ここからサインアップしてください。",

    "title": "Trump administration illegally retaliated against Anthropic, judge rules",
    "titleJa": "トランプ政権、人間性、裁判官の規則に対して違法に報復",
    "summaryJa": "トランプ政権、人間性、裁判官の規則に対して違法に報復- 公開されました",
    "bodyOriginal": "Trump administration illegally retaliated against Anthropic, judge rules\n- Published\nA judge has ruled the US Department of Defense acted unlawfully when it designated artificial intelligence (AI) startup Anthropic a supply chain risk, calling the move \"illegal and baseless\".\nThe company argued in the lawsuit that Defense Secretary Pete Hegseth overstepped his authority with the new designation. It followed Anthropic's refusal to allow the military to use its AI models for things that included surveillance or autonomous weapons.\nUS district judge Rita Lin said in the ruling that citing national security \"is not a blank check to punish and retaliate against government critics\".\nAnthropic welcomed the ruling. The BBC has contacted the Pentagon and the White House for comment.\nAnthropic is focused on \"working productively with the government to harness AI for our national security so all Americans benefit from this technology,\" a spokesperson told the BBC.\nJudge Lin said in the court filing that the Defense Department had acted unlawfully to order firms that do business with the US military to boycott Anthropic.\nThe Pentagon designated Anthropic as a supply-chain risk in February - a law typically reserved for companies based in countries that pose a threat to the US.\nIt marked the first time an American company had been publicly designated as such.\nAnthropic's lawsuit said the government's actions were both \"unprecedented and unlawful\".\nThe Claude-maker said its models were not reliable enough to be safely used in weapons systems for the military. It added that it opposed its use for domestic surveillance as a violation of rights.\nThe Pentagon said at the time that private companies should not be able to constrain military action.\nThe White House had previously said Anthropic was \"a radical left, woke company\" attempting to control military activity\" and argued the military was beholden to the US Constitution, \"not any woke AI company's terms of service\".\nThe Pentagon also argued that Anthropic's refusal to accept new contract terms raised concerns over what the company could do with its technology.\nAnthropic said in its lawsuit that its business had been impacted by the government's actions and its right to freedom of speech had been violated.\nJudge Lin said during an earlier round in the lawsuit that the government was trying to \"cripple\" the company and \"chill public debate\" over military use of AI.\n\"This appears to be classic First Amendment retaliation,\" the judge added.\n- Published1 day ago\n- Published9 June",
    "bodyJa": "トランプ政権、人間性、裁判官の規則に対して違法に報復\n- 公開されました\n裁判官は、米国国防総省が人工知能（AI）新興企業アンスロピックをサプライチェーンのリスクに指定したことは違法行為であり、この動きは「違法で根拠がない」との判決を下した。\n同社は訴訟で、ピート・ヘグセス国防長官が新たな指定で権限を逸脱したと主張した。これは、軍が監視や自律型兵器を含む用途に自社の AI モデルを使用することを Anthropic が拒否したことを受けてのことだ。\n米国地方判事のリタ・リン氏は判決の中で、国家安全保障に言及することは「政府批判者を罰し、報復するための白紙検査ではない」と述べた。\nアントロピックはこの判決を歓迎した。 BBCは国防総省とホワイトハウスにコメントを求めた。\nAnthropic社の広報担当者はBBCに対し、「国家安全保障のためにAIを活用するために政府と生産的に協力し、すべてのアメリカ人がこのテクノロジーの恩恵を受けられるようにする」ことに重点を置いていると語った。\nリン判事は法廷提出書類の中で、国防総省が米軍と取引のある企業にアンスロピック社のボイコットを命じる違法な行為を行ったと述べた。\n国防総省は2月にアンスロピックをサプライチェーンリスクに指定したが、これは通常、米国にとって脅威となる国に拠点を置く企業に限定される法律である。\n米国企業がそのように公的に指定されたのは初めてのことだった。\nアンスロピック社の訴訟では、政府の行為は「前例がなく、違法」であると述べた。\nクロードのメーカーは、自社のモデルは軍用兵器システムで安全に使用できるほど信頼性が低いと述べた。国内監視に利用することは権利侵害として反対すると付け加えた。\n国防総省は当時、民間企業が軍事行動を制約できるべきではないと述べた。\nホワイトハウスは以前、アンスロピック社は「軍事活動を統制しようとしている極左の目覚めた企業」であると述べ、軍は合衆国憲法に従うものであり、「目覚めたAI企業の利用規約ではない」と主張していた。\n国防総省はまた、アンスロピック社が新たな契約条件の受け入れを拒否したことで、同社が自社の技術で何ができるかについての懸念が生じたと主張した。\nアンスロピックは訴訟の中で、同社の事業は政府の措置によって影響を受け、言論の自由の権利が侵害されたと述べた。\nリン判事は訴訟の初期ラウンドで、政府は同社を「機能不全に陥れ」、AIの軍事利用を巡る「国民の議論を冷ややかに」しようとしていると述べた。\n「これは典型的な合衆国憲法修正第1条の報復のようだ」と判事は付け加えた。\n- 1 日前に公開\n- 6 月 9 日発行",
    "source": "BBC",
    "sourceUrl": "https://www.bbc.co.uk/news/articles/cm2q7z5mlrmo?at_medium=RSS&at_campaign=rss",
    "publishedAt": "2026-08-28T03:41:59+00:00",
    "category": "テクノロジー",

    "id": "trump-ratchets-up-rhetoric-against-beiji-d8ef6335",
    "title": "Trump ratchets up rhetoric against Beijing as U.S.-China officials meet for Xi's Washington visit",
    "titleJa": "習主席のワシントン訪問に向けて米中当局者が会談、トランプ大統領が中国に対する発言を強める",
    "summaryJa": "北京 — 米国が今週、イランに対する二次制裁で中国への圧力を強化する中、世界の二大経済大国は依然として協力方法に焦点を当て続けている。ホワイトハウスの発言が依然として厳しいにもかかわらず、これは双方がバランスを取っている兆候だ。",
    "bodyOriginal": "BEIJING — As the U.S. ramped up pressure this week on China with secondary Iran sanctions, the world's two largest economies have still managed to stay focused on ways to cooperate.\nIt's a sign of the balancing act on both sides, even as White House rhetoric has remained tough.\nU.S. President Donald Trump signaled to reporters Thursday local time he could be sanctioning Chinese banks. \"I don't have to announce everything,\" he said, according to a Fox News stream of the event.\nThose comments followed a meeting between U.S. and Chinese officials in Beijing on Wednesday, according to official announcements.\nU.S. Ambassador to China David Perdue said in a social media post that he met with China's Foreign Minister Wang Yi and three other Chinese officials to discuss President Xi Jinping's upcoming state visit to Washington.\nChina's readout also noted Perdue's comment on \"preparing well for the next stage of important high-level interactions,\" according to a CNBC translation of Chinese.\nTrump on Thursday even mentioned Xi was coming in a few weeks.\nU.S. Treasury Secretary Scott Bessent on Monday had warned that if Chinese banks \"are part of the ecosystem that turns Iranian oil into money, into repression, they will be targeted.\" It was part of Trump's \"economic D-Day\" announcements against Iran.\nOther than Bessent's comments, there few details on specific actions, said Jodie Wen, postdoctoral fellow at the Center for International Security and Strategy (CISS), Tsinghua University. It's more of a warning, she said.\nWen added that the Trump-Xi summit in May marked a shift toward controlled competition, rather than the Biden administration's \"strategic adversary\" view on China.\nModerate response\nChina's official response to U.S. secondary Iran sanctions has also been muted so far.\nBeijing responded by saying it would \"take all necessary measures\" to protect itself, but did not elaborate on possible actions. When asked about communication with the U.S. on Iran, a foreign ministry spokesperson said there was no information to share.\nHowever, the spokesperson said the two countries were in talks about a Trump-Xi meeting.\nBeijing will \"note the lack of groundwork that was laid ahead of Bessent's 'D-Day' announcement. And they will conclude that this is largely performative,\" Ryan Hass, director of the China center and Chair in Taiwan studies at Brookings, said in a social media post. Hass advised the Obama administration as director for China, Taiwan and Mongolia for the National Security Council.\n\"Sec. Bessent already basically gave away the game when he responded to a question by asking, 'Why would I want to blow up the global financial system?' Beijing will interpret this as signaling that the US is not going to go after major Chinese financial institutions,\" Hass said.\nHe expects the U.S.-China trade truce to remain intact because the \"alternative is worse for both sides.\"\nBeijing can also comply with U.S. sanctions and its own interests at the same time.\nThe Asian country has built a legal mechanism that essentially tells Chinese companies their foreign bankers must comply with U.S. rules, but inside China, Beijing's law takes precedence, said Han Shen Lin, China managing director for The Asia Group and a former executive at Wells Fargo Bank in China.\n— CNBC's Anniek Bao contributed to this report.",
    "bodyJa": "北京 — 米国が今週、イランに対する二次制裁で中国への圧力を強化する中、世界の二大経済大国は依然として協力方法に焦点を当て続けている。\nホワイトハウスの発言が依然として厳しいにもかかわらず、これは双方がバランスを取っている兆候だ。\nドナルド・トランプ米大統領は現地時間木曜、記者団に対し、中国の銀行を制裁する可能性があることを示唆した。このイベントのフォックスニュースのストリームによると、同氏は「すべてを発表する必要はない」と語った。\n公式発表によると、これらのコメントは水曜日に北京で行われた米中当局者の会談後に発せられた。\nデービッド・パーデュー駐中国大使はソーシャルメディアへの投稿で、習近平国家主席の今後の国賓ワシントン訪問について話し合うため、中国の王毅外相および他の中国当局者３人と会談したと述べた。\nCNBCの中国語翻訳によると、中国側の読み上げでは、「重要なハイレベル交流の次の段階に向けて十分な準備をしている」というパーデュー氏のコメントにも言及した。\nトランプ大統領は木曜日、習氏が数週間以内に来るとさえ言及した。\nスコット・ベッセント米財務長官は月曜日、中国の銀行が「イラン石油を金に変え、抑圧に変えるエコシステムの一部になれば、彼らは標的にされるだろう」と警告した。これはトランプ大統領のイランに対する「経済的Dデー」発表の一環だった。\n清華大学国際安全保障戦略センター（CISS）の博士研究員ジョディ・ウェン氏によると、ベッセント氏のコメント以外には、具体的な行動に関する詳細はほとんどないという。それはむしろ警告だ、と彼女は言った。\n温氏は、5月のトランプ・習首脳会談は、バイデン政権の中国に対する「戦略的敵対者」の見方ではなく、管理された競争への移行を示したと付け加えた。\n中等度の反応\n米国の対イラン二次制裁に対する中国の公式反応も、これまでのところ沈黙を保っている。\n中国政府は自国を守るために「あらゆる必要な措置を講じる」と応じたが、考えられる行動については詳しく述べなかった。イランに関する米国とのコミュニケーションについて尋ねられた外務省報道官は、共有すべき情報はないと述べた。\nしかし報道官は、両国はトランプ大統領と習氏の会談について協議中であると述べた。\n中国センター所長でブルッキングス大学台湾研究部長のライアン・ハス氏はソーシャルメディアへの投稿で、中国政府は「ベッセント氏の『Dデイ』発表に先立って準備が整っていなかった点に留意するだろう。そして中国センター所長でブルッキングス大学台湾研究部長のライアン・ハス氏は、これは主に演出的なものだと結論付けるだろう」と述べた。ハス氏は国家安全保障会議の中国、台湾、モンゴル担当局長としてオバマ政権に助言した。\n「ベッセント長官は、『なぜ世界の金融システムを爆破したいのか？』という質問に答えたとき、すでに基本的に勝負を放棄していた。中国政府はこれを、米国が中国の大手金融機関を追及するつもりはないという合図だと解釈するだろう」とハス氏は語った。\n同氏は「代替案のほうが双方にとって悪い」ため、米中貿易停戦は維持されると予想している。\n中国政府は米国の制裁と自国の利益を同時に遵守することもできる。\nアジア・グループの中国マネージング・ディレクターで中国のウェルズ・ファーゴ銀行元幹部のハン・シェン・リン氏は、アジアの国は基本的に中国企業に対し、外資系銀行家が米国の規則に従わなければならないと伝える法的メカニズムを構築しているが、中国国内では中国の法律が優先されると述べた。\n— CNBC の Anniek Bao がこのレポートに寄稿しました。",

    "bodyOriginal": "Overcooked? Why robotic pizza makers are failing\n- Published\nThe \"dough feeder\". The sauce and cheese modules – even the pepperoni-sprinkler. All lay still.\nA now defunct duo of robots were supposed to be churning out pizzas at a Moto Pizza restaurant in Seattle.\nHowever, in May the pair were rendered \"basically useless\" when their supplier, Picnic, abruptly shut down., external Technical support for the robots evaporated at that moment, says Lee Kindell, founder and chief executive of Moto Pizza.\nHe was left wondering what to do with the $160,000 (£118,000), cabinet-like machines and whether buying in pizza bots was really worth it.\n\"I don't know if I want to do a partnership again because of the failures,\" he says.\nThe robot pizza-making business has, it's true, been littered with sorry tales of overcooked promises and melting fortunes. Besides Picnic, other companies that have come and gone include Zume, external and Pazzi, which used, external robot arms to assemble pizzas, as well as Basil Street, external, a purveyor of pizza vending machines.\nAlthough so-called fast food might seem an easy target for automation, it's proved harder than many expected. Plus, bringing robots into pizza restaurants could take away entry-level jobs in the hospitality sector. Is the future really filled with robotic pizza?\n\"We haven't yet seen any of the success stories materialise the way some people thought they would,\" admits Sara Senatore, senior restaurants analyst at Bank of America. Her employer has financial interests in multiple high street pizza chains including Papa Johns and Domino's.\nFood preparation bots are sometimes clumsy – dropping ingredients in the wrong places at times, she explains. Conversely, \"Humans are very efficient at making pizza.\"\nBut Kindell, despite his frustrations with Picnic, is surprisingly undeterred. He is a fan of full automation. \"I want to be able to walk up to, let's say, a type of kiosk, put in your order, and it makes a fresh pizza,\" he tells the BBC.\nKindell, who once made all his dough by hand – until an elbow tendon injury forced him to investigate using machines instead, is now working on his own version of a pizza-making robot.\nHe declines to share details but the contraption will make square pan-style pies and that the machine is inspired by the way 3D printers work. If things go well, he says he could have a fully operational version of the device by the summer of 2027.\nGiven that he admits he has \"no experience\" in robotics, I question why he would want to invest in such a dicey business. Kindell says that failed pizza robot companies have nonetheless generated useful data and made strides in developing their technology. It's just a matter of time before someone gets these things to work, he insists.\nOn jobs, he claims that even \"fully autonomous\" pizza robots won't threaten workers. Kindell previously used Picnic's robots at T-Mobile Park, home of the Seattle Mariners, a baseball team.\nUsually, he'd need about 10 people to make pizza in such a setup. With the robots that number fell to just two. But the other eight people were still employed, he says, in roles where they interacted with customers, and advertised the pizza around the stadium.\n\"We had so many more people able to hand out the pizza,\" says Kindell. \"It was so much faster.\"\nFor some pizza robotics engineers, speed is certainly a motivator. Last year at the John Glenn Columbus International Airport in Ohio, Canadian firm Appetronix installed a 24/7 robotic pizza unit for the Donatos pizza chain.\nAppetronix is working on newer versions of the technology that it claims will assemble pizzas at a furious pace. The goal is to eventually have a pizza sliding out of such machines \"every minute\", says co-founder and chief executive Nipun Sharma.\nTo that end, his team is investigating methods of depositing sauce onto a pizza base far faster than the 9.5 seconds currently required. \"Think of it as a shower head that blasts the sauce in 1.5 seconds,\" says Sharma.\nThe company is even investigating lasers and ultrasound as potentially speedier methods of slicing pizzas than a traditional knife blade.\nMany people enjoy hand-crafted pizza, though, I suggest. Doesn't a machine making your dinner take away the human connection we might otherwise feel with food? \"What we're going after is a chain market,\" replies Sharma. \"You want the pizza to taste the same every single time.\"\nThis divide, between businesses focused on repeatability, and those who promise a more artisanal, human-fronted experience, predates robotics. But it will likely shape how and where technology arrives in the world of pizza.\nFive years ago, Paul Giannone – owner of Paulie Gee's pizza restaurants – vowed to Mashable, external that he would \"never\" use a robot. \"That is still the case,\" he tells the BBC. \"Our shops offer a dining experience with personal customer service a high priority.\"\nSenatore says that human interaction is potentially an even more important factor today than in the past, including for restaurants that do decide to introduce pizza robots.\n\"It's a risky proposition to not have people,\" says Senatore. Pizza parlours could lose their \"human touch\", she adds, and potentially also frustrate customers should the machines go wrong while no-one is around to step in.\nBut expect new pizza tech to keep appearing. Not least because the meal-assembling robot companies that have seemingly disappeared are actually still influencing food start-ups. The intellectual property formerly owned by Zume – more than 300 patents – was bought up, external by Miso Robotics, of California.\n\"Their vision for robotic pizza making was really brilliant,\" says chief executive Rich Hull. \"I just think they were a beat too early in the market.\" Customers weren't \"ready\" for robot-made pizza, he asserts.\nMiso Robotics makes a French fry-cooking bot, external called Flippy, already in use in some US fast food restaurants. The Zume patents could help Miso Robotics expand Flippy's capabilities, suggests Hull, though he does not cite any specific example. \"That's one of those things that we're going to be learning about,\" he says.\nThe natural cut-and-thrust of the fast food pizza business looks set to continue. Kindell remains set on automating pizza production.\n\"There is no doubt in my mind that there will be a fully autonomous pizza robot,\" he says. \"It's just, who's going to do it first?\"\nMore Technology of Business\n- Published3 July\n- Published12 June\n- Published26 June",
    "bodyJa": "加熱しすぎですか？ロボットピザメーカーが失敗する理由\n- 公開されました\n「生地フィーダー」。ソースとチーズのモジュール、ペパロニスプリンクラーも。全員がじっと横たわっていた。\n今はなきロボットの二人組が、シアトルのモト・ピザ・レストランでピザを量産していたはずだった。\nしかし、5月にサプライヤーのピクニック社が突然閉鎖され、このペアは「基本的に役に立たなくなった」。その瞬間、ロボットに対する外部の技術サポートは消滅した、とモト・ピザの創設者兼最高経営責任者、リー・キンデル氏は語る。\n彼は、16 万ドル (11 万 8,000 ポンド) のキャビネットのような機械をどうするか、ピザボットを購入する価値があるのか​​どうか疑問に思いました。\n「失敗したので、もう一度パートナーシップをやりたいかどうかわかりません」と彼は言う。\nロボットピザ製造ビジネスには、行き過ぎた約束や財産を溶かすという残念な話が散りばめられているのは事実だ。 Picnic 以外に栄えては消えていった企業には、ピザの組み立てに外部ロボット アームを使用した Zume (external) や Pazzi のほか、ピザの自動販売機を提供する Basil Street (external) などがあります。\nいわゆるファストフードは自動化のターゲットになりやすいように思えるかもしれませんが、多くの予想よりも難しいことが証明されています。さらに、ピザレストランにロボットを導入すると、接客業の初心者レベルの仕事が奪われる可能性があります。未来は本当にロボットピザで満たされるのでしょうか?\nバンク・オブ・アメリカのシニア・レストラン・アナリスト、サラ・セナトーレ氏は「一部の人々が期待していたような成功事例が現実化した例はまだ見ていない」と認める。彼女の雇用主は、パパ・ジョンズやドミノ・ピザを含む複数のハイストリート・ピザ・チェーンに経済的利権を持っている。\n食事準備ボットは時々不器用で、材料を間違った場所にドロップしてしまうこともあると彼女は説明します。逆に言えば、「人間はピザを作るのに非常に効率的です。」\nしかし、キンデルはピクニックに対する不満にもかかわらず、驚くほどひるまない。彼は完全自動化のファンです。 「たとえば、ある種のキオスクまで歩いて行き、注文を入れると、焼きたてのピザが作られるようにしたいのです」と彼は BBC に語った。\nキンデルさんは、かつては生地をすべて手作業で作っていたが、肘の腱を負傷して代わりに機械を使って研究することになったが、現在は独自バージョンのピザ作りロボットの開発に取り組んでいる。\n同氏は詳細については明かすことを拒否したが、この装置は四角いパン型のパイを作るもので、この機械は3Dプリンターの仕組みからインスピレーションを得たものだという。順調に行けば、2027年の夏までにこの装置の完全運用バージョンが完成する可能性があると同氏は言う。\n彼がロボット工学に「経験がない」と認めていることを考えると、なぜ彼がそのような危険なビジネスに投資したいのか疑問です。キンデル氏は、失敗したピザロボット会社はそれでも有益なデータを生成し、技術開発で進歩を遂げたと述べた。誰かがこれらのことを実現させるのは時間の問題だと彼は主張する。\n仕事に関しては、「完全自律型」のピザロボットでも労働者を脅かすことはないと主張する。キンデル氏は以前、野球チーム、シアトル・マリナーズの本拠地であるTモバイル・パークでピクニックのロボットを使用していた。\n通常、このような設備でピザを作るには約 10 人が必要です。ロボットの場合、その数はわずか 2 つに減りました。しかし、残りの8人はまだ雇用されており、顧客と交流したり、スタジアム周辺でピザを宣伝したりする役割を担っていた、と彼は言う。\n「ピザを配れる人がもっとたくさんいました」とキンデルさんは言います。 「とても速かったです。」\n一部のピザロボットエンジニアにとって、スピードは確かにモチベーションの源です。昨年、オハイオ州のジョン・グレン・コロンバス国際空港に、カナダ企業アペトロニクスがドナトスピザチェーン向けに年中無休のロボットピザユニットを設置した。\nAppetronix は、猛烈なスピードでピザを組み立てると主張するテクノロジーの新しいバージョンに取り組んでいます。共同創設者兼最高経営責任者のニプン・シャルマ氏は、最終的にはそのような機械からピザが「毎分」滑り出てくるようにするのが目標だと語る。\nこの目的を達成するために、彼のチームは、現在必要とされている 9.5 秒よりもはるかに速く、ピザのベースにソースを塗布する方法を研究しています。 「1.5秒でソースを噴射するシャワーヘッドだと考えてください」とシャルマ氏は言う。\n同社は、ピザをスライスする従来のナイフの刃よりも高速な方法として、レーザーと超音波の研究も行っています。\nしかし、多くの人は手作りのピザを楽しんでいると思います。夕食を作る機械は、私たちが食べ物に対して感じる人間的なつながりを奪い去ってしまうのではありませんか? 「私たちが狙っているのはチェーン市場です」とシャルマ氏は答える。 「ピザはいつでも同じ味にしたいですよね。」\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "title": "Military veterans told they owe thousands of pounds over clerical error",
    "titleJa": "退役軍人らは事務上のミスで数千ポンドの借金があると語る",
    "summaryJa": "退役軍人らは事務上のミスで数千ポンドの借金があると語る- 公開されました",
    "bodyOriginal": "Military veterans told they owe thousands of pounds over clerical error\n- Published\nHundreds of former members of the military have had their pensions slashed after receiving letters telling them to repay thousands of pounds because of a clerical error.\nThe Ministry of Defence (MoD) confirmed to the BBC that more than 1000 retired service personnel are being pursued for debts. The majority, 335 veterans, were overpaid a total of £5.1m as a result of incorrect National Insurance calculations.\nThe Forces Pension Society said it is aware of a small number of veterans whose debts were wiped after raising a formal complaint.\nRay Lawton, 70, was told in July he owed £8,000 following six years of overpayments. Days later, his monthly military pension was cut from £550 to £365.\n\"I haven't got £8,000 to pay out,\" said Lawton, who served 16 years in the Royal Artillery.\n\"I've got a little bit put aside but nowhere near that much.\"\nThe Portsmouth-based veteran told the BBC: \"I've trusted the army all my life even when I left and I trusted my pension would be right. Then this letter comes and it's just blown it all out.\"\nLawton's letter was sent from a company called Equiniti, which administers the pension scheme on behalf of the MoD.\nIt said an error in its system meant he had been overpaid for years.\nLawton is one of many veterans from across the UK who contacted BBC Your Voice after receiving letters out of the blue seeking money they didn't know they owed.\nThe Forces Pension Society, a not-for-profit which supports military retirees, said it is aware of many overpayment cases running into the tens of thousands of pounds.\nA small number of veterans have been told they owe six-figure sums.\nThe MoD confirmed errors relating to National Insurance adjustments, Pension Sharing Orders (PSO), Early Departure Payments (EDP) and State Pension Age (SPA). It says it is investigating issues on a case-by-case basis.\nIt added that of the 335 veterans affected by National Insurance errors, a third have paid off their debt in full and 52 have an agreed repayment plan in place. So far, of the £5.1m, £304,000 has been paid back.\nVeterans said they want more clarity about the debt and how it has been calculated. Some have called for it to be wiped.\nThe government said it has a responsibility to recover the funds.\nAn MoD spokesperson told the BBC that it recognises that errors to pension payments \"may cause uncertainty\", adding that it is contacting veterans and \"providing support for anyone who requires it\".\n\"Where payments have been made in genuine error, we have a responsibility to recover taxpayer funds and will always seek to do so in a sensitive and proportionate way,\" the spokesperson added.\nHowever, former Conservative defence secretary Penny Mordaunt, said: \"While public bodies have a duty to recoup such costs if it makes financial sense to do so, no such assessment has been made in these cases.\n\"There is a compelling case in many instances for the debt to be wiped\".\n'Absolutely devastating'\nLawton does not want the taxpayer to pick up the tab, he is happy to have his pension reduced to the level it should have been but thinks the private company should refund the bill for what he sees as their mistake.\n\"I think they should take responsibility for it because it's not my fault.\"\nIn Truro, Andrew Thorburn agrees.\nHe served 36 years in the Royal Navy and has been told he owes £26,438. As a result, his pension has been cut by around £650 per month.\n\"I think it's despicable that they are now saying 'yes, we've made this mistake however you're going to pay for it'. How can I forgive the government for that?\"\nHe said: \"The financial shock is absolutely devastating and it's still ongoing.\"\n'A struggle'\nRAF veteran Barrie Goodwin contacted Equiniti six years ago after receiving a higher payment than he was expecting.\nHe was told the change was because he had reached state pension age. He's since been notified he was overpaid £32,188 and must hand it back.\n\"I checked, was told it was all correct and now have to repay it,\" he said. \"I'm already cutting back on luxuries. I was helping one of my grandchildren through nursery - that's had to change.\n\"If the debt isn't waived, I will really struggle.\"\nEquiniti told the BBC it could not discuss individual cases but recognised the concern caused to pensioners.\nA spokesperson said it was not responsible for the decision to recoup taxpayers' money but \"administration of a scheme of this scale involves multiple organisations, systems and processes over many years\".\nTechnology company Sopra Steria has been in charge of the veterans' pension scheme since 2023, and had subcontracted the administration to Equiniti.\nA Sopra Steria spokesperson told the BBC that \"errors that led to incorrect pension payments originated over a decade before Sopra Steria took over the contract\".\nThe company said it is \"working closely with the MoD and Equiniti to ensure robust safeguards are in place for the long term\".\nThe Forces Pension Society is advising anyone who receives an overpayment letter to verify its authenticity, request more information from Equiniti and using the right to complain through the Internal Disputes Procedure.\nAdditional reporting: Adam Clarkson and Elaine Doran\nGet in touch\nAre you affected by issues covered in this story? Share your experiences.\n- Published3 days ago",
    "bodyJa": "退役軍人らは事務上のミスで数千ポンドの借金があると語る\n- 公開されました\n数百人の元軍人が、事務上のミスを理由に数千ポンドの返済を求める手紙を受け取り、年金を減額された。\n国防省（MoD）はBBCに対し、1000人以上の退役軍人が債務の追及を受けていることを認めた。大半の退役軍人335人は、国民保険の誤った計算の結果、総額510万ポンドの過大な支払いを受けていた。\n軍人年金協会は、正式な苦情を申し立てた後に借金が帳消しになった少数の退役軍人を把握していると述べた。\nレイ・ロートンさん（70歳）は、6年間の過払いの末、7月に8,000ポンドの借金があると告げられた。数日後、彼の月額軍人年金は550ポンドから365ポンドに減額された。\n「支払える8,000ポンドがない」と王立砲兵隊で16年間勤務したロートン氏は語った。\n「少しは取っておきましたが、それほど多くはありません。」\nポーツマスを拠点とする退役軍人はBBCに対し、「私は退役したときもずっと軍を信頼しており、自分の年金も適切なものになると信じていた。その後この手紙が来て、すべてが吹き飛ばされた」と語った。\nロートン氏の書簡は、国防省に代わって年金制度を管理するエクイニティという会社から送られてきた。\nシステムのエラーにより、何年にもわたって過大な報酬が支払われていたと同社は述べた。\nロートンさんは、借りていることを知らなかったお金を要求する手紙を突然受け取った後、英国全土からBBC Your Voiceに連絡した多くの退役軍人の1人です。\n退役軍人を支援する非営利団体である軍人年金協会は、数万ポンドに達する過払い事件が多数あることを認識していると述べた。\n少数の退役軍人は6桁の借金を負っていると言われている。\n国防省は、国民保険の調整、年金共有命令（PSO）、早期出発支払い（EDP）および州年金受給年齢（SPA）に関する誤りを確認した。問題をケースバイケースで調査しているとしている。\n同報告書は、国民保険の誤りで影響を受けた退役軍人335人のうち、3分の1が借金を全額返済し、52人が合意された返済計画を立てていると付け加えた。これまでに510万ポンドのうち30万4000ポンドが返済されている。\n退役軍人らは、債務とその計算方法についてもっと明確にしてほしいと述べた。消去するよう求める声もある。\n政府は資金を回収する責任があると述べた。\n国防省の広報担当者はBBCに対し、年金支払いの誤りが「不確実性を引き起こす可能性がある」と認識していると述べ、退役軍人に連絡し、「支援を必要とする人には支援を提供している」と付け加えた。\n「支払いが真の誤りで行われた場合、我々には納税者の資金を回収する責任があり、常に慎重かつ適切な方法で回収するよう努める」と広報担当者は付け加えた。\nしかし、元保守党国防長官ペニー・モーダント氏は、「公的機関には財政的に合理的であれば、そのような費用を回収する義務があるが、これらのケースではそのような評価は行われていない」と述べた。\n「多くの場合、債務を帳消しにしなければならないやむを得ないケースがある。」\n「まったく壊滅的だ」\nロートン氏は納税者にツケを巻き上げてほしくない。年金が本来あるべき水準まで減額されることには満足しているが、民間企業は自分たちの間違いだと考えている請求額を返金すべきだと考えている。\n「私のせいではないので、彼らが責任を取るべきだと思います。」\nトゥルーロでは、アンドリュー・ソーバーンも同意する。\n彼はイギリス海軍に 36 年間勤務し、26,438 ポンドの借金があると言われています。その結果、彼の年金は月額約650ポンド削減された。\n「彼らが今『はい、私たちはこの間違いを犯しましたが、あなたはその代償を払うつもりです』と言っているのは卑劣なことだと思います。どうして政府を許せるでしょうか？」\n同氏は「金融ショックは完全に壊滅的であり、今も続いている」と語った。\n「闘争」\nイギリス空軍退役軍人バリー・グッドウィン氏は6年前、予想よりも高額な報酬を受け取った後、エクイニティに連絡を取った。\n変更の理由は国民年金受給年齢に達したためだと言われた。その後、彼は32,188ポンドを払いすぎたので返さなければならないと通告された。\n「確認したところ、すべて正しいので返済しなければならないと言われました」と彼は語った。 「私はすでに贅沢品を減らしています。私は孫の一人を保育園で手伝っていましたが、それは変わらなければなりませんでした。\n「借金が免除されないと、本当に困ります。」\nエクイニティはBBCに対し、個別の事件については議論できないが、年金受給者に懸念を与えていることは認識していると語った。\n広報担当者は、納税者の​​資金を取り戻す決定には責任はないが、「この規模の計画の管理には、長年にわたる複数の組織、システム、プロセスが関与する」と述べた。\nテクノロジー企業のソプラ・ステリアは2023年から退役軍人年金制度を担当しており、その管理をエクイニティに下請けしていた。\nソプラ・ステリアの広報担当者はBBCに対し、「不正確な年金支払いにつながる誤りは、ソプラ・ステリアが契約を引き継ぐ10年以上前に発生した」と語った。\n同社は「長期にわたって堅牢な安全策が確実に実施されるよう、国防省およびエクイニティと緊密に連携している」と述べた。\n軍年金協会は、過払い通知書を受け取った人に対し、その信憑性を確認し、エクイニティに詳細情報を要求し、内部紛争手続きを通じて苦情を申し立てる権利を利用するようアドバイスしている。\n追加レポート: アダム・クラークソンとエレイン・ドーラン\n連絡する\nこの記事で取り上げられている問題の影響を受けていますか?あなたの経験を共有してください。\n- 3 日前に公開",

    "title": "FDA approves daily HIV pill from Gilead designed to simplify treatment for some patients",
    "titleJa": "FDA、一部の患者の治療を簡素化するために設計されたギリアドの毎日のHIV薬を承認",
    "summaryJa": "食品医薬品局は、一部の患者のケアの簡素化に役立つ可能性があるギリアドの1日1回投与のHIV薬を承認したと同社が木曜日に発表した。Bixlenvoとして販売されているこの薬は、ウイルスがすでに制御下にあるものの、依然として複雑な治療計画を続けている患者を対象としている。また、単に新しい治療法に切り替えたいと考えている人にとっても魅力的かもしれません。",
    "bodyOriginal": "The Food and Drug Administration approved a once-daily HIV pill from Gilead that could help simplify care for some patients, the company announced Thursday.\nThe drug, marketed as Bixlenvo, is aimed at patients whose virus is already under control but who remain on complicated treatment regimens. It could also appeal to those who simply want to switch to a new treatment alternative.\nThe tablet combines bictegravir, the backbone of Gilead's blockbuster HIV pill Biktarvy, with lenacapavir, a first-in-class capsid inhibitor that has become a centerpiece of the company's long-term strategy for HIV treatment and prevention.\nThe approval makes the new pill the first single-tablet regimen available for adults with HIV whose virus is suppressed but are unable to use currently available one-pill treatment options, according to Gilead. That population accounts for an estimated 5% or more of individuals in the U.S. living with HIV, the company told CNBC.\nThe list price of the pill before discounts or rebates is $4,595 for a 30-day supply, which is in line with other daily single-tablet HIV treatments, Gilead told CNBC. People without health insurance may be eligible to get Bixlenvo for free through Gilead's patient assistance program, while those with commercial or private insurance may be able to receive co-pay support through another savings program, the company said.\n\"It fulfills an unmet need, particularly for individuals who are on complex regimens who just would not otherwise consolidate down to something really meaningful for them and prescribers,\" Dr. Jared Baeten, Gilead's clinical development and virology therapeutic area head, said in an interview ahead of the approval.\n\"But it's also meaningful for individuals who are seeking options for something new,\" he continued. \"We want to build options that give people the opportunity to choose something that's going to work for them and work for them for the long haul.\"\nThere is no cure for HIV or AIDS. But many people living with HIV can manage the disease by taking a single pill daily, a treatment plan that Gilead helped pioneer two decades ago.\nBut some patients can't use any existing one-tablet options like Biktarvy and require more complex combinations of medicines because of drug resistance from older therapies, side effects or interactions with other drugs, among other treatment challenges. Those patients may have to take multiple pills a day and adhere to complicated dosing schedules.\nBaeten said that group tends to be older and have long treatment histories, saying \"some had to take handfuls of pills around 25 years ago.\" HIV also accelerates complications of aging, such as heart disease, diabetes and high cholesterol, in that age group, he added.\n\"It's incredibly meaningful to develop a medicine, in my perspective, for people aging with HIV,\" Baeten said.\nThe new pill is also aimed at people who are doing well on a single-tablet regimen, including Biktarvy, and want to switch to a new one. Baeten stressed that Bixlenvo does not aim to replace Biktarvy.\nFor patients already doing well on Biktarvy, the rationale for switching is more about expanding treatment choices, he said. He emphasized that HIV care is highly individualized and that long-term success often depends on finding a regimen that best fits a patient's preferences and lifestyle.\nBaeten also said Bixlenvo is part of Gilead's broader effort to build a range of HIV treatment options around lenacapavir, including daily pills, weekly oral regimens and long-acting injectable therapies. The goal is to give patients flexibility to choose how they want to manage the disease, he said.\n\"We're going to build enough options that people can make the choice that's going to work for them,\" Baeten said. \"Some people like the surety of once a day, and some people would want 'set it and forget it' once every six months.\"\nWhat Bixlenvo is like for patients\nBaeten called it \"essential\" to have more than one medicine to treat HIV because the virus can become resistant to an initial treatment.\nCombining bictegravir and lenacapavir in one pill allows it to \"hit the virus in two different ways\" with \"high efficacy [and] strong protection\" against the virus becoming resistant to treatment, Baeten added.\nThe approval is based on two Phase 3 trials, which evaluated Bixlenvo in adults with HIV whose virus was already suppressed on treatment. That includes people who switched from Biktarvy or complex treatment regimens with multiple tablets.\nThe first trial – ARTISTRY-1 – specifically enrolled patients with long treatment histories and drug resistance, many of whom were taking multiple HIV medications each day. Participants had a median age of 60 and were taking between two and 11 pills daily before switching to Bixlenvo.\nIn both studies, the pill maintained viral suppression at rates comparable to patients' previous regimens at 48 weeks and was generally well tolerated with no new safety concerns. The most common side effects reported in at least 2% of participants across the two trials was headache, nausea and diarrhea.\nTimothy Cameron, a 64-year-old retired Seattle resident who has been living with HIV for more than 40 years, was among the participants in the first Phase 3 trial.\nWhen he was first diagnosed in the 1980s, doctors had few treatment options and little ability to measure how active the virus was. He spent decades cycling through HIV medications, experimental drugs and multi-pill regimens that often came with difficult side effects and eventually stopped working against his \"hard-to-treat\" virus.\n\"It was just like throwing darts at a dartboard,\" Cameron said. \"Because I had done so many drug trials and monotherapy, my virus had become super resistant.\"\nA few years before enrolling in the Gilead study, Cameron finally found a regimen that controlled his virus, though it required taking one HIV pill twice daily along with another medication. His doctor encouraged him to join the trial and switch to Bixlenvo, a once-daily pill Cameron described as \"smaller than my pinky nail.\"\nThe transition was seamless, he said. The drug maintained control of his virus without causing side effects and simplified his treatment routine by reducing the number of pills he takes and consolidating all of his medications into a single daily schedule.\nFor Cameron, who spent decades exhausting HIV treatment options as his virus developed resistance, among the biggest benefits may be that the two-drug regimen effectively controls his virus while exposing him to fewer medications. He said that gives him confidence that additional treatment options could remain available in the future if he ever needs them.\n\"It's one less thing I'm putting in my body, and it preserves options if I need them,\" Cameron said.",
    "bodyJa": "食品医薬品局は、一部の患者のケアの簡素化に役立つ可能性があるギリアドの1日1回投与のHIV薬を承認したと同社が木曜日に発表した。\nBixlenvoとして販売されているこの薬は、ウイルスがすでに制御下にあるものの、依然として複雑な治療計画を続けている患者を対象としている。また、単に新しい治療法に切り替えたいと考えている人にとっても魅力的かもしれません。\nこの錠剤は、ギリアドの大ヒットHIV薬ビクタルビの骨格であるビクテグラビルと、同社のHIV治療と予防に関する長期戦略の中心となっているファーストインクラスのカプシド阻害剤であるレナカパビルを組み合わせたものである。\nギリアドによると、今回の承認により、この新しい錠剤は、ウイルスが抑制されているが現在利用可能な1錠治療オプションを使用できないHIV感染成人向けに利用できる初の1錠剤レジメンとなる。同社はCNBCに対し、この人口は米国のHIV感染者のうち推定5%以上を占めると語った。\nギリアド社がCNBCに語ったところによると、割引やリベート前の錠剤の定価は30日分で4,595ドルで、これは他の1日1錠のHIV治療薬と同じだという。健康保険を持たない人はギリアドの患者支援プログラムを通じて無料でBixlenvoを入手できる可能性がある一方、商業保険や民間保険に加入している人は別の貯蓄プログラムを通じて自己負担によるサポートを受けることができる可能性があると同社は述べた。\nギリアド社の臨床開発およびウイルス学治療領域の責任者であるジャレッド・ベーテン博士は、「これは、特に複雑なレジメンを服用している個人にとって、それがなければ自分や処方者にとって真に意味のあるものに統合することができないような、満たされていないニーズを満たすものである」と、ギリアド社の臨床開発およびウイルス学治療領域責任者のジャレッド・ベーテン博士は述べた。\n「しかし、それは何か新しいことの選択肢を探している個人にとっても意味があるのです」と彼は続けた。 「私たちは、人々が自分にとって効果的であり、長期的に働きそうなものを選択する機会を提供するオプションを構築したいと考えています。」\nHIV やエイズの治療法はありません。しかし、HIV とともに生きる多くの人々は、毎日 1 錠の錠剤を服用することで病気を管理できます。これはギリアドが 20 年前に開発を支援した治療計画です。\nしかし、一部の患者は、古い治療法による薬剤耐性、副作用や他の薬剤との相互作用、その他の治療上の課題のために、Biktarvy のような既存の 1 錠剤オプションを使用できず、より複雑な薬剤の組み合わせが必要になります。そうした患者は、1 日に複数の錠剤を服用し、複雑な投与スケジュールを遵守しなければならない場合があります。\nBaeten氏は、このグループは高齢で治療歴が長い傾向にあると述べ、「約25年前に数錠の薬を服用しなければならなかった人もいた」と語った。また、HIVは、その年齢層において、心臓病、糖尿病、高コレステロールなどの加齢に伴う合併症を促進する、と同氏は付け加えた。\n「私の考えでは、HIVに感染して高齢化する人々のための薬を開発することは非常に有意義です」とBaeten氏は語った。\nこの新しい錠剤は、ビクタルビを含む単錠療法で良好な成績を収めているが、新しい錠剤への切り替えを希望している人も対象としている。 Baeten氏は、Bixlenvo氏がBiktarvy氏の後任を目指しているわけではないと強調した。\nすでにBiktarvyで良好な成績を収めている患者にとって、切り替えの根拠はむしろ治療の選択肢を広げることにある、と同氏は述べた。彼は、HIV ケアは非常に個別化されており、長期的な成功は多くの場合、患者の好みやライフスタイルに最も適合するレジメンを見つけることに依存していることを強調しました。\nBaeten氏はまた、Bixlenvoは、毎日の錠剤、週1回の経口投与、長時間作用型の注射療法など、レナカパビルを中心とした幅広いHIV治療選択肢を構築するギリアドの広範な取り組みの一環であると述べた。目標は、患者が病気を管理する方法を柔軟に選択できるようにすることだと同氏は述べた。\n「私たちは、人々が自分にとってうまくいく選択をできるように、十分な選択肢を構築するつもりです」とBaeten氏は語った。 「1 日 1 回の確実性を好む人もいれば、半年に 1 回『設定したら忘れる』ことを望む人もいます。」\nBixlenvo は患者にとってどのようなものなのか\nBaeten氏は、HIVウイルスは初期治療に耐性を示す可能性があるため、HIV治療薬を複数用意することが「不可欠」であると述べた。\nビクテグラビルとレナカパビルを1つの錠剤に組み合わせることで、「2つの異なる方法でウイルスを攻撃」し、治療に耐性を持つウイルスに対して「高い有効性と強力な保護」が可能になるとBaeten氏は付け加えた。\nこの承認は、治療によりウイルスがすでに抑制されているHIV感染成人を対象にBixlenvoを評価した2件の第3相試験に基づいている。これには、Biktarvy や複数の錠剤を使用する複雑な治療計画から切り替えた人々も含まれます。\n最初の試験である ARTISTRY-1 では、治療歴が長く薬剤耐性のある患者が特に登録され、その多くは毎日複数の HIV 薬を服用していました。参加者の年齢中央値は60歳で、Bixlenvoに切り替える前は毎日2～11錠を服用していた。\n両方の研究において、この錠剤は48週間時点で患者の以前のレジメンと同等の速度でウイルス抑制を維持し、一般的に忍容性は良好であり、新たな安全性の懸念はなかった。 2 つの試験全体で参加者の少なくとも 2% で報告された最も一般的な副作用は、頭痛、吐き気、下痢でした。\n40年以上HIVと共に暮らしている64歳の退職シアトル居住者ティモシー・キャメロンは、最初の第3相試験の参加者の一人であった。\n1980年代に彼が最​​初に診断されたとき、医師には治療法の選択肢がほとんどなく、ウイルスの活性度を測定する能力もほとんどありませんでした。彼は何十年もの間、HIV治療薬、実験薬、多剤併用療法を繰り返すことに費やしたが、それらはしばしば困難な副作用を伴い、最終的には「治療が難しい」ウイルスに対して効果を発揮できなくなった。\nキャメロン首相は「まるでダーツボードに向かってダーツを投げているようなものだった」と語った。 「あまりにも多くの薬物試験と単剤療法を行ったので、私のウイルスは非常に耐性が強くなりました。」\nギリアドの研究に登録する数年前、キャメロン氏はついに自分のウイルスを制御する処方を見つけたが、その処方にはHIV錠剤を1日2回、別の薬と一緒に服用する必要があった。医師は彼に治験に参加し、キャメロンさんが「私の小指の爪より小さい」と表現した1日1回服用の錠剤ビクスレンボに切り替えるよう勧めた。\n移行はシームレスだった、と彼は語った。この薬は副作用を引き起こすことなくウイルスの制御を維持し、服用する錠剤の数を減らし、すべての薬を 1 つの日のスケジュールに統合することで、彼の治療ルーチンを簡素化しました。\nウイルスが耐性を獲得するにつれて、HIV治療の選択肢を何十年も費やしてきたキャメロン首相にとって、最大の利点の一つは、2剤処方によりウイルスを効果的に制御しながら、被曝する薬剤の量を減らしたことかもしれない。このことにより、今後も必要な場合には追加の治療オプションが利用できるという自信が得られると同氏は述べた。\n「体に取り込むものが一つ減り、必要な場合に選択肢が残されます」とキャメロン首相は語った。",

    "bodyOriginal": "'Cowboy builders' targeted in new government clampdown\n- Published\nPeople carrying out home renovations will gain greater protections against \"cowboy builders\" through a new database of trusted traders and a payment system offering more safeguards, the government has said.\nTraders signing up to the scheme launching next month will need to demonstrate certain standards of customer service, transparency and dispute resolution.\nPrime Minister Andy Burnham said unscrupulous tradespeople \"leave families with months of stress\" as well as unfinished work.\nThe National Federation of Builders said the changes would not stop rogue operators while the Tories suggested there would be added paperwork for firms already operating legitimately.\nCitizens Advice has said home renovations are one of its biggest sources of consumer complaints.\nThe government said more than a quarter of people who carried out home improvements in the past 18 months have experienced problems, such as builders disappearing after upfront payments were made.\nIt cited a survey carried out for the Competition and Markets Authority, external suggesting customers lost more £10bn in 2024 on home and garden maintenance services due to losses, overpriced costs or unfair practices by traders.\nBBC News has previously reported on \"bait-and-switch\" locksmith scams, where customers were given an initial cheap quote before hidden charges and unnecessary work were added.\nUnder the new traders' scheme, customers' money will be held in an account and released in parts after certain milestones in projects are completed.\nThe National Federation of Builders (NFB) told BBC Breakfast there are already schemes in place to find trustworthy builders.\nAdas Rico Wojtulewicz-Richmond, the NFB's director of policy, said: \"Is this scheme going to stop bad actors operating and ripping people off? I don't think it will.\"\nHe said a better approach would be for every project to have a \"passport\" which records all the work done.\n\"It protects consumers because you can find out which companies are doing a poor job, and it brings up the industry standards,\" he said.\nThe prime minister said rogue tradespeople gave their \"decent, hardworking\" counterparts a bad name and would be \"putting the cowboys out of business\".\nBusiness Secretary Jonathan Reynolds said that, while home improvements can be stressful, \"we're taking action to protect consumers, support reputable traders and make sure people can spend their money with greater confidence and security\".\nShadow business secretary Andrew Griffith said the announcement looks like \"the sort of government initiative that risks the unintended consequence of piling more paperwork onto the majority of businesses who already do the right thing\".\nHe said: \"The government would do far better to beef up law enforcement and have tougher sentences for the minority who fraudulently rip off customers. Those who break the rules will keep breaking them regardless of whether there is an app in the way.\"\nLiberal Democrat business spokesperson Sarah Olney said: \"Rogue builders cause real harm and ruin real lives every year. The current system is simply not fit for purpose and this half-baked announcement falls frustratingly short from fixing it.\n\"A voluntary code for tradespeople completely misses the mark. Rogue operators won't voluntarily sign up - they will simply keep exploiting families in the shadows.\"\nClampdown on 'intimidating' bailiffs\nAlongside action on rogue tradespeople, the government has announced plans to regulate private bailiffs in England and Wales, to protect people in debt from \"intimidating behaviour, unfair treatment or being pushed into excessive repayment arrangements\".\nUnder the changes, people facing enforcement action will have access to an independent complaints process, and private bailiffs will be held to professional standards.\nSarah Sackman, minister for courts and legal services, said bailiffs did an important job, but \"with that responsibility must come high standards\".\nAs part of the changes, the government will look at how organisations such as Trading Standards work with regulators and enforcement bodies \"so consumers are not passed from pillar to post\".\nLast year, a Freedom of Information request by Which? revealed that understaffing in trading standards teams was leading to more scams and dangerous products being sold.\nRelated topics\n- Published13 February\n- Published5 March",
    "bodyJa": "「カウボーイ建設業者」が政府の新たな取り締まり対象に\n- 公開されました\n住宅改修を行う人々は、信頼できる業者の新しいデータベースと、より多くの安全策を提供する支払いシステムを通じて、「カウボーイ建築業者」からの保護が強化されると政府は述べた。\n来月開始されるこの制度に登録するトレーダーは、顧客サービス、透明性、紛争解決の一定基準を証明する必要がある。\nアンディ・バーナム首相は、悪徳業者はやり残した仕事だけでなく「家族に何か月もストレスを与えている」と述べた。\n全米建設業者連盟は、今回の変更では不正業者を阻止できないと述べたが、保守党はすでに合法的に運営している企業に対する事務手続きを追加する可能性を示唆した。\nシチズンズ・アドバイスは、住宅改修が消費者からの苦情の最大の原因の一つであると述べた。\n政府によると、過去１年半以内に住宅改修を行った人の４分の１以上が、前払い金の支払い後に建設業者が失踪するなどの問題を経験しているという。\n同報告書は、競争・市場庁のために実施された調査結果を引用し、外部からは損失、高額な費用、業者による不公正な行為により、2024年に住宅や庭のメンテナンスサービスで顧客が100億ポンド以上の損失を被ったことが示唆されている。\nBBCニュースは以前、隠れた料金や不必要な作業が追加される前に、顧客に最初の安価な見積もりを提示する「おとり商法」鍵屋詐欺について報じた。\n新しいトレーダーのスキームでは、顧客の資金は口座に保管され、プロジェクトの特定のマイルストーンが完了した後に分割して放出される。\n全国建設業者連盟（NFB）はBBCブレックファストに対し、信頼できる建設業者を見つけるための計画がすでに整っていると語った。\nNFBの政策部長、アダス・リコ・ヴォイトゥレヴィチ＝リッチモンド氏は、「この計画によって、悪者たちが活動し、人々から騙し取る行為を止めることができるだろうか？私はそうはならないと思う」と述べた。\n同氏は、より良いアプローチは、すべてのプロジェクトに、行われたすべての作業を記録する「パスポート」を持たせることだ、と述べた。\n「どの企業がひどい仕事をしているかを知ることができ、業界の標準を引き上げることができるので、消費者は守られる」と同氏は語った。\n首相は、悪徳業者が「まともで勤勉な」業者に悪名を与え、「カウボーイを廃業に追い込む」ことになると述べた。\nジョナサン・レイノルズ商務長官は、住宅改修にはストレスがかかる可能性があるが、「消費者を保護し、評判の良い業者をサポートし、人々がより安心してお金を使えるようにするための措置を講じている」と述べた。\n影のビジネス長官のアンドリュー・グリフィス氏は、今回の発表は「すでに正しいことを行っている大多数の企業にさらに多くの事務手続きを課すという予期せぬ結果を招く危険を冒す一種の政府の取り組み」のように見えると述べた。\n同氏は、「政府は法執行を強化し、顧客から不正にぼったくりをした少数者に対してはより厳しい刑罰を与える方がはるかに良い対応をするだろう。ルールを破る者は、邪魔なアプリがあるかどうかに関係なく、ルールを破り続けるだろう。」と語った。\n自由民主党のビジネススポークスマン、サラ・オルニー氏は、「悪質な建築業者は毎年、実害をもたらし、現実の生活を台無しにしている。現在のシステムは単に目的に適合しておらず、この中途半端な発表は、それを修正するにはもどかしいほど及ばない」と語った。\n「業者向けの自主規定は完全に的外れです。不正なオペレーターは自発的に登録することはなく、ただ影で家族を搾取し続けるだけです。」\n「威圧的な」執行吏の取り締まり\n政府は悪徳商人への措置と並行して、借金を抱えた人々を「脅迫的な行為、不公平な扱い、過剰な返済取り決めの押し付け」から守るため、イングランドとウェールズで民間の執行吏を規制する計画を発表した。\nこの変更により、執行措置に直面している人々は独立した苦情プロセスにアクセスできるようになり、民間の執行吏は専門的な基準に従うことになります。\nサラ・サックマン裁判所法務大臣は、執行吏は重要な仕事をしているが、「その責任には高い基準が求められる」と述べた。\n変更の一環として、政府は「消費者が次から次へと受け継がれないように」取引基準などの組織が規制当局や執行機関とどのように連携するかを検討する予定だ。\n昨年、Which?による情報公開請求が行われました。は、取引標準チームの人員不足が、より多くの詐欺や危険な製品の販売につながっていることを明らかにしました。\n関連トピック\n- 2 月 13 日公開\n- 3 月 5 日発行",

    "title": "Trump signs order to rename Lake Ontario 'Lake America' amid Canada trade war",
    "titleJa": "カナダ貿易戦争のさなか、トランプ大統領がオンタリオ湖の名前を「アメリカ湖」に変更する命令に署名",
    "summaryJa": "ドナルド・トランプ大統領は木曜日、オンタリオ湖の名前を「直ちに」「アメリカ湖」に変更するとする大統領令に署名した。米国北部とカナダの国境にまたがる五大湖の名前を変更しようとするトランプ大統領の試みは、最近ワシントンとオタワの間の通商協議が決裂し、新たな報復関税が発生し、関係が急速に悪化している中で行われた。",
    "bodyOriginal": "President Donald Trump on Thursday signed an executive order that he said will \"immediately\" change the name of Lake Ontario to \"Lake America.\"\nTrump's attempt to rename the Great Lake, which straddles the U.S. northern border with Canada, came as a recent breakdown in trade talks between Washington and Ottawa has led to new retaliatory tariffs and a rapidly deteriorating relationship.\nTrump in recent days had repeatedly threatened to take the symbolic step, but it was unclear if he was being serious. Canadian officials have already said they will not recognize the new name. Countries can use different names for the same geographical features.\n\"We're going to be changing the name of Lake Ontario, effective immediately, to Lake America,\" Trump said in the Oval Office before signing the executive order.\nA White House official told Trump that the order directs Interior Secretary Doug Burgum and his department to update the Geographic Names Information System \"to reflect that lake once known as Lake Ontario will, from this day forward, be known as Lake America.\"\nCanadian Prime Minister Mark Carney said later Thursday that his country will keep calling it Lake Ontario.\n\"We know that America is changing. Their trading relationships, their foreign policies, their national monuments, their hydronyms,\" Carney wrote in an X post.\n\"Canadians also know that naming reality means calling it Lake Ontario – then, now and always,\" he wrote.\nThe executive action marks the second time Trump has targeted the long-enduring name of an international body of water and renamed it for the U.S.\nOn the first day of his second term, Trump signed an order to change the name of the Gulf of Mexico to the \"Gulf of America.\" The attempt to rename the gulf, which has gone by the same name since the 16th Century, drew international opposition, and numerous media outlets vowed to stick with the common and internationally recognized usage.\nTrump said Thursday, \"If you think about it, we have a gulf and we have a lake. Now, all we need is an ocean. So, maybe we'll have to change the name of the Atlantic, and/or the Pacific. Maybe we'll change them both.\"\nWhen asked what message he was trying to send by renaming Lake Ontario, Trump initially claimed, \"No message.\"\nBut he immediately added, \"Canada has been ripping us off for a long time on trade.\"\n\"They don't pay for anything, and they want to be treated like a state, but they're not a state,\" Trump said. Last year, he angered many Canadians by repeatedly advocating for making their country the 51st U.S. state.\nThe latest provocation could further inflame tensions between the U.S. and Canada, whose trade war reignited over the weekend when Trump imposed 50% tariffs on about $20 billion worth of Canadian goods.\nCanada responded by announcing \"dollar for dollar\" retaliatory tariffs of up to 50% on imports from the U.S., currently set to take effect on Sept. 8.\nOn Wednesday evening, Canada said it would pare back some of those tariffs targeting seafood and fish products \"to protect against broader economic harms.\"\nBut the new round of import taxes could still raise costs and reduce choices for consumers, as Carney acknowledged after the two countries' trade negotiations fell apart Friday evening.\nBut Trump, an ardent fan of tariffs who has long complained about the U.S. maintaining trade deficits with its economic partners, dismissed the idea that the dispute could exacerbate affordability in the U.S.\n\"Ultimately, it's going to be very good for us,\" Trump said Thursday afternoon, citing the average annual U.S. trade deficit with Canada.\n\"It's too much. We can't lose that. We don't want to lose that. We don't want to lose it anymore,\" he said.\nLake Ontario's centuries-old name comes from the Iroquoian word \"oniatarí:io,\" meaning \"lake of shining waters,\" according to the Center for Great Lakes Literacy.\nIt is farthest east of the five Great Lakes, the world's largest freshwater system. It is bordered to the north by the Canadian province of Ontario and to the south by New York.\nTrump's move drew derision from some of his Democratic critics.\nIllinois Gov. JB Pritzker mockingly wrote on X that Chicago's Trump Tower \"is renamed to NATALIE TOWER,\" referencing a recent controversy surrounding presidential aide Natalie Harp.\nWisconsin Gov. Tony Evers responded to Trump's action by posting a video of himself at a McDonald's signing a napkin labeled \"Lake Wisconsin.\"\n\"And I just renamed Lake Michigan Lake Wisconsin,\" Evers wrote in the X post. \"See, I can sign napkins that say things, too.\"",
    "bodyJa": "ドナルド・トランプ大統領は木曜日、オンタリオ湖の名前を「直ちに」「アメリカ湖」に変更するとする大統領令に署名した。\n米国北部とカナダの国境にまたがる五大湖の名前を変更しようとするトランプ大統領の試みは、最近ワシントンとオタワの間の通商協議が決裂し、新たな報復関税が発生し、関係が急速に悪化している中で行われた。\nトランプ大統領はここ数日、象徴的な措置を講じると繰り返し脅迫していたが、本気かどうかは不明だ。カナダ当局はすでに、この新しい名前を認めないと述べている。国は、同じ地理的特徴に対して異なる名前を使用できます。\nトランプ大統領は大統領令に署名する前に大統領執務室で「オンタリオ湖の名前を即時有効にアメリカ湖に変更する」と述べた。\nホワイトハウス当局者はトランプ大統領に対し、この命令はダグ・バーガム内務長官と同省に対し、「かつてオンタリオ湖として知られていた湖が、今日からアメリカ湖として知られることを反映する」地理名情報システムを更新するよう指示していると語った。\nカナダのマーク・カーニー首相は木曜遅く、自国はオンタリオ湖を今後もオンタリオ湖と呼び続けると述べた。\nカーニー氏はXの投稿で、「アメリカが変わりつつあることは知っている。貿易関係、外交政策、国定記念物、ハイドロニムだ」と書いた。\n「カナダ人はまた、現実に名前を付けるということは、当時も今も、そしてこれからも、それをオンタリオ湖と呼ぶことを意味することを知っています」と彼は書いた。\nこの大統領行動は、トランプ大統領が国際水域の長年の名称を標的にし、米国に合わせてその名称を変更したのは2回目となる。\nトランプ大統領は２期目の任期初日、メキシコ湾の名称を「アメリカ湾」に変更する命令に署名した。 16世紀以来同じ名前で使われてきた湾の名前を変更する試みは国際的な反対を招き、多くのメディアが一般的で国際的に認められた使用法を堅持すると誓った。\nトランプ大統領は木曜日、「考えてみれば、私たちには湾もあれば湖もある。今、私たちに必要なのは海だけだ。だから、おそらく大西洋か太平洋、あるいはその両方の名前を変更する必要があるだろう。もしかしたら両方とも変更するかもしれない」と語った。\nオンタリオ湖の名前を変更することでどのようなメッセージを伝えようとしていたのかと問われ、トランプ大統領は当初「メッセージはない」と主張した。\nしかし同氏はすぐに、「カナダは貿易に関して長い間我々から騙し取ってきた」と付け加えた。\nトランプ大統領は「彼らは何の対価も払わず、国家のように扱われることを望んでいるが、彼らは国家ではない」と語った。昨年、彼はカナダを米国51番目の州にすることを繰り返し主張し、多くのカナダ国民を怒らせた。\n今回の挑発は米国とカナダの間の緊張をさらに高める可能性があり、トランプ大統領が約200億ドル相当のカナダ製品に50％の関税を課した週末に貿易戦争が再燃した。\nカナダはこれに応じ、米国からの輸入品に最大50％の「ドル・フォー・ドル」報復関税を課すと発表し、現在9月8日に発効予定となっている。\nカナダは水曜夜、「広範な経済的被害から守るため」水産物や魚製品を対象とした関税の一部を削減すると発表した。\nしかし金曜日夕方、両国の通商交渉が物別れに終わった後にカーニー長官が認めたように、輸入税の新ラウンドは依然としてコストを上昇させ、消費者の選択肢を減らす可能性がある。\nしかし、熱心な関税支持者であり、米国が経済パートナーとの貿易赤字を維持していることに長年不満を抱いてきたトランプ氏は、この紛争が米国の経済的余裕を悪化させる可能性があるという考えを一蹴した。\nトランプ大統領は木曜午後、米国の対カナダ年間平均貿易赤字を引き合いに出し、「最終的には我々にとって非常に良いことになるだろう」と語った。\n「多すぎる。これを失うわけにはいかない。失いたくない。これ以上失いたくない」と彼は語った。\n五大湖識字センターによると、何世紀も続くオンタリオ湖の名前は、「輝く水の湖」を意味するイロコイ語の「oniatarí:io」に由来しているという。\n世界最大の淡水系である五大湖の最東端にあります。北はカナダのオンタリオ州、南はニューヨークと隣接しています。\nトランプ氏の動きは民主党批判者の一部から嘲笑を買った。\nイリノイ州のJB・プリツカー知事は、大統領補佐官ナタリー・ハープをめぐる最近の論争に言及し、シカゴのトランプ・タワーが「ナタリー・タワーに名前が変更される」とXに嘲笑的に書いた。\nウィスコンシン州のトニー・エバーズ知事はトランプ大統領の行動に反応し、マクドナルドで「ウィスコンシン湖」と書かれたナプキンにサインする自身の動画を投稿した。\n「そして私はミシガン湖の名前をウィスコンシン湖に変更したところです」とエバーズ氏はXの投稿に書いた。 「ほら、ナプキンに何かを書いてサインすることもできるよ。」",

    "id": "fed-chairman-kevin-warsh-delivers-his-ke-ae697919",
    "title": "Fed Chairman Kevin Warsh delivers his key Jackson Hole speech Friday. Here's what to expect",
    "titleJa": "FRBのケビン・ウォーシュ議長は金曜日、ジャクソンホールで重要な演説を行う。期待できることは次のとおりです",
    "summaryJa": "FRBの不可解な議長は金曜日にジャクソンホールで待望の基調講演を行う予定で、市場は同議長が経済と金融政策に影響を与える重要な問題について、もし何かあれば何を言わなければならないのかを予想しようとしている。ケビン・ウォーシュ氏はワイオミング州で開催されるFRBの年次シンポジウムで講演する予定で、今年は「金融イノベーション：決済と政策への影響」と題されたイベントとなる。",
    "bodyOriginal": "The Federal Reserve's cryptic chairman is set to deliver his much-awaited keynote address Friday in Jackson Hole, with markets trying to anticipate what, if anything, he will have to say on key matters affecting the economy and monetary policy.\nKevin Warsh will speak during the Fed's annual symposium in Wyoming, an event this year that is titled \"Financial Innovation: Implications for Payments and Policy.\"\nPrior Fed chairs have used the speech as an opportunity to discuss broad policy frameworks and intentions on where they see policy and interest rates headed, beyond the main focus of the conference.\nBut given his approach so far since taking the reins in May, a time during which Warsh has placed a far greater emphasis on market direction than cues from the Fed, it's hard to know what to expect.\n\"People keep asking me what I'm expecting, and I'm not really expecting much of anything. I think it's hard to predict what he's going to say,\" said Luke Tilley, chief economist at M&T Bank and Wilmington Trust Investment Advisors. \"If I had to guess, I would say that he's going to give a very high-level, broad look at the work of the task forces and how he thinks the Fed should operate, as opposed to a nuts-and-bolts assessment of the economy and expectations for policy.\"\nWarsh has set up five task forces aimed at taking what he calls a \"first principles\" look at Fed functions.\nAmong their tasks are an assessment of how policymakers view inflation, the balance sheet, the data points that influence decisions, communication strategies and communications.\nOn the final point, Warsh has taken a unique approach compared to his recent predecessors: Rather than seeking to steer reaction through carefully placed signals, he has preferred a more hands-off approach that lets markets interpret data and send signals to the Fed.\nIt's a strategy that has met with mixed reviews so far and could generate adverse reaction.\nLooking for more information\n\"I would appreciate some more detail on how he personally thinks inflation happens, or how he personally thinks monetary policy affects inflation, either in timing or through which channels,\" Tilley said. \"That doesn't even have to address the reaction function. It's just the basic plumbing of financial markets and monetary policy, because there are a lot of channels.\"\nWith rising Treasury yields heavily in focus, the stakes particularly high for Friday's speech.\n\"We have the most unusual Jackson Hole monetary symposium in recent memory on deck because of Warsh's unforced errors early in his tenure,\" said Joseph Brusuelas, chief economist at RSM. \"The market has now bid this up to be something that I think the Federal Reserve would rather it not be.\"\nThere's more at stake, though, than market reaction.\nCoinciding with the rise in yields, Treasury Secretary Scott Bessent announced an initiative last week in which the department will double the size of its buybacks on off-the-run, or already issued, debt offerings. Treasury usually buys back $2 billion per weekly operation, but will \"at least\" double that when the next round begins Sept. 9.\nWhile that's a relatively small chunk of the massive U.S. debt load, the move still sets up a possibly uncomfortable scenario for Warsh. Market interventions from fiscal and monetary authorities seem to contradict Warsh's stated intentions so far.\n\"We're in a unique set of conditions here, where actions by the Treasury have undermined Warsh's move. Therefore, the Fed chair is in between a rock and a hard place,\" Brusuelas said.\nMarket impacts\nOne common complaint about Warsh thus far is his reluctance not only to provide so-called forward guidance on where he thinks the Fed is headed but also neglecting to delineate the \"reaction function,\" or the conditions that would warrant a move in either direction.\nFailing to do so again could have significant market consequences, said Mark Cabana, head of U.S. rates strategy at Bank of America.\n\"In short, we expect Warsh to signal that he is prepared to raise rates again if inflation does not continue to moderate,\" Cabana said in a client note earlier this week. \"By contrast, if he uses the speech to focus solely on broader structural themes such as productivity or demographics, we worry markets could interpret the message as dovish.\"\nIn such a case, Cabana said he would expect a sell-off in long-dated Treasurys that could send the 30-year yield to 5.5% or higher, which would be more than 0.3 percentage points from the current level to highs not seen since at least the early part of the 21st century.\nSpecificity, then, could be Warsh's friend as he prepares to deliver the most important remarks of his tenure so far.\n\"Warsh is not going to be able to engage in cryptic discourse,\" Brusuelas said. \"He's going to need to be a little bit more forthright and clear on what he means.\"",
    "bodyJa": "FRBの不可解な議長は金曜日にジャクソンホールで待望の基調講演を行う予定で、市場は同議長が経済と金融政策に影響を与える重要な問題について、もし何かあれば何を言わなければならないのかを予想しようとしている。\nケビン・ウォーシュ氏はワイオミング州で開催されるFRBの年次シンポジウムで講演する予定で、今年は「金融イノベーション：決済と政策への影響」と題されたイベントとなる。\nこれまでのFRB議長らはこの講演を、会議の主な焦点を超えて、広範な政策枠組みや政策と金利の方向性についての意図を議論する機会として利用してきた。\nしかし、ウォーシュ氏がFRBからの指示よりも市場の方向性をはるかに重視してきた5月に政権を握って以来、これまでの同氏のアプローチを考えると、何を期待すべきかを知るのは難しい。\nＭ＆Ｔバンク・アンド・ウィルミントン・トラスト・インベストメント・アドバイザーズの首席エコノミスト、ルーク・ティリー氏は「人々は私に何を期待しているかと尋ね続けるが、私は実際には何も期待していない。彼が何を言うか予測するのは難しいと思う」と述べた。 「推測しなければならないとしたら、同氏は経済の基本的な評価や政策への期待とは対照的に、特別委員会の取り組みやFRBがどのように運営されるべきだと考えているかについて、非常に高いレベルで広範な見解を示すだろう、と私は言うだろう。」\nウォーシュ氏はFRBの機能を「第一原則」と呼ぶものを検討することを目的とした5つのタスクフォースを設置した。\n彼らの任務には、政策立案者がインフレ、バランスシート、意思決定に影響を与えるデータポイント、コミュニケーション戦略、コミュニケーションをどのように見ているかの評価が含まれる。\n最後の点については、ウォーシュ氏は最近の前任者と比べて独特のアプローチをとってきた。慎重に配置されたシグナルを通じて反応を誘導しようとするのではなく、市場がデータを解釈してFRBにシグナルを送信できるようにする、より介入のないアプローチを好んだ。\nこの戦略はこれまでのところ賛否両論あり、逆効果を生む可能性もある。\nさらに詳しい情報を探しています\nティリー氏は「インフレがどのように起こると同氏が個人的に考えているのか、あるいは金融政策がタイミングやどのような経路でインフレにどのような影響を与えると個人的に考えているのか、もう少し詳しく知りたい」と述べた。 「それは反応関数に対処する必要さえありません。それは金融市場と金融政策の基本的な配管にすぎません。なぜなら多くのチャネルがあるからです。」\n米国債利回りの上昇に大きな注目が集まっており、金曜日の講演への賭けは特に高まっている。\nＲＳＭの首席エコノミスト、ジョセフ・ブルスエラス氏は「ウォーシュ氏の在任初期のアンフォーストエラーのため、最近の記憶では最も異例なジャクソンホール金融シンポジウムがデッキ上で開催されることになった」と述べた。 「市場は現在、これを入札しているが、連邦準備理事会はむしろそうならないことを望んでいるのではないかと思う。」\nしかし、市場の反応以上に問題がある。\n利回りの上昇と時を同じくして、スコット・ベッセント財務長官は先週、同省がオフ・ザ・ラン債、あるいはすでに発行済みの債券の買い戻し規模を２倍にする構想を発表した。財務省は通常、毎週のオペごとに20億ドルの買い戻しを行うが、9月9日に始まる次のラウンドでは「少なくとも」その2倍となる。\nこれは巨額の米国債務の比較的小さな部分だが、それでもこの動きはウォーシュ氏にとっておそらく不快なシナリオを設定することになる。財政・金融当局による市場介入は、これまでのところウォーシュ氏が表明した意図と矛盾しているようだ。\nブリュエラス氏は「ここでは財務省の行動がウォーシュ氏の動きを弱体化させたという特殊な状況にある。したがって、FRB議長は岩と困難の狭間にある」と述べた。\n市場への影響\nこれまでのところ、ウォーシュ氏に対するよくある不満の一つは、同氏がFRBがどこに向かっていると考えているかについて、いわゆるフォワードガイダンスを提供することに消極的であるだけでなく、「反応機能」、つまりどちらかの方向への移行を正当化する条件の線引きを怠っていることだ。\nバンク・オブ・アメリカの米国金利戦略責任者、マーク・カバナ氏は、再びそうしなければ市場に重大な影響を与える可能性があると述べた。\nカバナ氏は今週初めに顧客向けノートで「要するに、インフレが引き続き緩やかにならなければ、ウォーシュ氏が再度利上げする用意があると示唆すると予想している」と述べた。 「対照的に、同氏が生産性や人口動態といったより広範な構造的テーマのみに焦点を当てて演説を行う場合、市場がそのメッセージをハト派的なものとして解釈する可能性があると懸念している。」\nカバナ氏は、その場合、長期国債が売られ、30年債利回りが5.5％以上、つまり現在の水準から0.3％ポイント以上上昇し、少なくとも21世紀初頭以来の高水準に達する可能性があると予想していると述べた。\nしたがって、特異性は、これまでの任期中最も重要な発言を準備しているウォーシュ氏の友人になる可能性がある。\n「ウォーシュ氏は不可解な言論に参加することはできないだろう」とブルスエラス氏は語った。 「彼はもう少し率直に、自分の言いたいことを明確にする必要があるだろう。」",
