    "title": "U.S. to unveil 'greatest financial offensive' against Iran as Tehran threatens ship seizures",
    "titleJa": "イランが船舶拿捕を脅す中、米国、イランに対する「最大の金融攻撃」を発表へ",
    "summaryJa": "スコット・ベッセント財務長官は、米国は月曜日にイランに対して「史上最大の金融攻撃」を開始すると述べ、一方イランはホルムズ海峡の通航規則に違反した船舶を拿捕すると脅した。差し迫った事態の激化は、双方が合意に達するための60日間の停戦期限を逃し、中東戦争の終結を目的とした正式な停戦メカニズムが6か月目で終了したために生じた。",
    "bodyOriginal": "The U.S will unveil \"the single greatest financial offensive ever\" against Iran on Monday, Treasury Secretary Scott Bessent said, while Tehran threatened to seize vessels that violate transit rules in the Strait of Hormuz.\nThe looming escalation comes as both sides missed a 60-day ceasefire window to reach a deal, closing off the formal truce mechanism aimed at ending the Middle East war now in its sixth month.\nIn a post on X Sunday evening stateside, Bessent said \"at dawn begins an economic D-Day,\" framing the coming measures as the \"endgame\" for Washington's campaign against Tehran.\nThe new measures will add to an extensive sanctions regime already targeting Iran's banking, energy, aviation and cryptocurrency sectors. The Trump administration has claimed that Iran's economy is in freefall, with runaway inflation and a collapsing currency.\nBessent also warned that \"any nation that serves as a financial artery of a withering regime should expect to share in its isolation\" — language aimed squarely at foreign governments still transacting with Tehran. He has previously warned of further secondary sanctions on nations and entities that conduct business with Iran.\nIran has responded by warning Gulf neighbors against joining U.S. economic measures and tightening its grip on the chokepoint, through which roughly a fifth of the world's seaborne oil passed before the war.\nOn Saturday, Mohsen Rezaei, a longtime military commander who became the new secretary of Iran's Supreme National Security Council earlier this month, vowed to target the interests of oil-rich neighbors if they joined U.S. efforts to further isolate Iran.\n\"Any country that becomes a partner in creating economic restrictions against us will be regarded by us as an enemy,\" he said in an interview with Iran's state broadcaster.\nIn a series of posts on X on Sunday, Iran's state-controlled Persian Gulf Strait Authority, or PGSA, warned that vessels violating its transit rules in the Hormuz could face penalties, including \"fines, seizure, or confiscation\" during future passages.\nIranian Foreign Minister Abbas Araghchi has also dismissed the threat of a fresh round of U.S. economic sanctions as a \"desperate\" ploy, asserting that U.S. actions, like the blockade, were set to fail.\nTehran's parliament approved on Sunday a provision stipulating that ships passing through the Hormuz chokepoint will pay for services provided by Tehran, according to local media reports. The legislation still needs full parliamentary approval.\nOmani Foreign Minister Sayyid Badr Albusaidi is scheduled to visit Tehran on Tuesday for bilateral talks with his Iranian counterpart Abbas Araghchi, local media reported Monday. Both sides will continue discussions over the Strait of Hormuz, according to Iranian foreign ministry spokesperson Esmail Baghaei.\nCrude pulled back in Asian trading Monday despite the looming escalation. West Texas Intermediate futures, the U.S. benchmark, fell about 1.3% to $85.93 per barrel, and Brent crude, the international benchmark, dropped 1.3% to $93.22 a barrel.\nThe UK Maritime Trade Operations agency reported no confirmed attacks in the strait over the 48 hours to Sunday, though it warned of a \"continued risk of drifting or uncharted mines,\" with mine danger areas still active.",
    "bodyJa": "スコット・ベッセント財務長官は、米国は月曜日にイランに対して「史上最大の金融攻撃」を開始すると述べ、一方イランはホルムズ海峡の通航規則に違反した船舶を拿捕すると脅した。\n差し迫った事態の激化は、双方が合意に達するための60日間の停戦期限を逃し、中東戦争の終結を目的とした正式な停戦メカニズムが6か月目で終了したために生じた。\nベッセント氏は米国時間日曜夕方のX紙への投稿で、「夜明けに経済のDデイが始まる」と述べ、今後の措置を米国政府の対テヘラン作戦の「最終目標」と位置づけた。\nこの新たな措置は、すでにイランの銀行、エネルギー、航空、仮想通貨部門を対象とした広範な制裁体制に追加されることになる。トランプ政権は、暴走するインフレと通貨の崩壊により、イラン経済はフリーフォール状態にあると主張した。\nベッセント氏はまた、「衰退しつつある政権の金融動脈として機能する国家は、その孤立を共有することを期待すべきだ」と警告したが、これは依然としてテヘランと取引を続けている外国政府に向けた言葉である。同氏は以前、イランと取引のある国や団体に対するさらなる二次制裁について警告していた。\nイランはこれに対し、湾岸諸国に対し、米国の経済対策に参加しないよう警告し、戦前に世界の海上石油の約5分の1が通過したチョークポイントへの締め付けを強化した。\n土曜日、長年の軍司令官で今月初めにイラン国家安全保障最高評議会の新書記に就任したモーセン・レザエイ氏は、石油資源が豊富な近隣諸国がイランをさらに孤立させる米国の取り組みに参加すれば、その利益を狙うと誓った。\n同氏はイラン国営放送とのインタビューで、「われわれに対して経済的制限を設けるパートナーとなる国はすべて、われわれから敵とみなされることになる」と述べた。\nイラン国営ペルシャ湾海峡管理局（PGSA）は日曜日のXへの一連の投稿で、ホルムズ港の通航規則に違反した船舶は今後の通航中に「罰金、差し押さえ、没収」などの罰則を受ける可能性があると警告した。\nイランのアッバス・アラグチ外務大臣も、米国による経済制裁の新たな発動の脅威を「絶望的な」策略として一蹴し、封鎖などの米国の行動は失敗することが決まっていたと主張した。\n地元メディアの報道によると、テヘラン議会は日曜日、ホルムズの難所を通過する船舶にテヘランが提供するサービスの料金を支払うことを規定する条項を承認した。この法案は依然として議会の完全な承認を必要としている。\nオマーンのサイード・バドル・アルブサイディ外相は、イランのアッバス・アラグチ外相との二国間会談のため、火曜日にテヘランを訪問する予定であると地元メディアが月曜日に報じた。イラン外務省のエスマイル・バガエイ報道官によると、双方はホルムズ海峡を巡る協議を継続する。\n原油価格は、差し迫った激化にもかかわらず、月曜日のアジア取引で撤退した。米国の指標であるウェスト・テキサス・インターミディエート先物は約1.3％下落して1バレル当たり85.93ドル、国際指標であるブレント原油は1.3％下落して1バレル当たり93.22ドルとなった。\n英国海事貿易業務局は日曜までの48時間に同海峡での攻撃は確認されなかったと報告したが、機雷危険区域は依然として活動中で「漂流または地図にない機雷の危険が継続している」と警告した。",

    "id": "ex-cricket-captains-urge-proper-medical-c1d7ff70",
    "title": "Ex-cricket captains urge 'proper medical care' for Imran Khan",
    "titleJa": "元クリケットキャプテンらがイムラン・カーンに「適切な医療」を要請",
    "summaryJa": "元クリケットキャプテンらがイムラン・カーンに「適切な医療」を要請- 公開されました",
    "bodyOriginal": "Ex-cricket captains urge 'proper medical care' for Imran Khan\n- Published\nA group of former cricket captains, including Indian batting legend Sunil Gavaskar and one of England's longest-serving skippers Sir Alastair Cook, have called on Pakistan to ensure its ex-PM Imran Khan be given proper care while in custody.\nThe cricketer-turned-politician has been in jail since 2023 on corruption charges which he denies.\nIn a letter to Pakistan's current leader Shehbaz Sharif, the 21 former skippers aired concern that Khan, 73, was allowed \"only a few hours\" at a hospital last week where he was examined by a state-appointed team.\nKhan's party has also filed a contempt petition against the government for not giving him access to his own doctors, as ordered by the top court.\nThe former cricket captains laid out three demands in their letter, the first of which is that Khan be assessed by a medical board directed by Pakistan's Supreme Court – which would include his personal physicians – particularly on the reported loss of vision in his right eye.\nThey also urged authorities to allow weekly visits by Khan's family, as ordered by the court, \"without interruptions or administrative delays\".\nFinally, they asked that any treatment recommended by the medical board be \"provided without delay\".\n\"Imran Khan is 73 years old and has now spent more than three years in custody,\" read the letter initiated by former Australian captain Greg Chappell.\n\"Whatever the legal and political arguments surrounding his case, the basic decency of ensuring a court-ordered medical process is actually completed is not, in our view, a controversial request.\"\nAmong the other signatories were England's Michael Atherton, Michael Brearley, Nasser Hussain, Andrew Strauss and David Gower, India's Kapil Dev and Dilip Vengsarkar, and Australia's Belinda Clark, Adam Gilchrist, Steve Waugh and Kim Hughes.\nFourteen of the former skippers had also supported an earlier appeal for \"humane treatment and proper medical care\" for Khan which was submitted in February.\nKhan's lawyer claimed at the time that his client had 15% vision left in his right eye after prison authorities failed to take action.\nThe signatories of both letters had described themselves as \"former colleagues and rivals who share a bond forged on the cricket field\", adding that the bond \"transcends the borders and disputes that too often divide countries\".\nKhan, who previously captained the Pakistan national cricket team, served as Pakistan's prime minister from 2018 to 2022.\nHe was imprisoned in August 2023 and has faced charges in more than 100 cases, ranging from leaking state secrets to selling state gifts, all of which he and his party Pakistan Tehreek-e-Insaf say are politically motivated.\nHis jailing sparked large-scale protests by supporters, which were met with a crackdown by authorities.\nPakistan's Supreme Court had on Tuesday directed the government to transfer Khan to a private hospital to be examined by physicians.\nHe was instead seen by doctors at a government-run hospital in Islamabad, who deemed him \"medically fit\", before he was moved back to prison.",
    "bodyJa": "元クリケットキャプテンらがイムラン・カーンに「適切な医療」を要請\n- 公開されました\nインドの伝説的打者スニル・ガバスカール氏やイングランドで最も長くキャプテンを務めたサー・アラステア・クック氏を含む元クリケット主将らのグループは、パキスタンに対し、元首相イムラン・カーン氏の拘留中に適切なケアが確実に受けられるよう求めた。\nクリケット選手から政治家に転身した同氏は、2023年から汚職容疑で投獄されているが、本人は否認している。\nパキスタンの現指導者シェバズ・シャリフ氏に宛てた書簡の中で、元船長21人は、73歳のカーン氏が先週、国が任命したチームによる検査を受ける病院で「数時間しか」入院を許されていないことに懸念を表明した。\nカーン氏の党はまた、最高裁判所の命令に従い、カーン氏に自身の医師へのアクセスを与えなかったとして政府に対する侮辱罪の申し立てを行った。\nクリケットの元キャプテンらは書簡の中で3つの要求を列挙しており、その1つ目は、特に報告されている右目の視力喪失に関して、パキスタン最高裁判所が指揮する医療委員会（主治医も含まれる）によるカーンの評価を受けることだ。\nまた当局に対し、裁判所の命令に従ってカーン氏の家族による毎週の面会を「中断や管理上の遅延なく」許可するよう求めた。\n最後に、医療委員会が推奨する治療は「遅滞なく提供される」よう求めた。\n元オーストラリア代表キャプテンのグレッグ・チャペルが書き始めた書簡には、「イムラン・カーンは73歳で、現在3年以上拘留されている」と書かれている。\n「彼の事件をめぐる法的・政治的議論が何であれ、裁判所命令による医療プロセスが実際に完了することを保証するという基本的な良識は、物議を醸すような要求ではないと我々は考えている。」\n他の署名者には、イングランドのマイケル・アサートン、マイケル・ブレアリー、ナセル・フセイン、アンドリュー・ストラウス、デビッド・ガワー、インドのカピル・デヴとディリップ・ヴェングサーカー、オーストラリアのベリンダ・クラーク、アダム・ギルクリスト、スティーブ・ウォー、キム・ヒューズが含まれていた。\n元船長のうち14人も、2月に提出されたカーンに対する「人道的な扱いと適切な医療」を求める訴えを支持していた。\nカーンさんの弁護士は当時、刑務所当局が措置を取らなかったため、依頼人の右目には15％の視力が残っていると主張した。\n両書簡の署名者らは自らを「クリケット競技場で築いた絆を分かち合う元同僚でありライバル」と称し、その絆は「しばしば国を分断する国境や紛争を超える」と付け加えた。\nカーン氏は以前クリケットパキスタン代表チームのキャプテンを務め、2018年から2022年までパキスタン首相を務めた。\n同氏は2023年8月に投獄され、国家機密の漏洩から国家贈答品の販売に至るまで100件以上の罪に問われているが、同氏と彼の政党であるパキスタン・テフリク・エ・インサフ氏はいずれも政治的動機によるものだと主張している。\n彼の投獄は支持者らによる大規模な抗議行動を引き起こし、当局による弾圧に遭った。\nパキスタン最高裁判所は火曜日、医師の診察を受けるためにカーン氏を私立病院に移送するよう政府に指示した。\n代わりに、彼は刑務所に戻される前に、イスラマバードの政府運営の病院の医師らの診察を受け、医師らは彼が「医学的に健康である」と判断した。",

    "summaryJa": "中国のハイテク大手が米国以外の投資家向けに新規発行株式を800億香港ドル（102億ドル）で売り出す価格を設定したことを受け、月曜日の香港市場でアリババ株は最大10％下落した。同社は、純利益のすべてを、AIインフラストラクチャの拡張と強化を含むフルスタックAI機能への投資に使用する予定であると述べた。",
    "bodyOriginal": "Alibaba shares plunged as much as 10% in Hong Kong on Monday after the Chinese tech giant priced an 80 billion Hong Kong dollar ($10.20 billion) placement of newly issued shares to non-U.S. investors.\nThe company said it plans to use all of the net proceeds to invest in its full-stack AI capabilities, including expanding and enhancing its AI infrastructure.\nAlibaba will issue 710 million new shares at HK$112.70 apiece, compared with the stock's Friday closing price of HK$123. Shares were last trading 8.4% lower at HK$112.7.\nThe share placement, expected to close on Wednesday, comes just days after Alibaba reported a 75% drop in profit for the June-quarter as heavy AI spending weighed on its results. Capital expenditure jumped 75% to 67.7 billion yuan.\nVey-Sern Ling, senior equity advisor at UBP, told CNBC last week following Alibaba's latest earnings that the company was well-positioned to pursue AI growth.\n\"I think Alibaba clearly is well positioned to chase that growth, given that they have a cloud computing arm, they have a very strong AI model,\" he said, adding that profits might weaken in the near term, while capex might rise.\nAlibaba has been ramping up investment in AI as it seeks to make the technology a key driver of future growth.The company last year announced plans to invest at least 380 billion yuan in cloud computing and AI infrastructure over the next three years.\nAlibaba's Chinese tech peers have also been ramping up AI spending. Tencent's capital expenditure rose 65% from the previous quarter to 52.8 billion yuan in the June-quarter as the company continued to invest in computing infrastructure to monetize its AI models.",
    "bodyJa": "中国のハイテク大手が米国以外の投資家向けに新規発行株式を800億香港ドル（102億ドル）で売り出す価格を設定したことを受け、月曜日の香港市場でアリババ株は最大10％下落した。\n同社は、純利益のすべてを、AIインフラストラクチャの拡張と強化を含むフルスタックAI機能への投資に使用する予定であると述べた。\nアリババは、金曜終値123香港ドルに対し、1株当たり112.70香港ドルで7億1000万株の新株を発行する。株価は直近の取引で8.4％安の112.7香港ドルで取引された。\nこの株式募集は水曜日に完了すると予想されており、アリババが多額のAI投資が業績を圧迫したため、6月四半期の利益が75％減少したと報告した数日後に行われた。設備投資は75％増の677億元となった。\nUBPの上級株式アドバイザー、ベイサーン・リン氏は先週、アリババの最新決算を受けてCNBCに対し、アリババはAIの成長を追求する上で有利な立場にあると語った。\n「アリババはクラウドコンピューティング部門を持ち、非常に強力なAIモデルを持っていることを考えると、明らかにその成長を追いかけるのに有利な立場にあると思う」と同氏は述べ、利益は短期的には弱まる一方、設備投資は増加する可能性があると付け加えた。\nアリババはAI技術を将来の成長の主要な原動力にすべく、AIへの投資を強化しており、同社は昨年、今後3年間でクラウドコンピューティングとAIインフラに少なくとも3800億元を投資する計画を発表した。\nアリババの中国テクノロジー関連企業もAIへの支出を増やしている。同社がAIモデルを収益化するためにコンピューティングインフラストラクチャへの投資を継続したため、テンセントの6月四半期の設備投資は前四半期比65％増の528億元となった。",

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
