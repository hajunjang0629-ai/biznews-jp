  {
    "id": "trump-threatens-to-stop-sale-of-canadian-4560c27b",
    "title": "Trump threatens to stop sale of Canadian Bombardier jets in US",
    "titleJa": "トランプ大統領、カナダ製ボンバルディア機の米国での販売を停止すると脅迫",
    "summaryJa": "トランプ大統領、カナダ製ボンバルディア機の米国での販売を停止すると脅迫- 公開されました",
    "bodyOriginal": "Trump threatens to stop sale of Canadian Bombardier jets in US\n- Published\nPresident Donald Trump has warned Canadian aircraft company Bombardier that it can no longer sell in the US unless it moves its manufacturing there.\n\"NO MORE SELLING BOMBARDIER IN THE UNITED STATES!\" Trump wrote in a Truth Social post on Monday. \"If they want our Market, they must build here, and stop treating America like a 'piggybank'.\"\nThe move comes amid an escalating trade war between the two neighbours, and hours before Canadian retaliatory tariffs are set to be imposed on $20bn (£14.7bn) worth of US goods.\nIn a statement, Bombardier underscored that it employed thousands of American workers and said it valued its partnerships with American companies.\nThe BBC has reached out to Prime Minister Mark Carney's office for comment.\nIt is unclear how Trump intends to block Bombardier from doing business in the US.\nThe Montreal-based company already operates a factory in the US state of Kansas that builds special mission military planes, and employs 3,500 American workers.\nIt also operates sites in Texas, Arizona, Florida, Connecticut, Illinois, Delaware, California, DC and New Jersey.\nAbout half of its fleet – 5,100 aircraft – is operated by Bombardier customers based in the US.\nIn a statement on Monday, Bombardier did not address Trump's threat directly, but said its operations \"create tens of thousands of US jobs through the company's growing American footprint\".\n\"Bombardier values its great partnership with American companies and its US employees,\" its statement said. \"Our plan is to continue to invest in our people, our customers and the communities in which we operate across the country.\"\nBombardier's jets are built at facilities in Canada, the US and Mexico, according to the company's website. They also comply with the North American free trade agreement signed by Trump during his first term, known as CUSMA in Canada and the USMCA in the US.\nThe company is one of Canada's largest, having contributed C$7.4bn ($5.4bn; £4bn) to the country's GDP in 2024, according to a report commissioned by Bombardier.\nIt is also one of the largest employers in Quebec's manufacturing sector.\nIn a post on X on Monday, Quebec premier Christine Fréchette called the company \"a source of pride\" for her province and \"a flagship of our economy\".\nShe added that she has reached out to Bombardier CEO Éric Martel and offered her government's full support.\nOn Trump's threat, Fréchette wrote: \"I will not respond to provocation with provocation.\"\n\"Quebec will not allow anyone to dictate where our companies must produce in order to access a market.\"\nTrade talks between Canada and the US collapsed late last month after Canada walked away from the negotiating table, after which the US imposed new 50% tariffs on a range of Canadian goods.\nPrime Minister Carney accused the Trump administration of presenting last-minute terms that were \"unfair\" and \"uneconomic\", while US officials accused him of refusing to sign a deal for political reasons because of Trump's unpopularity in Canada - an accusation he denied.\nRelated topics\n- Published31 August\n- Published22 August",
    "bodyJa": "トランプ大統領、カナダ製ボンバルディア機の米国での販売を停止すると脅迫\n- 公開されました\nドナルド・トランプ大統領はカナダの航空機会社ボンバルディアに対し、製造拠点を米国に移転しない限り米国での販売は不可能だと警告した。\n「米国ではボンバルディアはもう売れない！」トランプ氏は月曜日のトゥルース・ソーシャルへの投稿でこう書いた。 「もし彼らが私たちの市場を望むなら、ここに建設し、アメリカを『貯金箱』のように扱うのをやめなければなりません。」\nこの動きは隣国両国間の貿易戦争が激化するさなか、カナダが200億ドル（147億ポンド）相当の米国製品に報復関税を課す予定の数時間前に行われた。\nボンバルディアは声明で、数千人の米国人労働者を雇用していることを強調し、米国企業とのパートナーシップを重視していると述べた。\nBBCはマーク・カーニー首相の事務所にコメントを求めた。\nトランプ大統領がボンバルディアの米国での事業をどのように阻止するつもりなのかは不明だ。\nモントリオールに本拠を置く同社はすでに米国カンザス州で特殊任務の軍用機を製造する工場を運営しており、3,500人の米国人労働者を雇用している。\nまた、テキサス、アリゾナ、フロリダ、コネチカット、イリノイ、デラウェア、カリフォルニア、ワシントン DC、ニュージャージーでも拠点を運営しています。\n保有機材の約半分である 5,100 機は、米国に拠点を置くボンバルディアの顧客によって運航されています。\nボンバルディアは月曜日の声明で、トランプ大統領の脅威には直接言及しなかったが、同社の事業が「米国での拠点拡大を通じて米国で数万人の雇用を創出している」と述べた。\nボンバルディアは声明で「当社は米国企業および米国従業員との素晴らしいパートナーシップを重視している」と述べた。 「私たちの計画は、従業員、顧客、そして全国で事業を展開しているコミュニティへの投資を継続することです。」\n同社のウェブサイトによると、ボンバルディアのジェット機はカナダ、米国、メキシコの施設で製造されている。また、カナダではCUSMA、米国ではUSMCAとして知られる、トランプ氏が1期目に署名した北米自由貿易協定も遵守している。\nボンバルディア社の委託による報告書によると、同社はカナダ最大手の一つで、2024年のカナダ国内総​​生産（GDP）に74億カナダドル（54億ドル、40億ポンド）を貢献した。\nケベック州の製造業における最大の雇用主の一つでもあります。\nケベック州のクリスティーヌ・フレシェット首相は月曜日のXへの投稿で、同社を州の「誇りの源」であり「経済の旗艦」と呼んだ。\n彼女はボンバルディア社のエリック・マルテル最高経営責任者（CEO）に連絡を取り、政府の全面的な支援を申し出たと付け加えた。\nトランプ大統領の脅迫について、フレシェット氏は「挑発には挑発で応じない」と書いた。\n「ケベック州は、市場にアクセスするために私たちの企業がどこで生産しなければならないかを誰にも指示することを許しません。」\nカナダと米国の間の通商交渉は先月末、カナダが交渉のテーブルから離れたことで決裂し、その後米国はカナダの幅広い製品に新たに50％の関税を課した。\nカーニー首相は、トランプ政権が土壇場で「不公平」で「非経済的」な条件を提示したと非難し、一方米当局者らはカナダでのトランプ大統領の不人気を理由に政治的理由で合意を拒否したと非難したが、カーニー首相はその非難を否定した。\n関連トピック\n- 8 月 31 日公開\n- 8 月 22 日発行",

    "id": "i-performed-on-stage-to-get-my-first-jo-cade6e0c",
    "title": "'I performed on stage to get my first job' - the firms turning recruitment into competitions",
    "titleJa": "「最初の仕事を得るためにステージでパフォーマンスした」―採用活動をコンテストに変える企業",
    "summaryJa": "「最初の仕事を得るためにステージでパフォーマンスした」―採用活動をコンテストに変える企業- 公開されました",
    "bodyOriginal": "'I performed on stage to get my first job' - the firms turning recruitment into competitions\n- Published\nYumi Liberman was up on stage in front of a panel of judges and an audience of 300 people, and she had to perform.\nBut rather than singing, dancing or playing a musical instrument, she and two friends were in an auditorium in London in 2024 to pitch their business idea, hoping to secure a full-time job with cosmetics giant L'Oreal.\n\"It reminded me of when I used to do competitive sports growing up and the pressure would get heavy,\" says Liberman, now 24. \"But somehow you just get into flow mode.\"\nShe and her friends had got through to the UK final of Brandstorm, an international competition run by the French company, where young adults outline their product and business ideas.\nTheir proposal for a haircare app saw them crowned UK winners and they went on to that year's global final in Paris where they came third.\nWhile only members of the team that finished first automatically got full-time jobs, Liberman had so impressed senior figures at the company that she managed to secure a place on its marketing management traineeship, with a full-time position at the end.\nTurning recruitment into X Factor-style competitions, with jobs as the prize, generates publicity and buzz for companies. But for the young people involved, is it exciting - or unfair?\nIn the current global economic environment, youth unemployment is higher than the national average in many countries, as companies are reluctant to take on new staff. In the UK the unemployment rate for young adults is 16.2%,, external compared to the overall level of 4.9%., external\nCompetitions like L'Oreal's can offer hope. But the vast majority of the 380,000 people around the world who applied for it this year, up 58% from 240,000 in 2025, didn't win anything.\nL'Oreal told the BBC that its Brandstorm competition works well because it helps the company attract a wider range of potential new recruits, including young people who wouldn't necessarily have thought of applying for a job at the firm.\nYet while Liberman says she enjoyed the formal competition structure, others who have been through similar recruitment competitions are critical.\n'Intimidating'\nMelissa Alcruz now works in marketing for a US real estate business based in New York City, but in the past she did the same job for TV channel MTV.\nWhile at MTV she competed in an internal competition for a promotion that she says was referred to as a \"bake-off\". Candidates had to come up with sponsorship and marketing campaigns, and then pitch to a room of seven people.\n\"This is intimidating, even for a seasoned professional. I ultimately got the job, but even though I won I disliked the process,\" says Alcruz.\nShe points out that she already had a demanding full-time role at the company, and was then \"expected to complete several substantial projects\" for the competition in her spare time.\nMTV's current parent company, Paramount Skydance Corporation, has been asked for a comment.\nFormer recruitment consultant Katrina Collier, now an author, speaker and recruiter trainer, is concerned that competition-based recruitment processes that potentially require candidates to give up lots of their time for free can create \"economic discrimination\".\n\"Not everyone can take time, possibly months, to participate in the challenges for the chance to secure one of a limited number of roles,\" she says. \"Does that mean only people from financially strong backgrounds proceed?\n\"Is that leaving talented applicants who don't have the bank of mum or dad, for example, unable to take part?\"\nJamie Kohn, senior director for talent acquisition at research firm Gartner, reasons that competition-based hiring formats are here to stay because employers find it easier to evaluate candidates than via the traditional interview method.\nBut she agrees that organisations need to be cautious about how much they ask of the jobseekers. \"And they should focus on providing feedback… so candidates build their capabilities even if they are not selected.\"\nFor psychologist Amanda Potter, her concern is that recruiting via competition events tend to favour extroverts, and therefore put quieter personality types at a disadvantage.\n\"Does this approach encourage all types of people to apply, or would certain types of people avoid these assessment methods?\" she says. \"This could result in an organisation [ending up] full of ambitious, competitive people who want to win, possibly to the detriment of others.\"\nHowever, Liberman, who lives with severe dyslexia, argues that going through a typical recruitment process and related assessments would have been more challenging for her.\nIt has also meant that she managed to avoid any time spent unemployed after finishing university. Instead, she has gone straight into her chosen field, something she can't say about all of her peers.\n\"I have a lot of friends coming from extremely reputable backgrounds, extremely educated people who have applied to over 1,000 jobs, and have been jobless.\"\n- Published20 July\n- Published30 June\n- Published28 May",
    "bodyJa": "「最初の仕事を得るためにステージでパフォーマンスした」―採用活動をコンテストに変える企業\n- 公開されました\nユミ・リバーマンは審査員団と300人の聴衆の前でステージに上がり、パフォーマンスをしなければなりませんでした。\nしかし、歌ったり、踊ったり、楽器を演奏したりするのではなく、化粧品大手ロレアルでのフルタイムの仕事を確保したいと考え、彼女と2人の友人は2024年にロンドンの講堂でビジネスアイデアを売り込んでいた。\n現在24歳のリバーマンは、「幼い頃、競技スポーツをやっていたときのことを思い出した。プレッシャーが重くなった。でも、どういうわけかフローモードに入ってしまうんだ」と語る。\n彼女と友人たちは、フランスの会社が運営する国際コンペティション、ブランドストームの英国決勝戦に勝ち残っていた。若者たちが製品やビジネスのアイデアを概説する場だ。\n彼らのヘアケア アプリの提案により英国の優勝者となり、その年のパリでの世界決勝に進み、3 位になりました。\n最初に終了したチームのメンバーだけが自動的にフルタイムの仕事を得ることができましたが、リバーマンは会社の上層部に非常に感銘を与えたので、最終的にはフルタイムのポジションを獲得して、マーケティング管理研修の枠を確保することができました。\n採用活動を X ファクター スタイルのコンテストに変えることで、仕事が賞品となり、企業の知名度と話題が生まれます。しかし、関係する若者にとって、それは刺激的なことでしょうか、それとも不公平でしょうか?\n現在の世界経済環境では、企業が新規人材の採用に消極的であるため、多くの国で若者の失業率が全国平均よりも高くなっています。英国では、若年成人の失業率が 16.2% であるのに対し、全体の失業率は 4.9% です。\nロレアルのような競争は希望をもたらす可能性がある。しかし、今年応募した世界中の38万人（2025年の24万人から58％増）の大多数は何も当選しなかった。\nロレアルはBBCに対し、自社のブランドストーム競争がうまく機能しているのは、同社への就職を必ずしも考えていなかった若者も含め、より広範囲の潜在的な新入社員を引き付けるのに役立つからだと語った。\nしかし、リバーマン氏は正式な競争構造を楽しんでいたと語る一方で、同様の採用競争を経験した他の人たちは批判的だ。\n「威圧的」\nメリッサ・アルクルーズさんは現在、ニューヨーク市を拠点とする米国の不動産会社でマーケティングの仕事をしていますが、以前はテレビ チャンネル MTV で同じ仕事をしていました。\nMTV在職中、彼女は昇進を賭けた社内コンテストに参加したが、それは「ベイクオフ」と呼ばれていたという。候補者はスポンサーシップとマーケティング キャンペーンを考え出し、7 人の部屋に売り込みを行う必要がありました。\n「これは、経験豊富な専門家にとってさえ、恐ろしいことです。私は最終的にその仕事に就きましたが、たとえ勝ち取ったとしても、そのプロセスが嫌いでした」とアルクルス氏は言います。\n彼女は、すでに会社で厳しいフルタイムの仕事をしていて、空いた時間でコンテストに向けて「いくつかの重要なプロジェクトを完了することが期待されていた」と指摘しました。\nMTVの現在の親会社であるパラマウント・スカイダンス・コーポレーションはコメントを求められている。\n元人材コンサルタントのカトリーナ・コリアー氏は、現在は作家、講演者、リクルータートレーナーとして活動しているが、候補者が多くの時間を無償で犠牲にすることを潜在的に要求する競争ベースの採用プロセスが「経済的差別」を生み出す可能性があると懸念している。\n「限られた数の役割のうちの 1 つを獲得するチャンスを得るために、誰もが時間、場合によっては数か月をかけてチャレンジに参加できるわけではありません」と彼女は言います。 「ということは、経済的に余裕のある人だけが進むということですか？\n「このことは、例えば母親や父親の銀行を持っていない才能ある応募者が参加できないということになるのでしょうか？」\n調査会社ガートナーの人材獲得担当シニアディレクター、ジェイミー・コーン氏は、雇用主が従来の面接方法よりも候補者を評価しやすいため、競争ベースの採用形式が今後も存続すると理由を説明する。\nしかし、組織は求職者にどれだけの金額を求めるかについて慎重になる必要があるという点には彼女も同意する。 「そして、フィードバックを提供することに重点を置くべきです…そうすれば、たとえ選ばれなかったとしても、候補者は自分の能力を高めることができます。」\n心理学者のアマンダ・ポッターさんの懸念は、競争イベントを通じた採用では外向的な人が好まれる傾向があり、そのため物静かな性格タイプが不利になることだ。\n「このアプローチはあらゆるタイプの人が応募することを奨励するのでしょうか、それとも特定のタイプの人がこれらの評価方法を避けることになるのでしょうか?」彼女は言います。 「その結果、組織は勝利を求める野心的で競争心旺盛な人々で溢れかえり、おそらく他の人々に不利益をもたらす可能性があります。」\nしかし、重度の失読症を抱えているリバーマンさんは、典型的な採用プロセスや関連する評価を経験することは彼女にとってより困難だっただろうと主張する。\nそれはまた、彼女が大学卒業後に失業して過ごす時間を避けることができたことを意味します。その代わりに、彼女は自分の選んだ分野に真っ直ぐに取り組んできたが、これは他の同僚には言えないことだ。\n「私には、非常に評判の高い経歴を持ち、非常に教育を受け、1,000件以上の仕事に応募してきたにもかかわらず、職を失った友人がたくさんいます。」\n- 7 月 20 日発行\n- 6 月 30 日発行\n- 5 月 28 日発行",

    "id": "ai-cancer-cures-slowed-by-chip-shortage-217198a7",
    "title": "AI cancer cures slowed by chip shortage, says UK's biggest tech boss",
    "titleJa": "AIがんの治療はチップ不足で遅れている、英国最大のテクノロジー企業トップが語る",
    "summaryJa": "チップ設計者のアーム氏は、DNAマーカーががんによってどのような影響を受けるかをモデル化することは現時点では不可能だが、コンピューターが「解決するだろう」と述べた。",
    "bodyOriginal": "AI cancer cures slowed by chip shortage, says UK's biggest tech boss\n- Published\nThe boss of the biggest UK-headquartered tech firm has said that artifical intelligence will find a cure for cancer that humans cannot in our lifetimes.\nRene Haas, chief executive of Cambridge-based chip designer Arm Holdings, said while modelling how a DNA marker is impacted by cancer was currently \"too complex\" a problem, computers are \"going to solve it\" in the future.\nHaas also told the BBC that AI would lead to widespread humanoid robots in the next five years, but that its current rapid growth was being held up by a shortage of chips needed to build data centres.\nHowever, he was sceptical about the idea chips could be manufactured in the UK in the future.\nArm designs the brains or CPUs of microchips already used in hundreds of billions of phones, cars, smartwatches and gadgets across the globe.\nEarlier this summer, the company's peak share price amid the AI boom made it, in cash terms, the most valuable UK-based company in history.\nHaas, who stepped down from the board of British pharmaceutical giant AstraZeneca in April, told the BBC's Big Boss Interview podcast: \"AI is going to... find a cure for cancer that today you and I, other humans [could] not in our lifetimes. I believe in our lifetime, AI will help cure cancer.\n\"Modelling a cell, modelling a human, modelling how a DNA marker is impacted by cancer - it's too complex a problem, not only for humans today, but the computers that run AI.\n\"However, going forward, as we feed more and more of the models into these computers, and the computers get more sophisticated to run the models, they're going to solve it,\" said Haas, who also holds a key role in Arm's main owner, the Japan-based Softbank, which has a range of investments in tech including in OpenAI.\nProf Chris Bakal, from the Institute of Cancer Research, London, and CEO of Sentinal4D, said the real question was no longer whether we use AI, it's what we feed it.\nHe said in labs like his, they are training AI on data generated themselves from patient samples.\n\"It is not scraped from the internet. It does not need a giant data centre to run. The future of medical AI will not belong to whoever builds the biggest computer. It will belong to whoever has the right measurements.\n\"That kind of prediction could cut years from the time it takes to develop new treatments. This is where AI delivers real benefit to patients.\"\nJob losses 'overstated'\nIn a wide-ranging interview, Haas said the chips Arm designs would fuel self-learning AI robots \"in a very large way\" in manufacturing, cleaning, security, building bridges, and doing repairs within a decade.\n\"With artificial intelligence, these robots can see, learn, and essentially be reprogrammed for new tasks. So, in the service industry, the robot that was programmed to make a bed can also learn how to arrange the towels in a room, or clean the dustbins, or whatever you want to go off and do.\"\nAddressing concerns that AI would lead to mass job losses, Haas said while there would be some change for workers, \"the estimates of jobs going away and being completely replaced by machines is a bit overstated\" and outweighed by new opportunities.\nHe also said fears over a correction in the remarkable rise in the stock market value of AI companies were overstated, because of the long-term demand for AI.\nArm's power-efficient technology was now being used in half of AI data centres worldwide, he said.\nThis has led to a significant evolution in its business in recent months, selling its own microchips. Facebook-owner Meta asked Arm to develop the Arm AGI chip and \"demand has been off the charts\", according to Haas, with more than $2bn worth of demand since it was launched in March.\nBig Boss Interview: Arm Holdings Rene Haas\nThe CEO of chip design company Arm tells the BBC AI will help cure cancer, lead to widespread humanoid robots in the next five years, but says its rapid growth is being held up by a shortage of chips needed in data centres.\nThere have, however, been challenges in the supply of many types of chips, which Haas believes is holding back the roll-out of AI and data centres.\nHe pointed to plans for massive \"multi-gigawatt\" data centres in France and the US as well as plans to put them in space.\n\"We are absolutely in a supply-constrained environment. Can you get enough chips? We need more fabs [chip factories] before we can put a data centre in space.\"\nBut he does not believe that manufacturing, currently centralised around Taiwanese giant TSMC, could eventually occur in the UK, despite the government holding talks with the industry about the possibility of bringing parts of the physical chip supply chain over here.\n\"I don't think it's necessary for the UK to [build] fabs. Fabs are very expensive. They take a lot of specialised workers. They take a lot of natural resources, and there's a pretty broad ecosystem for those.\"\nAs the great hope of UK tech for decades, some government ministers have lamented Arm's sale to Japanese investors in 2016 and subsequent partial flotation on New York's Nasdaq rather than in London.\nBut Haas maintained that half of Arm's employees remain in the UK and said the company was \"by far and away the largest employer in Cambridge\".\n- Published15 hours ago\n- Published27 August\n- Published28 January",
    "bodyJa": "AIがんの治療はチップ不足で遅れている、英国最大のテクノロジー企業トップが語る\n- 公開されました\n英国に本社を置く最大手のテクノロジー企業の社長は、人工知能は人間が一生かかっても不可能なガンの治療法を見つけるだろうと語った。\nケンブリッジに本拠を置くチップ設計会社アーム・ホールディングスのレネ・ハース最高経営責任者（CEO）は、DNAマーカーががんによってどのような影響を受けるかをモデル化することは現時点では「複雑すぎる」問題だが、将来的にはコンピューターがそれを「解決するだろう」と述べた。\nハース氏はまたBBCに対し、AIは今後5年間で人型ロボットの普及につながるだろうが、現在の急速な成長はデータセンターの建設に必要なチップの不足によって妨げられていると語った。\nしかし、同氏はアイデアチップが将来的に英国で製造される可能性については懐疑的だった。\nArm は、世界中の何千億もの電話、自動車、スマートウォッチ、ガジェットですでに使用されているマイクロチップの頭脳または CPU を設計しています。\nこの夏の初め、AIブームのさなか同社の株価は最高値を記録し、現金ベースで同社は史上最も価値のある英国に本拠を置く企業となった。\n4月に英国の製薬大手アストラゼネカの取締役を辞任したハース氏は、BBCのビッグ・ボス・インタビュー・ポッドキャストで、「AIは…今日、あなたや私、他の人間が生きている間には[できなかった]癌の治療法を見つけるだろう。私は、私たちが生きているうちに、AIが癌の治療に役立つと信じている」と語った。\n「細胞のモデル化、人間のモデル化、DNA マーカーががんによってどのような影響を受けるかをモデル化することは、今日の人間だけでなく、AI を実行するコンピューターにとっても複雑すぎる問題です。\n「しかし、今後、これらのコンピュータにますます多くのモデルを入力し、モデルを実行するコンピュータがより洗練されるにつれて、問題は解決されるでしょう」とハース氏は語った。ハース氏はArmの主要所有者である日本に本拠を置くソフトバンクでも重要な役割を担っており、ソフトバンクはOpenAIを含むテクノロジー分野に幅広い投資を行っている。\nロンドンのがん研究所のクリス・バカル教授でSentinal4Dの最高経営責任者（CEO）は、本当の問題はもはやAIを使うかどうかではなく、AIに何を与えるかだ、と語った。\n同氏のような研究室では、患者のサンプルから自ら生成したデータに基づいてAIをトレーニングしていると述べた。\n「インターネットから収集したものではありません。実行するために巨大なデータセンターは必要ありません。医療 AI の未来は、最大のコンピューターを構築した者のものではありません。適切な測定値を持った者のものになります。」\n「そのような予測ができれば、新しい治療法の開発にかかる時間が何年も短縮される可能性があります。 AI が患者に真の利益をもたらすのはここです。」\n雇用喪失は「誇張されている」\nハース氏は広範なインタビューで、Armが設計したチップは10年以内に製造、清掃、警備、橋の建設、修理などにおいて「非常に大きな方法で」自己学習AIロボットを促進するだろうと語った。\n「人工知能を使用すると、これらのロボットは見て、学習し、基本的に新しいタスクのために再プログラムすることができます。つまり、サービス産業では、ベッドメイクをするようにプログラムされたロボットが、部屋のタオルの並べ方やゴミ箱の掃除など、やりたいことを何でも学ぶことができるのです。」\nAIが大量の雇用喪失につながるのではないかとの懸念に対し、ハース氏は労働者に何らかの変化はあるものの、「仕事がなくなり、完全に機械に置き換わるという見積もりは少し誇張されている」とし、新たな機会の方が重要だと述べた。\n同氏はまた、AIへの長期的な需要を理由に、AI企業の株価の目覚ましい上昇の調整に対する懸念は誇張されていると述べた。\n同氏によると、Armの電力効率の高いテクノロジーは現在、世界中のAIデータセンターの半数で使用されているという。\nこれにより、ここ数カ月で自社のマイクロチップを販売するなど、ビジネスが大幅に進化した。 Facebookオーナーのメタ社はArm AGIチップの開発をArmに依頼したが、ハース氏によると「需要は桁違い」で、3月の発売以来20億ドル以上の需要があるという。\nビッグボス インタビュー: Arm Holdings Rene Haas\nチップ設計会社アームの最高経営責任者（CEO）はBBCに対し、AIはがんの治療に役立ち、今後5年間で人型ロボットの普及につながると語ったが、その急速な成長はデータセンターで必要なチップの不足によって妨げられていると述べた。\nしかし、多くの種類のチップの供給には課題があり、それがAIやデータセンターの展開を妨げているとハース氏は考えている。\n同氏は、フランスと米国における大規模な「マルチギガワット」データセンターの計画と、それらを宇宙に設置する計画を指摘した。\n「私たちは供給が完全に制約された環境にいます。十分なチップを獲得できますか？宇宙にデータセンターを設置する前に、より多くのファブ（チップ工場）が必要です。」\nしかし同氏は、政府が物理的なチップのサプライチェーンの一部を英国に持ち込む可能性について業界と協議しているにもかかわらず、現在台湾の大手TSMCを中心に集中している製造業が最終的に英国で行われる可能性があるとは考えていない。\n「英国が工場を建設する必要はないと思います。工場は非常に高価です。工場には多くの専門労働者が必要です。多くの天然資源が必要であり、それらにはかなり広範なエコシステムがあります。」\n何十年にもわたって英国テクノロジー界の大きな希望であったため、一部の政府閣僚はアームが2016年に日本の投資家に売却され、その後ロンドンではなくニューヨークのナスダックに部分的に上場されたことを嘆いていた。\nしかしハース氏は、アームの従業員の半数は英国に残っていると主張し、同社は「ケンブリッジで断然最大の雇用主」であると述べた。\n- 15 時間前に公開\n- 8 月 27 日発行\n- 1 月 28 日発行",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
