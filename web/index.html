    "title": "Ship attacked in Hormuz Strait as U.S.-Iran ceasefire expiry risks prolonged conflict",
    "titleJa": "米国とイランの停戦期限切れで紛争長期化の恐れ、ホルムズ海峡で船舶攻撃",
    "summaryJa": "英国海運貿易局は火曜日、ホルムズ海峡を航行中に貨物船に飛翔体が衝突したと発表し、米国とイランが立場を強化する中、同水路での航行リスクが継続していることを示唆した。この攻撃により機関室が損傷し、乗組員が負傷したと海事機関は発表し、残りの乗組員はオマーン沿岸警備隊の支援を受けていると付け加えた。",
    "bodyOriginal": "A cargo vessel was struck by a projectile while transiting the Strait of Hormuz, the U.K. Maritime Trade Operations agency said Tuesday, signaling persisting navigation risks in the waterway as Washington and Tehran harden their positions.\nThe attack caused damage to the engine room and resulted in a crew casualty, the maritime agency said, adding that the remaining crew were being assisted by the Omani Coast Guard.\nThe incident came after an Iranian military official repeated threats that the Islamic state won't back down over the Strait of Hormuz. Fox News reported Tuesday that Ebrahim Zolfaghari, Iranian military spokesperson, said vessels attempting passage through the strait will \"find several beautiful holes in their hulls.\"\nWashington and Tehran have rejected further talks after the 60-day negotiating ceasefire deal, reached in mid-June aimed at opening space for diplomatic engagement, expired on Monday without a formal follow-on agreement.\n\"Both sides will dig in for a longer standoff,\" a team of analysts at Eurasia Group said in a note Monday, as neither side sees an urgent need to make concessions.\nEarlier on Monday, U.S. President Donald Trump ruled out extending the ceasefire, saying that Tehran won't accept the terms he considers necessary to end their war. \"They're not going to make the kind of deal that I feel is necessary,\" Trump said in the Oval Office.\nIran's hardline leadership, for its part, has no intention of winding down the conflict, but instead widening the war to raise the costs for the U.S. and its regional allies, Wall Street Journal reported on Sunday, citing intelligence obtained from unnamed Iranian and Arab officials.\nEurasia Group no longer expects a peace deal by September, pushing back its timeline for de-escalation to year-end as the standoff drags on. The most likely outcome is \"a limited deal\" that allows Hormuz traffic to partially recover, the risk consultancy said, adding that pressure on Washington to push for an imminent reopening of the strait has eased.\nSuccess in routing oil around the Strait of Hormuz has kept prices from spiking past $100 a barrel, while the global economy has adapted to the closure, giving the U.S. room to \"afford to wait,\" Eurasia Group said.\nThe Strait of Hormuz, which handled about a fifth of the world's crude oil and gas before the war, has become the central flashpoint between the U.S. and Iran since February. Shipping remains near a standstill amid sporadic attacks on oil tankers. Just three vessels transited the Strait of Hormuz on Sunday, according to shiptracking data from Kpler.\nThe Bab el-Mandeb strait, where Yemen Houthis declared a naval blockade on Saudi Arabia in mid-July, also saw just 49 weekend transits by commodity vessels, according to Reuters, down from 55 in the prior week.\nIranian Foreign Minister Abbas Araghchi said in a Telegram post on Saturday that Iran's negotiations with Oman remained ongoing to determine a new maritime route in the Strait of Hormuz, while Trump on Monday threatened to bomb Oman if the Gulf state \"gets in the way\" of U.S. efforts to reopen the strait.\n\"Any recovery in Hormuz flows will be partial,\" said analysts at Eurasia, as the U.S. and Iran remain in a state of simmering hostilities, with heightened risks of renewed flare-up that disrupts traffic.\nOil prices climbed after the 60-day window for negotiated settlement closed without a breakthrough. U.S. crude oil futures ticked up 0.25% to $84.7 a barrel on Tuesday, after a 2.6% rise on Monday.\nBrent crude, the international benchmark, was little changed on Tuesday after rising above $90 on Monday, last trading at $90.86 a barrel.",
    "bodyJa": "英国海運貿易局は火曜日、ホルムズ海峡を航行中に貨物船に飛翔体が衝突したと発表し、米国とイランが立場を強化する中、同水路での航行リスクが継続していることを示唆した。\nこの攻撃により機関室が損傷し、乗組員が負傷したと海事機関は発表し、残りの乗組員はオマーン沿岸警備隊の支援を受けていると付け加えた。\nこの事件は、イラン軍当局者がイスラム国がホルムズ海峡を越えて撤退しないと繰り返し脅迫した後に起きた。フォックスニュースは火曜日、イラン軍報道官エブラヒム・ゾルファガリ氏が、海峡を通過しようとする船舶は「船体にいくつかの美しい穴を見つけるだろう」と述べたと報じた。\n外交関与の余地を広げることを目的として6月中旬に合意された60日間の交渉停戦合意が、正式な後続合意がないまま月曜日に期限切れとなったことを受け、米国とイラン政府はさらなる協議を拒否した。\nユーラシア・グループのアナリストチームは月曜のメモで、双方とも譲歩する緊急の必要性を認識していないため、「双方とも長期にわたる膠着状態に向けて粘り込むだろう」と述べた。\n月曜日初め、ドナルド・トランプ米大統領は停戦延長の可能性を否定し、イランは戦争を終わらせるために必要と考える条件を受け入れないと述べた。トランプ大統領は大統領執務室で「彼らは私が必要だと思うような合意を結ぶつもりはない」と語った。\n一方、イランの強硬派指導部には紛争を縮小させるつもりはなく、代わりに米国とその地域同盟国の費用を捻出するために戦争を拡大するつもりだと、ウォール・ストリート・ジャーナルが匿名のイランとアラブ当局者から得た情報を引用して日曜日に報じた。\nユーラシア・グループはもはや9月までの和平合意を期待しておらず、対立が長引く中、緊張緩和のスケジュールは年末に延期される。リスクコンサルタント会社は、最も可能性の高い結果は、ホルムズの交通量の一部回復を可能にする「限定的な合意」であると述べ、差し迫った海峡再開を求める米国への圧力は弱まったと付け加えた。\nユーラシア・グループは、ホルムズ海峡を迂回する原油輸送の成功により、価格が1バレル＝100ドルを超える高騰を抑えている一方、世界経済は閉鎖に適応しており、米国には「待つ余裕」が与えられていると述べた。\nホルムズ海峡は戦前、世界の原油とガスの約５分の１を扱っていたが、２月以降、米国とイランの間の中心的な引火点となっている。石油タンカーに対する散発的な攻撃により、輸送は依然として停止状態に近い。 Kplerの船舶追跡データによると、日曜日にホルムズ海峡を通過した船舶はわずか3隻だった。\nロイター通信によると、イエメンのフーシ派が7月中旬にサウジアラビアに対する海上封鎖を宣言したバブ・エル・マンデブ海峡でも、物資船による週末の通航は49隻にとどまり、前週の55隻から減少した。\nイランのアッバス・アラグチ外務大臣は土曜日の電報で、ホルムズ海峡の新たな海上ルートを決定するためイランとオマーンの交渉は継続中であると述べたが、トランプ大統領は月曜日、湾岸諸国が米国の海峡再開への取り組みを「邪魔する」場合にはオマーンを爆撃すると脅した。\nユーラシアのアナリストらは、米国とイランの対立が依然としてくすぶる状況にあり、交通を混乱させる再燃のリスクが高まる中、「ホルムズ川の流れの回復は部分的なものになるだろう」と述べた。\n60日間の交渉解決期限が打開策なく終了したことを受け、原油価格は上昇した。米国の原油先物相場は月曜日に２．６％上昇した後、火曜日には０．２５％上昇して１バレル＝８４．７ドルとなった。\n国際ベンチマークであるブレント原油は、月曜日に90ドルを超えて上昇した後、火曜日もほとんど変化せず、最終取引価格は1バレル当たり90.86ドルであった。",

    "id": "us-canada-trade-talks-intense-as-new-tar-acc51424",
    "title": "US-Canada trade talks 'intense' as new tariff deadline looms",
    "titleJa": "新たな関税期限が迫る中、米国とカナダの通商交渉は「激化」",
    "summaryJa": "交渉担当者がトランプ大統領の最新の関税を回避するために合意に達しようと躍起になる中、マーク・カーニー首相は米国に対するあらゆる譲歩をカナダ人に売り込む必要があるだろう。",
    "bodyOriginal": "US-Canada trade talks 'intense' as new tariff deadline looms\n- Published\n\"Intense\" trade talks are going down to the wire as Canada seeks to avoid a fresh round of tariffs from the Trump administration due to come into effect in less than 48 hours.\nCanadian negotiators have been camped out in Washington for a week, trying to pin down some agreement before new 50% tariffs on some $20bn (C$28bn) worth of Canadian imports come into effect on Wednesday.\nPrime Minister Mark Carney kept details of the talks close to his chest when pressed by reporters on Monday, saying that given the \"very delicate and intense\" negotiations, it is \"not the time to negotiate in public\".\nWhile he said Canada was negotiating from \"a position of strength\", the stakes are high for the prime minister and his team to reach a deal before the Trump administration's latest financial squeeze, on about 5% of all Canadian imports, takes hold.\nDespite a flurry of meetings between Canadian negotiators and US Trade Representative Jamieson Greer in recent days, the two sides have yet to reach a final agreement.\n\"Our job is not yet done,\" US-Canada Trade Minister Dominic LeBlanc said on Monday as he left Greer's office.\nBoth sides have been clear the talks have been tough. Trump has described Canada as \"nasty\" on trade - a characterisation of negotiations that Carney did not entirely dispute., external\nHe has also warned that \"the time to get tougher\" will be if the countries fail to reach a deal.\nEven if one is reached, Carney will need to sell any concessions made to a public frustrated with - and skeptical of - the administration south of the border.\nHe will also need the buy-in from the provinces on any compromises.\nThe US has been asking for a number of concessions from Canada, including removing its remaining retaliatory tariffs on American autos and adjusting its dairy quotas.\nIt has also asked for the ban on US alcohol sales, imposed early last year by most Canadian provinces in retaliation for Trump's tariffs, be removed.\nThat concession would depend on the agreement of the provinces, which are in control of the alcohol in their respective jurisdictions.\nOntario Premier Doug Ford, who makes a point of being tough on the US, said last week that an agreement on booze is conditional.\nCanada has been in pursuit of a deal that would see the US drop or reduce tariffs on its steel, aluminium, automobile and lumber sectors, all of which have been damaging to the country's economy.\n\"If we get a fair deal that will protect our steel sector, our auto sector, our forestry sector, our agriculture sector, our manufacturing sector, then we'd be happy to bring booze back on the shelves,\" Ford said.\nCarney could also face pushback on any concessions on dairy, especially in Quebec, where the premier, Christine Fréchette, has said supply management is non-negotiable.\nTrump argues the system, which has production quotas, set pricing, and import quotas on dairy, eggs, and poultry, is \"unreasonable\" to American farmers who want to sell their products north of the border.\nCanadians are also not in the mood to offer many concessions to the US, even as they want more stability.\nA new poll from Abacus Data indicates that 74% feel the trade dispute has had an impact on their household, and 36% want to see Canada respond with new counter-tariffs, even if it risks more domestic economic pain.\nJust 18% favour concessions like ending provincial bans on American alcohol, in order to remove or reduce US tariffs.\nReports in Canadian media also suggested that Canada's chief negotiator, Janice Charette, warned her US counterparts, external that the new tariffs could put further trade negotiations at risk if they are enacted on Wednesday.\nCarney has said he would not sign a deal unless it's a good one for Canada, though he has not been clear on what such a deal would look like.\nOn Monday, he only said: \"We'll have opportunities over the next 48 hours to discuss in more detail as the negotiations go forward.\"\nHe said he planned to speak with Trump before the Wednesday deadline.\nHe also said that he has \"plans for any situation that may arise\" should the talks fail.\nConservative trade critic Shuvaloy Majumdar said in a statement that it's time for \"a measure of relief\" from economic anxiety.\n\"We have grown tired of seeing our country used as a punching bag,\" he said.\n\"Yet we share a common hope that Prime Minister Carney will deliver a genuine win at the negotiating table.\"",
    "bodyJa": "新たな関税期限が迫る中、米国とカナダの通商交渉は「激化」\n- 公開されました\nカナダが48時間以内に発効予定のトランプ政権による新たな追加関税を回避しようとする中、「激しい」通商交渉が難航している。\nカナダの交渉担当者らは、約200億ドル（280億カナダドル）相当のカナダからの輸入品に対する新たな50％関税が水曜日に発効する前に、何らかの合意を確定させようと、1週間にわたりワシントンでキャンプを張っている。\nマーク・カーニー首相は月曜日、記者団の取材に対し交渉の詳細は胸に秘め、「非常にデリケートかつ激しい」交渉を考慮すると「公の場で交渉する時期ではない」と述べた。\n同氏は、カナダは「強い立場」で交渉していると述べたが、カナダ全輸入品の約5％を対象とするトランプ政権による最近の財政圧迫が本格化する前に、首相とそのチームが合意に達するかどうかは賭けが大きい。\nここ数日、カナダの交渉担当者とジェイミソン・グリア米通商代表部との間で相次ぎ会談が行われたにもかかわらず、両国はまだ最終合意に至っていない。\n米国・カナダ貿易相のドミニク・ルブラン氏は月曜日、グリア氏の執務室を去り際に「我々の仕事はまだ終わっていない」と述べた。\n双方とも交渉が難航していたことは明らかだ。トランプ大統領はカナダを貿易に関して「意地悪」と表現したが、これについてカーニー長官は全面的に異議を唱えなかった。\n同氏はまた、各国が合意に達しなかった場合には「より厳しくなる時が来る」と警告した。\nたとえ合意に達したとしても、カーニー氏は国境以南の政権に不満を抱き、懐疑的な国民に譲歩を売り込む必要があるだろう。\nまた、いかなる妥協についても州からの同意が必要となるだろう。\n米国はカナダに対し、米国製自動車に対する残りの報復関税の撤廃や乳製品割り当ての調整など、多くの譲歩を求めている。\nまた、トランプ大統領の関税への報復としてカナダのほとんどの州が昨年初めに課した米国でのアルコール販売禁止措置の解除も求めた。\nその譲歩は、それぞれの管轄区域でアルコールを管理している州の合意に依存することになる。\n米国に対して厳しい姿勢を貫くオンタリオ州のダグ・フォード首相は先週、酒類に関する協定には条件があると述べた。\nカナダは米国が自国経済に悪影響を及ぼしている鉄鋼、アルミニウム、自動車、木材部門に対する関税を引き下げまたは引き下げる合意を求めている。\nフォードは「鉄鋼セクター、自動車セクター、林業セクター、農業セクター、製造セクターを守る公正な合意が得られれば、喜んで酒類を店頭に戻すだろう」と語った。\nカーニー首相は乳製品分野でのいかなる譲歩にも反発に直面する可能性があり、特にケベック州では供給管理は交渉の余地がないと首相のクリスティーヌ・フレシェット氏が述べている。\nトランプ大統領は、この制度は乳製品、卵、家禽肉の生産割当、価格設定、輸入割当を定めており、国境以北で農産物を販売したい米国の農家にとって「不合理」だと主張。\nカナダ人も、さらなる安定を望んでいるとはいえ、米国に多くの譲歩をする気にはなっていない。\nアバカス・データの最新世論調査によると、74％が貿易紛争が家計に影響を与えていると感じており、36％が国内経済にさらなる打撃を与えるリスクがあるとしても、カナダが新たな対抗関税で対応することを望んでいる。\n米国の関税を撤廃または削減するために、州による米国産アルコールの禁止令を廃止するなどの譲歩を支持する人はわずか18％だった。\nカナダメディアの報道によると、カナダの首席交渉官ジャニス・シャレット氏は、水曜日に新たな関税が発動されればさらなる通商交渉が危険にさらされる可能性があると対外的に米国の交渉相手に警告したという。\nカーニー首相は、カナダにとって良い協定でない限り協定には署名しないと述べているが、そのような協定がどのようなものになるかについては明確になっていない。\n同氏は月曜日には「交渉が進むにつれて、今後48時間にわたってより詳細に話し合う機会がある」とだけ述べた。\n同氏は水曜日の期限までにトランプ大統領と会談する予定だと述べた。\n同氏はまた、協議が決裂した場合に「起こり得るあらゆる状況に備える計画」があるとも述べた。\n保守派通商評論家のシュヴァロイ・マジュムダル氏は声明で、経済不安から「ある程度の救済」をすべき時期が来たと述べた。\n「我が国がサンドバッグとして利用されるのを見るのにはもう飽き飽きしている」と彼は語った。\n「しかし我々は、カーニー首相が交渉の場で真の勝利をもたらすという共通の希望を共有している。」",

  {
    "id": "lakers-governor-jeanie-buss-says-sibling-e12b1644",
    "title": "Lakers governor Jeanie Buss says siblings cannot sell family’s stake to Bob Iger, Joshua Kushner",
    "titleJa": "レイカーズのジーニー・バス知事は、兄弟姉妹が家族の株式をボブ・アイガーやジョシュア・クシュナーに売却することはできないと述べた",
    "summaryJa": "ロサンゼルス・レイカーズのジーニー・バス知事は、家族がNBAチームの株式を売却する可能性に反対しており、ボブ・アイガーとジョシュア・クシュナーへの家族の売却決定に関するESPNの以前の報道と矛盾している。CNBCが入手したジーニー・バスの兄弟（ジム、ジョニー、ジャニー、ジョーイ、ジェシー）を代理する法律事務所に宛てた書簡の中で、彼女の弁護士アダム・ストライサンド氏は、ジーニー・バスはチーム売却に同意しておらず、バス一家が売却することを示唆する投票は「無効となるだろうし、無効である」と述べた。",
    "bodyOriginal": "Los Angeles Lakers governor Jeanie Buss is opposing the potential sale of her family's stake in the NBA team, contradicting an earlier ESPN report about the family's decision to sell to Bob Iger and Joshua Kushner.\nIn a letter obtained by CNBC addressed to law firms representing Jeanie Buss's siblings — Jim, Johnny, Janie, Joey and Jesse — her lawyer Adam Streisand says Jeanie Buss has not agreed to sell the team and that any vote suggesting the Buss family is selling \"would be and is void.\"\nStreisand argues in the letter that Jeanie Buss remains the controlling shareholder of the Lakers, pursuant to a 2017 court order, and that no sale can take place without her consent.\n\"No sale of the JAB Trust's 17.8% ownership interest in the Los Angeles Lakers, Inc. can be effectuated without approval by the current co-trustees, i.e., Jeanie, Janie and Joey Buss. Pursuant to the JAB Trust and the attached Court Order, the co-trustees are bound to vote the Los Angeles Lakers, Inc. shares to ensure that the minimum 15% ownership requirement is maintained in order to ensure that Jeanie Buss may remain Controlling Owner,\" Streisand says in the letter.\n\"Any attempt by the co-trustees to do otherwise, and any attempt to aid or abet the co-trustees as such, would constitute a breach of trust, breach of fiduciary duty and be in contempt of court,\" he says.\nLast week, Iger and Kushner agreed to buy Mark Walter's majority stake in the Lakers. That deal valued the team at $12.5 billion, CNBC reported at the time. The Buss family stake would have meant an overall team ownership share of approximately 83% for the former Disney CEO and Thrive Capital founder, ESPN reported.\nBut Jeanie Buss doesn't want to sell the family's stake in the team at this time, according to a person familiar with the matter, who spoke on the condition of anonymity about confidential matters. She wants to hold onto the team stake for value reasons as well as to maintain her role as governor, the person said.\nRead the full letter from Jeanie Buss's attorney:\nThis story is developing. Please check back for updates.\nCorrection: A previous headline on this article misidentified one of the potential buyers of the Buss family stake in the Los Angeles Lakers.",
    "bodyJa": "ロサンゼルス・レイカーズのジーニー・バス知事は、家族がNBAチームの株式を売却する可能性に反対しており、ボブ・アイガーとジョシュア・クシュナーへの家族の売却決定に関するESPNの以前の報道と矛盾している。\nCNBCが入手したジーニー・バスの兄弟（ジム、ジョニー、ジャニー、ジョーイ、ジェシー）を代理する法律事務所に宛てた書簡の中で、彼女の弁護士アダム・ストライサンド氏は、ジーニー・バスはチーム売却に同意しておらず、バス一家が売却することを示唆する投票は「無効となるだろうし、無効である」と述べた。\nストライサンド氏は書簡の中で、2017年の裁判所命令に従い、ジーニー・バス氏が引き続きレイカーズの支配株主であり、彼女の同意なしに売却はできないと主張している。\n「JABトラストのロサンゼルス・レイカーズ・インクに対する17.8％の所有権の売却は、現在の共同受託者、すなわちジーニー・バス、ジャニー・バス、ジョーイ・バスの承認なしには実現できない。JABトラストおよび添付の裁判所命令に従い、共同受託者はジーニー・バスが確実に残るために最低15％の所有権要件が維持されることを保証するためにロサンゼルス・レイカーズ・インクの投票を行う義務がある。支配的な所有者だ」とストライサンド氏は書簡の中で述べている。\n「共同受託者がそれ以外のことをしようとしたり、共同受託者を幇助したり教唆しようとしたりする試みは、背任、受託者義務違反となり、法廷侮辱罪となる」と同氏は言う。\nアイガー氏とクシュナー氏は先週、マーク・ウォルター氏のレイカーズの過半数株を購入することで合意した。当時CNBCは、この契約によりチームの価値は125億ドルになったと報じた。 ESPNの報道によると、バス家の株式は、ディズニーの元CEOでスライブ・キャピタルの創設者にとって、チーム全体の所有権の割合が約83％になることを意味していたという。\nしかし、機密事項について匿名を条件に語った関係者によると、ジーニー・バス氏は現時点で家族のチーム株を売却するつもりはないという。同関係者によると、彼女は知事としての役割を維持するだけでなく、価値上の理由からチームの株式を保持したいと考えているという。\nジーニー・バスの弁護士からの手紙全文をお読みください。\nこの物語は発展中です。最新情報を再度ご確認ください。\n訂正: この記事の前の見出しでは、ロサンゼルス・レイカーズのバス家の株式の潜在的な買い手の一人を誤って特定していました。",

    "id": "absolutely-crazy-here-s-what-south-kore-f02fd1ee",
    "title": "'Absolutely crazy': Here's what South Korean stock investors are doing in U.S. markets",
    "titleJa": "「絶対にクレイジー」：韓国の株式投資家が米国市場で何をしているのか",
    "summaryJa": "世界の投資家が押し寄せる中でも、国内の調整を避けるために韓国の投資家の波が米国市場に殺到している。韓国取引所のデータによると、ベンチマーク指数が強気相場の領域に入ったにもかかわらず、韓国の個人投資家は先週の大半で国内株を売り越した。海外投資家は一転して買い越しとなった。",
    "bodyOriginal": "A wave of South Korean investors is flocking to U.S. markets to avoid a correction at home, even as global investors pile in.\nKorean retail investors net sold domestic stocks for most of last week, even as the benchmark index entered bull market territory, according to Korea Exchange data. Overseas investors reversed course to become net buyers.\nHere are five things related to those investors:\nBuying ADRs\nOf the $4.5 billion in U.S. stocks Korean investors net bought in July, around $840 million went into the chipmaker's U.S.-listed depositary receipts, according to Korea Securities Depository data. SK Hynix's ADRs were the second most net-purchased U.S. securities, even though Korean investors can buy the same company directly at home.\nThe U.S. receipts have traded at a premium to the Korean shares, which Owen Lamont, senior vice president of Acadian Asset Management, said was about 10% recently. They're also exhibiting greater volatility.\n\"That's absolutely crazy,\" Lamont said of Korean investors buying SK Hynix's U.S.-listed shares. \"There's no reason for a Korean investor to buy ADRs of Korean stocks in the U.S.\"\nSuch price discrepancies are unusual and can be a warning sign of speculative excess, Lamont said. \"They're a symptom of the bubble,\" he said, pointing to similar dislocations involving Taiwanese and Indian companies around the dot-com boom.\nLeveraged bets\nOne of the 10 most popular U.S. stocks among investors this month was a leveraged product -- ProShares Ultra QQQ ETF -- which ranked No. 7.\nIn July, four of the 10 most net purchased U.S. stocks were leveraged products, according to data from Korea Securities Depository.\nThe most popular was the Direxion Daily Semiconductor Bull 3X Shares ETF, or SOXL, which aims to deliver three times the daily performance of a semiconductor index, data show. The leveraged ProShares UltraPro QQQ and ProShares Ultra QQQ ranked fourth and sixth.\nSame strategy\nInvestors may be changing markets without necessarily changing the bet.\n\"The irony is that if you parse the data and look at what they're buying, it's largely shares tied up in the same AI hardware theme that's been selling off in the local market,\" Phillip Wool, head of research at Rayliant Global Advisors, said.\nJung In Yun, founder of Fibonacci Asset Management, said some traders hurt by losses in Korean semiconductor shares or leveraged ETFs may be shifting to U.S. AI stocks they perceive as higher-quality or more liquid.\n\"They are not necessarily reducing their exposure to the AI theme,\" Yun said. \"They may simply be changing the geographical vehicle through which they express the same view.\"\nReversal from July\nKorean retail investors net bought around $4.5 billion in U.S. stocks last month, according to Korea Securities Depository data. That was a sharp pickup from June and near the net purchases of $5 billion in January.\nAt the same time, the country's shares saw a massive selloff, following a spectacular rally that drew retail investors into semiconductor stocks and leveraged products, before staging a rebound this month.\nMargin loan balances in the Korean stock market stood at about 37 trillion won ($26 billion) at the end of June, before tumbling to 27 trillion won earlier this month, the lowest level this year, according to the Korea Financial Investment Association.\nWhile July's purchases were \"strong\" but not unprecedented, Lamont said, \"it is still pretty interesting that they increased their U.S. buying even as the Korean market was plunging,\" he added.\nEffect on market\nWhether the influx of Korean money can meaningfully increase volatility across the much larger U.S. market is another question.\nWool sees little risk of that. While retail investors can have an outsized influence in Korea, U.S. markets are dominated by professional and institutional investors, making even large Korean flows small relative to overall turnover.\nLamont sees greater potential for distortions in individual names and corners of the market favored by retail traders. He pointed to Korean investors' rush into U.S. \"quantum\" stocks in late 2024, and said the proliferation of leveraged ETFs across Korea, Hong Kong and the U.S. is \"possibly adding volatility and magnifying market fluctuations.\"",
    "bodyJa": "世界の投資家が押し寄せる中でも、国内の調整を避けるために韓国の投資家の波が米国市場に殺到している。\n韓国取引所のデータによると、ベンチマーク指数が強気相場の領域に入ったにもかかわらず、韓国の個人投資家は先週の大半で国内株を売り越した。海外投資家は一転して買い越しとなった。\nこれらの投資家に関連する 5 つの事柄は次のとおりです。\nADRの購入\n韓国証券保管振替庁のデータによると、韓国の投資家が7月に買い越しした米国株45億ドルのうち、約8億4000万ドルがこの半導体メーカーの米国上場預託証券に入金された。韓国の投資家は同じ会社を国内で直接買うことができるにもかかわらず、SKハイニックスのADRは米国証券で2番目に多く買い越された銘柄となった。\n米国の受領金は韓国株に比べて割高に取引されており、アカディアン・アセット・マネジメントの上級副社長オーウェン・ラモント氏によると、最近の株高は約１０％だという。また、ボラティリティも大きくなっています。\nラモント氏は韓国投資家がSKハイニックスの米国上場株を購入していることについて「まったくクレイジーだ」と述べた。 「韓国の投資家が米国で韓国株のADRを買う理由はない」\nラモント氏は、このような価格差は異例であり、投機過剰の警告サインである可能性があると述べた。同氏は、ドットコムブームの周囲で台湾やインドの企業が巻き込まれた同様の混乱を指摘し、「それらはバブルの症状だ」と述べた。\nレバレッジをかけた賭け\n今月、投資家の間で最も人気のある米国株トップ１０の１つは、レバレッジ商品であるプロシェアーズ・ウルトラＱＱＱＥＴＦで、７位にランクインした。\n韓国証券保管振替庁のデータによると、7月に最も多く買い越された米国株10銘柄のうち4銘柄がレバレッジ商品だった。\nデータによると、最も人気があったのはディレクシオン・デイリー・セミコンダクター・ブル3X株ETF（SOXL）で、半導体指数の1日あたりのパフォーマンスを3倍にすることを目指している。レバレッジを活用した ProShares UltraPro QQQ と ProShares Ultra QQQ は 4 位と 6 位にランクされました。\n同じ戦略\n投資家は必ずしも賭け金を変更せずに市場を変更する可能性があります。\nレイリアント・グローバル・アドバイザーズの調査責任者フィリップ・ウール氏は、「皮肉なことに、データを解析して彼らが何を買っているかを見ると、主に同じAIハードウェアのテーマに関連した株が地元市場で売られていることが分かる」と述べた。\nフィボナッチ・アセット・マネジメントの創設者チョン・インユン氏は、韓国の半導体株やレバレッジETFの損失で傷ついた一部のトレーダーが、より質が高く流動性が高いと判断した米国のAI株にシフトしている可能性があると述べた。\n「彼らは必ずしもAIというテーマへの接触を減らしているわけではない」とユン氏は語った。 「彼らは単に、同じ見解を表現する地理的手段を変えているだけかもしれない。」\n7月から反転\n韓国証券保管振替庁のデータによると、韓国の個人投資家は先月米国株を約45億ドル買い越した。これは6月から急激に増加し、1月の純購入額50億ドルに近かった。\n同時に、同国の株価は、個人投資家を半導体株やレバレッジ製品に引き寄せた目覚ましい上昇を受けて大幅に下落したが、今月反発を見せた。\n韓国金融投資協会によると、韓国株式市場の信用貸付残高は６月末時点で約３７兆ウォン（２６０億ドル）だったが、今月初めには今年最低水準の２７兆ウォンにまで落ち込んだ。\nラモント氏は、7月の購入額は「強かった」ものの前例がないわけではないとし、「韓国市場が急落しているにもかかわらず、米国での購入額が増加したことは依然として非常に興味深い」と付け加えた。\n市場への影響\n韓国マネーの流入が、はるかに規模の大きい米国市場全体のボラティリティーを有意に高めることができるかどうかは別の問題だ。\nウールではそのリスクはほとんどないと考えています。韓国では個人投資家が大きな影響力を持つ可能性があるが、米国市場はプロと機関投資家が大半を占めており、韓国からの大きな資金流入であっても全体の出来高に比べれば小さい。\nラモント氏は、小売トレーダーが好む市場の個人名やコーナーが歪められる可能性がさらに高まると見ている。同氏は、2024年後半に韓国の投資家が米国の「クオンタム」株に殺到していることを指摘し、韓国、香港、米国におけるレバレッジETFの普及が「ボラティリティを高め、市場変動を拡大させている可能性がある」と述べた。",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "To joke or not to joke?: How to write a good out-of-office message\n- Published\nYou're finally about to head off on a well-earned break, but there's one more task to tick off your to-do list: composing an out-of-office reply.\nMany will be all too familiar with debating how much information to include and how available you will be - and whether to inject some personality into your message, or even risk cracking a joke.\nExperts say there are clear dos and don'ts when it comes to writing an out-of-office message (OOO) - and getting it wrong can have more serious consequences than you might think. Here are their rules to penning the perfect out-of-office reply.\n'Avoid oversharing or boasting'\nDebretts, an etiquette consultancy, says a good automatic reply should be polite and concise, give a specific return date, and provide another point of contact if appropriate.\nBut you should avoid oversharing, for instance including the specifics of your holiday plans, or boasting about things like second homes or expensive hobbies.\n\"Virtue signalling\" about why you are taking time off is another no-no. It could seem \"smug\" or like you are \"trying too hard\", says director Rupert Wesson.\n\"Some people will be delighted you are spending 'quality time with your family', but given that they are the ones emailing you and are hard at work, you could risk rubbing their noses in it.\"\nThat said, a bare message that simply states, \"I'm out of office\" with no details of a return date or alternative emails to try, can raise more questions than it answers.\nThe danger of 'under-communication'\n\"People don't know when to expect a reply or who else can help, and that uncertainty is what leads to the 'just-in-case' follow-ups,\" says Charlotte Davies, a career expert at Linkedin.\nShe believes a good OOO does two things: shares your dates and points people to a backup contact.\nShe also thinks it's worth briefing the person covering you about anything important before you go: \"It helps whoever's emailing you, and it protects your break too.\"\nShould you crack jokes?\nWhile the personal touch may work in OOOs if your team culture is informal, beware that humour doesn't always land well over email.\nOverly glib or sarcastic messages can get you into trouble, even if they are funny, reckons Paul Fitzsimmons, head of sales and marketing at law firm Wilford Smith.\n\"'I'm currently out of the office pretending this company doesn't exist'... 'If it's urgent, call someone who cares'... 'Emails received while I'm away will be deleted unread,'\" he gives as examples.\nAdam Murfet, 41, a senior sales executive, says a former colleague lost a deal after a joke in an OOO angered a client.\nBut he thinks humour can help some people stand out at a time when communication is increasingly AI-driven.\n\"Always ask, would you put the same thing in an email?\" he says, as a rule of thumb.\n\"Anything you send will be read and people will judge you on it.\"\n'I won't be checking emails'\nCommentators often complain about the sender saying they will have \"limited access to email\" while they are away.\nThe risk is it invites people to keep contacting you as if you were still at work.\nWesson says that if you really need to check emails on holiday, then it's better to say, \"I will be periodically checking emails,\" as it manages expectations.\nDavies adds that if you want a proper break, \"say so clearly - something like 'I won't be checking emails during this time'.\"\n\"Remember, in the UK you have a legal right to uninterrupted annual leave unless your contract says otherwise.\"\nTips on writing a good out-of-office reply\n1. Be polite: Don't just launch in with \"I'm on annual leave\". Preface your message with a greeting, such as \"Thank you for your email\".\n2. Give a specific return date and back-up contact if appropriate. Ensure all the contact details are correct\n4. Be clear about your availability: Manage expectations and if you would prefer not to be contacted, say so\n5. Don't promise instant replies on your return: A backlog is completely normal, so \"within a few days\" is a better promise to make\n6. Tick both internal and external contacts if you use Outlook. It's an easy one to miss\n7. Switch off your out of office when you return: A stale OOO can look disorganised.\nSources: Debretts, Linkedin",

    "id": "l3harris-ousts-ceo-chris-kubasik-over-un-abbcb12c",
    "title": "L3Harris ousts CEO Chris Kubasik over unspecified 'conduct,' stock drops 4%",
    "titleJa": "L3ハリス、不特定の「行為」を理由に最高経営責任者（CEO）クリス・クバシク氏を解任、株価は4％下落",
    "summaryJa": "防衛請負大手L3ハリス・テクノロジーズは、クリス・クバシク最高経営責任者（CEO）が「会社の価値観と一致しないある行為」を行っていたことを知り、日曜日に同氏を解任したと同社は月曜日の声明文で述べた。L3ハリスの取締役会はサム・メータをCEO兼社長に任命したと同社は発表した。メータ氏は最近、同社の宇宙・ミッションシステム部門と通信・スペクトル・ドミナンス部門の社長を務めていた。",
    "bodyOriginal": "Defense contracting giant L3Harris Technologies ousted CEO Chris Kubasik on Sunday after learning he engaged in \"certain conduct ... that was not consistent with the values of the Company,\" the company said in a statement on Monday.\nL3Harris's board appointed Sam Mehta as CEO and president, the company said. Mehta most recently was the company's president of the Space & Mission Systems and Communications & Spectrum Dominance segments.\nShares of L3Harris fell by more than 4% on the heels of the news of Kubasik's ouster, which \"was unrelated to the Company's financial reporting, controls, customer relationships or operational performance,\" the company's statement said.\n\"Following its investigation of these matters with the assistance of independent counsel, the Board determined that it would be in the best interests of the Company to enter into a separation agreement with Kubasik,\" the statement said.\nKubasik's ouster comes seven months after the Defense Department committed to a $1 billion convertible preferred equity investment in L3Harris' missile solutions business, which will become a separate company as part of the deal. An initial public offering for the missile business has been postponed from the latter half of 2026 until mid-2027.\nL3Harris was responsible for modifying a 747 jumbo jet controversially gifted by Qatar to the United States to serve as a new Air Force One for President Donald Trump.\nKubasik, 65, in addition to being CEO, had been L3Harris' chairman of the board. He had been CEO since 2021. L3Harris on Monday said that Lewis Hay III, the company's lead independent director, was named independent chairman of the board.\nCNBC has reached out to Kubasik for comment.\nThe news outlet Semafor, citing two people briefed on the investigation, reported that Kubasik was ousted \"after an independent probe found he had engaged in an inappropriate relationship with an employee.\"\nCNBC has asked L3Harris whether that report is accurate.\nIn 2012, the board of the major defense contractor Lockheed Martin asked for and received Kubasik's resignation as president and chief operating officer, weeks before he was scheduled to become CEO, after \"an ethics investigation confirmed that he had a close personal relationship with a subordinate employee,\" Lockheed said in a statement at the time.\nIn a filing with the Securities and Exchange Commission that details Kubasik's separation agreement, L3Harris said that Kubasik \"does not admit, and expressly disclaims, any violation of Company policy or basis for termination for 'cause,' but has determined to resolve all matters relating to the Executive's separation from employment on the terms set forth in this Agreement.\"\nUnder the separation agreement, Kubasik will not receive any bonus under the company's 2026 incentive plan but will keep nearly 384,000 stock options.\nKubasik and his wife, Jane Kubasik, are longtime supporters of the athletics program at their alma mater, the University of Maryland. The Kubasik First Impact Program helps a select cohort of Maryland student-athletes each academic year prepare for life beyond their sport.\nHay, in a statement about Mehta's elevation to CEO, said, \"Sam is a proven executive who brings deep knowledge of our business, priorities and culture, making him ideally suited to become President and CEO of L3Harris at this important time in our company's and our nation's history.\"\n\"Sam's readiness to lead L3Harris reflects the Board's robust succession planning and our focus on cultivating talent,\" Hay said.\nMehta, in a statement, said, \"I am honored by the opportunity to serve as President and CEO of\nL3Harris. I look forward to working even more closely with my fellow senior leaders and my talented colleagues across the Company to support the needs of our country and our allies.\"\n\"Today, L3Harris has a portfolio purpose-built for the future of warfare, and we are well-positioned to continue executing our focused growth strategy as The Trusted Disruptor,\" he said.",
    "bodyJa": "防衛請負大手L3ハリス・テクノロジーズは、クリス・クバシク最高経営責任者（CEO）が「会社の価値観と一致しないある行為」を行っていたことを知り、日曜日に同氏を解任したと同社は月曜日の声明文で述べた。\nL3ハリスの取締役会はサム・メータをCEO兼社長に任命したと同社は発表した。メータ氏は最近、同社の宇宙・ミッションシステム部門と通信・スペクトル・ドミナンス部門の社長を務めていた。\n同社の声明によると、クバシク氏解任のニュースを受けてＬ３ハリスの株価は４％以上下落したが、この解任は「当社の財務報告、管理、顧客関係、経営成績とは無関係だった」という。\n「独立した弁護士の支援を受けてこれらの問題を調査した結果、取締役会はクバシク氏と分離契約を結ぶことが当社にとって最大の利益になると判断した」と声明で述べた。\nクバシク氏の解任は、国防総省がL3ハリスのミサイルソリューション事業に10億ドルの転換型優先株投資を約束してから7カ月後に行われたが、この取引の一環として同事業は別会社となる。ミサイル事業の新規株式公開（ＩＰＯ）は２０２６年後半から２０２７年半ばに延期された。\nL3ハリスは、ドナルド・トランプ大統領の新しいエアフォース・ワンとして使用するために、カタールから米国に贈られた物議を醸した747ジャンボジェット機の改造を担当した。\n65歳のクバシク氏はCEOであることに加えて、L3ハリスの取締役会会長も務めていた。同氏は2021年からCEOを務めていた。L3ハリス氏は月曜日、同社の首席独立取締役であるルイス・ヘイ3世が独立取締役会長に任命されたと発表した。\nCNBCはクバシク氏にコメントを求めた。\n報道機関セマフォーは、捜査について説明を受けた２人の関係者の話として、クバシク氏が「独立した調査で従業員と不適切な関係にあったことが判明したため」解任されたと報じた。\nCNBCはL3Harrisにその報道が正確かどうか尋ねた。\n2012年、大手防衛請負業者ロッキード・マーティンの取締役会は、クバシク氏がCEOに就任する予定の数週間前に、「倫理調査の結果、部下の従業員と親密な個人的関係があったことが確認された」として、クバシク氏の社長兼最高執行責任者としての辞任を要請し、受け入れられたと当時の声明文で述べた。\nクバシク氏の離職合意の詳細を記載した証券取引委員会への提出書類の中で、L3ハリス氏は、クバシク氏が「会社方針への違反や『理由』による解雇の根拠を認めず、明示的に否認するが、幹部の離職に関するすべての問題を本契約に定められた条件で解決することを決意した」と述べた。\n分離合意に基づき、クバシク氏は同社の2026年のインセンティブプランに基づくボーナスは受け取らないが、約38万4,000株のストックオプションを保有することになる。\nクバシクと妻のジェーン・クバシクは、母校であるメリーランド大学の陸上競技プログラムを長年サポートしています。クバシック ファースト インパクト プログラムは、毎年メリーランド州の選ばれた学生アスリートがスポーツ以外の人生に備えるのを支援します。\nヘイ氏はメータ氏のCEO昇格に関する声明で、「サム氏は当社の事業、優先事項、文化について深い知識をもたらしてくれる実績ある経営幹部であり、当社と我が国の歴史におけるこの重要な時期にL3ハリスの社長兼最高経営責任者（CEO）に就任するのに理想的な人物である」と述べた。\n「サムがL3ハリスを率いる準備ができているのは、取締役会の強力な後継者計画と人材育成への当社の注力を反映している」とヘイ氏は述べた。\nメータ氏は声明で「当社の社長兼最高経営責任者（CEO）を務める機会を光栄に思う」と述べた。\nL3ハリス。私たちの国と同盟国のニーズをサポートするために、会社全体の上級リーダーや才能ある同僚とさらに緊密に協力することを楽しみにしています。」\n「現在、L3ハリスは将来の戦争のために構築されたポートフォリオを持っており、信頼できる破壊者として焦点を当てた成長戦略を実行し続ける有利な立場にあります」と同氏は述べた。",

ction.\nRelated topics\n- Published12 hours ago\n- Published6 days ago\n- Published10 August",

    "title": "30-year Treasury yield tops 5.31%, the highest in 19 years",

    "summaryJa": "原油価格の上昇を受けて月曜日の米国債利回りは上昇し、インフレの持続と政府借り入れに対する投資家の間で懸念が高まった。通常地政学的な出来事に敏感な３０年米国債利回りは４ベーシスポイント以上上昇して５．３１１％となった。 ２００７年６月以来の高水準となった。",
    "bodyOriginal": "Treasury yields were higher on Monday as oil prices rose, with worries growing among investors about persistent inflation and government borrowing.\nThe 30-year Treasury yield, which is typically sensitive to geopolitical events, advanced more than 4 basis points to 5.311%. It reached its highest level since June 2007.\nThe 10-year Treasury note yield — the main benchmark for mortgages, auto loans and credit card debt — was more than 2 basis points higher at 4.724%.\nThe yield on the 2-year Treasury note, which typically reacts in line with short-term Federal Reserve interest rate decisions, rose more than 1 basis point to 4.182%.\nOne basis point equals 0.01%, or 1/100th of 1%, and yields and prices move inversely to one another.\nOil prices rose as the 60-day deadline for the U.S. and Iran to secure a peace deal is expiring Monday, with Iran ruling out the possibility of an extension. A senior Iranian official also told Reuters Monday that Tehran would take an offensive stance if diplomacy with the U.S. fails.\nWest Texas Intermediate futures gained 2% to trade above $84 per barrel. Global benchmark Brent crude advanced 2% to above $90 a barrel.\nElevated energy prices in the wake of the Middle East conflict breaking out months ago have raised concerns about inflationary pressures, though the latest batch of mild inflation data has offered some reassurance to investors.\nBond yields rose during Friday's session after retail sales fell by a surprise 0.6% last month, which came after a flat producer price index print month-on-month in July.\nLast week, the Treasury Department reported that the U.S. budget deficit reached its highest monthly level in more than five years, with rising Medicare costs and interest on the federal debt serving as contributors. The year-to-date total for the federal government's fiscal year has exceeded the amount seen during the same period last year.\n\"We believe investors are increasingly evaluating Treasury securities through the lens of longer-term fiscal sustainability and less through the lens of inflation, monetary policy, and growth, at least for the longer end of the Treasury curve,\" wrote Anthony Saglimbene, Ameriprise chief market strategist, in a Monday note.\nInvestors are now awaiting July's FOMC meeting minutes, due Wednesday, for further insights into the Federal Reserve's latest monetary policy decisions and potential future rates trajectory.\nThe Fed voted 9-3 to hold rates steady at between 3.50% and 3.75% for the fifth consecutive meeting on July 29. The three dissenting committee members — Beth Hammack of Cleveland, Neel Kashkari of Minneapolis and Lorie Logan of Dallas — instead called for a 25 basis point hike.",
    "bodyJa": "原油価格の上昇を受けて月曜日の米国債利回りは上昇し、インフレの持続と政府借り入れに対する投資家の間で懸念が高まった。\n通常地政学的な出来事に敏感な３０年米国債利回りは４ベーシスポイント以上上昇して５．３１１％となった。 ２００７年６月以来の高水準となった。\n住宅ローン、自動車ローン、クレジットカード債務の主な指標である10年国債利回りは4.724%と2ベーシスポイント以上上昇した。\n通常、米連邦準備理事会（ＦＲＢ）の短期金利決定に合わせて反応する２年物国債利回りは１ベーシスポイント以上上昇し４．１８２％となった。\n1 ベーシス ポイントは 0.01%、つまり 1% の 100 分の 1 に相当し、利回りと価格は相互に反比例します。\n米国とイランが和平協定を締結するための60日間の期限が月曜日に期限切れとなり、イランが延長の可能性を否定しているため、原油価格は上昇した。イラン高官も月曜日、ロイターに対し、米国との外交が失敗すればイランは攻撃的な姿勢を取るだろうと述べた。\nウェスト・テキサス・インターミディエイト先物は２％上昇し、１バレル＝８４ドルを超えて取引された。世界のベンチマークであるブレント原油は２％上昇し、１バレル＝９０ドルを超えた。\n数カ月前に勃発した中東紛争を受けてエネルギー価格が高騰し、インフレ圧力に対する懸念が高まっているが、最新の穏やかなインフレ統計は投資家に一定の安心感を与えている。\n7月の生産者物価指数の前月比横ばいを受けて、先月の小売売上高が予想外の0.6％減となったことを受け、金曜日の取引中に債券利回りは上昇した。\n財務省は先週、メディケア費用と連邦債務の金利の上昇が寄与し、米国の財政赤字が月次で過去５年以上で最高水準に達したと報告した。連邦政府の会計年度の年初から現在までの総額は、前年同期の金額を上回った。\nアメリプライズの首席市場ストラテジスト、アンソニー・サグリンベネ氏は月曜のメモで「投資家はインフレ、金融政策、成長というレンズではなく、長期的な財政持続可能性というレンズを通して米国債をますます評価するようになっていると考えている」と述べた。\n投資家は現在、連邦準備制度理事会の最新の金融政策決定と潜在的な将来の金利軌道に関するさらなる洞察を得るために、水曜日に発表される7月のFOMC議事録を待っている。\nFRBは7月29日、5回連続の会合で政策金利を3.50％から3.75％の間で据え置くことを9対3で投票し、反対した3人の委員（クリーブランドのベス・ハンマック氏、ミネアポリスのニール・カシュカリ氏、ダラスのローリー・ローガン氏）は代わりに25ベーシスポイントの利上げを要求した。",

    "bodyOriginal": "Paramount Skydance will seek to force the states holding up its merger with Warner Bros. Discovery to pay for the fees and costs associated with the delay, according to a new filing in the antitrust case Monday.\nParamount is requesting a $1.88 billion bond that would be paid by the states behind the lawsuit. In July, a dozen state attorneys general led by California's Rob Bonta filed to challenge the proposed $110 billion merger between Paramount and WBD.\nThe proposed deal would combine two storied film studios — Paramount and Warner Bros. — as well as put together a sprawling portfolio of pay TV networks in the U.S. and streaming platforms HBO Max and Paramount+.\nParamount has received regulatory approvals from the Antitrust Division of the U.S. Department of Justice, as well as all other global jurisdictions needed to move forward with the merger. But last month, Paramount agreed to delay the proposed acquisition to as late as June 2027 while the state AGs' case heads to trial.\nParamount long planned to have the deal closed by the end of September. The delay could prove costly for Paramount.\nParamount agreed to a so-called ticking fee under the terms of the merger agreement, meaning that beginning Sept. 30 it would pay WBD shareholders an additional 25 cents per share, per quarter, until the deal closes. The amount could add up to roughly $650 million in cash value per quarter.\n\"By the time trial concludes and the parties submit their final briefs, Paramount will have paid Warner Bros. shareholders an unrecoverable $1.3 billion in ticking fees alone,\" Paramount said in the filing. \"Delay also threatens to nullify the regulatory approvals that Defendants have already spent months securing.\"\n\"Absent security, even a complete victory on the merits would not restore a dollar of those extraordinary losses. That is precisely why federal law requires plaintiffs to provide security as a condition for receiving preliminary relief such as the court-approved order,\" the filing says.\nIf the deal were to fall apart due to regulatory concerns Paramount would owe WBD a $7 billion breakup fee.\nThis story is developing. Please check back for updates.",
    "bodyJa": "月曜の独占禁止法訴訟の新たな提出文書によると、パラマウント・スカイダンスはワーナー・ブラザース・ディスカバリーとの合併を保留している州に対し、遅延に伴う手数料と経費の支払いを強制するよう求めている。\nパラマウントは、訴訟の背後にある州が支払うことになる18億8000万ドルの保釈金を要求している。 7月、カリフォルニア州のロブ・ボンタ氏率いる10数人の州司法長官が、パラマウントとWBDの1100億ドル規模の合併案に異議を申し立てた。\n提案されている契約では、パラマウントとワーナー・ブラザースの2つの有名な映画スタジオが統合され、米国の有料テレビネットワークとストリーミングプラットフォームのHBO MaxとParamount+の広大なポートフォリオが統合されることになる。\nパラマウントは米国司法省反トラスト局のほか、合併を進めるために必要な他のすべての世界管轄区域から規制当局の承認も得ている。しかし先月、パラマウントは、州政府の訴訟が裁判に向かう間、買収案を最長2027年6月まで延期することに同意した。\nパラマウントは長年、9月末までに取引を完了させる計画を立てていた。遅延はパラマウントにとって代償を伴う可能性がある。\nパラマウントは合併契約の条件に基づくいわゆるティッキングフィーに同意し、9月30日から取引が完了するまでWBD株主に1株当たり四半期ごとに追加で25セントを支払うことになる。この金額は、四半期あたりの現金価値として最大約 6 億 5,000 万ドルに上る可能性があります。\nパラマウントは提出書類の中で、「裁判が終了し、両当事者が最終準備書面を提出するまでに、パラマウントはワーナー・ブラザースの株主に対し、ティッキング手数料だけで回収不可能な13億ドルを支払っていることになる」と述べた。 「遅延はまた、被告らがすでに数カ月を費やして確保してきた規制当局の承認を無効にする恐れがある。」\n「担保がなければ、たとえ本案で完全に勝利したとしても、こうした異常な損失は一ドルも回復しないだろう。だからこそ連邦法は、裁判所が承認した命令などの予備的救済を受けるための条件として、原告に担保の提供を求めているのだ」と申請書には記されている。\n規制上の懸念により契約が決裂した場合、パラマウントはWBDに対し70億ドルの違約金を支払う義務がある。\nこの物語は発展中です。最新情報を再度ご確認ください。",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/08/17/paramount-bond-merger-delay-costs.html",
    "publishedAt": "2026-08-17T18:36:08+00:00",
    "category": "テクノロジー",
    "imageUrl": "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&q=80",

  }

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
