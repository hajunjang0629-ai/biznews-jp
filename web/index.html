    "bodyOriginal": "California Attorney General Rob Bonta canceled a meeting with Paramount Skydance on Monday, saying the company demonstrated a \"lack of good faith\" in early settlement talks around its planned merger with Warner Bros. Discovery.\n\"My office had a meeting with Paramount on Friday. Paramount did not maintain the confidentiality of that meeting. Not only did Paramount leak the alleged substance of settlement discussions, but they misrepresented these discussions, demonstrating a lack of good faith,\" Bonta said in a statement.\n\"As soon as Paramount stops playing games and engages sincerely, my office is happy to meet again,\" he said.\nBonta was scheduled to meet with Paramount representatives on Monday, he said, but canceled the meeting. The California attorney general is leading a group of states in suing to block Paramount Skydance's planned merger with WBD.\nIn a statement, Paramount said it has \"assured\" the attorney general's office that it was not the source of the leaks.\n\"We remain hopeful and stand ready to continue good faith discussions to resolve the Attorneys General suit and move forward with our plans for increased competition and increased output to the benefit of the talent and entertainment workers,\" the company said.\nA spokesperson for WBD declined to comment Monday. The New York Times first reported the Monday meeting and subsequent cancellation.\nBonta told CNBC last week he was ready to come to the table and negotiate a settlement, calling the lawsuit a \"black-and-white\" antitrust case.\n\"We do prefer to resolve cases in the boardroom instead of the courtroom, but for now we're bringing our case, and, you know, I hope they can focus on the actual allegations we make in our complaint,\" Bonta told CNBC on Thursday.\nStill, Bonta said a resolution of the lawsuit would require \"robust structural remedies\" on Paramount's part.\nBonta and 11 other state AGs filed suit in July to block the merger, alleging that the acquisition would create a media giant that would control a sizable portion of film and basic TV programming. Bonta told CNBC last week that the focus of his lawsuit is not on streaming, CNN or foreign regulators.\nParamount, which is proposing to acquire WBD for roughly $110 billion, agreed to delay the closing of the deal until as late as June 2027. A trial in the antitrust case is scheduled for March.\nParamount has previously called the lawsuit a \"misrepresentation of competition\" and has stood by its decision to acquire WBD.",

    "bodyOriginal": "Nvidia announced Monday that its Groq 3 LPX rack is in full production, marking the commercialization of technology from the company's largest acquisition on record.\nThe Groq rack will be deployed alongside Vera central processors and Rubin graphics processors at neocloud Nebius, and will be online later this year, Nvidia senior director Dion Harris told reporters.\nNvidia's race to manufacture Groq's chip and make it available to customers highlights the growing importance of low-latency inference that's needed to make artificial intelligence agents feel responsive without long lags for users, especially for coding. Cloud companies can charge more for these kinds of tokens, Nvidia says.\n\"For folks who are serving tokens, it unlocks the ability to offer premium tiers of service for those users and those customers who actually demand the most latency-sensitive\" service agreements, Harris said.\nIn December, Nvidia bought assets from chip startup Groq for $20 billion, the company's largest purchase.\nThe Groq architecture includes 500 megabytes of speedy SRAM on the chip's die itself to reduce memory-related bottlenecks. Groq chips are manufactured by Samsung, while Taiwan Semiconductor Manufacturing Co. makes Nvidia's GPUs.\nNvidia packages 256 individual Groq 3 chips into its LPX racks. Nvidia said its Groq 3 LPX rack can deliver 3,400 tokens per second, citing a benchmark from Artificial Analysis.\nIt's a competitive space. Smaller GPU maker Advanced Micro Devices announced earlier this year it would integrate its rack-scale systems with chips from Cerebras, which recently went public, focusing on low-latency inference. OpenAI's newly announced Ultrafast mode currently promises 750 tokens per second, and is \"powered by Cerebras.\"\nLow-latency chips don't replace the GPU, the workhorse of AI chips, which can do training as well as inference and are flexible enough to adapt to new technologies and models. Low-latency chips like Groq mainly focus on a part of serving models called the \"decode\" phase.\n\"This isn't about replacing GPUs,\" Harris said. \"It's about using the right price, right processor for the right part of the workload.\"\nNvidia is currently ramping up shipments of its Vera Rubin systems, which started production earlier this year. At the Vera Rubin and Groq 3 LPX unveiling in March, Nvidia CEO Jensen Huang projected $1 trillion in cumulative sales between the current-generation Blackwell chips and the new Vera Rubin systems, through 2027.\nHuang said at the time he would allocate a quarter of data center space intended for coding applications to Groq chips.\n\"The rest of my data center is all 100% Vera Rubin,\" Huang said.\nNvidia is scheduled to report earnings on Wednesday.",

    "bodyOriginal": "Rail companies sued for £5m over oil spill caused by derailment\n- Published\nNetwork Rail is suing two rail companies for more than £5m after a fuel spill caused by a train derailment threatened an \"environmental disaster\" at a designated site for protection.\nThe body filed a legal claim earlier this month against DB Cargo UK and Touax Rail over the derailment near Llangennech, Carmarthenshire, in August 2020.\nThe incident saw 10 wagons of the 25-wagon train derail, causing 446,000 litres of fuel to spill, and about 300 people had to leave the area due to the blaze.\nIn High Court documents, Network Rail claimed that the derailment occurred because the wagon had \"not been maintained with reasonable care\" and is seeking damages for negligence.\nNo one was injured, but 116,000 litres of fuel ignited while 330,000 litres drained into surrounding wetlands, which form part of a Site of Special Scientific Interest (SSSI) and a Special Area of Conservation.\nThe Rail Accident Investigation Branch (RAIB) concluded in January 2022 that the derailment was caused by a set of wheels on one of the wagons locking, likely the result of a brake defect after \"inadequate maintenance practices\" were found in the investigation.\nNetwork Rail, which owns, operates, maintains and develops Britain's railways, claimed that the derailment occurred because the wagon had \"not been maintained with reasonable care\" by Touax.\nIt is also seeking damages from DB Cargo UK, claiming that the latter \"breached a contractual duty to ensure that reasonable care was taken\" in maintaining the wagon.\nLawyers for the body said it expected to recover \"more than £5m\" with DB Cargo and Touax yet to file defences.\nA hearing in the case is due to take place.\nThe locomotive was pulling the wagons from Milford Haven, Pembrokeshire, to Theale, near Reading, when the derailment occurred.\nThe line was closed for six months after the incident and did not fully reopen for almost a year, with 30,000 tonnes of fuel-soaked soil having to be excavated.\nBill Kelly, the then-Network Rail Wales route director, said when the line fully reopened in March 2021 that work following the incident was \"one of the biggest environmental recovery operations Network Rail has ever been involved with\".\nHe added that the derailment could have caused a \"total environmental disaster\".\nThe RAIB said, in its 2022 report, that the train was travelling at about 38mph at the time of the derailment, and was carrying up to 75.5 tonnes of fuel.\nThe RAIB did not establish blame or liability for the incident, but made nine recommendations to avoid similar accidents.\nNetwork Rail and DB Cargo declined to comment, while Touax has been approached for comment.\nRelated topics\nMore top stories\n- Published3 hours ago\n- Published23 hours ago\n- Published2 hours ago",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "A Goldman Sachs partner leading one of the bank's flagship artificial intelligence projects warned that AI's spread across Wall Street risks hobbling the thinking capabilities of the next generation of financiers.\n\"There's a huge danger here that in the era of AI, we outsource our reasoning to these models, and we have cognitive atrophy that stops us being able to reason from first principles ourselves,\" said Chris Churchman, who leads Goldman's digital platform for institutional clients called Marquee.\nThe comments came during the latest episode of the firm's \"Exchanges\" podcast, according to a transcript provided exclusively to CNBC.\nJust as people lost navigation and memorization skills with modern inventions, bankers risk losing analytical abilities if algorithms handle all the heavy lifting, Churchman said.\n\"Reasoning is still important,\" he said. \"You still need to reason about [problems] and structure it into an argument, and now we're delegating reasoning.\"\nWall Street's push to enmesh AI into all of its trading and banking processes could be a kind of devil's bargain: It will make the industry more profitable today while potentially eroding the talent it needs for tomorrow. With AI taking over more of the routine work that has traditionally taught young bankers and traders how to think and make decisions, firms risk sacrificing the culture that turns junior employees into seasoned Wall Street talent.\nIt could even reduce the need for junior bankers in the first place. Last year, CNBC reported that Wall Street firms were examining ways of using AI to lower the ratio of junior bankers to senior employees.\nBanks need to find a balance between using AI and preserving Wall Street's apprenticeship culture, said Churchman, who ran currency trading at UBS before joining Goldman in 2021.\n\"You learn by doing, and a lot of knowledge is tacit, it was never written down,\" he said.\nGoldman needs \"to make sure we don't lose that tacit and intuitive knowledge that some of our best people have today [and] to ensure the next generation have it too,\" Churchman said.\nFor instance, junior traders learn by fielding client pricing requests under supervision of experienced risk takers, Churchman said.\n\"We can absolutely automate that,\" he said, \"but then do we get the senior traders that fully understand?\"\nSystems must be designed so that employees still call the shots in high-stakes, high-uncertainty decisions rather than becoming passive operators, Churchman said.\nEven Goldman, one of the world's top investment banks, hasn't yet \"figured out\" how it will manage the transition the company has begun, said Churchman, who is also co-chair of the firm's Global Banking and Markets AI working group.\nError-free?\nAlso in the podcast interview, Churchman shared lessons from implementing AI into Marquee, which is used by hedge funds and other institutional clients to access Goldman's market data, research, risk analytics and trade execution services.\nThe Marquee AI platform is only available to Goldman employees for now, he said.\nThe toughest challenge, from a technical standpoint, is in ensuring that AI answers are 100% factual and can be audited, he said. While consumer AI chatbots warn users of possible mistakes, in high finance, the tolerance for errors is low.\nChurchman said that in developing the firm's AI platform for clients, the software made a startling admission.\n\"When we challenged it hard, at least it was honest,\" Churchman said. \"It was like, 'Look, in the end, I'm better at sounding thorough than being thorough.'\"",

    "bodyOriginal": "U.S. Trade Representative Jamieson Greer on Monday said Canada was responsible for the collapse of trade-deal negotiations last week, telling CNBC that Ottawa changed its demands at the eleventh hour.\n\"We progressed to a point Tuesday night where we had enough agreement among the parties to announce that we had we had found the way to a deal,\" Greer told CNBC's \"Squawk Box.\"\n\"Then we set about to finalize it, and then in the last hours, I think there were things that the Canadians just — you know, they wanted more,\" he said.\nThe comments mirror those offered by Canadian Prime Minister Mark Carney, who had accused the U.S. of proposing \"last-minute changes\" that were \"unfair, uneconomic, and called into question the reliability of any deal.\"\nGreer spoke to CNBC three days after Canadian negotiators left Washington without a deal to prevent President Donald Trump from enacting new 50% tariffs on about $20 billion worth of goods, including imports of wine, hockey sticks, cement and other goods.\nThose duties took effect at 12:01 a.m. ET on Saturday, stoking alarm from business groups in the U.S. and Canada alike who warn that they could raise costs and wreak havoc on exposed industries.\nThis is breaking news. Please refresh for updates.",

    "bodyOriginal": "The Canadian dollar fell on Monday morning after trade talks between Ottawa and Washington fell apart, leaving both sides facing higher prices on a wide array of imported goods and threatening Canada's economic growth.\nThe U.S. on Saturday slapped 50% tariffs on around $20 billion worth of imports from Canada, its second-biggest trading partner after Mexico. The affected goods span dairy, wine, wood products, furniture, cement, ceramics and a slew of other areas.\nCanadian Prime Minister Mark Carney said he would retaliate \"dollar for dollar\" with tariffs starting Sept. 8, targeting sectors such as steel, dairy, agricultural equipment, paper and electronics. Details will be released \"in the coming days,\" Carney added.\nThe Canadian dollar was 0.58% lower against the U.S. dollar at 8 a.m. ET. The loonie also dipped against the euro, British pound and Japanese yen.\n'We got attacked'\nNegotiators had been scrambling to strike a deal all week. But rhetoric turned sour by the weekend, with each side blaming the other for failing to reach an agreement and for unfair trade practices.\nSpeaking to CNBC on Monday, U.S. Trade Representative Jamieson Greer said a deal was close, but that in the \"last hours,\" the Canadians \"wanted more\" than Washington was willing to offer.\n\"We offered them the best access to the United States of any country in the world. Obviously, there's always going to be tariffs, and there's going to be that protection for American workers and companies.\"\n\"But we sought to accommodate the Canadians by... cutting tariffs in half on steel, on aluminum, and extensively reducing them on autos, and even on things like softwood lumber, accommodating some element of that. Things that are sensitive for the Canadians. They simply... wanted more,\" Greer said.\n\"I don't know if it was political for them. It certainly doesn't make economic sense.\"\nMarkets \"understand that this affects a very small amount of trade,\" Greer added. The tariffs total around 0.6% of total U.S. goods imports.\nCarney said on Saturday that the U.S. had \"asked too much and offered too little.\"\n\"We were not prepared to compromise Canada's sovereignty or undermine our key industries,\" he said.\nWhen asked by a reporter why it felt like Canada was entering into a trade war, Carney replied: \"Because we got attacked. You're at war when you get attacked. We got attacked.\"\nTariff details in major sectors including autos, steel and aluminum were a sticking point, along with Canadian protections over use of the French language and the ability for the country to strike separate trade deals, Carney indicated in his remarks.\nThe U.S. and Canada export tens of billions in agricultural products to one another each year, while their auto industries are deeply entwined. The U.S.'s $48.3 billion trade deficit with Canada is in large part due to its significant imports of Canadian natural gas, electricity and crude oil.\nLike the European Union during its own protracted trade negotiations with the Trump administration, Ottawa argues that its trade relationship with the U.S. shifts into deficit once services are included.\n\"Canada wants the benefits of being a State, without being one!!!,\" U.S. President Donald Trump said in a post on Truth Social on Sunday. \"They have also charged our great farmers, for many years, massive amounts of Tariffs. No more!!!\"\nEconomic impact\nCanada's smaller, more trade-oriented economy is more vulnerable to the escalation than that of the U.S., economists said Monday.\nDespite suggestions that he will enact fiscal measures to support businesses, Carney said this weekend that the duties would \"raise costs and reduce choice for Canadians.\"\nThe tariffs only apply to 5% of Canada's goods exports to the U.S., meaning \"it isn't a hammer blow, but for many individual companies it will be devastating,\" ING's chief international economist James Knightley said.\n\"For many small and medium size companies, particularly in border states,\" of the U.S., meanwhile, \"this is very bad news,\" Knightley said.\nBradley Saunders, North America economist at Capital Economics, said that the most exposed industries in Canada \"could be crippled\" by the high levies.\nThere is no longer an exemption for goods that comply with production rules set out in the United States-Mexico-Canada Agreement (USMCA) — a trilateral deal that is currently under renegotiation — as there has been in previous rounds of tariffs since Trump's \"Liberation Day\" in April 2025.\nThough the targeted goods only comprise around 0.6% of Canada's gross domestic product, \"a collapse in exports would still be enough to push already-weak GDP growth back towards zero,\" Saunders said.\n\"This would especially be the case if weaker U.S. demand for finished items such as furniture and electrical equipment had knock-on effects on upstream primary industries, which are already struggling under the strain of Section 232 tariffs.\"\nThe situation could escalate further if Trump retaliates to Canada's countermeasures, Saunders added, estimating that extending a 50% tariff rate to a fifth of Canada's U.S. goods exports, from 5% currently, could knock around 2% from Canadian GDP and push it into recession territory.\nChristian Lawrence, chief cross-asset strategist and head of Americas and energy markets research at Rabobank, said that the existing package would have little impact on the U.S., but there was a risk if Ottawa opted to take a more aggressive stance on other goods.\n\"But, this is where lies Canada's difficulty. Diversifying away from the world's largest consumer sitting on your doorstep is impossible to do in a truly meaningful way,\" Lawrence said.\nDespite the potential economic hit, Carney's stance was welcomed by many in Canada, where recent polling suggests a majority of the public support a hard line in U.S. negotiations, but a growing number are fearful of their job security. Ongoing U.S. tariffs of 50% could cause around 90,000 job losses, according to Canadian economist Trevor Tombe.\nCarney was elected in March 2025 in large part on a pledge to stand up to the White House. It came as reports of Canadians removing U.S. alcohol from store shelves highlighted the sour relations between the North American neighbors.\nPierre Poilievre, leader of the opposition Conservatives, said on social media on Saturday that Canada \"cannot accept one-sided tariffs that will deindustrialize our country.\"",

    "bodyOriginal": "The Treasury could use its near $1 trillion General Account to help fund its recently announced plans to increase purchases of government bonds, according to two senior Treasury officials.\nUsing the TGA would provide the Treasury with considerable firepower to influence long-term bond yields. The Treasury surprised markets last week with an announcement that it would be doubling the size of buybacks of off-the-run securities on the long end from $2 billion to at least $4 billion. Treasury Secretary Scott Bessent said on CNBC such operations could be even larger than the new higher minimum.\nHowever, the Treasury made no mention of how it would fund the purchases. Most market participants assumed it would do so by selling short-term bills. The senior Treasury officials did not rule that out. Bessent in the CNBC interview called the operation a \"Treasury Twist,\" a reference to a government or Federal Reserve operation where long-term Treasurys are bought and paid for with short-term issuance. That also implied that short-term bonds would be sold.\nBut since the surprise announcement, bonds have retreated from an initial rally, sending yields higher, in part because of skepticism voiced by many market analysts about how effective the operation would be and whether the Treasury's resources were too limited.\nUsing the TGA could change that perception. The TGA is essentially the government's checking account, a rainy day fund of sorts held at the Federal Reserve. It is already funded with existing tax collections. Bessent has built up the TGA to around $950 billion currently, compared with a stated goal under the Biden administration of around $550 billion to $600 billion.\nThe officials would not say how much, if any, of the TGA would be used or when such an announcement could be made. There was no implication it could be used beyond the purchase of off-the-run securities that were the focus of last week's announcement.\nBut they were clear that it is considered to be available.\nDon't need the Fed's help\nThe TGA's size is discretionary. When Janet Yellen ran the Treasury, officials said the goal was to set the TGA at a \"week ahead of cash needs.\" The current Treasury says it sets the account \"consistent with Treasury's long-standing cash balance policy.\" Assuming any of it is used, and the Bessent Treasury wanted to maintain the near $1 trillion level, additional bonds would have to be sold to build it back up.\nBut running it somewhat lower would not appear to entail any immediate risk. Reducing the TGA would mean the government would have less cash on hand in the event of a new debt ceiling impasse. But the latest estimates are that a new limit won't be hit until the winter of next year and perhaps not until the early spring. That would give time to build it back up if needed. Meanwhile, bond yields could be influenced by even a small use of the TGA or even just the recognition that the Treasury would use it to buy government bonds.\nIt also would limit any concern, also voiced by some bond market participants, that the Fed could be asked to help the Treasury in such operations. (The Fed holds the TGA like a bank, but does not consider it part of its monetary policy toolkit.)\nThe Treasury officials pushed back on criticism that the Treasury, in its surprise announcement, had abandoned its long-standing practice of being \"regular and predictable\" about bond sales and that it was gaming the market. The announcement of the enhanced buybacks came two weeks after the quarterly refunding announcement, when such information would normally be relayed to markets.\nBut the senior officials said that no change had been made to the actual official auction schedules. They added that the announcement was made nearly three weeks before the first operation will take place on Sept. 9, giving markets time to prepare. The Treasury also announced the plan for the entire quarter in its Aug. 19 announcement.\nThey added that since the first auction is not scheduled until Sept. 9, it was too early to judge the market impact.\nBessent told CNBC last week that the Treasury's intent was to get the market to \"focus on the fundamentals and not trade the headlines during … a quiet period in a thin market. So we are trying to keep the market in equilibrium.\"\nHe said he expected progress in the deficit when tariff revenue returns after court-mandated refunds are replaced by new tariffs. And he said that top officials would be meeting soon to forge plans that would improve the fiscal situation.",
    "bodyJa": "財務省高官２人によると、財務省は最近発表した国債買い入れ増額計画の資金調達に１兆ドル近い一般会計を活用する可能性がある。\nTGAを活用すれば、財務省は長期債利回りに影響を与える大きな力を得ることができるだろう。財務省は先週、長期でのオフザラン証券の買い戻し規模を20億ドルから少なくとも40億ドルに倍増すると発表し、市場を驚かせた。スコット・ベッセント財務長官はＣＮＢＣで、こうしたオペは新たな上限よりもさらに大規模になる可能性があると述べた。\nしかし、財務省は購入資金をどのように賄うかについては言及しなかった。ほとんどの市場参加者は、短期証券の売却によってそうなると予想していた。財務省高官らはその可能性を排除しなかった。ベッセン氏はCNBCのインタビューで、このオペを「財務ツイスト」と呼び、長期国債を買い取って短期発行で支払う政府や連邦準備理事会のオペに言及した。これは短期債が売却されることも示唆した。\nしかし、このサプライズ発表以来、債券価格は当初の上昇から後退し、利回りが上昇している。これは、このオペがどれほど効果的か、また財務省の資金が限られすぎているのではないかと多くの市場アナリストが懐疑的な声を上げていることも一因だ。\nTGA を使用すると、その認識が変わる可能性があります。 TGAは本質的には政府の当座預金口座であり、連邦準備制度が保有するある種の緊急資金である。その資金はすでに既存の税金徴収によって賄われています。ベッセント氏はTGAを現在約9,500億ドルまで積み上げているが、バイデン政権下での目標目標は約5,500億～6,000億ドルとなっている。\n関係者らは、TGAが使用されるとしても、どれくらいの量が使用されるのか、またそのような発表がいつ行われるのかについては明らかにしていない。先週の発表の焦点だったオフ・ザ・ラン証券の購入以外に使用できるという意味合いはなかった。\nしかし、それが利用可能であると考えられていることは明らかでした。\nFRBの助けは必要ない\nTGA のサイズは任意です。ジャネット・イエレン氏が財務省を運営していたとき、当局者らはTGAを「現金需要より1週間前」に設定することが目標だったと述べた。現在の財務省は、この口座を「財務省の長年にわたる現金残高政策と一致する」ものに設定していると述べている。仮にそのいずれかが使用され、ベッセント財務省が1兆ドル近い水準を維持したいと考えた場合、それを取り戻すために追加の債券を売却する必要があるだろう。\nしかし、それをいくらか低く設定しても、差し迫ったリスクは生じないようだ。 TGAの削減は、新たな債務上限に行き詰まった場合に政府の手元資金が減少することを意味する。しかし、最新の予測では、新たな制限に達するのは来年の冬、おそらくは春先までではないだろう。そうすれば、必要に応じてバックアップを構築する時間が得られます。一方、債券利回りは、TGAのわずかな利用や、財務省が国債購入にTGAを利用するという認識だけでも影響を受ける可能性がある。\nまた、一部の債券市場参加者からも表明されている、FRBがこうした業務において財務省の支援を求められる可能性があるという懸念も抑制されるだろう。 （FRBはTGAを銀行と同様に保有していますが、金融政策ツールキットの一部とは考えていません。）\n財務省当局者らは、財務省が突然の発表で、債券販売について「定期的かつ予測可能」とする長年の慣行を放棄し、市場を欺いているのではないかとの批判を押し返した。自社株買い強化の発表は、通常であればこうした情報が市場に伝えられる四半期払い戻しの発表から２週間後に行われた。\nしかし高官らは、実際の公式オークションのスケジュールには変更はなかったと述べた。また、この発表は9月9日に最初のオペが行われる約3週間前に行われたため、市場に準備する時間が与えられたと付け加えた。財務省は8月19日の発表で四半期全体の計画も発表した。\nまた、第１回入札は９月９日まで予定されていないため、市場への影響を判断するには時期尚早だと付け加えた。\nベッセント氏は先週CNBCに対し、財務省の意図は市場に「ファンダメンタルズに集中させ、市場が低迷している閑散期にはヘッドラインを取引しないようにすることだった。そのため、我々は市場の均衡を保とうとしている」と語った。\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Trump Media interim CEO Kevin McGurn on Monday defended his company offering faster access to President Donald Trump's Truth Social posts, and said more customers have signed up for the pricey and controversial service.\n\"We're getting into the mid-teens now, and we're climbing,\" McGurn told CNBC's \"Squawk Box\" when asked if more companies had started paying for the service dubbed Truth API, which costs up to $100,000 per month.\nThat's an increase from two weeks earlier, when McGurn said in Trump Media's first-ever quarterly earnings call that \"more than 10\" customer agreements had been signed. The service went live on Aug. 1.\nTruth API has garnered intense scrutiny from critics who argue that since the president often makes market-moving announcements through his Truth Social account, the service effectively lets deep-pocketed firms trade on valuable information before the rest of the public. Trump is a top shareholder in TMTG, with his stake being held in a revocable trust.\nThis is breaking news. Please check back for updates.",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.投資家にとって、借り手のハードルレートを上げるのと同じように、国債に埋め込まれた実質利回りが増大することは、債務の所有者に支払われる補償を意味する。したがって、株式の多様化手段としての債券の役割に従来の通念が反するのと同じように、債券には価値が蓄積されているのだろうか？",
    "bodyOriginal": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\nIt's a ripe summer in the American economy, and the AC thermostat hangs in the hottest room in the house, the kitchen, where the sun streams in and the oven is always set to broil.\nThe thermostat in this case is the bond market, working to offset the blistering demand for debt from governments and companies by raising borrowing costs to multiyear highs. The kitchen is the AI-buildout sector, desperate to turn some $2 trillion into vast reserves of computing capacity by the end of next year.\nThe lift in bond yields isn't having much effect in moderating the pace of capital-raising and corporate investment. But it could threaten to overcool other parts of the economy, such as housing and Main Street spending.\nThis is the backdrop in which Treasury Secretary Scott Bessent sought to restrain longer-term Treasury yields last week by expanding an existing program to buy back small amounts of less-liquid government debt in the open market.\nThe move prompted a rather overheated response from market participants and commentators, as either a bad look for a Treasury Secretary who had charged his predecessor with untoward massaging of market rates, or too small to matter, or both. The criticism intensified after the initial drop in yields reversed a day later, while sharp declines in the U.S. dollar and jump in gold prices held, a combination that could be read as a vote of no confidence in the stewards of the financial-policy apparatus.\nAnd, of course, the selloff in bonds inevitably inflames worry over a long-threatened fiscal breakpoint becoming reality. Unease over the U.S.'s ability to finance structural deficits is like an autoimmune condition: It flares up under the stress from adverse market stimuli, such as overheating capex and war-inflation feedback loops, then often goes dormant again.\nBut would it come as a surprise to learn that the 10-year Treasury yield's rise last week amounted to a mere 4 basis points, to 4.74%? That the yield has been up here before a couple times over the past three years, if only briefly? What about the fact that the yield on investment-grade corporate debt remains below its peak from a few years ago, because spreads over Treasuries are so snug?\nThe absolute yield level isn't broadly punitive yet to big companies. Nor, for now, is it a strong undertow pulling down equity values. With nominal GDP growth (real growth plus inflation) running near 5-6% right now, how much lower would one expect 10-year yields to be? The steepness of the yield curve is likewise not extreme relative to historical ranges.\nSo why all the fuss?\nThe orderliness of the move so far has allowed the stock market to hang relatively tough for now. There are no clear trigger thresholds for yields that instantly undercut equities, even if equity investors are watching warily.\nThe textbooks say the cycle high in real yields – the 30-year real yield, or nominal yield minus market-projected inflation, now exceeds 3% – should act as a restraint on economic growth and equity valuations. Such effects can be subtle, long-gestating and offset for a time by exciting corporate growth in the here and now.\nIt's also important to recognize that the S&P 500 has lived pretty comfortably in that same sweltering kitchen with the AI builders. About a third of its recent earnings growth is directly from AI infrastructure companies. It truly is a capital-goods and business-to-business benchmark more than a gauge of broad U.S. consumption. The consumer-discretionary sector makes up 9.2% of the S&P, but its weight drops below 4% if AI/tech proxies Amazon and Tesla are excluded.\nThus, the market hovers within a couple of percent of record highs, even as last week showed July housing starts fell 12.4% and Walmart posted its weakest quarterly comparable-store sales growth since 2020.\nThis isn't to suggest the underlying economy is struggling broadly; not at all. Consumer-spending growth oscillates in a stable range, unemployment is low, the aggregate consumer debt-service burden manageable.\nYet wage growth is sagging while inflation remains elevated, tax-refund windfalls are in the past and the real juice in the economy remains corporate spending fueled by ample earnings – a capital-over-labor dynamic that makes rising interest rates play to the public as an exacerbating factor on \"affordability\" rather than a positive sign of household-sector momentum.\nCountertrend rally in bonds?\nFor investors, the same fattening of real yields embedded in Treasuries that raises the hurdle rate for borrowers represents compensation paid to the owners of the debt. Is value therefore building in bonds, just as conventional wisdom turns against their role as a diversifier for equities?\nBarry Knapp of Ironsides Macroeconomics notes the latest climb in yields has occurred in the face of softer inflation and employment readings and spottier consumer data: \"Although we continue to be secular bond bears, and do not view the Treasury Secretary's actions as a significant positive catalyst, we still think there is scope for a countertrend rally in long maturity [Treasuries].\"\nThe S&P 500 did slouch 1.4% last week as the bond market dominated the chatter. Equity investors are watching the bond market ration capital through higher yields to the public and private sectors. The main thing stock folks are worried about – the voracious consumption and headlong deployment of capital for AI – is now the thing lifting rates and potentially restraining growth elsewhere.\nSemiconductor stocks fell more than 5%, their rebound rally stopping right at \"logical\" resistance levels, while there was some slippage in the market's clockwork rotations. Banks did not love the Treasury-market ructions, sliding 4%. Industrials, a pricey shadow AI play, lost more than 3%. The S&P 500 itself receded back toward the top of its prior multi-month range that held from May through July before bouncing modestly.\nRick Bensignor, a veteran macro and technical strategist now at Bensignor Investment Strategies, reads the tape as saying that tech has peaked in relative terms and healthcare and financials are better positioned. He spies some technical warnings in the action: \"The S&P 500 shows 10 of the last 13 sessions with 'closed' candles, suggesting real institutional selling after the Aug. 4 upside breakout day. If Nvidia doesn't bring new material buying [with its results on Wednesday], I really raise the caution flag.\"\nMarket Temperature Gauge\nThis indicator from John Kolovos of Macro Risk Advisors uses several data points to reflect both what investors are saying and what they are doing.\nKolovos on the latest reading: \"A jump in sentiment partially explains this week's pullback in stocks. Of concern remain low levels of implied volatility, while sentiment surveys are starting to show more bullish respondents. We've been advocating tactical VIX call spreads as an insurance policy despite my bullish forecast for the market.\"\nAround the Street\n— \"The Money Game,\" by the writer who published under Adam Smith, is rightly esteemed as one of the best chronicles of Wall Street ever set to paper. Appearing in 1968, it captures a previous technology boomtime in the markets, when mainframe computers (and space-and-defense tech) were exciting imaginations and inflating valuations.\nThe discussion of today's \"circular financing\" of customers' tech purchases by the big hardware manufacturers finds an echo in this anecdote, in which a grizzled veteran asks a \"kid\" investor how he made a 100x profit in six months:\n\"Computer leasing stocks, sir!\" he said, like a cadet being quizzed by an upperclassman. \"The need for computers is practically infinite,\" said Billy the Kid. \"Leasing has proved the only way to sell them, and computer companies themselves do not have the capital. Therefore, earnings will be up 100% this year, will double next year, and will double again the year after that. The surface has barely been scratched. The rise has scarcely begun.\"\n— The Wall Street Journal delivers an engaging obituary of Victor Niederhoffer, a roguish, infamous trader who lived a vivid life and died earlier this month.\nNiederhoffer would email me now and then back when I wrote a column for Barron's, typically delivering a patronizing backhanded compliment suggesting one of my pieces showed that I \"almost got it.\"\nHis most acute scorn was reserved for my then-colleague, Alan Abelson, the longtime lead columnist and former Barron's editor known for his florid, literate and persistent bearishness. Vic likened Alan to \"a priest who doesn't believe in God – a stock-market writer who hates the stock market.\"\nVic never hated the market, but it didn't always love him back: He made and lost two fortunes, blowing up by effectively shorting volatility before market collapses.\nMarket on Close\nThe way earnings growth has outraced rising stock prices in recent quarters has allowed bullish voices to celebrate valuation compression done the easy way.\nThis is true if focusing on the standard price-to-earnings ratio, which has ebbed from 23 to 20 in the past 10 months. But, as we know, the biggest earners are reinvesting furiously to bankroll the AI buildout. Now what's scarce, along with memory chips and gas turbines, is free cash flow.\nHere we see the S&P 500 price-to-free-cash-flow ratio, using projected FCF, sitting just under 30, a multi-decade high.\nAnother way to express this: Stocks have a free cash flow yield of 3.4% as 10-year Treasuries sit at 4.74%.\nThe corporate cash burn is largely a choice, of course, though the heavyweight tech platforms are not behaving as if they see plausible alternatives to competing in the arms race toward superintelligence. Or at least to accrue enough data center capacity to rent to those trying to create a new collective consciousness out of silicon.\nSUBSCRIBE TO MIKE SANTOLI'S MARKET MEMO HERE",
    "bodyJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n投資家にとって、借り手のハードルレートを上げるのと同じように、国債に埋め込まれた実質利回りが増大することは、債務の所有者に支払われる補償を意味する。したがって、株式の多様化手段としての債券の役割に従来の通念が反するのと同じように、債券には価値が蓄積されているのだろうか？\nアイアンサイズ・マクロエコノミクスのバリー・ナップ氏は、最近の利回り上昇はインフレや雇用統計の鈍化、消費者統計のばらつきに直面して起きたと指摘し、「われわれは引き続き長期債弱気派であり、財務長官の行動が大きなプラスの触媒とは考えていないが、長期債（国債）には逆トレンド上昇の余地があると依然として考えている」と述べた。\n先週、債券市場が話題を独占したため、S&P 500は1.4％下落した。株式投資家は、債券市場が官民セクターへの利回り向上を通じて資本を配分することに注目している。株式関係者が最も懸念しているのは、貪欲な消費とAI向けの資本の無謀な展開であり、現在は金利を押し上げ、他の分野の成長を潜在的に抑制している。\n半導体株は5％以上下落し、市場の時計仕掛けの回転に多少のズレがあったものの、その反発反発は「論理的な」抵抗水準で止まった。銀行は米国債市場の混乱を好まず、４％下落した。シャドウ AI の高価な銘柄であるインダストリアル株は 3% 以上下落しました。 S&P 500 自体は、5 月から 7 月にかけて維持されていた過去の複数か月レンジの上限に向けて後退し、その後小幅に反発しました。\n現在ベンシナー・インベストメント・ストラテジーズのベテランマクロ・テクニカルストラテジストであるリック・ベンシナー氏はテープを読み上げ、テクノロジーは相対的にピークに達し、ヘルスケアと金融はより良い立場にあると述べた。同氏は、この動きの中でいくつかの技術的な警告を察知した。「S&P 500は、過去13セッションのうち10セッションが『閉じた』ローソク足で示されており、8月4日の上値ブレイクアウト日以降に実際に機関投資家が売りを出していることを示唆している。もしエヌビディアが（水曜日の結果で）新たな材料の買いをもたらさなければ、私は本当に警戒旗を掲げることになる。」\n市場温度計\nマクロ リスク アドバイザーズのジョン コロボス氏によるこの指標は、投資家の発言と行動の両方を反映するためにいくつかのデータ ポイントを使用しています。\nコロヴォス氏は最新のデータについて「センチメントの急上昇が、今週の株価下落を部分的に説明している。懸念されるのは、インプライド・ボラティリティの低水準が続いている一方、センチメント調査では強気の回答が増え始めていることだ。私は市場に対して強気の予測をしているにもかかわらず、保険として戦術的なVIXコール・スプレッドを提唱してきた。」と述べた。\nストリートの周り\n— アダム・スミスの下で出版した作家による『ザ・マネー・ゲーム』は、これまでに紙化されたウォール街の最高の年代記の一つとして正当に評価されている。 1968 年に登場したこの製品は、メインフレーム コンピューター (および宇宙および防衛技術) が刺激的な想像力を持ち、評価をつり上げていた、市場における以前のテクノロジー ブームの時代を捉えています。\n大手ハードウェアメーカーによる顧客の技術購入に対する今日の「循環融資」に関する議論は、白髪交じりの退役軍人が「子供」投資家にどうやって半年で100倍の利益を上げたかを尋ねるこの逸話に反響がある。\n「コンピューターリース株ですよ、先生！」彼はまるで上級生に質問される士官候補生のように言った。 「コンピューターの必要性は事実上無限です」とビリー・ザ・キッドは言いました。 「リースがそれらを販売する唯一の方法であることが証明されており、コンピュータ会社自体には資本がない。したがって、今年の利益は100％増加し、来年は2倍、再来年はさらに2倍になるだろう。まだ表面はかろうじて表面をなぞったばかりだ。上昇はまだ始まったばかりだ。」\n— ウォール・ストリート・ジャーナルは、生き生きとした生涯を送り、今月初めに亡くなった悪名高きトレーダー、ヴィクター・ニーダーホッファーの魅力的な死亡記事を報じた。\n私が本誌にコラムを書いているとき、ニーダーホッファーは時々私にメールを送ってきて、たいてい私の記事の一つが私が「ほぼ理解している」ことを示唆するような恩着せがましい裏返しの褒め言葉を送ってきた。\n彼の最も痛烈な軽蔑は、私の当時の同僚、アラン・エイベルソンに対するものであった。彼は長年主席コラムニストを務め、聡明で文才があり、粘り強い弱気な態度で知られる元バロンズ編集者だった。ヴィックはアランを「神を信じない司祭、株式市場を嫌う株式市場ライター」に例えた。\nヴィックは決して市場を憎んだことはありませんでしたが、市場が常に彼を愛し返してくれたわけではありません。彼は 2 つの財産を築き、また失い、市場が崩壊する前にボラティリティを効果的に空売りして爆破しました。\n市場はクローズ\nここ数四半期、利益の伸びが株価の上昇を上回っていることから、安易な方法で行われた評価圧縮を称賛する強気の声が許容されている。\nこれは、過去 10 か月で 23 倍から 20 倍に低下した標準株価収益率に注目すると当てはまります。しかし、ご存知のとおり、最大の稼ぎ手は AI の増強に資金を提供するために猛烈な勢いで再投資しています。現在、メモリチップやガスタービンと並んで不足しているのは、フリーキャッシュフローだ。\nここでは、予測FCFを使用したS&P 500の株価対フリーキャッシュフロー比率が30をわずかに下回っており、数十年ぶりの高水準となっている。\nこれを別の言い方で表現すると、10年国債のフリーキャッシュフロー利回りが4.74%であるのに対し、株式のフリーキャッシュフロー利回りは3.4%です。\nもちろん、企業のキャッシュバーンは主に選択だが、大手ハイテクプラットフォームは、超知性を目指す軍備競争に参加するためのもっともらしい選択肢を見ているかのように振る舞っているわけではない。あるいは、少なくとも、シリコンから新たな集合意識を創造しようとする人々に貸すのに十分なデータセンターの容量を確保するためだ。\nここからマイク・サントリのマーケットメモを購読してください",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "United Parcel Service is investing more than $2 billion into its business across its international, healthcare and supply chain solutions businesses, the company told CNBC exclusively on Monday.\nThe ongoing investments began in 2024 and will continue through 2028, but UPS said it had not previously disclosed the total investment. The shipping giant said the aim is to help businesses move faster and stay adaptable to changing macroeconomic pressures and global supply chain disruptions.\n\"These investments are really aligned to one of our big strategic areas of focus, which is creating capabilities to enable our customers, particularly in complex industries, to more effectively run their global supply chains,\" Scott Szwast, vice president of international strategy, told CNBC.\nSome of the projects under the investment include a new hub in the Philippines this year, a new Canadian facility opening next year in Ontario and a new air hub at Hong Kong International Airport in 2028.\nUPS has launched a tech-enabled logistics center in Taiwan and a supply chain solutions facility in Amsterdam that combines freight, brokerage and cold-chain solutions. Szwast said the new logistics center in Taiwan has been able to leverage automation and robotics to increase the total supply chain speed by a day.\nThe logistics company also said it now has flights running five times a week between Paris and Hong Kong and between Shenzhen, China, and Sydney to meet growing demand.\nSzwast said as global supply chains get more complicated, certain global markets, like those across Asia, are becoming more important for companies than they were before.\n\"What they find in a lot of cases is that their supply chains look more like their histories than their strategies,\" he said. \"They need very agile, very effective solutions to connect these new parts of their businesses. They need a lot of optionality and a lot of flexibility, and that's what we're investing in.\"\nUPS also recently announced a $48 million investment into 27 temperature-controlled facilities across its network to supplement its healthcare initiatives, including the shipment of temperature-sensitive medications like GLP-1 drugs. That announcement came as logistics companies around the globe are racing to stay ahead of growing demand in niche areas like cold-chain storage.\nEspecially as macroeconomic pressures disrupt global supply chains, Szwast said, businesses have been increasingly trying to ensure they don't have \"all their operational eggs in one basket.\" At the same time, those companies are also innovating new products with new shipping needs at rates not seen before, he added.\nSzwast said the investments will help UPS differentiate its end-to-end logistics offerings, ensuring the logistics company can equip businesses from the first step to the last step of the shipping process.\n\"We're investing to give them tailored capabilities aligned to the needs of their specific industries that cover the markets they're increasingly sourcing from and distributing to, and do it in a way that they can make commitments to their customers,\" Szwast said.",

    "title": "Graduate job vacancies drop by almost 50% in a year, survey suggests",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Graduate job vacancies drop by almost 50% in a year, survey suggests\n- Published\nThe number of graduate jobs has fallen almost in half in the past year, according to new figures, as employers cut entry-level roles in favour of AI and battle rising costs.\nJobs website Adzuna said it had just 8,383 graduate vacancies listed in July, down from 15,397 at the same point last year.\nAdzuna also found competition among job seekers across all levels is rising, with an average of 2.14 job seekers per vacancy in July, up from 1.93 a year earlier.\nBusinesses have said employer national insurance and minimum wage hikes have made hiring more expensive, particularly for junior staff.\nThe number of graduate vacancies listed hit its lowest level since Adzuna started recording such data in 2016. The firm pointed to a peak for graduate roles in 2017, when it had more than 55,800 listed on its website. That is more than six times the number of roles listed on the site in July.\nAndrew Hunter, the co-founder of Adzuna, said the figures show \"employers still haven't found a reason to open up hiring\" for recent graduates.\nOfficial figures show the UK's youth unemployment rate - which covers 16-to-24-year-olds - was 16.2% in the three months to March 2026. The number of young people not in education, employment or training (Neet) is now over one million.\nYoung people have told BBC News previously they have applied for hundreds of jobs before even receiving a response.\nThey also expressed frustration at the growing number of employers using AI to screen applications.\nMany university graduates also face mounting student debt.\nFormer government minister Alan Milburn is leading a major review of the youth unemployment crisis. He has previously said the number of entry-level jobs is shrinking, as is the number of part-time jobs traditionally filled by teenagers and students.\nThe Adzuna data also showed vacancies for jobs in travel, teaching and construction rose in recent weeks.\nBut sectors including healthcare, nursing, hospitality and logistics posted fewer vacancies.\nPrime Minister Andy Burnham recently changed the rules for public contracts so that companies bidding for them have to show how they will create jobs and training opportunities.\nGet in touch\nAre you looking for work?",

    "bodyOriginal": "Iran faces 'greatest financial offensive ever', says US treasury secretary\n- Published\nThe US treasury secretary has threated Iran with \"the single greatest financial offensive ever\", claiming the US-Israel war with Iran was \"entering its endgame\".\nScott Bessent said the US would sever all economic ties with the country in \"an economic D-Day\" and that any nation partnering with Iran financially would also be isolated.\nBessent's threat to the Iranian regime follows several U-turns and extended deadlines from US President Donald Trump's administration on previous threats.\nIran dismissed Bessent's comments and said it would shut down all oil exports from the region \"if the war continues\", according to news agency Reuters.\nThe Iranian regime has also issued a new warning to shipping not to pass through the Strait of Hormuz without its permission, the agency reported.\nOne fifth of the world's oil and gas usually passes through strait, a waterway south of Iran, but the flow has been effectively blocked by the country since the conflict began at the end of February.\nBessent made the comments in an opinion piece for the Financial Times, external. He did not detail what the economic pressure on Iran would involve, but he is expected to do so in a press conference in the US at 13:00 local time (18:00 BST) on Monday.\n\"The world should understand that our objective is to sever every economic lifeline that sustains the tyrannical regime until Tehran stands alone,\" he wrote in the piece.\nThe US has made several threats to Iran over the course of its war with the country, including Trump saying in April that \"a whole civilisation will die tonight\" unless Iran agreed a deal to end the war and unblock the Strait of Hormuz.\nThe US eventually climbed down from that position after mediator Pakistan intervened and called for more diplomacy.\nThe Iranian regime already faces tough economic sanctions from the US.\nFormer US president Barrack Obama and several US allies had agreed a deal with the country in 2015 which lifted many sanctions in return for Iran agreeing to limit its nuclear programme.\nHowever, Trump pulled out of that deal in 2018, calling it \"defective at its core, and reimposed all US sanctions on Iran.\nDuring Joe Biden's term as US president, he made some attempts to reinstate the Obama-era deal, but this did not happen.\nIn April this year, the Trump administration launched a wave of sanctions on foreign banks and firms doing business with Tehran after it became clear its military operations had not caused Iran's regime to surrender.\nRelated topics\n- Published23 November 2021\n- Published3 days ago",

    "summaryJa": "クロスカントリー列車の運行は停電後に再開- 公開されました",
    "bodyOriginal": "CrossCountry train services resume after outage\n- Published\nTrain operator CrossCountry says it expects to run a full service on Monday after cancelling nearly all of its UK services the day before following a power cut at its control centre.\nThe outage in Birmingham at the weekend brought disruption from Glasgow to Penzance.\nMajor routes were affected between Birmingham and Manchester, which pass through Stoke-on-Trent, Coventry and Wolverhampton. Journeys from Leeds to York and Cheltenham to Cardiff were also caught in the travel chaos, leaving passengers frustrated.\nOn Monday morning, CrossCountry reported a handful of service cancellations, although these were put down to trains departing late and staff shortages.\nCustomers are advised to check their journey before travelling.\nThe operator on Sunday thanked passengers for their patience and understanding during the disruption.\nTickets purchased for travel on CrossCountry services on Sunday will be valid for travel on CrossCountry services until Wednesday, the company has said.\nOn Sunday, a range of personal experiences were shared by passengers.\nAndy Burton, from Worcester, was travelling back from Cromford to Worcester after spending the weekend away with family celebrating his sister's birthday, but only got as far as Derby before his journey came to a premature end.\nHe was forced to stay the night in a budget hotel in the hope he could return home on Monday.\n\"It was only once I had arrived at Derby that a member of staff told me my planned alternative route via Leicester had also been cancelled, because it was part of the CrossCountry disruption,\" he said.\n\"I soon realised I was stranded, as they said there was no alternative train route back to Worcester.\n\"It's not the best end to a great weekend away.\"\nReese Proctor described the cancellations as \"frustrating and unacceptable\" as he tried to get to Manchester's Etihad Stadium in time for a 14:00 BST kick-off against Bournemouth.\nHe had hoped to get a train from Reading to Manchester, but instead resorted to driving more than 100 miles to his friend's house in Leicester before driving on to the stadium.\nThe 22-year-old told BBC Newsbeat the drive had added an extra two hours to his journey, leaving him \"fuming\".\nA number of services resumed on Sunday evening, including an hourly train service from Birmingham New Street to Leicester and Derby.\nOn Sunday, Transport Secretary Heidi Alexander said she was \"concerned\" by the situation.\nShe said: \"We are setting up Great British Railways and nationalising services, including CrossCountry next year, to end decades of fragmentation and vulnerability on our network. We are determined to give passengers the reliability they deserve.\"\nThe National Union of Rail, Maritime and Transport Workers (RMT) has called for a review of railway operational control centres following the disruption, \"to ensure they remain unaffected by power outages\".\nRMT general secretary Eddie Dempsey said passengers and rail workers should not have to face another week of \"travel chaos\" because of unreliable back-up systems.\nCrossCountry was ranked Britain's worst rail operator in June.\nGet in touch\nHave you been affected by the disruption?\nFollow BBC Birmingham on BBC Sounds, Facebook, external, X, external and Instagram, external.\n- Published18 June\n- Published29 April\n- Published11 February",
    "bodyJa": "クロスカントリー列車の運行は停電後に再開\n- 公開されました\n鉄道運営会社クロスカントリーは、前日に管制センターの停電を受けて英国でのほぼすべての運行を中止したが、月曜日には全運行する予定だと述べた。\n週末にバーミンガムで起きた停電により、グラスゴーからペンザンスまで混乱が生じた。\nストークオントレント、コベントリー、ウルヴァーハンプトンを通るバーミンガムとマンチェスター間の主要路線が影響を受けた。リーズからヨーク、チェルトナムからカーディフへの旅も旅行の混乱に巻き込まれ、乗客は不満を感じた。\n月曜朝、クロスカントリーは数件の運行中止を報告したが、その原因は列車の出発遅延と人員不足だった。\nお客様は旅行前に自分の行程を確認することをお勧めします。\n運行会社は日曜日、混乱時の忍耐と理解を乗客に感謝した。\n同社によると、日曜日にクロスカントリーサービスでの旅行のために購入したチケットは水曜日までクロスカントリーサービスでの旅行に有効だという。\n日曜日、乗客たちはさまざまな個人的な経験を共有した。\nウースター出身のアンディ・バートンさんは、妹の誕生日を祝うために家族と週末を過ごした後、クロムフォードからウースターに戻る途中だったが、ダービーまでしか到達せずに旅は途中で終了した。\n彼は月曜日に帰宅できることを願って、安宿に一晩泊まることを余儀なくされた。\n「ダービーに到着して初めて、スタッフから、計画していたレスター経由の代替ルートも中止になったと告げられた。クロスカントリーの混乱の一環だったからだ」と彼は語った。\n「ウースターに戻る別の鉄道ルートはないと言われたので、私はすぐに立ち往生していることに気づきました。\n「素晴らしい週末を過ごす最高の終わり方ではないね。」\nリース・プロクター監督は、ボーンマス戦の英国標準時間14時キックオフに間に合うようにマンチェスターのエティハド・スタジアムに到着しようとしていた際に、今回のキャンセルは「もどかしく、受け入れがたい」と述べた。\n彼はレディングからマンチェスターまで電車で行くことを望んでいましたが、代わりにレスターの友人の家まで160マイル以上車で向かい、その後スタジアムへ向かいました。\n22歳の彼はBBCニュースビートに対し、ドライブのせいで移動時間がさらに2時間長くなり、「イライラしていた」と語った。\n日曜日の夜には、バーミンガム・ニューストリートからレスターやダービーへの1時間ごとの列車運行など、多くの運行が再開された。\nハイジ・アレクサンダー運輸長官は日曜日、この状況を「懸念している」と述べた。\n彼女は、「私たちは、何十年にもわたる私たちのネットワークの断片化と脆弱性に終止符を打つために、グレートブリティッシュ鉄道を設立し、来年クロスカントリーを含むサービスを国有化するつもりです。」私たちは乗客にふさわしい信頼性を提供することを決意しています。」\n全国鉄道海運運輸労働組合（RMT）は、今回の混乱を受けて「停電の影響を受けないようにする」ため、鉄道運行管理センターの見直しを求めている。\nRMTのエディ・デンプシー書記長は、乗客と鉄道職員が、信頼性の低いバックアップシステムのせいでさらに1週間の「旅行混乱」に直面する必要はないと述べた。\nクロスカントリーは6月に英国最悪の鉄道事業者にランクされた。\n連絡する\n混乱の影響を受けましたか?\nBBC バーミンガムを BBC Sounds、Facebook (外部)、X (外部)、Instagram (外部) でフォローしてください。\n- 6 月 18 日公開\n- 4 月 29 日発行\n- 2 月 11 日発行",

    "id": "china-probes-use-of-formaldehyde-to-keep-1f3268ec",
    "title": "China probes use of formaldehyde to keep cabbages fresh",
    "titleJa": "中国、キャベツの鮮度を保つためのホルムアルデヒド使用を調査",
    "summaryJa": "中国、キャベツの鮮度を保つためのホルムアルデヒド使用を調査- 公開されました",
    "bodyOriginal": "China probes use of formaldehyde to keep cabbages fresh\n- Published\nAuthorities in China have launched an investigation into reports of formaldehyde being used to preserve the freshness of cabbages for human consumption.\nOfficials in the northeastern Hebei province confirmed that they had verified footage showing individuals dipping cabbages in a solution before loading them onto trucks for transportation.\nAn environmental blogger first released the footage last week. Using formaldehyde, a colourless chemical that is known to cause cancer, for preserving the freshness of food in China is strictly prohibited.\nChina is the world's largest producer of cabbages, most of which are exported to neighbouring countries in Asia.\nPolice have taken legal action against the individuals involved, according to state media.\nOfficials are now moving swiftly to prevent panic and restore confidence by carrying out spot checks on markets across the country.\nChinese state media says investigators will also establish how widespread the practice is and take measures to trace affected vegetables.\nIn a statement issued on Saturday, local authorities in Kangbao county said: \"Any illegal or non-compliant practices discovered will be dealt with strictly in accordance with the law to ensure the safety of the vegetable supply.\"\nXinfadi market in Beijing, one of the major sources of fresh produce in the capital, issued a statement saying that it had investigated the source of its cabbages, adding that none of the affected vegetables had entered its market.\nThe incident has generated widespread media attention in China.\nAn editorial in the People's Daily wrote: \"The wholesalers focused solely on their immediate economic interests while completely disregarding the lives and health of consumers. [They] crossed a legal red line and breached the moral bottom line.\"\nChina produces well over 30 million tons of cabbages each year, nearly half of the world's annual total. Vietnam, South Korea and Russia are among the largest export destinations for the vegetable.\nExposure to relatively high quantities of formaldehyde in some workplaces has been linked to some types of cancer in humans, but the effect of exposure to small amounts is less clear, according to the American Cancer Society.",
    "bodyJa": "中国、キャベツの鮮度を保つためのホルムアルデヒド使用を調査\n- 公開されました\n中国当局は、人間が消費するキャベツの鮮度を保つためにホルムアルデヒドが使用されているという報告について調査を開始した。\n河北省北東部の当局者は、輸送用のトラックにキャベツを積み込む前に、キャベツを溶液に浸す人々を映す映像を確認したことを認めた。\n環境ブロガーが先週初めてこの映像を公開した。中国では、食品の鮮度を保つために、発がん性があることが知られている無色の化学物質であるホルムアルデヒドを使用することは厳しく禁止されている。\n中国は世界最大のキャベツ生産国で、そのほとんどがアジアの近隣諸国に輸出されている。\n国営メディアによると、警察は関係者に対して法的措置を講じた。\n当局は現在、全国の市場で抜き打ち検査を実施することでパニックを防ぎ、信頼を回復するために迅速に動いている。\n中国国営メディアは、捜査員がこの慣行がどの程度広がっているかを明らかにし、影響を受けた野菜を追跡するための措置を講じると述べている。\n土曜日に発表された声明の中で、江保県の地方当局は「野菜供給の安全性を確保するため、違法または違反行為が発見された場合は法律に従って厳格に対処される」と述べた。\n首都の生鮮食品の主要供給源の一つである北京の新発地市場は声明を発表し、キャベツの供給源を調査したと発表し、影響を受けた野菜は市場に入っていないと付け加えた。\nこの事件は中国で広くメディアの注目を集めた。\n人民日報の社説は、「卸売業者は消費者の命と健康を完全に無視しながら、目先の経済的利益のみに焦点を当てた。（彼らは）法的な越えてはならない一線を越え、道徳的最低ラインに違反した」と書いた。\n中国は毎年 3,000 万トンを優に超えるキャベツを生産しており、これは世界の年間総量のほぼ半分に相当します。ベトナム、韓国、ロシアはこの野菜の最大の輸出先です。\n米国癌協会によると、一部の職場での比較的大量のホルムアルデヒドへの曝露は、人間の一部の種類のがんと関連しているが、少量への曝露の影響はそれほど明らかではない。",

    "id": "nearly-three-million-teslas-recalled-in-3cc8f276",
    "title": "Nearly three million Teslas recalled in China over hidden door handles",
    "titleJa": "隠しドアハンドル問題で中国で300万台近くのテスラがリコール",
    "summaryJa": "隠しドアハンドル問題で中国で300万台近くのテスラがリコール- 公開されました",
    "bodyOriginal": "Nearly three million Teslas recalled in China over hidden door handles\n- Published\nMinimalistic retractable door handles became a signature feature of electric vehicles (EVs), but the controversial designs are now at the centre of China's biggest car recall, affecting more than 4 million vehicles.\nThe recall, which includes 2.98 million Chinese-made Teslas, follows safety concerns that the hidden door handles are difficult to locate and open in emergency situations.\nOther brands affected by the recall include Chinese carmakers XPeng, Xiaomi and Geely.\nMade popular by multi-billionaire Elon Musk's Tesla, hidden door handles are designed to tuck seamlessly within the car's door panel and only extend outwards when an owner approaches their vehicle.\nThe design came under scrutiny after two fatal crashes in China involving Xiaomi EVs, in which power failures were suspected to have prevented doors from being opened.\nTesla said in a statement on Friday that it was recalling some of its Model 3, Y, S and X vehicles due to door handles that are \"difficult to identify and operate because their colour is similar to the interior trim\".\nThis could hinder occupants or rescuers from quickly opening the doors in an emergency, such as during a \"severe collision causing the vehicle's low-voltage system to fail.\"\nTesla said it will place warning labels on the recalled vehicles and issue a software update to automatically lower a vehicle's windows after a collision.\nIt is not clear if the affected firms plan to make a similar recall for the rest of the world.\nThe BBC has contacted Tesla, XPeng, Xiaomi and Geely for comment.\nThe use of the hidden handle design has \"snowballed\" after Chinese brands were quick to copy the \"sleek\" look of Tesla's Model S sedan since 2014, said Tu Le, the founder of consultancy Sino Auto Insights.\nThe use of warning labels and a software update is more of a \"band-aid\" than a lasting solution for the issue, he added.\nIn February, Chinese authorities announced a ban on hidden door handles.\nUnder new rules due to take effect on 1 January 2027, cars will only be allowed to be sold in China if they have a mechanical release on both the inside and outside of their doors.\nTesla's door handles were also involved in a probe by US safety regulators after reports that they suddenly stopped working, leaving children trapped in the cars.\nIn July, the US National Highway Traffic Safety Administration suggested creating a new formal safety standard for all carmakers.\nThe BBC has contacted the agency for comment.\nRelated topics\n- Published27 May\n- Published29 January",
    "bodyJa": "隠しドアハンドル問題で中国で300万台近くのテスラがリコール\n- 公開されました\nミニマルな格納式ドアハンドルは電気自動車（EV）の特徴的な機能となったが、物議を醸しているこのデザインは現在、400万台以上の車両に影響を与える中国最大の自動車リコールの中心となっている。\n今回のリコールには中国製テスラ298万台が含まれており、隠しドアハンドルが緊急時に見つけにくく開けにくいという安全上の懸念を受けて行われた。\nリコールの影響を受ける他のブランドには、中国の自動車メーカーXPeng、Xiaomi、Geelyなどが含まれる。\n億万長者イーロン・マスク氏のテスラによって普及した隠しドアハンドルは、車のドアパネル内にシームレスに収まり、所有者が車に近づいたときにのみ外側に伸びるように設計されています。\n中国で小米科技（シャオミ）のＥＶが絡む死亡事故が２件発生し、停電によりドアが開かなくなった疑いがあり、この設計が精査されるようになった。\nテスラは金曜日の声明で、ドアハンドルが「色がインテリアトリムと似ているため、識別や操作が難しい」ため、モデル3、Y、S、Xの一部車両をリコールすると発表した。\nこれにより、「車両の低電圧システムに障害が発生する重大な衝突」などの緊急時に、乗員や救助者がドアを素早く開けるのが妨げられる可能性がある。\nテスラは、リコール対象車両に警告ラベルを貼り、衝突後に車両の窓を自動的に下げるソフトウェアアップデートを発行すると発表した。\n影響を受けた企業が世界の他の地域に対しても同様のリコールを計画しているかどうかは不明である。\nBBCはテスラ、XPeng、Xiaomi、Geelyにコメントを求めた。\nコンサルタント会社Sino Auto Insightsの創設者Tu Le氏は、2014年以来中国ブランドがテスラのモデルSセダンの「洗練された」外観をすぐに模倣したことを受けて、隠しハンドルデザインの使用が「雪だるま式」に増えたと語った。\n警告ラベルの使用やソフトウェアのアップデートは、問題の永続的な解決策というよりも「応急処置」に近いと同氏は付け加えた。\n中国当局は2月、隠しドアハンドルの禁止を発表した。\n2027年1月1日に発効予定の新規則では、ドアの内側と外側の両方に機械的リリースが付いている自動車のみ中国での販売が許可される。\nテスラのドアハンドルも突然作動しなくなり、子供たちが車内に閉じ込められたとの報告を受け、米国の安全規制当局による調査の対象となった。\n7月、米国道路交通安全局は、すべての自動車メーカーに対して新しい正式な安全基準を作成することを提案した。\nBBCは同局にコメントを求めた。\n関連トピック\n- 5 月 27 日公開\n- 1 月 29 日発行",

    "id": "divorce-smartphones-and-control-bbc-sees-8dcf9155",
    "title": "Divorce, smartphones and control - BBC sees how Taliban run Afghanistan",
    "titleJa": "離婚、スマートフォン、支配 - タリバンがアフガニスタンをどのように運営しているかをBBCが見る",
    "summaryJa": "離婚、スマートフォン、支配 - タリバンがアフガニスタンをどのように運営しているかをBBCが見る- 公開されました",
    "bodyOriginal": "Divorce, smartphones and control - BBC sees how Taliban run Afghanistan\n- Published\nGovernor Abdullah Sarhadi gives money to treat a boy's broken arm and hands out funds for a local mosque - then, in his office in northern Afghanistan, an astonishing exchange unfolds.\nA young woman tells the grey-bearded former Taliban commander that she wants to divorce her husband, who she accuses of months of abuse and beatings.\nShe will not take no for an answer.\nIn a country where girls are banned from secondary education, the 18-year-old argues her case calmly and confidently, her face completely hidden behind a full-face veil and sunglasses.\n\"If there was any chance to live together, I wouldn't be here… I have taken my decision,\" she says.\nAfter trying to persuade her to avoid divorce, the governor later comments that women are \"mindless\" and \"deficient in intellect\", to laughter from the male officials, bodyguards and elders around him.\nThe moment gives a rare glimpse into the day-to-day realities of the Taliban's rule, five years after they swept aside the US-backed government in 2021.\nIn that time, women have been excluded from most workplaces, banned from universities and may not travel alone or visit parks and leisure centres.\nIn encounters spread over two years, the BBC gained unusual access to influential figures in the extreme Islamist movement, spending time with men who once planned suicide attacks or spent years in underground hideouts, but are now officials and soldiers.\nThe Taliban came into power saying they had changed, but many of their policies are similar to the hard-line interpretation of Sharia - Islamic religious law - they imposed in the 1990s.\nThe men we met seemed to want to present themselves as reasonable, yet were not keen to discuss their past violence. And we saw moments of unease between the rulers and those they rule.\nGovernor Sarhadi says Tuba – not her real name – should stay in the marriage.\n\"Ask yourself: 'Who would marry me after I get my divorce?'\" says Sarhadi. \"You'll have to compromise a lot or you'll lose your dignity and honour.\"\n\"Mr Governor, my honour and dignity have already been ruined,\" she responds.\nHer husband listens, awaiting his turn to speak.\nUnder Sharia, a woman requesting that her husband agrees to a divorce may have to return some or all of the money given to her by him when they married. A financial settlement is often agreed. But this woman's husband says he wants four times the amount, which her family refuses to pay.\nThe governor says the woman should be given her own room. He adds that officials will warn him not to beat her - \"otherwise he'd be jailed\".\nUnsatisfied, Tuba's father later tells the BBC the family will pursue divorce through the courts, even though, under the Taliban's court system, it is very difficult for a woman to get a divorce without the husband's consent.\nSarhadi was a military commander during the Taliban's first stint in power in the 1990s. He was among thousands of insurgents who surrendered in late 2001 as a US-led coalition ousted the group.\nHe was held for several years in US detention in Guantanamo Bay, but eventually released.\nWhen the Taliban regained power, he became a governor - first in the province of Bamiyan, then when we met him in late June, in Sheberghan city in Jawzjan province. He has recently become deputy commander of a military corps in the northern province of Kunduz.\nTapping on an old-style mobile with a tiny screen, he says a recent ban on smartphones for officials has slowed things down. \"Before, you could send a quick message… sending documents and getting an answer fast.\" If he says any more about the ban, \"it will cause trouble\", he adds.\nBut in other ways his worldview seems largely unchanged from the Taliban's position 25 years ago. Then, he was a military commander in Bamiyan, where the Taliban blew up ancient giant Buddha statues, triggering international shock and condemnation.\nHe initially tries to avoid our questions about the archaeological site, but eventually, he says: \"I destroyed it with my own hands.\n\"Whatever we did and we do is in accordance with the guidance and God's law… We smash idols rather than sell them. Why should I regret? It was God's will.\"\nIn the capital Kabul, we meet another senior Taliban figure who swapped a violent past for a role with the ruling administration.\nHabibullah Badr drives us through the streets in an armoured car.\nHe says he was previously \"responsible for the operations of suicide attackers\" in Kabul.\n\"I know all the roads and streets very well… we had all the information we needed about Kabul and its alleys,\" he says. \"There were areas that needed a long time to plan.\"\nTaliban suicide attacks killed thousands of people in Afghanistan, including many civilians.\nBadr is cautious about discussing his past though, fearing it will \"make people upset\" and could \"reopen wounds\".\nAsked about civilian deaths, he says the Taliban targeted US convoys and that civilians were urged to stay away from foreign bases.\nWhenever I try to ask him about specific attacks that took place in civilian areas, he evades the question.\nHe is currently taking time out from official roles for medical treatment, but was previously deputy head of prisons for the whole country – and ran the very jail where he was held on death row under the previous government.\nBadr invites us to join him at a tribal gathering, where the head of a charitable foundation is to honour him with a medal. But things take an unexpected turn.\n\"Mr Badr is a pride for Afghanistan and a great fighter,\" says Sultan Mohammad Talaee. \"But I also have a complaint. If the schools and education were open to all it would be a great work for Afghanistan. I hope this doesn't offend you.\"\nAn awkward silence follows, his audience unsure how to react. Talaee's microphone is swiftly removed.\nAfterwards, he tells the BBC: \"I requested for the girls' schools to reopen… seeking knowledge is an obligation for both men and women in Islam.\"\nHe adds: \"There were other things I wanted to say but they didn't let me talk more.\"\nOften those who speak out face much more severe consequences.\nWomen told us of the deep despair they felt over dreams thwarted by restrictions on education, and of friends jailed for protesting.\nMost journalists we spoke to said they had been summoned or questioned by the Taliban's intelligence organisation, Estikhbaraat.\nThe BBC put some of these concerns to the Taliban government's spokesman, known as Zabihullah Mujahid.\nHe has been a public face for the Taliban government since 2021. He still uses the pseudonym he went by for years during the insurgency, but he told us his real name is Tahir Shah Seddiqi - revealing it publicly for the first time.\nIn a lavish press centre funded by the Americans for the previous government, we ask him about the first press conference he gave there, two days after the Taliban took control of the country.\nThen, he told the world the Taliban government would allow women to work and study \"within our frameworks\" and they would \"be very active\" in society. Why did they fail to keep their word?\n\"We are committed to women's rights, freedom of speech and other things within Sharia,\" he replies. \"We should see everything through the Sharia lens.\"\nAllowing women to work in offices such as his own \"would lead to immoralities\" and \"their dignity would be undermined\", he adds.\nHe says the issue of education for women is \"under discussions… we need a Sharia-based solution for it\".\nWhen questioned about the Taliban's crackdown on media freedom, he says: \"In a society like Afghanistan we have our restrictions. We can't let media do whatever propaganda they want… they can't broadcast against Islamic laws and rites.\"\nThe Taliban government sits in Kabul, but Mujahid spends a lot of time in the southern city of Kandahar, the Taliban's heartland, which some now consider the de facto capital.\nWe ask to meet the Taliban's supreme leader, Hibatullah Akhundzada, who is based there. He rarely appears in public and has never given a media interview - we are told it will not be possible at the moment.\nRestrictions have been tightened in Kandahar since I last visited two years ago. Now men must have beards. Radio stations are not allowed to play music or broadcast women's voices, and we were not allowed to film in the city.\nTwo hours' drive away, along dusty roads, some of the group's most devoted former fighters showed the BBC the insurgents' old secret cave network.\nAbid Lalai, a former fighter who now mans a checkpoint as part of a security force under the interior ministry, shows us the holes he fired from and the places he used to put his Quran and hang AK-47s.\nHis superior, Abdul Samad, shows us an unmarked graveyard, saying his father is buried here, killed fighting for the Taliban.\nThe area is one of the most deprived in a country where the UN says three in four people cannot provide for their basic needs. Samad says the local population desperately need water, roads and clinics.\n\"Emirate [Taliban] officials have not forgotten us,\" says Samad. He says the leaders may be busy with other priorities. \"We are hopeful, they will look after us sometime.\"\nFive years since the Taliban began their second stint in power, poverty, unemployment and economic instability remain pressing concerns.\nTaliban figures we spoke to said they were working to tackle them, but we met other people who believe the group itself is the country's main problem.\n\"I'm speechless about how a group that has no understanding about life is suddenly in power,\" says Hoda - not her real name - a woman who protested on the streets when the Taliban first returned to power.\n\"Women can't accept this situation,\" she tells the BBC. \"They might advance restrictions but it won't stay like this forever.\"\n\"I think the Taliban are scared of educated women,\" she adds. \"That's why they restrict women. They want uneducated women so they can't raise wise men. Because that would end the Taliban.\"\nAdditional reporting by Hafizullah Maroof",
    "bodyJa": "離婚、スマートフォン、支配 - タリバンがアフガニスタンをどのように運営しているかをBBCが見る\n- 公開されました\nアブドラ・サルハディ知事は、骨折した少年の腕の治療に資金を提供し、地元のモスクの建設に資金を配った。その後、アフガニスタン北部の知事の事務所で、驚くべきやりとりが展開された。\n若い女性が、数か月にわたる虐待と暴行を受けていた夫を告発して、白髪のひげを生やした元タリバン司令官に離婚したいと訴えた。\n彼女は「ノー」という答えを受け入れません。\n女子の中等教育が禁止されている国で、18歳の彼女は、全身ベールとサングラスで顔を完全に隠しながら、冷静かつ自信を持って自分の主張を主張している。\n「もし一緒に住むチャンスがあったとしても、私はここにはいないだろう…私は自分の決断を下した」と彼女は言う。\n知事は離婚を回避するよう彼女を説得しようとした後、女性は「思慮がない」「知性が欠如している」とコメントし、周囲の男性役人やボディーガード、長老らの笑いを誘った。\nこの瞬間は、タリバンが2021年に米国の支援を受けた政府を一掃してから5年後の、タリバン支配の日常の現実を垣間見ることができる貴重な瞬間だ。\nその間、女性はほとんどの職場から排除され、大学への入学も禁止され、一人で旅行したり、公園やレジャーセンターを訪れたりすることもできなかった。\n2年に渡って行われた接触の中で、BBCは、かつては自爆攻撃を計画したり、地下隠れ家で何年も過ごしたが、現在は役人や軍人である男性たちと時間を過ごし、過激なイスラム主義運動の影響力のある人物たちと異例の接触を獲得した。\nタリバンは自らが変わったと主張して政権を握ったが、その政策の多くは1990年代に課したシャリア（イスラム教の宗教法）の強硬な解釈と似ている。\n私たちが会った男性たちは、自分たちを理性的であると見せたいようでしたが、過去の暴力について話すことに熱心ではありませんでした。そして私たちは、支配者と彼らが支配する人々の間に不安の瞬間が見られました。\nサルハディ知事は、トゥバ（本名ではない）は結婚生活を続けるべきだと述べた。\n「『私が離婚した後、誰が私と結婚してくれるだろうか』と自問してみてください」とサルハディさんは言う。 「かなりの妥協をしなければならない、さもなければ尊厳と名誉を失うことになるだろう。」\n「知事さん、私の名誉と尊厳はすでに傷つきました」と彼女は答えた。\n彼女の夫は話を聞き、話す順番を待っています。\nシャリーアのもとでは、夫に離婚に同意するよう求めた女性は、結婚時に夫から受け取ったお金の一部または全額を返還しなければならない可能性がある。金銭的な解決が合意されることがよくあります。しかし、この女性の夫はその4倍の金額が欲しいと言い、家族はその支払いを拒否している。\n知事は女性に自分の部屋を与えるべきだと主張している。さらに、当局は彼女を殴らないように警告するだろう、「さもなければ投獄されるだろう」と付け加えた。\n不満を抱いたチューバさんの父親は後にBBCに対し、タリバンの裁判制度では女性が夫の同意なしに離婚することは非常に難しいにもかかわらず、家族は裁判所を通じて離婚を求めるつもりだと語った。\nサルハディ氏は、1990年代にタリバンが政権を握った最初の期間に軍司令官を務めた。彼は、2001年末に米国主導の連合軍がグループを追放したため降伏した数千人の反乱軍の一人だった。\n彼はグアンタナモ湾で米国の拘留中に数年間拘留されたが、最終的に釈放された。\nタリバンが権力を取り戻すと、彼は知事になった。最初はバーミヤン県で、次に私たちが６月下旬にジョズジャン県のシェベルガン市で彼に会ったとき。彼は最近、北部クンドゥズ州の軍団の副司令官に就任した。\n小さな画面を備えた古いスタイルの携帯電話をタップしながら、最近当局者へのスマートフォンの使用が禁止されたため、事態が遅くなったと彼は言う。 「以前は、簡単なメッセージを送信できました。書類を送信して、すぐに返事を得ることができました。」禁止についてこれ以上発言すれば「問題が起きるだろう」と付け加えた。\nしかし、他の点では、彼の世界観は25年前のタリバンの立場とほとんど変わっていないように見える。その後、彼はバーミヤンで軍司令官を務めたが、そこではタリバンが古代の巨大な仏像を爆破し、国際的な衝撃と非難を引き起こした。\n彼は当初、遺跡に関する私たちの質問を避けようとしていたが、最終的には「私は自分の手で遺跡を破壊した。\n「私たちが行ったこと、そして行うことはすべて、導きと神の法に従っています…私たちは偶像を売るのではなく、破壊します。なぜ後悔しなければならないのでしょうか？それは神のご意志でした。」\n首都カブールでは、暴力的な過去を捨てて政権側の役割を担ったもう一人のタリバン幹部に会う。\nハビブラ・バドルは装甲車で私たちを街中を運転します。\n同氏は以前、カブールで「自爆テロ犯の作戦を担当していた」と述べた。\n「私はすべての道路や通りをよく知っています…カブールとその路地について必要な情報はすべて持っていました」と彼は言います。 「計画に時間がかかる部分もあった。」\nアフガニスタンではタリバンの自爆攻撃により、多くの民間人を含む数千人が死亡した。\nしかし、バドル氏は自分の過去について語ることには慎重で、それが「人々を動揺させ」、「傷が再び開く」可能性を恐れている。\n民間人の死亡について尋ねると、タリバンは米国の輸送船団を標的にしており、民間人は外国の基地に近づかないように促されていると述べた。\n私が民間地域で起きた具体的な攻撃について彼に尋ねようとすると、彼はいつも質問をはぐらかします。\n彼は現在、治療のため公務から離れているが、以前は全国の刑務所副所長を務めており、前政権下で死刑囚が拘留されていたまさにその刑務所を運営していた。\nバドル氏は、慈善財団の理事長がバドル氏を称えてメダルを授与する部族の集会に参加するよう私たちを招待する。しかし、事態は予期せぬ展開を迎える。\n「バドル氏はアフガニスタンの誇りであり、偉大な戦士だ」とスルタン・モハマド・タライー氏は語る。 「しかし、私には不満もあります。学校と教育がすべての人に開かれていれば、アフガニスタンにとって素晴らしい取り組みになるでしょう。このことで気分を害されないことを願っています。」\n気まずい沈黙が続き、聴衆はどう反応すればいいのか分からない。タライーのマイクはすぐに外される。\nその後、彼はBBCに次のように語った。「私は女子学校の再開を要請した…知識を求めることはイスラム教において男性と女性の両方の義務である。」\nさらに、「他にも言いたいことはあったが、それ以上話させてくれなかった」とも付け加えた。\n多くの場合、声を上げた人はさらに厳しい結果に直面します。\n女性たちは、教育の制限によって夢が阻まれて感じた深い絶望や、抗議活動で投獄された友人のことを語った。\n私たちが話を聞いたほとんどのジャーナリストは、タリバンの諜報機関エスティクバラートから召喚または尋問を受けたと述べた。\nBBCは、こうした懸念の一部をザビフラ・ムジャヒドとして知られるタリバン政府の報道官に伝えた。\n彼は2021年からタリバン政府の公の顔となっている。彼は反乱中何年も使っていた偽名を今も使っているが、本名はタヒル・シャー・セディキだと初めて公に明らかにした。\n前政権のためにアメリカ人が資金提供した豪華なプレスセンターで、タリバンが国を掌握した２日後にそこで行った最初の記者会見について彼に尋ねた。\nそして、タリバン政府は女性が「私たちの枠組み内で」働き、勉強することを許可し、女性たちは社会で「非常に活躍する」だろうと世界に語った。なぜ彼らは約束を守れなかったのでしょうか?\n「私たちはシャリーアの範囲内で女性の権利、言論の自由、その他のものに取り組んでいます」と彼は答えた。 「私たちはシャリアというレンズを通してすべてを見るべきです。」\n同氏は、自身のオフィスのようなオフィスで女性が働くことを許可すれば「不道徳行為につながり」、「女性の尊厳が損なわれることになる」と付け加えた。\n同氏は、女性の教育問題について「議論中だ…私たちはシャリーアに基づいた解決策を必要としている」と述べた。\nタリバンによる報道の自由に対する弾圧について質問されると、彼はこう言った。「アフガニスタンのような社会では、我々には制限がある。我々はメディアに彼らが望むどんなプロパガンダもさせることはできない…イスラム法や儀式に反する放送をすることはできない。」\nタリバン政府はカブールにあるが、ムジャヒドは多くの時間をタリバンの中心地である南部の都市カンダハルで過ごしており、現在はそこが事実上の首都であると考える人もいる。\n私たちは、そこに拠点を置くタリバンの最高指導者、ヒバトゥラ・アクンザダ氏との面会を求めます。彼はめったに公の場に姿を現さず、メディアのインタビューにも応じたことがないが、現時点では不可能だと言われている。\n私が最後に訪れたのは2年前以来、カンダハルでは規制が強化されている。今では男性はひげを生やさなければなりません。ラジオ局は音楽を流したり、女性の声を放送したりすることを禁じられており、市内での撮影も許可されていませんでした。\n車で2時間離れたほこりっぽい道沿いで、グループの最も献身的な元戦闘員の何人かが反乱軍の古い秘密の洞窟ネットワークをBBCに見せた。\n元戦闘員で、現在は内務省の治安部隊の一員として検問所に勤務しているアビッド・ラライさんは、彼が発砲した穴や、コーランを置いたりAK-47を吊るしたりした場所を見せてくれた。\n彼の上司であるアブドゥル・サマドは、私たちに標識のない墓地を見せ、タリバンのために戦って亡くなった父親がここに埋葬されていると語った。\nこの地域は、4人に3人が基本的なニーズを満たせないと国連が発表しているこの国で最も恵まれた地域の一つだ。サマドさんは、地元住民が水、道路、診療所を切実に必要としていると語る。\n「首長国（タリバン）当局者は私たちのことを忘れていません」とサマド氏は言う。 He says the leaders may be busy with other priorities. 「私たちは彼らがいつか私たちの面倒を見てくれるだろうと期待しています。」\nタリバンが二度目の権力掌握を開始してから 5 年が経ちますが、貧困、失業、経済的不安定は差し迫った懸念のままです。\n私たちが話を聞いたタリバン関係者らは、タリバン対策に取り組んでいると述べたが、タリバン自体がこの国の主要な問題であると信じている人たちにも会った。\n「人生について全く理解していない集団がどうして突然権力を握ったのか言葉を失いました」とホダさん（仮名）は言う。彼女はタリバンが最初に政権に復帰したときに街頭で抗議活動を行った女性だ。\n\"Women can't accept this situation,\" she tells the BBC. 「規制が進むかもしれないが、この状況が永遠に続くわけではない。」\n「タリバンは教育を受けた女性を恐れていると思います」と彼女は付け加えた。 「それが彼らが女性を制限する理由だ。彼らは教育を受けていない女性を望んでいるから、賢者を育てられない。それはタリバンを終わらせてしまうからだ。」\nHafizullah Maroof による追加レポート",
