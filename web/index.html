    "bodyOriginal": "Singaporean man pleads guilty in US to massive crypto heist\n- Published\nA Singaporean man pleaded guilty on Tuesday to a racketeering conspiracy charge in the US for organising one of the biggest ever cryptocurrency thefts.\nMalone Lam admitted to teaming up with friends to steal $245m (£181m) of bitcoin and laundering the proceeds.\nThe 22-year-old and his associates used the money to spend up to $500,000 a visit to nightclubs, according to the US Department of Justice (DOJ). It also said they bought a fleet of exotic cars, ranging in value from $100,000 to $3.8m.\nLam faces a maximum prison sentence of 20 years. US District Judge Colleen Kollar-Kotelly did not immediately schedule a sentencing hearing for him.\n\"If you build a cybercrime empire, we will find you, dismantle your operation, and hold you accountable,\" said US Attorney Jeanine Pirro said.\n\"This defendant led an international network that preyed on victims through deception, invaded their privacy, and stole hundreds of millions of dollars in cryptocurrency,\" she added.\nAccording to court documents, the conspiracy began no later than October 2023 and continued to at least May 2025.\nThe co-conspirators - who came from California, Connecticut, New York, Florida, and outside the US - met via online gaming platforms.\nThe DOJ said Lam - who also went by the names Anne Hathaway, $$$, King Greavy - was the ringleader of the criminal enterprise, who identified victims and coordinated the roles of the different conspirators.\nThey tricked people into giving away confidential information as well as conducted occasional home break-ins to obtain details that allowed them to drain their victims' cryptocurrency wallets, the DOJ said.\nThe stolen cryptocurrency was also used to buy Hermes Birkin handbags, valued in the tens of thousands of dollars, which were thrown into crowds at nightclub parties, according to the DOJ.\nOther items that the DOJ said the proceeds were spent on included high-end watches worth up to $500,000, luxury clothing valued in the tens of thousands of dollars, rental homes in Los Angeles, the Hamptons, and Miami, private jet rentals for travel and a team of private security guards.",
    "bodyJa": "シンガポール人男性、米国で大規模暗号通貨強盗の罪を認める\n- 公開されました\nシンガポール人男性が火曜日、史上最大規模の仮想通貨窃盗を組織したとして米国での恐喝共謀罪で有罪を認めた。\nマローン・ラム容疑者は、友人らと組んで2億4,500万ドル（約1億8,100万ポンド）のビットコインを盗み、その収益を洗浄していたことを認めた。\n米国司法省（DOJ）によると、22歳の彼とその仲間たちは、そのお金を使ってナイトクラブへの訪問に最大50万ドルを費やしたという。また、彼らは10万ドルから380万ドルの価値を持つ珍しい車を購入したとも述べた。\n林鄭氏には最高で懲役20年の刑が言い渡される可能性がある。米国地方判事のコリーン・コラー＝コテリー氏は、同氏に対する量刑公聴会の予定をすぐには立てなかった。\nジャニーン・ピロ連邦検事は「もしあなたがサイバー犯罪帝国を築くなら、我々はあなたを探し出し、その活動を解体し、責任を追及するだろう」と述べた。\n「この被告は国際ネットワークを率いており、詐欺によって被害者を食い物にし、プライバシーを侵害し、数億ドルの仮想通貨を盗んだ」と付け加えた。\n法廷文書によると、陰謀は遅くとも2023年10月までに始まり、少なくとも2025年5月まで続いた。\n共謀者らはカリフォルニア、コネチカット、ニューヨーク、フロリダなど米国外出身で、オンラインゲームプラットフォームを通じて知り合った。\n司法省は、ラム氏（アン・ハサウェイ、$$$、キング・グリービーの別名でも知られる）が犯罪計画の首謀者であり、被害者を特定し、さまざまな共謀者の役割を調整したと述べた。\n彼らは人々をだまして機密情報を漏らしたり、被害者の仮想通貨ウォレットを吸い出すための詳細を入手するために時折家に侵入したりしたと司法省は述べた。\n司法省によると、盗まれた仮想通貨は数万ドル相当のエルメス・バーキンのハンドバッグの購入にも使用され、ナイトクラブのパーティーで群衆に投げ込まれたという。\n司法省がその収益が使われたとしている他の品物には、最大50万ドル相当の高級時計、数万ドル相当の高級衣料品、ロサンゼルス、ハンプトンズ、マイアミの賃貸住宅、旅行用のプライベートジェットレンタル、民間警備員チームなどが含まれていた。",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Asia's ultra-rich are increasingly willing to tap into new asset classes, gold is leaving Dubai for Singapore and wealthy Chinese are flocking to Malaysia, the Singapore CEO of Malayan Bank Bhd said.\nUltra-high-net-worth people are \"always looking at both financial instruments as well as physical assets in real estate and in precious metal,\" Alvin Lee said in an interview. \"Gold's rise in price is testament to the fact that it's a good store of value. It continues to be very appealing,\" he said.\nWhile gold is off its record highs from early this year, its price of around $4,400 per ounce is still well elevated versus history, with Goldman Sachs forecasting the yellow metal to reach $4,900 by year-end on the back of central bank buying.\nAs Asia's richest people buy into precious metals, among the oldest investments in history, they're also willing to try much newer and more innovative concepts. That's coming as they \"are very focused\" on the transfer of wealth from older to younger generations, Lee said.\n\"Increasingly, we do see the wealthy being very open to new asset classes, whether it's digital assets or cryptocurrencies,\" Lee said, adding that the interest is coming primarily from the younger people.\nSingapore's appeal\n\"Singapore will continue to be very strong in appealing to offshore wealth, so with the Middle East conflict, a lot of money that left Singapore for Dubai is returning,\" Lee said. Physical gold is being shipped to Singapore from Dubai in historically outsized quantities, he added.\nSingapore tends to benefit \"directly or indirectly,\" when there is a regional or global crisis, Lee said. \"Given our safe haven status, given the fact that we have strong IP, a very stable government, and very attractive tax jurisdiction.\"\nRich Chinese eying Malaysia\nLee said that increasingly Chinese people are becoming quite open to investing in Malaysia. In terms of places to move business or even their families, \"they are very open to Malaysia because in terms of valuation, it looks very attractive relative to Singapore.\"\nAccording to the Hurun global rich list published in March, China has the highest number of billionaires at 1,110, surpassing the U.S. at 1,000.\n\"We see more Chinese buying up real estate for personal use as well as for their businesses in Malaysia, Kuala Lumpur is a beneficiary to that. I think Malacca is as well. Penang has always been quite appealing to the Chinese,\" Lee said, referring to cities and regions in Malaysia.",

    "title": "China's wholesale inflation tops estimates in August on commodity costs, tech demand as consumer price increases meet forecast",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "China's consumer and wholesale inflation rebounded in August, as higher global commodity costs and surging high-tech demand cushioned persistently tepid domestic consumption.\nThe producer price index increased 3.8%, according to data released by the National Bureau of Statistics on Wednesday, exceeding economists' forecast for a 3.6% gain and outpacing July's 3.5%, the weakest in three months.\nMuch of the pickup reflects a favorable base-effect comparison and higher commodity costs, economists said, rather than a genuine strengthening in household demand, which has stayed soft as effects from Beijing's trade-in subsidies and other consumption-boosting measures fade. The Iran war has sent oil prices surging in recent months.\nConsumer prices rose 0.8% in August from a year ago, in line with economists' estimates in a Reuters poll, and accelerating from July's 0.5% gain, the official release showed.\nCore CPI, excluding volatile food and energy prices, climbed 1% in August, edging up from a 0.9% gain in July.\nDong Lijuan, chief statistician at NBS, attributed the rebound in inflation to volatile global commodity prices, seasonal food price gains, and rising demand in high-tech industries, according to a statement accompanying the release.\nThe factory-gate inflation was largely concentrated in energy-related sectors, while that for consumer goods continued to fall, in a sign of soft demand and persistent overcapacity across industries, said Nguyen Hoang Nam, an economist at Capital Economics.\nNotably, electronics price inflation climbed to a fresh high last month on the back of global memory-chip shortages, Nam said.\nBoth consumer and producer price inflation are likely to ease should energy flows in the Gulf region normalize over the coming months, Nam noted. He expects producer prices to fall back into deflation next year.\nTianchen Xu, senior economist at the Economist Intelligence Unit, pointed to the muted performance in the services industry. \"There wasn't a seasonal uptick in service prices as in previous years,\" he said, reflecting weaker-than-usual summer tourism.\nDanske Bank earlier this week lowered its 2026 GDP growth forecast for China to 4.6% from 4.8% on the back of disappointing consumer data in recent months, while trimming its consumer-inflation forecast to 0.8% for this year from a previous 1%.\n\"China's domestic economy remains stuck in a slump, with a negative feedback loop of falling home prices, high savings, weak employment, and slow consumer spending,\" said Allan von Mehren, chief China economist at Danske Bank. \"Until we see a moderate recovery in the housing market, we expect household confidence to remain low and private consumption growth weak.\"\nGrowth in the world's second-largest economy has lost momentum after a solid start to the year, with expansion in the second quarter at the slowest level in more than three years. Economic data for July showed retail sales and urban investment both weakened, adding to pressure on Beijing to step up support for the remainder of the year.\nThe youth unemployment rate in urban areas climbed to 17.9% in July, official data showed, the worst reading since August 2025.",

    "id": "us-slaps-import-ban-on-canadian-alcohol-12ba57db",
    "title": "US slaps import ban on Canadian alcohol, motorbikes and other goods",
    "titleJa": "米国、カナダのアルコール、バイク、その他の商品の輸入禁止を決定",
    "summaryJa": "米国、カナダのアルコール、バイク、その他の商品の輸入禁止を決定- 公開されました",
    "bodyOriginal": "US slaps import ban on Canadian alcohol, motorbikes and other goods\n- Published\nThe US is banning a slew of Canadian products, including alcoholic spirits, dairy goods and motorbikes, as its neighbour's retaliatory tariffs on American goods come into force.\nIn a series of executive orders on Tuesday, US President Donald Trump said that Canada is \"discriminating\" against the US and outlined the import ban, which will begin 29 September.\nEarlier on Tuesday, Canada Prime Minister Mark Carney said in a video address that his country's pivot away from the US as its largest trading partner \"will come at a cost\".\nBoth US and Canadian officials have said they would like to strike a trade deal, but no new talks have been scheduled since negotiations collapsed in late August.\nThe BBC has contacted Carney's office for comment.\nThe White House's new sanctions are the latest strike in a months-long trade war between the US and Canada. The sides have historically been close allies, with each a key business partner to the other.\nGenerally more than two-thirds of Canada's total exports go to its neighbour.\nOn the other hand, Canada is the second-largest trading partner of the US, after Mexico, although its exports are far more diversified.\nBusiness owners on both sides of the border have expressed fears over the trade war's fallout. Many expect prices of goods to rise and the number of customers to fall.\nLast month, the White House imposed 50% tariffs on around $20bn (£14.8bn) of Canadian goods after several rounds of talks had broken down.\nThose tariffs hit sectors including Canada's furniture and wine industries, as well as some sporting and fishing equipment businesses.\nCanada responded with dollar-for-dollar tariffs on US goods like steel, clothing and furniture. The counter-duties came into effect after midnight on Tuesday.\nWhat tariffs will really cost Canadians and Americans\n- Published16 hours ago\nThe US-Canada trade war in 5 charts\n- Published31 August\nCanada is \"discriminating\" against US businesses by restricting US goods while not doing the same to the same products from other countries, the White House said when announcing the new import restrictions on Tuesday.\nSome products, like whey and non-alcoholic beer, have been banned from import entirely, while tariffs have been further hiked for others, including cheeses and motorboats.\nOn Monday, Trump hinted at more trade restrictions to come, warning Canadian aircraft company Bombardier that it would no longer be able to sell its products in the US unless it moves manufacturing there.\nTrump has long believed that tariffs will help reduce trade imbalances between the US and other countries, but his wide-ranging levies have upset many of the States' traditional allies.\nSome Canadians have led a massive boycott of US products like alcohol, which have vanished from some store shelves after Trump launched his global tariff campaign last year.\nTrade expert Deborah Elms, from the Hinrich Foundation, told the BBC the import ban could have a \"strong\" impact on any Canadian business with US buyers, though early estimates show a \"modest impact\" affecting around $1bn worth goods.\nCanada will likely \"hold course for now\" and adjust their business support measures to account for the US' latest moves, Elms said.\n\"The bigger question is what it will take for the two sides to sit back down together. The language in these proclamations, as an example, isn't helpful in getting to the negotiating table,\" she added.\nThe list of Canadian products banned by the White House include:\nDairy products like whey\nCane molasses\nNon-alcoholic beer\nA long list of wine, rum and vodka products\nBeer made from malt\nMotorbikes, including mopeds\nThose facing higher import taxes include:\nVarious types of cheese\nRaw hides and skins\nPaper\nSome furniture and mattresses\nSome metals, including aluminium and iron\nMotorboats\nGolf carts\nFishing rod parts and accessories\nSwitchboards\nCarney said on Tuesday as Canada's counter-tariffs came into effect: \"There's always a cost to action. But it doesn't come close to the cost of standing still.\"\nTension between the US and Canada has also moved beyond tariffs.\nIn August, Trump ordered Lake Ontario to be renamed as Lake America, resulting in uproar from Canadians and some in the US.\nRelated topics\n- Published22 August",
    "bodyJa": "米国、カナダのアルコール、バイク、その他の商品の輸入禁止を決定\n- 公開されました\n隣国の米国製品に対する報復関税の発効に伴い、米国はアルコール蒸留酒、乳製品、オートバイなどのカナダ製品の多数を禁止している。\nドナルド・トランプ米大統領は火曜日の一連の大統領令の中で、カナダは米国を「差別」していると述べ、9月29日から始まる輸入禁止措置の概要を述べた。\n火曜日初め、カナダのマーク・カーニー首相はビデオ演説で、最大の貿易相手国である米国からの離脱には「代償が伴う」と述べた。\n米国とカナダの当局者は双方とも貿易協定を締結したいと述べているが、8月下旬に交渉が決裂して以来、新たな交渉は予定されていない。\nBBCはカーニー氏の事務所にコメントを求めた。\nホワイトハウスの新たな制裁は、米国とカナダの間で数カ月間続いている貿易戦争における最新の攻撃となる。両者は歴史的に緊密な同盟関係にあり、お互いにとって重要なビジネスパートナーであった。\n通常、カナダの総輸出量の 3 分の 2 以上が隣国に向けられています。\n一方、カナダはメキシコに次ぐ米国の第二位の貿易相手国であるが、その輸出ははるかに多様化している。\n国境の両側の企業経営者らは貿易戦争の余波に懸念を表明している。多くの人は、商品の価格は上昇し、顧客数は減少すると予想しています。\nホワイトハウスは先月、数回の交渉決裂を受けて約200億ドル（約148億ポンド）のカナダ製品に50％の関税を課した。\nこれらの関税は、カナダの家具やワイン産業のほか、一部のスポーツや釣り用具の企業などの分野に打撃を与えた。\nカナダは鉄鋼、衣料品、家具などの米国製品に対するドル対ドルの関税で対抗した。この対抗義務は火曜日の深夜過ぎに発効した。\nカナダ人とアメリカ人に実際にかかる関税はどれくらいか\n- 16 時間前に公開\n5つのグラフで見る米国とカナダの貿易戦争\n- 8 月 31 日公開\nホワイトハウスは火曜日に新たな輸入制限を発表した際、カナダは米国製品を制限する一方、他国の同じ製品には同様の措置を講じないことで米国企業を「差別」していると述べた。\nホエーやノンアルコールビールなど一部の製品は輸入が全面禁止され、チーズやモーターボートなど他の製品については関税がさらに引き上げられた。\n月曜日、トランプ大統領はさらなる貿易制限を示唆し、カナダの航空機会社ボンバルディアに対し、製造拠点を米国に移さなければ製品を米国で販売できなくなると警告した。\nトランプ大統領は長年、関税が米国と他国の間の貿易不均衡の縮小に役立つと信じてきたが、同氏の広範な関税は米国の伝統的な同盟国の多くを動揺させている。\n一部のカナダ人はアルコールなどの米国製品の大規模なボイコットを主導しており、トランプ大統領が昨年世界的な関税キャンペーンを開始した後、一部の店の棚から製品が消えた。\nヒンリッヒ財団の貿易専門家デボラ・エルムズ氏はBBCに対し、輸入禁止措置は米国のバイヤーとのカナダのビジネスに「強い」影響を与える可能性があるが、初期の試算では約10億ドル相当の商品に影響を与える「軽度の影響」を示していると語った。\nエルムズ氏は、カナダは「当面は方針を堅持」し、米国の最近の動きを考慮して企業支援策を調整する可能性が高いと述べた。\n「より大きな問題は、双方が再び一緒に座るには何が必要かということだ。一例として、これらの宣言の文言は、交渉のテーブルに着くのに役立たない」と付け加えた。\nホワイトハウスによって禁止されているカナダ製品のリストには次のものが含まれます。\nホエーなどの乳製品\nサトウキビ糖蜜\nノンアルコールビール\nワイン、ラム酒、ウォッカ製品の長いリスト\n麦芽から作られたビール\nオートバイ（モペットを含む）\nより高い輸入税に直面しているのは次のとおりです。\nいろいろな種類のチーズ\n生の皮と皮\n紙\n一部の家具とマットレス\nアルミニウムや鉄などの一部の金属\nモーターボート\nゴルフカート\n釣り竿のパーツとアクセサリー\n配電盤\nカーニー氏は火曜日、カナダの対抗関税の発効に際し、「行動には常に代償が伴う。しかし、それは立ち止まることの代償には及ばない」と語った。\n米国とカナダの間の緊張も関税を超えたものになっている。\n8月、トランプ大統領はオンタリオ湖の名前をアメリカ湖に変更するよう命令し、その結果カナダ人や米国の一部から反発が起きた。\n関連トピック\n- 8 月 22 日発行",

    "title": "Should promotion depend on how workers use AI?",
    "titleJa": "昇進は従業員の AI の使い方に依存するべきでしょうか?",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Should promotion depend on how workers use AI?\n- Published\nIt's in Duncan Trevithick's interest to be good at using AI at work - if he can use it to get more tasks done, faster, he'll qualify for a bonus at the end of the year.\nOn the surface, it's a great incentive. But he's questioning what's really in it for him.\n\"The uncomfortable interpretation is that employees are being assessed on how effectively they can participate in their own redundancy,\" says Spain-based Trevithick, 34, who works in marketing for an AI training data company.\nBut if he uses AI to take care of two days worth of work each week, he says the financial rewards don't add up.\n\"I do not receive two days off or a 40% pay rise. The higher output simply becomes the new baseline. In the short term, that may help me get promoted. In the longer term, I have helped prove how much of my job no longer requires me,\" he says.\n\"I'm just trying to view myself as a manager, and I'm managing some people, and I'm also managing AI agents, or AI loops, or whatever you want to call it.\"\nUsing employees' AI abilities as a measure of whether they should get a bonus, promoted - or even sacked - is fast becoming more common.\nAccenture CEO Julie Sweet told the Rapid Response podcast in March: \"Today, AI at Accenture is how we do work. So if you want to get promoted, you've got to do the things that we do in order to operate at Accenture.\"\nAnd big names like Disney, Meta, JP Morgan and KPMG have introduced \"AI leaderboards\" to track and rank employees' usage of the array of LLMs and platforms at their disposal, according to media reports, external. Crypto trading platform Coinbase has already fired engineers who didn't complete AI training, as requested by the chief executive, Brian Armstrong, external.\nIt demonstrates how eager business leaders are to see a return from their AI investments, especially when 94% of companies have yet to see significant value from AI, according to a report, external by consultants McKinsey.\nEmployees feel they have to get on board, thanks to the current state of the jobs market - in the UK, vacancies have hit a five-year low.\nMeanwhile, 75% of the 1,881 UK jobseekers polled in July by recruiter Gi Group say they would not be put off applying to an organisation that had introduced AI proficiency into individual performance reviews. Around 22% said it would be off-putting.\n\"It's like being in the sea and you see a giant wave coming. You can get out a surfboard and try and ride it as long as possible, or you can just let it take you under. But you can't stop the wave,\" says Trevithick.\nBut what's going on at the large consultancy Pamela (her name has been changed to protect her identity) works for isn't sitting right with her.\nShe's a US-based senior executive who has observed that, while there isn't a formal mandate for employees to use AI, it's obviously determining who is rewarded, and who is left behind.\n\"The ground is shifting under us. You've got to demonstrate [AI] fluency and fluidity as one of your key achievements. It's kind of quiet where nobody's saying, 'learn AI or else'. But let me tell you, in performance reviews, they reward who uses it well,\" says Pamela.\nThat shift, she adds, means that AI capabilities are now counting for more than actual experience, which is creating a \"two tier workforce\".\n\"You've got the same job title, same tenure, but different value based on whether someone treats AI as a threat or a tool - that gap widens really quickly once leadership notices it,\" says Pamela.\n\"AI fluency beats credentials every day. Somebody that has 15, 20 years of experience and no AI fluency will be passed over for those that have, say, three years, but are fast with the tools.\"\nShe adds: \"If you're not visibly using AI, you see slower promotion timelines. It's harder to be seen, and it's harder to fight being on that shortlist.\"\nBut is it legal for companies to shift the goal posts like this?\nLegally, bosses are in the clear, confirms Tina Chander, partner and employment lawyer at Weightmans. But she says it does open up questions about pay and fairness.\n\"The question then becomes whether the employer increases expectations on the basis that the employee can now produce more work. Is that fair?\" questions Chander.\n\"And if an employee is effectively doing more because AI has made them more efficient, should they be rewarded differently? Or are they effectively making themselves redundant, thus acting as a disincentive to be productive?\"\nChander advises businesses to have clear policies, training and boundaries in place, otherwise they risk employees opening up disputes about fairness, performance expectations and job security.\nIndeed, from January 2027, UK employees will have six months to submit unfair dismissal claims compared with the current three months, and will be able to do so after just six months service, rather than the current two years.\nYet HR consultant Tina Rahman says employers aren't currently being transparent enough in telling employees why they want AI to be part of people's jobs, and what the end purpose of that is - which she agrees is to save costs and time, but also to cut down on outsourcing.\n\"Because they misunderstand it, this is not being reflected to employees,\" says Rahman, who runs a London-based consultancy, HR Habitat.\nA lack of clarity around AI usage is certainly causing discontent at Pamela's company.\n\"Leadership is being inconsistent and vague on purpose. Firms want productivity gains without owning the disruption narrative,\" she says.\n\"If something goes wrong, they're going to say, 'I didn't tell you to do that. Where'd you get that from?' Then if you did something with AI, and it works, great.\"\nMandating AI use at work can become purely performative, rather than having any real positive impact, warns Kamila Miller, applied AI researcher and lecturer at Henley Business School.\n\"Make AI usage a KPI [key performance indicator], and people will log their interactions to hit the metric, route work through a chatbot that did not need it, and generate AI-flavoured outputs that look productive on a dashboard. You will measure adoption. You will not measure judgement, learning, or better decisions,\" states Miller, who is based in Reading.\n\"You have not made people more skilled - you have made them more obedient.\"\nSome firms have acknowledged those arguments.\nIn April, Luis von Ahn, the CEO of Duolingo, told the podcast Silicon Valley Girl, external that his language learning firm is no longer using AI use as part of performance reviews.\n\"We found that people... were asking: 'Do you want us to use AI for AI's sake?'\n\"In the end we backtracked and we said: 'Look, the most important thing for your performance is that you are doing, whatever your job is, as well as possible. A lot of times AI can help you with that. But if it can't, I'm not going to force you to do that.'\"\nMeanwhile, in May, the Financial Times reported, external that Amazon had shut down an internal leaderboard which tracked employee's use of AI. The report said employees had been attempting to climb the rankings by setting AI needless tasks.\nDespite those high-profile moves, some staff still they need to show AI proficiency - Pamela is one of those.\nIn her mid 50s, she plans to retire within 10 years, and wants to keep her job so she doesn't risk losing any pension and health benefits. She's visibly stepping up how AI is helping her bring in new clients, and making sure she's being credited for it.\nAs for Duncan Trevithick, he's doing his best to future proof himself with a number of side projects.\n\"If AI can do a job better than you can, it makes sense for the business to replace you. That's how the capitalist model works. So it's about, how can you move into a position where you own assets where you can leverage AI, and then you benefit,\" says Trevithick.\n- Published3 July\n- Published30 July\n- Published28 July",
    "bodyJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\n「そして、AI によって従業員の効率が向上したために、従業員が効果的により多くの仕事をこなしている場合、別の方法で報酬を与えるべきでしょうか? それとも、従業員は事実上自分自身を余らせて、生産性の阻害要因となっているのでしょうか?」\nチャンダー氏は企業に対し、明確なポリシー、トレーニング、境界線を設けるようアドバイスしている。そうしないと、公平性、パフォーマンスの期待、雇用の安全に関して従業員が紛争を引き起こす危険がある。\n実際、2027年1月から英国の従業員は不当解雇の申し立てを提出できる期間が現在の3か月から6か月となり、現在の2年間ではなくわずか6か月の勤務後に提出できるようになる。\nしかし、人事コンサルタントのティナ・ラーマン氏は、雇用主は現在、なぜAIを人々の仕事の一部にしたいのか、その最終目的は何なのかを従業員に伝えるのに十分な透明性を持っていないと述べ、コストと時間を節約するだけでなく、アウトソーシングを削減することにも同意する。\nロンドンを拠点とするコンサルティング会社HRハビタットを経営するラーマン氏は、「彼らが誤解しているため、このことが従業員に反映されていない」と話す。\nAIの利用に関する明確性の欠如が、パメラ氏の会社に不満を引き起こしているのは確かだ。\n「リーダーシップは意図的に一貫性がなく、曖昧になっています。企業は、破壊的なストーリーを自分のものにすることなく、生産性の向上を望んでいます」と彼女は言います。\n「何か問題が起こったら、彼らは『そんなことするように言ったんじゃない。どこからそんなものを手に入れたの？』と言うだろう。」それで、AI を使って何かをやって、それがうまくいったとしたら、それは素晴らしいことです。」\n職場での AI 使用の義務化は、実際にプラスの効果をもたらすというよりは、純粋にパフォーマンス重視になる可能性があると、応用 AI 研究者でありヘンリー ビジネス スクールの講師を務めるカミラ ミラー氏は警告します。\n「AI の利用状況を KPI (重要業績評価指標) にすれば、人々は指標を達成するために対話を記録し、必要のなかった作業をチャットボットにルーティングし、ダッシュボード上で生産的に見える AI 風味の出力を生成するでしょう。採用を測定することになります。判断力、学習、またはより良い意思決定を測定することはありません」と、レディングに拠点を置くミラー氏は述べています。\n「あなたは人々をより熟練させたのではなく、彼らをより従順にさせたのです。」\n一部の企業はこうした主張を認めている。\nDuolingoの最高経営責任者（CEO）、ルイス・フォン・アン氏は4月、社外向けのポッドキャスト「Silicon Valley Girl」に対し、同社の語学学習会社は業績評価の一環としてAIの利用をやめたと語った。\n「私たちは、人々が『AIのためにAIを使ってほしいですか？』と尋ねていることに気づきました。\n「結局、私たちは撤回し、こう言いました。『ほら、あなたのパフォーマンスにとって最も重要なことは、どんな仕事であっても、できる限り最善を尽くすことだ。多くの場合、AI がそれを助けてくれます。でもそれができないなら、私はあなたにそれを強制するつもりはありません。」\n一方、5月にフィナンシャル・タイムズ紙は、アマゾンが従業員のAI利用状況を追跡する社内リーダーボードを閉鎖したと社外向けに報じた。報告書によると、従業員はAIに不必要なタスクを設定することでランキングを上昇させようとしていたという。\nこうした注目度の高い動きにもかかわらず、一部のスタッフは依然として AI の熟練度を示す必要があり、パメラもその 1 人です。\n50代半ばの彼女は10年以内に退職する予定で、年金や健康保険を失うリスクを冒さないために仕事を続けたいと考えています。彼女は、新しい顧客の獲得に AI を活用する方法を目に見えて強化しており、その功績が確実に認められるようにしています。\nダンカン・トレビシックに関しては、彼は多くのサイドプロジェクトで将来の自分自身を証明するために最善を尽くしています。\n「AI があなたよりもうまく仕事ができるのであれば、企業があなたに取って代わるのは理にかなっています。それが資本主義モデルの仕組みです。つまり、AI を活用できる資産を所有する立場にどう移行して利益を得ることができるかということです」と Trevithick 氏は言います。\n- 7 月 3 日発行\n- 7 月 30 日発行\n- 7 月 28 日発行",

    "id": "i-m-27-and-i-ve-already-written-my-will-df18d2e0",
    "title": "I'm 27 and I've already written my will - here's why",
    "titleJa": "私は 27 歳で、すでに遺言書を書いています - これがその理由です",
    "summaryJa": "私は 27 歳で、すでに遺言書を書いています - これがその理由です- 公開されました",
    "bodyOriginal": "I'm 27 and I've already written my will - here's why\n- Published\nWriting a will is probably not on the to-do lists of most 27-year-olds.\nBut Erin Atkinson has already decided what should happen to her money and belongings when she dies.\n\"At first it felt quite surreal because you associate wills with older people,\" she says.\nErin works in psychological research at a London university and moved to the capital from Bristol four years ago.\nShe now rents and, although she did not want to share her exact salary, does not see herself as particularly wealthy. Even so, she has already decided where some of her things should go.\nHer £7,000 car will go to her sister. A gold necklace given to her by her partner will go back to him. And she has asked for some of her money to go to a cause that matters deeply to her.\n\"One thing that's close to my heart is an endometriosis charity,\" she says.\n\"It felt really empowering that I could have that written down to say I want X amount donated.\"\nFor many young people, however, making a will may not seem necessary, particularly if they feel they have little to leave behind.\nThe 2025 National Wills Report found that just one in five 18 to 24-year-olds has a will in place. That rises to 33% of 22 to 34-year-olds, compared with 56% of people aged over 55.\nSophia Maslin, founder of Morby, an app that allows people to create wills online, says the idea that you need to own a lot before making a will is one of the biggest misconceptions she comes across.\n\"People believe they don't own enough. But actually, if you've got some sort of savings, investments, pensions, your social media accounts, if you've got pets, even funeral wishes, these are all things to think about,\" she says.\nFor Erin, the idea of making a will first came up when her friend bought a home.\nThen she began seeing Maslin talking about wills on TikTok. Maslin had shared the story of her cousin, who died young without a will, and how complicated things became for her family.\nSeeing her story made Erin think more seriously about making one for herself, while seeing the effect of her own grandmother's will on her family also influenced her.\n\"My grandma passed and she had a will and it was very complex because we have quite a large family. Seeing the will written in a way that was very directive showed me you can take a lot of pressure off the family,\" she says.\nThe process also made Erin see she had more financial assets than she realised, such as premium bonds.\nWhy a will can matter even when you're young\nEleanor Hodgson from Crombie Wilkinson Solicitors says there can be practical reasons for making a will even if you don't have that many assets.\n\"It's not just your assets that it helps because there's still someone that has to deal with your bank accounts and any debts you have, and it's [being] able to name a person that can legally deal with that without having to jump through hoops,\" she says.\nThe difficulties of not having a will can be hard to appreciate until the time comes, Hodgson adds.\nMaslin says young people can be tempted to put off making a will, assuming it is something they will need later in life.\n\"The reality is that unexpected things happen at every stage of life,\" she says.\nValue is not just in money\nFor Erin, some of the things in her will are worth more to her emotionally than financially.\nHer will also sets out some of the smaller details she would like her family to know about, from a poem she wants read at her funeral, to the drink she would like served.\nThinking about those details did not feel morbid to her.\n\"For me, writing a will wasn't about expecting the worst. It was about taking responsibility and making life easier for the people I care about,\" she says.\nHow do you make a will?\nWriting a will can seem daunting and expensive. But there are ways to get one written for free or at a lower cost.\nFor example, every November, Will Aid, external works with solicitors who volunteer their time and waive their fee for writing a basic will.\nOnce you have a solicitor, there are a few things to think about:\nChoose your beneficiaries: Decide who you want to leave your money and possessions to, whether that's family, friends or a charity. If you have children under 18, you can also name guardians for them.\nChoose an executor: This is the person who will make sure your wishes are carried out. It could be a trusted family member or a solicitor, but check whether they charge a fee.\nThink about pets: You can say who you would like to look after them after you die.\nLeave funeral wishes: You can include your preferences, such as whether you want to be buried or cremated, as well as music, readings or flowers.\nKeep your will somewhere safe and make sure someone you trust knows where it is. If your will cannot be found, it can cause delays and may mean your wishes are not followed.\nRelated topics\n- Published1 November 2025\n- Published8 May\n- Published24 July 2023",
    "bodyJa": "私は 27 歳で、すでに遺言書を書いています - これがその理由です\n- 公開されました\nおそらく、ほとんどの 27 歳のやるべきことリストに遺言書を書くことは入っていないでしょう。\nしかし、エリン・アトキンソンさんは、自分が死んだときに自分のお金と持ち物をどうするかをすでに決めています。\n「遺言書というと高齢者を連想するので、最初はかなり現実離れした感じがしました」と彼女は言う。\nエリンはロンドンの大学で心理学の研究に携わっており、4年前にブリストルからロンドンに移住しました。\n彼女は現在賃貸に住んでおり、正確な給料を明かしたくなかったものの、自分が特に裕福だとは思っていません。それでも、彼女は自分のもののいくつかをどこに置くべきかをすでに決めています。\n彼女の7,000ポンドの車は妹のものになります。パートナーから贈られた金のネックレスは彼に返すことになります。そして彼女は、彼女にとって非常に重要な目的のために資金の一部を寄付するよう求めました。\n「私にとって心に残っていることの一つは、子宮内膜症に対する慈善活動です」と彼女は言います。\n「X額寄付してほしいと紙に書いてもらうことができて、本当に力づけられたと感じました。」\nしかし、多くの若者にとって、特に残すべきものがほとんどないと感じている場合には、遺言書を作成する必要はないと思われるかもしれません。\n2025 年の国民遺言報告書によると、18 ～ 24 歳の 5 人に 1 人しか遺言書を持っていないことがわかりました。これは22～34歳では33％に上昇するのに対し、55歳以上では56％となっている。\nオンラインで遺言書を作成できるアプリ「Morby」の創設者であるソフィア・マスリン氏は、遺言書を作成する前に多くの財産を所有する必要があるという考えは、彼女が遭遇する最大の誤解の1つだと語る。\n「人々は、自分には十分な財産がないと信じています。しかし、実際には、何らかの貯蓄、投資、年金、ソーシャルメディアのアカウントがある場合、ペットを飼っている場合、さらには葬儀の希望さえも、これらすべてを考慮する必要があります」と彼女は言います。\nエリンさんにとって、遺言書を作成するという考えは、友人が家を購入したときに初めて思いつきました。\nそれから彼女は、マスリンがTikTokで遺言について話しているのを見るようになった。マスリンさんは、遺言書もなく若くして亡くなったいとことの話をし、家族にとって状況がいかに複雑になったかを語った。\n彼女の物語を見て、エリンは自分用に何かを作ることをもっと真剣に考えるようになりましたが、同時に自分の祖母の遺言が家族に与えた影響を見て影響を受けました。\n「祖母が亡くなり、彼女は遺言書を持っていました。私たちは大家族なので、とても複雑でした。非常に指示的な方法で書かれた遺言書を見て、家族から大きなプレッシャーを取り除くことができることがわかりました」と彼女は言います。\nこのプロセスにより、エリンさんはプレミアム債など、自分が思っているよりも多くの金融資産を持っていることにも気づきました。\nたとえ若くても遺言書が重要である理由\nCrombie Wilkinson Solicitors の Eleanor Hodgson 氏は、それほど多くの資産を持っていない場合でも、遺言書を作成する実際的な理由がある可能性があると述べています。\n「これが役立つのはあなたの資産だけではありません。なぜなら、あなたの銀行口座やあなたが抱えているあらゆる借金を処理しなければならない人がまだいるからです。そして、難しい手続きを飛び越えることなく、法的にそれを処理できる人を指名することができるのです」と彼女は言う。\n遺言書がないことの難しさは、その時が来るまで理解するのが難しいかもしれない、とホジソン氏は付け加えた。\nマスリン氏は、若い人たちは、遺言書は将来必要になるものだと思い込み、遺言書の作成を先延ばしにしたくなる可能性があると言う。\n「現実には、人生のあらゆる段階で予期せぬことが起こります」と彼女は言います。\n価値はお金だけではありません\nエリンにとって、遺言書の中には経済的よりも感情的に価値のあるものもあります。\n彼女の遺書には、葬儀で読んでもらいたい詩から、出してほしい飲み物まで、家族に知ってもらいたい細かい詳細もいくつか書かれている。\nそれらの詳細について考えることは、彼女にとって病的なものとは感じませんでした。\n「私にとって、遺書を書くということは最悪の事態を予想することではありませんでした。それは責任を負い、私が大切にしている人々の生活を楽にすることでした」と彼女は言う。\n遺言はどうやって作るのですか？\n遺言書を書くのは気が遠くなり、費用がかかるように思えるかもしれません。しかし、無料または低コストで作成してもらう方法があります。\nたとえば、ウィル・エイドは毎年 11 月に外部の弁護士と協力しており、ボランティアで時間を割いて基本的な遺言書の作成手数料を免除しています。\n弁護士に依頼したら、次のことを考慮する必要があります。\n受益者を選択する: 家族、友人、慈善団体など、お金や財産を誰に残すかを決めます。 18 歳未満の子供がいる場合は、保護者を指名することもできます。\n遺言執行者を選択する: 遺言執行者はあなたの願いを確実に実現する人です。信頼できる家族や弁護士かもしれませんが、手数料がかかるかどうかを確認してください。\nペットについて考えてみましょう。自分が死んだ後、誰にペットの世話をしてもらいたいかを言うことができます。\n葬儀の希望を残す: 埋葬か火葬のどちらを希望するか、音楽、朗読、花などの希望を含めることができます。\n遺言書は安全な場所に保管し、信頼できる人に遺言書がどこにあるかを知らせてください。遺言書が見つからない場合、遅れが生じたり、遺言書が守られなかったりする可能性があります。\n関連トピック\n- 2025 年 11 月 1 日発行\n- 5 月 8 日公開\n- 2023 年 7 月 24 日公開",

  {
    "id": "openai-says-it-cracked-90-year-old-maths-cf450d67",
    "title": "OpenAI says it cracked 90-year-old maths problem in 88 hours",
    "titleJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表",
    "summaryJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表- 公開されました",
    "bodyOriginal": "OpenAI says it cracked 90-year-old maths problem in 88 hours\n- Published\nOpenAI says it has found a solution to a decades-old advanced maths problem in a matter of hours using a new artificial intelligence (AI) model and thousands of AI bots.\nThe ChatGPT-maker said on Tuesday, external that by focusing a group of roughly 10,000 AI agents, or AI bots that undertake tasks somewhat autonomously, it solved a notoriously difficult maths problem in just 88 hours.\nThe problem was part of the Navier-Stokes equations, external, which concern how fluids move. For 90 years important aspects of the problems have lacked a proof, the argument underlying a correct math equation.\nOpenAI called the solution which it found a \"milestone\" and evidence that AI tools are improving quickly.\nOpenAI's solution has yet to be verified independently or publicly accepted by The Clay Mathematics Institute, a maths organization based in the US which runs the Millennium Prize that offers big money to the first to solve certain mathematical conundrums.\nThe company said that at the end of August, it started to train a new model that quickly showed that it was adept at maths. AI models are computer programs trained on huge amounts of data to recognize and predict patterns in information.\nWhile the new OpenAI model remains a tool only used within the company, as it is \"significantly more capable\" than the company's most recent AI model release, its researchers decided to use it on certain notable advanced maths problems.\nOpenAI admitted that last week on 1 September, it had \"heard rumors that two Millennium Prize problems had been resolved\" and so decided to put thousands of AI bots trained on the new internal model to work attempting to solve some of the remaining problems.\nBy Sept 5, or roughly 88 hours after it had set 10,000 AI bots to the task, OpenAI had found a solution to what's referred to as the Navier–Stokes existence and smoothness problem.\nThe problem is at the heart of turbulence, which is a phenomenon that is still not well understood.\nAlthough it took the AI bots seemingly little time to reach a solution, OpenAI said the bots exchanged nearly 3 million messages and used up 130 billion output tokens, or the individual lines of text and code an AI model produces in answers, on Navier–Stokes alone.\nSuch an effort would have cost roughly $10m (£7.3m), based on OpenAI's own pricing, external for output from its most advanced models.\nThe solution that OpenAI says it has now reached for the Navier–Stokes existence and smoothness problem resolved two out of the four statements in the proof that the Millennium Prize had demanded. The prize is worth $1m to a winner.\n\"Our goal in releasing this result is to report on the substantial progress of our AI models\", OpenAI said on Tuesday. \"We do not intend to claim the Millennium Prize for this result.\"\nAlready the company's claim is stirring some controversy.\nTristan Buckmaster, a mathematics professor at New York University, said on Tuesday, external that he and Levent Alpöge, a mathematician working for OpenAI rival Anthropic, had also been working toward solutions for the problem.\nThe duo had been using OpenAI's tool Codex in their work. But Buckmaster said that on 3 September, he found out that \"information about our progress had been passed to OpenAI.\"\nBuckmaster's statement came the same day, but hours before, OpenAI published its Navier–Stokes work. He claimed that OpenAI did not begin working on the Navier–Stokes equations until \"after information about our work had reached OpenAI.\" He included text from emails exchanged with OpenAI over the work and his questions of the company's timing and methods.\nBuckmaster added that he had not yet read OpenAI's full proof, but felt compelled to go public with \"what I was told, when, and what was proposed to me...because the alternative is to let a sequence of announcements say something I know to be false.\"\nOpenAI on Tuesday congratulated the \"concurrent work\" of Buckmaster and Alpöge, calling it \"remarkable.\"\nThe company said it had not seen \"any of their work through any means until they released it publicly\" and that no user data was accessed in its work on the Navier–Stokes problem.\n\"While unlikely, we cannot rule out that de-identified data derived from their usage of our products helped improve our models\", the company added. \"However, our proofs differ significantly and even the precise results proved are different.\"\nRelated topics\n- Published1 day ago\n- Published11 hours ago",
    "bodyJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表\n- 公開されました\nOpenAIは、新しい人工知能（AI）モデルと数千のAIボットを使用して、数十年来の高度な数学の問題に対する解決策を見つけたと発表した。\nChatGPTの作成者は火曜日、社外向けに、約1万人のAIエージェント、つまりある程度自律的にタスクを実行するAIボットのグループを集中させることで、悪名高い難解な数学問題をわずか88時間で解決したと発表した。\nこの問題は、流体の動きに関する外部のナビエ・ストークス方程式の一部でした。 90 年間、問題の重要な側面には証明、つまり正しい数学方程式の基礎となる議論が欠けていました。\nOpenAIは、発見したソリューションを「マイルストーン」であり、AIツールが急速に改良されていることの証拠であると呼んだ。\nOpenAI のソリューションはまだ独立して検証されておらず、特定の数学的難題を最初に解決した者に多額の賞金を与えるミレニアム賞を運営する米国に本拠を置く数学団体であるクレイ数学研究所によって正式に承認されていません。\n同社は、8月末に新しいモデルのトレーニングを開始し、それが数学に熟達していることをすぐに示したと述べた。 AI モデルは、情報のパターンを認識して予測するために、膨大な量のデータに基づいてトレーニングされたコンピューター プログラムです。\n新しい OpenAI モデルは依然として社内でのみ使用されるツールですが、同社の最新の AI モデルリリースよりも「大幅に機能が向上」しているため、同社の研究者らは特定の注目すべき高度な数学問題にこれを使用することを決定しました。\nOpenAIは、先週9月1日に「ミレニアム賞の問題が2つ解決されたという噂を聞いた」ことを認め、そのため、新しい内部モデルで訓練された数千のAIボットを稼働させ、残りの問題のいくつかを解決しようと試みることを決定したと認めた。\n9 月 5 日までに、つまり 10,000 台の AI ボットをタスクに設定してから約 88 時間後、OpenAI は、ナビエ・ストークスの存在と滑らかさの問題と呼ばれるものに対する解決策を見つけました。\nこの問題は乱気流の中心にあり、まだよく理解されていない現象です。\nAI ボットが解決策に到達するまでにほとんど時間がかからなかったように見えましたが、OpenAI によると、ボットは 300 万近くのメッセージを交換し、Navier-Stokes だけで 1,300 億の出力トークン、つまり AI モデルが回答で生成するテキストとコードの個々の行を使い果たしました。\nこのような取り組みには、OpenAI 独自の価格設定に基づくと、最先端モデルからの外部出力に基づくと、およそ 1,000 万ドル (730 万ポンド) の費用がかかることになります。\nOpenAIによると、ナビエ・ストークスの存在と滑らかさの問題に関して現在到達した解決策は、ミレニアム賞が要求していた証明の4つの記述のうち2つを解決したという。優勝者には賞金 100 万ドルの価値があります。\nOpenAIは火曜日、「この結果を発表する目的は、AIモデルの大幅な進歩を報告することである」と述べた。 「この結果に対してミレニアム賞を請求するつもりはありません。」\n同社の主張はすでにいくつかの論争を巻き起こしている。\nニューヨーク大学の数学教授トリスタン・バックマスター氏は火曜日、自身とOpenAIのライバルであるアンスロピック社に勤める数学者のレベント・アルポージ氏もこの問題の解決に向けて取り組んでいると社外で語った。\n二人は仕事で OpenAI のツール Codex を使用していました。しかしバックマスター氏は、9月3日に「我々の進捗状況に関する情報がOpenAIに渡されていた」ことを知ったと述べた。\nバックマスター氏の声明は同日発表されたが、その数時間前にOpenAIはナビエ・ストークスの研究結果を公開した。同氏は、OpenAIは「私たちの研究に関する情報がOpenAIに届いた後」までナビエ・ストークス方程式の研究を開始しなかったと主張した。同氏は、この作業に関して OpenAI と交換した電子メールのテキストと、同社のタイミングや方法についての質問を含めた。\nバックマスター氏は、まだOpenAIの完全な証拠を読んでいないが、「私が言われたこと、いつ、そして私に提案されたことを公表せざるをえないと感じたと付け加えた。なぜなら、代わりの方法は、私が虚偽であるとわかっていることを一連の発表で言わせることだからだ」と付け加えた。\nOpenAIは火曜日、バックマスター氏とアルポージ氏の「同時業績」を「注目に値する」と称賛した。\n同社は、「公に発表するまで、いかなる手段を通じても彼らの研究内容を目にしたことはなく」、ナビエ・ストークス問題に関する研究においてユーザーデータへのアクセスは一切なかったと述べた。\n「可能性は低いですが、当社製品の使用から得られた匿名化されたデータが当社のモデルの改善に役立っていた可能性を排除することはできません」と同社は付け加えた。 「しかし、私たちの証明は大きく異なり、証明された正確な結果さえ異なります。」\n関連トピック\n- 1 日前に公開\n- 11 時間前に公開",

  {
    "id": "trump-administration-expresses-profound-56c775a2",
    "title": "Trump administration expresses 'profound concern' over Ford's ties to China",
    "titleJa": "トランプ政権、フォードと中国の関係に「深い懸念」表明",
    "summaryJa": "フォードのジム・ファーリー最高経営責任者（CEO）に宛てた書簡の中で、米国運輸省長官ショーン・ダフィーは、中国企業を巻き込んだ自動車メーカーの戦略的軌道に疑問を呈した。",
    "bodyOriginal": "The Trump administration expressed \"profound concern\" Tuesday about Ford Motor's ties to Chinese companies that it believes could be detrimental to the Detroit carmaker and U.S. automotive industry.\nIn a letter addressed to Ford CEO Jim Farley, Transportation Secretary Sean Duffy questioned the automaker's strategic trajectory with Chinese companies \"as it pertains to American national automotive manufacturing integrity, supply chain exposure, and reliance on technologies of foreign adversaries.\"\nAs examples, Duffy cited Ford's ties to Chinese companies such as battery provider CATL and referenced a framework proposed during an auto show earlier this year in Detroit \"to facilitate Chinese joint ventures on United States soil.\"\nFord has a licensing agreement to utilize battery technologies, including the production of lithium iron phosphate batteries, from Contemporary Amperex Technology Co., or CATL.\nFord's deal with CATL was originally announced in 2023 but has drawn renewed attention amid tensions between the U.S. and China as well as Ford's plan to use the battery technologies for energy storage systems.\n\"While DOT recognizes the intense competitive pressures of the global market, the Company's recent strategic decisions paint a troubling picture of a foundational American brand actively intertwining its future with Chinese state-backed enterprises,\" Duffy's letter read.\nFord, which regularly touts its position as the top-producing automaker in the U.S., did not immediately respond to a request for comment.\nDuffy urged Farley, who has been complimentary of Chinese competitors as well as the Trump administration's attempt to promote U.S. manufacturing, to \"reflect on these concerns and national necessities and adopt reasonable strategies that prioritize American workers, utilize allied supply chains, and promote the self-reliance and integrity of the domestic automotive industry.\"\n— CNBC's Meghan Reeder and Phil LeBeau contributed to this report.",
    "bodyJa": "トランプ政権は火曜日、フォード・モーターと中国企業との関係について「深い懸念」を表明し、デトロイトの自動車メーカーと米国の自動車産業に悪影響を及ぼす可能性があると考えている。\nショーン・ダフィー運輸長官は、フォードのジム・ファーリー最高経営責任者（CEO）に宛てた書簡の中で、「米国国家の自動車製造の誠実さ、サプライチェーンのエクスポージャ、外国敵の技術への依存に関わるものであるため」、フォードの中国企業との戦略的軌道に疑問を呈した。\nダフィー氏は例として、フォードと電池供給会社CATLなどの中国企業との関係を挙げ、「米国本土での中国の合弁事業を促進するため」今年初めにデトロイトで開催された自動車ショーで提案された枠組みに言及した。\nフォードは、コンテンポラリー・アンペレックス・テクノロジー社（CATL）から、リン酸鉄リチウム電池の製造を含む電池技術を利用するライセンス契約を結んでいる。\nフォードとCATLとの契約は当初2023年に発表されたが、米国と中国の緊張やエネルギー貯蔵システムに電池技術を利用するというフォードの計画の中で再び注目を集めている。\nダフィー氏の書簡には「DOTは世界市場の激しい競争圧力を認識しているが、同社の最近の戦略的決定は、米国の基礎ブランドが自社の将来を中国政府支援の企業と積極的に結びつけるという憂慮すべき状況を浮き彫りにしている」と述べた。\nフォードは定期的に米国生産トップの自動車メーカーとしての地位を宣伝しているが、コメント要請には応じていない。\nダフィー氏は、中国の競合他社や米国の製造業を促進するトランプ政権の試みを称賛してきたファーリー氏に対し、「こうした懸念と国家的必要性を熟考し、米国の労働者を優先し、同盟国のサプライチェーンを活用し、国内自動車産業の自立と誠実性を促進する合理的な戦略を採用する」よう強く求めた。\n— CNBC の Meghan Reeder と Phil LeBeau がこのレポートに貢献しました。",

  {
    "id": "this-alternative-energy-stock-is-more-po-22e4757f",
    "title": "This alternative energy stock is more popular than SpaceX in the options pits. Here's why",
    "titleJa": "この代替エネルギー株は、オプションピットではスペースXよりも人気がある。その理由は次のとおりです",
    "summaryJa": "同グループの年初来の上昇率が40％を超える中、原油価格は90ドルを超え、S&P500指数のエネルギー株は52週間ぶりの高値に近づいている。エネルギー株は2026年にS&P500の中で最もパフォーマンスの高いセクターの座を維持しているにもかかわらず、オプショントレーダーは従来型エネルギー資産の強さが今後も続くことに納得していないようだ。その代わりに、データセンターや人工知能の産業化に関連したオンサイト燃料電池システムを販売する、時価総額820億ドルの電力会社ブルーム・エナジーに彼らは殺到している。",
    "bodyOriginal": "Crude oil is back above $90 and energy stocks in the S&P 500 index are approaching fresh 52-week highs as the group's year-to-date rally surpasses 40%.\nDespite energy stocks holding the title as the best-performing sector in the S&P 500 in 2026, options traders seem unconvinced the strength in conventional energy assets will continue. Instead, they're piling into Bloom Energy, the $82-billion market-cap power provider that sells onsite fuel-cell systems linked to data centers and artificial intelligence industrialization.\nBloom is up 1,800% over the past three years. Shares jumped more than 10% Tuesday as options trading on the stock surged to over 2.5 times the 30-day average for a total premium exchange of almost half a billion dollars by midday, according to data from Cboe LiveVol and SpotGamma. That's more than the $350 million traded in SpaceX options and dwarfs the $25 million traded in Valero Energy, the most volatile S&P 500 energy stock.\nShares of Bloom are up more than 30% in the past week, and they have surged almost 70% since the company reported earnings in late July. The company will join the S&P 500 on Sept. 21, S&P Dow Jones Indices announced at the end of last week.\nThe inclusion will mark the first time an energy stock has been added to the index since 2022, according to UBS analyst Manav Gupta. From an options standpoint, Bloom will stand out among S&P energy stocks in a big way.\nImplied volatility in Bloom is currently over 90%, according to ThinkOrSwim, notably higher than any S&P 500 energy stocks. In that group, Valero has the highest volatility at 50%, compared to ExxonMobil's 30% reading. The most popular contract in Bloom by volume Tuesday was the 300-strike call expiring Friday, a $4.65 trade that needs the stock to add another 8% to break even.\nBy contrast, options flows around the U.S. Oil Fund (USO) and the State Street Energy Select Sector SPDR ETF (XLE) were mixed. Trading volume was 50% above the 30-day average in USO, which traded around $90 million. Almost the exact same number of put contracts were likely bought as calls, and the three most popular contracts by volume were puts, according to SpotGamma data.\nIn XLE, 48,000 calls were likely bought, compared to 34,000 puts, with $31 million of the total $37 million in premium tied to calls. Among the top five contracts traded in XLE, three were puts, according to SpotGamma.",
    "bodyJa": "同グループの年初来の上昇率が40％を超える中、原油価格は90ドルを超え、S&P500指数のエネルギー株は52週間ぶりの高値に近づいている。\nエネルギー株は2026年にS&P500の中で最もパフォーマンスの高いセクターの座を維持しているにもかかわらず、オプショントレーダーは従来型エネルギー資産の強さが今後も続くことに納得していないようだ。その代わりに、データセンターや人工知能の産業化に関連したオンサイト燃料電池システムを販売する、時価総額820億ドルの電力会社ブルーム・エナジーに彼らは殺到している。\nブルームは過去 3 年間で 1,800% 増加しました。 Cboe LiveVolとSpotGammaのデータによると、株式のオプション取引が正午までにプレミアム交換総額約5億ドルの30日間平均の2.5倍以上に急増したため、火曜日の株価は10％以上上昇した。これはスペースXオプションの取引額3億5000万ドルを上回り、S&P500種エネルギー株の中でも最も値動きが激しいバレロ・エナジーの取引額2500万ドルに比べれば小さい。\nブルームの株価は過去1週間で30％以上上昇し、同社が7月下旬に決算を発表して以来、70％近く急騰した。 S&Pダウ・ジョーンズ・インデックスは先週末、同社が9月21日にS&P500に加わると発表した。\nUBSのアナリスト、マナブ・グプタ氏によると、今回の組み入れは2022年以来初めてエネルギー株が指数に追加されることになる。オプションの観点から見ると、ブルームはS&Pエネルギー株の中で大きく目立つことになるだろう。\nThinkOrSwimによると、ブルームのインプライド・ボラティリティは現在90％を超えており、S&P 500のエネルギー株よりも顕著に高い。このグループでは、エクソンモービルの30％と比較して、バレロのボラティリティが50％と最も高い。火曜日の出来高ベースでブルームで最も人気のある契約は、金曜日に期限が切れる300ストライクコールで、損益分岐点までに株価にさらに8％を追加する必要がある4.65ドルの取引だった。\n対照的に、米国石油基金（USO）とステート・ストリート・エネルギー・セレクト・セクターSPDR ETF（XLE）を巡るオプションの流れはまちまちだった。出来高はUSOの30日間平均を50％上回り、約9000万ドルで取引された。 SpotGamma のデータによると、ほぼ同じ数のプット契約がコールとして購入された可能性が高く、出来高で最も人気のある 3 つの契約はプットでした。\nXLE では、プット 34,000 件に対してコールが 48,000 件買われた可能性が高く、プレミアム総額 3,700 万ドルのうち 3,100 万ドルがコールに関連していました。 SpotGamma によると、XLE で取引された上位 5 件の契約のうち、3 件はプットでした。",

    "title": "U.S. downplays Iran's seizure of unmanned sub in Hormuz Strait",
    "titleJa": "米国、イランによるホルムズ海峡での無人潜水艦拿捕を軽視",
    "summaryJa": "米軍は火曜日、イランがホルムズ海峡で拿捕したとされる無人潜水艦は「欠陥品」であり、機密データや機密機器は積まれていないと発表した。「米軍が運用する水中無人機が1日以上前に故障した」と米海軍大佐ティム・ホーキンスは米中央軍と共有した声明の中でCNBCに語った。",
    "bodyOriginal": "The U.S. military on Tuesday said an unmanned submersible that Iran reportedly seized in the Strait of Hormuz was \"defective\" and carried no sensitive data or classified equipment.\n\"An underwater drone operated by U.S. forces malfunctioned more than a day ago,\" U.S. Navy Captain Tim Hawkins told CNBC in a statement shared by U.S. Central Command.\nThe drone \"was surveying regional waters in support of ongoing operations,\" Hawkins said, adding, \"U.S. operations in area waters continue.\"\nIran's Revolutionary Guard had boasted earlier Tuesday that it trapped and captured \"one of the most modern, intelligent, unmanned submarines of the American terrorist army at the entrance to the Strait of Hormuz,\" according to a translated post from Iranian state news outlet Fars.\nFars later posted videos and images purporting to show the vessel out of the water.\nBut Hawkins' statement insisted that the drone was hardly a crucial piece of cutting-edge military tech.\n\"The defective drone was an older model that neither collected sensitive data nor carried any classified sonar or radar equipment,\" the captain's statement said.\nIranian media outlets described the sub as a Dive-LD, an autonomous undersea vehicle developed by U.S. defense contractor Anduril. They cost $2.5 million each, DefenseScoop reported in 2024.\nThe development came three days after the U.S. and Iran traded new attacks in the Persian Gulf, rekindling kinetic hostilities in the region even as the Trump administration shifts its strategy toward defeating Tehran economically.\nCentcom said it struck three Iranian crude oil carriers in retaliation for the IRGC firing ballistic missiles at two Navy warships.\nThe U.S. military later struck targets near the oil-export hub Kharg Island, including Iranian oil tankers, Fox News reported Tuesday, citing unnamed senior U.S. officials. Centcom did not immediately respond to CNBC's request for comment on the report.\nThe spotlight on the watercraft offers the latest example of the U.S. military's increasing dependence on autonomous tech to fight the war in the Middle East.\nThis summer, unmanned boat startup Saronic used one of its drone vessels to rescue crew from a helicopter downed in the Hormuz Strait. Saronic's boats were later used in a strike on an Iranian submarine and ship facility.\n— CNBC's Samantha Subin contributed to this report.",
    "bodyJa": "米軍は火曜日、イランがホルムズ海峡で拿捕したとされる無人潜水艦は「欠陥品」であり、機密データや機密機器は積まれていないと発表した。\n「米軍が運用する水中無人機が1日以上前に故障した」と米海軍大佐ティム・ホーキンスは米中央軍と共有した声明の中でCNBCに語った。\nホーキンス氏は、無人機は「進行中の作戦を支援するために地域海域を調査していた」と述べ、「地域海域での米国の作戦は継続している」と付け加えた。\nイラン国営通信社ファルス紙の翻訳記事によると、イラン革命防衛隊は火曜日初め、「ホルムズ海峡入口で米国テロ軍の最も近代的で知能の高い無人潜水艦の一隻」を罠にはめて拿捕したと自慢していた。\nファールス氏はその後、船が水面から出ているところを見せたと称する動画や画像を投稿した。\nしかしホーキンスの声明は、ドローンは最先端の軍事技術の重要な部分ではないと主張した。\n機長の声明によると、「欠陥のあるドローンは古いモデルで、機密データを収集しておらず、機密のソナーやレーダー機器も搭載していなかった」と述べた。\nイランのメディアは、この潜水艦を米国の防衛請負業者アンドゥリルが開発した自律型海中車両であるダイブLDであると説明した。ディフェンススクープは2024年に、それぞれの価格が250万ドルであると報じた。\nこの事態は、米国とイランがペルシャ湾で新たな攻撃を交わしてから3日後に起こり、トランプ政権がイランを経済的に打倒する方向に戦略を転換しているにもかかわらず、この地域での激しい敵対関係が再燃した。\nセントコムは、イラン革命防衛隊が海軍軍艦２隻に弾道ミサイルを発射したことへの報復として、イランの原油運搬船３隻を攻撃したと発表した。\nフォックスニュースが火曜日、匿名の米高官の話として報じたところによると、米軍はその後、石油輸出拠点であるハルグ島付近の標的を攻撃し、その中にはイランの石油タンカーも含まれていた。セントコムはこの報道に関するCNBCのコメント要請にすぐには応じなかった。\nこの水上バイクへのスポットライトは、中東での戦争を戦うために米軍が自動運転技術への依存を高めていることの最新の例を示している。\nこの夏、無人ボートの新興企業サロニックは、ホルムズ海峡で墜落したヘリコプターから乗組員を救出するために自社のドローン船の1つを使用した。サロニッチのボートは後にイランの潜水艦と船舶施設への攻撃に使用された。\n— CNBC のサマンサ・スビンがこのレポートに寄稿しました。",

    "id": "new-hampshire-goes-to-the-polls-in-prima-bcb6b0ee",
    "title": "New Hampshire goes to the polls in primary for key open Senate seat",
    "titleJa": "ニューハンプシャー州、上院の主要議席確保のため予備選挙に向かう",
    "summaryJa": "ニューハンプシャー州の有権者は、引退する民主党上院議員ジーン・シャヒーン氏の後任となる重要な米上院選挙の候補者を指名するため、火曜日に投票所に向かう。民主党も共和党も次期議会で上院の多数派を掌握し議席獲得を目指している。資金集めレースをリードし、2019年から同州第1下院選挙区の代表を務めているクリス・パパス下院議員は、民主党の指名獲得の最有力候補となっている。彼は、最近の世論調査でパパスにわずかに迫っている科学者で民主社会主義者のカリシュマ・マンズールからの挑戦に直面している。",
    "bodyOriginal": "New Hampshire voters head to the polls Tuesday to nominate candidates for a key U.S. Senate race to replace the retiring Democratic Sen. Jeanne Shaheen. Both Democrats and Republicans are aiming to win the seat in their quest to control the Senate in the next Congress.\nRep. Chris Pappas, who leads the fundraising race and has represented the state's 1st Congressional District since 2019, is the favorite to secure the Democratic nomination. He faces a challenge from scientist and democratic socialist Karishma Manzur, who has closed in slightly on Pappas in recent public polls.\nOn the Republican side, former U.S. Sen. John Sununu, of New Hampshire, is the favorite to secure the nomination over former U.S. Sen. Scott Brown, of Massachusetts. Shaheen defeated both Sununu and Brown in different years, but Sununu — whose brother Chris Sununu was a highly popular governor of the Granite State until 2025 — is seen as a formidable candidate in what is shaping up to be a tough election cycle for Republicans as the Iran war drags on and President Donald Trump's popularity slumps.\nThe New Hampshire Senate race is critical to both parties ahead of November's midterm election. Democratic hopes of flipping the Senate would dim if the party can't hold on to Shaheen's seat, as it needs to net four additional seats to flip the upper chamber. If Republicans flip the seat, it would provide a cushion for the GOP to hold on to its Senate majority by requiring Democrats to flip an additional seat.\nThe midterms will determine who controls Congress — and subpoena power — during the last two years of Trump's term. If Democrats flip one or both chambers, they are widely expected to launch sweeping investigations of the Trump administration that are likely to rope in companies that have done business with the administration.\nPappas, who has been endorsed by Shaheen and other top Democrats, such as U.S. Sen. Elizabeth Warren, of Massachusetts, has made anti-corruption efforts a top issue in his campaign. Pappas has largely legislated as a moderate and is a member of the bipartisan Problem Solvers Caucus.\nManzur is running on a platform similar to other democratic socialist candidates who have surged in Democratic primaries across the country, calling for universal healthcare and opposing aid to Israel. She is a scientist by trade, with a Ph.D. in biochemistry and molecular biology.\nPappas has held a lead in the race, but a recent poll from the University of New Hampshire found Manzur had narrowed his lead and was 13 percentage points behind the front-runner.\nSununu, meanwhile, has campaigned as a moderate Republican willing to work across the aisle. Trump has endorsed Sununu in the race, saying \"he will work tirelessly to advance our America First Agenda.\" But Sununu himself has kept Trump at arm's length in advertising, with the president's approval underwater in the Granite State.\nBrown, meanwhile, has targeted \"D.C. special interests\" in advertising, casting himself as an independent. He has trailed heavily behind Sununu in public polling. After he left the Senate, Brown was the U.S. ambassador to New Zealand and Samoa during Trump's first term.",
    "bodyJa": "ニューハンプシャー州の有権者は、引退する民主党上院議員ジーン・シャヒーン氏の後任となる重要な米上院選挙の候補者を指名するため、火曜日に投票所に向かう。民主党も共和党も次期議会で上院の多数派を掌握し議席獲得を目指している。\n資金集めレースをリードし、2019年から同州第1下院選挙区の代表を務めているクリス・パパス下院議員は、民主党の指名獲得の最有力候補となっている。彼は、最近の世論調査でパパスにわずかに迫っている科学者で民主社会主義者のカリシュマ・マンズールからの挑戦に直面している。\n共和党側では、ジョン・スヌヌ元上院議員（ニューハンプシャー州）が、スコット・ブラウン元上院議員（マサチューセッツ州）よりも指名獲得の最有力候補となっている。シャヒーン氏は別の年にスヌヌ氏と​​ブラウン氏の両氏を破ったが、スヌヌ氏（弟のクリス・スヌヌ氏は2025年まで花崗岩州知事で人気が高かった）は、イラン戦争が長引き、ドナルド・トランプ大統領の人気が低迷する中、共和党にとって厳しい選挙サイクルとなりつつある中、手ごわい候補とみなされている。\nニューハンプシャー州上院選挙は、11月の中間選挙に向けて両党にとって極めて重要だ。民主党が上院をひっくり返すにはさらに4議席を獲得する必要があるため、同党がシャヒーン氏の議席を維持できなければ、上院をひっくり返すという期待は薄れるだろう。共和党が議席を入れ替えれば、民主党に追加の議席を入れ替えることを要求することで、共和党が上院過半数を維持するクッションとなる。\n中間選挙では、トランプ大統領の任期最後の2年間、誰が議会と召喚状の権限を掌握するかが決定される。民主党が一方または両方の議院をひっくり返した場合、トランプ政権に対する徹底的な調査を開始すると広く予想されており、これにより政権と取引のある企業が取り込まれる可能性が高い。\nパパス氏はシャヒーン氏のほか、エリザベス・ウォーレン上院議員（マサチューセッツ州）など他の民主党幹部らの支持を受けており、汚職撲滅の取り組みを選挙キャンペーンの最重要課題に据えている。パパス氏は主に穏健派として立法を行っており、超党派の問題解決者議員団のメンバーでもある。\nマンズール氏は全国の民主党予備選で躍進した他の民主社会主義者候補者と同様の綱領で出馬しており、国民皆保険やイスラエルへの援助反対を訴えている。彼女は本業の科学者であり、博士号を取得しています。生化学と分子生物学の分野。\nパパス氏はこのレースでリードを保ってきたが、ニューハンプシャー大学の最近の世論調査では、マンズール氏がリードを縮め、トップランナーとは13ポイントの差をつけられていることが判明した。\n一方、スヌヌ氏は通路を越えて協力する意欲のある穏健派共和党員として選挙運動を行ってきた。トランプ大統領は選挙戦でスヌヌ氏を支持し、「彼は米国第一の課題を推進するためにたゆまぬ努力をするだろう」と述べた。しかし、スヌヌ氏自身は、花崗岩州で大統領の承認が水面下で行われているため、広告宣伝においてトランプ氏を腕を伸ばして接し続けている。\n一方、ブラウン氏は広告業界で「ワシントンD.C.の特別利益」をターゲットにしており、自らを無所属の立場に置いている。同氏は世論調査でスヌヌ氏に大きく後れをとっている。ブラウン氏は上院議員を去った後、トランプ大統領の１期目に駐ニュージーランドおよびサモア米国大使を務めた。",

    "id": "sapporo-to-move-some-beer-production-fro-31a18e29",
    "title": "Sapporo to move some beer production from Canada to US after tariffs",
    "titleJa": "サッポロビール、関税解除を受けてビール生産の一部をカナダから米国に移管へ",
    "summaryJa": "サッポロビール、関税解除を受けてビール生産の一部をカナダから米国に移管へ- 公開されました",
    "bodyOriginal": "Sapporo to move some beer production from Canada to US after tariffs\n- Published\nJapanese brewer Sapporo says it will move some beer production from Canada to the US after new tariffs on Canadian beer took effect on Tuesday.\nThe move follows the introduction of a 50% tariff on beer imported from Canada. For companies shipping beer across the border, that means significantly higher costs.\nChief strategy officer Rieko Shofu described tariffs as \"something out of our control,\" telling Bloomberg that the beer giant would \"move ahead with local production.\"\nSapporo did not immediately respond to the BBC's request for comment. The company plans to shift production of its non-alcoholic beer, currently made in Canada for US customers, to the US by the first half of 2027.\nThe US is one of Sapporo's most important overseas markets, and any shift south of the border will directly affect operations at its Canadian subsidiary, Sleeman Breweries.\nTo mitigate rising costs, the Japanese brewer is considering adding production capacity on the US West Coast. Options include building or buying a brewery, or partnering with a third-party manufacturer.\nSapporo has been building its presence in the US for years and says its flagship Sapporo brand is the country's best-selling Asian beer brand.\nThe company is also investing heavily outside Japan where a shrinking population has weighed on alcohol sales.\nSapporo plans to invest up to ¥400bn ($2.6bn) by 2030 as it seeks to expand overseas and boost profits. Around 30% of the capital is earmarked for overseas markets.\nThe brewer is also looking beyond North America. In July, it announced a partnership with Danish brewer Carlsberg to expand in Southeast Asia.\nSapporo's decision to move production comes as companies adapt to a growing number of tariffs worldwide.\nIn July, the US announced new tariffs on dozens of trading partners, including Canada, raising costs for businesses that rely on cross-border supply chains.\nThe move highlights how some companies are reconsidering where they make goods as trade barriers increase the cost of serving customers from overseas.\nRelated topics\n- Published6 hours ago\n- Published24 July\n- Published8 hours ago",
    "bodyJa": "サッポロビール、関税解除を受けてビール生産の一部をカナダから米国に移管へ\n- 公開されました\n日本のビール会社サッポロは、カナダ産ビールに対する新たな関税が火曜日に発効したことを受け、ビール生産の一部をカナダから米国に移管すると発表した。\nこの措置は、カナダから輸入されるビールに50％の関税が導入されたことを受けたものである。国境を越えてビールを輸送する企業にとって、これはコストの大幅な増加を意味する。\n首席戦略責任者、正府理恵子氏は関税について「我々のコントロールの及ばないもの」と述べ、ビール大手は「現地生産を進める」とブルームバーグに語った。\n札幌はBBCのコメント要請にすぐには応じなかった。同社は現在米国顧客向けにカナダで製造しているノンアルコールビールの生産を、2027年上半期までに米国に移管する計画だ。\n米国はサッポロにとって最も重要な海外市場の一つであり、国境以南への移動はカナダ子会社スリーマン・ブルワリーズの経営に直接影響する。\nコスト上昇を緩和するために、日本のビール会社は米国西海岸での生産能力の追加を検討している。選択肢としては、醸造所の建設や購入、あるいはサードパーティメーカーとの提携などが挙げられます。\nサッポロは長年にわたって米国での存在感を高めており、同社の主力ブランドであるサッポロは米国で最も売れているアジアのビールブランドであるとしている。\n同社は人口減少がアルコールの売り上げに重しとなっている日本国外でも多額の投資を行っている。\nサッポロは海外展開と利益拡大を目指し、２０３０年までに最大４０００億円（２６億ドル）を投資する計画だ。資本金の約30％は海外市場に充てられます。\n醸造家は北米以外にも目を向けています。 7月には、東南アジアでの事業拡大を目的としたデンマークのビール会社カールスバーグとの提携を発表した。\nサッポロの生産移転の決定は、企業が世界中で増加する関税に適応する中で行われた。\n米国は7月、カナダを含む数十の貿易相手国に対する新たな関税を発表し、国境を越えたサプライチェーンに依存する企業のコストが上昇した。\nこの動きは、貿易障壁が海外からの顧客へのサービスコストを増大させる中、一部の企業が製品の製造場所をどのように再考しているかを浮き彫りにしている。\n関連トピック\n- 6 時間前に公開\n- 7 月 24 日発行\n- 8 時間前に公開",

    "id": "chinese-giants-xiaomi-huawei-race-to-get-5907df18",
    "title": "Chinese giants Xiaomi, Huawei race to get ahead of Apple’s rumored foldable iPhone",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Huawei and Xiaomi this week rolled out their latest foldable phones as the Chinese tech giants look to steal a lead on rival Apple, which is rumored to launch its first foldable iPhone on Wednesday.\nXiaomi, the world's third-largest smartphone player, launched the Xiaomi 18 Fold on Monday, a passport-sized device similar to Samsung's Galaxy Z Fold8, which was released earlier this year. Huawei on Monday unveiled the Mate XT2, the third generation of its trifold smartphone, which it pioneered.\nThose launches are no coincidence. Apple is holding an event on Wednesday, where it is rumored to be unveiling the first foldable iPhone, a major new product under new CEO John Ternus.\n\"There is significant pent-up demand for a foldable iPhone within the Apple community,\" Neil Shah, partner at Counterpoint Research, told CNBC on Tuesday. \"Many have refrained from switching to Samsung. Some have switched, but they might come back if there is an amazing foldable iPhone.\"\nApple could ship 6 million foldable iPhones this year, giving it a 25% share of the global market, according to Counterpoint Research. This share could grow to 40% in 2027, Counterpoint said.\nFoldable smartphones continue to see strong growth, even though they are some of the most expensive handsets on the market.\nGlobally, Samsung, which pioneered the foldable category with its first such device in 2019, will be Apple's main rival.\nBut in China, Apple will compete against a host of players, led by Huawei, which accounts for more than two-thirds of the foldable market in the country.\nShah said \"aspiring Chinese consumers\" are likely to want Apple's latest device.\n\"We will see lots of upgrades from the existing install base in China happening toward the foldable iPhone,\" Shah said.\nAfter Samsung's latest foldable release in July, there will be plenty of options for consumers to pick from.\n\"This is not an innocent decision by these vendors,\" Francisco Jeronimo, a vice president at IDC covering mobile devices, told CNBC.\n\"They knew Apple was coming up with a foldable, so they're trying to get ahead and, more importantly, trying to make sure that when the Apple products hit the stores, their product is there so consumers can compare.\"\nHuawei and Xiaomi chips\nHuawei and Xiaomi this week touted their own self-designed chips in their foldables.\nXiaomi said the Xiaomi 18 Fold is powered by the XRing O3, its latest smartphone processor, manufactured on an advanced process.\nHuawei said its Mate XT2 is the first device to feature a new semiconductor technique it calls LogicFolding, which is designed to move electrical signals on a chip.",

    "id": "heathrow-and-gatwick-among-airports-hit-64ef8477",
    "title": "Heathrow and Gatwick among airports hit by air traffic control problems",
    "titleJa": "航空管制の問題に見舞われた空港の中にヒースロー空港とガトウィック空港がある",
    "summaryJa": "航空管制の問題に見舞われた空港の中にヒースロー空港とガトウィック空港がある- 公開されました",
    "bodyOriginal": "Heathrow and Gatwick among airports hit by air traffic control problems\n- Published\nFlights from airports in the UK and Ireland are being heavily disrupted by a technical problem affecting the air traffic control provider Nats.\nAround 300 flights have been cancelled, according to tracking website FlightRadar24. British Airways and Ryanair have both confirmed cancellations.\nNats said just before 17:00 BST that its flight systems were starting to recover.\nWith few aircraft able to take off, it is understood landings are being restricted, leading to some flights being prevented from departing from overseas airports.\nAt Heathrow, departures were initially paused around lunchtime. Traffic then resumed, before facing further disruption in the afternoon. It is understood that very few flights are currently taking off.\nGatwick said it was currently being affected by the issue, along with other airports. Easyjet, the airport's largest carrier, confirmed it was being affected, and while the situation was fluid cancellations were to be expected.\nPassengers have been advised to contact their airlines to check the status of their flights.\nEast Midlands has also been affected by the issue, while Manchester Airport warned that some departing flights could be delayed. Passengers have been advised to contact their airlines to check the status of their flights.\nBelfast's two airports have both advised passengers to check flight information. The City of Derry Airport said it had experienced some cancellations and delays.\nIn a statement, Nats said it was investigating an issue in its flight processing system, which it said was causing some disruption to flight departures.\nEngineers were on site, it said, and it was \"working urgently to resume normal operations as quickly as possible\".\nThe organisation apologised for the delays caused and advised passengers to check the status of their flight with their airline. Nats said it would provide updates on www.nats.aero and X.\nTransport Secretary Heidi Alexander said she was aware of the situation., and realised it would be frustrating for passengers.\nPhil White from Bexhill told BBC Your Voice that his flight to Lanzarote boarded on time but has been sitting on the tarmac at Gatwick for hours.\n\"We've been told the radar is down and we can't take off,\" Phil said.\n\"It's comfortable enough but the pilots been on every 20 minutes saying they are waiting for information from air traffic control and when he finds anything out he will let us know.\"\nEdinburgh Airport said in a post on X that the issue might affect its operations, while Dublin and Cork airports in Ireland are also experiencing delays.\nBritish Airways said in a statement on its website that passengers should travel to the airport as normal if they have not been contacted by the airline directly. It added that the situation was \"entirely out of our control\".\nRyanair said affected passengers would be notified.\nGet in touch\nHave your travel plans been disrupted? Share your experience.",
    "bodyJa": "航空管制の問題に見舞われた空港の中にヒースロー空港とガトウィック空港がある\n- 公開されました\n英国とアイルランドの空港からのフライトは、航空交通管制プロバイダーである Nats に影響を与える技術的問題により、大幅な混乱が発生しています。\n追跡ウェブサイトFlightRadar24によると、約300便が欠航となった。ブリティッシュ・エアウェイズとライアンエアーはいずれも欠航を認めた。\nナッツは、英国標準時17時直前に、航空システムが回復し始めていると発表した。\n離陸できる航空機が少なく、着陸が制限され、海外の空港から出発できない便も出ているとみられる。\nヒースロー空港では当初、昼休みの頃に出発が一時停止されていた。その後交通は再開したが、午後にはさらなる混乱に見舞われた。現在離陸している便は非常に少ないと思われます。\nガトウィック航空は、他の空港同様、現在この問題の影響を受けていると述べた。空港最大の航空会社イージージェットは影響を受けていることを認めており、状況は流動的だが欠航も予想される。\n乗客は航空会社に問い合わせてフライトの運航状況を確認するよう勧められている。\nイースト・ミッドランズもこの問題の影響を受けており、マンチェスター空港は一部の出発便が遅延する可能性があると警告した。乗客は航空会社に問い合わせてフライトの運航状況を確認するよう勧められている。\nベルファストの2つの空港はどちらも乗客にフライト情報を確認するよう勧告している。デリー市空港は、欠航や遅延が発生したと発表した。\nナスは声明で、フライト処理システムに問題があり、出発便に多少の混乱を引き起こしているとして調査を行っていると述べた。\nエンジニアが現場におり、「できるだけ早く通常業務を再開するために緊急に作業している」と述べた。\n同団体は遅延が生じたことを謝罪し、乗客に対し航空会社にフライト状況を確認するよう勧告した。 Nats は、www.nats.aero と X に関するアップデートを提供すると述べた。\nハイジ・アレクサンダー運輸長官は、この状況は承知しており、乗客にとってはイライラするだろうと認識していたと述べた。\nベクスヒルのフィル・ホワイトさんはBBC Your Voiceに対し、ランサローテ島行きの飛行機は定刻に搭乗したが、ガトウィック空港の駐機場で何時間も座ったままだと語った。\n「レーダーが作動していないので離陸できないと言われました」とフィル氏は語った。\n「十分快適だが、パイロットたちは20分ごとに、管制からの情報を待っているので、何か発見したら知らせてくれると言っていた。」\nエディンバラ空港はＸへの投稿で、この問題が空港の運航に影響を与える可能性があると述べ、アイルランドのダブリン空港とコーク空港でも遅延が発生していると述べた。\nブリティッシュ・エアウェイズはウェブサイト上の声明で、乗客が航空会社から直接連絡を受けていない場合は通常通り空港に行くべきだと述べた。状況は「完全に制御不能」だと付け加えた。\nライアンエアは、影響を受ける乗客には通知すると述べた。\n連絡する\n旅行計画が中断されましたか?あなたの経験を共有してください。",

    "id": "u-s-sanctions-iranian-airlines-in-aim-to-ed20f94b",
    "title": "U.S. sanctions Iranian airlines in aim to tighten economic squeeze as war spreads, oil rises",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "The Treasury Department on Tuesday sanctioned 27 Iranian airlines and a handful of other entities as part of its ongoing effort to isolate Iran's economy.\nThe move comes as Tehran and its proxies continue to launch attacks in the Strait of Hormuz and the surrounding region, further entangling other countries in the U.S.'s more-than-six-month war and placing more pressure on global energy prices.\nThe latest U.S. action under \"Operation Economic Outcast\" targets all Iranian airlines that were not already facing sanctions.\n\"Let this be a warning to anyone doing business with Iran's remaining airlines, all of which we sanctioned today: You are at risk of being cut off from the global financial system,\" Treasury Secretary Scott Bessent said in a statement.\nThe plan to sever Iran's economic lifelines followed on-again, off-again hostilities between the U.S. and Iran around the Hormuz Strait, a vital path for the world's oil trade that has become a main choke point during the war.\nIran's continued ability to limit ship traffic through the strait has contributed to rapidly rising oil prices, giving it a continued source of leverage that has kept the war in a sort of stalemate for months.\nPresident Donald Trump insists the U.S., not Iran, is in control of the waterway, and his administration has pushed back on reports from ship-tracking firms that crossings through the waterway are far below prewar levels.\nThe conflict increasingly threatens to expand beyond the strait: Iran-backed Houthi militants in Yemen attacked multiple energy facilities in Saudi Arabia on Tuesday, forcing a temporary halt to some operations.\nOil prices jumped, with Brent crude futures cresting above $99 per barrel and U.S. West Texas Intermediate futures rising nearly 2% at session highs.\nThe Trump administration sanctions plan unveiled Aug. 24 was hyped as Iran's \"Economic D-Day,\" but it has so far resulted more in broad threats than concrete actions. The administration also has yet to tangibly pressure China, Iran's top trade partner and oil buyer, to cut off Tehran. Trump and Chinese leader Xi Jinping are due to meet in Washington later this month.\nIn late August, Treasury targeted the United Arab Emirates branch of an Egyptian bank over its financial ties to Iran.\nOn Friday, the department sanctioned Turkey's 35th-largest bank, according to TheBanks.eu.\nTuesday's sanctions build on a previous authorization to target entities involved in Iran's aviation sector, as well as a prior designation against Mahan Air, which has been \"really supporting Iran's terrorist activity for a number of years,\" a Treasury official said in a press call Tuesday, speaking on condition of anonymity to preview the new sanctions.\nThe U.S. is also effectively ending all aviation-related licenses that authorized U.S. firms or other entities to engage with Iran, the official said.\nWhile Iran is widely viewed to be facing a major economic crisis that includes soaring inflation rates and plunging oil export totals, it is unclear how much more pain the new sanctions are expected to inflict.\nWhen CNBC asked on Tuesday's press call for evidence in the Iranian economy to show the pressure campaign is working, the Treasury official said there is anecdotal evidence and other information that can't be publicly shared but did not provide specifics.",

    "id": "qualcomm-issues-amazon-warrants-to-acqui-921698a5",
    "title": "Qualcomm issues Amazon warrants to acquire $4 billion worth of chipmaker's stock as part of AI infrastructure deal",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Qualcomm shares rose 4% on Tuesday after the company announced a data center infrastructure partnership with Amazon Web Services, a major win as the chipmaker tries to take on Nvidia in the artificial intelligence market.\nAs part of the agreement, Qualcomm said in a filing with the Securities and Exchange Commission that it issued Amazon warrants to acquire 25 million shares in the company at $161.26 apiece for a total investment of $4 billion.\nAccording to a press release about the technology pact, Qualcomm is working with Amazon \"across multiple generations of customized silicon\" to help build out AWS' AI infrastructure, specifically focused on inference.\n\"As AI workloads grow exponentially — driving unprecedented demand for compute, storage, networking and memory bandwidth, and energy-efficient infrastructure — the collaboration brings together Amazon's comprehensive, secure, and price-performant AI infrastructure with Qualcomm Technologies' leadership in power-efficient processing, silicon design and system-level integration,\" the statement said.\nQualcomm is known for making processors that power smartphones and other mobile devices. But the company made a big splash in June, when it revealed a central processing unit for data centers called Dragonfly C1000, and said that Meta would use it when it starts production in 2028.\nThe chipmaker said the new CPU was built for agentic AI and focuses on offering computing performance without using too much power. Qualcomm said at the time that it's targeting $15 billion in data center sales in fiscal 2029, and pointed to a road map for going after the market with several different products, including an AI chip and a product that will tie multiple chips together.\nIn teaming up with AWS, Qualcomm is getting a show of confidence from another hyperscaler. Like Meta, Amazon's annual capital expenditures on AI infrastructure are reaching into the hundreds of billions of dollars.\nQualcomm's warrant to Amazon expires on Sept. 3, 2036. The company said the shares vest in tranches tied to the \"execution of certain commercial arrangements,\" as well as the purchase of up to $60 billion worth of Qualcomm's server chips and other technology.\nNvidia has emerged as the world's most valuable company by dominating the market for graphics processing units, or GPUs, which are needed for building sophisticated AI models and running the heftiest workloads. But more chipmakers are getting involved in the AI boom now that the CPU is proving key for AI.\nWhile GPUs are ideal for training and running AI models because they have thousands of tiny cores narrowly focused on performing many operations simultaneously, CPUs have a smaller number of powerful cores running sequential general purpose tasks.\nBank of America predicts the CPU market could more than double, from $27 billion in 2025 to $60 billion by 2030. Intel and Advanced Micro Devices are both seeing surging demand for their data center CPUs, and Nvidia in March offered new details about its agentic-optimized CPUs.\nDion Harris, Nvidia's head of AI infrastructure, told CNBC at the time that, \"CPUs are becoming the bottleneck in terms of growing out this AI and agentic workflow.\"\n— CNBC's Katie Tarasov contributed to this report.\nWATCH: Qualcomm partners with AWS",
