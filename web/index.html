    "title": "Vape prices to rise as new tax takes effect",
    "titleJa": "Vape prices to rise as new tax takes effect",
    "summaryJa": "Vape prices to rise as new tax takes effect- Published",
    "bodyOriginal": "Vape prices to rise as new tax takes effect\n- Published\nThe price of vapes is set to rise as a new tax comes into effect, with the aim of making vaping less attractive to children and young people.\nThe Vaping Product Duty will be imposed at a rate of £2.20 per 10ml of e-liquid. However, many customers will not see a jump in prices immediately, as sellers have six months to sell old stock at the pre-duty price.\nThe government wants to reduce the appeal of vapes by making them more expensive, as more evidence of its adverse effect on health comes out, particularly on children and young people.\nThe vaping industry has lobbied against the new tax, saying that affordable vapes help people to quit smoking.\nThe duty will apply to all vaping products regardless of whether they contain nicotine.\nTobacco rates were also raised on Thursday, by £2.20 per 100 cigarettes or 50g of tobacco. HMRC said this maintains the financial incentive for smokers to switch to vaping.\nStocking up v cutting down\nThe BBC spoke to vapers in Reading who had mixed views on whether the new tax would encourage people to quit.\nMackenzie Bird, 19, has been a regular vaper for three years. She said she was \"fine\" with the duty and it wouldn't stop her from vaping.\n\"I don't know how many people it'll actually deter,\" she said.\n\"I'll probably just stock up.\"\nHowever, Cara Lewis-Rimes and Dylan Killner said they might reconsider the habit in light of higher prices.\nCara said she thinks the changes will force vapers to cut down because of the cost of living.\nDylan said he might be inclined to quit altogether.\n\"I don't think it's doing me any favours... the health factor around it as well is not great.\"\nFighting illegal trade\nHMRC is also launching a stamp for vaping products which are traceable throughout the supply chain.\nAll vapes sold in the UK must carry this stamp from April.\nThe new tax is also an effort to combat illicit trade, which is a growing problem on UK high streets. Last month, the prime minister announced new powers for councils that will address the decline of the high street, including the amount of vape shops.\nChanges to planning law in England mean every new shop selling e-cigarettes, or vapes, would need to apply to their local council for permission to open.\nHealth Minister Karin Smyth said: \"These measures are an important step in our ambition to tackle youth vaping by reducing the affordability of vaping products, which goes hand-in-hand with the work we are already doing to tackle the appeal and availability of vapes on our high streets.\"\nJames Murray, the Financial Secretary to the Treasury, said the government was \"backing all those retailers who play by the rules\".\nBut Jordan Apap, a sales assistant in Berkshire Vapers, said the new tax would \"put a lot of strain on legitimate vape shops\" that provide more specialist advice and services than convenience stores and phone shops that sell vapes.\n\"There is a real and genuine risk that we will cease to exist within a year or two,\" he said.\nVaping rates for schoolchildren appear to drop - is it falling out of favour?\n- Published22 September\nPolice raid barbers and vape shops suspected of being fronts for crime gangs\n- Published10 April 2025\nJohn Dunne, the director general of the UK Vaping Industry Association, said: \"This is nothing short of a tax on public health.\"\nHe said vapes had helped \"millions of adults cut down on or stop smoking\".\n\"Protecting young people is essential. But that means stronger enforcement against illegal and rogue traders, not making legal vaping more expensive for adults trying to stay away from cigarettes.\"\nExperts say vaping is much safer than smoking, but it is not risk free and the long-term effects are less clear.\nA recent review of vaping studies found that it had an association with problems in children and young people including wheezing and coughing, poor oral and dental health, poor sleep, mental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha",

ental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha",

    "title": "Energy bills are going up - here's what you can do about it",
    "titleJa": "Energy bills are going up - here's what you can do about it",
    "summaryJa": "Household energy bills have risen again but there are ways to keep a lid on your expenditure.",
    "bodyOriginal": "Energy bills are going up - here's what you can do about it\n- Published\nEnergy prices have now risen by nearly 4%, with forecasts of a much bigger jump to come in January.\nRegulator Ofgem's price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity.\nForecasters have suggested a 16% increase is possible in January, due to high wholesale prices paid by suppliers as a result of the conflict in the Middle East.\nWhile that's beyond consumers' control, charities say the government should offer more support - beyond a VAT cut on electricity bills which takes effect on Thursday - and households should reset for winter again.\nThat includes reading the meter now, and taking other steps to keep a check on rising bills.\n1. Consider switching to a fixed rate\nThe energy regulator, Ofgem, is advising people to consider fixing - so that the price you are charged per unit of gas or electricity does not change every three months, although the total bill will still vary depending on how much energy you use.\nThe trouble is that it is very difficult to work out whether a fixed deal is a good deal at the moment.\nShould energy prices rise sharply, then those who have fixed already have the certainty of what they will pay for each unit of energy. That price may well be lower than the forecast price in January.\nHowever, if events in the Gulf region settle down, and a peace deal in the Iran war leads to lower international gas prices, then a longer-term fix might not seem such good value compared with the price cap.\nSo consumer group Which? also recommends keeping an eye on any exit fees when picking a fixed deal. If variable prices fall below your fixed rate and you want to get out of it before the end of your agreement period, you may have to pay a hefty sum.\nBefore you fix, consumer website MoneySavingExpert advises you look at all the deals available, not just what your own supplier is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",
    "bodyJa": "Energy bills are going up - here's what you can do about it\n- Published\nEnergy prices have now risen by nearly 4%, with forecasts of a much bigger jump to come in January.\nRegulator Ofgem's price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity.\nForecasters have suggested a 16% increase is possible in January, due to high wholesale prices paid by suppliers as a result of the conflict in the Middle East.\nWhile that's beyond consumers' control, charities say the government should offer more support - beyond a VAT cut on electricity bills which takes effect on Thursday - and households should reset for winter again.\nThat includes reading the meter now, and taking other steps to keep a check on rising bills.\n1. Consider switching to a fixed rate\nThe energy regulator, Ofgem, is advising people to consider fixing - so that the price you are charged per unit of gas or electricity does not change every three months, although the total bill will still vary depending on how much energy you use.\nThe trouble is that it is very difficult to work out whether a fixed deal is a good deal at the moment.\nShould energy prices rise sharply, then those who have fixed already have the certainty of what they will pay for each unit of energy. That price may well be lower than the forecast price in January.\nHowever, if events in the Gulf region settle down, and a peace deal in the Iran war leads to lower international gas prices, then a longer-term fix might not seem such good value compared with the price cap.\nSo consumer group Which? also recommends keeping an eye on any exit fees when picking a fixed deal. If variable prices fall below your fixed rate and you want to get out of it before the end of your agreement period, you may have to pay a hefty sum.\nBefore you fix, consumer website MoneySavingExpert advises you look at all the deals available, not just what your own supplier is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",

    "id": "trump-thinking-about-diesel-export-ban-b-ef8c1d13",
    "title": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "titleJa": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "summaryJa": "Trump recently said he was \"very seriously\" considering a diesel export ban, despite warnings from the U.S. oil industry that doing so would raise prices.",
    "bodyOriginal": "President Donald Trump on Wednesday said he is still \"thinking about\" banning diesel exports in an attempt to get a handle on high energy prices, but noted that doing so may have a \"negative impact on gasoline.\"\nTrump, asked in the Oval Office if he has decided on a ban, said his aides think it would help diesel \"but it might raise the price of other things.\"\n\"And I think we're in a good place because oil prices are going to start to come down,\" Trump added.\nJust three days earlier, Trump said he was \"very seriously\" considering the move, despite warnings from the U.S. oil industry that it would force refineries to cut production and ultimately raise domestic energy prices.\nBut his latest comments appeared to show him cooling to the idea of an export ban, even as he declined to rule it out entirely.\n\"We're in a very good place,\" Trump said, highlighting a recent resurgence in crude exports through the Strait of Hormuz.\nThe strait is a major throughway for the global oil trade that saw ship traffic stifled after the U.S. and Israel attacked Iran in late February. But this week it saw daily exports return to prewar levels.\nEnergy Secretary Chris Wright, standing next to Trump at the Resolute Desk, said, \"You've seen diesel prices come down the last week. I think you'll see them move meaningfully down in the coming weeks and days.\"\nBut Wright acknowledged that diesel supplies are \"tight\" because of export loss related to conflicts in Russia and the Middle East, as well as from China.\n\"So that's a lot of interruptions. But American refiners are running at record highs,\" Wright said, \"and you will hear announcements from our our friends in Europe about new diesel supplies that'll come to the market. That'll meaningfully push diesel prices down.\"\nWhen a reporter asked if Wright has advised against a diesel export ban, Trump interjected, saying, \"No, I think it's something that we think about and we talk about every day.\"\n\"But it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",

ut it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",

    "summaryJa": "Kashkari will sit down with CNBC's Steve Liesman for an exclusive conversation Wednesday night.",
    "bodyOriginal": "[The stream is slated to start at 6 p.m. ET. Please refresh the page if you do not see a player above at that time.]\nMinneapolis Federal Reserve President Neel Kashkari will sit down with CNBC's Steve Liesman for an exclusive conversation about the U.S. economy and monetary policy Wednesday night.\nKashkari's comments follow Wednesday morning's release of the August personal consumption expenditures price index. The index, which is considered Fed's preferred gauge of inflation, came in lower than economists forecasted.\nPayroll services firm ADP also reported Wednesday that the private sector added 90,000 jobs in September, which was higher than economists predicted. That release came ahead of the closely followed jobs report for September due Friday.\nThe Fed this month issued its first interest rate hike in three years. The central bank also signaled that another increase could be on the horizon.\nWednesday's event is part of Council on Foreign Relations' C. Peter McColough Series on International Economics in New York.",

    "title": "David Ellison names Ynon Kreiz co-CEO of Paramount and Warner Bros. Discovery",
    "titleJa": "David Ellison names Ynon Kreiz co-CEO of Paramount and Warner Bros. Discovery",
    "summaryJa": "Paramount CEO David Ellison announced outgoing Mattel chief Ynon Kreiz will serve as the co-CEO of the anticipated combination of Paramount and WBD.",
    "bodyOriginal": "Paramount Skydance CEO David Ellison announced on Wednesday the appointment of outgoing Mattel Chief Executive Officer Ynon Kreiz as his co-CEO of the anticipated combination of Paramount and Warner Bros. Discovery.\nThe pair will lead as \"one team,\" with Kreiz set to take on the operational duties of the media company, according to a press release. Kreiz will become co-CEO effective at the closing of the merger and will also join the company's board of directors.\n\"Ellison will focus on the company's long-term strategy, creative vision and direction, including its talent relationships, strategic partnerships, technology and capital allocation,\" Paramount stated in the release. \"Kreiz will focus on the company's day-to-day management and integration of the combined businesses.\"\nThe announcement comes less than two weeks after Paramount settled an antitrust lawsuit with a group of state attorneys general that sought to block the $110 billion merger. A federal judge on Wednesday entered an order to allow the merger to close.\n\"Bringing together Paramount and Warner Bros. Discovery to create a next-generation global media company is a transformational moment for our industry,\" said Ellison in the release. \"Leading it takes a rare combination of strategic vision, operational depth and experience running a public company at the highest levels of media. Ynon brings all three.\"\nEarlier on Wednesday, Mattel announced Kreiz was departing the company after eight years in the top job. During his tenure, Kreiz led the company through major transformations and oversaw the release of \"Barbie,\" the highest-grossing domestic film release of 2023.\nThe events on Wednesday set up the end of a long back-and-forth battle through which Ellison has sought to expand his media empire.\nHe first set his sights on Warner Bros. Discovery in September 2025 and since then has faced a bidding war against Netflix and a legal challenge over antitrust concerns. The transaction, which will be one of the largest media mergers in history, is expected to be completed in the coming weeks.",
    "bodyJa": "Paramount Skydance CEO David Ellison announced on Wednesday the appointment of outgoing Mattel Chief Executive Officer Ynon Kreiz as his co-CEO of the anticipated combination of Paramount and Warner Bros. Discovery.\nThe pair will lead as \"one team,\" with Kreiz set to take on the operational duties of the media company, according to a press release. Kreiz will become co-CEO effective at the closing of the merger and will also join the company's board of directors.\n\"Ellison will focus on the company's long-term strategy, creative vision and direction, including its talent relationships, strategic partnerships, technology and capital allocation,\" Paramount stated in the release. \"Kreiz will focus on the company's day-to-day management and integration of the combined businesses.\"\nThe announcement comes less than two weeks after Paramount settled an antitrust lawsuit with a group of state attorneys general that sought to block the $110 billion merger. A federal judge on Wednesday entered an order to allow the merger to close.\n\"Bringing together Paramount and Warner Bros. Discovery to create a next-generation global media company is a transformational moment for our industry,\" said Ellison in the release. \"Leading it takes a rare combination of strategic vision, operational depth and experience running a public company at the highest levels of media. Ynon brings all three.\"\nEarlier on Wednesday, Mattel announced Kreiz was departing the company after eight years in the top job. During his tenure, Kreiz led the company through major transformations and oversaw the release of \"Barbie,\" the highest-grossing domestic film release of 2023.\nThe events on Wednesday set up the end of a long back-and-forth battle through which Ellison has sought to expand his media empire.\nHe first set his sights on Warner Bros. Discovery in September 2025 and since then has faced a bidding war against Netflix and a legal challenge over antitrust concerns. The transaction, which will be one of the largest media mergers in history, is expected to be completed in the coming weeks.",

    "title": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold",
    "titleJa": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold",
    "summaryJa": "Micron is up over 500% in the past year as the company benefits from soaring AI demand.",
    "bodyOriginal": "Micron reported better-than-expected quarterly results on Wednesday as the memory maker continues to benefit from soaring demand for AI infrastructure. The stock rose slightly in extended trading.\nHere's how the company did relative to LSEG consensus:\n- Earnings per share: $33.42 adjusted vs. $31.61 expected\n- Revenue: $54.23 billion vs. $51.07 billion expected\nRevenue almost quadrupled in the fiscal fourth quarter from $11.32 billion a year earlier, according to a statement.\nFor the fiscal first quarter, Micron said it expects revenue of about $61.5 billion and adjusted earnings per share of $38.15. Analysts polled by LSEG had expected $35.40 in adjusted earnings per share on $57 billion in revenue.\nMicron's stock has soared more than 500% in the past year, benefiting from a worldwide supply crunch caused by historic levels of demand for memory chips needed for artificial intelligence models and workloads. The shortage has led to a spike in memory costs and resulted in increased prices for consumer electronics like Apple's iPads and MacBooks.\nHendi Susanto, portfolio at Gabelli Funds, said in an email after the release that it was \"another strong beat and raise for Micron.\"\n\"At this point, I have not heard any negative data points pointing to the memory cycle reversing toward a decline anytime soon for the foreseeable future,\" Susanto wrote.\nMicron is the only U.S.-based maker of high-bandwidth memory, HBM, made up of stacks of general-purpose dynamic random-access memory, or DRAM. Fourth-quarter DRAM revenue increased 343% from a year ago to $39.8 billion, representing 73% of total sales.\nCEO Sanjay Mehrotra said on the earnings call that the company has a \"strong roadmap for future HBM products\" and is working with Nvidia on the industry's \"first custom HBM implementation.\"\nNet income in the latest quarter climbed to $37.7 billion, or $32.87 per share, from $3.2 billion, or $2.83 per share a year ago.\nAdvanced graphics and central processors from chip giants like Nvidia and AMD need increasing amounts of HBM to handle AI workloads, and the world's leading providers can't make enough.\nThat's why Micron is investing $250 billion to build two new campuses for making HBM. The largest broke ground in Clay, New York, in January, while its first new fab in Boise, Idaho, is scheduled to come online next year.\nHBM leaders SK Hynix and Samsung are also in the midst of massive new HBM factory buildouts in their home country of South Korea. Micron holds the smallest HBM market share of the three, but its market cap has still topped $1.2 trillion.\nMehrotra participated in a summit on AI regulation hosted by President Donald Trump on Tuesday, days after attending a White House dinner with Chinese President Xi Jinping on his first visit to the U.S. in more than a decade.\nOn the call, Mehrotra said Micron increased compensation for every employee in fiscal 2026. Hundreds of Micron staffers threatened to strike at its factories in Taiwan over labor negotiations and pay. Similar strikes at rivals SK Hynix and Samsung have result in bonuses upwards of $500,000.\nWATCH: Micron's $50 billion buildout in its hometown of Boise is minting millionaires",

al processors from chip giants like Nvidia and AMD need increasing amounts of HBM to handle AI workloads, and the world's leading providers can't make enough.\nThat's why Micron is investing $250 billion to build two new campuses for making HBM. The largest broke ground in Clay, New York, in January, while its first new fab in Boise, Idaho, is scheduled to come online next year.\nHBM leaders SK Hynix and Samsung are also in the midst of massive new HBM factory buildouts in their home country of South Korea. Micron holds the smallest HBM market share of the three, but its market cap has still topped $1.2 trillion.\nMehrotra participated in a summit on AI regulation hosted by President Donald Trump on Tuesday, days after attending a White House dinner with Chinese President Xi Jinping on his first visit to the U.S. in more than a decade.\nOn the call, Mehrotra said Micron increased compensation for every employee in fiscal 2026. Hundreds of Micron staffers threatened to strike at its factories in Taiwan over labor negotiations and pay. Similar strikes at rivals SK Hynix and Samsung have result in bonuses upwards of $500,000.\nWATCH: Micron's $50 billion buildout in its hometown of Boise is minting millionaires",

    "id": "sen-hawley-openai-ceo-sam-altman-decline-af436986",
    "title": "Sen. Hawley: OpenAI CEO Sam Altman declined to testify at rogue AI hearing",
    "titleJa": "Sen. Hawley: OpenAI CEO Sam Altman declined to testify at rogue AI hearing",
    "summaryJa": "A Senate subcommittee on Wednesday is examining rogue AI, after a series of AI cyberattacks and increasing warnings about the risks of the technology.",
    "bodyOriginal": "OpenAI CEO Sam Altman declined an invitation to appear at a Senate subcommittee hearing on Wednesday on the risks of rogue artificial intelligence, according to Sen. Josh Hawley, R-Mo.\nHawley, who chairs the Senate Homeland Security and Governmental Affairs subpanel that held the hearing, sent a letter to Altman on Sept. 25 requesting his presence to \"help shed light on\nthe Subcommittee's ongoing investigation into recent rogue AI incidents involving OpenAI models.\" NBC News first reported that Altman did not accept the invitation to testify.\n\"He turned us down,\" Hawley said of Altman at the hearing. \"I think that's unfortunate because I think the American people deserve to know exactly what's going on at all of these companies. And to give us the sort of transparency that I think is needed for not just comfort, but to have an understanding of what these companies — that are the most powerful companies in the world — are doing right now with the most powerful technology ever known to man.\"\nA spokesperson for OpenAI noted that Altman received the invitation to testify on Friday, just five days ahead of the hearing. Altman on Tuesday appeared at the company's annual DevDay developer conference in San Francisco as other AI officials — including OpenAI President Greg Brockman — were in Washington meeting with President Donald Trump.\n\"OpenAI is deeply engaged with Congress on federal policies to advance AI safety, including through dozens of meetings in recent weeks with members of both parties in both chambers,\" the spokesperson said. \"We look forward to continuing to work constructively and proactively with Senator Hawley and members of Congress on federal AI safety legislation that materially raises the safety bar.\"\nHawley's overture to Altman comes weeks after he opened an investigation into OpenAI earlier this month. Hawley sought information on a cyberattack involving hundreds of OpenAI agents that broke out of their testing sandbox and hacked into the systems of another AI company called Hugging Face.\nThe cyber attack was one in a series of recent hacks involving frontier AI models that have raised alarms and prompted calls for Congress to act to rein in the rapidly evolving technology.\nHawley requested information from Altman on the cyber attack and on the existential risks of the technology and set an Oct. 1 deadline. A spokesperson for Hawley said OpenAI is expected to provide additional documents by the end of the week.\n\"The American people deserve to know the details of what went on in the Hugging Face incident and other incidents of AI models going rogue. This investigation will seek those answers,\" Hawley said in the Sept. 10 letter.",
    "bodyJa": "OpenAI CEO Sam Altman declined an invitation to appear at a Senate subcommittee hearing on Wednesday on the risks of rogue artificial intelligence, according to Sen. Josh Hawley, R-Mo.\nHawley, who chairs the Senate Homeland Security and Governmental Affairs subpanel that held the hearing, sent a letter to Altman on Sept. 25 requesting his presence to \"help shed light on\nthe Subcommittee's ongoing investigation into recent rogue AI incidents involving OpenAI models.\" NBC News first reported that Altman did not accept the invitation to testify.\n\"He turned us down,\" Hawley said of Altman at the hearing. \"I think that's unfortunate because I think the American people deserve to know exactly what's going on at all of these companies. And to give us the sort of transparency that I think is needed for not just comfort, but to have an understanding of what these companies — that are the most powerful companies in the world — are doing right now with the most powerful technology ever known to man.\"\nA spokesperson for OpenAI noted that Altman received the invitation to testify on Friday, just five days ahead of the hearing. Altman on Tuesday appeared at the company's annual DevDay developer conference in San Francisco as other AI officials — including OpenAI President Greg Brockman — were in Washington meeting with President Donald Trump.\n\"OpenAI is deeply engaged with Congress on federal policies to advance AI safety, including through dozens of meetings in recent weeks with members of both parties in both chambers,\" the spokesperson said. \"We look forward to continuing to work constructively and proactively with Senator Hawley and members of Congress on federal AI safety legislation that materially raises the safety bar.\"\nHawley's overture to Altman comes weeks after he opened an investigation into OpenAI earlier this month. Hawley sought information on a cyberattack involving hundreds of OpenAI agents that broke out of their testing sandbox and hacked into the systems of another AI company called Hugging Face.\nThe cyber attack was one in a series of recent hacks involving frontier AI models that have raised alarms and prompted calls for Congress to act to rein in the rapidly evolving technology.\nHawley requested information from Altman on the cyber attack and on the existential risks of the technology and set an Oct. 1 deadline. A spokesperson for Hawley said OpenAI is expected to provide additional documents by the end of the week.\n\"The American people deserve to know the details of what went on in the Hugging Face incident and other incidents of AI models going rogue. This investigation will seek those answers,\" Hawley said in the Sept. 10 letter.",

    "id": "crude-oil-exports-through-the-strait-of-a306098d",
    "title": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained",
    "titleJa": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained",
    "summaryJa": "It is unclear how long the recovery can be sustained given that it relies on the U.S. military protecting tankers in the Persian Gulf.",
    "bodyOriginal": "Crude oil exports from the Strait of Hormuz have basically returned to levels normal before the Iran war, as U.S. military escorts have boosted shipments and pipelines have redirected flows.\nCrude transiting Hormuz reached a seven-day average of 13.5 million barrels per day as of Monday, which matches a prewar baseline for shipments through the strait, according to data published Wednesday by Kpler, a firm that tracks tankers and global trade flows.\nIran has claimed throughout the war that it controls Hormuz and has declared the closure of the strait multiple times. But Tehran is losing its influence as strong volumes pass through Hormuz, said Matt Smith, director of commodity research at Kpler.\nCrude oil shipments from the Middle East region, including the Persian Gulf and Red Sea, are sometimes higher than prewar levels. The region reached a seven-day average of 19.5 million bpd as of Monday, surpassing a prewar baseline of about 17 million bpd, the Kpler data showed.\nBut the recovery is uneven, said Natasha Kaneva, head of global commodities strategy at JPMorgan. The \"crude market has largely normalized even as refined product supplies remain constrained,\" Kaneva said.\nThe world faces a global fuel crisis as supplies from the Middle East are constrained and Ukraine pounds Russian refineries. Refined products shipped through Hormuz are at a seven-day average of 677,000 bpd as of Monday compared with 3.6 million bpd before the war, according to Kpler.\nCrude and product shipments together stood at a seven-day average of 14.2 million bpd, which is about 80% of the Hormuz prewar baseline of about 17 million bpd, the data showed.\nThe global fuel supply shortfall has pushed diesel prices in the U.S. to record highs, which poses a major threat to the health of the economy. President Donald Trump is considering an export ban as he faces political pressure from Republican lawmakers ahead of the midterm elections.\n\"The biggest source of pain is the diesel market,\" Francisco Blanch, head of global commodities at Bank of America, told CNBC's \"Squawk on the Street\" on Sept. 8.\nIran exports crater\nIran's own crude oil exports, meanwhile, have cratered as the U.S. Navy blockades the Islamic Republic, according to Kpler data. Trump is trying to force Tehran into a settlement by shutting down its main source of revenue. The U.S. has also ramped up its sanction campaign.\nTreasury Secretary Scott Bessent told Fox News on Sunday that Iran will make its final crude deliveries to China in about two weeks, leaving them with \"nothing left to trade for anything.\"\n\"There are some in Washington who say, let the blockade do its work — we can wait out Iran,\" Helima Croft, head of global commodity strategy at RBC Capital Markets, told CNBC's \"Power Lunch\" on Sept. 25.\nBut there is no hard evidence that U.S. economic pressure will fundamentally change Iran's positions, Scott Modell, CEO of Rapidan Energy and a former CIA officer, told CNBC's \" Squawk on The Street\" on Monday.\nIran last week offered to reopen Hormuz in seven days if the U.S. returns to the failed memorandum of understanding from June. The U.S. made major concessions under the MOU, agreeing to lift its blockade and allow Iran to negotiate with Oman a future system of administration for Hormuz.\nThe MOU collapsed over the summer into renewed fighting. Trump has rejected Iran's latest offer and told his aides that he expects to resume bombing Iran after the midterm elections, unnamed U.S. officials told The Wall Street Journal.\nHow the Gulf has adapted\nWhile the level of exports are at or near prewar levels, the security conditions in the strait are far from normal. Iran continues to fire on tankers in attacks that are sometimes lethal.\nIn response, more than 70% of the crude oil that crossed Hormuz in August switched tankers off the coast of the United Arab Emirates or Oman, according to Kpler. Shuttle tankers bring oil through Hormuz to the Gulf of Oman. The cargo is then loaded onto another tanker that delivers it to Asia.\nThis shuttle system is protected by the U.S. military and reduces the risk of exposure to attack from Iran. But it is unclear how long this system can be sustained given that it relies on U.S. military protection.\n\"It's very expensive, and it's a huge U.S. military commitment,\" Croft said.\nAnd the Gulf states don't view the \"patchwork arrangement\" of ship-to-ship transfers and military escorts as an acceptable substitute for Hormuz being open, she said.\nPipelines operated by Saudi Arabia and the United Arab Emirates are also doing a lot of heavy lifting. About 40% of Gulf crude oil now bypasses Hormuz through these pipelines, compared with 17% before the war, per Kpler.\nBut pipelines are also vulnerable to attack. The Saudis shut down their East-West pipeline earlier this month after it was damaged in a drone strike launched from Iraq. Loadings have picked up at Saudi's Red Sea port of Yanbu in a sign that the pipeline is running again.\nCrude flows remained resilient during the pipeline outage because Riyadh was able to shift its exports back through Hormuz due to the shuttle system protected by the U.S. military.\nBut the region's oil supplies could face disruption again as stalemated diplomacy raises the risk of renewed fighting.\n\"The president I think is going to escalate after the midterms, we keep hearing that the Iranians are going to escalate into the midterms,\" Rapidan's Modell said. \"The direction of travel is toward escalation.\"",

  {
    "id": "private-sector-jobs-rose-by-90-000-in-se-68106043",
    "title": "Private sector jobs rose by 90,000 in September, better than expected, ADP reports",
    "titleJa": "Private sector jobs rose by 90,000 in September, better than expected, ADP reports",
    "summaryJa": "Private job creation picked up in September after a brief slowdown, providing further indication that the U.S. labor market has stabilized, according to an ADP report Wednesday.The payrolls processing firm said company employment rose by 90,000 for the month, higher than the downwardly revised 36,000 in August and better than the Dow Jones consensus estimate for 68,000.",
    "bodyOriginal": "Private job creation picked up in September after a brief slowdown, providing further indication that the U.S. labor market has stabilized, according to an ADP report Wednesday.\nThe payrolls processing firm said company employment rose by 90,000 for the month, higher than the downwardly revised 36,000 in August and better than the Dow Jones consensus estimate for 68,000.\nThere also was a fair amount of balance in the report, with service providers adding 59,000 positions while goods producers contributed 31,000.\nBase pay rose 3.2% from a year ago, while gross pay accelerated by 4.7%.\n\"It's a strong report,\" said ADP chief economist Nela Richardson. \"After a three-month slowdown, job\ncreation rebounded and pay growth remained solid.\"\nEducation and health services contributed the most, with 55,000 new hires. Other areas of growth included leisure and hospitality (22,000), manufacturing (17,000) and construction (15,000).\nA handful of sectors saw job losses, including financial activities (-16,000), professional and business services (-11,000) and natural resources and mining (-1,000).\nMuch of the employment growth came from the Northeast, which added 56,000. By size, companies with between 50 and 499 workers saw a gain of 54,000.\nBroadly, the report helped confirm sentiment expressed by multiple Federal Reserve officials that the labor market is mostly sound following a growth scare in 2025. Policymakers see the greater policy risk now as the persistent inflation that pushed central bankers to raise benchmark borrowing rates by a quarter percentage point earlier in September.\nThe ADP count serves as a precursor to the nonfarm payrolls report that the Bureau of Labor Statistics will release Friday. The Wall Street consensus is for a gain of 84,000 jobs, down from a 162,000 increase the prior month, and the unemployment rate to hold steady at 4.1%.",
    "bodyJa": "Private job creation picked up in September after a brief slowdown, providing further indication that the U.S. labor market has stabilized, according to an ADP report Wednesday.\nThe payrolls processing firm said company employment rose by 90,000 for the month, higher than the downwardly revised 36,000 in August and better than the Dow Jones consensus estimate for 68,000.\nThere also was a fair amount of balance in the report, with service providers adding 59,000 positions while goods producers contributed 31,000.\nBase pay rose 3.2% from a year ago, while gross pay accelerated by 4.7%.\n\"It's a strong report,\" said ADP chief economist Nela Richardson. \"After a three-month slowdown, job\ncreation rebounded and pay growth remained solid.\"\nEducation and health services contributed the most, with 55,000 new hires. Other areas of growth included leisure and hospitality (22,000), manufacturing (17,000) and construction (15,000).\nA handful of sectors saw job losses, including financial activities (-16,000), professional and business services (-11,000) and natural resources and mining (-1,000).\nMuch of the employment growth came from the Northeast, which added 56,000. By size, companies with between 50 and 499 workers saw a gain of 54,000.\nBroadly, the report helped confirm sentiment expressed by multiple Federal Reserve officials that the labor market is mostly sound following a growth scare in 2025. Policymakers see the greater policy risk now as the persistent inflation that pushed central bankers to raise benchmark borrowing rates by a quarter percentage point earlier in September.\nThe ADP count serves as a precursor to the nonfarm payrolls report that the Bureau of Labor Statistics will release Friday. The Wall Street consensus is for a gain of 84,000 jobs, down from a 162,000 increase the prior month, and the unemployment rate to hold steady at 4.1%.",

    "title": "OpenAI follows Meta into the red-hot market for personal agents. But will users pay?",
    "titleJa": "OpenAI follows Meta into the red-hot market for personal agents. But will users pay?",
    "summaryJa": "Following Meta's blockbuster release of its Muse AI agent earlier this month, OpenAI jumped into the personal agent market with Dots.",
    "bodyOriginal": "Following Meta's blockbuster release of its Muse AI agent earlier this month, OpenAI jumped into the personal agent market on Tuesday with Dots, setting the stage for what could be the next big battle in the artificial intelligence market.\nAt its annual DevDay developer conference, OpenAI described Dots as \"always-on\" agents designed to help users complete a range of tasks. Since the release of Muse three weeks ago, investors have rallied around Meta, sending the stock up 29% in September, on pace for its best month since 2013.\nThat level of enthusiasm underscores the power of personal agents and the promise that consumers and office workers will be able to use the technology to book travel, pay bills, respond to emails and perform many more tasks. But OpenAI's entry, arriving soon after the launch of Muse, serves as a reminder that the AI market includes a handful of large companies all converging around the same types of products with little ability to lock in users.\nGoogle calls its Gemini Spark offering \"your 24/7 personal AI agent\" for help, and Apple is trying to step up its position in the AI battle with its redesigned Siri AI, which it describes as \"a profoundly more capable and personal assistant.\"\n\"I think what we are watching is an inevitable evolution of the technology,\" said John Waldmann, CEO of HR tech startup Homebase and a user of various AI agent-related tools. \"It's probably no surprise that it's all happening around the same time.\"\nIt's not just the big companies that see the opportunity.\nAI assistant startup Instinct announced Monday that it raised $1 billion from venture firms including Sequoia at a $10 billion valuation. And another startup, Town, is reportedly looking at a $1 billion valuation.\nTown CEO Jean-Denis Grèze told CNBC in a statement that OpenAI's debut of Dots, \"continues to validate the category and the need for work assistants.\"\n\"It's been our focus at Town from the very beginning,\" Grèze said, adding that he welcomes the competition.\nOn Tuesday, all eyes were on OpenAI, as investors and AI enthusiasts anticipated what the ChatGPT creator would unveil in the wake of last week's Meta Connect developer conference. There, Meta announced forthcoming AI devices, including a pendant, and CEO Mark Zuckerberg called Muse the \"centerpiece\" of the company's AI strategy.\nTaking the stage in San Francisco for DevDay, Altman called Dots \"remarkably capable\" and \"built to handle really anything you can think of.\" Although developers could already use OpenAI's existing tools to manage scores of AI agents for various office tasks, Dots promises to be an easier way for workers to use powerful digital assistants to help with tools like Slack and Microsoft Teams.\nMore uplifting than AI safety\nThe rush of new agents hitting the market offers a more uplifting story for AI companies at a time when the leading labs are facing intensifying scrutiny due to emerging concerns that the most advanced models are at risk of spinning out of human control.\nOn Tuesday, as Altman was attending DevDay, his second-in-command, Greg Brockman, was in Washington for a lunch that President Donald Trump was hosting for top technology leaders. The topic was AI safety, and the event came more than two weeks after Anthropic CEO Dario Amodei sent shock waves across the industry, writing an essay urging AI companies to slow the pace of frontier model development.\nNick Deveau, CEO of AI sales startup GrottoAI, is a fan of AI agent tools like Instinct and sees the vision as companies start building them for a wider audience.\n\"The interesting thing about all of these, which I think has become apparent really quickly and is evidenced by some of the valuations, is that people see this as the first successful proof point of true agentic work hitting consumers,\" Deveau said.\nThere's still the question of whether consumers will pay. Meta's Muse is free with a usage limit and can be purchased starting at $20 a month after that. OpenAI's Dots is only available starting at the $100 per month Pro plan and higher.\nAnd even with Muse racking up millions of downloads across app stores, that doesn't mean people are actively using it or other AI agents, Waldmann said.\n\"People will try it, but is it really adding value?\" Waldmann said. \"Is it part of a daily habit?\"\nThomas Randall, a research director at the Info-Tech Research Group, said in an email that \"the race is on,\" as AI companies search to figure out how consumers want to use agents and what will keep them coming back.\n\"Once leading systems are broadly capable, the winner will likely be determined by which agent is the easiest to adopt, the most connected, and the hardest to leave,\" Randall said. \"We'll see who's distribution will gather steam first.\"",
    "bodyJa": "Following Meta's blockbuster release of its Muse AI agent earlier this month, OpenAI jumped into the personal agent market on Tuesday with Dots, setting the stage for what could be the next big battle in the artificial intelligence market.\nAt its annual DevDay developer conference, OpenAI described Dots as \"always-on\" agents designed to help users complete a range of tasks. Since the release of Muse three weeks ago, investors have rallied around Meta, sending the stock up 29% in September, on pace for its best month since 2013.\nThat level of enthusiasm underscores the power of personal agents and the promise that consumers and office workers will be able to use the technology to book travel, pay bills, respond to emails and perform many more tasks. But OpenAI's entry, arriving soon after the launch of Muse, serves as a reminder that the AI market includes a handful of large companies all converging around the same types of products with little ability to lock in users.\nGoogle calls its Gemini Spark offering \"your 24/7 personal AI agent\" for help, and Apple is trying to step up its position in the AI battle with its redesigned Siri AI, which it describes as \"a profoundly more capable and personal assistant.\"\n\"I think what we are watching is an inevitable evolution of the technology,\" said John Waldmann, CEO of HR tech startup Homebase and a user of various AI agent-related tools. \"It's probably no surprise that it's all happening around the same time.\"\nIt's not just the big companies that see the opportunity.\nAI assistant startup Instinct announced Monday that it raised $1 billion from venture firms including Sequoia at a $10 billion valuation. And another startup, Town, is reportedly looking at a $1 billion valuation.\nTown CEO Jean-Denis Grèze told CNBC in a statement that OpenAI's debut of Dots, \"continues to validate the category and the need for work assistants.\"\n\"It's been our focus at Town from the very beginning,\" Grèze said, adding that he welcomes the competition.\nOn Tuesday, all eyes were on OpenAI, as investors and AI enthusiasts anticipated what the ChatGPT creator would unveil in the wake of last week's Meta Connect developer conference. There, Meta announced forthcoming AI devices, including a pendant, and CEO Mark Zuckerberg called Muse the \"centerpiece\" of the company's AI strategy.\nTaking the stage in San Francisco for DevDay, Altman called Dots \"remarkably capable\" and \"built to handle really anything you can think of.\" Although developers could already use OpenAI's existing tools to manage scores of AI agents for various office tasks, Dots promises to be an easier way for workers to use powerful digital assistants to help with tools like Slack and Microsoft Teams.\nMore uplifting than AI safety\nThe rush of new agents hitting the market offers a more uplifting story for AI companies at a time when the leading labs are facing intensifying scrutiny due to emerging concerns that the most advanced models are at risk of spinning out of human control.\nOn Tuesday, as Altman was attending DevDay, his second-in-command, Greg Brockman, was in Washington for a lunch that President Donald Trump was hosting for top technology leaders. The topic was AI safety, and the event came more than two weeks after Anthropic CEO Dario Amodei sent shock waves across the industry, writing an essay urging AI companies to slow the pace of frontier model development.\nNick Deveau, CEO of AI sales startup GrottoAI, is a fan of AI agent tools like Instinct and sees the vision as companies start building them for a wider audience.\n\"The interesting thing about all of these, which I think has become apparent really quickly and is evidenced by some of the valuations, is that people see this as the first successful proof point of true agentic work hitting consumers,\" Deveau said.\nThere's still the question of whether consumers will pay. Meta's Muse is free with a usage limit and can be purchased starting at $20 a month after that. OpenAI's Dots is only available starting at the $100 per month Pro plan and higher.\nAnd even with Muse racking up millions of downloads across app stores, that doesn't mean people are actively using it or other AI agents, Waldmann said.\n\"People will try it, but is it really adding value?\" Waldmann said. \"Is it part of a daily habit?\"\nThomas Randall, a research director at the Info-Tech Research Group, said in an email that \"the race is on,\" as AI companies search to figure out how consumers want to use agents and what will keep them coming back.\n\"Once leading systems are broadly capable, the winner will likely be determined by which agent is the easiest to adopt, the most connected, and the hardest to leave,\" Randall said. \"We'll see who's distribution will gather steam first.\"",

    "id": "trump-s-meeting-with-tech-leaders-leaves-32bb1e6a",
    "title": "Trump's meeting with tech leaders leaves AI safety more unsettled than ever",
    "titleJa": "Trump's meeting with tech leaders leaves AI safety more unsettled than ever",
    "summaryJa": "Following Trump's lunch with AI leaders at the White House, the industry remains largely unchanged on AI safety.",
    "bodyOriginal": "After President Donald Trump's lunch with AI leaders on Tuesday, the leading artificial intelligence companies are right where they were before: policing themselves.\nTrump hosted top execs from Alphabet, Meta, SpaceX, Nvidia, Palantir, Anthropic, OpenAI, and other companies following a three-week stretch during which the topic of AI safety turned into an intense nationwide debate, with leading industry researchers and executives warning of the extreme threats posed by the most powerful models.\nBut while the concerns voiced this month by the likes of Anthropic CEO Dario Amodei have led many policymakers and industry experts to demand government regulation, Trump has steadfastly opposed any such moves, and called AI fears a \"hoax.\"\nOn Tuesday, Trump brought leaders to the White House to sign a two-page document, including one with signatures, that he shared on his Truth Social account. It was titled, \"White House Accord on Super Intelligence: Joint Commitment on Frontier Responsibilities.\"\nThe document says that the group believes \"every company is responsible for developing its own technology safely and in a way that builds trust with customers and the public.\" Signatories included some of the same people who have been insisting that, in the absence of a coordinated safety effort, their technology can't be trusted.\n\"You saw two weeks ago almost all those same CEOs say they should be regulated,\" said Bradley Tusk, CEO of Tusk Ventures, in an interview on CNBC's \"Closing Bell Overtime\" on Tuesday. \"It's not because they fundamentally believe in the power of the state. They want something that creates an equalizer for each other.\"\nThe four action items in the document call for each company to establish \"robust\" internal monitoring of models, have an internal team that ensures the controls are working, partner with outside auditors or evaluators, and designate an independent committee of the board to oversee the internal team.\n\"Over time, it may make sense to codify these steps into laws or regulations,\" the last paragraph begins. When asked by reporters outside the White House if the rules are binding, Trump said they're \"morally binding.\"\nTrump wasn't just holding the event to promote the new accord. Separately, he said he signed a document purporting to \"officially\" change the name of AI to \"super intelligence,\" trying to push through a rebrand after crowdsourcing a new name on social media last week.\n'This is a start'\nWhile tech companies aren't likely to swap out their use of the AI acronym anytime soon, their top leaders, after Tuesday's lunch, were quick to voice their support for Trump's broader effort. It's been a consistent theme during Trump's second term as corporate America, particularly the tech industry, attempts to stay out of the president's crosshairs.\nMeta CEO Mark Zuckerberg told reporters that the agreement is designed to \"give the American people and our customers confidence that the technology works in the way we intend.\"\n\"The idea isn't that this is the only thing that we'll ever do,\" Zuckerberg said. \"It is that this is a start and an accord that the whole industry can come to.\"\nCompared to his peers like Amodei and OpenAI CEO Sam Altman, Zuckerberg has been more in the camp of self-regulation, alongside Nvidia CEO Jensen Huang. Days after Amodei's explosive essay earlier this month urging AI labs to \"pace the frontier,\" Zuckerberg wrote in a post on X that \"trust and alignment are quickly becoming the most important capabilities that will differentiate agents and models.\"\nAmodei, who's had a rocky relationship with the White House but had dinner with Trump late last week, offered a fairly innocuous comment to the group of reporters after the signing, saying, \"If we do this right, if we work with the president and everyone here we can win safely.\"\nAnd Alphabet's Sundar Pichai described the moment as \"historic and consequential.\"\nBut with the concerns surrounding high-profile security breaches escalating, and public sentiment towards AI companies turning decidedly sour heading into the November mid-term elections, calls for regulation are only likely to grow louder.\nAccording to Verasight's September national survey, 63% of respondents said AI should slow down while only 5% said it should accelerate.\nSen. Mark Warner, D-Va., said on Tuesday that he's introduced legislation to require \"rigorous testing and evaluation\" of leading AI technology and to strengthen security and reporting \"before the most powerful models are deployed.\"\n\"The companies building the most powerful AI systems are warning us that the technology is advancing faster than our safeguards,\" Warner said in a release. \"The president's response? To rename it and tell the companies developing it to regulate themselves. But changing what we call artificial intelligence does nothing to address the very real risks that come with increasingly powerful AI systems.\"\n—CNBC's Kevin Breuninger, Samantha Subin and Lora Kolodny contributed to this report",

    "titleJa": "Greggs to shut four factories and cut 740 jobs",
    "summaryJa": "The company says it needs to \"keep evolving alongside changing customer expectations\".",
    "bodyOriginal": "Greggs to shut four factories and cut 740 jobs\n- Published\nHigh street bakery brand Greggs has announced plans to shut four of its factories and cut 740 jobs.\nIt plans to close manufacturing sites at North Lakes near Penrith, Cumbria, Pettigrews in Kelso, Scotland, Seaham in County Durham and Enfield, Greater London, though distribution operations would continue to run from the latter.\nThe proposals will also impact manufacturing operations at its Treforest site in Wales, but this will also continue as a distribution centre for the business.\nThe chain, which has headquarters in Newcastle, said its retail shops would not be affected by the proposed changes and like-for-like sales had grown across its managed stores.\nThe changes would take place over the next two and a half years, with parts of Greggs' manufacturing processes relocating, the firm said.\nThe range of products manufactured at its Clydesmill Glasgow and Manchester locations would be reduced and production of tinned bread at Gosforth would be stopped.\nSome products would also be sourced from specialist suppliers.\nThe general secretary of the Bakers, Food and Allied Workers Union (BFAWU) Sarah Woolley said the union was \"deeply concerned\" about the announcement.\nShe said: \"Our immediate priority is our members, their jobs, their families and the communities that could be affected by these proposals.\"\nShe added Greggs was clear in its own announcement the business continued to \"perform strongly\".\n'No decisions made'\nGreggs said positive trading and continued cost control means it expected a \"modestly improved outcome\" for 2026.\nLike-for-like sales grew by 3.4% across its managed stores, with overall growth buoyed by the opening of new shops.\nWoolley said Greggs' workers had played a \"huge part\" in getting the company where it is.\nShe said: \"Against that backdrop, our members will understandably be asking why their jobs and livelihoods should now be put at risk in the name of efficiency and future progression.\"\nBut chief executive Roisin Currie said the company needed to \"keep evolving alongside changing customer expectations\".\nShe said: \"Greggs manufacturing and logistics network remains a key strength of the business, and these proposals are intended to strengthen our manufacturing network, improve efficiency and ensure we remain well placed for the future while continuing to deliver the quality, value and service our customers expect.\"\nThe firm employs 33,000 people in the UK, the majority working in its stores.\nA consultation with staff is expected to start soon and the company said \"no final decisions\" had been made yet.\nThe shake-up is expected to cost the firm about £60m, including disruption costs and redundancy payments.\nIt said the plans would save it about £20m across the 2028 and 2029 financial years.\nThe retail business said its sales grew by 7.7% in the three months to September 26, compared with the same period a year earlier.\nIt said this represented progress in the face of \"challenging market conditions\", as consumer finances continued to come under pressure.\nThe company said positive trading and continued cost control meant it expected a \"modestly improved outcome\" for 2026.\nGreggs opened 95 new shops and closed 38 in the year to date, taking its overall estate to 2,796 shops.\nFollow BBC North East on X, external and Facebook, external and BBC Cumbria on X, external and Facebook, external and both on Nextdoor and Instagram, external.\nGet in touch\nDo you have a story suggestion for BBC North East & Cumbria?\n- Published24 September 2025\n- Published16 September",
    "bodyJa": "Greggs to shut four factories and cut 740 jobs\n- Published\nHigh street bakery brand Greggs has announced plans to shut four of its factories and cut 740 jobs.\nIt plans to close manufacturing sites at North Lakes near Penrith, Cumbria, Pettigrews in Kelso, Scotland, Seaham in County Durham and Enfield, Greater London, though distribution operations would continue to run from the latter.\nThe proposals will also impact manufacturing operations at its Treforest site in Wales, but this will also continue as a distribution centre for the business.\nThe chain, which has headquarters in Newcastle, said its retail shops would not be affected by the proposed changes and like-for-like sales had grown across its managed stores.\nThe changes would take place over the next two and a half years, with parts of Greggs' manufacturing processes relocating, the firm said.\nThe range of products manufactured at its Clydesmill Glasgow and Manchester locations would be reduced and production of tinned bread at Gosforth would be stopped.\nSome products would also be sourced from specialist suppliers.\nThe general secretary of the Bakers, Food and Allied Workers Union (BFAWU) Sarah Woolley said the union was \"deeply concerned\" about the announcement.\nShe said: \"Our immediate priority is our members, their jobs, their families and the communities that could be affected by these proposals.\"\nShe added Greggs was clear in its own announcement the business continued to \"perform strongly\".\n'No decisions made'\nGreggs said positive trading and continued cost control means it expected a \"modestly improved outcome\" for 2026.\nLike-for-like sales grew by 3.4% across its managed stores, with overall growth buoyed by the opening of new shops.\nWoolley said Greggs' workers had played a \"huge part\" in getting the company where it is.\nShe said: \"Against that backdrop, our members will understandably be asking why their jobs and livelihoods should now be put at risk in the name of efficiency and future progression.\"\nBut chief executive Roisin Currie said the company needed to \"keep evolving alongside changing customer expectations\".\nShe said: \"Greggs manufacturing and logistics network remains a key strength of the business, and these proposals are intended to strengthen our manufacturing network, improve efficiency and ensure we remain well placed for the future while continuing to deliver the quality, value and service our customers expect.\"\nThe firm employs 33,000 people in the UK, the majority working in its stores.\nA consultation with staff is expected to start soon and the company said \"no final decisions\" had been made yet.\nThe shake-up is expected to cost the firm about £60m, including disruption costs and redundancy payments.\nIt said the plans would save it about £20m across the 2028 and 2029 financial years.\nThe retail business said its sales grew by 7.7% in the three months to September 26, compared with the same period a year earlier.\nIt said this represented progress in the face of \"challenging market conditions\", as consumer finances continued to come under pressure.\nThe company said positive trading and continued cost control meant it expected a \"modestly improved outcome\" for 2026.\nGreggs opened 95 new shops and closed 38 in the year to date, taking its overall estate to 2,796 shops.\nFollow BBC North East on X, external and Facebook, external and BBC Cumbria on X, external and Facebook, external and both on Nextdoor and Instagram, external.\nGet in touch\nDo you have a story suggestion for BBC North East & Cumbria?\n- Published24 September 2025\n- Published16 September",
