    "title": "Corruption is voters' top issue ahead of midterm election, CNBC survey shows",
    "titleJa": "Corruption is voters' top issue ahead of midterm election, CNBC survey shows",
    "summaryJa": "Democrats have worked to contrast economic hardship with President Trump's surging net worth and his family's lucrative business dealings.",
    "bodyOriginal": "Voters are now more concerned about government corruption than any other issue, including high grocery and gas prices, according to the final CNBC All-America Economic Survey before the Nov. 3 midterm election.\nThe finding follows a monthslong messaging effort by Democrats to link widespread economic dissatisfaction with what they allege is rampant corruption by President Donald Trump and his Republican allies.\nCNBC's survey of 1,000 registered U.S. voters found 36% of respondents pointing to government corruption as one of the most important issues facing the country right now. The cost of food and groceries came second with 34%, followed by protecting democracy and the price of gas, which garnered 23% each.\nThe nationwide poll, which gauged attitudes about the economy, Trump, Congress, artificial intelligence, the Iran war and more, was conducted Oct. 14-18. It was co-led by Democratic pollster Hart Research Associates and Republican pollster Public Opinion Strategies, and carries a margin of error of plus or minus 3.1 percentage points.\nRead the full survey results here.\nTo be sure, the question asking voters to name their top concerns lists several economy- and cost-related topics separately, subdividing an issue that might otherwise rank higher if lumped into a single category.\nBut the results nevertheless align with other recent polls showing corruption has shot to the top of voters' list of pressing worries.\nA Fox News poll published last week found 60% of registered voters are extremely concerned about government corruption, surpassing concerns about inflation and high prices. A Washington Post-ABC News-Ipsos poll released Sunday found some two-thirds of respondents think Trump is using the presidency to enrich himself, up 10 percentage points since September 2025. Gallup recently found perceptions of government corruption in the U.S. have hit multi-decade highs. And an August poll from Reuters/Ipsos found nearly 7 in 10 Americans believe Trump's businesses influence his presidential decisions.\nRepublicans have also tried to seize on growing anti-corruption sentiment. The Trump administration has launched a task force led by Vice President JD Vance aimed at cracking down on fraud, while the president frequently accuses his Democratic enemies of crookery.\n\"I just want to say that from day one of my administration, we've waged an unprecedented war on corruption and fraud, and will not let our country be looted and plundered by thieves and pirates and foreign fraudsters and basically scum,\" Trump said Tuesday while unveiling a new reward program for whistleblowers.\nBut with Republicans in charge of the federal government — and as high costs linked to Trump's tariffs and the Iran war have put the GOP on defense — Democrats have been able to cast blame more directly.\n\"Americans have spent well over $100 BILLION extra on gas because Trump chose to go to war with Iran,\" Sen. Mark Warner, D-Va., said Wednesday on X. \"His ego-fueled decisions cost you thousands.\"\nTheir arguments often spotlight Trump, attempting to draw a contrast between Americans' widely felt financial struggles with the president's surging net worth, his family's lucrative business dealings and his focus on pricey construction projects.\nOther Democratic candidates have widened the scope of the message, delivering a pitch that the system itself is broken.\n\"The problem is that the people's elected representatives don't represent the people. They represent the donors and special interests,\" Sen. Jon Ossoff, D-Ga., said in an April campaign video. \"Corruption is why things don't work for ordinary people.\"\nHouse Minority Leader Hakeem Jeffries, D-N.Y., has hammered the claim that Republicans have betrayed their vow to bring down costs.\n\"The wealthy and well-connected are cashing in. What are Republicans doing to lower costs for everyone else? Absolutely nothing,\" Jeffries wrote Friday.\nRhetoric and results\nDemocrats' push appears to be resonating with voters, even as large swaths remain skeptical of both parties.\nRespondents to the CNBC survey gave Democrats a 4-point edge over Republicans, 35% to 31%, when asked which party would do a better job dealing with government corruption.\nBut that gap grew to 17 points in Democrats' favor among voters who said corruption was their most important issue.\nAnd independents, by a 15-point margin, said Democrats would address corruption better than Republicans – though 41% of those respondents think neither party would do a good job.\nThe apparent rise in concern about corruption is welcome news to critics of the president who have long lamented that Americans have become numb to scandal in the Trump era.\nThat shift is taking place because voters are feeling the impact of inflation and connecting it to what they see in Washington, said Brian Lemek, executive of the Democrat-backing political action committee Defend the Vote, in an interview.\n\"It's the only thing people are talking about right now,\" said Lemek, whose group briefed candidates on the issue in June.\nVoters are \"looking at the reality that their costs are high\" and \"making the connection between this corrupt and broken system and their high costs,\" he said.\nAdditionally, survey respondents overwhelmingly opposed the idea of elected officials, including the president and members of Congress, personally owning or trading stocks in individual companies that have contracts with the federal government. That should not be allowed, 93% of voters said in the poll.\nA similar proportion – 89% – said that companies owned, or invested in, by a sitting president's immediate family members should not be allowed to receive contracts from the federal government.\n\"This definitely ties back to the corruption issues that we've been talking about,\" said Alicia Simmons of Hart Research Associates.",

    "id": "volvo-cars-plunges-27-as-ceo-says-china-a39982ac",
    "title": "Volvo Cars plunges 27% as CEO says China sales slump came 'faster than we thought'",
    "titleJa": "Volvo Cars plunges 27% as CEO says China sales slump came 'faster than we thought'",
    "summaryJa": "The Swedish automaker cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"",
    "bodyOriginal": "Volvo Cars said Friday it plans to cut 2,500 jobs after a sharp decline in its Chinese market weighed on third-quarter earnings.\nThe Swedish automaker reported an operating loss of 5.6 billion Swedish kronor ($563.7 million) in the third quarter, down from an operating profit of 6.4 billion Swedish kronor in the previous period.\nThe company, which is owned by China's Geely Holding, cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"\nVolvo Cars shares were last down around 27%.\n\"It's really a lot about the Chinese market, of course, where the change has come faster than we thought, and really now we can see that selling global cars developed in Europe and China will not work, and then this is affecting all the Western players in China,\" Volvo Cars CEO Håkan Samuelsson told CNBC on \"Squawk Box Europe,\" on Friday.\nChinese consumers are now looking for \"domestic alternatives,\" which have become stronger and more competitive, the CEO said. \"We need a new strategy in China... it has to be a more regional structure, a more empowered region, and we need regionally adapted cars.\"\nHe added that costs must be competitive and that Volvo Cars needs to share some platforms with its Chinese parent company Geely, and develop key software in China that includes infotainment and driver-assistance systems. \"If you don't have that, I think you cannot sell cars in China.\"\nVolvo Cars' revenues in China fell almost 50% year-on-year as premium brands faced \"hypercompetition\" from new Chinese rivals, which also put severe pressure on pricing, the company said.\nMeanwhile, in the U.S., the automaker cited negative effects from tariffs and fewer customer incentives to buy electric cars, putting pressure on profit margins.\nVolvo Cars said it is looking to cut 5 billion Swedish kronor in costs and will eliminate 2,500 jobs globally, with 2,000 of those jobs based in Sweden.\n\"It is really a consequence of this development, our long-range strategy,\" Samuelsson told CNBC. \"We will have more empowered, stronger regions, and then of course you cannot keep the same resources on the corporate central level. So we need a leaner central administration.\"",
    "bodyJa": "Volvo Cars said Friday it plans to cut 2,500 jobs after a sharp decline in its Chinese market weighed on third-quarter earnings.\nThe Swedish automaker reported an operating loss of 5.6 billion Swedish kronor ($563.7 million) in the third quarter, down from an operating profit of 6.4 billion Swedish kronor in the previous period.\nThe company, which is owned by China's Geely Holding, cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"\nVolvo Cars shares were last down around 27%.\n\"It's really a lot about the Chinese market, of course, where the change has come faster than we thought, and really now we can see that selling global cars developed in Europe and China will not work, and then this is affecting all the Western players in China,\" Volvo Cars CEO Håkan Samuelsson told CNBC on \"Squawk Box Europe,\" on Friday.\nChinese consumers are now looking for \"domestic alternatives,\" which have become stronger and more competitive, the CEO said. \"We need a new strategy in China... it has to be a more regional structure, a more empowered region, and we need regionally adapted cars.\"\nHe added that costs must be competitive and that Volvo Cars needs to share some platforms with its Chinese parent company Geely, and develop key software in China that includes infotainment and driver-assistance systems. \"If you don't have that, I think you cannot sell cars in China.\"\nVolvo Cars' revenues in China fell almost 50% year-on-year as premium brands faced \"hypercompetition\" from new Chinese rivals, which also put severe pressure on pricing, the company said.\nMeanwhile, in the U.S., the automaker cited negative effects from tariffs and fewer customer incentives to buy electric cars, putting pressure on profit margins.\nVolvo Cars said it is looking to cut 5 billion Swedish kronor in costs and will eliminate 2,500 jobs globally, with 2,000 of those jobs based in Sweden.\n\"It is really a consequence of this development, our long-range strategy,\" Samuelsson told CNBC. \"We will have more empowered, stronger regions, and then of course you cannot keep the same resources on the corporate central level. So we need a leaner central administration.\"",

    "id": "the-indian-workers-filming-their-work-to-25298a04",
    "title": "The Indian workers filming their work to train AI",
    "titleJa": "The Indian workers filming their work to train AI",
    "summaryJa": "Indian workers are being paid to film themselves at work and the footage is used to train AI.",
    "bodyOriginal": "The Indian workers filming their work to train AI\n- Published\nMohammed Ashim has been cutting hair and trimming beards for four years in Bengaluru.\nBut recently the 22-year old has been strapping a camera to his head to record his work.\nThe camera only records his hands and fingers - his client's faces are blurred out.\n\"The routine is simple, but you have to be disciplined about how you move. The operations team taught me that my hands always have to stay cleanly inside the frame, the lighting has to be sharp, and I can't tilt my head too abruptly while working.\"\nHe wears the camera for five or six hours a day.\n\"It's good money, but honestly, the feeling of doing something this futuristic is what keeps me excited. I never imagined my razor techniques would be useful to a global tech company,\" says Ashim.\nHe is one of hundreds of thousands of workers across the world paid to record their activities.\nAshim's footage is collected by a local company, which might have hundreds of people filming their work.\nThat video is then sold on to technology companies and research organisations who use it to train artificial intelligence - in particular so-called physical AI, a type of artificial intelligence that can control robots in the real world.\nRashdan Technologies collects and processes such human generated data.\n\"Every robotics company, every frontier AI lab, has a specific kind of data they want: industrial tasks, agriculture, household chores, small business work like pottery, garment-making, embroidery, candle-making. We go wherever the task is,\" says co-founder and CEO Shahil Baig.\nHis company pays $5 to $10 (£3.74; £7.47) for eight to 10 hours of recorded work.\n\"For a lot of these people, that's meaningful,\" Baig says.\nMaking sure workers give their consent and are comfortable with the process is important, he says.\n\"We record hands, not faces, and where multi-camera rigs do capture more of the body or environment, we blur faces out. No names, no contact details, nothing that identifies them personally goes into what we hand off.\"\nBut his customers are getting more demanding.\n\"Now clients are asking for four to six cameras rigged around a person's head to cover the entire scene, not just the hands.\n\"Getting someone to agree to one small camera is one conversation. Getting them to agree to wearing what's effectively a five-camera headset is a completely different, and harder, one. We pay more for that tier of data collection because of what we're asking of people.\"\nAnd the industry is becoming more crowded, Agarwal expects dozens more competitors to emerge in India this year.\nWhy is such data so important?\nIf you want robots to navigate the real world, they can't just be trained inside computer simulations, argues Manish Agarwal, the founder of Humyn Labs, which collects and processes human-generated data.\nMost of that data comes from video, but sometimes collectors wear hardware on their hands and fingers to capture physical contact.\n\"Physical tasks require high-quality signals involving limb movements, fingers, wrists, elbows, shoulders and dynamic force application. For example: applying the correct grip force so a plastic bottle doesn't crumble versus a steel glass,\" he says.\nAnd until recently, that data was not available.\n\"There is no existing internet archive of embodied human activity - no dataset of a kitchen being cleaned, or a car being assembled by hands that know exactly how much force to apply. That data has to be captured from scratch, in the real world, across diverse environments,\" says Agarwal, whose company has bases in Bangalore and San Francisco.\nAt the moment his firm has 96,000 data collectors across countries in Latin America and Southeast Asia.\nHumyn Labs filters the thousands of hours of video supplied by those collectors, selecting the most useful content. It's then labelled so the AI knows what it is looking at and packaged in a format that can be used by clients.\n\"You need to source across a variety of factories, a variety of tasks, in different geographies because if you want to build deployment for US factories or US houses, you'd want environments that are a proxy for that. Residential houses in India may not be the right context for building a robotics use case for the US.\"\nBut are workers collecting data for machines that will one day do their jobs?\nAt the moment it's too early to tell says Bino Paul, senior professor at the School of Management and Labour Studies at the Tata Institute of Social Sciences (TISS) in Mumbai.\nFor some workers AI might be a useful tool, but robots could automate other jobs, he says.\nThe problem is that, if machines do start to take over, there will be little workers can do about.\n\"By the time workers realise what they have participated in, things may have gone too far,\" he says.\nLike many others, he wants governments to regulate AI.\n\"AI cannot be viewed merely as a technical system. We need to develop a socio-technical system in which ethics is upheld through human agency, ensuring that AI delivers beneficence rather than maleficence.\"\n'This is survival'\nDespite concerns over where AI is heading, money is still being poured into its development.\nSome of that trickles down to workers in India, where there is no shortage of workers prepared to wear a camera for a few dollars a day.\nMohammed Arman has been working in the textiles industry in Bangalore for 10 years.\n\"Garments stitching and cutting. I know this work so well I could probably do it with my eyes closed. Cloth, thread, needle, machine after 10 years, your hands just know what to do before your mind even tells them,\" he says.\nHe has recently started wearing a head-mounted camera that records his work.\n\"For me, it's simple. This is survival. I have a family back home in Bihar, and every rupee I send back matters. If someone offers me extra money to wear a camera while I do the exact same work I've been doing for 10 years, I'm not going to say no.\n\"It doesn't cost me anything. I'm already doing the stitching, already doing the cutting. Now I just get paid a little more for it,\" he says.\nWhile there is demand for such footage it will be collected somewhere.\n\"India's current role in this industry is largely as a supplier of raw material - people strap on cameras, record themselves doing ordinary tasks, and that footage gets shipped off to labs abroad,\" Agarwal says.\nBut he argues the value of that kind of work will quickly become eroded, as more companies compete for collection contracts.\n\"India can't afford to stay a footage supplier. It needs to move up the value chain: from recording raw video to owning the pipeline that turns that video into something usable - cleaning it, structuring it, validating it, and ultimately setting the standards for what counts as high-quality training data,\" he says.\nFor some people collecting data is attractive part time work.\nScience teacher Jolly Arifur was looking for work she could do from home that would fit around her young son.\n\"For the past seven months, I strapped a rig-mounted camera on my head while doing my routine domestic work scrubbing, cooking, sweeping tile floors, and folding laundry.\"\nArifur, who lives in Guntakal, Anantapur, fits the recording work around her teaching.\n\"I get paid two to three dollars per hour. If I record three to five hours a day, that's a good amount in hand it's become an extra source of income for me, on top of teaching. I'm managing both honestly, fantastically.\"\nMore Technology of Business\n- Published18 September\n- Published16 September\n- Published11 September",
    "bodyJa": "The Indian workers filming their work to train AI\n- Published\nMohammed Ashim has been cutting hair and trimming beards for four years in Bengaluru.\nBut recently the 22-year old has been strapping a camera to his head to record his work.\nThe camera only records his hands and fingers - his client's faces are blurred out.\n\"The routine is simple, but you have to be disciplined about how you move. The operations team taught me that my hands always have to stay cleanly inside the frame, the lighting has to be sharp, and I can't tilt my head too abruptly while working.\"\nHe wears the camera for five or six hours a day.\n\"It's good money, but honestly, the feeling of doing something this futuristic is what keeps me excited. I never imagined my razor techniques would be useful to a global tech company,\" says Ashim.\nHe is one of hundreds of thousands of workers across the world paid to record their activities.\nAshim's footage is collected by a local company, which might have hundreds of people filming their work.\nThat video is then sold on to technology companies and research organisations who use it to train artificial intelligence - in particular so-called physical AI, a type of artificial intelligence that can control robots in the real world.\nRashdan Technologies collects and processes such human generated data.\n\"Every robotics company, every frontier AI lab, has a specific kind of data they want: industrial tasks, agriculture, household chores, small business work like pottery, garment-making, embroidery, candle-making. We go wherever the task is,\" says co-founder and CEO Shahil Baig.\nHis company pays $5 to $10 (£3.74; £7.47) for eight to 10 hours of recorded work.\n\"For a lot of these people, that's meaningful,\" Baig says.\nMaking sure workers give their consent and are comfortable with the process is important, he says.\n\"We record hands, not faces, and where multi-camera rigs do capture more of the body or environment, we blur faces out. No names, no contact details, nothing that identifies them personally goes into what we hand off.\"\nBut his customers are getting more demanding.\n\"Now clients are asking for four to six cameras rigged around a person's head to cover the entire scene, not just the hands.\n\"Getting someone to agree to one small camera is one conversation. Getting them to agree to wearing what's effectively a five-camera headset is a completely different, and harder, one. We pay more for that tier of data collection because of what we're asking of people.\"\nAnd the industry is becoming more crowded, Agarwal expects dozens more competitors to emerge in India this year.\nWhy is such data so important?\nIf you want robots to navigate the real world, they can't just be trained inside computer simulations, argues Manish Agarwal, the founder of Humyn Labs, which collects and processes human-generated data.\nMost of that data comes from video, but sometimes collectors wear hardware on their hands and fingers to capture physical contact.\n\"Physical tasks require high-quality signals involving limb movements, fingers, wrists, elbows, shoulders and dynamic force application. For example: applying the correct grip force so a plastic bottle doesn't crumble versus a steel glass,\" he says.\nAnd until recently, that data was not available.\n\"There is no existing internet archive of embodied human activity - no dataset of a kitchen being cleaned, or a car being assembled by hands that know exactly how much force to apply. That data has to be captured from scratch, in the real world, across diverse environments,\" says Agarwal, whose company has bases in Bangalore and San Francisco.\nAt the moment his firm has 96,000 data collectors across countries in Latin America and Southeast Asia.\nHumyn Labs filters the thousands of hours of video supplied by those collectors, selecting the most useful content. It's then labelled so the AI knows what it is looking at and packaged in a format that can be used by clients.\n\"You need to source across a variety of factories, a variety of tasks, in different geographies because if you want to build deployment for US factories or US houses, you'd want environments that are a proxy for that. Residential houses in India may not be the right context for building a robotics use case for the US.\"\nBut are workers collecting data for machines that will one day do their jobs?\nAt the moment it's too early to tell says Bino Paul, senior professor at the School of Management and Labour Studies at the Tata Institute of Social Sciences (TISS) in Mumbai.\nFor some workers AI might be a useful tool, but robots could automate other jobs, he says.\nThe problem is that, if machines do start to take over, there will be little workers can do about.\n\"By the time workers realise what they have participated in, things may have gone too far,\" he says.\nLike many others, he wants governments to regulate AI.\n\"AI cannot be viewed merely as a technical system. We need to develop a socio-technical system in which ethics is upheld through human agency, ensuring that AI delivers beneficence rather than maleficence.\"\n'This is survival'\nDespite concerns over where AI is heading, money is still being poured into its development.\nSome of that trickles down to workers in India, where there is no shortage of workers prepared to wear a camera for a few dollars a day.\nMohammed Arman has been working in the textiles industry in Bangalore for 10 years.\n\"Garments stitching and cutting. I know this work so well I could probably do it with my eyes closed. Cloth, thread, needle, machine after 10 years, your hands just know what to do before your mind even tells them,\" he says.\nHe has recently started wearing a head-mounted camera that records his work.\n\"For me, it's simple. This is survival. I have a family back home in Bihar, and every rupee I send back matters. If someone offers me extra money to wear a camera while I do the exact same work I've been doing for 10 years, I'm not going to say no.\n\"It doesn't cost me anything. I'm already doing the stitching, already doing the cutting. Now I just get paid a little more for it,\" he says.\nWhile there is demand for such footage it will be collected somewhere.\n\"India's current role in this industry is largely as a supplier of raw material - people strap on cameras, record themselves doing ordinary tasks, and that footage gets shipped off to labs abroad,\" Agarwal says.\nBut he argues the value of that kind of work will quickly become eroded, as more companies compete for collection contracts.\n\"India can't afford to stay a footage supplier. It needs to move up the value chain: from recording raw video to owning the pipeline that turns that video into something usable - cleaning it, structuring it, validating it, and ultimately setting the standards for what counts as high-quality training data,\" he says.\nFor some people collecting data is attractive part time work.\nScience teacher Jolly Arifur was looking for work she could do from home that would fit around her young son.\n\"For the past seven months, I strapped a rig-mounted camera on my head while doing my routine domestic work scrubbing, cooking, sweeping tile floors, and folding laundry.\"\nArifur, who lives in Guntakal, Anantapur, fits the recording work around her teaching.\n\"I get paid two to three dollars per hour. If I record three to five hours a day, that's a good amount in hand it's become an extra source of income for me, on top of teaching. I'm managing both honestly, fantastically.\"\nMore Technology of Business\n- Published18 September\n- Published16 September\n- Published11 September",

    "id": "sk-hynix-shares-rebound-after-initial-dr-77a8fec7",
    "title": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans",
    "titleJa": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans",
    "summaryJa": "SK Hynix shares rebound after an inital drop in early trading, following halted review of Solidigm IPO plans in the U.S.",
    "bodyOriginal": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\nThe stock reversed earlier losses to trade 3.2% higher.\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\nThe company also said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.\nThe decision also follows regulatory scrutiny in South Korea.\nThe country's financial regulator said Monday that a potential U.S. listing of Solidigm could violate South Korean rules restricting dual listings, according to Reuters.\nFinancial Supervisory Service Governor Lee Chan-jin said regulators were examining whether the IPO would require a review under the country's rules designed to protect minority shareholders.\nSK Hynix said Solidigm's investment needs remain unchanged and that it would continue exploring alternative financing options to support the subsidiary's growth and enhance shareholder value.\nThe announcement comes as U.S. technology stocks face pressure amid worries over AI spending.The tech-heavy Nasdaq Composite slid 2.6% on Thursday, its worst session since June, while Nvidia fell 4.4% and Advanced Micro Devices dropped 8.1%.\nAmid a sell-off in memory stocks, Nvidia CEO Jensen Huang told CNBC Thursday that he does not expect an oversupply of memory chips by 2029, despite concerns over weakening demand.\nAI data center stocks have also come under pressure amid growing concerns over financing risks and the pace of AI infrastructure expansion. Shares of CoreWeave plunged 10% on Thursday, extending their monthly decline to 36%, while Australia's NextDC tumbled nearly 40% on Wednesday after cutting its earnings forecast.",
    "bodyJa": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\nThe stock reversed earlier losses to trade 3.2% higher.\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\nThe company also said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.\nThe decision also follows regulatory scrutiny in South Korea.\nThe country's financial regulator said Monday that a potential U.S. listing of Solidigm could violate South Korean rules restricting dual listings, according to Reuters.\nFinancial Supervisory Service Governor Lee Chan-jin said regulators were examining whether the IPO would require a review under the country's rules designed to protect minority shareholders.\nSK Hynix said Solidigm's investment needs remain unchanged and that it would continue exploring alternative financing options to support the subsidiary's growth and enhance shareholder value.\nThe announcement comes as U.S. technology stocks face pressure amid worries over AI spending.The tech-heavy Nasdaq Composite slid 2.6% on Thursday, its worst session since June, while Nvidia fell 4.4% and Advanced Micro Devices dropped 8.1%.\nAmid a sell-off in memory stocks, Nvidia CEO Jensen Huang told CNBC Thursday that he does not expect an oversupply of memory chips by 2029, despite concerns over weakening demand.\nAI data center stocks have also come under pressure amid growing concerns over financing risks and the pace of AI infrastructure expansion. Shares of CoreWeave plunged 10% on Thursday, extending their monthly decline to 36%, while Australia's NextDC tumbled nearly 40% on Wednesday after cutting its earnings forecast.",

    "id": "wealthy-chinese-move-offshore-money-to-u-8791fb2a",
    "title": "Wealthy Chinese move offshore money to U.S. banks as Beijing’s tax net widens",
    "titleJa": "Wealthy Chinese move offshore money to U.S. banks as Beijing’s tax net widens",
    "summaryJa": "Bankers and lawyers say Chinese clients' demand for U.S. bank accounts has gathered pace as Beijing tightens the screws on Chinese offshore wealth.",
    "bodyOriginal": "SINGAPORE — Wealthy Chinese rattled by Beijing's widening hunt for overseas wealth are turning to a once-familiar refuge for their money: the U.S.\nPrivate bankers and lawyers who work with Chinese clients say inquiries about opening U.S. bank accounts have grown in the months after Beijing imposed retroactive taxes on offshore wealth in July, moving assets previously stored in Singapore or Hong Kong there to stay further away from Beijing's reach.\n\"It has become relatively prevalent,\" said Keith Tan, CEO of Singapore-based Golden Acacia Capital, who is helping Chinese clients manage their offshore portfolios. His clients began planning exits to the U.S. in July, and some have the accounts set up in less than two months. \"The hurdle is not that high for Chinese clients to open American accounts and transfer assets there.\"\nWealthy clients tend to choose large private banks while smaller accounts go to regional banks or online brokers, Tan said.\nThe rush has gained urgency with China's new tax regime on offshore trusts. Authorities said in July that income and gains from overseas trusts owned by Chinese tax residents would be taxed at 20%, setting off a scramble for cash and alternative structures.\nLawyers in Singapore and Hong Kong have been working to tally how much tax their clients owe, facilitating trusts' unwinding, sales of shares in listed companies or applying for loans to meet the outsized tax bill.\nMeanwhile, the U.S. sits outside the Common Reporting Standard, or CRS, the OECD framework under which more than 100 jurisdictions automatically share financial account data. While banks in Singapore and Hong Kong are supposed to report China-linked accounts to Beijing, American banks have no such obligation.\nNon-resident clients who open foreign bank accounts in the U.S. can also find investment vehicles with reduced or no tax-filing obligations to the Internal Revenue Service, said James Wang, CEO of Blue Brick Consulting Group, a private-client tax advisor. But China's latest regulations require people classified as Chinese tax residents to self-declare worldwide income to Beijing, Wang said.\nBanks in New York are seizing the opportunity to offer a solution that could shield Chinese customers from their country's tax man. U.S. banks are straining to keep up with the rise in demand, according to a New York-based wealth-planning advisor who works with Chinese family offices.\n\"With inquiries surging, some banks have shortened the timeframe for clients to meet required minimum capital commitments\" before the accounts are subject to closure, said the advisor, who requested anonymity to speak about bank processes.\nChinese families with offspring holding U.S. green cards have also used foreign grantor trusts – structures treated as owned by their non-American founder – to shield them from some tax exposure in the U.S., Tan said. Low-tax states such as Nevada and Florida have become popular choices, he added.\n\"They are gambling on not being disclosed, because the U.S. does not share information as part of the CRS system; they can dodge tax authorities,\" said Clifford Ng, a partner at Zhong Lun law firm in Hong Kong. Ng also expects that some with Hong Kong or Singapore residency whose trusts have not yet been flagged to Beijing may unwind those structures and transfer the money out.\n'Hiding is not tax planning'\nLawyers caution that though the route works for now to avoid disclosure, it may be temporary. Money held offshore has probably already been reported to Beijing through the CRS and would \"have shown up in China at some point,\" Ng said, so a transfer from a Singapore or Hong Kong bank to a U.S. one would be visible on its way out.\n\"They may still be in breach of the rules because they have an undisclosed offshore account that's making money and they're not declaring it onshore,\" Ng said. \"Hiding is not tax planning.\"\nWashington's Foreign Account Tax Compliance Act requires foreign banks to report American clients, but so far there's no matching automatic flow from U.S. banks to Beijing.\nCris Cao, Beijing-based partner at W&H Law Firm, agreed on the risk of Beijing's ability to tax money moved to the U.S. \"Even if they move all the money out of the CRS-reported accounts and into U.S. bank accounts, that doesn't naturally reduce or wipe out the tax authorities' right to tax, or their obligation to pay,\" he said.\n\"There was a record of it being transferred out,\" Cao said, and \"that alone is enough for the tax authorities to levy tax.\"\nWhat's more, the window of opportunity may have closed. Moving money that is already offshore around is relatively easy, but getting capital out of mainland China has become increasingly difficult.\n\"Nearly no sizeable money onshore will be able to leave the country from now on,\" said Jingkuan Lin, a private banker at Bank of Singapore, who sees the offshore banking industry being further limited to serving the existing pool of capital outside China.",

te-client tax advisor. But China's latest regulations require people classified as Chinese tax residents to self-declare worldwide income to Beijing, Wang said.\nBanks in New York are seizing the opportunity to offer a solution that could shield Chinese customers from their country's tax man. U.S. banks are straining to keep up with the rise in demand, according to a New York-based wealth-planning advisor who works with Chinese family offices.\n\"With inquiries surging, some banks have shortened the timeframe for clients to meet required minimum capital commitments\" before the accounts are subject to closure, said the advisor, who requested anonymity to speak about bank processes.\nChinese families with offspring holding U.S. green cards have also used foreign grantor trusts – structures treated as owned by their non-American founder – to shield them from some tax exposure in the U.S., Tan said. Low-tax states such as Nevada and Florida have become popular choices, he added.\n\"They are gambling on not being disclosed, because the U.S. does not share information as part of the CRS system; they can dodge tax authorities,\" said Clifford Ng, a partner at Zhong Lun law firm in Hong Kong. Ng also expects that some with Hong Kong or Singapore residency whose trusts have not yet been flagged to Beijing may unwind those structures and transfer the money out.\n'Hiding is not tax planning'\nLawyers caution that though the route works for now to avoid disclosure, it may be temporary. Money held offshore has probably already been reported to Beijing through the CRS and would \"have shown up in China at some point,\" Ng said, so a transfer from a Singapore or Hong Kong bank to a U.S. one would be visible on its way out.\n\"They may still be in breach of the rules because they have an undisclosed offshore account that's making money and they're not declaring it onshore,\" Ng said. \"Hiding is not tax planning.\"\nWashington's Foreign Account Tax Compliance Act requires foreign banks to report American clients, but so far there's no matching automatic flow from U.S. banks to Beijing.\nCris Cao, Beijing-based partner at W&H Law Firm, agreed on the risk of Beijing's ability to tax money moved to the U.S. \"Even if they move all the money out of the CRS-reported accounts and into U.S. bank accounts, that doesn't naturally reduce or wipe out the tax authorities' right to tax, or their obligation to pay,\" he said.\n\"There was a record of it being transferred out,\" Cao said, and \"that alone is enough for the tax authorities to levy tax.\"\nWhat's more, the window of opportunity may have closed. Moving money that is already offshore around is relatively easy, but getting capital out of mainland China has become increasingly difficult.\n\"Nearly no sizeable money onshore will be able to leave the country from now on,\" said Jingkuan Lin, a private banker at Bank of Singapore, who sees the offshore banking industry being further limited to serving the existing pool of capital outside China.",

    "title": "SpaceX records $561 million investment gain from stake in Elon Musk's Boring Co.",
    "titleJa": "SpaceX records $561 million investment gain from stake in Elon Musk's Boring Co.",
    "summaryJa": "SpaceX said on Thursday that its stake in Elon Musk's The Boring Co. netted the company an investment gain of $561 million during the third quarter.The gain accounted for more than half of SpaceX's \"other income\" in the period and boosted its net income, which landed at just over $4 billion, the company said in its quarterly financial filing with the Securities and Exchange Commission.",
    "bodyOriginal": "SpaceX said on Thursday that its stake in Elon Musk's The Boring Co. netted the company an investment gain of $561 million during the third quarter.\nThe gain accounted for more than half of SpaceX's \"other income\" in the period and boosted its net income, which landed at just over $4 billion, the company said in its quarterly financial filing with the Securities and Exchange Commission.\nCreated inside SpaceX in 2017 and spun out a year later, Boring Co. says its mission is to \"revolutionize transportation\" by creating underground tunnels with stations where passengers can board and exit. Last month, Boring Co. raised $3 billion at a $23 billion valuation, with backing from the United Arab Emirates and a roster of other longtime Musk supporters.\nBoring Co. has announced about a dozen city projects, but its only tunnels currently open for public use are in Las Vegas, where passengers can travel in Tesla vehicles between the downtown convention center and various casino resorts using its Las Vegas Convention Center Loop.\nIn July of last year, Boring Co. struck a deal to build about 20 miles of tunnels in Nashville, Tennessee. The Music City Loop, as it's known, is being designed to carry paying passengers between downtown and the airport in Tesla vehicles. The fast-tracked project sparked a partisan feud when it was greenlit and has drawn new safety concerns over sinkhole risks this week.\nIn the UAE, Boring Co. plans to build over 150 kilometers (93 miles) of tunnels, including a project announced in February of last year, the Dubai Loop.\nSpaceX also said in Thursday's filing that it purchased $151 million worth of Tesla's Megapack energy storage systems during the quarter. Musk said on SpaceX's earnings call on Tuesday that he thinks it would be a \"good idea\" for the two companies to merge, and said they've both created special committees to discuss a potential transaction.\nWATCH: Analyst sees boost to SpaceX shares in long run if Tesla merger happens",
    "bodyJa": "SpaceX said on Thursday that its stake in Elon Musk's The Boring Co. netted the company an investment gain of $561 million during the third quarter.\nThe gain accounted for more than half of SpaceX's \"other income\" in the period and boosted its net income, which landed at just over $4 billion, the company said in its quarterly financial filing with the Securities and Exchange Commission.\nCreated inside SpaceX in 2017 and spun out a year later, Boring Co. says its mission is to \"revolutionize transportation\" by creating underground tunnels with stations where passengers can board and exit. Last month, Boring Co. raised $3 billion at a $23 billion valuation, with backing from the United Arab Emirates and a roster of other longtime Musk supporters.\nBoring Co. has announced about a dozen city projects, but its only tunnels currently open for public use are in Las Vegas, where passengers can travel in Tesla vehicles between the downtown convention center and various casino resorts using its Las Vegas Convention Center Loop.\nIn July of last year, Boring Co. struck a deal to build about 20 miles of tunnels in Nashville, Tennessee. The Music City Loop, as it's known, is being designed to carry paying passengers between downtown and the airport in Tesla vehicles. The fast-tracked project sparked a partisan feud when it was greenlit and has drawn new safety concerns over sinkhole risks this week.\nIn the UAE, Boring Co. plans to build over 150 kilometers (93 miles) of tunnels, including a project announced in February of last year, the Dubai Loop.\nSpaceX also said in Thursday's filing that it purchased $151 million worth of Tesla's Megapack energy storage systems during the quarter. Musk said on SpaceX's earnings call on Tuesday that he thinks it would be a \"good idea\" for the two companies to merge, and said they've both created special committees to discuss a potential transaction.\nWATCH: Analyst sees boost to SpaceX shares in long run if Tesla merger happens",

    "id": "i-m-96-and-have-15-million-followers-th-d4aa0e5d",
    "title": "'I'm 96 and have 15 million followers': The grannies taking over TikTok",
    "titleJa": "'I'm 96 and have 15 million followers': The grannies taking over TikTok",
    "summaryJa": "Grandma Droniak, Nonna Gracie, Viv Truran and Barbara Costello have all found fame on social media in their later years.",
    "bodyOriginal": "'I'm 96 and have 15 million followers': The grannies taking over TikTok\n- Published\nNinety-six-year-old Lillian Droniak, known as Grandma Droniak to her social media followers, went viral in June after claiming her retirement home had threatened to evict her for throwing parties.\nThe home later confirmed the threat, but reached a settlement with Droniak that allowed her to keep partying – but not supply alcoholic drinks.\nWith 15 million followers, Droniak has turned her personality into a lucrative business, earning enough from social media to cover her nursing home fees of $12,000 (£9,000) a month.\nThe Connecticut grandma is one of many older women finding unexpected fame online, with most of their audiences often young enough to be their grandchildren.\nFrom fashion and food to dating and homemaking, they are finding new audiences and, in some cases, a new lease of life.\n'I'm showing it's not that bad to get old'\n\"I always knew I had it in me to be famous, I just didn't think it would happen in my 90s,\" Droniak tells me, explaining that her grandson began helping her post videos in 2020, initially out of boredom.\nShe believes her appeal lies in showing younger people that life doesn't stop as you get older.\n\"They think old people just sit and stare at a wall but I'm showing it's not that bad to get old. We embrace it, can still have fun and I'm still partying and going out sometimes.\"\nHer grandson edits her sponsored content, which includes partnerships with food and beauty brands. As well as paying for her nursing home fees, the money also goes towards a college fund for her great-grandchildren.\nDespite being recognised by fans in public, she says her fame feels different at the retirement home. \"They don't get it as they don't go on TikTok.\"\n'I'm very picky about brand deals'\nOn the other side of the Atlantic, there's Viv Truran, an equally cheeky and cheery 82-year-old from Cardiff.\nShe started posting on Instagram after losing her husband and her neighbour suggested filming her colourful outfits.\nNow she makes two videos a day from her bedroom-turned-studio, showing off her clothes, 22 pairs of glasses and two drawers of scarves.\n\"I get up in the morning, I never come downstairs until I've done my morning video and I'm very strict about that.\"\nShe also keeps a notebook tracking her followers and views – and is now on book five.\nTruran is regularly stopped by strangers, many of them women in their 20s and 30s, who tell her they are \"frightened of getting old\" and she shows them \"it's not that bad\".\nBrands have taken notice too and Truran says she'd \"be stupid\" not to do deals but is selective.\nShe does a couple of sponsored posts a month, prioritising local brands and charities like Age UK who paid her several thousand for a recent campaign.\n\"I've turned down some big deals because it's not my thing. I'm very picky about who I work with, I have to really love the brand.\"\n'I cry when people send me messages from around the world'\nNaomi Baker from influencer marketing agency We Are Social says older creators are attractive to brands as they often have \"deeply established, highly loyal\" communities with greater purchasing power, which \"carries a massive premium\".\nGrace Geramita, 85, has millions of followers who watch her cook recipes she has made for decades.\nKnown as Nonna Gracie, she moved from Italy to the US when she was 18 and worked multiple jobs at once to provide for her two daughters. Now, she earns more than she ever made in a previous job.\nHer grandson Matthew suggested they start filming her cooking six years ago but Geramita wasn't keen as she knew nothing about social media and doesn't \"speak very good English\", but the videos took off.\n\"I always cry when people send me messages from all around the world,\" she says.\nMuch of her content is about more than food – she says she wants to pass on the \"tradition of bringing family together around the table\".\n'Virtual grandma' for followers\nBaker from We Are Social says this is part of the appeal of TikTok grannies as they \"offer comfort in an uncertain world\".\nTheir wholesome content can also act as a \"virtual grandma\" for followers, she says.\nThat's certainly the case for Barbara Costello. The 77-year-old former teacher now shares videos about cooking, cleaning and homemaking skills on her Brunch with Babs accounts.\nHer followers tell her she reminds them of their own mothers and grandmothers, with some calling her \"the mom I never had\".\n\"Recently, a university student approached me in a restaurant to tell me my cookbook had helped her through her first year living independently and I was so happy.\"\nCostello works with brands but says she has to think carefully about if it's something she wants to put her name on.\nShe says the best part of being a creator is seeing former pupils at her book signings with their own children.\n\"It's a full circle moment. I really can't believe this is my life.\"\n- Published20 August",

    "id": "grid-operator-says-lights-will-stay-on-t-18870235",
    "title": "Grid operator says lights will stay on this winter after concerns",
    "titleJa": "Grid operator says lights will stay on this winter after concerns",
    "summaryJa": "The assurance from the National Energy System Operator comes amid concern from its engineers about their ability to ensure adequate supply.",
    "bodyOriginal": "Grid operator says lights will stay on this winter after concerns\n- Published\nThe body in charge of Britain's electricity network has given assurances that the lights will stay on this winter after concerns were raised by some of its engineers.\nThe National Energy System Operator (NESO) said the country's electricity system was prepared and \"resilient to the challenges it may face\" during the colder months.\nHowever, its winter outlook report comes after an independent investigation found engineers had \"high levels of stress and concern\" about their ability to ensure adequate supply due to differences between renewable and gas-fired power generation.\nNESO said supplies were expected to remain secure throughout the winter, though warned there could be \"tight days\".\nIt added that such days would result in it deploying notices to power producers that additional electricity generation may be needed. It said such an announcement was not a warning of power cuts and was routine.\n\"While we never take resilience for granted, households and businesses can be confident that Great Britain's electricity system remains secure, reliable and among the most resilient in the world,\" said Deborah Petterson, director of whole energy system resilience at NESO.\nIn a separate report, National Gas, a private company that owns and runs the country's gas network, and is separate from NESO, said it expected to have sufficient supply to meet demand this winter, but forecast gas for power generation to increase at peak demand due to the \"intermittent\" nature of renewables.\nSupply under scrutiny\nThe release of the two reports comes as Britain's energy generation and security falls under increasing scrutiny, given the wars in the Middle East and eastern Europe have pushed prices up and sparked supply fears.\nThe country's electricity is generated from a wide range of sources, including renewables such as solar and wind, as well as more traditional gas-fired and nuclear power stations.\nWind power was the largest generator of electricity in Britain last year, accounting for almost 30% of all power, marginally above gas.\nHowever, there appear to be challenges in the transition to renewables in ensuring supply keeps up with demand, according to findings from an investigation into practices at NESO, which was commissioned following allegations over operational decision making and record keeping at the grid operator.\n'High levels of stress'\nLaw firm Eversheds Sutherland, which carried out the independent investigation, said there were \"high levels of stress and concern\" within NESO's Electricity National Control Centre over the \"current state of the energy industry generally\" and the longer-term ability to keep it balanced.\nIt said this was, according to evidence gathered from staff, due to the fact that traditional methods of electricity generation such as gas were \"easier to manage\", compared to renewables, which were \"less flexible\", and were making the job of ensuring supply meets demand \"more difficult\".\nThe probe also found there to be a \"significant disconnect\" between those working in the control room and NESO's leadership.\nMultiple witnesses expressed the view that those in senior leadership and executive positions \"do not fully appreciate or understand either the way in which the control room works, or the reality of the pressures faced by those on the frontline who are responsible for 'keeping the lights on'\", Eversheds' report said.\nThe investigation was prompted after Conservative shadow energy secretary Clare Coutinho said in July she had been contacted by a whistle-blower alleging that NESO had been \"hiding information about how securely our grid is being run\".\nOne of the claims was that control room staff were encouraged to conceal or alter records to avoid leaving a paper trail linked to efforts to stabilise the grid during a period of extreme heat in June.\nThis was done in order for NESO, which is owned by the government, to avoid public scrutiny or reputational damage, according to the allegation.\nEversheds said its investigation did not substantiate any of the allegations from whistle-blowers but did identify \"cultural, governance and control issues\" that it said were \"significant findings in their own right\".\nFintan Slye, chief executive of NESO, said the investigation identified \"areas where we could improve how colleagues can raise concerns and how we respond to them\".\n\"I want all colleagues at NESO to feel heard. We will act on the recommendations, working closely with our trade unions, and be open with colleagues about the progress we make,\" he added.",
    "bodyJa": "Grid operator says lights will stay on this winter after concerns\n- Published\nThe body in charge of Britain's electricity network has given assurances that the lights will stay on this winter after concerns were raised by some of its engineers.\nThe National Energy System Operator (NESO) said the country's electricity system was prepared and \"resilient to the challenges it may face\" during the colder months.\nHowever, its winter outlook report comes after an independent investigation found engineers had \"high levels of stress and concern\" about their ability to ensure adequate supply due to differences between renewable and gas-fired power generation.\nNESO said supplies were expected to remain secure throughout the winter, though warned there could be \"tight days\".\nIt added that such days would result in it deploying notices to power producers that additional electricity generation may be needed. It said such an announcement was not a warning of power cuts and was routine.\n\"While we never take resilience for granted, households and businesses can be confident that Great Britain's electricity system remains secure, reliable and among the most resilient in the world,\" said Deborah Petterson, director of whole energy system resilience at NESO.\nIn a separate report, National Gas, a private company that owns and runs the country's gas network, and is separate from NESO, said it expected to have sufficient supply to meet demand this winter, but forecast gas for power generation to increase at peak demand due to the \"intermittent\" nature of renewables.\nSupply under scrutiny\nThe release of the two reports comes as Britain's energy generation and security falls under increasing scrutiny, given the wars in the Middle East and eastern Europe have pushed prices up and sparked supply fears.\nThe country's electricity is generated from a wide range of sources, including renewables such as solar and wind, as well as more traditional gas-fired and nuclear power stations.\nWind power was the largest generator of electricity in Britain last year, accounting for almost 30% of all power, marginally above gas.\nHowever, there appear to be challenges in the transition to renewables in ensuring supply keeps up with demand, according to findings from an investigation into practices at NESO, which was commissioned following allegations over operational decision making and record keeping at the grid operator.\n'High levels of stress'\nLaw firm Eversheds Sutherland, which carried out the independent investigation, said there were \"high levels of stress and concern\" within NESO's Electricity National Control Centre over the \"current state of the energy industry generally\" and the longer-term ability to keep it balanced.\nIt said this was, according to evidence gathered from staff, due to the fact that traditional methods of electricity generation such as gas were \"easier to manage\", compared to renewables, which were \"less flexible\", and were making the job of ensuring supply meets demand \"more difficult\".\nThe probe also found there to be a \"significant disconnect\" between those working in the control room and NESO's leadership.\nMultiple witnesses expressed the view that those in senior leadership and executive positions \"do not fully appreciate or understand either the way in which the control room works, or the reality of the pressures faced by those on the frontline who are responsible for 'keeping the lights on'\", Eversheds' report said.\nThe investigation was prompted after Conservative shadow energy secretary Clare Coutinho said in July she had been contacted by a whistle-blower alleging that NESO had been \"hiding information about how securely our grid is being run\".\nOne of the claims was that control room staff were encouraged to conceal or alter records to avoid leaving a paper trail linked to efforts to stabilise the grid during a period of extreme heat in June.\nThis was done in order for NESO, which is owned by the government, to avoid public scrutiny or reputational damage, according to the allegation.\nEversheds said its investigation did not substantiate any of the allegations from whistle-blowers but did identify \"cultural, governance and control issues\" that it said were \"significant findings in their own right\".\nFintan Slye, chief executive of NESO, said the investigation identified \"areas where we could improve how colleagues can raise concerns and how we respond to them\".\n\"I want all colleagues at NESO to feel heard. We will act on the recommendations, working closely with our trade unions, and be open with colleagues about the progress we make,\" he added.",

    "id": "l-oreal-says-weight-loss-drugs-are-impac-8ed74f2c",
    "title": "L'Oreal says weight loss drugs are impacting beauty and skin care sales",
    "titleJa": "L'Oreal says weight loss drugs are impacting beauty and skin care sales",
    "summaryJa": "The beauty giant's CEO says the use of GLP-1s is \"a very important phenomenon for us\".",
    "bodyOriginal": "L'Oreal says weight loss drugs are impacting beauty and skin care sales\n- Published\nBeauty giant L'Oreal says the rise of weight loss drugs has affected beauty and skin care sales, as it designs products to specifically target some side effects of rapid weight loss.\nThe company's head Nicolas Hieronimus said the beauty market was proving resilient in a challenging global context, and that the use of GLP-1s was \"a very important phenomenon for us\".\nHe told an investor call that the rise in their use was \"having an impact on beauty consumption and skin care consumption in particular\".\nL'Oreal, which owns other popular brands including Maybelline and La Roche-Posay, announced on Thursday that sales in the three months to September rose by 7.7%, above analyst expectations.\nThe use of GLP-1s has boomed in popularity in recent years, after drugs developed to treat diabetes such as Ozempic, Wegovy and Mounjaro were found to also lead to significant weight loss because they supress the appetite.\nWhile it is not caused by GLP-1 drugs directly, rapid weight loss can, for some people, come with a side effect of loose skin - including around the face.\nHieronimus said L'Oreal's brands SkinCeuticals and Kiehl's have products \"that have been designed to work alongside and complement GLP-1 and its side effects on skin sagging\" and other effects related to rapid weight loss.\nL'Oreal has also moved further into the clinical aesthetic space, increasing its stake in dermatology firm Galderma to 20% last December.\nBoth companies have been testing products on GLP-1 users worried about loose skin in separate clinical trials, according to Reuters.\nGalderma owns popular aesthetic products including Sculptra, an injectable aimed at stimulating collagen production, and Restylane, which is an injectable dermal filler.\nLast year the aesthetic firm released a report into the rise of GLP-1 use and related concerns about changes in facial appearance.\nIts own survey of weight loss medication users found the vast majority had noticed changes to their facial appearance after using those drugs.\nRelated topics\n- Published16 May",
    "bodyJa": "L'Oreal says weight loss drugs are impacting beauty and skin care sales\n- Published\nBeauty giant L'Oreal says the rise of weight loss drugs has affected beauty and skin care sales, as it designs products to specifically target some side effects of rapid weight loss.\nThe company's head Nicolas Hieronimus said the beauty market was proving resilient in a challenging global context, and that the use of GLP-1s was \"a very important phenomenon for us\".\nHe told an investor call that the rise in their use was \"having an impact on beauty consumption and skin care consumption in particular\".\nL'Oreal, which owns other popular brands including Maybelline and La Roche-Posay, announced on Thursday that sales in the three months to September rose by 7.7%, above analyst expectations.\nThe use of GLP-1s has boomed in popularity in recent years, after drugs developed to treat diabetes such as Ozempic, Wegovy and Mounjaro were found to also lead to significant weight loss because they supress the appetite.\nWhile it is not caused by GLP-1 drugs directly, rapid weight loss can, for some people, come with a side effect of loose skin - including around the face.\nHieronimus said L'Oreal's brands SkinCeuticals and Kiehl's have products \"that have been designed to work alongside and complement GLP-1 and its side effects on skin sagging\" and other effects related to rapid weight loss.\nL'Oreal has also moved further into the clinical aesthetic space, increasing its stake in dermatology firm Galderma to 20% last December.\nBoth companies have been testing products on GLP-1 users worried about loose skin in separate clinical trials, according to Reuters.\nGalderma owns popular aesthetic products including Sculptra, an injectable aimed at stimulating collagen production, and Restylane, which is an injectable dermal filler.\nLast year the aesthetic firm released a report into the rise of GLP-1 use and related concerns about changes in facial appearance.\nIts own surve     "title": "Trump asked Musk to lift Starlink slowdown, WSJ reports",
    "titleJa": "Trump asked Musk to lift Starlink slowdown, WSJ reports",
    "summaryJa": "Elon Musk, a critic of Ukrainian President Volodymyr Zelenskyy, had ordered the slowdown of SpaceX's Starlink, The Wall Street Journal previously reported.",
    "bodyOriginal": "President Donald Trump asked Elon Musk to ease restrictions he had imposed on the military-grade version of SpaceX's Starlink system in Ukraine, The Wall Street Journal reported Thursday, citing U.S. officials.\nThe Starshield system, which Ukraine depends on in its war against Russia, was \"working more normally Thursday, shortly after\" Trump spoke to Musk by phone, U.S. and Ukrainian officials told the Journal.\nTrump said later Thursday he did not \"want to comment one way or the other\" about whether he made the call to Musk.\n\"Whether I called or whether somebody else called, doesn't make any difference,\" Trump told reporters outside the White House as he departed for a campaign rally in Iowa.\n\"The bottom line, he put it back,\" Trump said of Musk.\nThe Journal reported Tuesday that Musk, the founder and CEO of SpaceX and a critic of Ukrainian President Volodymyr Zelenskyy, had ordered the Starlink slowdown.\nTwo unnamed sources in that report said Trump and Musk had discussed the decision to throttle Starlink \"soon after\" the change first became public last week, while one source said Musk had spoken to Trump prior to imposing the speed cap.\nTrump has repeatedly denied involvement in the decision and said he does not know if Musk was behind it.\n\"I don't know who did it, but I was not involved,\" Trump said Wednesday.\nThe Starlink controversy, which drew bipartisan concern and criticism from lawmakers, emerged as Trump has ramped up criticism of Zelenskyy for continuing to target Russian energy infrastructure. At the same time, Trump has pursued a deal to ease sanctions on Russia so it can supply some diesel on the global market.\nSen. John Cornyn, R-Texas, told CNBC's \"Squawk Box\" on Wednesday that he does not believe Musk would throttle Starlink without \"at least the acquiescence of the White House.\"\nSen. Richard Blumenthal, D-Conn., the ranking member of the Senate homeland security committee's investigations subcommittee, on Thursday launched an inquiry into how SpaceX's satellite tech was \"degraded for Ukraine without notice.\"\n\"This decision to limit critical technology for a key ally not only put Ukrainian forces at risk and their people in peril, but raises serious questions about who controls critical capabilities the U.S. government has spent billions of dollars to procure,\" Blumenthal said in letters to Musk and Defense Secretary Pete Hegseth.\nThe White House and an email associated with Musk did not immediately respond to CNBC's requests for comment on Thursday's report that Trump had asked Musk to lift the restrictions.",

hursday launched an inquiry into how SpaceX's satellite tech was \"degraded for Ukraine without notice.\"\n\"This decision to limit critical technology for a key ally not only put Ukrainian forces at risk and their people in peril, but raises serious questions about who controls critical capabilities the U.S. government has spent billions of dollars to procure,\" Blumenthal said in letters to Musk and Defense Secretary Pete Hegseth.\nThe White House and an email associated with Musk did not immediately respond to CNBC's requests for comment on Thursday's report that Trump had asked Musk to lift the restrictions.",

    "id": "meta-s-deal-to-keep-zuckerberg-in-califo-568ac15c",
    "title": "Meta’s deal to keep Zuckerberg in California adds fuel to wealth tax debate ahead of election",
    "titleJa": "Meta’s deal to keep Zuckerberg in California adds fuel to wealth tax debate ahead of election",
    "summaryJa": "With less than two weeks before the midterm elections, Meta made clear that Mark Zuckerberg is staying in California if the wealth tax passes.",
    "bodyOriginal": "In case there were any doubts, Mark Zuckerberg is staying in California.\nMeta was apparently concerned enough that its founder and CEO might depart its home state that the company put in place a new stock plan that could help offset the burden of higher taxes should a billionaires tax, known as Proposition 40, pass on Election Day on Nov. 3.\nThe disclosure came in a filing on Wednesday that coincided with Meta's third-quarter earnings report, and represents a first among California's megacap tech companies. Zuckerberg, the sixth-richest person in the world, is one of the few among his peers to still reside in the state, along with Nvidia CEO Jensen Huang.\nElon Musk and Michael Dell live in Texas, while Amazon founder Jeff Bezos' primary residence has always been elsewhere. Google co-founders Larry Page and Sergey Brin moved out of California ahead of the election and bought luxury homes in Florida, the same state that Oracle founder Larry Ellison officially calls home.\nProp. 40 would impose a 5% tax on Californians worth over $1 billion. Zuckerberg's net worth is currently about $225 billion.\n\"If the California wealth tax is enacted and Mr. Zuckerberg becomes liable for a tax payment, Mr. Zuckerberg would effectively be paying to serve as the Company's chief executive officer while residing in California,\" the filing said, noting the CEO's \"salary of only $1 each year.\"\nMeta said in the filing that Zuckerberg committed to remaining in California for eight years, \"unless there are material unforeseen circumstances that would render it prudent or advisable for Mr. Zuckerberg to reside elsewhere.\"\nThe company created a new class of non-voting Class C common stock to take effect in January. Zuckerberg will essentially be granted a portion of the new stock via a dividend. He will be able to \"immediately sell or transfer up to 20%\" of the shares he's granted \"for any reason, including so that he may pay his potential tax liability under California Proposition 40, if enacted into law, without affecting his majority voting control,\" the filing said.\nThe tech industry, by and large, has been unified in its objection to the ballot measure.\nIn addition to the Google co-founders, a number of big-name techies have put spending into opposing Prop. 40. They include former Google CEO Eric Schmidt, Stripe CEO Patrick Collison, venture investor Peter Thiel and DoorDash CEO Tony Xu, according to various media reports based on campaign filings.\nCollison and Xu are members of Meta's board of directors while Thiel left the company's board in 2022, having served since 2005.\nBrin told The New York Times in April he fled the Soviet Union with his family in 1979, and said \"I don't want California to end up in the same place.\"\nHuang, however, recently told CBS Sunday Morning that it would be a \"privilege\" to pay the tax. Huang is just behind Zuckerberg in Forbes' billionaire ranking, with a net worth of $185 billion.\nAlthough Prop. 40 advocates, including Sen. Bernie Sanders, I-Vt., have been urging voters to pass the ballot measure, recent polling has suggested that it may fail to garner the majority support required to make it law. A recent Citrin-Politico poll showed 46% are in favor of the measure compared to 43% who oppose it.\nMeta, with the help of a special committee, views Zuckerberg as key to the company's future and its efforts to become a major player in artificial intelligence, according to the filing. In particular, the company said it doesn't want to jeopardize Zuckerberg's close working arrangement with the Meta Superintelligence Labs, which is led by AI chief Alexandr Wang.\n\"The Special Committee believes that Mr. Zuckerberg's talent and leadership have been crucial to our growth, strategy, and stability since our inception, and the Special Committee wants that to continue,\" the filing said.\nAlthough Meta considered the possibility of issuing Class A common stock to help raise funds, the filing noted that Zuckerberg made clear \"that he would not support a significant equity financing that would have the effect of reducing his voting power in the Company.\"\nDoing so will help Meta receive \"critical equity capital without impacting Mr. Zuckerberg's voting power and the unique and creative vision and exceptional management abilities which helped to deliver the long-term value as noted above,\" the filing said.\nWATCH: 'Fast Money' traders react to Meta's Q3 results as stock climbs in extended trading.",

ing noted that Zuckerberg made clear \"that he would not support a significant equity financing that would have the effect of reducing his voting power in the Company.\"\nDoing so will help Meta receive \"critical equity capital without impacting Mr. Zuckerberg's voting power and the unique and creative vision and exceptional management abilities which helped to deliver the long-term value as noted above,\" the filing said.\nWATCH: 'Fast Money' traders react to Meta's Q3 results as stock climbs in extended trading.",

    "title": "OpenAI nears up to $30 billion funding round at $1.25 trillion valuation led by UAE investors",
    "titleJa": "OpenAI nears up to $30 billion funding round at $1.25 trillion valuation led by UAE investors",
    "summaryJa": "OpenAI is close to finalizing a new funding round that is meant to be a bridge to its 2027 IPO, sources familiar with the matter tell CNBC.",
    "bodyOriginal": "OpenAI is closing in on a funding round that could value the artificial intelligence giant at more than $1 trillion ahead of a potential initial public offering.\nThe San Francisco-based AI company is raising up to $30 billion at a $1.25 trillion valuation, according to people familiar with the deal, who asked not to be named because the details were confidential. That valuation does not include new capital raised.\nInvestors from the United Arab Emirates are leading the round alongside Coatue, according to the people. The financing is being positioned as an \"opportunistic\" bridge ahead of a potential IPO.\nOpenAI kickstarted discussions for a new funding round after investors approached the company with proposals in September, as CNBC previously reported. OpenAI told investors on Thursday that it is aiming to secure signatures by the end of next week, but the final size of the round is still being determined, the people said.\nAlongside the new investment, OpenAI is negotiating a commercial deal that would secure more computing capacity from the UAE, according to one person. OpenAI told investors in February that it's targeting roughly $600 billion in total compute spend by 2030.\nThe company confidentially filed its prospectus with the Securities and Exchange Commission in June, but it has not disclosed exactly when it plans to debut.\nOpenAI CFO Sarah Friar told employees in August that the AI lab \"will be a public company in 2027.\" The following month, CEO Sam Altman said that \"right now would be an ill-advised moment to go public.\"\nAnthropic, OpenAI's chief rival, is also gearing up for what is widely expected to be a massive IPO. The company confidentially filed its prospectus with regulators in June and is actively engaging in meetings with prospective investors, as CNBC previously reported.\nThe company is reportedly seeking a valuation between $1.5 trillion and $2 trillion in its offering. In May, Anthropic closed a $65 billion funding round at a $965 billion valuation.",
    "bodyJa": "OpenAI is closing in on a funding round that could value the artificial intelligence giant at more than $1 trillion ahead of a potential initial public offering.\nThe San Francisco-based AI company is raising up to $30 billion at a $1.25 trillion valuation, according to people familiar with the deal, who asked not to be named because the details were confidential. That valuation does not include new capital raised.\nInvestors from the United Arab Emirates are leading the round alongside Coatue, according to the people. The financing is being positioned as an \"opportunistic\" bridge ahead of a potential IPO.\nOpenAI kickstarted discussions for a new funding round after investors approached the company with proposals in September, as CNBC previously reported. OpenAI told investors on Thursday that it is aiming to secure signatures by the end of next week, but the final size of the round is still being determined, the people said.\nAlongside the new investment, OpenAI is negotiating a commercial deal that would secure more computing capacity from the UAE, according to one person. OpenAI told investors in February that it's targeting roughly $600 billion in total compute spend by 2030.\nThe company confidentially filed its prospectus with the Securities and Exchange Commission in June, but it has not disclosed exactly when it plans to debut.\nOpenAI CFO Sarah Friar told employees in August that the AI lab \"will be a public company in 2027.\" The following month, CEO Sam Altman said that \"right now would be an ill-advised moment to go public.\"\nAnthropic, OpenAI's chief rival, is also gearing up for what is widely expected to be a massive IPO. The company confidentially filed its prospectus with regulators in June and is actively engaging in meetings with prospective investors, as CNBC previously reported.\nThe company is reportedly seeking a valuation between $1.5 trillion and $2 trillion in its offering. In May, Anthropic closed a $65 billion funding round at a $965 billion valuation.",
