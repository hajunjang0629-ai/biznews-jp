  {
    "id": "borrowers-expecting-mortgage-rates-to-dr-025ae087",
    "title": "Borrowers expecting mortgage rates to drop have hopes dashed",
    "titleJa": "住宅ローン金利の低下を期待していた借り手の期待は打ち砕かれた",
    "summaryJa": "住宅ローン金利の低下を期待していた借り手の期待は打ち砕かれた- 公開されました",
    "bodyOriginal": "Borrowers expecting mortgage rates to drop have hopes dashed\n- Published\nNearly all the major mortgage lenders in the UK have announced increases in the cost of home loans in recent days.\nAnalysts are uncertain over whether there are more to come, but are urging people who need to find a new deal to act now.\nSomeone whose five-year deal is coming to an end faces paying more than £5,000 more a year on their next deal under a typical rate, if they borrow the same amount of money.\nMany lenders allow people to lock in a new deal six months before their current one comes to an end, with an opportunity to switch if the costs come down before it kicks in.\n\"Borrowers expecting mortgage rates to drop in the coming weeks have had their hopes dashed,\" said Rachel Springall, from financial information service Moneyfacts.\n\"It is still essential borrowers do not delay seeking advice to navigate the mortgage maze.\"\nFor borrowers, the interest rate on a fixed mortgage does not change until it expires, usually after two or five years, and a new one is chosen to replace it. The vast majority of homeowners and buyers have this kind of mortgage.\nSince the Iran war began, global economic uncertainty has pushed up the cost of deals.\nSpeaking to MPs on the Treasury Committee, Bank of England governor Andrew Bailey said UK borrowers had seen the biggest rise in mortgage rates, apart from Japan, since the conflict started than in other countries in the G7 group of major economic powers.\nSomeone on a typical two-year deal, and borrowing £250,000 is likely to pay £120 more a month in mortgage repayments than they would have had they secured the deal at the start of March when the US-Israeli strikes began, according to Moneyfacts.\nMore recently, UK government borrowing costs have been rising, which has a knock-on impact on mortgage rates.\nThat pressure has been maintained in the latest sale of debt by the UK on Tuesday. A 30-year bond issued by the UK was sold with a yield - or interest rate - of 5.82%, the highest since 1998.\nThe situation has resulted in several major lenders raising their rates in the last few days.\n\"The difficult bit is knowing whether this is the end or just the first round of increases,\" said David Hollingworth, from broker L&C.\nAaron Strutt, of broker Trinity Financial, said: \"Hopefully this will be the end of the rate rises for a while, but there are certainly no guarantees.\n\"Multiple small mortgage price rises add up and ultimately deter people from buying homes.\"\nPotential buyers and borrowers are being urged to seek advice and plan early.\nLatest data from the Bank of England, external shows that more buyers are taking loans with smaller deposits, leaving them more exposed to rate changes.\nThe proportion of mortgages where the loan is more than 90% of the value of the home has reached its highest level in 18 years.\nThe latest moves on mortgage rates will be a further blow to those who are coming off much cheaper five-year deals.\nHowever, rates are still some way short of their peaks of recent years, and how much people can borrow, and at what rate, depends considerably on their circumstances.\nMoneyfacts said that, as of Tuesday, the average rate on a new, two-year deal was 5.65%. On a five-year product, the average was 5.70%.\nGet in touch\nAre you looking to remortgage in the coming months?\nRelated topics\n- Published1 day ago",
    "bodyJa": "住宅ローン金利の低下を期待していた借り手の期待は打ち砕かれた\n- 公開されました\n英国のほぼすべての主要な住宅ローン貸し手は、ここ数日で住宅ローンコストの値上げを発表した。\nアナリストらは、今後さらなる取引があるかどうかについては不透明だが、新たな取引を見つける必要がある人々には今すぐ行動を起こすよう呼び掛けている。\n5年契約が終了に近づいている人は、同じ金額を借りた場合、通常の金利で次の契約で年間5,000ポンド以上多く支払うことになる。\n多くの金融機関は、現在の契約が終了する6か月前に新しい契約を固定することを許可しており、契約が開始される前にコストが下がった場合には切り替える機会が与えられます。\n金融情報サービス、マネーファクトのレイチェル・スプリングオール氏は「住宅ローン金利が今後数週間で低下すると予想していた借り手は、その期待を打ち砕かれた」と述べた。\n「住宅ローンの迷路を乗り越えるためには、借り手が遅滞なくアドバイスを求めることが依然として重要である。」\n借り手にとって、固定住宅ローンの金利は、通常 2 年または 5 年後の期限が切れ、代わりに新しい住宅ローンが選択されるまで変わりません。住宅所有者と購入者の大多数はこの種の住宅ローンを組んでいます。\nイラン戦争が始まって以来、世界経済の不確実性により取引コストが上昇している。\nイングランド銀行のアンドリュー・ベイリー総裁は財務委員会の議員らに対し、紛争が始まって以来、日本を除けば英国の借り手は主要経済大国のG7グループの他の国々よりも住宅ローン金利の最大の上昇を経験していると述べた。\nMoneyfactsによると、典型的な2年契約で25万ポンドを借りている人は、米国とイスラエルのストライキが始まった3月初めに契約を結んでいた場合よりも、月に120ポンド多く住宅ローン返済を支払うことになる可能性が高いという。\n最近では英国政府の借入コストが上昇しており、住宅ローン金利に波及的な影響を及ぼしている。\nこの圧力は、火曜日に行われた英国による最新の国債売却でも維持された。英国が発行した３０年債は利回り（金利）５．８２％で売却され、１９９８年以来の高水準となった。\nこの状況を受けて、いくつかの大手金融機関がここ数日で金利を引き上げた。\nブローカーＬ＆Ｃのデビッド・ホリングワース氏は「難しいのは、これが終わりなのか、それとも単なる第１弾の値上げなのかを知ることだ」と述べた。\n証券会社トリニティ・ファイナンシャルのアーロン・ストラット氏は、「これで利上げがしばらく終息することを願うが、確かに保証はない。\n「住宅ローン価格の小規模な値上がりが複数重なり、最終的には人々の住宅購入を思いとどまらせることになる。」\n潜在的な買い手と借り手は、早めにアドバイスを求め、計画を立てることが求められています。\nイングランド銀行の最新外部データは、より多くの買い手が少額の預金でローンを利用しており、金利変動の影響をより受けていることを示しています。\nローンが住宅価格の90％を超える住宅ローンの割合は、18年間で最高水準に達した。\n住宅ローン金利に関する最近の動きは、はるかに安い5年契約を結んでいる人々にとってはさらなる打撃となるだろう。\nしかし、金利は近年のピークにはまだ程遠く、人々がどれくらいの金額を、どのような金利で借りられるかは、その人の状況によって大きく異なります。\nマネーファクトによると、火曜日の時点で、新規２年契約の平均金利は５．６５％だった。 5 年間の製品では、平均は 5.70% でした。\n連絡する\n今後数か月以内に住宅ローンの借り換えを検討していますか?\n関連トピック\n- 1 日前に公開",

    "bodyOriginal": "A version of this article first appeared in the CNBC Property Play newsletter with Diana Olick. Property Play covers new and evolving opportunities for the real estate investor, from individuals to venture capitalists, private equity funds, family offices, institutional investors and large public companies. Sign up to receive future editions, straight to your inbox.\nPrices in the for-sale housing market are showing no signs of cooling off, causing more renters to stay on the buying sidelines. And as rents start to heat back up, too, more tenants are relocating to cheaper markets.\nBuffalo, New York; Chicago; and Houston are seeing the biggest growth in out-of-town searches on Zillow, followed by New Orleans and Dallas, according to the real estate listing site. Among markets that have already seen significant in-migration, like Salt Lake City; Raleigh, North Carolina; Hartford, Connecticut; and Nashville, Tennessee; out-of-town searches now outnumber local searches, Zillow found.\nRental demand is typically a leading indicator of home sales.\n\"Renting is often how people try out a new community before committing. When we see a market with a growing share of rental searches coming from outside the metro, that tips us off to a developing pipeline,\" said Mischa Fisher, chief economist at Zillow, in a release. \"A year-over-year surge in out-of-town browsing in places like Buffalo and Chicago tells us a wave of newcomers may not be far behind.\"\nThe markets seeing the biggest renter interest also have lower home prices. The national median price of an existing home sold in July was $434,100, according to the National Association of Realtors.\nBuffalo, Chicago and Houston all have lower median prices, according to Realtor.com.\nRents had been easing over the past few years due to increased supply in most markets, but they are now back on the rise. August rents turned positive month to month for the first time in four years, according to Apartment List, but they were still slightly lower than August 2025.\nWhile most out-of-town rental searches on Zillow come from neighboring states, the one exception is New York City. Renters there continue to look for listings in the Sunbelt, making up large shares of views in Raleigh and in the Florida cities of Miami, Orlando and Tampa, according to Zillow.\n\"When we see strong out-of-town interest flowing into a smaller market, it's often an affordability story. So renters in pricier places are choosing or discovering that they can get a lot more for their money somewhere new,\" said Fisher. \"When the flow goes the other direction, into a major metro, it's frequently regional pull, people drawn to a big city's job market or opportunities from nearby.\"\nDespite huge migration to the South during and after the pandemic, these markets remain more affordable than the East and West coasts, so the flow continues. Both lifestyle and affordability are playing into the decision.\nIn fact, 37 of the top 50 cities listed in RentCafe's \"Best Cities for Renters\" are in the South. The top three cities are McKinney, Texas; Huntsville, Alabama; and Austin, Texas. This ranking factors in cost of living, renter income growth and employment growth, among other things.",
    "bodyJa": "この記事のバージョンは、ダイアナ・オリックとともに CNBC Property Play ニュースレターに初めて掲載されました。 Property Play は、個人からベンチャー キャピタリスト、プライベート エクイティ ファンド、ファミリー オフィス、機関投資家、大規模な上場企業に至るまで、不動産投資家にとって新しく進化する機会をカバーしています。サインアップすると、将来のエディションを直接受信箱に受け取ることができます。\n分譲住宅市場の価格は低迷する兆しが見えず、購入を控える賃貸人が増えている。そして、家賃も再び上昇し始めており、より多くのテナントがより安価な市場に移転している。\nニューヨーク州バッファロー。シカゴ;不動産掲載サイトによると、Zillowでの市外検索数が最も伸びているのはヒューストンで、次いでニューオーリンズとダラスだという。ソルトレイクシティのようにすでに大幅な人口流入が見られる市場では。ノースカロライナ州ローリー。コネチカット州ハートフォード。そしてテネシー州ナッシュビル。 Zillowによると、市外の検索数が地元の検索数を上回っていることが判明した。\n賃貸需要は通常、住宅販売の先行指標となります。\nZillowの首席エコノミスト、ミーシャ・フィッシャー氏はリリースで「賃貸は、人々が契約する前に新しいコミュニティを試してみる方法であることが多い。地下鉄以外からの賃貸検索の割合が増加している市場を見ると、パイプラインが発展していることを示唆している」とリリースで述べた。 「バッファローやシカゴなどの市外での閲覧数が前年比で急増していることから、新規参入者の波が遠くない可能性があることがわかります。」\n賃貸人の関心が最も高い市場では、住宅価格も下がっています。全米不動産業者協会によると、7月に販売された中古住宅の全国価格中央値は43万4100ドルだった。\nRealtor.comによると、バッファロー、シカゴ、ヒューストンはいずれも中央値が低いという。\nほとんどの市場での供給の増加により、賃料はここ数年低下傾向にありましたが、現在は再び上昇傾向にあります。アパートメントリストによると、8月の賃料は4年ぶりに前月比プラスに転じたが、それでも2025年8月よりはわずかに低かった。\nZillow での市外の賃貸検索のほとんどは近隣の州からのものですが、唯一の例外はニューヨーク市です。 Zillowによると、当地の賃貸人は引き続きサンベルト地区の物件を探しており、ローリーやフロリダ州のマイアミ、オーランド、タンパの都市で閲覧数の大きなシェアを占めているという。\n「市外からの強い関心が小規模市場に流入しているのを見ると、それはしばしば手頃な価格の話である。そのため、より高価な場所の賃貸人は、新しい場所でより多くのお金が得られることを選択または発見している」とフィッシャー氏は述べた。 「流れが反対方向、つまり大都市圏に向かうとき、それは多くの場合、地域の吸引力であり、人々は大都市の雇用市場や近くの機会に引き寄せられます。」\nパンデミック中およびパンデミック後に南部への大規模な移住にもかかわらず、これらの市場は依然として東海岸や西海岸よりも手頃な価格であるため、その流れは続いています。ライフスタイルと手頃な価格の両方が決定に影響します。\n実際、RentCafe の「賃貸人に最適な都市」の上位 50 都市のうち 37 都市が南部にあります。上位 3 都市はテキサス州マッキーニーです。アラバマ州ハンツビル。そしてテキサス州オースティン。このランキングは、とりわけ生活費、賃貸収入の伸び、雇用の伸びなどを考慮しています。",

    "bodyOriginal": "AstraZeneca on Tuesday released full results from two successful late-stage trials on its experimental drug for chronic obstructive pulmonary disease, boosting hopes that it could generate multibillion-dollar sales for the company.\nThe biologic medicine, tozorakimab, is under priority review by the Food and Drug Administration, with U.S. approval expected in the first quarter of 2027. The drug, administered once every four weeks, helped reduce flare-ups in a broad range of people with the condition.\n\"We truly believe that a large population of COPD patients can benefit from this new medicine,\" Ruud Dobber, president of AstraZeneca's biopharmaceuticals business unit, said in an interview.\nThe treatment reduced moderate and severe COPD flare-ups in the primary population of former smokers by 29% and 34%, respectively, compared with a placebo on top of the current inhaled standard of care. The drug also reduced moderate and severe flare-ups in a larger overall population of current and former smokers by 30% and 29%, respectively, compared with the placebo group.\nThe detailed data reinforces hopes that the product could be a breakthrough treatment for COPD, a progressive lung disease that blocks airflow and makes breathing difficult. An estimated 16 million to 26 million Americans, both diagnosed and undiagnosed, have COPD, and the condition is the fifth-leading cause of death in the U.S., according to AstraZeneca.\nAstraZeneca recently raised its peak annual sales forecast for the drug to more than $5 billion, which could help the company reach its overall $80 billion revenue target by 2030. In an interview with CNBC, CEO Pascal Soriot said the drug has the opportunity to capture a broad group of patients.\n\"We believe it can be more than 5 billion, simply because the unmet need is huge,\" Soriot said. \"Patients are underdiagnosed; they need to be better diagnosed, and biologics in this class are totally underused. Maybe 10% of patients receive a biologic. Asthma is 30% to 40% depending on the country. So you can imagine the growth potential is very, very large.\"\nThat optimistic outlook for the drug is driven by the fact that it could reach more patients than the currently available biologics for COPD – Dupixent and Nucala – which are limited to those with high levels of white blood cells called eosinophils.\nRegeneron and Sanofi's Dupixent is one of the world's top-selling medications, and GSK's Nucala joined the COPD market last year.\n\"There's still a huge number of patients who are not candidates for biologics with the current two approved drugs,\" said Dr. Meilan Han, chief of the division of pulmonary and critical care at the University of Michigan Health and one of the investigators of the study.\nDobber added that AstraZeneca's drug could \"really change the treatment paradigm because of its broad utility.\"\nAstraZeneca's two trials on tozorakimab included both former and current smokers, and patients across all blood eosinophil counts and all stages of lung function severity.\nThere is currently no biologic COPD medicine available for patients with a blood eosinophil count of below 150, said Dobber. Major clinical guidelines say that patients with lower eosinophil counts, especially under 100 to 150, generally indicate a low likelihood of responding to inhaled therapies.\nIn an analysis, the drug reduced moderate and severe flare-ups by 23% in that subset of patients, 34% in people with a blood eosinophil count at or above 150 and 43% in those at or above 300.\nAstraZeneca's drug works by blocking a protein called IL-33 that drives inflammation and mucus production, two of the underlying disease drivers of COPD. Several companies have pursued IL-33 treatments with limited success, leading some investors and researchers to question its potential.\n\"Tozorakimab is a product nobody thought would work. We ourselves had a very low probability of success,\" Soriot said on the company's second-quarter earnings call. \"Everybody thought it would fail. If you look at the consensus before we announced the results, the consensus had almost zero in its forecast, and it actually worked.\"\nBut the company believes its medicine succeeds where previous IL-33 drugs fell short because it targets the inflammatory protein in a different way. While earlier approaches largely focused on blocking one pathway linked to inflammation, AstraZeneca says its antibody is designed to inhibit two distinct IL-33 pathways, potentially addressing not only inflammation but also mucus production and airway damage that contribute to COPD.\nAstraZeneca believes that broader approach may explain why the drug reduced exacerbations of the disease in a wide range of patients after years of setbacks for similar medicines.\nFrom the prescriber perspective, Han said she will likely start patients with low eosinophil levels on the company's drug.\nBut she said questions remain about where to use AstraZeneca's drug relative to existing biologics for COPD patients with high eosinophil levels. She said because no head-to-head studies have compared AstraZeneca's treatment to other biologics, doctors will likely still be evaluating whether the product should be used before or after currently available therapies in those patients after it enters the market.\nShe said she wants to see additional subgroup analyses to help make those decisions.\n\"I'm very excited about the data, but I am pushing them that I would like to see additional subgroup cuts of the data to understand how my patients might most benefit, so I can make the most informed decision possible,\" she said. \"I think it is a huge open question right now, both how providers are going to handle it, as well as how the GOLD committee will ultimately handle it.\"\nHan was referring to the Global Initiative for Chronic Obstructive Lung Disease Science Committee, which develops and updates international guidelines for diagnosing, managing and preventing COPD.\nDobber said the drug is currently under regulatory review for the treatment of COPD in major markets, including the European Union and China. It is also being studied in a Phase 2 trial in severe asthma and Phase 3 study in severe viral lower respiratory tract disease.\n\"I truly believe that this can become one of the largest products in history in respiratory,\" for AstraZeneca, he said.\nDobber also pointed to growing concerns about air pollution and wildfire smoke as factors that can damage the lungs and increase the risk of COPD and disease flare-ups. While smoking remains a leading cause of the disease, he said environmental exposures are an important trigger that is often overlooked.\n\"Not everyone has a smoking history,\" Dobber said, noting that tiny particles from sources such as wildfire smoke can irritate the lungs, which he called a \"very sensitive organ.\"\nHe said he hopes the attention around the new data will help raise awareness of COPD as a serious disease and spur broader efforts to reduce the factors that contribute to it.",
    "bodyJa": "アストラゼネカは火曜日、慢性閉塞性肺疾患の治験薬に関する2つの成功した後期試験の完全な結果を発表し、同社に数十億ドルの売上を生み出す可能性があるとの期待が高まった。\n生物学的製剤であるトゾラキマブは食品医薬品局による優先審査中であり、米国での承認は2027年第1四半期に予定されている。この薬は4週間に1回投与され、この症状を患う幅広い人々の再燃を軽減するのに役立った。\nアストラゼネカのバイオ医薬品事業部門の社長、ルート・ドバー氏はインタビューで、「多くのCOPD患者がこの新薬の恩恵を受けられると心から信じている」と語った。\nこの治療法は、現在の吸入標準治療に加えてプラセボを投与した場合と比較して、元喫煙者の主要集団における中等度および重度のCOPDの再燃をそれぞれ29%および34%減少させた。この薬はまた、プラセボ群と比較して、現在および元喫煙者のより大きな集団全体における中等度および重度の再発をそれぞれ30%および29%減少させた。\n詳細なデータは、この製品が気流を遮断して呼吸困難を引き起こす進行性の肺疾患であるCOPDの画期的な治療法となる可能性があるという期待を裏付けるものである。アストラゼネカによると、診断されている人も診断されていない人も含めて推定1,600万人から2,600万人のアメリカ人がCOPDを患っており、この疾患は米国の死因の第5位となっている。\nアストラゼネカは最近、この薬のピーク時の年間売上高予測を50億ドル以上に引き上げ、これにより同社は2030年までに全体の収益目標である800億ドルを達成できる可能性がある。最高経営責任者（CEO）のパスカル・ソリオ氏はCNBCとのインタビューで、この薬には幅広い患者グループを獲得する機会があると語った。\n「満たされていないニーズが非常に大きいという理由だけで、その額は50億を超える可能性があると考えています」とソリオ氏は語った。 「患者の診断は過小評価されており、より適切な診断が必要であり、このクラスの生物学的製剤はまったく使用されていません。おそらく患者の 10% が生物学的製剤を受けています。喘息は国によって異なりますが 30% から 40% です。したがって、成長の可能性が非常に大きいことが想像できます。」\nこの薬に対する楽観的な見通しは、好酸球と呼ばれる白血球のレベルが高い患者に限定されている現在利用可能なCOPD用生物学的製剤であるデュピクセントとヌーカラよりも多くの患者にこの薬が投与できる可能性があるという事実によってもたらされている。\nRegeneronとSanofiのDupixentは世界で最も売れている医薬品の1つであり、GSKのNucalaは昨年COPD市場に参入した。\nミシガン保健大学の呼吸器・救命救急部門の責任者であり、この研究の研究者の一人であるメイラン・ハン博士は、「現在承認されている2つの薬剤の生物学的製剤の候補ではない患者が依然として膨大な数に存在する」と述べた。\nドバー氏は、アストラゼネカの薬は「幅広い用途があるため、治療パラダイムを大きく変える可能性がある」と付け加えた。\nアストラゼネカのトゾラキマブに関する2件の試験には、元喫煙者と現在の喫煙者の両方、そしてすべての血中好酸球数と肺機能の重症度のすべての段階の患者が参加した。\n現在、血中好酸球数が150未満の患者に利用できる生物学的COPD薬はない、とドバー氏は述べた。主要な臨床ガイドラインでは、好酸球数が低い患者、特に 100 ～ 150 未満の患者は、一般に吸入療法に反応する可能性が低いことを示していると述べています。\n分析によると、この薬は、その一部の患者では中等度および重度の再燃を23％、血中好酸球数が150以上の人々では34％、300以上の人々では43％減少させた。\nアストラゼネカの薬は、COPDの根本的な疾患要因の2つである炎症と粘液生成を促進するIL-33と呼ばれるタンパク質をブロックすることによって作用する。いくつかの企業がIL-33治療法を追求しましたが、成功は限られており、一部の投資家や研究者はその可能性に疑問を抱いています。\n「トゾラキマブは誰も効果があるとは考えていなかった製品だ。われわれ自身も成功の可能性は非常に低かった」とソリオ氏は同社の第２四半期決算会見で述べた。 「誰もが失敗すると思っていた。決算発表前のコンセンサスを見てみると、コンセンサスの予想はほぼゼロだったが、実際はうまくいった。」\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "id": "argentina-to-file-criminal-case-against-8c1f9de7",
    "title": "Argentina to file criminal case against oil company operating in Falklands",
    "titleJa": "アルゼンチン、フォークランドで操業する石油会社を刑事告訴へ",
    "summaryJa": "アルゼンチン、フォークランドで操業する石油会社を刑事告訴へ- 公開されました",
    "bodyOriginal": "Argentina to file criminal case against oil company operating in Falklands\n- Published\nThe Argentine government has said that it will file criminal charges against oil company Navitas Petroleum for operating in seas off the Falkland Islands.\nThe move came just days after Argentine President Javier Milei said he would sanction oil companies drilling in the British overseas territory in the south-west Atlantic Ocean.\nReacting to the news, Foreign Office Minister Kirsty McNeill insisted that there could be \"no doubt\" about the British government's commitment to the Falkland Islanders.\nSovereignty of the archipelago remains disputed between the UK and Argentina more than 40 years after a British military task force ejected Argentine forces which had invaded the territory in 1982.\nSpeaking in the House of Commons on Tuesday, McNeill said that \"the decision by the Falkland Islands government to pursue hydrocarbon production is a commercial decision for them to take alongside the commercial companies involved\".\nShe added that \"the future of the Falkland Islands is for Falkland Islanders to determine\".\nThe simmering dispute between Britain and Argentina over the Falklands heated up last week, when Milei said in a speech to the nation that the \"winds of change\" favoured Argentina's claim to the islands.\nMilei has, in the past, been criticised by Argentine veterans of the 1982 conflict for being \"too soft\" on the Falklands, which Argentines call Las Malvinas.\nIn his speech on Thursday evening local time, Milei restated his government's position on the territory, saying \"the Malvinas are Argentine, historically and legally... there's no debate about that.\"\nThe president described drilling for oil in the archipelago as a \"clear and urgent danger\" to Argentine sovereignty.\nHe also dismissed the result of a 2013 referendum in which 99.8% of the islands' residents voted in favour of the Falklands remaining a British oversees territory.\nMilei argued that they were living on land which had been \"usurped\" by the British and therefore \"have no legitimate right to self-determination\".\nThe British government dismissed Milei's speech and stressed that its position on the Falklands was \"unwavering\".\nHopes that Milei's primetime speech may have been a blip and that he would return to his previous stance of strengthening diplomatic ties with the UK were crushed on Monday, however, when his office announced it would file criminal charges against Navitas Petroleum, several of its subsidiaries and their executives.\nNavitas, which is listed in Tel Aviv, holds a 65% stake in Sea Lion, an offshore oil project set to start production in the North Falkland Basin in 2028.\nThe Sea Lion oilfield, around 130 miles (209 km) from the Falkland Islands, contains an estimated 1.7 billion barrels of oil.\nIn Monday's statement, Milei alleged that drilling in the area would violate Argentine law banning resource exploitation without approval from the Argentine authorities.\n\"The state will continue to pursue actions deemed necessary to counter any act which breaches the sovereign rights of the Argentine Republic,\" the statement insisted.\nNavitas has not yet responded to this latest statement but said last week that Milei's remarks were \"not expected to have a material effect on the development activities of the Sea Lion Project, including the timetable for completion of the Project's development\".\nRockhopper, which owns a partial stake in the Sea Lion project, has also not yet commented on Milei's statement.\nBoth companies have in the past stressed that Sea Lion holds valid licences from the Falkland Islands.\nRelated topics\n- Published3 days ago",
    "bodyJa": "アルゼンチン、フォークランドで操業する石油会社を刑事告訴へ\n- 公開されました\nアルゼンチン政府は、フォークランド諸島沖で操業している石油会社ナビタス・ペトロリアムを刑事告発すると発表した。\nこの動きは、アルゼンチンのハビエル・ミレイ大統領が、大西洋南西部の英国の海外領土で掘削を行っている石油会社を制裁すると発表した数日後に行われた。\nこのニュースを受けて、カースティ・マクニール外務大臣は、英国政府のフォークランド諸島住民に対する取り組みに「疑いの余地はない」と主張した。\nこの諸島の主権は、1982年にこの領土に侵入したアルゼンチン軍を英国軍事機動部隊が排除してから40年以上経った今でも英国とアルゼンチンの間で係争が続いている。\nマクニール氏は火曜日に下院で演説し、「炭化水素の生産を追求するというフォークランド諸島政府の決定は、関係する営利企業とともに彼らがとるべき商業的決定である」と述べた。\n彼女は「フォークランド諸島の将来はフォークランド諸島民が決めることだ」と付け加えた。\nフォークランド諸島をめぐって英国とアルゼンチンの間でくすぶっていた論争は先週、ミレイ氏が国民向けの演説で「変化の風」がアルゼンチンのフォークランド諸島に対する領有権を支持していると述べ、さらに激化した。\nミレイさんは過去に、アルゼンチン人がラス・マルビナスと呼ぶフォークランド諸島に対して「甘すぎる」と1982年の紛争のアルゼンチン退役軍人らから批判されてきた。\n現地時間木曜夜の演説でミレイ氏は、「マルビナス家は歴史的にも法的にもアルゼンチン人である…それについては議論の余地はない」と述べ、この領土に関する政府の立場を改めて述べた。\n大統領は、列島での石油掘削はアルゼンチンの主権に対する「明白かつ差し迫った危険」であると述べた。\n同氏はまた、島民の99.8％がフォークランド諸島が英国の管轄区域に残ることに賛成票を投じた2013年の住民投票の結果を否定した。\nミレイさんは、自分たちはイギリス人に「強奪」された土地に住んでおり、したがって「正当な民族自決権はない」と主張した。\n英国政府はミレイ氏の演説を却下し、フォークランド諸島に対する英国の立場は「揺るぎない」と強調した。\nミレイ氏のゴールデンタイムのスピーチは失敗だったのではないか、英国との外交関係を強化するという以前の姿勢に戻るのではないかという期待は月曜日に打ち砕かれた。しかし月曜日、同氏の事務所がナビタス・ペトロリアムとその子会社数社、およびその幹部らを刑事告発すると発表した。\nテルアビブに上場しているナビタスは、2028年に北フォークランド盆地で生産開始予定の海洋石油プロジェクトであるシーライオンの株式の65％を保有している。\nフォークランド諸島から約 130 マイル (209 km) の場所にあるシーライオン油田には、推定 17 億バレルの石油が埋蔵されています。\nミレイ氏は月曜の声明で、この地域での掘削はアルゼンチン当局の承認なしで資源開発を禁止するアルゼンチンの法律に違反すると主張した。\n「国家はアルゼンチン共和国の主権を侵害するあらゆる行為に対抗するために必要と思われる行動を追求し続ける」と声明は主張した。\nナビタス社はこの最新の声明に対してまだ返答していないが、先週、ミレイ氏の発言は「プロジェクトの開発完了までのスケジュールを含め、アシカ・プロジェクトの開発活動に重大な影響を与えることは予想されない」と述べた。\nアシカプロジェクトの株式の一部を所有するロックホッパーも、ミレイの声明についてはまだコメントしていない。\n両社は過去に、シーライオンがフォークランド諸島からの有効なライセンスを保有していると強調していた。\n関連トピック\n- 3 日前に公開",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "UK's third-biggest taxpayer to leave for Greece\n- Published\nA hedge-fund billionaire and one of the UK's richest taxpayers has decided to leave the UK for Greece, the BBC understands.\nChris Rokos plans to open an office in Athens, according to reports. Greece has generous tax rules for wealthy foreigners earning overseas income.\nRokos was ranked third in The Sunday Times list of Britain's top taxpayers, having paid £330m last year, and in March said he would donate £190m to Cambridge University.\nRokos's representatives declined to comment. A government spokesperson said: \"The UK remains an attractive destination for talent and investment\".\n\"The chancellor has made wealth creation one of his top priorities,\" the spokesperson said, adding that the UK has \"a competitive and stable tax system, deep capital markets, world-class universities and a highly skilled workforce\".\nIt is not publicly known why Rokos has made the decision, which was first reported by Bloomberg, but Greece's tax-rules are seen as attractive to the ultra-wealthy.\nThey allow foreigners who meet certain criteria to pay a flat yearly tax of €100,000 (£86,000) on all overseas income.\nBritish billionaire to donate £190m to Cambridge University\n- Published31 March\nDan Neidle, the founder of the think tank Tax Policy Associates, told the BBC's Today programme that the £330m in tax revenue the UK could lose was \"quite a lot of money\".\n\"It is enough to fund 4,500 teachers... we have entire taxes that raise less than £330m.\"\n\"He will probably pay almost nothing in Greece, and we can't compete with that,\" he added.\nDespite the potential loss, Neidle said there are \"no easy answers and no good statistics\" on the issue of ultra-wealthy taxpayers leaving the UK.\nHe said the Treasury has some estimates on the number of wealthy people leaving, but otherwise there are few facts about the true scale of the revenue loss.\n\"We have lots of anecdotes... what we don't really have is data,\" he said.\nHe said the government needed to \"give certainty\" to ultra-wealthy people living in the UK, arguing that lots of changes to the non-dom regime in a short space of time and reports of a possible wealth tax don't help.\n\"Stop rumours, stop tinkering,\" he said.\nRokos's decision comes ahead of UK Chancellor John Healey's first Budget on 28 October.\nIn an interview with the BBC on Monday, Healey did not rule out tax increases in the Budget, with a recent increase in government borrowing costs piling pressure on the public finances.\nHe refused to comment on any decisions about tax, promising only to \"balance the books\" and \"control public spending\".\nIn March, Cambridge University said the money from Rokos would be \"the largest single donation made to a British university in modern times\".\nIt will be used to create a school of government in Cambridge named after him with the aim of training leaders of the future. It is set to open this autumn.\nDespite his generosity to Cambridge, Rokos is an Oxford graduate, having studied mathematics at Pembroke College.\nHe attended a state primary school before winning a scholarship to Eton College.",

    "bodyOriginal": "'Tirana teeth': Albania hopes to be the new Turkey for dental work\n- Published\nAnthony Hook is sitting in a dentist's chair, grinning toothily into a handheld mirror. He has been asked to pose for photos showing off his new smile – and he is only too happy to oblige.\nThe 58-year-old window cleaner from Bolton, in Greater Manchester, is the proud owner of a sparkling new set of \"Tirana teeth\".\nThat is not a brand name – at least, not yet. But it would be a fitting slogan as Albania moves decisively into the medical tourism business.\nTirana, its capital city, is the focus of operations. And once you spot the first tooth, you start seeing them everywhere. They seem to be all over the city centre.\nRest assured, these are not the physical remains from a night out that ended in a punch up. Rather, they are the kind of larger than life-size illuminated molar that – in these parts at least – advertise that a dental clinic is not too far away.\nIn Tirana's metropolitan area alone, there are almost four hundred dental clinics – and most of them are in the city centre. That's more than enough for a population of around 600,000 people.\nSo, it is not surprising that dozens of dentists are now targeting customers from further afield. They have set up websites and signage in English and Italian, as well as Albanian.\nDental implants in Albania are typically around €600 ($700; £516) per tooth, similar in price to what is charged in Turkey, which has long been the main overseas destination for people in western Europe who are seeking much cheaper dental work than they can get at home.\nThe same treatment in the UK, France or German can easily cost four times as much.\nFor Hook the appeal was irresistible. He made his first visit to Tirana to watch England's footballers play Albania last year – but then found himself intrigued by all the signs for dentists. That nudged him into doing something about his missing teeth.\nHe thought he's give Albania rather than Turkey, because he was concerned by media coverage of dental or hair transplant work in Turkey that had gone wrong.\nIn fact, even the UK Foreign Office warns that it is \"aware of seven British nationals having died in Turkey in 2025 following medical procedures\"., external It adds that \"some British nationals have also experienced complications [after surgery in Turkey], and needed further treatment or surgery following their procedure.\"\nHook says he wouldn't go to Turkey \"because I have heard so many bad things\", adding that he investigated thoroughly before taking the plunge in Tirana.\n\"I went onto the internet and looked into it properly. It took me two days to research it because I'm not one for jumping into anything.\"\nSeveral return trips later, Anthony now has a mouthful of impressive implants – and, unsurprisingly, he is all smiles. \"I'd come here once a month for a holiday if I could,\" he chuckles.\nElite Dental is one of the biggest clinics in Tirana. It is fully licensed by the Albanian health authorities – and so are all of its 15 resident dentists.\nThe man who runs the place, Ardtur Dema, says he is \"not in favour of damaging proper teeth for aesthetics\". Instead he says the priority is \"changing people's lives\" through restoring their ability to chew, and indeed – to smile.\nDema believes that as long as Albania remains outside the EU, prices for treatment are likely to remain low. At the same time, low-cost airlines have greatly expanded their flight network to and from Tirana, meaning that he is as likely to see a patient from Turin as he is from Tirana.\nBut Dema is concerned that the explosion of tourism could lead to less scrupulous operators ruining the business for everyone. He is a member of the newly-established Albanian Medical Tourism Association – but many others are not, at least not yet.\nAlbania's Prime Minister, Edi Rama, tells the BBC that the government is playing catch-up after five years that have seen overall international arrivals to Albania more than double. Some sort of official seal of approval for medical tourism facilities is a possibility – but the government has yet to sort out the details.\n\"It's a new industry that is within the tourism industry umbrella that is showing a big potential and where there are very good people,\" says Rama.\nHe adds that the government wants to help all the reputable providers \"survive\", and to guard against any informal \"bad competition\".\nAlong with dental treatments, some visitors to Albania are starting to think \"hairline\" as well as \"coastline\".\nSome transplant clinics are employing Turkish specialists – others are actually branches of businesses based in Turkey.\nVatanmed, in Tirana, is one of the latter. Sales specialist and health consultant Ayşe Mina Kasemi describes the business as a \"global brand\", with 15 clinics across a number of countries. That scale, she suggests, makes it \"a safe place to trust\" for the international patients arriving for treatment.\nBesides that, Ayşe notes, Albania has its own appeal.\n\"When people decide to have a hair transplant operation here in Albania, they also want to have a holiday here, because Albania is a very beautiful place,\" she says, while adding a note of caution for hair transplant patients. \"For the first two or three days, they have to be careful – they are not allowed to be exposed to the sun.\"\nThat is not a factor that concerns Anthony Hook. He happily sports a shaven head – and has no intention of following his dental treatment with a radical rug rethink. So enjoying Albania's beaches and scenery was very much part of the attraction of getting his teeth fixed here.\n\"There's a lot to do in Tirana… there's a lot to do along the coast there, it's absolutely stunning,\" he says. \"I want to do it now before it gets too popular and it's ruined like everywhere else.\"\nWith his new teeth, enjoying Albania's cuisine will doubtless also be part of Anthony's programme. Apart from anything else, that smile is going to dazzle in the holiday snaps.\nRelated topics\n- Published5 days ago\n- Published6 August\n- Published27 August",
    "bodyJa": "「ティラナの歯」：アルバニアは歯科医療における新たなトルコになることを望んでいる\n- 公開されました\nアンソニー・フックは歯科医の椅子に座り、手鏡に向かって歯を見せてニヤニヤしている。彼は、新しい笑顔を見せる写真を撮るように頼まれましたが、喜んで応じるしかありません。\nグレーター・マンチェスターのボルトン在住の58歳の窓掃除夫は、輝く新しい「ティラナの歯」の誇り高き所有者だ。\nそれはブランド名ではありません - 少なくとも、まだではありません。しかし、アルバニアが医療観光事業に断固として参入する中、これはふさわしいスローガンとなるだろう。\n首都ティラナが活動の中心です。そして、最初の歯を見つけると、どこにでもその歯が見られるようになります。市内中心部のいたるところにあるようです。\n安心してください。これらは、殴られて終わった夜の外出の物理的な残骸ではありません。むしろ、実物大よりも大きい、照明付き大臼歯のようなもので、少なくともこれらの部分では、歯科医院がそれほど遠くないことを宣伝します。\nティラナの大都市圏だけでも約 400 の歯科医院があり、そのほとんどは市内中心部にあります。これは人口約60万人にとっては十分すぎる数字だ。\nしたがって、数十の歯科医が遠方からの顧客をターゲットにしていることは驚くべきことではありません。彼らはアルバニア語だけでなく、英語とイタリア語でもウェブサイトと看板を開設しました。\nアルバニアでの歯科インプラントの価格は通常、1本あたり約600ユーロ（700ドル、516ポンド）で、トルコでの価格と同程度である。トルコは、自宅で受けられるよりもはるかに安い歯科治療を求める西ヨーロッパの人々にとって、長い間主な海外旅行先となっている。\nイギリス、フランス、ドイツで同じ治療を受けると、軽く4倍の費用がかかることもあります。\nフックにとって、その魅力は抗いがたいものだった。彼は昨年、イングランド代表のサッカー選手のアルバニア戦を観戦するためにティラナを初めて訪れたが、その後、歯科医向けのあらゆる標識に興味をそそられたことに気づいた。それが彼に、欠けている歯を何とかするよう促した。\n彼は、トルコではなくアルバニアに寄付をしようと考えた。なぜなら、トルコでの歯科や植毛手術がうまくいかなかったというメディアの報道を懸念していたからだ。\n実際、英国外務省も「2025年にトルコで医療処置後に7人の英国人が死亡したことを認識している」と警告しており、さらに「英国人の中には（トルコでの手術後に）合併症を経験し、手術後にさらなる治療や手術が必要になった人もいる」と付け加えている。\nフックさんは「あまりにも悪いことを聞いているので」トルコには行かないと言い、ティラナに思い切って行く前に徹底的に調査したと付け加えた。\n「インターネットにアクセスして、きちんと調べました。私は何かに飛びつくタイプではないので、調べるのに 2 日かかりました。」\n数回の往復を経て、アンソニーさんは今、印象的なインプラントを一口食べています。そして、当然のことながら、彼は満面の笑みを浮かべています。 「できれば月に一度、休日にここに来たいですね」と彼は笑います。\nElite Dental はティラナ最大のクリニックの 1 つです。この病院はアルバニア保健当局から完全に認可を受けており、15 人の常駐歯科医全員も同様です。\nこの店を経営するアルトゥール・デマさんは、「美観のために正しい歯を傷つけることには賛成ではない」と語る。むしろ、噛む能力、そして実際に笑う能力を回復することによって「人々の生活を変える」ことが優先であると彼は言う。\nデマ氏は、アルバニアがEU域外に留まる限り、治療費は低水準にとどまる可能性が高いと考えている。同時に、格安航空会社はティラナ発着の航空便ネットワークを大幅に拡大したため、ティラナからの患者と同じくらいトリノからの患者を診察する可能性が高いことを意味する。\nしかしデマ氏は、観光業の爆発的な増加により、悪徳業者が全員のビジネスを台無しにする可能性があると懸念している。彼は新しく設立されたアルバニア医療観光協会の会員ですが、他の多くの人は少なくともまだ会員ではありません。\nアルバニアのエディ・ラマ首相はBBCに対し、アルバニアへの国際到着者数全体が2倍以上になった5年間を経て、政府は巻き返しを図っていると語った。医療ツーリズム施設に何らかの公的承認が与えられる可能性はあるが、政府はまだ詳細を把握していない。\n「これは観光産業の傘下にある新しい産業で、大きな可能性を示しており、非常に優秀な人材が揃っています」とラマ氏は言う。\n同氏は、政府はすべての評判の良いプロバイダーが「生き残れる」よう支援し、非公式の「悪質な競争」を防ぎたいと付け加えた。\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Canada's retaliatory tariffs on a swathe of U.S. goods took effect on Tuesday after trade talks collapsed last month, as relations between Washington and Ottawa continue to sour.\nThe duties range from 15% to 50% across hundreds of U.S. products worth a total $27.6 billion, including dairy, agricultural equipment, paper, household appliances and electronics. Canadian tariffs on U.S. steel, aluminum and iron products doubled to 50%, while furniture, motorbikes, clothing and some beauty products were among the goods hit with the highest rate.\nCanada called the move a \"dollar for dollar\" response to U.S. levies on its own goods, which have been targeted by Section 338 tariffs. Its Department of Finance said it would protect Canadian workers, producers and manufacturers by allowing them to better compete with U.S. products sold in the domestic market.\nExisting Canadian counter-tariffs against the U.S., including 25% on the politically sensitive autos sector, remain in place.\nTrade talks between the longstanding allies fell apart at the end of August, with officials on each side blaming one another for the failure to reach a deal and publicly disagreeing over which areas they could not find compromise.\nU.S. President Donald Trump on Monday called for a boycott of Canadian airplane manufacturer Bombardier, posting on Truth Social: \"NO MORE SELLING BOMBARDIER IN THE UNITED STATES!\"\nThe U.S. exported $333.6 billion worth of goods to Canada, and imported $381.9 billion from its northern neighbor. The pair share trade in many of the same sectors, including energy, vehicles, heavy machinery, aircraft, pharmaceuticals, gems and jewelry, furniture, clothing and a host of foods and drinks.\nEconomists say that while the impacted goods are a relatively small portion of overall trade, small- to medium-sized businesses and those in the most-impacted sectors face a severe blow.\nOttawa announced a $7.5 billion support package for businesses and workers last month, extending an existing $25 billion it provided in response to the U.S. global tariff offensive, which began in April 2025.",

    "id": "scammers-demand-ransoms-from-instagram-u-8d6aabf3",
    "title": "Scammers demand ransoms from Instagram users over fake copyright claims",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Scammers demand ransoms from Instagram users over fake copyright claims\n- Published\nInstagram creators say they have lost thousands of pounds after their accounts were suspended or taken down due to fake copyright claims.\nExtorters have filed bogus claims to the Meta-owned social media platform, then asked for ransoms to withdraw them - knowing repeated claims can lead to account bans.\nOne Instagram user, who has 1.5 million followers, told the BBC he paid a scammer $50 (£37) to get his account back, claiming Meta's appeal process would take weeks, which had previously cost him thousands in lost income.\n\"We understand this can be frustrating for those impacted, and our systems are designed to protect people from this happening in the first place,\" a Meta spokesperson said.\n\"Following our review, we have restored the affected content and added additional protections to safeguard accounts against further attempts of this kind.\"\nHowever, content creators the BBC has spoken to say Meta is poor at identifying obviously spurious cases, and say its appeals process is slow to respond unless you pay a monthly fee.\n'Obviously fake'\nThe Lost in Time History Instagram account posts historical pictures to its more than 1.5 million followers.\nIts creator Olly, who did not share his last name, told the BBC he posts pictures in the public domain or where he has permission from the rights holder.\nYet he has received dozens of \"obviously fake\" copyright complaints so far in 2026.\nMeta does not check the authenticity of complaints when they are made, so if someone is hit repeatedly, their account can be temporarily taken down.\nOlly says he often gets struck for multiple posts at a time, all from the same email address.\nHe then gets contacted by the person asking to go on to the private messaging app Telegram.\n\"They'll demand a certain amount of money,\" he said - usually amounting to a few hundred dollars - to withdraw the claim.\nThe BBC has seen messages from the claimants where they demand money or threaten future copyright strikes.\nAllow Instagram content?\nThis article contains content provided by Instagram. We ask for your permission before anything is loaded, as they may be using cookies and other technologies. You may want to read Meta’s Instagram cookie policy, external and privacy policy, external before accepting. To view this content choose ‘accept and continue’.\nOlly ultimately agreed to pay an extorter $50 in cryptocurrency to restore his account, which had been temporarily taken down by Instagram.\nLaw enforcement organisations tell extortion victims not to pay ransoms as it fuels the criminal ecosystem.\nOlly said he paid as a \"last resort\" because it was quicker than going through Meta, which could take weeks.\nBut he was hit by more copyright strikes immediately after he paid.\n\"That's the worst part,\" he said.\n\"Having to pay the person who's actively put you through all of that anguish only for it to happen straight away again.\"\nAs a result of the number of times he has been hit by copyright claims, Olly's account was demonetised, meaning he could not earn money from Instagram for high-performing posts.\n\"There's no investigation into abuse, or system detection [from Meta] that it could be abuse,\" he said.\nOther Instagram users have shared similar experiences.\n\"Meta was not helpful throughout the entire process, forcing you to pay for support to talk, even as they claim to be here for the creator,\" said Abin Tom Sebastian, who is behind the Morbid Kuriosity account.\nMeta charges a £9.99 monthly fee to be Verified on Instagram, which gives users 24/7 access to support via a live chat.\n\"I lost irrecoverable and crucial, brand contracts that unfortunately moved ahead with another creator, and no reassurance or support from Meta saying this will not happen again,\" Sebastian said.\nInstagram says, external only copyright holders, or an authorised representative, can report copyright infringement, and it advises affected users to contacted rights holders directly.\nAfter the BBC contacted Meta with examples from Olly and other account holders, Meta said it had applied additional protections to their accounts, which it said would prevent similar issues happening in the future.\nIt said it fought against deceptive behaviour to scam or defraud people and businesses.\nGetting in touch with the extortionists\nThe BBC has spoken to three people who file copyright strikes against Instagram users, despite not being the copyright holders.\nAll three appear to be based in India, or in countries nearby.\nThey deny they are holding accounts to ransom - instead saying they file legitimate claims on behalf of copyright holders.\nBut the BBC has seen messages from one where they ask for $900 (£668) to withdraw a strike.\nThey claimed this was their payment for the service, and confirmed they kept all the money.\nTwo others denied they made any money at all.\nOne said they are sent accounts to target and investigate the claim.\n\"If I find that they are using someone else's content, I issue copyright strikes for the benefit of everyone,\" they said.\nThe other said they are sent accounts or posts via an account holder or another representative.\nLegitimate agencies do exist which are paid to file copyright strikes on behalf of clients.\nBut Olly - who has dealt with these before when he has mistakenly posted copyrighted material - says they are usually easy to deal with, and \"you can easily tell the difference\".\n\"They're established companies with millions of followers, so it's very different,\" he said.\nRecent increase\nThese kinds of copyright scams are not new, with a version of the crime dating back to the early days of the internet, said Andres Guadamuz, reader in intellectual property law of the University of Sussex and an expert on digital copyright.\nPreviously, they were emails or letters sent to website owners claiming they owned the copyright to photos used online, and asking for money to avoid legal action.\nSimilar strikes have been used against YouTube users too.\nBut the recent increase in this method may be because AI has made it easier to do this on a larger scale.\n\"It's a numbers game,\" Guadamuz told the BBC.\n\"Pretty much anyone can now deploy [AI] that is going to automate all of this in some way,\" he said.\nIt is also harder for the platforms - with billions of users - to police the racket, and distinguish the real copyright claims from the fake ones.\n\"The system was almost built with the assumption that the person that was making a copyright strike claim was legitimate,\" he said.\nGet in touch\nHave you been affected by the issues raised in this story? Let us know\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n- Published15 August 2025\n- Published2 March 2023",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Novartis' failure in a closely watched cardiovascular trial has raised questions about one of the pharmaceutical industry's biggest drug races and rival treatments from U.S. heavyweights Amgen and Eli Lilly.\nThe pelacarsen drug, developed jointly with Ionis Pharmaceuticals, reduced a particularly harmful form of cholesterol in a late-stage clinical trial, but failed to significantly improve cardiovascular outcomes, Novartis said after the bell on Friday. The stock fell 3% on Monday.\nIt is the first major clinical setback in the race to develop treatments that lower Lp(a), which elevates cardiovascular risks that are estimated to affect roughly one in five people worldwide and for which there is currently no approved targeted treatment.\nAlthough Amgen and Lilly are testing different technologies that have been shown to produce deeper reductions in the cholesterol called Lp(a), analysts say pelacarsen's failure raises the risk around a market that market watchers expect to be worth billions of dollars.\n\"The Lp(a) hypothesis is weakened, but not disproven,\" Citi analysts said in a research note, noting that details remain scarce beyond the topline miss, including the magnitude by which pelacarsen lowered Lp(a) levels.\nMore data is needed to determine whether the miss reflects pelacarsen's mechanism, trial design, or a challenge to the whole hypothesis that lowering Lp(a) can reduce heart attacks and strokes, they added.\nNovartis said full results would be presented at an upcoming medical congress. The company's chief medical officer, Shreeram Aradhye, said they \"provide important evidence that advances scientific understanding of the relationship between Lp(a) lowering and cardiovascular outcomes and may help inform future approaches to cardiovascular risk management.\"\nLp(a), short for lipoprotein(a), was discovered in 1963 and can contribute to the buildup of plaque in arteries and blood clotting. Nearly 50 years after its discovery, researchers found that people with elevated Lp(a) levels faced more than twice the risk of a heart attack.\nA person's Lp(a) levels are determined almost entirely by genetics and, unlike LDL cholesterol, are largely unaffected by lifestyle changes such as diet and exercise.\nNovartis emphasized that the more than 8,000 patients in the trial were already on optimized care, while Jefferies analysts said in a Sunday note that improving standards of care are reducing cardiovascular events, potentially making it harder and more costly for experimental drugs to prove an added benefit in clinical trials.\nNovartis failure raises stakes for Amgen and Eli Lilly\nAnalysts had modelled peak annual sales of around $4 billion to $5 billion for pelacarsen if it proved successful.\nThis would boost Novartis as it faces what CEO Vas Narasimhan has called the steepest patent cliff in its history. Its bestselling heart drug Entresto lost key patent exclusivities, and more of its blockbuster products will also soon face generic competition.\nBut the trial update's impact went beyond the company. Shares of Amgen fell about 5% in extended trading on Friday and Ionis Pharmaceutical sank 10%.\n\"The first dedicated outcomes failure lowers confidence across the class and places greater pressure on later studies to demonstrate that deeper lowering can produce a clinically meaningful ~15% [major adverse cardiovascular events] reduction,\" the Citi analysts said in their Friday note.\nAmgen's competing drug, olpasiran, faces the clearest readthrough, while Lilly's medicine, lepodisiran, is being trialled on a broader group of patients, including some who have not yet developed established cardiovascular disease, potentially limiting the direct read-through from Novartis' failure, they said. Lepodisiran is also less material to Lilly's overall valuation, they added.\nMany investors had already viewed the trial as risky and expected only a moderate benefit, which could explain why the Novartis stock reaction was relatively contained, falling only 3% in extended trading on Friday.\n\"The market was expecting a moderate benefit, if not transformational blue-sky result,\" Barclays said.\n\"NOVN had noted even a 13% benefit would have been statistically significant in the overall population, and reading between the lines of the release, [pelacarsen] appears to have fallen materially short of this threshold.\"\nNovartis didn't immediately respond to a request for details on the magnitude of Lp(a) lowering or cardiovascular risk reduction observed in the trial.\nU.S.-listed shares of Netherlands-based NewAmsterdam Pharma, which is also developing a treatment to reduce cardiovascular events by lowering Lp(a), fell 12% in extended trading on Friday.\nCan other Lp(a) drugs still succeed?\nBecause other experimental drugs use different approaches to lower Lp(a), some may be able to reduce it more than pelacarsen did. That could give drugmakers a reason to keep developing Lp(a) treatments, particularly for patients who start with very high levels, according to William Blair analysts.\nThey said they saw \"meaningful risk to a potential future\" in Lp(a)-driven trials for cardiovascular diseases in light of Novartis' results.",

    "bodyOriginal": "Canada braces for prolonged trade war as counter-tariffs on US take effect\n- Published\nCanada's retaliatory tariffs on a range of US goods came into effect on Tuesday, with no sign of a trade deal on the horizon.\nThe counter-tariffs will apply to nearly C$28bn ($20bn; £15bn) worth of American products, from steel to furniture to cotton T-shirts, and will be as high as 50%.\nFresh fish and lobster were also on the list, but Canada later omitted them after pushback from its seafood industry - a sign of the tricky balance it has to strike as it retaliates against its largest trading partner.\nBoth US and Canadian officials have said they would like to strike a deal, but no movement has been made to resume talks after they collapsed in late August.\nSpeaking to reporters last week, Prime Minister Mark Carney said that Canada is still in search of a deal with the US that is \"durable\" and in the best interests of both countries.\n\"We're ready to sit down and strike that deal when the Americans are ready,\" Carney said.\nUS trade representative Jamieson Greer said on Thursday the ball is in Canada's court.\n\"We offered them the best deal, they looked at it square in the face and turned around,\" Greer said in an interview with Fox News, adding that there has been sparse communication with the Canadians since talks collapsed.\nIn a separate interview with Canadian broadcaster CBC, Greer cautioned against retaliation and suggested the US might hit back by banning the import of some Canadian products.\nPresident Donald Trump threatened on Monday to halt all US business with Canada-based airplane maker Bombardier unless it moved its manufacturing south.\nThe aerospace giant is one of the largest in the country, contributing over C$7bn to Canada's annual GDP in 2024, according to a report commissioned by accounting firm PwC.\nWhat tariffs will really cost Canadians and Americans\n- Published29 August\nThe US-Canada trade war in 5 charts\n- Published31 August\nTrump threatens to stop sale of Canadian Bombardier jets in US\n- Published10 hours ago\nTrump took aim at Canada in a series of other Truth Social posts over the weekend, including one that called Canada's exchange rate with the US \"unacceptable\".\nAnother post showed a map of North America - including Canada and Mexico - and Greenland all overlaid with the US flag.\nCanada and the US have the world's largest bilateral trading relationship valued at nearly $900bn in 2025.\nWith new US tariffs and Canadian counter-tariffs now in effect, businesses on both side are scrambling to deal with what comes next.\nThe US currently has in place a 25% tax on Canadian cars and trucks, as well as taxes on Canadian steel, aluminium and lumber. In late August, President Donald Trump imposed new 50% tariffs on other goods like dairy, alcohol, hockey sticks and perfume.\nCanada's counter-tariffs, which were described by Carney as \"dollar-for-dollar\", will from Tuesday be applied to hundreds of items coming in from the US.\nThey are in addition to existing retaliatory taxes Canada had placed on finished American cars and trucks that are non-compliant with a free trade agreement between Canada, the US and Mexico, known as the USMCA in the US and CUSMA in Canada.\nPolls suggest the majority of Canadians support, external their country imposing retaliatory tariffs on the US.\nBut economists warn that the latest counter-tariffs will raise prices for consumers, external on everyday goods like clothing, food and furniture.\nThe Canadian Chamber of Commerce has also urged the Carney government to take a surgical approach to retaliation.\n\"Businesses understand retaliation but don't want to see endless escalation,\" said the Chamber's CEO and President Candace Laing in a statement to the BBC on Friday, though she added that businesses \"are preparing for this trade dispute to last\".\nPushback from the fisheries industry was enough for Canada to alter its counter-tariffs by removing dozens of seafood items to avoid unintended consequences to its own economy.\nThe lobster industry in both Canada and the US are heavily dependent on the other, with American-caught lobster often sent north to be processed before it is shipped back to the US and sold.\nAhead of the latest tariffs, Canada's economy had shown signs of resliency. Its GDP grew 3.3% in the second quarter and it had gained 181,000 jobs from April to July.\nBut around 41,000 jobs were lost in August, a period that coincided with the new US tariffs on Canada and the collapse in trade talks.\nOne sector that saw a modest bump was manufacturing - a gain the Canadian government attributes to consumers and businesses buying more made-in-Canada products.\nCarney has said he wants to diversify Canada's trade away from the US.\nJuly figures show the share of US-bound Canadian exports dropped to 66% from an average of 75% before the trade war.",
    "bodyJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.\nしかし、8月には約4万1000人の雇用が失われ、この時期は米国による対カナダ関税の発動と貿易交渉の決裂と重なった。\nわずかな増加が見られたセクターの 1 つは製造業であり、カナダ政府は消費者と企業がより多くのカナダ製製品を購入したことによる増加であると考えています。\nカーニー氏はカナダの貿易を米国から離れて多角化したいと述べている。\n7月の統計によると、カナダの米国向け輸出に占める割合は、貿易戦争前の平均75％から66％に低下した。",

    "id": "global-markets-keep-shrugging-off-shocks-aec960da",
    "title": "Global markets keep shrugging off shocks. Here's what could break that streak, according to HSBC",
    "titleJa": "世界市場は衝撃をかわし続けています。 HSBCによると、この記録を打ち破る可能性があるものは次のとおりです",
    "summaryJa": "世界市場は近年、相次ぐ衝撃をかわしてきたが、HSBCは最終的にその連敗に終止符を打つ可能性のあるいくつかの進展を見ている。主なリスクとしては、法人税の引き上げ、民間部門の債務の新たな増加、株式と債券の関係の変化などが挙げられる。中銀による市場への支援が撤回されれば、その回復力が試される可能性があると中銀は月曜のメモで述べた。",
    "bodyOriginal": "Global markets have shrugged off a barrage of shocks in recent years, but HSBC sees several developments that could eventually end that streak.\nThe key risks include higher corporate taxes, a renewed rise in private-sector debt and a shift in the relationship between stocks and bonds. A withdrawal of perceived central-bank support for markets could also test that resilience, the bank said in a note Monday.\nWhile the \"removal of central bank puts\" could have an adverse impact, HSBC said, such a scenario is difficult to imagine, particularly in the U.S. where equities, wealth effects and financial conditions have become quite intertwined.\nGiven the outsized weight of the U.S. in global equities and credit, the greatest risks lie there, HSBC said. Higher corporate taxes that squeeze profitability could weigh on markets, while inflation falling close to or below target could restore the negative stock-bond correlation — rise in bond prices when stocks fall.\nThat, in turn, could encourage investors to reduce equity allocations and put pressure on valuations.\nA renewed rise in private-sector leverage could also make the economy and markets more vulnerable to shocks, although HSBC noted that it is at multi-decade lows.\nThe risks stand out because markets have proven remarkably resilient to bad news in recent years, from surging inflation and tariffs to geopolitical conflicts, the unwinding of carry trades and private-credit concerns.\n\"It seems as if risk assets continue to ignore every negative catalyst,\" HSBC strategists wrote.\nThe strategists described markets as \"Teflon,\" arguing that risk assets have remained remarkably resilient despite a long list of potential negative triggers over the past five years.\nDeutsche Bank has also questioned how long that endurance can last. The bank said in a report Monday that risk assets have remained \"consistently resilient\" despite rising real rates and mounting inflation pressures, helped by surprisingly strong global growth.\n\"The current equilibrium is unsustainable ... Risk assets like equities and credit are still strikingly complacent against the stagflationary shock that's increasingly being priced into rates markets,\" Deutsche Bank said.\nRates markets are still pricing only limited central-bank tightening despite mounting inflation pressures, while equities and credit are assuming higher yields will not materially damage growth, it said.\nBehind market's resilience\nOne key factor is the strength of corporate earnings and economic growth, particularly in the U.S., where consensus estimates have repeatedly underestimated earnings. That resilience has extended beyond technology and artificial intelligence, HSBC said, while U.S. corporate tax rates remain near multi-decade lows.\nAnother factor is the changing relationship between stocks and bonds. With government bonds no longer providing the same diversification against equity risk as they once did, investors have reduced bond allocations and shifted toward equities and shorter-term hedging strategies, helping support elevated equity valuations.\nA powerful wealth effect has also played a role. U.S. household wealth has risen significantly above its pre-Covid trend, with much of the increase concentrated among higher-income households. Cash and cash-equivalent holdings are also running well above their pre-financial-crisis trend.\nMeanwhile, central banks now have a much broader range of tools available to respond to market stress. HSBC noted that the Federal Reserve has close to 20 potential tools, facilities and backstops, while the European Central Bank has more than a dozen.\nLower energy intensity and relatively low private-sector leverage have also helped markets absorb shocks. Oil price spikes linked to conflicts in Ukraine and the Middle East have had less impact on developed-market economies than similar shocks might have in the 1970s and 1980s.",
    "bodyJa": "世界市場は近年、相次ぐ衝撃をかわしてきたが、HSBCは最終的にその連敗に終止符を打つ可能性のあるいくつかの進展を見ている。\n主なリスクとしては、法人税の引き上げ、民間部門の債務の新たな増加、株式と債券の関係の変化などが挙げられる。中銀による市場への支援が撤回されれば、その回復力が試される可能性があると中銀は月曜のメモで述べた。\nHSBCは、「中央銀行プットの廃止」が悪影響を与える可能性があるが、特に株式、資産効果、金融状況が非常に絡み合っている米国では、そのようなシナリオを想像するのは難しいと述べた。\nHSBCは、世界の株式と信用における米国の比重が非常に大きいことを考慮すると、最大のリスクはそこにあると述べた。収益性を圧迫する法人税の引き上げが市場の重しとなる可能性がある一方、インフレ率が目標付近または目標を下回ると、株式と債券の負の相関関係（株価が下落すると債券価格が上昇する）が回復する可能性がある。\nその結果、投資家が株式配分を減らし、バリュエーションに圧力をかける可能性がある。\nHSBCは民間セクターのレバレッジが数十年ぶりの低水準にあると指摘したが、民間セクターのレバレッジが再び上昇すれば、経済と市場がショックに対してさらに脆弱になる可能性がある。\n近年、インフレや関税の高騰から地政学的紛争、キャリートレードの巻き戻しや民間信用懸念に至るまで、悪いニュースに対して市場が驚くほど回復力があることが証明されているため、リスクが際立っている。\nHSBCのストラテジストらは「リスク資産はあらゆるマイナス要因を無視し続けているようだ」と述べた。\nストラテジストらは市場を「テフロン」と形容し、過去5年間、潜在的なマイナス要因が数多くあったにもかかわらず、リスク資産は驚くほど回復力を維持していると主張した。\nドイツ銀行も、その忍耐がいつまで続くのか疑問を抱いている。同銀行は月曜の報告書で、実質金利の上昇やインフレ圧力の高まりにもかかわらず、驚くほど力強い世界経済成長に支えられ、リスク資産は「一貫して回復力」を維持していると述べた。\nドイツ銀行は「現在の均衡は持続不可能だ…株式やクレジットなどのリスク資産は、金利市場にますます織り込まれているスタグフレーションショックに対して依然として驚くほど満足している」と述べた。\n同報告書は、インフレ圧力が高まっているにもかかわらず、金利市場は依然限定的な中銀引き締めのみを織り込んでいる一方、株式と信用は利回りの上昇が成長に重大なダメージを与えないと想定していると述べた。\n市場の回復力の背後にあるもの\n重要な要因の 1 つは、企業収益と経済成長の強さであり、特に米国では、コンセンサス予想が利益を繰り返し過小評価してきた。 HSBCは、米国の法人税率が数十年来の低水準に近い水準にある一方で、その回復力はテクノロジーや人工知能を超えて広がっていると述べた。\nもう一つの要因は、株式と債券の関係の変化です。国債ではかつてのように株式リスクを分散することができなくなったため、投資家は債券の配分を減らし、株式や短期のヘッジ戦略にシフトしており、これが株式評価の上昇を支えている。\n強力な資産効果も影響を及ぼしています。米国の家計資産は新型コロナウイルス感染症以前の傾向を大きく上回り、その増加の多くは高所得世帯に集中している。現金および現金同等物の保有額も金融危機前の傾向を大きく上回っています。\n一方、中央銀行は現在、市場のストレスに対応するために利用できるツールの幅が大幅に広がっています。 HSBCは、連邦準備制度が20近くの潜在的なツール、施設、バックストップを持っているのに対し、欧州中央銀行は十数を超えると指摘した。\nエネルギー集約度の低下と民間部門のレバレッジが比較的低いことも、市場のショックを吸収するのに役立っている。ウクライナと中東の紛争に関連した原油価格の高騰は、1970年代と1980年代に起きた同様のショックに比べて、先進国経済への影響は小さかった。",

    "titleJa": "NvidiaサプライヤーWistronの株価は、15億ドルの世界株式売却を発表後下落",
    "summaryJa": "台湾のウィストロン社の株価は火曜日、NVIDIAのサプライヤーが原材料の購入資金として世界規模で14億7000万ドルの預託証券の売り出し価格を設定したことを受けて、6％以上下落した。同社の提出書類によると、同社は月曜、世界の預託証券2,500万枚の価格を1枚当たり58.88ドルとし、これは新普通株2億5,000万株に相当すると発表した。各株の価格は新台湾ドル約186.24ドルで、ウィストロンの月曜終値197台湾ドルに比べて約5.5％割引だった。",
    "bodyOriginal": "Shares of Taiwan's Wistron Corporation fell more than 6% Tuesday after the Nvidia supplier priced a $1.47 billion global depositary receipt offering to fund raw material purchases.\nThe company said Monday that it priced 25 million global depositary receipts at $58.88 each, representing 250 million new common shares, according to a company filing. The shares were priced at about $186.24 new Taiwan dollars each, roughly a 5.5% discount to Wistron's Monday closing price of NT$197.\nThe new shares represent about 7.29% of Wistron's outstanding shares before the issuance. Wistron said the offering is expected to be issued on Thursday, with the proceeds earmarked for purchases of raw materials in foreign currencies.\nThe company's shares are up about 23% so far this year.\nThe fundraising comes as Wistron expands its AI server business, with the company approving additional capacity investments in Taiwan and the U.S. last month.\nWistron approved NT$10.5 billion in additional capital expenditure for facilities in Taiwan, as well as a combined $53 million for two U.S. subsidiaries to support future AI business expansion.\nIn July, Wistron opened its first U.S. manufacturing facility, a $700 million AI server plant in Fort Worth, Texas. The facility currently produces Nvidia's GB300 Grace Blackwell Ultra systems and is expected to expand production to its next-generation Vera Rubin platform.\nFor the second quarter, Wistron reported revenue of NT$895.4 billion and profit after tax of NT$14.8 billion.",
    "bodyJa": "台湾のウィストロン社の株価は火曜日、NVIDIAのサプライヤーが原材料の購入資金として世界規模で14億7000万ドルの預託証券の売り出し価格を設定したことを受けて、6％以上下落した。\n同社の提出書類によると、同社は月曜、世界の預託証券2,500万枚の価格を1枚当たり58.88ドルとし、これは新普通株2億5,000万株に相当すると発表した。各株の価格は新台湾ドル約186.24ドルで、ウィストロンの月曜終値197台湾ドルに比べて約5.5％割引だった。\n新株は発行前のウィストロンの発行済み株式の約７．２９％に相当する。ウィストロンは、この募集は木曜日に発行される予定で、その収益は外貨での原材料の購入に充てられると述べた。\n同社の株価は年初から約２３％上昇している。\nこの資金調達はウィストロンがAIサーバー事業を拡大する中で行われ、同社は先月台湾と米国での追加容量投資を承認した。\nWistron は、将来の AI ビジネス拡大を支援するために、台湾の施設への追加資本支出として 105 億台湾ドルと、米国子会社 2 社に対して合わせて 5,300 万ドルを承認しました。\n7月、Wistronはテキサス州フォートワースに米国初の製造施設、7億ドル規模のAIサーバー工場を開設した。この施設は現在、Nvidia の GB300 Grace Blackwell Ultra システムを生産しており、次世代 Vera Rubin プラットフォームまで生産を拡大する予定です。\n第 2 四半期について、Wistron は売上高 8,954 億台湾ドル、税引き後利益 148 億台湾ドルを報告しました。",
    "source": "CNBC",

    "id": "china-s-imports-in-august-miss-estimates-6b5ee037",
    "title": "China's imports in August miss estimates as exports pick up pace amid calls for rebalancing trade",
    "titleJa": "貿易バランスの再調整が求められる中で輸出がペースを速める中、8月の中国の輸入は予想を下回る",
    "summaryJa": "中国の貿易の伸びは8月に加速したが、輸入額は予想を下回ったが、これは世界第2位の経済大国が貿易バランスを調整する圧力の高まりに直面している中、内需が依然として低迷していることを示している。火曜日の公式税関統計によると、８月の輸出は米ドルベースで前年比２５％増加し、ロイターがまとめたアナリスト予想と一致し、前月の２３．９％増加から加速した。",
    "bodyOriginal": "China's trade growth picked up in August, though imports missed expectations, a sign that domestic demand remains tepid as the world's second-largest economy faces mounting pressure to rebalance trade.\nExports grew 25% in U.S. dollar terms in August from a year earlier, official customs data showed Tuesday, in line with Reuters-polled analysts' forecast, quickening from 23.9% increase the previous month.\nImports rose 28.2% last month, missing economists' estimates of 30% in a Reuters poll, but gathering momentum from 27.5% in July. As a result, China's trade surplus swelled to $119.09 billion from $112.5 billion in July.\nExports have become the primary growth driver for China's economy, as surging demand for high-tech components amid a global build-out of AI infrastructure has helped cushion the drag from geopolitical shocks, sluggish domestic demand and a slump in investment.\nPolicymakers set a target range of 4.5-5% for China's gross domestic product growth this year, but momentum has sputtered after a solid start to the year, with growth slowing to a more than three-year low of 4.3% in the second quarter.\nData released last month showed domestic demand and investment weakened further in July, while manufacturing activity contracted for a second straight month.\nNeo Wang, China strategist at Evercore ISI, expects growth to regain some momentum in the second half of this year, encouraged by the \"sense of urgency and determination in Beijing's recent policy communications,\" as well as stabilizing manufacturing activity in August.\nFiscal spending by the government has accelerated in recent weeks, helping arrest the decline in investment and restore stability, Wang said. Chinese government plans to fund a $54 billion capital injection into several state-owned banks and insurers, as Beijing seeks to bolster growth with constrained stimulus.\nThe offshore yuan barely moved after the data release on Tuesday, standing at 6.7099 per U.S. dollar. The Chinese currency has outperformed its Asian peers this year, strengthening 3.8% year to date against the greenback.\nThe breakout performance in China's exports has drawn scrutiny from Western trading partners, demanding that Beijing rebalance its trade and boost domestic demand.\nGroup of 20 finance ministers gathered in the U.S. earlier this month and issued a joint statement criticizing economies that rely heavily on exports, with China being the only dissenting member. Beijing pushed back on the trade complaints, calling them \"an excuse to pressure and restrict China.\"\nPeople's Bank of China Governor Pan Gongsheng said during a speech at the G20 summit that China has never actively pursued a trade surplus, nor has it depreciated the currency to gain trade competitiveness. He added that the country's market would remain open for foreign businesses.\nWashington's frustration over trade relations, however, is unlikely to derail the bilateral relationship ahead of a high-stakes visit by Chinese leader Xi Jinping to Washington D.C., scheduled later this month, Wang said, citing the U.S.' s narrowing deficit with China and its mounting trade disputes with other trading partners.\nEconomists see room for further monetary easing this year. Shan Guo, a partner at China-focused Hutong Research, expects one or two interest-rate cuts by year-end, with the pace tied to the Federal Reserve's policy moves, the Ministry of Finance bond issuance, and the yuan's pace of appreciation.\nThe more the yuan appreciates, the more room the PBOC has to cut interest rates, even if the Fed keeps hiking, Guo said.",
    "bodyJa": "中国の貿易の伸びは8月に加速したが、輸入額は予想を下回ったが、これは世界第2位の経済大国が貿易バランスを調整する圧力の高まりに直面している中、内需が依然として低迷していることを示している。\n火曜日の公式税関統計によると、８月の輸出は米ドルベースで前年比２５％増加し、ロイターがまとめたアナリスト予想と一致し、前月の２３．９％増加から加速した。\n先月の輸入は２８．２％増加し、ロイター調査によるエコノミスト予想の３０％には届かなかったが、７月の２７．５％から勢いを増した。この結果、中国の貿易黒字は７月の１１２５億ドルから１１９０億９０００万ドルに拡大した。\nAIインフラの世界的な構築を背景にハイテク部品の需要が急増し、地政学的ショックや内需の低迷、投資の低迷による足かせを和らげるのに役立っており、輸出が中国経済の主な成長原動力となっている。\n政策当局者らは今年の中国の国内総生産（ＧＤＰ）成長率の目標レンジを４．５─５％に設定しているが、今年は堅調なスタートを切ったものの勢いは失われ、第２・四半期には成長率が３年超ぶりの低水準となる４．３％に減速した。\n先月発表されたデータによると、7月は内需と投資がさらに弱まり、製造業活動は2カ月連続で縮小した。\nエバーコアISIの中国ストラテジスト、ネオ・ワン氏は、8月の製造業活動の安定化に加え、「中国政府の最近の政策コミュニケーションにおける緊迫感と決意」に後押しされて、今年下半期には成長がある程度勢いを取り戻すと予想している。\n王氏は、ここ数週間で政府の財政支出が加速し、投資の減少に歯止めをかけ、安定を回復するのに役立っていると述べた。中国政府は抑制された刺激策で成長を促進することを目指しており、複数の国有銀行や保険会社に540億ドルの資本注入を計画している。\n火曜日の統計発表後、オフショア人民元はほとんど動かず、１ドル＝６．７０９９元となった。中国通貨は今年、アジアの通貨をアウトパフォームし、ドルに対して年初から3.8％上昇した。\n中国の輸出の飛躍的な実績は西側貿易相手国からの厳しい視線を集めており、中国政府は貿易のバランスを再調整し内需を拡大するよう求めている。\n20カ国・地域（G20）財務相らは今月初めに米国に集まり、輸出に大きく依存している経済を批判する共同声明を発表し、反対メンバーは中国だけだった。中国政府は貿易上の苦情を「中国に圧力をかけ、制限する口実」だと言って反発した。\n中国人民銀行の潘公生総裁はＧ２０サミットでの演説で、中国はこれまで積極的に貿易黒字を追求したことはなく、貿易競争力を高めるために通貨安を追求したこともないと述べた。同氏は、同国の市場は引き続き外国企業に開かれていると付け加えた。\nしかし、中国の指導者習近平氏による今月下旬に予定されている一か八かのワシントンD.C.訪問を前に、通商関係に対する米国の不満が二国間関係を狂わせる可能性は低いと王氏は米国の発言を引用して述べた。中国との赤字縮小と他の貿易相手国との貿易摩擦の激化。\nエコノミストは今年さらなる金融緩和の余地があるとみている。中国を専門とする胡同リサーチのパートナー、シャン・グオ氏は、連邦準備制度理事会の政策動向、財務省の債券発行、人民元の上昇ペースに連動して、年末までに１～２回の利下げが行われると予想している。\n郭氏は、人民元が上昇すればするほど、たとえFRBが利上げを続けたとしても、人民銀が利下げする余地は大きくなると述べた。",

    "id": "iran-foreign-ministry-takes-aim-at-canad-d9bae7b8",
    "title": "Iran foreign ministry takes aim at Canada for support of U.S. actions in Strait of Hormuz",
    "titleJa": "イラン外務省、ホルムズ海峡での米国の行動支援でカナダに狙いを定める",
    "summaryJa": "イランはホルムズ海峡での米国の行動を支持しているカナダを非難し、オタワの動きは「戦略的混乱と脅迫への服従の表れ」だとした。テヘラン外務省報道官エスマイル・バガイ氏はＸへの投稿で、カナダは「米国大統領がカナダの主権と独立をあからさまに軽蔑し、カナダ全体を米国の一部であるかのように描いたまさにその日に」米国を「宥める」ことを選択したと述べた。",
    "bodyOriginal": "Iran hit out at Canada for supporting U.S. actions in the Strait of Hormuz, calling Ottawa's moves \"a display of strategic confusion and submission to intimidation.\"\nIn a post on X, Tehran's Foreign Ministry spokesperson Esmaeil Baghaei said that Canada chose to \"appease\" the U.S. \"on the very day the U.S. president, in blatant contempt for Canada's sovereignty and independence, portrayed the entire country as part of the United States.\"\nBaghaei was referring to a post by U.S. President Donald Trump on Monday stateside, which showed the U.S.' territory covering Canada, Greenland and Iceland.\nIn his second term, Trump has repeatedly made comments about making Canada the 51st state of the U.S. and annexing Greenland, which is a semi-autonomous territory of Denmark.\nBaghaei's comments came after Canada condemned Iran’s \"destabilizing actions\" in the Middle East, saying that it would work with partners to maintain significant pressure on Iran, including via sanctions and support for efforts to reopen the Strait of Hormuz that were led by the U.S., France and the U.K.\n\"Canada cannot credibly present itself as a champion of 'peace and security,' 'freedom of navigation,' and 'international law' while simultaneously backing U.S. military aggression and Washington's illegal, interventionist actions in our region,\" Baghaei said.\n\"This is neither 'diplomacy' nor 'responsible statecraft'. It is... a choice that will not even shield Canada itself from American bullying and aggression,\" Baghaei said.\nHe questioned why Ottawa would choose to support Washington after experiencing what he called \"American bad faith and knowing that U.S. signatures are 'written in pencil.'\"\nTrade talks between Ottawa and Washington collapsed last month, with Prime Minister Mark Carney saying that the U.S. demands had gone too far. \"They asked too much and offered too little,\" he said.\nThis triggered tariffs on about $20 billion of Canadian goods, with Canada also imposing \"dollar-for-dollar\" retaliatory tariffs that will take effect at 12.01 a.m. ET Tuesday.\nIran has also taken aim at other U.S. allies, such as South Korea. Baghaei on Monday warned Seoul against potential military involvement and support for U.S. \"aggression,\" posting on X in Korean.\nSouth Korea's foreign ministry reportedly said over the weekend that it was in \"close communication with relevant countries to help restore peace and stability in the Middle East as soon as possible.\"\nLast week, Seoul said it was reviewing options, including military measures to support freedom of navigation in the Strait of Hormuz, according to Reuters.\n\"Any other country maintaining a military presence or participating in [U.S.] operations in the Persian Gulf and the Strait of Hormuz can only be regarded as directly supporting the perpetrators of the aggression, and it will lead to serious consequences,\" Baghaei posted.",
    "bodyJa": "イランはホルムズ海峡での米国の行動を支持しているカナダを非難し、オタワの動きは「戦略的混乱と脅迫への服従の表れ」だとした。\nテヘラン外務省報道官エスマイル・バガイ氏はＸへの投稿で、カナダは「米国大統領がカナダの主権と独立をあからさまに軽蔑し、カナダ全体を米国の一部であるかのように描いたまさにその日に」米国を「宥める」ことを選択したと述べた。\nバガイ氏は月曜日、アメリカ国内でのドナルド・トランプ大統領の投稿に言及しており、その内容は米国の「カナダ、グリーンランド、アイスランドをカバーする領土。\nトランプ大統領は2期目で、カナダを米国51番目の州にすることや、デンマークの半自治領であるグリーンランドを併合することなどについて繰り返し発言してきた。\nバガイ氏のコメントは、カナダが中東におけるイランの「不安定化行動」を非難した後に出たもので、米国、フランス、英国が主導するホルムズ海峡の再開に向けた取り組みへの制裁や支援などを通じ、イランに対する重大な圧力を維持するためにパートナーと協力すると述べた。\n「カナダは『平和と安全』、『航行の自由』、『国際法』の擁護者としての立場を信頼できる形で提示しながら、同時にこの地域における米国の軍事侵略とワシントンの違法で介入主義的な行動を支持することはできない」とバガイ氏は述べた。\n「これは『外交』でも『責任ある国家戦略』でもない。これは…カナダ自体を米国のいじめや侵略から守ることさえできない選択だ」とバガエイ氏は語った。\n同氏は、オタワ氏が「米国の悪意」と呼ぶものを経験し、米国の署名が『鉛筆で書かれている』ことを知っていたにもかかわらず、なぜ米国政府を支持することを選んだのか疑問を呈した。\nオタワとワシントンの通商交渉は先月、マーク・カーニー首相が米国の要求は行き過ぎだと述べ、決裂した。 「彼らはあまりにも多くを求め、あまりにも少なすぎる提供をした」と彼は言った。\nこれにより約200億ドル相当のカナダ製品に対する関税が発動され、カナダも「ドル対ドル」の報復関税を課し、火曜日東部時間午前12時1分に発効する予定だ。\nイランは韓国など他の米国同盟国も狙っている。バゲイ氏は月曜日、Xに韓国語で投稿し、韓国政府に対し、潜在的な軍事関与と米国の「侵略」への支援について警告した。\n韓国外務省は先週末、「中東の平和と安定をできるだけ早く回復できるよう、関係国と緊密に連絡をとっている」と述べたと伝えられている。\nロイター通信によると、韓国政府は先週、ホルムズ海峡での航行の自由を支援するための軍事措置を含む選択肢を検討していると発表した。\n「他の国がペルシャ湾やホルムズ海峡で軍事プレゼンスを維持したり、（米国の）作戦に参加したりするのは、侵略の加害者を直接支援しているとしか考えられず、それは深刻な結果を招くだろう」とバガイ氏は投稿した。",

    "title": "Oil extends gains as renewed Mideast hostilities raise worries of prolonged conflict",
    "titleJa": "中東での敵対行為の再燃で紛争長期化の懸念が高まる中、原油が利益を拡大",
    "summaryJa": "米国とイランが先週末にストライキを行ったことを受けて中東の緊張が激化することへの懸念から、原油価格は火曜日に上昇幅を広げ、３日連続で上昇し、６週間ぶりの高値で推移した。国際指標となるブレント原油先物（１１月渡し）は０．２０％上昇し、１バレル＝９７．２０ドルとなった。米国ウェスト・テキサス・インターミディエート先物１０月限は１．０７％上昇し、１バレル＝９２．５６ドルとなった。",
    "bodyOriginal": "Oil prices extended gains Tuesday, rising for a third straight day, and hovering at six-week highs on worries over escalating Mideast tensions after the U.S. and Iran traded strikes over the weekend.\nFutures for international benchmark Brent crude for November delivery gained 0.20% at $97.20 a barrel. U.S. West Texas Intermediate futures for October advanced 1.07% at $92.56 per barrel.\nThe U.S. military struck three Iranian oil tankers on Saturday after Iran launched ballistic missiles at two Navy warships. The Iranian Foreign Ministry, in a statement on Saturday, denounced the attacks on commercial vessels as a \"war crime\" and an act of \"economic warfare.\"\n\"This appears to be a major escalation and tensions have once again ratcheted higher,\" said David Morrison, senior market analyst at Trade Nation, noting that U.S. Energy Secretary Chris Wright had said it may prove impossible to reach a deal with Iran to prevent it obtaining a nuclear weapon.\nThe tit-for-tat strikes over the weekend also helped to push gas prices higher, hitting record highs.\nTensions between Washington and Tehran continued to simmer. \"Strike our assets and you get struck,\" Iranian Parliament Speaker Mohammad Bagher Ghalibaf wrote Monday in a post on X.\nThat was in response to Defense Secretary Pete Hegseth's post who wrote that the U.S. \"will destroy (and sink)\" Iranian oil tankers if Iran fires on U.S. vessels.\nGoldman Sachs on Monday raised its forecasts for Brent and WTI prices by $5 to $85 and $80 per barrel, respectively, for December 2026 and to $80 and $75 per barrel, respectively, for 2027.\nThe bank expects Mideast shipping disruptions to continue into 2027, with production gradually recovering by the second half of 2027. \"Markets are increasingly pricing a prolonged Mideast conflict,\" Goldman said, adding that Persian Gulf-to-China crude tanker rates in the second quarter of 2027 now price shipping disruptions lasting into that period.\nPresident Trump in a post on Monday stateside said that \"Oil prices will drop precipitously ... when we WIN the war with Iran.\"\n—CNBC's Greg Iacurci contributed to the report.",
    "bodyJa": "米国とイランが先週末にストライキを行ったことを受けて中東の緊張が激化することへの懸念から、原油価格は火曜日に上昇幅を広げ、３日連続で上昇し、６週間ぶりの高値で推移した。\n国際指標となるブレント原油先物（１１月渡し）は０．２０％上昇し、１バレル＝９７．２０ドルとなった。米国ウェスト・テキサス・インターミディエート先物１０月限は１．０７％上昇し、１バレル＝９２．５６ドルとなった。\nイランが海軍軍艦２隻に弾道ミサイルを発射したことを受け、米軍は土曜日、イランの石油タンカー３隻を攻撃した。イラン外務省は土曜日の声明で、商船への攻撃を「戦争犯罪」であり「経済戦争」行為であると非難した。\nトレード・ネイションのシニア市場アナリスト、デービッド・モリソン氏は「これは大幅なエスカレーションのようで、緊張が再び高まっている」と述べ、米国のクリス・ライト・エネルギー長官がイランの核兵器取得を阻止する合意に達するのは不可能であることが判明する可能性があると述べたことを指摘した。\n週末の報復ストライキもガソリン価格の上昇に寄与し、過去最高値を記録した。\nワシントンとテヘランの間の緊張は高まり続けた。 「我々の資産を攻撃すれば、あなたも攻撃される」とイラン国会議長モハマド・バガー・ガリバフは月曜、Xへの投稿で書いた。\nこれは、イランが米国の船舶に砲撃した場合、米国はイランの石油タンカーを「破壊（沈没）する」と書いたピート・ヘグセス国防長官の投稿に応えたものだった。\nゴールドマン・サックスは月曜日、ブレントとWTIの価格予想を、2026年12月についてはそれぞれ5ドル引き上げて1バレルあたり85ドルと80ドル、2027年についてはそれぞれ1バレルあたり80ドルと75ドルとした。\n同銀行は、中東の輸送混乱は2027年まで続き、生産は2027年下半期までに徐々に回復すると予想している。「市場は中東紛争の長期化をますます織り込んでいる」とゴールドマン氏は述べ、2027年第2四半期のペルシャ湾岸から中国への原油タンカーの運賃は現在、輸送混乱がその期間まで続くことを織り込んでいると付け加えた。\nトランプ大統領は月曜日の米国内への投稿で、「イランとの戦争に勝てば原油価格は急激に下落するだろう」と述べた。\n—CNBCのGreg Iacurci氏がこのレポートに貢献しました。",
