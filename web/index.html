    "summaryJa": "The defence secretary says the UK is \"back in the business of making weapons\" for its armed forces.",
    "bodyOriginal": "Tank barrel production returns to UK after 20 years\n- Published\nThe production of gun barrels to be used on tanks has returned to the UK for the first time in 20 years with the opening of a new manufacturing facility.\nThe UK Gun Hall in Telford, run by German defence firm Rheinmetall, has supported 100 jobs and will make barrels and breaches for large calibre weapons.\nDefence secretary, Wes Streeting, attended the opening ceremony on Thursday and said Britain was \"back in the business of making weapons\" for its armed forces.\n\"From an empty site to full production in eight months, this is rapid reindustrialisation in action,\" he said.\n\"One hundred skilled jobs in world class manufacturing and the return of large calibre weapon production to UK soil for the first time in 20 years - this is what defence as an engine for growth looks like,\" Streeting added.\nThe barrels and breaches will be made for both 120m and 155mm weapon systems, including for the RCH 155 and future artillery platforms, according to Rheinmetall.\nThe firm is already involved in the UK's Boxer combat vehicle programme and is upgrading the country's Challenger tanks.\nSpecialist workers from Telford have been recruited and the firm said it would expand its workforce as production ramped up.\nAhead of the factory's opening, staff spent time at a Rheinmetall facility in Germany where they were trained in precision manufacturing, quality assurance and specialist weapon production.\nArmin Papperger, CEO of Rheinmetall, said the gun hall was an \"important milestone\" that would strengthen the country's industrial base \"for decades to come\".\n\"We are committed to investing in the UK for the long term, expanding our industrial footprint and working together to deliver the capabilities needed for the future,\" he added.\n'Statement of intent'\nPapperger told BBC Radio Shropshire it was a significant investment in Telford, adding that the firm only had one similar production line in Germany.\n\"At the moment, we have a lot of orders and we need the capacity. Telford has very well-educated people, highly-motivated people,\" he added.\nPapperger said the company currently had 1,300 employees in the UK but was looking to build up that number.\nDuring his speech at the event, Streeting described Telford as being \"synonymous with engineering and manufacturing\".\n\"Today is a vote of confidence in our country,\" he continued, \"a statement of intent on our mission to reindustrialise Britain and create good, well-paid jobs across our country.\"\nGet in touch\nTell us which stories we should cover in Shropshire\nFollow BBC Shropshire on BBC Sounds, Facebook, external, X, external and Instagram, external.\nRelated topics\n- Published16 April\n- Published18 February\n- Published19 May 2025",

    "bodyOriginal": "With less than two weeks to go before the congressional elections, Americans are nearly as gloomy about the economy as they were when the nation was emerging from the pandemic, and President Donald Trump's economic approval rating is hitting an all-time low, according to the latest CNBC All-America Economic Survey.\nEight out of 10 Americans rate the economy as fair or poor, the highest number since December 2023 and one of several ominous signs for Republicans in the new polling data released Thursday that show why their candidates are facing an uphill battle in the midterm.\nDownbeat views on the economy are most intense among Democrats and independents, but there's been a strong move toward economic pessimism even among Republicans in recent months. Overall, 63% of the public is pessimistic about the current state of the economy and the outlook, up 1 percentage point from the July survey. But that percentage now includes 35% of Republicans, up 6 points from July and the highest level of Republican pessimism of either of Trump's two terms.\n\"We got there not because of independents or Democrats getting more sour — it's because Republicans have,\" said Micah Roberts, partner at Public Opinion Strategies, the Republican pollster for the survey. \"Since Trump has been president, [Republicans] have held on to a small margin saying that the current economy is either excellent or good. And now that has kind of broken and changed.\"\nThe survey of 1,000 registered voters nationwide, with a margin of error of plus or minus 3.1%, found Americans preferring Democratic control of Congress by a 52% to 45% margin. The 7 percentage point Democratic edge represents a 3 percentage point gain for Democrats from the July survey.\nThe poll contained other foreboding signs for Republicans as well. It showed 72% of Democrats highly interested in the midterm election on Nov. 3, compared with just 62% of Republicans. Women are 10 percentage points more interested in the election than men, and they prefer Democratic control of Congress by 22 points. Independents prefer Democratic control by a wide 49% to 33% margin. And the majority of survey respondents said Democrats would do a better job than Republicans on many of the issues they singled out as their top concerns, including corruption and the cost of food and gas.\nRead the full survey results here.\nIn the eight states with competitive Senate races, respondents prefer Democratic congressional control by 4 percentage points. Trump carried those eight states by a combined 10 points in the 2024 presidential election.\nThe survey shows \"things moving either away from Republicans or toward Democrats, depending how you want to look at it, in a way that would make me very nervous if I was leading Republican campaigns leading into these last two weeks,\" said Jay Campbell, partner at Hart Associates, the Democratic pollster for the poll.\nDespite the economic gloom, Trump's overall approval rating has remained stable, though at just 40% approving and 59% disapproving. His current net approval of -19 percentage points compares with -8 a year ago.\nMore striking is the sharp 9-point drop in the president's net economic approval rating from just the last survey in July. The president's economic approval fell to 34% from 38% in three months and disapproval rose to 65% from 60%. The net -31 economic approval is the lowest of either of Trump's two terms. The 65% disapproval rating is 1 percentage point higher than former President Joe Biden's worst showing and the highest for any president surveyed by CNBC going back to President Barack Obama.\nGovernment corruption was identified as the top concern by 36% of respondents, and Democrats hold a 4-point lead on addressing the issue. On the cost of food and groceries, the second-most important issue, the Democratic lead widened to +16 from +7 in the July survey. Democrats also topped Republicans on protecting democracy as well as dealing with the high price of gas.\nAmong those most interested in the election are respondents who identify corruption and protecting democracy as top issues, and they prefer Democratic congressional control by wide margins.\nRepublicans continued to hold a strong advantage on border security and immigration, but the lead on immigration fell to +9 from +15. Democrats, meanwhile, are seen as better at handling the issues of jobs and unemployment and Iran, which flipped from +2 for Republicans to +5 for Democrats.\nThe public continued to be skeptical of the value of the Iran war. The survey found just 46% of the public believe the military action was worth it to disrupt development of Iran's nuclear capabilities, down from a 53% majority in April. And just 35% say the military action was worth it given the rise in the price of gasoline.\nWhile the survey showed continued deep divisions by party, there was near unity on the corruption issue. Ninety-three percent said elected officials, including the president and members of Congress, should not be allowed to personally own or trade stocks in individual companies that have contracts with the federal government. And 89% said companies owned by or invested in by a sitting president's immediate family members should not be allowed to receive contracts from the federal government.\nWhile corruption was a top issue, prices are clearly top of mind for registered voters. Taken together, concern about the cost of food, gas and housing is the top concern for 57% of respondents. Eighty percent say prices are rising, up 5 percentage points from a year ago, with 55% saying they are rising faster than usual, also up 5 points. The cost of food actually eclipses gas as a greater concern in the survey 34% to 23%. It's a top worry among most major demographic groups but is most elevated among those making $30,000 or less and supporters of the agenda of Democratic Socialists of America. Yet it's also the top issue for those Republicans who don't count themselves as MAGA supporters.\nBoth pollsters were cautious about how extensive Democratic gains could be. Roberts from POS said it's a battle between \"the map and momentum.\"\n\"There are several indications nationally that the electorate is tilting more toward Democrats … but the movement is also fairly concentrated, each party's base is consolidating, and a 'big change' is dependent on Democrats flipping a lot of districts and states that Trump won handily just two years ago,\" he said.\nCampbell doesn't see a \"realignment\" election like in 1994 and 2008, saying, \"This looks like a return to the mean—young voters and voters of color returning to the Democratic fold, bolstered by independents being fed up with Trumpenomics.\" He adds, \"At no point did anyone expect that Democratic candidates would suddenly pull 15% of the Republican vote.\"",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
