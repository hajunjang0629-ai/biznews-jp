    "id": "strait-of-hormuz-ship-traffic-near-three-8d73cd57",
    "title": "Strait of Hormuz ship traffic near three-month low as U.S.-Iran deal in doubt",
    "titleJa": "米国とイランの合意に疑問が生じ、ホルムズ海峡の船舶交通量が3カ月ぶりに減少",
    "summaryJa": "米国とイランが重要な中東石油輸出回廊の全面開通に向けた合意に達するかどうかの疑念が高まる中、ホルムズ海峡を通過する船舶の交通量は３カ月ぶりの低水準に近づいている。貿易情報会社Kplerが提供したデータをCNBCが分析したところによると、火曜日の船舶の通過回数は5日間平均約13回で、5月12日以来ほぼ最低水準となった。これには、貨物船から石油タンカーまで、あらゆる種類の船舶が含まれます。",
    "bodyOriginal": "Ship traffic through the Strait of Hormuz is near a three-month low as doubt grows that the U.S. and Iran will reach an agreement to fully open the key Middle East oil export corridor.\nVessel transits sat at a five-day average of around 13 on Tuesday, nearly the lowest level since May 12, according to a CNBC analysis of data provided by the trade intelligence firm Kpler. This includes ships of all types, from cargo vessels to oil tankers.\nTraffic is about 90% lower than the daily average of 130 ships that transited Hormuz before the U.S. and Israel attacked Iran on Feb. 28.\nHowever, Energy Secretary Chris Wright said Tuesday that oil exports through Hormuz have reached a seven-day average of nearly 9 million barrels per day as tankers transit the strait with U.S. military assistance. A single supertanker can carry about 2 million barrels.\nTotal oil exports from the Gulf states are averaging about 15 million bpd when pipelines are included, Wright said. Before the war, about 20 million bpd of crude oil and products were exported through Hormuz.\n\"Many private businesses undercount the number of ships leaving the Strait of Hormuz due to ships moving covertly through the waterway,\" the energy secretary said in a social media post.\nIran's top national security official Mohsen Rezaei said Tuesday that Hormuz will not open fully until Washington agrees to Tehran's demands, according to the state news outlet PressTV.\nA week ago, Treasury Secretary Scott Bessent told CNBC that a deal could come soon to open Hormuz with freedom of movement for ships. Bessent's comments helped drive an oil sell-off last week, but an agreement between the U.S. and Iran still has not materialized.\nThe U.S. and Iran signed an interim deal on June 17 to open Hormuz, with ship crossings surging to a five-day average of about 60 on June 26. But the agreement subsequently collapsed as Washington and Tehran started fighting over shipping routes, which were left undefined in the deal.\nIran attacked tankers that used the U.S.-protected route along Oman's coast. The Trump administration launched more than a dozen waves of strikes against Iran and reimposed its naval blocade in retaliation.\nPresident Donald Trump has pivoted back to diplomacy this month, though it is unclear how much progress has been made. Traffic on Tuesday was about 80% below the post-deal peak.",
    "bodyJa": "米国とイランが重要な中東石油輸出回廊の全面開通に向けた合意に達するかどうかの疑念が高まる中、ホルムズ海峡を通過する船舶の交通量は３カ月ぶりの低水準に近づいている。\n貿易情報会社Kplerが提供したデータをCNBCが分析したところによると、火曜日の船舶の通過回数は5日間平均約13回で、5月12日以来ほぼ最低水準となった。これには、貨物船から石油タンカーまで、あらゆる種類の船舶が含まれます。\n交通量は、米国とイスラエルが2月28日にイランを攻撃する前にホルムズを通過した船舶130隻の1日平均よりも約90％少ない。\nしかし、クリス・ライト・エネルギー長官は火曜日、米国の軍事援助を受けてタンカーが海峡を通過しているため、ホルムズ経由の石油輸出は7日間平均で日量900万バレル近くに達していると述べた。超大型タンカー 1 隻で約 200 万バレルを輸送できます。\nライト氏によると、湾岸諸国からの原油総輸出量は、パイプラインを含めると平均で日量約１５００万バレルだという。戦前、ホルムズ経由で日量約２０００万バレルの原油と製品が輸出されていた。\n同エネルギー長官はソーシャルメディアへの投稿で、「多くの民間企業はホルムズ海峡を出港する船舶の数を過小評価している。船舶が水路を秘密裏に移動しているためだ」と述べた。\n国営通信社プレスTVによると、イラン国家安全保障高官のモーセン・レザエイ氏は火曜日、米国がテヘランの要求に同意するまでホルムズは完全開放しないと述べた。\n1週間前、スコット・ベッセント財務長官はCNBCに対し、ホルムズ島に船舶の移動の自由を与える協定が間もなく締結される可能性があると語った。ベッセント氏の発言は先週の原油売りにつながったが、米国とイランの合意はまだ実現していない。\n米国とイランは6月17日にホルムズ港を開放するための暫定合意に署名し、6月26日には船舶の航行回数が5日間平均約60回に急増した。しかし、合意に未定義のまま残された航路をめぐって米国とイランが争いを始めたため、合意はその後崩壊した。\nイランは、オマーン沿岸に沿って米国が保護する航路を利用していたタンカーを攻撃した。トランプ政権はイランに対して十数回の波状攻撃を開始し、報復として海軍の封鎖を再発動した。\nドナルド・トランプ大統領は今月、外交に軸足を戻したが、どれだけ進展があったのかは不明だ。火曜日のトラフィックは合意後のピークを約80％下回った。",

  {
    "id": "trump-sued-over-truth-social-advance-acc-1fd5d50d",
    "title": "Trump sued over Truth Social advance access sale",
    "titleJa": "トランプ大統領、Truth Socialの事前アクセス販売を巡って訴訟",
    "summaryJa": "ドナルド・トランプ大統領は水曜日、Truth Socialでの自身の投稿の事前通知を販売する物議を醸している新サービスの阻止を求めるメディアと非営利団体から訴訟を起こされた。マンハッタンの連邦地方裁判所に起こされたこの訴訟は、トランプ氏自身のソーシャルメディアサイトへの投稿が、政府の政策や軍事行動、その他の決定に関する発表で金融市場を動かすことが多いと指摘している。",
    "bodyOriginal": "President Donald Trump was sued on Wednesday by a media outlet and a non-profit group seeking to block a controversial new service that sells advance notifications of his posts on Truth Social.\nThe lawsuit, filed in U.S. District Court in Manhattan, notes that Trump's posts on his own social media site often move financial markets with announcements about government policy, military actions and other decisions.\n\"President Donald Trump is charging $100,000 per month for advance access to his official government announcements on Truth Social, the social media platform he owns,\" the civil suit says.\n\"This scheme is extraordinary, corrupt, and unconstitutional, and Plaintiffs bring this case to stop it,\" the suit says. \"There is no legitimate interest, let alone a significant one, in permitting President Trump to profit from selling government information.\"\nThe suit was filed by The Intercept Media, a news organization, and by the Freedom of the Press Association, a non-profit group.\nThe complaint alleges that the new service, known as Truth API, violates the First and Fifth Amendments of the U.S. Constitution by giving subscribers preferential access to Trump's public announcements for \"unreasonable sums.\"\nTruth Social's parent company, Trump Media, announced in July that it would offer subscribers who paid up to $100,000 each month early access to \"market-moving\" posts from Trump and other people who use the platform. Trump is the largest shareholder in Trump Media through the Donald J. Trump Revocable Trust.\nCurrently, the suit says, Truth API provides subscribers faster access to posts for the 10 most popular accounts on Truth Social. After Trump, those accounts include the White House itself, Vice President JD Vance, FBI Director Kash Patel, White House Press Secretary Karoline Leavitt, Transportation Secretary Sean Duffy, and Health and Human Services Secretary Robert Kennedy.\n\"This scheme is profoundly corrupt,\" the suit says. \"The President stands to gain financially by giving 'market-moving' government information to those who are willing and able to pay his personal company.\nThe suit says that since resuming office in January 2025, Trump has published between 9,000 and 11,000 posts on Truth Social.\n\"Often his posts have no immediate corresponding announcement from the White House,\" the suit says. \"In other words, President Trump's posts are the only way to get official government news.\"\nCNBC has requested comment from the White House on the lawsuit.\nDuring a quarterly earnings conference call on Monday, Trump Media CEO Kevin McGurn said Truth API \"provides machine-readable feeds of publicly available Truth posts from the platform's top accounts in milliseconds.\"\n\"Our customers will get published and publicly available posts fractionally faster,\" McGurn said.\nMcGurn also said during that call that Trump Media to date had signed more than 10 customer agreements for Truth API, \"generally in the range of $60,000-$100,000 a month.\"\nMcGurn said that the company was in active discussions with hyperscalers and some large news organizations and developers of large language models about the service.\n\"Looking ahead, we expect the next phase of the API to include broader third-party distribution, for example, news feeds, financial data terminals, and specialty publications, which we believe will bring more visibility to this business over time,\" he said.\nIn addition to Trump, the suit names as defendants the president's executive assistant, Natalie Harp and White House Deputy Chief of Staff Dan Scavino, who are each known to post to Truth Social on behalf of the president; the Executive Office of the President; and the White House Office.\n— CNBC's Megan Cassella contributed to this report.",
    "bodyJa": "ドナルド・トランプ大統領は水曜日、Truth Socialでの自身の投稿の事前通知を販売する物議を醸している新サービスの阻止を求めるメディアと非営利団体から訴訟を起こされた。\nマンハッタンの連邦地方裁判所に起こされたこの訴訟は、トランプ氏自身のソーシャルメディアサイトへの投稿が、政府の政策や軍事行動、その他の決定に関する発表で金融市場を動かすことが多いと指摘している。\n民事訴訟では、「ドナルド・トランプ大統領は、自身が所有するソーシャルメディア・プラットフォームであるTruth Socialでの政府の公式発表への事前アクセスに月額10万ドルを請求している」としている。\n「この計画は異常で腐敗しており、憲法違反であり、原告らはそれを阻止するためにこの訴訟を起こした」と訴訟は述べている。 「トランプ大統領が政府情報を販売して利益を得ることには、正当な利益はなく、ましてや重大な利益はない。」\nこの訴訟は、報道機関であるインターセプト・メディアと非営利団体である自由報道協会によって起こされた。\n告訴状では、Truth APIとして知られるこの新サービスは、加入者に「不当な金額」でトランプ大統領の公表内容への優先アクセスを与えるもので、合衆国憲法修正第1条と第5条に違反していると主張している。\nトゥルース・ソーシャルの親会社トランプ・メディアは7月、毎月最大10万ドルを支払った購読者に、トランプ氏や同プラットフォームを利用する他の人々による「市場を動かす」投稿への早期アクセスを提供すると発表した。トランプ氏は、ドナルド・J・トランプ取消可能信託を通じてトランプ・メディアの筆頭株主である。\n訴状によると、現在、Truth APIは購読者にTruth Socialで最も人気のある10のアカウントの投稿へのより迅速なアクセスを提供している。トランプ大統領以降、これらのアカウントには、ホワイトハウスそのもの、JD・バンス副大統領、カッシュ・パテルFBI長官、キャロライン・リービット大統領報道官、ショーン・ダフィー運輸長官、ロバート・ケネディ保健福祉長官が含まれる。\n「この計画はひどく腐敗している」と訴状は述べている。 「大統領は、自分の会社にお金を払う意欲と能力のある人々に『市場を動かす』政府情報を提供することで、経済的に利益を得ようとしている。\n訴状によると、2025年1月に大統領に復帰して以来、トランプ氏はTruth Socialに9,000～11,000件の投稿を投稿したという。\n「彼の投稿には、ホワイトハウスからの即時の対応発表がないことが多い」と訴状は述べている。 「言い換えれば、トランプ大統領の投稿が政府の公式ニュースを入手する唯一の方法だということだ。」\nCNBCはこの訴訟についてホワイトハウスにコメントを求めた。\nトランプ・メディアのケビン・マクガーン最高経営責任者（CEO）は月曜日の四半期決算会見で、Truth APIは「プラットフォームのトップアカウントから公開されているTruth投稿の機械可読フィードをミリ秒単位で提供する」と述べた。\n「当社の顧客は、ほんの少し早く公開され、公開された投稿を入手できるようになるだろう」とマクガーン氏は語った。\nマクガーン氏はまた、その電話の中で、トランプ・メディアがこれまでにTruth APIの顧客契約を10件以上締結しており、その金額は「通常月額6万ドルから10万ドルの範囲」であると述べた。\nマクガーン氏は、同社がハイパースケーラーや一部の大手報道機関、大規模な言語モデルの開発者らとこのサービスについて活発な議論を行っていると述べた。\n「将来を見据えて、API の次のフェーズには、ニュースフィード、金融データ端末、専門出版物など、より広範なサードパーティ配信が含まれると予想しています。これにより、時間の経過とともにこのビジネスの認知度がさらに高まると考えています」と同氏は述べた。\n訴訟ではトランプ氏に加え、大統領首席補佐官ナタリー・ハープ氏とホワイトハウス副首席補佐官ダン・スカビーノ氏も被告として名指しされており、両氏はそれぞれ大統領に代わってトゥルース・ソーシャルに投稿していることが知られている。大統領執行部;そしてホワイトハウスオフィス。\n— CNBC の Megan Cassella がこのレポートに寄稿しました。",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
