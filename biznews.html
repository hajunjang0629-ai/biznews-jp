    "id": "crypto-thieves-attack-man-in-home-and-th-72610f5d",
    "title": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery",
    "titleJa": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery",
    "summaryJa": "The man was beaten with hammers until he transferred hundreds of thousands of pounds of cryptocurrency.",
    "bodyOriginal": "Crypto thieves attack man in home and threaten to kill pregnant wife's baby in 'horrific' robbery\n- Published\nWarning: This story contains distressing details\nA businessman was beaten with hammers by masked men who broke into his home and threatened to kill his heavily pregnant wife unless he transferred hundreds of thousands of pounds of cryptocurrency.\nSpeaking to the BBC, the couple, who want to remain anonymous, described the attack as \"horrific\" and said they feared for their unborn baby's life.\nThe attackers left in a car driven by a getaway driver after the man transferred his crypto savings.\nCrimestoppers are offering a £10,000 reward for information in the attack, which was captured on home security footage and is being investigated by the police.\nExperts say it is one of a growing type of violent theft known as a \"wrench attack\" targeting cryptocurrency investors.\nAs crypto coins have risen in value, reports of these violent robberies linked to digital assets have emerged in the UK, France and the US.\nOnce funds are transferred, recovering them can be extremely difficult.\nThe man, who the BBC is calling James, said three intruders forced their way into their Solihull home before launching an assault which lasted 45 minutes.\n\"The door gets pushed open, I can see gloves coming in, balaclavas,\" he said.\nJames tried to fight the men off but they hit him in the face, head and ribs with hammers.\nHis wife, who was seven months pregnant, was held down on the sofa by one of the criminals.\n\"He's got a pillow over her face,\" James said. \"He's literally suffocating her on the sofa. I can hear her screaming, 'I can't breathe'.\"\nThe couple still had no idea what the criminals wanted until one of the men demanded James unlock his phone and hand it over.\nJames said the attackers appeared to know he owned cryptocurrency, but had little understanding of how to access it.\nInstead, they were taking instructions from someone else connected via a live video call.\n\"I can hear the guy on FaceTime saying: 'Show me everything on his phone. Show me what apps he's got',\" he said.\nWhen the caller identified a crypto wallet containing substantial funds, the threats escalated dramatically.\n\"He was basically saying: 'Look, if you don't send us this money now, we're going to stab your wife in the stomach and kill your baby. We're going to kill your wife',\" James said.\nHis wife, who also did not want to be named, described the attack that happened in December last year as \"horrific\" and said she feared James had been killed when he was unresponsive on the floor.\n\"It was terrifying,\" she said.\nThe woman, in her early thirties, was expecting her third child at the time and said she feared she might lose the baby due to the stress of the attack. The baby survived and was born at full term.\nThe men left after James transferred his savings - hundreds of thousands of pounds of cryptocurrency - to the digital wallet of the man on the video call.\nThey also stole several luxury Rolex watches.\nJames said before they left, he heard the man on the video call tell his accomplices: \"You can have 10 grand each but I am taking the rest.\"\nRise of the 'wrench attack'\nUnlike money held in a conventional bank account, cryptocurrency is often controlled directly by the owner through digital wallets or physical storage devices.\nFor criminals, that combination of speed, anonymity and irreversibility can make crypto holders attractive targets.\nWhilst the vast majority of cryptocurrency theft happens online through hacks and scams, crypto investigators at Chainalysis say \"wrench attacks\" have surged in recent years.\nAccording to their research, $30m (£22.6m) had been stolen so far this year up to June in violent robberies, making 2026 likely to become the single-worst year for violent crypto attacks on record. Home invasions are also on the rise this year, it found.\nThe US, Brazil, and Thailand are hotspots but France has seen the largest number of attacks by far, as a result of a data breach at a tax office that has apparently allowed wealthy crypto holders to be located.\n\"The physical security assumptions that protect traditional wealth, such as bank vaults and armored cars, do not automatically apply in crypto. Often, holders keep their assets in comparatively low security setups, like self-custody wallets, that can be compromised without any institutional gatekeeper standing in the way,\" said researchers in their report.\nJames said he became an amateur investor in crypto coins in 2020 and made enough money to quit his job in 2023 to trade full time.\nNow he has lost everything and is looking to get back to his traditional job.\nPolice have yet to identify the attackers.\nCrimestoppers is offering a £10,000 reward for information leading to progress in the investigation.\nAlan Edwards from the charity hopes people might have information about the three attackers, the driver who was parked outside without a face covering, or the man on the phone.\n\"These criminals are obviously serious and part of some kind of organised crime gang,\" he said.\n\"People might be scared to give us information but we are independent of the police and keep people completely anonymous.\"\nThe three attackers are all thought to be in their late teens or early 20s and one of them was a black male with a scar under his left eyebrow.\nJames said he has little hope of recovering the stolen funds, but instead wanted to see those responsible brought to justice.\nHe also wants his experience to serve as a warning.\n\"They threatened my wife and my baby,\" he said. \"People need to understand these risks are real.\"\nBrutal crypto attack on couple prompts £10k reward\n- Published24 September\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

    "title": "'It could cost me £10k but I need the money now': Why Gen Z are opting out of pensions",
    "titleJa": "'It could cost me £10k but I need the money now': Why Gen Z are opting out of pensions",
    "summaryJa": "A growing number of people are opting out of these schemes due to cost-of-living pressures.",
    "bodyOriginal": "'It could cost me £10k but I need the money now': Why Gen Z are opting out of pensions\n- Published\nUntil early September, Hassan Nassar, 26, was saving around £430 every month into his NHS workplace pension.\nBut the trainee GP, who works in the West Midlands, says he was \"really cash strapped\" and decided to stop putting money aside for around \"six to 12 months\".\nHe needs the money to help take care of a sick family member, save for his first home and cover rent and student loan repayments.\nBut he's aware there is a cost to opting out, estimating he could lose between \"£5,000 and £10,000\" in future retirement income due to the decades of compound interest he will miss out on by not saving now.\n\"People will say, you're silly, look at what you'll be missing out in the future,\" he tells the BBC. \"But I need to look at what I'd be losing now if I didn't opt out.\"\nFuture problems\nAll employees will be automatically enrolled, external in a workplace pension if they are aged 22 or above and earn over £10,000, although there are exceptions.\nA percentage is taken directly from the worker's pay - usually around 5% - with tax relief added on top, and the employer must also pay a minimum contribution on top.\nBut a growing number of Gen Z and millennials are opting out of these schemes due to cost-of-living pressures and the government has warned they could be on track for lower private pension incomes than people retiring today.\nThat is a problem, because while most people in the UK will eventually get a state pension, it only provides a minimum level of retirement income and many will rely on a private pension to supplement it.\nHassan says he was paying 10.7% of his gross earnings each month into his workplace pension, while the NHS contributed a substantial amount on top.\nBut unlike some employers, the NHS doesn't allow staff to reduce their contributions when times are hard.\nOverall, however, he is confident he will have enough to retire on at the end of his \"30-40\" year career and is determined to opt back in to his pension as soon as he can.\nAccording to the Department for Work and Pensions (DWP), around 22.6 million people, or 90% of those who are eligible for \"automatic enrolment\" pensions, are paying into one, while about 2.5 million are not.\nHowever, Pensions Minister Torsten Bell told the BBC that \"a rising number of young workers aren't saving, and overall there is a danger tomorrow's retirees are on track for lower private pension incomes than today's\".\nAccording to DWP data, external:\nIn the three months to December last year, 11.5% of eligible 22 to 29-year-olds who recently started a job opted out of their pensions. That's up from 6.6% in the same period of 2020.\nFor 30 to 39-year-olds it's gone from 7.4% to 12.7%.\n'How can I save for a house?'\nEvie, 22, from Cornwall, says she opted out of entering the workplace pension at the London events company she works for.\nA recent drama school graduate, she says she would have struggled to cover her outgoings, including food, travel and the £800 she pays in rent.\nEvie is conscious about missing out on saving for retirement, but there are other things she needs money for that make it impractical right now.\n\"How can I save for a house, how can I save for a car and afford my outgoings? I don't want to just work day in, day out to live, I want to work to have a life.\"\n'Think of your future self'\nApril Leeson, from The Private Office, a chartered financial advice firm, says she would always advise people to not stop paying into their pensions if they can help it, even if that means reducing their contributions, which many employers allow you to do.\nThis is partly because of the free employer contributions they will miss out on but also the lost compound interest.\n\"The current minimum pension age is 57, so any money you save in your 20s will have at least 30 years to compound and grow.\n\"£100 saved now, compounded at 4% a year over 30 years, is going to be worth a lot more than £100 saved in 15 to 20 years' time.\"\nShe also urges younger people to think ahead. \"You really need to think of your future self and what that person will need to retire comfortably.\"\nKharlee, 47, a teacher from South East London, can certainly relate to this. She stopped her contributions to a workplace pension twice over the last five years for financial reasons.\nAnd she thinks she missed out on saving about £5,000 into her pension pot.\nShe's in a better place financially now, but recently became self-employed and is no longer part of a private pension scheme, something she hopes to change.\n\"I would like to feel my pension is secure, and I don't feel like that. I worry I'm not going to be able to live comfortably at the age of retirement.\"\nGet in touch\nAre you able to save money every month? Share your tips with us on how you do it.",

e on at the end of his \"30-40\" year career and is determined to opt back in to his pension as soon as he can.\nAccording to the Department for Work and Pensions (DWP), around 22.6 million people, or 90% of those who are eligible for \"automatic enrolment\" pensions, are paying into one, while about 2.5 million are not.\nHowever, Pensions Minister Torsten Bell told the BBC that \"a rising number of young workers aren't saving, and overall there is a danger tomorrow's retirees are on track for lower private pension incomes than today's\".\nAccording to DWP data, external:\nIn the three months to December last year, 11.5% of eligible 22 to 29-year-olds who recently started a job opted out of their pensions. That's up from 6.6% in the same period of 2020.\nFor 30 to 39-year-olds it's gone from 7.4% to 12.7%.\n'How can I save for a house?'\nEvie, 22, from Cornwall, says she opted out of entering the workplace pension at the London events company she works for.\nA recent drama school graduate, she says she would have struggled to cover her outgoings, including food, travel and the £800 she pays in rent.\nEvie is conscious about missing out on saving for retirement, but there are other things she needs money for that make it impractical right now.\n\"How can I save for a house, how can I save for a car and afford my outgoings? I don't want to just work day in, day out to live, I want to work to have a life.\"\n'Think of your future self'\nApril Leeson, from The Private Office, a chartered financial advice firm, says she would always advise people to not stop paying into their pensions if they can help it, even if that means reducing their contributions, which many employers allow you to do.\nThis is partly because of the free employer contributions they will miss out on but also the lost compound interest.\n\"The current minimum pension age is 57, so any money you save in your 20s will have at least 30 years to compound and grow.\n\"£100 saved now, compounded at 4% a year over 30 years, is going to be worth a lot more than £100 saved in 15 to 20 years' time.\"\nShe also urges younger people to think ahead. \"You really need to think of your future self and what that person will need to retire comfortably.\"\nKharlee, 47, a teacher from South East London, can certainly relate to this. She stopped her contributions to a workplace pension twice over the last five years for financial reasons.\nAnd she thinks she missed out on saving about £5,000 into her pension pot.\nShe's in a better place financially now, but recently became self-employed and is no longer part of a private pension scheme, something she hopes to change.\n\"I would like to feel my pension is secure, and I don't feel like that. I worry I'm not going to be able to live comfortably at the age of retirement.\"\nGet in touch\nAre you able to save money every month? Share your tips with us on how you do it.",

    "id": "the-wealthy-cuban-americans-ready-and-wa-03e5acd7",
    "title": "The wealthy Cuban Americans ready and waiting for Havana to fall",
    "titleJa": "The wealthy Cuban Americans ready and waiting for Havana to fall",
    "summaryJa": "Cuban exiles in Florida are increasingly hopeful that regime change in Cuba is now on the horizon.",
    "bodyOriginal": "The wealthy Cuban Americans ready and waiting for Havana to fall\n- Published\nAt the lavish home of one of Miami's top plastic surgeons, overlooking the Biscayne Bay, some of the wealthiest Cuban-American families in Florida have gathered.\nThey are there to thrash out their vision of Cuba's future at the fourth meeting of the newly created Cuban-American National Chamber of Commerce (CANCC).\nRum in hand and Rolexes on wrists, this is Miami's old money. People with well-recognised Cuban-American surnames – like Bacardi and Babun – chat around the pool about the lamentable state of the island's economy, and share titbits of gossip about the latest political rumblings.\n\"The intention of this evening is to gather under one roof the most prominent Cuban-American entrepreneurs in Miami-Dade County,\" says CANCC president Juan Omar Sixto, \"and the objective is to be in Cuba once the regime falls\".\nHis guests are convinced that moment is nigh.\nMillions without power as Cuba hit by latest major blackout\n- Published19 September\nUS sanctions more Cuban companies and officials\n- Published21 August\nHow the US oil blockade is pushing Cuba into darkness\n- Published26 June\nThis influential community of Cuban exiles has detested the Communist-run government ever since the late revolutionary leader Fidel Castro expropriated their lands and nationalised their families' companies after taking power in 1959.\nAnd they have wielded their political and economic clout in Florida over the years to shape Washington's policies towards their homeland.\nSixto fled the island as a teenager. Now a real estate developer in his early 80s, his organisation is drafting plans for what he calls \"the day after\" in Cuba.\nThe CANCC has created a proposal for a Cuban Stock Exchange and formed committees on everything from energy infrastructure to food security.\nPost-Communist planning is nothing new in Miami.\nCountless documents and logistical plans have been drawn up by interest groups over the decades, some of them more sober and measured than others.\nThe difference now, insists Sixto, is the Trump administration's push to force total change on the island. And he says they have the ear of some high-profile contacts including people close to the Secretary of State, Marco Rubio.\n\"Together with deliveries of humanitarian aid and medical supplies, we'd go and do business in Cuba right away,\" says Sixto.\nIn Cuba itself, such claims are mostly met with scepticism.\nIn the face of Washington's \"maximum pressure\" campaign on Cuba, the island's leadership recently announced 176 economic liberalisation measures. The Cuban President, Miguel Díaz-Canel, said they were \"to advance the defence of socialism, to support and widen social justice\".\nTo his critics, they look distinctly like full-blown capitalism - lifting the cap on the number of workers in a private business, allowing the direct hiring and firing of Cuban employees and permitting ownership of multiple enterprises at once, including by Cuban Americans.\nStill, the attendees at the CANCC meeting dismissed the economic reforms as cosmetic, saying they gave no meaningful guarantees to investors. They would \"not put a foot into Cuba\", Sixto said, while the current regime remained in place.\nSome analysts think such planning meetings are premature. Although Cuban Americans are convinced that change is imminent in Cuba, none can say with any certainty what it will be - a US military operation as seen in Venezuela in January? Or a new economic pact with the island's leadership?\n\"Right now, the very high expectations created by the US administration that some kind of 'day after' was coming soon, or that Cuba would 'be next' have been kicked down the road,\" says Mike Bustamante, associate professor of history at the University of Miami.\nWith the November mid-term elections in the US approaching and the Trump administration embroiled in the \"quagmire\" of the Iran war, Bustamante argues there is little appetite for further foreign adventures.\n\"It's really tough to think that they will escalate further than what they're doing which is this drip-drip-drip of sanctions.\"\nWith the island's oil supply effectively shut off since January, that is already a significant escalation, says Mike Bustamente. Although they have made life unbearable for most ordinary people, they haven't yet \"created the ingredients for a political inflection point\" in Cuba, he adds.\nThe Cuban government has not commented on the CANCC itself. But traditionally such groups prompt indignation among revolutionaries who insist they will not be forced out by their critics in Miami.\nI ask some guests if they can appreciate the irony that the same people who support a major source of the island's misery – the decades-long US economic embargo and the current fuel blockade – are now hatching plans for its reconstruction, without the input of most Cubans.\nFor Cuban-American agricultural expert Hugo Orizondo it is only practical to draw up a road map to Cuban development. \"Right now, Cuba is like a black hole, we don't know what is happening over there,\" he admits. \"But we do know the potential [for investment].\"\nOrizondo says he understands the reticence among Cubans to see foreign investors buying up something as sensitive as the rights to arable land. \"But what are they going to do with it?\" he retorts. \"When investors come, they bring money and technology into the land.\"\nBoth are urgently needed, he says, if Cuba is ever to produce enough to feed its own population and break its reliance on food imports.\nLand titles lie at the heart of any reconstruction project put forward by this generation of wealthy Cuban Americans. Juan Omar Sixto says his father lost five properties and a farm in Cuba's Pinar del Rio province to the revolution. While he insists he has no intention of removing any family living in those homes, he does want compensation for the nationalised land.\n\"I worked on that farm for five years of my life with my father, and they took it away. I want restitution or compensation. Even if they give me just a penny on the dollar, I'll take it.\"\n\"It's moral justice,\" he argues.\nThe Cuban government portrays such historic title claims as bitterness by a corrupt landed gentry who made fortunes on the backs of indentured workers and slaves. Both slavery and the system of indentured workers didn't end in Cuba until the late 19th Century.\nThe government also argues that the exiles could never stand that Castro passed land reforms which handed over their fields to the workers and the state.\n\"Most of our sugar mills have been dismantled, but we will recover those lands and put them into production,\" says Nicolás Gutiérrez, the president of the National Association of Sugar Mill Owners of Cuba, an exile organisation championing the title claims.\n\"I'm not promising it will be in sugar,\" he says.\n\"It might be in ethanol, co-generation, solar panels or water purification cells. Who knows? There are a lot of different options,\" he remarks. \"We need to get them producing, we need to have a real wage paid to Cuban workers and create a multiplier economic effect across the island.\"\nWith the ice clinking in their drinks and a cool breeze rustling the palm trees on the perfectly manicured lawn, the CANCC members make it sound easy. But within hours of their gathering, Cuba had descended into its sixth nationwide blackout this year.\nThe disconnection between the hopes for change in Miami and the realities on the ground in Cuba is stark. Many Miami-based Cubans think the monumental shift they have prayed for is almost here.\nIf so, it will inevitably bring huge social and humanitarian disruption which the stricken island is ill-equipped to cope with. Even assuming the diaspora's support is well-intentioned rather than purely self-interested, fixing the island's failing electrical grid alone is estimated to cost $8bn to $10bn (£6bn to £7.5bn).\nBefore any industry in Cuba – from agriculture to tourism – can be revitalised by the exiles' wealth and political connections, Cubans continue to face acute shortages in food, water, fuel and medicines. Miami's ambitious plans aside, most Cubans just hope their days get a little easier sometime soon.",
    "bodyJa": "The wealthy Cuban Americans ready and waiting for Havana to fall\n- Published\nAt the lavish home of one of Miami's top plastic surgeons, overlooking the Biscayne Bay, some of the wealthiest Cuban-American families in Florida have gathered.\nThey are there to thrash out their vision of Cuba's future at the fourth meeting of the newly created Cuban-American National Chamber of Commerce (CANCC).\nRum in hand and Rolexes on wrists, this is Miami's old money. People with well-recognised Cuban-American surnames – like Bacardi and Babun – chat around the pool about the lamentable state of the island's economy, and share titbits of gossip about the latest political rumblings.\n\"The intention of this evening is to gather under one roof the most prominent Cuban-American entrepreneurs in Miami-Dade County,\" says CANCC president Juan Omar Sixto, \"and the objective is to be in Cuba once the regime falls\".\nHis guests are convinced that moment is nigh.\nMillions without power as Cuba hit by latest major blackout\n- Published19 September\nUS sanctions more Cuban companies and officials\n- Published21 August\nHow the US oil blockade is pushing Cuba into darkness\n- Published26 June\nThis influential community of Cuban exiles has detested the Communist-run government ever since the late revolutionary leader Fidel Castro expropriated their lands and nationalised their families' companies after taking power in 1959.\nAnd they have wielded their political and economic clout in Florida over the years to shape Washington's policies towards their homeland.\nSixto fled the island as a teenager. Now a real estate developer in his early 80s, his organisation is drafting plans for what he calls \"the day after\" in Cuba.\nThe CANCC has created a proposal for a Cuban Stock Exchange and formed committees on everything from energy infrastructure to food security.\nPost-Communist planning is nothing new in Miami.\nCountless documents and logistical plans have been drawn up by interest groups over the decades, some of them more sober and measured than others.\nThe difference now, insists Sixto, is the Trump administration's push to force total change on the island. And he says they have the ear of some high-profile contacts including people close to the Secretary of State, Marco Rubio.\n\"Together with deliveries of humanitarian aid and medical supplies, we'd go and do business in Cuba right away,\" says Sixto.\nIn Cuba itself, such claims are mostly met with scepticism.\nIn the face of Washington's \"maximum pressure\" campaign on Cuba, the island's leadership recently announced 176 economic liberalisation measures. The Cuban President, Miguel Díaz-Canel, said they were \"to advance the defence of socialism, to support and widen social justice\".\nTo his critics, they look distinctly like full-blown capitalism - lifting the cap on the number of workers in a private business, allowing the direct hiring and firing of Cuban employees and permitting ownership of multiple enterprises at once, including by Cuban Americans.\nStill, the attendees at the CANCC meeting dismissed the economic reforms as cosmetic, saying they gave no meaningful guarantees to investors. They would \"not put a foot into Cuba\", Sixto said, while the current regime remained in place.\nSome analysts think such planning meetings are premature. Although Cuban Americans are convinced that change is imminent in Cuba, none can say with any certainty what it will be - a US military operation as seen in Venezuela in January? Or a new economic pact with the island's leadership?\n\"Right now, the very high expectations created by the US administration that some kind of 'day after' was coming soon, or that Cuba would 'be next' have been kicked down the road,\" says Mike Bustamante, associate professor of history at the University of Miami.\nWith the November mid-term elections in the US approaching and the Trump administration embroiled in the \"quagmire\" of the Iran war, Bustamante argues there is little appetite for further foreign adventures.\n\"It's really tough to think that they will escalate further than what they're doing which is this drip-drip-drip of sanctions.\"\nWith the island's oil supply effectively shut off since January, that is already a significant escalation, says Mike Bustamente. Although they have made life unbearable for most ordinary people, they haven't yet \"created the ingredients for a political inflection point\" in Cuba, he adds.\nThe Cuban government has not commented on the CANCC itself. But traditionally such groups prompt indignation among revolutionaries who insist they will not be forced out by their critics in Miami.\nI ask some guests if they can appreciate the irony that the same people who support a major source of the island's misery – the decades-long US economic embargo and the current fuel blockade – are now hatching plans for its reconstruction, without the input of most Cubans.\nFor Cuban-American agricultural expert Hugo Orizondo it is only practical to draw up a road map to Cuban development. \"Right now, Cuba is like a black hole, we don't know what is happening over there,\" he admits. \"But we do know the potential [for investment].\"\nOrizondo says he understands the reticence among Cubans to see foreign investors buying up something as sensitive as the rights to arable land. \"But what are they going to do with it?\" he retorts. \"When investors come, they bring money and technology into the land.\"\nBoth are urgently needed, he says, if Cuba is ever to produce enough to feed its own population and break its reliance on food imports.\nLand titles lie at the heart of any reconstruction project put forward by this generation of wealthy Cuban Americans. Juan Omar Sixto says his father lost five properties and a farm in Cuba's Pinar del Rio province to the revolution. While he insists he has no intention of removing any family living in those homes, he does want compensation for the nationalised land.\n\"I worked on that farm for five years of my life with my father, and they took it away. I want restitution or compensation. Even if they give me just a penny on the dollar, I'll take it.\"\n\"It's moral justice,\" he argues.\nThe Cuban government portrays such historic title claims as bitterness by a corrupt landed gentry who made fortunes on the backs of indentured workers and slaves. Both slavery and the system of indentured workers didn't end in Cuba until the late 19th Century.\nThe government also argues that the exiles could never stand that Castro passed land reforms which handed over their fields to the workers and the state.\n\"Most of our sugar mills have been dismantled, but we will recover those lands and put them into production,\" says Nicolás Gutiérrez, the president of the National Association of Sugar Mill Owners of Cuba, an exile organisation championing the title claims.\n\"I'm not promising it will be in sugar,\" he says.\n\"It might be in ethanol, co-generation, solar panels or water purification cells. Who knows? There are a lot of different options,\" he remarks. \"We need to get them producing, we need to have a real wage paid to Cuban workers and create a multiplier economic effect across the island.\"\nWith the ice clinking in their drinks and a cool breeze rustling the palm trees on the perfectly manicured lawn, the CANCC members make it sound easy. But within hours of their gathering, Cuba had descended into its sixth nationwide blackout this year.\nThe disconnection between the hopes for change in Miami and the realities on the ground in Cuba is stark. Many Miami-based Cubans think the monumental shift they have prayed for is almost here.\nIf so, it will inevitably bring huge social and humanitarian disruption which the stricken island is ill-equipped to cope with. Even assuming the diaspora's support is well-intentioned rather than purely self-interested, fixing the island's failing electrical grid alone is estimated to cost $8bn to $10bn (£6bn to £7.5bn).\nBefore any industry in Cuba – from agriculture to tourism – can be revitalised by the exiles' wealth and political connections, Cubans continue to face acute shortages in food, water, fuel and medicines. Miami's ambitious plans aside, most Cubans just hope their days get a little easier sometime soon.",

    "title": "US says Europe should ready fuel supplies as Trump threatens diesel ban",
    "titleJa": "US says Europe should ready fuel supplies as Trump threatens diesel ban",
    "summaryJa": "President Donald Trump has threatened to ban diesel exports in a bid to ease prices in the US ahead of the November elections.",
    "bodyOriginal": "US says Europe should ready fuel supplies as Trump threatens diesel ban\n- Published\nDonald Trump has said he may ask European countries to release some of their diesel reserves as he mulls a ban on US exports of the fuel amid a global shortage.\nThe comments followed his Treasury Secretary Scott Bessent urging for Europe to immediately ready and release such supplies. \"American farmers, truckers, and businesses should not be left carrying the burden\" as prices soar, he argued.\nThe US has threatened to restrict diesel exports amid surging costs due to the war in Iran. The issue is top of mind for US voters ahead of the crucial midterm elections.\nOn Thursday, Britain held talks with European partners about the potential release of diesel reserves in response to any ban.\nThe US is a vital supplier of diesel to the world, exporting between 1.2 and 1.5 million barrels per day, with experts warning a ban on shipments abroad could put further pressure on prices in other countries.\n\"We're thinking about it very seriously,\" Trump said of an export ban at the weekend.\nOn Thursday Trump added that he may ask European countries to release some of their diesel reserves, while Bessent said they should do so \"immediately\".\n\"Our European partners should accelerate delivery on their existing commitments and make additional supplies immediately available to address ongoing disruptions,\" Bessent said in a post on social media.\nThe plans come weeks ahead of November elections in the US, where control of Congress will be up for grabs. The president is set to travel across the US campaigning for Republicans in hopes of keeping control of the House and Senate.\nDiesel prices in the UK hit record highs this week and are hovering just under 200p per litre, according to motoring organisation the RAC.\nBritain's Energy Minister Martin McCluskey was on a call with European counterparts on Thursday to discuss the potential ban.\nA source familiar with the discussions told the BBC it was prudent to prepare a co-ordinated response with other countries, including those across EU, but added that there were still European reserves left from a coordinated release of strategic fuel stocks earlier in the year.\n\"We have a diverse and resilient supply. We continue to engage with our international partners and the UK fuel industry,\" a government spokesperson said. The government has stressed that there is no cause for concern about potential diesel shortages, though prices are expected to rise further.\nWhat a US diesel export ban could mean for you\n- Published3 days ago\nA European Commission spokesperson said today that there were \"lots of calls, lots of meetings\" taking place on the diesel situation, including with \"high level contacts\" in the US administration.\nPrices of petrol and diesel globally have skyrocketed since the outbreak of the US-Israel war in Iran in February. The closure of the vital Strait of Hormuz, which typically transports around a fifth of the world's oil and gas, has pushed up the price of products made from oil.\nAn export ban from Russia, also a major supplier of diesel, has added to the pressure on prices.\nTrump has argued that keeping any surplus barrels of diesel in the US would lower pump prices domestically, offering immediate relief to drivers, truckers, and businesses ahead of the midterm elections.\nBut David Fyfe, chief economist at Argus Media, said cutting off American supply would likely cause international prices to skyrocket.\nDiesel prices have hit an all-time high in the UK, with the latest RAC figures showing average pump prices at 199.79p per litre, up from 142.38p\nDiesel is harder to refine than gasoline and, because it is used by the haulage industry and in agriculture, it is very difficult to reduce demand.\nThe UK is heavily reliant on imports. Although the four refineries in the UK make more than enough petrol to meet demand, they do not make enough diesel for the country's needs.\nThere were 15.1 million diesel vehicles on UK roads at the end of June, according to the Department for Transport. That is a drop from 15.7 million a year before.\nThere were 9.8 million diesel cars, down year on year from 10.4 million.\nRelated topics\n- Published3 days ago\n- Published3 days ago",

ions told the BBC it was prudent to prepare a co-ordinated response with other countries, including those across EU, but added that there were still European reserves left from a coordinated release of strategic fuel stocks earlier in the year.\n\"We have a diverse and resilient supply. We continue to engage with our international partners and the UK fuel industry,\" a government spokesperson said. The government has stressed that there is no cause for concern about potential diesel shortages, though prices are expected to rise further.\nWhat a US diesel export ban could mean for you\n- Published3 days ago\nA European Commission spokesperson said today that there were \"lots of calls, lots of meetings\" taking place on the diesel situation, including with \"high level contacts\" in the US administration.\nPrices of petrol and diesel globally have skyrocketed since the outbreak of the US-Israel war in Iran in February. The closure of the vital Strait of Hormuz, which typically transports around a fifth of the world's oil and gas, has pushed up the price of products made from oil.\nAn export ban from Russia, also a major supplier of diesel, has added to the pressure on prices.\nTrump has argued that keeping any surplus barrels of diesel in the US would lower pump prices domestically, offering immediate relief to drivers, truckers, and businesses ahead of the midterm elections.\nBut David Fyfe, chief economist at Argus Media, said cutting off American supply would likely cause international prices to skyrocket.\nDiesel prices have hit an all-time high in the UK, with the latest RAC figures showing average pump prices at 199.79p per litre, up from 142.38p\nDiesel is harder to refine than gasoline and, because it is used by the haulage industry and in agriculture, it is very difficult to reduce demand.\nThe UK is heavily reliant on imports. Although the four refineries in the UK make more than enough petrol to meet demand, they do not make enough diesel for the country's     "id": "nike-shares-drop-as-retailer-posts-disap-4980f3f6",
    "title": "Nike shares drop as retailer posts disappointing sales, announces layoffs as part of restructuring",
    "titleJa": "Nike shares drop as retailer posts disappointing sales, announces layoffs as part of restructuring",
    "summaryJa": "Nike is expected to post another quarter of declining sales as the company tries to turn around its business and regain growth in China.",
    "bodyOriginal": "Nike on Thursday posted a mixed fiscal first quarter and announced a restructuring plan that will lead to layoffs starting next year.\nThe company also offered a full-year outlook, saying it expects revenues to decline by a high-single digit percentage in fiscal 2027. Nike also said it expects adjusted earnings per share to be in a range of $1.15 to $1.35.\nShares of Nike fell roughly 3% in extended trading Thursday.\nHere's what the company reported for the period compared to what analysts expected, according to consensus estimates from LSEG:\n- Earnings per share: 48 cents vs. 43 cents expected\n- Revenue: $11.21 billion vs. $11.32 billion expected\nNike reported net income of $712 million, down 2% from $727 million the year prior.\nRevenue fell 4% to $11.21 billion. The retailer said Nike brand revenues took a hit largely due to sustained declines in the China business. Revenue in the market dropped 26%. CEO Elliott Hill said on a call with analysts that the company is \"moving with urgency\" to improve its business in the region.\nIts North America revenue came in at $5.13 billion, just above estimates of $5.11 billion, according to StreetAccount. Nike also reported gross margin of 42.8% compared to estimates of 42.4%.\n\"Despite that progress, our Nike performance business is not yet large enough to offset the pressure we're seeing in Nike Sportswear, Jordan Brand, and Greater China,\" Hill told analysts. \"We're taking deliberate actions to strengthen those businesses, but realizing the full benefit of those efforts will take time.\"\nNike's sportswear segment, which Hill said accounted for just under half of the quarter's revenue, fell by a low-double digit percentage.\n\"Overall, there's a lack of energy in the lifestyle space right now, which is impacting traffic,\" he said on the call. \"Yes, the consumer is cautious, but as the leader in the industry, it's on us to bring more creativity to sportswear.\"\nNike reorganizes\nThe sneaker giant also announced a restructuring plan to \"position Nike for long-term growth.\" The strategy is expected to result in layoffs beginning in 2027, though the company did not provide any further details on how many jobs it would cut.\n\"This work will result in fewer roles across Nike, and I want to acknowledge that news like this creates uncertainty. I don't take that lightly,\" Hill wrote in a letter to the company.\nThe cuts are the third round of layoffs Nike has announced this year.\nThe company said it plans to focus on its supply chain modernization, organizing into three geographies, building a new campus in India and changing its work and workforce. Those geographic regions will be the Americas; the Asia Pacific and Greater China; and Europe, the Middle East and Africa.\nThe strategy, which Nike has dubbed Pace, is expected to deliver approximately $2.5 billion in savings through fiscal 2031. It'll also result in a 15-cent restructuring expense to fiscal 2027 earnings per share, the company added.\n\"We expect Pace to streamline decision making, so we can capture demand faster and improve productivity, while also creating greater capacity to invest in what has always set Nike apart: serving athletes, creating industry-leading innovation and building the world's strongest sports brands,\" Hill said on the conference call.\nThe retailer has been in the midst of a turnaround plan, focused on improving separate parts of its business at different rates based on priority. The Nike consumer has also been under increased macroeconomic pressure as geopolitical tensions and higher inflation lead to slower spending.\nShares of Nike have plummeted more than 40% this year.",

also announced a restructuring plan to \"position Nike for long-term growth.\" The strategy is expected to result in layoffs beginning in 2027, though the company did not provide any further details on how many jobs it would cut.\n\"This work will result in fewer roles across Nike, and I want to acknowledge that news like this creates uncertainty. I don't take that lightly,\" Hill wrote in a letter to the company.\nThe cuts are the third round of layoffs Nike has announced this year.\nThe company said it plans to focus on its supply chain modernization, organizing into three geographies, building a new campus in India and changing its work and workforce. Those geographic regions will be the Americas; the Asia Pacific and Greater China; and Europe, the Middle East and Africa.\nThe strategy, which Nike has dubbed Pace, is expected to deliver approximately $2.5 billion in savings through fiscal 2031. It'll also result in a 15-cent restructuring expense to fiscal 2027 earnings per share, the company added.\n\"We expect Pace to streamline decision making, so we can capture demand faster and improve productivity, while also creating greater capacity to invest in what has always set Nike apart: serving athletes, creating industry-leading innovation and building the world's strongest sports brands,\" Hill said on the conference call.\nThe retailer has been in the midst of a turnaround plan, focused on improving separate parts of its business at different rates based on priority. The Nike consumer has also been under increased macroeconomic pressure as geopolitical tensions and higher inflation lead to slower spending.\nShares of Nike have plummeted more than 40% this year.",

    "id": "trump-could-target-three-fed-governors-r-f6ac8935",
    "title": "Trump could target three Fed governors. Removing them may be harder than it looks",
    "titleJa": "Trump could target three Fed governors. Removing them may be harder than it looks",
    "summaryJa": "Trump could seek to remove Jerome Powell, Lisa Cook and Michael Barr from the Federal Reserve, but court rulings and lengthy litigation could limit him.",
    "bodyOriginal": "President Donald Trump has new ammunition he can use in his campaign against his perceived opponents at the Federal Reserve, although a watchdog report released Wednesday found no basis for criminal charges stemming from the Fed's costly renovations to its headquarters.\nCombined with separate disputes involving governors Lisa Cook and Michael Barr, Trump's decision to pin the headquarters spending issues on former Chair Jerome Powell means the president could potentially seek the removal of as many as three of the Fed's seven board members. But recent court rulings suggest any attempt would face significant legal hurdles.\nAny legal maneuvers could take months to play out and may have the effect of persuading his targets to postpone any plans to leave the Fed, as Powell has already done. Trump's ability to force the Fed off its recent decision to raise interest rates appears limited, despite the institutional damage he could do if he took further legal action.\nTrump appears to be weighing his options for how to proceed. The Fed is scheduled to announce its latest interest-rate decision on Oct. 28, only days before the Nov. 3 midterm election. The administration faces a deadline in the Cook case shortly after the election.\nIf the administration does move against any of the three governors, it may backfire for Trump, said Scott Alvarez, a former Fed general counsel.\n\"All have an incentive to litigate and stay,\" Alvarez said.\n\"The Supreme Court said that Lisa Cook can stay while the litigation goes on. If they all stay while he goes on, then all he's done is hurt his own agenda,\" Alvarez said of Trump.\nTrump fumed in the wake of Wednesday's report from the Fed's inspector general. \"Powell is a disaster,\" the president said Wednesday when asked by reporters about the findings. Powell \"should not be sitting on the Federal Reserve Board.\"\nTrump appointed Powell during his first term, then quickly soured on him.\nTrump asked Attorney General Todd Blanche to review the IG report. A spokesman for Jeanine Pirro, the U.S. attorney for the District of Columbia said her office was also reviewing the report.\nThe Department of Justice didn't respond to emailed questions about its plans and how Blanche's review might differ from Pirro's. Pirro previously oversaw a criminal investigation into Powell. A judge quashed her subpoenas in the matter, saying their \"dominant (if not sole) purpose is to harass and pressure Powell.\"\nThe Fed declined to comment on Trump's remarks about Powell.\nThe long-awaited IG report found a raft of managerial problems had allowed construction costs to jump by about a billion dollars as the Fed renovated its Washington office space. But the report found no evidence of administrative misconduct and saw nothing meriting a criminal referral to prosecutors.\n\"I personally don't think the renovation report would be enough for a court to remove Jay for cause,\" Alvarez said. \"It exonerates him on the criminal side, but it also says they didn't identify any administrative misconduct.\"\nThe report details how bureaucratic disorganization left the Fed vulnerable to overspending on a project to renovate and connect a pair of historical federal buildings in Washington. The IG's office faults the Fed for failing to enforce a guaranteed maximum price for the project, among other issues.\nBut the backward-looking report can't directly prove the Fed would have saved money had it operated better. It acknowledges in a footnote that better management \"does not necessarily mean the project's overall cost will be lower.\"\nNor does the report pin the cost overruns on Powell or any individual governor, instead describing failures in project management, contracting and the board's governance and oversight systems. The IG's office notes that the board delegated responsibility to the staff, as it would have expected for a construction project at a large organization.\nPowell can stay on the Fed as a governor through January 2028. He said in March he would remain until the legal threat was \"well and truly over, with transparency and finality.\"\nThe Supreme Court in June blocked Trump's attempt to remove Cook over allegations that she had lied on a mortgage application. The court said she was owed notice of the allegations and a chance to respond, and issued guidance for what a later finding of cause might entail.\nAs of August, Cook has received the notice and opportunity to respond, removing one obstacle to her potential removal. The administration would still need to show courts it has met the threshold for cause, which would likely require another Supreme Court review.\nThe White House hasn't publicly addressed the issue since Cook's response, though in an interview published by Time on Thursday Trump complained about Cook. The White House declined to comment on how the president might respond further to the IG report's findings.\nNewly confirmed Fed Chairman Kevin Warsh is \"controlled to a certain extent\" by the board, Trump said. \"We have Lisa on there,\" he said.\nFor now, the Cook case is pending before U.S. District Court Judge Jia Cobb. She has asked the parties for a joint status report by Nov. 6 on how the litigation should proceed.\nMeanwhile, an outside investigation into the Fed's handling of the 2023 failure of Silicon Valley Bank is ongoing. A preliminary report by the investigative firm Starling Advisory Group faulted the Fed's bank supervisors, whom it said should have known about the risks to the bank as much as a year ahead of its failure.\nThe preliminary review doesn't assign responsibility to Barr personally. But the White House heaped the blame for the episode at Barr's feet, while stopping short of calling for his firing.\nThere may not be evidence enough in that report to justify his removal to a skeptical judiciary.\nBut some in the Fed believe Trump has already proved the administration is willing to act on thin evidence.\nPowell issued an extraordinary statement in January after subpoenas for evidence involving the renovation.\n\"This new threat is not about my testimony last June or about the renovation of the Federal Reserve buildings,\" Powell said. \"Those are pretexts.\"",
    "bodyJa": "President Donald Trump has new ammunition he can use in his campaign against his perceived opponents at the Federal Reserve, although a watchdog report released Wednesday found no basis for criminal charges stemming from the Fed's costly renovations to its headquarters.\nCombined with separate disputes involving governors Lisa Cook and Michael Barr, Trump's decision to pin the headquarters spending issues on former Chair Jerome Powell means the president could potentially seek the removal of as many as three of the Fed's seven board members. But recent court rulings suggest any attempt would face significant legal hurdles.\nAny legal maneuvers could take months to play out and may have the effect of persuading his targets to postpone any plans to leave the Fed, as Powell has already done. Trump's ability to force the Fed off its recent decision to raise interest rates appears limited, despite the institutional damage he could do if he took further legal action.\nTrump appears to be weighing his options for how to proceed. The Fed is scheduled to announce its latest interest-rate decision on Oct. 28, only days before the Nov. 3 midterm election. The administration faces a deadline in the Cook case shortly after the election.\nIf the administration does move against any of the three governors, it may backfire for Trump, said Scott Alvarez, a former Fed general counsel.\n\"All have an incentive to litigate and stay,\" Alvarez said.\n\"The Supreme Court said that Lisa Cook can stay while the litigation goes on. If they all stay while he goes on, then all he's done is hurt his own agenda,\" Alvarez said of Trump.\nTrump fumed in the wake of Wednesday's report from the Fed's inspector general. \"Powell is a disaster,\" the president said Wednesday when asked by reporters about the findings. Powell \"should not be sitting on the Federal Reserve Board.\"\nTrump appointed Powell during his first term, then quickly soured on him.\nTrump asked Attorney General Todd Blanche to review the IG report. A spokesman for Jeanine Pirro, the U.S. attorney for the District of Columbia said her office was also reviewing the report.\nThe Department of Justice didn't respond to emailed questions about its plans and how Blanche's review might differ from Pirro's. Pirro previously oversaw a criminal investigation into Powell. A judge quashed her subpoenas in the matter, saying their \"dominant (if not sole) purpose is to harass and pressure Powell.\"\nThe Fed declined to comment on Trump's remarks about Powell.\nThe long-awaited IG report found a raft of managerial problems had allowed construction costs to jump by about a billion dollars as the Fed renovated its Washington office space. But the report found no evidence of administrative misconduct and saw nothing meriting a criminal referral to prosecutors.\n\"I personally don't think the renovation report would be enough for a court to remove Jay for cause,\" Alvarez said. \"It exonerates him on the criminal side, but it also says they didn't identify any administrative misconduct.\"\nThe report details how bureaucratic disorganization left the Fed vulnerable to overspending on a project to renovate and connect a pair of historical federal buildings in Washington. The IG's office faults the Fed for failing to enforce a guaranteed maximum price for the project, among other issues.\nBut the backward-looking report can't directly prove the Fed would have saved money had it operated better. It acknowledges in a footnote that better management \"does not necessarily mean the project's overall cost will be lower.\"\nNor does the report pin the cost overruns on Powell or any individual governor, instead describing failures in project management, contracting and the board's governance and oversight systems. The IG's office notes that the board delegated responsibility to the staff, as it would have expected for a construction project at a large organization.\nPowell can stay on the Fed as a governor through January 2028. He said in March he would remain until the legal threat was \"well and truly over, with transparency and finality.\"\nThe Supreme Court in June blocked Trump's attempt to remove Cook over allegations that she had lied on a mortgage application. The court said she was owed notice of the allegations and a chance to respond, and issued guidance for what a later finding of cause might entail.\nAs of August, Cook has received the notice and opportunity to respond, removing one obstacle to her potential removal. The administration would still need to show courts it has met the threshold for cause, which would likely require another Supreme Court review.\nThe White House hasn't publicly addressed the issue since Cook's response, though in an interview published by Time on Thursday Trump complained about Cook. The White House declined to comment on how the president might respond further to the IG report's findings.\nNewly confirmed Fed Chairman Kevin Warsh is \"controlled to a certain extent\" by the board, Trump said. \"We have Lisa on there,\" he said.\nFor now, the Cook case is pending before U.S. District Court Judge Jia Cobb. She has asked the parties for a joint status report by Nov. 6 on how the litigation should proceed.\nMeanwhile, an outside investigation into the Fed's handling of the 2023 failure of Silicon Valley Bank is ongoing. A preliminary report by the investigative firm Starling Advisory Group faulted the Fed's bank supervisors, whom it said should have known about the risks to the bank as much as a year ahead of its failure.\nThe preliminary review doesn't assign responsibility to Barr personally. But the White House heaped the blame for the episode at Barr's feet, while stopping short of calling for his firing.\nThere may not be evidence enough in that report to justify his removal to a skeptical judiciary.\nBut some in the Fed believe Trump has already proved the administration is willing to act on thin evidence.\nPowell issued an extraordinary statement in January after subpoenas for evidence involving the renovation.\n\"This new threat is not about my testimony last June or about the renovation of the Federal Reserve buildings,\" Powell said. \"Those are pretexts.\"",

    "summaryJa": "Several self-inflicted mistakes have cost the biggest sportswear brand on the planet in recent years.",
    "bodyOriginal": "What's gone wrong at Nike? How the world's sportswear giant lost its mojo\n- Published\nIt's been a difficult few years for Nike.\nThe largest sportswear brand on the planet, named after the ancient Greek goddess of victory, has been losing of late. Losing sales, losing customers and losing ground to its rivals.\nThe one-time industry disruptor is now the establishment and in the middle of a tricky turnaround plan aimed at clinging on to market dominance.\nNike's latest financial results show signs a turnaround strategy put in place by company veteran Elliott Hill, who was coaxed out of retirement two years ago to lead the firm, is working - but the pace of change is more marathon than sprint.\nHowever, its recovery has been dented by the loss of football star Kylian Mbappé, who ended his 20-year association with the brand last week to join fast-growing Swiss rival, On.\nThe Real Madrid striker's departure raises the question of whether Nike can remain the top logo for not just elite athletes, but also the fans that idolise them.\nTo be clear, Nike is still a mega brand and popular the world over. But missteps have seen hundreds of billions of dollars wiped off its stock market value as its share price tumbled by 75% over five years.\nLast month, Nike was ejected from the S&P 100 stock market index of the biggest blue-chip firms in the US.\nSo what's gone wrong? And can Hill turn things around?\nMatt Powell, a veteran analyst and adviser in the sports retail industry, reckons Nike has made \"several strategic errors\" which have been difficult to reverse, including cutting ties with retailers to sell only direct to customers online and making limited editions items more available.\n\"The more broadly available those shoes became, the fewer people were interested,\" Powell says.\nOther self-inflicted wounds he suggests include spending research and development cash on digital operations rather than new products.\n\"They really shut down their innovation on product. Someone jokingly said they were trying to turn Nike into eBay.\"\nThat jibe was aimed at John Donahoe, the former eBay boss behind Nike's online direct-to-consumer sales pivot, before he made way for Hill.\nDonahoe's four years at Nike coincided with the company's share price plunge.\nHis tenure saw sales initially soar, driven by pandemic restrictions that boosted online shopping, but subsequent cost-of-living pressures curbed customer spending.\nAs demand weakened overseas in key markets like China, Nike announced cost cuts and redundancies.\nIts digital distraction allowed newer footwear firms on top of the trends to snap at its heels. Shop shelf space previously occupied by Nike was replaced by brands such as On and Hoka.\nThis was a stark warning to a company that prided and built itself on innovation.\nNike was the firm that signed a deal with a rookie called Michael Jordan in the mid-1980s at a time when the company wasn't a major player in basketball and still mostly known for its running trainers.\nThe gamble - spending its entire basketball budget on Jordan before he had even competed in the NBA - made Nike what it is today.\nThe company built a shoe brand around him - Air Jordan. The red and black colours broke NBA rules, but Nike used it as a marketing stunt and paid the fines.\nIn years that followed Nike partnered with generational talents Tiger Woods, Serena Williams and Cristiano Ronaldo, who all donned the Swoosh on their way to golf, tennis and football greatness.\nWhile the brand retains partnerships with long-retired Jordan, plus Williams and Ronaldo - Woods ended his association in 2024.\n\"[I'm] not saying that what they did wasn't great, but it was in the past,\" said Tim Derdenger, an academic in marketing and strategy. \"It's not the future and it's not the current and that is what drives apparel sales today.\"\nNike's books still boast top athletes, ranging from Rory McIlory to Vinicius Junior.\nHowever, it has now lost its biggest footballing star in Mbappé, who had been with Nike since he was nine years old, along with World Cup winner Lamine Yamal.\nYamal suggested his move to Adidas gave him the chance to stand out from Nike's star-studded roster, while Mbappé said On would see him \"surrounded by innovators who dream of the same things I do\".\nWas that a parting dig at Nike?\nDerdenger suggests Mbappé's move had parallels to Jordan's decision decades earlier to choose Nike over Converse and Adidas due to the opportunity for the athlete to become synonymous with one brand.\n\"Athletes have egos and those egos want them to be a part of something big and that they're the ones that are helping drive that change, that growth.\"\nNike down but not out\nFor all the \"doom and gloom\", Nike will stay number one, according to Powell - millions worldwide, including young people, remain loyal - but its mistakes have dented its dominance.\n\"Will Nike be the gorilla they once were? I don't think so. Can the brand come back to growth and profitability? Yes,\" Powell says.\n\"When you shut down innovation, you don't turn it back on and it goes right back to full speed,\" he adds.\nPowell thinks Nike's turnaround plan, called \"Sport Offense\", will start to show positive signs next year.\nHill said Nike had \"more work to do\" on its sportswear, Jordan brand and in China as the company announced quarterly revenues of $11bn, which undershot analysts' expectations.\nThe company said it expected revenues to decline by \"high-single digits\" in the financial year ahead, adding that it planned to make savings of $2.5bn by 2031, some of which will result in job losses.\nLast year the company launched a spin-off campaign to its iconic \"Just Do It\" slogan aimed at younger generations with the line \"Why Do It?\"\nYoung people, and future sporting stars, may ask themselves: Why Nike?\n- Published19 September 2024\n- Published28 June 2024",

    "summaryJa": "Oil prices rose sharply Thursday following a report the U.S. is sending a third aircraft carrier strike group to the Middle East.",
    "bodyOriginal": "Crude oil prices rose sharply Thursday following a report the U.S. is sending a third aircraft carrier strike group to the Middle East.\nBrent crude, the international benchmark, jumped 4.4% to close at $102.31 per barrel, while U.S. West Texas Intermediate futures climbed 2.7% to settle at $92.87 a barrel.\nU.S. officials told the Wall Street Journal that Marine Corps ships and up to 10,000 additional troops are also being deployed to the region. The forces are expected to arrive by the end of November, the officials said.\nThe USS Theodore Roosevelt left San Diego on a scheduled deployment Sunday, the Journal reported. The USS George H.W. Bush and USS George Washington are currently on station in the Middle East.\nThe deployment could signal the U.S. is preparing to escalate its war against Iran. President Donald Trump has told aides that he expects to start bombing Iran again after the U.S. midterm elections in November, U.S. officials told the Wall Street Journal last week.\n\"The president I think is going to escalate after the midterms; we keep hearing that the Iranians are going to escalate into the midterms,\" Scott Modell, CEO of Rapidan Energy and a former CIA officer, told CNBC's \"Squawk on the Street\" on Monday. \"The direction of travel is toward escalation.\"\nOil prices are rising even as crude flows from the Middle East have effectively recovered to prewar levels. But the bounceback is fragile, with at least three tankers coming under attack this week as they tried to transit the Strait of Hormuz, according to maritime security agencies that monitor the region.\nMeanwhile, fuel shipments from the Middle East are still constrained.\nThe world is facing a major disruption to fuel supplies after Ukrainian strikes on Russian refineries forced Moscow to ban diesel exports. Iran and its Houthi allies have also attacked refineries in the Middle East.\nDiesel prices in the U.S. hit record highs last month and remained elevated Thursday at an average $6.40 per gallon. President Trump has said he is weighing a diesel export ban, but appeared to back off from the idea in more recent public comments.\nMeanwhile, Chinese refiners canceled a handful of gasoline and jet fuel exports planned for October, unnamed sources told Reuters, in a possible sign Beijing is trying to safeguard domestic supplies.",
    "bodyJa": "Crude oil prices rose sharply Thursday following a report the U.S. is sending a third aircraft carrier strike group to the Middle East.\nBrent crude, the international benchmark, jumped 4.4% to close at $102.31 per barrel, while U.S. West Texas Intermediate futures climbed 2.7% to settle at $92.87 a barrel.\nU.S. officials told the Wall Street Journal that Marine Corps ships and up to 10,000 additional troops are also being deployed to the region. The forces are expected to arrive by the end of November, the officials said.\nThe USS Theodore Roosevelt left San Diego on a scheduled deployment Sunday, the Journal reported. The USS George H.W. Bush and USS George Washington are currently on station in the Middle East.\nThe deployment could signal the U.S. is preparing to escalate its war against Iran. President Donald Trump has told aides that he expects to start bombing Iran again after the U.S. midterm elections in November, U.S. officials told the Wall Street Journal last week.\n\"The president I think is going to escalate after the midterms; we keep hearing that the Iranians are going to escalate into the midterms,\" Scott Modell, CEO of Rapidan Energy and a former CIA officer, told CNBC's \"Squawk on the Street\" on Monday. \"The direction of travel is toward escalation.\"\nOil prices are rising even as crude flows from the Middle East have effectively recovered to prewar levels. But the bounceback is fragile, with at least three tankers coming under attack this week as they tried to transit the Strait of Hormuz, according to maritime security agencies that monitor the region.\nMeanwhile, fuel shipments from the Middle East are still constrained.\nThe world is facing a major disruption to fuel supplies after Ukrainian strikes on Russian refineries forced Moscow to ban diesel exports. Iran and its Houthi allies have also attacked refineries in the Middle East.\nDiesel prices in the U.S. hit record highs last month and remained elevated Thursday at an average $6.40 per gallon. President Trump has said he is weighing a diesel export ban, but appeared to back off from the idea in more recent public comments.\nMeanwhile, Chinese refiners canceled a handful of gasoline and jet fuel exports planned for October, unnamed sources told Reuters, in a possible sign Beijing is trying to safeguard domestic supplies.",

    "id": "the-september-jobs-report-will-be-releas-e200ddc0",
    "title": "The September jobs report will be released Friday. Here's what to expect",
    "titleJa": "The September jobs report will be released Friday. Here's what to expect",
    "summaryJa": "Lingering questions over the state of the U.S. labor market could be answered Friday when the Bureau of Labor Statistics presents its nonfarm payrolls count for September.Wall Street is looking for job growth of 84,000 to close out the summer, with the unemployment rate holding at 4.1%, according to the Dow Jones consensus.",
    "bodyOriginal": "Lingering questions over the state of the U.S. labor market could be answered Friday when the Bureau of Labor Statistics presents its nonfarm payrolls count for September.\nWall Street is looking for job growth of 84,000 to close out the summer, with the unemployment rate holding at 4.1%, according to the Dow Jones consensus.\nWhile the top-line payrolls number represents a downshift from the pre-2025 trend, the jobless rate, which Federal Reserve officials watch more closely, is around a level indicating full employment.\nThe September release follows a surprisingly strong gain of 162,000 in August, which also saw upward revisions to prior months.\nFed officials likely will be looking to the number to confirm labor market strength while they simultaneously turn the balance of their attention to the more nettlesome inflation picture.\n\"In the labor market, a broad range of data indicates that conditions have stabilized,\" Fed Vice Chairman Philip Jefferson said in a speech Thursday. \"While job creation has been somewhat volatile, payroll gains have broadened to many sectors in recent months, which is encouraging. Layoffs have remained low, and job openings have moved a bit higher on net.\"\nEven with a solid jobs picture, Fed commentary this week has shifted market expectations for a rate hike near the end of October.\nNew York Fed President John Williams remarked earlier in the week that \"there is no need for urgency\" when policymakers weigh whether to follow up on September's quarter percentage point rate hike with another increase.\n\"On the employment side of [the Fed's twin goals of full employment and stable prices], the data show that the labor market continues to be solid — and has even strengthened a bit on the margin,\" Williams said.\nMarkets subsequently sharply reduced the odds for a hike at the Oct. 27-28 meeting and see a move much more likely in December.\nSlow but steady\nCentral to the argument that the Fed needs to focus on inflation but doesn't need to be in a hurry for another hike is the stable if unspectacular labor picture.\nPayroll growth has averaged 80,000 a month in 2026 but has been erratic, from the loss of 156,000 jobs in February to growth of 214,000 the following month, with hits and misses in between.\nWage growth also has moderated, with average hourly earnings expected to show a 3.1% year-over-year increase in September, down from around 4% at the start of the year. Fed officials have emphasized that wages are not a significant source of inflation, with the lack of evidence of a wage-price spiral an important distinction when calibrating policy.\nStill, there are worries over labor market conditions.\nThe most recent Glassdoor survey shows employee confidence fell to a record low in September, the third time that has happened this year. Daniel Zhao, the job site's chief economist, said the concerns come as \"anxiety around job security, economic uncertainty and inflation mount.\"\nWorkers also cite fear of artificial intelligence.\nHowever, layoffs remain low, with the latest data showing that first-time claims for unemployment insurance edged down to 197,000 last week. Job placement firm Challenger, Gray & Christmas reported Thursday that layoffs in September were off 18% from August and 20% from the same period a year ago.\n\"Job openings are going down, hiring's kind of creeping down, and you find out that anecdotally, anyway, and also in the data, that it's very hard for people to get a new job,\" said Dan North, senior economist at Allianz Trade. \"You have that unemployment rate which doesn't move much, and it's really important to see that historically it's pretty low. So, I think you're seeing a job market that is — 'stable' is a really good word for it.\"",
    "bodyJa": "Lingering questions over the state of the U.S. labor market could be answered Friday when the Bureau of Labor Statistics presents its nonfarm payrolls count for September.\nWall Street is looking for job growth of 84,000 to close out the summer, with the unemployment rate holding at 4.1%, according to the Dow Jones consensus.\nWhile the top-line payrolls number represents a downshift from the pre-2025 trend, the jobless rate, which Federal Reserve officials watch more closely, is around a level indicating full employment.\nThe September release follows a surprisingly strong gain of 162,000 in August, which also saw upward revisions to prior months.\nFed officials likely will be looking to the number to confirm labor market strength while they simultaneously turn the balance of their attention to the more nettlesome inflation picture.\n\"In the labor market, a broad range of data indicates that conditions have stabilized,\" Fed Vice Chairman Philip Jefferson said in a speech Thursday. \"While job creation has been somewhat volatile, payroll gains have broadened to many sectors in recent months, which is encouraging. Layoffs have remained low, and job openings have moved a bit higher on net.\"\nEven with a solid jobs picture, Fed commentary this week has shifted market expectations for a rate hike near the end of October.\nNew York Fed President John Williams remarked earlier in the week that \"there is no need for urgency\" when policymakers weigh whether to follow up on September's quarter percentage point rate hike with another increase.\n\"On the employment side of [the Fed's twin goals of full employment and stable prices], the data show that the labor market continues to be solid — and has even strengthened a bit on the margin,\" Williams said.\nMarkets subsequently sharply reduced the odds for a hike at the Oct. 27-28 meeting and see a move much more likely in December.\nSlow but steady\nCentral to the argument that the Fed needs to focus on inflation but doesn't need to be in a hurry for another hike is the stable if unspectacular labor picture.\nPayroll growth has averaged 80,000 a month in 2026 but has been erratic, from the loss of 156,000 jobs in February to growth of 214,000 the following month, with hits and misses in between.\nWage growth also has moderated, with average hourly earnings expected to show a 3.1% year-over-year increase in September, down from around 4% at the start of the year. Fed officials have emphasized that wages are not a significant source of inflation, with the lack of evidence of a wage-price spiral an important distinction when calibrating policy.\nStill, there are worries over labor market conditions.\nThe most recent Glassdoor survey shows employee confidence fell to a record low in September, the third time that has happened this year. Daniel Zhao, the job site's chief economist, said the concerns come as \"anxiety around job security, economic uncertainty and inflation mount.\"\nWorkers also cite fear of artificial intelligence.\nHowever, layoffs remain low, with the latest data showing that first-time claims for unemployment insurance edged down to 197,000 last week. Job placement firm Challenger, Gray & Christmas reported Thursday that layoffs in September were off 18% from August and 20% from the same period a year ago.\n\"Job openings are going down, hiring's kind of creeping down, and you find out that anecdotally, anyway, and also in the data, that it's very hard for people to get a new job,\" said Dan North, senior economist at Allianz Trade. \"You have that unemployment rate which doesn't move much, and it's really important to see that historically it's pretty low. So, I think you're seeing a job market that is — 'stable' is a really good word for it.\"",
