    "title": "California Gov. Gavin Newsom bans AI 'robo bosses' in landmark state law, reversing his earlier veto",
    "titleJa": "California Gov. Gavin Newsom bans AI 'robo bosses' in landmark state law, reversing his earlier veto",
    "summaryJa": "California Governor Gavin Newsom has banned 'robo-bosses' from firing workers, the first U.S. state with such a law.",
    "bodyOriginal": "California Governor Gavin Newsom has signed a landmark AI law banning Golden State employers from relying solely on artificial intelligence to fire or discipline workers.\nSB 947, dubbed the No Robo Bosses Act, prevents businesses around the state from exclusively using \"automated decision-making systems\" in matters of employee discipline and termination. It also restricts their capacity to use AI as a principal tool in such decisions.\nUnder the bill, employers that rely \"primarily\" on AI output to make termination or disciplinary decisions must now have a human reviewer corroborate those decisions using additional information, such as managerial evaluations, peer reviews, and personnel files. Additionally, affected employees must be provided with written notice that AI was \"primarily used\" in their termination or disciplinary decision, a description of the employee data used by the system, and a human point of contact who can further explain the decision.\n\"No worker should ever be fired or disciplined by a machine, AI or not. Artificial intelligence systems have the potential to boost productivity, but they've also made errors and misjudgments and exhibited bias,\" California State Senator Jerry McNerney, the bill's author, told CNBC. \"AI must remain a tool controlled by humans, not the other way around.\"\nMcNerney, a Democrat, first introduced the act in 2025, following a concerted push by organized labor in the state to erect guardrails around management's ability to use AI in taking adverse action against workers.\n\"When working people organize, we get results. Workers across California have demanded that our state lead the way in regulating AI in our workplaces. And today, we see that begin to happen,\" said Lorena Gonzalez, president of the California Federation of Labor Unions, AFL-CIO and lead sponsor of No Robo Bosses Act, in a statement after Newsom signed it. \"Today, California's workers and our unions have changed the national narrative on how Americans can fight back and win against AI taking over our jobs and workplaces.\"\nNewsom has taken a flurry of recent actions on AI, including signing a broader executive order earlier this month addressing the potential existential risks posed by AI models \"before it's too late,\" and a measure to provide a state framework for independent evaluation and auditing of AI models. Newsom said of the broad EO that the federal government was abdicating \"its responsibility to protect Americans.\"\nThe U.S. is leading the way globally in adoption of automated management software and systems, according to survey results from the OECD published late last year. It found that algorithmic management software is being widely adopted across countries, but nowhere as widely as in the U.S., where 90% of managers say their firms have adopted at least one tool to \"instruct, monitor or evaluate workers.\"\nMeta is facing a lawsuit, filed in July, in which former employees allege AI-assisted systems were used to rank and select workers for layoffs, disproportionately affecting employees who had taken medical or family leave. Meta has denied the allegations.\nWalmart and Amazon workers are increasingly concerned that HR decisions are being automated, according to a May survey released by nonprofit United for Respect, which has its roots in the labor movement and retail sector specifically. The nonprofit failed in an effort last summer to convince Walmart shareholders to approve a measure requiring company management to disclose more on use of AI with the workforce.\nCalifornia's No Robo Bosses Act saw its momentum hit a wall in October when Newsom vetoed it despite clearing both of the state's legislative chambers with overwhelming majority support. Among his concerns, Newsom cited a requirement that would have compelled businesses to alert workers in advance whenever an AI system was in use that could affect work conditions.\n\"I share the author's concern that in certain cases unregulated use of ADS [automated decision-making software] by employers can be harmful to workers,\" the governor noted in his explanation, previewing future willingness to accept similar legislation. \"However,\" he continued, \"rather than addressing the specific ways employers misuse this technology, the bill imposes unfocused notification requirements on any business using even the most innocuous tools.\"\nUpon re-introducing the bill in February after Newsom's resistance, McNerney removed the pre-notification requirement and stripped language that would have extended the Act's protections to gig workers, which had drawn heavy criticism from rideshare giants such as Uber and Lyft. Although these modifications have somewhat blunted the fierce lobbying efforts by tech and commerce groups that played a role in dooming the act's 2025 counterpart, California business leaders still rallied against SB 947 in the weeks leading up to its enactment.\n\"The bill's obligations generally apply when an employer 'primarily relies' on an automated decision system, but that critical term is never defined. Employers are given no objective standard for determining when a technology has moved from merely informing a decision to being a primary basis for it,\" Robert Singleton, the Chamber of Progress' senior director of policy and public affairs for California and US West, wrote in a letter to Newsom earlier this month, urging the governor to veto the bill. \"Uncertainty about whether ordinary tools qualify as regulated automated decision systems could discourage employers from using technologies that improve consistency, identify safety risks, or help managers make better-informed decisions,\" he added.\nFirst such law in nation as public turns on AI ahead of elections\nWhile the aforementioned changes were made specifically to gain Newsom's approval, No Robo Bosses backers also benefitted from the fact that, this time around, the bill hit the governor's desk amidst all-time high public distrust surrounding AI's introduction and continued presence in the workplace. A July Gallup poll found that 39% of Americans believe that AI does more harm than good, an 8% increase from the 31% who felt similarly in 2025. Pew Research, in a study released this past August, similarly found that 71% of Americans think AI will \"take people's jobs,\" an increase of around 7% from around two years ago.\nThis trend has solidified as Newsom weighs running for president in 2028, an election in which AI policy is expected to be a hot-button issue, particularly among Democratic hopefuls. But Democrats aren't alone on the issue. Earlier this month, Steve Hilton, California's Republican nominee for governor, came out in full support of the No Robo Bosses Act.\n\"The California Chamber…says rules requiring human review and basic accountability are too burdensome for employers. What a ridiculous thing for them to say,\" Hilton wrote in an open letter to Gonzalez. \"In some ways, I don't think SB 947 goes far enough,\" he wrote. \"Employers should not be allowed to use AI to decide whether someone is fired, demoted, loses regular hours, or is shut out of the program they rely on for income.\"\nCalifornia businesses will be the first to navigate its distinct regulatory framework, which establishes a largely unprecedented level of oversight over workplace AI use. Some local regulations throughout the past five years have imposed restrictions on how AI can be used in employment decisions, perhaps most notably Illinois' Public Act 103-0804, which also requires employers to notify workers when they use AI for a set of specified employment purposes. However, these restrictions have never gone to the lengths now seen under California law. Even the Illinois law, which went into effect this past January, stops short of an outright prohibition on deploying agentic digital systems for employment decisions.\nWhile the No Robo Bosses Act is the first of its kind to become law, many other bills currently sit in limbo across the nation, designed to fulfill the very same purpose. This past June, U.S. Senators Ed Markey (D.-Mass.) and Brian Schatz (D.-Hawaii), both Democrats, introduced federal legislation donning the same name, which would bar employers from \"relying on automated decision systems to make work-related decisions.\" Markey's bill, presented to a Congress that has been slow to develop any sort of legislation regulating AI, was effectively dead on arrival. A number of states, including New York, Louisiana, and New Jersey, have seen similar legislation be proposed but have yet to act on their own accord.\nEarlier this year, New York became the first state in the nation to enact a ban on the construction of new AI data centers.\nCalifornia's action may have just provided the push other states need to move on workplace AI legislation.\nLeft-leaning civil liberties nonprofit Electronic Frontier Foundation said in a statement to CNBC that signing the law is a \"strong step toward giving workers the protections they need in workplaces that use automated decisionmaking systems\" and it planned to continue its work with labor groups to \"advance policies that protect human dignity in the workplace.\"",

    "id": "the-ai-telling-farmers-when-to-harvest-ab1be124",
    "title": "The AI telling farmers when to harvest",
    "titleJa": "The AI telling farmers when to harvest",
    "summaryJa": "Will farmers want AI tools to help judge when to pick fruit, or is their own intuition enough?",
    "bodyOriginal": "The AI telling farmers when to harvest\n- Published\nWhen the first day of the apple harvest rolled around in Washington State last year, the fruit was ripe and the pickers were ready – but the weather had other ideas.\n\"It was like 38C… it's not safe for people to work in that heat,\" recalls Joel Carter at Okanagan Specialty Fruits. \"We had to stop at 10 o'clock in the morning.\"\nHe says that artificial intelligence (AI) models that forecast ideal harvest dates, taking into account the weather, would be useful. \"You need to know more than just when your fruit is going to be ripe. How long do you have to pick it?\" he says. \"That's where these models are really helpful.\"\nCarter's company has more than 1,250 acres of apple orchards in Washington, and the fruit is grown for sliced apple portions – often sold to hotels and schools, for example. The firm is investing in technology with the hope of maximising productivity. Even the apples are genetically engineered so that they don't brown easily once cut.\nBut planning a harvest is tricky. New tools that count and analyse fruit on the tree or vine, and predict when crops will ripen, are emerging. It matters because prices for fruit, especially high-value berries such as strawberries or blueberries can fluctuate wildly. Getting the harvest date wrong means you book seasonal workers when you don't actually need them, and risk missing out on the biggest profits.\nOkanagan Specialty Fruits is already experimenting with cameras from a Canadian firm called Vivid Machines. The cameras are mounted atop tractors and they scoop up imagery of the apple trees as the tractor trundles by. AI identifies buds, flowers or fruit in that footage.\n\"Right now, Vivid is telling us crop estimates and harvest dates,\" says Carter. He notes that the system is good at picking out very tiny flower buds, which are hard to see at a glance with the naked eye.\nBut the accuracy of forecasts is noticeably dependent on the quality of historical information fed in to the system, adds Carter. \"This isn't something where an AI can scrape the internet and figure out what's the average [yield] for Granny Smith,\" he explains. \"It's going to be bespoke to your farm.\"\nApples are at least somewhat forgiving – the harvest window for those Granny Smiths is three weeks long, says Carter. For other fruit, such as berries, you might only have a few days.\n\"If a strawberry crop is on, you have to harvest it – otherwise your entire crop gets diseased very, very quickly,\" says Raymond Martin, co-founder and chief operating officer of FruitCast, a UK company that offers harvest forecasts to fruit growers here.\nHis firm offers growers crop predictions for strawberries and also raspberries, blackberries, blueberries and tomatoes. \"We're moving on to grapes next year,\" adds Martin.\nDon't experienced farmers know when their fruit will be ripe, I ask? Martin says they generally do – but not necessarily across their entire farm, which might be many acres in size, or have both outdoor and indoor growing areas. \"We do exactly what the farmers could do but we just do it on a scale that they can't.\"\nThe system analyses footage of ripening fruit that can be captured by drones, someone walking up and down a field with a smartphone, or a camera mounted on a farm vehicle.\nThis year has been challenging, notes Martin, with hot weather and severe drought hitting much of the UK. This has stressed many fruit plants, putting them into thermal dormancy and slowing down fruit production.\nThe FruitCast model accounts for weather and irrigation conditions in its forecasts. The company says, \"our forecasts land within 10% of actual picked volume one week out (90% accurate) and within 17% three weeks out (83% accurate). We guarantee less than 20% error…\"\nAngus Soft Fruits is one company that has worked with FruitCast. AI tech for forecasting fruit ripeness is not yet \"a finished solution\" says operations director Neill Finlayson: \"This journey is still ongoing and, whilst significant progress has been made, the industry remains some way from achieving a fully integrated forecasting ecosystem.\"\nDriscoll's, a California headquartered fruit seller with a big operation in the UK, also confirmed to BBC News that some of its independent fruit growers in the UK have used FruitCast's technology.\nResearchers are also exploring new ways of analysing fruit in intense detail. Many farmers already use handheld brix meters to gauge the sugar content of their crop. These devices work by measuring how much light has changed direction, or refracted, after passing through a liquid – indicating the volume of solids present.\nSome such meters use infrared light, meaning there's no need to cut into the fruit to take measurements. But Yasaman Ghasempour at Princeton University says millimetre waves, high frequency radio waves, can penetrate deeper \"They basically respond very well to humidity, water [and sugar],\" she says.\nShe and her students have come up with a millimetre wave-based ripeness detector, external that could be used by farmers – or even customers searching for perfectly ripe fruit in shops. Her students tried it out at a local market in New Jersey. \"[Staff] there got kind of scared that we were doing something shady,\" laughs Ghasempour.\nSuch fine-grained analysis of fruit, if currently unripe, could also help inform forecasts of when it will be ripe.\nBut while some growers, such as Carter, are interested in trying out new tech, many will wonder whether investing in it is really worthwhile. \"Adoption is very complicated,\" says Jing Zhang at North Carolina State University. \"The grower has to have confidence in the research and whether or not it works.\"\nZhang has been working on a system to automatically count the number of blueberries, external captured in smartphone images of blueberry bushes.\nThe simplest systems need not be expensive. Kevin Wang at the University of Florida has developed another crop-counting tool that can harvest imagery, external from $100 (£74) drones.\nIn the future, such information could feed in to ripeness predictions. However, he points out that some farmers might be uneasy about sharing commercially sensitive information about their growing strategies, such as fertiliser and irrigation plans, with third parties and AI models.\nBen Palone is senior director of automation and commercialisation at Western Growers, an association that represents farmers in the western US. He says harvest forecasts have some potential as \"an optimisation tool\".\nBut farmers will likely continue to rely on human intelligence. \"Growers like to have people in the mix to make some of those very critical decisions – especially when it comes to harvests,\" he says.\n- Published19 August\n- Published12 August\n- Published7 August",

    "summaryJa": "Vape prices to rise as new tax takes effect- Published",
    "bodyOriginal": "Vape prices to rise as new tax takes effect\n- Published\nThe price of vapes is set to rise as a new tax comes into effect, with the aim of making vaping less attractive to children and young people.\nThe Vaping Product Duty will be imposed at a rate of £2.20 per 10ml of e-liquid. However, many customers will not see a jump in prices immediately, as sellers have six months to sell old stock at the pre-duty price.\nThe government wants to reduce the appeal of vapes by making them more expensive, as more evidence of its adverse effect on health comes out, particularly on children and young people.\nThe vaping industry has lobbied against the new tax, saying that affordable vapes help people to quit smoking.\nThe duty will apply to all vaping products regardless of whether they contain nicotine.\nTobacco rates were also raised on Thursday, by £2.20 per 100 cigarettes or 50g of tobacco. HMRC said this maintains the financial incentive for smokers to switch to vaping.\nStocking up v cutting down\nThe BBC spoke to vapers in Reading who had mixed views on whether the new tax would encourage people to quit.\nMackenzie Bird, 19, has been a regular vaper for three years. She said she was \"fine\" with the duty and it wouldn't stop her from vaping.\n\"I don't know how many people it'll actually deter,\" she said.\n\"I'll probably just stock up.\"\nHowever, Cara Lewis-Rimes and Dylan Killner said they might reconsider the habit in light of higher prices.\nCara said she thinks the changes will force vapers to cut down because of the cost of living.\nDylan said he might be inclined to quit altogether.\n\"I don't think it's doing me any favours... the health factor around it as well is not great.\"\nFighting illegal trade\nHMRC is also launching a stamp for vaping products which are traceable throughout the supply chain.\nAll vapes sold in the UK must carry this stamp from April.\nThe new tax is also an effort to combat illicit trade, which is a growing problem on UK high streets. Last month, the prime minister announced new powers for councils that will address the decline of the high street, including the amount of vape shops.\nChanges to planning law in England mean every new shop selling e-cigarettes, or vapes, would need to apply to their local council for permission to open.\nHealth Minister Karin Smyth said: \"These measures are an important step in our ambition to tackle youth vaping by reducing the affordability of vaping products, which goes hand-in-hand with the work we are already doing to tackle the appeal and availability of vapes on our high streets.\"\nJames Murray, the Financial Secretary to the Treasury, said the government was \"backing all those retailers who play by the rules\".\nBut Jordan Apap, a sales assistant in Berkshire Vapers, said the new tax would \"put a lot of strain on legitimate vape shops\" that provide more specialist advice and services than convenience stores and phone shops that sell vapes.\n\"There is a real and genuine risk that we will cease to exist within a year or two,\" he said.\nVaping rates for schoolchildren appear to drop - is it falling out of favour?\n- Published22 September\nPolice raid barbers and vape shops suspected of being fronts for crime gangs\n- Published10 April 2025\nJohn Dunne, the director general of the UK Vaping Industry Association, said: \"This is nothing short of a tax on public health.\"\nHe said vapes had helped \"millions of adults cut down on or stop smoking\".\n\"Protecting young people is essential. But that means stronger enforcement against illegal and rogue traders, not making legal vaping more expensive for adults trying to stay away from cigarettes.\"\nExperts say vaping is much safer than smoking, but it is not risk free and the long-term effects are less clear.\nA recent review of vaping studies found that it had an association with problems in children and young people including wheezing and coughing, poor oral and dental health, poor sleep, mental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha",

    "titleJa": "Energy bills are going up - here's what you can do about it",
    "summaryJa": "Household energy bills have risen again but there are ways to keep a lid on your expenditure.",
    "bodyOriginal": "Energy bills are going up - here's what you can do about it\n- Published\nEnergy prices have now risen by nearly 4%, with forecasts of a much bigger jump to come in January.\nRegulator Ofgem's price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity.\nForecasters have suggested a 16% increase is possible in January, due to high wholesale prices paid by suppliers as a result of the conflict in the Middle East.\nWhile that's beyond consumers' control, charities say the government should offer more support - beyond a VAT cut on electricity bills which takes effect on Thursday - and households should reset for winter again.\nThat includes reading the meter now, and taking other steps to keep a check on rising bills.\n1. Consider switching to a fixed rate\nThe energy regulator, Ofgem, is advising people to consider fixing - so that the price you are charged per unit of gas or electricity does not change every three months, although the total bill will still vary depending on how much energy you use.\nThe trouble is that it is very difficult to work out whether a fixed deal is a good deal at the moment.\nShould energy prices rise sharply, then those who have fixed already have the certainty of what they will pay for each unit of energy. That price may well be lower than the forecast price in January.\nHowever, if events in the Gulf region settle down, and a peace deal in the Iran war leads to lower international gas prices, then a longer-term fix might not seem such good value compared with the price cap.\nSo consumer group Which? also recommends keeping an eye on any exit fees when picking a fixed deal. If variable prices fall below your fixed rate and you want to get out of it before the end of your agreement period, you may have to pay a hefty sum.\nBefore you fix, consumer website MoneySavingExpert advises you look at all the deals available, not just what your own supplier is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",

r is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",

    "id": "trump-thinking-about-diesel-export-ban-b-ef8c1d13",
    "title": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "titleJa": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "summaryJa": "Trump recently said he was \"very seriously\" considering a diesel export ban, despite warnings from the U.S. oil industry that doing so would raise prices.",
    "bodyOriginal": "President Donald Trump on Wednesday said he is still \"thinking about\" banning diesel exports in an attempt to get a handle on high energy prices, but noted that doing so may have a \"negative impact on gasoline.\"\nTrump, asked in the Oval Office if he has decided on a ban, said his aides think it would help diesel \"but it might raise the price of other things.\"\n\"And I think we're in a good place because oil prices are going to start to come down,\" Trump added.\nJust three days earlier, Trump said he was \"very seriously\" considering the move, despite warnings from the U.S. oil industry that it would force refineries to cut production and ultimately raise domestic energy prices.\nBut his latest comments appeared to show him cooling to the idea of an export ban, even as he declined to rule it out entirely.\n\"We're in a very good place,\" Trump said, highlighting a recent resurgence in crude exports through the Strait of Hormuz.\nThe strait is a major throughway for the global oil trade that saw ship traffic stifled after the U.S. and Israel attacked Iran in late February. But this week it saw daily exports return to prewar levels.\nEnergy Secretary Chris Wright, standing next to Trump at the Resolute Desk, said, \"You've seen diesel prices come down the last week. I think you'll see them move meaningfully down in the coming weeks and days.\"\nBut Wright acknowledged that diesel supplies are \"tight\" because of export loss related to conflicts in Russia and the Middle East, as well as from China.\n\"So that's a lot of interruptions. But American refiners are running at record highs,\" Wright said, \"and you will hear announcements from our our friends in Europe about new diesel supplies that'll come to the market. That'll meaningfully push diesel prices down.\"\nWhen a reporter asked if Wright has advised against a diesel export ban, Trump interjected, saying, \"No, I think it's something that we think about and we talk about every day.\"\n\"But it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",
    "bodyJa": "President Donald Trump on Wednesday said he is still \"thinking about\" banning diesel exports in an attempt to get a handle on high energy prices, but noted that doing so may have a \"negative impact on gasoline.\"\nTrump, asked in the Oval Office if he has decided on a ban, said his aides think it would help diesel \"but it might raise the price of other things.\"\n\"And I think we're in a good place because oil prices are going to start to come down,\" Trump added.\nJust three days earlier, Trump said he was \"very seriously\" considering the move, despite warnings from the U.S. oil industry that it would force refineries to cut production and ultimately raise domestic energy prices.\nBut his latest comments appeared to show him cooling to the idea of an export ban, even as he declined to rule it out entirely.\n\"We're in a very good place,\" Trump said, highlighting a recent resurgence in crude exports through the Strait of Hormuz.\nThe strait is a major throughway for the global oil trade that saw ship traffic stifled after the U.S. and Israel attacked Iran in late February. But this week it saw daily exports return to prewar levels.\nEnergy Secretary Chris Wright, standing next to Trump at the Resolute Desk, said, \"You've seen diesel prices come down the last week. I think you'll see them move meaningfully down in the coming weeks and days.\"\nBut Wright acknowledged that diesel supplies are \"tight\" because of export loss related to conflicts in Russia and the Middle East, as well as from China.\n\"So that's a lot of interruptions. But American refiners are running at record highs,\" Wright said, \"and you will hear announcements from our our friends in Europe about new diesel supplies that'll come to the market. That'll meaningfully push diesel prices down.\"\nWhen a reporter asked if Wright has advised against a diesel export ban, Trump interjected, saying, \"No, I think it's something that we think about and we talk about every day.\"\n\"But it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

    </div>`;
  renderCategories();
  renderArticles();

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
