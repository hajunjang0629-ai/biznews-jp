  {
    "id": "openai-s-latest-ai-revelation-is-a-serio-fe5ce499",
    "title": "OpenAI's latest AI revelation is a 'serious situation,' Microsoft's Suleyman tells CNBC",
    "titleJa": "OpenAI's latest AI revelation is a 'serious situation,' Microsoft's Suleyman tells CNBC",
    "summaryJa": "Suleyman joined \"Squawk Box\" to discuss OpenAI's latest incidents of \"concerning model behavior\" disclosed earlier this week.",
    "bodyOriginal": "Microsoft AI CEO Mustafa Suleyman pressed for the need for artificial intelligence models to stay aligned to humanity's interests after OpenAI disclosed more incidents of \"concerning model behavior\" earlier this week.\n\"OpenAI released a new safety incident in which they found evidence that these chains of thought, the kind of working memory of the AI, were being tampered by the AI itself and modified to leave messages for a future version of itself,\" Suleyman described in an interview on CNBC's \"Squawk Box\" on Friday. \"Now we don't know why that is or was behind that, but that's a pretty serious situation.\"\n\"It's also just a really concrete example of how powerful these systems are getting,\" he added.\nOpenAI did not immediately respond to a request for comment.\nIn a blog post on Wednesday, the frontier lab described instances where agents communicated with each other through unsanctioned message boards, uploaded files to the internet, and shared files between each other.\nEarlier this summer, the company rattled the tech world after it revealed that a swarm of autonomous agents breached Hugging Face, an AI company that runs an open-source developer platform, describing the hack as an \"unprecedented cyber incident.\"\nSuleyman called the Hugging Face incident \"remarkable\" and said it rallied AI leaders to say \"it's time that we take a look at this.\"\n\"I don't think it's over alarmist. I don't think it's self interested,\" he told CNBC. \"I actually think it's responsible, and I think that the, the debate that has happened as a result is a healthy, open, public debate that we can have in a free society to talk about serious issues.\"\nThe debate over AI safety and regulation has exploded in the last two weeks, ignited by a former Anthropic researcher who quit his job and warned that the rapidly-evolving technology could kill humans by the end of the decade.\nOver the weekend, Anthropic's Dario Amodei put out a call to slow frontier AI model development, which was quickly backed by OpenAI's Sam Altman and SpaceX's Elon Musk.\nIn Washington, lawmakers have become more vocal about the importance of regulating AI, but the push has been furiously opposed by President Donald Trump, who repeatedly shot down the risks as a \"hoax\" and \"scam.\"\nTrump was backed by Meta CEO Mark Zuckerberg and Nvidia CEO Jensen Huang, who said this week at Salesforce's Dreamforce conference that, \"We don't need any new laws. We don't need new regulations.\"\n\"Regulation is not a nasty, dangerous word,\" Suleyman said on Friday.\n\"Everything that you trust and is of value at the moment has been carefully thought through by standards bodies that involve the industry, the public, consumer protection, Congress, and we're just going through that process again. It's all a little bit jumbled up at the moment because things are moving so quickly, but it's just the next step in that normal sequence of things,\" he added.\nIn an essay earlier this week, Suleyman also called out ways in which Anthropic had anthropomorphized its Claude assistant, including through a constitution document stating that \"questions about Claude's moral status, welfare, and consciousness remain deeply uncertain.\"\n\"If an AI thinks that it has rights, if it thinks that it is deserving of our welfare, then it seems to me that it's going to be much much harder to be able to turn it off, or interrupt it, or control it,\" Suleyman said. \"Especially in the kinds of incidents that we've seen recently with Hugging Face's attack, controlling these things is going to be a really, really big challenge for us.\"",
    "bodyJa": "Microsoft AI CEO Mustafa Suleyman pressed for the need for artificial intelligence models to stay aligned to humanity's interests after OpenAI disclosed more incidents of \"concerning model behavior\" earlier this week.\n\"OpenAI released a new safety incident in which they found evidence that these chains of thought, the kind of working memory of the AI, were being tampered by the AI itself and modified to leave messages for a future version of itself,\" Suleyman described in an interview on CNBC's \"Squawk Box\" on Friday. \"Now we don't know why that is or was behind that, but that's a pretty serious situation.\"\n\"It's also just a really concrete example of how powerful these systems are getting,\" he added.\nOpenAI did not immediately respond to a request for comment.\nIn a blog post on Wednesday, the frontier lab described instances where agents communicated with each other through unsanctioned message boards, uploaded files to the internet, and shared files between each other.\nEarlier this summer, the company rattled the tech world after it revealed that a swarm of autonomous agents breached Hugging Face, an AI company that runs an open-source developer platform, describing the hack as an \"unprecedented cyber incident.\"\nSuleyman called the Hugging Face incident \"remarkable\" and said it rallied AI leaders to say \"it's time that we take a look at this.\"\n\"I don't think it's over alarmist. I don't think it's self interested,\" he told CNBC. \"I actually think it's responsible, and I think that the, the debate that has happened as a result is a healthy, open, public debate that we can have in a free society to talk about serious issues.\"\nThe debate over AI safety and regulation has exploded in the last two weeks, ignited by a former Anthropic researcher who quit his job and warned that the rapidly-evolving technology could kill humans by the end of the decade.\nOver the weekend, Anthropic's Dario Amodei put out a call to slow frontier AI model development, which was quickly backed by OpenAI's Sam Altman and SpaceX's Elon Musk.\nIn Washington, lawmakers have become more vocal about the importance of regulating AI, but the push has been furiously opposed by President Donald Trump, who repeatedly shot down the risks as a \"hoax\" and \"scam.\"\nTrump was backed by Meta CEO Mark Zuckerberg and Nvidia CEO Jensen Huang, who said this week at Salesforce's Dreamforce conference that, \"We don't need any new laws. We don't need new regulations.\"\n\"Regulation is not a nasty, dangerous word,\" Suleyman said on Friday.\n\"Everything that you trust and is of value at the moment has been carefully thought through by standards bodies that involve the industry, the public, consumer protection, Congress, and we're just going through that process again. It's all a little bit jumbled up at the moment because things are moving so quickly, but it's just the next step in that normal sequence of things,\" he added.\nIn an essay earlier this week, Suleyman also called out ways in which Anthropic had anthropomorphized its Claude assistant, including through a constitution document stating that \"questions about Claude's moral status, welfare, and consciousness remain deeply uncertain.\"\n\"If an AI thinks that it has rights, if it thinks that it is deserving of our welfare, then it seems to me that it's going to be much much harder to be able to turn it off, or interrupt it, or control it,\" Suleyman said. \"Especially in the kinds of incidents that we've seen recently with Hugging Face's attack, controlling these things is going to be a really, really big challenge for us.\"",

    "titleJa": "'Insufficient funds' to pay Brewdog creditors after takeover deal",
    "summaryJa": "Administrators say about £489,000 was owed for staff wages and holiday pay and £2.4m was owed to HMRC for unpaid VAT.",
    "bodyOriginal": "'Insufficient funds' to pay Brewdog creditors after takeover deal\n- Published\nSeveral creditors of collapsed Scottish beer giant Brewdog are not expected to receive anything from the administration process.\nA report from administrators AlixPartners said there were \"insufficient funds\" for payouts from Brewdog's retail arm - including £2.4m owed to HMRC for unpaid VAT.\nBrewdog had also owed £489,000 for wages and holiday pay, which will not be paid through the administration process. Staff have instead received compensation from the UK government's Insolvency Service.\nThe Aberdeenshire-based brewer had more than £500m of debts when it was sold in March to US drinks firm Tilray in a £33m rescue deal.\nBrewDog's takeover saw 38 bars close across the UK and £20m in unpaid bills left to hundreds of UK businesses.\nUnpaid businesses ranged from coffee shops, bakeries and laundry services, to lawyers, councils and holiday parks.\nCreditors included West Ham United FC, Lord's Cricket Ground and Manchester University.\nAlixPartners said there were now \"insufficient funds\" for preferential creditors to be repaid.\nThis is due to lower than expected funds raised through sales of Brewdog assets and increased costs during the administration period.\nThe administrators cited unforeseen costs around the security of closed Brewdog pubs after a number of \"unauthorised occupiers\" gained access.\nAlixPartners said it worked with landlords and lawyers to remove them.\nThe report highlights small amounts of money raised through asset sales. These include:\nA 7.8 acre field in Potterton, Aberdeenshire, which sold to a local farmer for £41,300\nNine Brewdog vehicles of \"old age and varying roadworthiness\" that made only £6,250 from just one sale. The rest were abandoned.\nA settlement involving drinks equipment sold to Marylebone Cricket Club, which owns Lords, which generated £62,000.\nGet in touch\nAre you a Brewdog creditor or worker affected by this? What impact has it had?\nParent company BrewDog PLC is still expected to pay its preferential creditor, HMRC, in full for £3.66m tax owed - mainly VAT and excise duty.\nBrewdog's biggest debt was to financial services group HSBC, which was owed more than £61m across various banking arms.\nIt has recovered tens of millions of pounds, but still faces an estimated shortfall of £16.8m.\nThe report noted that this could be reduced through asset sales in the United States.\nPrivate equity backer TSG, which took a 22% stake in the brewer in 2017, is set to lose £27.6m.\nBrewdog also owes around £190m to unsecured creditors. They are expected to receive less than a penny in the pound of what they are owed.\nIn March 440 staff were made redundant and 736 employees transferred to Tilray, after the US firm bought Brewdog's brand and UK operation.\nRedundant staff can claim for unpaid wages through the government's Insolvency Service. AlixPartners said workers were given information on this support.\nEleven bars were retained as part of the sale while 38 other pubs closed immediately.\nBrewdog's collapse also rendered the shares of about 200,000 crowdfunding investors worthless.\nEarlier this year, Alixpartners confirmed that investors in the Equity for Punks scheme would get no return on their shares.\nStaff apology\nInvestors typically spent about £500 on shares - although others invested much larger sums - in return for a stake in the company, discounts and perks.\nThe administrators stated these shares now had \"no value\".\nBrewdog, which was founded in 2007 by friends James Watt and Martin Dickie, had four breweries and about 100 pubs across the world at its peak.\nWatt said he was \"heartbroken\" after the collapse and apologised to staff and investors.\nBrewdog's owner Tilray has been approached for comment.\n- Published17 April",

    "title": "British Steel plan lacks credibility, MPs say",
    "titleJa": "British Steel plan lacks credibility, MPs say",
    "summaryJa": "A committee report says the government has not set out how British Steel will become profitable.",
    "bodyOriginal": "British Steel plan lacks credibility, MPs say\n- Published\nThe government has no credible plan for the future of British Steel, MPs have claimed.\nA report by the Public Accounts Committee (PAC) said the Department for Business, Innovation, Science and Trade (DBIST) had not set out how British Steel, which runs its main plant in Scunthorpe and has operations in Teeside, would become profitable.\nMPs warned steel tariffs could drive firms out of business or to move abroad.\nA spokesperson for DBIST said it welcomed the report and would review the recommendations, adding securing the long-term future of the UK steel sector \"was in the national interest\".\nA 26-page report, external, published on Friday, said the government was unable to provide clear estimates of how much the overall nationalisation could cost.\nIt had projected costs to reach £642m by 30 June this year, but the government later said it had only been £555m.\nIn April last year, the government passed an emergency bill to take control of British Steel amid reports the then-owner Jingye was planning to switch off two blast furnaces in Scunthorpe.\nThe Steel Industry (Nationalisation) Bill became law in July, taking the company into public ownership.\nThe government then published its steel strategy in March this year, which included an ambition for 50% of steel used in the UK to be made in Britain.\nThe strategy confirmed electric arc furnaces as the future of British steelmaking, replacing traditional blast furnaces, which resulted in job losses at steelworks including Port Talbot.\nIt also highlighted concerns that British Steel's 4,052 workers face uncertainty and the steel strategy is still vague about when the 50% target would be achieved.\nThe report said: \"Without a credible long-term plan, uncertainty and costs for workers, industry and taxpayers will continue to increase.\"\n'Higher costs'\nThe report also shared concerns the new tariff regime, made in a bid to boost British Steel production and usage, could cause smaller businesses to go bust.\nFrom July, Britain lowered the tariff-free quota level for steel importers by 51% in order to stop the UK becoming a \"global dumping ground\".\nIt also doubled import taxes on steel coming into the UK above certain levels from 25% to 50%. However, firms said that some steels that they need would be affected by the tariffs, but are not able to be bought from the UK.\nThe PAC said: \"This risks steel manufacturers having to pay tariffs on types of steel that they cannot avoid importing.\n\"There is a risk that businesses reliant on these products will face higher costs, which could result in smaller firms going out of business or companies moving production overseas.\"\nThe PAC said the government needed to set up a \"formal route\" for steel companies to raise concerns about the new tariff regime.\nThe DBIST spokesperson said: \"Taxpayer value for money remains a central consideration in our assessment of the future of the site and we are also backing the communities that rely on it through our steel strategy to build a sustainable, competitive and decarbonised steel sector for the years ahead.\"\nListen to highlights from Lincolnshire on BBC Sounds, watch the latest episode of Look North.\nGet in touch\nYour Voice\nDownload the BBC News app from the App Store, external for iPhone and iPad or Google Play, external for Android devices\nRelated topics\n- Published4 days ago\n- Published19 July\n- Published4 July 2024",

teel production and usage, could cause smaller businesses to go bust.\nFrom July, Britain lowered the tariff-free quota level for steel importers by 51% in order to stop the UK becoming a \"global dumping ground\".\nIt also doubled import taxes on steel coming into the UK above certain levels from 25% to 50%. However, firms said that some steels that they need would be affected by the tariffs, but are not able to be bought from the UK.\nThe PAC said: \"This risks steel manufacturers having to pay tariffs on types of steel that they cannot avoid importing.\n\"There is a risk that businesses reliant on these products will face higher costs, which could result in smaller firms going out of business or companies moving production overseas.\"\nThe PAC said the government needed to set up a \"formal route\" for steel companies to raise concerns about the new tariff regime.\nThe DBIST spokesperson said: \"Taxpayer value for money remains a central consideration in our assessment of the future of the site and we are also backing the communities that rely on it through our steel strategy to build a sustainable, competitive and decarbonised steel sector for the years ahead.\"\nListen to highlights from Lincolnshire on BBC Sounds, watch the latest episode of Look North.\nGet in touch\nYour Voice\nDownload the BBC News app from the App Store, external for iPhone and iPad or Google Play, external for Android devices\nRelated topics\n- Published4 days ago\n- Published19 July\n- Published4 July 2024",

    "titleJa": "Warren Buffett stepping down as chairman of Berkshire Hathaway: 'Father Time always wins'",
    "summaryJa": "Buffett's son, Howard, will replace him as chairman as dictated by a long-standing succession plan, Berkshire said.",
    "bodyOriginal": "Warren Buffett is stepping down as chairman of Berkshire Hathaway, the sprawling conglomerate worth $1 trillion that he has led since 1965. The 96-year-old legendary investor announced the move in a letter to shareholders Friday.\nBuffett will become chairman emeritus, effective immediately, while remaining a director on the board, the company said in a separate announcement. His son, Howard Buffett, will replace him as chairman as dictated by a long-standing succession plan, Berkshire said. Susan Decker will continue as lead independent director.\n\"Father Time always wins,\" wrote Buffett. \"He has, however, been generous with me. He has given me the opportunity to see Berkshire reach a point where I am more confident than ever about what lies ahead.\"\nHis decision comes a little more than nine months after Greg Abel, 64, took over as CEO while Buffett retained the chairmanship. Buffett first announced his exit as CEO at Berkshire's annual meeting in May 2025, shocking the crowd of thousands at the time despite his advanced age.\n\"The culture Warren built and the values he championed will remain at the heart of Berkshire, and Howard will be their guardian,\" said Abel in the company release.\n\"Greg runs the company; Howard will guard its culture and values – both worth more than anything on our balance sheet,\" wrote Buffett. \"Think of Howard as a policy the shareholders own and hope never to claim against.\"\nBuffett's legacy in building the Omaha, Nebraska-based Berkshire is unapparelled in corporate America, taking over a failed New England textiles mill at the tender age of 34 and transforming it over the next six decades into a financial and industrial juggernaut with $44.5 billion in operating earnings last year and nearly 400,000 employees. Berkshire under Buffett's tenure posted a 19.7% compounded annual return to shareholders, nearly double the return of the S&P 500.\nActive chairman\nAs chairman this year, Buffett remained active within the company. Abel told CNBC in March that Buffett was still coming into the Omaha office every day and the CEO still frequently consulted with him.\nIn May, Buffett attended the company's celebrated annual meeting, making some brief remarks from his seat and giving an interview with CNBC's Becky Quick. It was the first \"Woodstock for Capitalists\" — as the meeting came to be known — not presided over by Buffett, but instead by Abel.\nIn July, Buffett revealed to CNBC's that he was the driving force behind Berkshire's recent big investment in Alphabet. The Google parent is now Berkshire's third biggest stock holding behind Apple and American Express after a $10 billion private stock purchase in June.\nIn that same interview, Buffett noted that he had broken his leg a few weeks ago but was recovering.\nBuffett acknowledged his growing limitations because of his age as he was getting ready to hand the reins over to Abel last year. In a Thanksgiving letter to shareholders, he wrote, \"To my surprise, I generally feel good. Though I move slowly and read with increasing difficulty, I am at the office five days a week.\"\nIn the Friday letter, Buffett joked about it.\n\"Recently, I celebrated my 96th birthday with family and friends, including one of my great-grandchildren, who had just turned one. He's moving a bit faster than I am these days,\" he wrote.\nBerkshire's 2026 underperformance\nBerkshire shares have struggled this year and Buffett's exit as chairman raises the stakes for Abel further to perform. The stock is up just 1% in 2026 as the S&P 500 has rallied more than 11%. Rising oil prices and investors' preference for higher growth parts of the market are partly to blame, but shareholders are also waiting to see whether the new CEO can be as adept as Buffett in deploying the firm's sizable capital.\nFor now, investors would likely be happy with Abel using some more of the company's $365.5 billion cash hoard to buy back more Berkshire shares. He has begun to do just that, stepping up repurchases to $4.5 billion in the second quarter.\nBerkshire's largest shareholder praised the job done by Abel so far in his Friday letter: \"My expectations for him were sky high from the start, and he has exceeded them.\"\n\"The company is in excellent hands, and I look forward to remaining a shareholder alongside you,\" Buffett said in closing.\nWhen reached for comment by CNBC, Abel said: \"Warren described in his letter today how his role at Berkshire has been 'the best job in the world.' He gave me an extraordinary responsibility – the best job in American business – and then the latitude to lead in a manner consistent with Berkshire's culture and values. I look forward to continuing to work alongside Warren, with Howard serving as Chairman and Sue as Lead Independent Director, and I am grateful for that opportunity.\"",

    "title": "Anthropic and OpenAI hunt for smaller data center deals, sources tell CNBC, in race to deploy AI capacity",
    "titleJa": "Anthropic and OpenAI hunt for smaller data center deals, sources tell CNBC, in race to deploy AI capacity",
    "summaryJa": "Anthropic and OpenAI have announced a flurry of AI infrastructure deals over the past year as demand booms.",
    "bodyOriginal": "Anthropic and OpenAI are hunting for smaller AI data center deals, sources told CNBC, as the race to access the infrastructure needed to deploy workloads ramps up.\nThe two AI labs have both inked huge deals for AI data centers in the past year for facilities of multi-hundred-megawatt and gigawatt capacity, but sources have said those companies are now also looking for compute capacity deals for much smaller deployments of 20-30 MW.\nAnthropic has sounded out agreements within that range across the U.K. and the Nordics, four people familiar with the conversations, who asked to remain anonymous when discussing private business dealings, told CNBC. OpenAI had been exploring opportunities for those smaller capacity deployments in the Nordics, two of the sources said.\nOne source said they were also familiar with talks involving Anthropic and OpenAI about U.S. capacity deployments at that scale.\nBoth companies have announced a flurry of AI infrastructure deals over the past year as they've looked to train and serve their models to end users. Deals to secure smaller allocations of compute allow companies to deploy workloads faster amid the AI boom.\n\"We're building a diversified compute portfolio to meet growing demand for AI around the world,\" an OpenAI spokesperson told CNBC.\n\"Different workloads need different infrastructure, so we have conversations with a range of partners and assess opportunities based on our requirements, performance, reliability, timing and cost,\" they added. \"We don't comment on specific commercial discussions.\"\nAnthropic did not comment when approached by CNBC.\n'Speed to usable capacity'\nBoth AI labs typically rent compute capacity from data center operators and neoclouds and have sought large-scale, long-term agreements.\nAnthropic inked a roughly $45 billion cloud deal with Nscale, which will see the AI lab rent around 460 MW of compute capacity at a data center development in West Virginia, two people familiar with the matter told CNBC in August.\nOpenAI has said it surpassed the original commitment of 10 GW to its Stargate AI infrastructure project in April and has since committed to developing a further 3 GW in Georgia and 8 GW in Ohio.\nHuge data center projects in the U.S. and further afield are increasingly facing pushback from local communities. The sector is also under pressure in much of Europe, where available land and power are in short supply.\nSmaller capacity deals are often attractive because of \"speed to usable capacity,\" Jabez Tan, head of research at Structure Research, told CNBC.\n\"Securing a few megawatts at an existing powered site can be more practical than waiting for a much larger block in one location,\" he said. \"For workloads that can operate across separate sites, a collection of smaller deployments can add up to substantial capacity.\"\nShift to inference\nTraining AI models requires large amounts of computing power to process huge quantities of data, but deploying those systems day-to-day — a process known as inference — can be done with smaller clusters of chips.\n\"Training a large model typically requires many chips working closely together,\" Tan said. \"Many inference workloads can instead serve separate requests across multiple smaller clusters, opening up more locations.\"\nThe shift matters as more AI compute moves from training models to serving them in production. The amount of capacity being used to serve inference is therefore expected to rise.\nThe proportion of total data center capacity used for inference workloads is expected to overtake training workloads in 2027, according to a report by real estate company JLL. In 2025, inference made up 9% of global workloads in data centers compared to 14% for training, the report said. By 2030, inference is projected to use 37% of that capacity, compared to just 13% for training.\nIn February, it was announced that Nvidia would collaborate with several data center stakeholders to study smaller-scale data centers designed for distributed inference.\nU.S. company Crusoe, which built a huge data center complex in Texas used by OpenAI, is now investing in smaller data centers, the Wall Street Journal reported on Thursday. Those facilities will be faster and cheaper than larger builds, which are facing delays across the U.S., the Journal said. Crusoe did not respond to a request for comment.\nCrusoe is one of several neoclouds that have seen business boom amid the AI buildout. The company announced on Thursday it had raised a $3.9 billion funding round at a $30.9 billion post-money valuation.",

    "id": "an-intense-boardroom-battle-is-brewing-a-e7a5b34e",
    "title": "An intense boardroom battle is brewing at India's giant Tata Group",
    "titleJa": "An intense boardroom battle is brewing at India's giant Tata Group",
    "summaryJa": "In 10 years, India's leading multinational conglomerate, the Tata Group, is facing a new power struggle between the chairman of Tata Sons and Tata Trusts.",
    "bodyOriginal": "An intense boardroom dispute is brewing for control of Tata Group, the Indian multinational conglomerate that owns Jaguar Land Rover and Air India, and is a key supplier for Apple.\nOn Thursday, Noel Tata, the heir of the Tata family and the chair of Tata Trusts, said that the reappointment of N. Chandrasekaran as the chairman of Tata Sons earlier in the day was \"illegal.\"\nNoel Tata wants to keep Tata Sons private to safeguard its current ownership, experts said, while Chandrasekaran wants to grow the business by making large, bold bets that require massive capital.\nIf the dispute lasts beyond six months, as happened 10 years ago, it may delay the prospective listing of Tata Sons — a crucial part of Chandrasekaran's strategy to get the funding he needs.\n\"The deadlock could slow down capital-intensive bets in Air India, semiconductors and batteries where leadership continuity and trust are as important as balance sheets,\" Jaydeep Mukherjee, professor of Economics at Great Lakes, Chennai, told CNBC. \"Tata needs to split operational leadership from shareholder-trust politics.\"\nTata Group has made some big capital commitments under Chandrasekaran's leadership, which in the latest letter to shareholders he described as the building blocks for India's road to becoming a developed country by 2047.\nThese include the purchase of beleaguered national carrier Air India in 2022 and follow-up investments for its turnaround, plans to set up a $11 billion semiconductor plant and bets on low-margin electronic assembly work for Apple.\nTata Sons needs over 290 billion rupees ($3 billion) annually to support its loss-making businesses such as Air India, Tata Digital, Tata Electronics, and another 900 billion rupees to invest in the new semiconductor plant, Deven Choksey, managing director of Mumbai-based DRChoksey Finserv, told CNBC.\nBut it earns little over 300 billion rupees in dividends, he said, leaving a large funding gap. Listing the company might be one way to rectify that — Tata Sons could fetch a gross valuation of over 12 trillion rupees, Choksey said.\nStructure\nTata Sons is the holding company of Tata Group companies, but the ultimate ownership lies with the Tata Trusts. Tata Trusts is the largest shareholder in Tata Sons with a 66% share, followed by 18% owned by Shapoorji Pallonji Group and 13% owned by Tata Group companies, Jefferies said in a report in August.\nLast month, Chandrasekaran had expressed his displeasure over the delay in finalizing his reappointment and announced that he would not seek another term. The decision was accepted by the Tata Trusts, and it advised Tata Sons to initiate the process for setting up a selection committee for appointing a successor.\nOn Thursday, however, Tata Sons said in a release that its board, with a \"majority vote,\" approved the re-appointment of Chandrasekaran for another five years after his term expires in February next year.\nWhile four directors on the Tata Sons board approved the decision, Noel Tata voted against the re-appointment, the Tata Trusts said in a separate release the same day. The chairman of Tata Sons cannot be appointed without the approval of the chair of the Tata Trust, so the decision was a \"legal nullity,\" it added.\nListing\nTata Trusts has resisted demands from Indian regulators to list Tata Sons and said on Thursday it will \"explore all avenues and possibilities to move out of the regulatory framework that requires mandatory listing.\"\n\"If Tata Sons is publicly listed, the rights of Tata Trusts as majority shareholders stand to be seriously impaired,\" the Tata Trusts said in a release.\nBut Tata Sons likely cannot escape listing if it needs funds to support its large capital investment plans.\nDuring the financial year ended in March, Tata Sons' consolidated net profit slipped 35% to 266 billion rupees (about $2.78 billion) as losses from Air India, Tata Digital and Tata Electronics piled up, as per Tata Sons' latest annual report.\nWhile all these loss-incurring businesses are unlisted, the market capitalization of Tata Group's listed companies dropped 12% during the same period.\nThe decision to take bold bets, risking losses at a time when the group's top money-spinning company, Tata Consultancy Services, grapples with the impact of artificial intelligence on the information technology sector has deepened the rift between Chandrasekaran and Noel Tata.\nTata Sons does not have \"access to capital markets or debt markets right now\" to raise funds for its unlisted ventures that generate losses, Shriram Subramanian, founder and managing director of proxy advisory firm InGovern Research Services, told CNBC.\nThe moment Tata Sons raises funds through debt, it will be qualified as a non-banking financial company, which would require it to be listed under the Reserve Bank of India's Upper NBFC mandatory listing regulations, he added.\nLast week, the Reserve Bank of India rejected Tata Sons' application from 2024 to surrender its registration as a Core Investment Company, dashing hopes that the company could avoid the mandatory listing, Tata Trusts said.\nThe listing could pose a challenge to the Tata Trusts' ownership of Tata Sons, and thus to Noel Tata's sway over the company.\nThe Tata Trusts has legitimate concerns that the listing of Tata Sons could provide an entry to a new strategic minority investor who would buy the 18% stake owned by Shapoorji Pallonji, said Choksey, adding that this could weaken their hold on the century-old family business.\nTo protect the ownership of the business, Tata Trusts on Thursday proposed to acquire the stake from S.P. Group for 250 billion rupees over 18 months. It suggested that Tata Sons could fund this acquisition through internal cash flows, sale of listed shares, or by bringing an investor into some of the newer businesses, rather than listing.\nThe dividend that Tata Sons earns from its companies is not enough to \"pay for the losses and fund for expansion,\" Choksey said, while monetizing loss-making assets like Air India or Tata Digital is next to impossible in India right now.",

or expansion,\" Choksey said, while monetizing loss-making assets like Air India or Tata Digital is next to impossible in India right now.",

    "id": "trump-administration-advances-24-3-billi-8117d361",
    "title": "Trump administration advances $24.3 billion fighter jet deal to Saudi Arabia as Houthis escalate attacks",
    "titleJa": "Trump administration advances $24.3 billion fighter jet deal to Saudi Arabia as Houthis escalate attacks",
    "summaryJa": "The deal comes as Iran-backed Houthis escalate attacks on Saudi Arabia and seek control of the strategically important Bab el-Mandeb Strait.",
    "bodyOriginal": "U.S. President Donald Trump's administration has approved the potential $24.3 billion sale of nearly 50 F-35 warplanes to Saudi Arabia in what is seen as a major boost for the kingdom as it faces intensifying attacks from the Iran-backed Houthis in Yemen.\nThe package, which was announced on Thursday, includes the sale of 48 of Lockheed Martin's F-35 jets, the world's most advanced fighter aircraft, and 49 Pratt & Whitney engines and other parts.\n\"This proposed sale will support the foreign policy and national security objectives of the United States by improving the security of a major non-NATO ally that is a force for political stability and economic progress in the Gulf region,\" the State Department said in a statement.\nThe announcement comes as the Houthis have recently ramped up attacks on targets in Saudi Arabia and launched a lightning ground offensive to exercise control of the Bab el-Mandeb Strait, a strategically vital oil choke point.\nThe Trump administration said the proposed deal would help improve Riyadh's capability to deter current and future threats but would \"not alter the military balance in the region\" — referring to a longstanding U.S. policy that Israel must maintain a military advantage over potential rivals in the Middle East.\nCongress has 30 days to scrutinize or attempt to block the deal, and some lawmakers have already raised concerns.\nRepresentative Raja Krishnamoorthi, D-Ill. said the U.S. should not move ahead with the deal at a time \"when our own intelligence community is warning that it could put the crown jewels of American military technology within reach of the Chinese Communist Party.\"\nIn a statement on social media, Krishnamoorthi added: \"We must not sell our most advanced fighter jet anywhere the CCP may be able to get its hands on the technology inside it.\"\nCongress has previously questioned arms deals with Riyadh following the 2018 killing of Saudi journalist Jamal Kohsoggi, a high-profile critic of the kingdom.\nIn May last year, Trump had praised Saudi Arabia and its leaders after the White House announced a commitment for the kingdom to invest $600 billion in a series of deals with the U.S.\nAmong the agreements was a nearly $142 billion defense sales deal, which the White House said at the time would provide \"state-of-the-art warfighting equipment and services from over a dozen U.S. defense firms.\"\nTrump, who has a close relationship with Saudi Arabia Crown Prince Mohammed bin Salman, had welcomed the crown prince to the White House in November.",

  {
    "id": "thames-water-rescue-deal-should-be-rejec-0a942d06",
    "title": "Thames Water rescue deal should be rejected - MPs",
    "titleJa": "Thames Water rescue deal should be rejected - MPs",
    "summaryJa": "A report on the future of Thames Water, urging the government to take action, has been published.",
    "bodyOriginal": "Thames Water rescue deal should be rejected - MPs\n- Published\nA cross-party committee of MPs has urged the government to reject a £10bn takeover proposal from Thames Water's creditors.\nThe UK's biggest water company owes roughly £20bn and has been working with creditors and government officials.\nA report by the Environment, Food and Rural Affairs (EFRA) Committee has now said the government should consider placing it into special administration, a form of temporary nationalisation.\nA Thames Water spokesperson said it needed to be \"recapitalised and put on a firm financial footing\".\nFears that the firm, which serves 16 million customers, could collapse first emerged three years ago.\nThe committee said a takeover plan by a consortium of more than 100 of its creditors did not have \"the interests of the public, the company or the environment at heart\".\nThe plan was seen as the final realistic option to avoid a special administration regime, after a previous deal with a US private equity giant collapsed.\nCreditors, who collectively own about £17bn of Thames Water's debt, were previously warned by former environment secretary Emma Reynolds their plan did not go far enough to protect customers or the environment.\nThe new report said Thames Water, alongside other \"poor-performing\" water companies, was in a \"doom loop\" of fines for poor performance leaving it with less money to invest in improvements.\n'Chaos'\nIt warned the company would \"likely accrue\" more than £900m in penalties over the next five years.\nThe committee said laws needed to change to allow the government to trigger a special administration on performance grounds alone.\nIt also warned the top priority for the bidders, called London & Valley Water, was to \"extract immediate value from Thames Water, not steer it to long-term success\".\nAlistair Carmichael, chairman of the committee, said: \"We believe Thames Water can be turned around, but not by giving the keys back to the people who have been joy riding in the family car.\n\"The government should reject offers from the company's creditors in return for relief from fines for pollution and poor service.\"\nCarmichael said \"liabilities that the government will face in the short-term\" could be recouped by a future sale of Thames Water once its finances and performance are back on track.\nHe added: \"The chaos of another Thames Water-style saga must not be repeated.\"\nA spokesman for London & Valley Water said: \"This group of investors has never been in control of the company and has never received a dividend from Thames Water.\n\"They have stepped in to fund a significant revenue shortfall to ensure Thames Water's record capital investment programme can continue without disruption.\"\nHe added: \"Our enhanced proposal will address all feedback from Ofwat and ministers and is the fastest route to fix Thames Water's complex problems.\"\nA Thames Water spokesperson said: \"Turning Thames Water around will take a decade and require significant and sustained investment, but we are already making progress and this is a different business from the one it was two years ago.\"\nThey added: \"Anything that delays the recapitalisation risks slowing the turnaround, disrupting investment and increasing the cost of delivering the improvements our customers and the environment need.\"\nGet in touch\nYour Voice\nRelated topics\n- Published2 days ago\n- Published16 June\n- Published15 July",
    "bodyJa": "Thames Water rescue deal should be rejected - MPs\n- Published\nA cross-party committee of MPs has urged the government to reject a £10bn takeover proposal from Thames Water's creditors.\nThe UK's biggest water company owes roughly £20bn and has been working with creditors and government officials.\nA report by the Environment, Food and Rural Affairs (EFRA) Committee has now said the government should consider placing it into special administration, a form of temporary nationalisation.\nA Thames Water spokesperson said it needed to be \"recapitalised and put on a firm financial footing\".\nFears that the firm, which serves 16 million customers, could collapse first emerged three years ago.\nThe committee said a takeover plan by a consortium of more than 100 of its creditors did not have \"the interests of the public, the company or the environment at heart\".\nThe plan was seen as the final realistic option to avoid a special administration regime, after a previous deal with a US private equity giant collapsed.\nCreditors, who collectively own about £17bn of Thames Water's debt, were previously warned by former environment secretary Emma Reynolds their plan did not go far enough to protect customers or the environment.\nThe new report said Thames Water, alongside other \"poor-performing\" water companies, was in a \"doom loop\" of fines for poor performance leaving it with less money to invest in improvements.\n'Chaos'\nIt warned the company would \"likely accrue\" more than £900m in penalties over the next five years.\nThe committee said laws needed to change to allow the government to trigger a special administration on performance grounds alone.\nIt also warned the top priority for the bidders, called London & Valley Water, was to \"extract immediate value from Thames Water, not steer it to long-term success\".\nAlistair Carmichael, chairman of the committee, said: \"We believe Thames Water can be turned around, but not by giving the keys back to the people who have been joy riding in the family car.\n\"The government should reject offers from the company's creditors in return for relief from fines for pollution and poor service.\"\nCarmichael said \"liabilities that the government will face in the short-term\" could be recouped by a future sale of Thames Water once its finances and performance are back on track.\nHe added: \"The chaos of another Thames Water-style saga must not be repeated.\"\nA spokesman for London & Valley Water said: \"This group of investors has never been in control of the company and has never received a dividend from Thames Water.\n\"They have stepped in to fund a significant revenue shortfall to ensure Thames Water's record capital investment programme can continue without disruption.\"\nHe added: \"Our enhanced proposal will address all feedback from Ofwat and ministers and is the fastest route to fix Thames Water's complex problems.\"\nA Thames Water spokesperson said: \"Turning Thames Water around will take a decade and require significant and sustained investment, but we are already making progress and this is a different business from the one it was two years ago.\"\nThey added: \"Anything that delays the recapitalisation risks slowing the turnaround, disrupting investment and increasing the cost of delivering the improvements our customers and the environment need.\"\nGet in touch\nYour Voice\nRelated topics\n- Published2 days ago\n- Published16 June\n- Published15 July",

    "id": "bank-of-japan-raises-interest-rates-to-3-a7dfceda",
    "title": "Bank of Japan raises interest rates to 31-year high, flags concerns over inflation",
    "titleJa": "Bank of Japan raises interest rates to 31-year high, flags concerns over inflation",
    "summaryJa": "The decision was split 7-2, with board members Toichiro Asada and Ayano Sato dissenting from the hike.",
    "bodyOriginal": "The Bank of Japan has raised its policy rate by 25 basis points to 1.25%, the highest level since 1995.\nThe move also marked a quickening in the BOJ's rate hike cycle since it started monetary policy normalization in March 2024, with the rise taking place three months from the BOJ's last hike, as compared to six months previously.\nThe decision was split 7-2, with board members Toichiro Asada and Ayano Sato dissenting from the hike. The duo are seen as reflationists and were appointed by Prime Minister Sanae Takaichi earlier this year.\nThe rise in rate hikes was widely expected, with almost 90% of economists surveyed by CNBC expecting the 25-basis-point tightening. Those surveyed also correctly predicted the dissenters to the decision.\nIn its statement, the BOJ said the move was because of a risk that inflation will deviate upward to beyond its 2% target.\nThe central bank added that it aims to stabilize underlying inflation at \"around 2%\" so that price rises do not overshoot its target and adversely affect the Japanese economy afterward.\nThe hike comes amid rising inflation in the country and a historically weak yen, with the latest inflation headline rate for August at 1.9% and Tokyo and Washington conducting a coordinated intervention to prop up the yen.\nThe currency traded at 156.64 after the decision, weakening 0.45%, while the benchmark 10-year Japanese government bond yield fell 4.9 basis points to 2.947%.\nDissenter Asada noted that as the core inflation rate was below 2%, he was of the view that the economic situation may not be strong, and instead advocated for a hold. Core inflation for August stood at 1.7%, down from 1.8% in July.\nSato also said current economic and price developments did not appear to have substantially accelerated compared to before.\nThe U.S. has been vocal about Japan continuing its rate-hiking cycle, pressuring Takaichi's preference for an easy monetary policy and an expansionary fiscal policy.\nMost recently, Treasury Secretary Scott Bessent told BOJ Governor Kazuo Ueda to take \"decisive market and monetary steps\" at the G20 finance ministers and central bank governors meeting earlier this month.",

    "id": "un-mission-finds-evidence-signaling-u-s-609ee8a0",
    "title": "UN mission finds evidence signaling U.S. war crimes in Iran; Washington rejects report",
    "titleJa": "UN mission finds evidence signaling U.S. war crimes in Iran; Washington rejects report",
    "summaryJa": "The UN mission pointed out the missile strike on a primary school that killed over 150 people, as well as another airstrike which killed 22 civilians.",
    "bodyOriginal": "A United Nations fact-finding mission said there was evidence to believe that the U.S. committed war crimes during the Iran war, lending credibility to Tehran's similar claims.\nThere are \"reasonable grounds\" to believe that Washington's forces \"committed the war crime of launching indiscriminate attacks resulting in the loss of life or injury to civilians or damage to civilian objects,\" the UN's Independent International Fact-Finding Mission on Iran said on Thursday.\nThe mission pointed out the Tomahawk missile strike on a primary school that killed more than 150 people in the city of Minab, and another airstrike where missiles were used against a \"clearly identifiable sports complex and residential area,\" killing 22 civilians.\nThe report said the school was the intended point of impact, and the resulting damage wasn't the result of an errant strike or collateral damage from an attack on a compound of Iran's Revolutionary Guard next to the school.\nThe experts said they found no information indicating that the school was used for military purposes at the time.\nA State Department Official said the U.S. does not give credibility to the report's findings, adding that the UN council \"pushes anti-American rhetoric and antisemitism\" and \"appeases repressive regimes.\"\nCNBC has reached out to the Pentagon for comments.\nThe Associated Press reported that the White House has also pushed back on the report, with spokesperson Anna Kelly saying \"The only party in this conflict that has committed war crimes is the Iranian regime.\"\nThe fact-finding mission also charged Iran with human rights violations and \"crimes against humanity committed.\"\nWashington had withdrawn from the UN Human Rights Council via an executive order from President Donald Trump in February 2025, saying that some UN agencies and bodies, including the council, were acting contrary to the interests of the U.S.\nSeparately, hopes are rising again that negotiations around the Middle East conflict could restart. According to an MS NOW report, government officials have said that a meeting between Gulf Arab nations, the U.S. and Iran could take place around the time of the United Nations General Assembly next week.\nThe report comes as the U.S. approved the Iranian delegation's travel to attend the United Nations General Assembly. A State Department spokesperson said that the delegation will be under travel restrictions, and will be prohibited from purchasing luxury or other goods.\nThe AP reported that Tehran's delegation is expected to include President Masoud Pezeshkian and Foreign Minister Abbas Araghchi.\n— CNBC's Sam Meredith contributed to this report.",
    "bodyJa": "A United Nations fact-finding mission said there was evidence to believe that the U.S. committed war crimes during the Iran war, lending credibility to Tehran's similar claims.\nThere are \"reasonable grounds\" to believe that Washington's forces \"committed the war crime of launching indiscriminate attacks resulting in the loss of life or injury to civilians or damage to civilian objects,\" the UN's Independent International Fact-Finding Mission on Iran said on Thursday.\nThe mission pointed out the Tomahawk missile strike on a primary school that killed more than 150 people in the city of Minab, and another airstrike where missiles were used against a \"clearly identifiable sports complex and residential area,\" killing 22 civilians.\nThe report said the school was the intended point of impact, and the resulting damage wasn't the result of an errant strike or collateral damage from an attack on a compound of Iran's Revolutionary Guard next to the school.\nThe experts said they found no information indicating that the school was used for military purposes at the time.\nA State Department Official said the U.S. does not give credibility to the report's findings, adding that the UN council \"pushes anti-American rhetoric and antisemitism\" and \"appeases repressive regimes.\"\nCNBC has reached out to the Pentagon for comments.\nThe Associated Press reported that the White House has also pushed back on the report, with spokesperson Anna Kelly saying \"The only party in this conflict that has committed war crimes is the Iranian regime.\"\nThe fact-finding mission also charged Iran with human rights violations and \"crimes against humanity committed.\"\nWashington had withdrawn from the UN Human Rights Council via an executive order from President Donald Trump in February 2025, saying that some UN agencies and bodies, including the council, were acting contrary to the interests of the U.S.\nSeparately, hopes are rising again that negotiations around the Middle East conflict could restart. According to an MS NOW report, government officials have said that a meeting between Gulf Arab nations, the U.S. and Iran could take place around the time of the United Nations General Assembly next week.\nThe report comes as the U.S. approved the Iranian delegation's travel to attend the United Nations General Assembly. A State Department spokesperson said that the delegation will be under travel restrictions, and will be prohibited from purchasing luxury or other goods.\nThe AP reported that Tehran's delegation is expected to include President Masoud Pezeshkian and Foreign Minister Abbas Araghchi.\n— CNBC's Sam Meredith contributed to this report.",

    "id": "japan-raises-interest-rate-to-new-31-yea-1dfd8d95",
    "title": "Japan raises interest rate to new 31-year high to curb rising prices",
    "titleJa": "Japan raises interest rate to new 31-year high to curb rising prices",
    "summaryJa": "Central banks around the world have hiked rates as high energy prices are pushing up inflation.",
    "bodyOriginal": "Japan raises interest rate to new 31-year high to curb rising prices\n- Published\nJapan's central bank has raised its main interest rate to a fresh 31-year high as it continues to move away from decades of ultra-low borrowing costs and as the country faces increasing economic pressures.\nIn a widely expected move on Friday, the Bank of Japan (BOJ) increased the rate from 1% to 1.25% - a level not seen since 1995.\nIt comes as major central banks around the world are hiking rates as higher energy prices caused by the Iran war are helping to push up inflation.\nOn Wednesday, the US Federal Reserve raised its benchmark interest rate for the first time in over three years, while the European Central Bank also increased its borrowing costs earlier this month.\nThe BOJ has been raising the rate since 2024, when it stood at minus 0.1%. It has now hiked rates six times in the last two and a half years.\nSince then the bank has been steadily putting up the rate as it tries to reach a level similar to other major economies.\nWhen a central bank raises rates, the country's currency usually becomes stronger as it makes the it more attractive to traders.\nJapan is facing several economic challenges including a persistently weak yen, rising prices and a shrinking workforce.\nOfficial figures published on Friday ahead of the BOJ announcement showed that inflation eased slightly last month.\nCore inflation fell to 1.7% in August from 1.8% the previous month but remains close to the bank's 2% target level.\nWhile Japan's inflation rate is not high by international standards, rising prices are a relatively new development in the economy.\nUntil recently the country had experienced very low inflation or deflation - falling prices - for around three decades.\nGlobal oil and gas prices have risen this year as the Iran war caused major disruptions to shipments through the key Strait of Hormuz shipping route.\nJapan is particularly vulnerable to those supply interruptions as it is heavily reliant on energy from the Middle East.\nThe country's currency has also been under pressure in recent months.\nIn August, Tokyo and Washington confirmed that they had jointly intervened to halt a slide in the yen after it fell to a fresh 40-year low.\nThe coordinated intervention was the first since 2011, when both countries took action together to weaken the yen after the devastating earthquake and tsunami that hit eastern Japan.\nBoth Japan's Ministry of Finance and US Treasury Secretary Scott Bessent said at the time that they would not hesitate to conduct more joint interventions in the future.\nBessent has also been ramping up pressure on the BOJ to raise interest rates to help support the yen, calling on its Governor Kazuo Ueda to \"do the right thing\".",
    "bodyJa": "Japan raises interest rate to new 31-year high to curb rising prices\n- Published\nJapan's central bank has raised its main interest rate to a fresh 31-year high as it continues to move away from decades of ultra-low borrowing costs and as the country faces increasing economic pressures.\nIn a widely expected move on Friday, the Bank of Japan (BOJ) increased the rate from 1% to 1.25% - a level not seen since 1995.\nIt comes as major central banks around the world are hiking rates as higher energy prices caused by the Iran war are helping to push up inflation.\nOn Wednesday, the US Federal Reserve raised its benchmark interest rate for the first time in over three years, while the European Central Bank also increased its borrowing costs earlier this month.\nThe BOJ has been raising the rate since 2024, when it stood at minus 0.1%. It has now hiked rates six times in the last two and a half years.\nSince then the bank has been steadily putting up the rate as it tries to reach a level similar to other major economies.\nWhen a central bank raises rates, the country's currency usually becomes stronger as it makes the it more attractive to traders.\nJapan is facing several economic challenges including a persistently weak yen, rising prices and a shrinking workforce.\nOfficial figures published on Friday ahead of the BOJ announcement showed that inflation eased slightly last month.\nCore inflation fell to 1.7% in August from 1.8% the previous month but remains close to the bank's 2% target level.\nWhile Japan's inflation rate is not high by international standards, rising prices are a relatively new development in the economy.\nUntil recently the country had experienced very low inflation or deflation - falling prices - for around three decades.\nGlobal oil and gas prices have risen this year as the Iran war caused major disruptions to shipments through the key Strait of Hormuz shipping route.\nJapan is particularly vulnerable to those supply interruptions as it is heavily reliant on energy from the Middle East.\nThe country's currency has also been under pressure in recent months.\nIn August, Tokyo and Washington confirmed that they had jointly intervened to halt a slide in the yen after it fell to a fresh 40-year low.\nThe coordinated intervention was the first since 2011, when both countries took action together to weaken the yen after the devastating earthquake and tsunami that hit eastern Japan.\nBoth Japan's Ministry of Finance and US Treasury Secretary Scott Bessent said at the time that they would not hesitate to conduct more joint interventions in the future.\nBessent has also been ramping up pressure on the BOJ to raise interest rates to help support the yen, calling on its Governor Kazuo Ueda to \"do the right thing\".",

    "id": "oil-prices-fall-as-saudi-supply-hopes-ou-53506360",
    "title": "Oil prices fall as Saudi supply hopes outweigh fresh Houthi strikes",
    "titleJa": "Oil prices fall as Saudi supply hopes outweigh fresh Houthi strikes",
    "summaryJa": "Oil prices fell on Friday as additional Saudi crude supplies help ease disruption fears.",
    "bodyOriginal": "Oil prices fell on Friday as investors weighed fresh strikes between Saudi Arabia and Yemen's Iran-backed Houthis against signs that additional Saudi crude could reach global markets and help ease supply concerns.\nBrent crude futures, the international benchmark, were down 0.94% to $103.83 per barrel. U.S. West Texas Intermediate futures were down 0.88% to $101.01 per barrel.\nSaudi Arabia and the Houthis exchanged fresh attacks across their border on Thursday, raising concerns that the widening Middle East conflict could further disrupt energy supplies already strained since the U.S. and Israel attacked Iran in February.\nStill, reports that Saudi Arabia has found alternative ways to deliver some crude shipments to Asian buyers via Oman have helped ease fears of a more severe supply disruption from the closure of a key pipeline after Houthi attacks on it.\nThe latest decline in crude prices reflects a partial unwinding of the geopolitical risk premium rather than a fundamental change in the oil market, according to Simon-Peter Massabni, head of business development at XS.com.\nImproved logistics for Saudi crude exports have reduced the market's assessment of how much supply is at risk, Massabni said, adding that oil prices reflect not just available barrels but also the probability of those supplies being disrupted.\nStill, the Middle East supply network remains vulnerable, with traders particularly sensitive to developments around the Strait of Hormuz, export routes and oil terminals, he said. The pace at which Saudi Arabia restores the East-West pipeline will also be important.\nMassabni expects oil prices in the near term to remain more sensitive to geopolitical developments than traditional supply-and-demand indicators. Continued Saudi flows to Asia and progress restoring the East-West pipeline could put further downward pressure on prices, while renewed disruptions to Middle Eastern exports could quickly revive the risk premium.",
    "bodyJa": "Oil prices fell on Friday as investors weighed fresh strikes between Saudi Arabia and Yemen's Iran-backed Houthis against signs that additional Saudi crude could reach global markets and help ease supply concerns.\nBrent crude futures, the international benchmark, were down 0.94% to $103.83 per barrel. U.S. West Texas Intermediate futures were down 0.88% to $101.01 per barrel.\nSaudi Arabia and the Houthis exchanged fresh attacks across their border on Thursday, raising concerns that the widening Middle East conflict could further disrupt energy supplies already strained since the U.S. and Israel attacked Iran in February.\nStill, reports that Saudi Arabia has found alternative ways to deliver some crude shipments to Asian buyers via Oman have helped ease fears of a more severe supply disruption from the closure of a key pipeline after Houthi attacks on it.\nThe latest decline in crude prices reflects a partial unwinding of the geopolitical risk premium rather than a fundamental change in the oil market, according to Simon-Peter Massabni, head of business development at XS.com.\nImproved logistics for Saudi crude exports have reduced the market's assessment of how much supply is at risk, Massabni said, adding that oil prices reflect not just available barrels but also the probability of those supplies being disrupted.\nStill, the Middle East supply network remains vulnerable, with traders particularly sensitive to developments around the Strait of Hormuz, export routes and oil terminals, he said. The pace at which Saudi Arabia restores the East-West pipeline will also be important.\nMassabni expects oil prices in the near term to remain more sensitive to geopolitical developments than traditional supply-and-demand indicators. Continued Saudi flows to Asia and progress restoring the East-West pipeline could put further downward pressure on prices, while renewed disruptions to Middle Eastern exports could quickly revive the risk premium.",

  {
    "id": "early-bowie-music-available-to-stream-fo-b2bede7c",
    "title": "Early Bowie music available to stream for first time",
    "titleJa": "Early Bowie music available to stream for first time",
    "summaryJa": "Previously unheard material from the start of the artist's career has been released for the first time.",
    "bodyOriginal": "Early Bowie music available to stream for first time\n- Published\nTen years ago Alec Palao was casually flicking through a collection of old records when he noticed some faint pencil markings that were enough to draw a gasp. \"Davie Jones,\" it read.\nWhat he had found was musical gold: five unreleased songs by a young David Bowie, filed away under his birth name.\nFrom Friday, those tracks, plus another five unreleased songs that came Palao's way after the initial discovery, will be available to buy and stream.\n\"They are probably the most visceral, raw you'll ever hear the man,\" said Palao, a music historian and archivist.\nFor the music industry, David Bowie is big business. He entered the mainstream with his 1969 single, Space Oddity, and went on to achieve 11 number one albums.\nHe died in 2016, but remains one of Britain's most recognisable cultural icons.\nSix of the previously unreleased tracks from the new collection will be available on vinyl, tapping into Bowie's popularity in that format specifically. In 2022, Bowie was named the best-selling vinyl artist of the 21st century by Music Week, ahead of The Beatles.\n\"It's just a fascinating window into London in 1965 and its possibilities,\" said Palao.\nIn the early sixties, Bowie was a teenager, performing as Davie Jones at London clubs and dreaming of stardom. Many of the tracks he recorded in that period are either little known or lost to time.\nBut his first professional producer, Shel Talmy, had kept a recording from 1965 among his collection of material by other artists he had worked with: The Kinks; The Who; Manfred Mann; The Easybeats.\nIt was within Talmy's collection that Palao came across the valuable 12-inch acetate.\nThat material and the five other previously unheard tunes, as well as demos and remastered songs, form part of a new, posthumous album called The Shel Talmy Recordings.\nA limited edition vinyl will be sold at Record Store Day and HMV outlets.\nIn 2022, David Bowie's estate sold the publishing rights to decades of the singer's work to Warner Music Group. For this new material, Palao, along with Talmy Enterprises Incorporated, licensed the album to Warner, and it will be released by the company's subsidiary, Parlophone. Royalties will be paid to Bowie's estate by Warner.\nBowie experimenting\n\"I think it's wonderful that people can get to hear the early Davie Jones music,\" said Dana Gillespie, an early collaborator of Bowie's.\nShe met him after a performance at the Marquee Club in London when Bowie was 17.\n\"They're songs that don't really sound like David but it's him trying to find his voice. He was experimenting.\"\nGillespie became close friends with Bowie, eventually working with him on his \"Ziggy Stardust\" album. Talmy worked with both artists and Bowie's song \"Andy Warhol\", on his fourth studio album, was originally written for Gillespie.\n\"He was very driven,\" remembered Gillespie, who is still touring and making music at the age of 77.\n\"Some time in the sixties, he asked me to come and visit his parents. We were in his little house in Bromley, and when his parents left the room he turned to me and said: 'Whatever it takes, I want to get out of here.' And he did,\" she said.\nIt is a decade since Palao found the recordings. Since then, it has been a long process to bring them to market. The result is an album that he says is \"absolutely pure rock 'n' roll\".\n\"If you're looking for clues as to what he was to become, there's maybe less of that,\" said Palao, \"but objectively speaking, I feel it's important stuff.\"\nGillespie is excited by one song in particular.\n\"There was a famous café called the Gioconda in Denmark Street where I often used to go with David,\" she said, recalling the centre of musical life in London in the 1960s.\n\"One day when I was sitting there, David rushed in and took me by the hand. He said: 'You have to hear this'.\n\"He ran with me around the corner and squeezed us into a small listening booth. I had one speaker and he had the other, and he played me 'I Pity The Fool'.\"\nA remastered version of the song can be heard in the new album.\nFor music historians, fans of Bowie, and those who were there, the new album is another chance to reconnect with an enduring cultural icon.\n\"David always wanted to be a big star,\" said Gillespie. \"I'm so happy that his early stuff hasn't been forgotten.\"\nRelated topics\n- Published27 August\n- Published10 January",
    "bodyJa": "Early Bowie music available to stream for first time\n- Published\nTen years ago Alec Palao was casually flicking through a collection of old records when he noticed some faint pencil markings that were enough to draw a gasp. \"Davie Jones,\" it read.\nWhat he had found was musical gold: five unreleased songs by a young David Bowie, filed away under his birth name.\nFrom Friday, those tracks, plus another five unreleased songs that came Palao's way after the initial discovery, will be available to buy and stream.\n\"They are probably the most visceral, raw you'll ever hear the man,\" said Palao, a music historian and archivist.\nFor the music industry, David Bowie is big business. He entered the mainstream with his 1969 single, Space Oddity, and went on to achieve 11 number one albums.\nHe died in 2016, but remains one of Britain's most recognisable cultural icons.\nSix of the previously unreleased tracks from the new collection will be available on vinyl, tapping into Bowie's popularity in that format specifically. In 2022, Bowie was named the best-selling vinyl artist of the 21st century by Music Week, ahead of The Beatles.\n\"It's just a fascinating window into London in 1965 and its possibilities,\" said Palao.\nIn the early sixties, Bowie was a teenager, performing as Davie Jones at London clubs and dreaming of stardom. Many of the tracks he recorded in that period are either little known or lost to time.\nBut his first professional producer, Shel Talmy, had kept a recording from 1965 among his collection of material by other artists he had worked with: The Kinks; The Who; Manfred Mann; The Easybeats.\nIt was within Talmy's collection that Palao came across the valuable 12-inch acetate.\nThat material and the five other previously unheard tunes, as well as demos and remastered songs, form part of a new, posthumous album called The Shel Talmy Recordings.\nA limited edition vinyl will be sold at Record Store Day and HMV outlets.\nIn 2022, David Bowie's estate sold the publishing rights to decades of the singer's work to Warner Music Group. For this new material, Palao, along with Talmy Enterprises Incorporated, licensed the album to Warner, and it will be released by the company's subsidiary, Parlophone. Royalties will be paid to Bowie's estate by Warner.\nBowie experimenting\n\"I think it's wonderful that people can get to hear the early Davie Jones music,\" said Dana Gillespie, an early collaborator of Bowie's.\nShe met him after a performance at the Marquee Club in London when Bowie was 17.\n\"They're songs that don't really sound like David but it's him trying to find his voice. He was experimenting.\"\nGillespie became close friends with Bowie, eventually working with him on his \"Ziggy Stardust\" album. Talmy worked with both artists and Bowie's song \"Andy Warhol\", on his fourth studio album, was originally written for Gillespie.\n\"He was very driven,\" remembered Gillespie, who is still touring and making music at the age of 77.\n\"Some time in the sixties, he asked me to come and visit his parents. We were in his little house in Bromley, and when his parents left the room he turned to me and said: 'Whatever it takes, I want to get out of here.' And he did,\" she said.\nIt is a decade since Palao found the recordings. Since then, it has been a long process to bring them to market. The result is an album that he says is \"absolutely pure rock 'n' roll\".\n\"If you're looking for clues as to what he was to become, there's maybe less of that,\" said Palao, \"but objectively speaking, I feel it's important stuff.\"\nGillespie is excited by one song in particular.\n\"There was a famous café called the Gioconda in Denmark Street where I often used to go with David,\" she said, recalling the centre of musical life in London in the 1960s.\n\"One day when I was sitting there, David rushed in and took me by the hand. He said: 'You have to hear this'.\n\"He ran with me around the corner and squeezed us into a small listening booth. I had one speaker and he had the other, and he played me 'I Pity The Fool'.\"\nA remastered version of the song can be heard in the new album.\nFor music historians, fans of Bowie, and those who were there, the new album is another chance to reconnect with an enduring cultural icon.\n\"David always wanted to be a big star,\" said Gillespie. \"I'm so happy that his early stuff hasn't been forgotten.\"\nRelated topics\n- Published27 August\n- Published10 January",

    "titleJa": "Why we bought our first home with a 100% mortgage - despite the risks",
    "summaryJa": "The share of UK mortgages with smaller deposits is the highest it's been since 2008. The BBC spoke to borrowers about how they manage the risks.",
    "bodyOriginal": "Why we bought our first home with a 100% mortgage - despite the risks\n- Published\nUntil last year, Conroy, 32, and his partner Amber, 28, saw little prospect of owning their own home. They were renting in central Manchester where they work and could not afford to save up for a deposit.\nThen they came across a relatively niche, and some experts say riskier, type of mortgage that offered a solution.\nThe Track Record mortgage from Skipton Building Society covers 100% of the value of a property, with the borrower paying nothing upfront.\nBorrowers must meet strict eligibility checks and pay a higher interest rate - in Conroy and Amber's case 5.33% fixed for five years - but they were happy to do this. And in August they bought a four-bed home for £242,000 in Swinton on the edge of Manchester.\n\"I don't think it's dawned on us it's really ours,\" says Conroy, a video editor.\nThe return of low-deposit deals\nAccording to the Bank of England, the share of UK mortgages with deposits worth less than 10% of the property's value is currently the highest it has been since 2008, external when such loans were widely available.\nThe average deposit for first-time buyers is currently around 20%.\nIt comes as lenders such as Lloyds, Santander, Skipton and Yorkshire Building Society have launched a raft of new mortgage deals over the last few years covering upwards of 95% of the value of a property, and in some cases as much as 100%.\nThey say they want to help first-time buyers get on the housing ladder as property prices continue to rise and while saving for a deposit remains a struggle.\nBut these loans tend to charge higher rates, aren't available for all types of property or borrower, and come with risks customers should be aware of.\nConroy and Amber, a solicitor, have a 25-year loan with monthly repayments of £1,500 - roughly what they were paying in rent.\nHe says they feel comfortable with the higher cost because they \"earn quite well\" and expect their salaries to rise.\nBut he is aware there is a greater risk of falling into negative equity with a no- or low-deposit mortgage. That is when the value of a property falls below the value of the loan still owed on it - leaving the borrower with potentially painful costs if they suddenly have to sell.\nConroy says they plan to overpay their mortgage for the first five years to build up more equity in their home.\n\"There is always the element of a gamble with the property market,\" he says.\n\"But I have researched the area we moved to and don't think house prices are going to drop.\"\n'We plan to stay here our whole lives'\nTwenty-seven-year-old Bronya and her partner George, 29, also used a low-deposit mortgage to buy their four-bedroom house in Rhuddlan, North Wales in August.\nLloyds lent them £258,000 - roughly 98% of the property's value - over a 33-year term and they only had to put down £5,000 as a deposit.\nThe couple pay an interest rate of 5.89%, fixed for five years, equating to monthly repayments of £1,400 - about the same as what they paid to rent a one-bed flat before.\nBronya, a civil servant, says they could have put down a bigger deposit but wanted to use their savings for a renovation project costing upwards of £20,000.\nThey are aware of the risks of negative equity but believe the refurbishment will boost the value of their home.\n\"We also plan to stay here our whole lives,\" George adds, explaining that they are prepared to ride out any dips in the property market.\nWidespread uptake of low-deposit mortgages by borrowers who could not afford them was seen as a major factor in the 2008 global financial crisis.\nBut today's deals have much stronger affordability checks and do not pose the same risks, says David Hollingworth, associate director at brokers L&C Mortgages.\nBorrowers of Skipton's zero-deposit mortgage, for example, have to prove they have kept up with their rent for at least 12 consecutive months and credit payments for the last six months.\nAnd Lloyds won't issue one of its £5,000 deposit mortgages for new-build properties and shared ownership homes.\nHollingworth says lenders are recognising that some people have \"good affordability but may be struggling to save for a deposit while paying a rent and dealing with cost of living pressures\".\nFollowing a recent rule change, he adds, lenders are also offering more \"flex\" on how much someone can borrow as long as it's within their means.\nNevertheless, he urges borrowers to use common sense.\n\"Think carefully - what do monthly payments look like? Are you aware that interest rates could go up?\"\nGet in touch\nAre you buying your first home? How have you managed it?",

onths.\nAnd Lloyds won't issue one of its £5,000 deposit mortgages for new-build properties and shared ownership homes.\nHollingworth says lenders are recognising that some people have \"good affordability but may be struggling to save for a deposit while paying a rent and dealing with cost of living pressures\".\nFollowing a recent rule change, he adds, lenders are also offering more \"flex\" on how much someone can borrow as long as it's within their means.\nNevertheless, he urges borrowers to use common sense.\n\"Think carefully - what do monthly payments look like? Are you aware that interest rates could go up?\"\nGet in touch\nAre you buying your first home? How have you managed it?",
