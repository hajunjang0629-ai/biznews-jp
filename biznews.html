    "titleJa": "The virtual worlds where robots are trained",
    "summaryJa": "Training systems that allow robots to negotiate the real world are getting more sophisticated.",
    "bodyOriginal": "The virtual worlds where robots are trained\n- Published\nFreddo the robot walks across the office and takes a plastic bottled offered by a staff member.\nGiven that a robot recently beat Usain Bolt's 100m sprint record, it's not the most startling achievement.\nBut the speed by which Freddo has been trained to walk, recognise the bottle and grasp it is impressive. It took just a few minutes to develop those skills and upload them to Freddo. His developers say rival systems could take days to attain such skills.\nI'm at Vsim, a British start-up based in Cambridge. Founders Michelle Lu and Kier Storey hope one day their software will control robots that can navigate and do useful tasks in the home and workplace.\nBut there's a long way to go.\n\"It's a weird situation with robotics because actually the stuff that we find as humans to be incredibly difficult, like gymnastics, you can get robots to do reasonably well. The stuff that humans are really good at, like fine dexterity, is really hard in robots,\" Storey says.\nFreddo's skills were honed in a virtual environment, where a task can be performed in a computer simulation millions of times. Once the optimum solution (known as a policy) is found, it can be uploaded and used by the hardware - in this case Freddo.\nSuch virtual simulations are a common way to train robots. Tech giant Nvidia has a system called Isaac Sim which works that way - Lu and Storey both worked on an early version of it.\nIn 2022 they decided to set up Vsim, to build the their own training system environment and other tools.\nAs they were starting from scratch Lu and Storey could optimise the software to exploit the powerful computer chips used in AI, known as graphics processing units or GPUs.\n\"The underlying algorithms that we were using for most of these robotic simulations they hark back to the 1970s and 1980s, but those algorithms are not really brilliant fits for GPUs,\" Storey says.\nWithin months they realised their system could work much faster than anything they had seen before.\n\"Eighteen months in and we actually have a completely functional, super high-performance simulator,\" says Lu.\nThe software is so efficient that it can run on the hardware carried by Freddo. That means the robot can run tens of thousand of simulations while it is moving around.\n\"It can look about a second, or so, ahead into the future for 20,000 different kind of combinations of things that might happen,\" Storey explains.\nAnd that would be vital for a robot moving around an unstructured environment like the average home.\n\"Things outside of the robot's control, like humans, animals or even other robots, could do things that require a change of strategy. These unexpected events could happen very quickly and the robot needs to be able to quickly adapt to ensure its actions remain safe and on-mission,\" Lu says.\nVsim is a start-up with 10 engineers working on its tech. Nvidia is at the other end of the industry. It dominates the market for computer chips used for AI and has a leading robotics software division, with hundreds of engineers.\nIt does not build robots, instead it has a suite of software designed to let organisations train and control robots.\nThat includes virtual simulation training systems and a so-called world model, external, called Cosmos, which gives a robot an understanding of the physics of the real world and how its environment might change as it moves around.\nBut even with the powerful computer resources available to Nvidia, the software only gives a rudimentary understanding of the real world.\n\"Manipulation, - where I just grab a bottle, that's not too hard. The problem is when you start doing long-horizon tasks, where I say: 'I want you to take the bottle and I want you to fill it up and I want you to go pour',\" says Spencer Huang, director of product for robotics at Nvidia.\nBut he's confident that good progress is being made. This year Nvidia has started using AI agents to help build virtual environments to train robots and validate whether the solutions from training work or not.\n\"When we talk about creating the [virtual] world and actually scanning it in - a lot of that is actually manual labour.\n\"We're just throwing agents at it... it's basically given us a huge workforce,\" Huang says.\nSimulation is not the only method for training robots. They can also be trained by watching human or video demonstrations.\nRika Antonova has been working in the field of robotics since 2015 and is currently an associate professor at the Department of Computer Science and Technology at the University of Cambridge.\nHer research is focused on, external developing software and hardware that can aid robots to learn complex behaviour.\nAntonova works with a training system called MuJoCo, owned by Google's DeepMind since 2021. It's open-source software, which means researchers can use it for free, and are allowed to tinker with the code.\n\"It is very, very user-friendly. So for research groups or for small start-ups, that's useful,\" she says.\nShe says that Vsim's approach - very fast simulation - is promising.\n\"If you have a very, very fast simulator, then you can simulate hundreds of millions of samples in that few seconds that your robot is thinking about how to adjust its motion, and then you can change the motion almost in real time,\" she says.\nBut those simulated environments are still rough approximations of the real world, which limits what can be trained.\n\"There are certain things that are hard to model in simulation, like highly deformable objects and cutting,\" she says.\nIt's a challenge that Nvidia and Lu and Storey at Vsim are working on.\nLu says their system has \"reduced approximation, using accurate simulations to train models that genuinely work in reality as well as they do in simulations.\"\nSoon a second robot, to be called Nacho, will be helping develop that tech.\nLu says that should speed up their development process and ensure their software can run on different machines.\nAnd, of course, provide Freddo with some company.\nRelated topics\n- Published19 August\n- Published12 August\n- Published7 August",

    "id": "healey-to-ask-eu-finance-ministers-to-le-2db9fd6b",
    "title": "Healey to ask EU finance ministers to let UK into industry scheme",
    "titleJa": "Healey to ask EU finance ministers to let UK into industry scheme",
    "summaryJa": "The chancellor wants the Made in Europe programme to deepen ties with the UK \"rather than erecting new barriers\".",
    "bodyOriginal": "Healey to ask EU finance ministers to let UK into industry scheme\n- Published\nThe chancellor is to warn the European Union (EU) not to lock the UK out of its scheme to protect industries from unfair Chinese competition.\nJohn Healey will push for closer UK-EU partnerships on tech, defence, and manufacturing at a meeting of EU finance ministers in Dublin on Friday.\nBut he will call on the EU to design its \"Made in Europe\" programme in a way that deepens ties with the UK \"rather than erecting new barriers\", Treasury sources told the BBC.\nOfficials said Healey will tell European finance ministers it is important to \"learn lessons\" after talks collapsed last year for Britain to join an EU defence loans scheme.\nThat dispute centred on how much money the UK would pay to join.\nThe \"Made in Europe\" policy, officially called the Industrial Accelerator Act (IAA), is currently being considered by the bloc and aims to protect EU manufacturing with restrictions on goods from outside countries.\nThere is concern in government the scheme could lock British firms out of European supply chains.\nTreasury officials said Healey wanted to reduce the economic impact of Brexit and build closer ties with the EU, but not at any cost to the UK.\nHealey said: \"The next chapter of Britain's growth story will be written in more places.\n\"To me, closer ties with the EU means British businesses – wherever they are based across the UK – get better access to both the supply chains and the customers they need to grow.\"\nHealey will use the meeting in Dublin to focus on tech firms, defence companies, and manufacturing.\n\"The chancellor wants to make sure nothing holds them back,\" a Treasury source said.\nIt comes after a reset summit with the EU was delayed after Sir Keir Starmer's resignation as prime minister.\nTreasury sources now expect that to take place in November.\nHealey's meeting in Dublin comes after it emerged earlier this week that he is in discussions about joining a global investment bank aimed at raising more money for defence spending.\nHe is considering a bid to join the Defence, Security and Resilience Bank (DSRB), not long after his predecessor Rachel Reeves rejected the idea.\nCanada has been leading efforts to establish the bank, which supporters say would enable governments to borrow at lower costs to increase military spending.\nPaying for the UK's growing defence commitments is one of Healey's biggest headaches as he prepares for the Budget in October and next year's spending review.\nConservatives urge Burnham to rule out tax rises at Budget\n- Published15 hours ago\nUK in talks about joining global defence bank led by Canada\n- Published2 days ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
