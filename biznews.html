    "titleJa": "タイ首相、銃撃で8人死亡を受け、より厳格な銃規制の導入を誓う",
    "summaryJa": "タイ首相、銃撃で8人死亡を受け、より厳格な銃規制の導入を誓う- 公開されました",
    "bodyOriginal": "Thai PM vows to introduce stricter gun laws after eight killed in shooting\n- Published\nThailand's prime minister has vowed to introduce new gun control laws in the wake of a shooting by a teenager on the outskirts of Bangkok that left eight people dead and 22 injured.\nThe 14-year-old killed his grandparents at the home they shared, before travelling to Debsirin School in Nonthaburi, where he was a student. There, he killed five teachers before taking his own life. Later, Thai media reported that a student had also died from their injuries.\nSpeaking after the attack, Prime Minister Anutin Charnvirakul said he plans to introduce laws that restrict the carrying of firearms in public, with the new legislation only allowing government officials on duty to carry guns.\nI was standing in front of my teacher when she was shot, Thai pupil says\n- Published11 hours ago\nPolice Colonel Thadsakorn Konthong said that the gun and bullets used in the attack belonged to the teen's grandfather, with an initial inspection finding signs that the firearm had been searched for inside the grandfather's bedroom.\nInternational and local media have reported that the gun was legally registered and had a permit.\nThailand has one of the highest rates of civilian gun ownership in South East Asia, with around 10.3 million firearms in civilian possession, around four million of which are believed to be owned illegally.\nThe country has strict gun laws, which punish the illegal possession of arms with up to 10 years in jail, but enforcement of these laws has been an issue.\nDuring his time as interior minister, Anutin introduced a number of gun control laws, including a short-term ban on new gun licenses and import restrictions.\nSpeaking on Friday, the prime minister said the tragedy \"shouldn't have happened\".\n\"I don't just feel sorry for the victims but I feel sorry that this happened. How can this happen in our country,\" Anutin added.\nThe teenager is believed to have shot his 73-year-old grandfather and 74-year-old grandmother at their two-storey flat at around 05:00 local time on Friday (22:00 GMT on Thursday).\nEach was killed by a single shot to the head, a Thai police official said.\nAfter killing his grandparents, the teenager boarded a school bus carrying the firearm and dozens of bullets, Reuters news agency reported.\nHe then attended his first class at 08:30 and his second at 09:20.\nAround half an hour into his second class of the day, he drew the gun and began shooting.\nThe teenager is believed to have first shot teachers on the school's sixth floor, killing three of them.\n\"He then walked down the stairs and encountered the school's deputy director and the director's secretary, who were going up the stairs to check on the situation,\" Police Major General Dejrapee Kongdee told Reuters.\n\"The attacker shot and killed both of them on the staircase.\"\nPolice were deployed to the scene while the shooting was ongoing. They found the attacker, who by then had shot himself, around 10:40, Dejrapee said.\nFive people were immediately killed and at least 23 were wounded. Later, Thailand's public broadcaster and the Bangkok Post reported that an eighth victim had died.\nNational police chief Gen Kittiratt Phanphet told reporters that forensic officers had found the attacker's shots were quite accurate, with several hitting vital spots on the body.\nThe prime minister said the attack was \"well prepared\" with \"clear steps and clear goals\".\nAccording to local media, police have searched devices belonging to the teenager and found several videos relating to school shootings in the US.\nThe teenager has been described as quiet and well behaved by family members in local media.\nHis uncle told Thai media the teen spent much of his time indoors playing violent video games and rarely went outside. He added there was no indication the teenager was planning the attack.\nThe attacker had lived with his grandparents, as his parents were divorced.\nThe Debsirin School, founded in Bangkok in 1885, is one of Thailand's top secondary schools with branches across the country. It counts many prominent Thai figures among its alumni, from diplomats and athletes to several prime ministers.",
    "bodyJa": "タイ首相、銃撃で8人死亡を受け、より厳格な銃規制の導入を誓う\n- 公開されました\nタイの首相は、バンコク郊外で８人が死亡、２２人が負傷した十代の少年による銃撃事件を受け、新たな銃規制法の導入を明言した。\n14歳の少年は、学生だったノンタブリーのデブシリン学校に行く前に、同居していた家で祖父母を殺害した。そこで彼は5人の教師を殺害し、自ら命を絶った。その後、タイのメディアは、学生も負傷がもとで死亡したと報じた。\n襲撃後の講演で、アヌティン・チャーンヴィラクル首相は、公の場での銃器の携行を制限する法律を導入する予定であり、新法では公務中の政府職員のみが銃器の携行を許可されると述べた。\nタイの生徒によると、彼女が撃たれたとき、私は先生の前に立っていた\n- 11 時間前に公開\nタダサコーン・コントーン警察大佐は、襲撃に使用された銃と弾丸は少年の祖父のもので、最初の検査で祖父の寝室内で銃器が捜索された形跡が見つかったと述べた。\n国際メディアや地元メディアは、この銃は合法的に登録され、許可を得ていたと報じた。\nタイは東南アジアの中でも民間の銃所有率が最も高い国の一つで、民間で約1,030万丁の銃が所持されており、そのうち約400万丁が違法に所有されていると考えられている。\n同国には厳格な銃規制があり、武器の不法所持には最高10年の懲役が科せられるが、これらの法律の執行が課題となっている。\nアヌティン氏は内務大臣時代に、新規銃のライセンスの短期禁止や輸入制限など、数多くの銃規制法を導入した。\n首相は金曜日の演説で、悲劇は「起こるべきではなかった」と述べた。\nアヌティンさんは「犠牲者に同情するだけでなく、このようなことが起こったことを残念に思う。我が国でどうしてこのようなことが起こり得るのか」と付け加えた。\nこの少年は金曜日の現地時間午前5時（日本時間木曜午後22時）頃、2階建てアパートで73歳の祖父と74歳の祖母を射殺したとみられている。\nタイの警察当局者によると、全員が頭部への一発の銃撃で死亡した。\nロイター通信によると、少年は祖父母を殺害した後、銃器と数十発の弾丸を積んでスクールバスに乗り込んだ。\nその後、彼は 8 時 30 分に最初の授業に出席し、09 時 20 分に 2 番目の授業に出席しました。\nその日2回目の授業が始まって30分ほど経った頃、彼は銃を抜いて撃ち始めた。\nこの少年はまず学校の6階で教師らを銃撃し、そのうち3人を殺害したと考えられている。\n「その後、彼は階段を下り、状況を確認するために階段を上っていた学校の副校長と校長秘書に遭遇した」と警察のデジラピー・コンディー少将はロイターに語った。\n「犯人は階段で二人を射殺した。」\n銃撃が続いている間、警察が現場に出動した。デジラピー氏によると、彼らは10時40分頃に襲撃犯を発見したが、その時までに自殺していたという。\n5人が即死し、少なくとも23人が負傷した。その後、タイの公共放送とバンコク・ポストは、8人目の犠牲者が死亡したと報じた。\n国家警察署長キティラット・ファンペット将軍は記者団に対し、法医当局は犯人の発砲は非常に正確で、数箇所が体の急所に命中したことを発見したと語った。\n首相は、今回の攻撃は「明確な段階と明確な目標」を持って「十分に準備されていた」と述べた。\n地元メディアによると、警察はこの少年が所有していたデバイスを捜索し、米国の学校での銃乱射事件に関連したビデオをいくつか発見した。\n地元メディアによると、家族らはこの少年は物静かで行儀が良かったと伝えている。\n彼の叔父はタイのメディアに対し、少年はほとんどの時間を屋内で暴力的なビデオゲームをして過ごし、外に出ることはほとんどなかったと語った。同氏は、この少年が襲撃を計画していた兆候はないと付け加えた。\n襲撃犯は両親が離婚していたため、祖父母と同居していた。\nデブシリン学校は 1885 年にバンコクに設立され、全国に支部を持つタイのトップ中等学校の 1 つです。卒業生には外交官やスポーツ選手から数人の首相に至るまで、タイの著名な人物が数多く名を連ねています。",

    "id": "saaspocalypse-debate-intensifies-as-sof-2cd3582a",
    "title": "‘SaaSpocalypse’ debate intensifies as software stocks swing wildly",
    "titleJa": "ソフトウェア株の乱高下で「SaaSpocalypse」議論が激化",
    "summaryJa": "今週は「サースポカリプス」が猛威を振るっていた。その後、猶予が与えられました。かつてのハイフライヤーであるエアテーブルを数ペニーで買収し、その後、収益報告でハブスポット、データドッグ、フィグマが急落したことはすべて、人工知能モデルが高価なソフトウェア製品の価値を食いつぶしているのではないかという投資家の懸念を強調する結果となった。",
    "bodyOriginal": "The \"SaaSpocalypse\" was raging this week. Then it got a reprieve.\nThe pennies-on-the-dollar acquisition of one-time highflyer Airtable, followed by plunges in HubSpot, Datadog and Figma on earnings reports, all served to underscore investor concerns that artificial intelligence models are eating away at the value of costly software products.\n\"I do think that companies are going to continue to use these coding agents to build functionality to maybe act as a little bit of pressure on renewals,\" said Matt Hedberg, a software analyst at RBC Capital Markets.\nBut by the end of the week, Wall Street was reminded that there's still juice left in an industry that, not long ago, was viewed as driving innovation and was trading at hefty market multiples.\nTwilio, a provider of cloud-based communications software, and Atlassian, which sells collaboration tools, each saw pops of well over 20% on Friday after reporting quarterly results. Cloudflare, which helps protect websites from cyber attacks, gained 5.6%.\nBox CEO Aaron Levie, who's been evangelizing cloud software since he started his file-sharing company more than two decades ago, was particularly impressed with Atlassian, which reported its most profitable quarter since 2021.\n\"Huge Atlassian quarterly beat,\" Levie wrote on X. \"There was a misplaced thesis over the past 6 months that somehow agents would be bad for certain software categories. There's definitely truth in this in some areas, but many were parsing this poorly.\"\nLevie's reaction reflects a level of nuance that's not always apparent in the sell-it-all trade. Salesforce CEO Marc Benioff has spent months trying to convince investors that his company's longstanding software for sales, marketing and customer service won't be vibe-coded away. Salesforce has lost more than 40% of its value since the end of 2024 despite accelerating revenue growth and consistent margins.\nSalesforce and its software peers have been under pressure, less because of their current growth rates and more because of the increasingly popular view that tools like OpenAI's Codex and Anthropic's Claude Code will slowly — and then rapidly — hollow out their economics.\nThe iShares Expanded Tech-Software Sector ETF plummeted 24% in the first quarter, its worst performance since 2008. However, it's since rebounded sharply and is now down just 3% for the year, while the Nasdaq is up 15%.\n'Pencils down'\nRBC's Hedberg said sentiment was so bad in the first quarter that clients didn't even want to discuss software.\n\"People were pencils down in the space,\" he said. \"They just didn't feel like it was worth their time to meet with software companies back then, and that was even high-quality companies.\"\nThat attitude has become a big problem for venture-backed software companies that raised money at hefty valuations in the pre-AI era and are now trying to figure out what's next for them. There haven't been any notable SaaS IPOs this year, and 86% of private deal value in the first half of 2026 went to AI companies, according to PitchBook data.\nConcerns were amplified on Tuesday, when Italian software buyout firm Bending Spoons said it had agreed to buy workflow management startup Airtable for less than $1.3 billion. At its peak in 2021, Airtable was valued at nearly $12 billion.\nBending Spoons, which held its own IPO in July, owns brands including AOL, Evernote and Vimeo, and now has a market cap of $28 billion.\nTwo days after the Airtable deal, HubSpot had its worst day on the market in a decade, sliding 19% and bringing its loss for the past year to over 50%. Datadog, which sells monitoring software, also sank 19% on Thursday, the steepest slump since its IPO in 2019. Still, the stock has been an outperformer, climbing 72% this year.\nDatadog said its biggest AI client, which analysts suspect is OpenAI, has cut usage since June.\n\"There's these reminders that we're not out of it,\" Hedberg said. \"Everything's not smooth sailing.\"\nThe mood improved after the close on Thursday, thanks to stronger reports from Atlassian, Twilio and Cloudflare. Atlassian CEO Mike Cannon-Brookes credited his company's research and development teams for working hard to give customers \"the best quality at the best price and the best speed.\"\nThe report came five months after Atlassian slashed 10% of its workforce, or 1,600 jobs, which Cannon-Brookes said at the time was necessary to \"self-fund further investment in AI and enterprise sales, while strengthening our financial profile.\"\nAtlassian's 35% surge on Friday marked its best day since the company went public in 2015. It's still down 8% this year after losing one-third of its value in 2025.\nRishi Jaluria, another RBC analyst, said some of the pop for Atlassian is likely attributable to short covering, meaning that investors who bet against the stock by borrowing shares and selling them are now buying them back.\n\"Everyone says Atlassian is going to get crushed by Claude Code and OpenAI Codex, and so they're done,\" said Jaluria, who doesn't cover the company. \"Any proof point that says, oh wait, this company isn't dead, is going to result in a short squeeze.\"\nWATCH: We do not think AI will kill 'SaaS' but slow decay is bad enough: CLSA",
    "bodyJa": "今週は「サースポカリプス」が猛威を振るっていた。その後、猶予が与えられました。\nかつてのハイフライヤーであるエアテーブルを数ペニーで買収し、その後、収益報告でハブスポット、データドッグ、フィグマが急落したことはすべて、人工知能モデルが高価なソフトウェア製品の価値を食いつぶしているのではないかという投資家の懸念を強調する結果となった。\nＲＢＣキャピタル・マーケッツのソフトウェアアナリスト、マット・ヘドバーグ氏は「企業は今後もこうしたコーディングエージェントを利用して機能を構築し、更新の際に多少のプレッシャーとなるのではないかと思う」と述べた。\nしかし、週末までにウォール街は、つい最近までイノベーションを推進すると見なされ、高額な市場倍率で取引されていた業界にまだ力が残っていることを思い知らされた。\nクラウドベースの通信ソフトウェアを提供するトゥイリオとコラボレーションツールを販売するアトラシアンは、四半期決算を発表した金曜日にそれぞれ20％を大きく超える上昇率を記録した。サイバー攻撃からウェブサイトを保護するサービスを提供するクラウドフレアは5.6％上昇した。\n20年以上前にファイル共有会社を立ち上げて以来、クラウドソフトウェアの普及を推進してきたBoxのCEO、アーロン・リービー氏は、2021年以来最も収益性の高い四半期を報告したアトラシアンに特に感銘を受けたという。\nLevie 氏は X について「アトラシアンの四半期ごとの大きなビートです。過去 6 か月間、エージェントが特定のソフトウェア カテゴリに悪影響を与えるという見当違いの理論がありました。これには一部の分野では間違いなく真実がありますが、多くはこれを適切に解析していませんでした。」と書いています。\nリービー氏の反応は、売り切り取引では必ずしも明らかではないレベルのニュアンスを反映している。セールスフォースの最高経営責任者（CEO）マーク・ベニオフ氏は、同社の販売、マーケティング、顧客サービス向けの長年のソフトウェアが雰囲気コード化されずに済むことを投資家に説得するのに数カ月を費やした。 Salesforce は、加速する収益成長と安定した利益率にもかかわらず、2024 年末以降、その価値の 40% 以上を失っています。\nSalesforce とそのソフトウェア製品は、現在の成長率よりもむしろ、OpenAI の Codex や Anthropic の Claude Code のようなツールが徐々に、そして急速に経済を空洞化させるという見方が広まっているため、プレッシャーにさらされています。\niシェアーズ・エキスパンド・ハイテク・ソフトウェア・セクターETFは第1四半期に24％急落し、2008年以来最悪のパフォーマンスとなった。しかし、その後急反発し、現在では年間でわずか3％下落しているのに対し、ナスダックは15％上昇している。\n「鉛筆を下げてください」\nRBCのヘドバーグ氏は、第1四半期のセンチメントは非常に悪かったため、顧客はソフトウェアについて話し合うことすら望まなかったと述べた。\n「空間では人々は鉛筆のような状態だった」と彼は言う。 「彼らは当時、たとえそれが高品質な企業であっても、ソフトウェア会社と会うことに時間を費やす価値があるとは感じていませんでした。」\nこうした姿勢は、AI以前の時代に高額の評価額で資金を調達し、現在は次の展開を模索しているベンチャー支援のソフトウェア企業にとって大きな問題となっている。今年は目立ったSaaS IPOはなく、PitchBookのデータによると、2026年上半期の非公開取引額の86％がAI企業に向けられた。\nイタリアのソフトウェア買収会社ベンディング・スプーンズが火曜日、ワークフロー管理スタートアップのエアテーブルを13億ドル未満で買収することで合意したと発表し、懸念はさらに増幅した。 2021年のピーク時には、Airtableの評価額は120億ドル近くに達した。\n7月に独自のIPOを行ったBending Spoonsは、AOL、Evernote、Vimeoなどのブランドを所有しており、現在時価総額は280億ドルとなっている。\nAirtable との取引から 2 日後、HubSpot は市場で 10 年間で最悪の日を迎え、19% 下落し、過去 1 年間の損失は 50% 以上に達しました。監視ソフトウェアを販売するデータドッグも木曜日に19％下落し、2019年のIPO以来最大の下落となった。それでも株価はアウトパフォームしており、今年は72％上昇している。\nDatadogは、アナリストがOpenAIではないかと疑う最大のAIクライアントが6月以降、使用量を削減していると述べた。\n「私たちがまだ危機を脱していないことを思い出させてくれます」とヘドバーグ氏は語った。 「すべてが順風満帆というわけではない。」\nAtlassian、Twilio、Cloudflareからの堅調なレポートのおかげで、木曜日の取引終了後に雰囲気は改善しました。アトラシアンの CEO、マイク・キャノン・ブルックス氏は、顧客に「最高の品質を最高の価格で、最高のスピードで」提供するために同社の研究開発チームが懸命に取り組んでいることを称賛した。\nこの報告書は、アトラシアンが従業員の10％、つまり1,600人を削減した5か月後に発表されたが、キャノンブルックス氏は当時、「当社の財務プロフィールを強化しながら、AIとエンタープライズ販売へのさらなる投資を自己資金で賄う」ために必要だったと述べていた。\nアトラシアンの金曜日の35％上昇は、同社が2015年に上場して以来最高の日となった。2025年には価値の3分の1を失った後、今年はまだ8％下落している。\n別のRBCアナリスト、リシ・ジャルリア氏は、アトラシアンの株価上昇の一部はショートカバーによる可能性が高く、株を借りて売却することで株に賭けていた投資家が現在株を買い戻していることを意味すると述べた。\n「アトラシアンはクロード・コードとオープンAI・コーデックスに潰されるだろうと誰もが言うが、もう終わりだ」と同社を取材していないジャルリア氏は語った。 「待てよ、この会社は死んでいないという証拠があれば、ショートスクイーズが起こるだろう。」\n注目: AI が「SaaS」を消滅させるとは思わないが、ゆっくりとした衰退は十分に悪いことです: CLSA",

    "id": "trump-revives-effort-to-fire-fed-s-lisa-1b7e7f54",

    "titleJa": "トランプ大統領、FRBのリサ・クック解任に向けた取り組みを再開",
    "summaryJa": "ホワイトハウスは今週、ドナルド・トランプ大統領が連邦準備制度理事会のリサ・クック総裁を解任することを「検討している」と発表し、6月に最高裁判所によって阻止されていた取り組みを復活させた。ホワイトハウスの大統領補佐官ダン・スカビーノ氏は水曜日付けのクック氏への書簡の中で、「1つ以上の住宅ローン契約に関して虚偽の発言をしたと信じる十分な理由がある」と述べた。",
    "bodyOriginal": "President Donald Trump is \"considering\" firing Federal Reserve Board Governor Lisa Cook, the White House said this week, reviving an effort that had been stymied by the Supreme Court in June.\nWhite House presidential aide Dan Scavino, in a letter to Cook dated Wednesday, said there is \"sufficient reason to believe that you made false statements on one or more mortgage agreements.\"\nThose are the same allegations Trump and his allies floated when he first moved to fire Cook from the central bank last year. Cook denied the charges and filed a lawsuit challenging her dismissal.\nA federal court blocked Trump from firing Cook while her suit was pending. The Supreme Court, in a 5-4 ruling in late June, upheld that decision against a challenge the president.\nBut Chief Justice John Roberts noted that the court's decision did not stop Trump from trying again to remove Cook over the mortgage fraud allegations. Any new attempt to fire her would require additional steps in order to protect Cook's Constitutional due process rights, Roberts wrote.\nScavino, Trump's deputy chief of staff and director of the Office of Presidential Personnel, wrote that he was sending Wednesday's letter \"pursuant to the Supreme Court's opinion.\"\nHe instructed Cook to provide an \"explanation for your false statements and accompanying evidence\" within three weeks.\nAbbe Lowell, a lawyer for Cook, told CNBC in a statement that the allegations \"are as baseless now as they were a year ago when President Trump tried to remove Governor Cook and interfere with the independence of the Federal Reserve.\"\n\"No matter what President Trump tries to do next, this much is clear under the facts and Supreme Court precedent — there is no valid cause for removing Governor Cook,\" Lowell's statement said. \"As we did before, we will challenge this latest pretext and preserve her position and the historic role of the Fed.\"\nThe Federal Reserve declined to comment on the White House's letter.\nTrump's initial move to fire Cook, who was appointed by former President Joe Biden, came as he ramped up his efforts to pressure the Fed to slash interest rates.\nThe mortgage-related allegations were surfaced by Federal Housing Finance Agency Director Bill Pulte, who has been criticized as an \"attack dog\" for Trump.\nPulte has also targeted other of Trump's perceived political foes, including New York Attorney General Letitia James, who also faced allegations of mortgage-related wrongdoing.\n— CNBC's Dan Mangan and Jeff Cox contributed to this report.",
    "bodyJa": "ホワイトハウスは今週、ドナルド・トランプ大統領が連邦準備制度理事会のリサ・クック総裁を解任することを「検討している」と発表し、6月に最高裁判所によって阻止されていた取り組みを復活させた。\nホワイトハウスの大統領補佐官ダン・スカビーノ氏は水曜日付けのクック氏への書簡の中で、「1つ以上の住宅ローン契約に関して虚偽の発言をしたと信じる十分な理由がある」と述べた。\nこれらは、トランプ氏が昨年クック氏を中央銀行から解任しようと初めて動いた際にトランプ氏とその同盟者らが提起したのと同じ主張だ。クック氏は容疑を否認し、解雇を求めて訴訟を起こした。\n連邦裁判所は、訴訟が係争中である間、トランプ氏がクック氏を解任することを差し止めた。最高裁判所は6月下旬、5対4の判決で、大統領への異議申し立てに対してこの決定を支持した。\nしかし、ジョン・ロバーツ首席判事は、裁判所の決定はトランプ大統領が住宅ローン詐欺疑惑をめぐってクック氏を再び解任しようとするのを阻止するものではないと指摘した。ロバーツ氏は、彼女を解雇しようとする新たな試みには、クック氏の憲法上の適正手続きの権利を守るために追加の措置が必要になると書いた。\nトランプ大統領首席補佐官兼大統領人事局長のスカビーノ氏は、水曜日の書簡は「最高裁判所の意見に従って」送ったと書いた。\n同氏はクック氏に対し、３週間以内に「虚偽の陳述と付随する証拠についての説明」を行うよう指示した。\nクック氏の弁護士アビー・ローウェル氏はＣＮＢＣに対し、この疑惑は「トランプ大統領がクック総裁を解任し、連邦準備理事会の独立性を妨害しようとした１年前と同様、今も根拠がない」との声明で述べた。\nローウェル氏は声明で「トランプ大統領が次に何をしようとしても、これだけは事実と最高裁判例から明らかだ。クック知事を解任する正当な理由はない」と述べた。 「以前と同様に、私たちはこの最新の口実に異議を唱え、彼女の立場とFRBの歴史的な役割を維持するだろう。」\nFRBはホワイトハウスの書簡についてコメントを控えた。\nトランプ大統領が最初に行動したのは、ジョー・バイデン前大統領によって任命されたクック氏の解任であり、FRBに利下げを求める圧力を強める中でのことだった。\n住宅ローン関連の疑惑は、トランプ大統領の「攻撃犬」と批判されている連邦住宅金融庁のビル・プルト長官によって表面化された。\nプルト氏はまた、同じく住宅ローン関連の不正行為の疑惑に直面しているニューヨーク州司法長官レティシア・ジェームズを含む、トランプ大統領の政敵とみなされる他の人物も標的にしている。\n— CNBCのダン・マンガン氏とジェフ・コックス氏がこのレポートに貢献しました。",

    "id": "burger-king-overtakes-wendy-s-as-the-nat-2d41d55b",
    "title": "Burger King overtakes Wendy's as the nation's second-largest burger chain",
    "titleJa": "バーガーキングがウェンディーズを追い抜き、全米第2位のハンバーガーチェーンに",
    "summaryJa": "バーガーキングは全店売上高でウェンディーズを追い抜き、米国第2位のハンバーガーチェーンとなり、ライバルチェーンに王位を奪われてから6年ぶりにその王座を奪回した。この立場の変更は、過去 2 年間の両社の業績の相違に伴うものです。",
    "bodyOriginal": "Burger King has overtaken Wendy's as the second-largest burger chain in the U.S. by systemwide sales, retaking its crown six years after losing it to the rival chain.\nThe change in positions follows the two companies' diverging results over the past two years.\nWendy's has reported shrinking U.S. same-store sales for six straight quarters. Its domestic same-store sales slipped 7% in its latest quarter, the company reported on Friday.\nMeanwhile, Burger King has been embarking on a turnaround and has seen its domestic same-store sales rise over the past five quarters; the Restaurant Brands International chain on Thursday reported U.S. same-store sales growth of 8.5% for its second quarter.\nMcDonald's holds onto its spot as the number one burger chain, with a significant lead. Although the company only reports its systemwide sales on a global basis, it held about 48% of the U.S. burger market share in 2024, according to Barclays. For comparison, at that time, Wendy's had an 11.4% share of the market, while Burger King had a 10% hold.\nWendy's initially overtook Burger King through the success of its nationwide breakfast launch. But staying number two has been a rocky road.\nBoth Wendy's and Burger King had to navigate the Covid-19 pandemic and the subsequent supply chain issues that led to soaring food costs. Then came the consumer pushback against rising menu prices and a pullback in restaurant spending.\nIn late 2022, Restaurant Brands announced a turnaround plan for Burger King's U.S. business after a year of lackluster sales. The strategy has focused on improving its food quality, investing in marketing and remodeling restaurants.\nWhile Burger King tried to find its footing, Wendy's was dealing with a revolving door of chief executives at a time when consumers were growing even more value conscious and beef costs were soaring.\nIn 2024, Wendy's longtime CEO Todd Penegor retired after eight years in the role. PepsiCo executive Kirk Tanner succeeded him but left after a little more than a year to lead Hershey's. CFO Ken Cook took over as interim CEO until Wendy's tapped former Potbelly CEO Bob Wright as his permanent replacement in May.\n\"Our quality differentiation has eroded, our value proposition has weakened, and we have not consistently delivered the experience customers expect from Wendy's,\" Wright said on the company's earnings conference call on Friday. \"These issues have weighed on traffic and created pressure on the restaurant economic model, which is the heartbeat of this business, and this is reflected in our latest results.\"\nNow Wendy's is planning to embark on its own turnaround to revive sales, meaning that Burger King can't rest on its laurels.",
    "bodyJa": "バーガーキングは全店売上高でウェンディーズを追い抜き、米国第2位のハンバーガーチェーンとなり、ライバルチェーンに王位を奪われてから6年ぶりにその王座を奪回した。\nこの立場の変更は、過去 2 年間の両社の業績の相違に伴うものです。\nウェンディーズは、米国の既存店売上高が6四半期連続で減少していると報告した。同社が金曜日に発表したところによると、最新四半期の国内既存店売上高は7%減少した。\n一方、バーガーキングは再建に乗り出しており、過去5四半期にわたって国内既存店売上高は増加している。レストラン ブランズ インターナショナル チェーンは木曜日、第 2 四半期の米国の既存店売上高が 8.5% 増加したと報告しました。\nマクドナルドは大幅なリードを保ってナンバーワンのハンバーガーチェーンの座を堅持している。同社は世界ベースでシステム全体の売上高のみを報告しているが、バークレイズによると、2024年の米国ハンバーガー市場シェアは約48％を占めていた。ちなみに、当時ウェンディーズは市場シェア11.4％、バーガーキングは10％だった。\nウェンディーズは当初、朝食の全国展開の成功によりバーガーキングを追い越しました。しかし、2位であり続けることは険しい道だった。\nウェンディーズとバーガーキングはどちらも、新型コロナウイルス感染症（Covid-19）のパンデミックと、その後の食料価格の高騰につながったサプライチェーンの問題を乗り越えなければならなかった。その後、メニュー価格の値上げに対する消費者の反発とレストランへの支出の減少が起きた。\n2022年後半、レストラン・ブランズは、1年間の売上不振を受けてバーガーキングの米国事業の立て直し計画を発表した。この戦略は、マーケティングとレストランの改装への投資、食品の品質の向上に焦点を当てています。\nバーガーキングが足場を見つけようと努める一方、消費者の価値意識がさらに高まり牛肉の価格が高騰していた時期に、ウェンディーズは最高経営責任者の回転ドアに対処していた。\n2024年、ウェンディーズの最高経営責任者（CEO）を長年務めたトッド・ペネゴール氏が8年間の任期を終えて退任した。ペプシコ幹部のカーク・タナー氏が後任となったが、１年余りで退社し、ハーシーズを率いることになった。 CFOのケン・クック氏が暫定CEOに就任したが、ウェンディーズは5月にポットベリーの前CEOボブ・ライト氏を恒久的な後任に指名した。\nライト氏は金曜日の決算会見で、「当社の品質差別化は失われ、当社の価値提案は弱まり、顧客がウェンディーズに期待する体験を一貫して提供できていない」と述べた。 「これらの問題は交通量に重くのしかかり、このビジネスの心臓部であるレストランの経済モデルに圧力をもたらしており、これが当社の最新の業績に反映されています。」\n現在、ウェンディーズは売上を回復するために独自の再建に乗り出す計画を立てており、バーガーキングはその栄光に安住するわけにはいかないことを意味している。",

    "title": "Here are three key takeaways from the disappointing July jobs report",
    "titleJa": "期待外れだった7月の雇用統計から3つの重要なポイントをご紹介します",
    "summaryJa": "7月の米国の非農業部門雇用者数は予想外に減少したが、失業率も同様に減少したため、投資家は最新の雇用統計をどのように処理するかについて複雑なシグナルを残している。以下に 3 つの重要なポイントを示します。",
    "bodyOriginal": "Nonfarm payrolls in the U.S. unexpectedly declined in July, but so did the unemployment rate, leaving investors with mixed signals on how to process the latest jobs report.\nHere are three key takeaways:\n- Misleading numbers: The payroll decline of 23,000 wasn't quite as bad as it looked and the drop in the unemployment rate to 4.1% wasn't nearly as good as it looked. The main reason for the red headline number was a loss of 53,000 government workers, a development economists say was largely owing to seasonal factors that could get revised away. Private payrolls actually rose by 30,000. At the same time, the unemployment rate fell due to yet another decline in workers employed or actively looking for a job.\n- The vanishing labor force: On that labor force theme, the participation rate edged down to 61.4%, now off 0.7 percentage point this year alone due to the exodus of nearly 1.4 million people. There's a strong degree of immigration noise in that number, but it still changes the dynamics by which policymakers will evaluate the labor market. A 4.1% unemployment rate suddenly doesn't seem as impressive with participation at its lowest in 50 years outside of the Covid era.\n- Whither the Fed? Markets reacted to the report by taking a September rate hike off the table. Not so fast: Central bank policymakers may take more signal from the lower unemployment rate as they could view it as an indicator of a relatively stable labor market. A common theme in post-report commentary from Wall Street on Friday was that Fed officials likely will set this report aside and quickly turn their focus to next Wednesday's consumer price index inflation reading — while acknowledging that weak payrolls growth at least takes the urgency out of a September increase.\nThey said it:\n\"This report is like a hall of mirrors, tricking investors with different signals about whether labor's recovery is stalling.\" — Kevin Gordon, head of macro research and strategy at the Schwab Center for Financial Research.\n\"We agree that the [July] jobs report was a bit dovish on net. But we are sticking with our call that the Fed will hike by 75 [basis points] this year, starting in [September]. The Fed is likely to remain more focused on inflation than labor. The [July] CPI report is a bigger event than today's jobs numbers.\" — Aditya Bhave, U.S. economist, Bank of America.\n\"Although the stock market is likely to welcome the dovish implications of the report, investors should be wary of the future growth potential of an economy where fewer people are working.\" — Peter Graf, chief Investment officer at Amova Asset Management Americas.",
    "bodyJa": "7月の米国の非農業部門雇用者数は予想外に減少したが、失業率も同様に減少したため、投資家は最新の雇用統計をどのように処理するかについて複雑なシグナルを残している。\n以下に 3 つの重要なポイントを示します。\n- 誤解を招く数字: 23,000人の雇用者数の減少は見た目ほどひどくはなく、失業率の4.1%への低下も見た目ほど良くはなかった。赤い見出しの数字の主な理由は5万3000人の政府職員の損失であり、開発経済学者らは主に季節的要因によるもので、修正される可能性があると述べている。民間給与は実際に3万人増加した。同時に、雇用されている労働者または積極的に仕事を探している労働者のさらなる減少により、失業率は低下しました。\n- 消滅する労働力: 労働力というテーマでは、参加率は61.4%までわずかに低下したが、140万人近い人々の流出により、今年だけで0.7ポイント低下した。この数字には移民に関するノイズがかなり含まれているが、それでも政策立案者が労働市場を評価する力学に変化をもたらしている。参加者数がコロナ禍以外の過去50年間で最低だったことから、4.1％の失業率は突然それほど印象的ではなくなった。\n- FRBはどこへ？市場はこの報道に反応し、9月利上げは検討の対象から外した。それほど急速ではない：中央銀行の政策立案者は、失業率の低下を比較的安定した労働市場の指標とみなす可能性があるため、失業率の低下からより多くのシグナルを受け取る可能性がある。金曜のウォール街の報告書後の解説で共通したテーマは、FRB当局者らはおそらくこの報告書を脇に置き、すぐに来週水曜日の消費者物価指数のインフレ率の測定値に焦点を移す可能性が高いということであった――その一方で、雇用者数の伸びの鈍さによって少なくとも9月の利上げの緊急性は薄れていることは認めている。\n彼らはこう言いました。\n「この報告書は鏡の間のようなもので、労働力の回復が停滞しているかどうかについてさまざまなシグナルで投資家を騙している。」 — シュワブ金融研究センターのマクロ調査および戦略責任者、ケビン・ゴードン氏。\n「（７月の）雇用統計がネット上ではややハト派的だったことにはわれわれも同意する。しかし、われわれはＦＲＢが今年（９月）から７５（ベーシスポイント）利上げするというわれわれの主張に固執する。ＦＲＢは今後も労働よりもインフレに注目するだろう。（７月の）ＣＰＩ統計は今日の雇用統計よりも大きな出来事だ。」 — アディティア・バーベ氏、米国バンク・オブ・アメリカのエコノミスト。\n「株式市場はこの報告書のハト派的な意味合いを歓迎する可能性が高いが、投資家は働く人が減った経済の将来の成長可能性に警戒すべきだ。」 — ピーター・グラフ氏、Amova Asset Management Americas 最高投資責任者。",

    "id": "trump-teased-an-iran-deal-that-didn-t-co-7c55172c",
    "title": "Trump teased an Iran deal that didn't come, but markets soared. Here’s why it keeps happening",
    "titleJa": "トランプ大統領はイラン合意が実現しなかったとからかいましたが、市場は急騰しました。それが起こり続ける理由は次のとおりです",
    "summaryJa": "石油埋蔵量と軍需品の備蓄が減少していると伝えられる中、アナリストらは、トランプ政権になったらいつまで市場が急騰するか疑問を抱いている。イランとの協定をぶら下げている。",
    "bodyOriginal": "The Trump administration this week sparked enthusiasm that the U.S. and Iran could soon strike a deal on the Strait of Hormuz, driving down oil prices and sending stocks soaring — only for no deal to emerge.\nIf that sounds familiar, it may be because President Donald Trump has claimed dozens of times that the U.S. is close to an agreement that will end the war it began more than five months ago.\nInvestors have reacted to many of those claims with bursts of buying on hopes a breakthrough is near, even as the war instead appears to be widening and progress on Trump's chief stated goal — containing Iran's nuclear ambitions — is at a standstill.\n\"There's tremendous optimism bias in the market,\" Helima Croft, global head of commodity strategy at RBC Capital Markets, told CNBC.\nMarkets continue to assume incentives for both the U.S. and Iran favor a diplomatic end to the war. But some investors seem to \"see a deal as a time machine\" that will reset the Middle East to its prewar status quo, even though that's unlikely to happen, Croft said.\nThe conflict of late centers on the Strait of Hormuz, a vital passageway for the global oil trade that has became a source of major leverage for Iran.\nTehran's ability to effectively close the strait — an open, untolled international waterway before the war started — triggered a global energy supply shock that drove up gas prices, exacerbated inflation and raised alarms about oil reserves.\n\"The President's preference is always diplomacy, but he reserves all options to ensure that Iran can never possess a nuclear weapon,\" White House spokesperson Anna Kelly told CNBC by email.\nEven those who believe diplomacy remains a viable path to peace acknowledge the future of the strait presents an intractable problem.\n\"There still appears to be a fundamental difference over the fate of Hormuz: Iran wants to impose a service fee, while the US wants the pre-war situation restored, i.e., international, free waters in the Strait,\" Claudio Galimberti, partner and chief economist at Rystad Energy, said by email.\nBessent, Trump teased imminent deal\nThe oil market is eager for any hint of progress toward reopening the strait. Treasury Secretary Scott Bessent provided a major dose of optimism Tuesday morning when he told CNBC's \"Squawk Box\" that a deal to ensure \"freedom of movement\" in the strait could come in a matter of hours.\n\"We are in talks with the Iranians,\" Bessent said. \"There is a chance we may have a deal today or tomorrow to open the strait and move towards a more normalized position in this conflict.\"\nOil prices tumbled right after Bessent's remarks, while stocks blasted higher and bold yields pulled back, as investors' optimism coincided with an artificial intelligence-fueled tech rally.\nCrude prices remain highly elevated from their prewar levels, however, as traders bounce between hope for a durable solution in the strait and bracing for a military escalation by the U.S.\nThe market \"remains trapped in a spiky muddle-through dynamic,\" Bob McNally, president of Rapidan Energy Group, told CNBC in an email.\n\"While Iran and Oman may agree on a narrow Hormuz management plan, we do not see the broader and durable settlement between the US and Iran that Hormuz normalization requires and the crude markets want to see,\" he said.\nBessent's comments to CNBC nevertheless buoyed outlooks that were already brightening, in light of Trump's Sunday evening announcement that he was aborting a large-scale attack on Iran because \"the perimeters of a deal has been agreed to.\"\nThat claim — which echoed myriad other times that Trump has threatened to decisively obliterate Iran, only to pull back — helped pump stocks on Monday, when the Dow Jones Industrial Average surged to a record close.\nTrump added more fuel to the fire Tuesday night, when he said a deal to reopen the strait \"could happen\" as soon as Wednesday or Thursday because \"a lot of progress has been made.\"\nDespite extending Bessent's time frame for a possible deal, Trump's comments continued to raise investors' expectations on Wednesday, with the Dow hitting another record-high close and oil prices holding steady.\nIran pushes back on Trump\nThe galloping momentum in equities came in spite of Iran's repeated insistence that it is not actively negotiating with the U.S.\nRather, Iran has said it's in talks with Oman, another regional power that borders the Persian Gulf, to hash out their own agreement on shipping through the strait.\nTrump has angrily asserted that U.S.-Iran talks are ongoing despite Iran's \"duplicitous\" claims otherwise. He also continues to insist the U.S., which has reimposed a naval blockade of Iranian ports in the Gulf region, is in full control of the strait. Vessel traffic, however, remains far below prewar averages, when 20% of the world's oil would pass through the waterway.\nOn Thursday, any expectations of an imminent deal on the strait appeared to be at least temporarily dashed, after Iranian state media reported a draft plan that would block passage for U.S. and Israeli ships and impose other restrictions.\nThe Trump administration quickly appeared to dismiss that draft as a nonstarter.\n\"Any temporary routes will be without any impediments — meaning no approvals or permissions and no tolls or charges,\" a U.S. official told CNBC when asked about the report. \"The Strait of Hormuz is an international waterway and no party controls the lanes or the ability to transit through them.\"\nWhen asked at the White House on Thursday afternoon if a deal to reopen the strait has been reached, Trump said: \"I don't want to say it has been. It's sort of open right now.\"\n\"I think we're doing very well,\" Trump added. \"I'm involved in the negotiation. I think we're doing fine. ... It could be soon.\"\nIran, which has kept up an aggressively defiant posture against the U.S. throughout the war, mocked Trump's messaging.\n″'Massive attack coming … wait, never mind, they want to negotiate.' That's theater diplomacy on loop,\" Iran's parliamentary speaker, Mohammad Bagher Ghalibaf, wrote on X on Thursday afternoon.\n\"Using bullying + broken promises + fake news as leverage is a failed strategy,\" Ghalibaf wrote.\n'Deeply entrenched optimism bias'\nAs the war drags into its sixth month and stockpiles of both oil and key munitions reportedly dwindle, analysts wonder how much longer markets will jump at the dangling hope of a deal.\n\"The cycle of headline-driven price pullbacks may lead to confidence that the economic cost of the conflict is containable,\" but the shrinking U.S. Strategic Petroleum Reserve signals \"waning global buffers,\" RBC wrote in a July 28 strategy note.\nRapidan's McNally warned oil prices could shoot back up to peak levels \"if both sides are unable to contain military escalation or continued inventory de-stocking dissipates the market's deeply entrenched optimism bias and calls on prices to curtail consumption.\"\nGalimberti, of Rystad, told CNBC, \"My hunch is that if they want to avoid a costly stalemate, with oil prices quickly escalating back to April levels or above and little to no Iranian flows, they will need to start bridging the differences and move their respective red lines towards the center.\"",
    "bodyJa": "トランプ政権は今週、米国とイランがホルムズ海峡で間もなく合意に達する可能性があるとの熱狂を引き起こし、原油価格の下落と株価の急騰をもたらしたが、結局合意は成立しなかった。\nもしこれに見覚えがあると思われるなら、それは、米国が5か月以上前に始めた戦争を終わらせる合意に近づいているとドナルド・トランプ大統領が何十回も主張してきたからかもしれない。\n投資家はこうした主張の多くに反応し、戦争がむしろ拡大しているように見え、トランプ大統領の主要な目標であるイランの核開発の野心を封じ込めるという目標の進展が行き詰まっているにもかかわらず、事態打開が近いとの期待から一気に買いを入れている。\nRBCキャピタル・マーケッツの商品戦略グローバル責任者、ヘリマ・クロフト氏はCNBCに対し、「市場には非常に楽観的なバイアスが存在している」と語った。\n市場は米国とイランの双方にとって戦争の外交的終結を支持するインセンティブがあると引き続き想定している。しかし、一部の投資家は、実現の可能性は低いものの、中東地域を戦前の現状にリセットする「タイムマシン」とみなしているようだとクロフト氏は語った。\n最近の紛争は、イランにとって大きな影響力の源となっている世界の石油貿易の重要な通路であるホルムズ海峡を中心にしている。\n開戦前は有料の国際水路だった海峡を効果的に閉鎖するイラン政府の能力は、世界的なエネルギー供給ショックを引き起こし、ガス価格を高騰させ、インフレを悪化させ、石油埋蔵量に対する警戒を高めた。\nホワイトハウスのアンナ・ケリー報道官はＣＮＢＣに対し、「大統領は常に外交を優先しているが、イランが核兵器を決して保有できないようにするため、あらゆる選択肢を留保している」と電子メールで語った。\n外交が依然として平和への実行可能な道であると信じている人々さえも、この海峡の将来が手に負えない問題を抱えていることを認識している。\nライスタッド・エナジーのパートナー兼チーフエコノミスト、クラウディオ・ガリンベルティ氏は電子メールで、「ホルムズの運命をめぐっては、依然として根本的な相違があるようだ。イランはサービス料の賦課を望んでいるが、米国は戦前の状況の回復、つまり海峡の国際自由水域の回復を望んでいる」と述べた。\nベッセント、トランプ大統領は差し迫った合意をからかった\n石油市場は海峡再開に向けた進展の兆しを熱望している。スコット・ベッセント財務長官は火曜朝、CNBCの「スコーク・ボックス」に対し、海峡での「移動の自由」を確保するための合意は数時間以内にまとまる可能性があると語り、大いに楽観的な見方を示した。\nベッセント氏は「われわれはイラン側と協議中だ」と述べた。 「今日か明日、海峡を開放し、この紛争におけるより正常化された立場に向けて合意に達する可能性がある。」\nベッセント氏の発言の直後、原油価格は急落する一方、投資家の楽観的な見方と人工知能によるハイテク株の上昇が重なり、株は急騰し、利回りは大胆に下落した。\nしかし、トレーダーらは海峡の永続的な解決策への期待と米国による軍事エスカレーションへの備えの間で揺れ動いており、原油価格は依然として戦前の水準から大幅に上昇している。\nラピダン・エナジー・グループのボブ・マクナリー社長は、市場は「依然として激しい混乱の中に閉じ込められている」と電子メールでＣＮＢＣに語った。\n同氏は、「イランとオマーンは狭いホルムズ管理計画で合意するかもしれないが、ホルムズ正常化に必要で原油市場が望んでいる米国とイランの間のより広範で永続的な和解は見込めない」と述べた。\nそれにもかかわらず、ベッセント氏のCNBCへのコメントは、トランプ大統領が日曜夕方、「合意の境界線は合意された」ためイランに対する大規模攻撃を中止すると発表したことを踏まえ、すでに明るくなりつつあった見通しを後押しした。\nこの主張は、トランプ大統領がイランを決定的に消滅させると脅したが、結局撤回したというこれまで何度も繰り返された主張であり、ダウ工業株30種平均が記録的な終値まで上昇した月曜日の株価上昇に貢献した。\nトランプ大統領は火曜夜、「多くの進展があった」ため、早ければ水曜か木曜にも海峡再開の合意が「実現する可能性がある」と述べ、火に油を注いだ。\nベッセント氏が合意の可能性について期限を延長したにもかかわらず、トランプ大統領のコメントは水曜日も引き続き投資家の期待を高め、ダウは終値で再び過去最高値を更新し、原油価格は安定した。\nイラン、トランプ大統領に反発\nイランが米国と積極的に交渉していないと繰り返し主張してきたにもかかわらず、株価の急騰の勢いは続いた。\nむしろ、イランは、ペルシャ湾に隣接するもう一つの地域大国であるオマーンと、海峡を通る船舶輸送に関する独自の合意を急ぐべく交渉中であると述べた。\nトランプ大統領は、イランの「二枚舌」主張にも関わらず、米国とイランの交渉は継続していると怒りを込めて主張した。同氏はまた、湾岸地域のイラン港に対する海上封鎖を再発動した米国が海峡を完全に制圧していると主張し続けている。しかし、船舶の交通量は、世界の石油の 20% が水路を通過していた戦前の平均をはるかに下回ったままです。\n木曜日、イラン国営メディアが米国とイスラエルの船舶の航行を阻止し、その他の制限を課す計画草案を報道したことを受け、海峡に関する合意が差し迫っているという期待は少なくとも一時的に打ち砕かれたように見えた。\nトランプ政権はすぐにその草案を不着手として却下したようだ。\nこの報道について尋ねられた米当局者はＣＮＢＣに対し、「暫定ルートにはいかなる障害も生じない。つまり、承認や許可がなく、通行料や料金もかからない」と語った。 「ホルムズ海峡は国際水路であり、どの当事者も車線や通行能力を管理していない。」\n木曜午後、トランプ大統領はホワイトハウスで海峡再開の合意に至ったかどうかとの質問に対し、「合意に達したとは言いたくない。現在はある意味開いている」と述べた。\nトランプ大統領は「我々は非常にうまくやっていると思う」と付け加えた。 「私は交渉に参加している。順調に進んでいると思う。……それはすぐに起こるかもしれない。」\n戦争中を通じて米国に対して積極的に反抗的な姿勢を続けてきたイランは、トランプ大統領のメッセージを嘲笑した。\n「大規模な攻撃が来る…待て、気にしないで、彼らは交渉を望んでいる。」それはループ外交だ」とイラン国会議長モハマド・バガー・ガリバフは木曜午後、Xに書いた。\n「いじめ＋約束破り＋フェイクニュースをてことして利用するのは失敗した戦略だ」とガリバフ氏は書いた。\n「根深い楽観主義バイアス」\n戦争が6カ月に突入し、石油と主要軍需品の両方の備蓄が減少していると伝えられる中、アナリストらは、市場がいつまでもぶら下がった合意の希望に飛びつくのではないかと懸念している。\nRBCは7月28日の戦略ノートで、「ヘッドライン主導の価格下落サイクルは、紛争の経済的コストは抑制可能だという確信につながるかもしれない」としながらも、米国の戦略石油備蓄の減少は「世界的なバッファーの減少」を示していると書いた。\nラピダンのマクナリー氏は、「双方が軍事的エスカレーションを抑制できなかったり、在庫削減の継続により市場の深く根付いた楽観主義バイアスが払拭され、価格に消費抑制が求められたりした場合」、原油価格が最高値まで急上昇する可能性があると警告した。\nリスタッドのガリンベルティ氏はCNBCに対し、「原油価格が急速に4月の水準以上に戻り、イランからの流入がほとんどないという、コストのかかる膠着状態を避けたいのであれば、両国は差異を埋め始め、それぞれのレッドラインを中央に近づける必要があるだろう」とCNBCに語った。",

    "title": "Saudi Arabia, Turkey and Pakistan sign defence pact",
    "titleJa": "サウジアラビア、トルコ、パキスタンが防衛協定に署名",
    "summaryJa": "サウジアラビア、トルコ、パキスタンが防衛協定に署名- 公開されました",
    "bodyOriginal": "Saudi Arabia, Turkey and Pakistan sign defence pact\n- Published\nSaudi Arabia, Turkey and Pakistan have signed a joint defence agreement, saying an attack on one of them would be seen as an attack on all three.\nThe pact was announced at a meeting between Saudi Crown Prince Mohammed bin Salman, Turkish President Recep Tayyip Erdogan and Pakistani Prime Minister Shehbaz Sharif in the Saudi city of Mecca.\nAfter the US and Israel attacked Iran on 28 February, Tehran and its allies struck targets in Saudi Arabia and other Gulf states and disrupted traffic through the Strait of Hormuz, a major oil shipping channel, and the Red Sea.\nThe Mecca agreement has drawn a sharp reaction from Tehran, where an senior member of parliament said it would not help Saudi Arabia.\n\"The Saudis should know that a paper agreement with Turkey and Pakistan does not bring them security, just as years of unilateral milking of the Americans did not bring them security,\" Ebrahim Rezaei, a member of National Security commission, wrote on his X.\nSaudi Arabia and Pakistan had already announced a joint defence pact last year.\nThe new Mecca Joint Defence Agreement sees three of the world's most powerful Muslim nations come together to offer mutual defence guarantees.\nIt aims \"to strengthen collective deterrence against any act of aggression, and stipulates that any armed attack against any one of the three States shall be regarded as an attack against them all\", a joint statement reads.\n\"It further provides for the enhancement of all aspects of defence co-operation among the three States.\"\nAlthough the pact pledges mutual support, it provides no specifics on the obligations of each party. A Turkish official quoted by Reuters news agency said the pact was \"purely defensive in nature\".\nPakistan, Saudi Arabia and Turkey each bring different qualities to the table, with each wanting something different out of it.\nFor the Saudis, this gives an extra level of security in a region whose security architecture has been upended by the US and Israel's war with Iran.\nLast month, Yemen's Iran-backed Houthi rebels – who control much of the north-west of the country - announced a \"maritime embargo\" against Saudi Arabia and targeted Saudi airports, oil facilities and tankers in the Red Sea.\nFurthermore, the Saudis will be keenly aware of last year's Israeli strikes on Doha, targeting senior Hamas officials. According to a report last year by the Centre for Strategic and International Studies, external, \"across the Gulf, states recalibrated their defence strategies\". This pact is one of Saudi Arabia's responses.\nFor Pakistan, the pact offers different but complementary benefits. In May 2025 its long-standing tensions with India boiled over into open conflict.\nWhile an all-out war was avoided, having the economic muscle of Saudi Arabia and the military and industrial might of Turkey in their corner will be seen as increasingly valuable.\nIt also comes at a time when Pakistan has been taking on a far more significant role in global diplomacy.\nIt has acted as an intermediary between Iran and the US and hosted ceasefire negotiations, significantly increasing its status in the region - something this pact further cements.\nAs for Turkey, the benefits are different. According to Burcu Ozcelik from the London-based Royal United Services Institute (Rusi), the deal offers opportunities for the country's significant defence industries through \"joint production, technology partnerships, procurement and greater military interoperability\".\nWhile, on the surface, the concept of a mutual defence agreement seems straightforward, in practice the circumstances in which they would come into play are both complex and uncertain.\nWould, for example, Turkey be obliged to join in strikes on Yemen if Saudi Arabia's full-scale war with the Houthis were to restart?\nWould Saudi Arabia have to declare war on India were there to be a re-emergence of conflict with Pakistan?\nEach instance would require complex calculations and careful diplomacy, often in an attempt to avoid escalation. It is, in short, uncertain.\nThe one consequence of a mutual defence agreement that sides involved will be banking on, however, is deterrence.\nThe very fact that they each now have two other regional powers standing behind them may not make aggression impossible, but it will make its potential cost significantly higher.\nRelated topics\n- Published29 July\n- Published29 July",
    "bodyJa": "サウジアラビア、トルコ、パキスタンが防衛協定に署名\n- 公開されました\nサウジアラビア、トルコ、パキスタンは共同防衛協定に署名し、そのうちの１国への攻撃は３国全てへの攻撃とみなされると述べた。\nこの協定は、サウジアラビアの都市メッカで行われたサウジアラビアのムハンマド・ビン・サルマン皇太子、トルコのレジェップ・タイップ・エルドアン大統領、パキスタンのシェバズ・シャリフ首相の会談で発表された。\n2月28日に米国とイスラエルがイランを攻撃した後、イランとその同盟国はサウジアラビアや他の湾岸諸国の目標を攻撃し、主要な石油輸送路であるホルムズ海峡と紅海の交通を混乱させた。\nメッカ合意はイラン政府の激しい反応を引き起こしており、ある国会議員はサウジアラビアの助けにはならないと述べた。\n国家安全保障委員会のメンバーであるエブラヒム・レザエイ氏は、「サウジは、何年にもわたるアメリカ人の一方的な搾乳が彼らに安全をもたらさなかったのと同じように、トルコやパキスタンとの紙面合意が彼らに安全をもたらさないことを知るべきだ」と、国家安全保障委員会のメンバーであるエブラヒム・レザエイはXに書いた。\nサウジアラビアとパキスタンは昨年すでに共同防衛協定を発表していた。\n新しいメッカ共同防衛協定では、世界で最も強力なイスラム教国家の3つが協力し、相互防衛の保証を提供することになる。\n共同声明には「あらゆる侵略行為に対する集団的抑止力を強化することを目的としており、三国のいずれかに対する武力攻撃は三国すべてに対する攻撃とみなすと規定している」と書かれている。\n「さらに、この協定は三国間の防衛協力のあらゆる側面の強化を規定するものである。」\nこの協定は相互支援を約束しているが、各当事者の義務については詳細を定めていない。ロイター通信が伝えたトルコ当局者の話として、この協定は「本質的に純粋に防衛的なもの」であると述べた。\nパキスタン、サウジアラビア、トルコはそれぞれ異なる特質をテーブルにもたらし、それぞれが異なるものを求めています。\nサウジにとって、これは、米国とイスラエルの対イラン戦争によって安全保障構造がひっくり返された地域において、さらなる安全保障レベルを与えることになる。\n先月、イエメンのイランが支援する反政府勢力フーシ派（同国北西部の大部分を支配）は、サウジアラビアに対する「海上禁輸」を発表し、サウジの空港、石油施設、紅海のタンカーを標的にした。\nさらに、サウジアラビアは、ハマス高官を標的とした昨年のイスラエルによるドーハ攻撃を鋭く認識しているだろう。戦略国際​​問題研究所が昨年発表した報告書によると、対外的には「湾岸を挟んで各国が防衛戦略を再調整した」という。この協定はサウジアラビアの対応の一つである。\nパキスタンにとって、この協定は異なるが補完的な利益を提供する。 2025 年 5 月、インドとの長年にわたる緊張が沸騰し、公然の紛争に発展しました。\n全面戦争は回避されたが、サウジアラビアの経済力とトルコの軍事力と産業力を自国の一角に置くことは、ますます価値があるとみなされるだろう。\nそれはまた、パキスタンが世界外交においてはるかに重要な役割を果たしている時期でもある。\nイランと米国の間の仲介者として機能し、停戦交渉を主催し、この地域での地位を大幅に高めてきたが、この協定はその地位をさらに強固なものにした。\nトルコに関しては、メリットは異なります。ロンドンに本拠を置く王立ユナイテッドサービス研究所（Rusi）のブルク・オズチェリク氏によると、この協定は「共同生産、技術提携、調達、軍事相互運用性の向上」を通じて、国の重要な防衛産業に機会を提供するという。\n表面上、相互防衛協定の概念は単純に見えますが、実際には、相互防衛協定が適用される状況は複雑かつ不確実です。\n例えば、サウジアラビアとフーシ派との全面戦争が再開された場合、トルコはイエメンへの攻撃に参加せざるを得なくなるだろうか？\nパキスタンとの紛争が再発した場合、サウジアラビアはインドに宣戦布告しなければならないだろうか？\nそれぞれの事例では複雑な計算と慎重な外交が必要となり、多くの場合エスカレーションを回避しようとします。要するに不確実だということだ。\nしかし、相互防衛協定の結果として関係者が期待するのは抑止力だ。\n両国の背後に他の2つの地域大国が控えているという事実自体が侵略を不可能にするわけではないかもしれないが、潜在的なコストは大幅に高くなるだろう。\n関連トピック\n- 7 月 29 日発行\n- 7 月 29 日発行",

    "title": "Cassidy supports Todd Blanche, rescuing Trump's embattled attorney general pick",
    "titleJa": "キャシディ、トッド・ブランシュを支持、トランプ大統領の司法長官選出で窮地を救う",
    "summaryJa": "ビル・キャシディ上院議員（共和党、ルイジアナ州）は金曜日、トッド・ブランチ氏を司法長官に承認するために投票するつもりだと述べ、他の上院共和党議員２名が反対を表明したことを受け、ドナルド・トランプ大統領の苦境に立たされている候補者に重要な一票を与えることになった。他に共和党議員が離反しないと仮定すると、キャシディ氏の支持によりブランチ氏の承認に必要な50票が得られるとみられる。共和党は53議席を保有しているが、スーザン・コリンズ上院議員（共和党、メイン州）とリサ・マーカウスキー上院議員（共和党、アラスカ州）はブランシュ氏に反対票を投じる意向を示している一方、ミッチ・マコネル上院議員（共和党、ケンタッキー州）は依然として上院欠席を続けており、ブランシュ氏の共和党票はちょうど50票となっている。",
    "bodyOriginal": "Sen. Bill Cassidy, R-La., said Friday he will vote to confirm Todd Blanche as attorney general, giving President Donald Trump's embattled nominee a crucial vote after two other Senate Republicans announced their opposition.\nCassidy's support appears to give Blanche the 50 votes he needs for confirmation, assuming no other Republicans defect. Republicans hold 53 seats, but Sens. Susan Collins, R-Maine, and Lisa Murkowski, R-Alaska, have said they will vote against Blanche, while Sen. Mitch McConnell, R-Ky., remains absent from the Senate — leaving Blanche with exactly 50 Republican votes.\nCassidy had emerged as the pivotal vote after Murkowski announced Friday morning she would oppose Blanche, citing concerns about the politicization of the Justice Department and its handling of the Jeffrey Epstein files.\n\"This is not a referendum on President Trump,\" Cassidy said on the Senate floor Friday. \"It is a decision regarding Mr. Blanche in very specific circumstances.\"\nBlanche, Trump's former personal attorney who is serving as acting attorney general, has faced resistance from several Republicans over his leadership of the Justice Department and questions about its independence from the White House.\nSens. John Cornyn, R-Texas, and Thom Tillis, R-N.C., ultimately agreed to support Blanche after he provided assurances that a controversial $1.8 billion \"anti-weaponization\" fund created as part of a settlement in Trump's lawsuit over the leak of his tax records had been rescinded and clarified the scope of an agreement shielding Trump and members of his family from certain tax audits.\nTillis had also pressed Blanche to meet with Epstein survivors amid scrutiny of the Justice Department's handling of the files. Blanche later met privately with a group of survivors following his confirmation hearing.\nBefore Cassidy announced his decision, a group of Epstein survivors sent him a letter urging him to oppose Blanche and asking to meet with him.\nThe survivors accused the Justice Department under Blanche of exposing survivors' identities and images while withholding the names of alleged abusers and enablers.\nNeither Cassidy nor his staff met with the group before he announced his decision, according to the survivors, MS NOW reported.\nThe letter, signed by more than a dozen survivors, also argued Blanche showed no remorse during his own meeting with survivors and gave them no indication that he planned to pursue additional investigative leads or accountability beyond Epstein and his associate, Ghislaine Maxwell.\nCassidy said he was \"not entirely satisfied\" with where matters stood and expected he could have additional concerns about the department in the future. But he argued that Trump could be \"unrelenting\" regardless of who held the job, making it more important to have a Senate-confirmed attorney general with greater standing to push back on the president.\nCassidy also pointed to positive reviews of Blanche's management of the department from current and former prosecutors he consulted, saying critics acknowledged that Blanche knew the law and was a hands-on administrator.\n\"Mr. Blanche is not perfect, and he will tell you this,\" Cassidy said. But, he argued, the choice was between Blanche and another acting attorney general who might not run the department as effectively.\nCassidy has his own complicated history with Trump. He was one of seven Senate Republicans who voted to convict Trump at his second impeachment trial in 2021. In May, Cassidy lost his Republican primary after Trump backed Rep. Julia Letlow, one of his challengers.\nCassidy appeared to grow emotional near the end of his speech as he announced his decision.\n\"All considered, I will vote for Mr. Blanche,\" Cassidy said. \"I'll be criticized for this vote. What's new?\" He added that he had \"worked hard to understand the issue and to make the right decision.\"",
    "bodyJa": "ビル・キャシディ上院議員（共和党、ルイジアナ州）は金曜日、トッド・ブランチ氏を司法長官に承認するために投票するつもりだと述べ、他の上院共和党議員２名が反対を表明したことを受け、ドナルド・トランプ大統領の苦境に立たされている候補者に重要な一票を与えることになった。\n他に共和党議員が離反しないと仮定すると、キャシディ氏の支持によりブランチ氏の承認に必要な50票が得られるとみられる。共和党は53議席を保有しているが、スーザン・コリンズ上院議員（共和党、メイン州）とリサ・マーカウスキー上院議員（共和党、アラスカ州）はブランシュ氏に反対票を投じる意向を示している一方、ミッチ・マコネル上院議員（共和党、ケンタッキー州）は依然として上院欠席を続けており、ブランシュ氏の共和党票はちょうど50票となっている。\nマーカウスキー氏が金曜朝、司法省の政治化とジェフリー・エプスタインファイルの扱いへの懸念を理由にブランシュ氏に反対すると発表した後、キャシディ氏が中心票として浮上していた。\nキャシディ氏は金曜日、上院議場で「これはトランプ大統領に対する国民投票ではない」と述べた。 「これは非常に特殊な状況下でのブランシュ氏に関する決定だ。」\nトランプ大統領の元個人弁護士で司法長官代理を務めるブランチ氏は、司法省の指導力やホワイトハウスからの独立性をめぐる疑問を巡り、複数の共和党議員からの抵抗に直面している。\nジョン・コーニン上院議員（共和党、テキサス州）とトム・ティリス上院議員（共和党、ノースカロライナ州）は、納税記録漏えいをめぐるトランプ氏の訴訟の和解の一環として物議を醸した18億ドルの「反武器化」基金が取り消され、トランプ氏とその家族を特定の税務調査から守る協定の範囲を明確にしたことをブランシュ氏が保証したことを受け、最終的にブランシュ氏を支持することに同意した。\nティリス氏はまた、司法省によるファイルの扱いが精査される中、ブランチ氏にエプスタイン生存者と面会するよう圧力をかけていた。ブランシュ氏は承認公聴会後、生存者グループと個人的に面会した。\nキャシディが決断を発表する前に、エプスタイン生存者のグループがブランシュに反対するよう促し、面会を求める手紙をキャシディに送った。\n生存者らは、ブランシュ氏の下で司法省が虐待者や可能者とされる人物の名前を伏せたまま、生存者の身元や画像を暴露したと非難した。\nMS NOWの報道によると、生存者らによると、キャシディ氏もスタッフも、同氏が決定を発表する前にグループと面会はしなかったという。\n十数人の生存者が署名したこの書簡はまた、ブランシュ氏が生存者らと面会した際に全く反省の色を示しておらず、エプスタイン氏とその同僚のギレーヌ・マクスウェル氏以上にさらなる捜査の手がかりや説明責任を追求するつもりであることを示唆していないとも主張した。\nキャシディ氏は、事態の現状に「完全に満足しているわけではない」とし、将来的に同省に関してさらなる懸念を抱く可能性があると予想していると述べた。しかし同氏は、誰がその職に就いているかに関係なく、トランプ氏は「容赦ない」可能性があるため、大統領を押し返すにはより優れた立場で上院が承認した司法長官を置くことがより重要だと主張した。\nキャシディ氏はまた、相談を受けた現検事や元検事らからブランシュ氏の部門管理に対する好意的な評価も指摘し、批評家らはブランシュ氏が法律を理解し、実践的な管理者であったことを認めていると述べた。\n「ブランシュ氏は完璧ではありません。彼はあなたにこう言うでしょう」とキャシディは言った。しかし、選択はブランシュ氏と、司法省をそれほど効果的に運営できない可能性のある別の司法長官代理の間でなされた、と同氏は主張した。\nキャシディ氏にはトランプ氏との複雑な過去がある。同氏は、2021年の2回目の弾劾裁判でトランプ氏の有罪判決に賛成票を投じた上院共和党議員7人のうちの1人だった。5月、トランプ氏が挑戦者の1人であるジュリア・レットロー下院議員を支持したため、キャシディ氏は共和党予備選で敗北した。\nキャシディ氏はスピーチの終わり近く、決断を発表した際に感情的になったように見えた。\n「すべてを考慮すると、私はブランシュ氏に投票します」とキャシディ氏は語った。 「この投票では批判されるでしょう。何が新しいのですか？」同氏は「問題を理解し、正しい決断を下すために懸命に努力した」と付け加えた。",

    "id": "chesky-says-airbnb-will-spend-a-lot-more-4e0ca5be",
    "title": "Chesky says Airbnb will spend ‘a lot more’ on AI as earnings beat and stock surges 15%",
    "titleJa": "チェスキー氏、収益が上回り、株価が15％上昇する中、AirbnbはAIに「さらに多く」を投じると語る",
    "summaryJa": "Airbnb CEO のブライアン・チェスキー氏は、AI が会社に役立つかどうか確信が持てませんでしたが、1 年後、AI が成長を取り戻した理由だと述べています。",
    "bodyOriginal": "Airbnb shares surged 15% Friday after the company delivered one of its strongest growth quarters in years and raised its full-year outlook — a turnaround CEO Brian Chesky is directly crediting to artificial intelligence.\nIn an exclusive interview with CNBC after the earnings report, Chesky said Airbnb will spend \"a lot more\" on AI tokens this year than it originally forecast because the cost of inference \"pales in comparison\" to the revenue and productivity the company is getting back.\nAirbnb is cutting product-development time by roughly 60%, shipping about 80% more features year over year and keeping headcount roughly flat even as AI spending rises sharply, Chesky said.\n\"I think now it's safe to say AI is the best thing to have happened to Airbnb,\" he said. \"I think we're becoming an AI-native company, and I think that is probably the number one explanation for our results.\"\nThat conviction marks a sharp turn for Chesky. A year ago, Chesky said the question inside the company was essentially, \"Is AI good for Airbnb or is AI bad for Airbnb?\"\nThe shift is notable for a CEO who has long approached technology more like a designer than a traditional engineer.\nChesky went to the Rhode Island School of Design and studied industrial design before co-founding Airbnb. Years later, he would become close with former Apple design chief Jony Ive and OpenAI CEO Sam Altman — and eventually introduce the two men, helping spark the relationship that led to their work together on AI hardware.\nNow, Chesky is trying to bring that same design-first sensibility to Airbnb's own AI overhaul.\nThe company hired Ahmad Al-Dahle, Meta's former head of generative AI and a leader of its Llama work, as chief technology officer in January. Chesky said Airbnb had been \"maybe middle of the pack in AI\" before Al-Dahle arrived with a mandate to help make the company \"AI-native.\"\nThere are already measurable signs of that shift. Chesky said AI is helping Airbnb attract more bookings, make it easier for hosts to list and price homes, and lower customer-service costs.\nThe company is piloting AI-powered search, using AI to generate personalized listing highlights and answers for guests, and helping hosts create and price listings. In customer service, 45% of guests who interact with Airbnb's AI agent never need to speak with a human agent.\n\"It's really across the board: More demand, more supply, cheaper customer service,\" Chesky said.\nInternally, Airbnb is also closely tracking how employees use AI. Chesky said the company looks at individual token usage as one measure of adoption, but considers that a relatively crude metric and focuses more heavily on the output of teams.\n\"What we're seeing is that across the board, teams are significantly more productive,\" Chesky said. He said those gains began with engineers and have since spread to product management, design, marketing, and creative services. \"I have so underestimated the impact of AI.\"\nThat productivity is showing up in Airbnb's hiring plans as well. Headcount is roughly flat year to date, even as spending on AI rises sharply, and Chesky said investors should expect revenue to grow \"a lot faster\" than staffing for the foreseeable future.\n\"Our philosophy has been not necessarily to use AI to have fewer people, but to use AI to get more out of the people,\" Chesky said. He added that revenue per employee should continue to rise.\nThe economics are central to Chesky's increasingly bullish view of AI. While many consumer companies are still trying to figure out how to generate enough revenue to justify inference costs, he argues Airbnb has an unusually favorable model.\n\"One of the problems is a lot of people feel like they don't know how to make money on consumer with AI,\" Chesky said.\nAt Airbnb, he said, inference costs pale in comparison with \"the amount of money we make on every booking\" and the additional revenue generated by faster product development.\n\"We are going to spend a lot more on AI tokens this year than we forecasted,\" he said. \"But that's great because the ROI is there, and therefore our revenue is much higher.\"\nAirbnb is still trying to be selective about where it spends those tokens and the company is using more than a dozen AI models internally, Chesky said. Those include models like Anthropic's Claude Code and OpenAI's Codex. But it limits access to some slower and more expensive models when their additional capability is not necessary for the task.\nChesky is particularly bullish on open-source models for consumer-facing products and said frontier models remain important for the hardest problems, but most consumer tasks do not require the most expensive systems.\n\"Consumers mostly do not need frontier models for most things,\" Chesky said. \"It's a matter of throttling the right job for the right tool.\"\nHe declined to name the open-source models Airbnb is deploying in consumer products, saying the makeup of the company's technology stack is becoming competitively sensitive.\nThe bigger question is whether AI ultimately becomes more than a tool inside Airbnb — and instead changes how travelers reach the platform in the first place. As AI agents become better at assembling itineraries and acting on behalf of users, companies like OpenAI and Alphabet could theoretically become the interface through which travelers discover and book accommodations.\nBut Chesky is skeptical that chatbots will replace Airbnb as the transaction layer.\nTravel is visual, difficult to compare through text alone and often planned collaboratively, he said, all areas where the traditional chatbot interface remains weak.\n\"I do not believe the chat interface is the right interface for travel,\" Chesky said.\nHe expects chatbots to become important for inspiration and itinerary building, but said he does not see them becoming major booking platforms \"in the coming future.\"\nFor now, Chesky said he is focused on using AI to extend Airbnb's own growth runway. He told CNBC that first-time bookers are growing at the fastest pace in four years and said the U.S. business accelerated from the first quarter. Hotels, meanwhile, are growing three times faster than the company's traditional home listings as Airbnb expands beyond the home-rental marketplace it built its name on.\n\"We are not a company whose best days were in the 2010s,\" Chesky said. \"We are a company where the best days are in front of us.\"",
    "bodyJa": "Airbnbの株価は金曜日、同社がここ数年で最も強力な成長四半期の一つを達成し、通年の見通しを引き上げたことを受けて15％上昇した。CEOのブライアン・チェスキー氏はこの好転は人工知能のおかげであると直接認めている。\n収益報告後のCNBCとの独占インタビューでチェスキー氏は、Airbnbは推論コストが同社から得られる収益や生産性に「比べれば見劣りする」ため、今年は当初の予測よりもAIトークンに「はるかに多く」支出すると述べた。\nチェスキー氏によると、Airbnbは製品開発時間を約60％削減し、前年比で約80％多い機能を出荷し、AI支出が急増しているにもかかわらず従業員数はほぼ横ばいを保っているという。\n「今では、AI が Airbnb に起こった最良の出来事であると言っても過言ではないと思います」と彼は言いました。 「当社は AI ネイティブの企業になりつつあると思います。おそらくそれが当社の業績の最大の説明だと思います。」\nこの確信はチェスキーにとって大きな転機となる。 1年前、チェスキー氏は、社内の疑問は本質的に「AIはAirbnbにとって良いのか、それともAIは悪いのか？」だったと語った。\n長い間、従来のエンジニアよりもデザイナーのようにテクノロジーに取り組んできたCEOにとって、この変化は注目に値する。\nチェスキーはロードアイランド・スクール・オブ・デザインに通い、工業デザインを学んだ後、Airbnbを共同設立しました。数年後、彼は元 Apple デザイン責任者のジョニー・アイブ氏や OpenAI CEO のサム・アルトマン氏と親しくなり、最終的には 2 人を紹介し、AI ハードウェアでの共同作業につながる関係に火をつけることになりました。\n現在、チェスキー氏は、同じデザイン第一の感性をAirbnb自身のAIの全面見直しに導入しようとしている。\n同社は1月、メタ社の元生成AI責任者でラマ事業のリーダーでもあるアフマド・アルダール氏を最高技術責任者として雇用した。チェスキー氏は、アル・ダール氏が同社の「AIネイティブ」化を支援する任務を持って到着するまで、Airbnbは「おそらくAI分野では中堅」だったと述べた。\nその変化の目に見える兆候はすでに現れています。チェスキー氏は、AIはAirbnbがより多くの予約を獲得し、ホストが住宅のリストと価格設定を容易にし、顧客サービスコストを削減するのに役立っていると述べた。\n同社は AI を活用した検索を試験的に導入しており、AI を使用してゲスト向けにパーソナライズされたリストのハイライトと回答を生成し、ホストによるリストの作成と価格設定を支援しています。顧客サービスでは、Airbnb の AI エージェントとやり取りするゲストの 45% は、人間のエージェントと話す必要はありません。\n「需要が増え、供給が増え、顧客サービスが安くなるということは、本当に全体的なことだ」とチェスキー氏は語った。\nAirbnb は社内でも、従業員が AI をどのように利用しているかを綿密に追跡しています。チェスキー氏は、同社は個々のトークンの使用状況を採用の指標の1つとして検討しているが、それは比較的大まかな指標であると考えており、チームの成果により重点を置いていると述べた。\n「私たちが目にしているのは、全体的にチームの生産性が大幅に向上しているということです」とチェスキー氏は語った。同氏は、こうした利益はエンジニアから始まり、その後、製品管理、デザイン、マーケティング、クリエイティブ サービスにまで広がったと述べた。 「私はAIの影響を過小評価してきました。」\nその生産性はAirbnbの採用計画にも現れている。 AIへの支出が急増しているにもかかわらず、従業員数は年初からほぼ横ばいとなっており、チェスキー氏は、投資家は当面、人員配置よりも「はるかに速い」収益の伸びを期待すべきだと述べた。\n「私たちの哲学は、必ずしも AI を使用して人口を減らすことではなく、AI を使用して人々からより多くを引き出すことでした」とチェスキー氏は述べた。同氏は、従業員一人当たりの収益は今後も増加するはずだと付け加えた。\n経済学は、チェスキー氏の AI に対するますます強気な見方の中心となっている。多くの消費者企業が依然として推論コストを正当化するのに十分な収益を生み出す方法を模索している中、Airbnb には異常に有利なモデルがあると同氏は主張します。\n「問題の1つは、多くの人がAIを使って消費者にお金を稼ぐ方法がわからないと感じていることだ」とチェスキー氏は語った。\n同氏によると、Airbnbでは推論コストは「予約ごとに得られる金額」や、より迅速な製品開発によって生み出される追加収益に比べれば微々たるものだという。\n同氏は、「今年は予測よりもはるかに多くの金額をAIトークンに費やすことになるだろう」と述べた。 「しかし、ROI があり、収益がはるかに高くなるので、これは素晴らしいことです。」\nチェスキー氏によると、Airbnbは依然としてこれらのトークンをどこに使うかを厳選しようとしており、社内で十数種類のAIモデルを使用しているという。これらには、Anthropic の Claude Code や OpenAI の Codex などのモデルが含まれます。ただし、タスクに追加機能が必要ない場合、一部の低速で高価なモデルへのアクセスが制限されます。\nチェスキー氏は消費者向け製品のオープンソースモデルに特に強気で、フロンティアモデルは最も困難な問題に対して依然として重要であるが、消費者のタスクのほとんどは最も高価なシステムを必要としないと述べた。\n「消費者はほとんどの場合、フロンティアモデルを必要としていない」とチェスキー氏は語った。 「適切なツールに対して適切なジョブを制限することが重要です。」\n同氏は、Airbnbが消費者向け製品に展開しているオープンソースモデルの名前は明らかにしなかったが、同社のテクノロジースタックの構成は競争上敏感になりつつあると述べた。\nより大きな問題は、AI が最終的に Airbnb 内のツール以上のものになるのか、むしろ旅行者がそもそもプラットフォームにアクセスする方法を変えるのかということです。 AI エージェントが旅程を組み立て、ユーザーに代わって行動する能力が向上すると、理論的には OpenAI や Alphabet のような企業が、旅行者が宿泊施設を見つけて予約するためのインターフェースになる可能性があります。\nしかしチェスキー氏は、トランザクション層としてチャットボットがAirbnbに取って代わることには懐疑的だ。\n旅行は視覚的であり、テキストだけで比較するのは難しく、多くの場合、共同で計画されるが、これらすべての分野において、従来のチャットボットインターフェースが依然として弱いと同氏は述べた。\n「チャットインターフェースが旅行に適したインターフェースであるとは思わない」とチェスキー氏は語った。\n同氏は、チャットボットがインスピレーションや旅程の作成にとって重要になると予想しているが、「近い将来」にはチャットボットが主要な予約プラットフォームになるとは考えていないと述べた。\nチェスキー氏は今のところ、AIを活用してAirbnb自身の成長滑走路を伸ばすことに注力していると述べた。同氏はCNBCに対し、初めて予約する人が過去4年間で最も速いペースで増加していると述べ、米国のビジネスは第1四半期から加速したと述べた。一方、Airbnbがその名を築いた住宅レンタル市場を超えて拡大する中、ホテルは同社の従来の住宅掲載件数の3倍のスピードで成長している。\n「当社は2010年代が最良の時代だったような企業ではない」とチェスキー氏は語った。 「私たちは最高の日が目の前にある会社です。」",

    "title": "Goodwin considers selling part of defence business",
    "titleJa": "グッドウィン、防衛事業の一部売却を検討",
    "summaryJa": "グッドウィン、防衛事業の一部売却を検討- 公開されました",
    "bodyOriginal": "Goodwin considers selling part of defence business\n- Published\nBritish engineering company Goodwin has said it is considering selling off parts of its business, which supplies components to major defence and nuclear programmes.\nThe Stoke-on-Trent-based group said it was exploring a possible sale of a \"substantial part\" of its mechanical engineering division, which includes Goodwin Steel Castings (GSC), Goodwin International (GI), Noreva, Easat and Pumps.\nIn a statement on Friday, the firm's board confirmed it had commenced a strategic review to \"consider a range of potential options to maximise value for shareholders\".\nGoodwin said discussions were ongoing and that there was no certainty of a sale taking place.\n\"The board of Goodwin confirms that it has commenced a strategic review to consider a range of potential options to maximise value for shareholders whilst ensuring continuity for all stakeholders, including customers, and the long-term prosperity of its businesses,\" the company said.\n\"Discussions are ongoing and there can be no certainty that a transaction will be entered into. Rothschild & Co is advising the board of Goodwin on the strategic review.\"\nGoodwin's mechanical engineering division is a key supplier of components to UK and US frigate and submarine programmes.\nThis includes Britain's Dreadnought programme, which is building the Royal Navy's next-generation nuclear deterrent submarines, and the Type 26 frigate programme, which is developing a fleet of advanced anti-submarine warships.\nAccording to its latest annual report, Goodwin Steel Castings and Goodwin International have delivered a boost to the company's profits, having benefited from economies increasing their defence spending.\nA report in the Financial Times said several potential buyers that have records in defence had expressed interest in Goodwin in recent weeks.\nThe company, which was founded in 1883, is majority owned and managed by the Goodwin family, while it has shares listed on the London Stock Exchange.\nIts shares were up by about 10% on Friday morning.\nRuss Mould, investment director for AJ Bell, said: \"The company is a major supplier to UK and US submarine programmes and has also benefited from bumper defence spending across other parts of its business.\n\"The company took a big hit in March when it lost two significant contracts and faced order delays in the Middle East.\"\nHe added: \"Yet the interest in Goodwin's defence arm is a reminder that the UK has a collection of engineering businesses which are global leaders in their respective niches.\n\"What any sale would mean for the future of Goodwin as a standalone business remains an open question but it is likely to still derive a significant chunk of its revenue from military spending regardless.\"\nGet in touch\nTell us which stories we should cover in Staffordshire\nFollow BBC Stoke & Staffordshire on BBC Sounds, Facebook, external, X, external and Instagram, external.\nRelated topics\n- Published15 July\n- Published2 June 2025\n- Published20 March 2025",
    "bodyJa": "グッドウィン、防衛事業の一部売却を検討\n- 公開されました\n英国のエンジニアリング会社グッドウィンは、主要な防衛および核計画に部品を供給する事業の一部売却を検討していると発表した。\nストーク・オン・トレントに本拠を置く同グループは、グッドウィン・スチール・キャスティングス（GSC）、グッドウィン・インターナショナル（GI）、ノレバ、イーサット、ポンプスを含む機械エンジニアリング部門の「相当部分」の売却の可能性を検討していると述べた。\n同社取締役会は金曜日の声明で、「株主にとっての価値を最大化するための幅広い選択肢を検討する」ための戦略的見直しを開始したことを確認した。\nグッドウィン氏は、交渉は進行中であり、売却が行われる確実性はないと述べた。\n「グッドウィンの取締役会は、顧客を含むすべての利害関係者の継続性と事業の長期的な繁栄を確保しながら、株主の価値を最大化するための幅広い選択肢を検討するための戦略的見直しを開始したことを確認した」と同社は述べた。\n「議論は進行中であり、取引が締結されるかどうかは確信が持てない。ロスチャイルド＆カンパニーは戦略的見直しについてグッドウィンの取締役会に助言している。」\nグッドウィンの機械エンジニアリング部門は、英国と米国のフリゲート艦および潜水艦計画への部品の主要サプライヤーです。\nこれには、イギリス海軍の次世代核抑止力潜水艦を建造する英国のドレッドノート計画と、先進的な対潜艦艇の艦隊を開発するタイプ26フリゲート計画が含まれる。\n最新の年次報告書によると、グッドウィン・スチール・キャスティングスとグッドウィン・インターナショナルは、国防支出の増加による経済の恩恵を受け、同社の利益を押し上げた。\nフィナンシャル・タイムズの報道によると、ここ数週間で弁護活動の実績を持つ複数の買い手候補がグッドウィンに関心を示しているという。\n同社は 1883 年に設立され、グッドウィン家が過半数を所有および経営しており、ロンドン証券取引所に株式を上場しています。\n同社株は金曜日午前中に約10％上昇した。\nAJベルの投資ディレクター、ラス・モールド氏は「同社は英国と米国の潜水艦計画への主要サプライヤーであり、事業の他の部分でも多額の防衛支出から恩恵を受けている」と述べた。\n「同社は3月に2つの重要な契約を失い、中東での注文の遅れに直面し、大きな打撃を受けた。」\n同氏はさらに、「しかし、グッドウィンの防衛部門への関心は、英国がそれぞれの分野で世界的リーダーであるエンジニアリング企業の集合体を持っていることを思い出させるものだ」と付け加えた。\n「売却が独立事業としてのグッドウィンの将来にどのような影響を与えるかは未解決の問題のままだが、それでもなお、収益のかなりの部分を軍事支出から得ている可能性が高い。」\n連絡する\nスタッフォードシャーで取り上げるべきストーリーを教えてください\nBBC Sounds、Facebook（外部）、X（外部）、Instagram（外部）で BBC Stoke & Staffordshire をフォローしてください。\n関連トピック\n- 7 月 15 日発行\n- 2025 年 6 月 2 日発行\n- 2025 年 3 月 20 日発行",

    "title": "I was standing in front of my teacher when she was shot, Thai pupil says",
    "titleJa": "タイの生徒によると、彼女が撃たれたとき、私は先生の前に立っていた",
    "summaryJa": "タイの生徒によると、彼女が撃たれたとき、私は先生の前に立っていた- 公開されました",
    "bodyOriginal": "I was standing in front of my teacher when she was shot, Thai pupil says\n- Published\nOn Friday morning, as the final classes of the week were under way, panicked students began streaming out of a prestigious school just outside Bangkok.\nInside, police say, a 14-year-old boy had opened fire.\n\"I was standing in front of the teacher when she was shot,\" a shaken seventh grader tells the BBC, near the gates of Debsirin School in Nonthaburi. \"She was talking to me when [the gunman] showed up.\"\nStill in her uniform, with her mother by her side, she explains how the shooter stalked from room to room.\nAuthorities say he killed five teachers and injured 23 people - including fellow pupils - before turning the weapon on himself. Earlier, he had gunned down his grandparents.\n\"I had to climb over the school fence to escape with other friends,\" the girl, who the BBC is not naming, continues.\nHer mother says the girl thought she might die. \"[She said] 'I thought I'd never see you again'.\"\nOne 18-year-old student told Reuters he initially thought firecrackers were going off.\n\"I didn't think it was a gun at first,\" he said. \"There were many shots: bang bang bang. Then it went quiet. Then it started again.\"\nMetres from the school gates, paramedics loaded the wounded into ambulances and rushed them to hospital, as milling crowds hugged and cried.\nRescue worker Kiatikhun Verapongpradith rushed to the scene after hearing children as young as 12 had been hurt.\n\"I saw students who had been shot, some in the arm, some in the back, some in the chest. So I rushed to help get them to the hospital first,\" the 47-year-old rescue worker told Reuters news agency.\nOne grieving teacher told the BBC his friend was among the dead.\n\"She was my age. We went to this school together as students. Then we both became teachers at this school,\" the 31-year-old, who declined to give his name, said.\nIt is early days in the investigation and police haven't said anything about a motive.\nThey believe the 9mm handgun the shooter used belonged to his grandfather. Forensic officers found the gunman's shots to be \"quite accurate\", with several hitting \"vital spots\" on victims' bodies.\nOthers are filling some of the gaps. A teacher at the school has said the shooter was a good student - not aggressive and with good grades - and education authorities have described him as an avid gamer.\nPrime Minister Anutin Charnvirakul said study pressures may have played a role.\n\"We learned that his grandmother was a teacher and she might have been strict with him. From what the police gathered from his close friend, they knew he was quite stressed about it.\"\nIt is clear authorities will have many questions to answer in the coming days - many of them about what change this crime must trigger.\nRenewed calls for gun control reform\nThis is Thailand's deadliest mass shooting in years - and the second at a school this year.\nIn February, a head teacher and a female student were shot by an 18-year-old gunman during a school siege in southern Thailand.\nFour years ago, a 34-year-old in the eastern Nong Bua Lamphu province killed 37 people, most of them preschoolers, in a shooting and stabbing at a nursery.\nThese crimes have resurfaced questions about gun control in the country.\n\"This shouldn't have happened,\" the boyfriend of one of the killed teachers told reporters, clearly distressed and trying to hold back tears.\nMore than seven million people are believed to own guns in the country, one of the highest rates of ownership in the world. Of those, more than one million are unlicensed owners.\nWhile there are restrictions on gun licences in Thailand, people can still acquire the weapons - legally or illegally - with relative ease.\nThere is a thriving black market, aided by Thailand's porous land borders with four other nations. Problems with corruption and loose regulation in the police and military have seen weapons end up in the wrong hands.\nPrime Minister Anutin said he had tightened regulations when he was interior minister three years ago - suspending new gun permits.\nBut gun crime remains rife, with deaths from gunshots among the highest in the region. And some in the community are calling for greater action.\n\"An act of violence in an educational institution, which should be one of the safest places in our society, serves as a stark reminder for Thai society to seriously and systematically review gun control measures,\" Natthaphong Ruengpanyawut, leader of the People's Party - an opposition party - wrote in a Facebook post.\nRelated topics\n- Published15 hours ago",
    "bodyJa": "タイの生徒によると、彼女が撃たれたとき、私は先生の前に立っていた\n- 公開されました\n金曜日の朝、週の最後の授業が始まっていたとき、パニックに陥った学生たちがバンコク郊外の名門学校から飛び出し始めた。\n警察によると、内部では14歳の少年が発砲したという。\n「彼女が撃たれたとき、私は先生の前に立っていました」とノンタブリーのデブシリン学校の門近くで動揺する7年生がBBCに語った。 「[銃撃犯が]現れたとき、彼女は私に話しかけていました。」\nまだ制服を着たまま、母親がそばにいて、彼女は銃撃犯がどのようにして部屋から部屋へと忍び寄ったのかを説明した。\n当局によると、彼は自らに凶器を向ける前に、教師５人を殺害し、仲間の生徒を含む２３人を負傷させた。以前、彼は祖父母を銃で射殺した。\n「他の友達と一緒に逃げるために学校の柵を乗り越えなければなりませんでした」とBBCは名前を明かしていない少女は続けた。\n母親は、少女は自分が死ぬかもしれないと思ったと語った。 「[彼女は言った]『もう会えないと思ってた』」\nある１８歳の学生はロイターに対し、最初は爆竹が鳴っているのではないかと思ったと語った。\n「最初は銃だとは思わなかった」と彼は語った。 「銃声が何発もあった。バンバンバン。それから静かになった。そしてまた始まった。」\n校門から数メートルのところで、群衆が抱き合って泣き叫ぶ中、救急隊員が負傷者を救急車に乗せて病院へ急いだ。\n救助隊員のキアティクン・ベラポンプラディットさんは、12歳の子供たちが負傷したと聞いて現場に駆けつけた。\n47歳の救助隊員はロイター通信に対し、「腕を撃たれた学生、背中を撃たれた学生、胸を撃たれた学生を見た。そこで私は急いで彼らを先に病院に連れて行こうとした」とロイター通信に語った。\n悲しみに暮れるある教師はBBCに対し、死者の中には友人も含まれていたと語った。\n「彼女は私と同い年でした。私たちは生徒としてこの学校に一緒に通いました。その後、二人ともこの学校の教師になりました」と、名前を明かすことを拒否した31歳の男性は語った。\nまだ捜査は始まって日が浅いが、警察は動機について何も語っていない。\n彼らは、銃撃犯が使用した9mm拳銃は祖父のものだと信じている。法医学官らは、銃撃犯の発砲は「非常に正確」で、被害者の体の「急所」に数発命中したことを発見した。\n他の人がいくつかのギャップを埋めています。同校の教師は銃撃犯は攻撃的ではなく成績も良い優秀な生徒だったと述べ、教育当局は犯人が熱心なゲーマーだったと説明している。\nアヌティン・チャーンヴィラクル首相は、研究への圧力が一因となった可能性があると述べた。\n「私たちは彼の祖母が教師であり、彼女が彼に厳しかった可能性があることを知りました。警察が彼の親しい友人から集めた情報から、彼らは彼がそのことでかなりストレスを感じていたことを知っていました。」\n当局が今後数日以内に多くの質問に答えなければならないことは明らかで、その多くはこの犯罪がどのような変化を引き起こすかについてのものだ。\n銃規制改革を改めて求める声\nこれはタイでここ数年で最も死者数が多い銃乱射事件であり、学校で発生した銃乱射事件は今年2件目となる。\n2月、タイ南部の学校包囲で校長と女子生徒が18歳の銃撃犯に射殺された。\n4年前、東部ノンブアランプー県の34歳の男が保育園で銃撃と刺殺事件を起こし、そのほとんどが未就学児だった37人を殺害した。\nこれらの犯罪により、国内の銃規制に対する疑問が再浮上している。\n「こんなことは起こるべきではなかった」と、殺害された教師の一人のボーイフレンドは明らかに苦痛を感じながら涙をこらえながら記者団に語った。\nこの国では700万人以上が銃を所有しているとみられており、世界で最も高い所有率の一つとなっている。そのうち 100 万人以上が無許可の所有者です。\nタイでは銃の免許には制限があるものの、人々は合法・非合法に関わらず比較的簡単に武器を入手することができます。\nタイには他の 4 か国との穴だらけの陸地国境があり、闇市場が繁栄しています。警察や軍における汚職や規制の緩みなどの問題により、武器が悪者の手に渡ってしまっている。\nアヌティン首相は、3年前に内務大臣だったときに規制を強化し、新たな銃の許可を停止したと述べた。\nしかし銃犯罪は依然として蔓延しており、銃による死亡者数はこの地域で最も多い。そしてコミュニティの中には、より大きな行動を求める人もいます。\n「私たちの社会で最も安全な場所の一つであるはずの教育機関での暴力行為は、タイ社会に銃規制対策を真剣かつ体系的に見直すべきだということを痛感させられる」と野党人民党のナタポン・ルエンパニャウット党首はフェイスブックへの投稿で述べた。\n関連トピック\n- 15 時間前に公開",

    "id": "surprise-fall-in-us-jobs-last-month-as-s-14d3a802",
    "title": "Surprise fall in US jobs last month as slow summer continues",
    "titleJa": "緩やかな夏が続く中、先月の米国雇用は予想外の減少",
    "summaryJa": "緩やかな夏が続く中、先月の米国雇用は予想外の減少- 公開されました",
    "bodyOriginal": "Surprise fall in US jobs last month as slow summer continues\n- Published\nThe US economy is creating fewer jobs than expected with the employment market performing weaker during the summer than previously thought, official figures show.\nThere was a surprise shedding of 23,000 jobs last month, with declines driven by cuts in local government education and retail roles, despite analysts predicting growth.\nThe Bureau of Labor Statistics also revised down the number of jobs added in May and June by 103,000, signalling a slow summer of job creation.\nAnalysts said the latest figures could reduce pressure on the US central bank, the Federal Reserve, to raise interest rates next month, despite high inflation.\nNancy Vanden Houten, lead economist at Oxford Economics, said expectations of interest rates being raised had been \"scaled back\", since the decision last month.\nUS stock markets opened higher on Friday following the release of the latest jobs figures on the prospect that the weaker data might prevent any rate hikes.\nAnalysts had expected an uptick in the number of jobs being added to the economy last month of 80,000, as opposed to a loss of 23,000.\nAs well as falls in local government education there were also declines in retail roles, including in wholesale stores, hypermarkets, gas stations and general mechanise shops.\nDespite fewer jobs being created, the Bureau of Labor Statistics said the unemployment rate actually dipped to 4.1% from 4.2%, as the number of people in work or looking for work declined slightly.\nAverage hourly earnings rose by 3.2% in the year to July, compared with the 3.5% economists expected, with average hourly earnings for all employees on private non-farm payrolls at $37.62.\nPayrolls do have a tendency to be softer in July, but chief investment officer of Premier Miton Neil Birrell said the US jobs market was weaker \"by some distance\".\n\"Labour force participation is back at levels not seen since the days of Covid, meaning jobs just aren't being created,\" he said.\n\"This does leave the Fed with the problem of a weak jobs market providing a read across to growth, all at a time when inflation is a problem, but this data will ease the pressure to hike rates. It's a big call in September.\"\nAs well as keeping inflation stable, the Fed has a mandate to maintain a high level of employment, meaning the jobs figures are also watched closely when deciding interest rates.\nKevin Warsh, the newly-appointed chair of the Federal Reserve, has offered little forward guidance on future path of interest rates, in a policy shift from the US central bank.\nRates were left unchanged, as broadly expected, between 3.5% and 3.75% last month. However, consumer prices remain elevated, with inflation running at an annual rate of 3.5%.\nInterest rate hikes are a tool used by central banks aiming to slow the pace at which prices are rising in the shops. By pushing up the cost of borrowing for things such as mortgages, loans and credit cards, central bankers hope consumers will spend less and the rate of price increases will slow.\nWarsh has repeatedly said he wants to bring inflation down, but prices have been rising in the wake of the Middle East conflict impacting global oil prices.\nGasoline prices have gone back above $4 on average following recent escalations, according to the AAA. Diesel is almost $5.40 a gallon.",
    "bodyJa": "緩やかな夏が続く中、先月の米国雇用は予想外の減少\n- 公開されました\n公式統計によると、夏の雇用市場はこれまで考えられていたよりも低迷しており、米国経済が創出する雇用は予想よりも少ないことが示されている。\nアナリストの成長予測にもかかわらず、先月は予想外の2万3000人の雇用削減があり、その減少は地方自治体の教育と小売業の役割の削減が原因だった。\n労働統計局も５月と６月の追加雇用数を１０万３０００人下方修正し、夏の雇用創出の鈍化を示唆した。\nアナリストらは、最新の統計により、インフレ率が高いにもかかわらず、米国の中央銀行である連邦準備理事会（FRB）に対する来月の利上げ圧力が軽減される可能性があると述べた。\nオックスフォード・エコノミクスの主任エコノミスト、ナンシー・バンデン・ハウテン氏は、先月の決定以降、利上げ期待は「縮小」したと述べた。\n金曜日の米国株式市場は、最新の雇用統計の発表を受け、弱い指標により利上げが阻止される可能性があるとの見方から上昇して始まった。\nアナリストらは、先月経済に追加される雇用数が２万３０００人減少するのに対し、８万人増加すると予想していた。\n地方自治体の教育の低下に加えて、卸売店、大型スーパーマーケット、ガソリンスタンド、総合機械店などの小売業の役割も低下した。\n雇用創出は減少しているにもかかわらず、就労または仕事を探している人の数がわずかに減少したため、実際の失業率は4.2％から4.1％に低下したと労働統計局は述べた。\n７月までの１年間の平均時給はエコノミスト予想の３．５％に対し３．２％増加し、非農業部門の民間給与を支払っている全従業員の平均時給は３７．６２ドルとなった。\n７月の雇用統計は確かに軟化する傾向にあるが、ミトン首相のニール・ビレル最高投資責任者（ＣＩＯ）は、米国の雇用市場は「ある程度」弱くなっていると述べた。\n同氏は「労働参加率は新型コロナウイルス感染症の時代以来見られなかった水準に戻っており、雇用が創出されていないだけだ」と述べた。\n「このことにより、インフレが問題となっているこの時期に、成長の先行きを占う雇用市場の弱さという問題がFRBに残されているが、今回のデータは利上げ圧力を和らげるだろう。これは9月の重要な判断だ。」\nFRBにはインフレの安定を維持するだけでなく、高水準の雇用を維持するという使命があるため、金利を決定する際には雇用統計も注意深く監視されることになる。\nFRBの新たな議長に任命されたケビン・ウォーシュ氏は、米国中央銀行からの政策転換の一環として、金利の将来の進路についてほとんどフォワードガイダンスを提供していない。\n金利は大方の予想通り、先月は３．５─３．７５％の間で据え置かれた。しかし、消費者物価は依然として上昇しており、インフレ率は年率 3.5% です。\n金利引き上げは、店頭価格の上昇ペースを遅らせることを目的とした中央銀行の手段だ。中央銀行当局は、住宅ローン、ローン、クレジットカードなどの借入コストを引き上げることで、消費者の支出が減り、物価上昇率が鈍化することを期待している。\nウォーシュ氏はインフレを抑制したいと繰り返し述べてきたが、世界の原油価格に影響を与えている中東紛争を受けて価格は上昇している。\nAAAによると、最近の高騰を受けてガソリン価格は平均4ドルを超えて再び上昇している。ディーゼルは1ガロンあたり約5.40ドルです。",
