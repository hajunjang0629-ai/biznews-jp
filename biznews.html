    "bodyOriginal": "Stock markets remain volatile as investors weigh uncertainty in the Middle East, rising interest rates and concerns about the artificial intelligence (AI) trade.\nGiven this volatile backdrop, investors seeking a stable income stream can enhance their portfolios with the addition of dividend stocks. In this regard, tracking recommendations of top Wall Street analysts can help shortlist attractive dividend stocks that are backed by strong financials.\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\nChevron\nIntegrated oil and gas giant Chevron (CVX) is the first dividend pick. Earlier this month, the company paid a quarterly dividend of $1.78 per share. At an annualized dividend of $7.12 per share, CVX offers a dividend yield of about 3.5%.\nAfter a meeting with senior leadership, Goldman Sachs analyst Neil Mehta reiterated a buy rating on CVX and raised his price target to $240 from $225. Among the key takeaways Mehta emphasized was that Chevron is building a solid pipeline of promising international exploration projects across Latin America, the Middle East, West Africa and the Eastern Mediterranean. In particular, he mentioned the focus on Venezuela, where Chevron expects to more than double gross production to 600 kbd from about 280 kbd by 2031, using three joint ventures.\nMehta also noted Chevron's efforts to deploy new technologies, especially in shale and tight-oil operations. CVX is focused on boosting productivity and efficiency to maximize free cash flow, he added.\nInitiatives such as artificial lift optimization, AI and machine learning, and advanced chemical treatments are expected to improve recovery by about 10% in new wells. Consequently, capital spending per barrel in U.S. shale is projected to fall 25% in 2026, with total Permian spending dropping below $3.5 billion.\nMehta also said that Chevron sees power as a growth opportunity and is using its U.S. natural gas portfolio, key equipment and partnerships to meet rising demand. Notably, Chevron recently signed a 20-year power purchase deal with Microsoft (MSFT) to supply 2.67 GW of behind-the-meter capacity. This project, called Kilby, is expected to see its first power delivery in 2028 and generate mid-teens returns and long-term cash flows.\nMehta ranks No. 536 among more than 12,500 analysts tracked by TipRanks. His ratings have been profitable 61% of the time, delivering an average return of 11.3%. See Chevron Statistics on TipRanks.\nEnterprise Products Partners\nEnterprise Products Partners (EPD) is a master limited partnership (MLP) that provides midstream energy services to producers and consumers of natural gas, natural gas liquids (NGLs), crude oil, refined products and petrochemicals. With a quarterly cash distribution of 56 cents per common unit ($2.24 per common unit annualized), EPD offers a yield of about 6%.\nFollowing a recent call with the company, RBC Capital analyst Elvira Scotto reiterated a buy rating on EPD with a price target of $42. The analyst slightly lowered her estimates for the second half of 2026, citing margin and volume normalization, though demand dynamics remain strong.\nWhile the 5-star analyst expects a sequential decline due to normal seasonality and normalization following high spreads in the first half of the year, she still expects EPD to report another solid quarter (Q3 2026) and enter 2027 with a favorable setup. Ahead of Q3 earnings, Scotto expects investors to focus on export demand durability, EPD's ability to profit from spot cargo sales and growth in Permian volumes.\nScotto continues to expect $150 million of common unit buybacks per quarter in the second half of 2026. She expects buybacks to increase to $200 million per quarter in 2027, as capex spending declines and free cash flow improves.\nIn total, Scotto is bullish on EPD and views it as a core MLP holding that has both offensive and defensive characteristics. The analyst praised EPD's diverse asset base as ensuring stable cash flows. \"Furthermore, the partnership's multi-year organic growth backlog helps provide visibility on long-term distribution growth,\" Scotto said.\nScotto ranks No. 199 among more than 12,500 analysts tracked by TipRanks. Her ratings have been successful 67% of the time, delivering an average return of 15.9%. See Enterprise Products Partners Financials on TipRanks.\nBrookfield Infrastructure Partners\nBrookfield Infrastructure Partners (BIP) operates a diversified portfolio of high-quality utilities, transport, midstream and data assets. The company declared a quarterly distribution of 45.5 cents per unit, payable on September 29. At an annualized distribution of $1.82, BIP offers a yield of 5.2%.\nRecently, BMO Capital analyst Devin Dodge reaffirmed a buy rating on Brookfield Infrastructure with a price target of $47. The analyst cited improved visibility into BIP's growth and views its corporate simplification as a potential catalyst.\n\"Layering in the benefits from the proposed corporate simplification, a multiple well below historical levels and an attractive yield, we believe BIP offers a compelling risk/reward and it remains a preferred idea,\" said Dodge.\nWith more organic growth projects in the pipeline and new partnership investment opportunities, Dodge believes that BIP has clearer visibility into where it will deploy capital. That should support continued double-digit growth in funds from operations (FFO) per unit.\nDodge said the semiconductor foundries that BIP is developing with Intel (INTC) are expected to be fully commissioned by the end of 2026, with returns improving through Q4 2026. Dodge expects the joint venture to boost FFO by 300-400 basis points.\nDodge ranks No. 476 among more than 12,500 analysts tracked by TipRanks. His ratings have been profitable 68% of the time, delivering an average return of 13.5%. See Brookfield Infrastructure Partners KPIs on TipRanks.",

    "summaryJa": "One firm sees a \"reasonably constructive signal for risk appetite\" among institutional investors.",
    "bodyOriginal": "Institutional investors are taking the wheel in the stock market.\nAfter years on a big buying streak, retail traders appear to be moving to the sidelines. At the same time, data from Vanda Research shows that big investors have held steady on stocks in the face of spiking Treasury yields.\n\"Institutional investors have been surprisingly resilient through this week's macro volatility,\" Viraj Patel, global market strategist at Vanda, wrote to clients on Friday.\nOptions flows from institutional investors are around three times higher than a typical September, the data shows.\nPatel said that big money's flows have turned up over the past five sessions, despite the 10-year and 30-year U.S. Treasury yields climbing to their highest levels in more than a decade. He called that a \"reasonably constructive signal for risk appetite\" among institutional investors hidden in the broader story of de-risking.\nPatel said that institutional traders are buying select artificial intelligence plays amid the volatility.\nHe pointed to Meta Platforms as a top pick in particular last week. Shares of the Facebook parent have surged almost 13% in the week following its debut of the Muse Charm device. Momentum has been building for the stock since Meta unveiled its Muse personal AI agent earlier this month.\n\"Macro uncertainty isn't stopping risk-taking,\" Patel said. Instead, \"it's making investors far more selective.\"\nRetail loses volume share\nRetail traders had a banner performance in 2025, leading some to declare that they had shed the \"dumb money\" title. Their performance was credited in part with decisions to buy the dip during market declines in the wake of President Donald Trump's tariff rollout.\nBut Goldman Sachs said retail investors' share of S&P 500 trading volume has trended down from its peak nearly a year ago. It's now more than three percentage points below the five-year average, the bank found.\nThe S&P 500 is ended last week more than 1% higher despite the pressure from rising Treasury yields. That advance has pulled the benchmark into positive territory for the month.",

 despite the pressure from rising Treasury yields. That advance has pulled the benchmark into positive territory for the month.",

    "id": "andy-burnham-refuses-to-back-third-runwa-a9ab5c1e",
    "title": "Andy Burnham refuses to back third runway at Heathrow",
    "titleJa": "Andy Burnham refuses to back third runway at Heathrow",
    "summaryJa": "Andy Burnham said he would wait for the results of a consultation on a scheme estimated to cost £33bn",
    "bodyOriginal": "Andy Burnham refuses to back third runway at Heathrow\n- Published\nPrime Minister Andy Burnham has refused to say whether he backs a third runway at Heathrow after it emerged that the expansion of the London airport could be delayed by up to four years.\nBurnham - who, as Mayor of Greater Manchester, opposed the project - told Sunday With Laura Kuenssberg: \"I think principally, it's a matter for London and Londoners.\"\nHe added: \"I think we ought to hear the voice of people there first. It's not right for me to just jump straight in on the back of the consultation.\"\nFormer Chancellor Rachel Reeves had championed the runway to boost the economy, with a schedule to open by 2035 but Heathrow indicated on Saturday it may not be operational before 2039.\nAs Manchester's mayor, Burnham had been against the project over concerns that it would delay investment in transport for the north. When he took office, he said he was \"open-minded\" about the scheme.\nAs he prepared for his first annual Labour Party conference as prime minister, Burnham said: \"There's a consultion but there are different views and you have to take those views seriously in coming to a decision.\"\nIn response, Heathrow said: \"We agree with the prime minister that local voices must be heard. We know from consistent polling over the last decade that communities support our plans for expansion and support is only growing over time.\"\nThe project, estimated to cost £33bn, has attracted opposition from environmental campaigners and local resident groups as well as Mayor of London Sadiq Khan.\nA third runway would mean demolishing hundreds of homes, diverting rivers and rerouting a section of the M25 motorway through a tunnel.\nBut it is estimated it would create 100,000 jobs and provide a major boost to the UK economy.\nThe number of flights from the site, currently capped at 480,000 a year, could go up to 720,000, or nearly 2,000 a day on average.\nA new runway has been backed by the unions Unite and the GMB.\nSharon Graham, Unite's general secretary said: \"A third runway at Heathrow is essential and we need to get going with it.\n\"This is more than just infrastructure. It's about investing in the workforce, securing the future of good, unionised jobs and a guaranteed market for UK steel.\"\nEarlier this weekend, Heathrow conceded that meeting the original deadline would be increasingly difficult without further steps to simplify the planning process.\nIt said it hoped to secure planning permission by 2029 and then open the runway \"within a decade\".\nThe Department for Transport said the timeline had \"always been ambitious\" and it would continue to work with stakeholders \"at pace\" on the matter.\n- Published19 hours ago\n- Published29 January 2025",
    "bodyJa": "Andy Burnham refuses to back third runway at Heathrow\n- Published\nPrime Minister Andy Burnham has refused to say whether he backs a third runway at Heathrow after it emerged that the expansion of the London airport could be delayed by up to four years.\nBurnham - who, as Mayor of Greater Manchester, opposed the project - told Sunday With Laura Kuenssberg: \"I think principally, it's a matter for London and Londoners.\"\nHe added: \"I think we ought to hear the voice of people there first. It's not right for me to just jump straight in on the back of the consultation.\"\nFormer Chancellor Rachel Reeves had championed the runway to boost the economy, with a schedule to open by 2035 but Heathrow indicated on Saturday it may not be operational before 2039.\nAs Manchester's mayor, Burnham had been against the project over concerns that it would delay investment in transport for the north. When he took office, he said he was \"open-minded\" about the scheme.\nAs he prepared for his first annual Labour Party conference as prime minister, Burnham said: \"There's a consultion but there are different views and you have to take those views seriously in coming to a decision.\"\nIn response, Heathrow said: \"We agree with the prime minister that local voices must be heard. We know from consistent polling over the last decade that communities support our plans for expansion and support is only growing over time.\"\nThe project, estimated to cost £33bn, has attracted opposition from environmental campaigners and local resident groups as well as Mayor of London Sadiq Khan.\nA third runway would mean demolishing hundreds of homes, diverting rivers and rerouting a section of the M25 motorway through a tunnel.\nBut it is estimated it would create 100,000 jobs and provide a major boost to the UK economy.\nThe number of flights from the site, currently capped at 480,000 a year, could go up to 720,000, or nearly 2,000 a day on average.\nA new runway has been backed by the unions Unite and the GMB.\nSharon Graham, Unite's general secretary said: \"A third runway at Heathrow is essential and we need to get going with it.\n\"This is more than just infrastructure. It's about investing in the workforce, securing the future of good, unionised jobs and a guaranteed market for UK steel.\"\nEarlier this weekend, Heathrow conceded that meeting the original deadline would be increasingly difficult without further steps to simplify the planning process.\nIt said it hoped to secure planning permission by 2029 and then open the runway \"within a decade\".\nThe Department for Transport said the timeline had \"always been ambitious\" and it would continue to work with stakeholders \"at pace\" on the matter.\n- Published19 hours ago\n- Published29 January 2025",

    "id": "debt-hungry-ai-companies-face-increased-bf49c64b",
    "title": "Debt-hungry AI companies face increased risk as bond yields spike",
    "titleJa": "Debt-hungry AI companies face increased risk as bond yields spike",
    "summaryJa": "The AI infrastructure buildout shows no sign of slowing, but the surge in Treasury yields means it's at least going to cost more.",
    "bodyOriginal": "With Treasury yields climbing this week to their highest levels since 2007, companies reliant on debt are poised to see their borrowing costs rise. That means the AI infrastructure buildout, which has already reached historic levels, is about to get even more expensive.\nJPMorgan Chase estimated in June that $4.1 trillion in AI-related debt will be issued through 2030, as data center companies and others tied to the artificial intelligence boom race to build up capacity to meet what many industry experts view as insatiable demand for AI services.\nAs borrowers go back to the market, they're now looking at a 10-year Treasury yield that sits near 5.17%, up about 1 percentage point since the start of the year, meaning companies issuing debt are going to have to offer more attractive rates of return to lure investors.\nThe market isn't in panic mode, at least not yet. Shares of debt-heavy neocloud CoreWeave have held up fine, rising almost 8% this week, while Oracle, which has counted on the debt market for its AI expansion, has had a tougher time, falling 7% for the week and about 30% this year.\nMeanwhile, Japan's SoftBank, a principal provider of capital for AI projects, raised $11.1 billion in a junk-bond sale this week, with yields as high as 9.75% for the 7-year tranche.\n\"They basically are price insensitive to that raise, which means they're price takers,\" said Mark Malek, chief investment officer at Siebert Financial, in an interview. \"In my view, a lot of these companies need to be price insensitive. They need to get as much capital as possible to compete.\"\nAt the center of the AI craze are leading model developers OpenAI and Anthropic, which are each valued at close to $1 trillion in the private market. To provide the infrastructure needed for their advanced models, as well as models and services from a host of other companies, tech's hyperscalers — Amazon, Google, Meta and Microsoft — have committed to hundreds of billions of dollars this year in capital expenditures, with an expected increase coming in 2027.\nWhile a healthy dose of that investment is being funded through debt raises, those tech giants all have investment grade credit ratings, providing them with cheaper access to capital. But for the rest of the pack, bigger challenges lie ahead, according to some market participants.\nWarning signs?\nA senior private credit investor, who asked to remain unnamed in order to speak candidly on the matter, told CNBC that, moving forward, neocloud deals will be more difficult to finance, because the companies have less cushion to absorb the costs.\nRiley Thompson, a vice president at Mitsubishi HC Capital America said in an interview that lenders are getting pickier about the projects they're willing to fund even if the borrower agrees to pay a higher rate.\n\"Instead of a roster of 50 neoclouds, there's probably 20 that the market's truly interested in,\" Thompson said.\nCoreWeave, which went public last year, warns about rising rates in its SEC filings. In its latest quarterly filing, the company said that, as of June, every 100-basis point (1 percentage point) increase in rates could result in a $30 million jump in its interest expense, based on the balance of its outstanding floating rate debt.\nAn early warning sign may have landed this week, when Oracle's stock slid following a Bloomberg report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses. The company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, the report said. Oracle said the project \"remains on our planned schedule.\"\nRising interest rates aren't the only matter at hand. Prior to this week's spike in yields, the CEOs of Anthropic and OpenAI had started urging a slowdown in the pace of AI development after industry researchers went public with concerns that advanced models risk spinning out of human control.\nAt the same time, a nationwide backlash against AI data centers has emerged as a major issue heading into November's mid-term elections, with 69% of respondents to a recent NBC News Decision Desk Poll, powered by SurveyMonkey, saying they oppose the construction of such facilities in their local area. On Monday, Texas Republican Gov. Greg Abbott, who's in the midst of a tight race for reelection, ordered a temporary halt to all data center-related environmental permits following a moratorium on grid approvals last month.\nStill, demand for AI services is exploding. The latest example is Meta's Muse personal assistant app, which has rocketed in popularity since its launch earlier in September. Muse clocked more than 2.5 million global downloads in its first two weeks, passing ChatGPT at the top of Apple's App Store, and Evercore's Mark Mahaney told CNBC this week that it could reach 100 million users within six to 12 months.\nAndrew Giudici, global head of corporate, project, and infrastructure finance at credit rating agency KBRA, said that even as rising rates may affect future deals, he doesn't see a major impact on borrower demand.\n\"In a normal environment, people might take a step back and pause a bit,\" Giudici said. \"But I don't think that's going to happen here. I think you're going to continue to see relatively large issuance.\"\nHaim Zaltzman, vice chair of Latham & Watkins' emerging companies and growth practice, said there's no doubt that as costs rise, \"somebody will have to absorb it.\"\n\"But absorbing it in that kind of demand structure, where the demand is so great, is a lot easier,\" said Zaltzman, who works on AI infrastructure financing.\nThe equation is even simpler for Bernie Margulies, CEO of American Compute, which advises on risk management for GPU financing. He said borrowers are eager to secure financing even at higher costs, especially if they have committments with OpenAI and Anthropic, which have been signing contracts to secure compute capacity years into the future.\n\"If you have a deal with Anthropic, will 50 basis points really stop you?\" Margulies said.",
    "bodyJa": "With Treasury yields climbing this week to their highest levels since 2007, companies reliant on debt are poised to see their borrowing costs rise. That means the AI infrastructure buildout, which has already reached historic levels, is about to get even more expensive.\nJPMorgan Chase estimated in June that $4.1 trillion in AI-related debt will be issued through 2030, as data center companies and others tied to the artificial intelligence boom race to build up capacity to meet what many industry experts view as insatiable demand for AI services.\nAs borrowers go back to the market, they're now looking at a 10-year Treasury yield that sits near 5.17%, up about 1 percentage point since the start of the year, meaning companies issuing debt are going to have to offer more attractive rates of return to lure investors.\nThe market isn't in panic mode, at least not yet. Shares of debt-heavy neocloud CoreWeave have held up fine, rising almost 8% this week, while Oracle, which has counted on the debt market for its AI expansion, has had a tougher time, falling 7% for the week and about 30% this year.\nMeanwhile, Japan's SoftBank, a principal provider of capital for AI projects, raised $11.1 billion in a junk-bond sale this week, with yields as high as 9.75% for the 7-year tranche.\n\"They basically are price insensitive to that raise, which means they're price takers,\" said Mark Malek, chief investment officer at Siebert Financial, in an interview. \"In my view, a lot of these companies need to be price insensitive. They need to get as much capital as possible to compete.\"\nAt the center of the AI craze are leading model developers OpenAI and Anthropic, which are each valued at close to $1 trillion in the private market. To provide the infrastructure needed for their advanced models, as well as models and services from a host of other companies, tech's hyperscalers — Amazon, Google, Meta and Microsoft — have committed to hundreds of billions of dollars this year in capital expenditures, with an expected increase coming in 2027.\nWhile a healthy dose of that investment is being funded through debt raises, those tech giants all have investment grade credit ratings, providing them with cheaper access to capital. But for the rest of the pack, bigger challenges lie ahead, according to some market participants.\nWarning signs?\nA senior private credit investor, who asked to remain unnamed in order to speak candidly on the matter, told CNBC that, moving forward, neocloud deals will be more difficult to finance, because the companies have less cushion to absorb the costs.\nRiley Thompson, a vice president at Mitsubishi HC Capital America said in an interview that lenders are getting pickier about the projects they're willing to fund even if the borrower agrees to pay a higher rate.\n\"Instead of a roster of 50 neoclouds, there's probably 20 that the market's truly interested in,\" Thompson said.\nCoreWeave, which went public last year, warns about rising rates in its SEC filings. In its latest quarterly filing, the company said that, as of June, every 100-basis point (1 percentage point) increase in rates could result in a $30 million jump in its interest expense, based on the balance of its outstanding floating rate debt.\nAn early warning sign may have landed this week, when Oracle's stock slid following a Bloomberg report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses. The company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, the report said. Oracle said the project \"remains on our planned schedule.\"\nRising interest rates aren't the only matter at hand. Prior to this week's spike in yields, the CEOs of Anthropic and OpenAI had started urging a slowdown in the pace of AI development after industry researchers went public with concerns that advanced models risk spinning out of human control.\nAt the same time, a nationwide backlash against AI data centers has emerged as a major issue heading into November's mid-term elections, with 69% of respondents to a recent NBC News Decision Desk Poll, powered by SurveyMonkey, saying they oppose the construction of such facilities in their local area. On Monday, Texas Republican Gov. Greg Abbott, who's in the midst of a tight race for reelection, ordered a temporary halt to all data center-related environmental permits following a moratorium on grid approvals last month.\nStill, demand for AI services is exploding. The latest example is Meta's Muse personal assistant app, which has rocketed in popularity since its launch earlier in September. Muse clocked more than 2.5 million global downloads in its first two weeks, passing ChatGPT at the top of Apple's App Store, and Evercore's Mark Mahaney told CNBC this week that it could reach 100 million users within six to 12 months.\nAndrew Giudici, global head of corporate, project, and infrastructure finance at credit rating agency KBRA, said that even as rising rates may affect future deals, he doesn't see a major impact on borrower demand.\n\"In a normal environment, people might take a step back and pause a bit,\" Giudici said. \"But I don't think that's going to happen here. I think you're going to continue to see relatively large issuance.\"\nHaim Zaltzman, vice chair of Latham & Watkins' emerging companies and growth practice, said there's no doubt that as costs rise, \"somebody will have to absorb it.\"\n\"But absorbing it in that kind of demand structure, where the demand is so great, is a lot easier,\" said Zaltzman, who works on AI infrastructure financing.\nThe equation is even simpler for Bernie Margulies, CEO of American Compute, which advises on risk management for GPU financing. He said borrowers are eager to secure financing even at higher costs, especially if they have committments with OpenAI and Anthropic, which have been signing contracts to secure compute capacity years into the future.\n\"If you have a deal with Anthropic, will 50 basis points really stop you?\" Margulies said.",

    "title": "'Funflation' is on the rise as hobbies get pricier, but consumers keep spending anyway",
    "titleJa": "'Funflation' is on the rise as hobbies get pricier, but consumers keep spending anyway",
    "summaryJa": "Consumers are spending more on hobbies like arts and crafts and outdoor sports, as it gets more expensive to travel due to increased airfare.",
    "bodyOriginal": "It's getting more expensive to have fun in America, but consumers are splurging anyway, seeking out experiences ranging from outdoor activities to video games.\nThe Bank of America's latest analysis suggested that \"funflation\" — the increased cost of fun — may be rising, but consumers aren't cutting back.\nIn fact, spending on hobbies, which ranges from arts and crafts and hobby shops to retailers selling skiing, hiking, camping, or scuba diving gear, grew 7.9% in August 2026, year on year, per the bank.\nThis was double the growth of actual transactions, which were up 3.4%, meaning consumers are making more hobby purchases overall, as well as spending more on those hobbies.\n\"Funflation is the escalating cost of leisure activities, which is seen across prices from gas for weekend cars to ice creams on holiday,\" John Gathergood, an economics professor at the University of Nottingham in the U.K., told CNBC.\nThe latest Bureau of Labor Statistics' Consumer Price Index data found that the recreation index, which includes video and audio, pets and pet services, sporting goods, photography and recreational reading, rose 2.7% in the 12 months through August.\nMeanwhile, sales at sporting goods, hobby, musical instrument, and book stores rose 10.7% in the 12 months through August, outpacing the 6% increase in total U.S. retail and food-services sales over the same period, according to the U.S. Census Bureau's Advance Monthly Retail Trade Report.\n\"When prices rise, consumers might substitute between activities,\" Gathergood said. \"More hobbies at home might replace holidays away. More food made at home might replace eating out. So, people may be spending more on hobbies, but are spending less on other activities the hobbies are replacing.\"\nTravel gets more expensive\nThe BofA analysts said the bank's card data suggested the growth in \"hobby spending\" in recent months may be because people are balancing \"a shift away from travel due to higher prices from rising fuel costs,\" as jet fuel prices jumped thanks to the U.S-Iran war. Their analysis excluded travel from its hobby categories.\nJet fuel prices were last $194 per barrel for the week ending Sept. 18, up 116% from the prior year's average, according to the International Air Travel Association's Jet Fuel Price Monitor.\nU.S. airfare prices have increased 26.5% year-on-year, according to federal data in August.\n\"By foregoing travel abroad, consumers can free up substantial amounts of cash to spend on hobbies at home,\" The University of Nottingham's Gathergood said.\nDan Wasiolek, a senior equity analyst at Morningstar, told CNBC that the Covid-19 pandemic accelerated a shift towards \"spending on experiences rather than 'things,'\" even as consumer confidence and savings come under pressure.\nWasiolek noted that higher-income families have continued to travel despite higher costs, and regular Americans also said they'd spend on travel over the summer period.\nThey planned to spend an average of nearly $2,900 on travel in the summer, according to a PWC survey in April of over 2,000 adults. Some 71% of respondents said they expect to spend the same or more than the previous summer.\nGen Z versus millennials\nThe BofA analysis found that older millennials spent the most on hobbies in the three months to August, spending more than double per consumer than Gen Z, the cohort BofA identified as spending the least.\n\"To us, this suggests that these generations are likely gravitating most of their spending toward less expensive hobbies like arts, crafts, and board games,\" the analysts wrote. \"It's also possible that this reflects a shift to more 'granny core' activities like knitting, sewing, or baking.\"\nThe BofA analysis found big growth in per-person video-game spending across age groups in the 12 months to August, with even Gen Z, the generation with the smallest increase, spending 20% more.",

s from rising fuel costs,\" as jet fuel prices jumped thanks to the U.S-Iran war. Their analysis excluded travel from its hobby categories.\nJet fuel prices were last $194 per barrel for the week ending Sept. 18, up 116% from the prior year's average, according to the International Air Travel Association's Jet Fuel Price Monitor.\nU.S. airfare prices have increased 26.5% year-on-year, according to federal data in August.\n\"By foregoing travel abroad, consumers can free up substantial amounts of cash to spend on hobbies at home,\" The University of Nottingham's Gathergood said.\nDan Wasiolek, a senior equity analyst at Morningstar, told CNBC that the Covid-19 pandemic accelerated a shift towards \"spending on experiences rather than 'things,'\" even as consumer confidence and savings come under pressure.\nWasiolek noted that higher-income families have continued to travel despite higher costs, and regular Americans also said they'd spend on travel over the summer period.\nThey planned to spend an average of nearly $2,900 on travel in the summer, according to a PWC survey in April of over 2,000 adults. Some 71% of respondents said they expect to spend the same or more than the previous summer.\nGen Z versus millennials\nThe BofA analysis found that older millennials spent the most on hobbies in the three months to August, spending more than double per consumer than Gen Z, the cohort BofA identified as spending the least.\n\"To us, this suggests that these generations are likely gravitating most of their spending toward less expensive hobbies like arts, crafts, and board games,\" the analysts wrote. \"It's also possible that this reflects a shift to more 'granny core' activities like knitting, sewing, or baking.\"\nThe BofA analysis found big growth in per-person video-game spending across age groups in the 12 months to August, with even Gen Z, the generation with the smallest increase, spending 20% more.",

    "summaryJa": "Tens of millions of people from Maine to Virginia are in the path of the powerful storm.",
    "bodyOriginal": "Nor'easter brings flooding as New York and New Jersey declare emergency\n- Published\nTens of millions of people across the north-eastern US are in the path of a powerful storm bringing coastal flooding, power cuts, travel chaos and cancelled stadium events.\nThe so-called nor'easter is bringing \"dangerous coastal flooding and beach conditions, strong winds and heavy rainfall\" to areas including New York City and Boston on Saturday, the US National Weather Service (NWS) said.\nStates of emergency have been declared in New York and New Jersey, both of which faced a coastal deluge in some areas. Rain and strong winds are forecast from Virginia to Maine.\nIn Brooklyn, a man was killed by a falling tree, the BBC's US partner CBS News reported.\nThe nor'easter has caused widespread power cuts. More than 100,000 households, nearly all in the northeast US, have lost electricity, according to tracker PowerOutage.\nThe Federal Aviation Administration recommended air passengers check with airlines about their flight status. More than 2,400 flights have been delayed and another 1,199 grounded, according to FlightAware.\nSaturday's full moon is projected to worsen coastal flooding. Streets and homes were inundated with floodwater in the coastal New Jersey communities of Surf City and Manasquan on Saturday.\n\"I urge all New Jerseyans to take this storm seriously, stay alert and follow local guidance,\" Governor Mikie Sherrill said.\nNWS said in its alert: \"Prepare immediately for significant inundation in low-lying areas near the shore, including roads underwater and impacts to homes and businesses.\"\nIn New York, officials are warning of wind gusts of up to 55mph (86km/h) throughout the weekend, leading to downed trees and power lines.\n\"Don't travel if you don't have to,\" NYC Mayor Zohran Mamdani told residents in a video message. \"Do not drive or walk through floodwater.\"\nIn the Boston area, the Red Sox moved the last game in their series against the Chicago Cubs to Sunday afternoon in Florida.\nA professional football match between Red Bull New York and St Louis City SC was also cancelled.\nThe Global Citizen Festival concert in New York City's Central Park, which was to be headlined by Lauryn Hill, Wyclef Jean and John Legend, will not go ahead.\nEd Sheeran's Boston concert was also among events called off due to the weather.\nSheeran's concert at the Gillette Stadium in the Boston area was cancelled for safety reasons, the venue said.\nRelated topics\n- Published1 day ago",
    "bodyJa": "Nor'easter brings flooding as New York and New Jersey declare emergency\n- Published\nTens of millions of people across the north-eastern US are in the path of a powerful storm bringing coastal flooding, power cuts, travel chaos and cancelled stadium events.\nThe so-called nor'easter is bringing \"dangerous coastal flooding and beach conditions, strong winds and heavy rainfall\" to areas including New York City and Boston on Saturday, the US National Weather Service (NWS) said.\nStates of emergency have been declared in New York and New Jersey, both of which faced a coastal deluge in some areas. Rain and strong winds are forecast from Virginia to Maine.\nIn Brooklyn, a man was killed by a falling tree, the BBC's US partner CBS News reported.\nThe nor'easter has caused widespread power cuts. More than 100,000 households, nearly all in the northeast US, have lost electricity, according to tracker PowerOutage.\nThe Federal Aviation Administration recommended air passengers check with airlines about their flight status. More than 2,400 flights have been delayed and another 1,199 grounded, according to FlightAware.\nSaturday's full moon is projected to worsen coastal flooding. Streets and homes were inundated with floodwater in the coastal New Jersey communities of Surf City and Manasquan on Saturday.\n\"I urge all New Jerseyans to take this storm seriously, stay alert and follow local guidance,\" Governor Mikie Sherrill said.\nNWS said in its alert: \"Prepare immediately for significant inundation in low-lying areas near the shore, including roads underwater and impacts to homes and businesses.\"\nIn New York, officials are warning of wind gusts of up to 55mph (86km/h) throughout the weekend, leading to downed trees and power lines.\n\"Don't travel if you don't have to,\" NYC Mayor Zohran Mamdani told residents in a video message. \"Do not drive or walk through floodwater.\"\nIn the Boston area, the Red Sox moved the last game in their series against the Chicago Cubs to Sunday afternoon in Florida.\nA professional football match between Red Bull New York and St Louis City SC was also cancelled.\nThe Global Citizen Festival concert in New York City's Central Park, which was to be headlined by Lauryn Hill, Wyclef Jean and John Legend, will not go ahead.\nEd Sheeran's Boston concert was also among events called off due to the weather.\nSheeran's concert at the Gillette Stadium in the Boston area was cancelled for safety reasons, the venue said.\nRelated topics\n- Published1 day ago",

    "id": "faisal-islam-the-two-big-decisions-the-c-814d2cae",
    "title": "Faisal Islam: The two big decisions the chancellor must make",
    "titleJa": "Faisal Islam: The two big decisions the chancellor must make",
    "summaryJa": "He must consider the longevity of Iran war economic pressures and how to sustain modest optimism, writes the BBC's Faisal Islam.",
    "bodyOriginal": "Faisal Islam: The two big decisions the chancellor must make\n- Published\n\"It is tough,\" John Healey admitted to me earlier this month when I asked him if there had been too much doom-mongering?\n\"Conflicts, uncertainty, driving up inflation, driving up interest rates. But we've got great strengths. We've got good reasons to be confident about the future of Britain,\" he insisted.\nThe new scheme to try and help young people get on the property ladder, announced on Saturday, was aimed at boosting confidence in the economy.\nBut the chancellor is now facing two big decisions before his inaugural Budget on 28 October.\nFirstly, about the longevity of the economic pressures caused by the Iran War, and then about how to sustain a modest but notable uptick in economic spirits, through yet more global turbulence.\nIn his first weeks as chancellor the oil price fell as low as $75 a barrel while the yield - the effective interest rate - on 10-year government bonds was 4.9%.\nJust over two months later oil has largely traded above $100 and the 10-year yield is at around 5.4%. It is the ultimate double whammy for a chancellor facing his first Budget.\n1. How long could Iran pressures last?\nYet there is something unusual about this energy shock. It could quickly reverse, as illustrated earlier in the summer when assumptions about a deescalation in the US Iran conflict led to sharp falls in energy prices and yields.\nIn New York this week both President Trump and his Iranian counterpart President Pezeshkian suggested November's US midterm elections were connected to when the war might end.\nThe Iranians would wait until after the elections to seek peace because the war's impact on the cost of living - particularly soaring diesel costs - could damage him electorally, the US president told the UN General Assembly.\nThe Iranian president said his nation \"didn't want it to get to the midterms\".\nBoth sides in this war are feeling the economic squeeze of conflict.\nThe 3 November vote is six days after the Budget. No one could rely on there being a settlement by then, but it is plausible.\nSo the Budget tax, spend and borrowing forecasts could be based on a prolonged conflict, which is actually on the cusp of ending, or even already ended.\nThe chancellor has to therefore decide whether to plan for the worst, and make some painful permanent tax and spend decisions, or buy some time.\nOne option is to let borrowing take some of the strain, by tolerating a reduction in the £24bn of headroom - room for manoeuvre against its self-imposed borrowing rules - left by his predecessor, Rachel Reeves.\nThis year's headroom will be judged in three years rather than four, so there is some rationale as to why a smaller number over a closer target might be appropriate.\nAnd while higher inflation means higher interest costs, it also means higher cash tax receipts, at a time when thresholds continue to be frozen.\n2. Will he keep the vibes going?\nThere is a second consideration. The hopeful optimism \"vibes\" strategy of the Burnham administration appears to have had some impact.\nThe longest running UK consumer confidence survey has hit a two-year high. Among younger people it has not been this high since before Brexit.\nSome data companies call it a \"Burnham bounce\", although the weather and World Cup were also factors.\nThere is evidence, more mixed, that business optimism has also perked up in recent months, possibly because of earlier falls in energy prices, though this has been clouded by anticipation of possible tax rises. Business group, the Institute of Directors said this was despite, rather than because of, the new government.\nWhile no one should get too carried away with these turnarounds, they do stand in contrast to the admitted mistake of the Starmer government in talking up consumer pain, two years ago.\nThe question for the chancellor is whether better consumer and business spirits can be reconciled with the need for a \"challenging\" Budget?\nIndeed, it's important to determine how much of the summer global bond market shock is solely down to the impact of the Iran war and how much is more structural.\nGovernments are facing new and intense competition in bond markets from the world's biggest AI businesses. In addition, the UK has had recent, prominent political and economic uncertainty.\nRight now the bond markets are like a pack of wolves stalking red deer, probing for weaknesses.\n\"At times like this you don't want to be at the back of the herd,\" said one very senior former Treasury adviser.\nUK and US warned to take action on spiralling debt costs by IMF\n- Published4 days ago\nUnexpected UK borrowing surge adds to pre-Budget pressure on chancellor\n- Published5 days ago\nGovernment borrowing, bonds and yields explained\n- Published14 February 2025\nIn response, the Treasury has pointed to the UK having the highest growth and the fastest falling borrowing of the major G7 countries so far this year and our overall energy prices starting to decouple from high and volatile gas prices.\nHowever, the IMF chief Kristalina Georgieva this week dismissed the idea that advanced nations could pause their fiscal homework, while the Gulf situation calmed.\n\"Bring debt levels down, make fiscal consolidation as a priority… it is impossible to stress strongly enough how critical it is to get the courage to take the steps that are necessary,\" Georgieva told me, acknowledging the UK's \"fairly consistent, credible\" plans.\nThen there is the curious conundrum of British productivity. Last year, the government's official forecaster the Office for Budget Responsibility (OBR) downgraded the UK's productivity peformance, leading to a notable hit to the public finances.\nNow the UK's productivity record has been upgraded materially by the Office for National Statistics, although this is because of fewer hours worked. There could therefore be an argument to reverse some of that downgrade.\nSeparately, the new chair of the OBR Jonathan Haskel is known for his argument that official statistics understate investment in intangibles like software and data. His latest research suggests AI-related investment is already visible in US productivity figures, and he has long been optimistic about tech's impact on the future.\nWhile it seems unlikely that such factors will make it into the OBR's calculations next month, there is a real debate here.\nOfficially, however, part of the job at the Budget is to identify cuts to fund the Defence Investment Plan, inherited from Sir Keir. That's before funding the additional move to 3% of GDP and a new social care system.\nEven a promise of less welfare spending looks like being built on an upfront investment in jobs for young people.\nOne change from last year is that so far, the government has parked the \"pitch-rolling\" with a silence that would rival the Trappist monks.\nInstead, policy announcements are strategically timed such as the \"Your First Home\" scheme just as the Labour party conference got underway. We can expect to hear plenty more as the Budget nears.",

ct.\nThe 3 November vote is six days after the Budget. No one could rely on there being a settlement by then, but it is plausible.\nSo the Budget tax, spend and borrowing forecasts could be based on a prolonged conflict, which is actually on the cusp of ending, or even already ended.\nThe chancellor has to therefore decide whether to plan for the worst, and make some painful permanent tax and spend decisions, or buy some time.\nOne option is to let borrowing take some of the strain, by tolerating a reduction in the £24bn of headroom - room for manoeuvre against its self-imposed borrowing rules - left by his predecessor, Rachel Reeves.\nThis year's headroom will be judged in three years rather than four, so there is some rationale as to why a smaller number over a closer target might be appropriate.\nAnd while higher inflation means higher interest costs, it also means higher cash tax receipts, at a time when thresholds continue to be frozen.\n2. Will he keep the vibes going?\nThere is a second consideration. The hopeful optimism \"vibes\" strategy of the Burnham administration appears to have had some impact.\nThe longest running UK consumer confidence survey has hit a two-year high. Among younger people it has not been this high since before Brexit.\nSome data companies call it a \"Burnham bounce\", although the weather and World Cup were also factors.\nThere is evidence, more mixed, that business optimism has also perked up in recent months, possibly because of earlier falls in energy prices, though this has been clouded by anticipation of possible tax rises. Business group, the Institute of Directors said this was despite, rather than because of, the new government.\nWhile no one should get too carried away with these turnarounds, they do stand in contrast to the admitted mistake of the Starmer government in talking up consumer pain, two years ago.\nThe question for the chancellor is whether better consumer and business spirits can be reconciled with the need for a \"challenging\" Budget?\nIndeed, it's important to determine how much of the summer global bond market shock is solely down to the impact of the Iran war and how much is more structural.\nGovernments are facing new and intense competition in bond markets from the world's biggest AI businesses. In addition, the UK has had recent, prominent political and economic uncertainty.\nRight now the bond markets are like a pack of wolves stalking red deer, probing for weaknesses.\n\"At times like this you don't want to be at the back of the herd,\" said one very senior former Treasury adviser.\nUK and US warned to take action on spiralling debt costs by IMF\n- Published4 days ago\nUnexpected UK borrowing surge adds to pre-Budget pressure on chancellor\n- Published5 days ago\nGovernment borrowing, bonds and yields explained\n- Published14 February 2025\nIn response, the Treasury has pointed to the UK having the highest growth and the fastest falling borrowing of the major G7 countries so far this year and our overall energy prices starting to decouple from high and volatile gas prices.\nHowever, the IMF chief Kristalina Georgieva this week dismissed the idea that advanced nations could pause their fiscal homework, while the Gulf situation calmed.\n\"Bring debt levels down, make fiscal consolidation as a priority… it is impossible to stress strongly enough how critical it is to get the courage to take the steps that are necessary,\" Georgieva told me, acknowledging the UK's \"fairly consistent, credible\" plans.\nThen there is the curious conundrum of British productivity. Last year, the government's official forecaster the Office for Budget Responsibility (OBR) downgraded the UK's productivity peformance, leading to a notable hit to the public finances.\nNow the UK's productivity record has been upgraded materially by the Office for National Statistics, although this is because of fewer hours worked. There could therefore be an argument to reverse some of that downgrade.\nSeparately, the new chair of the OBR Jonathan Haskel is known for his argument that official statistics understate investment in intangibles like software and data. His latest research suggests AI-related investment is already visible in US productivity figures, and he has long been optimistic about tech's impact on the future.\nWhile it seems unlikely that such factors will make it into the OBR's calculations next month, there is a real debate here.\nOfficially, however, part of the job at the Budget is to identify cuts to fund the Defence Investment Plan, inherited from Sir Keir. That's before funding the additional move to 3% of GDP and a new social care system.\nEven a promise of less welfare spending looks like being built on an upfront investment in jobs for young people.\nOne change from last year is that so far, the government has parked the \"pitch-rolling\" with a silence that would rival the Trappist monks.\nInstead, policy announcements are strategically timed such as the \"Your First Home\" scheme just as the Labour party conference got underway. We can expect to hear plenty more as the Budget nears.",

    "title": "Trump says he approved new fuel economy standards rolling back Biden-era rules",
    "titleJa": "Trump says he approved new fuel economy standards rolling back Biden-era rules",
    "summaryJa": "The new fuel economy standards will reverse the Biden administration's stricter policies meant to spur electric vehicle adoption.",
    "bodyOriginal": "President Donald Trump on Saturday said he approved new fuel economy standards, reversing former President Joe Biden's stricter policies meant to fuel electric vehicle adoption.\nSince the Corporate Average Fuel Economy, or CAFE, standards were established in 1975, they have been periodically updated, typically to make vehicles more efficient. Under former President Joe Biden's standards, automakers would have had to increase the fuel efficiency of their passenger cars and light trucks to roughly 50 miles per gallon by 2031. The stricter standards were designed to incentivize electric vehicle production and sales in the U.S.\nTrump presented the policy change as a boon for both automakers and consumers, though the final standards have not yet been publicly detailed.\n\"These new Standards will take the waste out of building cars in America. That means LOWER PRICES, saving families thousands on a new, beautiful, and safe car — Far better than the Environmental Monsters that we were building heretofore,\" he wrote in the Truth Social post. \"Every Manufacturer, from General Motors to Ford to Stellantis, has called me wanting to build here, and now they can!\"\nThe regulatory change would fulfill a campaign promise from Trump to rescind policies that encouraged or incentivized electric vehicles.\nIt is unclear what the final fuel economy standards will be, although Transportation Secretary Sean Duffy previously said that they would be sharply lower than the Biden-era policies.\nWeaker fuel economy standards mean that automakers can produce more pickup trucks and SUVs, which are much more profitable than smaller cars but have worse gas mileage. Electric vehicles also become much less attractive to automakers, although some companies, like General Motors, have said that they will still make them.",

    "title": "Boeing flags 737 Max software glitch affecting some automated approach functions",
    "titleJa": "Boeing flags 737 Max software glitch affecting some automated approach functions",
    "summaryJa": "Boeing identified a software issue on some 737 Max aircraft that can affect automated vertical navigation functions after a missed approach.",
    "bodyOriginal": "Boeing said it flagged a software glitch last month on some 737 Max aircraft that could affect certain landing procedures, as the manufacturer seeks federal approval for the fourth and final model in its best-selling aircraft family.\nThe Federal Aviation Administration said Saturday that it is assessing the problem and \"will take immediate action if it identifies a safety concern\" and that it will review Boeing's proposed fix.\nBoeing said the issue could arise after a missed approach when pilots alter a preprogrammed flight path, and that pilots must take additional steps to use automated tools on subsequent approaches.\n\"We shared information with operators that reinforced existing pilot procedures for safely handling such cases. Our engineers are working on a software update to permanently address the issue,\" Boeing said. The Wall Street Journal reported the issue earlier.\nThe company said that pilots are trained to land without the automated system. \"We are working directly with airlines to formalize a procedure that will allow pilots to reenable automated vertical navigation should this situation occur,\" Boeing said.\nU.S. airlines told CNBC that they do not have Max 8 and Max 9 airplanes with the updated software tied to the glitch in their fleets. Airlines can revert some Maxes to the older software version.\nAll-Boeing 737 Max carrier Southwest Airlines said it is \"aware of the issue and is engaged with Boeing and the FAA.\"\nIt added that \"none of our fleet is equipped with Version U.14, including new deliveries of Max 8 airplanes.\" United Airlines also said it's not taking any Max aircraft deliveries with the new software.\nHowever, questions remain about the two other models, the Max 7 and Max 10. The Federal Aviation Administration certified the Max 7, the smallest of the Max family, in early August with the newest software installed. It wasn't immediately clear if the aircraft could be delivered or fly with an older version of software.\nAdditionally, Boeing CEO Kelly Ortberg told investors earlier this month that he expected FAA certification of the Max 10 \"very soon.\"\nThe issue comes after years of delays of Boeing's Max planes following safety and manufacturing crises, including the two deadly crashes of Max 8 aircraft in 2018 and 2019 that killed 346 people. A flawed flight control software system — which has since been updated — was implicated in both crashes.\nThere are 2,430 Max aircraft currently in service globally, according to Cirium.",

software.\nAdditionally, Boeing CEO Kelly Ortberg told investors earlier this month that he expected FAA certification of the Max 10 \"very soon.\"\nThe issue comes after years of delays of Boeing's Max planes following safety and manufacturing crises, including the two deadly crashes of Max 8 aircraft in 2018 and 2019 that killed 346 people. A flawed flight control software system — which has since been updated — was implicated in both crashes.\nThere are 2,430 Max aircraft currently in service globally, according to Cirium.",

    "id": "republic-of-ireland-to-wear-black-armban-e1aad8e2",
    "title": "Republic of Ireland to wear black armbands for Israel game",
    "titleJa": "Republic of Ireland to wear black armbands for Israel game",
    "summaryJa": "Republic of Ireland players intend to wear black armbands \"in recognition of all lives lost in the [Gaza] conflict\" for match against Israel.",
    "bodyOriginal": "Republic of Ireland to wear black armbands for Israel game\n- Published\nRepublic of Ireland players intend to wear black armbands \"in recognition of all lives lost in the [Gaza] conflict\" for Sunday's Nations League game against Israel in Hungary, after confirming they will go ahead with the fixture.\nFootball Association of Ireland (FAI) chief executive David Courell confirmed one player has withdrawn from the squad before the match.\nBut he added that a vote among the squad produced a \"significant majority\" in favour of playing.\nAs well as the intention to wear black armbands for Sunday's 'away' game against Israel in Debrecen, Courell said the players will make further gestures for the initial game and the return 'home' fixture against Israel next Sunday in Serbia.\nThe fixtures have been embroiled in controversy since the two teams were drawn to play each other in Group B3.\nRepublic of Ireland players faced calls to withdraw from the games because of the ongoing Israel-Gaza war with a \"Stop The Game\" campaign - organised by the pressure group Irish Sport for Palestine - gathering pace.\n\"One of their requests is to remove their media obligations for the remainder of this window,\" Courell said at Saturday's delayed news conference.\n\"They also have the intention to wear black armbands in recognition of all lives lost in the [Gaza] conflict.\n\"There will be elements of the pre-match ceremony not be partaken in by the Republic of Ireland and it is also the intention of the players to make a significant contribution to charitable donation by virtue of both [Israel] match fees and also the fixture against Austria at the Aviva [Stadium in Dublin on Thursday].\"\nThere appeared to be real doubt on Saturday morning whether the fixture would take place.\nA pre-match news conference with manager Heimir Hallgrimsson and a player, scheduled for 09:15 BST, was postponed just 15 minutes before it was scheduled to start, with reporters informed it would instead take place after the team's training session which was also delayed.\nThe players were locked in a meeting back at their hotel after it emerged a player, goalkeeper Gavin Bazunu, withdrew from the game in protest with several other expressing their concerns about fielding.\nAbout 13:00, players began to filter out of the meeting room, with it then confirmed the news conference would indeed go ahead, back at Nagyerdei Stadion at 14:30, with training to follow.\nMore than five hours after the initial news conference was scheduled to begin, Courell - flanked by Hallgrimsson and FAI director of football John Martin - confirmed a players' vote passed by a \"significant majority\" to play the game.\n\"This morning, a player expressed their discomfort at the fixture and indicated their intent to withdraw,\" Courell said.\n\"This new variable required time for the rest of the squad to consider and what proceeded was another four hours of conversations, predominantly among the players, but also at times with coaching staff and the [FAI] executive.\n\"There were a lot of positions presented and the association is fully respectful of everyone's right to their respective opinion.\"\nLater on Saturday, Bazunu posted on social media explaining his decision, one that he said he had \"not taken lightly\".\n\"I am a man of strong faith and try my best to be a person of character and principle, therefore I feel it would be wrong to participate in the upcoming fixtures against Israel,\" he said.\n\"My decision is based purely upon my personal belief that the killing of innocent people is wrong.\n\"It is important to note that my stance is not in opposition of the Israel people or the Jewish community but against the atrocities in the region.\n\"There are few times when you get a chance in life to stand up for something bigger and I strongly believe that this is one of them.\"\nRepublic of Ireland squad will meet to discuss Israel games\n- Published3 days ago\n'It's a situation you can't win' - Hallgrimsson\nFormer Republic of Ireland manager Brian Kerr and ex-international James McClean are among those to have backed calls for a boycott of the fixtures.\nThe armed Palestinian group Hamas attacked Israel on 7 October 2023, killing about 1,200 people and taking 251 hostages.\nIn response, Israel launched a massive military offensive in Gaza, during which more than 73,000 people have been killed, according to the territory's Hamas-run health ministry, whose figures are considered reliable by the United Nations.\nHallgrimsson relayed that nobody \"can understand the pressure that has been going on these players\" and said the lengthy meeting on Saturday stemmed from \"a change of mind for one of the players to play the game\".\n\"All of the rest of the players are training today,\" he confirmed.\n\"The balance [to play] changed with this [withdrawal] and obviously it was an ongoing discussion but we came to a conclusion and the game is going ahead.\n\"We will train and there will probably be more discussions tonight and probably tomorrow. It's a unique situation and we are just trying to limit the damage.\"\nThe Republic of Ireland lost their opening Nations League fixture in Kosovo on Thursday, a match overshadowed in the build-up by the Israel games.\nAsked whether the far from ideal preparation for Sunday's game would affect the players, the Irish boss said \"we will see\".\n\"Nobody is comfortable but it's about limiting the damage, both personally and for Irish football, that we need to find some solution on it,\" Hallgrimsson added.\n\"There is no action we do that everyone will agree to, so we need to find a solution to limit the damage for us as a group, for Ireland as a nation and the association for football in Ireland.\n\"We don't know the consequences if we don't play the game but a lot of players share a common feeling, so there are two choices and both are tough. It's a situation you can't win.\"\nA spokesperson for the Irish governement insists any decision regarding the fixtures lie firmly at the door of the FAI and Uefa.\n\"The FAI had decided to play the fixtures against Israel in accordance with their obligations as members of Uefa. Following engagement with players today decision stands,\" they said.\n\"The FAI has strongly represented the views of its membership that Israel should be excluded from international football competitions, including bringing a motion to Uefa to this effect last year. The reality is that this motion was not passed by Uefa and that the FAI was obliged to fulfil the fixture.\"\n'Football has won' - Israel FA's Barzel\nIsrael Football Association [IFA] head of communications Shlomi Barzel commended the Republic of Ireland team for confirming they will play, saying \"football has won\".\nBarzel began Israel's news conference with a statement before requesting questions regarding the game-only were directed towards captain Dor Peretz and head coach Ran Ben-Shimon who remained on script.\n\"The separation between football and politics must be maintained, any other approach spell chaos,\" he said, confirming Israel players intend to shake hands before the game.\n\"The Irish football association [FAI] and the national team players did he right thing by recognising this, even if it took a bit longer than it should. Yet, it is better to be late than never.\n\"The one who certainly lost today are those who want to intimidate to separate and turn the football pitch into a political arena. Uefa, the IFA [Israel Football and the FAI stood strong together to prevent it.\"\nBarzel also confirmed the IFA intend to appeal both yellow cards shown to Sayed Abu Farhi in Thursday's 3-1 defeat by Austria.\nAbu Farhi was shown a second yellow for his goal celebration which Barzel insists was not mimicking the firing of a gun, but an \"imitation of a snooker player, like the legendary Ken Doherty.\"",

    "summaryJa": "OpenAI is conducting an extensive review of misaligned model activity after disclosures involving an Australian government portal and other websites.",
    "bodyOriginal": "OpenAI said Friday that it is conducting an \"extensive\" review of its models' activities following the Hugging Face breach, after additional examples of unusual or unauthorized agent activity were disclosed this week.\nThe safety and security practices at the artificial intelligence company have been under intense scrutiny since it disclosed that its models escaped containment, accessed the open internet and breached Hugging Face, which operates an open-source developer platform, in July. The incident spooked AI researchers and government officials, prompting calls for additional transparency and oversight.\nOpenAI said Friday that the Hugging Face incident is the most severe event it has identified, but it has notified third parties whose systems may have been affected by \"unexpected or concerning\" model behavior. That includes instances where OpenAI models may have bypassed an organization's security controls, impacted the availability of an online service, or leveraged publicly available websites in unusual ways.\n\"We will be as transparent as we can be subject to things like vulnerabilities in other companies that our agents have found, which will be their call to disclose or not,\" OpenAI CEO Sam Altman said in a post on X on Friday.\nAustralian Prime Minister Anthony Albanese said Thursday that an OpenAI agent gained unauthorized access to the public-facing Medicare statistics portal and access to public and non-public files in June. He said no personal information was believed to have been accessed.\nDuring a press conference in New York, Albanese said he spoke with Altman about the incident and expressed concern and disappointment about how long it took OpenAI to disclose what happened and that \"the nature of the way that that notification occurred as well was unacceptable.\"\n\"Most of the activity we've reviewed so far involved routine research tasks, such as accessing public web content to answer questions,\" an OpenAI spokesperson told CNBC in a statement late Friday. \"Some involved government websites because our models often turn to them as authoritative sources of public information.\"\nTransluce, an independent AI research lab, published a report detailing several additional incidents this week. In one case, agents that researchers said may be linked to OpenAI unsuccessfully tried to access a photograph from a digital library at the University of New Mexico in May. That same month, agents looking for information about the University of Iowa attempted, and failed, to access a public data platform called Data USA, Transluce reported.\nOpenAI agents also accessed publicly available information from the U.S. Securities and Exchange Commission and the U.S. Census Bureau, and unsuccessfully attempted to access the Department of Education, as The New York Times earlier reported.\n\"The Department of Education's system operations reviews have found no evidence of any impact to our website or databases,\" a spokesperson told CNBC in a statement late Friday.\nAn OpenAI spokesperson said the company's models reached the websites SEC.gov and Investor.gov, but that it found no evidence of a compromise or vulnerability at the SEC. Similarly, the spokesperson said OpenAI models used publicly available developer keys to read demographic and economic Census Bureau data, but that the company found no evidence of improper access to Census accounts.\nOpenAI said Friday that most of the cases identified so far have been low severity, but that given the scale of its review, the full process will take months to complete.\nWATCH: OpenAI agent hacks Australian government website: What you need to know",
    "bodyJa": "OpenAI said Friday that it is conducting an \"extensive\" review of its models' activities following the Hugging Face breach, after additional examples of unusual or unauthorized agent activity were disclosed this week.\nThe safety and security practices at the artificial intelligence company have been under intense scrutiny since it disclosed that its models escaped containment, accessed the open internet and breached Hugging Face, which operates an open-source developer platform, in July. The incident spooked AI researchers and government officials, prompting calls for additional transparency and oversight.\nOpenAI said Friday that the Hugging Face incident is the most severe event it has identified, but it has notified third parties whose systems may have been affected by \"unexpected or concerning\" model behavior. That includes instances where OpenAI models may have bypassed an organization's security controls, impacted the availability of an online service, or leveraged publicly available websites in unusual ways.\n\"We will be as transparent as we can be subject to things like vulnerabilities in other companies that our agents have found, which will be their call to disclose or not,\" OpenAI CEO Sam Altman said in a post on X on Friday.\nAustralian Prime Minister Anthony Albanese said Thursday that an OpenAI agent gained unauthorized access to the public-facing Medicare statistics portal and access to public and non-public files in June. He said no personal information was believed to have been accessed.\nDuring a press conference in New York, Albanese said he spoke with Altman about the incident and expressed concern and disappointment about how long it took OpenAI to disclose what happened and that \"the nature of the way that that notification occurred as well was unacceptable.\"\n\"Most of the activity we've reviewed so far involved routine research tasks, such as accessing public web content to answer questions,\" an OpenAI spokesperson told CNBC in a statement late Friday. \"Some involved government websites because our models often turn to them as authoritative sources of public information.\"\nTransluce, an independent AI research lab, published a report detailing several additional incidents this week. In one case, agents that researchers said may be linked to OpenAI unsuccessfully tried to access a photograph from a digital library at the University of New Mexico in May. That same month, agents looking for information about the University of Iowa attempted, and failed, to access a public data platform called Data USA, Transluce reported.\nOpenAI agents also accessed publicly available information from the U.S. Securities and Exchange Commission and the U.S. Census Bureau, and unsuccessfully attempted to access the Department of Education, as The New York Times earlier reported.\n\"The Department of Education's system operations reviews have found no evidence of any impact to our website or databases,\" a spokesperson told CNBC in a statement late Friday.\nAn OpenAI spokesperson said the company's models reached the websites SEC.gov and Investor.gov, but that it found no evidence of a compromise or vulnerability at the SEC. Similarly, the spokesperson said OpenAI models used publicly available developer keys to read demographic and economic Census Bureau data, but that the company found no evidence of improper access to Census accounts.\nOpenAI said Friday that most of the cases identified so far have been low severity, but that given the scale of its review, the full process will take months to complete.\nWATCH: OpenAI agent hacks Australian government website: What you need to know",

    "titleJa": "Apple faces $5.7 billion patent infringement verdict over iPhone and Apple Watch haptics",
    "summaryJa": "A federal jury awarded Taction Technology more than $5.7 billion after finding Apple infringed claims from two haptics patents. Apple plans to appeal.",
    "bodyOriginal": "A federal jury in San Diego awarded Taction Technology more than $5.7 billion in damages Friday after finding that Apple infringed claims from two haptics patents.\nTaction sued Apple in 2021 in the U.S. District Court for the Southern District of California. The company alleged that Apple was improperly \"capitalizing on Taction's innovation and success\" by selling devices that infringed on its vibration technology, according to the complaint. Apple initially won dismissal in 2023, and the Federal Circuit later revived the case.\n\"While we thank the jury for their consideration, we strongly disagree with today's verdict and the damages awarded, which are entirely unsupported by the facts,\" Apple told CNBC in a statement. \"Apple's Taptic Engine is fundamentally different from Taction's technology, which Taction's own testing of Apple's products confirmed during trial. Apple does not use Taction's technology, and we will appeal.\"\nTaction did not immediately respond to CNBC's request for comment.\nThe lawsuit centered around U.S. Patent Nos. 10,659,885 and 10,820,117, which both involve vibration-based, tactile transducer technology that helps users feel a device responding to their input. Taction argued that Apple's \"Taptic Engine,\" which is embedded in its Apple Watches and iPhones, uses its inventions without proper license or authority.\nThe jury trial began Sept. 14, and the seven jurors deliberated for two days after proceedings concluded. They returned at 1:15 p.m. PT on Friday and delivered the verdict in favor of Taction.\nThe jury did not find Apple's infringement willful.\nWATCH: Apple’s three-part iPhone rollout complicates the demand read",

    "id": "german-town-bans-stumbling-stone-memoria-c11f337b",
    "title": "German town bans 'stumbling stone' memorials to Nazi victims",
    "titleJa": "German town bans 'stumbling stone' memorials to Nazi victims",
    "summaryJa": "Germany's education minister has branded the ban on the small brass memorial plaques a \"scandal\".",
    "bodyOriginal": "German town bans 'stumbling stone' memorials to Nazi victims\n- Published\nThere has been a wave of criticism in Germany after the town of Heidenau, near Dresden in Saxony, decided to ban \"stumbling stone\" memorials to victims of the Nazis.\nGermany's Education Minister Karin Prien told newspaper Bild that the ban was a \"scandal\".\nSince the 1990s, many towns in countries across Europe, including in Germany and Austria, have embedded small brass plaques in the streets in memory of Jews and other victims of Nazi atrocities.\nThe plaques, called Stolpersteine in German, are often placed outside the houses where the victims used to live or work. They are frequently funded by donations.\nBut now councillors from the Alternative für Deutschland (AfD) party and the conservative CDU in Heidenau have voted to ban stumbling stones in their town.\nThe AfD in Saxony has been classified as extreme-right by German intelligence, a designation the party rejects.\nThe motion in the town council said that many citizens felt that this form of commemoration of Nazi victims was inappropriate.\nMemorials should in future be placed at the city's Nordfriedhof cemetery to make it \"impossible to step directly onto the memorial elements\", the motion stated.\nHowever, Karin Prien, a member of the CDU, criticised the decision.\n\"Anyone who banishes Stolpersteine and memorial sites commemorating Jewish life from public spaces to the cemetery is prioritising death over life and rendering Jewish people invisible once again,\" she told Bild.\nShe said her own CDU party in Saxony also bore responsibility for the decision.\nCharlotte Knobloch, a Holocaust survivor and president of the Jewish Community in Munich, said that removing memorials from the cityscape was \"completely the wrong approach\".\nShe told the Funke Media Group that she was \"appalled that a democratic party would stoop to supporting such a transparent manoeuvre by the extremists of the AfD\".\nKnobloch said that she was not a supporter of the stumbling stones, but added that \"decentralised remembrance – which is not banished from public space but, on the contrary, permeates and shapes it\" was crucial to a genuine culture of remembrance.\nIn her own city of Munich, there are no Stolpersteine on municipal land. Instead, the city allows memorial plaques on public buildings.\nAs the name suggests, Stolpersteine are intended as memorials people stumble upon, making them reflect on the history of their location.\nGunter Demnig, the artist who initiated the Stolperstein project, said that given the recent electoral successes of the AfD \"it was certainly to be expected that something like this would happen\".\nThe AfD recently secured major victories in state elections in Saxony-Anhalt and Mecklenburg-Vorpommern.\nSome branches of the populist AfD are classed as right-wing extremist by domestic intelligence, a designation the party strongly rejects.\nIts anti-immigration, \"Germany first\" and Russian-friendly agenda has found fertile ground in the country's former communist east.\nRelated topics\n- Published30 May 2022\n- Published7 May\n- Published24 November 2025",

hat she was not a supporter of the stumbling stones, but added that \"decentralised remembrance – which is not banished from public space but, on the contrary, permeates and shapes it\" was crucial to a genuine culture of remembrance.\nIn her own city of Munich, there are no Stolpersteine on municipal land. Instead, the city allows memorial plaques on public buildings.\nAs the name suggests, Stolpersteine are intended as memorials people stumble upon, making them reflect on the history of their location.\nGunter Demnig, the artist who initiated the Stolperstein project, said that given the recent electoral successes of the AfD \"it was certainly to be expected that something like this would happen\".\nThe AfD recently secured major victories in state elections in Saxony-Anhalt and Mecklenburg-Vorpommern.\nSome branches of the populist AfD are classed as right-wing extremist by domestic intelligence, a designation the party strongly rejects.\nIts anti-immigration, \"Germany first\" and Russian-friendly agenda has found fertile ground in the country's former communist east.\nRelated topics\n- Published30 May 2022\n- Published7 May\n- Published24 November 2025",
