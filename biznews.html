    "summaryJa": "株式市場が不可避の低迷に向かい、10年国債などの長期債券がこれまでポートフォリオ内で提供してきた分散効果が得られないという根強い懸念のなか、多くの投資家が短期投資、特に超短期債券ファンドに目を向けている。過去 10 年間の株式市場のリターンは好調で、S&P 500 指数は過去 10 年間のほとんどで 2 桁の上昇を記録しました。 「マグ7」テクノロジー株とAIブームに支えられ、ここ数年は特に堅調だった。",
    "bodyOriginal": "Many investors are turning to short-term investments, particularly ultra-short bond funds, amid persistent concerns that the equity market is headed for an inevitable downturn and long-term bonds like the 10-year treasury are not providing the diversification benefits that they have provided within portfolios historically.\nStock market returns have been strong over the past decade, with the S&P 500 Index delivering double-digit gains for most of the past decade. The last several years have been especially robust, buoyed by the \"Mag 7\" technology stocks and the AI boom.\n\"Investors have enjoyed one of the strongest equity markets in history, and they're starting to get worried about downside risk,\" said Christopher Coolidge, chief investment officer at Brookwood Investment Group in Phoenix.\nAs investors take some money off the table, bank deposits are paying next to nothing with an average yield well under 1%, and long-term bonds are losing money in an uncertain rate environment. The iShares 20+ Year Treasury Bond ETF (TLT), for example, has posted an average annual return of negative 6.7% over the past five years, while its 7-10 Year Treasury Bond ETF (IEF) has posted an average annual decline of 1%.\nInvestors are looking for other safety trades to beat inflation. With their attractive yields and less downside risk, short-term investments are getting more attention.\nHow much is being moved into cash-like investments\nSome financial professionals have been moving a larger portion of their clients' portfolios to cash-like investments. Brookwood Investment Group's model portfolios, for instance, generally consist of about 5% cash. That's up from about 2% in June. \"We've become more defensive as equity markets continue to hit all-time highs,\" Coolidge said.\nFor the cash portion of their portfolios, Brookwood creates a basket of ultra-short ETFs, combining treasury exposure, floating rate securities, ETFs with active credit management and option-enhanced income strategies. A client can also opt to be 100% invested in the ultra-short basket for a little while, or even 50% or 20%, depending on their comfort level, Coolidge said.\nCyrus Amini, chief investment officer at Hyphen Wealth Management in Lafayette, California, also uses a combination of short-duration bond funds and money market funds for liquidity. \"I don't see the need to take duration risk in this market,\" he said.\nWhy ultra-short bond funds are big winners\nOften, when investors are concerned about the equity market, they look to bond funds, but there are concerns here too that go beyond the recent poor performance numbers. The long end of the bond market has become much more volatile amid inflation concerns, geopolitical fears and the belief that the Federal Reserve may have to raise rates before the end of the year, Coolidge said. Though recent inflation data, combined with unexpectedly soft jobs market data, have lowered the market odds that rate hikes are just ahead.\nBut ultra-short bond funds are proving popular as a short-term place to park money. These funds primarily invest in fixed-income securities with maturities typically under one year. This can include investments in government bonds, investment-grade corporate debt, asset-backed securities and commercial paper.\nUltra-short bond ETFs saw inflows of $12.8 billion in July, according to Morningstar Direct. These funds add slightly more yield than money market ETFs or mutual funds, with only a bit more risk, according to financial strategists. \"The ultrashorts are adding anywhere from 75 to 110 basis points over money market ETFs with comparable duration and interest rate sensitivity,\" Coolidge said.\nThe best ultra-short bond funds to buy in 2026 include the Baird Ultra Short Bond Fund (BUBIX) and the JPMorgan Ultra-Short Income ETF (JPST), according to Morningstar.\nMoney market funds eliminate rate risk\nUltra-short bond funds still carry some interest rate risk. If that bothers investors, they can purchase money market ETFs or mutual funds instead. \"It's all about your comfort level,\" said Brian Huckstep, chief investment officer of Advyzon Investment Management in Lisle, Illinois.\nMoney market ETFs are still relatively new, but they're gaining popularity. The first of these ETFs started trading in 2024, and there are only nine in the U.S., said Daniel Sotiroff, associate director of ETF and passive strategies research for North America at Morningstar Research Services. They're small compared with their mutual fund peers. Assets totaled $24 billion across the nine ETFs at the end of July, compared with $7.7 trillion held in money market mutual funds, according to Morningstar data.\nNonetheless, net flows into money market ETFs have been positive every month since inception except for June and July 2026, and they've been gaining traction, according to Morningstar Direct. From January through July, money market ETFs had net inflows of $18.7 billion, compared with $2.8 billion for money market mutual funds.\nThe largest money market ETF is the ProShares GENIUS Money Market ETF (IQMM). That fund had $17.4 billion in assets at the end of July, according to Morningstar Direct.\nA focus on rebalancing, reducing risk after big stock gains\nThe run-up in equities means that many investors' target asset allocations are off-kilter, Amini said, and he added that makes it a good time to be prudent about rebalancing to reduce portfolio risk. This could mean putting more into short-duration fixed income and money markets, with the idea that as long as the investments earn slightly above inflation, it's a win, Amini said. He's been spending more time with clients talking about locking in gains — incrementally taking some of the equity gains off the table and putting them in money market funds or ultra-short bond funds. \"I would rather be more prudent ahead of time than worry about things once a potential drawdown has occurred,\" he said.\nAnother reason clients may want to shift out of equities is that their goals have changed. \"If you plan to make a down payment on a house in eight months, that money shouldn't be in the stock market,\" said Mike Bisaro, president and chief executive at StraightLine, an investment advisory firm in Troy, Michigan. However, investors should feel comfortable investing in an ultra-short bond fund or money market fund. \"They're at least doing a better job of holding your buying power than a bank where you're effectively losing money,\" he said.\nNever just 'go to cash'\nAlthough investors have been turning to safer investments, the percentage of assets in money market funds has been relatively consistent compared with stock and bond funds since the aftermath of the Covid-19 pandemic, according to Sotiroff. The proportion of money invested in money markets has been around 18% to 20% over the past several years. At the end of June, around 64% of money was in stock funds, 18% in bond funds, and 17.5% in money markets, according to Morningstar data.\nInvestors shouldn't try to time the market. They should also ensure they keep a healthy percentage of equities in their portfolio, based on factors such as age, assets, liabilities and risk tolerance. \"The problem with going completely to cash is that you've introduced the element of timing to your portfolio,\" Bisaro said. Investors sometimes say they'll reinvest in equities when things get better. \"Who's to say when that will be?\"",
    "bodyJa": "株式市場が不可避の低迷に向かい、10年国債などの長期債券がこれまでポートフォリオ内で提供してきた分散効果が得られないという根強い懸念のなか、多くの投資家が短期投資、特に超短期債券ファンドに目を向けている。\n過去 10 年間の株式市場のリターンは好調で、S&P 500 指数は過去 10 年間のほとんどで 2 桁の上昇を記録しました。 「マグ7」テクノロジー株とAIブームに支えられ、ここ数年は特に堅調だった。\nブルックウッド・インベストメント・グループ（フェニックス）の最高投資責任者クリストファー・クーリッジ氏は「投資家は史上最も強い株式市場の一つを享受しており、下値リスクを懸念し始めている」と述べた。\n投資家が資金を手放す中、銀行預金は平均利回りが1％をはるかに下回る水準でほとんど支払われず、不確実な金利環境で長期債券は損失を被っている。例えば、iシェアーズの20年以上国債ETF（TLT）は過去5年間で年平均リターンがマイナス6.7％となっている一方、7～10年国債ETF（IEF）は年平均1％の下落を記録している。\n投資家はインフレに打ち勝つための他の安全取引を模索している。利回りが魅力的で下値リスクが少ないため、短期投資への注目が高まっています。\nどれだけが現金同様の投資に振り込まれているか\n一部の金融専門家は、顧客のポートフォリオの大部分を現金同様の投資に移しています。たとえば、ブルックウッド・インベストメント・グループのモデルポートフォリオは通常、約5％の現金で構成されている。 ６月の約２％から上昇した。クーリッジ氏は「株式市場が過去最高値を更新し続ける中、われわれはより守りの姿勢になっている」と述べた。\nブルックウッドは、ポートフォリオの現金部分について、国債エクスポージャー、変動利付証券、アクティブな信用管理とオプション強化インカム戦略を備えたETFを組み合わせた超短期ETFのバスケットを作成しています。顧客は、快適さのレベルに応じて、しばらくの間超短バスケットに 100% 投資することも、50% または 20% を投資することも選択できる、とクーリッジ氏は述べた。\nカリフォルニア州ラファイエットのハイフン・ウェルス・マネジメントの最高投資責任者であるサイラス・アミニ氏も、流動性確保のために短期債券ファンドとマネーマーケットファンドを組み合わせて利用している。同氏は「この市場ではデュレーションリスクを取る必要性は感じられない」と述べた。\n超短期債券ファンドが大きな勝者となる理由\n多くの場合、投資家は株式市場を懸念する場合、債券ファンドに目を向けますが、ここでも最近のパフォーマンスの悪さの数字を超えた懸念があります。クーリッジ氏は、インフレ懸念や地政学的な懸念、米連邦準備理事会（ＦＲＢ）が年末までに利上げが必要になるかもしれないとの見方を背景に、債券市場の長期金利はさらに不安定になっていると述べた。しかし、最近のインフレ統計は、予想外に軟調な雇用市場データと相まって、利上げが目前に迫っているという市場の確率を低下させている。\nしかし、超短期債券ファンドは短期的な資金の保管場所として人気が高まっている。これらのファンドは主に満期が通常 1 年未満の債券に投資します。これには、国債、投資適格社債、資産担保証券、コマーシャルペーパーへの投資が含まれます。\nモーニングスター・ダイレクトによると、超短期債券ＥＴＦには７月に１２８億ドルの流入があった。金融ストラテジストによれば、これらのファンドは短期金融市場のETFや投資信託よりも利回りが若干高くなりますが、リスクはわずかに高いだけです。クーリッジ氏は「ウルトラショートは、同等のデュレーションと金利感応度を備えた短期金融市場ETFに比べて75〜110ベーシスポイント上昇している」と述べた。\nモーニングスターによると、2026年に購入するのに最適な超短期債券ファンドには、ベアード・ウルトラショート債券ファンド（BUBIX）とJPモルガン・ウルトラショート・インカムETF（JPST）が含まれるという。\nマネーマーケットファンドは金利リスクを排除します\n超短期債券ファンドには依然としてある程度の金利リスクが伴います。それが投資家にとって気になる場合は、代わりにマネーマーケットETFや投資信託を購入することもできます。イリノイ州ライルにあるアドビゾン・インベストメント・マネジメントの最高投資責任者ブライアン・ハックステップ氏は、「すべては自分の快適さのレベルだ」と語る。\nマネーマーケット ETF はまだ比較的新しいものですが、人気が高まっています。モーニングスター・リサーチ・サービシズの北米向けETFおよびパッシブ戦略調査アソシエートディレクター、ダニエル・ソティロフ氏によると、これらのETFの最初のものは2024年に取引が開始され、米国には9つしかないという。同業の投資信託と比較すると規模は小さい。モーニングスターのデータによると、7月末時点で9つのETF全体の資産総額は240億ドルだったのに対し、マネーマーケット・ミューチュアルファンドの保有資産は7兆7000億ドルだった。\nそれにもかかわらず、モーニングスター・ダイレクトによると、短期金融市場ETFへの純流入額は2026年6月と7月を除き、開始以来毎月プラスとなっており、勢いを増しているという。 1月から7月までのマネーマーケットETFの純流入額は187億ドルで、マネーマーケットミューチュアルファンドの純流入額は28億ドルだった。\n最大のマネーマーケットETFはProShares GENIUS Money Market ETF (IQMM)です。モーニングスター・ダイレクトによると、同ファンドの7月末時点の資産は174億ドルだった。\nリバランスに重点を置き、株価が大幅に上昇した後のリスクを軽減\nアミニ氏は、株式の急騰は多くの投資家の目標資産配分がずれていることを意味しており、ポートフォリオのリスクを軽減するためのリバランスについて慎重になる良い時期だと付け加えた。アミニ氏は、これは、投資収益がインフレをわずかに上回っていれば勝ちだという考えのもと、短期債券や短期金融市場への投資を増やすことを意味する可能性があると述べた。同氏は、利益の確定について顧客と話す時間を増やしており、株式利益の一部を段階的にテーブルから外し、マネーマーケットファンドや超短期債券ファンドに移している。同氏は「潜在的な下落が起きてから心配するよりも、事前に慎重になりたい」と述べた。\n顧客が株式からのシフトを希望するもう 1 つの理由は、目標が変化したことです。ミシガン州トロイの投資顧問会社ストレートラインの社長兼最高経営責任者マイク・ビサロ氏は、「8カ月以内に住宅の頭金を支払うつもりなら、そのお金は株式市場に出すべきではない」と語る。ただし、投資家は超短期債券ファンドやマネーマーケットファンドに安心して投資できるはずです。 「少なくとも事実上損失を被っている銀行よりも、彼らは購買力を維持するという点でうまく機能している」と同氏は語った。\n決して「現金に行く」だけではない\nソティロフ氏によると、投資家はより安全な投資に目を向けているが、新型コロナウイルス感染症パンデミック（世界的大流行）の余波以来、マネーマーケットファンドの資産に占める割合は株式や債券ファンドに比べて比較的安定しているという。過去数年間、短期金融市場に投資される資金の割合は約18％から20％であった。モーニングスターのデータによると、６月末時点で資金の約６４％が株式ファンド、１８％が債券ファンド、１７．５％が短期金融市場に投じられていた。\n投資家は市場のタイミングを計ろうとすべきではありません。また、年齢、資産、負債、リスク許容度などの要素に基づいて、ポートフォリオ内の株式の健全な割合を維持する必要もあります。 「完全に現金化する場合の問題は、ポートフォリオにタイミングの要素を持ち込んでいることだ」とビサロ氏は言う。投資家は時々、状況が良くなったら株式に再投資すると言います。 「それがいつになるか誰が言えるでしょうか？」",

    "summaryJa": "イスラエル軍によるレバノン南部攻撃で11人死亡、当局発表- 公開されました",
    "bodyOriginal": "Eleven killed in Israeli strikes on southern Lebanon, authorities say\n- Published\nEleven people have been killed in Israeli strikes in southern Lebanon, authorities say, in one of the deadliest days of attacks since an agreement aimed at reducing hostilities was announced in June.\nLebanon's prime minister said seven people were killed in a strike on a house on the outskirts of Ansar in the Nabatieh district, which state media reported included three children and two women.\nLater on Saturday, another round of strikes hit the town of Deir al-Zahrani, killing four and wounding five others, the Lebanese Ministry of Health said.\nIsrael's military said it had struck \"Hezbollah terror infrastructure\" in response to what it described as an earlier action against its soldiers.\nAuthorities say the strike in Ansar at around 04:30 (01:30 GMT) occurred where displaced families were living. Footage on social media shows large plumes of smoke permeating through the streets of the village as sirens ring out.\nLebanon's Prime Minister Nawaf Salam condemned the attacks, saying the seven civilians killed were not \"military infrastructure\".\n\"Israel must halt this escalation,\" he said. \"For the security of our people and their right to life on their land are not subject to negotiation or bargaining.\"\nThe Israel Defense Forces (IDF) said the incident that had prompted its strike on Ansar took place in the Ali al-Taher Ridge, a strategic high ground overlooking much of south-eastern Lebanon and of the war's most fiercely contested positions.\nLebanon's state-run National News Agency (NNA) also reported a series of strikes around the ridge.\nNear the border, several homes were reportedly destroyed in Bint Jbeil, while Israeli forces opened heavy machine gun fire towards houses, according to NNA.\nLebanon was drawn into the war between Israel, the US and Iran on 2 March, when Hezbollah - the armed group affiliated with Iran - launched rockets into Israel in retaliation for a strike that killed Iran's supreme leader.\nIsrael responded by launching a bombing campaign across Lebanon and invading a significant part of the country's south. Its forces continue to occupy roughly 5% of Lebanese territory.\nThe June ceasefire framework calls for Hezbollah to disarm, Israeli forces to withdraw gradually from southern Lebanon and the Lebanese army to deploy across the area.\nLebanon's President Joseph Aoun condemned the Israeli strikes that had killed an entire family in Ansar and its \"repeated violations\" of the framework, which he said sent a \"clear message\" to the US-led negotiations.\nHezbollah was not involved in the agreement and has rejected direct negotiations.\nThe IDF says it will continue to remove threats to Israeli citizens and soldiers operating in the security zone - the 10km-deep military buffer in southern Lebanon occupied by Israel.\nDespite a reduction in fighting following the June agreements, Israeli strikes and demolitions in southern Lebanon have continued.\nOn Friday, Hezbollah leader Naim Qassem criticised the Lebanese authorities over the implementation of the framework, accusing them of putting pressure on the Lebanese army while Israeli attacks continued.\n\"How can you accept this ongoing humiliation of the Lebanese army, exposing it to bombardment and Israeli pressures, instead of acting as its protectors?\" he said.\nLebanese and Israeli negotiators are set to meet for an eighth round of negotiations in September, but a final date has not been set.\n- Published6 August",
    "bodyJa": "イスラエル軍によるレバノン南部攻撃で11人死亡、当局発表\n- 公開されました\n当局によると、レバノン南部でのイスラエル軍の攻撃で11人が死亡、6月に敵対関係の縮小を目的とした合意が発表されて以来、最も死者数の多い攻撃となった。\nレバノン首相は、ナバティエ地区のアンサール郊外の家屋へのストライキで７人が死亡し、国営メディアの報道によると、その中には子供３人と女性２人が含まれていたと述べた。\nレバノン保健省によると、土曜遅くに別の空爆がデリ・アル・ザフラニの町を襲い、４人が死亡、５人が負傷した。\nイスラエル軍は、兵士に対する以前の行為と称する行為に対抗して「ヒズボラのテロインフラ」を攻撃したと発表した。\n当局によると、アンサールでのストライキは午前４時３０分（日本時間午後１時３０分）ごろ、避難民の家族が住んでいる場所で発生した。ソーシャルメディア上の映像には、サイレンが鳴り響く中、村の通りに大きな煙が立ち込める様子が映っている。\nレバノンのナワフ・サラーム首相は、殺害された民間人７人は「軍事インフラ」ではないと述べ、攻撃を非難した。\n「イスラエルはこのエスカレーションを止めなければならない」と彼は言った。 「なぜなら、我が国民の安全とその土地で生きる権利は交渉や交渉の対象ではないからです。」\nイスラエル国防軍（IDF）は、アンサール攻撃のきっかけとなった事件は、レバノン南東部の大部分と戦争で最も激戦となった陣地を見下ろす戦略的な高台であるアリ・アル・タヘル尾根で発生したと発表した。\nレバノン国営通信社（NNA）も尾根周辺での一連の攻撃を報じた。\nＮＮＡによると、国境近くのビント・ジュベイルでは数軒の家が破壊され、イスラエル軍は家に向けて重機関銃を発砲したという。\n3月2日、イラン系武装組織ヒズボラがイラン最高指導者を殺害した攻撃への報復としてイスラエルにロケット弾を発射し、レバノンはイスラエル、米国、イラン間の戦争に巻き込まれた。\nイスラエルはレバノン全土で爆撃作戦を開始し、同国の南部の大部分を侵攻することでこれに応じた。同軍はレバノン領土の約５％を占領し続けている。\n６月の停戦枠組みでは、ヒズボラの武装解除、イスラエル軍の南レバノンからの段階的撤退、レバノン軍の地域全域への展開が求められている。\nレバノンのジョセフ・アウン大統領は、アンサールで一家全員を殺害したイスラエルの空爆と枠組みへの「度重なる違反」を非難し、これは米国主導の交渉に「明確なメッセージ」を送ったと述べた。\nヒズボラは合意には関与しておらず、直接交渉を拒否している。\nイスラエル国防軍は、イスラエルが占領するレバノン南部の深さ10キロメートルの軍事緩衝地帯である安全地帯で活動するイスラエル国民と兵士に対する脅威を除去し続けると述べた。\n6月の合意を受けて戦闘は減少したにもかかわらず、レバノン南部でのイスラエルによる攻撃と破壊は続いている。\n金曜日、ヒズボラ指導者ナイム・カセムは枠組みの実施をめぐりレバノン当局を批判し、イスラエルによる攻撃が続く中レバノン軍に圧力をかけていると非難した。\n「レバノン軍を保護者として振る舞わず、砲撃やイスラエルの圧力にさらし続けているレバノン軍の屈辱をどうして受け入れることができるのか？」彼は言い​​ました。\nレバノンとイスラエルの交渉担当者は９月に第８回交渉に向けて会合する予定だが、最終日はまだ決まっていない。\n- 8 月 6 日発行",

}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
