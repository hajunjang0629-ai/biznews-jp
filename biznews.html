  {
    "id": "openai-says-it-cracked-90-year-old-maths-cf450d67",
    "title": "OpenAI says it cracked 90-year-old maths problem in 88 hours",
    "titleJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表",
    "summaryJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表- 公開されました",
    "bodyOriginal": "OpenAI says it cracked 90-year-old maths problem in 88 hours\n- Published\nOpenAI says it has found a solution to a decades-old advanced maths problem in a matter of hours using a new artificial intelligence (AI) model and thousands of AI bots.\nThe ChatGPT-maker said on Tuesday, external that by focusing a group of roughly 10,000 AI agents, or AI bots that undertake tasks somewhat autonomously, it solved a notoriously difficult maths problem in just 88 hours.\nThe problem was part of the Navier-Stokes equations, external, which concern how fluids move. For 90 years important aspects of the problems have lacked a proof, the argument underlying a correct math equation.\nOpenAI called the solution which it found a \"milestone\" and evidence that AI tools are improving quickly.\nOpenAI's solution has yet to be verified independently or publicly accepted by The Clay Mathematics Institute, a maths organization based in the US which runs the Millennium Prize that offers big money to the first to solve certain mathematical conundrums.\nThe company said that at the end of August, it started to train a new model that quickly showed that it was adept at maths. AI models are computer programs trained on huge amounts of data to recognize and predict patterns in information.\nWhile the new OpenAI model remains a tool only used within the company, as it is \"significantly more capable\" than the company's most recent AI model release, its researchers decided to use it on certain notable advanced maths problems.\nOpenAI admitted that last week on 1 September, it had \"heard rumors that two Millennium Prize problems had been resolved\" and so decided to put thousands of AI bots trained on the new internal model to work attempting to solve some of the remaining problems.\nBy Sept 5, or roughly 88 hours after it had set 10,000 AI bots to the task, OpenAI had found a solution to what's referred to as the Navier–Stokes existence and smoothness problem.\nThe problem is at the heart of turbulence, which is a phenomenon that is still not well understood.\nAlthough it took the AI bots seemingly little time to reach a solution, OpenAI said the bots exchanged nearly 3 million messages and used up 130 billion output tokens, or the individual lines of text and code an AI model produces in answers, on Navier–Stokes alone.\nSuch an effort would have cost roughly $10m (£7.3m), based on OpenAI's own pricing, external for output from its most advanced models.\nThe solution that OpenAI says it has now reached for the Navier–Stokes existence and smoothness problem resolved two out of the four statements in the proof that the Millennium Prize had demanded. The prize is worth $1m to a winner.\n\"Our goal in releasing this result is to report on the substantial progress of our AI models\", OpenAI said on Tuesday. \"We do not intend to claim the Millennium Prize for this result.\"\nAlready the company's claim is stirring some controversy.\nTristan Buckmaster, a mathematics professor at New York University, said on Tuesday, external that he and Levent Alpöge, a mathematician working for OpenAI rival Anthropic, had also been working toward solutions for the problem.\nThe duo had been using OpenAI's tool Codex in their work. But Buckmaster said that on 3 September, he found out that \"information about our progress had been passed to OpenAI.\"\nBuckmaster's statement came the same day, but hours before, OpenAI published its Navier–Stokes work. He claimed that OpenAI did not begin working on the Navier–Stokes equations until \"after information about our work had reached OpenAI.\" He included text from emails exchanged with OpenAI over the work and his questions of the company's timing and methods.\nBuckmaster added that he had not yet read OpenAI's full proof, but felt compelled to go public with \"what I was told, when, and what was proposed to me...because the alternative is to let a sequence of announcements say something I know to be false.\"\nOpenAI on Tuesday congratulated the \"concurrent work\" of Buckmaster and Alpöge, calling it \"remarkable.\"\nThe company said it had not seen \"any of their work through any means until they released it publicly\" and that no user data was accessed in its work on the Navier–Stokes problem.\n\"While unlikely, we cannot rule out that de-identified data derived from their usage of our products helped improve our models\", the company added. \"However, our proofs differ significantly and even the precise results proved are different.\"\nRelated topics\n- Published1 day ago\n- Published11 hours ago",
    "bodyJa": "OpenAI、90年前の数学の問題を88時間で解読したと発表\n- 公開されました\nOpenAIは、新しい人工知能（AI）モデルと数千のAIボットを使用して、数十年来の高度な数学の問題に対する解決策を見つけたと発表した。\nChatGPTの作成者は火曜日、社外向けに、約1万人のAIエージェント、つまりある程度自律的にタスクを実行するAIボットのグループを集中させることで、悪名高い難解な数学問題をわずか88時間で解決したと発表した。\nこの問題は、流体の動きに関する外部のナビエ・ストークス方程式の一部でした。 90 年間、問題の重要な側面には証明、つまり正しい数学方程式の基礎となる議論が欠けていました。\nOpenAIは、発見したソリューションを「マイルストーン」であり、AIツールが急速に改良されていることの証拠であると呼んだ。\nOpenAI のソリューションはまだ独立して検証されておらず、特定の数学的難題を最初に解決した者に多額の賞金を与えるミレニアム賞を運営する米国に本拠を置く数学団体であるクレイ数学研究所によって正式に承認されていません。\n同社は、8月末に新しいモデルのトレーニングを開始し、それが数学に熟達していることをすぐに示したと述べた。 AI モデルは、情報のパターンを認識して予測するために、膨大な量のデータに基づいてトレーニングされたコンピューター プログラムです。\n新しい OpenAI モデルは依然として社内でのみ使用されるツールですが、同社の最新の AI モデルリリースよりも「大幅に機能が向上」しているため、同社の研究者らは特定の注目すべき高度な数学問題にこれを使用することを決定しました。\nOpenAIは、先週9月1日に「ミレニアム賞の問題が2つ解決されたという噂を聞いた」ことを認め、そのため、新しい内部モデルで訓練された数千のAIボットを稼働させ、残りの問題のいくつかを解決しようと試みることを決定したと認めた。\n9 月 5 日までに、つまり 10,000 台の AI ボットをタスクに設定してから約 88 時間後、OpenAI は、ナビエ・ストークスの存在と滑らかさの問題と呼ばれるものに対する解決策を見つけました。\nこの問題は乱気流の中心にあり、まだよく理解されていない現象です。\nAI ボットが解決策に到達するまでにほとんど時間がかからなかったように見えましたが、OpenAI によると、ボットは 300 万近くのメッセージを交換し、Navier-Stokes だけで 1,300 億の出力トークン、つまり AI モデルが回答で生成するテキストとコードの個々の行を使い果たしました。\nこのような取り組みには、OpenAI 独自の価格設定に基づくと、最先端モデルからの外部出力に基づくと、およそ 1,000 万ドル (730 万ポンド) の費用がかかることになります。\nOpenAIによると、ナビエ・ストークスの存在と滑らかさの問題に関して現在到達した解決策は、ミレニアム賞が要求していた証明の4つの記述のうち2つを解決したという。優勝者には賞金 100 万ドルの価値があります。\nOpenAIは火曜日、「この結果を発表する目的は、AIモデルの大幅な進歩を報告することである」と述べた。 「この結果に対してミレニアム賞を請求するつもりはありません。」\n同社の主張はすでにいくつかの論争を巻き起こしている。\nニューヨーク大学の数学教授トリスタン・バックマスター氏は火曜日、自身とOpenAIのライバルであるアンスロピック社に勤める数学者のレベント・アルポージ氏もこの問題の解決に向けて取り組んでいると社外で語った。\n二人は仕事で OpenAI のツール Codex を使用していました。しかしバックマスター氏は、9月3日に「我々の進捗状況に関する情報がOpenAIに渡されていた」ことを知ったと述べた。\nバックマスター氏の声明は同日発表されたが、その数時間前にOpenAIはナビエ・ストークスの研究結果を公開した。同氏は、OpenAIは「私たちの研究に関する情報がOpenAIに届いた後」までナビエ・ストークス方程式の研究を開始しなかったと主張した。同氏は、この作業に関して OpenAI と交換した電子メールのテキストと、同社のタイミングや方法についての質問を含めた。\nバックマスター氏は、まだOpenAIの完全な証拠を読んでいないが、「私が言われたこと、いつ、そして私に提案されたことを公表せざるをえないと感じたと付け加えた。なぜなら、代わりの方法は、私が虚偽であるとわかっていることを一連の発表で言わせることだからだ」と付け加えた。\nOpenAIは火曜日、バックマスター氏とアルポージ氏の「同時業績」を「注目に値する」と称賛した。\n同社は、「公に発表するまで、いかなる手段を通じても彼らの研究内容を目にしたことはなく」、ナビエ・ストークス問題に関する研究においてユーザーデータへのアクセスは一切なかったと述べた。\n「可能性は低いですが、当社製品の使用から得られた匿名化されたデータが当社のモデルの改善に役立っていた可能性を排除することはできません」と同社は付け加えた。 「しかし、私たちの証明は大きく異なり、証明された正確な結果さえ異なります。」\n関連トピック\n- 1 日前に公開\n- 11 時間前に公開",

    "id": "trump-administration-expresses-profound-56c775a2",
    "title": "Trump administration expresses 'profound concern' over Ford's ties to China",
    "titleJa": "トランプ政権、フォードと中国の関係に「深い懸念」表明",
    "summaryJa": "フォードのジム・ファーリー最高経営責任者（CEO）に宛てた書簡の中で、米国運輸省長官ショーン・ダフィーは、中国企業を巻き込んだ自動車メーカーの戦略的軌道に疑問を呈した。",
    "bodyOriginal": "The Trump administration expressed \"profound concern\" Tuesday about Ford Motor's ties to Chinese companies that it believes could be detrimental to the Detroit carmaker and U.S. automotive industry.\nIn a letter addressed to Ford CEO Jim Farley, Transportation Secretary Sean Duffy questioned the automaker's strategic trajectory with Chinese companies \"as it pertains to American national automotive manufacturing integrity, supply chain exposure, and reliance on technologies of foreign adversaries.\"\nAs examples, Duffy cited Ford's ties to Chinese companies such as battery provider CATL and referenced a framework proposed during an auto show earlier this year in Detroit \"to facilitate Chinese joint ventures on United States soil.\"\nFord has a licensing agreement to utilize battery technologies, including the production of lithium iron phosphate batteries, from Contemporary Amperex Technology Co., or CATL.\nFord's deal with CATL was originally announced in 2023 but has drawn renewed attention amid tensions between the U.S. and China as well as Ford's plan to use the battery technologies for energy storage systems.\n\"While DOT recognizes the intense competitive pressures of the global market, the Company's recent strategic decisions paint a troubling picture of a foundational American brand actively intertwining its future with Chinese state-backed enterprises,\" Duffy's letter read.\nFord, which regularly touts its position as the top-producing automaker in the U.S., did not immediately respond to a request for comment.\nDuffy urged Farley, who has been complimentary of Chinese competitors as well as the Trump administration's attempt to promote U.S. manufacturing, to \"reflect on these concerns and national necessities and adopt reasonable strategies that prioritize American workers, utilize allied supply chains, and promote the self-reliance and integrity of the domestic automotive industry.\"\n— CNBC's Meghan Reeder and Phil LeBeau contributed to this report.",
    "bodyJa": "トランプ政権は火曜日、フォード・モーターと中国企業との関係について「深い懸念」を表明し、デトロイトの自動車メーカーと米国の自動車産業に悪影響を及ぼす可能性があると考えている。\nショーン・ダフィー運輸長官は、フォードのジム・ファーリー最高経営責任者（CEO）に宛てた書簡の中で、「米国国家の自動車製造の誠実さ、サプライチェーンのエクスポージャ、外国敵の技術への依存に関わるものであるため」、フォードの中国企業との戦略的軌道に疑問を呈した。\nダフィー氏は例として、フォードと電池供給会社CATLなどの中国企業との関係を挙げ、「米国本土での中国の合弁事業を促進するため」今年初めにデトロイトで開催された自動車ショーで提案された枠組みに言及した。\nフォードは、コンテンポラリー・アンペレックス・テクノロジー社（CATL）から、リン酸鉄リチウム電池の製造を含む電池技術を利用するライセンス契約を結んでいる。\nフォードとCATLとの契約は当初2023年に発表されたが、米国と中国の緊張やエネルギー貯蔵システムに電池技術を利用するというフォードの計画の中で再び注目を集めている。\nダフィー氏の書簡には「DOTは世界市場の激しい競争圧力を認識しているが、同社の最近の戦略的決定は、米国の基礎ブランドが自社の将来を中国政府支援の企業と積極的に結びつけるという憂慮すべき状況を浮き彫りにしている」と述べた。\nフォードは定期的に米国生産トップの自動車メーカーとしての地位を宣伝しているが、コメント要請には応じていない。\nダフィー氏は、中国の競合他社や米国の製造業を促進するトランプ政権の試みを称賛してきたファーリー氏に対し、「こうした懸念と国家的必要性を熟考し、米国の労働者を優先し、同盟国のサプライチェーンを活用し、国内自動車産業の自立と誠実性を促進する合理的な戦略を採用する」よう強く求めた。\n— CNBC の Meghan Reeder と Phil LeBeau がこのレポートに貢献しました。",

    "id": "this-alternative-energy-stock-is-more-po-22e4757f",
    "title": "This alternative energy stock is more popular than SpaceX in the options pits. Here's why",
    "titleJa": "この代替エネルギー株は、オプションピットではスペースXよりも人気がある。その理由は次のとおりです",
    "summaryJa": "同グループの年初来の上昇率が40％を超える中、原油価格は90ドルを超え、S&P500指数のエネルギー株は52週間ぶりの高値に近づいている。エネルギー株は2026年にS&P500の中で最もパフォーマンスの高いセクターの座を維持しているにもかかわらず、オプショントレーダーは従来型エネルギー資産の強さが今後も続くことに納得していないようだ。その代わりに、データセンターや人工知能の産業化に関連したオンサイト燃料電池システムを販売する、時価総額820億ドルの電力会社ブルーム・エナジーに彼らは殺到している。",
    "bodyOriginal": "Crude oil is back above $90 and energy stocks in the S&P 500 index are approaching fresh 52-week highs as the group's year-to-date rally surpasses 40%.\nDespite energy stocks holding the title as the best-performing sector in the S&P 500 in 2026, options traders seem unconvinced the strength in conventional energy assets will continue. Instead, they're piling into Bloom Energy, the $82-billion market-cap power provider that sells onsite fuel-cell systems linked to data centers and artificial intelligence industrialization.\nBloom is up 1,800% over the past three years. Shares jumped more than 10% Tuesday as options trading on the stock surged to over 2.5 times the 30-day average for a total premium exchange of almost half a billion dollars by midday, according to data from Cboe LiveVol and SpotGamma. That's more than the $350 million traded in SpaceX options and dwarfs the $25 million traded in Valero Energy, the most volatile S&P 500 energy stock.\nShares of Bloom are up more than 30% in the past week, and they have surged almost 70% since the company reported earnings in late July. The company will join the S&P 500 on Sept. 21, S&P Dow Jones Indices announced at the end of last week.\nThe inclusion will mark the first time an energy stock has been added to the index since 2022, according to UBS analyst Manav Gupta. From an options standpoint, Bloom will stand out among S&P energy stocks in a big way.\nImplied volatility in Bloom is currently over 90%, according to ThinkOrSwim, notably higher than any S&P 500 energy stocks. In that group, Valero has the highest volatility at 50%, compared to ExxonMobil's 30% reading. The most popular contract in Bloom by volume Tuesday was the 300-strike call expiring Friday, a $4.65 trade that needs the stock to add another 8% to break even.\nBy contrast, options flows around the U.S. Oil Fund (USO) and the State Street Energy Select Sector SPDR ETF (XLE) were mixed. Trading volume was 50% above the 30-day average in USO, which traded around $90 million. Almost the exact same number of put contracts were likely bought as calls, and the three most popular contracts by volume were puts, according to SpotGamma data.\nIn XLE, 48,000 calls were likely bought, compared to 34,000 puts, with $31 million of the total $37 million in premium tied to calls. Among the top five contracts traded in XLE, three were puts, according to SpotGamma.",
    "bodyJa": "同グループの年初来の上昇率が40％を超える中、原油価格は90ドルを超え、S&P500指数のエネルギー株は52週間ぶりの高値に近づいている。\nエネルギー株は2026年にS&P500の中で最もパフォーマンスの高いセクターの座を維持しているにもかかわらず、オプショントレーダーは従来型エネルギー資産の強さが今後も続くことに納得していないようだ。その代わりに、データセンターや人工知能の産業化に関連したオンサイト燃料電池システムを販売する、時価総額820億ドルの電力会社ブルーム・エナジーに彼らは殺到している。\nブルームは過去 3 年間で 1,800% 増加しました。 Cboe LiveVolとSpotGammaのデータによると、株式のオプション取引が正午までにプレミアム交換総額約5億ドルの30日間平均の2.5倍以上に急増したため、火曜日の株価は10％以上上昇した。これはスペースXオプションの取引額3億5000万ドルを上回り、S&P500種エネルギー株の中でも最も値動きが激しいバレロ・エナジーの取引額2500万ドルに比べれば小さい。\nブルームの株価は過去1週間で30％以上上昇し、同社が7月下旬に決算を発表して以来、70％近く急騰した。 S&Pダウ・ジョーンズ・インデックスは先週末、同社が9月21日にS&P500に加わると発表した。\nUBSのアナリスト、マナブ・グプタ氏によると、今回の組み入れは2022年以来初めてエネルギー株が指数に追加されることになる。オプションの観点から見ると、ブルームはS&Pエネルギー株の中で大きく目立つことになるだろう。\nThinkOrSwimによると、ブルームのインプライド・ボラティリティは現在90％を超えており、S&P 500のエネルギー株よりも顕著に高い。このグループでは、エクソンモービルの30％と比較して、バレロのボラティリティが50％と最も高い。火曜日の出来高ベースでブルームで最も人気のある契約は、金曜日に期限が切れる300ストライクコールで、損益分岐点までに株価にさらに8％を追加する必要がある4.65ドルの取引だった。\n対照的に、米国石油基金（USO）とステート・ストリート・エネルギー・セレクト・セクターSPDR ETF（XLE）を巡るオプションの流れはまちまちだった。出来高はUSOの30日間平均を50％上回り、約9000万ドルで取引された。 SpotGamma のデータによると、ほぼ同じ数のプット契約がコールとして購入された可能性が高く、出来高で最も人気のある 3 つの契約はプットでした。\nXLE では、プット 34,000 件に対してコールが 48,000 件買われた可能性が高く、プレミアム総額 3,700 万ドルのうち 3,100 万ドルがコールに関連していました。 SpotGamma によると、XLE で取引された上位 5 件の契約のうち、3 件はプットでした。",

    "id": "u-s-downplays-iran-s-seizure-of-unmanned-86a96474",
    "title": "U.S. downplays Iran's seizure of unmanned sub in Hormuz Strait",
    "titleJa": "米国、イランによるホルムズ海峡での無人潜水艦拿捕を軽視",
    "summaryJa": "米軍は火曜日、イランがホルムズ海峡で拿捕したとされる無人潜水艦は「欠陥品」であり、機密データや機密機器は積まれていないと発表した。「米軍が運用する水中無人機が1日以上前に故障した」と米海軍大佐ティム・ホーキンスは米中央軍と共有した声明の中でCNBCに語った。",
    "bodyOriginal": "The U.S. military on Tuesday said an unmanned submersible that Iran reportedly seized in the Strait of Hormuz was \"defective\" and carried no sensitive data or classified equipment.\n\"An underwater drone operated by U.S. forces malfunctioned more than a day ago,\" U.S. Navy Captain Tim Hawkins told CNBC in a statement shared by U.S. Central Command.\nThe drone \"was surveying regional waters in support of ongoing operations,\" Hawkins said, adding, \"U.S. operations in area waters continue.\"\nIran's Revolutionary Guard had boasted earlier Tuesday that it trapped and captured \"one of the most modern, intelligent, unmanned submarines of the American terrorist army at the entrance to the Strait of Hormuz,\" according to a translated post from Iranian state news outlet Fars.\nFars later posted videos and images purporting to show the vessel out of the water.\nBut Hawkins' statement insisted that the drone was hardly a crucial piece of cutting-edge military tech.\n\"The defective drone was an older model that neither collected sensitive data nor carried any classified sonar or radar equipment,\" the captain's statement said.\nIranian media outlets described the sub as a Dive-LD, an autonomous undersea vehicle developed by U.S. defense contractor Anduril. They cost $2.5 million each, DefenseScoop reported in 2024.\nThe development came three days after the U.S. and Iran traded new attacks in the Persian Gulf, rekindling kinetic hostilities in the region even as the Trump administration shifts its strategy toward defeating Tehran economically.\nCentcom said it struck three Iranian crude oil carriers in retaliation for the IRGC firing ballistic missiles at two Navy warships.\nThe U.S. military later struck targets near the oil-export hub Kharg Island, including Iranian oil tankers, Fox News reported Tuesday, citing unnamed senior U.S. officials. Centcom did not immediately respond to CNBC's request for comment on the report.\nThe spotlight on the watercraft offers the latest example of the U.S. military's increasing dependence on autonomous tech to fight the war in the Middle East.\nThis summer, unmanned boat startup Saronic used one of its drone vessels to rescue crew from a helicopter downed in the Hormuz Strait. Saronic's boats were later used in a strike on an Iranian submarine and ship facility.\n— CNBC's Samantha Subin contributed to this report.",
    "bodyJa": "米軍は火曜日、イランがホルムズ海峡で拿捕したとされる無人潜水艦は「欠陥品」であり、機密データや機密機器は積まれていないと発表した。\n「米軍が運用する水中無人機が1日以上前に故障した」と米海軍大佐ティム・ホーキンスは米中央軍と共有した声明の中でCNBCに語った。\nホーキンス氏は、無人機は「進行中の作戦を支援するために地域海域を調査していた」と述べ、「地域海域での米国の作戦は継続している」と付け加えた。\nイラン国営通信社ファルス紙の翻訳記事によると、イラン革命防衛隊は火曜日初め、「ホルムズ海峡入口で米国テロ軍の最も近代的で知能の高い無人潜水艦の一隻」を罠にはめて拿捕したと自慢していた。\nファールス氏はその後、船が水面から出ているところを見せたと称する動画や画像を投稿した。\nしかしホーキンスの声明は、ドローンは最先端の軍事技術の重要な部分ではないと主張した。\n機長の声明によると、「欠陥のあるドローンは古いモデルで、機密データを収集しておらず、機密のソナーやレーダー機器も搭載していなかった」と述べた。\nイランのメディアは、この潜水艦を米国の防衛請負業者アンドゥリルが開発した自律型海中車両であるダイブLDであると説明した。ディフェンススクープは2024年に、それぞれの価格が250万ドルであると報じた。\nこの事態は、米国とイランがペルシャ湾で新たな攻撃を交わしてから3日後に起こり、トランプ政権がイランを経済的に打倒する方向に戦略を転換しているにもかかわらず、この地域での激しい敵対関係が再燃した。\nセントコムは、イラン革命防衛隊が海軍軍艦２隻に弾道ミサイルを発射したことへの報復として、イランの原油運搬船３隻を攻撃したと発表した。\nフォックスニュースが火曜日、匿名の米高官の話として報じたところによると、米軍はその後、石油輸出拠点であるハルグ島付近の標的を攻撃し、その中にはイランの石油タンカーも含まれていた。セントコムはこの報道に関するCNBCのコメント要請にすぐには応じなかった。\nこの水上バイクへのスポットライトは、中東での戦争を戦うために米軍が自動運転技術への依存を高めていることの最新の例を示している。\nこの夏、無人ボートの新興企業サロニックは、ホルムズ海峡で墜落したヘリコプターから乗組員を救出するために自社のドローン船の1つを使用した。サロニッチのボートは後にイランの潜水艦と船舶施設への攻撃に使用された。\n— CNBC のサマンサ・スビンがこのレポートに寄稿しました。",

    "titleJa": "ニューハンプシャー州、上院の主要議席確保のため予備選挙に向かう",
    "summaryJa": "ニューハンプシャー州の有権者は、引退する民主党上院議員ジーン・シャヒーン氏の後任となる重要な米上院選挙の候補者を指名するため、火曜日に投票所に向かう。民主党も共和党も次期議会で上院の多数派を掌握し議席獲得を目指している。資金集めレースをリードし、2019年から同州第1下院選挙区の代表を務めているクリス・パパス下院議員は、民主党の指名獲得の最有力候補となっている。彼は、最近の世論調査でパパスにわずかに迫っている科学者で民主社会主義者のカリシュマ・マンズールからの挑戦に直面している。",
    "bodyOriginal": "New Hampshire voters head to the polls Tuesday to nominate candidates for a key U.S. Senate race to replace the retiring Democratic Sen. Jeanne Shaheen. Both Democrats and Republicans are aiming to win the seat in their quest to control the Senate in the next Congress.\nRep. Chris Pappas, who leads the fundraising race and has represented the state's 1st Congressional District since 2019, is the favorite to secure the Democratic nomination. He faces a challenge from scientist and democratic socialist Karishma Manzur, who has closed in slightly on Pappas in recent public polls.\nOn the Republican side, former U.S. Sen. John Sununu, of New Hampshire, is the favorite to secure the nomination over former U.S. Sen. Scott Brown, of Massachusetts. Shaheen defeated both Sununu and Brown in different years, but Sununu — whose brother Chris Sununu was a highly popular governor of the Granite State until 2025 — is seen as a formidable candidate in what is shaping up to be a tough election cycle for Republicans as the Iran war drags on and President Donald Trump's popularity slumps.\nThe New Hampshire Senate race is critical to both parties ahead of November's midterm election. Democratic hopes of flipping the Senate would dim if the party can't hold on to Shaheen's seat, as it needs to net four additional seats to flip the upper chamber. If Republicans flip the seat, it would provide a cushion for the GOP to hold on to its Senate majority by requiring Democrats to flip an additional seat.\nThe midterms will determine who controls Congress — and subpoena power — during the last two years of Trump's term. If Democrats flip one or both chambers, they are widely expected to launch sweeping investigations of the Trump administration that are likely to rope in companies that have done business with the administration.\nPappas, who has been endorsed by Shaheen and other top Democrats, such as U.S. Sen. Elizabeth Warren, of Massachusetts, has made anti-corruption efforts a top issue in his campaign. Pappas has largely legislated as a moderate and is a member of the bipartisan Problem Solvers Caucus.\nManzur is running on a platform similar to other democratic socialist candidates who have surged in Democratic primaries across the country, calling for universal healthcare and opposing aid to Israel. She is a scientist by trade, with a Ph.D. in biochemistry and molecular biology.\nPappas has held a lead in the race, but a recent poll from the University of New Hampshire found Manzur had narrowed his lead and was 13 percentage points behind the front-runner.\nSununu, meanwhile, has campaigned as a moderate Republican willing to work across the aisle. Trump has endorsed Sununu in the race, saying \"he will work tirelessly to advance our America First Agenda.\" But Sununu himself has kept Trump at arm's length in advertising, with the president's approval underwater in the Granite State.\nBrown, meanwhile, has targeted \"D.C. special interests\" in advertising, casting himself as an independent. He has trailed heavily behind Sununu in public polling. After he left the Senate, Brown was the U.S. ambassador to New Zealand and Samoa during Trump's first term.",
    "bodyJa": "ニューハンプシャー州の有権者は、引退する民主党上院議員ジーン・シャヒーン氏の後任となる重要な米上院選挙の候補者を指名するため、火曜日に投票所に向かう。民主党も共和党も次期議会で上院の多数派を掌握し議席獲得を目指している。\n資金集めレースをリードし、2019年から同州第1下院選挙区の代表を務めているクリス・パパス下院議員は、民主党の指名獲得の最有力候補となっている。彼は、最近の世論調査でパパスにわずかに迫っている科学者で民主社会主義者のカリシュマ・マンズールからの挑戦に直面している。\n共和党側では、ジョン・スヌヌ元上院議員（ニューハンプシャー州）が、スコット・ブラウン元上院議員（マサチューセッツ州）よりも指名獲得の最有力候補となっている。シャヒーン氏は別の年にスヌヌ氏と​​ブラウン氏の両氏を破ったが、スヌヌ氏（弟のクリス・スヌヌ氏は2025年まで花崗岩州知事で人気が高かった）は、イラン戦争が長引き、ドナルド・トランプ大統領の人気が低迷する中、共和党にとって厳しい選挙サイクルとなりつつある中、手ごわい候補とみなされている。\nニューハンプシャー州上院選挙は、11月の中間選挙に向けて両党にとって極めて重要だ。民主党が上院をひっくり返すにはさらに4議席を獲得する必要があるため、同党がシャヒーン氏の議席を維持できなければ、上院をひっくり返すという期待は薄れるだろう。共和党が議席を入れ替えれば、民主党に追加の議席を入れ替えることを要求することで、共和党が上院過半数を維持するクッションとなる。\n中間選挙では、トランプ大統領の任期最後の2年間、誰が議会と召喚状の権限を掌握するかが決定される。民主党が一方または両方の議院をひっくり返した場合、トランプ政権に対する徹底的な調査を開始すると広く予想されており、これにより政権と取引のある企業が取り込まれる可能性が高い。\nパパス氏はシャヒーン氏のほか、エリザベス・ウォーレン上院議員（マサチューセッツ州）など他の民主党幹部らの支持を受けており、汚職撲滅の取り組みを選挙キャンペーンの最重要課題に据えている。パパス氏は主に穏健派として立法を行っており、超党派の問題解決者議員団のメンバーでもある。\nマンズール氏は全国の民主党予備選で躍進した他の民主社会主義者候補者と同様の綱領で出馬しており、国民皆保険やイスラエルへの援助反対を訴えている。彼女は本業の科学者であり、博士号を取得しています。生化学と分子生物学の分野。\nパパス氏はこのレースでリードを保ってきたが、ニューハンプシャー大学の最近の世論調査では、マンズール氏がリードを縮め、トップランナーとは13ポイントの差をつけられていることが判明した。\n一方、スヌヌ氏は通路を越えて協力する意欲のある穏健派共和党員として選挙運動を行ってきた。トランプ大統領は選挙戦でスヌヌ氏を支持し、「彼は米国第一の課題を推進するためにたゆまぬ努力をするだろう」と述べた。しかし、スヌヌ氏自身は、花崗岩州で大統領の承認が水面下で行われているため、広告宣伝においてトランプ氏を腕を伸ばして接し続けている。\n一方、ブラウン氏は広告業界で「ワシントンD.C.の特別利益」をターゲットにしており、自らを無所属の立場に置いている。同氏は世論調査でスヌヌ氏に大きく後れをとっている。ブラウン氏は上院議員を去った後、トランプ大統領の１期目に駐ニュージーランドおよびサモア米国大使を務めた。",

    "bodyOriginal": "Sapporo to move some beer production from Canada to US after tariffs\n- Published\nJapanese brewer Sapporo says it will move some beer production from Canada to the US after new tariffs on Canadian beer took effect on Tuesday.\nThe move follows the introduction of a 50% tariff on beer imported from Canada. For companies shipping beer across the border, that means significantly higher costs.\nChief strategy officer Rieko Shofu described tariffs as \"something out of our control,\" telling Bloomberg that the beer giant would \"move ahead with local production.\"\nSapporo did not immediately respond to the BBC's request for comment. The company plans to shift production of its non-alcoholic beer, currently made in Canada for US customers, to the US by the first half of 2027.\nThe US is one of Sapporo's most important overseas markets, and any shift south of the border will directly affect operations at its Canadian subsidiary, Sleeman Breweries.\nTo mitigate rising costs, the Japanese brewer is considering adding production capacity on the US West Coast. Options include building or buying a brewery, or partnering with a third-party manufacturer.\nSapporo has been building its presence in the US for years and says its flagship Sapporo brand is the country's best-selling Asian beer brand.\nThe company is also investing heavily outside Japan where a shrinking population has weighed on alcohol sales.\nSapporo plans to invest up to ¥400bn ($2.6bn) by 2030 as it seeks to expand overseas and boost profits. Around 30% of the capital is earmarked for overseas markets.\nThe brewer is also looking beyond North America. In July, it announced a partnership with Danish brewer Carlsberg to expand in Southeast Asia.\nSapporo's decision to move production comes as companies adapt to a growing number of tariffs worldwide.\nIn July, the US announced new tariffs on dozens of trading partners, including Canada, raising costs for businesses that rely on cross-border supply chains.\nThe move highlights how some companies are reconsidering where they make goods as trade barriers increase the cost of serving customers from overseas.\nRelated topics\n- Published6 hours ago\n- Published24 July\n- Published8 hours ago",
    "bodyJa": "サッポロビール、関税解除を受けてビール生産の一部をカナダから米国に移管へ\n- 公開されました\n日本のビール会社サッポロは、カナダ産ビールに対する新たな関税が火曜日に発効したことを受け、ビール生産の一部をカナダから米国に移管すると発表した。\nこの措置は、カナダから輸入されるビールに50％の関税が導入されたことを受けたものである。国境を越えてビールを輸送する企業にとって、これはコストの大幅な増加を意味する。\n首席戦略責任者、正府理恵子氏は関税について「我々のコントロールの及ばないもの」と述べ、ビール大手は「現地生産を進める」とブルームバーグに語った。\n札幌はBBCのコメント要請にすぐには応じなかった。同社は現在米国顧客向けにカナダで製造しているノンアルコールビールの生産を、2027年上半期までに米国に移管する計画だ。\n米国はサッポロにとって最も重要な海外市場の一つであり、国境以南への移動はカナダ子会社スリーマン・ブルワリーズの経営に直接影響する。\nコスト上昇を緩和するために、日本のビール会社は米国西海岸での生産能力の追加を検討している。選択肢としては、醸造所の建設や購入、あるいはサードパーティメーカーとの提携などが挙げられます。\nサッポロは長年にわたって米国での存在感を高めており、同社の主力ブランドであるサッポロは米国で最も売れているアジアのビールブランドであるとしている。\n同社は人口減少がアルコールの売り上げに重しとなっている日本国外でも多額の投資を行っている。\nサッポロは海外展開と利益拡大を目指し、２０３０年までに最大４０００億円（２６億ドル）を投資する計画だ。資本金の約30％は海外市場に充てられます。\n醸造家は北米以外にも目を向けています。 7月には、東南アジアでの事業拡大を目的としたデンマークのビール会社カールスバーグとの提携を発表した。\nサッポロの生産移転の決定は、企業が世界中で増加する関税に適応する中で行われた。\n米国は7月、カナダを含む数十の貿易相手国に対する新たな関税を発表し、国境を越えたサプライチェーンに依存する企業のコストが上昇した。\nこの動きは、貿易障壁が海外からの顧客へのサービスコストを増大させる中、一部の企業が製品の製造場所をどのように再考しているかを浮き彫りにしている。\n関連トピック\n- 6 時間前に公開\n- 7 月 24 日発行\n- 8 時間前に公開",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>

    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

  const container = document.getElementById("articles-container");

  const filtered = getArticlesByCategory(activeCategory);

    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
