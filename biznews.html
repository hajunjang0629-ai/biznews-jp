    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Tesla is voluntarily recalling about 3 million vehicles in China to address two separate safety issues, the latest setback for the company as it tries to remain a major player in the world's largest auto market.\nOne recall involves Tesla's doorhandles, which are electronically operated and retractable, and the other is tied to the company's driver \"attention monitoring\" systems, according to notices published on Friday by Tesla and China's product safety regulator.\nTesla said in a doorhandle recall notice that severe collisions can cause the \"vehicle's low-voltage system to fail,\" and that resulting doorhandle problems \"could hinder occupants from quickly opening the doors to escape and impede rescue efforts by those outside the vehicle, posing a safety hazard.\"\nThe company said it plans to \"affix warning labels\" to recalled vehicles, and will upgrade its \"window control software\" with an over-the-air update so that windows automatically lower after an accident is detected. Model 3, Model Y, Model S and Model X vehicles, including some imports and those made in China between March 4, 2019, and April 29, 2026, are subject to the recall.\nThe Model Y is one of the best-selling vehicles in China, but Tesla faces intensifying pressure there from local competitors, including BYD and Xiaomi, that are are making more affordable and innovative electric cars. According to China Passenger Car Association data, Tesla delivered 25,158 Model Y units in China in July, down 18% from 30,766 a year earlier.\nThe flush doorhandles that Tesla popularized are featured on cars made by Tesla competitors like Xiaomi, Geely and others that also issued recalls in China on Friday. Deaths apparently caused by malfunctioning or inaccessible doorhandles, have led to regulatory changes in China, prompting the widespread recalls involving nine automakers.\nRegulatory changes are also being considered in the U.S. The National Highway Traffic Safety Administration said in July that it would begin the process to establish a new federal rule to \"mandate a robust and obvious door egress system in all motor vehicles,\" according a regulatory filing.\nTesla's other recall on Friday is to address deficiencies in some of its vehicles' driver monitoring systems, which are meant to ensure drivers stay attentive and ready to take over steering and braking at any time while using partially automated driving features like autosteer.\nIn a recall notice, Tesla said it would provide customers with free over-the-air software updates, and add \"in-cabin camera monitoring\" alongside its steering-wheel based torque sensors to prompt drivers to stay more engaged, and take over steering and braking when needed.\nFor vehicles that can't be upgraded via over-the-air software updates, Tesla's recall notice said its service centers will \"contact relevant users\" to book repairs.\nThe second recall applies to China-made Model 3 and Model Y vehicles manufactured between March 4, 2019, and December 7, 2025.\nTesla didn't respond to a request for comment.",

    "id": "supreme-court-allows-trump-to-continue-w-265b6c79",
    "title": "Supreme Court allows Trump to continue White House ballroom construction for now",
    "titleJa": "最高裁判所、トランプ大統領がホワイトハウスの宴会場の建設を当面継続することを許可",
    "summaryJa": "最高裁判所は金曜日、ドナルド・トランプ大統領に対し、物議を醸しているホワイトハウスの宴会場プロジェクトの建設継続を今のところ許可した。ジョン・ロバーツ首席判事は、ボールルーム計画に異議を唱える訴訟が展開されている間、トランプ大統領が建設を継続することを禁じた連邦地方裁判所判事の差し止め命令を差し止めた。",
    "bodyOriginal": "The Supreme Court on Friday allowed President Donald Trump, for now, to continue construction on his controversial White House ballroom project.\nChief Justice John Roberts, in an order, stayed a federal district court judge's injunction, which had barred Trump from continuing construction while a lawsuit challenging the ballroom project played out.\nRoberts' order came on the same day the injunction was scheduled to take effect.\nThe order is an administrative stay, which could be lifted by the entire Supreme Court.\nTrump in 2025 had the White House's East Wing demolished, without notifying Congress, to make way for the planned, 90,000 square-foot ballroom.\nThe National Trust for Historic Preservation is suing Trump to block the project on the grounds that Trump did not obtain required authorization or reviews for it.",
    "bodyJa": "最高裁判所は金曜日、ドナルド・トランプ大統領に対し、物議を醸しているホワイトハウスの宴会場プロジェクトの建設継続を今のところ許可した。\nジョン・ロバーツ首席判事は、ボールルーム計画に異議を唱える訴訟が展開されている間、トランプ大統領が建設を継続することを禁じた連邦地方裁判所判事の差し止め命令を差し止めた。\nロバーツ氏の命令は、差し止め命令の発効が予定されていた同日に出された。\nこの命令は行政上の停止命令であり、最高裁判所全体によって解除される可能性がある。\nトランプ大統領は2025年、計画されていた9万平方フィートの宴会場に道を譲るため、議会に通知することなくホワイトハウスの東棟を取り壊させた。\n歴史保存ナショナル・トラストは、トランプ大統領がプロジェクトに必要な許可や審査を取得していないことを理由に、プロジェクトの差し止めを求めてトランプ氏を訴えている。",

    "id": "as-gop-warns-data-centers-put-ohio-senat-b28b5253",
    "title": "As GOP warns data centers put Ohio Senate seat at risk, Husted defends energy policy",
    "titleJa": "共和党がデータセンターがオハイオ州上院議席を危うくすると警告する中、ハステッド氏はエネルギー政策を擁護",
    "summaryJa": "ジョン・ハステッド上院議員（共和党、オハイオ州）は金曜日、データセンターをめぐる反発で同氏の議席が危うくなる可能性があると共和党が警告する中、J・D・バンス副大統領とともにオハイオ州南西部製鉄所に姿を現し、ドナルド・トランプ大統領のエネルギーと経済政策を擁護した。ハステッド氏のコメントは、全米共和党上院委員会（NRSC）がメモで、データセンターが光熱費に与える影響を米国人がますます懸念する中、この選挙サイクルではデータセンターが「深刻な問題」になっていると警告した数日後に出た。",
    "bodyOriginal": "Sen. Jon Husted, R-Ohio, defended President Donald Trump's energy and economic agenda on Friday during an appearance at a southwestern Ohio steel mill with Vice President JD Vance, as Republicans warn that backlash over data centers could be putting his seat in jeopardy.\nHusted's comments come days after the National Republican Senatorial Committee, or NRSC, warned in a memo that data centers have become a \"sleeper issue\" this election cycle, as Americans increasingly worry about the impact they could have on their utility costs.\nOhio is home to several large data center projects, including a proposed 10-gigawatt campus in Pike County that could cost more than $500 billion.\nBut higher electricity costs, Husted said, are the result of Democratic policies, not data center construction.\n\"You want to have lower electricity prices — I want to tell you why they're rising. Because Congress and, under the Obama administration, under the Biden administration, they closed 23 power plants in the state of Ohio, representing half the electricity we use on a daily basis,\" Husted said at the Cleveland-Cliffs steel plant, in Middletown, Ohio. \"Radical climate policies did that.\"\nHusted and Vance were joined by other GOP candidates, including Vivek Ramaswamy, the Republican candidate for Ohio governor who is locked in a close race with Democrat Amy Acton.\nAccording to recent polling, Husted is narrowly trailing former Democratic Sen. Sherrod Brown in his bid for reelection.\nHusted's seat is seen as crucial for Republicans if they want to retain their majority in the Senate in the next Congress. The GOP is widely favored to keep the Senate, though Trump's falling approval ratings, rising inflation, the ongoing Iran war and growing data center anxieties are causing concerns within the party.\n\"If voters' perceptions of data centers are not fixed quickly, the campaign against them will expand far beyond Ohio,\" the NRSC wrote in the Tuesday memo, which was obtained by CNBC and first reported by Axios.\nHusted, meanwhile, touted the Trump administration's investment in manufacturing in Ohio, including a $500 million Department of Energy grant to Cleveland-Cliffs, which was initially awarded by the Biden administration to finance a hydrogen-powered furnace at the Middletown facility, but now will be used for other upgrades, including to its blast furnace and artificial intelligence technologies.\nCleveland-Cliffs said in a statement it will match the DOE's funding, for a total $1 billion investment in the facility. The company said the project would employ more than 1,500 workers during construction.\n\"We can bring back manufacturing to this great country, in places like Middletown and across our great state,\" Husted said. \"And why is it important that we do this? Investments like this, a billion-dollar investment right here? Because it's job security, it's economic security, it's national security.\"",
    "bodyJa": "ジョン・ハステッド上院議員（共和党、オハイオ州）は金曜日、データセンターをめぐる反発で同氏の議席が危うくなる可能性があると共和党が警告する中、J・D・バンス副大統領とともにオハイオ州南西部製鉄所に姿を現し、ドナルド・トランプ大統領のエネルギーと経済政策を擁護した。\nハステッド氏のコメントは、全米共和党上院委員会（NRSC）がメモで、データセンターが光熱費に与える影響を米国人がますます懸念する中、この選挙サイクルではデータセンターが「深刻な問題」になっていると警告した数日後に出た。\nオハイオ州には、パイク郡に計画されている 10 ギガワットのキャンパスを含め、5,000 億ドル以上かかる可能性がある大規模なデータセンター プロジェクトがいくつかあります。\nしかし、電力コストの上昇はデータセンター建設の結果ではなく、民主党の政策の結果であるとハステッド氏は述べた。\nオハイオ州ミドルタウンのクリーブランド・クリフス製鉄所でハステッド氏は、「皆さんは電気料金を下げたいと思っているが、なぜ値上がりしているのかを教えてほしい。なぜなら議会、そしてオバマ政権下、バイデン政権下でオハイオ州内の23の発電所を閉鎖したからだ。これは私たちが日常的に使用する電力の半分に相当する」と述べた。 「急進的な気候政策がそれを実現したのです。」\nハステッド氏とバンス氏には、民主党のエイミー・アクトン氏と接戦となっているオハイオ州知事の共和党候補ヴィベク・ラマスワミ氏を含む他の共和党候補者も加わった。\n最近の世論調査によると、ハステッド氏は再選を目指して元民主党上院議員シェロッド・ブラウン氏を僅差で追いかけている。\n共和党が次期議会で上院の過半数を維持したい場合、ハステッド氏の議席は極めて重要とみられている。共和党は上院維持に広く支持されているが、トランプ大統領の支持率低下、インフレ上昇、進行中のイラン戦争、データセンターへの不安の増大が党内に懸念を引き起こしている。\nCNBCが入手し、アクシオスが最初に報じた火曜日のメモの中でNRSCは、「データセンターに対する有権者の認識がすぐに修正されなければ、データセンターに対する反対運動はオハイオ州をはるかに超えて拡大するだろう」と書いている。\n一方、ハステッド氏は、クリーブランド・クリフスへのエネルギー省補助金5億ドルを含む、トランプ政権のオハイオ州製造業への投資を宣伝した。この補助金は当初、ミドルタウン施設の水素燃料炉の資金調達としてバイデン政権から与えられたものだが、現在は高炉や人工知能技術など他の改修に使われる予定だ。\nクリーブランド・クリフスは声明で、施設への投資総額はDOEの資金と同額の10億ドルになると述べた。同社は、このプロジェクトでは建設中に1,500人以上の労働者を雇用すると発表した。\n「ミドルタウンのような場所や偉大な州全域で、この偉大な国に製造業を取り戻すことができる」とハステッド氏は語った。 「そして、なぜ私たちがこれを行うことが重要なのでしょうか？このような投資、ここへの数十億ドルの投資？なぜなら、それは雇用の安全であり、経済の安全であり、国家の安全だからです。」",

    "title": "Ken Griffin says Citadel unwound more than 80% of risk tied to Situational Awareness portfolio",
    "titleJa": "ケン・グリフィン氏は、シタデルが状況認識ポートフォリオに関連するリスクの80%以上を解消したと語る",
    "summaryJa": "シタデルのケン・グリフィン氏は金曜日、顧客に宛てた書簡の中で、同社がレオポルド・アッシェンブレナー氏の状況認識ヘッジファンドから資産を購入したことについて初めて触れた。CNBCのサラ・アイゼン氏が入手した書簡によると、グリフィン氏は顧客に対し、シタデルは市場価値40億ドルを超える100回以上のブロック取引を実施することで購入した元のポートフォリオから総リスクの80％以上を解消したと語った。",
    "bodyOriginal": "Ken Griffin of Citadel in a letter to clients on Friday addressed for the first time the firm's purchase of assets from Leopold Aschenbrenner's Situational Awareness hedge fund.\nAccording to a letter obtained by CNBC's Sara Eisen, Griffin told clients that Citadel has unwound more than 80% of the aggregate risk from the original portfolio purchased by conducting more than 100 block trades over $4 billion in market value.\nGriffin detailed in the letter that Citadel entered discussions with Situational Awareness to acquire some of the fund's holdings on July 29. One day later, CNBC's David Faber reported that Situational Awareness was forced to sell all of its public stock positions after facing steep losses. Citadel was later revealed as the buyer of the assets.\n\"A transaction of this magnitude could not have been completed without the extraordinary cooperation of the trading and prime brokerage teams at the banks serving both firms,\" Griffin wrote in the Friday letter to clients. \"I am grateful for the focused effort they brought to the rapid transfer of the portfolio.\"\nGriffin also confirmed the firm's flagship multistrategy Wellington fund returned 5.94% in July, which CNBC previously reported marked the fund's best monthly performance since 2022.\nSituational Awareness as a hedge fund concentrated positions in the artificial intelligence trade, on a belief by 25-year-old Aschenbrenner that the technology would fundamentally reshape the world and the economy. At the same time, the fund had short positions in some software companies, a sector that investors have worried will be disrupted by AI.\nHowever, the AI trade faltered in June and July — even while broader indexes appeared flat — with stocks that Situational Awareness had large stakes in, like Sandisk and Bloom Energy, tumbling more than 50%. At the same time, software names like Adobe rebounded, meaning the fund was losing money on both its long and short positions.\nThat set off both margin calls and compulsory sales at the fund.\nSince Citadel stepped in to buy the fund's publicly traded assets, the AI trade has rebounded, with Situational Awareness' sale representing a bottom for the sell-off that started in June.",
    "bodyJa": "シタデルのケン・グリフィン氏は金曜日、顧客に宛てた書簡の中で、同社がレオポルド・アッシェンブレナー氏の状況認識ヘッジファンドから資産を購入したことについて初めて触れた。\nCNBCのサラ・アイゼン氏が入手した書簡によると、グリフィン氏は顧客に対し、シタデルは市場価値40億ドルを超える100回以上のブロック取引を実施することで購入した元のポートフォリオから総リスクの80％以上を解消したと語った。\nグリフィン氏は書簡の中で、シタデルが7月29日に同ファンドの保有株の一部を取得するためにシチュエーショナル・アウェアネスと協議に入ったと詳しく述べた。その翌日、CNBCのデビッド・フェイバーは、シチュエーショナル・アウェアネスが巨額の損失に直面したため、公開株のポジションをすべて売却せざるを得なくなったと報じた。その後、シタデルが資産の買い手であることが明らかになった。\n「この規模の取引は、両社にサービスを提供している銀行のトレーディングチームとプライムブローカレッジチームの並外れた協力なしには完了できなかったでしょう」とグリフィン氏は顧客に宛てた金曜日の書簡の中で述べた。 「ポートフォリオの迅速な移転に向けた集中的な取り組みに感謝しています。」\nグリフィン氏はまた、同社の主力マルチ戦略ウェリントン・ファンドの7月のリターンが5.94％だったことも認め、CNBCが以前報じたところによると、同ファンドの月間パフォーマンスは2022年以来最高となった。\nヘッジファンドとしての状況認識は、この技術が世界と経済を根本的に変えるという25歳のアシェンブレナー氏の信念に基づいて、人工知能取引にポジションを集中させた。同時に、同ファンドは一部のソフトウェア企業のショートポジションを抱えていたが、この分野は投資家がAIによって破壊されるのではないかと懸念していた。\nしかし、AI取引は6月と7月に低迷し、たとえ広範な指数が横ばいであったとしても、サンディスクやブルーム・エナジーなどシチュエーショナル・アウェアネスが多額の株式を保有していた銘柄は50％以上下落した。同時に、Adobe などのソフトウェア名が回復し、ファンドはロングポジションとショートポジションの両方で損失を被ったことを意味しました。\nこれにより、ファンドでのマージンコールと強制販売の両方が引き起こされました。\nシタデルが同ファンドの上場資産の購入に踏み切って以来、AI取引は回復しており、シチュエーションアウェアネスの売却は6月に始まった下落の底となった。",

    "summaryJa": "投資家は過去数日間、今後のインフレ高進の可能性を織り込んでおり、これは国債市場の流動性改善に向けた財務省の今週の取り組みが、より広範な政策への影響に対する懸念を高めていることを示す潜在的な兆候だ。いわゆる損益分岐点金利（米国債利回りを同じ満期のインフレ連動証券と比較する市場ベースの指標）は曲線全体で上昇し、２カ月超ぶりの高水準を記録した。損益分岐点は、インフレ期待だけでなく、投資家がインフレリスクやその他の要因に対して求める補償も反映しています。",
    "bodyOriginal": "Investors over the past several days have priced in a likelihood of higher inflation ahead, a potential sign that the Treasury Department's efforts this week to improve liquidity in the government debt market are raising concerns over broader policy implications.\nThe so-called breakeven rate, a market-based measure that compares Treasury yields to inflation-protected securities of the same maturity, rose across the curve, hitting its highest level in more than two months. Breakevens reflect inflation expectations as well as compensation investors seek for inflation risk and other factors.\nAt the 10-year horizon, the breakeven rate rose to 2.34% on Thursday, its highest since June 10. Five-year breakevens hit the same level, the highest since June 16. While the measures can be volatile and still imply the market doesn't expect runaway inflation, they also indicate that inflation worries are rising.\nThe concern follows a Treasury announcement Wednesday saying it will be at least doubling the size of its typical $2 billion debt buyback, a routine operation begun in 2024 that helps provide a market for longer-dated debt.\nThough Treasury Secretary Scott Bessent insisted the move wasn't an attempt to tamp down yields, it came after the 10- and 30-year Treasurys hit levels not seen since prior to the global financial crisis in 2008.\n\"The background here is very unforgiving at the moment, There's this cocktail of concerns that has risen up,\" said Van Hesser, chief strategist at KBRA, a credit and bond rating agency.\nTraders pricing in higher inflation \"fits into the backdrop where people are concerned about inflation, and and that continues to lean on the market. These things sort of come and go. I think there are all of these these risks have been out there, and many of them for some time now. They they flare up from time to time and manifest themselves in markets.\"\nNegative market reaction\nThe rise in market-based inflation expectations follows a general pattern this week.\nWhile long-dated Treasury yields plunged the day of the buyback announcement, they rebounded Thursday and were up again Friday. The 10-year benchmark stood at 4.73% in early afternoon trading, up 3.4 basis points on the day and higher than the pre-announcement level.\nSimilarly, the 30-year yield climbed 3.6 basis points to 5.27%, while yields also were up on shorter-dated issues. Treasury is required to offset the buybacks of long-dated debt by issuing shorter-term bills.\nThe jump in yield has been tied to a number of factors, inflation fears prominent among them. Treasurys also have been forced to compete against higher-yielding government debt in Asia and Europe, a record-setting surge of issuance from hyperscalers investing in artificial intelligence, and a general rise in term premiums, or the extra yield investors demand for holding U.S. debt, which surpassed the $40 trillion mark this week.\nWhile yields rose, the dollar also weakened, continuing a trend this week that has seen the greenback lose nearly 0.9%.\nThe dollar move \"too, may be the result of 'read-through' of the Treasury announcement to the prospect of looser Fed policies,\" wrote Thierry Wizman, Macquarie Group's global foreign exchange and rates strategist.\n\"Upon the announcement of the buyback increase and the 'signaling effect' it mustered, the 10-year breakeven rose by about 6-7 bps - not insignificant. That's as if to say that something about the announcement was 'inflationary,'\" Wizman added.\nTreasury Department officials did not respond to a request for comment.\nWarsh on deck\nThe market's response ups the ante for Fed Chairman Kevin Warsh, who is scheduled to deliver his closely watched keynote on Aug. 28 at the central bank's annual symposium in Jackson Hole, Wyo.\nPrior statements by Warsh in which he endorsed the Fed having a reduced role in markets were interpreted by markets as being dovish on inflation.\nWizman noted that \"were Warsh to signal that he would stay 'dovish' indefinitely, it could be self-defeating for him and the Treasury, since inflation breakevens would rise further, perhaps undoing the stability in the nominal long-term yields that [Treasury Secretary] Scott Bessent is trying to achieve.\"\nStill, some in the market don't see the recent yield spike as cause for concern.\nDavid Zervos, the chief market strategist at Jefferies, pointed out in a CNBC interview that the 10-year note is in \"one of the tightest ranges\" it has seen in 20 years. \"It's not running away from anybody,\" he said.\n\"What we're seeing is a different kind of Treasury secretary, someone who's willing to come in and be more tactical, and that is something new for the market, and the market's going to have to adjust to that,\" Zervos said.\nLikewise, Hesser, the KBRA strategist, said the current yield levels are more in keeping with historical norms, a switch after a prolonged period in which the Fed used its tools to keep rates artificially low.\n\"A 4 to 5% 10-year is a very constructive level of rates in a thriving economy,\" he said. \"I think a 4 to 5% tenure is a very healthy rate that allows interest rates to do what interest rates are supposed to do, and that is moderate capital flows through the economy.\"",
    "bodyJa": "投資家は過去数日間、今後のインフレ高進の可能性を織り込んでおり、これは国債市場の流動性改善に向けた財務省の今週の取り組みが、より広範な政策への影響に対する懸念を高めていることを示す潜在的な兆候だ。\nいわゆる損益分岐点金利（米国債利回りを同じ満期のインフレ連動証券と比較する市場ベースの指標）は曲線全体で上昇し、２カ月超ぶりの高水準を記録した。損益分岐点は、インフレ期待だけでなく、投資家がインフレリスクやその他の要因に対して求める補償も反映しています。\n10年間の損益分岐点率は木曜日に2.34%に上昇し、6月10日以来の高水準となった。5年間の損益分岐点も同じ水準に達し、6月16日以来の高水準となった。今回の措置は不安定な可能性があり、市場が暴走するインフレを期待していないことを示唆している一方で、インフレ懸念が高まっていることも示している。\nこの懸念は、長期債の市場を提供するために2024年に開始される定例オペである通常の20億ドルの債券買い戻しの規模を少なくとも2倍にするという財務省の水曜日の発表を受けたものである。\nスコット・ベッセント財務長官は、この措置は利回りを押し下げる試みではないと主張したが、10年債と30年債が2008年の世界金融危機以前以来の水準に達した後の措置だった。\n信用・債券格付け会社ＫＢＲＡの首席ストラテジスト、ヴァン・ヘッサー氏は「現時点での背景は非常に容赦ない。さまざまな懸念が積み重なって高まっている」と述べた。\nトレーダーらはインフレ高進を織り込んでおり、「人々がインフレを懸念しており、それが市場に依存し続けているという背景に適合している。こうしたことは、ある種、行ったり来たりするものである。これらのリスクはすべて存在しており、その多くはしばらく前から存在していると思う。それらは時折燃え上がり、市場に現れる。」\n市場の否定的な反応\n今週の市場ベースのインフレ期待の上昇は一般的なパターンに従っている。\n長期国債利回りは買い戻し発表当日に急落したが、木曜日には反発し、金曜日には再び上昇した。午後早い時間の取引では１０年物指標は４．７３％となり、この日は３．４ベーシスポイント上昇し、発表前の水準を上回った。\n同様に、30年債利回りも3.6ベーシスポイント上昇して5.27％となり、短期債の利回りも上昇した。財務省は長期債の買い戻しを短期手形の発行で相殺するよう求められている。\n利回りの急上昇には多くの要因が関係しており、中でもインフレ懸念が顕著だ。財務省はまた、アジアや欧州の高利回り国債、人工知能に投資するハイパースケーラーによる記録的な発行額の急増、定期プレミアム、つまり今週40兆ドルを超えた米国債保有に対する投資家需要の超過利回りとの競争を強いられている。\n利回りが上昇する一方でドルも下落し、今週もドルが0.9％近く下落する傾向が続いた。\nマッコーリー・グループのグローバル外国為替・金利ストラテジスト、ティエリー・ウィズマン氏は、ドルの動きも「FRB政策緩和の見通しに対する財務省の発表を『読み取った』結果かもしれない」と書いている。\n「自社株買い増額の発表とそれが呼び起こした『シグナル効果』を受けて、10年間の損益分岐点は約6～7bps上昇したが、それは無視できないほどではなかった。これは、発表の何かが『インフレ的』だと言っているかのようだ」とウィズマン氏は付け加えた。\n財務省当局者はコメント要請に応じなかった。\nデッキ上のウォーシュ\n市場の反応により、8月28日にワイオミング州ジャクソンホールで開催される中央銀行年次シンポジウムで注目を集める基調講演を予定しているケビン・ウォーシュFRB議長への期待が高まっている。\nFRBの市場における役割の縮小を支持したウォーシュ氏の以前の発言は、市場によってインフレに関してハト派的であると解釈された。\nウィズマン氏は、「ウォーシュ氏が無期限に『ハト派』であり続けると示唆した場合、インフレ損益分岐点がさらに上昇し、スコット・ベッセント氏（財務長官）が達成しようとしている名目長期利回りの安定が台無しになる可能性があるため、それは同氏と財務省にとって自滅的になる可能性がある」と指摘した。\nそれでも市場の一部は、最近の利回りの急上昇を懸念材料とはみなしていない。\nジェフリーズの首席市場ストラテジスト、デビッド・ゼルボス氏はCNBCのインタビューで、10年債は過去20年間で最も狭いレンジの一つにあると指摘した。 「それは誰からも逃げているわけではない」と彼は言った。\nゼルボス氏は「われわれが見ているのは、これまでとは異なる種類の財務長官だ。喜んで登場してより戦術的に行動しようとする人物だ。これは市場にとって新しいことであり、市場はそれに適応する必要があるだろう」と述べた。\n同様に、KBRAのストラテジスト、ヘッサー氏は、現在の利回り水準は歴史的基準に沿ったものとなっており、FRBが金利を人為的に低水準に維持するためのツールを長期間使用した後の転換であると述べた。\n同氏は「１０年物４─５％は、繁栄する経済においては非常に建設的な金利水準だ」と述べた。 「４─５％の金利は金利が本来の役割を果たせる非常に健全な金利だと思う。経済全体に適度な資本が流れるということだ」と述べた。",

    "id": "us-borrowing-costs-rise-as-attempts-to-e-929e0440",
    "title": "US borrowing costs rise as attempts to ease rates prove short-lived",
    "titleJa": "金利緩和の試みが長続きしないことが判明し、米国の借り入れコストが上昇",
    "summaryJa": "金利緩和の試みが長続きしないことが判明し、米国の借り入れコストが上昇- 公開されました",
    "bodyOriginal": "US borrowing costs rise as attempts to ease rates prove short-lived\n- Published\nLong-term borrowing costs in the US rose again despite an announcement from the government that it would intervene to try to lower them.\nEarlier this week, the Treasury Department said it would buy back more debt in a bid to lower rates being charged by investors on global bond markets, which governments and major corporations rely on to borrow money.\nWhile rates - or yields as they are called - eased on borrowing over 30 years following the intervention, they have since risen again. Such moves can affect mortgage rates and car loans.\nEconomists said the surprise move by the US government had proved short-lived, with ongoing concerns over the level of borrowing as national debt passed $40tn.\nOn Friday, the interest rate on 30-year bonds had risen to around 5.27%.\nGovernments and corporations sell bonds - essentially an IOU - to raise money for spending, and in return they pay interest. Interest rates on bonds are known as yields.\nBond investors typically demand higher returns - or yields - if inflation is high or they expect it to be elevated in the future.\nYields had fallen sharply earlier this week to 5.18% from an almost two-decade high of 5.34% following the Treasury Department announcing its \"support\".\nBy stepping in to buy back government debt, Treasury Secretary Scott Bessent aimed to boost demand for bonds and lower borrowing rates.\nBut the strategy has appeared to have only worked in the short-term.\nJohn Canavan, lead analyst at Oxford Economics said the response to the government's intervention was \"unsurprisingly short-lived\".\nHe said traders were focused on the \"daunting\" amounts of global borrowing from governments and corporations, as well as increases in oil prices.\n\"As Bessent himself confirmed, the move is mainly a signalling mechanism, with the Treasury showing it is prepared to step in with yields near current levels,\" said economists at Capital Economics.\n\"It is not necessarily an effective one, however, as much of the initial fall in 30-year yields has now been reversed.\"\nThe BBC has contacted the Treasury Department for comment on the market reaction.\nBessent sought to blame the Biden administration for the current situation, telling US media on Thursday: \"We did not get here in a day, we were left with a mess.\"\nWhy the US economy is ringing alarm bells\n- Published10 hours ago\nUS national debt passes $40tn after doubling in a decade\n- Published1 day ago\nGlobal borrowing costs have spiked in recent months due to higher oil prices caused by the US-Iran war disrupting supplies and stoking fears of inflation.\nLarge amounts of cash being borrowed by tech firms to develop Artificial Intelligence (AI), with the timeline and level of returns on investment uncertain, and tax revenues being outstripped by public spending have also contributed to higher yields.\nOn Wednesday, figures revealed US national debt had more than doubled in a decade to reach a milestone $40tn (£29.4tn).\nThe rise reflects years of heavy spending under both the Trump and Biden administrations, along with higher interest payments that have added to the total. In 2016, the national debt stood at just under $20tn.\nIn response to volatility in the bond markets, the dollar weakened. The dollar the world's primary reserve currency, meaning it is held by central banks around the world in large quantities as part of their foreign exchange reserves.\nCentral banks use US dollars in international transactions, to pay for international debt, or to support domestic exchange rates.\nA fall in the dollar means US goods exports become cheaper, but imported goods may become more expensive due to the weaker currency. Americans going abroad also might notice their money does not go as far, while foreign tourists in the US might find their currency will buy them more.\nGold climbed to a more than three-month high on Friday amid uncertainty in the global economy. Investors see gold once of the safest places to invest in.",
    "bodyJa": "金利緩和の試みが長続きしないことが判明し、米国の借り入れコストが上昇\n- 公開されました\n米国の長期借入コストは、政府が引き下げに向け介入すると発表したにもかかわらず、再び上昇した。\n財務省は今週初め、政府や大手企業が資金の借り入れに依存している世界の債券市場で投資家が課す金利を引き下げるため、さらに多くの債券を買い戻すと発表した。\n金利、または利回りと呼ばれるものは、介入後 30 年間にわたって借入が緩和されましたが、その後再び上昇しました。こうした動きは住宅ローン金利や自動車ローンに影響を与える可能性がある。\nエコノミストらは、国家債務が40兆ドルを突破する中、借入水準をめぐる懸念が続いており、米政府の予想外の措置は長続きしなかったとの見方を示した。\n金曜時点では３０年債金利は５．２７％付近まで上昇していた。\n政府や企業は支出資金を調達するために債券（本質的には借用書）を販売し、その見返りに利子を支払います。債券の金利は利回りとして知られています。\n債券投資家は通常、インフレ率が高い場合、またはインフレ率が将来上昇すると予想される場合、より高いリターン、つまり利回りを要求します。\n財務省が「支援」を発表したことを受け、利回りは今週初め、約２０年ぶりの高水準だった５．３４％から５．１８％に急低下していた。\nスコット・ベッセント財務長官は国債の買い戻しに踏み切ることで、債券の需要を高め、借入金利を引き下げることを目指した。\nしかし、この戦略は短期的にしか機能しなかったようだ。\nオックスフォード・エコノミクスの主任アナリスト、ジョン・カナバン氏は、政府の介入に対する反応は「当然のことながら短命だった」と述べた。\n同氏は、トレーダーらは原油価格の上昇だけでなく、政府や企業からの「気の遠くなるような」世界的な借入額にも注目していると述べた。\nキャピタル・エコノミクスのエコノミストらは「ベッセント氏自身も確認したように、今回の措置は主にシグナル伝達のメカニズムであり、財務省が利回りを現状水準に近い水準で介入する用意があることを示している」と述べた。\n「とはいえ、30年債利回りの当初の下落の大部分は現在では反転しているため、必ずしも効果的なものではない。」\nBBCは市場の反応についてコメントを求めて財務省に問い合わせた。\nベッセント氏は木曜、米メディアに対し、現在の状況はバイデン政権のせ​​いだと主張し、「一日にして成らず、混乱が残った」と語った。\n米国経済が警鐘を鳴らしている理由\n- 10 時間前に公開\n米国の国債、10年で倍増、40兆ドルを突破\n- 1 日前に公開\n米国とイランの戦争による原油価格の高騰で供給が混乱し、インフレ懸念が高まったため、世界の借入コストはここ数カ月で急上昇している。\n投資収益率のスケジュールや水準が不透明な中、人工知能（AI）開発のためにハイテク企業が多額の現金を借り入れていることや、税収が公共支出を上回っていることも利回りの上昇に寄与している。\n水曜日の統計は、米国の国債が10年間で2倍以上に増加し、節目となる40兆ドル（約29兆4000億ポンド）に達したことを明らかにした。\nこの増加は、トランプ、バイデン両政権下で長年にわたる巨額支出と、利払い総額の増加を反映している。 2016 年の国家債務は 20 兆ドル弱でした。\n債券市場のボラティリティーを受けてドル安となった。ドルは世界の主要準備通貨であり、世界中の中央銀行が外貨準備の一部として大量に保有していることを意味します。\n中央銀行は国際取引で米ドルを使用し、国際債務の支払いや国内為替レートの維持に使用します。\nドルの下落は米国製品の輸出が安くなることを意味しますが、通貨安により輸入品は高くなる可能性があります。海外に行くアメリカ人も、自分のお金がそれほど遠くに行かないことに気づくかもしれないが、米国にいる外国人観光客は、自国の通貨がもっと買ってくれると気づくかもしれない。\n世界経済の不確実性を背景に、金は金曜日に３カ月ぶりの高値まで上昇した。投資家はかつて金を最も安全な投資先だと考えています。",

    "title": "Trump to allow import of 300,000 metric tons of ground beef without tariff",
    "titleJa": "トランプ大統領、30万トンのひき肉を関税なしで輸入許可へ",
    "summaryJa": "ドナルド・トランプ大統領は金曜朝、米国は今後3カ月以内に、割当外関税の適用を受けずに最大30万トンのひき肉製品の輸入を許可すると発表した。トランプ大統領はまた、「この牛肉を現在の市場価格より２５％低く販売するという約束がある」とも述べた。",
    "bodyOriginal": "President Donald Trump on Friday morning said the United States will allow up to 300,000 metric tons of product for ground beef to be imported over the next three months without being subject to out-of-quota tariffs.\nTrump also said, \"We have a commitment that this beef will be sold at 25 percent below current market prices.\"\nTrump will formally sign an executive order on the tariff waiver for beef trimmings imports within the next two weeks, according to the White House.\nThe president's Truth Social post announcing the move did not say which companies had made those commitments, which he said came \"as we work to rebuild this herd [of U.S. cattle] and help our ranchers.\"\nTrump also did not say which foreign beef exporters he had reached a deal with.\nThe National Cattlemen's Beef Association criticized the move, saying it would not address Trump's stated intention of helping to increase the size of the U.S. beef herd.\nSen. Tim Sheehy, R-Mont., in a tweet, said, \"I've advised President Trump against this course of action for a year because American ranchers have been struggling against the packer monopoly for decades, and this will further harm them — most of whom are MAGA Republicans.\"\n\"The President's heart is in the right place on wanting lower prices for the American people, and beef prices have been impacted by the Mexican screwworm,\" Sheehy said.\n\"But the reality is this action will make it more difficult for American ranchers to rebuild our herd and bring prices down for the American people,\" the senator said. \"And most importantly, this will harm our ranching families who feed the nation.\"\nThe U.S. imposes tariffs on imported beef beyond a certain quota limit for individual countries.\nA report in May from the American Farm Bureau Federation noted that \"imports entering under quota generally face a tariff of just 4.4 cents per kilogram, while imports above quota face a 26.4% tariff.\"\n\"For beef valued around $7 per kilogram, that difference can exceed $1.80 per kilogram in tariff costs,\" the report said.\nBeef prices in the U.S have soared in 2026 due to a reduction in the nation's cattle herd from years of drought, high feed costs and herd liquidation. The size of the herd is at its lowest point since the 1950s.\nTrump's post comes as his fellow Republicans fear that Americans' concerns about the affordability of everyday products such as food could lead to losses for GOP candidates in congressional elections in November.\n\"Today, I concluded a deal to substantially lower the price of ground beef for working American families,\" Trump said in his post.\n\"This deal will reduce prices for Americans while giving space for our Great American Beef Herd to grow again,\" he said.\nNational Cattlemen's Beef Association CEO Colin Woodall, in a statement, said his group \"is disappointed by the President's statement.\"\n\"While America's cattle producers share the goal of keeping groceries affordable for consumers, flooding the market with government-subsidized, below-market beef is not the way to rebuild the American cattle herd,\" Woodall said. \"Cattle markets have already turned sharply lower this morning, to the detriment of farmers and ranchers.\"\n\"Today's announcement and other market interventions throw cold water on the prospect of herd expansion and sacrifices long-term stability for short term messaging,\" Woodall said.\nAltin Kalo, head economist at Steiner Consulting Group, said the potential impact on prices remains to be seen.\n\"Imported beef already is trading at a steep discount,\" Kalo told CNBC.\n\"The out-of-quota tariff has not been an issue for importers to this point as a record amount is being imported,\" he said.\nKalo said that many grocery stores use only fresh ground beef in the meat case.\nBut almost all beef that is meant to be used for grinding beef, which comes from Australia or Brazil, is frozen, and a large portion of that goes to food service operations, mostly fast food companies.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
