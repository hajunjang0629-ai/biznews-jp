    "id": "can-anthropic-s-record-breaking-ipo-stop-f1193f5f",
    "title": "Can Anthropic's record-breaking IPO stop the AI bubble bursting?",
    "titleJa": "Can Anthropic's record-breaking IPO stop the AI bubble bursting?",
    "summaryJa": "Anthropic's hotly anticipated IPO is expected to put it in the top 10 most valuable US companies, but the future is uncertain.",
    "bodyOriginal": "It was during November 2020 that somewhere in San Francisco, a woman called Daniela Amodei phoned a friend, asking for advice.\nDaniela oversaw safety and policy at OpenAI, one of the most talked-about AI companies in the world.\nBut Daniela and her brother Dario - who worked there too - had misgivings over safety levels at OpenAI and thought it could be time to walk away.\nSo she did what many do when we can't make a decision about something, she phoned a friend. The friend's reply was direct and to the point: \"You don't need to be on the phone with me. You already know the answer.\"\nThe Amodei siblings and a handful of other colleagues quit. Together, they set up a rival – Anthropic.\nSix years on and Anthropic, the maker of leading AI model Claude, has predicted revenues of $52bn in 2026 and $135bn in 2027, according to analyst estimates.\nIt is about to sell shares to the public for the first time in what's known as an Initial Public Offering or IPO, aiming for a valuation of an estimated $1.4tn (£1tn), which would propel it straight into the top 10 of the most valuable US companies.\nThe sale comes at a crucial time when many are wondering whether, amid increasing concern about the potential of AI, the industry's bubble is showing signs of bursting.\nWhere once investors were \"all in\" on a technological revolution to rival the railroads, the car, electricity and the internet, some are now hedging their bets, amid arguments that AI prices will be driven down as the technology becomes more common and concerns that a hefty wedge of the AI investment is tech giants investing in each other.\nShares in companies that supply the raw computing power behind AI, like Coreweave and Nebius, have seen their value cut in half while even the mighty Nvidia has lost its crown as the world's most valuable company with its shares down 30% - a staggering $2tn fall in value.\nSo could the Anthropic IPO reinflate the bubble or will it be remembered as the last gasp of a boom that is heading for a bust?\nA benchmark valuation\nAt an event last week, Anthropic CEO Dario Amodei told JPMorgan Chase's CEO Jamie Dimon that his guiding principle was to \"never let your company be worth a single dollar more than it's worth\".\nThe company is selling roughly $65bn worth of shares to the general public and a further $26bn on to other big tech companies. It is comfortably the single biggest money raising event in US corporate history.\nIt's an old adage that during a gold rush you should buy companies that sell the picks and shovels as opposed to those staking everything on striking gold. In AI's case that's the chip makers, the data centre builders, the energy providers. But Anthropic is arguably the gold itself and this IPO will see what value people put on it, according to Fiona Cincotta.\n\"I think the reason that this IPO is so important is basically it's the first ability for the public investors to access a pure play AI trade,\" she says, adding that previous offerings have been about \"other parts of the ecosystem, which are, the semiconductors, the chips, the, data centres. But this is the first time that we were actually able to access the AI provider.\"\nWhat a company is worth depends almost entirely on predicted future earnings.\nIt's that calculation that many think presents the sharpest needle to the AI bubble.\nWill current and future users of AI be prepared to pay enough to justify the trillions being spent on the chips, data centres, energy and employees, some of whom can command annual salaries of over $100m?\n\"AI is certainly in a financial bubble. While LLMs [large language models] offer genuine utility and are undoubtedly here to stay, the economics don't add up,\" said Gary Marcus, Professor Emeritus at New York University and author of Taming Silicon Valley, speaking earlier this year.\n\"[The] more companies build AI models, the [more the] technology becomes commoditised, eliminating meaningful competitive advantages and driving down prices.\"\nSo far, the growth rates in Anthropic revenue are extraordinary.\nBut these explosive growth rates hide a potential problem. Around a quarter of that revenue came from just a handful of companies, among them Google and Amazon.\nIt's also concentrated in the US which accounts for two-thirds of its revenue.\nThere is also the staggering network of circular financing found in the AI world. For example, Anthropic has agreements to buy or lease hundreds of billions of dollars worth of chips and computing power from a handful of companies including Broadcom, Google, Amazon. Many of those firms are also investors in Anthropic and major customers of its products.\nPublic doubts\nIt's not just some Wall Street investors questioning whether the AI boom is all it's cracked up to be. Out on Main Street, ordinary Americans have concerns too.\nWith the US driving so much of global AI growth, a growing public backlash against a technology that threatens to replace millions of jobs and hoover up vast amounts of energy and water became a factor in the recent midterm elections in the US.\nMany areas in the US have passed moratoriums on data centre development and many candidates deemed too close to big tech found that association a political liability rather than an asset. Many Democrat candidates publicly opposed data centre development and won.\nAdded to that, the Pied Piper of AI, chip maker Nvidia's CEO Jensen Huang, resigned last week after admitting to having been \"unfaithful\" to his wife after reports he had an affair with a suspected Chinese spy, Alice Huang.\nHuang's spectacular fall from grace and Nvidia's 30% fall in value from its peak have left AI investors looking for a new champion for the AI boom that has underpinned the US stock market and arguably much of its entire economy for the last two years.\nIf Anthropic – and its CEO are to be AI's new Pied Piper, he will be playing a different tune to the relentlessly upbeat, leather jacket-clad talisman Huang.\nWhile Huang wanted AI development to continue full throttle, Anthropic was built on misgivings over the levels of safety and responsibility the OpenAI leavers felt were being exercised over the development of society-changing technology.\nAmodei has warned that AI capabilities could enable biological weapon development, mass surveillance, authoritarianism and the replacement of millions of white-collar, tax-paying workers.\nHe has called for a slowdown in its development as its powers are growing at such an exponential rate that it could very soon elude any human oversight.\nThat said, his paternalistic overtures have been sceptically received by those who point out that the pace of Anthropic's development of new more powerful models has shown no sign of the slowdown he's advocating for the rest of the industry.\nHype and FOMO\nBut for all the concerns, just as with Elon Musk's SpaceX before it – the hype and the FOMO (fear of missing out) on an undoubtedly profound moment in technological and perhaps human development – means that buying interest is high.\nIt's reported that orders to buy shares exceed the number on offer by over six times.\nWith demand outstripping supply by such a margin, a first-day jump is likely given the oversubscription, but it doesn't tell you much about long-run return.\nUsing SpaceX as an example again, shares initially rose nearly 70% from its IPO sale price of $135 to $225. Shares in SpaceX are currently back to $145.\nThe Anthropic IPO could be wildly successful and blow a bit of fresh new air into what some maintain still looks a lot like a bubble.\nEileen Burbidge, founder of tech investors Passion Capital, is one of those who reject the notion that AI is a bubble about to burst.\n\"Maybe the growth of the bubble has slowed down a little bit, but actually I wouldn't be willing to say that it's about to burst yet,\" says Burbidge. \"I think this IPO could actually mean everyone could be off to the races again.\"\nFiona Cincotta believes Anthropic's IPO is about far more than just Anthropic. \"I think what's going to be really interesting here is I think it can actually be used as a valuation benchmark for the entire AI ecosystem,\" she says.\n\"That's why I don't think this is just going to affect the share price of Anthropic. I think this is going to have much wider implications across the whole AI trade.\"\nTwo things can be true at the same time. The Anthropic IPO could be wildly successful - FOMO is a powerful emotion in financial markets. But its probable success won't soothe the unease in some quarters that not every company, every investor and every citizen will think of AI as the answer to humanity's problems.\nLead image: Getty\nBBC InDepth is the home on the website and app for the best analysis, with fresh perspectives that challenge assumptions and deep reporting on the biggest issues of the day. Emma Barnett and John Simpson bring their pick of the most thought-provoking deep reads and analysis, every Saturday. Sign up for the newsletter here\nGet in touch\nAre you personally affected by the issues raised in this story?\nRelated topics\nMore from InDepth\n- Published11 October",

p of a boom that is heading for a bust?\nA benchmark valuation\nAt an event last week, Anthropic CEO Dario Amodei told JPMorgan Chase's CEO Jamie Dimon that his guiding principle was to \"never let your company be worth a single dollar more than it's worth\".\nThe company is selling roughly $65bn worth of shares to the general public and a further $26bn on to other big tech companies. It is comfortably the single biggest money raising event in US corporate history.\nIt's an old adage that during a gold rush you should buy companies that sell the picks and shovels as opposed to those staking everything on striking gold. In AI's case that's the chip makers, the data centre builders, the energy providers. But Anthropic is arguably the gold itself and this IPO will see what value people put on it, according to Fiona Cincotta.\n\"I think the reason that this IPO is so important is basically it's the first ability for the public investors to access a pure play AI trade,\" she says, adding that previous offerings have been about \"other parts of the ecosystem, which are, the semiconductors, the chips, the, data centres. But this is the first time that we were actually able to access the AI provider.\"\nWhat a company is worth depends almost entirely on predicted future earnings.\nIt's that calculation that many think presents the sharpest needle to the AI bubble.\nWill current and future users of AI be prepared to pay enough to justify the trillions being spent on the chips, data centres, energy and employees, some of whom can command annual salaries of over $100m?\n\"AI is certainly in a financial bubble. While LLMs [large language models] offer genuine utility and are undoubtedly here to stay, the economics don't add up,\" said Gary Marcus, Professor Emeritus at New York University and author of Taming Silicon Valley, speaking earlier this year.\n\"[The] more companies build AI models, the [more the] technology becomes commoditised, eliminating meaningful competitive advantages and driving down prices.\"\nSo far, the growth rates in Anthropic revenue are extraordinary.\nBut these explosive growth rates hide a potential problem. Around a quarter of that revenue came from just a handful of companies, among them Google and Amazon.\nIt's also concentrated in the US which accounts for two-thirds of its revenue.\nThere is also the staggering network of circular financing found in the AI world. For example, Anthropic has agreements to buy or lease hundreds of billions of dollars worth of chips and computing power from a handful of companies including Broadcom, Google, Amazon. Many of those firms are also investors in Anthropic and major customers of its products.\nPublic doubts\nIt's not just some Wall Street investors questioning whether the AI boom is all it's cracked up to be. Out on Main Street, ordinary Americans have concerns too.\nWith the US driving so much of global AI growth, a growing public backlash against a technology that threatens to replace millions of jobs and hoover up vast amounts of energy and water became a factor in the recent midterm elections in the US.\nMany areas in the US have passed moratoriums on data centre development and many candidates deemed too close to big tech found that association a political liability rather than an asset. Many Democrat candidates publicly opposed data centre development and won.\nAdded to that, the Pied Piper of AI, chip maker Nvidia's CEO Jensen Huang, resigned last week after admitting to having been \"unfaithful\" to his wife after reports he had an affair with a suspected Chinese spy, Alice Huang.\nHuang's spectacular fall from grace and Nvidia's 30% fall in value from its peak have left AI investors looking for a new champion for the AI boom that has underpinned the US stock market and arguably much of its entire economy for the last two years.\nIf Anthropic – and its CEO are to be AI's new Pied Piper, he will be playing a different tune to the relentlessly upbeat, leather jacket-clad talisman Huang.\nWhile Huang wanted AI development to continue full throttle, Anthropic was built on misgivings over the levels of safety and responsibility the OpenAI leavers felt were being exercised over the development of society-changing technology.\nAmodei has warned that AI capabilities could enable biological weapon development, mass surveillance, authoritarianism and the replacement of millions of white-collar, tax-paying workers.\nHe has called for a slowdown in its development as its powers are growing at such an exponential rate that it could very soon elude any human oversight.\nThat said, his paternalistic overtures have been sceptically received by those who point out that the pace of Anthropic's development of new more powerful models has shown no sign of the slowdown he's advocating for the rest of the industry.\nHype and FOMO\nBut for all the concerns, just as with Elon Musk's SpaceX before it – the hype and the FOMO (fear of missing out) on an undoubtedly profound moment in technological and perhaps human development – means that buying interest is high.\nIt's reported that orders to buy shares exceed the number on offer by over six times.\nWith demand outstripping supply by such a margin, a first-day jump is likely given the oversubscription, but it doesn't tell you much about long-run return.\nUsing SpaceX as an example again, shares initially rose nearly 70% from its IPO sale price of $135 to $225. Shares in SpaceX are currently back to $145.\nThe Anthropic IPO could be wildly successful and blow a bit of fresh new air into what some maintain still looks a lot like a bubble.\nEileen Burbidge, founder of tech investors Passion Capital, is one of those who reject the notion that AI is a bubble about to burst.\n\"Maybe the growth of the bubble has slowed down a little bit, but actually I wouldn't be willing to say that it's about to burst yet,\" says Burbidge. \"I think this IPO could actually mean everyone could be off to the races again.\"\nFiona Cincotta believes Anthropic's IPO is about far more than just Anthropic. \"I think what's going to be really interesting here is I think it can actually be used as a valuation benchmark for the entire AI ecosystem,\" she says.\n\"That's why I don't think this is just going to affect the share price of Anthropic. I think this is going to have much wider implications across the whole AI trade.\"\nTwo things can be true at the same time. The Anthropic IPO could be wildly successful - FOMO is a powerful emotion in financial markets. But its probable success won't soothe the unease in some quarters that not every company, every investor and every citizen will think of AI as the answer to humanity's problems.\nLead image: Getty\nBBC InDepth is the home on the website and app for the best analysis, with fresh perspectives that challenge assumptions and deep reporting on the biggest issues of the day. Emma Barnett and John Simpson bring their pick of the most thought-provoking deep reads and analysis, every Saturday. Sign up for the newsletter here\nGet in touch\nAre you personally affected by the issues raised in this story?\nRelated topics\nMore from InDepth\n- Published11 October",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
