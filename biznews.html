    "title": "Zscaler stock jumps 18% on report that CrowdStrike in talks to buy security vendor",
    "titleJa": "Zscaler stock jumps 18% on report that CrowdStrike in talks to buy security vendor",
    "summaryJa": "Zscaler shares surged 18% in extended trading on Friday after Bloomberg reported that CrowdStrike is in talks to buy the cybersecurity vendor. Shares of CrowdStrike shares fell more than 8%.The talks between the two companies are ongoing, Bloomberg reported, citing sources familiar in the matter. CrowdStrike declined to comment on the report. Zscaler didn't immediately respond to CNBC's request for comment.",
    "bodyOriginal": "Zscaler shares surged 18% in extended trading on Friday after Bloomberg reported that CrowdStrike is in talks to buy the cybersecurity vendor. Shares of CrowdStrike shares fell more than 8%.\nThe talks between the two companies are ongoing, Bloomberg reported, citing sources familiar in the matter. CrowdStrike declined to comment on the report. Zscaler didn't immediately respond to CNBC's request for comment.\nCrowdStrike has been one of the big cybersecurity winners in the artificial intelligence boom, with its stock about doubling in value this year, lifting its market cap to $235 billion. Zscaler, meanwhile, is down 13% this year, pushing its market cap down to about $32 billion.\nAlong with CrowdStrike, Palo Alto Networks has seen its business boom as businesses race to upgrade their networks in the AI era. Palo Alto closed Friday at a nearly $282 billion market cap.\nShould a deal take place, it would be among the largest in the history of the cybersecurity industry. Google acquired Wiz last year for $32 billion. In 2024, Cisco paid about $28 billion for Splunk. Earlier this year, Palo Alto closed its purchase of CyberArk for $25 billion.\nCrowdStrike's deals to this point have been on the smaller side.The company announced plans earlier this month to acquire agentic observability platform Fiddler AI and AI trust platform Dreadnode.\nThis is breaking news. Please refresh for updates.",
    "bodyJa": "Zscaler shares surged 18% in extended trading on Friday after Bloomberg reported that CrowdStrike is in talks to buy the cybersecurity vendor. Shares of CrowdStrike shares fell more than 8%.\nThe talks between the two companies are ongoing, Bloomberg reported, citing sources familiar in the matter. CrowdStrike declined to comment on the report. Zscaler didn't immediately respond to CNBC's request for comment.\nCrowdStrike has been one of the big cybersecurity winners in the artificial intelligence boom, with its stock about doubling in value this year, lifting its market cap to $235 billion. Zscaler, meanwhile, is down 13% this year, pushing its market cap down to about $32 billion.\nAlong with CrowdStrike, Palo Alto Networks has seen its business boom as businesses race to upgrade their networks in the AI era. Palo Alto closed Friday at a nearly $282 billion market cap.\nShould a deal take place, it would be among the largest in the history of the cybersecurity industry. Google acquired Wiz last year for $32 billion. In 2024, Cisco paid about $28 billion for Splunk. Earlier this year, Palo Alto closed its purchase of CyberArk for $25 billion.\nCrowdStrike's deals to this point have been on the smaller side.The company announced plans earlier this month to acquire agentic observability platform Fiddler AI and AI trust platform Dreadnode.\nThis is breaking news. Please refresh for updates.",

    "title": "Prediction markets outlook for stocks in 2026 dims amid AI sell-off",
    "titleJa": "Prediction markets outlook for stocks in 2026 dims amid AI sell-off",
    "summaryJa": "Odds that the S&amp;P 500 will cross 8,000, which were once north of 70%, are extremely low on platform Kalshi.",
    "bodyOriginal": "As stocks continue their tech-driven sell-off, prediction markets traders are seeing a bleaker outlook for the remainder of the year.\nOn platform Kalshi, speculators place just 6% odds that the S&P 500 will cross 8,000 in 2026. On Oct. 13, those odds were as high as 72%.\nContracts ask traders if the S&P 500 will go above various levels in 2026, and they're resolved using data from S&P Dow Jones Indices.\nOn Friday, the Nasdaq Composite turned negative for the year as investors continued to dump tech stocks, primarily those with exposure to the artificial intelligence build-out. The Dow Jones Industrial Average and the S&P 500 fell into correction territory, too.\nThe S&P 500 has slashed its year-to-date gain to just over 2%.\nThe Stock Trader's Almanac in a Thursday note broadly agreed that the hopes for a December rally are fading, with the caveat that a \"Santa rally\" could still appear at the end of the year.\n\"The market is under pressure and more downside can't be ruled out,\" the note said.\nThe Stock Trader's Almanac sees 2026 following the year-end pattern of 2018, when the Federal Reserve was in a tightening cycle in a midterm year. The Fed is widely expected to hike rates at its December meeting.\nIn that scenario, the Stock Trader's Almanac thinks more churn is to come. \"The low is more likely in mid- to late December than this week.\"\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.",

    "id": "nvidia-stock-plunges-12-rides-longest-we-c3ef6775",
    "title": "Nvidia stock plunges 12%, rides longest weekly losing streak since 2008 financial crisis",
    "titleJa": "Nvidia stock plunges 12%, rides longest weekly losing streak since 2008 financial crisis",
    "summaryJa": "Once the most valuable company in the world, Nvidia now ranks third behind Apple and Microsoft.",
    "bodyOriginal": "The last time Wall Street was this down on Nvidia the chipmaker's flagship product was the GeForce graphics processor for high-end PC video games, and markets were reeling from the global financial crisis.\nNvidia shares fell 12% on Friday, sliding for a seventh straight day as investors grew increasingly concerned about life after co-founder Jensen Huang. The stock is poised to close lower for a seventh consecutive week, the longest such stretch since 2008.\nShares of Nvidia are down 44% over the period, pushing the company's market cap down by $2.5 trillion. The stock is now trading at around 9.3 times forward earnings, while Advanced Micro Devices is valued at 29 times profit for the next 12 months.\nOn Friday, Reuters reported that the Securities and Exchange Commission is exploring potential accounting issues at Nvidia, pushing the stock down further.\nOnce the most valuable company, now, at a market cap of $3.1 trillion, Nvidia is fourth behind Apple and Microsoft and Alphabet.\nNvidia is reeling from the removal of Huang, who resigned on Nov. 12, after multiple reported affairs, including one with a Chinese businesswoman who was allegedly a spy.\nHarvey Jones, Nvidia's newly appointed board chair, said earlier this week that Huang had resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\nBut the chipmaker's losing streak started before Nvidia was thrown into crisis as investors worried over the sustainability of the AI buildout, particularly after the midterm elections, and emerging competition in AI chips from Google and AMD.\nEven a better-than-expected earnings report, which included an increase to fiscal 2028 guidance, didn't stem the selling. Interim CEO Colette Kress, the company's longtime CFO, projected revenue growth next fiscal year of 75%, and said that customers aren't going anywhere.\nOn Tuesday's earnings call with analysts, Kress signed off by saying, \"we've got this.\" In a company meeting the next day, executives told staff that it was moving its yearly review process, which can come with more stock, from March to December.\nFor investors, one major question is whether Nvidia can continue to innovate and sustain its commanding lead in the AI chip market without its visionary leader. Almost the entire company now is built around the AI trade, a phenomenon that began taking hold just four years ago with the launch of OpenAI's ChatGPT.\nBefore that, Nvidia's primary business was selling graphics cards used for video games. In mid-2008, the last time the stock was this deep into a weekly losing streak, Nvidia was generating less than $1 billion per quarter. Now it pulls in more than $1 billion per day. At the time, the entire market was in freefall due to the worst financial crisis since the Great Depression.",
    "bodyJa": "The last time Wall Street was this down on Nvidia the chipmaker's flagship product was the GeForce graphics processor for high-end PC video games, and markets were reeling from the global financial crisis.\nNvidia shares fell 12% on Friday, sliding for a seventh straight day as investors grew increasingly concerned about life after co-founder Jensen Huang. The stock is poised to close lower for a seventh consecutive week, the longest such stretch since 2008.\nShares of Nvidia are down 44% over the period, pushing the company's market cap down by $2.5 trillion. The stock is now trading at around 9.3 times forward earnings, while Advanced Micro Devices is valued at 29 times profit for the next 12 months.\nOn Friday, Reuters reported that the Securities and Exchange Commission is exploring potential accounting issues at Nvidia, pushing the stock down further.\nOnce the most valuable company, now, at a market cap of $3.1 trillion, Nvidia is fourth behind Apple and Microsoft and Alphabet.\nNvidia is reeling from the removal of Huang, who resigned on Nov. 12, after multiple reported affairs, including one with a Chinese businesswoman who was allegedly a spy.\nHarvey Jones, Nvidia's newly appointed board chair, said earlier this week that Huang had resigned after \"disclosure of personal behavior inconsistent with the company's code of conduct, standards and cultural norms.\"\nBut the chipmaker's losing streak started before Nvidia was thrown into crisis as investors worried over the sustainability of the AI buildout, particularly after the midterm elections, and emerging competition in AI chips from Google and AMD.\nEven a better-than-expected earnings report, which included an increase to fiscal 2028 guidance, didn't stem the selling. Interim CEO Colette Kress, the company's longtime CFO, projected revenue growth next fiscal year of 75%, and said that customers aren't going anywhere.\nOn Tuesday's earnings call with analysts, Kress signed off by saying, \"we've got this.\" In a company meeting the next day, executives told staff that it was moving its yearly review process, which can come with more stock, from March to December.\nFor investors, one major question is whether Nvidia can continue to innovate and sustain its commanding lead in the AI chip market without its visionary leader. Almost the entire company now is built around the AI trade, a phenomenon that began taking hold just four years ago with the launch of OpenAI's ChatGPT.\nBefore that, Nvidia's primary business was selling graphics cards used for video games. In mid-2008, the last time the stock was this deep into a weekly losing streak, Nvidia was generating less than $1 billion per quarter. Now it pulls in more than $1 billion per day. At the time, the entire market was in freefall due to the worst financial crisis since the Great Depression.",

    "id": "trump-threatens-ban-on-us-firms-building-cc3c28b4",
    "title": "Trump threatens ban on US firms building AI data centres overseas",
    "titleJa": "Trump threatens ban on US firms building AI data centres overseas",
    "summaryJa": "The US president provided little detail on the potential policy, saying others in his team were hearing about it for the first time.",
    "bodyOriginal": "Trump threatens ban on US firms building AI data centres overseas\n- Published\nDonald Trump has said he will ban US companies from building AI data centres overseas, threatening a \"tremendous tax\" for tech firms who do so.\n\"We're going to keep it all in this country,\" the US president said, while providing little detail on the potential policy he said others in his cabinet were hearing about for the first time.\nData centres were a central issue in the midterm elections earlier in November, with many Democratic candidates promising tougher regulation on their construction.\nTech giants including Meta and Google have entered agreements to build data centres overseas. It remains unclear how such a policy would be enforced if it was brought in.\n\"We're not going to allow our companies to build data centres outside of our country,\" Trump told reporters in a press briefing following his return from his trip to Asia.\n\"Because China will take all of them, and we're not allowing that to happen.\"\nBut whether that idea will become policy remains unclear.\n\"I don't know if that's a breaking story, but I haven't even said that to my people. But I'm telling them now, they're here,\" he said.\nTrump floated the policy after saying the US was leading on data centre construction, and he would not allow China to beat the US when it came to AI - which he calls super intelligence, or SI.\nData centres are crucial to the AI boom. The vast warehouse-style buildings house the advanced computer chips and servers that are needed to run AI programmes such as Claude and ChatGPT.\nAs of April there were about 3,000 data centres across the US, with another 1,500 in various stages of approval and construction, according to the Pew Research Centre.\nMany of them are built in rural areas, and concerns about issues including noise pollution and energy consumption helped drive Democratic candidates promising tougher rules on data centre construction to wins on 3 November.\n\"You ought to take advantage of the the data centres. Make them pay you, make them pay your community, but take advantage don't shut them off,\" Trump said.\n\"We have a lot of places that want them badly, and they're great places. They have energy and they have everything. They're tremendous assets.\"\nCanada has made moves to step in to offer itself as an alternative location for these sites, with less local pushback against projects so far.\nLarge tech firms - often called AI hyperscalers due to the size of their investments in AI - have also been branching out.\nIn September Google announced a €13bn ($15bn: £11bn) investment in AI infrastructure in Finland, which included funding for three data centres.\nLast month, building work for two of those centres was halted due to concerns over the clearance of more than 300 hectares of forest.\nTrump called out the build in Finland specifically, saying his administration was \"not allowing that to happen\".\nGoogle has been contacted for comment.\nRelated topics\n- Published19 hours ago",
    "bodyJa": "Trump threatens ban on US firms building AI data centres overseas\n- Published\nDonald Trump has said he will ban US companies from building AI data centres overseas, threatening a \"tremendous tax\" for tech firms who do so.\n\"We're going to keep it all in this country,\" the US president said, while providing little detail on the potential policy he said others in his cabinet were hearing about for the first time.\nData centres were a central issue in the midterm elections earlier in November, with many Democratic candidates promising tougher regulation on their construction.\nTech giants including Meta and Google have entered agreements to build data centres overseas. It remains unclear how such a policy would be enforced if it was brought in.\n\"We're not going to allow our companies to build data centres outside of our country,\" Trump told reporters in a press briefing following his return from his trip to Asia.\n\"Because China will take all of them, and we're not allowing that to happen.\"\nBut whether that idea will become policy remains unclear.\n\"I don't know if that's a breaking story, but I haven't even said that to my people. But I'm telling them now, they're here,\" he said.\nTrump floated the policy after saying the US was leading on data centre construction, and he would not allow China to beat the US when it came to AI - which he calls super intelligence, or SI.\nData centres are crucial to the AI boom. The vast warehouse-style buildings house the advanced computer chips and servers that are needed to run AI programmes such as Claude and ChatGPT.\nAs of April there were about 3,000 data centres across the US, with another 1,500 in various stages of approval and construction, according to the Pew Research Centre.\nMany of them are built in rural areas, and concerns about issues including noise pollution and energy consumption helped drive Democratic candidates promising tougher rules on data centre construction to wins on 3 November   {
    "id": "anthropic-shares-fall-after-blockbuster-427436e6",
    "title": "Anthropic shares fall after blockbuster opening as wider tech sell-off continues",
    "titleJa": "Anthropic shares fall after blockbuster opening as wider tech sell-off continues",
    "summaryJa": "Anthropic shares fall after blockbuster opening as wider tech sell-off continues- Published",
    "bodyOriginal": "Anthropic shares fall after blockbuster opening as wider tech sell-off continues\n- Published\nAnthropic's shares have dropped back towards their initial price after a soaring first day on the stock market, as a wider tech sell-off deepens.\nThe fall in tech stocks continued to weigh on markets, with the S&P 500 down more than 2% and the Dow Jones Industrial Average down 0.7% by lunchtime.\nBoth US indexes touched correction territory, a point where they are trading at 10% or more down from a recent high.\nThe tech-heavy Nasdaq Composite Index also fell more than 3.4% by the middle of trading on Friday.\nThe speed at which AI investment has been growing - with more than $1 trillion spent in the last year alone by a small handful of major tech companies - has led to ongoing concerns of a financial bubble. Questions are being raised over whether those investments will pay off, and when.\nDespite a positive first day of trading, Anthropic's shares fell on Friday, dropping more than 12% to about $85 by lunchtime, close to its initial public offering (IPO) price of $83.\nThe artificial intelligence (AI) company's introduction to the Nasdaq stock exchange on Thursday was a crucial test for the industry and was largely seen as a success, with trading starting at $111.50.\nThe maker of the Claude chatbot raised a record $81bn in its initial public offering (IPO), but its share price moved significantly in the first day of trading.\nThe shares peaked at $115 on Thursday, before easing to end the day up 17% at $97.17.\nAnalysts said volatility was to be expected in the first days or even weeks of Anthropic's trading, as the company was the first frontier AI firm to go public so had no direct peers.\nSome have also noted the similarities with Elon Musk's SpaceX, which at the time of its debut in June was the largest IPO on record. Shares in the rocket and AI company experienced large swings in its first few weeks of trading.\nMost tech companies see their shares fall after hitting the stock market, often after reporting quarterly results for the first time.\nBut many, including Meta, Amazon and Google, have gone on to become the largest and most profitable corporations in the world.\nEd Moya, a strategist at market intelligence firm AlphaSense, said Anthropic's blockbuster IPO did not appear to have restored confidence in the broader AI market.\nWhile AI demand was still very strong, Moya told the BBC that investors were trying to answer the question of how much were they willing to pay for that growth.\n\"As we've gone through the past past few weeks, it seems that there's been more risks that have surfaced,\" he said.\n\"Right now you're starting to see Wall Street is trying to shift from rewarding growth at any price, to demanding stronger cash flow and a clearer path to profitability.\"\nShares in some of the largest US tech companies also fell on Friday.\nNvidia and SpaceX were both down more than 6%, while Tesla shares fell more than 3% and Meta was down 3.4%.\nApple, Amazon and Microsoft experienced smaller falls, while Alphabet was up by 1.2%.\nEurope's main stock markets - which contain fewer tech stocks - also took a hit.\nGermany's Dax index closed down 2.6%, France's CAC 40 was down 1.9% and the UK's FTSE 100 ended trading 1% lower.\nEarlier on Friday, tech-heavy Asian markets saw steep falls.\nSouth Korea's Kospi and Japan's Nikkei 225 indexes closed down about 5%, with shares in memory chip makers Sk Hynix, Kioxia and Tokyo Electron, and other tech firms such as Samsung Electronics, seeing losses.\nTaiwan's stock market dropped about 6% on Friday, taking the weekly fall to more than 17% and what was reported to be its biggest weekly fall since 1990.",
    "bodyJa": "Anthropic shares fall after blockbuster opening as wider tech sell-off continues\n- Published\nAnthropic's shares have dropped back towards their initial price after a soaring first day on the stock market, as a wider tech sell-off deepens.\nThe fall in tech stocks continued to weigh on markets, with the S&P 500 down more than 2% and the Dow Jones Industrial Average down 0.7% by lunchtime.\nBoth US indexes touched correction territory, a point where they are trading at 10% or more down from a recent high.\nThe tech-heavy Nasdaq Composite Index also fell more than 3.4% by the middle of trading on Friday.\nThe speed at which AI investment has been growing - with more than $1 trillion spent in the last year alone by a small handful of major tech companies - has led to ongoing concerns of a financial bubble. Questions are being raised over whether those investments will pay off, and when.\nDespite a positive first day of trading, Anthropic's shares fell on Friday, dropping more than 12% to about $85 by lunchtime, close to its initial public offering (IPO) price of $83.\nThe artificial intelligence (AI) company's introduction to the Nasdaq stock exchange on Thursday was a crucial test for the industry and was largely seen as a success, with trading starting at $111.50.\nThe maker of the Claude chatbot raised a record $81bn in its initial public offering (IPO), but its share price moved significantly in the first day of trading.\nThe shares peaked at $115 on Thursday, before easing to end the day up 17% at $97.17.\nAnalysts said volatility was to be expected in the first days or even weeks of Anthropic's trading, as the company was the first frontier AI firm to go public so had no direct peers.\nSome have also noted the similarities with Elon Musk's SpaceX, which at the time of its debut in June was the largest IPO on record. Shares in the rocket and AI company experienced large swings in its first few weeks of trading.\nMost tech companies see their shares fall after hitting the stock market, often after reporting quarterly results for the first time.\nBut many, including Meta, Amazon and Google, have gone on to become the largest and most profitable corporations in the world.\nEd Moya, a strategist at market intelligence firm AlphaSense, said Anthropic's blockbuster IPO did not appear to have restored confidence in the broader AI market.\nWhile AI demand was still very strong, Moya told the BBC that investors were trying to answer the question of how much were they willing to pay for that growth.\n\"As we've gone through the past past few weeks, it seems that there's been more risks that have surfaced,\" he said.\n\"Right now you're starting to see Wall Street is trying to shift from rewarding growth at any price, to demanding stronger cash flow and a clearer path to profitability.\"\nShares in some of the largest US tech companies also fell on Friday.\nNvidia and SpaceX were both down more than 6%, while Tesla shares fell more than 3% and Meta was down 3.4%.\nApple, Amazon and Microsoft experienced smaller falls, while Alphabet was up by 1.2%.\nEurope's main stock markets - which contain fewer tech stocks - also took a hit.\nGermany's Dax index closed down 2.6%, France's CAC 40 was down 1.9% and the UK's FTSE 100 ended trading 1% lower.\nEarlier on Friday, tech-heavy Asian markets saw steep falls.\nSouth Korea's Kospi and Japan's Nikkei 225 indexes closed down about 5%, with shares in memory chip makers Sk Hynix, Kioxia and Tokyo Electron, and other tech firms such as Samsung Electronics, seeing losses.\nTaiwan's stock market dropped about 6% on Friday, taking the weekly fall to more than 17% and what was reported to be its biggest weekly fall since 1990.",

    "id": "a-massive-bearish-trade-just-happened-in-f11c23bf",
    "title": "A massive bearish trade just happened in the chip stocks",
    "titleJa": "A massive bearish trade just happened in the chip stocks",
    "summaryJa": "So much for buying the dip.As the S&P 500 entered correction territory and the Nasdaq-100 flirted with bear-market territory, down 19% from highs as of midday Friday, the single biggest options trade of the day was a near $100-million bet that the VanEck Semiconductor ETF (SMH) has a long way more to fall.",
    "bodyOriginal": "So much for buying the dip.\nAs the S&P 500 entered correction territory and the Nasdaq-100 flirted with bear-market territory, down 19% from highs as of midday Friday, the single biggest options trade of the day was a near $100-million bet that the VanEck Semiconductor ETF (SMH) has a long way more to fall.\nAround 12:30 E.T., someone spent $93 million buying 20,000 380-strike puts expiring Sep. 17, 2027, according to trading data reviewed by SpotGamma and Volland, options-analytics platforms that both show the trade as a likely opening position, with volume exceeding existing open interest in the contract. The trade bets that the index will fall below $380, a nearly 8% decline from its current level. The SMH is off 40% from its recent all-time highs.\n\"That trade stands out big-time,\" wrote Jason DeLorenzo, founder and owner of Volland. \"It is either a hedge or speculative, but either way it isn't a vote of confidence.\"\nThe puts were bought for $46.50 a piece, an arguably expensive choice for a downside bet with volatility in the ETF trading at 70.\n\"You're paying a metric ton of Vega for that thing,\" added SpotGamma's Brent Kochuba, referring to the contract's sensitivity to changes in volatility of the underlying chip ETF. \"Maybe they were a forced buyer, or maybe they're actually selling this, which can still be the case even though the price shows it happening closer to the ask.\"\nThe semiconductor index headed for a 9% drop this week alone.",
    "bodyJa": "So much for buying the dip.\nAs the S&P 500 entered correction territory and the Nasdaq-100 flirted with bear-market territory, down 19% from highs as of midday Friday, the single biggest options trade of the day was a near $100-million bet that the VanEck Semiconductor ETF (SMH) has a long way more to fall.\nAround 12:30 E.T., someone spent $93 million buying 20,000 380-strike puts expiring Sep. 17, 2027, according to trading data reviewed by SpotGamma and Volland, options-analytics platforms that both show the trade as a likely opening position, with volume exceeding existing open interest in the contract. The trade bets that the index will fall below $380, a nearly 8% decline from its current level. The SMH is off 40% from its recent all-time highs.\n\"That trade stands out big-time,\" wrote Jason DeLorenzo, founder and owner of Volland. \"It is either a hedge or speculative, but either way it isn't a vote of confidence.\"\nThe puts were bought for $46.50 a piece, an arguably expensive choice for a downside bet with volatility in the ETF trading at 70.\n\"You're paying a metric ton of Vega for that thing,\" added SpotGamma's Brent Kochuba, referring to the contract's sensitivity to changes in volatility of the underlying chip ETF. \"Maybe they were a forced buyer, or maybe they're actually selling this, which can still be the case even though the price shows it happening closer to the ask.\"\nThe semiconductor index headed for a 9% drop this week alone.",

    "title": "Trump vows to stop U.S. companies from building data centers abroad, threatens 'tremendous tax'",
    "titleJa": "Trump vows to stop U.S. companies from building data centers abroad, threatens 'tremendous tax'",
    "summaryJa": "Trump spoke at the White House after meeting with Chinese President Xi Jinping and Russian President Vladimir Putin for a historic trilateral summit in China.",
    "bodyOriginal": "President Donald Trump on Friday said U.S. companies will be banned from building data centers in other countries and will face a \"tremendous tax\" penalty if they do so.\n\"We're going to fight very hard for the data centers,\" Trump said at a White House press conference before announcing the new policy — which apparently came as news to his own staff.\n\"I don't know if that's a breaking story,\" Trump said. \"I haven't even said that to my people. But I'm telling them now they're here.\"\nTrump's latest push for more data-center construction in the U.S. came despite Americans repeatedly stating — and showing with their votes — that they dislike the structures.\nCNBC's All-America Economic Survey found that 64% of registered voters opposed an AI data center within 10 miles of their home, while just 13% of respondents said they would support one.\nIf Trump follows through on his threat to clamp down on overseas data center construction, he will have to contend with the fact that numerous U.S. tech giants — including Alphabet, Amazon, Microsoft, Meta and Oracle — have already built them in other countries.\nInternational expansion represents a growth opportunity for the top cloud infrastructure providers, which want to serve clients from data centers that are nearby, sometimes to meet regulatory requirements.\nTrump said Friday, however, that if companies want to continue building the centers outside the U.S., \"they can, but we're going to put a tremendous tax on them.\"\n\"We have a lot of places that want them badly, and they're great places. They have energy, and they have everything. They're tremendous assets,\" Trump said.\nThe remarks came a day after Trump met with Chinese President Xi Jinping and Russian President Vladimir Putin in China for a trilateral summit that appeared to produce few concrete deliverables on an array of pressing global issues.\nXi \"congratulated me on how well we're doing\" in artificial intelligence, Trump said, using his preferred term \"super intelligence,\" which he said the Chinese president also likes better.\nThis is breaking news. Please refresh for updates.\n— CNBC's Jordan Novet contributed reporting.",

ng his preferred term \"super intelligence,\" which he said the Chinese president also likes better.\nThis is breaking news. Please refresh for updates.\n— CNBC's Jordan Novet contributed reporting.",

    "summaryJa": "The UK-EU deal agreed on Friday covers British food exports, emissions trading and a youth experience scheme.",
    "bodyOriginal": "UK to explore even closer ties with EU after agreeing deal, says Burnham\n- Published\nAndy Burnham said the UK will discuss possible options for even closer ties with the EU, after agreeing a deal covering British food exports, emissions trading and a youth experience scheme.\nThe prime minister said it was a \"good day\" for Britain and Europe, adding the Treasury believes the deal could boost the UK economy by up to £17bn a year.\nEuropean Council President António Costa said the EU remains \"open to have the closest possible relationship\" with the UK.\nConservative leader Kemi Badenoch said the deal \"isn't fair\" - and Reform's Nigel Farage called it a \"betrayal of the British people\".\nLegislation to implement the deal is expected to be introduced in the UK Parliament next week.\nBurnham arrived in Brussels to finalise the latest stage of the government's post-Brexit \"reset\" of relations with the EU, which originally began under former prime minister Sir Keir Starmer.\nThe agreements announced on Friday included scrapping most of the checks on British food exports, in return for the UK following some EU regulations, from 2028.\nThe UK government believes the changes will cut costs for businesses and could bring prices down for shoppers, while critics argue the change will make the UK a \"rule taker\" from Brussels rather than a rule maker.\nThe new youth experience scheme will allow up to 100,000 18 to 31 year olds from the EU to travel, work and study in the UK for up to three years. The same number of young Britons will be allowed into Europe.\nThe two sides want to ensure that opportunities under the annual scheme will be available to young people by no later than January 2030.\nA further six months is available to discuss a deal on tuition fees, which could prove to be a potential stumbling block.\nThere have been calls from the European side for fees to be reduced for EU students at British universities. The joint statement says any agreement would also be for UK students in the EU.\nBurnham gets his first taste of EU dealmaking and seems hungry for more\n- Published14 hours ago\nWhat is the EU-UK youth experience scheme and when will it start?\n- Published14 hours ago\nFaisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow\n- Published14 hours ago\nEuropean Commission President Ursula von der Leyen said she is \"confident\" a solution will be found, with Burnham adding: \"Me too.\"\nOn immigration, the UK and EU have committed to working closely to tackle migrant smuggling and human trafficking. They also expect their law enforcement agencies to share more data.\nBurnham said \"significant progress\" has been made to help \"disrupt the gangs who are making those dangerous crossings across the English Channel\".\nThe UK-EU statement also said talks on linking the EU and UK emissions trading systems have concluded and they aim to apply the agreement from 2028.\n'Brainstorming process'\nBurnham argued that polling suggests the UK public \"want closer ties\" with the EU and the deal \"delivers that\".\nHe added: \"Beyond that we do need to consider what is the right long-term relationship. Incremental steps only take us so far.\"\nThe prime minister said his government will publish a 10-year plan next month, adding it will set out its ambitions for reindustrialisation, growth in \"all parts of Britain\" and opportunities for young people.\nBurnham said these ambitions are \"connected to our long-term relationship with our nearest partner\".\nHe said over the coming months before the next UK-EU summit both sides will \"seek to conduct an informal brainstorming process\" to look at what those options are.\nBurnham added: \"What we are announcing today is probably the limit of what we can achieve in this Parliament, given what needs to be done to implement it.\n\"But we want to inform the Parliament after this one, so that decisions can be taken about that long-term relationship.\"\nLabour's 2024 general election manifesto pledged there would be \"no return to the single market, the customs union, or freedom of movement\", and Burnham has committed to this.\nThe prime minister said the \"British people will be the boss of what happens next\", with the next election needing to be held by August 2029.\nVon der Leyen, who said the summit was a \"turning point\" for the EU-UK relationship, said \"we are open for brainstorming\".\n'Endless betrayal'\nBadenoch said the deal was not fair because UK farmers would now have to follow rules made by Brussels and more young people will come to the UK to \"compete with our young people who are struggling to get jobs\".\nBadenoch was also asked about the Treasury's analysis, which Burnham said suggested the deal \"will add up to 0.5%\" to UK gross domestic product and he described it as a \"£17bn boost to the British economy\".\nShe claimed Burnham has \"plucked that figure out of the air\" and \"the only modelling I've seen that even talks about that figure says it's actually 0.0%\".\nFarage said Friday was a \"very good day for the EU\", adding: \"A good day to try and humiliate the one member state that actually had the courage to say, 'We don't need to be part of you, we can govern our own country'.\"\nIn a social media post, Farage, who was a leading figure in the 2016 campaign to get Britain out of the EU, added: \"Like every prime minister before him, Burnham is a total fraud. Only Reform will stop the endless betrayal of the British people.\"\nLiberal Democrat leader Sir Ed Davey said there needed to be more than \"tweaks\" to the UK's relationship to the EU.\n\"A youth mobility scheme is a big step forward, but it's nowhere near enough. We need a whole new deal that actually works for Britain, and fast.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.\nRelated topics\n- Published12 November",

    "title": "Faisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow",
    "titleJa": "Faisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow",
    "summaryJa": "The trade deal is unlikely lower food prices for shoppers, but should boost the economy more than other post-Brexit agreements.",
    "bodyOriginal": "Faisal Islam: This cost-cutting UK-EU deal doesn't mean lower prices will follow\n- Published\nThe prime minister made a lot of the UK's new deal with the EU cutting costs for business and consumers during tough times.\nIn another world, Andy Burnham would have loved for the nation's supermarkets to clearly announce that they could cut food prices as a result of this latest agreement on food exports.\nAnd while grocers have very much welcomed Friday's announcement, they have notably not committed to price cuts as a direct result of this move.\nThe managing director of M&S, Alex Freudmann, called the deal a \"major step forward\", saying it would remove bureaucracy. Tesco chief executive Ken Murphy added it was \"good news for British farmers and producers\".\nFreudmann highlighted some of hoops that were hurting UK-EU trade, using the example that \"getting our spaghetti Bolognese from Lincolnshire onto a shelf in Dublin takes hundreds of extra miles, mountains of paperwork, a vet's signature and even the Latin name of a cow\".\nSuch measures will no longer need to be taken once this deal kicks in. Good news for business exports then, but will that lead to lower shopping bills here in the UK?\nThis deal will matter for food exporters - it may not have a clear visible impact at the checkout.\nPrivately, industry insiders say there are too many moving parts in the world economy, especially given the energy price shock resulting from war in the Middle East.\nIt is more a hope than will at this stage. The industry and government hope that the reduction in costs for food producers and sellers will be passed on to customers.\nThis is not the first time Labour has sought to reduce the weekly shop costs. Sir Keir Starmer's administration floated the idea that supermarkets might even offer some form of branded discounts, a suggestion that was met with collective bemusement by those in the industry.\nHowever, there will be less paperwork, checks and red tape on food imports too, but they were already lightly enforced.\nNo longer will hundreds of pages of documents be required. No longer will perishable goods lose valuable hours or days at border checks. No longer will the incorrect colour of ink or Latin name for a meat disallow a shipment of British exports.\nSome, though not all of the 24% hit since 2019 to the real value of agrifood exports, could be regained by a bonfire of this red tape.\nIn particular, smaller exporters of food will be able to return to the large EU market.\nBut the extra benefit here is unclear, and there could be extra checks and costs required instead on non-EU food imports.\nThe government's own assessment is that the economy will gain £5bn through this, or 0.14% by 2040.\nCritics point out that this benefit does not include the quid pro quo - having to align with EU laws. Farmers have pointed to compliance with pesticides and fungicide regulation.\nThe classic example of the benefits of post-Brexit autonomy has been the development of precision-bred foodstuffs, such as Vitamin D-enhanced tomatoes.\nThe producer of this technology has, however, backed the deal after the government negotiated an \"exception period\" for ongoing UK sale.\nProfessor Cristobal Uauy of the John Innes Centre said that \"aligning with the EU market will bring our science to a greater number of people\".\nBringing all the agreements on food, emissions and the youth experience together, the economy is forecast to get an overall boost of 0.5%, or £17bn a year.\nA modest boost, but high by the standards of past post-Brexit trade deals, for example, with Australia, India or Japan and the Gulf and the trans-pacific deal.\nThis UK-EU pact actually matches all of those agreements combined for expected growth measured by the Treasury's own assessments.\nThe biggest single boost to the overall economy would come from more European young workers. However, the economy benefit of this part of the deal per person reduces to zero, according to the government's own calculations.\nBurham also said he hoped a planned electricity deal with the EU would cut bills, but that has not been done yet, and requires a contribution into the bloc's budget for poorer regions.\nThe electricity deal could help lower bills, but that contains a clear trade-off.\nThere are still some details to be revealed in the full legal texts of these documents.\nThe bigger point is whether this logic of gaining free-flowing access for food, in exchange for giving up regulatory freedom, will now apply elsewhere.\nIs food now a blueprint for future negotiations? It had been the Starmer-Rachel Reeves strategy to spread this model to other sectors such as cars, and chemicals.\nThe big takeaway from today was that both the PM and his counterparts publicly acknowledged the end of the incremental piecemeal approach to aligning with the single market.\nThe question is whether the PM thinks what goes for food applies across the whole economy. Most economists predict that could lead to much bigger economic gains, but it will also be a much bigger constitutional battle.",

cording to the government's own calculations.\nBurham also said he hoped a planned electricity deal with the EU would cut bills, but that has not been done yet, and requires a contribution into the bloc's budget for poorer regions.\nThe electricity deal could help lower bills, but that contains a clear trade-off.\nThere are still some details to be revealed in the full legal texts of these documents.\nThe bigger point is whether this logic of gaining free-flowing access for food, in exchange for giving up regulatory freedom, will now apply elsewhere.\nIs food now a blueprint for future negotiations? It had been the Starmer-Rachel Reeves strategy to spread this model to other sectors such as cars, and chemicals.\nThe big takeaway from today was that both the PM and his counterparts publicly acknowledged the end of the incremental piecemeal approach to aligning with the single market.\nThe question is whether the PM thinks what goes for food applies across the whole economy. Most economists predict that could lead to much bigger economic gains, but it will also be a much bigger constitutional battle.",

    "titleJa": "The bull market has a new problem. The 'smart money' is selling",
    "summaryJa": "Companies are shifting from share buybacks to stock issuance, adding new supply. Anthropic’s $81 billion IPO puts that demand to the test.",
    "bodyOriginal": "Companies have shifted from buying back shares to issuing them, adding to the supply that the four-year-old bull market must absorb.\n\"No matter how you measure it, U.S. corporations have changed their behavior over the past two years, switching from repurchasing in 2024 to issuing today,\" Acadian Asset Management portfolio manager Owen Lamont wrote in a letter to investors this month. \"The question you should be asking is: Why is the smart money selling?\"\nAs of late last week, net new issuance of shares equaled 3.1% of total market capitalization, according to a recent Acadian analysis. While net issuance remains below the peaks during the tech bubble and the covid bubble, the analysis shows that the era of repurchases has ended and an era of equity issuance has begun.\nAnd more supply came to the market this week with Anthropic's blockbuster IPO. The offering drew strong enthusiasm initially with the frontier AI laboratory selling shares in its IPO at $83 each, above the expected range and raising $81 billion. But the stock is falling on Friday and taking the broader stock market with it.\nSome investors for years have cited the shrinking stock market as a reason why share prices can keep increasing. As companies repurchased stock, it shrunk the number of shares available for trading and so it helped boost prices. There was more money chasing fewer shares. Not to mention, it had the effect of boosting earnings per share by lowering the denominator in that ratio. Now that trend has reversed with increased supply acting as a potential headwind on the bull market.\nA 2000 paper by Malcolm Baker and Jeffrey Wurgler found that when companies issued more equity over debt, low market returns followed, suggesting that managers timed the market when issuing securities. The Baker-Wurgler equity share, which measures equity issuance as a share of total stock and bond issuance, peaked at about 18% in 2021. It has risen in recent months but remains below that peak, Lamont wrote.\nThe Federal Reserve data show a similar trend in the year-over-year change in trailing 12-month gross stock and bond issuance. Debt gross issuance rose first in 2020, followed by equity issuance in 2021. More recently, debt issuance began climbing in 2024, followed by a surge in equity issuance in 2026.\nRecent deals show companies tapping equity markets in different ways.\nOracle filed to sell $20 billion in stock through an at-the-market program and issued another $10 billion in common shares in November. In October, Meta priced a $25 billion common-stock offering and $12.5 billion in mandatory convertible preferred shares. Alphabet announced an $84.8 billion equity raise in June to help fund its AI infrastructure buildout. SpaceX raised $85.7 billion in its June IPO after underwriters exercised their overallotment.\n\"Before 2026, firms were net repurchasers of equity, consistent with the idea that they viewed their shares as undervalued. Today, for whatever reason, firms are issuing equity on net,\" Lamont wrote.\nThe investor said he cannot rule out that we are in an AI bubble now.",

at peak, Lamont wrote.\nThe Federal Reserve data show a similar trend in the year-over-year change in trailing 12-month gross stock and bond issuance. Debt gross issuance rose first in 2020, followed by equity issuance in 2021. More recently, debt issuance began climbing in 2024, followed by a surge in equity issuance in 2026.\nRecent deals show companies tapping equity markets in different ways.\nOracle filed to sell $20 billion in stock through an at-the-market program and issued another $10 billion in common shares in November. In October, Meta priced a $25 billion common-stock offering and $12.5 billion in mandatory convertible preferred shares. Alphabet announced an $84.8 billion equity raise in June to help fund its AI infrastructure buildout. SpaceX raised $85.7 billion in its June IPO after underwriters exercised their overallotment.\n\"Before 2026, firms were net repurchasers of equity, consistent with the idea that they viewed their shares as undervalued. Today, for whatever reason, firms are issuing equity on net,\" Lamont wrote.\nThe investor said he cannot rule out that we are in an AI bubble now.",

    "id": "tinned-food-and-long-life-milk-boost-ret-7e7083b5",
    "title": "Tinned food and long-life milk boost retail sales after 'Be Ready' campaign launch",
    "titleJa": "Tinned food and long-life milk boost retail sales after 'Be Ready' campaign launch",
    "summaryJa": "People stocking up on long-life food drove retail sales higher October, according to official data.",
    "bodyOriginal": "Tinned food and long-life milk boost retail sales after 'Be Ready' campaign launch\n- Published\nRetail sales rose in October, driven by people buying long-life food such as tinned goods and UHT milk, according to official figures.\nSales volumes were 0.7% higher as people responded to the government's emergency preparedness \"Be Ready\" campaign, the Office for National Statistics (ONS) said.\nThe campaign encouraged people to stock up in case of disruption to essential services by severe weather or cyberattacks.\nSeparate research released last week suggested that while households were stockpiling essentials, they were not panic buying.\nThe government campaign encouraged people to keep three days' worth of food and water in their homes.\nWet wipes, a torch and cash were also recommended.\nData from retail research firm Worldpanel by Numerator indicated last week that people were stocking up on items including tinned meat, bottled water and hand sanitiser.\nThe latest official sales figures, external from the ONS add to the evidence that the public has begun stockpiling.\n\"Supermarkets have told us that sales of long-life food items such as tinned food and UHT milk were boosted by the government's 'Be Ready' campaign,\" ONS chief economist Grant Fitzner said.\n\"Meanwhile fuel sales have been recovering from earlier low levels, despite pump prices rising again.\"\nThe rise in retail sales last month beat some economists' expectations - they had predicted a slight fall - and the increase came after a 0.6% decline in September.\nAs well as sales being boosted by people buying essentials, visits to art galleries and clothing purchases were also higher in October.\nThe boost in sales comes at the beginning of the festive period, which is normally the busiest time of the year for retailers.\nJacqui Baker, partner and head of retail at auditing firm RSM UK, said that \"retailers will want to see out the year with some Christmas cheer before consumers batten down the hatches in the New Year as energy costs skyrocket and inflation ramps up further\".\nTypical energy bills are forecast to go up by £443 per year from January, pushing up the pace of price rises.\nSales of tinned food and bottled water jump after 'Be Ready' campaign launch\n- Published10 November\nWhy should I stockpile and what will I need?\n- Published23 October\nSeparate economic data released on Friday showed the government borrowed slightly less than economists had expected in October.\nBorrowing - the difference between public sector spending and income - was £17bn last month, the ONS said., external\nAlthough that was £0.8bn higher than October last year, it was below analysts' forecasts of about £18bn.\nInterest repayments were £11.2bn - the highest October debt interest figure on record - and £2.8bn more than a year ago.\nThese repayments have been pushed up by higher inflation, as payments on index-linked government bonds are linked to the inflation rate.\nInflation rose to 3.6% in October, mainly because of higher petrol and diesel prices. The rate has been rising in recent months as the Iran war has driven up the cost of energy and fuel.\nGet in touch\nDo you have any views, comments or questions about this story?",
    "bodyJa": "Tinned food and long-life milk boost retail sales after 'Be Ready' campaign launch\n- Published\nRetail sales rose in October, driven by people buying long-life food such as tinned goods and UHT milk, according to official figures.\nSales volumes were 0.7% higher as people responded to the government's emergency preparedness \"Be Ready\" campaign, the Office for National Statistics (ONS) said.\nThe campaign encouraged people to stock up in case of disruption to essential services by severe weather or cyberattacks.\nSeparate research released last week suggested that while households were stockpiling essentials, they were not panic buying.\nThe government campaign encouraged people to keep three days' worth of food and water in their homes.\nWet wipes, a torch and cash were also recommended.\nData from retail research firm Worldpanel by Numerator indicated last week that people were stocking up on items including tinned meat, bottled water and hand sanitiser.\nThe latest official sales figures, external from the ONS add to the evidence that the public has begun stockpiling.\n\"Supermarkets have told us that sales of long-life food items such as tinned food and UHT milk were boosted by the government's 'Be Ready' campaign,\" ONS chief economist Grant Fitzner said.\n\"Meanwhile fuel sales have been recovering from earlier low levels, despite pump prices rising again.\"\nThe rise in retail sales last month beat some economists' expectations - they had predicted a slight fall - and the increase came after a 0.6% decline in September.\nAs well as sales being boosted by people buying essentials, visits to art galleries and clothing purchases were also higher in October.\nThe boost in sales comes at the beginning of the festive period, which is normally the busiest time of the year for retailers.\nJacqui Baker, partner and head of retail at auditing firm RSM UK, said that \"retailers will want to see out the year with some Christmas cheer before consumers batten down the hatches in the New Year as energy costs skyrocket and inflation ramps up further\".\nTypical energy bills are forecast to go up by £443 per year from January, pushing up the pace of price rises.\nSales of tinned food and bottled water jump after 'Be Ready' campaign launch\n- Published10 November\nWhy should I stockpile and what will I need?\n- Published23 October\nSeparate economic data released on Friday showed the government borrowed slightly less than economists had expected in October.\nBorrowing - the difference between public sector spending and income - was £17bn last month, the ONS said., external\nAlthough that was £0.8bn higher than October last year, it was below analysts' forecasts of about £18bn.\nInterest repayments were £11.2bn - the highest October debt interest figure on record - and £2.8bn more than a year ago.\nThese repayments have been pushed up by higher inflation, as payments on index-linked government bonds are linked to the inflation rate.\nInflation rose to 3.6% in October, mainly because of higher petrol and diesel prices. The rate has been rising in recent months as the Iran war has driven up the cost of energy and fuel.\nGet in touch\nDo you have any views, comments or questions about this story?",

    "titleJa": "Should AI be judging our credit worthiness?",
    "summaryJa": "Would AI be a good judge of whether you should get a mortgage, car loan or mobile phone contract?",
    "bodyOriginal": "Should AI be judging our credit worthiness?\n- Published\nGetting approval for a mortgage, a car loan or even a mobile phone contract can rest on a credit score.\nSophie Hope was on the sharp end of just such a decision.\n\"When I first checked my credit score, it was excellent. But then my mortgage application was suddenly denied by the lender because of my credit report. It was a massive shock as I'd never had bad credit. When I looked into it, my score had gone to 'very poor',\" she says.\nIt turns out, the Brighton-based nail technician and content creator, had been the victim of identity fraud.\n\"Someone had opened accounts in my name across various catalogue sites and ordered multiple items, including a PlayStation 4 and Nike socks,\" she says.\n\"Without me knowing, the debt was transferred to a secondary finance company. It spent three to four years accumulating in the background. It was only when I went to apply for a mortgage that I discovered how severely it had dragged down my credit score,\" she says.\nHope's experience shows how crucial a credit score can be, but, as in her case, it does not tell the full story.\n\"As a nation, we are overly obsessed with credit scores,\" says Funmi Olufunwa, a consumer finance lawyer and founder of financial education business, Hoops Finance.\nThree firms - Experian, Equifax and TransUnion - produce credit scores in the UK, and they all work from roughly the same data.\n\"A credit score is backward looking. It's looking at what has happened in the past, which doesn't necessarily predict the future,\" says Olufunwa.\n\"But when somebody's looking to lend you money, they're looking at what actually is affordable,\" she says.\nTraditional credit scoring systems also disadvantage \"thin-file applicants\" - young people and recent immigrants to the UK who won't have built up a credit history.\nBut with more financial data available than ever before - and a growing appetite for AI to make sense of it - could artificial intelligence help lenders work out who is safe to lend to?\nIn the US lending decisions will often hinge on a credit score from a company called FICO, which uses data from the big three credit assessment firms.\nBut AI-powered lending firms, Upstart and Zest AI have both built businesses which offer lenders an extra option when it comes to assessing a client's credit worthiness.\n\"Thanks to our machine-learning models that look at more than 2,500 variables, we believe we can make significantly more loans at low prices to borrowers from every demographic group,\" Upstart said in statement.\nMortgage expert and founder and CEO of The Mortgage Mum, Sarah Tucker says: \"AI has the potential to help lenders analyse much broader sets of information, identify patterns more quickly and build a more individual picture of someone's affordability and risk.\"\nIf technology allows lenders to understand so-called thin-file applicants better, rather than simply applying increasingly rigid rules, Tucker believes there is \"a real opportunity to improve financial inclusion\".\nBut like with many other applications of AI into everyday life, there are concerns.\n\"Consumers need to understand what information is being used to make decisions about them, and they need to be able to challenge something when it is wrong,\" Tucker explains.\nCredit scores have been a contentious topic for decades for this very reason, says Sandra Wachter, professor of Technology and Regulation at the University of Oxford.\n\"We are not assessing if past decisions were right,\" Wachter argues, adding, AI does not know about existing social inequalities that impact decisions and could just \"replicate what it has seen in the past\".\nWhile companies like Upstart and Zest AI see technology as a tool for financial inclusion, Wachter believes that real transformation requires accountability, as well as automation.\nShe stresses that firms must apply existing regulations and establish new guardrails to ensure that AI does not simply perpetuate the biases of the past.\n\"Not putting any safeguards in place will fortify, foster, and enhance discrimination.\"\nUpstart says it is tackling that issue.\n\"We've invested in creating objective, automated evaluations to identify bias, and we've incorporated those evaluations into our model training process so it evolves to become even more accurate and more fair over time,\" the company said in a statement.\nEvangeline Atkinson had a frustrating experience over her credit score.\n\"I was at university, paying rent, paying bills, as I had been doing for many years. I tried to get a £30-a-month phone contract, and they said no,\" she recalls.\n\"When I dug into it, it was because I was completely invisible to the system. No record could be found for me at any of the big three credit reference agencies.\"\nThat experience inspired her to try to change the system.\nIn 2021, Atkinson founded a credit reference agency with her best-friend from school, who had also experienced difficulties getting credit.\nTheir firm, Noggin HQ, was authorised by the FCA in June. Atkinson explains it was set up to help consumers access affordable credit by analysing their current account transactional data.\nThe platform helps lenders interpret thousands of individual data points about a person's spending habits.\nCrucially, it does this without using AI, which Atkinson has also argued \"carries the risk of inbuilt bias\".\n\"You have to be very careful\", she warns. \"It's very sensitive data and it would be very easy for the models to be inferring various kind of protected characteristics.\"\nPerhaps conscious of change, the big three credit scoring firms have all started experimenting with AI.\nExperian announced a partnership with OpenAI in August 2026, letting users check their credit score inside ChatGPT. Equifax launched a platform called Equifax Amplify AI, which it says uses machine learning to sharpen credit assessment and fraud detection.\nMeanwhile, in March TransUnion announced it was integrating Google's Gemini models \"within its proprietary analytic data assets\".\nAs for the future of credit scoring, companies are starting to look beyond traditional methods, according to consumer finance lawyer Funmi Olufunwa.\n\"They are beginning to realise that traditional credit scoring is inherently backward-looking, and that there are better predictors of the future out there.\"\nWhether consumers will be happy with AI playing a part in working out their future credit ratings is another thing.\nAny change might be led by the younger, tech-savvy generation.\n\"They feel comfortable with their data being used this way, simply because it's the world they've grown up in.\n\"I wonder if older cohorts, who may not use technology as much, will be quite as comfortable with it,\" says Olufunwa.\nTechnology of Business\n- Published25 September\n- Published1 October\n- Published30 September",

tection.\nMeanwhile, in March TransUnion announced it was integrating Google's Gemini models \"within its proprietary analytic data assets\".\nAs for the future of credit scoring, companies are starting to look beyond traditional methods, according to consumer finance lawyer Funmi Olufunwa.\n\"They are beginning to realise that traditional credit scoring is inherently backward-looking, and that there are better predictors of the future out there.\"\nWhether consumers will be happy with AI playing a part in working out their future credit ratings is another thing.\nAny change might be led by the younger, tech-savvy generation.\n\"They feel comfortable with their data being used this way, simply because it's the world they've grown up in.\n\"I wonder if older cohorts, who may not use technology as much, will be quite as comfortable with it,\" says Olufunwa.\nTechnology of Business\n- Published25 September\n- Published1 October\n- Published30 September",

    "id": "mouldy-infested-housing-for-vulnerable-p-8e85df23",
    "title": "Mouldy, infested housing for vulnerable people sold as ethical investments abroad",
    "titleJa": "Mouldy, infested housing for vulnerable people sold as ethical investments abroad",
    "summaryJa": "The properties are marketed at premium prices with claims of “government-backed” returns, the BBC finds.",
    "bodyOriginal": "Mouldy, infested housing for vulnerable people sold as ethical investments abroad\n- Published\n\"This building is hell on Earth,\" says Phil, describing the black mould and rats at Castleview House, the block of flats in Runcorn, Cheshire, where he lives.\nBut to an estate agent called Britské Reality - which translates as British Real Estate - working with investors hundreds of miles away in the Czech Republic, the flat Phil rents through his benefits was an exciting business opportunity.\nThe estate agent's marketing material said the flat was a government-funded source of income for investors, where tenants were taken care of and the property was in excellent condition.\nA Czech investor bought it last year for £163,150, more than double the £75,000 cost of similar apartments in the block.\nThe BBC has found more than 40 companies marketing similar properties to individuals in the UK and abroad, as businesses seek to profit from a government system intended to provide housing and support for vulnerable people.\nAbout a dozen of these companies work with a property developer called Lee Jones, whose company sold Phil's flat.\nThe homes they are selling to investors are advertised as supported accommodation, a type of housing for people with issues including mental health problems or drug abuse issues, as well as people fleeing domestic violence.\nProviders offering what is known as supported exempt accommodation are allowed to charge the taxpayer more than the usual housing benefit cap, because they have higher running costs. Tenants are entitled to care, support and supervision - although how much support should be provided is not defined.\nWhile there are legitimate providers helping people back into independent living, the BBC has previously reported on how some are exploiting the system by taking the higher housing benefit payments but failing to provide support.\nOur latest investigation found companies marketing supported housing properties to people in Hong Kong, Macau, Nigeria, Turkey, the Netherlands, the UK and other countries as a \"secure\", \"government-backed\" investment.\nWe also found adverts made misleading promises about the quality of the accommodation and support, with tenants saying they were receiving little or no care, while we observed examples of poor quality, unsafe accommodation.\nHousing charities and experts have told the BBC the sector has been transformed into a profit-generating machine at the expense of some tenants' safety, care, and dignity.\nLabour MP Abena Oppong-Asare, who chairs the Housing Select Committee, said it was \"outrageous\" that supported housing properties were being marketed as investments \"particularly where there's public funds involved\".\nThe BBC's findings were \"alarming\" and showed a sector \"open to abuse\", she added.\n'Total dishonesty' in marketing\nLee Jones's company The Investment Room converted Castleview House in 2019 from an office block into more than 200 residential flats, including the one where Phil now lives.\nThen Jones partnered with Nurture Housing Association. His company granted Nurture a 25-year-lease on some of the flats, to provide housing for people on government benefits. Jones has a close business relationship with Nurture's chief executive Chris Smith, with the pair also acting as joint directors of other housing companies.\nJones then worked with estate agents, which marketed the housing to investors in the UK and overseas using the regular cashflow generated by the 25-year lease with Nurture and the promise of government funding to justify inflated prices.\nLee Jones and Nurture have repeated this with property developments across England, including in Doncaster, Rotherham, Stockton-on-Tees and Bradford. These type of properties are also in Scotland, Wales and Northern Ireland but are funded and regulated differently.\nBecause neither profit-making private companies nor individuals can act as supported housing providers themselves, co-operation between developers, investors and publicly funded providers has become common.\nThe Czech marketing material found by the BBC said Nurture provides housing for people with mental health issues who receive the \"aftercare program pursuant to Section 117 of the Mental Health Act\", meaning they have been sectioned and discharged from hospital with a detailed care plan.\nBut Phil says he has never been sectioned under the Mental Health Act.\nHe does have severe depression and anxiety, and he is currently out of work. But he says he has never had any support or care, or met anyone working for Nurture during his time at the flat.\n\"Whoever marketed this property, the way they've worded it is total dishonesty,\" says Phil. \"If they're looking to make as much profit as they can, then they clearly have no plans to fix the issues in the building.\"\nPhil had no idea the flat he rents had been sold to overseas investors in May 2025 until the BBC contacted him. But there were clues: bills addressed to someone called Jan Hála had been coming through the letterbox for months.\nLee Jones told us that the properties his companies provide are \"good quality accommodation\" and he has no responsibility for the communal areas of Castleview House since he sold the freehold in 2021. He denied his relationship with Chris Smith amounted to a conflict of interest, but did not respond to questions about his role in marketing the properties.\nJan Hála, the Czech investor who now owns Phil's flat, and the Britské Reality estate agency did not respond to requests for comment.\nWe spoke to several other people living in flats run by Nurture Housing Association in Castleview House who said they were in supported accommodation. They reported receiving little or no help from Nurture but were afraid to speak out publicly for fear of eviction and becoming homeless.\nThere is also evidence that marketing materials for investors buying flats in Castleview were misleading. Investors were told Nurture was providing \"specialist supported housing\" - a claim which is repeated on its website.\nAccording to the Regulator of Social Housing, this would mean it was providing a high level of care, equivalent to living in a care home.\nBut Nurture had not been registered as a specialised supported housing provider, the regulator said, and its claim to be providing this was \"shocking\".\nIn a statement, Nurture acknowledged that Castleview House is managed under a \"general housing management model\" and does not form part of its supported housing portfolio. It said it provided supported housing elsewhere through partners which were registered providers.\nIt said the Czech advert found by the BBC related to \"historic marketing material\" produced by third parties.\nHowever, the BBC has seen marketing material from several other agents selling flats in Castleview House to investors, which also claim that Nurture is providing supported housing to the residents on a 25-year lease.\nNurture said it is not directly involved with the companies marketing the properties. But it said: \"We will be reviewing communications with relevant agents and reminding them of the importance of ensuring that any information relating to Nurture is accurate, transparent and does not create misunderstanding regarding the accommodation or services provided.\"\n'No-one is directly accountable'\nWhile there are doubts about what kind of housing Nurture has been providing, the BBC also found other flats sold to investors overseas with tenants who were in supported exempt accommodation.\nThe web of companies involved in providing this housing and cross-border ownership means it can be difficult for vulnerable tenants to get help when there are problems with properties.\n\"The way that the current system works is there's different levels of involvement by different organisations and companies and no-one is directly accountable,\" Abena Oppong-Asare, the housing committee chairwoman, told us.\nMo, who has mental health issues, was housed in a studio flat in Cricklewood, north London, after he became homeless. The converted house containing his flat was bought by Gemelli London 2 Limited, a company run by French nationals living in the Czech Republic, for £1.83m in January last year.\nHe says his supported housing provider, Windrush Alliance, receives nearly £2,000 a month via Barnet Council for the flat. Mo says he receives £340 in universal credit for living expenses every month - but he is expected to pay Windrush a monthly £120 service charge out of that.\nLast year his ceiling collapsed after a leak went unrepaired for more than a year and Mo was temporarily housed in another flat in the property.\nMo says his weekly visits from a Windrush support worker feel like a tick-box exercise and do not help him with the mental health issues which have been keeping him out of work.\nGemelli's director Stephane Boussier told the BBC that when the company bought the property \"no complaints from residents were disclosed\". It was made aware of issues in August 2025, he said, and since then has \"raised them with Windrush in writing, inspected the property and pressed for them to be resolved\".\nHe added that Gemelli London 2 Limited receives about £1,365 per flat per month from Windrush and does not receive any of the extra housing benefit that would be used for vulnerable tenants.\nWindrush said it was aware of issues at Mo's property and was \"working with the building owner to put them right\". According to Gemelli, the ceiling was repaired after the BBC contacted the two companies.\nWindrush has previously been criticised by the Regulator for Social Housing for a \"failure to meet the standards\" of the regulator, including failing to ensure \"tenants are safe in their homes\".\nIt acknowledged that it \"fell short in the past\". It wrote off £1.8m in \"funds to former directors and companies under their control\", saying the company's financial position had been \"compromised\" by their actions. The company now has a new board in place.\nWindrush told us its \"priority is residents, not investors\" and the rates it charges \"are agreed with the relevant local authorities\" and \"any surplus is reinvested in our homes and services\".\n'The worst kind of exploitation'\nIn Bradford, the BBC visited City Exchange and Colonnade House, two former office blocks which Lee Jones has converted into housing - with Nurture Housing Association managing many of the flats.\nMany of the properties there were advertised as supported housing investments. Residents showed us cockroach infestations, faulty fire alarms, broken lifts, leaks through the ceiling and black mould.\nNurture Housing said it was only responsible for the individual homes that it manages and does not manage communal areas or \"wider building infrastructure\".\n\"Nurture Housing and its managing agents regularly raise these concerns with the block manager,\" the company said.\nThe freeholder for Phil's block, Castleview House, and City Exchange, blamed \"defects\" by the developer Lee Jones for the problems with the buildings and said it was taking legal action. Colonnade House has had several building management companies in recent years and the latest said it was addressing the problems.\nNone of these companies or individuals are breaking the law, but critics say they are exploiting a lack of regulation in the sector.\nThree years after the Supported Housing Act was passed in England, which would put in place a licensing regime for supported housing providers and give local councils more powers to shut down providers that failed to meet the standards, it still has not been implemented.\n\"It's taken too long,\" said Jasmine Basran, head of policy and campaigns at housing charity Crisis. \"In the meantime, this an area where we've seen the worst kind of exploitation.\"\nAdditional reporting by Lorna Acquah and Abi Smitton\nGet in touch\nHave you been affected by issues covered in this story? Share your experiences.",
