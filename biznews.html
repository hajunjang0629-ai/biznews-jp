    "summaryJa": "Nike announced earlier this month that it's expanding into India. The retailer has been broadly struggling, especially in the China market.",
    "bodyOriginal": "Nike is making a big bet on India.\nThe retailer, which has been struggling to revive its business and regain momentum under CEO Elliott Hill, is hoping the world's most populous country can help it turn the page on its performance.\nAs it reported its fiscal first-quarter earnings on Oct. 1, the company announced it will create a new global campus in Bengaluru, India, as part of its growth strategy. Hill wrote in a letter to employees that the new facility would be a \"long-term investment\" to help position Nike for success.\n\"India is already an important growth market and manufacturing hub for Nike, with strong capabilities and access to talent,\" Hill wrote.\nThe new campus is expected to open in the next few years and span corporate roles across the organization, including the namesake Nike brand, Jordan Brand and Converse. Nike plans to discuss its India campus in detail at its investor day next month.\nIn a statement to CNBC, a Nike spokesperson said expanding into India is a \"natural\" next step for the company as it looks to grow its global presence.\n\"As participation in running, basketball, football, fitness and other sports continues to grow across India, we see an opportunity to better serve athletes through stronger local capabilities, consumer insights, and innovation,\" the spokesperson said.\nIndia will be the world's third-largest retail market by 2030, according to Indian conglomerate Reliance Industries. Its e-commerce market was valued at $159.25 billion in 2026 and is projected to reach $332.94 billion by 2031, according to IBEF, a business advocacy organization created by the Indian government.\nNike has endured a yearslong slump and is trying to right its business under Hill's turnaround plan. Nike also announced this month that it would lay off workers across the company as part of what it has dubbed its Pace strategy, which includes supply chain changes and reorganization of the company's geographic segments. Nike expects the effort to deliver approximately $2.5 billion in savings through fiscal 2031.\nNike's decision to invest further in India as part of its comeback comes as the sportswear company sheds revenue in another critical international market: China. Though its fiscal first-quarter North America revenue came in just above Wall Street expectations, Hill said that performance wasn't enough to offset pressures abroad.\nNike has been particularly struggling in the Greater China market, where its revenue dropped by 26% in its fiscal first quarter. It's part of what experts have said is a broader trend of American companies losing relevance and traction to domestic brands as the once-lucrative market matures.\nOn a call with analysts earlier this month, Hill said the company was taking \"deliberate actions\" to strengthen its China business, though he said those effects will take time to materialize. Hill said the company plans to refresh its physical retail, spearhead a digital cleanup and create higher quality experiences for consumers.\nThe Nike spokesperson told CNBC the company is \"deeply committed\" to China and sees the region as one of its \"most important long-term growth markets,\" even as Nike expands its presence in India.\n\"China remains a long-term priority for Nike, while India represents another important opportunity to invest in the future of sport and the next generation of athletes,\" the spokesperson said.\nInvesting in a long-term vision\nThe company's expansion in India may be coming at both an opportune and inopportune time, according to experts. Investing in a growing international market does not guarantee higher sales — it also requires persuading Indian consumers they want the Nike brand, a challenge the company has struggled to overcome in China.\n\"What Nike, I think, is doing right now is going region by region and working to reestablish what the brand stands for,\" Simeon Siegel, a senior managing director at Guggenheim Securities, told CNBC.\nSiegel said part of the dissonance for Nike is that each region and segment of the business is at a different stage of its turnaround. He said investing in India may set the company up for a more sustainable future if the China business continues to lag, but Nike needs to have a compelling product, solid storytelling and extensive distribution in the region to be successful there.\n\"I think the company needs to look inward and figure out what is the right way to reestablish profitability,\" he said. \"And that involves, in certain instances, shrinking and saving and cutting, and, in certain instances, investing and looking toward the future, because the goal here is not to shrink to oblivion; it's to shrink to stability, and then ultimately growth.\"\nThe global strategy may also focus too much on a long-term vision rather than more immediate fixes, according to Jessica Ramirez, co-founder and managing director at advisory firm The Consumer Collective, who specializes in retail and apparel. Ramirez said she already thought Nike and Hill's vision were \"out of touch\" and the plan for the India campus didn't necessarily help its case.\n\"I don't know that this plan of India is an immediate solution to their problems right now,\" she said. \"They have to plan long term, right? But they also need to plan short term, which is continuously falling apart.\"\nShe said Nike has not shared plans that are concrete enough to win back momentum in China and has to develop both regions hand in hand.\nWhile Nike under Hill has improved its wholesale and performance categories, Ramirez said it has yet to master its direct-to-consumer and sportswear segments, which would allow the company to flourish in all of its markets.\nThe Nike spokesperson told CNBC the retailer is committed to investing in both countries as it tries to expand its global presence.\n\"Importantly, this is not an either/or decision between India and China,\" the spokesperson said. \"We always invest market by market based on long-term opportunities to serve athletes and grow sport around the world.\"\nA growing market opportunity\nStill, India presents an attractive opportunity for many companies looking to unlock growth abroad.\nRamirez said Nike is just the latest to join a cohort of American companies looking to establish their presence in the market. While many brands began investing in China years ago, she said that trend is now pointing toward India instead, as U.S. companies see more spending pressures in the Chinese market and navigate geopolitical tensions between the two countries.\n\"It's to get in there for the long term and to make sure that they are there for when they can reap the positive effects,\" she said. \"I want to say this conversation started getting a bit more engaging in the last two to three years, when companies started investing more in India.\"\nIndia is one of the world's strongest market performers, driven primarily by domestic demand, investment and supply-chain diversification, according to an analysis from Accenture. With a population of over 1 billion, the country presents a growth opportunity similar to the one China offered in the early 2000s.\n\"It's going to be a fast-growing consumer base where we assume their income levels will continue to go up and they'll have much more purchasing power, and so maybe could we be tapping in on that market from a consumer lens,\" Chris Tomsovic, who leads Accenture's macro foresight team, told CNBC.\nStill, one of the biggest focus points for the Indian consumer is price sensitivity, which will pose a challenge for American companies trying to break into the market, he added. Even so, many domestic brands on the market are younger, meaning there could be more opportunities right now for Western companies to take market share.\nAnother challenge is that the Chinese consumer has historically been receptive to American brands, whereas it will still take more data to understand how Indian shoppers feel about those businesses, he said. For sportswear retailers, the focus of the sports most popular in each region will also factor into that equation.\n\"Can they really localize the product, make the price point work? Can they adapt to the local social media technology ecosystem? Can they adapt to the local cultural values and norms that the consumer wants?\" Tomsovic said.\n\"If you're able to nail that, then I think you're right. Whether you're a footwear brand, whether you're an athleisure brand, I think there's a huge opportunity there with a billion consumers,\" he said.",

    "id": "norway-s-2-trillion-wealth-fund-was-froz-d7615ced",
    "title": "Norway's $2 trillion wealth fund was frozen out of major defense companies. That may be about to change",
    "titleJa": "Norway's $2 trillion wealth fund was frozen out of major defense companies. That may be about to change",
    "summaryJa": "Existing ethical rules mean the fund is not permitted to invest in companies like Lockheed Martin and Boeing.",
    "bodyOriginal": "Norway's $2.3 trillion oil fund could soon invest in Western defense companies after years of being frozen out of much of the sector by state ethics guidelines.\nThe sovereign wealth fund is currently worth around 21.8 trillion Norwegian kroner, or $2.3 trillion, making it the largest fund of its kind in the world. With stakes in around 1.5% of the world's publicly listed companies, the fund is one of the biggest investors in the stock market worldwide.\nIn November 2025, a review was ordered into the ethical guidelines governing how Norges Bank invests, following controversy over divestments from some Israeli and American firms.\nOn Thursday, the independent Gjedrem Committee submitted the review's findings to the Norwegian Ministry of Finance. It included a recommendation for radical change to the fund's approach to defense investments, arguing that \"Norges Bank must be prepared for situations where conflicts escalate into war.\"\nCurrent ethical rules prohibit the fund from making investments in companies including Airbus, BAE Systems, Boeing, BWX Technologies and Lockheed Martin, as they contribute to the manufacturing of nuclear weapons. The fund does hold some defense stocks, including a 2.3% stake in Germany's Rheinmetall, and a 1.5% stake in Italy's Leonardo.\nThe Gjedrem Committee said Thursday that although the nuclear weapons criterion should be retained, \"its scope should change.\"\n\"The Fund is not to be invested in companies that produce nuclear weapons, unless the company is domiciled in a nuclear-weapon state under the Treaty on the Non-Proliferation of Nuclear Weapons (NPT) that is allied with Norway,\" it said in its report. \"Several European and American companies that produce components for nuclear weapons can therefore be reincluded.\"\nIt added that potential investment should include companies producing weapons that Norway needs for its own defense, and proposed removing the requirement for arms-makers to be assessed for whether their products are being used by nations in accordance with international humanitarian law.\nThe committee noted that alongside rising geopolitical instability, wars in the Middle East and Ukraine, and energy security concerns, the fund's capital and influence meant it was \"timely to reassess the ethical framework.\"\n\"The Fund's size and reach give better access to company management and boards than the Fund had in 2003,\" it said. \"In a time of a more demanding political situation abroad, this provides opportunities of which the management should make use.\"\n\"The liberal, rules-based international order is in decline,\" it added. \"Economic policies are increasingly used as instruments of foreign policy. Cooperation between countries has become more transactional and negotiation-driven in recent years.\"\nIt warned that in this environment, other governments can \"more readily perceive ethically motivated exclusions as the policy of the Norwegian government.\"\nNorway's oil fund was set up in the 1990s to invest revenues from the country's oil and gas industry. While Norway's finance ministry and central bank are involved in the governance of the fund, investment decisions are made by Norges Bank Investment Management (NBIM), with exclusion recommendations historically put forward by its independent Council on Ethics.\n\"There have been reactions and threats of countermeasures,\" the Gjedrem Committee said in its report on Thursday. \"Retaliatory measures could hit the Fund and other Norwegian interests.\"\nU.S. backlash\nIn September last year, the U.S. State Department told CNBC it was \"very troubled\" by NBIM's decision to exit positions in American machinery manufacturer Caterpillar and five Israeli banks, accusing the fund of basing its decision on \"illegitimate claims.\"\nNBIM had cited \"unacceptable risk\" that the companies were contributing to rights violations in Palestinian territories when it divested. Norway's finance minister, Jens Stoltenberg – former secretary general of NATO – said at the time that it was \"not a political decision.\"\nThe Gjedrem Committee noted on Thursday that the risk of further backlash to NBIM's investment choices was also rising as public finances came under greater pressure in many countries.\n\"High government debt can jeopardize economic stability in countries, but can also give an incentive to look to foreign investors' interest and dividend income as a revenue base for the state,\" it warned.\nThe committee members concluded that although the guidelines underpinning the fund's ethical framework still have broad support, they had come under pressure against the political backdrop.\n\"The conditions for exercising ownership have become more restrictive, in the U.S. among other places,\" they said.\nThe Gjedrem Committee recommended that the Council on Ethics should continue to operate, but that it should no longer advise NBIM on taking action over ethical concerns. Instead, it should be limited to delivering analysis on breaches of the ethical guidelines by companies, the committee added.\nNo new companies will immediately be included in or excluded from the fund's portfolio as a result of the report's recommendations – but the recommendations pave the way for the fund to invest in some American and European defense companies that are currently barred under the fund's ethics rules.\nNorway will now hold a public consultation on the recommendations made in the report, with the central bank due to submit its response in January. The finance ministry will propose a new ethics framework in a white paper in the spring, with Norway's parliament expected to vote on the changes in mid-2027.\nUntil then, the fund's current ethical guidelines and exclusion framework remain unchanged.\n\"The Council on Ethics has just received the Gjedrem Committee's report,\" Svein Richard Brandtzæg, chair of the wealth fund's Council on Ethics, said in an emailed statement on Thursday morning. \"We will study the report carefully. We will then hold thorough discussions within the Council and submit our response in the upcoming public consultation.\"\nUntil November 2025, the Executive Board of Norges Bank decided whether companies should be excluded from the fund's investment portfolio or placed on an observation list. These decisions were informed by the Council on Ethics, an independent body appointed by Norway's Ministry of Finance.\nBut, pending the Gjedrem Committee's review, temporary guidelines were put in place, under which Norges Bank could no longer make those decisions. The temporary guidelines stipulated that the board may only revoke previous decisions on excluding a company or putting it on the observation list.\nMeanwhile, the Council on Ethics was stripped of its ability to recommend observation or exclusion at least until the ethical framework review is finalized.\nThe temporary guidelines will remain in place until the 2027 parliamentary vote on the Gjedrem Committee's review.\n'Other investors pay attention'\nThe Gjedrem Committee's report was met with backlash from some human rights groups, who argued decisions made in Norway could have implications for international investment trends.\nJohn Peder Egenæs, secretary general of Amnesty International Norway, said in a statement on Thursday that the proposals \"risk weakening accountability and integrity and dismantling key human rights protections.\"\n\"When the world's largest sovereign wealth fund changes its standards, the consequences do not stop at Norway's borders,\" he said. \"Other investors pay attention, and companies do too.\"\nGrete Herlofson, secretary general of the Norwegian Red Cross, said in a statement that investing in producers of nuclear weapons would be \"ethically and humanitarianly completely incomprehensible.\"\n\"Opening up investment in nuclear weapons would be a dangerous change of course that weakens the international stigma against these weapons and reinforces the perception that they are an acceptable weapon,\" she said. \"This increases the risk that they could be used.\"",

ed eight attacks in the critical waterway since Oct. 11.",

ht attacks in the critical waterway since Oct. 11.",

    "title": "Ship attack reports near Hormuz reach record high as oil exports slow",
    "titleJa": "Ship attack reports near Hormuz reach record high as oil exports slow",
    "summaryJa": "BBC Verify analysis of data from a UK maritime agency shows 12 vessels were struck in a week.",
    "bodyOriginal": "Ship attack reports near Hormuz reach record high as oil exports slow\n- Published\nThe number of ships that have reported being attacked in and around the Strait of Hormuz has hit a record high, BBC Verify analysis of data from a UK maritime agency shows.\nTwelve vessels were attacked between 5 and 11 October - the largest number of weekly strikes reported to the UK's Maritime Trade Operations (UKMTO) agency since the US-Israeli war with Iran began. The previous week saw 10 ships reporting attacks.\nSix of the vessels were struck last Sunday, according to the UKMTO - a one-day high. So far this week, there have been four reported attacks.\nAs the number of strikes has risen, the recovery in oil shipments through the strait seen last month has slowed, industry data suggests.\nBBC Verify collated incident reports published by the UKMTO on its website and created a timeline based on the first date cited in each report. This is approximate because some incidents use the date of the attack and some the date on which it was reported.\nExperts say Tehran has been attacking ships in an effort to assert greater control over the waterway as the US military has increased the number of tankers it is shepherding through the south of the strait to evade Iranian strikes.\nIran is also carrying out more attacks on vessels further away from the Strait of Hormuz, according to experts.\nThe US military's Central Command, which oversees operations in the Middle East, posted on social media that despite the attacks \"commercial traffic continues to flow through the Strait of Hormuz with co-ordinated protection from US forces and regional partners\".\nTwo crew missing after one of Sunday's attacks\nThe aftermath of one of Sunday's six reported attacks was captured in verified footage showing the Nicaragua-flagged tanker Petro Dolphin on fire, as filmed by the crew on a smaller boat nearby.\nThe vessel was struck by a drone close to the Sohar Anchorage, Oman, more than 250km (150 miles) from the strait, according to the maritime intelligence firm Vanguard.\nEleven Indian seafarers were rescued but two are still missing, the Forward Seamen's Union of India said.\nAttacks have continued this week with the container ship GFS Pride sinking after a strike by an unknown projectile in the strait on Tuesday. Twenty-one crew were safely evacuated.\nIran's Islamic Revolutionary Guard Corps (IRGC) published footage of what appeared to be the same ship sinking. It said the vessel was carrying \"2,500 containers of contraband\" and had taken an \"unauthorised route\".\nOil shipments stall\nMiddle East oil exports have slowed as the number of ship strikes has risen.\nAbout 12.6 million barrels per day went through the strait on 13 October, below the 15 million reported at the end of September, data from trade intelligence firm Kpler shows. This compares with a pre-war baseline of some 17 million barrels per day.\nThe recent increase in attacks comes as US Navy data indicates the number of vessels given assistance to navigate the Strait of Hormuz during the first 10 days of October was up 85% compared with the same period in August.\nMost of the oil being shipped from Gulf Arab states recently has been carried using a \"shuttle\" system where a fleet of tankers load up and sail through the strait before transferring their cargo to larger tankers in the Gulf of Oman.\nThese shuttle ships use a route close to Oman's coastline. Iran says this is \"unauthorised\" and insist vessels take an alternative route closer to its own shore.\nSo-called assisted transits were a key factor in helping drive oil flows from the Middle East back towards pre-war levels in September. This does not include Iranian exports which have completely stalled as a result of the US blockade of Iranian ports and ships.\nMartin Kelly, CEO of Orbital Risk Intelligence, said Iran has \"evolved its strategy\" in response to this loosening of its control over the strait and has been carrying out \"near daily or multiple attacks every single day\".\n\"The aim here is to stop the ships going through and to deter others,\" he added.\nThe IRGC's navy has said strikes would not be \"limited to the Strait of Hormuz\" and later announced a \"new deployment formation\" across the region, according to state media.\nMartin Kelly told BBC Verify that Iran is widening its attacks and targeting ships near the coast of Gulf Arab states and in the Gulf of Oman.\nA tanker was struck by multiple projectiles north of Qatar on Thursday 8 October, more than 500km (310 miles) from the strait, resulting in multiple reported casualties, according to Vanguard.\nAnother tanker was attacked close to the UAE town of Al-Jazirah al-Hamra on Friday 9 October, Vanguard said.\nVerified footage shows crew members running across the deck and putting on lifejackets as a large cloud of black smoke rises over the ship.\nAdditional reporting by Becky Dale\nGraphics by Tom Shiel and Mark Edwards",

km (150 miles) from the strait, according to the maritime intelligence firm Vanguard.\nEleven Indian seafarers were rescued but two are still missing, the Forward Seamen's Union of India said.\nAttacks have continued this week with the container ship GFS Pride sinking after a strike by an unknown projectile in the strait on Tuesday. Twenty-one crew were safely evacuated.\nIran's Islamic Revolutionary Guard Corps (IRGC) published footage of what appeared to be the same ship sinking. It said the vessel was carrying \"2,500 containers of contraband\" and had taken an \"unauthorised route\".\nOil shipments stall\nMiddle East oil exports have slowed as the number of ship strikes has risen.\nAbout 12.6 million barrels per day went through the strait on 13 October, below the 15 million reported at the end of September, data from trade intelligence firm Kpler shows. This compares with a pre-war baseline of some 17 million barrels per day.\nThe recent increase in attacks comes as US Navy data indicates the number of vessels given assistance to navigate the Strait of Hormuz during the first 10 days of October was up 85% compared with the same period in August.\nMost of the oil being shipped from Gulf Arab states recently has been carried using a \"shuttle\" system where a fleet of tankers load up and sail through the strait before transferring their cargo to larger tankers in the Gulf of Oman.\nThese shuttle ships use a route close to Oman's coastline. Iran says this is \"unauthorised\" and insist vessels take an alternative route closer to its own shore.\nSo-called assisted transits were a key factor in helping drive oil flows from the Middle East back towards pre-war levels in September. This does not include Iranian exports which have completely stalled as a result of the US blockade of Iranian ports and ships.\nMartin Kelly, CEO of Orbital Risk Intelligence, said Iran has \"evolved its strategy\" in response to this loosening of its control over the strait and has been carrying out \"near daily or multiple attacks every single day\".\n\"The aim here is to stop the ships going through and to deter others,\" he added.\nThe IRGC's navy has said strikes would not be \"limited to the Strait of Hormuz\" and later announced a \"new deployment formation\" across the region, according to state media.\nMartin Kelly told BBC Verify that Iran is widening its attacks and targeting ships near the coast of Gulf Arab states and in the Gulf of Oman.\nA tanker was struck by multiple projectiles north of Qatar on Thursday 8 October, more than 500km (310 miles) from the strait, resulting in multiple reported casualties, according to Vanguard.\nAnother tanker was attacked close to the UAE town of Al-Jazirah al-Hamra on Friday 9 October, Vanguard said.\nVerified footage shows crew members running across the deck and putting on lifejackets as a large cloud of black smoke rises over the ship.\nAdditional reporting by Becky Dale\nGraphics by Tom Shiel and Mark Edwards",

    "title": "Fed's Warsh says AI path will be 'very bumpy' but ultimately 'very good' for wealth",
    "titleJa": "Fed's Warsh says AI path will be 'very bumpy' but ultimately 'very good' for wealth",
    "summaryJa": "Warsh said he's optimistic that AI will make economies that use it well more productive and wealthier, warning the road there will be \"very bumpy.\"",
    "bodyOriginal": "BANGKOK — Federal Reserve Chairman Kevin Warsh said he's optimistic that artificial intelligence will make economies that use it well more productive and wealthier, though he warned the road there will be \"very bumpy\" and its near-term effect on jobs is unknown.\nWarsh spoke at a fireside chat with the International Monetary Fund's managing director, Kristalina Georgieva, as part of the weeklong IMF-World Bank Annual Meetings in Bangkok on Friday.\n\"I want you to hear from me optimism, but optimism leavened by the seriousness of purpose,\" Warsh said. A decade from now, he said, people will look back \"and say this was hugely consequential.\"\nThe Fed raised rates to a range of 3.75% to 4% last month, its first hike since 2023. A communication blackout period starts later Friday, ahead of its Oct. 27-28 meeting.\nWarsh also said the global economy has \"broadly conformed\" to the central bank's expectations since its September rate increase, but he declined to say what he will do at the coming meeting. \"I don't prejudge meetings,\" he said.\nTraders see a 72.3% chance for the Fed to keep the interest rate unchanged, according to CME Fed Watch, while the majority expect a 25 basis point hike at the December meeting.\nThis is a developing story. Please refresh for updates.",

    "title": "Hybe shares jump 10% as K-pop sensation BTS' tour lifts earnings hopes",
    "titleJa": "Hybe shares jump 10% as K-pop sensation BTS' tour lifts earnings hopes",
    "summaryJa": "BTS' world tour and rising global demand for newer K-pop acts are fueling earnings expectations, sending Hybe shares soaring.",
    "bodyOriginal": "Shares of Hybe, the company behind K-pop supergroup BTS, surged 10% on Friday as investors weighed an upbeat third-quarter earnings outlook fueled by its artistes' global concerts.\nHybe's third-quarter revenue is expected to reach 1.5 trillion won ($1.11 billion), up 106% from a year earlier, while operating profit is projected at 172.2 billion won, according to local brokerage firm iM Securities. Concert revenue is expected to come in at 717 billion won, nearly tripling from a year earlier.\nThe share price gain on Friday outperformed the broader Kospi, which rose 2.9%.\nBTS' ongoing world tour featured 16 stadium shows in North America and eight in Europe during the third quarter.\nThiat, alongside expanding tours by newer acts including Enhypen, Katseye and Cortis, helped drive concert attendance to nearly 3 million during the quarter, potentially marking a quarterly record for the company, the report said.\nWestern markets accounted for more than 70% of total concert attendance for the first time, reflecting Hybe's growing international reach as its newer artistes expand their presence in North America and Europe, according to the report. Despite currency headwinds, concert, merchandise and licensing revenues are expected to reach record levels.\nConcert margin outlook\nWhile higher royalty payments to established artistes and initial touring costs for newer groups are expected to weigh on margins, the brokerage forecasts Hybe to maintain a double-digit operating margin, supported by the scale of BTS' world tour.\nCGS Securities analyst Jiwoo Oh told CNBC after Hybe's second-quarter earnings that while concerts and appearances carry steeper costs for the company due to higher revenue sharing with artistes, merchandise, content and fan club businesses help boost the companies bottom line significantly.\nShe also pointed out that in its second quarter, Hybe delivered an 11.8% operating margin in the second quarter of 2026, with artist-direct revenue accounting for 72% of total sales and concerts alone accounting for 45% of total sales.\n\"We believe this demonstrates that stadium-scale operating leverage can more than offset the higher cost base associated with concerts,\" she added.\nAfter Hybe reported second-quarter results on July 28, the company's shares crashed, wiping out as much as $1.96 billion in market cap in less than 24 hours.\nAnalysts said then that the sell-off was caused as profit margins missed expectations, despite revenue and operating profit reaching record highs, according to analysts.\nRookies step up\nThe iM Securities report said that the profitability of newer bands such as Katseye and Cortis in Western markets will be likely key to reducing the company's reliance on BTS, the report showed.\nStill, stronger-than-expected demand for additional BTS concerts in Japan and the Middle East, as well as encore performances, could also lead to upward revisions to the company's 2027 earnings forecasts, iM Securities added.\nKyobo Securities, which expects third-quarter concert revenue to reach 724.4 billion won, expressed optimism around Hybe's newer acts, stating \"growth among younger artists is becoming more visible alongside BTS' tour.\"\nCortis is selling around 600,000 albums per month on average, demonstrating strong fandom demand, the brokerage said, while Katseye is expanding its overseas presence on the back of global streaming and album performance.",

e accounting for 72% of total sales and concerts alone accounting for 45% of total sales.\n\"We believe this demonstrates that stadium-scale operating leverage can more than offset the higher cost base associated with concerts,\" she added.\nAfter Hybe reported second-quarter results on July 28, the company's shares crashed, wiping out as much as $1.96 billion in market cap in less than 24 hours.\nAnalysts said then that the sell-off was caused as profit margins missed expectations, despite revenue and operating profit reaching record highs, according to analysts.\nRookies step up\nThe iM Securities report said that the profitability of newer bands such as Katseye and Cortis in Western markets will be likely key to reducing the company's reliance on BTS, the report showed.\nStill, stronger-than-expected demand for additional BTS concerts in Japan and the Middle East, as well as encore performances, could also lead to upward revisions to the company's 2027 earnings forecasts, iM Securities added.\nKyobo Securities, which expects third-quarter concert revenue to reach 724.4 billion won, expressed optimism around Hybe's newer acts, stating \"growth among younger artists is becoming more visible alongside BTS' tour.\"\nCortis is selling around 600,000 albums per month on average, demonstrating strong fandom demand, the brokerage said, while Katseye is expanding its overseas presence on the back of global streaming and album performance.",

    "id": "russia-returns-to-g20-table-in-bangkok-o-2a9c463e",
    "title": "Russia returns to G20 table in Bangkok on U.S. invitation that angers Europe",
    "titleJa": "Russia returns to G20 table in Bangkok on U.S. invitation that angers Europe",
    "summaryJa": "Russia’s return to the G20 table has tested how far Washington’s outreach to Moscow will strain ties with European allies.",
    "bodyOriginal": "Russia's finance minister attended a Group of 20 meeting in Bangkok on Thursday, his second in-person appearance at the event since the 2022 invasion of Ukraine, testing how far Washington's rapprochement with Moscow will strain ties with Europe.\nAnton Siluanov and Bank of Russia Deputy Governor Elizaveta Danilova were listed as Russia's delegates at the finance ministers and central bank governors' meetings on the sidelines of the IMF-World Bank Annual Meetings in Bangkok, Thailand, according to a seating plan seen by CNBC. Siluanov was in the meeting, according to a person familiar with the matter.\nAccording to the layout document, Russian delegates were seated between attendees from South Korea and the United Arab Emirates.\nGerman Finance Minister Lars Klingbeil was also listed as an attendee. At the August G20 finance meeting in Asheville, North Carolina, he told Siluanov that Moscow must end the war and declined to pose in a group photo with him. The traditional group photo was ultimately taken without the Russian delegation after European officials protested.\nKlingbeil has pushed back on the U.S. efforts to bring Russia back on to the international stage, reportedly saying after the Thursday meeting that \"there will be no pretending that Russia is now returning as a normal member of the G20 and simply taking its seat at the table again — not with me, and not with the other Europeans.\"\nRussia's seat at the table tests how far Washington can ease pressure on Moscow without breaking with its European allies. The U.S., which took over the G20 presidency this year, welcomed Russia's finance minister back to the finance talks after years of isolation over the invasion of Ukraine.\nThe Trump administration also introduced a deal to temporarily lift sanctions on Russian diesel imports until April, drawing criticism from Ukrainian President Volodymyr Zelenskyy and European allies. Dombrovskis told CNBC on Wednesday that \"now it's not a time to ease sanctions on Russia.\"\nIn a statement issued after the Thursday meetings, Australian Treasurer Jim Chalmers said Iran's closure of the Strait of Hormuz and attacks on commercial vessels \"must end.\" Those impacts \"are exacerbated by Russia's unprovoked and unjustifiable war in Ukraine,\" he said, adding that Australia calls for Russia to end the war and respect Ukraine's sovereignty.\nThe finance chiefs ended the meeting without a joint communique, underscoring persistent divisions among members over the Middle East conflict, trade imbalances, and Russia's war with Ukraine. U.S. Treasury Secretary Scott Bessent, who would normally chair the talks, skipped the meetings to stay in Washington.\nThe Asheville meeting also ended without a communique, after China objected to language on several issues, including efforts to rectify excessive global trade surpluses. The U.S. instead issued a chair's statement backed by every member present except China, with Bessent calling China \"the dissenter.\"\nDelegates started the day with a plated breakfast of baked goat cheese, spinach and egg soufflé with chutney made from locally grown Bijin tomatoes, according to a menu card at the venue. The bread basket came with \"Nam Dok Mai\" mango jam. Every card carried the U.S. presidency's stars-and-stripes G20 logo and its \"Freedom 250\" tagline, marking America's 250th anniversary.\nThe finance ministers' meeting Thursday could have helped lay the groundwork for improved coordination on a raft of global challenges, including energy problems stemming from the Middle East conflict and concerns about record public debt in advanced economies. Leaders are expected to convene at the next G20 summit in Miami in December.",

se sanctions on Russia.\"\nIn a statement issued after the Thursday meetings, Australian Treasurer Jim Chalmers said Iran's closure of the Strait of Hormuz and attacks on commercial vessels \"must end.\" Those impacts \"are exacerbated by Russia's unprovoked and unjustifiable war in Ukraine,\" he said, adding that Australia calls for Russia to end the war and respect Ukraine's sovereignty.\nThe finance chiefs ended the meeting without a joint communique, underscoring persistent divisions among members over the Middle East conflict, trade imbalances, and Russia's war with Ukraine. U.S. Treasury Secretary Scott Bessent, who would normally chair the talks, skipped the meetings to stay in Washington.\nThe Asheville meeting also ended without a communique, after China objected to language on several issues, including efforts to rectify excessive global trade surpluses. The U.S. instead issued a chair's statement backed by every member present except China, with Bessent calling China \"the dissenter.\"\nDelegates started the day with a plated breakfast of baked goat cheese, spinach and egg soufflé with chutney made from locally grown Bijin tomatoes, according to a menu card at the venue. The bread basket came with \"Nam Dok Mai\" mango jam. Every card carried the U.S. presidency's stars-and-stripes G20 logo and its \"Freedom 250\" tagline, marking America's 250th anniversary.\nThe finance ministers' meeting Thursday could have helped lay the groundwork for improved coordination on a raft of global challenges, including energy problems stemming from the Middle East conflict and concerns about record public debt in advanced economies. Leaders are expected to convene at the next G20 summit in Miami in December.",

    "title": "Living with a stink? Technology might help",
    "titleJa": "Living with a stink? Technology might help",
    "summaryJa": "Smells from rubbish dumps and industrial facilities are being more carefully monitored.",
    "bodyOriginal": "Living with a stink? Technology might help\n- Published\nMilpitas, an affluent city in California's Silicon Valley tech hub, has an odour problem.\nFor decades, residents have had to endure rank smells wafting from industrial sites, among them a 342-acre landfill.\n\"When I first moved here, I could not open my window for over 10 years,\" says Chia-Ling Kong, an engineer for a tech firm who lives around half a mile from the dump.\nWhile things have got better in recent years, Kong says she and her neighbours must still contend with around \"two or three hours of bad smells a day\".\nPerhaps befitting Silicon Valley, the community is putting its hopes in technology.\nThe operators of Newby Island landfill have been ordered by local authorities to use drones and install monitors to systematically track and measure the chemicals responsible for bad odours. They have also been told to automate the collection of landfill gases responsible for smells.\nKong is optimistic a data-driven approach will make a difference. \"Hopefully with this continuous monitoring, it makes it easier to pinpoint problems at the moment it starts.\"\nThe operators of the landfill say they are committed to operating it safely and protecting air quality.\nJust like in Milpitas, where Kong is part of a citizen's campaign against the odours, communities around the world are raising a stink about bad smells making day-to-day life miserable. Sometimes a rubbish dump is to blame, or it might be a sewage treatment works, or a reeking factory.\nWhen the complaints start stacking up, resolving them is not always simple. Many countries have no regulations in place dictating how to manage smells.\nIn the US, for example, the Environmental Protection Agency does not regulate environmental odours as a pollutant. This leaves states and local governments to take charge of the issue.\nUrban sprawl is often part of the problem, bringing communities closer to stinky facilities that may historically have been kept at a distance.\nThis is creating more demand for technologies to monitor and prevent smells. Odour consultant Micheal Bull says people are increasingly concerned about neighbourhood stinks.\n\"You're getting developments being built nearer to odorous processes… as land has become more valuable, there is also infilling,\" Bull says. He is speaking about his experiences in the UK, but it's a similar story in many parts of the world.\nThe technologies used to tackle industrial pongs generally fall into three categories: they absorb odours; convert them into something less smelly through a chemical reaction; or burn them away.\nExperts on fixing industrial odours say that the best technologies, when used correctly, can remove 90% or more of the target compounds responsible for smells.\nBut this can be expensive and some operators opt for simpler and cheaper solutions. These include masking odours from landfill or sewage processing by spraying giant quantities of deodorisers.\nOdour experts contacted for this article were dubious about the effectiveness of such industrial scale air fresheners. \"In my view they're not likely to change the odours,\" says Bull, who likens them to fabric conditioner.\nBad smells from waste sites – a common cause of complaints – are among the stinkiest and most difficult to resolve, according to Carlos Diaz, an environmental consultant based in Spain. \"Landfill is difficult to treat because you have a very large surface,\" he says.\nIn some places at least, technology is making a real difference. Residents in Des Moines, Iowa, have long complained of the so-called Eastside Funk, a putrid scent that residents report drifts over parts of the city.\nA study commissioned by city authorities showed that a trio of industrial meat companies were among culprits.\n\"Within 10 miles, there's about half a million people,\" says Dalton Jacobus, who works in the Department of Neighborhood Services. \"If the winds are out of the wrong direction, 100,000 people can be in the middle of that odour plume.\"\nThe authorities are now paying around $240,000 (£182,000) a year on technology to track the stink, so they can take action. \"What we wanted to do was build a ring of odour monitors around the facilities that we suspected of emitting odours,\" says Jacobus.\nThe monitors, which measure levels of chemical compounds in the air, work in combination with a weather station to provide real-time data on the concentrations that are coming from each facility based off the wind patterns.\nThis has put an end to finger pointing about who's to blame each time a smell sparks complaints, says Jacobus. \"Now we can say with reasonable certainty that 'this odour event did originate from your facility, what was going on'?\"\nMeanwhile, some of the sites that have been blamed for causing unpleasant smells in Des Moines have spent millions of dollars to upgrade their own odour control systems.\nSmithfield Foods, which operates a meat processing in Des Moines, says it has invested $2m to install a regenerative thermal oxidiser that destroys the chemicals associated with bad smells. Even so, the company says it does not believe it is the source of odour complaints.\nBefore installing the monitors – which some local companies help pay for – officials in Des Moines would drive out to the source of a complaint to sniff the air.\nRelying on the human nose to sniff out industrial smells is still commonplace. Claudia Barrios Obregón from Kunak, the company behind the monitors in Des Moines, says: \"Right now, the way that cities control or measure odours is olfactometry: a human panel measures and gives an opinion of what the odour is like. But that's not that realistic.\"\nThe Spanish company's monitors are an example of so-called electronic noses that make it easier to detect smells.\nWhatever technology is used, it can be hard to keep everyone happy, as smells are so subjective. \"Unfortunately, the general rule is that the nastier we perceive the odour to be, the more sensitive towards it we are,\" says Johan Lundström, a professor in the science of smell at the Karolinska Institute in Stockholm, Sweden.\nTechnology of Business\n- Published16 September\n- Published9 September\n- Published2 September",

    "id": "i-find-it-quite-demoralising-in-store-wh-a01fee1b",
    "title": "I find it quite demoralising in store - why I do all my shopping online",
    "titleJa": "I find it quite demoralising in store - why I do all my shopping online",
    "summaryJa": "After Primark announced plans for home delivery, we hear from women who never go into clothes stores.",
    "bodyOriginal": "I find it quite demoralising in store - why I do all my shopping online\n- Published\nJess Bacon does all her clothes shopping online.\nAs a plus-size woman, she finds the size ranges available in stores unreliable. \"The sizing in store is notoriously bad. I find it quite demoralising in store,\" she says.\n\"The average size woman in the UK is a size 14 or a size 16. I think a lot of people just don't feel seen or represented,\" says the 29-year-old from Peterborough.\nJess, a culture journalist and author, finds shopping online \"much quicker than going into a store, paying for parking, trying things on\".\nAnd she feels posting back items that don't fit is less hassle than returning in store, while frequent visits to her local post office give her \"more of a community connection\".\nJess notes Primark is one of the few High Street retailers where plus-size people can shop. In her experience, Primark stores usually stock up to a size 22.\nBut soon she'll have the option of staying home even for this - as, after years of holding out, Primark now plans to launch a home delivery service in Britain.\nEven throughout the Covid-19 pandemic, when shops were closed, Primark didn't offer the ability to shop online. In 2022 it launched a click-and-collect service, but shoppers still had to travel for their purchases.\nThe retailer has not said when it expects to launch the service, but has bought a warehouse in Sheffield to enable it to ship products to homes.\nAnalysts say the decision shows Primark is facing major challenges from ultra-fast-fashion brands such as Shein.\nOnline shopping had been on the rise even before the surge seen during the pandemic.\nOnline accounted for 27.3% of all retail sales in August this year, according to the Office for National Statistics, up from 18.1% in August 2019.\nInternet shopping has also been boosted by the decline of the High Street in many parts of the country, something which Jess has noticed in Peterborough. \"We don't have John Lewis [anymore]. There's kind of not that much of a reason to go into town.\"\n'I basically never go into clothes shops'\nLike Jess, Julia Mitchell, who lives near Chichester, doesn't enjoy in-person clothes shopping. She finds it overstimulating and thinks there are better bargains to be had online.\n\"I basically never go into them [clothes shops]. It's not really something I enjoy,\" the 32-year-old says.\n\"I guess some people might be able to see stuff and pick it up and look at it, but for me, being able to get the best price is more important.\"\nJulia, a content creator, tries to shop ethically and most of her purchases are second hand from Vinted.\nThe one thing she never shops online for, though, is books. \"The thing about bookshops is that they are cultural spaces and community spaces.\"\nSandra Davies does all her shopping online. She has had three strokes and finds walking to and around stores too much physically.\n\"I've tried it on two occasions but on both times, standing in a queue for over 10 minutes was too much for me and I collapsed.\"\nThe 61-year-old from Sheffield says waiting for deliveries can be taxing as well, as she worries about missing the postie and having to reschedule.\nReturns policy can 'make or break'\nJulie Palmer, a retail analyst, is not surprised that Primark has finally moved into home deliveries as it has evidently recognised that \"online sales bring scale\".\nHowever, she says a shop's returns policy for online purchases can \"make or break\" it. Many brands offer hassle-free returns, which Palmer says Primark must match in order to compete.\n\"Shoppers want them to be free, simple and quick. That means a generous window, lots of drop-off options and refunds that land within days, not weeks.\n\"When a policy is clunky or slow, customers remember it and shop elsewhere next time.\"\nBut returns are expensive for retailers. Some, like Asos, have started charging a fee if customers make frequent returns.\nThis is a balancing act, Palmer says, \"because a fee can easily push a customer to a competitor\".\n\"Most retailers that charge still offer free returns in store, which is a deliberate way to get people through the door and hopefully spending again.\"\n- Published28 September\n- Published10 September",

his is a balancing act, Palmer says, \"because a fee can easily push a customer to a competitor\".\n\"Most retailers that charge still offer free returns in store, which is a deliberate way to get people through the door and hopefully spending again.\"\n- Published28 September\n- Published10 September",

    "id": "netflix-chief-content-officer-bela-bajar-0ee90ef8",
    "title": "Netflix Chief Content Officer Bela Bajaria is leaving, will be replaced by Peter Rice",
    "titleJa": "Netflix Chief Content Officer Bela Bajaria is leaving, will be replaced by Peter Rice",
    "summaryJa": "Netflix announced Bela Bajaria will be replaced by former Disney exec Peter Rice as the company's chief content officer.",
    "bodyOriginal": "Netflix on Thursday announced Bela Bajaria will be replaced as the company's chief content officer by former Disney exec Peter Rice, effective Oct. 26.\nRice most recently oversaw Disney's cable channels, news programming and coverage of major sporting events.\n\"Peter is one of the most effective at-scale operators in the entertainment industry,\" co-CEO Ted Sarandos said in a statement. \"I'm excited to welcome him to Netflix as Chief Content Officer as we continue to scale and deliver members more of the stories they love.\"\nBefore Rice was at Disney, he held roles at 21st Century Fox and Fox Searchlight Pictures. Netflix in its announcement called him \"one of the entertainment industry's most respected creative executives.\" In his new role, Rice will oversee the company's global content organization, including scripted and unscripted series, film and live events.\n\"[Netflix has] shown again and again that they're willing to take chances on distinctive voices and fresh ideas, and I'm excited to work with the team to help bring even more great stories to members everywhere,\" he said in a statement.\nBajaria, who is leaving Netflix after nearly 10 years, most recently led the company's global content team. She had been focused on the company's live sports strategy, looking to create events out of buzzy games and tournaments.\n\"I'm incredibly grateful for everything she's done to help Netflix entertain the world,\" Sarandos said in a statement.\nThe announcement comes a day after Netflix instituted layoffs across its organization, eliminating approximately 6% of its workforce, or roughly 1,000 jobs. Shares of the company are down more than 20% this year, though the stock remained relatively unchanged in extended trading Thursday.\nThe media company will report its next quarterly earnings on Tuesday.",
    "bodyJa": "Netflix on Thursday announced Bela Bajaria will be replaced as the company's chief content officer by former Disney exec Peter Rice, effective Oct. 26.\nRice most recently oversaw Disney's cable channels, news programming and coverage of major sporting events.\n\"Peter is one of the most effective at-scale operators in the entertainment industry,\" co-CEO Ted Sarandos said in a statement. \"I'm excited to welcome him to Netflix as Chief Content Officer as we continue to scale and deliver members more of the stories they love.\"\nBefore Rice was at Disney, he held roles at 21st Century Fox and Fox Searchlight Pictures. Netflix in its announcement called him \"one of the entertainment industry's most respected creative executives.\" In his new role, Rice will oversee the company's global content organization, including scripted and unscripted series, film and live events.\n\"[Netflix has] shown again and again that they're willing to take chances on distinctive voices and fresh ideas, and I'm excited to work with the team to help bring even more great stories to members everywhere,\" he said in a statement.\nBajaria, who is leaving Netflix after nearly 10 years, most recently led the company's global content team. She had been focused on the company's live sports strategy, looking to create events out of buzzy games and tournaments.\n\"I'm incredibly grateful for everything she's done to help Netflix entertain the world,\" Sarandos said in a statement.\nThe announcement comes a day after Netflix instituted layoffs across its organization, eliminating approximately 6% of its workforce, or roughly 1,000 jobs. Shares of the company are down more than 20% this year, though the stock remained relatively unchanged in extended trading Thursday.\nThe media company will report its next quarterly earnings on Tuesday.",

    "titleJa": "KFC to switch to Coca-Cola beverages in U.S. restaurants for the first time in decades",
    "summaryJa": "KFC is switching from PepsiCo to Coca-Cola as its beverage supplier for U.S. restaurants.",
    "bodyOriginal": "KFC's U.S. restaurants will ditch PepsiCo and switch to Coca-Cola beverages next year, marking the first time in decades that the Yum Brands chain has changed its drink supplier, the restaurant company said Thursday.\nSome of KFC's international markets serve Coke products, but the chain's U.S. restaurants have stuck with PepsiCo drinks ever since Pepsi bought KFC in 1986. At the time of the acquisition, KFC was Coke's second-largest fountain account, trailing only McDonald's. Pepsi later spun off KFC, along with sister chains Pizza Hut and Taco Bell — but even as the combined Yum Brands, the company stayed loyal to its previous owner. Without Pepsi, Taco Bell would not serve its iconic Mountain Dew Baja Blast.\nThe change comes as KFC aims to win back U.S. diners, who have ditched the fried chicken chain for rivals such as Chick-fil-A or Popeyes.\n\"This decision is a critical step in the Kentucky Fried Comeback,\" KFC U.S. President Catherine Tan-Gillespie wrote in a memo to franchisees and employees obtained by CNBC. \"A new beverage offering, with a new partner in Coca-Cola, gives us a platform to innovate, meet changing tastes and give customers more reasons to choose us.\"\nFor many fast-food chains, beverages have become a critical way to attract consumers. A number of restaurants, including McDonald's and Taco Bell, have broadened their drink offerings with options such as refreshers or \"dirty soda.\" For its part, KFC recently unveiled new drinks, including iced coffees and shakes, at Open House, its innovation restaurant in McKinney, Texas.\nCoke told CNBC earlier this year that the company has helped many of its restaurant partners create new drinks.\nKFC expects to be pouring Coke beverages in all of its U.S. restaurants by the end of the first quarter of 2027, Tan-Gillespie said.\nTan-Gillespie also said that Pepsi remains an important partner for KFC's parent company and the chain's international markets.\nFor decades, Coke and Pepsi have tussled over important restaurant partners, which represent both a sales opportunity and the chance to grow the visibility of their beverage brands.\nIt is unusual for large restaurant chains to switch beverage providers, but not unprecedented. In 2024, Pepsi poached Subway, the largest U.S. restaurant chain by number of locations, from Coke. Besides KFC, Coke has wooed away a number of notable Pepsi customers in recent years, including Culver's, Arby's and Panda Express.",
    "bodyJa": "KFC's U.S. restaurants will ditch PepsiCo and switch to Coca-Cola beverages next year, marking the first time in decades that the Yum Brands chain has changed its drink supplier, the restaurant company said Thursday.\nSome of KFC's international markets serve Coke products, but the chain's U.S. restaurants have stuck with PepsiCo drinks ever since Pepsi bought KFC in 1986. At the time of the acquisition, KFC was Coke's second-largest fountain account, trailing only McDonald's. Pepsi later spun off KFC, along with sister chains Pizza Hut and Taco Bell — but even as the combined Yum Brands, the company stayed loyal to its previous owner. Without Pepsi, Taco Bell would not serve its iconic Mountain Dew Baja Blast.\nThe change comes as KFC aims to win back U.S. diners, who have ditched the fried chicken chain for rivals such as Chick-fil-A or Popeyes.\n\"This decision is a critical step in the Kentucky Fried Comeback,\" KFC U.S. President Catherine Tan-Gillespie wrote in a memo to franchisees and employees obtained by CNBC. \"A new beverage offering, with a new partner in Coca-Cola, gives us a platform to innovate, meet changing tastes and give customers more reasons to choose us.\"\nFor many fast-food chains, beverages have become a critical way to attract consumers. A number of restaurants, including McDonald's and Taco Bell, have broadened their drink offerings with options such as refreshers or \"dirty soda.\" For its part, KFC recently unveiled new drinks, including iced coffees and shakes, at Open House, its innovation restaurant in McKinney, Texas.\nCoke told CNBC earlier this year that the company has helped many of its restaurant partners create new drinks.\nKFC expects to be pouring Coke beverages in all of its U.S. restaurants by the end of the first quarter of 2027, Tan-Gillespie said.\nTan-Gillespie also said that Pepsi remains an important partner for KFC's parent company and the chain's international markets.\nFor decades, Coke and Pepsi have tussled over important restaurant partners, which represent both a sales opportunity and the chance to grow the visibility of their beverage brands.\nIt is unusual for large restaurant chains to switch beverage providers, but not unprecedented. In 2024, Pepsi poached Subway, the largest U.S. restaurant chain by number of locations, from Coke. Besides KFC, Coke has wooed away a number of notable Pepsi customers in recent years, including Culver's, Arby's and Panda Express.",

    "bodyOriginal": "President Donald Trump on Thursday said Texas' incumbent Republican Sen. John Cornyn and conservative commentator Karl Rove should be blamed if GOP Senate nominee Ken Paxton loses to Democrat James Talarico in the Lone Star State.\nTrump, who endorsed Paxton over Cornyn in the state's Republican primary, accused the incumbent senator and Rove of \"doing everything possible to make it hard\" for Paxton to succeed in the race, where numerous polls show him trailing Talarico.\n\"If Ken Paxton loses, it will be because of WEAK and INEFFECTIVE Political Hacks like John Cornyn and Karl Rove, who have ineffectively opposed me for my entire political career,\" Trump wrote on Truth Social.\nCornyn's office and Rove did not immediately respond to CNBC's requests for comment on Trump's post.\nTrump's preemptive blame-casting came as Texas, a reliably red state that has not elected a Democrat to the U.S. Senate since 1988, has become one of the most competitive battlegrounds of the 2026 midterm cycle.\nThis is breaking news. Please refresh for updates.",

    "id": "porsche-reveals-mission-s-concept-car-th-09195199",
    "title": "Porsche reveals Mission S concept car that previews new design identity",
    "titleJa": "Porsche reveals Mission S concept car that previews new design identity",
    "summaryJa": "Porsche revealed a concept car called Mission S as part of a turnaround plan that includes efforts to boost profits through higher-end products and lower sales.",
    "bodyOriginal": "Porsche on Thursday revealed a concept car called Mission S that signals a new design direction and flagship model for the famed German sports carmaker.\nThe debut of the sleek midengine vehicle is part of a turnaround plan revealed last week by the Volkswagen-controlled brand that includes efforts to boost profits through higher-end products and lower vehicle sales.\nPorsche described Mission S as \"a first glimpse of the brand's evolved design identity\" that also represents a \"super sports car platform\" that will be positioned above its iconic 911 sports car.\nThe vehicle's design is recognizably Porsche but with more aggressive styling compared with its current models, including new hood vents and a roof scoop. Its rear features more differentiated flair in which the vehicle's spoiler flows into its rear panels.\n\"A Porsche must be recognisable as a Porsche at first glance,\" Porsche Chairman Michael Leiters said in a release. \"The Mission S provides a glimpse of the ideas and design features that will shape Porsche in the coming years.\"\nAutomakers routinely use concept vehicles to gauge customer interest, showcase future technologies and signal the direction of a vehicle or brand.\nThe company did not release expected pricing or performance specifications for such future models. Starting prices for its current 911 models range from roughly $135,500 for an entry-level Carrera to more than $203,000 for a Carrera 4 GTS convertible.\nDuring Porsche's capital markets day on Oct. 7, the company outlined its \"Sportwagenschmiede '35\" turnaround plan, which focuses on emphasizing high-end sports cars and luxury SUVs to get the carmaker back on track.\nPorsche's operating margin last year was only 1.1%, compared with 14.1% in 2024, as the company deals with increased costs, U.S. tariffs and declining sales in China.\nThe turnaround plan includes a long-term target for a group operating margin of 15% and a midterm breakeven point of 200,000 units or below annually. That compares with sales of 279,449 in 2025.",
    "bodyJa": "Porsche on Thursday revealed a concept car called Mission S that signals a new design direction and flagship model for the famed German sports carmaker.\nThe debut of the sleek midengine vehicle is part of a turnaround plan revealed last week by the Volkswagen-controlled brand that includes efforts to boost profits through higher-end products and lower vehicle sales.\nPorsche described Mission S as \"a first glimpse of the brand's evolved design identity\" that also represents a \"super sports car platform\" that will be positioned above its iconic 911 sports car.\nThe vehicle's design is recognizably Porsche but with more aggressive styling compared with its current models, including new hood vents and a roof scoop. Its rear features more differentiated flair in which the vehicle's spoiler flows into its rear panels.\n\"A Porsche must be recognisable as a Porsche at first glance,\" Porsche Chairman Michael Leiters said in a release. \"The Mission S provides a glimpse of the ideas and design features that will shape Porsche in the coming years.\"\nAutomakers routinely use concept vehicles to gauge customer interest, showcase future technologies and signal the direction of a vehicle or brand.\nThe company did not release expected pricing or performance specifications for such future models. Starting prices for its current 911 models range from roughly $135,500 for an entry-level Carrera to more than $203,000 for a Carrera 4 GTS convertible.\nDuring Porsche's capital markets day on Oct. 7, the company outlined its \"Sportwagenschmiede '35\" turnaround plan, which focuses on emphasizing high-end sports cars and luxury SUVs to get the carmaker back on track.\nPorsche's operating margin last year was only 1.1%, compared with 14.1% in 2024, as the company deals with increased costs, U.S. tariffs and declining sales in China.\nThe turnaround plan includes a long-term target for a group operating margin of 15% and a midterm breakeven point of 200,000 units or below annually. That compares with sales of 279,449 in 2025.",

    "id": "coreweave-credit-default-swaps-hit-distr-c50df669",
    "title": "CoreWeave credit default swaps hit distress levels as investors sour on AI debt",
    "titleJa": "CoreWeave credit default swaps hit distress levels as investors sour on AI debt",
    "summaryJa": "CoreWeave's credit stress continued to spiral on Thursday amid a broader sell-off in AI-related names.CoreWeave — a so-called neocloud company — has taken on more than $51 billion of debt and obligations to finance its AI infrastructure buildout. It's now facing a rebellion from stock and bond investors as concerns mount about AI overspending and debt levels.",
    "bodyOriginal": "CoreWeave's credit stress continued to spiral on Thursday amid a broader sell-off in AI-related names.\nCoreWeave — a so-called neocloud company — has taken on more than $51 billion of debt and obligations to finance its AI infrastructure buildout. It's now facing a rebellion from stock and bond investors as concerns mount about AI overspending and debt levels.\nYields on CoreWeave debt have continued to climb, with the yield to maturity on its 9.75% bond due in 2031 reaching 15.78%. Bond yields move inversely to prices. Meanwhile, the spread on its five-year credit default swaps, which are insurance against default, at one point soared above 1,140 basis points. It last stood at nearly 1,038 bps — a 16% week-over-week jump and 164% higher than a year ago.\nCredit concerns are spreading into AI equities too. CoreWeave's stock dropped during trading Thursday before recovering and closing 5.94% higher. The moved followed Wednesday's 15.5% nosedive.\nOther neocloud stocks were under similar pressure. Nebius also sank before climbing higher to close 1.29% and and Iren ultimately ended the day down less than 1%.\nAnxiety about AI overspending is also spreading. For instance, shares of Micron Technology and Advanced Micro Devices sold off following a big sell-off in South Korean chip stocks. Micron closed up 1.87%, while AMD fell 1.5%.\nWhile AI debt worries have been rising steadily, investors have suddenly grown skittish about the underlying finances of companies borrowing heavily to buy chips, build data centers, and rent out computing power.\nCoreweave's credit default swaps are one place to see that stress.\nCredit default swaps are contracts where buyers pay for protection in case the borrower can't repay its debt. The spread widening in CoreWeave's CDS means investors view the debt as riskier.\nThe market is \"basically saying 'no mas' to AI debt without operating cash flow support,\" the Evercore ISI trading desk said.\nA spread level of 1,000 basis points or above is generally a sign of credit distress, said Gavan Nolan, executive director of fixed income pricing at S&P Global Market Intelligence.\nNo one is questioning whether demand for CoreWeave's services is real, since the company has contracts with all the big hyperscalers, Nolan said. The question is whether the cash flows will ultimately arrive.\n\"It's obviously heavily negative free cash flow at the moment, and it needs that cash flow to arrive really to justify all the capex that it's spending,\" Nolan said.\n'Self-fulfilling prophecy'\nCEO Mike Intrator dismissed the market moves on Wednesday, according to a memo obtained by CNBC.\n\"When you are building a new type of technology company there will be periods of time when the market misunderstands and acts irrationally,\" he wrote. \"We are confident in our backlog which more than supports all of our debt obligations.\"\nThe backlog is over $100 billion, with around two-thirds of it with investment-grade counterparts including Microsoft, Meta, IBM and Caterpillar, Deutsche Bank said in a note Thursday. The firm reiterated its buy-rating on the stock Wednesday, calling the dislocation a buying opportunity.\n\"The problem is this kind of concern can prove to be a self-fulfilling prophecy, and risks triggering broader issues in other AI-related names,\" said Jim Reid, global head of macro and thematic research.\nDomino effects may already be happening. Oracle's five-year CDS spread also spiked this week. It was last at 282 basis points, a roughly 10% increase in one week.\n\"A downgrade from its BBB rating would risk pressuring IG-only investors into forced sales,\" Reid said.",

points or above is generally a sign of credit distress, said Gavan Nolan, executive director of fixed income pricing at S&P Global Market Intelligence.\nNo one is questioning whether demand for CoreWeave's services is real, since the company has contracts with all the big hyperscalers, Nolan said. The question is whether the cash flows will ultimately arrive.\n\"It's obviously heavily negative free cash flow at the moment, and it needs that cash flow to arrive really to justify all the capex that it's spending,\" Nolan said.\n'Self-fulfilling prophecy'\nCEO Mike Intrator dismissed the market moves on Wednesday, according to a memo obtained by CNBC.\n\"When you are building a new type of technology company there will be periods of time when the market misunderstands and acts irrationally,\" he wrote. \"We are confident in our backlog which more than supports all of our debt obligations.\"\nThe backlog is over $100 billion, with around two-thirds of it with investment-grade counterparts including Microsoft, Meta, IBM and Caterpillar, Deutsche Bank said in a note Thursday. The firm reiterated its buy-rating on the stock Wednesday, calling the dislocation a buying opportunity.\n\"The problem is this kind of concern can prove to be a self-fulfilling prophecy, and risks triggering broader issues in other AI-related names,\" said Jim Reid, global head of macro and thematic research.\nDomino effects may already be happening. Oracle's five-year CDS spread also spiked this week. It was last at 282 basis points, a roughly 10% increase in one week.\n\"A downgrade from its BBB rating would risk pressuring IG-only investors into forced sales,\" Reid said.",

    "id": "tesla-plans-next-generation-roadster-rev-89a41ea6",
    "title": "Tesla plans next-generation Roadster reveal after almost a decade of delays",
    "titleJa": "Tesla plans next-generation Roadster reveal after almost a decade of delays",
    "summaryJa": "Elon Musk first debuted the Roadster refresh concept in 2017 but Tesla has since missed every targeted delivery date.",
    "bodyOriginal": "Tesla is planning to show off its long-delayed next-generation Roadster on Thursday, almost a decade after Elon Musk's company started taking deposits for the electric sports car.\nThe event will be livestreamed from a SpaceX test site in McGregor, Texas, near Waco. It's expected to begin at 7:55 local time (8:55 ET).\nTesla's original Roadster, designed and engineered by a team led by founding CEO Martin Eberhard, used a Lotus Elise chassis and was first delivered in 2008, selling for roughly $100,000 in small volumes until 2012.\nThe next-generation Roadster is expected to be a high-end, low-volume model that relies on SpaceX technology, such as cold gas thrusters, to enable it to hover. Musk fanatics have been gearing up for the demonstration, expressing their excitement on social media, but the Roadster isn't likely to have any material financial impact on the company.\nTesla reopened reservations for the refreshed Roadster in recent weeks, accepting $50,000 deposits from prospective buyers in the U.S., Canada and China. Executives are expected to disclose specific pricing, details and production targets.\nMusk first promoted the refreshed Roadster concept at an event in November 2017, and the following June in a series of tweets. He wrote at that time, \"SpaceX option package for new Tesla Roadster will include ~10 small rocket thrusters arranged seamlessly around car.\" The engines would improve speed and braking, and may \"even allow a Tesla to fly.\"\nTesla started taking $50,000 deposits in 2017, but has since missed every targeted delivery date. As recently as last October, Musk was hyping a Roadster demo that he hoped would happen before the end of 2025. That didn't take place either.\nMusk's former friend and OpenAI co-founder Sam Altman mocked the Tesla CEO in posts on X last year over the extreme delays, showing screenshots of his own reservation and refund requests.\n\"I really was excited for the car! And I understand delays,\" Altman wrote. \"But 7.5 years has felt like a long time to wait.\"\nAltman got his refund, and the two ended up in court over a separate matter earlier this year related to OpenAI's governance and ownership structure.\nOthers have kept their reservations.\nLawrence O'Connor, founder and CEO of Other World Computing in Austin, Texas, told CNBC he reserved a Founder's Edition of the new Roadster in November 2017, effectively giving the company what he called an \"interest-free loan\" of $250,000.\nO'Connor wrote in a message that he plans to attend Thursday's event and is \"excited to see what has been 9 years in the making.\"\nAccording to filings with the Federal Aviation Administration, Tesla established a no-fly zone around the SpaceX facility where it plans to show off the vehicle. The company had to scrap a demo on Oct. 1 due to weather issues.\nTesla is scheduled to report third-quarter results after the bell on Wednesday.",
    "bodyJa": "Tesla is planning to show off its long-delayed next-generation Roadster on Thursday, almost a decade after Elon Musk's company started taking deposits for the electric sports car.\nThe event will be livestreamed from a SpaceX test site in McGregor, Texas, near Waco. It's expected to begin at 7:55 local time (8:55 ET).\nTesla's original Roadster, designed and engineered by a team led by founding CEO Martin Eberhard, used a Lotus Elise chassis and was first delivered in 2008, selling for roughly $100,000 in small volumes until 2012.\nThe next-generation Roadster is expected to be a high-end, low-volume model that relies on SpaceX technology, such as cold gas thrusters, to enable it to hover. Musk fanatics have been gearing up for the demonstration, expressing their excitement on social media, but the Roadster isn't likely to have any material financial impact on the company.\nTesla reopened reservations for the refreshed Roadster in recent weeks, accepting $50,000 deposits from prospective buyers in the U.S., Canada and China. Executives are expected to disclose specific pricing, details and production targets.\nMusk first promoted the refreshed Roadster concept at an event in November 2017, and the following June in a series of tweets. He wrote at that time, \"SpaceX option package for new Tesla Roadster will include ~10 small rocket thrusters arranged seamlessly around car.\" The engines would improve speed and braking, and may \"even allow a Tesla to fly.\"\nTesla started taking $50,000 deposits in 2017, but has since missed every targeted delivery date. As recently as last October, Musk was hyping a Roadster demo that he hoped would happen before the end of 2025. That didn't take place either.\nMusk's former friend and OpenAI co-founder Sam Altman mocked the Tesla CEO in posts on X last year over the extreme delays, showing screenshots of his own reservation and refund requests.\n\"I really was excited for the car! And I understand delays,\" Altman wrote. \"But 7.5 years has felt like a long time to wait.\"\nAltman got his refund, and the two ended up in court over a separate matter earlier this year related to OpenAI's governance and ownership structure.\nOthers have kept their reservations.\nLawrence O'Connor, founder and CEO of Other World Computing in Austin, Texas, told CNBC he reserved a Founder's Edition of the new Roadster in November 2017, effectively giving the company what he called an \"interest-free loan\" of $250,000.\nO'Connor wrote in a message that he plans to attend Thursday's event and is \"excited to see what has been 9 years in the making.\"\nAccording to filings with the Federal Aviation Administration, Tesla established a no-fly zone around the SpaceX facility where it plans to show off the vehicle. The company had to scrap a demo on Oct. 1 due to weather issues.\nTesla is scheduled to report third-quarter results after the bell on Wednesday.",
