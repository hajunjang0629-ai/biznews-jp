ed this year, according to a CNBC analysis of AdImpact data, Fox News polling from late September found El-Sayed's favorable rating among registered voters up five points from its early August survey, while Republican Mike Rogers' fell four points.\nPart of the challenge is diminishing returns on ads as Election Day nears. Political advertising experts tell CNBC that as campaigns repeatedly target the same small pool of persuadable voters, each additional dollar is less likely to reach someone who has not already heard the message.\n\"When an undecided voter has already seen 20 negative ads today, the 21st ad doesn't persuade them. It just gets tuned out,\" said Michael Beckel, money in politics reform director at Issue One. \"Their eyes glaze over.\" Issue One works to reduce the influence of money in politics and has a board that includes former Democratic and Republican elected officials.\nStill, some Republicans counter that topline poll movement is the wrong barometer. They say the September cash influx helped keep vulnerable candidates competitive as the political environment deteriorated.\nIn Texas, Republicans spent $121.5 million on the Senate race in September, up from just $5.5 million over the previous three months, according to a CNBC analysis of AdImpact data, while Musk's America PAC added direct mail and canvassing. Republicans involved in the race said the picture could have been far worse without that support.\n\"The spending hasn't put Paxton ahead, but it kept a messy race and flawed candidate from becoming an unwinnable one,\" said a Republican operative involved in the Texas Senate race, who was granted anonymity to speak candidly about the state of the contest.\nMaine offers another test. Republicans have poured more than $50 million into the state to support incumbent Sen. Susan Collins, nearly twice Democratic spending, according to a CNBC analysis of FEC filings. Since early September, FiftyPlusOne's polling average has tightened modestly, from about a three-point advantage for Democrat Troy Jackson in early September to roughly two points now.\nFrom offense to defense\nThe clearest sign that the GOP's cash advantage has stalled, however, is where the money is migrating.\nIn April, the Senate Leadership Fund announced a record $342 million advertising program across eight states designed to protect the GOP majority and expand the map. Texas, Kansas and Nebraska were not among the states.\nSince Sept. 1, the SLF and affiliated groups — according to a CNBC analysis of AdImpact data — have spent or committed roughly $180 million across those three states, all of which Trump carried by double digits in 2024.\n\"Outside groups are diverting millions into deep-red territory to build defensive moats, leaving pickup opportunities starved for cash in the final stretch,\" Beckel told CNBC.\nBut those emergency defenses have come at a cost, diverting money from races Republicans once hoped to win and forcing national groups to narrow the map elsewhere.\nIn North Carolina, the Senate Leadership Fund initially pledged $71 million to back Republican Michael Whatley. On Oct. 2, however, the group pulled most of its remaining ad reservations after spending about $32.8 million, according to a CNBC analysis of AdImpact data, as Democrat Roy Cooper continued to hold a double-digit lead in FiftyPlusOne's polling average.\nIt's a striking retreat in a perennial battleground where Republicans have won every presidential and Senate election since 2008.\nThe same triage is unfolding in the House.\nThe Congressional Leadership Fund cut off spending this week for vulnerable GOP Reps. Thomas Kean Jr. of New Jersey and Mariannette Miller-Meeks of Iowa following grim internal polling. The group also shelved efforts to flip Democratic-held seats represented by Reps. Kristen McDonald Rivet of Michigan and Greg Landsman of Ohio. The spending shifts were first reported by the New York Times.\nThose four races had already absorbed about $13.7 million in Congressional Leadership Fund spending through Oct. 14, according to a CNBC analysis of AdImpact data. CLF is redirecting roughly $10 million from those races across 16 other districts, according to the Times.\nThe new spending includes the South Texas seat held by Republican Rep. Monica De La Cruz, a district Trump carried by 18 points in 2024. De La Cruz herself won reelection by about 14 points in 2024.",

    "title": "U.S. raises Mastercard, Citigroup China market access in bilateral Bangkok talks, official says",
    "titleJa": "U.S. raises Mastercard, Citigroup China market access in bilateral Bangkok talks, official says",
    "summaryJa": "The U.S. raised market access issues for Mastercard and Citigroup in China during bilateral meetings in Bangkok this week, a U.S. Treasury official says.",
    "bodyOriginal": "BANGKOK – U.S. officials pressed Beijing on market access issues for Mastercard Inc and Citigroup Inc during at least two bilateral meetings with Chinese counterparts in Bangkok this week, according to a U.S. Treasury official.\nThe Treasury delegation, led by Deputy Secretary Francis Brooke, held bilateral meetings with officials from the People's Bank of China and the finance ministry on the sidelines of the Group of 20 finance meetings and the IMF-World Bank annual gathering this week, the official said, speaking on condition of anonymity to discuss the closed-door meetings.\nThe talks included market access for U.S. companies, including Mastercard, Visa and Citigroup, the official said, adding that regulatory approval was part of the agreement reached during the meeting between Presidents Donald Trump and Xi Jinping during the latter's state visit in Washington last month.\nThe sideline meetings in Bangkok continued discussions on implementing these deals, the official said.\nThe PBOC, China's National Financial Regulatory Administration, China Securities Regulatory Commission, Chinese embassies in Singapore and Thailand, the U.S. Treasury Department press office and Visa did not immediately respond to CNBC's request for comment. Citigroup and Mastercard declined to comment.\nThe progress follows China's Oct. 13 approval for Visa Inc. to begin preparing a wholly owned domestic card-clearing business. Visa has up to a year to prepare before it applies for an operating license, the PBOC has said.\nChina has opened much of its financial sector to foreign firms since 2018, gradually lifting foreign ownership caps on services such as securities, futures and fund management. It still limits cross-border capital flows and has kept state-backed domestic players dominant in payments.\nMastercard currently operates yuan card payments in China through a local joint venture with NetsUnion Clearing Corp., which began operating in 2024. The pending approval would allow it to operate as an independent entity, the person said.\nCitigroup — which has hired several dozen employees for its China unit — is seeking a wholly owned securities license to conduct A-share brokerage, underwriting, research and principal trading businesses in the onshore market, two people familiar with the industry said, requesting anonymity for discussing private matters.\nOne of the two people close to Citigroup said the bank planned to increase its China securities staff to about 100.\nThe bank applied in late 2021, and Reuters reported last month that approval could come soon.\nTrump and Xi are expected to meet in person for the third time this year in Shenzhen, China, for the Asia-Pacific Economic Cooperation summit in November.\n\"The move suggests the US-China trade environment remains benign, and Beijing is keen to keep up the momentum,\" said Dan Wang, China director at Eurasia Group.\nLicensing U.S. financial firms is a \"limited concession\" on market access, she said, though it signals China is continuing to open up, and \"this should marginally bolster investor confidence in Chinese assets.\"",

ld allow it to operate as an independent entity, the person said.\nCitigroup — which has hired several dozen employees for its China unit — is seeking a wholly owned securities license to conduct A-share brokerage, underwriting, research and principal trading businesses in the onshore market, two people familiar with the industry said, requesting anonymity for discussing private matters.\nOne of the two people close to Citigroup said the bank planned to increase its China securities staff to about 100.\nThe bank applied in late 2021, and Reuters reported last month that approval could come soon.\nTrump and Xi are expected to meet in person for the third time this year in Shenzhen, China, for the Asia-Pacific Economic Cooperation summit in November.\n\"The move suggests the US-China trade environment remains benign, and Beijing is keen to keep up the momentum,\" said Dan Wang, China director at Eurasia Group.\nLicensing U.S. financial firms is a \"limited concession\" on market access, she said, though it signals China is continuing to open up, and \"this should marginally bolster investor confidence in Chinese assets.\"",

    "bodyOriginal": "The spread is widening between AI leaders OpenAI and Anthropic as a sell-off in CoreWeave leads neocloud stocks lower.\nOpenAI's valuation is down more than 4% the past 24 hours after briefly slipping under $1.5 trillion, according to perpetual futures pricing on decentralized exchange Hyperliquid. Meanwhile, Anthropic perps are up 2.4% over the same time period, recovering an overnight dip and indicating a valuation of just over $2 trillion.\nPerpetuals are bets that never expire. They maintained by \"deployers\" on Hyperliquid's blockchain infrastructure that determine a funding rate for going long or short the futures based on a spot \"oracle\" price that uses third-party data like private funding rounds and secondary market transactions to estimate private-market prices.\nOpen interest, defined by Hyperliquid as the sum of long and short positions on a contract, is more than five times bigger in Anthropic than OpenAI — more than $41 million, compared to less than $7 million in OpenAI.\nRight now the deployer behind these pre-IPO contracts – the developer building the exchange – is Entropy IO. TradeXYZ, the most prominent developer on the platform, typically does not list pre-IPO perps until S-1s are public, according to David Schamis, CEO of Hyperliquid Strategies, the publicly traded treasury company that invests in the HYPE token that powers the exchange.\n\"Liquidity will probably be deeper once TradeXYZ lists these companies,\" Schamis said in a call. \"Generally these will trade at a premium to the IPO price but they do a good job predicting where it will be post-IPO.\"\nThe bigger price drop in OpenAI perps reflects the company's closer ties to GPU rent-a-center CoreWeave, whose shares touched a new one-year low Thursday, extending a decline over that period to 54%, as concerns mount over the company's debt-financing strategy.\nIn April, CoreWeave announced a deal with Anthropic to power the company's Claude products, but did not discl function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
