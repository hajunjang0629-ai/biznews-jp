    "title": "Fed officials saw need for rate hike if inflation doesn't cool, minutes show",
    "titleJa": "議事録によると、FRB当局者らはインフレが冷え込まなければ利上げの必要があると考えていた",
    "summaryJa": "水曜日に公表された議事録によると、連邦準備理事会当局者らは前回の会合で、インフレ抑制にさらなる進展がなければすぐに利上げする必要があるとの考えを示した。７月２８─２９日に開催された会合の概要には「多くの参加者は、インフレ率が低下しなければ政策引き締めが必要になる可能性が高いと評価した」と述べた。 「一部の参加者は、現在の金融状況はインフレ率を２％に戻すのに十分な制限的ではないのではないかとコメントした。」",
    "bodyOriginal": "Federal Reserve officials indicated at their last meeting that they would need to raise interest rates soon unless there was more progress on bringing down inflation, minutes released Wednesday showed.\n\"Many participants assessed that policy tightening would likely be necessary if inflation did not decline,\" stated the summary of the meeting, held July 28-29. \"Some participants commented that financial conditions might not currently be sufficiently restrictive to facilitate a return of inflation to 2 percent.\"\nUltimately, the Federal Open Market Committee voted 9-3 to keep the federal funds rate targeted in a range between 3.5%-3.75%, where it has been all year. The overnight borrowing rate serves as a guidepost for a variety of consumer debt including mortgages, credit cards and auto loans.\nThose who voted against the decision favored a quarter percentage point increase. Minutes indicated that the dissenters \"judged that doing so would likely help forestall the need for a steeper and potentially more costly sequence of tightening moves at a later stage.\"\nEach of the three \"no\" votes was regional presidents – Beth Hammack of Cleveland, Lorie Logan of Dallas and Neel Kashkari of Minneapolis.\nSince the July meeting, data releases mostly have shown modest price increases on a monthly basis, though the major indicators all have inflation well above the Fed's 2% target. The central bank's primary forecasting data point, the personal consumption expenditures price index, actually saw a 0.1% decline for June, though the annual rate was still at 3.7%.\nAt the same time, the employment picture has softened.\nNonfarm payrolls fell by 23,000 in July even as the unemployment rate dropped to 4.1%, the latter primarily due to a shrinking labor force. Fed officials mostly have said they are more concerned with inflation than the labor market, though that was before the most recent data.\nFed Chairman Kevin Warsh has shown an inclination to be patient when it comes to rates. Markets took remarks he made in his post-meeting news conference as dovish on inflation, which in turn sent Treasury yields sharply higher.\nYields have continued to climb, particularly at the longer part of the curve. However, they tumbled Wednesday following a Treasury Department announcement that it would step up its purchases of longer-dated government debt, the part of the duration curve that has been particularly sensitive lately.\nFollowing the recent run of inflation data, market pricing switched to an expectation for the Fed to stay on hold likely until December before it hikes again. Previously, traders had been expecting a September increase.\nThe summary also reported a discussion about changing the FOMC meeting schedule.\nThe minutes pointed out that economic indicators changed little since the June meeting. Warsh \"observed\" that reducing the current meeting schedule from eight per year to six, \"held roughly every two months\" might be productive.\nSuch a move \"would allow more information to accumulate between meetings than under current practice and provide policymakers and the staff more time to consider strategic monetary policy issues,\" the minutes stated.\n\"The Chairman asked for input from the Committee on these issues, but no decisions regarding possible changes in the meeting schedule were made, and the Chairman indicated that any change in practice would not affect the schedule over the balance of 2026,\" the document said.\nAlso at the meeting, the board discussed \"an intermeeting incident involving a disruption to transaction settlements.\" The minutes noted that the Fed's policy of maintaining \"ample\" bank reserves \"helped maintain the orderly functioning of money markets in the face of this disruption.\"\nOn a related note, the committee held what appeared to be an extensive discussion of the Fed's balance sheet and its various bond holdings. Committee members said a task force Warsh has set up to examine the issue would be helpful.",
    "bodyJa": "水曜日に公表された議事録によると、連邦準備理事会当局者らは前回の会合で、インフレ抑制にさらなる進展がなければすぐに利上げする必要があるとの考えを示した。\n７月２８─２９日に開催された会合の概要には「多くの参加者は、インフレ率が低下しなければ政策引き締めが必要になる可能性が高いと評価した」と述べた。 「一部の参加者は、現在の金融状況はインフレ率を２％に戻すのに十分な制限的ではないのではないかとコメントした。」\n最終的に連邦公開市場委員会は９対３でフェデラルファンド金利の目標を年間を通じて３．５％─３．７５％の範囲に維持することを決定した。翌日物借入金利は、住宅ローン、クレジット カード、自動車ローンなどのさまざまな消費者負債の道しるべとして機能します。\nこの決定に反対票を投じた人は、4分の1ポイントの引き上げを支持した。議事録では、反対派が「そうすることで、後の段階でより急ピッチで潜在的によりコストのかかる一連の引き締め策の必要性を回避できる可能性が高いと判断した」と記されている。\n「反対」票を投じた3人はそれぞれ、クリーブランドのベス・ハンマック氏、ダラスのローリー・ローガン氏、ミネアポリスのニール・カシュカリ氏という地域の大統領だった。\n7月の会合以降、発表されたデータのほとんどは月次ベースで小幅な物価上昇を示しているが、主要指標はいずれもインフレ率がFRBの目標である2％を大きく上回っている。中銀の主要な予測データポイントである個人消費支出価格指数は、実際には6月に0.1％下落したが、年率は依然として3.7％だった。\n同時に、雇用情勢も軟化している。\n失業率が4.1%に低下したにもかかわらず、7月の非農業部門雇用者数は2万3,000人減少した。失業率の主な原因は労働力人口の減少である。 FRB当局者らは労働市場よりもインフレを懸念していると大半が発言しているが、それは最新の統計が発表される前の話だ。\nFRBのケビン・ウォーシュ議長は金利に関しては忍耐強い傾向を示している。市場は同氏の会合後の記者会見での発言をインフレに関してハト派的なものと受け止め、それが米国債利回りを急上昇させた。\n特に曲線の長い部分で利回りは上昇を続けている。しかし、最近特に敏感になっているデュレーションカーブの一部である長期国債の買い入れを強化するという財務省の発表を受けて水曜日には下落した。\n最近の一連のインフレ統計を受けて、市場の織り込みはFRBがおそらく12月まで利上げを据え置くだろうという予想に切り替わり、その後再び利上げを行った。これまでトレーダーらは９月の増加を予想していた。\n概要では、FOMC会合の日程変更に関する議論も報告された。\n議事要旨では、経済指標は６月会合以降ほとんど変化がないと指摘。ウォーシュ氏は、現在の会議スケジュールを年8回から6回に減らし、「およそ2か月ごとに開催」するのが生産的かもしれないと「観察」した。\n議事要旨には、こうした措置により「現在の慣例よりも会合の間により多くの情報が蓄積され、政策立案者やスタッフに戦略的な金融政策の問題を検討するためのより多くの時間が与えられる」と記されている。\n「議長はこれらの問題について委員会に意見を求めたが、会議スケジュールの変更の可能性に関する決定は下されておらず、議長は実務上のいかなる変更も2026年までのスケジュールに影響を及ぼさないと示唆した」と文書には記されている。\nまたこの会合では、取締役会は「取引決済の妨害を伴う会合中の事件」についても議論した。議事要旨は、「潤沢な」銀行準備金を維持するというFRBの政策が「この混乱に直面しても短期金融市場の秩序ある機能を維持するのに役立っている」と指摘した。\nこれに関連して、委員会はFRBのバランスシートと保有するさまざまな債券について広範な議論を行ったと思われる内容を開催した。委員会メンバーらは、ウォーシュ氏がこの問題を調査するために設置した特別委員会が役立つだろうと述べた。",

    "id": "doj-cites-comey-s-novel-in-urging-judge-982d10e2",
    "title": "DOJ cites Comey's novel in urging judge not to toss '86 47' seashells threat to Trump case",
    "titleJa": "司法省、コミー氏の小説を引用して判事にトランプ事件に「86 47」貝殻を投げる脅迫をしないよう求める",
    "summaryJa": "司法省はジェームズ・コミー氏の小説を引用し、ノースカロライナ州のビーチで「86 47」という数字を作った貝殻の写真をインスタグラムに投稿し、ドナルド・トランプ大統領を殺害すると脅迫したとされる元FBI長官に対する刑事告発を却下しないよう連邦判事に訴えた。検察側は火曜夜遅くに裁判所に提出した新たな書類の中で、コミー氏が架空の本「FDRドライブ」に登場する右翼ポッドキャスターと同様に、自分の敵を殺害することを示唆する暗号化されたメッセージをフォロワーらに送信したと示唆した。",
    "bodyOriginal": "The Department of Justice cited a novel written by James Comey as it urged a federal judge not to dismiss criminal charges against the former FBI director for allegedly threatening to kill President Donald Trump by posting an Instagram photo of seashells on a North Carolina beach forming the numbers \"86 47.\"\nProsecutors in a new court filing late Tuesday night suggested that Comey, like a right-wing podcaster featured in his fictional book \"FDR Drive,\" sent coded messages to his followers suggesting they kill an enemy of his.\n\"On May 15, 2025, a charismatic leader named James Comey, through the wonder of the internet, posted a coded message to his followers meaning 'kill' or 'get rid of' (a euphemism for 'kill') President Trump,'\" the filing in U.S. District Court for the Eastern District of North Carolina by U.S. Attorney W. Ellis Boyle's office says.\nThe filing was one of several Tuesday in response to a filing by Comey's lawyers seeking to dismiss the indictment against him on the grounds of vindictive and selective prosecution. Comey is a longtime critic of Trump and a verbal target of the president, who fired him as FBI director in 2017.\nComey's attorneys say he did not mean to threaten Trump with the seashells post, noting that the term \"86\" is used in restaurants by staff to indicate a menu item is no longer available. Trump is the 47th president of the United States.\nBut Boyle's office, in its new filing, says, \"There is no serious dispute that an objective viewer of Comey's post could read it to mean 'Kill President Trump.'\"\n\"Comey has admitted that the '47' referred to President Trump,\" the filing says. \"And Cassell's Dictionary of Slang (2nd edition) defines '86' to mean: to throw out, get rid of (1940's), (1970) to kill, to murder to execute judicially, (1980) to be finished, ready to leave or out of an item or be exhausted.\"\nIn an affidavit filed on Tuesday night, Boyle said that \"no one ordered, directed or pressured\" him to indict Comey.\nComey's lawyers, in their own filing in late July, said that the phrase \"86 47\" is a \"well-known political slogan that expresses opposition to the president.\"\n\"No reasonable observer would understand the phrase '86 47′ to connote violence at all — let alone to threaten that Mr. Comey personally would commit violence against the President,\" the defense motion to dismiss says.\nComey's filing also noted that in May 2026, at the personal direction of the U.S. Attorney for the Eastern District of North Carolina, \"the FBI conducted both open-source queries and artificial intelligence searches — namely, on Google AI and ChatGPT — about the term '86.'\"\n\"The search yielded varying results, including one that stated: 'Many career law enforcement officials, including former FBI agents, have publicly disputed this, stating they never heard \"86\" being used for murder in 35 + years of duty, considering it purely a restaurant or bar item for removal.\"\n\"Another search returned a document indicating that the Merriam-Webster dictionary does not officially enter a violent meaning for '86' because \"it is relatively recent and lacks widespread use compared to its hospitality meanings.\"\nComey was previously indicted by a federal grand jury in Virginia in September 2025 on charges related to allegedly lying during testimony at the Senate Judiciary Committee in 2020. He denied any wrongdoing.\nA judge dismissed that first case in November after ruling that Lindsey Halligan, a former personal lawyer for Trump, was unlawfully appointed as U.S. attorney for the Eastern District of Virginia, and as a result did not have authority to obtain the indictment against Comey.",
    "bodyJa": "司法省はジェームズ・コミー氏の小説を引用し、ノースカロライナ州のビーチで「86 47」という数字を作った貝殻の写真をインスタグラムに投稿し、ドナルド・トランプ大統領を殺害すると脅迫したとされる元FBI長官に対する刑事告発を却下しないよう連邦判事に訴えた。\n検察側は火曜夜遅くに裁判所に提出した新たな書類の中で、コミー氏が架空の本「FDRドライブ」に登場する右翼ポッドキャスターと同様に、自分の敵を殺害することを示唆する暗号化されたメッセージをフォロワーらに送信したと示唆した。\n「2025年5月15日、ジェームズ・コミーというカリスマ的指導者は、インターネットの驚異を利用して、トランプ大統領を『殺す』か『排除する』（『殺す』の婉曲表現）」を意味する暗号メッセージをフォロワーに投稿した」と、米国検事W・エリス・ボイル事務所がノースカロライナ州東部地区連邦地方裁判所に提出した提出文書には記されている。\nこの提出は、執念深く選択的な訴追を理由にコミー氏に対する起訴の却下を求めるコミー氏の弁護士らによる火曜日の提出書類のうちの１件であった。コミー氏は長年トランプ氏を批判しており、大統領の言葉の標的となっており、2017年に同氏をFBI長官から解任した。\nコミー氏の弁護士は、コミー氏は貝殻投稿でトランプ氏を脅すつもりはなかったと述べ、「86」という言葉はレストランでスタッフがメニューがもう提供できないことを示すために使われていると指摘した。トランプは第47代アメリカ合衆国大統領です。\nしかし、ボイル氏の事務所は新たな提出書類の中で、「コミー氏の投稿を客観的に見た人が、それが『トランプ大統領を殺せ』という意味であると解釈できることに重大な異論はない」と述べている。\n提出書類には「コミー氏は『47』がトランプ大統領を指していたことを認めた」と書かれている。 「そして、カッセルのスラング辞典（第2版）は、『86』の意味を次のように定義しています：捨てる、取り除く（1940年代）、（1970年）殺す、司法的に処刑する殺人、（1980年）終了する、アイテムを残すか取り出す準備ができている、または疲れ果てること。」\nボイル氏は火曜日の夜に提出した宣誓供述書の中で、コミー氏を起訴するよう「誰も命令、指示、圧力をかけなかった」と述べた。\nコミー氏の弁護士らは7月下旬の提出書類で、「86 47」というフレーズは「大統領への反対を表明するよく知られた政治的スローガン」であると述べた。\n棄却を求める弁護側動議は、「合理的な観察者であれば、『86 47』という言葉が暴力を暗示するものであることを理解するはずはない。ましてやコミー氏が個人的に大統領に対して暴力を振るうと脅すなどということは理解できない」と述べている。\nコミー氏の提出書類には、2026年5月にノースカロライナ州東部地区連邦検事の個人的な指示で、「FBIは『86』という用語について、オープンソースのクエリと人工知能による検索、つまりGoogle AIとChatGPTの両方を実施した」とも記されている。\n「検索ではさまざまな結果が得られ、その中には次のような内容も含まれていた。『元FBI捜査官を含む多くのキャリア法執行官は、35年以上の勤務の中で「86」が殺人に使われたのを聞いたことがない、と純粋にレストランやバーの撤去対象品だと考え、これに公に異議を唱えている。」\n「別の検索では、メリアム・ウェブスター辞書に『86』が正式に暴力的な意味として記載されていないことを示す文書が返された。その理由は、「それは比較的最近のものであり、もてなしの意味に比べて広く使用されていない」ためである。\nコミー氏は以前、2020年の上院司法委員会での証言中に虚偽を述べた疑いで2025年9月にバージニア州の連邦大陪審に起訴されていたが、同氏はいかなる不正行為も否定していた。\n判事は、トランプ大統領の元個人弁護士リンジー・ハリガン氏がバージニア州東部地区の連邦検事に不法に任命され、その結果コミー氏に対する起訴を取得する権限がなかったとの判決を下し、11月に最初の訴訟を却下した。",

  {
    "id": "meta-s-legal-troubles-has-options-trader-9a2ea076",
    "title": "Meta's legal troubles has options traders eyeing the 'jade lizard'",
    "titleJa": "メタの法的トラブルでオプショントレーダーらは「ヒスイトカゲ」に注目",
    "summaryJa": "オプション取引の多くの利点の 1 つは、レンジ内株で利益を得ることができることです。メタプラットフォームの株式は今、そのチャンスをもたらしています。上値は訴訟によって制限されており、下値の多くはすでに織り込まれているため、オプションプレミアムの上昇を掴み、双方を売却することは理にかなっているかもしれない。 「翡翠トカゲ」という奇妙な名前のオプション戦略 (これについては後ほど詳しく説明します) は、ショートストランドによる無制限の上昇リスクなしで、多額のプレミアムを集めます。",
    "bodyOriginal": "One of the many beauties of options trading is the ability to make money on a rangebound stock. Shares of Meta Platforms are presenting that opportunity right now.\nWith its upside capped by litigation and much of the downside has already been priced in, it may make sense to try to capture some elevated options premium and sell both sides. The curiously named options strategy \"jade lizard\" — more on this in a second — collects a rich premium without the unlimited upside risk of a short strangle.\nAs opening statements began in Oakland today, where 29 state attorneys general accuse Meta of deliberately designing Facebook and Instagram to hook young users, META shares are off more than 30% from the highs of a year ago.\nThe headline figure, a theoretical worst case of $1.4 trillion in damages has been floated, although I think that number borders on the absurd, especially if one considers the inevitable appeal that would follow.\nBehind that case sit more than 3,000 personal-injury suits in the federal MDL (multi-district litigation that combines similar lawsuits/related cases that seek to answer similar questions of fact), roughly 1,300 school-district claims, a nearly $1 billion New Mexico judgment, and a $6 million bellwether loss in Los Angeles. While virtually no one believes the trillion-dollar headline represents the real risk, nobody should expect a sustained rally through a seven-week trial either.\nMuch of the downside, arguably, has already been paid for. Meta is the worst-performing stock in the \"Magnificent Seven\" over the past 12 months, the market cap having fallen more than $600 billion so far. It is also acting as a boat anchor on the communications sector generally as it is the largest constituent. Granted some of that decline is probably also concerns about AI capex, but at about 22 times earnings with revenue still growing 28% a lot of anxiety is already baked in the price.\nEnter the jade lizard.\nIn this strategy, you sell an out-of-the-money put and also sell an out-of-the-money call spread. Often this trade is structured such that the total premium collected exceeds the width of the call spread, eliminating upside risk entirely, although without a potential catalyst to drive shares sharply higher, a modest amount of upside risk would also be acceptable. Implied volatility is, unsurprisingly, slightly inflated by the lawsuit(s). The September 25th expiration captures some of that while avoiding the Q3 earnings report expected in late October and also falls short of the anticipated length of the trial of six to eight weeks.\nIf shares sit between the short strikes at expiration, YOU keep the full credit. A rally through the call spread risks less than 5% of the current stock price and the downside risk is that one purchases the stock at less than $480/share, another 12% lower than where the stock is currently trading and below the tariff tantrum lows of late April 2025. If the stock does fall to those levels, and one purchases the stock around $480 share, one could look to then collect premium against the resulting position by selling covered calls, or covered call spreads (a position we currently have in META).",
    "bodyJa": "オプション取引の多くの利点の 1 つは、レンジ内株で利益を得ることができることです。メタプラットフォームの株式は今、そのチャンスをもたらしています。\n上値は訴訟によって制限されており、下値の多くはすでに織り込まれているため、オプションプレミアムの上昇を掴み、双方を売却することは理にかなっているかもしれない。 「翡翠トカゲ」という奇妙な名前のオプション戦略 (これについては後ほど詳しく説明します) は、ショートストランドによる無制限の上昇リスクなしで、多額のプレミアムを集めます。\n今日オークランドで冒頭陳述が始まり、29人の州司法長官が若いユーザーを引き付けるためにFacebookとInstagramを意図的に設計したとしてMetaを非難したが、META株は1年前の高値から30％以上下落した。\n理論上の最悪の損害賠償額は1兆4000億ドルという見出しの数字が浮上しているが、特にその後に起こる避けられない控訴を考慮すると、この数字は不条理に近いと私は思う。\nこの訴訟の背後には、連邦MDL（同様の事実問題への答えを求める同様の訴訟/関連訴訟を組み合わせた複数地区訴訟）での3,000件を超える人身傷害訴訟、約1,300件の学区の請求、10億ドル近いニューメキシコ州の判決、そしてロサンゼルスでの600万ドルの先導的損失が横たわっている。兆ドルという見出しが本当のリスクを表しているとは事実上誰も信じていないが、7週間の裁判を通じて持続的な上昇を期待する人もいないはずだ。\nおそらく、マイナス面の多くはすでに支払われています。メタは過去１２カ月で「マグニフィセント・セブン」の中で最もパフォーマンスの悪い銘柄で、時価総額はこれまでに６０００億ドル以上下落している。また、最大の構成要素であるため、一般に通信セクターのボートアンカーとしても機能しています。確かに、その減少の一部には AI の設備投資への懸念もあると思われますが、収益が依然として 28% 成長しているにもかかわらず、収益が約 22 倍となっていることから、すでに多くの不安が価格に組み込まれています。\nヒスイトカゲを入力します。\nこの戦略では、アウト オブ ザ マネーのプットを売り、アウト オブ ザ マネーのコール スプレッドも売ります。多くの場合、この取引は、集められたプレミアムの総額がコールスプレッドの幅を超えるように構成されており、上昇リスクを完全に排除しますが、株価を急激に上昇させる潜在的な要因がなければ、適度な上昇リスクも許容されるでしょう。当然のことながら、インプライド・ボラティリティは訴訟によって若干上昇します。 9 月 25 日の有効期限は、10 月下旬に予定されている第 3 四半期決算報告を回避しながら、その一部を確保するものであり、予想される試用期間の 6 ～ 8 週間にも達しません。\n満期の空売り権利行使の間に株式が残っている場合、あなたは全額の信用を保持することになります。コールスプレッドによる上昇リスクは現在の株価の5%未満であり、下値リスクは、株価が現在取引されている価格よりさらに12%低く、2025年4月下旬の関税癇癪安値を下回る1株あたり480ドル未満で株式を購入することである。株価がその水準まで下落し、480ドル付近で株式を購入した場合、カバードコールまたはカバードコールスプレッド（現在当社がポジションを保有しているポジション）を売却することで、得られたポジションに対してプレミアムを回収することを検討する可能性がある。 META にあります)。",

    "id": "trump-touted-a-deal-to-avert-new-tariffs-0846080b",
    "title": "Trump touted a deal to avert new tariffs on Canada. Here's what we know so far",
    "titleJa": "トランプ大統領はカナダに対する新たな関税を回避するための合意を宣伝した。これまでにわかっていることは次のとおりです",
    "summaryJa": "米国による特定のカナダ製品に対する大規模関税の発動まで2時間も経たないうちに、ドナルド・トランプ大統領は新たな関税を回避するための暫定合意を発表した。ワイン、ホッケースティック、その他さまざまなカナダ製品の輸入に計画されている50％の関税がすでに大きな打撃を与えていると警告する企業にとって、延期はつかの間の休息にすぎない可能性がある。",
    "bodyOriginal": "Less than two hours before massive U.S. tariffs on certain Canadian goods were set to switch on, President Donald Trump announced a tentative deal to stave off the new duties.\nThe postponement could be just a brief respite for businesses who warn that the planned 50% tariffs on imports of wine, hockey sticks and a range of other Canadian products are already taking a toll.\nThe new import taxes on about $20 billion worth of goods were unveiled last month in response to what the Trump administration described as Canadian trade discrimination against key U.S. industries.\nThe tariffs were set to take effect Wednesday at 12:01 a.m. ET. But at 10:15 p.m. Tuesday, Trump announced on Truth Social that he would pause the tariffs for three days, \"based on the fact that Canada and the U.S.A., subject to the finalization of documents, have a DEAL!\"\nTrump's statement on the to-be-finalized deal included few details. But it hinted that an agreement with Canada could include restarting Keystone XL, the planned oil pipeline from Alberta to Nebraska that was scrapped in 2021 by then-President Joe Biden.\n\"The great Keystone XL Pipeline, long ago killed by Sleepy Joe Biden, may be awoken from the grave!\" Trump wrote in the post.\nIn a follow-up post, Trump shared an AI-generated image depicting him pulling a pipeline labeled \"KEYSTONE\" out of the ground.\nCanadian Prime Minister Mark Carney, in a statement released Tuesday night, was more circumspect.\n\"Substantial progress has been made, although there is important work still to be done,\" Carney's statement said.\nIn another post midday Wednesday, Carney said the two sides are \"moving towards an agreement that reinforces that Canadian advantage, including by securing the best terms in each of Canada's most important strategic sectors and providing greater certainty about our future trading relationship.\"\nAsked Wednesday morning about the coming deal, Trump claimed that Canada made multiple concessions, including lowering its retaliatory tariffs on U.S. goods.\n\"We've come to a deal with Canada\" after a \"very good conversation\" with Carney, Trump told reporters while touring construction projects on the White House grounds.\n\"They called yesterday and they gave us the points that we had to have,\" Trump said, calling it a \"very fair deal for both.\"\nTrump did not mention Keystone XL. But he said Canadian tariffs \"will be non-existent for our farmers,\" without specifying which duties he was referring to. Trump's 50% tariff proposal was partly based on Canada's alleged discrimination against the U.S. dairy industry.\nAsked if the U.S. would lower its tariffs on Canadian autos as part of the deal — a top goal for Ottawa's trade negotiators — Trump said, \"We're doing certain things.\"\n\"We've got to give something,\" he added. \"They were paying a high number, we're reducing it a little bit, it's good for everybody.\"\n\"Basically, we have no tariffs going into Canada anymore. Canada was charging us tremendous tariffs. We no longer have any tariffs,\" he said.\nThe president noted, however, that the deal is \"subject to the finalization of documents.\"\nThe comments came after a presidential proclamation released Tuesday night signaled that Canada would lower or remove its trade barriers on the U.S. as part of an agreement.\n\"According to senior executive branch officials, Canada has expressed a commitment to remove the discriminations or unreasonable and unequal impositions\" that spurred the 50% tariff threat, according to the proclamation.\nThe same evening, U.S. Trade Representative Jamieson Greer wrote in an X post that the deal \"will include comprehensive market access for all American goods, economic security commitments, digital trade alignment, and many important provisions that will continue to protect our market and American workers, along with our Canadian partners.\"\nAfter Greer met again with Canada-U.S. Trade Minister Dominic LeBlanc in Washington on Wednesday morning, he said the Trump administration feels \"confident that we've reached an agreement\" to protect American workers and \"strengthen the North American economy.\"\n\"We certainly, I think, have eliminated some of the irritants that we've had in the past year,\" Greer said.\n— CNBC's Ashlee Trujillo contributed to this report.",
    "bodyJa": "米国による特定のカナダ製品に対する大規模関税の発動まで2時間も経たないうちに、ドナルド・トランプ大統領は新たな関税を回避するための暫定合意を発表した。\nワイン、ホッケースティック、その他さまざまなカナダ製品の輸入に計画されている50％の関税がすでに大きな打撃を与えていると警告する企業にとって、延期はつかの間の休息にすぎない可能性がある。\n約200億ドル相当の商品に対する新たな輸入税は、トランプ政権が米国の主要産業に対するカナダの貿易差別と呼んだものに対抗して先月発表された。\n関税は水曜日の東部時間午前12時1分に発効する予定だった。しかし、午後10時15分。火曜日、トランプ大統領はTruth Socialで「カナダと米国が文書の最終決定を条件としてDEALを結んでいるという事実に基づいて」関税を3日間一時停止すると発表した。\n最終決定予定の合意に関するトランプ大統領の声明には詳細はほとんど含まれていなかった。しかし、カナダとの合意には、当時のジョー・バイデン大統領によって2021年に計画されていたアルバータ州からネブラスカ州への石油パイプライン計画のキーストーンXLの再開が含まれる可能性があることを示唆した。\n「ずっと前にスリーピー・ジョー・バイデンによって殺された偉大なキーストーンXLパイプラインが墓場から目覚めるかもしれない！」トランプ氏は投稿にこう書いた。\nトランプ大統領はその後の投稿で、「KEYSTONE」とラベル付けされたパイプラインを地中から引き抜いている様子を描いたAI生成画像を共有した。\nカナダのマーク・カーニー首相は火曜日の夜に発表した声明で、より慎重な姿勢を示した。\nカーニー総裁は声明で「重要な作業はまだ残されているものの、大幅な進展が見られた」と述べた。\nカーニー長官は水曜正午の別の投稿で、両国は「カナダの最も重要な戦略分野のそれぞれで最良の条件を確保し、将来の通商関係についてより確実性をもたらすなど、カナダの優位性を強化する合意に向けて進んでいる」と述べた。\n水曜朝、今後の合意について質問されたトランプ大統領は、カナダは米国製品に対する報復関税の引き下げなど複数の譲歩をしたと主張した。\nトランプ大統領は、カーニー長官との「非常に良い会話」を経て、ホワイトハウス敷地内の建設プロジェクトを視察しながら記者団に対し、「我々はカナダと合意に達した」と語った。\nトランプ大統領は「彼らは昨日電話し、我々に必要なポイントを与えてくれた」と述べ、これは「双方にとって非常に公平な取引」だと述べた。\nトランプ大統領はキーストーンXLについては言及しなかった。しかし同氏は、カナダの関税は「我が国の農家にとっては存在しない」と述べ、どの関税について言及しているのかは明らかにしなかった。トランプ大統領の50％関税提案は、米国の乳製品業界に対するカナダの差別疑惑に部分的に基づいていた。\nオタワの通商交渉担当者らの最大の目標である合意の一環として、米国がカナダの自動車に対する関税を引き下げるかとの質問に対し、トランプ大統領は「我々は一定のことを行っている」と述べた。\n「私たちは何かを与えなければなりません」と彼は付け加えた。 「彼らは高額の料金を支払っていましたが、私たちはそれを少し引き下げています。それは誰にとっても良いことです。」\n同氏は「基本的に、カナダにはもう関税はない。カナダはわれわれに莫大な関税を課していた。われわれにはもう関税はない」と述べた。\nただ大統領は、この合意は「文書の最終決定次第」であると述べた。\nこのコメントは、火曜日の夜に発表された大統領宣言が、カナダが合意の一環として米国に対する貿易障壁を引き下げるか撤廃することを示唆したことを受けて発表された。\n声明によると、「行政府高官らによると、カナダは50％関税の脅威に拍車をかけた差別や不合理で不平等な賦課を撤廃するという約束を表明した」という。\n同じ夜、ジェイミソン・グリア米通商代表部代表はXポストに、この協定には「すべての米国製品への包括的な市場アクセス、経済安全保障の約束、デジタル貿易の連携、そしてカナダのパートナーとともに米国の市場と米国の労働者を引き続き保護する多くの重要な条項が含まれる」と書いた。\nグリア氏は水曜朝、ワシントンでカナダ・米国貿易相のドミニク・ルブラン氏と再び会談した後、トランプ政権は米国の労働者を保護し、「北米経済を強化する」ために「合意に達したことに自信を持っている」と述べた。\n「確かに、私たちは過去1年間に抱えていた刺激物の一部を排除できたと思います」とグリア氏は語った。\n— CNBC の Ashlee Trujillo がこのレポートに寄稿しました。",

    "title": "Track defect found near derailment site - report",
    "titleJa": "脱線現場近くで線路欠陥発見 - 報告",
    "summaryJa": "脱線現場近くで線路欠陥発見 - 報告- 公開されました",
    "bodyOriginal": "Track defect found near derailment site - report\n- Published\nA defect was found on railway tracks in East Sussex at the site where a train derailed leaving 30 injured, a report says.\nInitial findings from the Rail Accident Investigation Branch (RAIB) found an \"irregularity\" with the tracks near Lewes where three carriages tumbled down an embankment last Thursday.\nThe RAIB, which is continuing to investigate the derailment, said it had received \"several reports of rough riding at the location of the derailment from passengers on other trains\".\nNetwork Rail and Greater Thameslink Railway, whose Southern Rail train was involved in the crash, said in a joint statement they were \"sorry this happened on our railway\".\nInvestigators from the RAIB have said CCTV from a train which passed through the crash site at 14:04 BST showed the \"irregularity\" with the track geometry just before the point where the train came off the tracks.\nThe 14:24 service from London Victoria to Eastbourne derailed in the Landport area of Lewes at about 15:54 BST.\nThe derailment left two people seriously injured, and 18 were taken to hospital with less serious injuries. The 18 have since left hospital.\nThe eight-carriage train was travelling at about 65 mph when it derailed - within the 70mph speed limit - and the driver had begun to brake as the train approached the site.\nThe RAIB update also highlighted that the accident took place during a sustained period of hot and dry weather.\nTemperatures as high as 33°C (91.4°F) were registered shortly before the crash.\nThe RAIB says the clay embankment and the material underneath it are sensitive to changes in moisture content, and may move as moisture levels change.\nThe continuing investigation will now consider elements including how that section of track was inspected and maintained, the condition and maintenance of the embankment, the weather conditions and how effective any hot weather mitigation measures were.\nIn a joint statement, Lucy McAuliffe, Network Rail's route director for Sussex, and John Whitehurst, chief executive of Greater Thameslink Railway, apologised for the derailment.\nThey added: \"We will carefully consider any recommendations arising from the investigation and work across the industry to implement them, with the shared goal of making an already safe railway even safer for our customers, colleagues and the communities we serve.\"\nLast Friday, Network Rail's group safety and engineering director Martin Frobisher told the BBC speed restrictions were not in place along the section of track when the derailment happened.\nHe insisted the railway was safe, and that Network Rail took various measures to manage the impact of weather on tracks and other railway equipment.\nThe Department for Transport released a statement saying \"safety remains the absolute priority across our rail network\".\nThe statement added: \"The UK's railways remain among the safest in the world, with the number of delays caused by track faults falling by 45% since the late 2000s.\"\nFollow BBC Sussex on Facebook, external, X, external, and on Instagram, external and listen to BBC Radio Sussex on Sounds. Send your story ideas to southeasttoday@bbc.co.uk, external or WhatsApp us on 08081 002250.\n- Published1 day ago\n- Published4 days ago",
    "bodyJa": "脱線現場近くで線路欠陥発見 - 報告\n- 公開されました\n報告書によると、イーストサセックス州で列車が脱線し、30人が負傷した現場の線路に欠陥が見つかった。\n鉄道事故調査局（RAIB）の初期調査結果では、先週の木曜日に3台の客車が堤防から転落したルイス近郊の線路に「異常」があることが判明した。\n脱線事故の調査を続けているRAIBは、「他の列車の乗客から脱線現場で乱暴な運転をしたという報告を数件受けた」と述べた。\nネットワーク・レールとサザン・レールの列車が事故に巻き込まれたグレーター・テムズリンク鉄道は、共同声明で「私たちの鉄道でこのようなことが起きて残念に思う」と述べた。\nRAIBの捜査官らによると、英国標準時14時04分に事故現場を通過した列車の監視カメラには、列車が線路から外れる直前の線路形状の「不規則性」が映っていたという。\nロンドン・ビクトリア発イーストボーン行き14時24分便は、英国標準時15時54分頃にルイスのランドポート地区で脱線した。\nこの脱線事故で２人が重傷を負い、１８人が軽傷で病院に搬送された。 18人はその後退院した。\n8両編成の列車は脱線時、制限速度110km以内の時速約100kmで走行しており、列車が現場に近づくと運転士がブレーキをかけ始めた。\nRAIBの最新情報では、事故が暑くて乾燥した天候が続いた時期に発生したことも強調された。\n墜落直前には最高気温33℃（91.4°F）が記録された。\nRAIBによると、粘土堤防とその下の材料は含水量の変化に敏感で、水分レベルの変化に伴って移動する可能性があるという。\n今後の継続調査では、線路のその区間がどのように検査・維持されたか、堤防の状態と維持、気象条件、暑さ緩和策がどの程度効果的だったかなどの要素が検討されることになる。\nネットワーク・レールのサセックス路線ディレクターのルーシー・マコーリフ氏とグレーター・テムズリンク鉄道の最高経営責任者ジョン・ホワイトハースト氏は共同声明で脱線事故を謝罪した。\nさらに「われわれは調査から生じた勧告を慎重に検討し、顧客、同僚、地域社会にとってすでに安全な鉄道をさらに安全にするという共通の目標に向けて、業界全体でその実施に取り組んでいく」と付け加えた。\n先週金曜日、ネットワーク・レールのグループ安全・エンジニアリングディレクター、マーティン・フロビッシャー氏はBBCに対し、脱線事故が起きた当時、線路沿いの区間には速度制限が設けられていなかったと語った。\n同氏は、鉄道は安全であり、ネットワーク・レールは線路やその他の鉄道設備への天候の影響を管理するためにさまざまな措置を講じていると主張した。\n運輸省は「鉄道網全体では引き続き安全が絶対的な優先事項である」との声明を発表した。\n声明はさらに「英国の鉄道は依然として世界で最も安全な鉄道の一つであり、線路断層による遅延件数は２０００年代後半から４５％減少した」と付け加えた。\nFacebook (外部)、X (外部) で BBC サセックスをフォローし、外部の Instagram で BBC サセックスをフォローし、BBC ラジオ サセックス オン サウンドを聞いてください。ストーリーのアイデアを、southeasttoday@bbc.co.uk、社外、または WhatsApp (08081 002250) に送信してください。\n- 1 日前に公開\n- 4 日前に公開",

    "id": "yields-pull-back-from-multi-year-highs-a-bfab5aa2",
    "title": "Yields pull back from multi-year highs after Treasury Department says it will double government debt repurchase size",
    "titleJa": "財務省が国債買い戻し規模を倍増すると発表後、利回りは数年ぶりの高水準から後退",
    "summaryJa": "水曜日の米国債利回りは、カーブの長期端での売りが投資家の不安を和らげたため、前日に見られた数年ぶりの高値からわずかに低下した。米政府借入の主要指標である10年米国債利回りは1ベーシスポイント以上低下し4.69％となった。",
    "bodyOriginal": "Treasury yields pulled back slightly on Wednesday from multi-year highs seen in the previous day, as a sell-off at the long end of the curve eased investor jitters.\nThe yield on the 10-year U.S. Treasury note — the key benchmark for U.S. government borrowing — fell more than 1 basis point to 4.69%.\nThe 2-year Treasury note yield, which more closely tracks short-term Federal Reserve interest rate policy, fell more than 1 basis point to 4.16%.\nThe longer-dated 30-year Treasury bond yield fell more than 1 basis point to 5.274% after notching a new 19-year high on Tuesday at over 5.33%.\nOne basis point is equal to 0.01%, and yields and prices move inversely to each other.\nThe moves were part of a wider sell-off in long-dated global bonds on Tuesday. Japan's 10-year bond yield reached its highest level in three decades. German 30-year bund yields hit their highest point since 2011, while rates on France's 30-year bond reached the highest going back to 2008.\nThe U.S. fiscal deficit jumped to $432.3 billion in July, its highest monthly total since March 2021, pushing the year-to-date shortfall to nearly $1.8 trillion. Interest paid to finance the nearly $40 trillion national debt has cost the Federal government about $1.2 trillion this year.\nMeanwhile, negotiations between Washington and Tehran to end the war have stalled, with little sign that talks will resume.\n\"Investors are watching the unfolding situation in the Middle East and factoring in the potential of an inflation spike that runs hotter and lasts longer than had previously been hoped,\" wrote AJ Bell's head of financial analysis Danni Hewson on Tuesday.\nElsewhere on Wednesday, the latest Federal Open Market Committee meeting minutes are set for release in the afternoon. Investors will likely take a keen eye to the minutes, given the sharp divisions within the central bank. At the July meeting, there were three dissenters voting to hike rates, a division that investors will seek greater detail on.\n— CNBC's Sarah Min contributed to this report.",
    "bodyJa": "水曜日の米国債利回りは、カーブの長期端での売りが投資家の不安を和らげたため、前日に見られた数年ぶりの高値からわずかに低下した。\n米政府借入の主要指標である10年米国債利回りは1ベーシスポイント以上低下し4.69％となった。\n米連邦準備理事会（FRB）の短期金利政策とより密接に連動する2年物国債利回りは1ベーシスポイント以上低下し4.16％となった。\n30年長期国債利回りは、火曜日に5.33％以上と19年ぶりの高値を更新した後、1ベーシスポイント以上低下し、5.274％となった。\n1 ベーシス ポイントは 0.01% に相当し、利回りと価格は相互に反比例します。\nこの動きは、火曜日に世界の長期債券がさらに幅広く下落したことの一環だった。日本の10年債利回りは過去30年間で最高水準に達した。ドイツの３０年債利回りは２０１１年以来の最高水準に達し、フランスの３０年債金利も２００８年以来の最高値に達した。\n7月の米国の財政赤字は4,323億ドルに急増し、月間総額としては2021年3月以来最高となり、年初からの財政赤字は1兆8,000億ドル近くに達した。約40兆ドルの国債をファイナンスするために支払われた利息は、今年連邦政府に約1兆2000億ドルの損失をもたらした。\n一方、戦争終結に向けた米国とイラン政府間の交渉は行き詰まっており、交渉が再開される兆しはほとんどない。\nAJベルの財務分析部門責任者ダニー・ヒューソン氏は火曜日、「投資家は中東情勢の展開を注視しており、これまで予想されていたよりもさらに激しく長期にわたるインフレ急騰の可能性を織り込んでいる」と述べた。\n水曜日の別の場所では、最新の連邦公開市場委員会議事録が午後に発表される予定だ。中銀内の意見の対立が激しくなっていることから、投資家は議事録に注目することになるだろう。 ７月の会合では３人の反対派が利上げに賛成票を投じたが、投資家はこの区分についてさらに詳細を求めることになる。\n— CNBC のサラ・ミン氏がこのレポートに寄稿しました。",

    "id": "treasury-announces-upscaled-buyback-oper-ed0b950e",
    "title": "Treasury announces upscaled buyback operation for longer-term debt, sending yields lower",
    "titleJa": "財務省が長期債の買い戻しオペの規模拡大を発表、利回り低下につながる",
    "summaryJa": "財務省は水曜日、政府国債の買い戻し規模を2倍以上に拡大し、利回りが大幅に低下すると発表した。債券市場が圧力にさらされ、利回りが約20年ぶりの水準に急上昇するなか、今回の発表は国債市場の敏感な部分をターゲットにしている。",
    "bodyOriginal": "The Treasury Department on Wednesday said it will more than double the size of its government debt repurchases, sending yields sharply lower.\nWith fixed income markets under pressure and yields surging to levels not seen in nearly 20 years, the announcement targets a sensitive part of the Treasury market.\nUnder the accelerated buyback, Treasury will target the 10- to 20- year and 20- to 30-year portion of the market, which has seen a buyers' strike since late June. The government will \"at least double\" the maximum size of its buyback operations, from $2 billion to \"at least\" $4 billion, according to an announcement from the department.\nYields cratered following the announcement.\nThe benchmark 10-year note fell 6 basis points to 4.647% and the 30-year \"long\" bond tumbled 9 basis point to 5.196%. A basis point equals 0.01%. Yields and prices move in opposite directions.\nThe change will start Sept. 9 and stay in effect through Nov. 4.\n\"This increase in buyback operation sizes reflects Treasury's desire to provide greater liquidity support in longer-dated nominal sectors where there is consistent strong sponsorship from market participants, as evidenced by the significant volume of high-quality offers Treasury routinely receives in longer-dated buyback operations,\" the department said in a statement.\nThis is breaking news. Please refresh for updates.",
    "bodyJa": "財務省は水曜日、政府国債の買い戻し規模を2倍以上に拡大し、利回りが大幅に低下すると発表した。\n債券市場が圧力にさらされ、利回りが約20年ぶりの水準に急上昇するなか、今回の発表は国債市場の敏感な部分をターゲットにしている。\n買い戻しの加速の下で、財務省は市場の10年から20年と20年から30年の部分をターゲットにする予定だが、この部分では6月下旬から買い手のストライキが起きている。同省の発表によると、政府は自社株買い事業の最大規模を20億ドルから「少なくとも」40億ドルに「少なくとも2倍」にする。\n発表後、利回りは急上昇した。\n指標となる１０年債は６ベーシスポイント低下して４．６４７％、３０年「長期」債は９ベーシスポイント低下して５．１９６％となった。ベーシス ポイントは 0.01% に相当します。利回りと価格は逆方向に動きます。\nこの変更は9月9日に開始され、11月4日まで有効となる。\n同省は声明で「今回の自社株買いオペの規模拡大は、財務省が長期間の自社株買いオペで日常的に大量の質の高いオファーを受けていることからも分かるように、市場参加者から一貫して強力なスポンサーが存在する長期の名目セクターにおいて、より大きな流動性支援を提供したいという財務省の意向を反映している」と述べた。\nこれは速報です。更新を確認するには更新してください。",
    "source": "CNBC",

    "id": "moderna-merck-cancer-vaccine-shows-promi-59b56c26",
    "title": "Moderna, Merck cancer vaccine shows promise in late-stage trial; Moderna stock soars 90%",
    "titleJa": "モデルナとメルクのがんワクチンは後期試験で有望性を示す。モデルナ株が90％急騰",
    "summaryJa": "メルクとモデルナの実験用個別化がんワクチンが、史上初の後期試験で良好な初期結果を示し、治療選択肢の承認申請に一歩近づいたと両社は水曜日に発表した。メルクの免疫療法キイトルーダと組み合わせたmRNAベースのショットは、検出可能ながんが手術で完全に除去された高リスクまたは進行性黒色腫患者1,100人以上を対象とした第3相試験で重要な目標を達成した。",
    "bodyOriginal": "An experimental personalized cancer vaccine from Merck and Moderna showed positive initial results in its first-ever late-stage trial, the companies announced Wednesday, bringing them one step closer to filing for approval of the treatment option.\nThe mRNA-based shot in combination with Merck's immunotherapy Keytruda met key goals in the phase three trial in more than 1,100 patients with higher-risk or advanced melanoma whose detectable cancer had been completely removed through surgery.\nMerck shares climbed more than 8% in premarket trading, while Moderna's stock soared about 90%. The size of those moves reflect the companies' relative size entering Wednesday: Merck's market cap was around $333 billion, while Moderna's sat near $25 billion.\nThe combination regimen met the main study goal of significantly extending the time patients lived without their melanoma returning, compared with Keytruda alone. The treatment also reduced the risk of the cancer spreading to distant parts of the body. Those results build on positive phase two trial data on the same regimen earlier this year.\n\"It's a big moment for medicine, a big moment for patients,\" Moderna CEO Stephane Bancel said in an interview on CNBC's \"Squawk Box.\"\nThe phase three study will continue to assess other outcomes, including the overall survival benefit of the regimen. The drugmakers plan to present the data at an upcoming international medical meeting, but it's unclear when they plan to submit applications for approval in the U.S.\nThe drugmakers will likely start talking to regulatory agencies about the treatment and its safety \"in the next few months,\" Dr. Dean Li, president of Merck Research Laboratories, told \"Squawk Box.\"\nThe initial data suggests that the combo could serve as a new treatment option for melanoma, which accounts for only about 1% of skin cancers but causes the large majority of deaths among them. Most recurrences of melanoma develop in the first two to three years after initial treatment and removal.\nMelanoma patients are \"stuck having to deal with the new gravity of that diagnosis and then undergo uncomfortable treatments like surgery, and after that, they're worried about their cancer coming back,\" Dr. Jane Healy, Merck's head of oncology early development, said in an interview.\nShe called it \"very exciting\" that the therapy led to a \"clinically meaningful improvement\" over Keytruda – the standard of care for melanoma – and was well tolerated by patients. Side effects were similar to other vaccines that people typically get for other diseases, Healy noted.\nThe results also validate a personalized treatment approach that Merck and Moderna have been developing for decades, she added.\nEvery tumor has a unique set of mutations, even among patients with the same type of cancer, Healy said. Merck and Moderna's personalized vaccine is designed to target the specific mutations in each patient's tumor rather than using a one-size-fits-all approach. The idea is to train the immune system to recognize and kill those unique cancer markers and then pair that response with Keytruda, which helps the body attack the cancer more effectively.\n\"We think [the results are] very meaningful for patients with this disease and really the potential of what it can mean for other patients for cancer in future trials with this particular new class of therapy,\" she said.\nIn a June note ahead of the results, Leerink Partners analyst Mani Foroohar said the phase three results are a make-or-break event for Moderna's stock.\nAnalysts said the company's valuation already reflected expectations that the personalized cancer vaccine could eventually work across multiple types of cancers – not just melanoma — before Wednesday's stock move.\nMerck and Moderna are studying the vaccine in several trials across other tumors, such as non-small cell lung cancer, bladder cancer and renal cell carcinoma.",
    "bodyJa": "メルクとモデルナの実験用個別化がんワクチンが、史上初の後期試験で良好な初期結果を示し、治療選択肢の承認申請に一歩近づいたと両社は水曜日に発表した。\nメルクの免疫療法キイトルーダと組み合わせたmRNAベースのショットは、検出可能ながんが手術で完全に除去された高リスクまたは進行性黒色腫患者1,100人以上を対象とした第3相試験で重要な目標を達成した。\nメルク株は市場前の取引で８％以上上昇し、モデルナ株は約９０％急騰した。こうした動きの規模は水曜日に参入する企業の相対的な規模を反映しており、メルクの時価総額は約3,330億ドルであるのに対し、モデルナの時価総額は250億ドル近くにとどまっている。\nこの併用療法は、キイトルーダ単独療法と比較して、患者の黒色腫が再発せずに生存できる期間を大幅に延長するという主な研究目標を達成しました。この治療により、がんが体の離れた部分に広がるリスクも軽減されました。これらの結果は、今年初めに行われた同じレジメンに関する肯定的な第 2 相試験データに基づいています。\nモデルナのステファン・バンセル最高経営責任者（CEO）はCNBCの番組「スコークボックス」のインタビューで、「医療にとっても患者にとっても大きな瞬間だ」と語った。\n第 3 相試験では、レジメンによる全生存期間の利益を含む他の結果の評価が継続されます。製薬会社は今後開催される国際医学会議でデータを発表する予定だが、米国での承認申請をいつ提出する予定なのかは不明だ。\nメルク研究所所長のディーン・リー博士は「スコークボックス」に対し、製薬会社は「今後数カ月以内に」この治療法とその安全性について規制当局と協議を始める可能性が高いと語った。\n初期のデータは、この組み合わせが、皮膚がんの約1%にすぎないが、皮膚がんの死亡の大部分を占める黒色腫の新たな治療選択肢となる可能性があることを示唆している。黒色腫の再発のほとんどは、最初の治療と切除後最初の 2 ～ 3 年以内に発生します。\nメルク社の腫瘍学初期開発責任者であるジェーン・ヒーリー博士はインタビューで、黒色腫患者は「その診断の新たな重大性に対処しなければならず、その後手術などの不快な治療を受けなければならず、その後、がんが再発するのではないかと心配している」と語った。\n同氏は、この治療法が黒色腫の標準治療であるキイトルーダよりも「臨床的に意味のある改善」につながり、患者にも十分に許容されたことを「非常に興味深い」と述べた。副作用は他の病気のために通常接種される他のワクチンと同様だったとヒーリー氏は指摘した。\nこの結果は、メルクとモデルナが数十年にわたって開発してきた個別化された治療アプローチを検証するものでもある、と彼女は付け加えた。\nヒーリー氏によると、同じ種類のがん患者であっても、すべての腫瘍には独自の一連の変異が存在するという。メルクとモデルナの個別化ワクチンは、画一的なアプローチを使用するのではなく、各患者の腫瘍の特定の変異を標的とするように設計されている。そのアイデアは、免疫系を訓練して、これらの固有のがんマーカーを認識して殺すようにし、その反応をキイトルーダと組み合わせることで、体がより効果的にがんを攻撃できるようにするというものです。\n「我々は、（結果は）この病気の患者にとって非常に意味のあるものであり、この特定の新しい種類の治療法を用いた将来の試験において、他のがん患者にとってどのような意味を持つ可能性があると考えています」と彼女は述べた。\nリーリンク・パートナーズのアナリスト、マニ・フォルーハー氏は決算発表に先立つ6月のメモで、第3段階の決算はモデルナ株にとって勝敗を分ける出来事だと述べた。\nアナリストらは、同社の評価額は水曜日の株価変動前に、個別化がんワクチンが最終的には黒色腫だけでなく複数の種類のがんに効果があるという期待をすでに反映していると述べた。\nメルクとモデルナは、非小細胞肺がん、膀胱がん、腎細胞がんなど他の腫瘍を対象としたいくつかの試験でワクチンを研究している。",

    "titleJa": "売上の回復と巨額の関税還付により収益が押し上げられるため、目標は見通しを引き上げる",
    "summaryJa": "ターゲットは水曜日、関税還付によって押し上げられた四半期利益を発表し、小売業者が業績回復が定着する兆候を示していることから、通期見通しを引き上げた。同社によると、純売上高は前年比５．３％増加した。ストリートアカウントによると、比較対象の売上高は3.8％増加し、ウォール街予想の2.4％を上回った。ターゲットはリリースの中で、カテゴリー全体で「広範な」強みがあると見ていると付け加えた。",
    "bodyOriginal": "Target on Wednesday posted quarterly earnings that were boosted by tariff refunds and raised its full-year guidance, as the retailer shows more signs its turnaround is taking hold.\nThe company said net sales climbed 5.3% from the year prior. Comparable sales grew 3.8%, topping Wall Street estimates of 2.4%, according to StreetAccount. Target added in its release that it saw \"broad-based\" strength across categories.\n\"We're encouraged by the progress made so far, and we're also clear-eyed about the important work still ahead,\" CEO Michael Fiddelke said on a call with reporters. \"Q2 is an important step forward in the plan we laid out earlier this year to open a new chapter of growth for Target. What you saw from us this quarter reflects the level of change we knew would be needed to put our strategy in motion.\"\nTarget's fiscal second-quarter results also included a $752 million boost to net earnings, or $1.65 per share, from tariff refunds. The company said its second-quarter gross margin and operating income included a $994 million pretax benefit from that repayment.\nTarget hiked its full fiscal-year outlook, due to both stronger sales trends and the one-time boost to its bottom line. The retailer raised its full-year net sales growth guidance to about 5%, up by 1 percentage point.\nIt expects full-year EPS, including the tariff refunds, to be between $9.90 and $10.90. Excluding the repayment, that range would be $8.25 to $9.25 per share, compared with its previous outlook of $7.50 to $8.50 per share.\nThough Target has posted promising results for two straight quarters, Fiddelke said he remains cautious on the company's turnaround.\n\"To be clear, we have much more work to do,\" he told reporters. \"The combination of stronger execution and improving guest feedback provides a firm foundation on which to build as we continue advancing our strategy.\"\nDespite the results, Target shares slid 1% in premarket trading.\nHere's what the retailer reported for its fiscal second quarter compared with what Wall Street expected, based on a survey of analysts by LSEG:\n- Earnings per share: $4.11, it was not immediately clear if it was comparable to the $2.33 per share expected\n- Revenue: $26.54 billion vs. $26.14 billion expected\nFor the three-month period ended Aug. 1, Target reported net income of $1.88 billion, or $4.11 per share, compared with $935 million, or $2.05 per share, the year prior. That comparison includes the boon Target received from collecting its tariff refunds.\n\"Two strong quarters is not the goal,\" Fiddelke told reporters. \"Sustained, durable top- and bottom-line growth over time is what we're after.\"\nDigital comparable sales jumped 8.7% in the quarter, as same-day delivery grew more than 25%, according to the company.\nTarget said it saw strength across its food and beauty businesses, as all six of its major categories grew. However, its apparel and home categories lagged behind other segments, a discrepancy company executives said they're intent on fixing.\n\"We knew a category like home was going to be a multiyear journey, and we're encouraged by the guest response where we've made changes in a category like home,\" Fiddelke told reporters. \"We changed 75% of our decorative accessories assortment, and we've seen strong [comparable sales] follow that change. Frankly, we need a lot more of that type of improvement in those two categories.\"\nTarget also said it has lowered prices on more than 10,000 items, with more reductions in the pipeline, in an effort to get customers back into its stores. It opened 17 new stores in the second quarter.\nThe company has been trying to prove to investors that it's on the right path toward returning to consistent growth and reattracting its core customer. The earnings come as many consumers continue to spend less, pressured by macroeconomic conditions.\nLast quarter, Target reported its first positive same-store sales number in five quarters, jumping 5.6%.\nTarget's stock is up more than 55% this year.",
    "bodyJa": "ターゲットは水曜日、関税還付によって押し上げられた四半期利益を発表し、小売業者が業績回復が定着する兆候を示していることから、通期見通しを引き上げた。\n同社によると、純売上高は前年比５．３％増加した。ストリートアカウントによると、比較対象の売上高は3.8％増加し、ウォール街予想の2.4％を上回った。ターゲットはリリースの中で、カテゴリー全体で「広範な」強みがあると見ていると付け加えた。\nマイケル・フィデルケ最高経営責任者（ＣＥＯ）は記者団との電話会談で、「これまでの進展に励まされており、今後の重要な取り組みについても明確な目で見ている」と述べた。 「第2四半期は、ターゲットの成長の新たな章を開くために今年初めに策定した計画の重要な前進です。この四半期に当社から見たものは、当社の戦略を実行するために必要であると当社が認識していた変化のレベルを反映しています。」\nターゲットの第２・四半期決算には、関税還付による純利益の７億５２００万ドル（１株当たり１．６５ドル）押し上げも含まれている。同社は、第2四半期の粗利益と営業利益には、その返済による税引前利益9億9,400万ドルが含まれていると述べた。\nターゲットは、販売傾向の堅調さと収益の一時的な押し上げの両方を理由に、通期見通しを引き上げた。同社は通年の純売上高の伸び率見通しを１％ポイント引き上げ約５％に引き上げた。\n関税還付を含む通年のEPSは9.90ドルから10.90ドルになると予想している。返済を除くと、その範囲は１株当たり８．２５ドルから９．２５ドルとなり、これまでの見通しは１株当たり７．５０ドルから８．５０ドルだった。\nターゲットは２四半期連続で有望な業績を発表しているが、フィデルケ氏は同社の業績回復については依然として慎重だと述べた。\n「はっきり言っておきますが、我々にはやるべきことがまだまだたくさんあります」と同氏は記者団に語った。 「より強力な実行とゲストからのフィードバックの改善の組み合わせは、当社が戦略を推進し続ける際に構築するための強固な基盤を提供します。」\nこの結果にもかかわらず、ターゲット株は市場前の取引で１％下落した。\n以下は、LSEGによるアナリスト調査に基づいた、小売業者の第2四半期会計報告とウォール街の予想との比較です。\n- 1株当たり利益：4.11ドル、予想される1株当たり2.33ドルに匹敵するかどうかはすぐには明らかではない\n- 収益: 265.4億ドル対予想261.4億ドル\n8月1日終了の3カ月間で、ターゲットは純利益が18億8000万ドル（1株当たり4.11ドル）と報告したが、前年同期は9億3500万ドル（1株当たり2.05ドル）だった。この比較には、ターゲットが関税還付金を回収することで得た恩恵も含まれている。\n「2四半期好調を維持することが目標ではない」とフィデルケ氏は記者団に語った。 「私たちが求めているのは、長期にわたる持続的かつ持続的な売上高と最終利益の成長です。」\n同社によれば、同四半期のデジタル比較売上高は8.7％増加し、同日配送サービスは25％以上増加したという。\nターゲットは、主要6カテゴリーすべてが成長し、食品および美容事業全体に力強さが見られると述べた。しかし、アパレルと家庭用品のカテゴリーは他の部門に比べて遅れをとっており、企業幹部らはこの矛盾を修正することに熱心だと述べた。\nフィデルケ氏は記者団に対し、「家庭のようなカテゴリーは数年にわたる旅になるだろうと分かっていた。家庭のようなカテゴリーで変化を加えたゲストの反応に勇気づけられた」と語った。 「私たちは装飾用アクセサリーの品揃えの 75% を変更しました。そして、その変更に伴って（同等の売上が）好調に推移していることがわかりました。率直に言って、これら 2 つのカテゴリーでは、この種の改善がさらに必要です。」\nターゲットはまた、顧客を店舗に呼び戻すために、パイプラインのさらなる削減を含め、1万点以上の商品の価格を引き下げたと述べた。第2四半期には17店舗を新規オープンした。\n同社は、一貫した成長への回帰と中核顧客の再誘致に向けて、正しい道を進んでいることを投資家に証明しようと努めてきた。この収益は、多くの消費者がマクロ経済状況の圧力を受けて支出を減らし続けることで得られる。\nターゲットは前四半期、既存店売上高が5四半期ぶりにプラスとなり、5.6％増加したと報告した。\nターゲットの株価は今年５５％以上上昇している。",

    "id": "inflation-is-heating-up-but-don-t-expect-88863bcf",
    "title": "Inflation is heating up but don't expect another crisis",
    "titleJa": "インフレは加速しているが、危機が再び起こるとは思わない",
    "summaryJa": "インフレは加速しているが、危機が再び起こるとは思わない- 公開されました",
    "bodyOriginal": "Inflation is heating up but don't expect another crisis\n- Published\nThe fallout from the war in Iran cranked up the heat on households last month as energy bills rose - how uncomfortable could inflation get from here?\nThe first thing to remember is that a small amount of price rises is normal. It is the sign of a healthy, functioning economy.\nBut with food alone costing a third more than it did four years ago, thanks to a spike in inflation early in the war in Ukraine, it can feel a battle to make ends meet.\nThe good news is inflation since the war in Iran erupted has actually been more muted than economists initially feared.\nIn part, that's been because energy prices have not been as aggressive. Also higher energy costs haven't materialised in items such as food - inflation there, at 1.3%, is at actually at its lowest for close to five years.\nMeanwhile wages and benefits have typically been outpacing inflation this year, lessening the squeeze for many - so far.\nBut existing energy cost pressures may push up the likes of food, and other prices, at a faster pace in coming months as they take many months to pass through supply chains.\nIn fact, economists expect inflation to take a further step up, to hit around 3.5% later in the year.\nThat is likely to add to the pressure on new Prime Minister Andy Burnham and his Chancellor John Healey to provide more help in the run-up to the Budget, in addition to what's already been given.\nHowever, any help will have consequences, either in the form of more taxes or less resources for parts of the public sector.\nSome have queried if it would be merited.\nWhile energy bills are likely to take a step up in October, the current forecast suggests they will be the best part of £1,000 less than the peak reached after the Ukraine war began.\nTalking of bills, what of mortgages and where does this leave the Bank of England?\nRemember, interest rate changes take a while to impact prices. The Bank of England sets rates to influence future inflation.\nThere is little in these figures to change the Bank's belief that inflation will come down to its 2% target in the medium-term.\nActually, the fact that the likes of food inflation has remained muted may give the Bank of England hope that price pressures remain fairly contained.\nMeanwhile, flat jobs data and moderate wage growth may lead it to think that firms have little opportunity to get away with hiking up prices.\nSo some analysts think interest rates may not rise this year - but there are still risks they do, especially if inflation accelerates by an unexpected amount.\nPrice pressures are lingering in other areas such as services, so there is always a danger inflation does rise by more than analysts expect later in the year.\nThe biggest risk of all is that the conflict in the Middle East drags on, which could threaten further upheaval in energy markets and push inflation higher than anticipated.\nIt is likely to remain a fraction of the pace seen at the start of the war in Ukraine but would leave Burnham, the Bank of England and most of all households with a fresh set of headaches.\nRelated topics\n- Published3 hours ago",
    "bodyJa": "インフレは加速しているが、危機が再び起こるとは思わない\n- 公開されました\n先月、イラン戦争の余波で光熱費が上昇し、家計への暑さがさらに厳しくなったが、ここからインフレはどれほど不快なものになるだろうか？\nまず覚えておいていただきたいのは、多少の価格上昇は正常であるということです。それは経済が健全に機能していることのしるしです。\nしかし、ウクライナ戦争初期のインフレ急騰の影響で食料品だけでも4年前の3分の1に値上がりしており、やりくりするのが大変な状況にあるかもしれない。\n良いニュースは、イラン戦争勃発以来のインフレが、エコノミストが当初懸念していたよりも実際には抑制されていることだ。\nその理由の一部は、エネルギー価格がそれほど積極的ではなかったということです。また、食品などの品目ではエネルギーコストの上昇は顕在化しておらず、インフレ率は1.3％で、実際にはここ5年近くで最低となっている。\n一方、今年は賃金と福利厚生が例年インフレを上回っており、これまでのところ多くの人にとっての圧迫は軽減されている。\nしかし、既存のエネルギーコスト圧力により、サプライチェーンを通過するまでに何か月もかかるため、食品やその他の価格が今後数カ月でさらに速いペースで上昇する可能性がある。\n実際、エコノミストはインフレ率がさらに上昇し、年内には約3.5％に達すると予想している。\nこのことは、アンディ・バーナム新首相とジョン・ヒーリー首相に対し、予算案の準備段階ですでに与えられているものに加えてさらなる支援を提供するよう圧力を強めることになりそうだ。\nしかし、いかなる支援も、税金の増加や公共部門の一部への財源の減少という形で影響を及ぼします。\nそれが価値があるのか​​と疑問を抱く人もいる。\n10月には光熱費がさらに上昇する可能性が高いが、現在の予測では、ウクライナ戦争開始後に到達したピークよりも1,000ポンド安くなるという最高の部分を示唆している。\n紙幣について言えば、住宅ローンはどうなるでしょうか。これはイングランド銀行にどのような影響を与えるのでしょうか?\n金利の変更が価格に影響を与えるまでには時間がかかることに注意してください。イングランド銀行は将来のインフレに影響を与える金利を設定します。\nこれらの数字からは、インフレ率は中期的に２％の目標まで低下するとの世銀の考えを変えるものはほとんどない。\n実際のところ、食料品のインフレなどが依然として抑制されているという事実は、物価圧力が引き続きかなり抑制されているという期待をイングランド銀行に与えているのかもしれない。\n一方、雇用統計の横ばいや賃金の伸びが緩やかなことから、企業が物価引き上げを回避する機会はほとんどないと考えられる可能性がある。\nそのため、一部のアナリストは、今年は金利が上昇しない可能性があると考えているが、特にインフレが予想外の量で加速した場合には、上昇するリスクは依然として存在する。\nサービスなど他の分野でも物価圧力が続いており、年末にインフレがアナリストの予想を超えて上昇する危険性が常にある。\n何よりも最大のリスクは、中東紛争が長引き、エネルギー市場がさらに混乱し、インフレが予想よりも高くなる恐れがあることだ。\nウクライナ戦争開始時のペースに比べれば数分の一にとどまる可能性が高いが、バーナム、イングランド銀行、そしてほとんどすべての家庭は新たな頭痛の種に悩まされることになるだろう。\n関連トピック\n- 3 時間前に公開",

    "title": "Trainline, Virgin Atlantic and RED Driving School investigated over 'drip pricing'",
    "titleJa": "トレインライン、ヴァージン・アトランティック航空、REDドライビングスクールが「点滴価格設定」を巡り調査される",
    "summaryJa": "トレインライン、ヴァージン・アトランティック航空、REDドライビングスクールが「点滴価格設定」を巡り調査される- 公開されました",
    "bodyOriginal": "Trainline, Virgin Atlantic and RED Driving School investigated over 'drip pricing'\n- Published\nTrainline, Virgin Atlantic and RED Driving School are being investigated by the consumer watchdog over concerns they are not showing full prices upfront to customers.\nThe Competition and Markets Authority (CMA) is examining whether the three companies engaged in so-called 'drip pricing', which is an illegal practice where mandatory fees are not included in the headline price shown to customers.\nIf the CMA concludes that the firms have broken the law, it can fine them or order them to compensate customers.\nThe three companies said they were committed to transparency for customers and would engage fully with the CMA.\nIn the case of Trainline, the CMA said it observed fees of up to £2.79 being added on to headline train fares, and up to £1.50 for coach bookings.\n\"Both are costs that can add up for frequent travellers,\" the CMA said.\nTrainline has been accused of drip pricing before. In 2023, the Office of Rail and Road said it and six other third-party train ticket sellers were not being upfront about fees.\nVirgin Atlantic is being investigated to see whether mandatory resort fees and local taxes were included in the upfront prices shown to customers buying package holidays. The CMA said these fees vary but can go up to hundreds of pounds, significantly increasing the cost of a holiday.\nAnd the watchdog is looking into whether RED Driving School included mandatory booking fees and digital fees in the upfront price shown to people buying driving lessons. The CMA said the fees could be more than £7 per lesson.\nEarlier this year, the CMA ordered two other driving schools to give refunds to more than 80,000 customers after they did not disclose the total price for lessons upfront during the online booking process.\nEmma Cochrane, the CMA's executive director for consumer protection, said: \"The first price customers see should be the price they pay.\n\"At a time when many households are watching every pound they spend, it is important that people are not surprised by extra fees when booking train and coach tickets, holidays or driving lessons.\"\nA spokesperson for Virgin Atlantic Holidays said it takes its responsibility to customers \"incredibly seriously\", adding: \"we always want to ensure they can make an informed decision when booking a holiday with us.\n\"Mandatory fees are indicated at multiple stages throughout the booking journey. We are reviewing the points raised by the CMA carefully and will cooperate fully with its investigation.\"\nA Trainline spokesperson said the company was \"committed to offering customers a transparent booking experience with clear pricing and genuine value.\n\"We've proactively engaged with the CMA over several months and we are taking proactive steps to enhance how certain fees are presented to our customers.\"\nRed Driving School said it was disappointed at being included in a wider investigation.\n\"Red Driver Training always values both transparency and consumer satisfaction in all of our interactions with our customers,\" a spokesperson said.\n\"We take any and all of our obligations under consumer law with utmost focus and seriousness.\"\nSince last year, the CMA has had the power to rule that consumer laws have been broken without having to take businesses to court.\nConsumer rights group Which? said the CMA should not hesitate to use these powers, \"especially after each firm has already received a warning advisory letter\".\nSue Davies, head of consumer rights policy at Which?, said: \"Following comments made by the Prime Minister last week that unfair pricing practices have no place in our economy, this move sends a clear message to other businesses to follow the rules.\n\"At a time when household budgets are under strain, consumers must have confidence that businesses aren't there to rip them off and that the regulator is willing to step in to protect their rights.\"\nGet in touch\nHave you been affected by the issues raised in this story?\n- Published10 August",
    "bodyJa": "トレインライン、ヴァージン・アトランティック航空、REDドライビングスクールが「点滴価格設定」を巡り調査される\n- 公開されました\nトレインライン、ヴァージン・アトランティック航空、レッド・ドライビング・スクールは、顧客に事前に正規の価格を提示していないという懸念から、消費者監視団体によって調査を受けている。\n競争・市場庁（CMA）は、3社が顧客に提示する最高価格に義務的な手数料を含まない違法行為である、いわゆる「ドリッププライシング」を行ったかどうかを調査している。\nCMAは、企業が法律に違反したと結論付けた場合、罰金を科したり、顧客への賠償を命じたりすることができる。\n3社は顧客の透明性を重視し、CMAと全面的に連携すると述べた。\nトレインラインの場合、CMAは、主要鉄道運賃に最大2.79ポンド、バスの予約には最大1.50ポンドの手数料が上乗せされているのを観察したと述べた。\nCMAは、「どちらも、頻繁に旅行する人にとっては、かさむ可能性のある費用だ」と述べた。\nトレインラインは以前にも点滴価格設定で告発されたことがある。 2023年、鉄道道路局と他の第三者鉄道切符販売会社6社が手数料について率直に説明していないと発表した。\nヴァージン アトランティック航空は、パッケージ旅行を購入する顧客に表示される前払い料金に、必須のリゾート料金と地方税が含まれているかどうか調査されています。 CMAによると、これらの料金はさまざまだが、最大で数百ポンドに達する可能性があり、休暇の費用が大幅に増加するという。\nそして、監視機関は、REDドライビングスクールが、運転レッスンを購入する人に提示される前払い料金に、必須の予約手数料とデジタル手数料を含んでいたかどうかを調査している。 CMAは、授業料は1レッスンあたり7ポンド以上になる可能性があると述べた。\n今年初め、CMAは他の2つの自動車教習所に対して、オンライン予約手続き中に事前に教習料金の総額を開示しなかったため、8万人以上の顧客に返金するよう命令した。\nCMAの消費者保護担当エグゼクティブディレクター、エマ・コクラン氏は、「顧客が最初に目にするのは、彼らが支払う価格であるべきだ。\n「多くの家庭が自分の出費に気を配っている現在、人々が電車や長距離バスのチケット、休日や運転のレッスンを予約する際に追加料金に驚かないことが重要です。」\nヴァージン アトランティック ホリデイズの広報担当者は、顧客に対する責任を「信じられないほど真剣に」受け止めていると述べ、「我々は常に、顧客が当社での休暇を予約する際に、十分な情報に基づいた決定ができるようにしたいと考えている」と付け加えた。\n「必須の料金は、予約手続き全体の複数の段階で示されています。私たちはCMAから指摘された点を慎重に検討しており、その調査に全面的に協力するつもりです。」\nトレインラインの広報担当者は、同社は「明確な価格設定と真の価値を備えた透明性の高い予約体験を顧客に提供することに尽力している」と述べた。\n「私たちは数カ月にわたってCMAと積極的に連携し、顧客に対する特定の料金の提示方法を強化するための積極的な措置を講じています。」\nレッド・ドライビング・スクールは、広範な調査の対象となったことに失望していると述べた。\n「レッドドライバートレーニングは、顧客とのあらゆるやり取りにおいて常に透明性と消費者の満足度の両方を重視している」と広報担当者は述べた。\n「私たちは消費者法に基づくあらゆる義務を最大限の焦点と真剣に受け止めます。」\n昨年以来、CMAは企業を法廷に訴えることなく、消費者法違反を裁定する権限を持っている。\n消費者権利団体 どっち? CMAは「特に各企業がすでに警告勧告書を受け取った後では」これらの権限を行使することを躊躇すべきではないと述べた。\n「Which?」の消費者権利政策責任者、スー・デイビス氏は、「先週の首相の、我が国の経済に不当な価格設定の余地はないという発言を受けて、この措置は他の企業にルールに従うよう明確なメッセージを送ることになる」と述べた。\n「家計が逼迫している今、消費者は企業が消費者を騙し取るつもりはなく、規制当局が自らの権利を守るために積極的に介入してくれると確信する必要がある。」\n連絡する\nこの話で提起された問題の影響を受けましたか?\n- 8月10日発行",

    "title": "Jump in energy bills drives UK inflation to highest rate for four months",
    "titleJa": "光熱費の高騰で英国のインフレ率は4カ月ぶりの最高水準に",
    "summaryJa": "光熱費の高騰で英国のインフレ率は4カ月ぶりの最高水準に- 公開されました",
    "bodyOriginal": "Jump in energy bills drives UK inflation to highest rate for four months\n- Published\nHigher energy bills drove UK inflation up to 2.9% in the year to July, the highest level in four months, according to new figures.\nGas prices soared at the sharpest pace in almost four years, the Office for National Statistics (ONS) said, leading to an increase in the cap on household energy bills in July. Energy costs surged after US-Israel war with Iran began, which has restricted global oil supplies.\nJuly's reading is the highest since March but some price growth slowed. Food inflation, at 1.3%, is at its lowest rate for close to five years.\nExperts said the inflation figure is unlikely to influence the Bank of England to change its key interest rate at its next meeting in September.\nEnergy costs for households rose on 1 July after Ofgem, the energy regulator, increased the price cap on gas and electricity costs by 13%, which added £221 a year to the typical bill.\nHomes are forecast to see a 4% rise in energy bills from October, according to Cornwall Insight, which would take them to the highest level since July 2023.\nTherre is ongoing uncertainty over the US-Iran conflict, which has seen effective closures of the Strait of Hormuz, a key trading passage for ships carrying oil, liquefied natural gas and other commodities.\nCornwall Insight, an independent energy consultancy, added that energy price pressures were being compounded by the ongoing heatwave across Europe \"increasing gas demand for power generation to meeting air conditioning and cooling demand\".\nONS prices director Mike Hardie said furniture prices, which fell by less than usual for that time of year, added to the upward pressure on inflation.\nHe said clothing had not been discounted as much.\nChancellor John Healey said the Iran war was continuing to affect prices in the UK, but insisted Britain's economy was resilient.\n\"We have cut VAT on electricity bills and capped bus fares at £2 - to give breathing space to those feeling the strain,\" he said.\n\"There is more to do to restore hope and build a stronger economy where prosperity is shared more fairly across Britain.\"\nShadow chancellor Mel Stride said the country was unprepared for global shocks due to Labour's \"mismanagement\", leaving ordinary people \"paying the price\".\nPenny Keevil said the cost of living crisis is here to stay.\nShe founded Second Chance Medway, a crisis support centre which runs a discounted food pantry two days a week, where she now sees not only those on benefits, but working people too.\n\"The need for affordable food now reaches across every part of the community,\" she said. \"Energy bills are still far too high and wages and incomes aren't keeping up.\"\nInflation is heating up but don't expect another crisis\n- Published1 hour ago\nThe British Retail Consortium's lead economist Harvir Dhillon said there was some good news for consumers as food inflation slowed.\nHe said prices for pasta, olive oil and fresh fruit all fell in July, \"demonstrating that strong competition among grocers is firmly keeping a lid on people's weekly shop\".\nMeanwhile, motor fuel price rises eased to 15.5% compared to an increase of 21.3% in the 12 months to June - though they remains much higher than in 2025.\nRises on the horizon\nKPMG's chief economist Yael Selfin said July marked the start of a gradual rise in inflation, though she said Wednesday's figure was not enough to spur change in the Bank of England's interest-rate setting decisions.\nShe added that energy-related costs were expected to push inflation higher over the coming months to a peak of about 3.5%.\nInflation remains above the Bank's 2% target - a level the Bank says keeps prices stable and allows both people and businesses to plan for the future.\nRuth Gregory, chief economist of Capital Economics, expects inflation will fall to the target \"by the end of next year\" provided energy prices don't rise much further.\n\"The Bank of England will keep rates at 3.75% this year and cut them to 3% next year,\" she said.\nHowever, price stability remains elusive, said Suren Thiru, chief economist at the Institute of Chartered Accountants in England and Wales.\n\"Rising inflation is likely to become the biggest threat to UK growth in the coming months as it eats into household budgets by increasing the cost of essentials,\" he said.\nHe added drought-related increases in food prices may also be on the the horizon.\nRelated topics\n- Published3 hours ago\n- Published6 days ago",
    "bodyJa": "光熱費の高騰で英国のインフレ率は4カ月ぶりの最高水準に\n- 公開されました\n新しい統計によると、光熱費の高騰で英国のインフレ率は７月までの１年間で２．９％に達し、４カ月ぶりの高水準となった。\n国家統計局（ＯＮＳ）によると、ガソリン価格は約４年ぶりの急激なペースで高騰し、７月の家庭用光熱費の上限引き上げにつながった。米国・イスラエルとイランの戦争が始まり、世界の石油供給が制限されてからエネルギーコストが高騰した。\n７月の統計は３月以来の高水準となったが、物価の伸びは一部鈍化した。食料インフレ率は1.3％で、ここ5年近くで最低の水準にある。\n専門家らは、インフレ率の数字がイングランド銀行（中央銀行）の次回９月理事会で主要金利の変更に影響を与える可能性は低いとの見方を示した。\nエネルギー規制当局のOfgemがガスと電気料金の価格上限を13%引き上げたことにより、7月1日に家庭のエネルギーコストが上昇し、通常の請求額に年間221ポンドが追加された。\nコーンウォール・インサイトによると、住宅の光熱費は10月から4％上昇すると予想されており、これは2023年7月以来の高水準となるだろう。\n米国とイランの紛争をめぐる不確実性は続いており、石油、液化天然ガス、その他の商品を運ぶ船舶の重要な通商路であるホルムズ海峡が事実上閉鎖されている。\n独立系エネルギーコンサルタント会社コーンウォール・インサイトは、ヨーロッパ全土で続いている熱波によって「空調や冷房の需要を満たすために発電用のガス需要が増加している」ため、エネルギー価格の圧力がさらに高まっていると付け加えた。\nＯＮＳの価格ディレクター、マイク・ハーディ氏は、家具価格の下落が例年よりも低く、インフレ上昇圧力が強まったと述べた。\n同氏によると、衣料品はそれほど値引きされていなかったという。\nジョン・ヒーリー財務相は、イラン戦争が英国の物価に影響を及ぼし続けているとしながらも、英国経済は底堅いと主張した。\n「負担を感じている人たちに一息つける空間を与えるために、電気代の付加価値税を引き下げ、バス料金の上限を2ポンドに設定した」と同氏は語った。\n「希望を取り戻し、英国全土で繁栄がより公平に共有される強力な経済を構築するには、やるべきことはまだある。」\n影の首相メル・ストライド氏は、この国は労働党の「失政」による世界的ショックに対する備えが整っておらず、一般国民が「代償を支払わされた」ままになっていると述べた。\nペニー・キービル氏は、生活費危機は今後も続くと語った。\n彼女は、週に 2 日、割引フード パントリーを運営する危機サポート センターであるセカンド チャンス メドウェイを設立し、現在では給付金受給者だけでなく、働いている人々も診察しています。\n「手頃な価格の食料の必要性は今、地域社会のあらゆる場所に広がっています」と彼女は言う。 「光熱費は依然として高すぎて、賃金と収入が追いついていません。」\nインフレは加速しているが、危機が再び起こるとは思わない\n- 1 時間前に公開\n英国小売業コンソーシアムの主任エコノミスト、ハービル・ディロン氏は、食品インフレが鈍化する中、消費者にとって朗報があると述べた。\n同氏は、パスタ、オリーブオイル、生の果物の価格が7月にすべて下落し、「食料品店間の激しい競争が人々の毎週の買い物にしっかりと蓋をしていることを示している」と述べた。\n一方、自動車燃料価格の上昇は、6月までの12か月間で21.3％上昇したのに比べて15.5％に鈍化したが、依然として2025年に比べてはるかに高い。\n地平線に昇る\nＫＰＭＧのチーフエコノミスト、ヤエル・セルフィン氏は、７月は緩やかなインフレ上昇の始まりとなったとしながらも、水曜日の数字はイングランド銀行の金利設定決定の変更を促すには十分ではないと述べた。\n同氏は、エネルギー関連コストによりインフレが今後数カ月で上昇し、ピークの約３．５％に達すると予想されていると付け加えた。\nインフレ率は世銀の目標である２％を依然として上回っており、世銀はこの水準で物価が安定し、国民と企業が将来に向けた計画を立てることができると主張している。\nキャピタル・エコノミクスの首席エコノミスト、ルース・グレゴリー氏は、エネルギー価格がこれ以上上昇しなければ、インフレは「来年末までに」目標まで低下すると予想している。\n同氏は「イングランド銀行は今年金利を３．７５％に据え置き、来年は３％に引き下げる」と述べた。\nしかし、イングランド・ウェールズの公認会計士協会の首席エコノミスト、スレン・ティルー氏は、物価の安定は依然としてとらえどころのないものだと述べた。\n同氏は「インフレ上昇は必需品の価格上昇により家計を圧迫するため、今後数カ月で英国の成長にとって最大の脅威となる可能性が高い」と述べた。\n同氏は、干ばつによる食料価格の上昇も目前に迫っている可能性があると付け加えた。\n関連トピック\n- 3 時間前に公開\n- 6 日前に公開",

    "id": "iran-reportedly-weighs-attacks-on-europe-44809792",
    "title": "Iran reportedly weighs attacks on European military targets as UAE severs trade with Tehran",
    "titleJa": "伝えられるところによると、UAEがテヘランとの貿易を断絶する中、イランは欧州の軍事目標への攻撃を検討しているとのこと",
    "summaryJa": "フィナンシャル・タイムズ紙は水曜、政権内部関係者２人の話として、イランは戦争が激化した場合、欧州にある米国の軍事目標を攻撃することを検討していると報じた。FTの報道によると、ブルガリアとキプロスの米国資産が潜在的な標的として検討されたという。",
    "bodyOriginal": "Iran has considered attacking U.S. military targets in Europe if the war escalates, the Financial Times reported Wednesday, citing two regime insiders.\nU.S. assets in Bulgaria and Cyprus were weighed as potential targets, according to the FT's report.\nCNBC has reached out to Iran's Military of Foreign Affairs for comment and has not independently verified the story.\nNegotiations between Washington and Tehran to end the war have stalled, with little sign that talks will resume, leaving the belligerents to consider their next stages in the prolonged conflict.\nUAE severs trade with Iran\nThe United Arab Emirates on Wednesday said it had paused all \"trade, commercial exchanges, and financial transactions\" with Iran until further notice. On Tuesday, the UAE's Ministry of Defense said it detected two ballistic missiles launched from Iran toward its territorial waters.\nPresident Donald Trump on Tuesday said the U.S. is not currently in any talks with Tehran and has no plans to restart them. He has also ruled out extending the 60-day ceasefire agreement which expired Monday, after the deal effectively fell apart.\nA key point of contention remains control of the Strait of Hormuz. Trump has repeatedly stated that the vital shipping waterway is open and in operation under U.S. control.\nHowever, observed ship traffic through the passage remains extremely low. An attack on a cargo vessel transiting the strait earlier this week killed one person.\nFox News on Tuesday quoted an Iranian military spokesperson as saying ships attempting passage through the strait will \"find several beautiful holes in their hulls.\"\nMeanwhile, Trump has extended his verbal attacks to longstanding U.S. allies. On Monday, the president threatened to \"bomb the s--- out of\" Oman if the Gulf nation \"gets in the way\" of its objectives in the Middle East.\nHe also ordered Defense Secretary Pete Hegseth to \"substantially reduce\" joint drills with South Korea, accusing Seoul of failing to help with its military operation in Iran and citing his friendly relations with North Korean leader Kim Jong Un.\n— CNBC's Emma Graham and Spencer Kimball contributed to this story.",
    "bodyJa": "フィナンシャル・タイムズ紙は水曜、政権内部関係者２人の話として、イランは戦争が激化した場合、欧州にある米国の軍事目標を攻撃することを検討していると報じた。\nFTの報道によると、ブルガリアとキプロスの米国資産が潜在的な標的として検討されたという。\nCNBCはイラン外務省にコメントを求めたが、独自にこの記事を検証していない。\n戦争終結に向けた米政府とイラン政府間の交渉は行き詰まっており、交渉が再開される兆しはほとんどなく、交戦側は長期化する紛争の次の段階を検討することになっている。\nUAE、イランとの貿易を断絶\nアラブ首長国連邦は水曜日、イランとのすべての「貿易、商業交流、金融取引」を追って通知があるまで停止すると発表した。 UAE国防省は火曜日、イランから領海に向けて発射された弾道ミサイル2発を探知したと発表した。\nドナルド・トランプ大統領は火曜日、米国はイラン政府と現在いかなる協議も行っておらず、協議を再開する計画もないと述べた。同氏はまた、合意が事実上決裂したことを受けて月曜日に期限切れとなった60日間の停戦合意の延長も否定した。\n重要な争点は依然としてホルムズ海峡の制海権である。トランプ大統領は、重要な海運水路は開いており、米国の管理下で運営されていると繰り返し述べてきた。\nしかし、この航路を通過する船舶の交通量は依然として極めて少ないと観察されています。今週初めに海峡を通過中の貨物船が攻撃され、１人が死亡した。\nフォックスニュースは火曜日、イラン軍報道官の発言として、海峡を通過しようとする船舶は「船体にいくつかの美しい穴を見つけるだろう」と述べたと伝えた。\n一方、トランプ大統領は米国の長年の同盟国に対しても言葉による攻撃を拡大した。大統領は月曜日、湾岸諸国が中東での目標を「邪魔」する場合、オマーンを「爆撃する」と脅迫した。\nまた、ピート・ヘグセス国防長官に対し、韓国がイランでの軍事作戦への支援を怠ったと非難し、北朝鮮の指導者金正恩氏との友好関係を理由に、韓国との共同訓練を「大幅に縮小する」よう命じた。\n— CNBCのエマ・グラハムとスペンサー・キンボールがこの記事に貢献しました。",

    "id": "ukraine-s-zelenskyy-faces-call-for-warti-173d1a1b",
    "title": "Ukraine's Zelenskyy faces call for wartime election from former defense chief",
    "titleJa": "ウクライナのゼレンシキー氏、元国防長官からの戦時中の選挙要求に直面",
    "summaryJa": "ウクライナの元国防長官ミハイロ・フェドロフ氏は、ロシアがほぼ4年半前に本格的な侵攻を開始して以来、ウォロディミル・ゼレンスキー大統領に対する最も直接的な政治的挑戦と多くの人がみなしている戦時中の選挙を呼びかけた。ロイター通信の翻訳によると、政府改造の一環として先月突然解任されたフョードロフ氏は火曜日、「民主主義をロシアの人質にすることはできない」と述べた。",
    "bodyOriginal": "Ukraine's former defense chief Mykhailo Fedorov has called for wartime elections in what many see as the most direct political challenge to President Volodymyr Zelenskyy since Russia launched its full-scale invasion nearly four-and-a-half years ago.\nFedorov, who was unexpectedly sacked last month as part of a government reshuffle, said Tuesday that \"democracy cannot be held hostage by Russia,\" according to a Reuters translation.\n\"We must find a legal, safe and realistic mechanism that will allow Ukraine to renew its full democratic process even in the conditions of a long war,\" Fedorov said.\nHis comments, which did not mention Zelenskyy by name, were delivered in a more than nine-minute video posted to YouTube. Ukrainian law currently prohibits holding elections during wartime.\nA former ally of Zelenskyy, Fedorov is widely seen as a popular figure in Ukraine. His dismissal in late July after roughly six months in post prompted protests in major cities across the country.\nAn advocate of the country's drone warfare, the 35-year-old has been credited with energizing the defense ministry and spearheading a drive against corruption.\nFedorov's statement came just hours after Zelenskyy confirmed he had asked parliament to confirm Yevhen Khmara as Ukraine's new defense minister in office on Wednesday, effectively closing the door on a Fedorov comeback.\nRead more\nFedorov said Ukraine faced a \"systemic crisis of governance\" and condemned official corruption for hurting the country's war effort, without providing the names of any lawmakers.\nZelenskyy has not yet responded to Fedorov's video statement. CNBC has contacted Ukraine's Foreign Ministry for comment and is awaiting a response.",
    "bodyJa": "ウクライナの元国防長官ミハイロ・フェドロフ氏は、ロシアがほぼ4年半前に本格的な侵攻を開始して以来、ウォロディミル・ゼレンスキー大統領に対する最も直接的な政治的挑戦と多くの人がみなしている戦時中の選挙を呼びかけた。\nロイター通信の翻訳によると、政府改造の一環として先月突然解任されたフョードロフ氏は火曜日、「民主主義をロシアの人質にすることはできない」と述べた。\nフョードロフ氏は「長期にわたる戦争の状況下でもウクライナが完全な民主主義プロセスを再開できるよう、合法的で安全かつ現実的な仕組みを見つけなければならない」と述べた。\nゼレンスキー氏の名前には言及しなかった同氏のコメントは、ユーチューブに投稿された９分以上のビデオで伝えられた。ウクライナの法律は現在、戦時中の選挙の実施を禁止している。\nゼレンスキー氏の元同盟者であるフョードロフ氏は、ウクライナでは人気のある人物として広く知られている。約6か月の任期を経て7月末に同氏が解任されると、全国の主要都市で抗議活動が起きた。\n同国の無人機戦争の提唱者である35歳の同氏は、国防省を活性化させ、汚職撲滅の先頭に立った功績が認められている。\nフョードロフ氏の声明は、ゼレンシキー氏が水曜、ウクライナの新国防相にエフヘン・クマラ氏を承認するよう議会に要請したことを確認した数時間後に発表され、フョードロフ氏の復帰への扉は事実上閉ざされた。\n続きを読む\nフョードロフ氏は、ウクライナは「統治の体系的危機」に直面していると述べ、議員の名前は明らかにしなかったものの、国の戦争遂行に悪影響を及ぼしている役人の汚職を非難した。\nゼレンスキー氏はフョードロフ氏のビデオ声明にまだ返答していない。 CNBCはウクライナ外務省にコメントを求めており、返答を待っている。",

  {
    "id": "trump-pauses-new-tariffs-on-canada-and-s-21128136",
    "title": "Trump pauses new tariffs on Canada and says countries close to a deal",
    "titleJa": "トランプ大統領、カナダへの新たな関税を一時停止し、各国は合意に近づいていると発言",
    "summaryJa": "トランプ大統領、カナダへの新たな関税を一時停止し、各国は合意に近づいていると発言- 公開されました",
    "bodyOriginal": "Trump pauses new tariffs on Canada and says countries close to a deal\n- Published\nUS President Donald Trump said he will delay imposing new tariffs on a wide array of Canadian goods for three days as the countries firm up a trade deal.\n\"I have paused the 50% Tariffs against Canada, that were scheduled to kick in tomorrow morning for a three day period, based on the fact that Canada and the U.S.A., subject to the finalization of documents, have a DEAL!\" Trump said in a social media post.\nThe announcement came less than two hours before a 50% levy on nearly $20bn (£14.8bn; C$28bn) of Canadian imports was set to go in place.\nThe two sides have been at an impasse on several issues, including US tariffs on autos and many Canadian provinces banning American liquor sales.\nTrump and Canadian Prime Minister Mark Carney spoke twice this week, and trade negotiators have been engaged in intense talks since July, after the US president threatened the new levy with a deadline of 19 August.\n\"Substantial progress has been made, although there is important work still to be done,\" Carney said in a letter posted on X.\nIn his post, Trump also said a final trade deal could allow the revival of the Keystone XL pipeline. The oil pipeline, which would connect Alberta to the US, was blocked by both the Obama and Biden administrations.\nEnvironmentalists and indigenous groups have long opposed the pipeline but Trump has said multiple times he would like to revive the project, which would carry 830,000 barrels of oil a day.\n\"The great Keystone XL Pipeline, long ago killed by Sleepy Joe Biden, may be awoken from the grave!\" Trump wrote on Truth Social.\n\"The deal will include comprehensive market access for all American goods, economic security commitments, digital trade alignment\", US Trade Representative Jamieson Greer's office posted on X.\nIt will also include \"many important provisions that will continue to protect our market and American workers, along with our Canadian partners\", it added.\nThe extension is welcome news for Canadian negotiators and for businesses on both sides of the border, who have warned that the new tariffs would be harmful to both countries.\nTensions have mounted between the two major trading partners since Trump returned to office in January last year and he unleashed a wide-ranging global programme of tariffs, upending decades of free trade between Canada and the US.\nThe latest tariffs threatened by Trump were to be applied on a range of Canadian imports, including wine, dairy, cement, clothing and hockey equipment.\nThey would have been in addition to existing tariffs the US had already imposed on Canadian steel and aluminium, autos and lumber.\nCanada has been in pursuit of a deal that would have the US drop or reduce tariffs on these key sectors.\nThe US, meanwhile, has been asking for a number of concessions from Canada, including removing its remaining retaliatory tariffs on American autos and adjusting its dairy quotas to allow greater access for US cheese producers.\nIt has also asked for the ban on US alcohol sales, imposed last year by most Canadian provinces in retaliation to Trump's tariffs, be removed.\nIn the final hours before Wednesday's deadline, negotiators were discussing a deal that would reduce US tariffs on Canadian autos from 25% to 15%, according to a Reuters report citing anonymous sources.\nBut the two countries could not agree on which vehicles would be eligible for tariff reductions, with the US pushing for it to only apply on cars with a high amount of American-made content.\nCarney will also need buy-in from provincial premiers to reinstate the sale of US alcohol, as liquor sales are controlled by the provinces, not the federal government.\nOntario Premier Doug Ford, whose province is hardest hit by US tariffs on autos, said he was open to lifting the liquor ban only if a \"fair deal\" is reached.\nOn Tuesday, the US Chamber of Commerce pushed for a deal to be reached, saying in a statement that \"higher tariffs would damage both economies, drive up costs for US families, further disrupt critical supply chains, and risk the 13 million American jobs that depend on trade under the US-Mexico-Canada Trade Agreement\".\nAdditional reporting by Peter Hoskins\nRelated topics\n- Published4 days ago",
    "bodyJa": "トランプ大統領、カナダへの新たな関税を一時停止し、各国は合意に近づいていると発言\n- 公開されました\nドナルド・トランプ米大統領は、両国が通商協定を強化する中、カナダの幅広い製品に対する新たな関税の発動を3日間延期すると発表した。\n「私は、文書の最終決定を条件としてカナダと米国が協定を結んでいるという事実に基づき、明日の朝に開始される予定だったカナダに対する50％関税を3日間一時停止しました！」トランプ大統領はソーシャルメディアへの投稿で述べた。\nこの発表は、200億ドル（148億ポンド、280億カナダドル）近くのカナダからの輸入品に対する50％の課税が開始される2時間以内に行われた。\n両国は米国の自動車関税やカナダの多くの州による米国産酒類の販売禁止など、いくつかの問題で行き詰まっている。\nトランプ大統領とカナダのマーク・カーニー首相は今週2回会談し、米国大統領が新たな課税の期限を8月19日と脅したことを受けて、通商交渉担当者らは7月以来、激しい協議を続けている。\nカーニー氏はＸに掲載した書簡で「重要な作業はまだ残っているが、大幅な進展は見られた」と述べた。\nトランプ大統領は投稿の中で、最終的な通商合意によりキーストーンXLパイプラインの復活が可能になる可能性があるとも述べた。アルバータ州と米国を結ぶ石油パイプラインはオバマ、バイデン両政権によって阻止された。\n環境保護活動家や先住民団体は長年このパイプラインに反対してきたが、トランプ大統領は日量83万バレルの石油を輸送するこのプロジェクトを復活させたいと何度も述べている。\n「ずっと前にスリーピー・ジョー・バイデンによって殺された偉大なキーストーンXLパイプラインが墓場から目覚めるかもしれない！」トランプ氏はTruth Socialにこう書いた。\n「この協定には、すべての米国製品への包括的な市場アクセス、経済安全保障の約束、デジタル貿易の連携が含まれる」とジェイミソン・グリア米通商代表部はXに投稿した。\nまた、「カナダのパートナーとともに市場と米国の労働者を引き続き保護する多くの重要な条項」も含まれると付け加えた。\nこの延長は、新たな関税は両国にとって有害で​​あると警告してきたカナダの交渉担当者や国境の両側の企業にとって歓迎すべきニュースだ。\nトランプ大統領が昨年1月に大統領に復帰し、広範な世界的関税プログラムを発動してカナダと米国間の数十年にわたる自由貿易を根底から覆して以来、2大貿易相手国間の緊張は高まっている。\nトランプ大統領が脅迫した最新の関税は、ワイン、乳製品、セメント、衣料品、ホッケー用具など幅広いカナダからの輸入品に適用される予定だった。\nこれらは米国がカナダの鉄鋼とアルミニウム、自動車、木材にすでに課している既存の関税に追加されるものだった。\nカナダは米国に対し、これらの主要分野に対する関税を撤回または削減させる合意を追求してきた。\n一方、米国はカナダに対し、米国製自動車に対する残りの報復関税の撤廃や、米国のチーズ生産者のアクセス拡大を可能にする乳製品割り当ての調整など、多くの譲歩を求めている。\nまた、トランプ大統領の関税への報復としてカナダのほとんどの州が昨年課した米国でのアルコール販売禁止措置の解除も求めた。\n匿名の情報筋を引用したロイター通信の報道によると、水曜の期限前の最後の数時間に、交渉担当者らはカナダの自動車に対する米国の関税を25％から15％に引き下げる合意について議論していた。\nしかし、両国は関税引き下げの対象となる自動車について合意できず、米国は米国製の含有量が多い自動車にのみ関税を適用するよう求めている。\n酒類の販売は連邦政府ではなく州が管理しているため、カーニー氏が米国の酒類販売を再開するには州首相の同意も必要となる。\n米国の自動車関税で最も大きな打撃を受けているオンタリオ州のダグ・フォード首相は、「公正な合意」が得られた場合にのみ酒類禁制を解除する用意があると述べた。\n火曜日、米国商工会議所は声明で「関税の引き上げは両国経済にダメージを与え、米国の家庭の生活費を押し上げ、重要なサプライチェーンをさらに混乱させ、米国・メキシコ・カナダ貿易協定に基づく貿易に依存する1,300万人の米国の雇用を危険にさらすことになる」と述べ、合意の成立を促した。\nPeter Hoskins による追加レポート\n関連トピック\n- 4 日前に公開",
