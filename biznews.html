    "id": "analysis-why-a-2-trillion-deficit-and-5-20ae6bd3",
    "title": "Analysis: Why a $2 trillion deficit and 5% Treasury yields are becoming America's biggest economic challenge",
    "titleJa": "Analysis: Why a $2 trillion deficit and 5% Treasury yields are becoming America's biggest economic challenge",
    "summaryJa": "Treasury yields above 5% are raising borrowing costs for households and the federal government, highlighting the challenge of financing $2 trillion deficits.",
    "bodyOriginal": "Long-term bond yields above 5% and a $2 trillion deficit are giving Americans a taste of what a U.S. debt crisis would be like. A true emergency would hurt much more, and isn't baked in. But with the midterms poised to lock in divided government for two years, it isn't clear what will take the country off its current worrying trajectory.\nHigher interest rates exacerbated by the flood of federal debt issuance are starting to bite in some parts of the economy and threaten to worsen the government's debt problem. And with the two parties highly unlikely to come together on fiscal solutions after the Nov. 3 midterms, any fixes are years off in the future.\nThe housing market is showing signs of slowing as the average 30-year fixed-rate mortgage hovers around 7.5%. Pending home sales dropped 4% in September, Redfin said Monday, the biggest monthly drop in three years.\nMortgage rates track the 10-year Treasury yield. The 10-year has climbed 123 basis points, or hundredths of a percentage point, since the end of February through Wednesday's close, when the 10-year traded at 5.19%.\nSeveral factors are pushing up the 10-year, including the war in Iran, which kicked off on Feb. 28 and precipitated the rise in long-term yields. Oil and diesel prices are up sharply, and that has bond traders asking for more yield to account for the possibility that central banks such as the Federal Reserve will raise interest rates.\nIn addition, investors want more compensation to hold longer-term bonds in part because they believe the U.S. government will continue to flood the market with them. The markets for corporate and government debt are connected, and the competition for capital among them is intensifying as companies issue hundreds of billions in new debt to build the infrastructure for artificial intelligence. Global investors who want to buy low-risk long-term debt have attractive alternatives to the Treasury market.\nIf the U.S. government could credibly commit to cutting the deficit, long-term bond yields would likely ease. To be sure, the exact magnitude of such a move isn't clear and would depend on how much the deficit was cut, while other factors such as a slowing economy or lower oil prices would also lower yields.\nBut the possibility of a virtuous cycle of lower deficits and lower yields is why Treasury Secretary Scott Bessent has argued that the U.S. ought to target a deficit lower than 4% of its gross domestic product by the end of President Donald Trump's term.\nThere is almost no way the U.S. will hit that target. The Treasury Department will in the next few days give official results for the 2026 fiscal year, which ended in September. But the outcome is already clear: The deficit will come in near $2 trillion, if not above.\nThat is likely to put the deficit in the range of 6.0-6.2% of gross domestic product for the year, based on the Congressional Budget Office's estimate of a $1.993 trillion deficit and a projection of third quarter GDP.\nHigher rates make debt reduction tougher. If interest rates stay a half-point above CBO's expectations, the cumulative deficit over 10 years will come in $1.9 trillion higher, the agency estimates. If rates overshoot by 1.5 points, that adds $6 trillion in deficits.\nCBO expects the 10-year Treasury to average 4.3% over that period, compared to 5.3% today. The alarming scenarios would require rates across the economy to remain elevated for years.\n\"My view is that we've got this mountain of debt, and we have to grow our way out of it,\" Bessent said in Dallas last month. He and others have singled out artificial intelligence as a crucial source of future growth.\nAI could help but can't fix the problem entirely. It would take a decade of 7.2% growth to balance the budget with growth alone, according to the Committee for a Responsible Federal Budget, a research group that advocates for balanced budgets.\nGDP growth was recently revised up for the second quarter from 1.5% to 2.2% at an annualized rate. The acceleration that quickly would get us to 7.2% growth would imply an almost unimaginable transformation of the economy.\nTrump will soon enter the final two years of his presidency, a moment when presidents often take on big, legacy-defining projects. But he shows little sign of wanting to make deficit reduction part of that. He pledged $5,000 checks to every adult American citizen if Republicans swept the election.\nIn practice, Republicans are widely forecast to lose at least the House and possibly also the Senate. Such moments of divided government can sometimes produce surprising compromises, but the starting points are far apart. Rep. Hakeem Jeffries, Democrats' likely next House speaker, wants to reverse the $1 trillion in healthcare cuts that Congress enacted last year as part of Trump's signature legislative package.\nAnd that's leaving aside the deep animosity between the parties.\nThe overall U.S. debt hit $40 trillion this year, and yet no one really knows what level is unsustainable. A full-on debt crisis likely remains much farther out in the future. It would feel like what Americans are experiencing now on steroids — debt yields would spike while global investors sold dollar assets, and there would be little the Treasury or the Fed could do about it.\nFor now, though higher yields are also attracting investors to U.S. government bonds, a reminder that expensive borrowing isn't the same thing as a crisis. But the bottom line is that economics alone can't solve the problem. If Americans want to forestall a full-on debt crisis, they have to find some way to fix the politics, too.",

.2% at an annualized rate. The acceleration that quickly would get us to 7.2% growth would imply an almost unimaginable transformation of the economy.\nTrump will soon enter the final two years of his presidency, a moment when presidents often take on big, legacy-defining projects. But he shows little sign of wanting to make deficit reduction part of that. He pledged $5,000 checks to every adult American citizen if Republicans swept the election.\nIn practice, Republicans are widely forecast to lose at least the House and possibly also the Senate. Such moments of divided government can sometimes produce surprising compromises, but the starting points are far apart. Rep. Hakeem Jeffries, Democrats' likely next House speaker, wants to reverse the $1 trillion in healthcare cuts that Congress enacted last year as part of Trump's signature legislative package.\nAnd that's leaving aside the deep animosity between the parties.\nThe overall U.S. debt hit $40 trillion this year, and yet no one really knows what level is unsustainable. A full-on debt crisis likely remains much farther out in the future. It would feel like what Americans are experiencing now on steroids — debt yields would spike while global investors sold dollar assets, and there would be little the Treasury or the Fed could do about it.\nFor now, though higher yields are also attracting investors to U.S. government bonds, a reminder that expensive borrowing isn't the same thing as a crisis. But the bottom line is that economics alone can't solve the problem. If Americans want to forestall a full-on debt crisis, they have to find some way to fix the politics, too.",

    "id": "u-s-reportedly-considers-use-of-mother-o-c8661289",
    "title": "U.S. reportedly considers use of 'mother of all bombs' as Iran vows to fight on",
    "titleJa": "U.S. reportedly considers use of 'mother of all bombs' as Iran vows to fight on",
    "summaryJa": "The U.S. military has reportedly drawn up options for strikes on Iran that include the potential use of one of the biggest non-nuclear bombs in its arsenal.",
    "bodyOriginal": "The U.S. military has drawn up options for renewed strikes on Iran that include the potential use of one of the biggest non-nuclear bombs in its arsenal, CNN reported Thursday, as Tehran vowed to continue fighting for its demands.\nThe strike plans involve the possible use of the GBU-43/B Massive Ordnance Air Blast Bomb, nicknamed the \"mother of all bombs,\" CNN reported, citing multiple U.S. officials familiar with the matter. CNBC has not independently confirmed the report and has reached out to the Defense Department for comment.\nThe 21,600-pound air-burst weapon is designed to affect surface targets over a wide area and has so far not been deployed by the U.S. in previous strikes on targets inside Iran. It was used in Afghanistan in 2017 during the previous Trump administration.\nU.S. President Donald Trump said last week that he would not order a resumption of military strikes before the midterm elections on Nov. 3.\nTensions in the Middle East are nonetheless elevated amid the sinking of a container ship in the Strait of Hormuz on Wednesday and a string of fatal attacks on Saudi Arabia by the Iran-backed Houthis.\nThe White House is under mounting pressure to show progress in its Middle East objectives ahead of the midterms, as the American public increasingly feels the impact at home via soaring energy prices and wider cost pressures.\nTehran is reportedly strengthening its defenses around sensitive energy and nuclear sites in preparation for a potential resumption of attacks, according to the Wall Street Journal.\nIranian Parliament Speaker Mohammad Bagher Ghalibaf said in a televised address late Wednesday that Iran must continue to use a combination of military and defensive capabilities, negotiations and regional strategic leverage to push the U.S. to accept its demands.\nOfficials in Tehran have previously listed demands including Washington lifting its naval blockade and sanctions and withdrawing U.S. military forces from the region.\nGhalibaf said Tehran's goal is not to be locked in an endless war, but to prevent the U.S. and its other adversaries from being able to achieve their own objectives through military attacks, Iranian state-affiliated media reported.",

    "id": "ukraine-to-resume-strikes-on-russian-ref-15d12907",
    "title": "Ukraine to resume strikes on Russian refineries, shattering hopes of an 'energy ceasefire'",
    "titleJa": "Ukraine to resume strikes on Russian refineries, shattering hopes of an 'energy ceasefire'",
    "summaryJa": "Ukraine will now resume attacks on Russian energy targets after Moscow hasn't held up its end of the proposed deal brokered by Trump.",
    "bodyOriginal": "President Volodymyr Zelenskyy has said Ukraine will resume attacks on Russian energy infrastructure after Moscow failed to uphold its end of an \"energy ceasefire\" deal proposed by President Donald Trump.\n\"The block [on attacking refineries] is out. We're done,\" Zelenskyy told the Financial Times after Ukraine paused strikes on energy targets for three days at the request of Washington.\nOn Sunday, Trump announced an \"energy ceasefire\" between Ukraine and Russia in an effort to put an end to the countries attacking each other's power facilities and thereby lower the price of oil and diesel ahead of the U.S. midterm elections next month.\nDespite Ukraine's pause, officials in Kyiv said the country has been stripped of advance warnings of incoming ballistic missiles, as Starlink connectivity services had been restricted across the country, disrupting military operations. The restrictions apply to the sister service Starshield.\nSerhii Beskrestnov, an adviser to Zelenskyy on defense technology, said Wednesday that SpaceX has implemented a speed limit on Starlink terminals in motion without notifying Ukrainian defense forces.\n\"It is clear that this action cannot be a coincidence and is related to the current political situation,\" Beskrestnov said on Telegram.\nAccording to SpaceX CEO Elon Musk, the U.S. government is ultimately responsible for any curbs on Ukraine's military-grade Starlink network. \"Starshield systems are owned and controlled by the US government,\" he wrote on X on Wednesday.\nThe White House and SpaceX didn't respond to CNBC's request for comment.\nIn an interview with Piers Morgan released late Wednesday, Zelenskyy said he felt let down by Trump's recent dealings with Vladimir Putin, Russia's attacks on Ukrainian energy infrastructure and the apparent speed limits imposed on SpaceX's military communications network Starshield.\nAsked whether he felt \"betrayed by what has been happening,\" Zelenskyy answered: \"Really, yes,\" but stressed that Ukraine's survival and its strategic relationship with the U.S. mattered more than his personal emotions.\nZelenskyy said Ukraine had honored a proposed energy ceasefire for three days, refraining from both attacks and retaliation, while Russia subsequently launched a massive assault on Ukrainian energy infrastructure, including approximately 40 ballistic missiles.\nHe said he had warned U.S. officials that Russia would violate the ceasefire and described the reported Starlink shutdown as an \"absolutely crazy\" move that was not consistent with the behavior expected between partners.",
    "bodyJa": "President Volodymyr Zelenskyy has said Ukraine will resume attacks on Russian energy infrastructure after Moscow failed to uphold its end of an \"energy ceasefire\" deal proposed by President Donald Trump.\n\"The block [on attacking refineries] is out. We're done,\" Zelenskyy told the Financial Times after Ukraine paused strikes on energy targets for three days at the request of Washington.\nOn Sunday, Trump announced an \"energy ceasefire\" between Ukraine and Russia in an effort to put an end to the countries attacking each other's power facilities and thereby lower the price of oil and diesel ahead of the U.S. midterm elections next month.\nDespite Ukraine's pause, officials in Kyiv said the country has been stripped of advance warnings of incoming ballistic missiles, as Starlink connectivity services had been restricted across the country, disrupting military operations. The restrictions apply to the sister service Starshield.\nSerhii Beskrestnov, an adviser to Zelenskyy on defense technology, said Wednesday that SpaceX has implemented a speed limit on Starlink terminals in motion without notifying Ukrainian defense forces.\n\"It is clear that this action cannot be a coincidence and is related to the current political situation,\" Beskrestnov said on Telegram.\nAccording to SpaceX CEO Elon Musk, the U.S. government is ultimately responsible for any curbs on Ukraine's military-grade Starlink network. \"Starshield systems are owned and controlled by the US government,\" he wrote on X on Wednesday.\nThe White House and SpaceX didn't respond to CNBC's request for comment.\nIn an interview with Piers Morgan released late Wednesday, Zelenskyy said he felt let down by Trump's recent dealings with Vladimir Putin, Russia's attacks on Ukrainian energy infrastructure and the apparent speed limits imposed on SpaceX's military communications network Starshield.\nAsked whether he felt \"betrayed by what has been happening,\" Zelenskyy answered: \"Really, yes,\" but stressed that Ukraine's survival and its strategic relationship with the U.S. mattered more than his personal emotions.\nZelenskyy said Ukraine had honored a proposed energy ceasefire for three days, refraining from both attacks and retaliation, while Russia subsequently launched a massive assault on Ukrainian energy infrastructure, including approximately 40 ballistic missiles.\nHe said he had warned U.S. officials that Russia would violate the ceasefire and described the reported Starlink shutdown as an \"absolutely crazy\" move that was not consistent with the behavior expected between partners.",

    "bodyOriginal": "Healey says surprise UK growth is 'sign of resilience' ahead of Budget\n- Published\nThe UK economy's stronger than expected performance in August has been called a \"sign of resilience\" by Chancellor John Healey.\nHealey told the BBC \"it's really tough in the face of these economic global shocks\" as the latest official figures showed the economy grew by 0.1% for the month, defying analysts' forecasts of a slight contraction.\nIt follows an upgrade to this year's forecast for the UK economy from global watchdog the International Monetary Fund (IMF) earlier this week.\nMr Healey said he wanted \"to give people a bit of breathing space from the cost of living and cost of business pressures\", promising to do so when he delivers his first Budget in two weeks' time.\nHealey did not elaborate on what measures he will take in the Budget, but promised \"where we can take action, we will\".\nBut, vowing to keep up the government's approach to fiscal discipline, Healey said \"where we want to do things we have to make sure we can pay for them within the Budget that we've got and control spending\".\nThe latest figures from the Office for National Statistics showed the economy grew by 0.7% in the three months to August.\n\"It's a sign of resilience in the UK economy that some had not expected,\" Healey said.\nThe chancellor said the growth was \"part of the discipline the IMF here in Bangkok this week has endorsed that they see in Britain\".\nBritain's economy was boosted in August by an increase in production, which includes manufacturing, oil and gas extraction and energy supply.\nThe services industry, which makes up the largest chunk of the UK's economy, was flat during the month, while the construction sector contracted.\nOver the three months to August, the UK's economy grew by 0.7% overall. ONS director of economic statistics Liz McKeown said computer programming had been the biggest contributor to what she described as \"robust\" growth over the period.\nBut she said the production and construction sectors shrank over the three-month period.\nAugust's surprise expansion follows growth of 0.4% in July. The ONS also upgraded its estimate for June's monthly growth to 0.4% from 0.3%.\nPaul Dales, chief UK economist at Capital Economics, said Britain's economy was \"more robust than we thought\".\nHe warned that an expected increase in inflation would still \"dampen growth\", but added that the economy was showing \"remarkable resilience to higher energy prices and borrowing costs\".\nPwC senior economist Jake Finney said the development of AI infrastructure was underpinning Britain's relatively strong performance.\n\"The UK still lags the US in both the scale of that investment and the boost it provides to growth, but it is making progress and remains ahead of many of its European peers,\" he added.\nWhat's happening to the UK economy and how does it affect you?\n- Published2 hours ago\nWhat is the Budget and what could be in it?\n- Published2 hours ago\nHealey told the BBC the \"impact of AI on the economy, on productivity, is only just beginning to register\".\nHe said the technology has \"huge potential, as well as huge risks\", adding that Britain's priority would be to ensure AI can be developed safely while unlocking the opportunities it presents.\nThe latest growth figures were released after Healey landed in Bangkok for the annual meeting of the International Monetary Fund (IMF).\nEarlier this week, the global financial watchdog praised the UK's plans to cut debt levels, with global borrowing costs on the rise, with managing director Kristalina Georgieva adding that the country was seeing \"a bit of a better growth prospect\" than other G7 nations.\nHealey said: \"Despite conflicts in the Middle East and Europe hitting people across the world, today's figures offer more proof of Britain's resilience in the face of these global shocks.\"\nThe Conservatives said the economic growth figures \"conceal worrying trends in key sectors as we approach a crucial Budget\".\nShadow chancellor Andrew Griffith said: \"Construction has now shrunk for four months in a row, with private housebuilding falling fastest. Labour promised to get Britain building, but they are failing.\"\nHe called for Healey to cut taxes and reduce red tape.\nLiberal Democrat Treasury spokesperson, Daisy Cooper, said the growth of 0.1% in August was \"nothing to celebrate\".\n\"The economy is stuck in first gear and barely crawling forward, while families are still struggling to make ends meet.\"\nGet in touch\nWhat would you like to see in the Budget?\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "title": "TSMC posts record profit for a sixth straight quarter, beating estimates on AI boom",
    "titleJa": "TSMC posts record profit for a sixth straight quarter, beating estimates on AI boom",
    "summaryJa": "Taiwan Semiconductor Manufacturing Co. on Thursday reported a record third-quarter profit that beat estimates, powered by an unrelenting global appetite for AI chips.Here are TSMC's third-quarter results against LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:",
    "bodyOriginal": "Taiwan Semiconductor Manufacturing Co. on Thursday reported a record third-quarter profit that beat estimates, powered by an unrelenting global appetite for AI chips.\nHere are TSMC's third-quarter results against LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n- Revenue: 1.49 trillion new Taiwan dollars ($46.36 billion) vs. NT$1.47 trillion\n- Net Income: NT$763.1 billion vs. NT$746.34 billion expected\nThe world's largest contract chipmaker posted a record net profit for a sixth straight quarter, reporting 68.7% surge in the reported quarter from a year earlier.\nTSMC's third-quarter operating margin came in at 58.7%, exceeding the upper end of its guidance range of 58%, showcasing the pricing power enjoyed by the company as the AI boom fuels demand for semiconductors.\nTSMC forecast fourth-quarter revenue between $52.3 billion and $54.3 billion, representing a 14% sequential increase and a 58% jump from a year earlier at the midpoint of its guidance range, according to the company's earnings call.\nThe chipmaker expects its capital expenditure from 2026 to 2028 to be significantly higher than in the previous three years, as it continues to ramp up investments to support growing customer demand.\nTSMC's stronger-than-expected results and upgraded full-year revenue outlook underscore how demand for advanced chips continues to outpace its production capacity, with the company's elevated capital spending reflecting confidence in sustained growth over the coming years, Sravan Kundojjala, an analyst at SemiAnalysis, told CNBC via email.\nTSMC expects its fourth-quarter business to be supported by continued strong demand for its advanced chipmaking technologies, including the ramp-up of its 2-nanometer process.\nKundojjala also highlighted TSMC's careful approach to capacity expansion, adding that the chipmaker is assessing whether customers have the financing and supporting components needed to deploy AI systems.\n\"Even after those checks, TSMC says demand remains well above its supply capacity,\" he said, adding that it reinforces confidence in the AI buildout while ensuring investment decisions reflect customers' ability to deploy the chips they order.\nAdvanced technologies, defined as 7-nanometer and more advanced technologies, made up for 79% of TSMC's total wafer revenue in the reported. The 3-nanometer chips accounted for the largest share of its revenue in the third quarter at 33%, followed by 5- and 7-nanometer chips.\nBy platform, high-performance computing accounted for the largest share of revenue at 68%, followed by smartphones at 21%. Meanwhile, automotive was the fastest-growing segment on a quarter-on-quarter basis, with 23% growth rate.\nTSMC said demand for AI chips remains strong, driven by the growing adoption of agentic AI and open-source AI models, which are expected to make AI more accessible and fuel demand for advanced semiconductors.\nThe company's free cash flow surged to NT$476.56 billion in the third quarter, from NT$139.38 billion a year ago.\nTSMC also pointed to rising demand for AI accelerators, processors used in agentic AI applications and networking, adding that semiconductors are set to play an increasingly important role in the global AI supply chain.\nTSMC also said it had completed construction of its second fab in Arizona and is installing equipment, with mass production expected to begin in the third quarter of 2027, slightly ahead of its previous schedule.\nTSMC board approved NT$7.00 cash dividend for the second quarter. During its second-quarter earnings announcement in July, TSMC had outlined plans to expand its U.S. manufacturing footprint, including a total planned investment of $265 billion in Arizona.\nThe chipmaker is also reportedly considering expanding beyond Arizona, evaluating a potential investment in Texas as it looks to further strengthen its U.S. manufacturing presence.",
    "bodyJa": "Taiwan Semiconductor Manufacturing Co. on Thursday reported a record third-quarter profit that beat estimates, powered by an unrelenting global appetite for AI chips.\nHere are TSMC's third-quarter results against LSEG SmartEstimates, which are weighted toward forecasts from analysts who are more consistently accurate:\n- Revenue: 1.49 trillion new Taiwan dollars ($46.36 billion) vs. NT$1.47 trillion\n- Net Income: NT$763.1 billion vs. NT$746.34 billion expected\nThe world's largest contract chipmaker posted a record net profit for a sixth straight quarter, reporting 68.7% surge in the reported quarter from a year earlier.\nTSMC's third-quarter operating margin came in at 58.7%, exceeding the upper end of its guidance range of 58%, showcasing the pricing power enjoyed by the company as the AI boom fuels demand for semiconductors.\nTSMC forecast fourth-quarter revenue between $52.3 billion and $54.3 billion, representing a 14% sequential increase and a 58% jump from a year earlier at the midpoint of its guidance range, according to the company's earnings call.\nThe chipmaker expects its capital expenditure from 2026 to 2028 to be significantly higher than in the previous three years, as it continues to ramp up investments to support growing customer demand.\nTSMC's stronger-than-expected results and upgraded full-year revenue outlook underscore how demand for advanced chips continues to outpace its production capacity, with the company's elevated capital spending reflecting confidence in sustained growth over the coming years, Sravan Kundojjala, an analyst at SemiAnalysis, told CNBC via email.\nTSMC expects its fourth-quarter business to be supported by continued strong demand for its advanced chipmaking technologies, including the ramp-up of its 2-nanometer process.\nKundojjala also highlighted TSMC's careful approach to capacity expansion, adding that the chipmaker is assessing whether customers have the financing and supporting components needed to deploy AI systems.\n\"Even after those checks, TSMC says demand remains well above its supply capacity,\" he said, adding that it reinforces confidence in the AI buildout while ensuring investment decisions reflect customers' ability to deploy the chips they order.\nAdvanced technologies, defined as 7-nanometer and more advanced technologies, made up for 79% of TSMC's total wafer revenue in the reported. The 3-nanometer chips accounted for the largest share of its revenue in the third quarter at 33%, followed by 5- and 7-nanometer chips.\nBy platform, high-performance computing accounted for the largest share of revenue at 68%, followed by smartphones at 21%. Meanwhile, automotive was the fastest-growing segment on a quarter-on-quarter basis, with 23% growth rate.\nTSMC said demand for AI chips remains strong, driven by the growing adoption of agentic AI and open-source AI models, which are expected to make AI more accessible and fuel demand for advanced semiconductors.\nThe company's free cash flow surged to NT$476.56 billion in the third quarter, from NT$139.38 billion a year ago.\nTSMC also pointed to rising demand for AI accelerators, processors used in agentic AI applications and networking, adding that semiconductors are set to play an increasingly important role in the global AI supply chain.\nTSMC also said it had completed construction of its second fab in Arizona and is installing equipment, with mass production expected to begin in the third quarter of 2027, slightly ahead of its previous schedule.\nTSMC board approved NT$7.00 cash dividend for the second quarter. During its second-quarter earnings announcement in July, TSMC had outlined plans to expand its U.S. manufacturing footprint, including a total planned investment of $265 billion in Arizona.\nThe chipmaker is also reportedly considering expanding beyond Arizona, evaluating a potential investment in Texas as it looks to further strengthen its U.S. manufacturing presence.",

    "id": "i-paid-thousands-to-a-company-for-jobs-f3574b3d",
    "title": "'I paid thousands to a company for jobs that never came'",
    "titleJa": "'I paid thousands to a company for jobs that never came'",
    "summaryJa": "Apurv Patel is one of several people who say they were promised job opportunities that did not appear.",
    "bodyOriginal": "'I paid thousands to a company for jobs that never came'\n- Published\nA company has been accused of promising jobs in the healthcare sector which never materialised, leaving people thousands of pounds out of pocket.\nRegistered in 2025, Synetal Solutions Ltd says it offers career-focused training programmes in the healthcare and IT sectors.\nBut the BBC has spoken to a number of people who claim they were promised training and support to secure sponsored healthcare jobs that never became available to apply for.\nLondon Citizens Advice says it has seen an increase in recruitment-related scams since the government stopped overseas recruitment for care workers, external. The charity described the firm's practices as \"unethical\".\nSynetal Solutions says it \"takes these concerns seriously and disputes the broad allegation that its services or candidate outcomes are fictitious\".\n'Miserable'\nApurv Patel, who has been in the UK on a Skilled Worker visa since 2023, said he paid Synetal Solutions £3,600 across February and March for healthcare training after he and a friend were verbally promised guaranteed sponsored jobs.\nEight months later he has received no job offers, interviews or meaningful employment support, he said.\n\"I'm frustrated. I paid money, I wasted my time. I did whatever they wanted without any result,\" he said.\n\"It's had a miserable effect on my family and finances.\"\nPatel said he did receive some training but described it as poor quality and ultimately \"worthless\".\nHaving previously worked for two years as a healthcare assistant, he said he became concerned when a trainer was unable to answer routine questions about care work.\n\"She didn't give us any answers and we realised she didn't have any experience of healthcare,\" he said.\nThe company disputes claims that training was ineffective.\nHe also alleged communication with the company deteriorated after he made his second payment, with responses sometimes taking several days.\nPatel has since complained to his bank and sought help from Citizens Advice.\nThe BBC has seen emails from the company advertising a \"three-month recruitment programme\" offering \"training and placement with sponsorship\" for £5,500.\nHome Office guidance, external states agencies may charge for services such as training or CV-writing assistance, but cannot charge fees solely for finding, or attempting to find, employment.\nResponding to questions about its marketing, Synetal Solutions said: \"We acknowledge the 'guarantee' wording in the emails supplied and recognise that contractual terms alone do not resolve concerns about those assurances.\"\nAs part of its programme, Synetal Solutions created accounts for trainees on iHasco, a health and social care training platform.\nThe BBC contacted iHasco, which confirmed the company was a customer. However, it said its terms did not permit customers to resell its training content to individuals who were not employees.\nThe company said it was reviewing Synetal Solutions' account and would take appropriate action if necessary.\nSynetal Solutions said it had acted in accordance with its agreement with iHasco.\nThe Care Quality Commission said there was no single qualification that automatically qualified someone to work as a care worker. Instead, providers are responsible for ensuring employees are appropriately trained and competent for their roles.\nThe BBC also contacted a number of healthcare organisations whose logos appeared on Synetal Solutions' website as examples of employers where graduates had worked.\nThose organisations that responded said they had no links to the company. Some also said they had not authorised the use of their branding, and some said they would not accept certificates provided through the company's training.\nDaniel Blake, director of London Citizens Advice, described the company's approach as \"exploitative\".\n\"The promises that were made are impossible promises,\" he said. \"They are targeting people with vulnerable immigration status.\n\"This company is asking for large sums of money upfront without any reputable standards, without any reputable evidence of success, and yet when it goes wrong they are refusing to take any responsibility.\n\"For us, it seems a very unethical way of conducting business.\"\nHe added that no reputable recruitment agency would guarantee a successful outcome without first assessing a candidate and matching them to a suitable role, and urged anybody asked to pay large sums upfront to seek independent advice.\n\"If it seems too good to be true, it probably is,\" he said.\nThe company's website states: \"Synetal Solutions provides the right support, guidance, and guaranteed job placement to help you succeed.\"\nIts social media channels also promoted healthcare as \"one of the most reliable paths\" for people seeking visa-sponsored work in the UK.\nSarah and Rahul, whose names we have changed, said they paid £3,000 to Synetal Solutions while seeking sponsored employment before the expiry of their student visas.\nRahul, a former dentist in India, could remain in the UK on a graduate visa for longer, but Sarah's immigration status was close to expiring.\nTo pay the fee, the couple said they borrowed money from a family friend and took out a loan.\nRahul said he was shocked by the quality of the training.\n\"The mentor didn't know anything about healthcare,\" he said.\nThe couple said they were also shown the names of established healthcare providers, including Bupa, as examples of potential employers. Bupa told the BBC it had no connection with the company.\nSynetal Solutions says some of their candidates \"told us they had secured employment with Bupa\" and the reference was \"not intended to suggest a formal partnership with Bupa\".\nIt says it had not verified those outcomes and \"cannot attribute the recruitment decisions to our training\".\nRahul said he secured one or two interviews, but prospective employers rejected the certificates he had received through the programme.\nThe couple said Synetal Solutions had since stopped responding to their messages.\n\"We're desperate,\" Sarah said. \"We don't see any other way out.\"\nAmisha, whose name has also been changed, said she signed up with Synetal after being told that both a placement and visa sponsorship were guaranteed.\nHer student visa is due to expire soon.\nShe said the training consisted of three sessions lasting around 90 minutes each.\nAfter paying an initial instalment of £1,800, she became reluctant to make a second payment because she felt she had received little in return. She said the company warned her that her contract would be cancelled if she failed to pay, prompting her to transfer a further £1,800.\n\"I was waiting for interviews for two or three months. They were ignoring me,\" she said.\nAccording to Amisha, the company applied for only a handful of vacancies advertised on job-search website Indeed. She eventually secured an interview for a healthcare assistant role, but said the employer told her the certificates she had received were not recognised.\nThe BBC also identified what appeared to be at least a couple of stock photographs or AI-generated images used as testimonials on the company's website.\nThe company said it had not authenticated the two reviews identified, and removed them after we contacted them.\nTeni Shahiean, an immigration lawyer at OTS Solicitors, said it was \"particularly concerning\" where individuals facing visa deadlines were being asked to make substantial payments on the understanding that jobs, sponsorship or immigration outcomes were seemingly guaranteed.\nShe urged caution, adding that a job offer alone does not guarantee someone will be able to remain in the UK.\n\"The outcome can depend on the role, the sponsor, the individual meeting the relevant immigration requirements and, ultimately, any decision by the Home Office,\" she said.\n'Go to the police'\nBlake told the BBC: \"If it seems good to be true, it probably is. If you are considering handing over money upfront then seek advice.\"\nHe said that \"if people have given money and haven't received the service that they were entitled to they should seek redress\".\n\"First of all, make a complaint directly to the company, then to Trading Standards.\n\"If people feel a criminal offence has happened, we would encourage and support them to go to the police.\"\nA government spokesperson said: \"We know how much distress scammers cause to their victims, which is why we will do everything in our power to protect hardworking families and vulnerable customers.\n\"Our reforms have provided Companies House with new and improved powers to prevent companies from acting unlawfully and to query, remove and share suspicious information.\"\nSynetal Solutions said: \"We provide training and employment assistance and maintain supporting records. Recruitment, sponsorship and visa decisions depend on employers and the Home Office.\"\nThe company said it had records of genuine candidates who had secured jobs and sponsorship through its services.\nGet in touch\nHave you been affected by issues covered in this story? Share your experiences.",

re targeting people with vulnerable immigration status.\n\"This company is asking for large sums of money upfront without any reputable standards, without any reputable evidence of success, and yet when it goes wrong they are refusing to take any responsibility.\n\"For us, it seems a very unethical way of conducting business.\"\nHe added that no reputable recruitment agency would guarantee a successful outcome without first assessing a candidate and matching them to a suitable role, and urged anybody asked to pay large sums upfront to seek independent advice.\n\"If it seems too good to be true, it probably is,\" he said.\nThe company's website states: \"Synetal Solutions provides the right support, guidance, and guaranteed job placement to help you succeed.\"\nIts social media channels also promoted healthcare as \"one of the most reliable paths\" for people seeking visa-sponsored work in the UK.\nSarah and Rahul, whose names we have changed, said they paid £3,000 to Synetal Solutions while seeking sponsored employment before the expiry of their student visas.\nRahul, a former dentist in India, could remain in the UK on a graduate visa for longer, but Sarah's immigration status was close to expiring.\nTo pay the fee, the couple said they borrowed money from a family friend and took out a loan.\nRahul said he was shocked by the quality of the training.\n\"The mentor didn't know anything about healthcare,\" he said.\nThe couple said they were also shown the names of established healthcare providers, including Bupa, as examples of potential employers. Bupa told the BBC it had no connection with the company.\nSynetal Solutions says some of their candidates \"told us they had secured employment with Bupa\" and the reference was \"not intended to suggest a formal partnership with Bupa\".\nIt says it had not verified those outcomes and \"cannot attribute the recruitment decisions to our training\".\nRahul said he secured one or two interviews, but prospective employers rejected the certificates he had received through the programme.\nThe couple said Synetal Solutions had since stopped responding to their messages.\n\"We're desperate,\" Sarah said. \"We don't see any other way out.\"\nAmisha, whose name has also been changed, said she signed up with Synetal after being told that both a placement and visa sponsorship were guaranteed.\nHer student visa is due to expire soon.\nShe said the training consisted of three sessions lasting around 90 minutes each.\nAfter paying an initial instalment of £1,800, she became reluctant to make a second payment because she felt she had received little in return. She said the company warned her that her contract would be cancelled if she failed to pay, prompting her to transfer a further £1,800.\n\"I was waiting for interviews for two or three months. They were ignoring me,\" she said.\nAccording to Amisha, the company applied for only a handful of vacancies advertised on job-search website Indeed. She eventually secured an interview for a healthcare assistant role, but said the employer told her the certificates she had received were not recognised.\nThe BBC also identified what appeared to be at least a couple of stock photographs or AI-generated images used as testimonials on the company's website.\nThe company said it had not authenticated the two reviews identified, and removed them after we contacted them.\nTeni Shahiean, an immigration lawyer at OTS Solicitors, said it was \"particularly concerning\" where individuals facing visa deadlines were being asked to make substantial payments on the understanding that jobs, sponsorship or immigration outcomes were seemingly guaranteed.\nShe urged caution, adding that a job offer alone does not guarantee someone will be able to remain in the UK.\n\"The outcome can depend on the role, the sponsor, the individual meeting the relevant immigration requirements and, ultimately, any decision by the Home Office,\" she said.\n'Go to the police'\nBlake told the BBC: \"If it seems good to be true, it probably is. If you are considering handing over money upfront then seek advice.\"\nHe said that \"if people have given money and haven't received the service that they were entitled to they should seek redress\".\n\"First of all, make a complaint directly to the company, then to Trading Standards.\n\"If people feel a criminal offence has happened, we would encourage and support them to go to the police.\"\nA government spokesperson said: \"We know how much distress scammers cause to their victims, which is why we will do everything in our power to protect hardworking families and vulnerable customers.\n\"Our reforms have provided Companies House with new and improved powers to prevent companies from acting unlawfully and to query, remove and share suspicious information.\"\nSynetal Solutions said: \"We provide training and employment assistance and maintain supporting records. Recruitment, sponsorship and visa decisions depend on employers and the Home Office.\"\nThe company said it had records of genuine candidates who had secured jobs and sponsorship through its services.\nGet in touch\nHave you been affected by issues covered in this story? Share your experiences.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
