    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Hopes are running high that high-profile software provider Palantir can shake off its nine-month bear market and rally after earnings Monday night.\nAfter all, the chart of Microsoft was looking similar going into its report, and that stock's now in the midst of a three-day, 25% bounce. The options flows around Palantir also mirror Microsoft going into its report, where traders were scooping up calls and betting on a bigger-than-usual swing.\nMore than twice as many Palantir calls traded than puts by volume Monday, with traders buying 56,000 calls and fewer than 25,000 puts, according to ThinkOrSwim data. Of the $160 million in premium traded, $120 million was tied to calls, and the top five contracts traded by volume were all calls, SpotGamma data show.\nThe most popular contract for bulls was the 130-strike call expiring Friday, where traders bought 8,500 contracts totaling $4.4 million, according to SpotGamma. Trading for $5.30 a contract, the 130-strike calls need an 8 percent rally before the weekend to pay off. The 150 and 140-strike calls were second and third-most popular by volume.\nCboe LiveVol data shows options pricing implying a 10.5% move after earnings, bigger than the median 7.4% move the past year. For the past five straight quarters, Palantir options have overestimated the actual move, the data show.\nThe heavy call volume doesn't mean bears aren't taking shots. In fact, seven of the eight biggest dollar-amount trades of the day were neutral or bearish, according to Cboe data.\nThat includes the biggest premium trade of the day, a sale of 800 of the 145-strike calls in Palantir that expire in mid-December 2028, a bearish bet against extensive gains in the stock that brought in $3.4 million for the seller.",
    "bodyJa": "知名度の高いソフトウェアプロバイダーのパランティアが、9か月にわたる弱気相場を脱却し、月曜夜の決算後に反発できるのではないかとの期待が高まっている。\n結局のところ、Microsoft のチャートはレポートの時点では同様に見えており、その株価は現在 3 日間で 25% の上昇の最中にあります。パランティアを巡るオプションの流れは、トレーダーらがコールをすくい上げ、通常よりも大きな値動きに賭けていたというマイクロソフトの報告書にも反映されている。\nThinkOrSwimのデータによると、月曜の出来高ベースでは、パランティアのコールはプットの2倍以上で取引されており、トレーダーが購入したコールは5万6000件、プットは2万5000件未満だった。 SpotGamma のデータによると、取引されたプレミアム額 1 億 6,000 万ドルのうち 1 億 2,000 万ドルはコールに関連しており、取引高トップ 5 の契約はすべてコールでした。\nスポットガンマによると、強気筋で最も人気のある契約は金曜日に期限が切れる130ストライクコールで、トレーダーらは8,500枚、総額440万ドルを購入した。 1契約あたり5.30ドルで取引されており、130ストライキのコールが報われるには週末までに8％上昇する必要がある。 150 ストライクと 140 ストライクのコールは、ボリュームで 2 番目と 3 番目に人気がありました。\nCboe LiveVolのデータによると、オプションの価格設定は収益後に10.5%の変動を示唆しており、これは過去1年間の中央値7.4%の変動よりも大きい。データによると、過去5四半期連続で、パランティアのオプションは実際の動きを過大評価してきた。\n通報件数が多いからといって、クマが射撃を行っていないわけではありません。実際、Cboeのデータによると、この日の金額の大きかった取引8件のうち7件は中立または弱気だった。\nこれには、その日最大のプレミアム取引、2028年12月中旬に期限切れとなるパランティアの145ストライクコールのうち800件の売却が含まれており、売り手に340万ドルをもたらした株の大幅な上昇に対する弱気の賭けとなった。",

    "id": "hugging-face-ceo-says-china-is-winning-t-c3f4ed45",
    "title": "Hugging Face CEO says China is winning the AI race and dominating on open models",
    "titleJa": "ハグ・フェイスCEO、中国はAI競争に勝利し、オープンモデルで優位に立つと語る",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Hugging Face CEO Clément Delangue said China is winning the artificial intelligence race with open-weight models and could catch up to U.S. model makers as soon as this year.\n\"They're clearly dominating on open models right now, and I wouldn't be surprised if they start dominating at the frontier either by the end of this year or next year at the rate of progress,\" he told CNBC's \"Squawk on the Street\" on Monday.\nFueling this revolution is the open collaboration and sharing ecosystem in China, while model makers in the U.S. are \"building in silos\" and risk falling behind, he said.\nLast month, OpenAI agents broke out of a training environment and hacked open-source software developer platform Hugging Face, raising concerns over the rapid evolution of powerful AI and cybersecurity tools.\nThe incident also brought months of simmering cybersecurity fears to a head, demonstrating how easily AI agents could cause immense damage, while making the case for open models in the era of skyrocketing token costs.\nDelangue, a proponent of open-source models, blamed engineering mistakes for the recent attack on Hugging Face and said his company used a Nvidia version of a Chinese open model to resolve the attack.\nIn recent months, Chinese open-source models have been closing the capabilities gap with U.S. model makers, sparking debate over whether to restrict access. Last month, technology heavyweights such as Microsoft, Palantir and Nvidia signed a letter urging policymakers to avoid restricting open-weight models and suppressing competition.\n\"AI cybersecurity is going to become a huge market in the U.S. and in the world,\" Delangue said. \"In this market, probably open models will be kings.\"\nDelangue said the company maintains a \"healthy collaboration\" with OpenAI and called the frontier lab \"good partners\" before and after the incident.",

    "id": "threat-to-oil-tankers-in-middle-east-wor-b696dc50",
    "title": "Threat to oil tankers in Middle East  worst since start of Iran war, analysts say",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Threat to oil tankers in Middle East worst since start of Iran war, analysts say\n- Published\nThe threat to ships carrying oil in the Middle East is at its worst since the Iran war started, experts have said, after a spate of attacks on another key route in the region.\nThe warning comes after a number of attacks on vessels in the Red Sea, an alternative waterway that some tankers had been using since Iran blocked the Strait of Hormuz.\nIran has denied Donald Trump's claim that it was in talks with the US over reopening the strait, but said it was speaking to Oman about securing the shipping lane.\n\"In terms of threat to the trade of crude, we're at the worst period that we've been in since this since this crisis began,\" said Matthew Wright, an analyst at ship-tracking firm Kpler.\nThe number of ships passing through the Strait of Hormuz was just eight on Sunday and 11 on Saturday, compared with more than 100 per day before the war began, according to Kpler.\nBefore the conflict, about 20% of the world's oil and gas passed through the strait.\nThe temporary peace deal with the US struck in early June led to numbers rising again, but the resumption of strikes between the two countries roughly a month later have significantly reduced traffic.\nMany ships have been \"going dark\" when crossing the strait, meaning they turn off their transponder to avoid detection.\nFor much of the war, some ships carrying oil from Saudi Arabia had instead passed through an alternative shipping lane in the Red Sea, between the kingdom and west Africa.\nBut a recent spate of attacks by Yemen's Houthi fighters on Saudi tankers using the alternative waterway has further heightened the risks.\nThe Iranian-backed Houthi militia announced what it called a blockade on Saudi Arabia's Red Sea ports on 20 July and the UK Maritime Trade Operations agency has reported several attacks on ships in the past week.\n\"Not only is the ongoing situation in the Strait of Hormuz constraining oil flows, but now a big factor that was helping to balance the market is now also under threat. It's a problem stacked on top of a problem,\" Wright said.\nTim Wilkins, the managing director of Intertanko, a trade body representing tanker owners, said the industry was \"facing a broadening, deteriorating, and increasingly complex security situation\".\n\"We now have the high-risk area going up to Saudi Arabian waters and extending into parts of the Red Sea. So that's having another impact on the market, on freedom of navigation as well.\"\nThe number of commodity vessels that passed through the Bab el-Mandeb strait was 28 on Saturday and six of them had their transponders turned off, according to Kpler data, indicating that they were trying to avoid detection.\nAs the US pauses the war with Iran, is Trump really running out of weapons?\n- Published6 days ago\nWhy Iran is risking so much over the Strait of Hormuz\n- Published21 July\nTankers make sharp U-turns after Houthi shipping threat\n- Published22 July\nNot all vessels are deterred from passing through because the Houthi threat is only targeted at Saudi shipping, with the total number sitting at about 50% of pre-attack levels.\nBut the number of ships loading crude oil for export to Asia passing through has dropped to about four per day, Kpler added, the lowest point since the start of the war.\nA spokesperson for Hapag-Lloyd, the global shipping giant, said some of its vessels were still passing through the Red Sea but that it would \"monitor developments closely and will adjust the network if circumstances change\".\n\"If the Strait of Hormuz reopened, most ships could probably leave the region fairly quickly. However, restoring normal cargo flows would take much longer.\n\"Services have been suspended and ships redeployed elsewhere, so a return to normal flows would most likely take three to four months.\"\nDespite the talks with Oman, Iran has said that no deal is imminent that would reopen the strait to normal traffic.\nIts foreign ministry ministry spokesman Esmaeil Baqaei said any agreement would not lift the current restrictions while US \"aggression\" continued.\nKpler's Wright said that while talks with Oman could be productive, any deal would need the involvement of the US and the fear is that current negotiations could be a \"false start\" without concessions on at least one side.\nNonetheless, oil prices fell sharply after Trump said he would cancel planned strikes on Iran based on the potential for upcoming talks.\nBrent crude was trading 4.4% lower at $84.05 a barrel, after it fell as much as 7.3% to $81.55 a barrel earlier in the day.\nPeter Sand, chief analyst at Xeneta, another ship-tracking company, said the fighting had taken the shipping industry \"back to to square one\" and that things were in \"a terrible state, regardless of which shipping type you're you're looking at\".\n\"The alternatives for getting cargo, whether that's hydrocarbons or container shipping, are really not great… it is really still troubling times with no clarity and no change of fortunes within sight.\"\nRelated topics\n- Published5 days ago\n- Published1 day ago\n- Published4 days ago",
    "bodyJa": "中東の石油タンカーに対する脅威はイラン戦争開始以来最悪だとアナリストが語る\n- 公開されました\n中東の石油輸送船に対する脅威は、この地域の別の重要航路に対する相次ぐ攻撃を受けて、イラン戦争勃発以来最悪となっている、と専門家らは述べた。\nこの警告は、イランがホルムズ海峡を封鎖して以来、一部のタンカーが使用していた代替水路である紅海で船舶に対する多数の攻撃を受けて発出された。\nイランは、海峡再開を巡って米国と協議しているとするドナルド・トランプ氏の主張を否定したが、航路の確保についてはオマーンと話し合っていると述べた。\n船舶追跡会社クプラーのアナリスト、マシュー・ライト氏は「原油貿易への脅威という点では、この危機が始まって以来最悪の時期にある」と述べた。\nクプラー氏によると、ホルムズ海峡を通過する船舶の数は、開戦前は１日当たり１００隻以上だったのに対し、日曜日はわずか８隻、土曜日は１１隻にとどまった。\n紛争前は、世界の石油とガスの約 20% がこの海峡を通過していました。\n6月初旬に締結された米国との一時和平合意により、感染者数は再び増加したが、約1カ月後に両国間のストライキが再開されたことで交通量は大幅に減少した。\n多くの船舶は海峡を通過する際に「暗転」しており、探知を避けるためにトランスポンダーの電源を切っている。\n戦争のほとんどの間、サウジアラビアから石油を積んだ一部の船は代わりに、サウジと西アフリカの間の紅海の代替航路を通っていました。\nしかし、イエメンのフーシ派戦闘員による最近の代替水路を利用したサウジのタンカーへの攻撃が相次ぎ、危険性はさらに高まっている。\nイランの支援を受けるフーシ派民兵組織は7月20日にサウジアラビアの紅海の港を封鎖すると発表し、英国海事貿易業務局は過去1週間に船舶に対する数件の攻撃を報告した。\nライト氏は「ホルムズ海峡で進行中の状況が原油の流れを抑制しているだけでなく、市場のバランスを保っていた大きな要素も脅威にさらされている。問題の上に問題が重なっている」と述べた。\nタンカー船主を代表する業界団体インタータンコのマネージングディレクター、ティム・ウィルキンス氏は、業界は「拡大し、悪化し、ますます複雑化する安全保障状況に直面している」と述べた。\n「現在、高リスク地域はサウジアラビア海域にまで達し、紅海の一部にまで広がっています。そのため、市場や航行の自由にも新たな影響を及ぼしています。」\nKplerのデータによると、土曜日にバブ・エル・マンデブ海峡を通過した物資船の数は28隻で、そのうち6隻はトランスポンダーの電源を切っていて、探知を避けようとしていたことを示している。\n米国がイランとの戦争を一時停止する中、トランプ大統領は本当に武器を使い果たしているのだろうか？\n- 6 日前に公開\nなぜイランはホルムズ海峡でこれほどの危険を冒しているのか\n- 7 月 21 日発行\nタンカー、フーシ派の船舶脅迫を受けて急Uターン\n- 7 月 22 日発行\nフーシ派の脅威はサウジの海運だけをターゲットにしており、総数は攻撃前のレベルの約50％にとどまっているため、すべての船舶の通過が阻止されるわけではない。\nしかし、アジアへの輸出用原油を積んで通過する船の数は1日あたり約4隻に減少しており、これは戦争開始以来最低であるとクプラー氏は付け加えた。\n世界的な海運大手ハパック・ロイドの広報担当者は、同社の船舶の一部が依然として紅海を通過しているが、「動向を注意深く監視し、状況が変化した場合にはネットワークを調整する」と述べた。\n「ホルムズ海峡が再開すれば、ほとんどの船舶はおそらくかなり早くこの地域を離れることができるだろう。しかし、通常の貨物の流れを回復するにはさらに時間がかかるだろう。\n「サービスは停止されており、船は別の場所に再配置されているため、通常の流れに戻るには3〜4か月かかる可能性が高いです。」\nオマーンとの協議にもかかわらず、イランは海峡を通常の航行に再開する差し迫った合意はないと述べた。\n外務省報道官エスマイル・バカエイ氏は、米国の「侵略」が続く限り、いかなる合意も現在の制限を解除することはないと述べた。\nクプラーのライト氏は、オマーンとの交渉は生産的なものになる可能性があるが、いかなる合意にも米国の関与が必要であり、少なくとも一方の譲歩がなければ現在の交渉は「誤ったスタート」になる可能性があると懸念していると述べた。\nそれにもかかわらず、トランプ大統領が今後の協議の可能性を踏まえてイランへの攻撃計画を中止すると発言したことを受け、原油価格は急落した。\nError 500 (Server Error)!!1500   return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
