    "title": "Fed Chairman Kevin Warsh stresses importance of AI to economy, but says it could ‘disappoint’",
    "titleJa": "Fed Chairman Kevin Warsh stresses importance of AI to economy, but says it could ‘disappoint’",
    "summaryJa": "[The stream is slated to start at noon ET. Please refresh the page if you do not see a player above.]Federal Reserve Chairman Kevin Warsh on Monday highlighted the potential economic benefits of artificial intelligence while warning that the emerging technology also could lead to widespread job losses or fail to deliver on its lofty expectations.",
    "bodyOriginal": "[The stream is slated to start at noon ET. Please refresh the page if you do not see a player above.]\nFederal Reserve Chairman Kevin Warsh on Monday highlighted the potential economic benefits of artificial intelligence while warning that the emerging technology also could lead to widespread job losses or fail to deliver on its lofty expectations.\nSpeaking in San Francisco before a blue-ribbon task force he assembled to examine productivity and employment, the central bank leader stressed that AI \"will have significant impact on the economy, with important implications for monetary policy down the road.\"\n\"I stress that while I'm not here to offer predictions, I'm not exactly impartial about American leadership in a time so filled with both challenge and possibility,\" he said in prepared remarks before his productivity and jobs task force.\nIn his remarks, Warsh used the term \"super intelligence\" instead of artificial intelligence and described it as \"an entirely new force in economic life and society\" that has already begun to transform economic activity. President Donald Trump recently ordered that the U.S. government now use the term \"super intelligence\" almost exclusively instead of AI.\nSince taking the Fed chair position, Warsh has emphasized the importance of AI and its potential to improve productivity and ultimately to be a disinflationary force on the economy.\nIn his remarks Monday, he noted that AI could lead to productivity gains that could accelerate real economic growth beyond its current range while keeping employment near full capacity. On the downside, he said \"less positive\" outcomes include job displacement through automation that could raise unemployment.\nAt the same time, he outlined a third scenario where AI could simply \"disappoint.\"\n\"After significant capital investment and stock market gains, expected returns could turn down and equity valuations could fall, leading to an economic slowdown and a more notable rise in unemployment,\" he said. \"In time, the economy would recover, but without the productivity gains.\"\nThe potential for AI advancement has driven stock market valuations higher and led to companies raising capital to continue competing.\nMonday's conference features discussion panels with business leaders, economists and academics. The final session will be a fireside chat that will include Warsh and task force leader and AI advocate Marc Andreessen, co-founder of Andreessen Horowitz.\nWarsh created four other task forces addressing topics such as Fed communication, data reliance, balance sheet policy and inflation frameworks.\nThe chairman noted that this was the first visit he has made to a regional bank.",

e rise in unemployment,\" he said. \"In time, the economy would recover, but without the productivity gains.\"\nThe potential for AI advancement has driven stock market valuations higher and led to companies raising capital to continue competing.\nMonday's conference features discussion panels with business leaders, economists and academics. The final session will be a fireside chat that will include Warsh and task force leader and AI advocate Marc Andreessen, co-founder of Andreessen Horowitz.\nWarsh created four other task forces addressing topics such as Fed communication, data reliance, balance sheet policy and inflation frameworks.\nThe chairman noted that this was the first visit he has made to a regional bank.",

    "id": "gas-starts-flowing-from-jackdaw-after-go-31ccbe57",
    "title": "Gas starts flowing from Jackdaw after government green light",
    "titleJa": "Gas starts flowing from Jackdaw after government green light",
    "summaryJa": "Ministers last month announced the Jackdaw gas field, which lies 150 miles east of Aberdeen, had been approved after years of uncertainty.",
    "bodyOriginal": "Gas starts flowing from Jackdaw after government green light\n- Published\nGas has begun flowing from the Jackdaw gas field, with the UK energy secretary saying it will help to heat millions of homes and businesses this winter.\nMinisters last month announced the Jackdaw field, which lies 150 miles east of Aberdeen, had been approved after years of uncertainty and a court case.\nIt has now been announced that it has begun producing gas which will start flowing into Britain, according to its operator Adura.\nThe UK government approved production from the gas field in the North Sea last month, amid intense debate about the project's environmental and economic impact.\nJackdaw is operated by Adura under a joint venture between Shell and Norwegian state energy firm Equinor.\nA decision is yet to be taken on whether production can begin at Rosebank, the UK's largest known untapped oil field, which is located off the coast of Shetland in the North Atlantic.\nEnergy Secretary Miatta Fahnbulleh said: \"Last month, I gave Jackdaw the green light and today its gas will start flowing into Britain, thanks to the hard work of the skilled North Sea workers.\n\"It means homegrown gas from this project will help to heat millions of British homes and businesses this winter and beyond, in a boost for our energy security.\n\"It also will help minimise the UK's use of imported higher emission gas as we continue our transition to renewables and nuclear.\"\nClaire Mueller, Jackdaw project director at Adura, said the gas field was \"now helping to power Britain\".\nShe added: \"At a time of considerable uncertainty around the world, Jackdaw will provide secure energy from our own waters to heat British homes and power our economy, while reducing our reliance on imports with higher emissions.\n\"Jackdaw also demonstrates what can be achieved when Britain makes pragmatic, evidence-led decisions about the energy it needs, while properly accounting for our climate responsibilities.\"\nMueller said the decision was a \"positive step towards restoring confidence in the North Sea\".\nShe added that Adura was \"proud to be producing the oil and gas our country will continue to need for decades\".\nAdura has said Jackdaw will provide about 6% of UK gas production, enough to power 1.4 million homes. After imports are included, that amounts to about 2% of total UK demand.\nThe gas will be pumped to the existing Shearwater platform for processing – known as a tie-back in industry terms – before being piped to the St Fergus gas terminal in Aberdeenshire.\nThe UK government said that over its expected 11-year lifespan, Jackdaw would support the UK's gas supply, protect hundreds of jobs and add £2.9bn to the economy.\nThe timeline of Jackdaw and Rosebank\nThe decision to green-light Jackdaw drew criticism from some Labour backbenchers and environmentalists, while Conservatives called on the government to also approve the Rosebank oil field.\nBoth projects were approved for development by the previous Tory government in 2022 and 2023 respectively but these decisions were struck down by the Scottish courts after a challenge from environmental campaigners.\nThis followed a Supreme Court ruling that developers had to account for the climate impact caused by burning fossil fuels in their planning applications.\nPrime Minister Andy Burnham has pledged to stick to the UK's net zero target despite giving the green light to Jackdaw.\nHe previously said the decision would \"significantly strengthen our energy security by increasing domestic gas production by about 6% and support the UK's energy supply for more than a decade\".\nA decision on the larger Rosebank oil project is yet to be made.\nThe co-leader of the Scottish Greens, Ross Greer, described the Jackdaw approval as \"climate vandalism\".\nHe said: \"It is a devastating betrayal of our children's future and it won't even lower energy bills in the here and now.\"\nEnvironmental campaigners argue that this summer's heatwaves demonstrate the need to tackle climate change by rejecting both Jackdaw and Rosebank.\nAreeba Hamid, the co-executive director of Greenpeace, said approving Jackdaw was \"the wrong decision\" in terms of lowering energy bills, providing energy security, and addressing climate change.\nOxfam said the government had \"drilled straight through the UK's climate commitments\" and accused the prime minister of sending \"the wrong signal as the impacts of climate change intensify\".\nThe charity says the government must commit to not approving any new oil and gas licences, including the proposals for Rosebank.\nJackdaw sits close to the boundary between the British and Norwegian sectors of the North Sea, in an area where Westminster originally granted licences to explore for oil and gas in 1970 and 1989.\nThe field was discovered in 2005 but it was expensive and technically difficult to exploit.\nShell did not commit to its development until 2022, shortly after the Conservative government had granted consent for production.\nBut in January 2025, after a challenge by environmentalists, the Court of Session in Edinburgh ruled that consent for Jackdaw and Rosebank had been granted unlawfully.\nThe judge, Lord Ericht, said the developers should have provided a more detailed account of the fields' impact on climate change as part of the permitting process.\nThe judge allowed the companies to continue with preparatory work short of producing oil and gas while they crafted new environmental impact assessments taking into account the eventual effect of actually burning the fossil fuels, not just the emissions which would be created in extracting them.\nOn the Front Line: Inside the Platform\nAn inside look at Jackdaw, the UK’s newest and most contested gas platform.\nWhen BBC News visited the platform this summer, Adura CEO Neil McCulloch said its approval was vital to avoid domestic supply shortages this winter.\nHowever, the UK government has previously suggested that Jackdaw will have little impact on energy security and none on reducing domestic gas and electricity bills.\nIn August, in an interim response to a consultation on the future of the country's gas supplies, Energy Minister Michael Shanks said the UK would inevitably become more reliant on imports as domestic production declined, external.\n\"With diminishing output from the North Sea over the past decades, any gas produced from the UK Continental Shelf represents a tiny fraction of global demand and so will not lower prices nor materially boost supply,\" wrote Shanks.\nLabour has previously said it is opposed to the issuing of new exploration licences but it will consider new production projects if they are tied back to existing facilities.\nMcCulloch described the Jackdaw decision as \"an important and positive step forward\" - but said attention now turned to Rosebank.\nHe has urged the UK government to approve production from the field, in which Adura owns an 80% stake. The other 20% is held by London-based Ithaca Energy.\nRosebank contains an estimated 300 million to 500 million barrels of oil.\nBut while most of Jackdaw's gas is likely to be consumed in the UK, Rosebank's oil will be taken off by tanker and sold on international markets.\nRelated topics\n- Published21 October\n- Published21 October",
    "bodyJa": "Gas starts flowing from Jackdaw after government green light\n- Published\nGas has begun flowing from the Jackdaw gas field, with the UK energy secretary saying it will help to heat millions of homes and businesses this winter.\nMinisters last month announced the Jackdaw field, which lies 150 miles east of Aberdeen, had been approved after years of uncertainty and a court case.\nIt has now been announced that it has begun producing gas which will start flowing into Britain, according to its operator Adura.\nThe UK government approved production from the gas field in the North Sea last month, amid intense debate about the project's environmental and economic impact.\nJackdaw is operated by Adura under a joint venture between Shell and Norwegian state energy firm Equinor.\nA decision is yet to be taken on whether production can begin at Rosebank, the UK's largest known untapped oil field, which is located off the coast of Shetland in the North Atlantic.\nEnergy Secretary Miatta Fahnbulleh said: \"Last month, I gave Jackdaw the green light and today its gas will start flowing into Britain, thanks to the hard work of the skilled North Sea workers.\n\"It means homegrown gas from this project will help to heat millions of British homes and businesses this winter and beyond, in a boost for our energy security.\n\"It also will help minimise the UK's use of imported higher emission gas as we continue our transition to renewables and nuclear.\"\nClaire Mueller, Jackdaw project director at Adura, said the gas field was \"now helping to power Britain\".\nShe added: \"At a time of considerable uncertainty around the world, Jackdaw will provide secure energy from our own waters to heat British homes and power our economy, while reducing our reliance on imports with higher emissions.\n\"Jackdaw also demonstrates what can be achieved when Britain makes pragmatic, evidence-led decisions about the energy it needs, while properly accounting for our climate responsibilities.\"\nMueller said the decision was a \"positive step towards restoring confidence in the North Sea\".\nShe added that Adura was \"proud to be producing the oil and gas our country will continue to need for decades\".\nAdura has said Jackdaw will provide about 6% of UK gas production, enough to power 1.4 million homes. After imports are included, that amounts to about 2% of total UK demand.\nThe gas will be pumped to the existing Shearwater platform for processing – known as a tie-back in industry terms – before being piped to the St Fergus gas terminal in Aberdeenshire.\nThe UK government said that over its expected 11-year lifespan, Jackdaw would support the UK's gas supply, protect hundreds of jobs and add £2.9bn to the economy.\nThe timeline of Jackdaw and Rosebank\nThe decision to green-light Jackdaw drew criticism from some Labour backbenchers and environmentalists, while Conservatives called on the government to also approve the Rosebank oil field.\nBoth projects were approved for development by the previous Tory government in 2022 and 2023 respectively but these decisions were struck down by the Scottish courts after a challenge from environmental campaigners.\nThis followed a Supreme Court ruling that developers had to account for the climate impact caused by burning fossil fuels in their planning applications.\nPrime Minister Andy Burnham has pledged to stick to the UK's net zero target despite giving the green light to Jackdaw.\nHe previously said the decision would \"significantly strengthen our energy security by increasing domestic gas production by about 6% and support the UK's energy supply for more than a decade\".\nA decision on the larger Rosebank oil project is yet to be made.\nThe co-leader of the Scottish Greens, Ross Greer, described the Jackdaw approval as \"climate vandalism\".\nHe said: \"It is a devastating betrayal of our children's future and it won't even lower energy bills in the here and now.\"\nEnvironmental campaigners argue that this summer's heatwaves demonstrate the need to tackle climate change by rejecting both Jackdaw and Rosebank.\nAreeba Hamid, the co-executive director of Greenpeace, said approving Jackdaw was \"the wrong decision\" in terms of lowering energy bills, providing energy security, and addressing climate change.\nOxfam said the government had \"drilled straight through the UK's climate commitments\" and accused the prime minister of sending \"the wrong signal as the impacts of climate change intensify\".\nThe charity says the government must commit to not approving any new oil and gas licences, including the proposals for Rosebank.\nJackdaw sits close to the boundary between the British and Norwegian sectors of the North Sea, in an area where Westminster originally granted licences to explore for oil and gas in 1970 and 1989.\nThe field was discovered in 2005 but it was expensive and technically difficult to exploit.\nShell did not commit to its development until 2022, shortly after the Conservative government had granted consent for production.\nBut in January 2025, after a challenge by environmentalists, the Court of Session in Edinburgh ruled that consent for Jackdaw and Rosebank had been granted unlawfully.\nThe judge, Lord Ericht, said the developers should have provided a more detailed account of the fields' impact on climate change as part of the permitting process.\nThe judge allowed the companies to continue with preparatory work short of producing oil and gas while they crafted new environmental impact assessments taking into account the eventual effect of actually burning the fossil fuels, not just the emissions which would be created in extracting them.\nOn the Front Line: Inside the Platform\nAn inside look at Jackdaw, the UK’s newest and most contested gas platform.\nWhen BBC News visited the platform this summer, Adura CEO Neil McCulloch said its approval was vital to avoid domestic supply shortages this winter.\nHowever, the UK government has previously suggested that Jackdaw will have little impact on energy security and none on reducing domestic gas and electricity bills.\nIn August, in an interim response to a consultation on the future of the country's gas supplies, Energy Minister Michael Shanks said the UK would inevitably become more reliant on imports as domestic production declined, external.\n\"With diminishing output from the North Sea over the past decades, any gas produced from the UK Continental Shelf represents a tiny fraction of global demand and so will not lower prices nor materially boost supply,\" wrote Shanks.\nLabour has previously said it is opposed to the issuing of new exploration licences but it will consider new production projects if they are tied back to existing facilities.\nMcCulloch described the Jackdaw decision as \"an important and positive step forward\" - but said attention now turned to Rosebank.\nHe has urged the UK government to approve production from the field, in which Adura owns an 80% stake. The other 20% is held by London-based Ithaca Energy.\nRosebank contains an estimated 300 million to 500 million barrels of oil.\nBut while most of Jackdaw's gas is likely to be consumed in the UK, Rosebank's oil will be taken off by tanker and sold on international markets.\nRelated topics\n- Published21 October\n- Published21 October",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
