    "titleJa": "中国経済は7月にさらに減速、小売売上高はほとんど伸びず、投資不振が深刻化",
    "summaryJa": "7月の中国経済は、個人消費が失速し、失業率が上昇する一方で都市投資がより速いペースで縮小したため、全面的に勢いを失い、下半期に中国への支援強化を求める圧力が強まった。国家統計局が月曜日に発表した小売売上高は前年比0.6％増で、ロイター調査の予想1.5％増には及ばず、6月の1％から鈍化した。",
    "bodyOriginal": "China's economy lost momentum across the board in July, as consumer spending stalled and urban investment contracted at a faster pace while unemployment ticked higher, adding to pressure on Beijing to step up support in the second half.\nRetail sales eked out a 0.6% growth from a year earlier, according to the National Bureau of Statistics on Monday, missing the estimated 1.5% jump in a Reuters poll, and slowing from 1% in June.\nChina's urban fixed-asset investment, including real estate and infrastructure, contracted 6.7% this year as of end-July from a year earlier, worse than the estimated 6% decline in the poll. The decline also steepened from the 5.7% drop in the first half of this year.\nIndustrial output rose 4.5% in July, undershooting the estimated 4.8% growth and slowing from 5.3% rise in June.\nThe urban unemployment rate stood at 5.2% in July, ticking up from 5% in June.\nThe data, which was released at 3 p.m. instead of the usual 10 a.m., reinforced concerns about the health of the world's second-largest economy that has grappled with a deepening supply-demand imbalance.\nRobust industrial production and exports tied to the global AI investment boom have powered headline growth, even as consumption and private investment have weakened amid a prolonged property downturn and volatile energy prices.\nThe July figures came after the economy posted its slowest growth since late 2022 in the second quarter, expanding just 4.3% from a year earlier. China's 4.7% GDP growth in the first half year puts the economy on track to meeting Beijing's growth target range of 4.5%-5%.\nA broadening slowdown\nChina's retail sales growth has slowed sharply over the past year, with nominal growth easing to just 1.3% in the first half of this year from 5% in the same period last year, according to Goldman Sachs.\nThe bank attributed much of the slowdown to a government trade-in subsidy program that pulled purchases forward and has since become a drag. \"Real momentum was likely even weaker given higher CPI inflation,\" Goldman economists said in a note last Friday.\nSales growth will probably stay weak in the second half as fading support from the trade-in scheme continues to depress consumption, leaving full-year growth at about 1.5%, Goldman estimates.\nIn another sign of persistent weakness in spending, new bank loans issued in July — typically a slow month for lending — recorded their largest monthly decline on record, according to Barclays's calculations of the official data released last Friday by the People's Bank of China.\nHousehold loans, including mortgages, shrank in July after a brief recovery in June, according to CNBC's calculation of official figures, amid soft housing activity and a weak labor market.\nMortgage demand has weakened through the multi-year property downturn, while banks, wary of borrowers' repayment capacity, have grown more reluctant to lend.\nThe jobs picture may be worse than official figures suggest. A private survey conducted by the team of Li Daokui, a professor of economics at Tsinghua University, showed China's broad unemployment rate at 10.2% as of July, significantly higher than the official figures of around 5%.\nThe survey, counting in people who have been jobless for the past two years and are no longer covered in the official labor force survey, also showed that more than half of the roughly 24 million long-term unemployed are aged 16 to 24.\nBehind the weak hiring is a slump in investment. Urban investment declined for the first time in decades last year, falling 3.8% from a year earlier, and has deteriorated further this year, as the property downturn and tighter constraints on local governments' borrowing hampered one of China's traditional growth drivers.\nThe intensity of pullback in investment has been \"unprecedented,\" said Li, describing the contracting investment and high youth unemployment as the biggest obstacles to China meeting its growth targets. Li called for a substantial expansion in government borrowing to more than double this year's planned 12 trillion yuan ($1.7 trillion) in new debt issuance.\nFactory and construction activity also lost momentum in July, with the official manufacturing purchasing managers' index (PMI) unexpectedly contracting for the first time since February, as domestic orders slumped and extreme weathers, like typhoon and heavy rainfalls, disrupted port activity and business operation last month.\nExports remain a rare bright spot in a cooling economy, with the global AI buildout helping offset headwinds from the Middle East conflict. Exports rose 23.9% in July from a year earlier, beating estimates, after a 27% surge the previous month that was the fastest since 2021. Imports climbed 27.5%, short of forecasts.\nBeijing's massive trade surplus has become a standing grievance for its trading partners, raising the risk of fresh trade restrictions aimed at forcing a trade rebalancing from Beijing, analysts say. China's trade surplus reached $687.4 billion in the January-to-July period, putting it on track for another trillion-dollar-plus surplus in 2026.",
    "bodyJa": "7月の中国経済は、個人消費が失速し、失業率が上昇する一方で都市投資がより速いペースで縮小したため、全面的に勢いを失い、下半期に中国への支援強化を求める圧力が強まった。\n国家統計局が月曜日に発表した小売売上高は前年比0.6％増で、ロイター調査の予想1.5％増には及ばず、6月の1％から鈍化した。\n不動産やインフラを含む中国の都市固定資産投資は今年、7月末時点で前年比6.7％減少し、調査結果の推定6％減よりも悪化した。落ち込みも今年上半期の５．７％減からさらに加速した。\n７月の鉱工業生産は４．５％増加し、予想の４．８％増加を下回り、６月の５．３％増加から鈍化した。\n7月の都市部失業率は5.2％となり、6月の5％から上昇した。\nデータは午後3時に発表された。通常の午前10時ではなく、午前10時に開始されたことで、深刻化する需給不均衡に直面している世界第2位の経済の健全性に対する懸念が強まった。\n長引く不動産不況と不安定なエネルギー価格の中で消費と民間投資が低迷する中でも、世界的なAI投資ブームに関連した堅調な鉱工業生産と輸出が総合成長を牽引した。\n７月の統計は、経済が第２・四半期に２０２２年後半以来の低い成長率を記録し、前年比でわずか４．３％の伸びとなった後に発表された。中国の上半期のＧＤＰ成長率は４．７％で、同経済は中国政府の成長目標範囲である４．５─５％の達成に向けた軌道に乗っている。\n減速の拡大\nゴールドマン・サックスによると、中国の小売売上高の伸びは過去1年間で急激に鈍化し、今年上半期の名目成長率は前年同期の5％からわずか1.3％に鈍化した。\n同銀行は、景気減速の主な原因は、購入を前倒しする政府の下取り補助制度によるものであり、その後足かせとなっているとしている。ゴールドマンのエコノミストらは先週金曜日のノートで、「ＣＰＩインフレ率の上昇を考慮すると、実際の勢いはさらに弱かった可能性が高い」と述べた。\n下取り制度による支援の薄れが引き続き消費を低迷させているため、売上高の伸びはおそらく下半期も弱いままで、通年の成長率は約1.5％にとどまるとゴールドマンは予想している。\n中国人民銀行が先週金曜日に発表した公式データに基づいたバークレイズの計算によると、支出の持続的な弱さを示すもう一つの兆候として、通常は融資が低迷する月である7月の新規銀行融資が月間で過去最大の減少を記録したという。\nCNBCの公式統計によると、住宅ローンを含む家計融資は、住宅活動の低迷と労働市場の低迷を背景に、6月に一時回復した後、7月には縮小した。\n数年にわたる不動産不況で住宅ローン需要が弱まる一方、借り手の返済能力に警戒する銀行は融資に消極的となっている。\n雇用情勢は公式統計が示唆するよりも悪いかもしれない。清華大学の経済学教授、李道偉氏のチームが実施した民間調査によると、7月時点で中国の広範な失業率は10.2％で、約5％という公式数値を大幅に上回っている。\nこの調査では、過去2年間失業中で公式の労働力調査の対象から外れた人もカウントされており、約2,400万人の長期失業者の半数以上が16歳から24歳であることも明らかになった。\n雇用低迷の背景には投資の低迷がある。都市投資は昨年、数十年ぶりに前年比3.8％減と減少したが、不動産の低迷と地方政府の借り入れ制限強化が中国の伝統的な成長原動力の一つを妨げたため、今年はさらに悪化した。\n投資の落ち込みの激しさは「前例がない」とリー氏は述べ、投資の縮小と若者の高い失業率が中国の成長目標達成への最大の障害であると述べた。李首相は、政府借入を大幅に拡大し、今年の新規国債発行予定額の2倍以上となる12兆元（1兆7000億ドル）を超えるよう求めた。\n工場や建設活動も7月には勢いを失い、国内受注が低迷し、先月は台風や豪雨などの異常気象により港湾活動や事業運営が混乱したため、公式の製造業購買担当者景気指数（PMI）は2月以来初めて予想外に低下した。\n世界的なAIの増強が中東紛争による逆風を相殺するのに役立っており、輸出は依然として冷え込む経済においてまれな明るい材料である。 7月の輸出は前年同月比23.9％増と予想を上回った。前月は27％増と2021年以来の大幅な伸びとなった。輸入は27.5％増で予想を下回った。\nアナリストらによると、中国政府の巨額の貿易黒字は貿易相手国にとって永続的な不満となっており、中国政府に貿易バランスの調整を強制することを目的とした新たな貿易制限のリスクが高まっているという。中国の貿易黒字は１─７月に６８７４億ドルに達し、２０２６年にはさらに１兆ドル以上の黒字となる軌道に乗っている。",

    "bodyOriginal": "Ukrainian strikes kill six in Russia, acting governor says\n- Published\nSix people have been killed and four injured in Ukrainian missile strikes on Russia's Belgorod region overnight, its acting governor has said.\nA 14-year-old child was among those injured, Alexander Shuvaev wrote on Telegram on Monday.\nThe strikes come a night after what Russian officials called the \"largest-scale\" attack launched by Ukraine this year, in which at least seven people were killed.\nRussian attacks on Ukraine also killed at least seven people and injured more than 39 on Saturday night.\nRussia launched its full-scale invasion of Ukraine in February 2022, and currently controls approximately a fifth of Ukrainian territory.\nThe latest Ukrainian strikes burned a building and damaged a car in the village of Koloskovo in the Valuysky district, which is close to Russia's border with Ukraine, Shuvaev said.\nThe injured child was sent to hospital while two others received medical assistance, he added.\nKyiv has stepped up drone strikes deep inside Russia during the past few weeks.\nOn Saturday night, Ukraine fired some 822 drones towards Russia, with 600 aiming for Moscow, according to its regional governor, who said the Russian capital suffered \"one of the most massive drone attacks in recent memory\".\nDuring the strikes on Saturday night, five people died in Russia's south-western region of Rostov, its governor said. A woman was killed in an attack on a civilian bus in Belgorod, officials said, while an 83-year-old man died in a drone attack in the Moscow region.\nA warehouse belonging to Russian online retailer Wildberries was also hit.\nSince July, Ukraine has repeatedly targeted the company, known as Russia's version of Amazon. Ukraine's defence ministry said the latest attack meant that seven out of 10 of the largest Wildberries logistics centres had been \"disabled\".\nRussia has intensified missile attacks across Ukraine in recent weeks.\nThe Ukrainian energy company Naftogaz said on Monday that Russia had attacked its facilities 13 times during the past week.\nIn Russian attacks on Ukraine on Saturday night, a man and woman died after a private house was hit by a guided aerial bomb in the Zaporizhzhia region, officials said. Five others were killed in attacks across the country.\nRussia said its attacks on Kyiv on Saturday night targeted a FirePoint facility producing parts for Ukrainian Flamingo missiles and a factory making components for drones.\nThe Russian attacks also hit a book market in the city's Pochayna district. Burnt books could be seen on the ground.\nUkrainian President Volodymyr Zelensky said 13 regions had come under attack this week, with Russia launching more than 1,550 attack drones, nearly 1,560 guided aerial bombs and 62 missiles.\nBoth sides accuse each other of targeting civilians.\nRelated topics\n- Published4 days ago",
    "bodyJa": "ウクライナ空爆でロシア6人死亡、知事代理が発言\n- 公開されました\nウクライナがロシアのベルゴロド地域を一晩中ミサイル攻撃し、6人が死亡、4人が負傷したと同州知事代理が発表した。\n負傷者の中には14歳の子供も含まれていたとアレクサンダー・シュバエフ氏は月曜テレグラムに書いた。\nこの空爆は、ロシア当局が今年ウクライナによって少なくとも7人が死亡した「最大規模」と呼ぶ攻撃の翌日の夜に行われた。\n土曜夜にもロシアによるウクライナ攻撃で少なくとも７人が死亡、３９人以上が負傷した。\nロシアは２０２２年２月にウクライナへの本格侵攻を開始し、現在はウクライナ領土の約５分の１を支配している。\nシュバエフ氏によると、最近のウクライナの攻撃により、ロシアとウクライナの国境に近いヴァルイスキー地区のコロスコヴォ村で建物が焼かれ、車が損傷した。\n負傷した子供は病院に送られ、他の2人は医療援助を受けたと付け加えた。\nキエフはここ数週間、ロシア奥深くへの無人機攻撃を強化している。\n同地方知事によると、ウクライナは土曜夜、約822機の無人機をロシアに向けて発射し、うち600機がモスクワを目指したと発表し、ロシアの首都は「最近の記憶の中で最も大規模な無人機攻撃の一つ」を受けたと述べた。\n土曜夜のストライキで、ロシア南西部ロストフ州で５人が死亡したと知事が発表した。当局者らによると、ベルゴロド市では民間バスへの攻撃で女性が死亡し、モスクワ地方では無人機攻撃で83歳の男性が死亡した。\nロシアのオンライン小売業者ワイルドベリーズの倉庫も被害を受けた。\nウクライナは7月以降、ロシア版アマゾンとして知られる同社を繰り返し標的にしている。ウクライナ国防省は、今回の攻撃により、ワイルドベリーの最大規模物流センター10施設のうち7施設が「機能停止」になったと発表した。\nロシアはここ数週間、ウクライナ全土でミサイル攻撃を強化している。\nウクライナのエネルギー会社ナフトガスは月曜日、ロシアが過去1週間に自社施設を13回攻撃したと発表した。\n土曜夜にロシアがウクライナを攻撃した際、ザポリージャ地方で民家が誘導空爆を受け、男女が死亡したと当局者が発表した。全国各地での攻撃で他に5人が死亡した。\nロシアは、土曜日の夜のキエフへの攻撃は、ウクライナのフラミンゴミサイルの部品を製造するファイアポイント施設と無人機の部品を製造する工場を標的にしたと発表した。\nロシアによる攻撃は、同市ポチャイナ地区の書籍市場も襲った。地面には焼けた本が落ちていた。\nウクライナのウォロディミル・ゼレンスキー大統領は、今週13の地域が攻撃を受けており、ロシアは1,550機以上の攻撃用無人機、1,560発近くの誘導航空爆弾、62発のミサイルを発射したと述べた。\n双方は民間人を標的にしたとして互いを非難している。\n関連トピック\n- 4 日前に公開",

    "id": "ferrari-luce-polarizing-ev-becomes-a-40-faf4601d",
    "title": "Ferrari Luce: Polarizing EV becomes a $40 million collector’s item",
    "titleJa": "フェラーリ・ルーチェ：偏光EVが4,000万ドルのコレクターズアイテムに",
    "summaryJa": "フェラーリ初の完全電気自動車のパーソナライズされたモデルがチャリティーセールで4,000万ドルで落札され、市場の懐疑を無視してオークションで落札された新車の記録を樹立した。カリフォルニアのモントレー・カー・ウィークで行われたサザビーズの「テーラーメイド」ルーチェのオークションは、このロットが、ユニークな半光沢仕上げやその他の特注パーツを特徴とするルーチェ・プログラムの最初の量産シャシーを獲得する「またとない機会」となったと述べた。",
    "bodyOriginal": "A personalized model of Ferrari's first fully electric vehicle has sold for $40 million in a charity sale, defying market skepticism and setting a record for a new car sold at auction.\nThe Sotheby's auction of the Luce \"tailor made\" at Monterey Car Week in California said the lot marked an \"unrepeatable opportunity\" to acquire the first production chassis of the Luce program, which featured a unique semi-gloss finish and other bespoke parts.\nThe auction house did not name the winning buyer of the luxury car and said the proceeds would be donated to Ferrari's foundation of educational programs. Ferrari's \"tailor made\" program is an exclusive initiative for cars customized to a buyer's precise specifications.\nThe blockbuster auction comes nearly three months after Ferrari unveiled its first fully electric car, which was priced at 550,000 euros (roughly $640,000). The move marked a departure from the aesthetic of typical Ferraris and came despite other sports car manufacturers, notably Porsche and Lamborghini, scaling back on plans to launch their own EVs due to weak demand.\nThe unveiling of the Luce sparked a negative market reaction, with analysts citing a mix of \"design hate\" and the classic market adage of \"travel and arrive,\" noting that Ferrari's stock price had risen significantly ahead of launch.\nRead more\nFerrari CEO Benedetto Vigna said at the time that the Maranello, Italy-based company respected the different needs and wishes of its customers, adding that existing clientele would be interested in the Luce and the carmaker would welcome new buyers thanks to the fully electric model.\nFerrari raised its full-year guidance last month, citing stronger personalization demand than initially expected, as it beat Wall Street's second-quarter expectations. Milan-listed shares of Ferrari are up nearly 12% so far this year.",
    "bodyJa": "フェラーリ初の完全電気自動車のパーソナライズされたモデルがチャリティーセールで4,000万ドルで落札され、市場の懐疑を無視してオークションで落札された新車の記録を樹立した。\nカリフォルニアのモントレー・カー・ウィークで行われたサザビーズの「テーラーメイド」ルーチェのオークションは、このロットが、ユニークな半光沢仕上げやその他の特注パーツを特徴とするルーチェ・プログラムの最初の量産シャシーを獲得する「またとない機会」となったと述べた。\nオークションハウスは高級車の落札者の名前は明らかにせず、収益はフェラーリの教育プログラム財団に寄付されると述べた。フェラーリの「オーダーメイド」プログラムは、購入者の正確な仕様に合わせてカスタマイズされた車のための独占的な取り組みです。\nこの大ヒットオークションは、フェラーリが55万ユーロ（約64万ドル）で落札された初の完全電気自動車を発表してからほぼ3カ月後に行われた。この動きは典型的なフェラーリの美学からの逸脱を示すもので、他のスポーツカーメーカー、特にポルシェやランボルギーニが需要の低迷を理由に自社EVの発売計画を縮小しているにもかかわらず行われた。\nルーチェの発表は市場の否定的な反応を引き起こし、アナリストらは「デザイン嫌い」と古典的な市場の格言「旅行して到着」の組み合わせを挙げ、フェラーリの株価が発売前に大幅に上昇したことを指摘した。\n続きを読む\nフェラーリのベネデット・ヴィーニャ最高経営責任者（CEO）は当時、イタリアのマラネッロに本拠を置くフェラーリは顧客のさまざまなニーズや希望を尊重していると述べ、既存の顧客はルーチェに興味を持ち、自動車メーカーは完全電気モデルのおかげで新規購入者を歓迎すると付け加えた。\nフェラーリは先月、ウォール街の第2四半期予想を上回ったため、パーソナライゼーション需要が当初予想よりも強かったとして、通期業績見通しを引き上げた。ミラノ上場フェラーリ株は年初から12％近く上昇している。",

    "titleJa": "もしメタがこの裁判に負ければ、インスタグラムとフェイスブックは永久に変わってしまうかもしれない",
    "summaryJa": "もしメタがこの裁判に負ければ、インスタグラムとフェイスブックは永久に変わってしまうかもしれない- 公開されました",
    "bodyOriginal": "If Meta loses this trial, Instagram and Facebook could change forever\n- Published\nMeta has been hit with successive losses in court over how its platforms have targeted and harmed young users, but a jury trial set to begin on Tuesday may pose the biggest threat yet to its operations.\nThe trial stems from a lawsuit filed in 2023 by 30 US states, including California and New York, in which they claim numerous violations of federal and state privacy laws for children.\nNot only are the states seeking upwards of $1 trillion, external from Meta, they are demanding it make changes to Instagram and Facebook, including ending \"like\" counts and infinite scroll.\nShould Meta ultimately lose a case of this scale, it could force fundamental changes to the way young people experience social media.\nThe states suing Meta are asking for many more changes to the way Instagram and Facebook operate for young people, too.\nThey want Meta to:\nimplement a process of parental verification for teenage users\nchange its \"dopamine-manipulating recommendation algorithms\"\nremove many image filters that change one's appearance in photos\nend autoplay of video content\nprohibit the creation of multiple accounts\nend disappearing or \"ephemeral\" posts, such as Instagram Stories\nAll of these features are central to the current user experience on Meta's platforms.\nThese features are also designed to keep users, including teenagers and children, on the platforms as often and for as long as possible, the states contend. They claim Meta even makes it difficult for young people to use the platform less, through things like frequent notifications designed to get young people back on the apps.\nBy allegedly targeting child users, Meta \"chose to exploit\" young people in order to hook them on its platforms, so it could grow its user base and expand its business. Today, Meta's value on the stock market is about $1.5tn.\nMeta has consistently denied such claims.\n\"We strongly disagree with these allegations and are confident the evidence will show our longstanding commitment to supporting young people,\" a company spokeswoman said in a statement.\nThe states are putting their claims to Judge Yvonne Gonzalez Rogers, a chief federal judge in California. She was the judge in the high-profile Elon Musk v Sam Altman trial and has built a reputation from the bench over the course of nearly 20 years for being incisive and direct.\nSocial media turned 'public nuisance'\nIn a recent ruling against Meta, a judge in New Mexico fined the company a collective $942m and ordered it to make changes similar to those that the additional states are now demanding.\nJudge Bryan Biedscheid's ordered changes include the elimination on Instagram and Facebook of like counts for users younger than 18, a ban on teenagers sending or receiving nudity through the platforms, and limiting push notifications from the apps to certain hours of the day.\nThe judge also declared Meta a \"public nuisance\" akin to a factory that was polluting the air people breathe, causing \"harmful effects\" that impacted an entire population. Meta said it would appeal against the ruling.\nWhile Judge Biedscheid's order only demands Meta make changes in New Mexico, should the 30 states prevail in their separate lawsuit against Meta, it would almost certainly need to enact platform changes across the US.\nThe states involved in the lawsuit represent nearly two-thirds of the country's population.\nIf Meta did enact such changes, it would mark a significant alteration to the experience of its platforms.\n\"Like\" counts, for instance, have been part of Meta since its early years, when it was still called Facebook and that was its only platform.\nToday, likes are omnipresent on social media platforms. It is the main way in which people engage with text, photos and videos they see online.\nYet, likes are increasingly viewed as a way to foster negative feelings, particularly among young people.\nKaley, a young woman who prevailed in her lawsuit against Meta earlier this year, described during court testimony how she created dozens of accounts on YouTube and Instagram.\nShe would use the system of accounts to create likes on her own posts, hoping to drive engagement with other users and her own feelings of validation and self-worth. Kaley was only nine years old at the time. She said she remembered feeling depressed, something she was later diagnosed with, aged 10.\nResearch over the last several years has shown that engagement metrics such as like counts can drive feelings of rejection and depression, external in teenagers.\nIn the states' lawsuit against Meta, in which the company said it has handed over more than 2 million documents, lawyers pointed to Meta's own research that showed like counts drove \"social comparison\", or the mental act of marking one's self worth against images of someone else.\nThat social comparison driven by Instagram was linked to \"increased loneliness, worse body image, and negative mood or affect\", according to Meta's internal research.\nAs Judge Biedscheid put it in his order, external, which was the first time a social media company has been deemed a \"public nuisance\", the way Meta's platforms have operated for over a decade has been part of a growing \"youth mental health crisis\" in New Mexico and elsewhere.\nNow, attorneys from 30 more states will be pushing Judge Gonzalez Rogers to reach the same conclusion.\n- Published11 June",
    "bodyJa": "もしメタがこの裁判に負ければ、インスタグラムとフェイスブックは永久に変わってしまうかもしれない\n- 公開されました\nメタ社は、自社のプラットフォームが若いユーザーをターゲットにし、危害を加えてきたことを巡り、法廷で連続敗訴しているが、火曜日に始まる予定の陪審裁判は、同社の事業にとってこれまでで最大の脅威となる可能性がある。\nこの裁判は、カリフォルニア州やニューヨーク州を含む米国の30の州が2023年に起こした訴訟に端を発しており、この訴訟では連邦および州の児童プライバシー法に多数の違反があったとして訴えられている。\n各州はメタ社外に1兆ドル以上を求めているだけでなく、インスタグラムやフェイスブックに「いいね」数や無限スクロールの廃止などの変更をメタ社に要求している。\nこの規模の訴訟でメタ社が最終的に敗訴した場合、若者のソーシャルメディア体験方法に根本的な変化を強いられる可能性がある。\nメタ社を訴えている州は、若者向けのインスタグラムとフェイスブックの運営方法にもさらに多くの変更を求めている。\n彼らはメタに次のことを望んでいます。\n10代のユーザーに対して保護者認証のプロセスを実装する\n「ドーパミンを操作する推奨アルゴリズム」を変更する\n写真の見た目を変える多くの画像フィルターを削除する\nビデオコンテンツの自動再生を終了する\n複数のアカウントの作成を禁止する\nInstagram ストーリーなど、消える投稿や「一時的な」投稿を終わらせる\nこれらの機能はすべて、Meta のプラットフォームにおける現在のユーザー エクスペリエンスの中心となっています。\nこれらの機能は、ティーンエイジャーや子供を含むユーザーをできるだけ頻繁に、そしてできるだけ長くプラットフォームに留まらせるように設計されているとも各州は主張している。彼らは、メタは、若者をアプリに戻すために設計された頻繁な通知などを通じて、若者がプラットフォームを利用することを困難にさえしていると主張している。\n伝えられるところによると、メタは児童ユーザーをターゲットにすることで、若者を自社のプラットフォームに引き付けるために「搾取することを選択」し、ユーザーベースを拡大し、事業を拡大できるようにした。現在、株式市場におけるメタの価値は約1.5兆ドルです。\nメタはそのような主張を一貫して否定している。\n同社の広報担当者は声明で「われわれはこうした主張に強く反対しており、若者支援に対する当社の長年にわたる取り組みが証拠によって示されると確信している」と述べた。\n各州はカリフォルニア州の首席連邦判事イボンヌ・ゴンザレス・ロジャーズ判事に請求を提出している。彼女は注目を集めたイーロン・マスク対サム・アルトマン裁判の裁判官を務め、20年近くにわたり裁判官から鋭く率直な裁判官としての評判を築いてきた。\nソーシャルメディアは「公共迷惑」になった\n最近のメタに対する判決で、ニューメキシコ州の判事は同社に総額9億4,200万ドルの罰金を科し、現在追加の州が要求しているのと同様の変更を行うよう命じた。\nブライアン・ビエドシャイト判事が命じた変更には、インスタグラムとフェイスブックにおける18歳未満のユーザーの「いいね！」数の廃止、ティーンエイジャーによるプラットフォームを通じたヌードの送受信の禁止、アプリからのプッシュ通知を1日の特定の時間帯に制限するなどが含まれる。\n判事はまた、メタは人々が呼吸する空気を汚染し、全人口に影響を与える「有害な影響」を引き起こしている工場と同様の「公共迷惑行為」であると宣言した。メタ社は判決に対して控訴すると述べた。\nビエドシャイト判事の命令はメタに対しニューメキシコ州での変更のみを要求しているが、30州がメタに対する個別の訴訟で勝訴すれば、ほぼ確実に全米でプラットフォームの変更を制定する必要があるだろう。\n訴訟に関与している州は、国の人口のほぼ3分の2を代表している。\nもしメタがそのような変更を実施した場合、それはプラットフォームのエクスペリエンスに重大な変化をもたらすことになるでしょう。\nたとえば、「いいね！」の数は、Meta がまだ Facebook と呼ばれ、それが唯一のプラットフォームだった初期の頃から、Meta の一部でした。\n今日、「いいね！」はソーシャル メディア プラットフォーム上に遍在しています。これは、人々がオンラインで見るテキスト、写真、ビデオと関わる主な方法です。\nしかし、「いいね！」は、特に若者の間で、否定的な感情を助長する方法であると見なされることが増えています。\n今年初めにメタに対する訴訟で勝訴した若い女性、ケイリーさんは法廷証言で、どのようにしてユーチューブやインスタグラムに数十のアカウントを作成したかを語った。\n彼女はアカウント システムを使用して自分の投稿に「いいね！」を作成し、他のユーザーとの関わりや、自分の正当性や自尊心の感情を促進することを望んでいた。ケイリーは当時わずか9歳でした。彼女は、後に10歳のときにうつ病と診断されたことを覚えていると語った。\n過去数年間の研究では、「いいね！」の数などのエンゲージメント指標が、十代の若者たちの外部にある拒絶感や憂鬱感を引き起こす可能性があることが示されています。\nメタ社が200万件以上の文書を提出したと発表したメタ社に対する州の訴訟で、弁護士らは、同様のカウントが「社会的比較」、つまり他人の画像に対して自分の価値をマークするという精神的行為を引き起こすことを示したメタ社自身の研究を指摘した。\nメタ社の内部調査によると、インスタグラムによって引き起こされた社会的比較は、「孤独感の増加、身体イメージの悪化、否定的な気分や感情」に関連していたという。\nビエドシャイト判事が命令文で述べたように、ソーシャルメディア企業が「公共迷惑行為」とみなされたのは初めてのことであり、メタ社のプラットフォームの10年以上にわたる運営方法は、ニューメキシコ州などで拡大する「若者のメンタルヘルス危機」の一部だった。\n現在、さらに30州の弁護士がゴンザレス・ロジャース判事に同じ結論に達するよう迫っている。\n- 6 月 11 日発行",

    "title": "Ebola outbreak in DR Congo becomes deadliest in its history",
    "titleJa": "コンゴ民主共和国でのエボラ出血熱流行、史上最悪の死者数に",
    "summaryJa": "コンゴ民主共和国でのエボラ出血熱流行、史上最悪の死者数に- 公開されました",
    "bodyOriginal": "Ebola outbreak in DR Congo becomes deadliest in its history\n- Published\nThe Ebola outbreak in the Democratic Republic of Congo is now the deadliest in its history, according to public health officials.\nA total of 2,325 people have been killed by the virus since it was declared on 15 May, surpassing the death toll of the country's 2018-2020 outbreak.\nThe outbreak was already the fastest growing on record, UN humanitarian chief Tom Fletcher said last week, warning that \"the epidemic is killing someone every 30 minutes\".\nThere is currently no approved vaccine available for the Bundibugyo species that has caused the current epidemic but several are in development, including one based on technology used to develop the AstraZeneca Covid-19 vaccine.\nDR Congo's Institute of Public Health on Sunday said it had recorded 4,945 confirmed cases, including 101 in the previous 24 hours.\nComparatively few cases have been identified outside the country: as of 12 August, 20 cases were confirmed in neighbouring Uganda, while two people were treated in Germany and one case was declared in France.\nHowever, the pace of the virus's transmission in Dr Congo, where it has spread to six of 26 provinces, has been described as \"exceptional\" by the World Health Organization.\nAccording to Reuters, it took close to five months for the world's deadliest outbreak of 2014-2016 in West Africa to reach 1,000 fatalities - the current outbreak reached 2,000 deaths in less than three months.\nThe outbreak is the 17th to have emerged in DR Congo since Ebola was discovered 50 years ago. Years of conflict and a highly mobile population have added to the country's challenges in controlling the spread of the disease.\nThe WHO has said it hopes to reverse the spread of the disease within three months but warned that this meant bringing transmission under control and not ending the outbreak entirely.\nEbola is a rare but deadly viral disease and the Bundibugyo species is even rarer, with only two known prior outbreaks.\nSymptoms of Ebola, which are similar to the flu or malaria, include fever, headache and tiredness, and can begin suddenly within two to 21 days of infection.\nAs the disease progresses, vomiting and diarrhoea can develop, leading to organ failure. Contact with infected bodily fluids such as blood or vomit causes the virus to spread.\nThe UK's medicines regulator, the MHRA, has given permission for the first human trials of a vaccine for Bundibugyo to go ahead.\nThe jab is being created by a team from the University of Oxford based on the same technology used in the Oxford-AstraZeneca Covid vaccine. Three other groups are also developing different vaccines for Bundibugyo.\nThe WHO is also sponsoring a separate clinical trial in DR Congo to see whether two existing antiviral therapies can improve survival rates.\nRelated topics\n- Published4 days ago\n- Published3 days ago\n- Published6 days ago",
    "bodyJa": "コンゴ民主共和国でのエボラ出血熱流行、史上最悪の死者数に\n- 公開されました\n公衆衛生当局によると、コンゴ民主共和国におけるエボラ出血熱の流行は現在、史上最悪の死者数となっている。\n5月15日にこのウイルスが宣言されて以来、このウイルスによる死者は計2,325人となり、2018年から2020年に国内で発生した感染症の死者数を上回った。\n国連の人道支援責任者トム・フレッチャー氏は先週、流行はすでに記録上最も急速に拡大していると述べ、「流行により30分ごとに誰かが亡くなっている」と警告した。\n現在の流行を引き起こしているブンディブギョ種に対して利用できる承認されたワクチンは現時点ではありませんが、アストラゼネカの新型コロナウイルス感染症ワクチンの開発に使用された技術に基づくものなど、いくつかのワクチンが開発中です。\nコンゴ民主共和国公衆衛生研究所は日曜日、過去24時間の101人を含む4,945人の確認症例を記録したと発表した。\n国外で確認された感染者は比較的少ない。8月12日現在、隣国ウガンダで20人の感染者が確認され、ドイツで2人が治療を受け、フランスで1人の感染者が申告された。\nしかし、コンゴ民主共和国でのウイルス感染のペースは26州のうち6州に広がっており、世界保健機関は「異例」と表現している。\nロイター通信によると、2014年から2016年に西アフリカで発生した世界最悪の流行では、死者数が1,000人に達するまでに5か月近くかかったが、今回の流行では3か月足らずで死者2,000人に達した。\n50年前にエボラ出血熱が発見されて以来、この流行はコンゴ民主共和国で発生した17回目となる。長年にわたる紛争と人口の流動性の高さにより、病気の蔓延を制御する上でこの国の課題はさらに増大しています。\nWHOは3カ月以内に感染拡大を逆転させたいと述べたが、これは感染を制御下に置くことを意味し、発生を完全に終わらせることではないと警告した。\nエボラ出血熱はまれではあるが致死性のウイルス性疾患であり、ブンディブギョ種はさらにまれで、これまでに発生したことが知られているのはわずか 2 件だけです。\nエボラ出血熱の症状はインフルエンザやマラリアに似ており、発熱、頭痛、倦怠感などがあり、感染後 2 ～ 21 日以内に突然始まることがあります。\n病気が進行すると、嘔吐や下痢が起こり、臓器不全に至ることがあります。血液や嘔吐物などの感染した体液と接触すると、ウイルスが広がります。\n英国の医薬品規制当局であるMHRAは、ブンディブギョに対するワクチンの初の人体臨床試験の実施を許可した。\nこのジャブは、オックスフォード・アストラゼネカの新型コロナウイルスワクチンで使用されているのと同じ技術に基づいて、オックスフォード大学のチームによって開発されている。他の3つのグループもブンディブギョ向けに異なるワクチンを開発している。\nWHOはまた、既存の2つの抗ウイルス療法が生存率を改善できるかどうかを確認するために、コンゴ民主共和国で別の臨床試験を後援している。\n関連トピック\n- 4 日前に公開\n- 3 日前に公開\n- 6 日前に公開",

    "title": "Ferrari's first ever electric car sold for record $40m",

    "bodyOriginal": "Ferrari's first ever electric car sold for record $40m\n- Published\nFerrari's first ever electric car has fetched $40m (£29.5m) in a charity sale, setting a record for a new vehicle sold at auction.\nThe sale of the Ferrari Luce - brainchild of the British iPhone designer Sir Jony Ive - raised more than 35 times the usual price of the car at the event at RM Sotheby's in California.\nThe Luce faced a backlash when it was launched in May. Some commentators said it strayed from the marque's traditional designs and lost part of the brand's identity by being battery-powered and having five seats.\nSotheby's said all proceeds of the sale will be donated to the Ferrari Foundation's educational programmes.\nSotheby's did not name the buyer of the custom Luce which features a unique finish and bespoke parts.\nThe BBC has contacted the auction house and Ferrari for comment.\nThe unveiling of the Luce was seen as one of the biggest launches of a new car in recent years.\nIt marked the prancing horse's first entry into the electric vehicle (EV) market - a sector dominated by Elon Musk's Tesla and China's carmakers.\nItalian President Sergio Mattarella and Pope Leo were invited to view the luxury brand's new vehicle.\nBut Ferrari's share price dropped the day after the Luce's launch, following backlash over the car.\nAmong those criticising the car were Italy's deputy prime minister Matteo Salvini and former Ferrari chairman Luca Cordero di Montezemolo, who said the car was \"risking the destruction of a legend\".\nFerrari's chief design officer Flavio Manzoni said in an interview in May that critics are part of the innovation process and that he believed people would come to appreciate the Luce.\nThe company has not disclosed its target for Luce sales but, according to a Financial Times report, it has hit this year's goal thanks to strong demand from China.\nSotheby's said in a statement, external that the auctioned vehicle marked an \"unbeatable opportunity\" to own the first production car of the Luce.\nThe car has special wheels, customised brakes and a white finish.\nThe charity sale marks a \"tangible expression of innovation, responsibility, and long-term vision for future generations,\" Sotheby's said.\nFerraris often attract some of the highest prices at car auctions.\nA bespoke Ferrari Daytona SP3 supercar raised $26m for the carmaker's education initiatives at an auction in 2025. At the time it set an auction record for the highest-price paid for a new car.\nThe current record for the highest price paid at auction was an ultra-rare 1955 Mercedes-Benz 300 SLR Uhlenhaut Coupé, which was sold for $142m in 2022.\nRelated topics\n- Published27 May",
    "bodyJa": "フェラーリ初の電気自動車、記録的な4,000万ドルで落札\n- 公開されました\nフェラーリ初の電気自動車がチャリティーセールで4000万ドル（2950万ポンド）で落札され、オークションで落札された新車の記録を樹立した。\nイギリスのiPhoneデザイナー、サー・ジョニー・アイブの発案であるフェラーリ・ルーチェの販売は、カリフォルニアのRMサザビーズでのイベントで通常の車の価格の35倍以上に跳ね上がった。\nルーチェは5月に発売された際に反発に直面した。一部の解説者は、バッテリー駆動で座席が5つあることでブランドの伝統的なデザインから逸脱し、ブランドのアイデンティティの一部を失ったと述べた。\nサザビーズによると、販売収益はすべてフェラーリ財団の教育プログラムに寄付されるという。\nサザビーズは、ユニークな仕上げと特注パーツを特徴とするカスタム・ルーチェの購入者の名前は明らかにしていない。\nBBCはオークションハウスとフェラーリにコメントを求めた。\nルーチェの発表は、近年の新車発表の中で最大規模の発表の一つとみられていた。\nこれは、イーロン・マスク氏率いるテスラと中国の自動車メーカーが独占する電気自動車（EV）市場への跳ね馬の初参入となった。\nイタリアのセルジオ・マッタレッラ大統領とローマ法王レオが高級ブランドの新車を視察するために招待された。\nしかし、ルーチェに対する反発を受けて、フェラーリの株価はルーチェ発売の翌日に下落した。\nこの車を批判した者の中には、イタリアのマッテオ・サルビーニ副首相やフェラーリの元会長ルカ・コルデロ・ディ・モンテゼモロも含まれており、この車は「伝説が破壊される危険がある」と述べた。\nフェラーリの最高デザイン責任者のフラヴィオ・マンゾーニ氏は5月のインタビューで、批評家もイノベーションのプロセスの一部であり、人々はルーチェを高く評価するようになるだろうと信じていると語った。\n同社はLuceの売上目標を明らかにしていないが、フィナンシャル・タイムズの報道によると、中国からの強い需要のおかげで今年の売上目標を達成したという。\nサザビーズは社外向けの声明で、このオークションに出品された車両は、ルーチェの最初の量産車を所有する「またとない機会」となったと述べた。\nこの車には特別なホイール、カスタマイズされたブレーキ、そして白い仕上げが施されています。\nサザビーズは、このチャリティーセールは「革新性、責任、将来世代への長期ビジョンの具体的な表現」であると述べた。\nフェラーリは自動車オークションで最高額で落札されることがよくあります。\n特注のフェラーリ デイトナ SP3 スーパーカーは、2025 年のオークションで自動車メーカーの教育活動のために 2,600 万ドルを集めました。当時、この車は新車に支払われた最高価格のオークション記録を樹立しました。\n現在のオークションでの最高価格記録は、超希少な1955年製メルセデス・ベンツ300 SLRウーレンハウト・クーペで、2022年に1億4,200万ドルで落札された。\n関連トピック\n- 5 月 27 日公開",

    "id": "japan-second-quarter-gdp-grows-1-1-on-an-737bcfed",
    "title": "Japan second-quarter GDP grows 1.1% on an annualized basis, missing expectations",
    "titleJa": "日本の第2四半期GDPは年率換算で1.1%成長、予想を下回る",
    "summaryJa": "第２・四半期の日本経済は年率換算で１．１％拡大し、内需の低迷が好調な輸出を相殺したため、期待の２％成長には届かなかった。この数字は前四半期の2.1%と比較された。",
    "bodyOriginal": "Japan's economy expanded 1.1% in the second quarter on an annualized basis, missing expectations for 2% growth as softer domestic demand offset strong exports.\nThe figure was compared to the 2.1% in the previous quarter.\nOn a year-on-year basis, the country's economy expanded 0.7%, up from 0.5% in the first quarter.\nThis is the first full quarter to include the impact of the Iran war, which has brought energy prices higher for business and households.\nFollowing the data release, the Nikkei 225 rose 0.43%, while the yield on the benchmark 10-year Japanese Government Bonds was at 2.88%. The yen strengthened slightly against the dollar, trading at 159.1.\nExports were the main driver of growth, with shipments from the country beating expectations for all three months of the quarter. However, this was helped by the weak yen as opposed to simply a higher volume of shipments.\nEarlier this month, the Bank of Japan released its economic activity outlook, and raised its GDP growth outlook marginally to 0.6% from 0.5% for its 2026 fiscal year ending March 2027.\n\"Japan's economy is expected to continue growing moderately, albeit at a decelerated rate,\" the central bank said, pointing at high crude oil prices from the conflict in the Middle East.\nHowever, this is likely to be partially offset by measures from the government to curb high oil prices for households, as well as an increase in global AI-related demand. Many Japanese companies are involved in the semiconductor supply chain.\n— This is breaking news, please check back for updates.",
    "bodyJa": "第２・四半期の日本経済は年率換算で１．１％拡大し、内需の低迷が好調な輸出を相殺したため、期待の２％成長には届かなかった。\nこの数字は前四半期の2.1%と比較された。\n前年同期比では、同国の経済成長率は第１四半期の０．５％から０．７％増加した。\nこれは、企業や家庭のエネルギー価格を上昇させたイラン戦争の影響を含む初めての四半期となる。\nデータ発表後、日経平均株価は0.43％上昇し、指標となる10年日本国債の利回りは2.88％となった。円は対ドルで若干上昇し、159.1円で取引された。\n輸出が成長の主な原動力であり、同国からの出荷額は同四半期の３カ月すべてで予想を上回った。ただし、これは単に出荷量が増加しただけではなく、円安によってもたらされました。\n今月初め、日本銀行は経済活動見通しを発表し、2026年度（2027年3月まで）のGDP成長率見通しを0.5％から0.6％に小幅引き上げた。\n中東紛争による原油価格の高騰を指摘し、中銀は「日本経済は減速しながらも緩やかな成長を続けると予想される」と述べた。\nしかし、これは、家計向けの原油高を抑制するための政府の措置や、世界的なAI関連需要の増加によって部分的に相殺される可能性が高い。半導体のサプライチェーンには多くの日本企業が関わっています。\n— これは最新ニュースです。最新情報を確認してください。",
    "source": "CNBC",

    "id": "trump-says-us-to-scale-back-military-dri-18e36077",
    "title": "Trump says US to scale back military drills with South Korea after it stayed out of Iran war",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "トランプ大統領、米国はイラン戦争に参加しなかったことを受け、韓国との軍事演習を縮小すると発言- 公開されました",
    "bodyOriginal": "Trump says US to scale back military drills with South Korea after it stayed out of Iran war\n- Published\nPresident Donald Trump has said the US will \"substantially reduce\" joint military exercises with South Korea, citing his \"very good relationship\" with North Korea's leader Kim Jong Un.\nHe also noted on Truth Social that South Korea had recently declined to join the US in the \"denuclearisation\" of Iran.\n\"These exercises are not only costly, with much of these costs paid for by the United States of America (as usual!), but send a signal that is totally inappropriate and hostile,\" Trump posted.\nSeoul said the drills with the US would proceed \"as scheduled\". Pyongyang has not yet commented. It comes after North Korea this month conducted ballistic missile tests banned by the United Nations.\nTrump said in his social media post on Sunday that it was \"too late to cancel\", as the US and South Korea were due to start their annual military exercises on Monday.\nHe added: \"While somewhat unrelated (?), I recently asked the President of South Korea if they would like to join us in the Denuclearization of the Islamic Republic of Iran, and they said, 'No thanks!'\"\nTrump's announcement came less than 24 hours after he posted an old photograph of himself and Kim from 2018, writing the two were great friends \"despite the unfriendly look on this particular picture\".\nLast week, US and South Korean military leaders held a joint press conference announcing Ulchi Freedom Shield.\nThey said the 11-day event would be similar in scale to previous years, with about 18,000 South Korean soldiers participating.\nDuring the news conference, military leaders also mentioned North Korea's deployment of troops to aid Russia's war against Ukraine.\nUS military spokesperson Ryan Donald said \"our training accounts for that threat\", referring to North Korean soldiers returning from the battlefield. About 28,500 American military personnel are stationed in South Korea.\nOn Friday, North Korea's foreign ministry condemned the joint military drills as \"a rehearsal for an aggressive war\".\nThe joint exercises come days after South Korea, the US and Japan detected the second North Korean missile test in days.\nPyongyang has accelerated efforts to expand its nuclear and missile programmes since the collapse in 2019 of Kim's high-profile diplomacy with Trump during his first term in the White House.\nHe became the first ever sitting US president to set foot in North Korea when he visited seven years ago.\nTrump's pointed remark about South Korea in his social media post seemed to hint at possible frustration with Seoul for declining to make direct military or logistical contributions to the US hostilities with Iran.\nHe has also expressed displeasure with other allies for their hesitance to get involved in the conflict, including Japan, France and the UK.\nTrump's move to downsize joint military exercises with South Korea is not without precedent.\nHe suspended the exercises entirely in 2018, during denuclearisation negotiations with Kim.\nThe exercises were again scaled back in 2020 during the Covid-19 pandemic.\nLast week, South Korea's president proposed talks with its northern neighbour on officially ending the war between the two that is technically still active since an armistice was signed in 1953.\n- Published1 day ago",
    "bodyJa": "トランプ大統領、米国はイラン戦争に参加しなかったことを受け、韓国との軍事演習を縮小すると発言\n- 公開されました\nドナルド・トランプ大統領は、北朝鮮の指導者金正恩氏との「非常に良好な関係」を理由に、米国は韓国との合同軍事演習を「大幅に縮小する」と述べた。\n同氏はまた、Truth Socialで、韓国が最近、イランの「非核化」における米国への参加を拒否したと指摘した。\nトランプ大統領は「これらの演習は費用がかかるだけでなく、その費用の多くは（いつものように！）米国が負担しているだけでなく、全く不適切で敵対的なシグナルを送るものだ」と投稿した。\n韓国政府は、米国との訓練は「予定通り」行われると述べた。北朝鮮はまだコメントしていない。北朝鮮が今月、国連が禁止している弾道ミサイル実験を実施したことを受けてのことだ。\nトランプ大統領は日曜、ソーシャルメディアへの投稿で、米国と韓国が月曜に年次軍事演習を開始する予定だったため、「中止するには遅すぎる」と述べた。\nさらに、「少し関係ないが（？）、私は最近、韓国大統領にイラン・イスラム共和国の非核化に参加してくれないかと尋ねたが、彼らは『ノー・サンクス！』と答えた」と付け加えた。\nトランプ大統領の発表は、2018年に自身と金氏の古い写真を投稿してから24時間も経たないうちに行われ、「この特定の写真では無愛想な表情にもかかわらず」2人は素晴らしい友人だったと記した。\n先週、米国と韓国の軍事指導者は共同記者会見を開き、乙支フリーダムシールドを発表した。\n１１日間のイベントは例年と同規模で、約１万８０００人の韓国軍兵士が参加すると発表した。\n記者会見で軍指導者らは、ロシアの対ウクライナ戦争を支援するための北朝鮮の軍隊派遣にも言及した。\n米軍報道官ライアン・ドナルドは、戦場から帰還した北朝鮮兵士について言及し、「我々の訓練がその脅威の説明になっている」と述べた。韓国には約２万８５００人の米軍人が駐留している。\n金曜日、北朝鮮外務省は合同軍事演習を「侵略戦争の予行演習」であると非難した。\nこの合同演習は、韓国、米国、日本が数日で２回目の北朝鮮のミサイル実験を探知した数日後に行われる。\n2019年に金氏のホワイトハウス一期目の任期中のトランプ氏との大々的な外交が破綻して以来、北朝鮮は核・ミサイル計画を拡大する取り組みを加速させている。\n同氏は7年前に北朝鮮を訪問した際、現職の米国大統領として初めて北朝鮮の土を踏んだ。\nトランプ大統領のソーシャルメディアへの投稿での韓国に関する鋭い発言は、米国のイランとの敵対行為への直接的な軍事的または兵站的貢献を拒否する韓国への不満の可能性をほのめかしているようだった。\n同氏はまた、日本、フランス、英国など他の同盟国が紛争への関与をためらっていることに不快感を表明した。\nトランプ大統領が韓国との合同軍事演習を縮小する動きには前例がないわけではない。\n同氏は金氏との非核化交渉中の2018年に演習を完全に中止した。\n演習は新型コロナウイルス感染症（Covid-19）パンデミック下の2020年に再び縮小された。\n先週、韓国大統領は、1953年に休戦協定が結ばれて以来、厳密には現在も続いている両国間の戦争を正式に終わらせるために、北の隣国との協議を提案した。\n- 1 日前に公開",

  {
    "id": "how-switching-your-bank-account-could-ea-d8e975a4",
    "title": "How switching your bank account could earn you up to £220",
    "titleJa": "銀行口座を切り替えると最大 220 ポンド獲得できる仕組み",
    "summaryJa": "銀行口座を切り替えると最大 220 ポンド獲得できる仕組み- 公開されました",
    "bodyOriginal": "How switching your bank account could earn you up to £220\n- Published\nMany of us have been with the same bank for years, potentially missing out on hundreds of pounds that rivals are offering us to move to them.\nWhether it's loyalty, laziness, or fear it'll be a faff that keeps us from switching, banks are competing to change our mind.\nMore than five banks are currently offering incentives to switch - with the largest bonus £220.\nPlus, if you've got savings, you could get a better interest rate - and therefore a greater return on your money.\nAlmost two thirds of British savers have been with their bank for more than a decade, new research from Hargreaves Lansdown suggests.\nIts survey, of 3,000 British adults in August, found 34% have moved their money in the last 12 months.\nIt estimates staying put costs British savers around £12bn in missed interest every year, based on analysis of Financial Conduct Authority data.\nThe price of staying put\nSimon Belsham, Hargreaves Lansdown's chief client officer, says doing nothing might be easy but \"often leads to poor returns\".\n\"Millions leave their cash with the same bank by default and that inertia is worth a fortune to banks, while costing British savers billions of pounds a year.\n\"Savers clearly care about rates: when they move their money, the overwhelming reason is to secure a better return.\n\"What holds them back is the effort of repeatedly finding, opening and juggling different accounts.\"\nHow to change bank, energy or broadband provider and save money\n- Published13 July\nPeople are \"incredibly loyal\" to their bank which is why competitors need to offer sweeteners, says Sarah Coles, head of personal finance at AJ Bell.\n\"It's worth it for the banks, because they then have a captive audience, who are more likely to take other products from them.\"\nShe says the bonus should be the \"cherry on top\" and people shouldn't overlook other aspects such as the bank's reputation for service, any overdraft charges and what savings rate it offers.\nWhat you need to know\nMany deals are dependent on conditions such as a minimum amount of money into your account in the first few weeks, or minimum number of direct debits leaving it.\nSwitching banks will show up on your credit report.\nThis is what lenders will look at when deciding how much money you can borrow for a mortgage.\nOpening lots of accounts in quick succession could dent your record, but closing an old one may boost your score.\n\"If you're planning to apply for a loan or mortgage in the next 12 months, you may want to wait until the deal is done,\" says Coles.\nIf you decide to switch you don't need to worry about individually transferring over every direct debit or bills payment, thanks to the free Current Account Switch Service (CASS). Over 50 UK banks and building societies are signed up.\nTell your new bank your chosen switch date (allow seven working days) and your old account details - and behind the scenes it will transfer payments, move the balance, and redirect incoming payments, such as benefits or salaries. Your old bank will close your account.\nIf anything goes wrong you'll be refunded any interest and charges made on either your old or new account.\nPeople will need to transfer any recurring card payments, such as subscriptions, manually.\nInformation such as old bank statements won't be accessible after the move so people might want to download these before they switch.\nRelated topics\n- Published18 June 2018",
    "bodyJa": "銀行口座を切り替えると最大 220 ポンド獲得できる仕組み\n- 公開されました\n私たちの多くは何年も同じ銀行に勤めており、ライバルが私たちに移籍を勧めてくる数百ポンドを逃す可能性があります。\nそれが忠誠心であれ、怠惰であれ、あるいはそれが面倒なことになるのではないかという恐怖であれ、私たちの乗り換えを阻むものは何であれ、銀行は私たちの考えを変えようと競い合っている。\n現在、5 行以上の銀行が切り替えのインセンティブを提供しており、最大額のボーナスは 220 ポンドです。\nさらに、貯蓄がある場合は、より良い金利が得られるため、より大きな収益が得られます。\nハーグリーブス・ランズダウンの新たな調査によると、英国の貯蓄者のほぼ3分の2が10年以上銀行に勤務していることが示唆されている。\n8月に英国の成人3,000人を対象に実施した調査では、34％が過去12カ月間に資金を移動したことが判明した。\n同報告書は、金融行為監視機構のデータ分析に基づいて、英国の貯蓄者が現状維持を続けることで利息を逃し、毎年約120億ポンドの損害を被っていると試算している。\n留まる代償\nハーグリーブス・ランズダウン社の最高顧客責任者であるサイモン・ベルシャム氏は、何もしないのは簡単かもしれないが、「多くの場合、収益が低い」と語る。\n「何百万もの人々がデフォルトで同じ銀行に現金を預けており、その惰性は銀行にとっては巨額の価値がある一方、英国の貯蓄者は年間数十億ポンドの損失を被っている。\n「貯蓄者が金利を気にしているのは明らかです。彼らがお金を移動するときの圧倒的な理由は、より良いリターンを確保することです。\n「彼らを妨げているのは、さまざまな口座を繰り返し見つけ、開設し、やりくりするという労力です。」\n銀行、電力会社、ブロードバンドプロバイダーを変更してお金を節約する方法\n- 7 月 13 日発行\nAJベルのパーソナル・ファイナンス責任者サラ・コールズ氏は、人々は自分の銀行に対して「信じられないほど忠誠心がある」ため、競合他社は甘味料を提供する必要があると語る。\n「銀行にとっては価値がある。なぜなら、銀行は聴衆を虜にし、他の商品を取り上げてくれる可能性が高くなるからである。」\n彼女は、ボーナスは「一番上のチェリー」であるべきであり、人々は銀行のサービスの評判、当座貸越手数料、銀行が提供する貯蓄率などの他の側面を見逃してはいけないと述べています。\n知っておくべきこと\n多くの取引は、最初の数週間にアカウントに入金される最低金額や口座から引き落とされる最低口座数などの条件に依存します。\n銀行を変更すると信用報告書に記載されます。\nこれは、金融機関が住宅ローンで借りることができる金額を決定するときに考慮するものです。\n立て続けに多くのアカウントを開設すると記録が傷つく可能性がありますが、古いアカウントを閉鎖するとスコアが上がる可能性があります。\n「今後 12 か月以内にローンや住宅ローンを申請する予定がある場合は、契約が完了するまで待ったほうがよいでしょう」とコールズ氏は言います。\n切り替えることに決めた場合は、無料の当座預金口座切り替えサービス (CASS) のおかげで、口座振替や請求書の支払いを個別に転送することを心配する必要はありません。英国の 50 を超える銀行および住宅金融組合が登録しています。\n新しい銀行に選択した切り替え日 (7 営業日以内) と古い口座の詳細を伝えると、舞台裏で支払いが転送され、残高が移動され、福利厚生や給与などの入金がリダイレクトされます。古い銀行があなたの口座を閉鎖します。\n何か問題が発生した場合は、古いアカウントまたは新しいアカウントに発生した利息と料金が返金されます。\n定期購入などの定期的なカード支払いは手動で転送する必要があります。\n移行後は古い銀行取引明細書などの情報にアクセスできなくなるため、移行前にダウンロードしておくとよいでしょう。\n関連トピック\n- 2018 年 6 月 18 日公開",

    "title": "Top U.S. commander acknowledges mental health issues on USS Lincoln",
    "titleJa": "米国トップ司令官、USSリンカーンの精神的健康問題を認める",
    "summaryJa": "米中央軍司令官ブラッド・クーパー海軍大将は日曜日、空母リンカーンが長期にわたる中東展開中に船員が船外に飛び降りたとの報告を受け、同艦内に精神的健康上の問題があることを認めた。「ここに重要な事実がある。リンカーンは現在、現役の空母11隻の中で、メンタルヘルス関連の感染者数が最も少ないものの一つだ」とクーパー氏は土曜日の同艦訪問後にXに投稿した声明の中で述べた。 「これは、すべてが完璧だという意味ではありません。現在アメリカにいる400万人近くの海軍退役軍人を見つければ、おそらく海上での長期間の勤務は誰にでも向いているわけではないと言うでしょう。」",
    "bodyOriginal": "U.S. Central Command Commander Adm. Brad Cooper on Sunday acknowledged mental health challenges aboard the USS Lincoln after reports that a sailor jumped overboard amid the aircraft carrier's long Middle East deployment.\n\"Here's an important fact: Of the U.S. Navy's 11 active aircraft carriers, the Lincoln currently has among the lowest number of cases related to mental health,\" Cooper said in a statement posted to X following his visit to the ship on Saturday. \"This doesn't mean that all is perfect. Find any of the nearly 4 million Navy veterans in America today and they will likely tell you that service at sea for long periods isn't for everyone.\"\nCooper's visit and statement follow reports of widespread morale and mental health issues aboard the Lincoln, which has been deployed for more than eight months. The Navy Times reported last week that several sailors had attempted to go overboard, and Stars and Stripes also reported on widespread mental health issues.\nCooper, the top U.S. commander in the war with Iran, said his visit to the ship was \"awe-inspiring\" and lauded the crew for \"stepping up and making mental health and crew resilience a leadership priority.\"\nPresident Donald Trump and Defense Secretary Pete Hegseth, however, have sought to downplay reports of deteriorating morale aboard the Lincoln.\nAsked by a reporter on Friday whether the Lincoln's deployment has gone on too long, Trump said, \"No, no, no\" and added, \"not nearly long enough.\" The president also said that the Lincoln would soon be replaced in the region by a different carrier.\nHegseth said that reports are \"completely misrepresented.\"\nThe USS George Washington is now headed toward the Middle East and is expected to take the place of the Lincoln, MS Now reported.\nLawmakers, meanwhile, have questioned and criticized the Pentagon over conditions aboard the Lincoln.\nSen. Kirsten Gillibrand, D-N.Y., who serves on the Senate Armed Services and Intelligence Committees, said in a statement on Saturday that there \"must be accountability for the reported deteriorating conditions endured by our service members serving in a reckless war started with no justification, no strategy, and no end in sight.\"\n\"I demand hearings, accountability, and a clear plan to protect our service members and prioritize American families,\" she said.",
    "bodyJa": "米中央軍司令官ブラッド・クーパー海軍大将は日曜日、空母リンカーンが長期にわたる中東展開中に船員が船外に飛び降りたとの報告を受け、同艦内に精神的健康上の問題があることを認めた。\n「ここに重要な事実がある。リンカーンは現在、現役の空母11隻の中で、メンタルヘルス関連の感染者数が最も少ないものの一つだ」とクーパー氏は土曜日の同艦訪問後にXに投稿した声明の中で述べた。 「これは、すべてが完璧だという意味ではありません。現在アメリカにいる400万人近くの海軍退役軍人を見つければ、おそらく海上での長期間の勤務は誰にでも向いているわけではないと言うでしょう。」\nクーパー氏の訪問と声明は、8カ月以上配備されているリンカーン艦内で士気と精神衛生上の問題が蔓延しているとの報告を受けてのことだ。ネイビー・タイムズ紙は先週、数人の船員が船外へ出ようとしたと報じ、星条旗紙も広範な精神的健康問題について報じた。\nイランとの戦争における米国の最高司令官であるクーパー氏は、同船への訪問は「畏敬の念を抱かせる」ものであったと述べ、乗組員が「精神衛生と乗組員の回復力をリーダーシップの優先事項として取り組みを強化している」と称賛した。\nしかし、ドナルド・トランプ大統領とピート・ヘグセス国防長官は、リンカーン艦内の士気の低下に関する報道を軽視しようとしている。\n金曜日、トランプ大統領は、リンカーンの配備が長すぎるのではないかと記者団に質問され、「いや、いや、いや」と答え、「十分な長さではない」と付け加えた。大統領はまた、この地域では間もなくリンカーンが別の航空会社に置き換えられるだろうとも述べた。\nヘグセス氏は、報道は「完全に誤って伝えられている」と述べた。\nUSSジョージ・ワシントンは現在中東に向かっており、リンカーンの代わりになると予想されているとMS Nowが報じた。\n一方、議員らはリンカーン号の船内の状況について国防総省に疑問を呈し、批判してきた。\n上院軍事委員会および情報委員会の委員を務めるカーステン・ギリブランド上院議員（民主党、ニューヨーク州）は土曜日の声明で、「正当性も戦略もなく、終わりの見えないまま始まった無謀な戦争に従事している軍人たちが耐えていると報告されている状況の悪化について責任を負わなければならない」と述べた。\n「公聴会、説明責任、そして軍人を守り、アメリカ人の家族を優先するための明確な計画を要求します」と彼女は述べた。",

    "id": "trump-envoy-kushner-meets-hamas-leader-t-0af7cc59",
    "title": "Trump envoy Kushner meets Hamas leader to push Gaza peace plan",
    "titleJa": "トランプ特使クシュナー氏、ガザ和平計画推進のためハマス指導者と会談",
    "summaryJa": "トランプ特使クシュナー氏、ガザ和平計画推進のためハマス指導者と会談- 公開されました",
    "bodyOriginal": "Trump envoy Kushner meets Hamas leader to push Gaza peace plan\n- Published\nUS President Donald Trump's Middle East envoy Jared Kushner has held rare talks with Hamas to discuss the implementation of the US-backed Gaza peace plan.\nA Palestinian official told the BBC Trump's son-in-law met a delegation led by Hamas's new leader Khalil al-Hayya in Egypt on Sunday.\nLast month, Trump's Board of Peace said it had reached agreement for the \"complete disarmament\" of Hamas and other armed group in Gaza. Last week, Israel rejected Trump's 15-point plan which also calls for Israeli troops to withdraw and for Gaza to be rebuilt under a new civilian Palestinian administration.\nEight Muslim countries issued a statement on Sunday condemning Israel's rejection.\nTrump leads the Board of Peace - created as an international organisation originally intended to bring peace to Gaza, but later expanded to include conflicts worldwide.\nKushner's meeting with Hayya is said to be the first at this level since last year's agreement of a ceasefire for the Gaza Strip.\nAccording to reports, Board of Peace envoys Nickolay Mladenov and UK ex-Prime Minister Tony Blair were also part of the meeting - alongside representatives of Egypt, Qatar and Turkey, which have mediated in the peace efforts.\nNo official statement has been released of the talks reportedly focusing on concrete actions to decommission Hamas's weapons - as well as the withdrawal of Israeli troops and humanitarian efforts.\nWhilst in Egypt, Kushner also met Egyptian President Abdel Fattah al-Sisi. According to Israeli media reports, Kushner, Mladenov and Blair will meet Netanyahu on Monday with the aim of advancing Trump's plan.\nThe Israeli prime minister has said he wants a full Hamas disarmament first in order to implement the deal.\n\"Israel rejects the Board of Peace's 15-point document on Gaza. The IDF will not carry out any withdrawal until Hamas is genuinely disarmed,\" Netanyahu said last week defying Israel's closest ally.\nIn a joint statement on Sunday, Egypt, UAE, Qatar, Saudi Arabia, Jordan, Turkey, Pakistan and Indonesia said Israel's rejection of the US plan threatened Trump's efforts for peace.\nThe ceasefire, which came into effect on 10 October last year, remains in place.\nHowever, the Israel Defense Forces have carried out several strikes in Gaza since then - the latest on \"terrorists\" in Khan Yunis and Nuseirat areas of Gaza - accusing Hamas of breaking the truce.\nThe war was triggered by the Hamas-led attack on southern Israel on 7 October 2023, in which about 1,200 people were killed and 251 others were taken hostage.\nIsrael responded to the attack by launching a military campaign in Gaza, during which more than 73,000 people have been killed, according to the territory's health ministry, whose figures are considered reliable by the UN.\nThe UN estimates that about 1.9 million people - 90% of Gaza's population - have been displaced since the war started.\n- Published17 January\n- Published20 July",
    "bodyJa": "トランプ特使クシュナー氏、ガザ和平計画推進のためハマス指導者と会談\n- 公開されました\nドナルド・トランプ米大統領の中東特使ジャレッド・クシュナーは、米国が支援するガザ和平計画の実施について話し合うためハマスと異例の会談を行った。\nパレスチナ当局者はＢＢＣに対し、トランプ大統領の娘婿が日曜、エジプトでハマスの新指導者ハリル・アルハヤ率いる代表団と面会したと語った。\nトランプ大統領の平和委員会は先月、ガザ地区のハマスや他の武装勢力の「完全な武装解除」で合意に達したと発表した。先週、イスラエルはトランプ大統領の15項目の計画を拒否したが、この計画にはイスラエル軍の撤退とパレスチナの新たな文民政権によるガザの再建も求められている。\nイスラム教８カ国は日曜日、イスラエルの拒否を非難する声明を発表した。\nトランプ氏は平和委員会を率いている。この委員会は当初ガザに平和をもたらすことを目的とした国際組織として設立されたが、後に世界中の紛争を対象に拡大された。\nクシュナー氏とハヤ氏の会談は、昨年のガザ地区の停戦合意以来、このレベルでの会談は初めてと言われている。\n報道によると、和平努力を仲介したエジプト、カタール、トルコの代表とともに、平和委員会のニコライ・ムラデノフ特使と英国のトニー・ブレア元首相も会議に参加した。\n伝えられるところによると、ハマスの兵器の廃棄に向けた具体的な行動や、イスラエル軍の撤退や人道的取り組みに焦点を当てているとされるこの会談については、公式声明は発表されていない。\nエジプト滞在中、クシュナー氏はエジプトのアブドルファッタハ・アル・シシ大統領とも会談した。イスラエルメディアの報道によると、クシュナー氏、ムラデノフ氏、ブレア氏はトランプ大統領の計画推進を目指し、月曜日にネタニヤフ首相と会談する予定。\nイスラエル首相は、合意履行のためにはまずハマスの完全武装解除を望むと述べた。\n「イスラエルはガザに関する平和委員会の15項目の文書を拒否する。ハマスが真に武装解除されるまでイスラエル国防軍はいかなる撤退も実行しない」とネタニヤフ首相は先週、イスラエルの最も緊密な同盟国に反抗して述べた。\n日曜の共同声明では、エジプト、ＵＡＥ、カタール、サウジアラビア、ヨルダン、トルコ、パキスタン、インドネシアは、イスラエルによる米国の計画の拒否がトランプ大統領の和平への努力を脅かすと述べた。\n昨年10月10日に発効した停戦は今も維持されている。\nしかし、イスラエル国防軍はそれ以来、ガザ地区で数回の攻撃を実施しており、今回はガザ地区のハーンユニス地区とヌセイラット地区の「テロリスト」に対する攻撃で、ハマスが停戦を破ったと非難している。\nこの戦争は2023年10月7日のハマス主導のイスラエル南部攻撃によって引き起こされ、約1,200人が死亡、他251人が人質となった。\nイスラエルはガザ攻撃に対抗し、ガザ地区で軍事行動を開始し、同地域の保健省によると、その間に7万3000人以上が死亡し、その数字は国連によって信頼できると考えられている。\n国連は、戦争が始まって以来、ガザ人口の90％に当たる約190万人が避難を強いられたと推定している。\n- 1 月 17 日公開\n- 7 月 20 日発行",

    "title": "Russia says at least seven killed in largest Ukrainian attack of 2026",
    "titleJa": "ロシア、2026年最大規模のウクライナ攻撃で少なくとも7人死亡と発表",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.長い前線に沿った消耗戦の地上戦でどちらの側もわずかな勝利を収めたため、戦争は主に航空戦となり、各国の戦闘能力を低下させることを目的としたミサイルや無人機の交換が行われた。",
    "bodyOriginal": "Russia says at least seven killed in largest Ukrainian attack of 2026\n- Published\nAt least seven people have been killed in Russia after what officials called the \"largest-scale\" attack launched by Ukraine this year.\nSome 822 drones were used - 600 aiming for Moscow, according to its regional governor who said the Russian capital had suffered \"one of the most massive drone attacks in recent memory\". A warehouse belonging to Russian online retailer Wildberries was hit.\nRussian attacks on Ukraine also killed at least seven people and injured more than 39.\nRussia has intensified missile attacks across Ukraine in recent weeks, with Kyiv also stepping up drone strikes deep inside Russia.\nFive people died in Russia's south-western region of Rostov following overnight strikes, its governor said.\nOfficials in Belgorod, which borders Ukraine, said a woman was killed after a civilian bus was struck, while an 83-year-old man died in a drone attack in the Moscow region, according to Governor Andrey Vorobyov.\nA Wildberries warehouse in Koledino, 25km (15.5 miles) from the centre of Moscow, was hit in an attack, injuring three, Mayor Sergei Sobyanin said. Videos shows a fire and a large plume of smoke over the warehouse.\nWildberries, known as Russia's version of Amazon, has been repeatedly targeted since July. Kyiv said at the time it was targeting logistics hubs used by Russians to buy military equipment and disrupting supplies to the Russian army.\nUkraine's defence ministry said the latest attack meant that seven out of 10 of the largest Wildberries logistics centres had been \"disabled\".\nBoth warring sides accuse each other of targeting civilians.\nIn Ukraine, a 66-year-old man and 64-year-old woman died after a private house was hit by a guided aerial bomb in the Zaporizhzhia region, officials said.\nTwo more people were killed in Kryvyi Rih, a city in Dnipropetrovsk.\nOfficials in Sumy, Donetsk and Kherson also reported one death in each region, including a 51-year-old killed in a drone strike in Sumy.\nIn Kyiv, air-raid sirens sounded four times overnight as the Ukrainian capital came under Russian attack. At least six people, including a child, were reportedly injured, Mayor Vitali Klitschko said.\nRussia said its attacks on Kyiv on Saturday night targeted a FirePoint facility producing parts for Ukrainian Flamingo missiles and a factory making components for drones.\nA book market in the city's Pochayna district was damaged in the strikes. Burnt books could be seen lying on the ground, while firefighters continue to douse the flames.\nSixty-nine-year-old Valentina's husband owned a market stall.\nLooking through the rubble, she told the BBC: \"All these books in the street were from my husband's stall in the market - I recognise them on the floor.\"\nShe added: \"You never think that it will happen to you.\"\nVinyl store owner Luba, 42, said she has lost 500,000 hryvnias (£8,262) worth of stock.\n\"This business was my baby - many of the vinyls destroyed were rare and irreplaceable,\" she told the BBC. \"I want Russia to disappear from this Earth.\"\nUkrainian President Volodymyr Zelensky said 13 regions had come under attack this week, with Russia launching more than 1,550 attack drones, nearly 1,560 guided aerial bombs and 62 missiles.\n\"Wherever the Russians can reach with their ballistic missiles, they strike civilian infrastructure,\" he said.\nFor years, Ukraine has relied on US supplies of Patriot interceptor missiles to shoot down Russian ballistic missiles.\nBut the US has used many of its stockpiles during its war with Iran and is reluctant to give up more.\nAfter initially offering Ukraine the licence to make Patriots in early July, President Donald Trump later denied the US had agreed to \"give away that kind of technology\".\nThroughout the war, as well as relying on Western partners, Ukraine has had to innovate - its home-made drones are responsible for the attacks deep into Russian territory.\nAnd it will be able to strike Russia with domestically-made ballistic missiles within three to six months, the former Ukrainian Defence Minister Mykhailo Fedorov told CBS News, the BBC's US partner.\nRussia launched its full-scale invasion of Ukraine in February 2022, and currently controls approximately a fifth of Ukrainian territory.\nWith marginal gains being made by either side in an attritional ground battle along a lengthy front line, the war has predominantly become an aerial one, with exchanges of missiles and drones aimed at degrading each country's warfighting ability.\nRelated topics\n- Published3 days ago\n- Published5 days ago\n- Published2 days ago",

    "id": "changing-pubs-into-homes-to-be-made-hard-320a27a9",
    "title": "Changing pubs into homes to be made harder under new rules",
    "titleJa": "パブを住宅に変えるのは新たなルールの下でより困難になる",
    "summaryJa": "パブを住宅に変えるのは新たなルールの下でより困難になる- 公開されました",
    "bodyOriginal": "Changing pubs into homes to be made harder under new rules\n- Published\nTurning pubs into housing or offices will be made harder as part of changes to government planning rules in England.\nThe updated National Planning Policy Framework (NPPF) will come into force on Monday and is expected to contain more protections for pubs at threat of closure for conversion to another use.\nA previous consultation on the plans only gave the protection to the last pub in the area.\nHowever, pub and hospitality groups say taxes and employment costs are the big reasons why pubs are closing. Meanwhile, the Conservatives said the Labour government is \"failing abysmally\" to meet its housing targets.\nWhy there's a row about 'vertical drinking' in central London\n- Published7 August\nTo go ahead with a change of use under the new rules, developers will need to provide evidence that there is no reasonable prospect of keeping a pub business running.\nThe evidence will need to include proof it was marketed for sale for at least 12 months.\nA government spokesperson told the BBC councils would need to assess the impact on a community of a change of use.\nThe rules will reportedly stop owners from deliberately killing off trade in order to justify a closure, protecting pubs which have been historically successful.\nThe NPPF sets out government's planning policies for England and how they should be applied by local authorities.\nScotland, Wales, and Northern Ireland have their own devolved planning frameworks and laws.\n'Closures avoidable'\nThe Campaign for Real Ale has previously said that pubs are being \"lost forever to conversion or demolition as developers look to cash in on the desirable locations and unique architecture of pubs and social clubs\".\nThe British Beer and Pub Association and UKHospitality have also campaigned against pub closures, with both largely blaming tax rises and other costs.\nAllen Simpson, chief executive of UKHospitality, said: \"The biggest issue facing hospitality businesses is costs like VAT and business rates pushing pubs out of business in the first place.\n\"Anything that makes it harder to take these important assets away from their communities has to be welcomed, but the government should focus on continuing its strong start on fixing the harm done to hospitality over the past two years.\"\nIn July, the Labour government said pubs, social clubs and live music venues in England will be given a 20% cut to business rates on top of rates relief announced in January.\nThe NPPF update being published Monday also includes default approval for homes being built around railway stations in England in an attempt to increase housebuilding numbers.\nHousing Secretary Angela Rayner said: \"By unlocking thousands of homes around well-connected transport hubs, we're helping people live closer to work, school and the services they rely on, while backing local businesses and driving growth in our communities.\"\nThe update also means that some groups will no longer need to be consulted on housing development plans as part of the process of getting permission.\nThe Gardens Trust, a parks and gardens heritage and conversion charity, called the decision to remove its role as a statutory consultee \"devastating\".\nIt said it devalued parks and gardens and \"makes them vulnerable to poorly informed development\".\nUnder the changes, the Gardens Trust and Theatres Trust will still be notified of relevant applications and Sport England will continue to advise on significant cases.\nLabour has set a target to build 1.5 million homes by 2029. According to official data, external, it has so far built 392,000 homes in England since coming into power in July 2024.\nShadow housing secretary Sir James Cleverly said Labour is \"failing abysmally\" to meet their target because of taxes and red tape.\n\"To try to fix their own mess, Labour are planning a power grab, seizing control from local communities and forcing them to accept development in the wrong areas because Labour won't build in the right areas,\" he added.",
    "bodyJa": "パブを住宅に変えるのは新たなルールの下でより困難になる\n- 公開されました\n英国政府の計画規則変更の一環として、パブを住宅やオフィスに転用することがさらに難しくなるだろう。\n更新された国家計画政策枠組み（NPPF）は月曜日に発効し、別の用途への転用により閉店の危機に瀕しているパブに対するより多くの保護が含まれることが期待されている。\n計画に関する事前の協議では、この地域の最後のパブにのみ保護が与えられた。\nしかし、パブやホスピタリティ団体は、パブが閉店する大きな理由は税金と人件費だと主張している。一方、保守党は労働党政権が住宅目標の達成に「まったく失敗している」と述べた。\nロンドン中心部で「縦飲み」に関する騒動が起きている理由\n- 8 月 7 日に公開\n新しい規則に基づいて用途変更を進めるには、開発業者はパブ事業を継続する合理的な見込みがないという証拠を提出する必要がある。\n証拠には、少なくとも 12 か月間販売用に販売されていたという証拠が含まれる必要があります。\n政府報道官は、BBC評議会は用途変更が地域社会に与える影響を評価する必要があると述べた。\nこの規則は、オーナーが閉店を正当化するために意図的に取引を停止することを阻止し、歴史的に成功を収めてきたパブを保護すると伝えられている。\nNPPF は、イングランドに対する政府の計画政策と、地方自治体によるそれらの政策の適用方法を定めています。\nスコットランド、ウェールズ、北アイルランドには、独自の権限委譲された計画枠組みと法律があります。\n「閉店は避けられる」\nリアル・エール・キャンペーンは以前、パブは「開発業者がパブや社交クラブの望ましい立地とユニークな建築を利用して利益を得ようとする中、改築や取り壊しによって永遠に失われつつある」と述べた。\n英国ビール・パブ協会とUKホスピタリティもパブの閉鎖に反対する運動を行っており、どちらも主に増税やその他の費用が原因であるとしている。\nUKホスピタリティのアレン・シンプソン最高経営責任者（CEO）は、「ホスピタリティ企業が直面している最大の問題は、そもそもパブを廃業に追い込んでいるVATやビジネスレートなどのコストだ」と語った。\n「これらの重要な資産を地域社会から奪うことを困難にするものはすべて歓迎されなければなりませんが、政府は過去2年間にホスピタリティに与えられた損害を修正するという力強いスタートを続けることに焦点を当てるべきです。」\n労働党政府は7月、イングランドのパブ、社交クラブ、ライブ音楽会場に対し、1月に発表した料金軽減に加えて営業料金を20％引き下げると発表した。\n月曜日に公表されるNPPFの最新情報には、住宅建設件数の増加を目的として、英国の鉄道駅周辺に建設される住宅のデフォルト承認も含まれている。\nアンジェラ・レイナー住宅長官は、「交通の便が良い交通拠点の周囲に数千軒の住宅を開放することで、人々が職場、学校、頼りになるサービスの近くに住めるよう支援するとともに、地元企業を支援し、地域社会の成長を促進する」と述べた。\nこの更新は、一部のグループが許可を得るプロセスの一環として住宅開発計画について相談する必要がなくなることも意味する。\n公園と庭園の遺産および転換慈善団体であるガーデンズ・トラストは、法定顧問としての役割を解除する決定は「壊滅的だ」と述べた。\n公園や庭園の価値を切り下げ、「十分な情報が得られていない開発に対して脆弱にしている」と述べた。\nこの変更に基づき、ガーデンズ・トラストとシアターズ・トラストには関連する申請が引き続き通知され、スポーツ・イングランドは引き続き重要な事件についてアドバイスを行うことになる。\n労働党は2029年までに150万戸の住宅を建設する目標を設定している。外部の公式データによると、2024年7月に政権を握って以来、これまでに英国で39万2000戸の住宅を建設した。\n影の住宅長官サー・ジェームス・クレバリー氏は、労働党は税金やお役所仕事のせいで目標達成に「まったく失敗している」と述べた。\n「自らの混乱を正そうとするために、労働党は権力掌握を計画しており、地元社会からコントロールを奪い、労働党が適切な地域に建設しないため、間違った地域での開発を受け入れるよう強制している」と同氏は付け加えた。",

    "title": "What the results of a Connecticut congressional primary race may mean for Social Security",
    "titleJa": "コネチカット州議会予備選の結果は社会保障にとって何を意味するのか",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Lawmakers elected to Congress in 2026 are likely to be tasked with shoring up Social Security ahead of its looming 2032 funding shortfall, and that effort could be affected by the outcome of a Connecticut primary race.\nDemocratic Rep. John Larson, the ranking member of the House Ways and Means Subcommittee on Social Security, who has called for expanding Social Security benefits, won't be on the November ballot.\nOn Tuesday, voters in Connecticut's 1st Congressional District chose among the incumbent Larson and several challengers. Former Hartford Mayor Luke Bronin won, with around 54% of the district's vote, compared with 33% for Larson, according to MS NOW, based on 99% of votes.\nIn a speech Tuesday night, Larson — who has served 14 terms in the House of Representatives — said he is \"disappointed\" with the primary results.\n\"But far from disheartened — we have a responsibility and a job to do, and we've got to come together as people, as a Democratic Party and fight for what's right for the American people,\" Larson said.\nLarson previously served as a chair of the Social Security subcommittee, when Democrats controlled the House. For years, Larson has advocated for a bill, the Social Security 2100 Act, which aims to expand benefits while also extending the program's solvency.\nLarson reintroduced the Social Security 2100 Act on June 26. Sen. Richard Blumenthal, D-Conn., put forward a version of the bill in the Senate on July 21.\nThe Social Security 2100 Act calls for some benefit increases that would be in effect through 2036. Among those proposed changes are an across-the-board benefit increase, a change to how the annual cost-of-living adjustment is calculated, and an increase in the minimum benefit for long-term low earners.\nTo pay for those changes, the bill calls for eliminating the Social Security payroll tax cap and taxing investment income for taxpayers who earn over $400,000. In 2026, the Social Security payroll tax cap is set at $184,500. Earnings above that limit are not subject to the 6.2% payroll tax for workers and employers.\nThe re-upped proposal comes as the Social Security trust fund that helps pay retirement benefits is projected to run out in about six years, in the fourth quarter of 2032, according to Social Security trustees' latest projections. At that time, 78% of those benefits would be payable, unless Congress comes up with a solution.\nConnecticut beneficiaries may face the steepest losses should the trust fund be depleted, with an average monthly benefit cut of $556, according to June state-by-state estimates by the Committee for a Responsible Federal Budget, a nonpartisan organization that focuses on educating the public on fiscal policy issues. States with higher average benefits would see larger cuts, according to CRFB, whose analysis assumes a 24% across-the-board cut.\nSocial Security debate continues after Larson's loss\nLeaders elected to serve in the Senate this November will be in office through early 2033, just after the projected late-2032 Social Security depletion date. The terms of House leaders elected in 2026 end in 2029.\nDuring a July 28 debate with the other Democratic candidates, Larson said the Social Security 2100 bill will be \"one of the first bills taken up\" in the first 100 days of the next Congress.\n\"We will put Social Security in place and pay for it,\" Larson said.\nFollowing the results of Tuesday's election, Social Security Works, which advocates for protecting and expanding the program, said it plans to continue to advocate for the changes Larson proposed.\n\"We will take the handoff of Congressman Larson's baton and honor his life's work by fighting harder than ever to make billionaires pay their fair share so we can protect and expand Social Security for everyone,\" Alex Lawson, executive director of Social Security Works, said in a statement.\nSocial Security Works' political action committee endorses candidates based on their platforms for Social Security, Medicare and Medicaid.\nDuring the candidates' debate, Bronin said Social Security 2100 failed to get out of committee under Larson's leadership when Democrats held the majority.\n\"To say that it's going to become law in the first 100 days of the next Congress when Donald Trump is in the White House, I think, is not being honest with voters,\" Bronin said.\nBronin said during the debate that he would be \"proud to fight to protect Social Security\" and that to change Social Security, it will be necessary to build a movement outside the walls of the Capitol.\n\"I think it would be good to have some younger champions of Social Security as part of that fight,\" Bronin said. \"Because if we're going to be successful, we're going to need every American of every age recognizing that they've got a stake in this.\"\nBronin did not mention specific plans during the debate, but Bronin senior advisor Amanda Sands told CNBC via email that he \"believes that part of the solution has to be lifting the cap so that higher earners pay more into Social Security, as a number of proposed bills would require.\"\nDistrict leadership to be decided on Election Day\nIn November, Bronin will oppose Republican candidate Amy Chai, a physician specializing in primary care and addiction medicine.\nChai told CNBC via email that she \"strongly\" opposes both Republican and Democratic platforms on Social Security.\nChai said her plan would keep the Social Security payroll tax cap and payroll tax rate from increasing, eliminate the employer portion of the self-employment tax and require government employees to participate in Social Security.\nTo address Social Security's funding shortfall, Chai said she would require the program's obligations to be funded before foreign aid is released.\n\"This is the FAIR way to deal with the Social Security tax,\" Chai wrote. \"It is our money. We get it back. Period.\"",
    "bodyJa": "２０２６年に議会に選出された議員らは、迫り来る２０３２年の財源不足に備えて社会保障を強化する任務を負う可能性が高く、その取り組みはコネチカット州の予備選の結果に影響を受ける可能性がある。\n社会保障給付の拡大を求めている下院歳入社会保障小委員会の有力委員である民主党のジョン・ラーソン議員は、11月の投票には参加しない。\n火曜日、コネチカット州第1下院選挙区の有権者は現職のラーソン氏と数人の挑戦者の中から選ぶ。 MS NOWによると、得票率99％に基づくと、元ハートフォード市長ルーク・ブローニン氏が地区票の約54％を獲得し、ラーソン氏は33％で勝利した。\n下院議員を14期務めたラーソン氏は火曜日夜の演説で、主要結果には「失望している」と述べた。\n「しかし、落胆するわけではありません。私たちには責任とやるべき仕事があり、国民として、民主党として団結し、アメリカ国民にとって正しいことのために戦わなければなりません」とラーソン氏は語った。\nラーソン氏は以前、民主党が下院を支配していた時代に社会保障小委員会の委員長を務めていた。ラーソン氏は長年にわたり、プログラムの支払能力を延長しながら給付金を拡大することを目的とした法案「社会保障2100法」を提唱してきた。\nラーソン氏は6月26日に社会保障2100法を再提出した。リチャード・ブルーメンタール上院議員（民主党、コネチカット州）は7月21日に同法案のバージョンを上院に提案した。\n社会保障 2100 年法では、2036 年まで実施される一部の給付金の増額が求められています。提案されている変更の中には、全面的な給付金の増額、年間生計費調整額の計算方法の変更、長期低所得者に対する最低給付金の増額などが含まれます。\nこれらの変更を賄うために、この法案は社会保障給与税の上限を撤廃し、40万ドルを超える納税者に対して投資所得に課税することを求めている。 2026 年には、社会保障給与税の上限は 184,500 ドルに設定されます。この制限を超える収入には、労働者と雇用主に対する 6.2% の給与税が課されません。\n社会保障管財委員の最新の予測によれば、退職金の支払いを支援する社会保障信託基金が約6年後の2032年の第4四半期に枯渇すると見込まれている中で、この再提案はなされた。その時点で、議会が解決策を提示しない限り、これらの給付金の78％が支払われることになる。\n財政政策の問題について国民を教育することに重点を置いている超党派の組織、責任ある連邦予算委員会の6月の州ごとの試算によると、信託基金が枯渇した場合、コネチカット州の受益者は最も多額の損失に直面する可能性があり、月平均給付金削減額は556ドルとなる。 CRFBによると、平均給付額が高い州ほど削減額は大きくなり、その分析では一律24％の削減が想定されている。\nラーソン氏の敗北後も社会保障の議論は続いている\n今年11月に上院議員に選出された指導者らは、2032年後半に社会保障が枯渇すると予想されている直後の2033年初めまで在任することになる。 2026年に選出される下院指導者の任期は2029年に終了する。\nラーソン氏は他の民主党候補者との7月28日の討論会で、社会保障2100法案は次期議会の最初の100日間に「最初に取り上げられる法案の1つ」になるだろうと述べた。\n「我々は社会保障を整備し、その費用を支払う」とラーソン氏は語った。\n火曜日の選挙結果を受けて、プログラムの保護と拡大を主張する社会保障事業団は、ラーソン氏が提案した変更を引き続き支持する予定であると述べた。\n社会保障事業のエグゼクティブディレクター、アレックス・ローソン氏は声明で、「われわれはラーソン下院議員のバトンを引き継ぎ、億万長者に応分の負担をさせるためにこれまで以上に懸命に闘うことで彼の生涯の仕事に敬意を表し、すべての人のための社会保障を守り、拡大できるようにする」と述べた。\nSocial Security Works の政治活動委員会は、社会保障、メディケア、メディケイドのプラットフォームに基づいて候補者を支持します。\n候補者討論会でブローニン氏は、民主党が過半数を占めていたとき、ラーソン氏の指導の下で社会保障２１００が委員会から外れることができなかったと述べた。\n「ドナルド・トランプ氏がホワイトハウスにいる次の議会の最初の100日以内に法案が成立すると言うのは、有権者に対して誠実ではないと思う」とブローニン氏は語った。\nブローニン氏は討論会で「社会保障を守るために戦うことを誇りに思う」と述べ、社会保障を変えるには国会議事堂の壁の外で運動を構築する必要があると述べた。\n「その闘いの一環として、社会保障の若い擁護者を何人か参加させるのは良いことだと思う」とブローニン氏は語った。 「なぜなら、もし私たちが成功しようとするなら、あらゆる年齢のすべてのアメリカ人が、自分たちもこのことに利害関係があることを認識する必要があるからです。」\nブローニン氏は討論会で具体的な計画については言及しなかったが、ブローニン氏の上級顧問アマンダ・サンズ氏は電子メールでCNBCに対し、「解決策の一部は、提案されている多くの法案で求められているように、高所得者がより多く社会保障を支払えるように上限を撤廃する必要があると考えている」と語った。\n地区指導者は選挙日に決まる\nブローニン氏は11月、プライマリケアと依存症医療を専門とする医師エイミー・チャイ氏の共和党候補と対立する。\nチャイ氏は電子メールでCNBCに対し、社会保障に関する共和党と民主党の両方の綱領に「強く」反対していると語った。\nチャイ氏は、自身の計画では社会保障給与税の上限と給与税率の引き上げを抑制し、自営業税の雇用主部分を廃止し、公務員に社会保障への加入を義務付けると述べた。\n社会保障の資金不足に対処するため、チャイ氏は、海外援助が開始される前にプログラムの義務に資金を提供することを要求すると述べた。\n「これが社会保障税に対処する公平な方法だ」とチャイ氏は書いた。 「それは私たちのお金です。私たちはそれを返します。定期です。」",
