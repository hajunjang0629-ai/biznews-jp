ls to segregate mail ballots until the citizenship status of their voters could be determined, and not send a ballot to anyone who had not yet received one.\n\"If you cannot implement this process by then, given the ongoing federal election, the United States will have no choice but to seek emergency relief,\" McCotter said in his letter.\nWeber's office, in a statement on Thursday, said, \"In July of this year, President Trump and DHS Secretary Markwayne Mullen made (still) unsubstantiated claims that California had 190,000 non-citizens on its voter rolls.\"\n\"Given the many high-profile examples of states purging US citizens from their voter rolls based on DHS/SAVE data, SOS immediately requested written information about their methodology and data sources to back up their claims,\" Weber's office said. \"They refused and provided California with nothing.\"\n\"Now the USDOJ, under threat of 'emergency' litigation, demands that California blindly trust this administration without any evidence or legal authority to justify its request.\"\nWeber, in a statement Thursday, said the DOJ's \"relentless efforts to unlawfully gain access to states' protected voter data and purge voter rolls serve only to cause chaos and fuel public distrust in our elections.\"\nShe also said that California \"has robust state law requirements that only U.S. citizens can register to vote and that any non-eligible registrants are removed from the State's voter rolls.\"\n\"My office and California election officials remain committed – as always – to ensuring a fair and smooth 2026 General Election,\" Weber said.\nCNBC has requested comment from Weber's office about the lawsuit.",

    "title": "The problem with 'good debt': Why borrowers should think twice about the label",
    "titleJa": "The problem with 'good debt': Why borrowers should think twice about the label",
    "summaryJa": "Mortgages and student loans are often called \"good debt.\" Experts say that label can hide the real question: Can you actually afford the risk?",
    "bodyOriginal": "When Bryanna Hambrick bought a three-bedroom, two-bathroom single-family home in Columbus, Ohio, in 2022, she hoped that life milestone would help her save money on rent and build wealth.\n\"Society puts a lot of pressure on you to have property, get married, have kids,\" said the 35-year-old. \"Life wasn't giving me those other things, so I was like, well, I can buy a home. I can control that.\"\nBut her purchase came with a monthly payment of nearly $1,200, about $200 more than expected, after a property tax reassessment and a higher-than-anticipated interest rate on her mortgage. Much of her savings went toward closing costs, Hambrick said, while expensive and unexpected home repairs have kept her living paycheck to paycheck in the years since.\n\"Anytime I've gotten a certain dollar amount in my savings that makes me feel a little bit more comfortable, something happens,\" Hambrick said.\nHambrick's experience highlights what experts say is a broader problem: Even debt that seems like a sound investment can become a financial burden.\nMortgages and student loans are often called \"good debt\" because they may help borrowers build wealth or increase their earning power. \"Bad debt,\" by contrast, often includes credit card balances as well as auto and personal loans, because they often finance consumption or assets that can lose value.\nBut financial experts say the \"good debt\" label can downplay the risk for borrowers and lead them to overextend themselves, making repayment challenging.\n\"I try to avoid talking about 'good debt' now,\" said Sheila Bair, an author and advisor who chaired the Federal Deposit Insurance Corporation from 2006 to 2011. \"I think your presumption should always be against debt ... it's a burden on your financial future, and there are a lot of ways it's marketed that make it look like it's not.\"\nLook beyond the 'good debt' label\nEven if a purchase seems to check all the boxes, you need to consider the long term. \"Young people shouldn't feel pressured to buy a home or borrow to go to college,\" said Bair, a member of the CNBC Global Financial Wellness Advisory Board and former president of Washington College. \"It's a decision that needs to make sense for you financially, and for some people, it won't.\"\nShe recommends asking yourself whether taking on debt will improve your financial well-being. Then dig into the details.\nFor example, whether a mortgage is financially sound depends on factors including the home price, loan terms, and the borrower's income stability and financial reserves.\nExperts say you should do your own calculations to figure out how much mortgage payment you feel comfortable with. Don't expect lenders to tell you how much house you can afford; mortgage companies consider what you can repay, not what's in your budget.\n\"Make sure your mortgage is affordable before you do anything else, and make sure you're going to be there for many years, because home prices over time will appreciate in value, but they go up and down,\" said Bair. She recommends planning to live in the home for at least five years to account for transaction costs and the possibility of short-term price declines.\nThe housing crash that precipitated the 2008 financial crisis shows how debt commonly viewed as \"good\" can go bad. Average U.S. home prices rose sharply between 1998 and 2006 as mortgage lending expanded, including to borrowers with weaker credit. Some borrowers took on large mortgages, betting that home values would keep rising.\n\"A lot of the folks that had those subprime mortgages didn't understand what they were getting,\" said Bair.\nWhen home prices fell and payments rose on some adjustable-rate mortgages, foreclosures surged. There were about 3.8 million foreclosures between 2007 and 2010, according to an analysis by the Federal Reserve Bank of Chicago.\nWhy even 'good' debt can become a mistake\nBeyond the fundamentals such as interest rates and repayment terms, borrowers should examine their motivations and expectations before taking on debt, said Brad Klontz, a financial psychologist and certified financial planner.\nMany people get tripped up by impulse borrowing, tying self-worth to big purchases, and too-rosy expectations about future earnings, he said.\n\"We have some chronic debt mistakes that we're all vulnerable to,\" said Klontz, who is a member of the CNBC Financial Advisor Council and the CNBC Global Financial Wellness Advisory Board.\nHe recommends people approach debt as a business decision — and temper their expectations. If, say, buying a home or getting a master's degree has the potential to generate wealth, don't automatically assume it will; consider the risk and return on that investment, he said.\nMake sure your assumptions aren't overly optimistic. For example, when considering education spending, research potential careers and salaries in the government's Occupational Outlook Handbook. Then work backward and ask: \"Does it make sense for me to take on student loan debt to get a degree? Do you even need a degree?\" Klontz said.\nAvoid emotional borrowing to fund a lifestyle, impress others, or pay for short-term experiences, said Klontz.\n\"If you're taking on debt to travel, that is a financial mistake,\" Klontz said. Instead, he suggests planning and saving for travel experiences. \"A lot of times, when people are overspending or taking on debt for a vacation, it's somewhat of an impulse purchase.\" That can lead to long-term regret, he said, \"because you're having that emotional experience, and then you come back home to reality, and now you're stuck with the chronic stress of trying to pay that off.\"\nKlontz said one of the biggest mistakes he sees people make is buying the \"absolute biggest, best house [they] can possibly afford.\"\n\"Even people who are really wise with money fall into that mistake,\" Klontz said. They may overestimate their ability to make more money in the future and underestimate how much they will spend on repairs and maintenance, he said.\nHambrick said she wishes she had focused more on the cost of the home than the hardwood floors and granite countertops. \"Your first house doesn't have to be your forever home,\" she said.\nHambrick's home value has appreciated, but not as much as she expected. \"It feels like bad debt, bad decision overall,\" she said.\n— CNBC's Nathaniel Lee contributed reporting.",

ate how much they will spend on repairs and maintenance, he said.\nHambrick said she wishes she had focused more on the cost of the home than the hardwood floors and granite countertops. \"Your first house doesn't have to be your forever home,\" she said.\nHambrick's home value has appreciated, but not as much as she expected. \"It feels like bad debt, bad decision overall,\" she said.\n— CNBC's Nathaniel Lee contributed reporting.",

    "id": "banks-say-healey-is-planning-budget-tax-7aa1f494",
    "title": "Banks say Healey is planning Budget tax raid on their profits",
    "titleJa": "Banks say Healey is planning Budget tax raid on their profits",
    "summaryJa": "Senior banking executives have told the BBC they expect to be \"on the menu\" in the chancellor's Budget tax later this month.",
    "bodyOriginal": "Banks say Healey is planning Budget tax raid on their profits\n- Published\nSenior banking executives have told the BBC they expect the sector to be \"on the menu\" when the chancellor announces his Budget in two weeks' time.\nJohn Healey has described the banks as part of \"the crown jewels\" of the UK economy, yet has refused to rule out a raid on the sector.\nThe biggest four banks collectively made around £15bn profit in the first six months of this year, leading to calls from trade unions and others for additional taxes.\nHowever, the banking sector trade body, UK Finance, warned that \"further increases in bank taxes would weaken competitiveness, discourage investment and job creation, and work against the government's ambition to deliver growth in every postcode\".\nThe UK's biggest banks and building societies currently pay a surcharge of 3% on top of the baseline 25% rate of corporation tax, plus a levy on the assets held on their balance sheets.\nThe sector contributed nearly £40bn to the Treasury last year, if income tax on employees is factored in.\nThe bank levy generated £1.4bn last year and the surcharge a further £1.2bn.\nThere are a number of ways the chancellor could extract more money from the sector.\nThe 3% surcharge was reduced from 8% under Rishi Sunak, at the same time as he raised corporation tax from 19% to 25%. Returning the surcharge to its previous level could raise around £2bn a year.\nThe bank levy currently charges 0.1% on outstanding short-term loans and 0.05% on longer-dated loans, although mortgages are excluded from the calculation.\nIn the past banks have successfully argued that higher taxes would risk making the UK uncompetitive with other jurisdictions and would reduce their ability to lend, and therefore be anti-growth.\nIn truth, banks were pleasantly surprised they were not hit at the last Budget, given the large profits they have been making in recent years. Rising interest rates have expanded the margin between the rate at which they lend to customers and the rate they pay savers.\nThere is another option that has been discussed with Treasury officials. Currently banks can use losses from the past to offset against profits - thereby reducing their tax bill in any given year. Lloyds in particular has been a beneficiary of this policy, as large losses from the financial crisis have been used to lower tax bills ever since.\nSome analysts and bank executives have pushed the idea of a moratorium on this practice for a few years, which would yield an estimated extra £1bn per year for the Treasury. That would provide a windfall while being \"a lot more bearable\", in the words of one bank executive.\nIt would also spare foreign banks from an additional hit, including JP Morgan, whose chief executive Jamie Dimon has warned that the UK already has one of the highest tax burdens on banks in the world. He warned that adding further sector-specific taxes could discourage investment and damage competitiveness.\nHowever, industry leaders say any form of tax rise that hits UK banks and exempts foreign banks' operations in the UK would be hard to square with the government's push to back British business.\nWhatever form it takes, banks believe the chancellor now has much more of an appetite to take a larger slice of their pie.\nGet in touch\nDo you have comments or questions about this story? Get in touch.\nRelated topics\n- Published27 September\n- Published7 hours ago",
    "bodyJa": "Banks say Healey is planning Budget tax raid on their profits\n- Published\nSenior banking executives have told the BBC they expect the sector to be \"on the menu\" when the chancellor announces his Budget in two weeks' time.\nJohn Healey has described the banks as part of \"the crown jewels\" of the UK economy, yet has refused to rule out a raid on the sector.\nThe biggest four banks collectively made around £15bn profit in the first six months of this year, leading to calls from trade unions and others for additional taxes.\nHowever, the banking sector trade body, UK Finance, warned that \"further increases in bank taxes would weaken competitiveness, discourage investment and job creation, and work against the government's ambition to deliver growth in every postcode\".\nThe UK's biggest banks and building societies currently pay a surcharge of 3% on top of the baseline 25% rate of corporation tax, plus a levy on the assets held on their balance sheets.\nThe sector contributed nearly £40bn to the Treasury last year, if income tax on employees is factored in.\nThe bank levy generated £1.4bn last year and the surcharge a further £1.2bn.\nThere are a number of ways the chancellor could extract more money from the sector.\nThe 3% surcharge was reduced from 8% under Rishi Sunak, at the same time as he raised corporation tax from 19% to 25%. Returning the surcharge to its previous level could raise around £2bn a year.\nThe bank levy currently charges 0.1% on outstanding short-term loans and 0.05% on longer-dated loans, although mortgages are excluded from the calculation.\nIn the past banks have successfully argued that higher taxes would risk making the UK uncompetitive with other jurisdictions and would reduce their ability to lend, and therefore be anti-growth.\nIn truth, banks were pleasantly surprised they were not hit at the last Budget, given the large profits they have been making in recent years. Rising interest rates have expanded the margin between the rate at which they lend to customers and the rate they pay savers.\nThere is another option that has been discussed with Treasury officials. Currently banks can use losses from the past to offset against profits - thereby reducing their tax bill in any given year. Lloyds in particular has been a beneficiary of this policy, as large losses from the financial crisis have been used to lower tax bills ever since.\nSome analysts and bank executives have pushed the idea of a moratorium on this practice for a few years, which would yield an estimated extra £1bn per year for the Treasury. That would provide a windfall while being \"a lot more bearable\", in the words of one bank executive.\nIt would also spare foreign banks from an additional hit, including JP Morgan, whose chief executive Jamie Dimon has warned that the UK already has one of the highest tax burdens on banks in the world. He warned that adding further sector-specific taxes could discourage investment and damage competitiveness.\nHowever, industry leaders say any form of tax rise that hits UK banks and exempts foreign banks' operations in the UK would be hard to square with the government's push to back British business.\nWhatever form it takes, banks believe the chancellor now has much more of an appetite to take a larger slice of their pie.\nGet in touch\nDo you have comments or questions about this story? Get in touch.\nRelated topics\n- Published27 September\n- Published7 hours ago",

    "id": "russia-accuses-ukraine-of-attacking-oil-5ab7ecc0",
    "title": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume",
    "titleJa": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume",
    "summaryJa": "Ukraine's president says a pause on striking energy sites is over following fresh Russian attacks.",
    "bodyOriginal": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume\n- Published\nRussia has accused Ukraine of attacking an oil refinery after Volodymyr Zelensky said such strikes, halted at the request of the US, would resume.\nUkraine's president said he had restricted attacks for three days while Russia had continued striking Ukrainian energy infrastructure. \"We're done,\" he told the Financial Times, external.\nZelensky also accused the US of withdrawing intelligence-sharing on Russian strikes to pressure Kyiv into ending attacks altogether after it struck a deal to import Russian diesel, and he said curbs on Starlink satellite services used by Ukraine's military were deliberate.\nUkrainian defence sources told the BBC some Starlink functionality had resumed as of Thursday morning.\nThey said its military service Starshield's \"operation while on the move\" had been restored, although it remains unclear whether the restrictions to the speed at which drones could fly while still maintaining Starlink internet connection have been fully lifted.\nOfficials were still working to clarify \"the reasons and circumstances\" behind the move, the sources added.\nIn a separate development, seven people are missing after a drone attack set a chemical tanker on fire off Romania, according to naval officials. Moscow said it had hit two cargo ships with military cargo heading to Ukraine's Odesa port, without naming them.\nWhy is Starlink internet so important on the battlefield in Ukraine?\n- Published5 hours ago\nEight crew missing after drone attack leaves tanker ablaze off Romania's coast\n- Published2 hours ago\nThe Kremlin said Kyiv had \"attempted a large-scale attack\" on a refinery south of Moscow early on Thursday.\nAccording to Russia's defence ministry, four missiles and dozens of drones were intercepted and the falling debris caused a fire at the site in Ryazan.\nPresident Vladimir Putin said Kyiv had also tried to hit refineries on Wednesday - which Ukraine has denied - and had not caused \"significant damage\" so far.\nZelensky said dozens of Ukrainian cities had come under Russian attack in the past day.\nHe previously said he would agree to the \"energy ceasefire\" announced by US President Donald Trump on Sunday if Moscow also abided by it.\nBut he accused Russia of ignoring the proposed deal within hours of it being announced, with strikes leaving hundreds of thousands of Ukrainians without power. The Kremlin never said it had agreed to the deal.\nZelensky agreed that he felt betrayed by the US when asked by Piers Morgan on Wednesday night, after Washington appeared to withdraw key elements of its support.\nEuropean leaders have rallied around the Ukrainian president. Italy's Defence Minister Guido Crosetto told the BBC that the US restricting its intelligence-sharing with Kyiv would be a \"complete mistake\".\n\"Because it is a fundamental form of support. This means denying a country any chance of defending itself.\"\nHe added: \"Peace will be achieved when Putin will be convinced that there is a stalemate... that he cannot advance anymore. But if he sees a weakness on the Ukrainian front, if the United States takes its resources away, then Putin will think he can win, and so he will continue the war.\"\nZelensky met Nato chief Mark Rutte as a two-day summit of European leaders began in Brussels on Thursday. The head of the military alliance said they had discussed \"the importance of implementing an energy ceasefire as well as Nato allies' continuous support for Ukraine\".\nZelensky told the FT that Ukrainian officials had been told by US counterparts that \"if you will not stop [the strikes], we will block intelligence\".\nUkraine's military relies on US early-warning alerts of incoming Russian aerial attacks to mount air defences, limiting successful strikes, while Starlink internet links are used throughout its war effort to guide drones and protect its skies.\nThere were suggestions a technical glitch was to blame for the sudden Starlink restrictions on Tuesday evening, but owner Elon Musk appeared to deny this and suggested it was the Trump administration's doing.\n\"It was not a technical problem, it was the will,\" Zelensky told the FT.\nTrump has denied halting intelligence-sharing. Starlink's sister service Starshield is provided to Ukraine under a US defence department contract. The BBC has approached the US authorities for comment.\nZelensky spoke to the FT during a visit to London on Wednesday which also included a meeting with Prime Minister Andy Burnham in Downing Street - who announced the UK would speed up delivery of lightweight multirole missiles to Kyiv.\nThe Ukrainian president told the newspaper he would now only halt strikes on Russian oil infrastructure - which Kyiv says are vital to cutting off revenue streams to its war machine - if the US supplied more Patriot air defence missiles.\nUkraine has suffered a shortage of the US-made defences since the outbreak of the Iran war consumed stockpiles.\nStriking a more defiant tone than recently, the Ukrainian president told the newspaper his American counterpart had an affinity for autocratic leaders like Putin.\nHe said it was not up to him to mend US-Ukrainian relations given the events of the past week: \"We didn't destroy any relationship.\"\nTensions have previously frayed between the two leaders. After returning to the White House last year, the pair shared a fiery Oval Office meeting in which Trump implied Zelensky was the main block to a peace deal.\nZelensky has since walked a careful diplomatic line, showing willingness towards US-brokered deals while stressing that the terms of any peace deal must be just.\nBut he criticised the agreement between Russia and the US to release 300,000 tonnes of diesel to the US and global marketplace, struck last week, as the US effectively investing in Russia's war effort.\nThat deal was the latest effort by Trump to lower fuel prices in the US ahead of the midterm elections, after months spent grappling with the political consequences of the Iran war, which has sent fuel costs skyrocketing.\nZelensky told the FT: \"The question will be: when will the next deal be? Maybe it will be gas. Definitely it will be gas.\"\nWith Russia continuing to strike Ukraine, Zelensky suggested the disruptions to US support was no coincidence.\nLocal officials report at least 13 people were killed across Ukraine on Wednesday in what Zelensky called a \"constant\", large-scale Russian attack. He said more than 850 drones had been launched at dozens of cities and communities.\nAt least three people were killed in the central region of Kirovohrad as it suffered its largest attack since Russia's full-scale invasion began in 2022, officials there said, with nearly 360 drones launched during a 10-hour barrage. Deaths were also reported in Donetsk, Kherson and Volyn.\n\"It is clear that Russia deliberately escalated these attacks, taking advantage of the easing of sanctions and seeing attempts to pressure Ukraine,\" Zelensky wrote on social media.\n- Published2 days ago",
    "bodyJa": "Russia accuses Ukraine of attacking oil refinery after Zelensky says strikes to resume\n- Published\nRussia has accused Ukraine of attacking an oil refinery after Volodymyr Zelensky said such strikes, halted at the request of the US, would resume.\nUkraine's president said he had restricted attacks for three days while Russia had continued striking Ukrainian energy infrastructure. \"We're done,\" he told the Financial Times, external.\nZelensky also accused the US of withdrawing intelligence-sharing on Russian strikes to pressure Kyiv into ending attacks altogether after it struck a deal to import Russian diesel, and he said curbs on Starlink satellite services used by Ukraine's military were deliberate.\nUkrainian defence sources told the BBC some Starlink functionality had resumed as of Thursday morning.\nThey said its military service Starshield's \"operation while on the move\" had been restored, although it remains unclear whether the restrictions to the speed at which drones could fly while still maintaining Starlink internet connection have been fully lifted.\nOfficials were still working to clarify \"the reasons and circumstances\" behind the move, the sources added.\nIn a separate development, seven people are missing after a drone attack set a chemical tanker on fire off Romania, according to naval officials. Moscow said it had hit two cargo ships with military cargo heading to Ukraine's Odesa port, without naming them.\nWhy is Starlink internet so important on the battlefield in Ukraine?\n- Published5 hours ago\nEight crew missing after drone attack leaves tanker ablaze off Romania's coast\n- Published2 hours ago\nThe Kremlin said Kyiv had \"attempted a large-scale attack\" on a refinery south of Moscow early on Thursday.\nAccording to Russia's defence ministry, four missiles and dozens of drones were intercepted and the falling debris caused a fire at the site in Ryazan.\nPresident Vladimir Putin said Kyiv had also tried to hit refineries ions a technical glitch was to blame for the sudden Starlink restrictions on Tuesday evening, but owner Elon Musk appeared to deny this and suggested it was the Trump administration's doing.\n\"It was not a technical problem, it was the will,\" Zelensky told the FT.\nTrump has denied halting intelligence-sharing. Starlink's sister service Starshield is provided to Ukraine under a US defence department contract. The BBC has approached the US authorities for comment.\nZelensky spoke to the FT during a visit to London on Wednesday which also included a meeting with Prime Minister Andy Burnham in Downing Street - who announced the UK would speed up delivery of lightweight multirole missiles to Kyiv.\nThe Ukrainian president told the newspaper he would now only halt strikes on Russian oil infrastructure - which Kyiv says are vital to cutting off revenue streams to its war machine - if the US supplied more Patriot air defence missiles.\nUkraine has suffered a shortage of the US-made defences since the outbreak of the Iran war consumed stockpiles.\nStriking a more defiant tone than recently, the Ukrainian president told the newspaper his American counterpart had an affinity for autocratic leaders like Putin.\nHe said it was not up to him to mend US-Ukrainian relations given the events of the past week: \"We didn't destroy any relationship.\"\nTensions have previously frayed between the two leaders. After returning to the White House last year, the pair shared a fiery Oval Office meeting in which Trump implied Zelensky was the main block to a peace deal.\nZelensky has since walked a careful diplomatic line, showing willingness towards US-brokered deals while stressing that the terms of any peace deal must be just.\nBut he criticised the agreement between Russia and the US to release 300,000 tonnes of diesel to the US and global marketplace, struck last week, as the US effectively investing in Russia's war effort.\nThat deal was the latest effort by Trump to lower fuel prices in the US ahead of the midterm elections, after months spent grappling with the political consequences of the Iran war, which has sent fuel costs skyrocketing.\nZelensky told the FT: \"The question will be: when will the next deal be? Maybe it will be gas. Definitely it will be gas.\"\nWith Russia continuing to strike Ukraine, Zelensky suggested the disruptions to US support was no coincidence.\nLocal officials report at least 13 people were killed across Ukraine on Wednesday in what Zelensky called a \"constant\", large-scale Russian attack. He said more than 850 drones had been launched at dozens of cities and communities.\nAt least three people were killed in the central region of Kirovohrad as it suffered its largest attack since Russia's full-scale invasion began in 2022, officials there said, with nearly 360 drones launched during a 10-hour barrage. Deaths were also reported in Donetsk, Kherson and Volyn.\n\"It is clear that Russia deliberately escalated these attacks, taking advantage of the easing of sanctions and seeing attempts to pressure Ukraine,\" Zelensky wrote on social media.\n- Published2 days ago",

    "title": "International Energy Agency to release more than 20 million barrels of diesel as soon as possible",
    "titleJa": "International Energy Agency to release more than 20 million barrels of diesel as soon as possible",
    "summaryJa": "The Trump administration pushed Europe to release diesel stocks as prices in the U.S. surged to record highs in September.",
    "bodyOriginal": "International Energy Agency members have agreed to release more than 20 million barrels of diesel \"as soon as possible\" as fuel prices surge globally, the group said in a statement Thursday.\nPresident Donald Trump said earlier this month that Europe had agreed to deploy a \"massive amount of their heavily stocked Diesel Oil.\" The release detailed by the IEA on Thursday is equivalent to less than one day of global diesel demand or slightly more than five days of U.S. consumption.\nThe IEA did not specify a timeline for the release in its Thursday statement. The Group of Seven nations led by France said on Oct. 2 that they would deploy substantial diesel stocks over 20 days. If that is the IEA's timeline, its members would supply about 1 million barrels each day for almost three weeks.\nDiesel futures are trading more than 1% lower Thursday at $4.86.\nThe IEA, headquartered in Paris, has more than 30 member states, including the U.S. and key European and Asian allies. The agency, created in 1974 in the wake of the Arab oil embargo, is tasked with maintaining energy security by deploying oil stockpiles in response to crises like the wars in the Middle East and Eastern Europe.\nThe Trump administration has pushed Europe to release diesel inventories as prices in the U.S. surged to record highs in September. The retail price of diesel stood at an average $6.32 per gallon Thursday, more than 70% above the same period last year, according to AAA.\nTrump is facing political pressure to address fuel prices ahead of the U.S. midterm elections on Nov. 3. The president struck a diesel deal with Russia last week that analysts have said will do little to reduce prices.\nThe G7 nations, led by France, announced earlier this month that they would deploy stocks through the IEA in response to the diesel crisis but did not give specific quantities.\nThe IEA release does \"not solve the basic problem which is how to increase production at refineries which are damaged in the Middle East or Russia, and operating at capacity in the USA,\" said Andy Lipow, president of Lipow Oil Associates.\nPrices have surged as Ukraine has pounded Russian refineries and Iran and its Houthi allies have attacked energy facilities around the Persian Gulf.\nIEA members agreed in March to deploy 400 million barrels of oil in response to the global supply disruption triggered by the Iran war. They have since agreed to release the remaining 100 million barrels pledged in March \"in a timely manner consistent with national circumstances,\" the group said Thursday.\nIEA's governing board said 330 million barrels have been released so far. Some members have deployed more than they originally pledged so the total release will exceed the 400 million barrels agreed in March.",
    "bodyJa": "International Energy Agency members have agreed to release more than 20 million barrels of diesel \"as soon as possible\" as fuel prices surge globally, the group said in a statement Thursday.\nPresident Donald Trump said earlier this month that Europe had agreed to deploy a \"massive amount of their heavily stocked Diesel Oil.\" The release detailed by the IEA on Thursday is equivalent to less than one day of global diesel demand or slightly more than five days of U.S. consumption.\nThe IEA did not specify a timeline for the release in its Thursday statement. The Group of Seven nations led by France said on Oct. 2 that they would deploy substantial diesel stocks over 20 days. If that is the IEA's timeline, its members would supply about 1 million barrels each day for almost three weeks.\nDiesel futures are trading more than 1% lower Thursday at $4.86.\nThe IEA, headquartered in Paris, has more than 30 member states, including the U.S. and key European and Asian allies. The agency, created in 1974 in the wake of the Arab oil embargo, is tasked with maintaining energy security by deploying oil stockpiles in response to crises like the wars in the Middle East and Eastern Europe.\nThe Trump administration has pushed Europe to release diesel inventories as prices in the U.S. surged to record highs in September. The retail price of diesel stood at an average $6.32 per gallon Thursday, more than 70% above the same period last year, according to AAA.\nTrump is facing political pressure to address fuel prices ahead of the U.S. midterm elections on Nov. 3. The president struck a diesel deal with Russia last week that analysts have said will do little to reduce prices.\nThe G7 nations, led by France, announced earlier this month that they would deploy stocks through the IEA in response to the diesel crisis but did not give specific quantities.\nThe IEA release does \"not solve the basic problem which is how to increase production at refineries which are damaged in the Middle East or Russia, and operating at capacity in the USA,\" said Andy Lipow, president of Lipow Oil Associates.\nPrices have surged as Ukraine has pounded Russian refineries and Iran and its Houthi allies have attacked energy facilities around the Persian Gulf.\nIEA members agreed in March to deploy 400 million barrels of oil in response to the global supply disruption triggered by the Iran war. They have since agreed to release the remaining 100 million barrels pledged in March \"in a timely manner consistent with national circumstances,\" the group said Thursday.\nIEA's governing board said 330 million barrels have been released so far. Some members have deployed more than they originally pledged so the total release will exceed the 400 million barrels agreed in March.",

    "id": "banks-with-jeffrey-epstein-ties-eyed-by-d2b62806",
    "title": "Banks with Jeffrey Epstein ties eyed by Democrats Warren and Garcia",
    "titleJa": "Banks with Jeffrey Epstein ties eyed by Democrats Warren and Garcia",
    "summaryJa": "Sen. Elizabeth Warren and Rep. Robert Garcia are leading new legislation to force banks and some executives to release records related to Jeffrey Epstein.",
    "bodyOriginal": "Financial institutions and bank executives that may have aided the late financier Jeffrey Epstein's sex trafficking operation are in the sights of a bipartisan group of lawmakers.\nLegislation introduced Thursday — and led by Sen. Elizabeth Warren, D-Mass., and Rep. Robert Garcia, D-Calif. — would require financial regulators to produce records related to Epstein, compel those regulators to investigate banks and executives with ties to the deceased convicted sex offender, and require industry bans and civil penalties for those found to have aided him.\n\"I have spent the last year calling on Donald Trump's financial regulators to launch investigations into the big banks and executives who may have enabled Jeffrey Epstein's horrific crimes,\" Warren, who leads the Senate banking committee's Democrats, said in a statement. \"Since they have failed to act, Congress must. The bipartisan Epstein Wall Street Records Act will ensure overdue accountability for the wealthy and well-connected on Wall Street who put profits over people.\"\nThe legislation is co-led in the House by Reps. Ro Khanna, D-Calif., Thomas Massie, R-Ky., and Raja Krishnamoorthi, D-Ill. Sens. Richard Blumenthal, D-Conn., Ron Wyden, D-Ore., and Ben Ray Lujan, D-N.M., signed on to the Senate version. The House version has 17 Democratic co-sponsors.\nThe proposal would apply to the Federal Reserve, Federal Deposit Insurance Corporation, Treasury's Office of the Comptroller of the Currency and the Securities and Exchange Commission. A spokesperson for the Federal Reserve declined to comment. Spokespeople for the other regulators did not immediately respond to requests for comment.\nSince the start of Trump's second term, Democrats and a small group of Republicans have pressed the president to release records related to Epstein and to investigate the individuals and businesses associated with him.\nWarren has sought answers from Barclays, Goldman Sachs, and JP Morgan Chase on their connections to Epstein. And Wyden, in his capacity as the top Democrat on the Senate Finance Committee, released an investigation in August that found \"significant evidence that JPMorgan, Deutsche Bank, and Bank of America violated federal anti-money laundering laws by failing to screen and report Epstein's suspicious financial transactions in a timely manner.\"\nGoldman Sachs and JP Morgan Chase both declined to comment on Thursday. Barclays did not immediately respond to a request for comment.\nThe fallout from the Epstein files has been politically perilous for Republicans, who largely opposed an effort, led by Massie and Khanna, to force a vote to release the documents. After Trump belatedly signaled his support for the legislation, the Epstein Files Transparency Act passed both chambers of Congress with near unanimity and was signed into law in November 2025. The legislation was meant to force the Department of Justice to release its records related to Epstein.\nBut ahead of November's midterm election, Democrats in recent weeks have ramped up campaign ads hitting their GOP opponents for past opposition to releasing the Epstein files. And those who advocated for public disclosure of the files have continued to push for accountability in Washington and on Wall Street.\n\"The Epstein Files Transparency Act forced the Attorney General to release DOJ, FBI, and U.S. Attorney's Offices' files. This bill does the same for bank regulators. Justice for the survivors means following the money,\" Massie, who had a falling out with Trump over his effort to release the Epstein files, said in a statement.",
    "bodyJa": "Financial institutions and bank executives that may have aided the late financier Jeffrey Epstein's sex trafficking operation are in the sights of a bipartisan group of lawmakers.\nLegislation introduced Thursday — and led by Sen. Elizabeth Warren, D-Mass., and Rep. Robert Garcia, D-Calif. — would require financial regulators to produce records related to Epstein, compel those regulators to investigate banks and executives with ties to the deceased convicted sex offender, and require industry bans and civil penalties for those found to have aided him.\n\"I have spent the last year calling on Donald Trump's financial regulators to launch investigations into the big banks and executives who may have enabled Jeffrey Epstein's horrific crimes,\" Warren, who leads the Senate banking committee's Democrats, said in a statement. \"Since they have failed to act, Congress must. The bipartisan Epstein Wall Street Records Act will ensure overdue accountability for the wealthy and well-connected on Wall Street who put profits over people.\"\nThe legislation is co-led in the House by Reps. Ro Khanna, D-Calif., Thomas Massie, R-Ky., and Raja Krishnamoorthi, D-Ill. Sens. Richard Blumenthal, D-Conn., Ron Wyden, D-Ore., and Ben Ray Lujan, D-N.M., signed on to the Senate version. The House version has 17 Democratic co-sponsors.\nThe proposal would apply to the Federal Reserve, Federal Deposit Insurance Corporation, Treasury's Office of the Comptroller of the Currency and the Securities and Exchange Commission. A spokesperson for the Federal Reserve declined to comment. Spokespeople for the other regulators did not immediately respond to requests for comment.\nSince the start of Trump's second term, Democrats and a small group of Republicans have pressed the president to release records related to Epstein and to investigate the individuals and businesses associated with him.\nWarren has sought answers from Barclays, Goldman Sachs, and JP Morgan Chase on their connections to Epstein. And Wyden, in his capacity as the top Democrat on the Senate Finance Committee, released an investigation in August that found \"significant evidence that JPMorgan, Deutsche Bank, and Bank of America violated federal anti-money laundering laws by failing to screen and report Epstein's suspicious financial transactions in a timely manner.\"\nGoldman Sachs and JP Morgan Chase both declined to comment on Thursday. Barclays did not immediately respond to a request for comment.\nThe fallout from the Epstein files has been politically perilous for Republicans, who largely opposed an effort, led by Massie and Khanna, to force a vote to release the documents. After Trump belatedly signaled his support for the legislation, the Epstein Files Transparency Act passed both chambers of Congress with near unanimity and was signed into law in November 2025. The legislation was meant to force the Department of Justice to release its records related to Epstein.\nBut ahead of November's midterm election, Democrats in recent weeks have ramped up campaign ads hitting their GOP opponents for past opposition to releasing the Epstein files. And those who advocated for public disclosure of the files have continued to push for accountability in Washington and on Wall Street.\n\"The Epstein Files Transparency Act forced the Attorney General to release DOJ, FBI, and U.S. Attorney's Offices' files. This bill does the same for bank regulators. Justice for the survivors means following the money,\" Massie, who had a falling out with Trump over his effort to release the Epstein files, said in a statement.",

    "id": "trump-calls-off-livestream-of-fort-hood-88a3d733",
    "title": "Trump calls off livestream of Fort Hood attacker's execution by firing squad",
    "titleJa": "Trump calls off livestream of Fort Hood attacker's execution by firing squad",
    "summaryJa": "Trump said some would \"rather not watch\" the killing of Nidal Hasan, the first military execution in over 60 years.",
    "bodyOriginal": "Trump calls off livestream of Fort Hood attacker's execution by firing squad\n- Published\nUS President Donald Trump has called off plans to livestream the execution of former US army psychiatrist Nidal Hasan by firing squad.\nTrump had previously said he approved of showing the death of the Fort Hood attacker, while Vice-President JD Vance cast doubt on whether it would happen and said he would not watch it.\nTrump's decision to cancel the livestream came after widespread criticism in the US and globally. On Thursday, he said that \"many very good and well meaning people would rather not watch him die\".\n\"I think streaming the execution for all to see might have been a strong deterrent for the World to witness how America deals with Terrorists and SCUM like Hasan,\" Trump said.\n\"He will die, as scheduled, by firing squad, but this event will not be streamed,\" the president added.\nHasan fatally shot 13 unarmed US soldiers at a military base in Texas in 2009, injuring another 32. His execution by firing squad will be the first military execution in more than 60 years.\nTrump said the families of the victims can still view the execution in person if they wish.\n\"They deserve to witness JUSTICE!\" he said.\nAfter the Pentagon announced last week that it would execute Hasan on 3 December 2026 by firing squad and livestream the event, a cascade of criticism quickly followed from human rights groups and many others. The United Nations called the plans \"abhorrent\".\nWhile there were more than 2,700 executions across 17 countries last year, only two nations carried them out publicly. According to Amnesty International, 11 public executions were known to have been carried out in Iran in 2025 and another six in Afghanistan.\nUS Defence Secretary Pete Hegseth defended his decision to air Hasan's execution online, saying that \"people need to understand that there's serious consequences for these types of things\".\nBut as criticism mounted, Trump appeared to hedge his support, saying on Friday that he \"absolutely\" approved of the livestream plan, but adding that the Pentagon was still \"making a determination\" on it.\nThe president also called Hasan \"totally nuts\".\n\"I really don't care how he goes, as long as he goes, and I think that the death penalty is a very worthy way of going for him,\" he said.\nJohn Galligan, a lawyer for Hasan working primarily on civil issues, told the BBC that Trump's decision to cancel the livestream of his execution \"comes as no surprise\".\n\"It was initially a dumb decision and statement by Hegseth to livestream any execution - and it violated the Army's own regulation,\" Galligan said.\nHe said Hasan is paralysed from the chest down, something that Trump \"allegedly didn't even know\" when he approved the livestream plan.\n\"The damage has already been done - the Army is now just trying to clean up the mess,\" Galligan said. \"It will permanently remain a stain on our military justice system.\"\nHe added that it was not clear if Hasan was aware yet of Trump's \"reversal\" of the livestream decision.\nHasan opened fire in a crowded medical building where deploying soldiers were awaiting check-ups and vaccines.\nHe later admitted in court that he was the gunman and apologised for \"any mistakes\". He said during his court-martial in 2013 that he believed he was protecting Muslims and the Taliban in Afghanistan from the US military.\nThe killings on 5 November 2009 were the deadliest ever non-combat attack on an American military base.\nUS military law requires that a military execution be approved by the US president. It also requires appellate review, when a higher court inspects the decision and gives a final judgement on its legality to move forward.\n- Published5 days ago\n- Published5 days ago",

    "id": "wholesale-prices-jumped-6-3-annually-in-e4800ca1",
    "title": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022",
    "titleJa": "Wholesale prices jumped 6.3% annually in September, biggest gain since 2022",
    "summaryJa": "September producer prices were expected to increase 0.6% month over month and 5.5% annually, according to the consensus estimate by Dow Jones.",
    "bodyOriginal": "September's producer price index came in much hotter than economists forecast on Thursday, underscoring the continued inflationary pressure from energy amid the U.S. war with Iran.\nThe measure of underlying inflation pressures climbed 1.3% in September and 6.3% on an annual basis, according to the Bureau of Labor Statistics. That marked the largest monthly and annual gains since March 2022 and December 2022, respectively.\nBoth readings topped expectations of economists polled by Dow Jones, who forecast an advance of 0.6% on the month and 5.5% annually.\nEnergy drove a sizable chunk of those increases as the Middle East conflict curtailed oil supply and sent prices surging. The so-called core PPI, which excludes volatile food and energy prices from the wholesaler inflation index, added 0.7% on the month and 5% over the 12-month period.\nBut there are signs that soaring energy prices are having downstream effects on other categories. The BLS said in Thursday's release that almost half of September's increase in processed goods for immediate demand was connected to the rise in diesel fuel prices.\nIt's the latest report in recent days showing that inflation continues to hit consumers and companies.\nWednesday's consumer price index release showed a rise of 0.6% from August to September and 3.7% on a 12-month basis. Economists polled by Dow Jones had forecast growth of 0.6% and 3.6%, respectively.\nExcluding food and energy, the core CPI added 0.3% on the month and 2.6% compared with a year ago. Economists anticipated increases of 0.2% and 2.5%, respectively.\nWednesday's Beige Book, a chronicle of economic activity published by the Federal Reserve, had the highest number of mentions of terms related to inflation on record, according to an analysis from Bespoke Investment Group.\nRetail sales grew 0.8% in September, surpassing the rate of 0.4% anticipated by economists, according to government data released in a separate report Thursday. That marked a slowdown from a month prior, when retail sales rose by more than 1%.\nExcluding spending on autos and gas stations, retail sales increased 0.25% from August to September, a drop from around 1.1% in the prior period. This slowdown offers a sign that high prices related to fuel are causing consumers to tighten the belt elsewhere.\nThis week's data has left a growing minority of fed funds futures traders expecting the central bank to raise rates at its meeting later this month. Traders are now pricing in a nearly 34% likelihood that the Fed hikes borrowing costs on Oct. 28, up from under 18% a week prior, according to CME's FedWatch tool. About 90% expect at least one hike by the end of the year.\n\"With a second day in a row of higher-than-expected inflation numbers, it seems the Fed will have no choice but to raise rates again this year,\" said Chris Zaccarelli, investing chief at Northlight Asset Management.\nThese reports offer some of the final insights into the pace of inflation in the U.S. ahead of the midterm election, which could impact how much power each political party has in Washington.",

lowdown from a month prior, when retail sales rose by more than 1%.\nExcluding spending on autos and gas stations, retail sales increased 0.25% from August to September, a drop from around 1.1% in the prior period. This slowdown offers a sign that high prices related to fuel are causing consumers to tighten the belt elsewhere.\nThis week's data has left a growing minority of fed funds futures traders expecting the central bank to raise rates at its meeting later this month. Traders are now pricing in a nearly 34% likelihood that the Fed hikes borrowing costs on Oct. 28, up from under 18% a week prior, according to CME's FedWatch tool. About 90% expect at least one hike by the end of the year.\n\"With a second day in a row of higher-than-expected inflation numbers, it seems the Fed will have no choice but to raise rates again this year,\" said Chris Zaccarelli, investing chief at Northlight Asset Management.\nThese reports offer some of the final insights into the pace of inflation in the U.S. ahead of the midterm election, which could impact how much power each political party has in Washington.",

    "id": "tsmc-chip-capacity-is-fierce-battlegroun-ee50a988",
    "title": "TSMC chip capacity is ‘fierce’ battleground for AI customers, amid record quarter",
    "titleJa": "TSMC chip capacity is ‘fierce’ battleground for AI customers, amid record quarter",
    "summaryJa": "TSMC had a record quarter, but it can't make chips for everyone as Nvidia, Apple, Broadcom and AMD fight for capacity.",
    "bodyOriginal": "As Taiwan Semiconductor Manufacturing Co.'s record quarter makes clear, demand from chipmakers shows no sign of slowing down. In fact, TSMC can't manufacture quickly enough.\nThe artificial intelligence boom has created unending need for space on factory lines at the world's leading chip manufacturer, and it could put a chokehold on the entire industry's ability to scale. Last year, TSMC said it had the capacity to make more than 17 million 12-inch equivalent wafers. But customers want more.\n\"The competition is extremely fierce,\" said Jordan Klein, an analyst at Mizuho Securities. \"It's a game of who can get the most leverage and supply.\"\nTSMC makes the vast majority of the world's most advanced semiconductors, the graphics processors and central processors from Nvidia, AMD and Broadcom that are necessary for running AI workloads. Now a growing number of tech firms – Apple, Google, Amazon, Microsoft, Meta and OpenAI – also rely on TSMC to make custom in-house AI accelerators.\nTSMC North American CEO Sajiv Dalal told CNBC he gets at least 10 calls a day about wafer capacity. TSMC posted record profit for a sixth straight quarter on Thursday and expects fourth-quarter revenue to be 58% higher than a year earlier, driven by strong demand for its advanced chipmaking technologies.\nIf compute demand continues to grow at the current rate over the next 12 to 18 months, Klein said capacity constraints at TSMC could threaten some of the industry's massive infrastructure investments and the \"aggressive revenue growth targets\" from the AI companies. U.S. hyperscalers are projecting well over $700 billion in capital expenditures this year, and analysts expect that figure to jump in 2027.\nAI ambitions are also threatened by a global shortage of memory chips. The logic chips that TSMC manufactures are more complex and expensive to produce. That means GPU and CPU leaders like Nvidia and AMD work out lengthy contracts and bespoke deals with TSMC behind closed doors years in advance. Nvidia CEO Jensen Huang and AMD CEO Lisa Su have both visited Taiwan multiple times this year.\nSid Sheth, CEO of AI chip startup D-Matrix, has fostered a relationship with TSMC for more than 20 years, and his company relies on TSMC to manufacture its processors. Sheth said that for TSMC customers, many roads lead to Kevin Zhang, a senior vice president of the Taiwanese company and a central figure in determining which chipmakers get access to its coveted factory lines.\nHe's \"currently probably the most popular person on the planet,\" Sheth said in an interview. Sheth said that Jerry Qubain, D-Matrix's vice president of manufacturing, has been visiting TSMC since 1992 and goes to Taiwan three to four times a year.\n\"This was even before Nvidia was founded,\" Sheth said. \"That's a good example of a person we brought on board because of the relationships he has at TSMC.\" Qubain joined D-Matrix in 2024. TSMC declined to participate in this story.\nBetting on startups\nTSMC had 534 customers in 2025. While it doesn't name or rank them, its top 10 customers accounted for 78% of net revenue, with its top two bringing in 19% and 17%, respectively.\nThat leaves startups competing for capacity against customers with far bigger orders. Sheth said TSMC is \"selective,\" but has an incentive to back promising newcomers.\n\"They were very supportive of Nvidia and Broadcom when they were very young companies, and now these are their biggest customers today,\" Sheth said. \"They want to see a repeat of that.\"\nTSMC is hustling to bring much more capacity online, with new fabs in Taiwan, Japan and Arizona — it's making advanced chips in the U.S. for the first time. In July, TSMC announced it was adding $100 billion and \"several more\" fabs to the six planned in Arizona, bringing its total commitment to $265 billion. TSMC is also reportedly considering an entirely new fab location in Texas.\nAll of this will take years to come online. In the meantime, analysts say TSMC is adding tools like ASML's extreme ultraviolet lithography machines to existing factories to ramp up capacity. ASML smashed profit expectations in its earnings report Wednesday and said customers are interested in placing orders through 2030.\nTSMC isn't the only option. Capacity constraints create an opening for the other two leading advanced chip manufacturers, Samsung and Intel, to win customers.\n\"People want a second source to be able to twist TSMC's arm and keep them honest on pricing,\" Dan Hutcheson, an analyst at TechInsights, told CNBC.\nThat second source might be Intel, the only U.S.-based advanced logic manufacturer. Although its foundry business has been struggling with delays and setbacks for years, Hutcheson says all the big chipmakers are now testing there.\nTrade association SEMI expects 102 new chip fabs will come online globally by 2029, including 15 in the U.S. and 78 in Asia. China is the primary growth engine, expected to nearly triple capacity by 2030. In a race to catch up, American fab investments are projected to more than double by 2029.\nWith an increasing Arizona presence and \"extremely fierce\" competition for wafer capacity, Klein says TSMC is \"one of the best strategically positioned companies on the face of the planet.\"\nWATCH: Breaking down AI chips, from Nvidia GPUs to ASICs by Google and Amazon",

    "id": "nandy-minded-to-intervene-in-sky-s-1-6bn-b74c797a",
    "title": "Nandy 'minded to intervene' in Sky's £1.6bn takeover of ITV entertainment arm",
    "titleJa": "Nandy 'minded to intervene' in Sky's £1.6bn takeover of ITV entertainment arm",
    "summaryJa": "The culture secretary says the deal could affect free expression in the media and the variety of Britain's news landscape.",
    "bodyOriginal": "Nandy 'minded to intervene' in Sky's £1.6bn takeover of ITV entertainment arm\n- Published\nCulture Secretary Lisa Nandy has said she is \"minded to intervene\" in the proposed £1.6bn deal for Sky to buy ITV's media and entertainment division.\nNandy said there were reasonable grounds to believe the deal could affect free expression in the media and the variety of Britain's news landscape.\nSky said it would \"carefully consider\" a letter from the culture secretary and \"engage constructively\" with the review into the deal.\n\"We remain confident that bringing Sky and ITV's media and entertainment business together will create a stronger British media,\" it said.\nITV welcomed the letter and said the deal would help it \"compete with global streaming platforms, benefiting viewers, advertisers and the UK creative industries\".\nThe two companies announced in July that Sky had agreed to buy ITV's broadcasting business, including its free-to-air TV channels and the ITV X streaming service.\nThe deal does not include ITV's production arm, ITV Studios, which makes popular programmes such as Love Island and I'm a Celebrity... Get Me Out of Here.\nIt would give Sky access to millions more viewers, while bosses hope it would help both compete with streaming giants such as Netflix.\nWhat Sky buying ITV could mean for your favourite shows\n- Published6 July\nBut Nandy has told Sky and ITV that she is considering issuing a public interest intervention notice (PIIN) to the Competition and Markets Authority (CMA) and regulator Ofcom, forcing an investigation into the tie-up.\nIn a letter to both companies, she said she was minded to order the probe to address public interest considerations including:\nThe need for free expression of opinion in news media\nThe need for a range of views in news media across the UK\nThe need for a range of people controlling the media across the UK\nThe need for a wide range of programmes to be offered across the UK\nThe letter said Nandy recognised Sky News and ITV News were two of the most prominent sources of television news in the UK, with a joint 26% share of those viewing news on linear TV.\nConsumers would still have access to other sources of news such as the BBC and Channel 4, it added.\nBut Nandy believes that, over time, the tie-up could undermine the range of views available to viewers, with 86% of the linear TV news market controlled by the BBC and Sky/ITV.\nThe North of England could be particularly hard hit as well as nations of the UK other than England and those from lower socio-economic backgrounds, the letter argued.\nThis is because their main source of news is broadcast news, it added.\nSky and ITV have been given until 20 October to respond to the culture secretary's concerns.\nA Sky spokesperson said: \"We have already made clear commitments to protect ITV's identity, its free-to-air services and public service broadcasting obligations, and to ensure ITV News and Sky News remain distinct editorial voices.\"\nAn ITV spokesperson said: \"We welcome the publication of the secretary of state's 'minded to' issue a public interest intervention notice letter as was expected and look forward to fully co-operating in the process.\n\"This is another important milestone in the regulatory review process towards creating a UK player with the scale and resources to better compete with global streaming platforms, benefiting viewers, advertisers and the UK creative industries.\"\nNandy's intervention would be made under a new public interest consideration.\nThis would need legislation to be brought forward, given that current laws do not cover the effect of a merger on streaming or on-demand programmes.\nShe said: \"If I decide to intervene on the basis of this new public interest consideration, I will bring forward legislation... to extend the application of the public interest consideration relating to the availability of a wide range of broadcasting to on-demand programmes.\"",

    "id": "southwest-is-overhauling-its-frequent-fl-6de51572",
    "title": "Southwest is overhauling its frequent flyer program. Here's what's changing",
    "titleJa": "Southwest is overhauling its frequent flyer program. Here's what's changing",
    "summaryJa": "Southwest Airlines is overhauling its loyalty program and replacing A-List and A-List Preferred with three new tiers.",
    "bodyOriginal": "Goodbye, A-List and A-List Preferred.\nSouthwest Airlines is scrapping its two-tier loyalty program starting next year and instead rolling out silver, gold and platinum levels that are similar to what other carriers offer, as the once-quirky airline seeks to increase revenue and reward its biggest spenders.\nSouthwest executives have been overhauling the airline, getting rid of longtime customer perks like two free checked bags and open seating. It's now charging for some of those options, like rivals have been doing for years.\nAlong with the shift from two to three loyalty levels, the carrier is also changing the names of its tiers. Under the old version, travelers could be classified into A-List or A-List Preferred, which was the higher level.\n\"If you think about A-List and A-List Preferred, we don't even have [boarding] groups A, B and C anymore,\" Tony Roach, Southwest chief customer and brand officer, said in an interview. \"So it was time to do a refresh to somewhat incorporate all the changes to seating and all these new experiences that we've been adding.\"\nHere's what's changing for the loyalty program:\n- A-List and A-List Preferred Rapid Rewards status levels will go away on Jan. 1.\n- A-List customers will be shifted to Silver status in the Rapid Rewards program. A-List Preferred members will get Gold status.\n- A new Platinum tier will be added for the airline's \"most engaged\" customers.\nCustomers can earn 1 Tier Qualifying Point, or TQP, per $1 spent on Southwest co-branded credit cards with Chase. Here are the new status requirements:\n- Silver status will require 35,000 TQPs or 25 qualifying flights. Previously, A-List was 35,000 points or 20 flights. For Silver members, the points-earning bonus on flights will go up from 25% to 40%.\n- To earn Gold, customers will have to reach 65,000 TQPs, down from 70,000 points for A-List Preferred, or take 50 flights. The points-earning bonus for those with that status goes from 100%, or double points earning, to 60% on qualifying flights.\n- The new, top-tier Platinum status requires 140,000 TQPs or 100 qualifying flights. Platinum members will get a 120% earnings bonus on qualifying flights.\nSilver status members will board in Group 1, while Gold members will board before Group 1. Platinum members will board before both Gold members and Group 1. Platinum tier also has unlimited Companion Pass trips.\nSouthwest's Companion Pass — which lets a designated person fly for free, minus taxes and fees, with a traveler who has that perk — is also changing.\nCompanion Pass holders that have them in their accounts will be able to hold onto them for the duration of their term. But starting with the 2027 earning year, Companion Pass benefits will be earned through TQPs or qualifying flights, by hitting a milestone reward or with Platinum status.\nCurrently, a Rapid Rewards member has to earn at least 135,000 qualifying points or 100 one-way flights to qualify for the pass.\nThe airline is also expanding its partnerships with international airlines and building its first airport lounges. Southwest on Thursday offered a peek into the new lounges, which it has named Icon, and is working on with its credit card partner, Chase. The carrier is building Icon lounges in four cities around the U.S., with others in the works.\nSouthwest is also adding benefits for customers that are in between status tiers, similar to what American Airlines offers.\nFor example, after earning 20,000 points or taking 15 qualifying flights, customers can choose between 2,000 more Rapid Rewards points or two coupons to select a \"preferred\" seat, which is a standard legroom seat that's closer to the front of the plane or a more popular aisle or window seat.\nCustomers will also get three Companion Pass trips after earning 95,000 points or taking 75 qualifying flights, which is below the Platinum threshold.\n\"That is definitely different from what we've done before,\" said Nandika Suri, who heads Southwest's Rapid Rewards loyalty program. She said the new strategy is \"a way for us to actually recognize and reward customers ... faster and more frequently in their journey to continue to engage with us.\"\nAirlines overall have consistently raised the requirements to earn status, requiring more spending, and have made similar changes to enter their airport lounges.\nUnited Airlines on Tuesday said it would no longer allow customers to earn status in its Mileage Plus program based on flight segments next year and that it would only accept Premier qualifying points, which are earned from flight spending and on a co-branded credit card.\nUnited also raised the requirements to reach Premier 1K, its highest frequent flyer tier outside of the invite-only Global Services, to 32,000 qualifying points, up from 28,000 this year.\n— CNBC's Caleigh Keating contributed to this article.",
    "bodyJa": "Goodbye, A-List and A-List Preferred.\nSouthwest Airlines is scrapping its two-tier loyalty program starting next year and instead rolling out silver, gold and platinum levels that are similar to what other carriers offer, as the once-quirky airline seeks to increase revenue and reward its biggest spenders.\nSouthwest executives have been overhauling the airline, getting rid of longtime customer perks like two free checked bags and open seating. It's now charging for some of those options, like rivals have been doing for years.\nAlong with the shift from two to three loyalty levels, the carrier is also changing the names of its tiers. Under the old version, travelers could be classified into A-List or A-List Preferred, which was the higher level.\n\"If you think about A-List and A-List Preferred, we don't even have [boarding] groups A, B and C anymore,\" Tony Roach, Southwest chief customer and brand officer, said in an interview. \"So it was time to do a refresh to somewhat incorporate all the changes to seating and all these new experiences that we've been adding.\"\nHere's what's changing for the loyalty program:\n- A-List and A-List Preferred Rapid Rewards status levels will go away on Jan. 1.\n- A-List customers will be shifted to Silver status in the Rapid Rewards program. A-List Preferred members will get Gold status.\n- A new Platinum tier will be added for the airline's \"most engaged\" customers.\nCustomers can earn 1 Tier Qualifying Point, or TQP, per $1 spent on Southwest co-branded credit cards with Chase. Here are the new status requirements:\n- Silver status will require 35,000 TQPs or 25 qualifying flights. Previously, A-List was 35,000 points or 20 flights. For Silver members, the points-earning bonus on flights will go up from 25% to 40%.\n- To earn Gold, customers will have to reach 65,000 TQPs, down from 70,000 points for A-List Preferred, or take 50 flights. The points-earning bonus for those with that status goes from 100%, or double points earning, to 60% on qualifying flights.\n- The new, top-tier Platinum status requires 140,000 TQPs or 100 qualifying flights. Platinum members will get a 120% earnings bonus on qualifying flights.\nSilver status members will board in Group 1, while Gold members will board before Group 1. Platinum members will board before both Gold members and Group 1. Platinum tier also has unlimited Companion Pass trips.\nSouthwest's Companion Pass — which lets a designated person fly for free, minus taxes and fees, with a traveler who has that perk — is also changing.\nCompanion Pass holders that have them in their accounts will be able to hold onto them for the duration of their term. But starting with the 2027 earning year, Companion Pass benefits will be earned through TQPs or qualifying flights, by hitting a milestone reward or with Platinum status.\nCurrently, a Rapid Rewards member has to earn at least 135,000 qualifying points or 100 one-way flights to qualify for the pass.\nThe airline is also expanding its partnerships with international airlines and building its first airport lounges. Southwest on Thursday offered a peek into the new lounges, which it has named Icon, and is working on with its credit card partner, Chase. The carrier is building Icon lounges in four cities around the U.S., with others in the works.\nSouthwest is also adding benefits for customers that are in between status tiers, similar to what American Airlines offers.\nFor example, after earning 20,000 points or taking 15 qualifying flights, customers can choose between 2,000 more Rapid Rewards points or two coupons to select a \"preferred\" seat, which is a standard legroom seat that's closer to the front of the plane or a more popular aisle or window seat.\nCustomers will also get three Companion Pass trips after earning 95,000 points or taking 75 qualifying flights, which is below the Platinum threshold.\n\"That is definitely different from what we've done before,\" said Nandika Suri, who heads Southwest's Rapid Rewards loyalty program. She said the new strategy is \"a way for us to actually recognize and reward customers ... faster and more frequently in their journey to continue to engage with us.\"\nAirlines overall have consistently raised the requirements to earn status, requiring more spending, and have made similar changes to enter their airport lounges.\nUnited Airlines on Tuesday said it would no longer allow customers to earn status in its Mileage Plus program based on flight segments next year and that it would only accept Premier qualifying points, which are earned from flight spending and on a co-branded credit card.\nUnited also raised the requirements to reach Premier 1K, its highest frequent flyer tier outside of the invite-only Global Services, to 32,000 qualifying points, up from 28,000 this year.\n— CNBC's Caleigh Keating contributed to this article.",

    "id": "nvidia-must-work-with-chinese-ai-compani-b42ae427",
    "title": "Nvidia must work with Chinese AI companies on safety, Jensen Huang tells CNBC",
    "titleJa": "Nvidia must work with Chinese AI companies on safety, Jensen Huang tells CNBC",
    "summaryJa": "Nvidia CEO Jensen Huang said the chipmaker \"absolutely must\" work with Chinese AI companies on monitoring risks around the \"potentially dangerous\" technology.\"We absolutely should work with each other so that we advance the technology safely,\" he told CNBC during a media briefing on Wednesday evening in London.",
    "bodyOriginal": "Nvidia CEO Jensen Huang said the chipmaker \"absolutely must\" work with Chinese AI companies on monitoring risks around the \"potentially dangerous\" technology.\n\"We absolutely should work with each other so that we advance the technology safely,\" he told CNBC during a media briefing on Wednesday evening in London.\nDiscussions around AI safety have intensified in recent months, after researchers from AI labs including OpenAI and Anthropic called for a slowdown on developing the tech and warned of existential risks to humanity.\nWhile OpenAI's Sam Altman and Anthropic's Dario Amodei have called for greater regulation, Huang has emerged as a prominent voice in opposition to that view.\nHuang said that \"dialogue\" was the way to work with Chinese AI companies, adding that he has \"dialogues with many of the researchers in China.\"\n\"We ought to enhance the dialogue,\" he added. \"The United States should do it... I advocated that the U.K. do the same thing.\"\nU.S.-China AI cooperation\nAI safety has become a key topic between the U.S. and Chinese governments, with both countries weighing how to address the risks posed by the rapidly advancing tech.\nPrior to U.S. President Donald Trump's meeting with Chinese counterpart Xi Jinping, U.S. Treasury Secretary Scott Bessent discussed the prospect of a \"U.S.-China AI dialogue\" with his Chinese counterpart, He Lifeng, in September, including a channel for incidents \"up to a national security level.\"\nA Chinese readout of the meeting said President Xi pointed out that China and the U.S. \"may have competition, but they may cooperate even more\" in AI. \"The two sides can continue their dialogue on AI, exchange views on its risks and benefits, and jointly prevent the misuse and abuse of AI,\" Xi said, per the readout.\nHuang said that the U.K. is in a position \"in the world to be able to be a convener of many of these dialogues\" related to AI, because of the country's \"intellectual capital.\"",
    "bodyJa": "Nvidia CEO Jensen Huang said the chipmaker \"absolutely must\" work with Chinese AI companies on monitoring risks around the \"potentially dangerous\" technology.\n\"We absolutely should work with each other so that we advance the technology safely,\" he told CNBC during a media briefing on Wednesday evening in London.\nDiscussions around AI safety have intensified in recent months, after researchers from AI labs including OpenAI and Anthropic called for a slowdown on developing the tech and warned of existential risks to humanity.\nWhile OpenAI's Sam Altman and Anthropic's Dario Amodei have called for greater regulation, Huang has emerged as a prominent voice in opposition to that view.\nHuang said that \"dialogue\" was the way to work with Chinese AI companies, adding that he has \"dialogues with many of the researchers in China.\"\n\"We ought to enhance the dialogue,\" he added. \"The United States should do it... I advocated that the U.K. do the same thing.\"\nU.S.-China AI cooperation\nAI safety has become a key topic between the U.S. and Chinese governments, with both countries weighing how to address the risks posed by the rapidly advancing tech.\nPrior to U.S. President Donald Trump's meeting with Chinese counterpart Xi Jinping, U.S. Treasury Secretary Scott Bessent discussed the prospect of a \"U.S.-China AI dialogue\" with his Chinese counterpart, He Lifeng, in September, including a channel for incidents \"up to a national security level.\"\nA Chinese readout of the meeting said President Xi pointed out that China and the U.S. \"may have competition, but they may cooperate even more\" in AI. \"The two sides can continue their dialogue on AI, exchange views on its risks and benefits, and jointly prevent the misuse and abuse of AI,\" Xi said, per the readout.\nHuang said that the U.K. is in a position \"in the world to be able to be a convener of many of these dialogues\" related to AI, because of the country's \"intellectual capital.\"",
