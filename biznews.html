    "titleJa": "日銀は金利を1％に据え置き、基調インフレが目標の2％を超えると警告",
    "summaryJa": "日銀は金曜日、国内の基調インフレが目標の２％を超える可能性があると警告し、政策金利を据え置いた。日本中央銀行の政策金利を1%に据え置くことは8対1で決定され、理事の高田一氏は1.25%への引き上げを提案した。",
    "bodyOriginal": "The Bank of Japan kept its policy rate steady on Friday, as it warned that underlying inflation in the country could exceed its 2% target.\nJapan's central bank's move to hold rates at 1% was an 8-1 decision, with board member Hajime Takata proposing a hike to 1.25%.\nThe decision comes as speculation continues to swirl around whether the Bank of Japan will boost rates at a faster pace due to surging bond yields and a weak yen.\nBOJ officials are open to moving faster than the current market view of one hike every six months, Bloomberg reported before the decision, citing people familiar with the matter.\nThe yen has weakened to around the 163 level against the dollar, although it rallied on Thursday night to trade as strong as 157.96 to the greenback.\nNikkei reported that Tokyo had conducted an intervention by selling dollars and buying yen, while U.S. authorities executed a \"rate check,\" a move usually seen as a precursor to intervention.\nThe benchmark 10-year Japanese government bond yield has eased slightly from multi-decade highs, but still remains at about 2.8%.\nAnalysts have drawn attention to BOJ Governor Kazuo Ueda's communications after the policy decision, saying that Ueda's statements will be where markets take their cue from.\n\"The more important question is whether Governor Ueda and the BOJ signal an acceleration in the pace of future hikes. This will be the focal point of the meeting, and Ueda's press conference will be where markets look for answers,\" according to Wataru Aso, product specialist at RBC BlueBay Asset Management, in a note.\nWhile the BOJ does not say that a weak yen will force it to raise rates, it's a factor that could increase imported inflation, which the BOJ takes note of.\nIn a June 25 speech, BOJ Board Member Naoki Tamura said that in his personal view, underlying inflation has generally reached the BOJ's 2% target.\n\"Moreover, I believe there is a high risk that price developments will deviate upward from the Bank's baseline scenario,\" Tamura, who is seen as hawkish, added.\nHe noted that while the core inflation figure for Japan is under 2%, this has been held down by government subsidies for energy and school fees. With those removed, core inflation has been above 2%.\nJapan's core inflation for July came in at 1.6%, and has been below 2% for most of 2026.\nThis is breaking news, please check back for updates.",
    "bodyJa": "日銀は金曜日、国内の基調インフレが目標の２％を超える可能性があると警告し、政策金利を据え置いた。\n日本中央銀行の政策金利を1%に据え置くことは8対1で決定され、理事の高田一氏は1.25%への引き上げを提案した。\nこの決定は、債券利回りの急上昇と円安を背景に、日銀がより速いペースで利上げを行うのではないかとの憶測が引き続き渦巻いている中で行われた。\nブルームバーグはこの決定の前に、事情に詳しい関係者の話として、日銀当局者らは半年に1回の利上げという現在の市場の見方よりも速いペースで実施することに前向きであると報じた。\n円は対ドルで約163円台まで下落したが、木曜夜には反発し、1ドル＝157.96ドルまで円高となった。\n日経新聞は、日本政府がドル売り・円買い介入を実施し、米国当局が通常介入の前兆とみられる「金利チェック」を実施したと報じた。\n指標となる10年日本国債利回りは数十年ぶりの高水準から若干低下したが、依然として約2.8％にとどまっている。\nアナリストらは政策決定後の上田和夫日銀総裁の発言に注目しており、市場は上田氏の発言に注目するだろうと述べている。\nＲＢＣブルーベイ・アセット・マネジメントの商品スペシャリスト、麻生亘氏はメモの中で、「より重要な問題は、上田総裁と日銀が将来の利上げペースの加速を示唆するかどうかだ。これが会議の焦点となり、市場は上田氏の記者会見で答えを探すことになるだろう」と述べた。\n日銀は円安が利上げを余儀なくされるとは明言していないが、円安は輸入インフレを上昇させる可能性がある要因であり、日銀は注目している。\n日銀理事の田村直樹氏は6月25日の講演で、個人的な見解として、基調インフレは日銀の目標である2％に概ね到達していると述べた。\nタカ派とみられる田村氏は「さらに、物価動向が日銀の基本シナリオから上方に乖離するリスクが高いと考えている」と付け加えた。\n同氏は、日本のコアインフレ率は２％未満だが、エネルギーや学費に対する政府の補助金によって抑制されていると指摘した。これらを除くと、コアインフレ率は２％を超えている。\n日本の7月のコアインフレ率は1.6％となり、2026年のほとんどの期間で2％を下回った。\nこれは最新ニュースです。最新情報を確認してください。",

    "id": "three-things-we-learned-about-ai-from-bi-f5f28dcd",
    "title": "Three things we learned about AI from Big Tech earnings",
    "titleJa": "ビッグテックの収益から AI について学んだ 3 つのこと",
    "summaryJa": "ビッグテックの収益から AI について学んだ 3 つのこと- 公開されました",
    "bodyOriginal": "Three things we learned about AI from Big Tech earnings\n- Published\nThe world's biggest technology companies - including Microsoft, Meta, Google, Apple and Amazon - updated Wall Street this week on their finances.\nOne common thread emerged: they are all planning to continue spending massive amounts of money on artificial intelligence (AI).\nThe reaction from investors was that they need to see more tangible results to show for the $1tn (£743bn) and growing, external investment in things like computer chips, data centres, and even technical staff. That sent some tech stocks on a wild ride in recent days.\nWhile each company operates in different sectors, their AI spending and plans showed they have a few other things in common as well.\nAI tools and chatbots still do not make much money\nOpenAI's release of ChatGPT in late 2022 kicked off the ongoing AI investment race, and every major tech company has since launched a consumer-facing AI chatbot of their own. Meta has Meta AI, Google has Gemini. Amazon has Rufus. Apple even relaunched Siri.\nYet, none of the chatbots or the related tools in and of themselves clearly provide a meaningful amount of revenue for the companies, despite being costly to create.\nInstead, this batch of earnings results made clear that companies like Google, which is owned by Alphabet, and Meta are currently spending much more money related to AI tools than they bring in.\nBoth companies reported some of their lowest ever amounts of free cash flow, a measure of how much money a business has left over after paying for operations and investments.\nGoogle spent so much money on AI that Alphabet's free cash flow was negative on revenue of $118bn, meaning it spent more than it brought in for the first time in the company's history as a public company.\nMeta's free cash was just $784m on $61bn of revenue, meaning it spent almost as much money as it made during the quarter.\nMeta's Reality Labs, which is responsible for its AI work, lost nearly $9bn in the first half of this year.\nWall Street wants results, not more ideas\nLook no further than Wall Street's reaction to Meta's quarterly results to see that investors are no longer placated with executive's claims that AI investment will turn out to be worth it at some unknown point in the future.\nShares of the social media giant plunged to its second lowest level in a year after chief executive Mark Zuckerberg said Meta was working on its own AI agent, or an AI chatbot that can operate somewhat autonomously. And that it was planning to develop an operation to sell an an AI tool directly to other firms.\nNeither the operation or the AI tool currently exist in a way that could make Meta money, and Zuckerberg gave no timeline for when they would materialise. Still, Meta increased the low end of its planned spending on AI – it is likely to pour more than $140bn into AI this year alone.\nMeanwhile, shares in Microsoft soared to a six-month high. Despite the company's plans to effectively match this financial year the $190bn it spent on AI over the last 12 months, it showed strong revenue growth and more adoption of its core AI tool.\nTracy Woo, an analyst with Forrester, said Microsoft was a tech company showing that its massive AI investments were \"beginning to deliver returns.\"\nThe market reaction to Amazon was almost identical. Despite negative cash flow, and plans to spend $220bn on AI this year, the success of its other businesses drove its stock to its highest price in two months.\nThere is still huge demand for new tech\nAI tools may have not yet proven to be a consumer tech revolution on the scale of the internet or even electricity, external, as many tech executives have promised for years. But there is still huge demand from people for new technology.\nGoogle said last week that 950 million people are using its Gemini chatbot at least once a month, three times the users it had a year ago.\nApple on Thursday said that new versions of its core products, the Mac computer, iPhone and iPad, have been selling better this year than the company planned for or expected.\nSo much so that it warned investors, external that sales of such products would slow down, because Apple is unable to get enough of the microchips that would be required to meet buyer demand.\nThe company is, however, anticipating a lot of excitement from Apple users for its impending update of Siri, its AI voice assistant within its products that is getting an overhaul with the help of Google's Gemini chatbot.\nOutgoing chief executive Tim Cook said Apple already has plans to charge users who wish to make heavier use of the new Siri, given feedback received from user testing so far.\n\"We're off-the-charts excited about Siri AI\", Cook said. \"We do believe there will be people who want to use it – a lot.\"",
    "bodyJa": "ビッグテックの収益から AI について学んだ 3 つのこと\n- 公開されました\nマイクロソフト、メタ、グーグル、アップル、アマゾンを含む世界最大のテクノロジー企業が今週ウォール街に自社の財務状況を更新した。\n1 つの共通点が明らかになりました。それは、彼ら全員が人工知能 (AI) に巨額の資金を投じ続けることを計画しているということです。\n投資家らの反応は、コンピューターチップ、データセンター、さらには技術スタッフなどへの1兆ドル（7430億ポンド）を超える外部投資で、より具体的な成果を示す必要があるというものだった。この影響でここ数日、ハイテク株の一部が暴騰した。\n各企業は異なる分野で事業を展開していますが、AI への支出と計画を見ると、他にもいくつかの共通点があることがわかりました。\nAIツールやチャットボットはまだあまり儲かっていない\n2022 年後半に OpenAI が ChatGPT をリリースしたことにより、進行中の AI 投資競争が始まり、それ以来、大手テクノロジー企業はすべて、消費者向けの独自の AI チャットボットを立ち上げました。メタにはメタ AI があり、Google には Gemini があります。アマゾンにはルーファスがあります。 AppleはSiriを再起動しました。\nしかし、チャットボットや関連ツールはどれも、作成に費用がかかるにもかかわらず、それ自体で企業に有意な収益をもたらしていることは明らかではありません。\nむしろ、この一連の決算結果では、アルファベット傘下のグーグルやメタなどの企業が、現在、入ってくるお金よりもはるかに多くのお金をAIツール関連に費やしていることが明らかになった。\n両社ともフリーキャッシュフロー（事業費や投資費を支払った後に企業がどれだけ残っているかを示す指標）が過去最低額となったと報告した。\nGoogleはAIに多額の資金を投じたため、Alphabetのフリーキャッシュフローは1,180億ドルの収益でマイナスとなった。これは、上場企業としての同社の歴史で初めて収入を上回る支出をしたことを意味する。\nMeta のフリーキャッシュは 610 億ドルの収益に対してわずか 7 億 8,400 万ドルでした。これは、同四半期に稼いだのとほぼ同じ金額を費やしたことを意味します。\nAI事業を担当するMetaのReality Labsは、今年上半期に90億ドル近くの損失を出した。\nウォール街はさらなるアイデアではなく結果を求めている\nメタ社の四半期決算に対するウォール街の反応を見れば、将来の未知の時点でAI投資に価値があることが判明するという経営幹部の主張に投資家がもはや安心していないことがわかる。\nマーク・ザッカーバーグ最高経営責任者（CEO）がメタが独自のAIエージェント、つまりある程度自律的に動作できるAIチャットボットの開発に取り組んでいると述べた後、ソーシャルメディア巨人の株価は1年で2番目に低い水準に下落した。そして、AIツールを他の企業に直接販売する事業を展開する計画だという。\nこの作戦も AI ツールもメタマネーを生み出す方法では現時点では存在しておらず、ザッカーバーグ氏はそれらがいつ実現するかについてのタイムラインを明らかにしなかった。それでも、メタは AI への計画支出の下限を増やした。今年だけで 1,400 億ドル以上を AI に注ぎ込む可能性がある。\n一方、マイクロソフト株は６カ月ぶりの高値まで上昇した。同社は、過去 12 か月で AI に費やした 1,900 億ドルを今会計年度に実質的に匹敵させる計画にもかかわらず、力強い収益成長と中核となる AI ツールの採用の増加を示しました。\nフォレスター社のアナリスト、トレイシー・ウー氏は、マイクロソフトは大規模なAI投資が「利益をもたらし始めている」ことを示すハイテク企業だと述べた。\nAmazonに対する市場の反応はほぼ同じでした。キャッシュフローがマイナスで、今年AIに2200億ドルを投じる計画にもかかわらず、他の事業の成功で株価は2カ月ぶりの高値に上昇した。\n新しいテクノロジーに対する需要は依然として大きい\nAI ツールは、多くのテクノロジー企業幹部が長年約束してきたように、外部のインターネットや電力にまで及ぶ規模の消費者向けテクノロジー革命であることはまだ証明されていないかもしれません。しかし、新しいテクノロジーに対する人々の需要は依然として膨大です。\nGoogleは先週、9億5000万人が同社のGeminiチャットボットを少なくとも月に1回利用しており、これは1年前のユーザー数の3倍であると発表した。\nAppleは木曜日、同社の中核製品であるMacコンピュータ、iPhone、iPadの新バージョンの今年の売れ行きが、同社の計画や予想を上回ったと発表した。\nアップルは買い手の需要を満たすために必要なマイクロチップを十分に入手できないため、こうした製品の売り上げは鈍化すると外部の投資家に警告したほどだ。\nしかし、同社は、GoogleのGeminiチャットボットの助けを借りて全面的に刷新される自社製品内のAI音声アシスタントであるSiriの差し迫ったアップデートに対して、Appleユーザーからの大きな興奮を期待している。\n退任するティム・クック最高経営責任者（CEO）は、これまでのユーザーテストで得られたフィードバックを踏まえ、Appleは新しいSiriをより多用したいユーザーに料金を請求する計画をすでに持っていると述べた。\n「私たちは Siri AI に非常に興奮しています」とクック氏は語った。 「それを使いたい人はたくさんいると信じています。」",

    "id": "anthropic-says-claude-ai-hacked-three-fi-34552a0a",
    "title": "Anthropic says Claude AI hacked three firms during cyber tests",
    "titleJa": "Anthropicは、Claude AIがサイバーテスト中に3社をハッキングしたと発表",
    "summaryJa": "Anthropicは、Claude AIがサイバーテスト中に3社をハッキングしたと発表- 公開されました",
    "bodyOriginal": "Anthropic says Claude AI hacked three firms during cyber tests\n- Published\nUS technology firm Anthropic says its artificial intelligence (AI) models hacked into the systems of three other firms during a cybersecurity test due to an error that gave them access to the internet.\nIt comes just days after rival OpenAI said that its models had breached the systems of other companies, including AI tools hub Hugging Face.\nThe announcement prompted Anthropic to check whether its own models had carried out similar attacks. It says it uncovered three cases that have since been reported to the affected companies.\nAnthropic, which did not name the firms, urged other AI labs to perform similar reviews to better understand the risks of their models' capabilities.\nAnthropic said in a statement, external that it reviewed more than 140,000 tests to find evidence that Claude - its family of AI models - could access the internet from testing environments that were designed to be sealed off.\nThe tests include so-called \"capture-the-flag\" evaluations in which Claude was tasked with obtaining information by breaching other systems - a common way that experts assess a model's hacking capabilities.\nA \"misconfiguration\" on systems run by Anthropic and its testing partner left the models with live internet access, allowing them to breach other systems, the San Francisco-based firm said.\nAnthropic said the earliest incidents date back to April and that it is \"approaching the fixes as if the responsibility were ours alone.\"\nNeither Anthropic nor the firms that were breached had noticed the intrusions at the time.\nAnthropic said it could have reviewed its records more thoroughly and added that the findings gave the firm \"cautious optimism\" that such risks can be overcome with more investment and tighter measures.\nThe incidents come as tech firms pour billions of dollars into developing AI agents that can independently perform tasks ranging from research and customer support to cybersecurity.\nA string of AI-driven cyberattacks has fuelled calls for tighter safeguards and oversight of the technology, over concerns about the risks posed by increasingly powerful autonomous systems.\nUS President Donald Trump said on Wednesday that Washington is considering measures to rein in AI tools after recent cybersecurity incidents.\nOver the last week, OpenAI has taken responsibility for at least two hacking incidents involving its platforms breaching the rules of what they were directed to do.\nOn 21 July, the ChatGPT-maker said its agent - an AI system that can operate alone after human instruction - went rogue and escaped its test limits to hack into Hugging Face.\nOpenAI said the incident was \"unprecedented\", and it was investigating with Hugging Face, whose boss co-founder Thomas Wolf told the BBC that the incident is \"a wake-up call\" for the industry.\nThe incidents have been viewed with some scepticism as OpenAI and Anthropic prepare for blockbuster stock market listings that are expected to value each firm at around $1tn (£740bn).\nAn OpenAI spokesperson has said \"we recognise there are a lot of questions and speculative details circulating\" about the incident. They added that \"we plan to publish a technical report of our learnings in the coming weeks\".\nRelated topics\n- Published23 July",
    "bodyJa": "Anthropicは、Claude AIがサイバーテスト中に3社をハッキングしたと発表\n- 公開されました\n米国のテクノロジー企業アンスロピックは、同社の人工知能（AI）モデルがサイバーセキュリティテスト中に他の3社のシステムにインターネットにアクセスできるエラーが原因でハッキングされたと発表した。\nこれは、ライバルのOpenAIが自社のモデルがAIツールハブのHugging Faceを含む他社のシステムに侵入したと発表してから数日後のことだった。\nこの発表を受け、Anthropic は自社のモデルが同様の攻撃を実行したかどうかを確認することになった。その後、影響を受けた企業に報告された3件のケースを発見したとしている。\nアンスロピックは企業名は明らかにしなかったが、モデルの機能のリスクをより深く理解するために他のAI研究所にも同様のレビューを実施するよう求めた。\nAnthropicは社外向けの声明で、自社のAIモデルであるClaudeが、密閉されるように設計されたテスト環境からインターネットにアクセスできるという証拠を見つけるために14万件以上のテストを調査したと述べた。\nこのテストには、クロードが他のシステムに侵入して情報を取得するという、いわゆる「キャプチャ ザ フラッグ」評価が含まれています。これは、専門家がモデルのハッキング能力を評価する一般的な方法です。\nAnthropic とそのテストパートナーが運営するシステムの「設定ミス」により、モデルがインターネットにライブアクセスできる状態になり、他のシステムに侵入できるようになった、とサンフランシスコに本拠を置く同社は述べた。\nAnthropic は、最初の事件は 4 月に遡り、「責任が私たちだけのものであるかのように修正に取り組んでいる」と述べた。\nAnthropic も侵害された企業も、当時は侵入に気づいていませんでした。\nアンスロピックは、記録をもっと徹底的に見直すことができたかもしれないと述べ、この調査結果は同社に、より多くの投資とより厳格な措置でそのようなリスクを克服できるという「慎重な楽観主義」を与えたと付け加えた。\nこの事件は、ハイテク企業が調査や顧客サポートからサイバーセキュリティに至るまでの業務を独立して実行できるAIエージェントの開発に数十億ドルをつぎ込んでいる中で起きた。\n一連の AI を活用したサイバー攻撃により、ますます強力になる自律システムによってもたらされるリスクに対する懸念から、テクノロジーに対する安全対策と監視の強化を求める声が高まっています。\nドナルド・トランプ米大統領は水曜日、最近のサイバーセキュリティ事件を受けて米国政府がAIツールを抑制する措置を検討していると述べた。\nOpenAIは先週、同社のプラットフォームが指示されたルールに違反した少なくとも2件のハッキング事件の責任を負った。\n7月21日、ChatGPTの作成者は、そのエージェント（人間の指示後に単独で動作できるAIシステム）が不正になり、ハギングフェイスをハッキングするためにテスト限界を突破したと発表した。\nOpenAIは、この事件は「前例のない」ものであり、ハギング・フェイスとともに調査を行っていると述べ、その上司の共同創設者トーマス・ウルフ氏はBBCに対し、この事件は業界に対する「警鐘」であると語った。\nOpenAIとAnthropicが、それぞれの企業の評価額​​が約1兆ドル（7,400億ポンド）と予想される大規模な株式市場上場の準備をしている中、この事件はある程度懐疑的に見られてきた。\nOpenAIの広報担当者は、この事件について「多くの疑問や憶測の詳細が出回っていることを認識している」と述べた。彼らは、「今後数週間以内に、我々の学んだことをまとめた技術レポートを発行する予定だ」と付け加えた。\n関連トピック\n- 7 月 23 日発行",

    "id": "apple-warns-of-future-supply-constraints-d89e751d",
    "title": "Apple warns of future 'supply constraints' for Mac, iPhone, iPad",
    "titleJa": "Apple、Mac、iPhone、iPadの将来の「供給制約」を警告",
    "summaryJa": "Apple、Mac、iPhone、iPadの将来の「供給制約」を警告- 公開されました",
    "bodyOriginal": "Apple warns of future 'supply constraints' for Mac, iPhone, iPad\n- Published\nApple spooked Wall Street on Thursday by warning it expected a \"significant\" hit from growing supply constraints for its most popular products.\nShares in the company fell in after-hours trading by more than 7%, even as it showed a 16% increase in revenue to $109b (£81b) thanks in part to unexpectedly high iPhone sales, and a 26% increase in profits to $29b.\nOutgoing chief executive Tim Cook said while the impact of supply constraints had already shown up with the availability of Mac computers, it was expected to worsen and spread to affect iPhone and iPad products.\n\"We're seeing some very significant constraints currently with limited flexibility in the supply chain to remedy it,\" Cook said.\nOne of the supply constraints was in key chip components of Apple's products, the firm said.\nDevices such as Macs and iPhones require microprocessors with \"advanced nodes\" - essentially computer chip technology that allows them to operate more quickly - most of which Apple has manufactured through TSMC, which is based in Taiwan.\nHowever, Cook insisted that the core issue was unexpected demand, mainly for iPhone and Mac products. Sales of those products grew 22% and 25% respectively during the June quarter.\nEarlier this year, Apple said its iPhone 17 was so in demand that its launch was the biggest in the company's history.\n\"This is not a regular supply issue, it's a demand forecast issue to be candid,\" Cook added. \"We've got a quarter ahead where we'll be scrambling on the supply side.\"\nApple also noted that its gross margin, or the amount of money it keeps from every sale, was 2% larger than it otherwise would have been during the last three months because of tariff refunds. That would mean the company received roughly $1.1b in such refunds, according to calculations by the BBC.\nCook said Apple intended to \"reinvest the tariff refunds into the US\".\nThe company previously said, external it intended to put $600b toward building out more domestic manufacturing over the next four years. China is currently the largest manufacturer of Apple's products.\nCook also addressed Apple's impending public relaunch of Siri, an AI assistant that the company has seemingly struggled to make competitive in an era of proliferating AI chatbots from the likes of OpenAI and Anthropic.\nWhile the new version of Siri AI is still in public beta, essentially a testing phase before broader release, Cook said it is part of \"an enormous opportunity for Apple going forward in AI.\"\n\"The ability to run on device is also very strategic, and sort of a competitive weapon, if you will,\" Cook said.\nHe added that negotiations with authorities in the European Union about releasing the new version of Siri are ongoing with the goal of making it available \"to everyone, everywhere at the same time.\"\nBoom in Amazon cloud boosts stocks\nInvestors proved less concerned with Amazon's future performance, pushing the company's stock up 10% in after hours trading.\nDespite showing free cash flow of negative $7.6bn due to massive and ongoing spending on AI projects, Amazon's core businesses grew enough to offset any immediate worry on Wall Street.\nFree cash flow is metric that details how much money is left over after a company pays for operations and investments. So, over the last year, Amazon has spent significantly more money that it has brought in.\nChief executive Andy Jassy boasted 37% growth in Amazon's Amazon Web Service (AWS) cloud business, noting it was the segment's best showing in four years.\n\"AWS is booming,\" he said.\nOverall, Amazon's sales grew 20% compared to a year ago, to $200bn, while its profits more than doubled over the same period to hit $63bn.\nForrester analyst Tracy Woo said the growth in Amazon's cloud business was impressive and its combined company results were \"a clear indicator that its infrastructure investments are meeting market demand rather than outpacing it.\"\nThe company's expectation that it will spend $220b this year on AI, up from a planned $200b just three months ago, did give Woo some slight concern over how successful such ongoing and ever-growing spending will be in the years ahead.\n\"The bigger question is whether long-term commitments, capacity, power, leases, and guarantees will continue to be a source of economic exposure when capacity comes online in 2027 and 2028,\" Woo said.",
    "bodyJa": "Apple、Mac、iPhone、iPadの将来の「供給制約」を警告\n- 公開されました\nアップルは木曜日、最も人気のある製品の供給制約の拡大により「重大な」打撃が予想されると警告し、ウォール街を驚かせた。\n同社の株価は時間外取引で7％以上下落した。その一方で、iPhoneの予想外の売れ行きのおかげで売上高は16％増の1090億ドル（810億ポンド）、利益は26％増の290億ドルとなった。\n退任するティム・クック最高経営責任者（CEO）は、供給制約の影響はすでにMacコンピュータの入手可能性に現れているものの、さらに悪化し、iPhoneやiPad製品にも影響が及ぶと予想されると述べた。\nクック氏は「現在、非常に重大な制約がいくつかあり、それを改善するためのサプライチェーンの柔軟性が限られている」と述べた。\n供給制約の一つはアップル製品の主要チップ部品にあると同社は述べた。\nMacやiPhoneなどのデバイスには、「高度なノード」（本質的にはより高速な動作を可能にするコンピュータチップ技術）を搭載したマイクロプロセッサが必要で、そのほとんどはAppleが台湾に本拠を置くTSMCを通じて製造している。\nしかし、クック氏は、中心的な問題は主にiPhoneやMac製品に対する予期せぬ需要だと主張した。これらの製品の売上高は、6 月四半期中にそれぞれ 22% と 25% 増加しました。\n今年初め、アップルはiPhone 17の需要が非常に高く、その発売は同社史上最大規模だったと発表した。\nクック氏は「これは定期的な供給の問題ではなく、率直に言えば需要予測の問題だ」と付け加えた。 「あと 1 四半期で供給面でのスクランブルが発生することになる。」\nAppleはまた、関税還付のおかげで、売上総利益、つまりすべての販売から得られる金額が、過去3か月間に比べて2%増加したと指摘した。 BBCの計算によれば、同社はそのような払い戻しで約11億ドルを受け取ったということになる。\nクック氏は、アップルが「関税還付金を米国に再投資する」つもりだと述べた。\n同社は以前、対外的には今後4年間で国内製造の拡大に6000億ドルを投じる意向だと述べた。現在、中国はアップル製品の最大の製造国である。\nクック氏はまた、アップルが差し迫ったAIアシスタント「Siri」の一般公開再開についても言及した。同社は、OpenAIやAnthropicなどのAIチャットボットが急増する時代に、競争力を高めるのに苦戦しているようだ。\nSiri AIの新バージョンはまだパブリックベータ版であり、基本的には広範囲にリリースする前のテスト段階だが、クック氏はこれが「AppleにとってAI分野で前進する大きなチャンス」の一部であると述べた。\n「デバイス上で実行できる機能も非常に戦略的であり、いわば競争上の武器のようなものです」とクック氏は語った。\n同氏は、Siriの新バージョンのリリースについて欧州連合当局との交渉が「誰でも、どこでも同時に」利用できるようにすることを目標に進行中であると付け加えた。\nAmazonクラウドのブームが株価を押し上げる\n投資家らはアマゾンの将来の業績にそれほど懸念を抱いていないことが判明し、同社株は時間外取引で１０％上昇した。\nAI プロジェクトへの巨額かつ継続的な支出により、フリー キャッシュ フローはマイナス 76 億ドルとなったにもかかわらず、アマゾンの中核事業はウォール街の差し迫った懸念を打ち消すのに十分な成長を遂げました。\nフリー キャッシュ フローは、企業が運営費や投資費を支払った後にどのくらいのお金が残るかを詳細に示す指標です。つまり、昨年、アマゾンはもたらしたお金よりもはるかに多くのお金を費やしたことになる。\nアンディ・ジャシー最高経営責任者（ＣＥＯ）はアマゾンのアマゾン・ウェブ・サービス（ＡＷＳ）クラウド事業の３７％成長を誇り、同部門で過去４年間で最高の業績だったと指摘した。\n「AWSは急成長している」と同氏は語った。\n全体として、Amazon の売上高は 1 年前と比べて 20% 増加して 2,000 億ドルとなり、利益は同期間に 2 倍以上増加して 630 億ドルに達しました。\nフォレスター社のアナリスト、トレイシー・ウー氏は、アマゾンのクラウド事業の成長は目覚ましいもので、両社を合わせた業績は「インフラ投資が市場の需要を上回っているのではなく、市場の需要に応えていることを明確に示している」と述べた。\nわずか 3 か月前の計画 2,000 億ドルから今年は 2,200 億ドルを AI に支出するとの同社の予想は、こうした継続的で増え続ける支出が今後数年間でどれほど成功するかについて、ウー氏に若干の懸念を与えた。\n「より大きな問題は、2027年と2028年に容量が稼動したときに、長期契約、容量、電力、リース、保証が引き続き経済的エクスポージャーの源となるかどうかだ」とウー氏は述べた。",

    "id": "thames-water-boss-says-leakage-targets-n-a1a77882",
    "title": "Thames Water boss says leakage targets 'not realistic'",
    "titleJa": "テムズウォーターの責任者、漏水目標は「現実的ではない」と発言",
    "summaryJa": "テムズウォーターの責任者、漏水目標は「現実的ではない」と発言- 公開されました",
    "bodyOriginal": "Thames Water boss says leakage targets 'not realistic'\n- Published\nThe boss of Thames Water has claimed targets the company has been set over things like leakages are \"not realistic\".\nThames has been criticised for its performance in recent years following a series of sewage discharges and leaks, and last year was fined a record £122.7m by regulator Ofwat, most of which was for breaching sewage spills rules.\nChris Weston said Thames wanted \"to do better\" but said some of its targets were not achievable.\nOfwat said company targets were \"intended to be ambitious\", while an environmental group said sewage pollution should not be accepted as inevitable.\nThames, which has struggled for years under billions of pounds of debt, faces being put in a form of temporary nationalisation known as a special administration regime.\nBut Weston said if that were to happen, there was a risk the taxpayer would have to bear the cost of funding it, and instead backed a rescue deal put forward by the firm's lenders.\nPollution targets\nWater companies have performance commitments on issues such as leakage.\nIt is illegal to release raw sewage into rivers and seas during \"normal\" weather conditions, but firms are allowed to do so when it rains heavily, to prevent homes being flooded.\nThames is the UK's largest water company, supplying water and wastewater services to 16 million customers across London and parts of southern England.\nSpeaking to the BBC's Big Boss Interview podcast, Weston said the company treats 4.3 billion litres of waste a day, and \"99.5% of the time\" it gets treated successfully, although \"sometimes something goes wrong\".\n\"We want to do better when it comes to pollutions,\" he said, but added, \"the targets that the company is expected to make are not realistic.\n\"[For example], we have to hit a certain level of leakage, but it is so far in excess of what we are capable of doing, I think anyone would be capable of doing, however much money you invested, that it is not going to be achievable.\"\nThe chance of getting to zero pollution was \"very, very slim\", he added.\nOfwat told the BBC: \"With around a fifth of water put into supply still lost through leakage, companies must deliver on the commitments they have been funded to achieve.\n\"Water company targets are intended to be ambitious and drive better outcomes for customers and the environment.\"\nA spokesperson for the Environment Agency said: \"[We] and the public expect Thames Water to comply with the law,\" adding that the agency would continue to hold companies to account where performance falls short.\nJames Wallace, chief executive of campaign group River Action, said: \"Thames Water's tactics of opacity and deflection fool no-one. Telling the public to save water while this wasteful profit-obsessed corporation leaks 570 million litres of treated drinking water every day is offensive.\n\"There is nothing 'realistic' about accepting sewage pollution as inevitable. The choice is simple: keep propping up a failed privatised financial model, or put Thames Water into special administration and rebuild it as a public utility serving customers, rivers and the public.\"\nWhether or not Thames will be put in a special administration regime - which would allow the government to recoup some taxpayer cash if the company was sold to a private buyer - has long been the subject of speculation.\nNew Prime Minister Andy Burnham has backed direct public control of utilities, and while Weston said he agreed that greater public control and \"an ability to hold us to account\" was a good idea, he said special administration would not be the best solution for Thames, warning it could disrupt investment and leave taxpayers funding the company.\nInstead, he supports a proposal from Thames' creditors that writes off about £9bn of debt, injects new investment and offers a \"golden share\" to the government which would give it veto powers over major decisions such as mergers.\nBig Boss Interview: Thames Water Chris Weston\nThe CEO of the UK's largest water company speaks to the BBC about water security, pollution targets and Thames' future.\nThe pay of water company bosses has also been widely criticised. Weston himself saw his pay increase 14% to £1.163m in the year to March, while other directors received bonuses totalling £4.1m, at a time when the company warns that it could run out money by November.\nBut Weston defended Thames' pay levels, saying his own pay was set by a committee and that the company needed to be able to attract and retain talent.\n\"We need capable people to help turn this company around. And if we're not prepared to pay market rates, then they won't come to us and they won't stay with us.\"\nHe said he understood public anger towards the water industry, but thought it sometimes went too far.\n\"We do have physical assaults of our staff, verbal abuse. I get the same. None of that is acceptable or appropriate,\" he said.\nDroughts 'the new normal'\nSpeaking in a week where more than half of England and all of Wales have been declared in drought, Weston said the hot, dry conditions we are currently seeing have become more common in recent years.\n\"We need to prepare for that and be ready to deal with this in the future,\" he said.\n\"This is absolutely the new normal.\"\nThames is one of several companies to have imposed a hosepipe ban and Weston said the UK had been complacent about water provision.\nWhile January and February this year were extremely wet, since then rainfall had been \"pitiful\", he said, and called for more reservoirs to be approved.\n\"We do not have enough storage to get through a summer and we have to think about next winter as well without restricting people's usage of water.\"\nRelated topics\n- Published15 July\n- Published16 June",
    "bodyJa": "テムズウォーターの責任者、漏水目標は「現実的ではない」と発言\n- 公開されました\nテムズ・ウォーターのトップは、漏水などに関して同社が設定した目標は「現実的ではない」と主張した。\nテムズ川は近年、下水の流出や漏洩が相次ぎ、そのパフォーマンスが批判されており、昨年は規制当局オフワットから過去最高となる1億2,270万ポンドの罰金を科せられたが、その大半は下水流出に関する規則違反に対するものだった。\nクリス・ウェストン氏はテムズ川を「より良くしたい」と考えているが、目標の一部は達成不可能だと述べた。\nオフワット氏は、同社の目標は「野心的なものであることが意図されている」と述べたが、環境保護団体は、下水汚染は避けられないものとして受け入れられるべきではないと述べた。\nテムズ川は数十億ポンドの負債の下で長年苦闘しており、特別管理体制として知られる一時的な国有化に直面している。\nしかしウェストン氏は、もしそうなった場合、納税者が資金調達コストを負担しなければならないリスクがあると述べ、代わりに同社の貸し手が提案した救済協定を支持したと述べた。\n汚染目標\n水道会社は漏水などの問題に対してパフォーマンスを約束します。\n「通常の」気象条件下で未処理下水を川や海に放出することは違法だが、企業は大雨が降った場合、家屋の浸水を防ぐために放出することが認められている。\nThames は英国最大の水道会社で、ロンドンとイングランド南部の一部の 1,600 万人の顧客に上下水道サービスを提供しています。\nウェストン氏はBBCのポッドキャスト「ビッグ・ボス・インタビュー」で、同社は1日あたり43億リットルの廃棄物を処理しており、「99.5％の確率で」処理は成功しているが、「時には何か問題が起きる」と語った。\n同氏は「汚染に関しては改善を図りたい」と述べたが、「同社が期待する目標は現実的ではない」とも付け加えた。\n「（例えば）一定レベルの漏洩を達成する必要があるが、それは私たちができることをはるかに超えており、どれだけの資金を投資しても誰でもできることだと思うが、それは達成できないだろう。」\n汚染をゼロにする可能性は「非常に非常に低い」と同氏は付け加えた。\nオフワット氏はBBCに対し、「供給される水の約5分の1が依然として漏水により失われているため、企業は資金提供を受けて達成すべき約束を果たさなければならない。\n「水道会社の目標は野心的なものであり、顧客と環境にとってより良い結果をもたらすことを目的としています。」\n環境庁の報道官は「（我々も）国民もテムズ水社が法律を遵守することを期待している」と述べ、環境庁は今後も業績が不十分な場合には企業に責任を追及していくつもりだと付け加えた。\n運動団体リバー・アクションのジェームズ・ウォレス最高経営責任者（CEO）は、「テムズ・ウォーターの不透明さと偏向という戦術は誰もだまさない。この無駄な利益に執着する企業が毎日5億7千万リットルの処理済み飲料水を漏洩している中、国民に水を節約するように言うのは攻撃的だ」と語った。\n「下水汚染を避けられないものとして受け入れることには、何も『現実的』ではありません。選択は簡単だ。失敗した民営化された財政モデルを維持し続けるか、テムズ水道を特別管理下に置き、顧客、河川、一般大衆にサービスを提供する公益事業として再建するかだ。」\nテムズ川が特別管理体制に置かれるかどうか、つまり会社が民間の買い手に売却された場合に政府が納税者の現金の一部を取り戻すことができるかどうかは、長い間憶測の対象となってきた。\nアンディ・バーナム新首相は公益事業の直接公的管理を支持しており、ウェストン氏は公的管理の強化と「責任を問う能力」は良い考えだと同意する一方、特別管理はテムズ川にとって最良の解決策ではないと述べ、投資を混乱させ、納税者が会社に資金を提供し続ける可能性があると警告した。\nその代わりに同氏は、約90億ポンドの債務を帳消しにし、新たな投資を注入し、合併などの重要な決定に対する拒否権を政府に与える「黄金の分け前」を政府に提供するというテムズ川の債権者らの提案を支持している。\nビッグボスインタビュー: テムズウォーター クリス・ウェストン\n英国最大の水道会社の CEO が BBC に水の安全保障、汚染目標、テムズ川の将来について語ります。\n水道会社の上司の給料も広く批判されている。ウェストン氏自身も、3月までの1年間で給与が14％増の11億6,300万ポンドとなり、他の取締役は総額410万ポンドのボーナスを受け取ったが、同社は11月までに資金が枯渇する可能性があると警告している。\nしかしウェストン氏はテムズ社の給与水準を擁護し、自身の給与は委員会によって設定されており、会社は人材を惹きつけて維持できる必要があると述べた。\n「この会社を立て直すためには、有能な人材が必要です。そして、市場価格を支払う用意がなければ、彼らは私たちのところに来ず、私たちに留まらないでしょう。」\n同氏は、水道業界に対する国民の怒りは理解しているが、時には行き過ぎだと思うと述べた。\n「スタッフに対する身体的暴行や言葉による虐待はある。私も同じように思う。どれも容認できず、適切ではない」と同氏は語った。\n干ばつは「新たな常態」\nウェストン氏は、イングランドの半分以上とウェールズ全土で干ばつが宣言された週の中で、現在見られているような暑く乾燥した状態が近年より一般的になっていると語った。\n「我々はそれに備え、将来的にこれに対処する準備をしておく必要がある」と同氏は述べた。\n「これはまさに新しい常態です。」\nテムズ川はホースパイプの使用禁止を課した数社のうちの一つで、ウェストン氏は英国が水の供給に関して現状に満足していると述べた。\n今年の1月と2月は非常に雨が多かったが、それ以降の降雨量は「情けない」ものになったと同氏は述べ、より多くの貯水池の承認を求めた。\n「夏を乗り切るのに十分な貯水量がありません。人々の水の使用を制限することなく、次の冬についても考えなければなりません。」\n関連トピック\n- 7 月 15 日発行\n- 6 月 16 日公開",

    "titleJa": "「私は使われなくなったケアホームに住むために月に580ポンドを払っています」: 財産管理人が私たちを案内してくれる",
    "summaryJa": "「私は使われなくなったケアホームに住むために月に580ポンドを払っています」: 財産管理人が私たちを案内してくれる- 公開されました",
    "bodyOriginal": "'I pay £580 a month to live in a disused care home': Property guardians show us around\n- Published\nWould you live in a disused care home, pub or bank in exchange for a heavily discounted rent?\nAs cost of living pressures persist, a growing number of people are applying to become so-called property guardians - living in vacant residential or commercial buildings to protect them from squatters, vandalism and disrepair.\nThey typically pay 30-50% less rent than private tenants, sometimes with bills thrown in, In exchange for looking after the buildings.\nHowever property guardians also have significantly fewer rights than private renters and can be evicted with just 28 days' notice.\nKatrina, 29, has spent the last 10 months living with around 50 other people in an Edwardian mansion in Hampstead, London, which was used as a care home until 2015.\nThe postgraduate student, who says she could not afford to rent privately in the capital, currently pays £580 a month for her room including bills and council tax, about £400 below the London average, external.\nKatrina says guardianship gives her the chance to live in an unusual property and describes the mansion as an \"incredible\" and \"romantic\" place despite it being \"quite run down\".\nSet in 1.7 acres of gardens, the building has grand staircases, south-west-facing balconies and chandeliers in some rooms, but it does have some downsides: \"We've had mushrooms growing on the walls, leaks, parts of the balcony stonework have fallen off,\" says Katrina.\nKatrina says she loves the communal aspect of guardianship, which is \"somewhere between living in university halls, a block of flats and a fancy squat\".\nShe lives with \"all sorts of people\", from lawyers to artists, sharing bathrooms, a kitchen and communal living areas, and regularly socialising.\nBut there are disagreements over things like noise, she says. And while Lowe, the company that manages the property, operates a stringent vetting process for its guardians, two residents have been asked to leave because of antisocial behaviour - one for alleged sexual harassment.\nLowe tells the BBC it acts \"quickly and decisively\" on the rare occasion someone breaches its standards and that the \"overwhelming majority\" of guardians go on to be \"brilliant, community-minded residents\".\n'It's really precarious'\nIn general, guardians have fewer rights than private renters, external because they hold a \"licence to occupy\" rather than a tenancy.\nGuardianship companies are not obliged to protect their deposits or carry out repairs not specifically provided for in the agreement. Landlords can also visit at any time, without warning, and evict residents without giving a reason.\nKatrina admits she worries about the temporary nature of her arrangement sometimes. A developer bought the former care home last year and plans to turn it into flats, so she will eventually have to leave.\n\"It's really precarious in that sense. It's not guaranteed to last. If anyone doesn't like that, it's not for them,\" she says.\nLast year, the Property Guardian Providers Association (PGPA) estimated there were between 10,000 and 15,000 property guardians in the UK, mainly in major cities, with most aged between 20 and 35.\nThe trade group says the number of people applying has risen sharply as rental costs soar.\nDavid Hale, 32, became a guardian almost 10 years ago to save money and has never lived in standard rental accommodation.\nHe and his wife now rent a \"massive\" space at a former primary school in Brixton, South London, for around £1,500 a month, including bills and council tax. He says they wouldn't be able to afford a similar property otherwise and save about £1,000 a month.\nTips on becoming a property guardian\nPrepare to be flexible: You may stay for several years, or you may need to move on with relatively short notice.\nChoose an established guardian company: Look for a reputable provider with good health and safety procedures\nRead your licence agreement carefully: Understand your responsibilities to the building, house rules and visitor policies\nKnow your rights: Guardians are legally entitled to a court order before they can be evicted and their home must be safe to live in\nEmbrace community living: Be considerate of those you live with and respect shared areas.\nSources: the Property Guardian Providers Association, Shelter, Ad Hoc Property Management\nAround 20 guardians live in the school's open classrooms and offices, sharing a kitchen and large garden.\nBut while David has enjoyed communal living, he and his wife are saving to buy their own home: \"We wouldn't want to share toilets and bathrooms forever. We also want to start a family.\"\nThe PGPA believes guardianship could help ease the UK's housing crisis by providing affordable temporary accommodation for thousands of people.\nIt points out that over a million homes currently stand empty, along with tens of millions of square feet, external of non-residential property.\nBut housing charity Shelter argues the rise of property guardianship shows how people are being forced \"further and further afield just to keep a roof over their heads\".\n\"For most, this isn't a good alternative to an affordable, stable home,\" says chief executive Sarah Elliott.",
    "bodyJa": "「私は使われなくなったケアホームに住むために月に580ポンドを払っています」: 財産管理人が私たちを案内してくれる\n- 公開されました\n家賃を大幅に割引してもらう代わりに、使われなくなった老人ホーム、パブ、銀行に住みますか?\n生活費の圧迫が続く中、不法占拠者や破壊行為、荒らしから守るために空き家や商業ビルに住み、いわゆる財産保護者になることを申請する人が増えている。\n彼らは通常、建物の管理と引き換えに、民間のテナントよりも 30 ～ 50% 安い家賃を支払い、場合によっては請求書を投げ込まれます。\nただし、不動産後見人は民間賃貸人よりも権利が大幅に低く、わずか 28 日前の通知で立ち退かせることができます。\n29歳のカトリーナさんは、過去10か月間、ロンドンのハムステッドにあるエドワード朝様式の邸宅で約50人と一緒に暮らしてきたが、この邸宅は2015年までケアホームとして使われていた。\n首都で個人的に賃貸する余裕がなかったと語るこの大学院生は、現在、請求書や市税を含めて部屋代として月に580ポンドを払っており、これはロンドンの外部平均よりも約400ポンド低い。\nカトリーナさんは、後見人のおかげで珍しい物件に住むチャンスが与えられたと述べ、その邸宅は「かなり荒廃している」にもかかわらず「信じられないほど」「ロマンチックな」場所だと述べている。\n1.7エーカーの庭園内に建つこの建物には、大階段、南西向きのバルコニー、一部の部屋にはシャンデリアが付いているが、欠点もいくつかある。「壁にキノコが生えたり、雨漏りしたり、バルコニーの石造の一部が落ちたりしました」とカトリーナさんは言う。\nカトリーナさんは、後見制度の共同体的な側面が大好きだと語る。それは「大学のホール、集合住宅、派手なスクワットの間のようなもの」だという。\n彼女は弁護士からアーティストまで「あらゆる種類の人々」と暮らしており、バスルーム、キッチン、共同生活エリアを共有し、定期的に社交を行っている。\nしかし、騒音などについては意見の相違がある、と彼女は言う。また、この物件を管理するロウ社は保護者に対して厳格な審査プロセスを実施しているが、住民2名が反社会的行為を理由に退去を求められており、そのうちの1名はセクハラの疑いで退去を求められている。\nロウ氏はBBCに対し、稀に誰かが基準に違反した場合には「迅速かつ断固とした」行動をとり、保護者の「圧倒的多数」は今後も「優秀で地域志向の住民」であると語った。\n「本当に危ないですよ」\n一般に、後見人は賃貸借契約ではなく「占有許可」を保有しているため、外部の賃貸人よりも権利が少ないです。\n後見会社は、預金を保護したり、契約に特に規定されていない修繕を実行したりする義務はありません。家主はいつでも警告なしに訪問し、理由を告げずに住民を立ち退かせることもできる。\nカトリーナは、自分の取り決めが一時的なものであることを時々心配することを認めています。開発業者は昨年、以前のケアホームを購入し、アパートに変える計画を立てているため、彼女は最終的には退去しなければならないだろう。\n「そういう意味では本当に不安定です。長く続くという保証はありません。もしそれを好まない人がいたら、それはその人のためではありません」と彼女は言う。\n昨年、不動産保護プロバイダー協会（PGPA）は、英国には主に主要都市に1万人から1万5千人の不動産後見人がおり、そのほとんどが20歳から35歳の間であると推定した。\n業界団体によると、賃貸料の高騰に伴い応募者数が急増しているという。\nデビッド・ヘイルさん（32歳）は、お金を節約するためにほぼ10年前に後見人になったが、標準的な賃貸住宅には一度も住んだことがない。\n彼と妻は現在、南ロンドンのブリクストンにある元小学校の「広大な」スペースを、請求書と市税を含めて月額約1500ポンドで借りている。そうでなければ、同様の物件を購入する余裕はなく、月に約 1,000 ポンドを節約することはできなかったでしょう、と彼は言います。\n財産後見人になるためのヒント\n柔軟に対応できるように準備してください。数年間留まる場合もあれば、比較的短期間で異動する必要がある場合もあります。\n確立された後見会社を選択する: 適切な健康と安全手順を備えた信頼できるプロバイダーを探します\nライセンス契約をよく読み、建物、ハウスルール、訪問者のポリシーに対する責任を理解してください。\n自分の権利を知る: 後見人は立ち退かせる前に裁判所命令を受ける法的権利があり、自宅が安全に住める必要があります。\nコミュニティ生活を受け入れる: 一緒に住んでいる人たちに配慮し、共有エリアを尊重します。\n出典: Property Guardian Providers Association、Shelter、Ad Hoc Property Management\n約 20 人の保護者が学校の開かれた教室とオフィスに住んでおり、キッチンと広い庭を共有しています。\nしかし、デイビッドさんは共同生活を楽しんでいる一方で、夫婦でマイホーム購入のために貯金をしている。「トイレやバスルームを永遠に共有したくはない。家族を持ちたいとも思っている」。\nPGPAは、後見制度が数千人に手頃な価格の一時的な宿泊施設を提供することで、英国の住宅危機の緩和に役立つ可能性があると考えている。\n同報告書は、現在、非住宅用地以外の数千万平方フィートの空き家とともに、100万戸を超える住宅が放置されていると指摘している。\nしかし、住宅慈善団体シェルターは、財産後見制度の台頭は人々が「屋根を守るためだけにますます遠くへ」追い込まれている状況を示していると主張する。\n「ほとんどの人にとって、これは手頃な価格で安定した住宅に代わる良い選択肢ではありません」と最高経営責任者サラ・エリオット氏は言う。",

    "bodyOriginal": "India wants to join the strawberry superpowers\n- Published\nIn the west of India, the mountainous region of Mahabaleshwar is home to most of India's strawberry farms.\nAround 85% of India's strawberry cultivation happens there.\nAn altitude of more than 1,000m (3,280ft) gifts the region a long cool growing season between November and March.\nIn addition, light, well-drained soil is well-suited to strawberry cultivation.\nBut that doesn't mean farmers have an easy life - it's a labour intensive and risky way to make a living.\n\"If you have a field full of strawberries and sudden heavy rains hit, the entire crop is ruined and we have to bear massive losses,\" says Sheetal Danavle who, with her husband, grows strawberries on half of their three-acre farm.\nStrawberry plants have to be replaced every season and are not grown from seed. Instead, farmers buy young plants from suppliers. For Danavle, on her small farm, that's an outlay of $2,500 (£1,900) every year.\n\"If the season goes well, you can earn double your investment. But the climate makes it a huge gamble,\" she says.\nThousands of farmers grow strawberries across the Mahabaleshwar region, making the fruit one of the most profitable horticultural crops in western India.\nDespite that success the industry still relies on varieties that are imported from California, Florida, Italy and Spain, as no one in India has developed a domestic plant.\nIt can take 10 to 15 years for breeders in the US and Europe to develop a top quality fruit and they patent their varieties.\n\"We import the certified mother plant from the breeder abroad,\" says Nelson Sequeira, the founder and director of Tara Farms Fresh, a licensed strawberry propagator.\nOnce imported the plants have to go through a government quarantine, before they are planted in a nursery. There the mother plant produces daughter plants and those are then sold to farmers.\n\"One single imported mother plant becomes an engine. That single mother plant will shoot out runners to yield an average of 20 daughter plants - with some advanced growers pushing that up to 30 or 40,\" says Sequeira.\nIt's a high-tech and precision operation.\n\"The plants do not touch the ground. We use large industrial pipes split completely in half to form long, rounded gutter containers,\" Sequeira explains.\n\"Instead of soil, we pack these containers with a specialized coco-peat substrate derived entirely from coconut husk. We then integrate a highly precise drip-irrigation and fogging system to control micro-climates.\"\nSequeira and other propagators rely on mother plants from abroad - for now.\nBut work at Mahatma Phule Krishi Vidyapeeth (MPKV), an agricultural university in Maharashtra, might change that.\nMPKV has partnered with the Bhabha Atomic Research Centre (BARC) on a breeding experiment.\nResearchers are using controlled, low-dose gamma irradiation on plant tissues to induce stable genetic mutations.\n\"The goal is to fast-track the development of India's first indigenous, climate-resilient strawberry cultivar that matches the large fruit size and firm texture of foreign varieties while natively tolerating Indian heatwaves,\" says Dr Darshan Shashank Kadam, assistant professor of Horticulture at MPKV.\nHe admits it could be a long process, with results perhaps in 10 or 15 years. But in the near term they are helping farmers in other ways.\n\"We are developing scientific packages of practices for farmers. We have already standardised planting schedules, fertiliser recommendations and growth regulator applications specifically for Mahabaleshwar conditions,\" he says.\nLarge farms with more resources are investing in new technology.\nKetan Yashwant Sodha, is the founder and CEO of Berry Fresh Agrotech. He started with traditional open-field farming, but was frustrated by losses caused by the weather.\n\"For the past 10 years, it has consistently rained in India during our peak season - November, December, and the first week of January. When you are in an open field and your plantation is at its absolute peak, a single rain will ruin your entire crop,\" he says.\nSo in 2022, he started to experiment with hydroponics, a type of covered cultivation that does not use soil and tightly controls water, nutrients, light, and temperature.\nHis early results were not encouraging.\n\"I suffered immense losses and failed multiple times,\" Sodha says.\n\"The soil is forgiving; hydroponics does not forgive. If you make a mistake today, you will wake up tomorrow morning to a disaster - and the recovery time in hydroponics takes twice as long as soil.\"\nBut the lessons learned from those mistakes are paying off.\n\"We have trailed 19 different varieties, including rare Japanese ones, and we are the only ones in India trailing a specific Netherlands variety this season.\"\nSodha says that limiting each plant to 750ml of water a day produces \"rich, highly concentrated sugars and aromas instead of water-logged, bland fruits\".\nHis team also runs what he calls regular \"blood work\" on the crops, which involves laboratory testing of the leaves and petioles (the stalks attaching leaves to the stems) to measure exact nutrient uptake. That way he knows exactly which nutrients and chemicals need to go into the water supply.\nAnd by using a semi-open polyhouse, strawberries can grow the whole year round. \"It's not a seasonal fruit for us,\" Sodha says.\nNow he is ready to scale-up.\n\"We have built the trial facility, written the SOPs (standard operating procedures), and designed the farm manual. We are talking to investors to expand to a five-acre facility that will accommodate 200,000 plants.\"\nKrishan Bhilare's family has been farming strawberries for generations in Mahabaleshwar.\nHe can remember when the first American varieties were planted in 1992 and being amazed at the size of the fruit.\nBhilare is part of a Farmer Producer Organisation (FPO) network. They have installed towers at four strategic locations across their land. The towers monitor weather conditions.\nThe system employs AI, which uses the weather data to pinpoint when rain will strike. Farmers can then be advised to delay spraying their crops, so expensive chemicals are not just washed away.\nThe FPO is also building vertical towers, where strawberries can be grown on a coco-peat substrate, five layers deep.\n\"By stacking five pots into a single vertical tower, we can scale our density from 25,000 plants to 125,000 plants per acre. We are effectively multiplying our production footprint by five times on the exact same piece of land,\" says Bhilare.\nBut such investments are either beyond small farms, or a huge risk.\nIn 2017, Danavle and her husband experimented with hydroponic strawberry farming.\n\"The experiment was 100% successful and the fruits we grew were entirely organic. It saved us a lot of labour, the workers didn't have to constantly bend down or prune, and it saved us a lot of money on medicines and field manure.\"\nBut they were unlucky - a massive cyclone hit Mahabaleshwar that year.\n\"The cyclone completely knocked down our entire hydroponic setup. Then we did not have the courage to set it up again.\"\nSo, Sheetal went back to the traditional method of growing strawberries, but with a twist.\n\"I took help of social media. I post videos of how one can grow strawberries and invite tourists to visit my strawberry farm, learn and pick the fruit. They directly now buy from the farm. This has helped, cut the middle man, and make more profit. So, now I am an influencer and entrepreneur.\"\nMore Technology of Business\n- Published3 July\n- Published26 June\n- Published12 June",
    "bodyJa": "インド、イチゴ大国の仲間入りを目指す\n- 公開されました\nインド西部のマハバレーシュワルの山岳地帯には、インドのイチゴ農園のほとんどが集中しています。\nインドのイチゴ栽培の約 85% がインドで行われています。\n標高 1,000 メートル (3,280 フィート) を超えるため、この地域は 11 月から 3 月までの長く涼しい生育期に恵まれます。\nまた、軽くて水はけの良い土壌がイチゴ栽培に適しています。\nしかし、それは農民が楽な生活を送っているという意味ではありません。それは生計を立てるための労働集約的で危険な方法です。\n「イチゴがいっぱいの畑に突然の大雨が降ったら、作物全体が台無しになり、私たちは多大な損失を被らなければなりません」と、夫とともに3エーカーの農場の半分でイチゴを栽培しているシータル・ダナヴルさんは言う。\nイチゴの苗は季節ごとに植え替える必要があり、種から育てることはできません。代わりに、農家は供給業者から若い植物を購入します。ダナブルさんの小さな農場では、毎年 2,500 ドル (1,900 ポンド) の出費になります。\n「シーズンがうまくいけば、投資額の2倍を稼ぐことができます。しかし、気候のせいでそれは大きな賭けになります」と彼女は言う。\nマハバレーシュワル地方では何千もの農家がイチゴを栽培しており、イチゴはインド西部で最も収益性の高い園芸作物の 1 つとなっています。\nこのような成功にもかかわらず、インドでは国内の植物を開発した者がいないため、業界は依然としてカリフォルニア、フロリダ、イタリア、スペインから輸入された品種に依存している。\n米国やヨーロッパの育種家が最高品質の果物を開発するには10年から15年かかる場合があり、彼らはその品種の特許を取得しています。\n「私たちは海外の育種家から認定された母植物を輸入しています」と、認可されたイチゴ繁殖業者であるタラ・ファームズ・フレッシュの創設者兼ディレクターであるネルソン・セケイラ氏は言います。\n輸入された植物は苗床に植えられる前に政府による検疫を受けなければなりません。そこでは母植物が娘植物を生産し、それらが農家に販売されます。\n「輸入された 1 つの母植物がエンジンになります。その 1 つの母植物がランナーを発射して、平均 20 の娘植物を生産します。一部の先進的な栽培者は、それを 30 または 40 にまで増やします」とセケイラ氏は言います。\nハイテクかつ精密な手術です。\n「植物は地面に触れません。私たちは完全に半分に分割した大きな工業用パイプを使用して、長くて丸い側溝コンテナを形成します」とセケイラ氏は説明します。\n「土の代わりに、ココナッツの殻のみから抽出した特殊なココピート基質をこれらのコンテナに詰めます。その後、微気候を制御するために高精度の点滴灌漑と噴霧システムを統合します。」\nセケイラと他の繁殖者は、今のところ海外からの母植物に依存している。\nしかし、マハラシュトラ州の農業大学、マハトマ・プーレ・クリシ・ヴィディヤピース（MPKV）での研究が状況を変えるかもしれない。\nMPKVは繁殖実験においてバーバ原子力研究センター（BARC）と提携した。\n研究者らは、植物組織に制御された低線量のガンマ線照射を使用して、安定した遺伝子変異を誘導しています。\nMPKVの園芸学部助教授、ダルシャン・シャシャンク・カダム博士は、「目標は、外国品種の大きな果実の大きさとしっかりした食感に匹敵し、インドの熱波にも耐えられる、インド初の気候変動に強いインド固有のイチゴ品種の開発を急ぐことだ」と語る。\n彼は、それは長いプロセスになる可能性があり、結果が得られるまでにおそらく 10 年か 15 年かかる可能性があることを認めています。しかし、短期的には、彼らは別の方法で農家を支援している。\n「私たちは農家向けの科学的な実践パッケージを開発しています。私たちはすでに、特にマハバレシュワルの条件に合わせた作付けスケジュール、推奨肥料、および成長調整剤の適用を標準化しています」と彼は言います。\nより多くの資源を持つ大規模農場は、新しいテクノロジーに投資しています。\nKetan Yashwant Sodha は、Berry Fresh Agrotech の創設者兼 CEO です。彼は伝統的な露地農業から始めましたが、天候による損失に挫折しました。\n「過去10年間、インドではピークシーズンである11月、12月、そして1月の第1週に一貫して雨が降りました。野原にいてプランテーションがまさに最盛期にあるとき、たった1回の雨で作物全体がダメになってしまいます。」と彼は言います。\nそこで彼は 2022 年に水耕栽培の実験を開始しました。これは土を使用せず、水、栄養素、光、温度を厳密に制御する屋根付き栽培の一種です。\n彼の初期の成績は期待できるものではありませんでした。\n「私は巨額の損失を被り、何度も失敗しました」とソーダ氏は言う。\n「土壌は寛容ですが、水耕栽培は寛容ではありません。今日失敗すると、明日の朝目が覚めると大惨事になります。そして、水耕栽培の回復時間は土壌の2倍かかります。」\nしかし、それらの失敗から学んだ教訓は成果を上げています。\n「私たちは珍しい日本の品種を含む19種類の品種を追跡してきましたが、今シーズン特定のオランダの品種を追跡しているのはインドで私たちだけです。」\nソーダ氏は、各植物の水を1日750mlに制限すると、「水分をたっぷり含んだ味気ない果物の代わりに、濃厚で高濃度の糖分と香り」が得られると述べている。\n彼のチームはまた、作物に対して彼が定期的に「血液検査」と呼ぶものを実施している。これには、正確な栄養素の摂取量を測定するために、葉と葉柄（葉と茎を結び付ける茎）の実験室検査が含まれる。そうすることで、どの栄養素や化学物質が給水に必要なのかを正確に知ることができます。\nまた、セミオープンポリハウスを使用することで、一年中イチゴを栽培することができます。 「私たちにとって、それは季節の果物ではありません」とソーダさんは言います。\n今、彼はスケールアップする準備ができています。\n「私たちは試験施設を建設し、SOP（標準作業手順書）を作成し、農場マニュアルを設計しました。20万本の植物を収容できる5エーカーの施設に拡張するために投資家と話し合っています。」\nクリシャン・ビラレさんの家族は、マハバレシュワルで何世代にもわたってイチゴを栽培してきました。\n彼は、1992 年に最初のアメリカの品種が植えられたとき、その果実の大きさに驚いたことを覚えています。\nビラレは農家生産者組織 (FPO) ネットワークの一部です。彼らは敷地内の 4 つの戦略的な場所に塔を設置しました。タワーは気象状況を監視します。\nこのシステムは AI を採用しており、気象データを使用して雨が降る時期を正確に特定します。これにより、高価な化学物質が単に洗い流されることがないよう、農家に作物の散布を遅らせるようアドバイスすることができます。\nFPO はまた、深さ 5 層のココ泥炭の基質上でイチゴを栽培できる垂直タワーの建設も行っています。\n「5 つのポットを 1 つの垂直タワーに積み重ねることで、1 エーカーあたり 25,000 本の植物の密度を 125,000 本の植物に増やすことができます。まったく同じ土地で、実質的に生産面積を 5 倍に増やすことができます」とビラレ氏は言います。\nしかし、そのような投資は小規模農場を超えているか、大きなリスクを伴うかのどちらかです。\n2017 年、ダナヴルさんと夫はイチゴの水耕栽培を実験しました。\n「実験は100%成功し、私たちが育てた果物は完全にオーガニックでした。そのおかげで私たちは大幅な労力を節約でき、労働者は常にかがんだり剪定したりする必要がなくなり、薬や畑の肥料にかかるお金も大幅に節約できました。」\nしかし、彼らは不運でした。その年、大規模なサイクロンがマハバレーシュワルを襲いました。\n「サイクロンのせいで、私たちの水耕栽培設備全体が完全に破壊されました。その後、私たちには再び水耕栽培設備を設置する勇気がありませんでした。」\nそこでシータルは、ひねりを加えて伝統的なイチゴ栽培方法に戻りました。\n「私はソーシャルメディアの助けを借りました。私はイチゴの育て方のビデオを投稿し、観光客を私のイチゴ農場に来て学び、果物を収穫するよう招待しています。今では彼らは農場から直接購入しています。これにより仲介業者が削減され、より多くの利益が得られました。つまり、今では私はインフルエンサーであり起業家です。」\nビジネスのさらなるテクノロジー\n- 7 月 3 日発行\n- 6 月 26 日発行\n- 6 月 12 日発行",

    "id": "amazon-hikes-2026-capex-to-220-billion-d-6495aca5",
    "title": "Amazon hikes 2026 capex to $220 billion due to higher memory costs",
    "titleJa": "Amazon、メモリコストの高騰により、2026年の設備投資を2,200億ドルに引き上げ",
    "summaryJa": "Amazon は第 2 四半期にクラウドの急増を報告し、人工知能の強い需要を指摘し、同社は年間の設備投資予測を上方修正しました。株価は延長取引で１０％以上急騰した。",
    "bodyOriginal": "Amazon reported surging cloud growth during the second quarter, pointing to strong artificial intelligence demand, and the company boosted its capital spending forecast for the year.\nThe stock shot up more than 10% in extended trading.\nHere's how the company did, compared with estimates from analysts polled by LSEG:\n- Earnings per share: $5.75 a share. That may not compare with the $1.82 per share expected by LSEG\n- Revenue: $200.61 billion vs. $196.47 billion estimated\nWall Street was also looking at other key revenue numbers:\n- Amazon Web Services: $42.2 billion vs. $40.54 billion expected, according to StreetAccount\n- Advertising: $19.81 billion vs. $19.43 billion expected, according to StreetAccount\nAmazon said it expects to spend even more on AI, with capital expenditures projected to hit $220 billion this year, CEO Andy Jassy said on a conference call with investors. In February, the company said capex would hit $200 billion this year, and it held steady on that forecast in April.\nJassy said rising memory prices pushed its capex estimate higher. He suggested Amazon's spending spree isn't likely to abate anytime soon.\n\"But even at that amount, we will still not have enough capacity to meet all the demand we have in 2026, and I believe this dynamic will also be true in 2027 too,\" Jassy said. \"In fact, the demand we already have for 2028 is striking.\"\nWall Street had anticipated Amazon would boost its capex forecast after Alphabet hiked its spending plans to as high as $205 billion.\nRevenue in Amazon's cloud segment expanded 37% year over year during the quarter, surpassing Wall Street's expectations for 31% growth. That marked the unit's fastest growth since 2021, Jassy said in the earnings release.\nHeading into the earnings report, investors were keenly focused on AWS growth after Amazon's primary cloud rivals posted robust cloud results. Alphabet last week reported Google Cloud growth of 82%, while Microsoft's Azure cloud revenue rose 43% during the fiscal fourth quarter.\nJassy said AWS is \"booming,\" and pointed to the growth of its artificial intelligence and homegrown chips units, which both exceeded a $25 billion annual revenue run rate. Amazon has increasingly looked to highlight its in-house chips division, which includes the Trainium and Graviton brands, as a newer growth pillar for the company. Its AI products like the Bedrock model marketplace have primarily been targeted for enterprises.\nAmazon has been juggling the need to spend massive sums on AI products and infrastructure, while also appeasing jittery investors eager to see returns on those investments. Capital expenditures during the quarter reached $54.2 billion during the June quarter, compared with $32.1 billion a year ago.\nThe lavish spending has caused Amazon's free cash flow to flip into the red. The company's free cash flow for the trailing twelve months amounted to an outflow of $7.6 billion, while it recorded an inflow of $18.2 billion one year earlier.\nOn a conference call with investors, Jassy highlighted that those investments are necessary to fulfill the surging demand for its cloud services. AWS backlog, or contracted work that hasn't come online yet, reached $496 billion during the quarter, he said.\nFor the current quarter, Amazon guided for revenue between $197 billion and $202 billion. Analysts polled by LSEG were expecting $204.1 billion.\nThe company blamed tough comparisons to last year's third quarter as a result of its decision to shift this year's Prime Day discount event up to June, instead of its typical July timeframe. Excluding the impact of this year and last year's Prime Day, third-quarter 2026 growth \"would be nearly 400 basis points higher,\" Amazon said.\nAmazon doesn't disclose Prime Day revenue, but U.S. sales across online retailers grew 9% to $26.4 billion during the weeklong event, according to Adobe. Prime Day helped lift Amazon's North America revenue 16% year over year to $116.2 billion during the second quarter.\nOperating income in the third quarter is expected to be in the range of $22.5 billion to $26.5 billion, while analysts polled by StreetAccount forecast $24.92 billion.\nNet income for the second quarter was $62.6 billion, or $5.75 per share, compared with $18.2 billion, or $1.68 per share, a year earlier. The company said this includes pre-tax income of $53.4 billion, primarily from its investments in AI lab Anthropic.\nAmazon said it more than doubled the number of new customers for its online pharmacy service, and grew same-day prescription deliveries \"nearly 5x.\" The company has operated Amazon Pharmacy since 2020, and the service remains a key pillar of its health-care push, but it has shared scant details about user sign-ups.",
    "bodyJa": "Amazon は第 2 四半期にクラウドの急増を報告し、人工知能の強い需要を指摘し、同社は年間の設備投資予測を上方修正しました。\n株価は延長取引で１０％以上急騰した。\nLSEGが調査したアナリストの予想と比較した同社の業績は次のとおりです。\n- 1 株あたりの利益: 1 株あたり 5.75 ドル。これはLSEGが予想する1株あたり1.82ドルとは比較にならないかもしれない\n- 収益: 2,006 億 1 千万ドル対推定 1,964 億 7 千万ドル\nウォール街は他の重要な収益数字にも注目していました。\n- アマゾン ウェブ サービス: StreetAccount によると、422 億ドル対予想 405 億 4000 万ドル\n- 広告: StreetAccount によると、198 億 1000 万ドル対予想 194 億 3000 万ドル\nアマゾンのアンディ・ジャシー最高経営責任者（CEO）は投資家との電話会議で、今年の設備投資は2200億ドルに達すると予想されており、AIへの投資はさらに増えると予想していると述べた。同社は２月に今年の設備投資が２０００億ドルに達するとの見通しを示し、４月時点でもその見通しを据え置いた。\nジャシー氏は、メモリ価格の上昇により設備投資の見積もりが上昇したと述べた。同氏は、アマゾンの浪費はすぐには収まらない可能性が高いと示唆した。\n「しかし、たとえその量であっても、2026年にすべての需要を満たすのに十分な生産能力はまだありません。この力関係は2027年にも当てはまると思います」とジャシー氏は述べた。 「実際、2028 年に向けてすでに需要は顕著です。」\nウォール街は、アルファベットが支出計画を2050億ドルまで引き上げたことを受けて、アマゾンが設備投資予測を引き上げると予想していた。\n同四半期におけるアマゾンのクラウド部門の収益は前年同期比37％増加し、ウォール街の予想である31％成長を上回った。ジャシー氏は決算発表で、これは同部門の2021年以来の最速成長を記録したと述べた。\nAmazonの主なクラウドライバルが堅調なクラウド業績を発表したことを受け、決算報告に向けて投資家はAWSの成長に熱心に注目していた。 Alphabet は先週、Google Cloud の成長率が 82% であり、Microsoft の Azure クラウドの売上高は第 4 四半期中に 43% 増加したと報告しました。\nジャシー氏は、AWSが「急成長」していると述べ、同社の人工知能と自社製チップ部門の成長がいずれも年間収益ランレートで250億ドルを超えていると指摘した。アマゾンは、TrainiumやGravitonブランドを含む自社チップ部門を同社の新たな成長の柱としてますます強調しようとしている。 Bedrock モデル マーケットプレイスのような同社の AI 製品は主に企業をターゲットにしています。\nアマゾンは、AI製品やインフラストラクチャーに巨額の資金を投じる必要性とうまく折り合いをつけながら、投資からの利益を求める神経質な投資家をなだめている。同四半期の設備投資は、前年同期の321億ドルに対し、6月四半期には542億ドルに達した。\n贅沢な支出によりアマゾンのフリーキャッシュフローは赤字に転じた。その後 12 か月間の同社のフリー キャッシュ フローは 76 億ドルの流出に達しましたが、1 年前には 182 億ドルの流入を記録しました。\nジャシー氏は投資家との電話会議で、クラウドサービスに対する急増する需要を満たすにはこうした投資が必要であると強調した。同氏によると、AWSのバックログ、つまりまだオンラインになっていない契約作業は、同四半期中に4960億ドルに達したという。\n今四半期について、Amazon は 1,970 億ドルから 2,020 億ドルの収益を見込んでいます。 ＬＳＥＧがまとめたアナリスト予想は２０４１億ドルだった。\n同社は、今年のプライムデー割引イベントを通常の7月の期間ではなく6月に変更する決定を行った結果、昨年の第3四半期との比較が厳しくなったと主張した。今年と昨年のプライムデーの影響を除けば、2026年第3四半期の成長率は「400ベーシスポイント近く高くなるだろう」とアマゾンは述べた。\nアマゾンはプライムデーの収益を明らかにしていないが、アドビによると、1週間にわたるイベント期間中の米国のオンライン小売業者全体の売上高は9％増の264億ドルとなった。プライムデーのおかげで、第 2 四半期のアマゾンの北米売上高は前年同期比 16% 増の 1,162 億ドルとなりました。\n第３・四半期の営業利益は２２５億─２６５億ドルの範囲になると予想されているが、ストリートアカウントがまとめたアナリスト予想は２４９億２０００万ドルだった。\n第2四半期の純利益は626億ドル（1株当たり5.75ドル）で、前年同期は182億ドル（1株当たり1.68ドル）でした。同社によると、これには主にAIラボAnthropicへの投資による税引前利益534億ドルが含まれているという。\nアマゾンは、オンライン薬局サービスの新規顧客数が２倍以上に増加し、処方箋の当日配達件数が「５倍近く」増加したと発表した。同社は2020年からAmazon Pharmacyを運営しており、このサービスは依然として同社のヘルスケア推進の重要な柱であるが、ユーザーのサインアップに関する詳細はほとんど共有されていない。",

    "title": "Jersey Mike's stock falls 7% in public market debut after pricing shares at $23",
    "titleJa": "ジャージー・マイクの株価は23ドルで株価を公開後、公開市場デビューで7％下落",
    "summaryJa": "ジャージー・マイクズの株価は、同社がティッカー「JMKE」でニューヨーク証券取引所に上場した後、木曜午後の取引で約7％下落した。株価は1株あたり21ドルと予想レンジの中間点である1株あたり23ドルを下回る21ドルで取引を開始した。",
    "bodyOriginal": "Shares of Jersey Mike's fell about 7% during trading on Thursday afternoon after the company made its public market debut on the New York Stock Exchange under the ticker \"JMKE.\"\nThe stock opened at $21 per share, below its initial public offering pricing of $23 per share, at the midpoint of the expected range of $21 to $25 per share.\nJersey Mike's sold 43.5 million shares, raising about $1 billion and valuing the company at $7.3 billion. With those proceeds, the chain is now among the largest-ever initial fundraises for a restaurant IPO.\nJersey Mike's has nearly 3,300 locations, making it the second-largest hoagie sandwich chain in the U.S. behind Subway. It's now the largest public chain in the category.\nThe company reported net income of $55 million on total revenue of $724 million last year. Its same-store sales increased 3% over the same period. The metric tracks sales growth at restaurants open at least a year.\nBroadly, diners are eating out less often or seeking deals to save money, and the restaurant industry has seen traffic and sales soften. But Jersey Mike's has largely bucked the trend, and its high average unit volumes and asset-light franchise model made the stock attractive to investors.\nCEO Charlie Morrison told CNBC that Jersey Mike's customer base typically skews \"a little higher income,\" insulating the chain from some of the pullback in consumer spending.\n\"We're seeing the consumer come back,\" Morrison said. \"We've seen positive transition growth. In fact, most of our same-store sales growth this year to date has been driven primarily by transaction growth.\"\nJersey Mike's successful IPO is a positive harbinger for other consumer companies looking to go public. Rival restaurant company Inspire Brands, which counts Dunkin' and Jimmy John's among its brands, has confidentially filed for an initial public offering and could easily snatch Jersey Mike's title for biggest-ever restaurant IPO.\nClothing company Reformation is also expected to make its public market debut on Thursday; the retailer priced shares at $15, on the low end of its expected range of $15 to $17.\nJersey Mike's expansion plans\nJersey Mike's founder Peter Cancro began working at a Jersey Shore sandwich shop at age 14 in 1971. Four years later, he pulled together enough money to buy Mike's Subs. Cancro later changed the name and began franchising the chain. Today, franchisees operate 99.2% of Jersey Mike's locations.\nIn late 2024, Jersey Mike's announced that Blackstone had bought a majority stake reportedly valued at around $8 billion including debt.\nAfter the transaction closed, Jersey Mike's tapped Morrison as its chief executive. He previously led Wingstop for more than a decade, including during the chicken wing chain's own IPO.\nMorrison said that he sees a lot of similarities with Wingstop. Like the chicken wing chain, Jersey Mike's is mostly franchised and generates free cash flow for investors.\nJersey Mike's plans to use the proceeds from the offering to pay down debt and general corporate purposes.\nLooking ahead, the chain plans to expand its international reach.\nThe vast majority of its restaurants are in the U.S., a relatively mature market for hoagies. Cancro, who has retained some equity in Jersey Mike's, signed a master franchise agreement to bring Jersey Mike's to the United Kingdom and Ireland.\nLong term, Jersey Mike's sees the potential for 15,000 restaurants worldwide — half in the U.S., half in international markets.\n\"One of the benefits of being a publicly traded company on the New York Stock Exchange is that we get a lot of awareness of the brand, not only in the U.S., but also around the world,\" Morrison said.",
    "bodyJa": "ジャージー・マイクズの株価は、同社がティッカー「JMKE」でニューヨーク証券取引所に上場した後、木曜午後の取引で約7％下落した。\n株価は1株あたり21ドルと予想レンジの中間点である1株あたり23ドルを下回る21ドルで取引を開始した。\nジャージー・マイクズは4,350万株を売却し、約10億ドルを調達し、企業価値は73億ドルとなった。これらの収益により、このチェーンは現在、レストランの IPO における史上最大の初期資金調達の 1 つとなっています。\nJersey Mike's は約 3,300 店舗を展開しており、米国では Subway に次ぐ 2 番目に大きなホーギー サンドイッチ チェーンです。現在、このカテゴリーで最大のパブリックチェーンとなっています。\n同社は昨年、総収益が7億2,400万ドルで、純利益が5,500万ドルだったと報告した。同期間の既存店売上高は３％増加した。この指標は、少なくとも 1 年間オープンしたレストランの売上の伸びを追跡します。\n概して、ダイナーは外食の頻度を減らしたり、お金を節約するための取引を求めたりしており、レストラン業界では客足と売上が減少している。しかし、ジャージー・マイクズはその傾向に大きく逆らっており、その高い平均ユニットボリュームと資産の少ないフランチャイズモデルにより、この株は投資家にとって魅力的なものとなった。\n最高経営責任者（CEO）のチャーリー・モリソン氏はCNBCに対し、ジャージー・マイクの顧客ベースは通常「少し高収入」に偏っており、消費支出の一部の反動からチェーンを守っていると語った。\nモリソン首相は「消費者が戻ってきているのを目にしている」と述べた。 「当社は移行期におけるプラスの成長を確認しています。実際、今年から現在までの当社の既存店売上高の伸びのほとんどは、主に取引の伸びによってもたらされています。」\nジャージー・マイク氏のIPOの成功は、上場を目指す他の消費者企業にとって前向きな前兆となる。ライバルのレストラン会社インスパイア・ブランズはダンキンやジミー・ジョンズを自社ブランドに数えており、極秘に新規株式公開を申請しており、ジャージー・マイクの史上最大のレストランIPOの称号をいとも簡単に奪う可能性がある。\n衣料品会社リフォーメーションも木曜日に公開市場デビューを果たす予定だ。小売業者は株価を15ドルと予想し、15ドルから17ドルの範囲の下限に設定した。\nジャージー・マイクの拡張計画\nJersey Mikeの創設者であるPeter Cancroは、1971年に14歳でジャージーショアのサンドイッチ店で働き始めました。4年後、彼はMike's Subsを購入するのに十分な資金を集めました。 Cancro は後に名前を変更し、チェーンのフランチャイズ化を開始しました。現在、フランチャイズ加盟者はジャージー マイクの店舗の 99.2% を運営しています。\n2024年後半、ジャージー・マイクズは、ブラックストーンが負債を含めて約80億ドルと伝えられる過半数の株式を購入したと発表した。\n取引完了後、ジャージー・マイクズはモリソン氏を最高経営責任者に指名した。彼は以前、チキンウィング チェーン自身の IPO を含め、10 年以上にわたってウィングストップを率いていました。\nモリソン氏はウイングストップと多くの類似点があると述べた。チキンウィング チェーンと同様、Jersey Mike's もほとんどがフランチャイズ化されており、投資家にフリー キャッシュ フローを生み出しています。\nジャージー・マイク氏は、今回の募集で得た収益を負債の返済と一般的な企業目的に使用する計画だ。\n今後を見据えて、このチェーンは国際的な展開を拡大することを計画しています。\n同社のレストランの大部分は、ホーギー市場が比較的成熟している米国にあります。カンクロはジャージー・マイクズの株式の一部を保持しており、ジャージー・マイクズを英国とアイルランドに導入するためのマスターフランチャイズ契約に署名した。\n長期的には、Jersey Mike's は世界中に 15,000 軒のレストランができる可能性があると考えています。その半分は米国内、半分は海外市場にあります。\nモリソン氏は「ニューヨーク証券取引所に上場している企業であることの利点の一つは、米国だけでなく世界中でブランドの認知度が高まっていることだ」と述べた。",

  {
    "id": "trump-says-sanctions-bill-should-include-5260b6a8",
    "title": "Trump says sanctions bill should include tariffs on Iran, despite 'trivial' trade with U.S.",
    "titleJa": "トランプ大統領、米国との「些細な」貿易にもかかわらず、制裁法案には対イラン関税を盛り込むべきだと発言",
    "summaryJa": "ドナルド・トランプ大統領は議会に対し、超党派の支持を得ているロシアとイランに対する制裁法案にイランへの関税を追加するよう求めている。米国はイランからほとんど何も輸入していないため、これらの関税はほとんど影響しないだろう。しかし、これらを法案に追加すると、法案成立の可能性が台無しになる可能性がある。",
    "bodyOriginal": "President Donald Trump wants Congress to add tariffs on Iran to a sanctions bill against Russia and Tehran that has bipartisan support.\nThose duties would have little effect because the U.S. imports nearly nothing from Iran. But tacking them on to the bill may torpedo its chances of becoming law.\nWhile sanctions against the two countries has widespread support in Congress, Trump's well-established belief in tariffs as a one-size-fits-all tool for economic coercion is polarizing.\nThe U.S. imported just $1.4 million in goods from Iran 2025, according to the Office of the U.S. Trade Representative. Works of art, collectors pieces and antiques were the largest category of those imports, making up 55% of the value, according to the firm Trading Economics.\nIt's hard to imagine that figure increasing much this year — especially since late February, when the U.S. and Israel launched a war against Iran that continues with no end in sight. The U.S. has sanctioned Iran for decades, and the Treasury Department has sought to further squeeze Tehran's economy amid the war.\n\"The Administration's threat to impose tariffs on imports from Iran is entirely symbolic,\" Jonathan Doh, professor of international business at Villanova School of Business, said in an email to CNBC. \"U.S. imports from Iran are trivial.\"\nTrump sees it differently. Asked at the White House on Wednesday about the pending sanctions bill, he said, \"I'd like them to add Iran as tariffs, not just as sanctions.\"\nThe measure is named after former Sen. Lindsey Graham, R-S.C., who died unexpectedly in mid-July.\n\"I'd like to see tariffs on Iran. It would make it much stronger,\" Trump said of the bill, which would impose economic sanctions on Russia and those supporting its war against Ukraine.\nThe legislation would also let Trump slap targeted tariffs on goods imported from the top five countries that buy Russian energy and help it evade sanctions.\nTrump claimed Wednesday that modifying it by adding tariffs on Iran is \"what Lindsey wanted.\"\nGraham's office, which is now occupied by his sister, Darline Graham, did not respond to CNBC's request for comment on Trump's remark.\nDoh told CNBC that U.S. sanctions on Iran — which already prohibit nearly all trade — are \"far more impactful\" than tariffs would be.\n\"Primary sanctions target U.S. persons from trading with Iran, while secondary sanctions target non-U.S. companies and individuals for doing business with Iran,\" Doh said.\nHe noted that Iran was eager to include sanctions relief as part of a now-defunct temporary ceasefire deal with the U.S. that was signed in June, then effectively scrapped weeks later as military action resumed.\nThe sanctions bill took a key step forward Tuesday, as a bipartisan group of senators said they reached a deal combine provisions on Russia and Iran into a single legislative package. The chamber then voted 86-12 on a procedural measure to advance the bill. The vote was notable in a Congress that has been riven by partisan divisions.\nBut that progress could hit a wall if Trump insists additional tariffs on Iran be added to the bill.\nDemocrats have denounced Trump's heavy use of tariffs, which has ramped back up this month after being tamped down by the Supreme Court earlier this year. The Trump administration in recent weeks has imposed or announced new duties on goods from dozens of countries, including Canada, Brazil and the 27-member European Union.\nThe White House and the Office of the U.S. Trade Representative did not respond to CNBC's requests for comment on Trump's call for tariffs on Iran.",
    "bodyJa": "ドナルド・トランプ大統領は議会に対し、超党派の支持を得ているロシアとイランに対する制裁法案にイランへの関税を追加するよう求めている。\n米国はイランからほとんど何も輸入していないため、これらの関税はほとんど影響しないだろう。しかし、これらを法案に追加すると、法案成立の可能性が台無しになる可能性がある。\n両国に対する制裁は議会で幅広い支持を得ているが、関税は経済的抑圧のための万能の手段であるというトランプ大統領の確立した信念は二極化している。\n米通商代表部によると、2025年に米国がイランから輸入した商品はわずか140万ドルだった。トレーディング・エコノミクス社によると、輸入品の中で最大のカテゴリーは美術品、コレクターズ・ピース、骨董品で、金額の55％を占めた。\n今年、この数字が大幅に増加するとは考えにくい――特に米国とイスラエルが終わりの見えない対イラン戦争を開始した2月下旬以降はなおさらだ。米国は数十年にわたりイランを制裁しており、財務省は戦争の最中にイラン経済をさらに圧迫しようとしていた。\nビラノバ・スクール・オブ・ビジネスの国際ビジネス教授、ジョナサン・ドー氏はCNBCへの電子メールで、「イランからの輸入品に関税を課すという政権の脅迫は全く象徴的だ」と述べた。 「米国のイランからの輸入は取るに足らないものだ。」\nトランプ氏は違う見方をしている。水曜日、ホワイトハウスで保留中の制裁法案について質問された同氏は、「イランを単なる制裁ではなく、関税の対象に加えてほしい」と述べた。\nこの措置は、7月中旬に急死した元上院議員リンジー・グラハム氏（共和党、サウスカロライナ州）にちなんで命名された。\nトランプ大統領は、ロシアと対ウクライナ戦争を支援する国々に経済制裁を課す法案について、「イランへの関税を望んでいる。そうすればイランはさらに強化されるだろう」と語った。\nこの法案により、トランプ大統領はロシアのエネルギーを購入し、制裁回避を支援する上位5カ国からの輸入品に対象を絞った関税を課すことも可能になる。\nトランプ大統領は水曜日、対イラン関税の追加による修正は「リンゼイ氏が望んでいたこと」だと主張した。\nグラハム氏の事務所は現在、妹のダーリン・グラハム氏が担当しているが、トランプ氏の発言に関するCNBCのコメント要請には応じなかった。\nドー氏はCNBCに対し、すでにほぼすべての貿易を禁止している米国の対イラン制裁は関税よりも「はるかに影響力がある」と語った。\nドー長官は、「一次制裁はイランとの取引を行う米国人を対象とし、二次制裁はイランと取引する米国以外の企業や個人を対象とする」と述べた。\n同氏は、イランが6月に署名され、数週間後に軍事行動が再開されたことで事実上破棄された、現在は失効している米国との一時停戦協定の一部として制裁緩和を盛り込むことを熱望していると指摘した。\n火曜日、超党派の上院議員グループが、ロシアとイランに関する条項を単一の立法パッケージにまとめる合意に達したと発表し、制裁法案は重要な一歩を踏み出した。その後、議場は法案を前進させるための手続き措置を86対12で可決した。この投票は党派の分裂によって引き裂かれた議会において注目に値した。\nしかし、トランプ大統領が対イラン追加関税を法案に追加するよう主張すれば、その進展は壁に突き当たる可能性がある。\n民主党はトランプ大統領の関税の多用を非難しており、関税は今年初めに最高裁判所によって抑制された後、今月から再び強化されている。トランプ政権はここ数週間、カナダ、ブラジル、欧州連合（２７カ国）を含む数十カ国からの商品に新たな関税を課したり、発表したりしている。\nホワイトハウスと米通商代表部は、トランプ大統領の対イラン関税要求に関するCNBCのコメント要請に応じなかった。",

    "id": "china-s-open-weight-model-lead-exposes-a-9eff0a34",
    "title": "China’s open-weight model lead exposes America’s AI blind spot",
    "titleJa": "中国の無差別級モデルのリーダーがアメリカのAIの盲点を暴露",
    "summaryJa": "中国がこの分野でリードを築き続ける中、米国最大手のテクノロジー企業の一部は、オープン人工知能を国家的優先事項にするよう米国政府に求めている。彼らのメッセージは、米国の政策のギャップを明らかにしています。米国には AI 用のチップ戦略があるということです。今、オープンモデル戦略が必要です。",
    "bodyOriginal": "Some of America's biggest technology companies are pushing Washington to make open artificial intelligence a national priority as China continues to build its lead in the space.\nTheir message exposes a gap in U.S. policy: America has a chip strategy for AI. Now it needs an open-model strategy.\nSupporters say open models can lower costs, keep sensitive data inside a company's own systems and prevent businesses from becoming dependent on a handful of AI providers. The models can also give more researchers and security teams the ability to inspect powerful models and find weaknesses.\nUnlike ChatGPT or Claude, which customers access through services controlled by OpenAI and Anthropic, open-weight models can be downloaded, customized and run on a company's own computers. That can make them cheaper and give users more control over their data and technology.\nLast week, a coalition led by Nvidia published an open letter arguing that America's AI leadership will depend on building a strong open ecosystem. Microsoft, Meta and other major technology companies signed it. OpenAI and Google later added their support.\nA striking cybersecurity incident days earlier showed why the issue matters.\nDuring an internal test, OpenAI models found a way out of a restricted environment and compromised systems at the AI platform Hugging Face. When Hugging Face tried to investigate, safety controls on closed commercial models blocked them from analyzing the attack. The company instead used an open Chinese model that it could run on its own infrastructure.\nA closed American model caused the incident. A Chinese open model helped investigate it.\nThat episode complicates the argument that closed AI is always safer.\nAmerica has restricted China's access to advanced chips, spent billions to onshore semiconductor manufacturing and encouraged a massive buildout of data centers and power. Meanwhile, Chinese labs like Zhipu and Moonshot AI have released capable open models at a fraction of the cost of leading American systems.\nThe Trump administration is now reportedly considering restrictions on Chinese models. But a ban would not stop those models from spreading around the world. It could simply leave American developers on the sidelines.\nChina has a clear incentive to push open-weight AI. Every improvement makes powerful models cheaper and weakens the advantage of American companies that charge a premium for access to closed systems.\nOpenAI and Anthropic have the opposite incentive. Their businesses depend on keeping their best models proprietary. Anthropic CEO Dario Amodei has also warned that models anyone can download are harder to monitor and could be modified by bad actors.\nThose security concerns are real, but so is the risk of allowing China to become the foundation on which the rest of the world builds.\nThe way to win an open-source race is by out-building, not with a ban.\nThe U.S. could support open AI the way it supported chips, by giving universities and startups access to computing power, awarding government contracts to American open-model developers and funding the security tools needed to run those models safely.\nCompanies are already asking for alternatives, and open models can lower costs and let businesses keep sensitive data inside their own systems.\n\"The data that these companies have is really their strategic asset,\" said Vipul Ved Prakash, CEO of AI platform Together AI. By sending it to the maker of a powerful closed model, he said, a company risks giving away its \"business' recipe.\"\nAdoption is moving quickly. During the last week of June, Chinese models accounted for 48% of traffic tracked by OpenRouter, up from 20% a year earlier. U.S. models fell to 32% from 74%.\nThe future of AI may not be decided by who builds the smartest single model. It may be decided by who builds the models that everyone else runs on.\nRight now, that is increasingly China.",
    "bodyJa": "中国がこの分野でリードを築き続ける中、米国最大手のテクノロジー企業の一部は、オープン人工知能を国家的優先事項にするよう米国政府に求めている。\n彼らのメッセージは、米国の政策のギャップを明らかにしています。米国には AI 用のチップ戦略があるということです。今、オープンモデル戦略が必要です。\n支持者らは、オープンモデルはコストを削減し、機密データを企業独自のシステム内に保管し、企業が少数のAIプロバイダーに依存するのを防ぐことができると主張する。このモデルにより、より多くの研究者やセキュリティ チームが強力なモデルを検査して弱点を見つけることができるようになります。\nOpenAI や Anthropic によって制御されるサービスを通じて顧客がアクセスする ChatGPT や Claude とは異なり、オープンウェイト モデルはダウンロードしてカスタマイズし、企業独自のコンピューターで実行できます。これにより、価格が安くなり、ユーザーがデータとテクノロジーをより細かく制御できるようになります。\n先週、Nvidia率いる連合は、米国のAIのリーダーシップは強力なオープンエコシステムの構築に依存すると主張する公開書簡を発表した。 Microsoft、Meta、その他の主要テクノロジー企業が署名しました。 OpenAI と Google は後にサポートを追加しました。\n数日前に起きた衝撃的なサイバーセキュリティ事件は、この問題がなぜ重要なのかを示しました。\n内部テスト中に、OpenAI モデルは AI プラットフォーム Hugging Face で制限された環境と侵害されたシステムから抜け出す方法を発見しました。ハグ・フェイス社が調査しようとしたところ、非公開の商用モデルの安全制御により攻撃を分析することができなかった。同社は代わりに、独自のインフラストラクチャで実行できるオープンな中国モデルを使用しました。\n事件を引き起こしたのはアメリカの非公開モデルだった。中国のオープンモデルがその調査に役立ちました。\nこのエピソードは、クローズド AI が常に安全であるという議論を複雑にします。\n米国は中国による先端チップへのアクセスを制限し、陸上の半導体製造に数十億ドルを費やし、データセンターと電力の大規模増強を奨励してきた。一方、Zhipu や Moonshot AI などの中国の研究所は、米国の主要システムの数分の 1 のコストで有能なオープン モデルをリリースしました。\nトランプ政権は現在、中国製モデルへの規制を検討していると伝えられている。しかし、禁止されても、これらのモデルが世界中に広がるのを止めることはできません。それは単にアメリカの開発者を傍観者に置くだけかもしれない。\n中国には、オープンウェイトAIを推進する明確なインセンティブがある。改良が進むたびに強力なモデルが安くなり、クローズドシステムへのアクセスに割増料金を請求する米国企業の優位性が弱まる。\nOpenAI と Anthropic には逆のインセンティブがあります。彼らのビジネスは、最高のモデルを独占的に維持することにかかっています。 Anthropic CEOのDario Amodei氏も、誰でもダウンロードできるモデルは監視が難しく、悪意のある者によって改変される可能性があると警告した。\nこうした安全保障上の懸念は現実であるが、中国が世界の他の国々が築く基盤となることを許すリスクも同様である。\nオープンソースの競争に勝つ方法は、禁止ではなく、アウトビルドすることです。\n米国は、大学や新興企業にコンピューティング能力へのアクセスを与え、米国のオープンモデル開発者に政府契約を与え、それらのモデルを安全に実行するために必要なセキュリティツールに資金を提供することで、チップをサポートしたのと同じようにオープンAIをサポートできる可能性がある。\n企業はすでに代替案を求めており、オープン モデルによりコストが削減され、企業は機密データを自社のシステム内に保管できるようになります。\nAIプラットフォームTogetter AIのCEO、Vipul Ved Prakash氏は、「これらの企業が保有するデータはまさに戦略的資産だ」と述べた。同氏は、強力なクローズドモデルのメーカーにそれを送信することで、企業は「ビジネスのレシピ」を漏らす危険があると述べた。\n導入は急速に進んでいます。 6 月の最終週、OpenRouter が追跡したトラフィックの 48% を中国モデルが占め、前年同期の 20% から増加しました。米国モデルは74％から32％に低下した。\nAI の将来は、誰が最も賢い単一モデルを構築するかによって決まるわけではないかもしれません。それは、他の人が実行するモデルを誰が構築するかによって決まるかもしれません。\n今、それはますます中国です。",
