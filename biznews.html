    "bodyOriginal": "Embattled Serbian president resigns, paving way for early elections\n- Published\nSerbia's president has resigned after more than a year of student-led protests and growing public discontent over allegations of government corruption.\nAleksandar Vučić said his administration had preserved peace and stability during his nine-year tenure as he addressed supporters outside the presidential building in the capital, Belgrade.\nHe had already announced his intention to resign in June and is currently standing to be his party's candidate for prime minister in the upcoming parliamentary elections. Vučić cannot run for a third presidential term under Serbia's constitution.\nThe pro-Russian populist's administration has been dogged by anger over alleged corner-cutting.\nIt was the collapse of the Novi Sad railway station's roof, killing 16 people, that first galvanised anger towards the government in 2024.\nProtests involving a wide range of citizens - from students and teachers to workers and farmers - followed.\nDemonstrators believed that the disaster reflected more than a decade of governing by the Progressive Party of Vucic, who closely associated himself with the station's renovation, which was supposed to be a symbol of Serbia's progress.\nA series of resignations of those under the embattled president failed to placate the protesters, who continued to demonstrate throughout this summer, turning to unrest following accusations of police brutality.\nVučić's presidency was due to expire next year. Under Serbia's constitution, presidential elections must be held no more than three months after his resignation.\nThis means Serbians will go to the polls twice before the end of the year.\nVučić said the presidential election will take place more than a month after the snap parliamentary election in late October, itself called in response to the protests, which had added calls for a vote to their list of demands.\nHe had earlier announced that he planned to run in that election as Progressive Party's leader, leaving the possibility he could retain a position at the top of Serbian politics.\nParliamentary speaker Ana Brnabić, also a Progressive Party member, will assume the role of interim president until a new one is elected.\nVučić used his constitutional powers to pardon 49 people, including 23 students and party loyalists suspected of offences related to what he called the \"terrible events we have gone through over the past year and a half\", according to Serbian public broadcaster RTS.\nThe upcoming parliamentary elections will pit Vučić's Progressive Party against a student-led, anti-corruption movement called Students Win and a coalition of pro-Western opposition parties known as European Serbia.\nVucic has been a fixture of Serbian politics for more than a decade, becoming prime minister in 2014, before being elected to his first term as president in 2017.\nHe has publicly said he wants Serbia to join the EU while courting close ties with Russia and opening Serbia up to Chinese investment.\nRelated topics\n- Published1 November 2025\n- Published29 June 2025\n- Published15 March 2025\n- Published17 August 2025\n- Published29 June 2025",
    "bodyJa": "Embattled Serbian president resigns, paving way for early elections\n- Published\nSerbia's president has resigned after more than a year of student-led protests and growing public discontent over allegations of government corruption.\nAleksandar Vučić said his administration had preserved peace and stability during his nine-year tenure as he addressed supporters outside the presidential building in the capital, Belgrade.\nHe had already announced his intention to resign in June and is currently standing to be his party's candidate for prime minister in the upcoming parliamentary elections. Vučić cannot run for a third presidential term under Serbia's constitution.\nThe pro-Russian populist's administration has been dogged by anger over alleged corner-cutting.\nIt was the collapse of the Novi Sad railway station's roof, killing 16 people, that first galvanised anger towards the government in 2024.\nProtests involving a wide range of citizens - from students and teachers to workers and farmers - followed.\nDemonstrators believed that the disaster reflected more than a decade of governing by the Progressive Party of Vucic, who closely associated himself with the station's renovation, which was supposed to be a symbol of Serbia's progress.\nA series of resignations of those under the embattled president failed to placate the protesters, who continued to demonstrate throughout this summer, turning to unrest following accusations of police brutality.\nVučić's presidency was due to expire next year. Under Serbia's constitution, presidential elections must be held no more than three months after his resignation.\nThis means Serbians will go to the polls twice before the end of the year.\nVučić said the presidential election will take place more than a month after the snap parliamentary election in late October, itself called in response to the protests, which had added calls for a vote to their list of demands.\nHe had earlier announced that he planned to run in that election as Progressive Party's leader, leaving the possibility he could retain a position at the top of Serbian politics.\nParliamentary speaker Ana Brnabić, also a Progressive Party member, will assume the role of interim president until a new one is elected.\nVučić used his constitutional powers to pardon 49 people, including 23 students and party loyalists suspected of offences related to what he called the \"terrible events we have gone through over the past year and a half\", according to Serbian public broadcaster RTS.\nThe upcoming parliamentary elections will pit Vučić's Progressive Party against a student-led, anti-corruption movement called Students Win and a coalition of pro-Western opposition parties known as European Serbia.\nVucic has been a fixture of Serbian politics for more than a decade, becoming prime minister in 2014, before being elected to his first term as president in 2017.\nHe has publicly said he wants Serbia to join the EU while courting close ties with Russia and opening Serbia up to Chinese investment.\nRelated topics\n- Published1 November 2025\n- Published29 June 2025\n- Published15 March 2025\n- Published17 August 2025\n- Published29 June 2025",

    "id": "anthropic-ceo-amodei-set-to-meet-with-tr-ac4a9601",
    "title": "Anthropic CEO Amodei set to meet with Trump after missing state dinner",
    "titleJa": "Anthropic CEO Amodei set to meet with Trump after missing state dinner",
    "summaryJa": "As top tech CEOs rubbed elbows at President Trump's glitzy dinner for Chinese President Xi on Thursday, Anthropic's CEO was noticeably absent.",
    "bodyOriginal": "Anthropic CEO Dario Amodei will join President Donald Trump for a private dinner at the White House on Sunday, CNBC confirmed, in what will be the first one-on-one meeting between the two leaders.\nAmodei was noticeably absent from Trump's glitzy state dinner for Chinese President Xi Jinping on Thursday, as other tech bigwigs — OpenAI CEO Sam Altman, SpaceX CEO Elon Musk, Nvidia CEO Jensen Huang and Meta CEO Mark Zuckerberg — were photographed rubbing elbows with government officials. Amodei had a scheduling conflict, so Trump invited him to a private dinner, according to a source familiar with the details who was not authorized to speak publicly.\nThe meeting, first reported by Axios, comes at a high-stakes moment for Anthropic, which is gearing up for what's widely expected to be a blockbuster IPO. The company's precarious relationship with the Trump administration has been under strain for much of the last year, so Amodei's sit-down with the president could serve as a valuable opportunity to ease tensions.\n\"President Trump has been clear: America will lead the world in Super Intelligence, while protecting American consumers,\" a White House official said in a statement, in response to CNBC's inquiry about Sunday's dinner. \"We will drive innovation, strengthen American competitiveness, and ensure this transformative technology works for the American people.\"\nAmodei drew Trump's ire earlier this month by publicly urging the AI industry to slow down the pace of advanced model development and better address potential risks. He published a three-step proposal and called for additional government oversight, which angered the president even as it gained the support of other industry leaders like Altman and Musk.\n\"The only control or 'guardrails' that AI needs is a STRONG AND SMART (High IQ!) PRESIDENT, and the U.S.A. has that, in spades!,\" Trump wrote in a post on Truth Social. \"The Trump Administration has stopped AI 'people' from doing bad, or potentially bad, 'things,' like Dario (Anthropic!), who is now pretending to be a 'perfect little angel' - and we will continue to do so!\"\nAmodei was already in a difficult spot with the president, because he supported Kamala Harris in the 2024 presidential election and was a vocal critic of Trump.\nBut before Amodei's call for a slowdown rocked the tech sector, Anthropic's relationship with the Trump administration appeared to be on the mend.\nCommerce Secretary Howard Lutnick, who temporarily imposed export controls on two of the company's most advanced models in June, told Axios earlier this month that Anthropic is \"back on the right side.\" He also hosted a fireside chat with Anthropic co-founder Tom Brown at the G20 Innovation Ministerial in North Carolina.\nBrown, who serves as Anthropic's chief compute officer, has taken on a much more active role in interfacing with the Trump administration in recent months. He reportedly led the company's negotiations with the Commerce Department over its export control directive, replacing Amodei in that role.\n\"We trust Anthropic,\" Lutnick said on the sidelines of the event.\nThat same day, White House Office of Science and Technology Policy (OSTP) Director Michael Kratsios told CNBC that the administration was \"in a good cadence\" with Anthropic. He said the company was \"open\" and actively sharing models with the government as part of Trump's voluntary AI executive order.\nAnthropic has had less success winning over officials at the Department of Defense, however.\nNegotiations between the company and the Pentagon spiraled in February after the two sides failed to agree on how the military could use its models. The DOD wanted Anthropic to grant the military unfettered access to its models across all lawful purposes, while Anthropic wanted assurance that its technology would not be used for fully autonomous weapons or domestic mass surveillance.\nAfter talks collapsed, the DOD labeled Anthropic a supply chain risk, an unprecedented move that meant the company purportedly threatened U.S. national security. The designation prevents the U.S. military from using Anthropic's models and blocks defense contractors from using them in their work with the agency.\nAnthropic sued the Trump administration in an effort to reverse it's blacklisting, but the company suffered a blow on Friday after a federal appeals court panel in Washington, D.C., upheld the Pentagon's action. The company could still petition for a rehearing, and could also ask the Supreme Court to take the case.\nEmil Michael, the DOD's technology chief, celebrated the ruling in a post on X.\n\"The hammer of justice has smashed @AnthropicAI arguments,\" Michael wrote on Friday. \"They are a Supply Chain Risk to the defense industrial base serving the @DeptofWar. Warfighters will sleep better knowing that no private company will insert their opinions in the chain of command. @SecWar was right!\"\nDefense Secretary Hegseth accused Anthropic of \"duplicity\" and argued that the company attempted \"to strong-arm the United States military into submission\" when negotiations collapsed in February. He reaffirmed that position in a post on X on Friday.\n\"Confirmed: @AnthropicAI = Supply Chain Risk,\" Hegseth wrote. The @DeptofWar does what is right for the Country and our Warriors.\"\nWATCH: Pres. Trump and Pres. Xi share a toast at state dinner surrounded by U.S. executives",

    "id": "two-bodies-found-after-avalanche-hits-hi-d075c8b9",
    "title": "Two bodies found after avalanche hits Himalayan climbing group",
    "titleJa": "Two bodies found after avalanche hits Himalayan climbing group",
    "summaryJa": "Rescuers are looking for at least 10 Nepalese people who were preparing to take climbers up the Himlung Himal peak.",
    "bodyOriginal": "Two bodies found after avalanche hits Himalayan climbing group\n- Published\nRescuers have recovered two bodies from the site of an avalanche that struck a climbing group camping in the Nepalese part of the Himalayas.\nAround a dozen people are still thought to be missing after a sheet of snow fell on the base camp of Himlung Himal peak on Manang district on Sunday morning.\nThe group of Nepalese nationals, including climbers and support staff, had been sent ahead of foreign climbers to prepare the camp and fix ropes.\nForecasts showed there was heavy snowfall around the 7,126m (23,380ft) peak in recent days, which lies on Nepal's border with Tibet.\nPoor weather has hampered rescue efforts, with helicopters and rescue teams initially unable to reach the site.\nBibhuti Chand Thakur, of Himalaya Holidays Trekking, told news agency AFP that at least eight members of his expedition team had been reported missing. The exact number of climbers still unaccounted for remains unclear.\nA rescue team consisting of experienced mountaineers was rushed from the Nepalese capital, Kathmandu, via helicopter.\nThat effort is now expected to continue on Monday due to the thick snow and bad weather, local media report.\nThe Nepalese team had been sent ahead of foreign climbers to prepare the camp, manage the route and fix ropes on the mountain.\nNepal's mountain districts have seen persistent rain and snow in recent days, creating treacherous conditions for the country's economically important climbing tourism industry.\nClimbers were forced to leave Mount Manaslu, the eighth highest peak in the world, earlier this week due to the rising threat of avalanches.\nThe latest death of Nepalese climbers comes less than two months after six lost their lives on Broad Peak in Pakistan, including renowned British-Nepalese mountaineer Nirmal Purja.\nIt also comes as efforts to recover bodies continues on the Nepal-Tibet border, where more than 6,000 people are still missing after a massive flood and landslide in August.\nMore than 1,400 people are confirmed to have died after a glacial collapse in the Himalayas sent vast quantities of water and debris careering down the Trishuli River valley, sweeping away settlements.\nExtreme weather events have also affected other parts of Asia in the past week.\nExtreme weather in the neighbouring Indian region of Uttar Pradesh has killed more than 50 people, officials there said.\nMeanwhile, a flood emergency disaster has been declared across Bangkok because of heavy rainfall since Thursday, with people being urged to stay at home or move to higher floors.\nEarlier this week, a deadly typhoon that battered Tokyo, triggering landslides in neighbouring prefectures that killed four people.\nTyphoon Dujuan was the latest in a series of storms in the Pacific, made more intense by the \"super El Niño\", an area of warmer sea water that facilitates the formation of powerful storms.\nRelated topics\n- Published17 September",
    "bodyJa": "Two bodies found after avalanche hits Himalayan climbing group\n- Published\nRescuers have recovered two bodies from the site of an avalanche that struck a climbing group camping in the Nepalese part of the Himalayas.\nAround a dozen people are still thought to be missing after a sheet of snow fell on the base camp of Himlung Himal peak on Manang district on Sunday morning.\nThe group of Nepalese nationals, including climbers and support staff, had been sent ahead of foreign climbers to prepare the camp and fix ropes.\nForecasts showed there was heavy snowfall around the 7,126m (23,380ft) peak in recent days, which lies on Nepal's border with Tibet.\nPoor weather has hampered rescue efforts, with helicopters and rescue teams initially unable to reach the site.\nBibhuti Chand Thakur, of Himalaya Holidays Trekking, told news agency AFP that at least eight members of his expedition team had been reported missing. The exact number of climbers still unaccounted for remains unclear.\nA rescue team consisting of experienced mountaineers was rushed from the Nepalese capital, Kathmandu, via helicopter.\nThat effort is now expected to continue on Monday due to the thick snow and bad weather, local media report.\nThe Nepalese team had been sent ahead of foreign climbers to prepare the camp, manage the route and fix ropes on the mountain.\nNepal's mountain districts have seen persistent rain and snow in recent days, creating treacherous conditions for the country's economically important climbing tourism industry.\nClimbers were forced to leave Mount Manaslu, the eighth highest peak in the world, earlier this week due to the rising threat of avalanches.\nThe latest death of Nepalese climbers comes less than two months after six lost their lives on Broad Peak in Pakistan, including renowned British-Nepalese mountaineer Nirmal Purja.\nIt also comes as efforts to recover bodies continues on the Nepal-Tibet border, where more than 6,000 people are still missing after a massive flood and landslide in August.\nMore than 1,400 people are confirmed to have died after a glacial collapse in the Himalayas sent vast quantities of water and debris careering down the Trishuli River valley, sweeping away settlements.\nExtreme weather events have also affected other parts of Asia in the past week.\nExtreme weather in the neighbouring Indian region of Uttar Pradesh has killed more than 50 people, officials there said.\nMeanwhile, a flood emergency disaster has been declared across Bangkok because of heavy rainfall since Thursday, with people being urged to stay at home or move to higher floors.\nEarlier this week, a deadly typhoon that battered Tokyo, triggering landslides in neighbouring prefectures that killed four people.\nTyphoon Dujuan was the latest in a series of storms in the Pacific, made more intense by the \"super El Niño\", an area of warmer sea water that facilitates the formation of powerful storms.\nRelated topics\n- Published17 September",

    "id": "iran-s-foreign-minister-says-tehran-read-e22acd75",
    "title": "Iran's foreign minister says Tehran ready for 'doomsday' war with U.S., but leaves diplomacy on the table",
    "titleJa": "Iran's foreign minister says Tehran ready for 'doomsday' war with U.S., but leaves diplomacy on the table",
    "summaryJa": "Iran's foreign minister says talks are the only way to break the deadlock, while its navy says it's analyzing data from a captured U.S. underwater drone.",
    "bodyOriginal": "Iranian Foreign Minister Abbas Araghchi said Sunday that his country is ready for a \"doomsday\" war with the U.S., but that he is leaving diplomacy on the table so as not to \"miss any chance for peace.\"\nAraghchi made the comments during an appearance on NBC News' \"Meet the Press\" following last week's United Nations General Assembly. The U.S. and Iran have been locked in an on-again, off-again war since Feb. 28, which has caused a global oil shock that has spiked gas prices and fanned the flames of inflation.\n\"If you ask us, there is no reason why we should go back to diplomacy, but I am still trying diplomacy because I think we shouldn't miss any chance for peace,\" Araghchi said. \"We are ready to negotiate as much as we are ready to face any challenge ... We stand firm in the face of any aggression against us, even if it comes to a doomsday war.\"\nAraghchi on Friday had proposed reopening the strait and resuming nuclear talks with the U.S. within seven days if the Trump administration accepts its conditions.\nU.S. President Donald Trump recently rejected Iran's proposal, which could have opened the critical chokepoint, the Strait of Hormuz. Iran has severely disrupted the strait during the conflict, restricting oil and gas exports out of the Persian Gulf. The Wall Street Journal reported that in addition to rejecting the deal, Trump said he expected to resume bombing Tehran after the U.S. midterm elections in November.\nIn a separate interview on NBC News, U.S. Ambassador to the United Nations Michael Waltz said that Iran's most recent offer was a \"cynical attempt to put something on the table that they knew was unacceptable.\"\n\"The president will leave all options on the table to ensure the world is safe from Iran holding the world hostage with a nuclear weapon,\" Waltz said.\nIran is sticking to its position that it would only reopen the crucial Hormuz strait if its conditions are met, despite a rebuke from Trump, while a senior Iranian military leader stressed his country's readiness to continue fighting.\nIran's Islamic Revolutionary Guard Corps on Sunday claimed that it seized an autonomous U.S. submarine.\n\"Our conditions are clear; any progress toward the opening of the Strait of Hormuz is contingent upon the fulfillment of these conditions, and we will not back down from them,\" Iranian Foreign Minister Abbas Araghchi said in a post on his Telegram channel translated by Google.\n\"During our meetings with mediators, these conditions were fully conveyed, explained, and elaborated upon, and the mediators, in turn, relayed them to the American side,\" he said on the sidelines of the United Nations General Assembly in New York.\nIn his latest statement, Araghchi said intermediaries between the U.S. and Iran have yet to relay a formal response from Trump to Tehran. \"Only a negotiated solution can break this deadlock,\" he said.\nTehran's conditions include a halt to what it calls U.S. \"acts of aggression,\" an end to the naval blockade and economic warfare, and the release of Iranian assets, Iranian foreign ministry spokesman Esmaeil Baghaei said last week.\nIranian military leaders continued to underline their readiness to continue the war, which began on Feb. 28 with U.S. and Israeli air strikes on the country.\n\"The war is not over,\" the Iranian Student News Agency quoted Iran's army commander-in-chief, Amir Hatami, as saying. \"We have won, but we must consolidate this victory, and the aggressor enemy, who has suffered heavy blows, must continue to be prepared to receive heavy blows from the soldiers of our beloved Iran,\" he said.\nUnderwater drone\nMeanwhile, the IRGC navy claimed Sunday to have captured an American underwater drone in the Strait of Hormuz.\n\"IRGC Navy forces successfully captured an advanced unmanned underwater vehicle (UUV) belonging to the U.S. terrorist army,\" the Tasnim News Agency said in a Telegram post quoting the IRGC.\nIt described the vehicle as a Remus 600 unmanned underwater vehicle and added that it has been handed over to the force's specialists for data recovery.\n\"The IRGC Navy firmly declares that the Strait of Hormuz is closed [to unauthorized traffic],\" it said.\nU.S. Central Command did not immediately respond to CNBC's emailed request for comment.\nThe war has severely restricted energy shipments from the Middle East, sending oil prices soaring and raising concerns about accelerating global inflation.\nBut crude prices posted a sharp drop for the week as Tehran and Washington held discussions on the sidelines of the U.N. General Assembly.\nWest Texas Intermediate dropped 2.3% to close at $92.41 per barrel. Brent, the international benchmark, declined 2.1% to settle at $104.32. U.S. crude finished the week 7.9% lower while Brent was flat.\nWTI is up nearly 61% year to date, while Brent crude is more than 71% higher over the same period.",

    "id": "at-nfl-games-this-season-drone-defense-t-49d70fd4",
    "title": "At NFL games this season, drone defense tech aims to bring down disruptions",
    "titleJa": "At NFL games this season, drone defense tech aims to bring down disruptions",
    "summaryJa": "The NFL told CNBC it recorded 10,852 drone violations over stadiums between 2021 and 2025. The Jaguars became the first team to sign a drone defense firm.",
    "bodyOriginal": "As the NFL season begins, a new kind of defensive strategy is taking shape: Stopping drone disruptions.\nLast month, the Jacksonville Jaguars became the first NFL team to publicly announce an agreement with a drone defense company, seeking to protect against interruptions or security threats. The company, Ondas-owned Sentrycs, will control the skies in and around EverBank Stadium, home of the Jaguars, during game days.\nA representative for Sentrycs told CNBC the system will be activated for the first time on Sunday before the Jaguars' game against the New England Patriots.\n\"As drones become increasingly accessible, we recognized the importance of moving beyond detection and adding an effective mitigation capability to our security strategy,\" said Jaguars Director of Events and Facilities Security Bobby Lyle in an August news release.\nThe NFL, which is now on Week 3 of its 2026 regular season, told CNBC that it recorded 10,852 drone violations near stadiums between 2021 and 2025. Only a few of those resulted in disrupted games.\nIn 2025, a playoff game in Baltimore between the Ravens and the Pittsburgh Steelers was paused due to a drone flying overhead. The stadium saw a similar incident in 2023.\nWhile the league previously had the capacity to identify and track drones near its 30 stadiums, evolving technology allows for the mitigation of threats by intercepting the communication link between an operator and the drone, taking control, and landing the aerial vehicle.\nSentrycs said it recently signed deals with two other NFL teams, though CNBC could not confirm which franchises.\nEarlier this month, in tandem with Major League Baseball, the NFL sent a letter to the Department of Homeland Security arguing more resources are needed to protect fans and players from drones during competition.\n\"Unauthorized drone activity presents an ongoing and growing challenge,\" the letter said.\nRising violations\nSentrycs was one of several firms contracted to stop drone disruptions during the FIFA World Cup this past summer, which took place across 104 matches in the U.S., Canada and Mexico.\nThe FBI reported about 700 instances of intercepting a drone during the four-week tournament.\n\"What surprised us the most was the sheer number of drones in the air at one time,\" said Ondas founder and CEO Eric Brock.\nThe federal government provided state and local authorities about $250 million in funding before the World Cup for drone defense. Now, those resources and improvements made ahead of the tournament can benefit other big, in-person events like concerts or festivals.\n\"Nobody worried about this a few years ago. Now everyone has to worry, and it's happening very fast,\" said Jason Moore, Sentrycs' general manager for the U.S. and Canada.\nDrone defense operators must take special classes to become certified through a federal program.\nThe systems require both hardware and software. Once equipment installation is complete, operators detect threats through optical systems including radar and thermal technology. Sentrycs also uses radio signals for detection.\n\"The system allows for the operator to detect and then take over the drone's controls and to move it out of the way and land safely,\" Moore said.\nThe system is also capable of using radio frequencies to find the pilot of a drone and alert police to their exact location. With officers on patrol, response time from the moment of detection to when a law enforcement officer could be at the scene of the operator can be as little as two minutes, according to Brock.\nWhile some experts cite the threat of civilian drones being equipped to deliver explosives or chemical or biological agents, authorities and defense executives say the more common risk is annoyance and interruption.\n\"In most cases drones are operated by people either not paying attention to or ignoring the rules,\" said Kristian Brost, general manager of Robin Radar USA, which was also contracted to help with drone security during the World Cup.\nRobin Radar, headquartered in the Netherlands, operates equipment at two dozen European airports. About a dozen large European airports have been forced to temporarily suspend flights due to drone incursions in the last year, according to findings by the European Commission and various media reports.\n\"Most drones weren't nefarious, but they still pose a threat and must be detected and taken down,\" said Brost, who served in the U.S. Marine Corps in Iraq during the opening stages of the 2003 war, working with emerging military technologies. \"Defeating drones is really the ultimate team sport as we need a sensor team, a software team, radar detection and someone to bring the attacking drone down, without hurting anyone on the ground.\"\nDrones are also becoming an increasingly serious problem for airplane pilots.\nThis summer there were two incidents in the busy New York airspace: One at Newark Liberty International Airport in which a United Airlines pilot reported narrowly missing a drone, and one near John F. Kennedy International Airport, where a JetBlue pilot reported hitting a drone as he came in for a landing. No injuries were reported in either instance.\nHow drone defense works\nOne of the challenges the drone defense industry faces is keeping up with the rapid advancement in technology.\n\"Nobody thought there could be small things flying around with no humans 15 years ago,\" said Mary-Lou Smulders, a longtime drone defense executive turned industry consultant. \"Regulations were built for [Boeing] 747s and 727s — passenger aircraft — not drones.\"\nThat's beginning to change. On July 1, the Safer Skies Act went into effect after being passed by Congress in December and signed by President Donald Trump. The law is designed to give state and local authorities permission to bring down drones encroaching on airports and major venues.\nExecutives and operators focus on four stages when trying to bring down a drone in restricted airspace, whether the drone's operator is being negligent or trying to cause trouble. The first is to detect the offending drone.\n\"If you see it with your eyes before you see it on a radar or sensor screen, you're already too late,\" Smulders said.\nDefense teams then try to identify the drone and determine how fast it's moving and at what altitude. The third stage is to track the drone and attempt to contact the operator through a radio frequency. The last stage is interdiction, or intercepting the drone.\nSmulders and Brost agree the easiest and safest way to have a takedown is to disrupt the communication between an operator and a drone itself by stopping the controlling radio frequency.\n\"That however can cause problems as you may be cutting off legitimate radio frequencies as well,\" said Smulders. \"It is a delicate dance.\"\nAnd while most drone defense leverages radio frequencies, Israeli defense firm Israel Weapon Industries, or IWI, develops and sells a drone defense technology that, instead of cutting communications, allows for a defender to shoot drones out of the sky.\nThe device, called the Arbel, fits on most automatic rifles, including the AR-15, and helps the shooter follow, target and take out drones using bullets.\nThe company is now part of drone defense at 20 European airports and at 10 sites in the U.S. IWI declined to comment on the types of facilities or specific locations in the U.S. where it operates.",

  {
    "id": "meta-s-muse-agent-is-attacking-one-of-th-124b2bb9",
    "title": "Meta's Muse agent is attacking one of the economy's most profitable weak spots",
    "titleJa": "Meta's Muse agent is attacking one of the economy's most profitable weak spots",
    "summaryJa": "Meta's Muse AI personal agent will work over your credit card spending if you don't mind the invasion. How big a threat is it to the subscription economy?",
    "bodyOriginal": "For years, subscription businesses have benefited from a simple fact of consumer behavior: people are much better at signing up than canceling.\nThey forget what they joined. They stop using services but keep paying. A $9 or $15 monthly charge can disappear into a credit card statement for months or even years.\nWith the rollout of Meta Muse this month, an AI personal agent that can handle tasks across many areas of personal life, it quickly became clear that subscription bloat was an easy target.\nMuse can help consumers identify and cancel recurring subscriptions. While subscription-management services have existed for years, Muse brings that capability into a much broader personal assistant, potentially making forgotten recurring charges much easier to surface and cancel.\nAnd the timing matters. Close to half (44%) of U.S. consumers increased their subscription spending in 2025, with average annual spending rising to $1,887, or about $157 a month, according to a report published by Mastercard and FT Strategies in April. Subscription spend rose 7.7% year-over-year in July, faster than overall card spending, according to Bank of America payments data, with entertainment and retail subscriptions accounting for about 43% of the total.\nNeale Mahoney, an economics professor at Stanford University and director of the Stanford Institute for Economic Policy Research, has studied how much subscription businesses benefit when consumers fail to cancel.\n\"We found that when people are forced to decide, they are about four times more likely to cancel,\" Mahoney said, citing data from his 2025 American Economic Review paper \"Selling Subscriptions,\" co-authored with Stanford economists Liran Einav and Ben Klopack.\nThat distinction matters in an AI agent world.\nThe Stanford researchers estimated that sellers can roughly double revenue because of consumer inertia, when people forget or put off canceling, and cancellation friction, when ending a subscription takes too much time or effort. AI personal agents could weaken both, Mahoney said. But not every subscription is equally vulnerable. A physical subscription, such as pet food, is hard to forget when the product keeps arriving at your door, he said, while a digital service, such as credit monitoring, can quietly keep billing long after a consumer stops thinking about it.\nUltimately, the AI personal agent's intervention with this consumer psychology could have implications far beyond the subscription and influence decision-making deep within the core financial services that banks take for granted today.\n\"Muse and similar agentic AI assistants could soon sweep household cash automatically into accounts paying 3.3% to 5.0%, instead of the 0.1% national average on checking accounts. If every household used AI agents to optimize the return on their cash balances, banks could lose a large share of the cheap deposits they rely on to make loans, which would be a problem for the entire financial system,\" Apollo chief economist Torsten Slok wrote in an analysis last week.\n'More of life is becoming a recurring bill'\nConsumers already were becoming more aggressive about cutting subscriptions.\nScribeUp, which builds subscription-management technology into banking apps for banks, credit unions, and fintech companies, says its members are now 1.8 times more likely to initiate a cancellation than they were a year ago.\n\"More of life is becoming a recurring bill. Those bills cost more every year, and it becomes increasingly difficult for consumers to keep track of everything they are paying for,\" said Jordan Mackler, the company's co-founder and CEO. He said that increase predates ScribeUp's newer AI capabilities and reflects a broader change in consumer behavior.\nAccording to the company, the median ScribeUp user now has more than 12 recurring subscription payments, while 1 in 4 has 20 or more. In addition, the share of users with at least eight rose from 62% to 71% over the past year.\nPrice hikes can accelerate the exit. Mackler said cancellations at an individual merchant can jump as much as 50% when prices rise. Health and fitness subscriptions have seen the sharpest increase in cancellation activity, up 3.8 times year-over-year, followed by video streaming at 2.2 times, news and media at 2.1 times, and music streaming at 1.9 times, said Mackler.\nMackler said AI is increasing the number of subscriptions ScribeUp can help consumers manage. The company currently tracks roughly 200,000 unique recurring billers. Before adding its newer agentic capabilities this year, it could automate cancellations for only a few hundred major subscription companies.\nThe average canceled subscription costs $17.39 a month, and Mackler said ScribeUp saves users more than $300 a year on average on recurring bills they didn't realize they were paying for or no longer needed.\nAn end to the costly economics of forgetting?\nSubscription companies are already dealing with significant customer turnover. The Mastercard report found average monthly churn — the percentage of subscribers who cancel or fail to renew in a given month — is 20%. But more than half of U.S. subscription businesses surveyed said at least 10% of their subscriber base was inactive, meaning those customers were still subscribed but were not actively using the service.\nAs consumers gain more control over recurring charges, subscription companies may need to compete harder to keep them.\nHitee Chandra Jha, principal product manager at Zendesk who specializes in product-led growth and customer retention, said companies may need to make value more visible before a customer reaches the cancellation screen.\nFor some companies, that could mean treating cancellation less as an all-or-nothing event. Jha said a streaming service whose customer has finished watching a series might be better off offering a pause rather than a desperate discount. A fitness-app user who has reached a goal could be moved to a maintenance tier or offered another path to stay engaged, she said.\nData from subscription-management company Recurly suggests that kind of flexibility can work. In its 2026 State of Subscriptions report, based on 76 million unique subscribers across more than 2,200 businesses, it found that the use of \"pause before cancel\" options jumped 337%, and three out of four customers who paused eventually returned.\nMeta CEO Mark Zuckerberg envisions Muse as the \"centerpiece\" of an AI strategy that will be surrounded by still unproven consumer hardware, from augmented reality glasses to the Muse Charm keychain fob-like device, but it is a bet that the market has recently rewarded the company for making.\nThe AI has encountered pushback from Amazon, which blocked Muse from shopping on its site, saying the agent's access violated its terms of service. There are also significant concerns about privacy when giving an AI access to financial information. But 43% of consumers said they are comfortable with AI managing their subscriptions, according to the Recurly data.\n\"Treating cancellation as a transition, not just a loss, is what differentiates a mature retention strategy from a defensive one,\" Jha said. \"The best defense against AI-assisted cancellation is not friction,\" she added.\nMastercard's research points in the same direction. Of the consumers surveyed, 74% said they are more likely to subscribe when cancellation is easy, while 70% said they are more likely to resubscribe. Another 34% said they would remain subscribed if they were given the option to pause rather than cancel.\nInstead of spelling the end of subscription growth, AI could instead put more pressure on companies to find new ways to convince customers of value.\nScribeUp has seen that once users trust that the recurring charges on their accounts are the ones they actually chose, they become more comfortable with subscriptions overall and increase their total subscription spending.\n\"If consumers trust that they can easily see, manage, and cancel recurring charges, our data shows they are likely to expand their overall recurring spend and are more willing to try new services in the first place,\" Mackler said.\nAccording to Mahoney, a healthier market should produce businesses that don't rely on ways to slow consumers down but give them more ways to stay on their own terms. \"When people are trapped in subscriptions they don't want or can't get out of, market forces are limited, and companies don't have the incentives to have a high-quality product at a low price. They can just rely on a locked-in install base,\" he said.\nWhether it is AI or the consumer taking action, when people stop paying for something they no longer want and spend that money elsewhere, \"that's good for consumers, it's good for markets, and it's good for firms that are making products that people want,\" Mahoney said. \"That's economics working the way it's supposed to work.\"",
    "bodyJa": "For years, subscription businesses have benefited from a simple fact of consumer behavior: people are much better at signing up than canceling.\nThey forget what they joined. They stop using services but keep paying. A $9 or $15 monthly charge can disappear into a credit card statement for months or even years.\nWith the rollout of Meta Muse this month, an AI personal agent that can handle tasks across many areas of personal life, it quickly became clear that subscription bloat was an easy target.\nMuse can help consumers identify and cancel recurring subscriptions. While subscription-management services have existed for years, Muse brings that capability into a much broader personal assistant, potentially making forgotten recurring charges much easier to surface and cancel.\nAnd the timing matters. Close to half (44%) of U.S. consumers increased their subscription spending in 2025, with average annual spending rising to $1,887, or about $157 a month, according to a report published by Mastercard and FT Strategies in April. Subscription spend rose 7.7% year-over-year in July, faster than overall card spending, according to Bank of America payments data, with entertainment and retail subscriptions accounting for about 43% of the total.\nNeale Mahoney, an economics professor at Stanford University and director of the Stanford Institute for Economic Policy Research, has studied how much subscription businesses benefit when consumers fail to cancel.\n\"We found that when people are forced to decide, they are about four times more likely to cancel,\" Mahoney said, citing data from his 2025 American Economic Review paper \"Selling Subscriptions,\" co-authored with Stanford economists Liran Einav and Ben Klopack.\nThat distinction matters in an AI agent world.\nThe Stanford researchers estimated that sellers can roughly double revenue because of consumer inertia, when people forget or put off canceling, and cancellation friction, when ending a subscription takes too much time or effort. AI personal agents could weaken both, Mahoney said. But not every subscription is equally vulnerable. A physical subscription, such as pet food, is hard to forget when the product keeps arriving at your door, he said, while a digital service, such as credit monitoring, can quietly keep billing long after a consumer stops thinking about it.\nUltimately, the AI personal agent's intervention with this consumer psychology could have implications far beyond the subscription and influence decision-making deep within the core financial services that banks take for granted today.\n\"Muse and similar agentic AI assistants could soon sweep household cash automatically into accounts paying 3.3% to 5.0%, instead of the 0.1% national average on checking accounts. If every household used AI agents to optimize the return on their cash balances, banks could lose a large share of the cheap deposits they rely on to make loans, which would be a problem for the entire financial system,\" Apollo chief economist Torsten Slok wrote in an analysis last week.\n'More of life is becoming a recurring bill'\nConsumers already were becoming more aggressive about cutting subscriptions.\nScribeUp, which builds subscription-management technology into banking apps for banks, credit unions, and fintech companies, says its members are now 1.8 times more likely to initiate a cancellation than they were a year ago.\n\"More of life is becoming a recurring bill. Those bills cost more every year, and it becomes increasingly difficult for consumers to keep track of everything they are paying for,\" said Jordan Mackler, the company's co-founder and CEO. He said that increase predates ScribeUp's newer AI capabilities and reflects a broader change in consumer behavior.\nAccording to the company, the median ScribeUp user now has more than 12 recurring subscription payments, while 1 in 4 has 20 or more. In addition, the share of users with at least eight rose from 62% to 71% over the past year.\nPrice hikes can accelerate the exit. Mackler said cancellations at an individual merchant can jump as much as 50% when prices rise. Health and fitness subscriptions have seen the sharpest increase in cancellation activity, up 3.8 times year-over-year, followed by video streaming at 2.2 times, news and media at 2.1 times, and music streaming at 1.9 times, said Mackler.\nMackler said AI is increasing the number of subscriptions ScribeUp can help consumers manage. The company currently tracks roughly 200,000 unique recurring billers. Before adding its newer agentic capabilities this year, it could automate cancellations for only a few hundred major subscription companies.\nThe average canceled subscription costs $17.39 a month, and Mackler said ScribeUp saves users more than $300 a year on average on recurring bills they didn't realize they were paying for or no longer needed.\nAn end to the costly economics of forgetting?\nSubscription companies are already dealing with significant customer turnover. The Mastercard report found average monthly churn — the percentage of subscribers who cancel or fail to renew in a given month — is 20%. But more than half of U.S. subscription businesses surveyed said at least 10% of their subscriber base was inactive, meaning those customers were still subscribed but were not actively using the service.\nAs consumers gain more control over recurring charges, subscription companies may need to compete harder to keep them.\nHitee Chandra Jha, principal product manager at Zendesk who specializes in product-led growth and customer retention, said companies may need to make value more visible before a customer reaches the cancellation screen.\nFor some companies, that could mean treating cancellation less as an all-or-nothing event. Jha said a streaming service whose customer has finished watching a series might be better off offering a pause rather than a desperate discount. A fitness-app user who has reached a goal could be moved to a maintenance tier or offered another path to stay engaged, she said.\nData from subscription-management company Recurly suggests that kind of flexibility can work. In its 2026 State of Subscriptions report, based on 76 million unique subscribers across more than 2,200 businesses, it found that the use of \"pause before cancel\" options jumped 337%, and three out of four customers who paused eventually returned.\nMeta CEO Mark Zuckerberg envisions Muse as the \"centerpiece\" of an AI strategy that will be surrounded by still unproven consumer hardware, from augmented reality glasses to the Muse Charm keychain fob-like device, but it is a bet that the market has recently rewarded the company for making.\nThe AI has encountered pushback from Amazon, which blocked Muse from shopping on its site, saying the agent's access violated its terms of service. There are also significant concerns about privacy when giving an AI access to financial information. But 43% of consumers said they are comfortable with AI managing their subscriptions, according to the Recurly data.\n\"Treating cancellation as a transition, not just a loss, is what differentiates a mature retention strategy from a defensive one,\" Jha said. \"The best defense against AI-assisted cancellation is not friction,\" she added.\nMastercard's research points in the same direction. Of the consumers surveyed, 74% said they are more likely to subscribe when cancellation is easy, while 70% said they are more likely to resubscribe. Another 34% said they would remain subscribed if they were given the option to pause rather than cancel.\nInstead of spelling the end of subscription growth, AI could instead put more pressure on companies to find new ways to convince customers of value.\nScribeUp has seen that once users trust that the recurring charges on their accounts are the ones they actually chose, they become more comfortable with subscriptions overall and increase their total subscription spending.\n\"If consumers trust that they can easily see, manage, and cancel recurring charges, our data shows they are likely to expand their overall recurring spend and are more willing to try new services in the first place,\" Mackler said.\nAccording to Mahoney, a healthier market should produce businesses that don't rely on ways to slow consumers down but give them more ways to stay on their own terms. \"When people are trapped in subscriptions they don't want or can't get out of, market forces are limited, and companies don't have the incentives to have a high-quality product at a low price. They can just rely on a locked-in install base,\" he said.\nWhether it is AI or the consumer taking action, when people stop paying for something they no longer want and spend that money elsewhere, \"that's good for consumers, it's good for markets, and it's good for firms that are making products that people want,\" Mahoney said. \"That's economics working the way it's supposed to work.\"",

    "titleJa": "Two mass shootings in South Africa leave 27 dead",
    "summaryJa": "The two attacks hours apart come as the country struggles to stop high levels of gang-related armed violence.",
    "bodyOriginal": "Two mass shootings in South Africa leave 27 dead\n- Published\nTwenty-seven people have been killed in two mass shootings hours apart in South Africa, the latest gun violence to hit the country.\nSeventeen people were killed when eight gunmen stormed a bar close to Johannesburg on Saturday evening, with 15 more injured.\nIn a separate shooting in the early hours of Sunday morning, 10 people were killed outside an entertainment venue in a township near Cape Town and a further 11 were injured.\nSouth Africa has one of the highest murder rates in the world and has struggled to contain gang-related gun violence in recent years. Police have not given a definitive motive for either of the latest attacks.\nIn Johannesburg, gunmen opened fire on customers outside the bar before continuing the attack inside and torching two vehicles before fleeing.\nPolice said thirteen men and four women were killed.\nGauteng Police Commissioner Lt Gen Tommy Mthombeni said people from Ethiopia and Lesotho were among those caught up in the shooting, but that the vast majority were South African.\nHe also said police believed the motive behind the shooting was robbery, as personal belongings had been taken, but that they could not rule out turf wars between illegal mining groups.\nMining without permission in abandoned shafts or dump sites is a persistent problem in South Africa, causing numerous deaths from unsafe conditions. Authorities say the miners are typically undocumented migrants recruited by organised crime gangs.\nEarlier, deputy provincial police commissioner Maj Gen Fred Kekana said the attack may have been a retaliation for an incident last month, in which one person was killed and another wounded, according to news agency AFP.\nHe said at the scene that police had clear pictures and in some cases names for the suspects.\nIn Cape Town, five victims died at the scene and a further five people died in hospital.\nNo arrests had been made in either case on Sunday morning.\nThe two mass shootings came days after 11 people were killed in the city of Durban when gunmen stormed a house in the KwaMakhutha township.\nIllegal weapons are prevalent in South Africa and gun violence has been a persistent problem for decades, with about 60 murders recorded every day in the country of 62 million.\nBut a recent spate of mass shootings has raised fears that the problem is deepening, with violence often linked to turf wars between gangs engaged in drug trafficking and illegal mining.\nIn February, President Cyril Ramaphosa called organised crime \"the most immediate threat to our democracy, our society and our economic development\".\nEarlier this year, the military was deployed alongside police in areas with the highest murder rates in an effort to reduce armed violence.\nOn Saturday, a tenth woman's body was found in Ekurhuleni, to the east of Johannesburg, with local police saying they were unable to rule out a serial killer operating in the area with similarities between the deaths.",

ing.\nThe two mass shootings came days after 11 people were killed in the city of Durban when gunmen stormed a house in the KwaMakhutha township.\nIllegal weapons are prevalent in South Africa and gun violence has been a persistent problem for decades, with about 60 murders recorded every day in the country of 62 million.\nBut a recent spate of mass shootings has raised fears that the problem is deepening, with violence often linked to turf wars between gangs engaged in drug trafficking and illegal mining.\nIn February, President Cyril Ramaphosa called organised crime \"the most immediate threat to our democracy, our society and our economic development\".\nEarlier this year, the military was deployed alongside police in areas with the highest murder rates in an effort to reduce armed violence.\nOn Saturday, a tenth woman's body was found in Ekurhuleni, to the east of Johannesburg, with local police saying they were unable to rule out a serial killer operating in the area with similarities between the deaths.",

    "summaryJa": "Investors seeking a stable income stream can enhance their portfolios with the addition of dividend stocks.",
    "bodyOriginal": "Stock markets remain volatile as investors weigh uncertainty in the Middle East, rising interest rates and concerns about the artificial intelligence (AI) trade.\nGiven this volatile backdrop, investors seeking a stable income stream can enhance their portfolios with the addition of dividend stocks. In this regard, tracking recommendations of top Wall Street analysts can help shortlist attractive dividend stocks that are backed by strong financials.\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\nChevron\nIntegrated oil and gas giant Chevron (CVX) is the first dividend pick. Earlier this month, the company paid a quarterly dividend of $1.78 per share. At an annualized dividend of $7.12 per share, CVX offers a dividend yield of about 3.5%.\nAfter a meeting with senior leadership, Goldman Sachs analyst Neil Mehta reiterated a buy rating on CVX and raised his price target to $240 from $225. Among the key takeaways Mehta emphasized was that Chevron is building a solid pipeline of promising international exploration projects across Latin America, the Middle East, West Africa and the Eastern Mediterranean. In particular, he mentioned the focus on Venezuela, where Chevron expects to more than double gross production to 600 kbd from about 280 kbd by 2031, using three joint ventures.\nMehta also noted Chevron's efforts to deploy new technologies, especially in shale and tight-oil operations. CVX is focused on boosting productivity and efficiency to maximize free cash flow, he added.\nInitiatives such as artificial lift optimization, AI and machine learning, and advanced chemical treatments are expected to improve recovery by about 10% in new wells. Consequently, capital spending per barrel in U.S. shale is projected to fall 25% in 2026, with total Permian spending dropping below $3.5 billion.\nMehta also said that Chevron sees power as a growth opportunity and is using its U.S. natural gas portfolio, key equipment and partnerships to meet rising demand. Notably, Chevron recently signed a 20-year power purchase deal with Microsoft (MSFT) to supply 2.67 GW of behind-the-meter capacity. This project, called Kilby, is expected to see its first power delivery in 2028 and generate mid-teens returns and long-term cash flows.\nMehta ranks No. 536 among more than 12,500 analysts tracked by TipRanks. His ratings have been profitable 61% of the time, delivering an average return of 11.3%. See Chevron Statistics on TipRanks.\nEnterprise Products Partners\nEnterprise Products Partners (EPD) is a master limited partnership (MLP) that provides midstream energy services to producers and consumers of natural gas, natural gas liquids (NGLs), crude oil, refined products and petrochemicals. With a quarterly cash distribution of 56 cents per common unit ($2.24 per common unit annualized), EPD offers a yield of about 6%.\nFollowing a recent call with the company, RBC Capital analyst Elvira Scotto reiterated a buy rating on EPD with a price target of $42. The analyst slightly lowered her estimates for the second half of 2026, citing margin and volume normalization, though demand dynamics remain strong.\nWhile the 5-star analyst expects a sequential decline due to normal seasonality and normalization following high spreads in the first half of the year, she still expects EPD to report another solid quarter (Q3 2026) and enter 2027 with a favorable setup. Ahead of Q3 earnings, Scotto expects investors to focus on export demand durability, EPD's ability to profit from spot cargo sales and growth in Permian volumes.\nScotto continues to expect $150 million of common unit buybacks per quarter in the second half of 2026. She expects buybacks to increase to $200 million per quarter in 2027, as capex spending declines and free cash flow improves.\nIn total, Scotto is bullish on EPD and views it as a core MLP holding that has both offensive and defensive characteristics. The analyst praised EPD's diverse asset base as ensuring stable cash flows. \"Furthermore, the partnership's multi-year organic growth backlog helps provide visibility on long-term distribution growth,\" Scotto said.\nScotto ranks No. 199 among more than 12,500 analysts tracked by TipRanks. Her ratings have been successful 67% of the time, delivering an average return of 15.9%. See Enterprise Products Partners Financials on TipRanks.\nBrookfield Infrastructure Partners\nBrookfield Infrastructure Partners (BIP) operates a diversified portfolio of high-quality utilities, transport, midstream and data assets. The company declared a quarterly distribution of 45.5 cents per unit, payable on September 29. At an annualized distribution of $1.82, BIP offers a yield of 5.2%.\nRecently, BMO Capital analyst Devin Dodge reaffirmed a buy rating on Brookfield Infrastructure with a price target of $47. The analyst cited improved visibility into BIP's growth and views its corporate simplification as a potential catalyst.\n\"Layering in the benefits from the proposed corporate simplification, a multiple well below historical levels and an attractive yield, we believe BIP offers a compelling risk/reward and it remains a preferred idea,\" said Dodge.\nWith more organic growth projects in the pipeline and new partnership investment opportunities, Dodge believes that BIP has clearer visibility into where it will deploy capital. That should support continued double-digit growth in funds from operations (FFO) per unit.\nDodge said the semiconductor foundries that BIP is developing with Intel (INTC) are expected to be fully commissioned by the end of 2026, with returns improving through Q4 2026. Dodge expects the joint venture to boost FFO by 300-400 basis points.\nDodge ranks No. 476 among more than 12,500 analysts tracked by TipRanks. His ratings have been profitable 68% of the time, delivering an average return of 13.5%. See Brookfield Infrastructure Partners KPIs on TipRanks.",

    "summaryJa": "One firm sees a \"reasonably constructive signal for risk appetite\" among institutional investors.",
    "bodyOriginal": "Institutional investors are taking the wheel in the stock market.\nAfter years on a big buying streak, retail traders appear to be moving to the sidelines. At the same time, data from Vanda Research shows that big investors have held steady on stocks in the face of spiking Treasury yields.\n\"Institutional investors have been surprisingly resilient through this week's macro volatility,\" Viraj Patel, global market strategist at Vanda, wrote to clients on Friday.\nOptions flows from institutional investors are around three times higher than a typical September, the data shows.\nPatel said that big money's flows have turned up over the past five sessions, despite the 10-year and 30-year U.S. Treasury yields climbing to their highest levels in more than a decade. He called that a \"reasonably constructive signal for risk appetite\" among institutional investors hidden in the broader story of de-risking.\nPatel said that institutional traders are buying select artificial intelligence plays amid the volatility.\nHe pointed to Meta Platforms as a top pick in particular last week. Shares of the Facebook parent have surged almost 13% in the week following its debut of the Muse Charm device. Momentum has been building for the stock since Meta unveiled its Muse personal AI agent earlier this month.\n\"Macro uncertainty isn't stopping risk-taking,\" Patel said. Instead, \"it's making investors far more selective.\"\nRetail loses volume share\nRetail traders had a banner performance in 2025, leading some to declare that they had shed the \"dumb money\" title. Their performance was credited in part with decisions to buy the dip during market declines in the wake of President Donald Trump's tariff rollout.\nBut Goldman Sachs said retail investors' share of S&P 500 trading volume has trended down from its peak nearly a year ago. It's now more than three percentage points below the five-year average, the bank found.\nThe S&P 500 is ended last week more than 1% higher despite the pressure from rising Treasury yields. That advance has pulled the benchmark into positive territory for the month.",

    "title": "Andy Burnham refuses to back third runway at Heathrow",
    "titleJa": "Andy Burnham refuses to back third runway at Heathrow",
    "summaryJa": "Andy Burnham said he would wait for the results of a consultation on a scheme estimated to cost £33bn",
    "bodyOriginal": "Andy Burnham refuses to back third runway at Heathrow\n- Published\nPrime Minister Andy Burnham has refused to say whether he backs a third runway at Heathrow after it emerged that the expansion of the London airport could be delayed by up to four years.\nBurnham - who, as Mayor of Greater Manchester, opposed the project - told Sunday With Laura Kuenssberg: \"I think principally, it's a matter for London and Londoners.\"\nHe added: \"I think we ought to hear the voice of people there first. It's not right for me to just jump straight in on the back of the consultation.\"\nFormer Chancellor Rachel Reeves had championed the runway to boost the economy, with a schedule to open by 2035 but Heathrow indicated on Saturday it may not be operational before 2039.\nAs Manchester's mayor, Burnham had been against the project over concerns that it would delay investment in transport for the north. When he took office, he said he was \"open-minded\" about the scheme.\nAs he prepared for his first annual Labour Party conference as prime minister, Burnham said: \"There's a consultion but there are different views and you have to take those views seriously in coming to a decision.\"\nIn response, Heathrow said: \"We agree with the prime minister that local voices must be heard. We know from consistent polling over the last decade that communities support our plans for expansion and support is only growing over time.\"\nThe project, estimated to cost £33bn, has attracted opposition from environmental campaigners and local resident groups as well as Mayor of London Sadiq Khan.\nA third runway would mean demolishing hundreds of homes, diverting rivers and rerouting a section of the M25 motorway through a tunnel.\nBut it is estimated it would create 100,000 jobs and provide a major boost to the UK economy.\nThe number of flights from the site, currently capped at 480,000 a year, could go up to 720,000, or nearly 2,000 a day on average.\nA new runway has been backed by the unions Unite and the GMB.\nSharon Graham, Unite's general secretary said: \"A third runway at Heathrow is essential and we need to get going with it.\n\"This is more than just infrastructure. It's about investing in the workforce, securing the future of good, unionised jobs and a guaranteed market for UK steel.\"\nEarlier this weekend, Heathrow conceded that meeting the original deadline would be increasingly difficult without further steps to simplify the planning process.\nIt said it hoped to secure planning permission by 2029 and then open the runway \"within a decade\".\nThe Department for Transport said the timeline had \"always been ambitious\" and it would continue to work with stakeholders \"at pace\" on the matter.\n- Published19 hours ago\n- Published29 January 2025",

e unions Unite and the GMB.\nSharon Graham, Unite's general secretary said: \"A third runway at Heathrow is essential and we need to get going with it.\n\"This is more than just infrastructure. It's about investing in the workforce, securing the future of good, unionised jobs and a guaranteed market for UK steel.\"\nEarlier this weekend, Heathrow conceded that meeting the original deadline would be increasingly difficult without further steps to simplify the planning process.\nIt said it hoped to secure planning permission by 2029 and then open the runway \"within a decade\".\nThe Department for Transport said the timeline had \"always been ambitious\" and it would continue to work with stakeholders \"at pace\" on the matter.\n- Published19 hours ago\n- Published29 January 2025",

    "title": "Debt-hungry AI companies face increased risk as bond yields spike",
    "titleJa": "Debt-hungry AI companies face increased risk as bond yields spike",
    "summaryJa": "The AI infrastructure buildout shows no sign of slowing, but the surge in Treasury yields means it's at least going to cost more.",
    "bodyOriginal": "With Treasury yields climbing this week to their highest levels since 2007, companies reliant on debt are poised to see their borrowing costs rise. That means the AI infrastructure buildout, which has already reached historic levels, is about to get even more expensive.\nJPMorgan Chase estimated in June that $4.1 trillion in AI-related debt will be issued through 2030, as data center companies and others tied to the artificial intelligence boom race to build up capacity to meet what many industry experts view as insatiable demand for AI services.\nAs borrowers go back to the market, they're now looking at a 10-year Treasury yield that sits near 5.17%, up about 1 percentage point since the start of the year, meaning companies issuing debt are going to have to offer more attractive rates of return to lure investors.\nThe market isn't in panic mode, at least not yet. Shares of debt-heavy neocloud CoreWeave have held up fine, rising almost 8% this week, while Oracle, which has counted on the debt market for its AI expansion, has had a tougher time, falling 7% for the week and about 30% this year.\nMeanwhile, Japan's SoftBank, a principal provider of capital for AI projects, raised $11.1 billion in a junk-bond sale this week, with yields as high as 9.75% for the 7-year tranche.\n\"They basically are price insensitive to that raise, which means they're price takers,\" said Mark Malek, chief investment officer at Siebert Financial, in an interview. \"In my view, a lot of these companies need to be price insensitive. They need to get as much capital as possible to compete.\"\nAt the center of the AI craze are leading model developers OpenAI and Anthropic, which are each valued at close to $1 trillion in the private market. To provide the infrastructure needed for their advanced models, as well as models and services from a host of other companies, tech's hyperscalers — Amazon, Google, Meta and Microsoft — have committed to hundreds of billions of dollars this year in capital expenditures, with an expected increase coming in 2027.\nWhile a healthy dose of that investment is being funded through debt raises, those tech giants all have investment grade credit ratings, providing them with cheaper access to capital. But for the rest of the pack, bigger challenges lie ahead, according to some market participants.\nWarning signs?\nA senior private credit investor, who asked to remain unnamed in order to speak candidly on the matter, told CNBC that, moving forward, neocloud deals will be more difficult to finance, because the companies have less cushion to absorb the costs.\nRiley Thompson, a vice president at Mitsubishi HC Capital America said in an interview that lenders are getting pickier about the projects they're willing to fund even if the borrower agrees to pay a higher rate.\n\"Instead of a roster of 50 neoclouds, there's probably 20 that the market's truly interested in,\" Thompson said.\nCoreWeave, which went public last year, warns about rising rates in its SEC filings. In its latest quarterly filing, the company said that, as of June, every 100-basis point (1 percentage point) increase in rates could result in a $30 million jump in its interest expense, based on the balance of its outstanding floating rate debt.\nAn early warning sign may have landed this week, when Oracle's stock slid following a Bloomberg report that the company sent a \"force majeure\" notice tied to its New Mexico data center project to protect itself from higher expenses. The company is looking to delay payment on the campus, dubbed Project Jupiter, if it fails to come online as expected in 2028, the report said. Oracle said the project \"remains on our planned schedule.\"\nRising interest rates aren't the only matter at hand. Prior to this week's spike in yields, the CEOs of Anthropic and OpenAI had started urging a slowdown in the pace of AI development after industry researchers went public with concerns that advanced models risk spinning out of human control.\nAt the same time, a nationwide backlash against AI data centers has emerged as a major issue heading into November's mid-term elections, with 69% of respondents to a recent NBC News Decision Desk Poll, powered by SurveyMonkey, saying they oppose the construction of such facilities in their local area. On Monday, Texas Republican Gov. Greg Abbott, who's in the midst of a tight race for reelection, ordered a temporary halt to all data center-related environmental permits following a moratorium on grid approvals last month.\nStill, demand for AI services is exploding. The latest example is Meta's Muse personal assistant app, which has rocketed in popularity since its launch earlier in September. Muse clocked more than 2.5 million global downloads in its first two weeks, passing ChatGPT at the top of Apple's App Store, and Evercore's Mark Mahaney told CNBC this week that it could reach 100 million users within six to 12 months.\nAndrew Giudici, global head of corporate, project, and infrastructure finance at credit rating agency KBRA, said that even as rising rates may affect future deals, he doesn't see a major impact on borrower demand.\n\"In a normal environment, people might take a step back and pause a bit,\" Giudici said. \"But I don't think that's going to happen here. I think you're going to continue to see relatively large issuance.\"\nHaim Zaltzman, vice chair of Latham & Watkins' emerging companies and growth practice, said there's no doubt that as costs rise, \"somebody will have to absorb it.\"\n\"But absorbing it in that kind of demand structure, where the demand is so great, is a lot easier,\" said Zaltzman, who works on AI infrastructure financing.\nThe equation is even simpler for Bernie Margulies, CEO of American Compute, which advises on risk management for GPU financing. He said borrowers are eager to secure financing even at higher costs, especially if they have committments with OpenAI and Anthropic, which have been signing contracts to secure compute capacity years into the future.\n\"If you have a deal with Anthropic, will 50 basis points really stop you?\" Margulies said.",

ntracts to secure compute capacity years into the future.\n\"If you have a deal with Anthropic, will 50 basis points really stop you?\" Margulies said.",
