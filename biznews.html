    "summaryJa": "Chinese biopharma stocks rose on Monday after a report that the U.S. may continue to allow most drug licensing deals with Chinese firms.",
    "bodyOriginal": "Chinese biopharma stocks jumped in Hong Kong on Monday after a report that the U.S. is considering rules that would allow American pharmaceutical companies to continue licensing most drugs from Chinese firms.\nInnovent Biologics jumped 6%, while Akeso surged 8% and CSPC Pharmaceutical Group gained more than 6%. HUTCHMED climbed 3%, while Sino Biopharmaceutical added 8%.\nThe Hang Seng Biotech Index was also up more than 5%.\nThe moves followed a Reuters report Friday, citing people briefed on the process, that the U.S. Treasury Department is drafting rules that would likely allow American pharmaceutical companies to invest in promising new drugs being developed by Chinese firms, excluding those related to pathogens or biotechnology that could be weaponized. The rules have not been finalized and remain subject to change, said the report.\nThat would put biopharma on a different track from sectors such as artificial intelligence and semiconductors, where the U.S. has tightened restrictions on China.\nAlmost half of U.S. deals to license drugs from overseas in 2025 were with Chinese companies, according to GlobalData, as cited by Reuters.\nPfizer, for example, announced a partnership worth up to $10.5 billion with Innovent in May, covering the research and development of 12 oncology programs.\nChina’s out-licensing boom has continued despite geopolitical concerns. A record 81 deals worth a combined $110 billion were completed in the first half of 2026, according to NMPA data cited by Nomura.\nThe bank said investors now appear “largely immune” to intermittent geopolitical concerns around the sector, citing Chinese companies’ strong value proposition in novel drug development.\nChina has also made globalization a key goal for pharmaceutical and biotech companies under its 15th five-year plan, Nomura noted. Against that backdrop, the bank expects China-U.S. out-licensing deals to “ride on a high tide.”",

    "id": "iran-vows-painful-retaliation-as-trump-p-b44ff6e1",
    "title": "Iran vows 'painful' retaliation as Trump piles on pressure ahead of UN General Assembly meeting",
    "titleJa": "Iran vows 'painful' retaliation as Trump piles on pressure ahead of UN General Assembly meeting",
    "summaryJa": "Trump threatened to destroy Iran's economy or eliminate its leadership if Tehran doesn't strike a deal, complicating efforts at diplomacy.",
    "bodyOriginal": "President Donald Trump threatened to destroy Iran's economy or eliminate its leadership if Tehran doesn't strike a deal, raising the stakes as Iranian officials head to New York for this week's gathering of world leaders at the UN.\nTrump told Fox News on Sunday that the only options on the table were \"wiping Iran out,\" or letting its economy \"rot,\" unless both sides reach a deal.\nSeparately, Iran's military said that its intelligence suggested a new, large-scale strike being prepared by the U.S. and its allies, warning of \"painful\" retaliation across the Middle East. Regional countries backing such a strike would be treated as parties to the conflict, it said.\n\"If the U.S. makes any mistake against the Islamic Republic of Iran, all its positions and interests in the region will be targeted by sustained, effective and painful attacks,\" the Khatam al-Anbia Central Headquarters of Iran said, according to semi-official media Tasnim.\nThe exchange marks the latest escalation in the seven-month war after a June memorandum collapsed, with both sides digging in before a diplomatic delegation led by Iranian President Masoud Pezeshkian is due to attend the United Nations General Assembly in New York this week.\nThe Iranian president will hold meetings with country leaders on the sidelines of the UN gathering, according to Tasnim.\nIn a phone call with a Fox News reporter, Trump said that he would be open to meeting Pezeshkian during the assembly, but also that he's in \"deciding mode\" over whether to blow up the nation.\nThe U.S. State Department issued a security alert citing risks of unforeseen escalation in the Middle East, telling Americans to exercise more vigilance and be aware of possible flight cancellations and airspace closures.\nThe warnings came after Iran-backed Houthi militants claimed missile and drone attacks on Riyadh on Saturday, triggering the first air-raid alert in the Saudi capital since fighting escalated in July.\nSaudi authorities said they intercepted and destroyed a ballistic missile and reported no casualties or damage. The Houthis also attempted to target civilians and infrastructure in several parts of the kingdom, Saudi-led coalition forces spokesperson Major-General Turki al-Maliki said on X on Saturday, though those attacks were thwarted by the country's air defenses.\nOil prices have pulled back in recent days despite widening hostilities, as traders hope for a recovery in energy shipments from oil-rich Saudi Arabia. Futures for Brent crude dipped 1.7% to $102.15 a barrel and U.S. West Texas Intermediate slid 1.8% to $98.46.\nOil prices will remain high despite U.S. progress in moving oil through the Strait of Hormuz, a team of analysts at Eurasia Group said in a Saturday note. Any rebound in oil flows would not be enough to address the overall market deficit, they said, forecasting Brent prices to trade in a higher band of $90-110 per barrel through the rest of this year.\n\"Iran's leadership will stick with resistance, even as they quarrel internally,\" according to the consultancy firm, as Tehran seeks to use military proxies and tanker attacks to keep a chokehold on shipping flows, to pressure Washington into concessions.\nTehran has insisted that it would not reopen the Strait of Hormuz until Washington fulfills its commitment under the June memorandum, which called for lifting the naval blockade of Iranian ports, easing sanctions, unfreezing Iranian assets and ending U.S. military threats.\nIranian parliament speaker Mohammad Bagher Ghalibaf said Sunday that Iran must keep on fighting and negotiating, to push back its enemies, and only work on diplomacy when it has the upper hand on the battlefield.",

rities said they intercepted and destroyed a ballistic missile and reported no casualties or damage. The Houthis also attempted to target civilians and infrastructure in several parts of the kingdom, Saudi-led coalition forces spokesperson Major-General Turki al-Maliki said on X on Saturday, though those attacks were thwarted by the country's air defenses.\nOil prices have pulled back in recent days despite widening hostilities, as traders hope for a recovery in energy shipments from oil-rich Saudi Arabia. Futures for Brent crude dipped 1.7% to $102.15 a barrel and U.S. West Texas Intermediate slid 1.8% to $98.46.\nOil prices will remain high despite U.S. progress in moving oil through the Strait of Hormuz, a team of analysts at Eurasia Group said in a Saturday note. Any rebound in oil flows would not be enough to address the overall market deficit, they said, forecasting Brent prices to trade in a higher band of $90-110 per barrel through the rest of this year.\n\"Iran's leadership will stick with resistance, even as they quarrel internally,\" according to the consultancy firm, as Tehran seeks to use military proxies and tanker attacks to keep a chokehold on shipping flows, to pressure Washington into concessions.\nTehran has insisted that it would not reopen the Strait of Hormuz until Washington fulfills its commitment under the June memorandum, which called for lifting the naval blockade of Iranian ports, easing sanctions, unfreezing Iranian assets and ending U.S. military threats.\nIranian parliament speaker Mohammad Bagher Ghalibaf said Sunday that Iran must keep on fighting and negotiating, to push back its enemies, and only work on diplomacy when it has the upper hand on the battlefield.",

    "id": "uk-should-team-up-with-canada-in-new-eur-d916d83e",
    "title": "UK should 'team up' with Canada in new Europe alliance, Canadian minister tells BBC",
    "titleJa": "UK should 'team up' with Canada in new Europe alliance, Canadian minister tells BBC",
    "summaryJa": "It comes after European Commission President proposed \"opening the door\" for Canada to become an associate member of the EU.",
    "bodyOriginal": "UK should 'team up' with Canada in new Europe alliance, Canadian minister tells BBC\n- Published\nThe UK should \"team up\" with a proposed economic alliance between Canada and Europe, Canadian Finance Minister François-Philippe Champagne has said.\n\"This is all about the substance, to build an alliance of the future,\" he told the BBC. \"The world has changed. America has changed. So we need to change.\"\nChampagne also gave a frank assessment of the Canada-US trade war after a deal collapsed last month, saying the country had \"stood up for our industries, our workers, our country\" by imposing tariffs.\nHis comments come after European Commission President Ursula von der Leyen proposed \"opening the door\" to an associate EU membership for Canada, an unprecedented move for the bloc.\nCanadian Prime Minister Mark Carney's visit to address the European Union in Strasbourg, shortly after von der Leyen's proposal was made, was \"to build the alliance of the future\", Champagne said.\nCarney, the former Governor of the Bank of England, has previously talked about an alliance of \"middle powers\" working together on economic growth, resilience and security.\nSpeaking to the BBC, Champagne said the UK and Canada had shared values.\n\"We need to look at partnership in a different way, and the great thing is that when you look at Canada, and I would say the United Kingdom, we share the same values. We are very aligned in our vision of the world. Why don't we team up?\" he said.\n\"We are independent and sovereign, but we are stronger together.\"\nAfter his return to the White House last year, US President Donald Trump imposed sweeping global tariffs, including on long-standing trade allies such as the UK.\nWhile the UK renegotiated a trade deal with the US in June last year, the new Canada-EU alliance does raise questions for the UK's post Brexit positioning with Europe, as well as its position with the US, after some changes of presidential rhetoric over the Falklands and Irish unity in recent weeks.\nCarney met Prime Minister Andy Burnham in Liverpool in the middle of his trip to Brussels and Strasbourg last week, while Champagne attended a meeting of EU finance ministers in Dublin on Friday, alongside the Chancellor John Healey.\n'Enough is enough'\nThe developing discussions around closer ties between the EU and Canada come as Canada remains locked in an escalating trade war with the US, with both sides imposing tit-for-tat tariffs after talks broke down at the last moment in August.\nPresident Trump has also threatened further tariffs on the EU if the associate membership plan proved \"hostile\" to the US, calling the idea laughable and labelling Canada a \"terrible trading partner\".\nChampagne said the trade war was not a conflict chosen by Canada.\n\"We responded because at some stage you have to say 'Enough is enough'. No one can infringe on our economic sovereignty… the world took notice,\" he said.\nThe minister said Canada does not seek escalation after its \"measured, targeted and strategic… dollar for dollar, tariff for tariff\" response, and the country would \"reengage at the right time\" with its southern neighbour.\nAffected industries would be supported \"as long as it takes and whatever it takes\", he added.\nChampagne argued that Canada's strong fiscal position helped underpin its resilience, and the dispute with the US provided a \"golden opportunity\" to diversify.\nThis is the backdrop to the promise of an \"alliance of the future\" between Canada and the EU, and the idea of \"teaming up\" with the UK too.\nCarney's new love-in with EU has everything to do with Trump\n- Published4 days ago\nWhat could EU associate member status mean for Canada?\n- Published3 days ago\nBurnham will meet Trump for the first time this week, in New York at the UN General Assembly.\nLast year, after his election, Carney invited King Charles to open the Canadian Parliament in Ottawa, a move widely seen as a rebuff to Trump's repeated suggestion that Commonwealth Canada could become part of the US.\nThe detail of the offer made by the EU to negotiate \"associate membership\" for Canada is yet to be formalised.\nChampagne said this was \"a moment of great opportunities\" and to strengthen the existing relationship between Canada and the EU.\nCarney last week pointed to Canadian membership of EU university, scientific research, AI and defence funding schemes, as well as for young Canadians and Europeans to \"cross the ocean and be able to study and live\".\nHe said Canada could supply critical minerals and gas and would seek access to European advanced technologies.\nIt is understood that both Canada and the EU see the opportunity for a process for like-minded nations which might not ever be full members, for example Australia.\n- Published3 days ago",

o Trump's repeated suggestion that Commonwealth Canada could become part of the US.\nThe detail of the offer made by the EU to negotiate \"associate membership\" for Canada is yet to be formalised.\nChampagne said this was \"a moment of great opportunities\" and to strengthen the existing relationship between Canada and the EU.\nCarney last week pointed to Canadian membership of EU university, scientific research, AI and defence funding schemes, as well as for young Canadians and Europeans to \"cross the ocean and be able to study and live\".\nHe said Canada could supply critical minerals and gas and would seek access to European advanced technologies.\nIt is understood that both Canada and the EU see the opportunity for a process for like-minded nations which might not ever be full members, for example Australia.\n- Published3 days ago",

    "titleJa": "Oil falls as crude flows remain 'surprisingly strong'",
    "summaryJa": "Oil fell Monday, as traders keep watch for a recovery in shipments from Saudi Arabia, even as Mideast tensions continue to escalate.",
    "bodyOriginal": "Oil fell Monday, as traders keep watch for a recovery in shipments from Saudi Arabia even after attacks by Iran-backed Houthis on Saudi Arabia with missiles and drones on Saturday.\nFutures for international benchmark Brent crude for November delivery fell 1.66% to $102.15 a barrel. U.S. West Texas Intermediate futures for October dropped 1.83% to $98.46 per barrel.\n\"Middle East oil flows remain surprisingly strong despite the disruption to Saudi Arabia's East-West pipeline,\" according to JPMorgan analysts in a Sept. 18 note. The total oil flows averaged 17.1 million barrels per day in the past 10 days, 6.1 million bpd below the 2025 average, it added.\nHowever, potential supply issues continue to present themselves. U.S. President Donald Trump said he is in a \"deciding mode\" and \"very big things\" are going to happen in the near future regarding the US-Iran war, in an interview with Fox News.\n\"My question is, if and when do I blow the entire nation up? They better behave,\" Trump added.\nDaniel Takieddine, co-founder and CEO of Sky Links Capital Group, expects prices are likely to remain closely tied to the pace of export normalization and diplomatic progress. \"Any setback or renewed deterioration in shipping conditions would tighten the physical market and restore upward pressure on prices,\" Takieddine added.",
    "bodyJa": "Oil fell Monday, as traders keep watch for a recovery in shipments from Saudi Arabia even after attacks by Iran-backed Houthis on Saudi Arabia with missiles and drones on Saturday.\nFutures for international benchmark Brent crude for November delivery fell 1.66% to $102.15 a barrel. U.S. West Texas Intermediate futures for October dropped 1.83% to $98.46 per barrel.\n\"Middle East oil flows remain surprisingly strong despite the disruption to Saudi Arabia's East-West pipeline,\" according to JPMorgan analysts in a Sept. 18 note. The total oil flows averaged 17.1 million barrels per day in the past 10 days, 6.1 million bpd below the 2025 average, it added.\nHowever, potential supply issues continue to present themselves. U.S. President Donald Trump said he is in a \"deciding mode\" and \"very big things\" are going to happen in the near future regarding the US-Iran war, in an interview with Fox News.\n\"My question is, if and when do I blow the entire nation up? They better behave,\" Trump added.\nDaniel Takieddine, co-founder and CEO of Sky Links Capital Group, expects prices are likely to remain closely tied to the pace of export normalization and diplomatic progress. \"Any setback or renewed deterioration in shipping conditions would tighten the physical market and restore upward pressure on prices,\" Takieddine added.",

    "id": "nvidia-boss-rejects-ai-extinction-fears-af391830",
    "title": "Nvidia boss rejects AI extinction fears as 'doomsday narratives'",
    "titleJa": "Nvidia boss rejects AI extinction fears as 'doomsday narratives'",
    "summaryJa": "Jensen Huang's comments come after warnings from AI researchers that the technology could lead to human extinction.",
    "bodyOriginal": "Nvidia boss rejects AI extinction fears as 'doomsday narratives'\n- Published\nNvidia CEO Jensen Huang has described warnings that AI could lead to humanity's extinction by the next decade as \"doomsday narratives\".\n\"2030 is not going to be the end of the world. There is 0% chance that's going to be the end of the world\", Huang said in an interview with CBS News, the BBC's US partner.\nHuang added: \"Scaring people is unnecessary. It is irresponsible.\"\nWarnings from researchers in recent weeks about potential risks posed by the technology escalated the debate about AI safety, with some industry executives calling for a slowdown in developing models.\nHis remarks follow claims posted on social media by former Anthropic researcher Jacob Coxon that AI developers believe the technology \"could kill us all by the end of the decade\".\nCoxon's concerns sparked debate about the technology's risks, including calls by top executives like Anthropic boss Dario Amodei and OpenAI's Sam Altman urging for AI's development to slow down.\nHuang said that such predictions are \"not grounded in science\", adding that it is in Nvidia's best interest to ensure the industry builds its products responsibly.\n\"Our company's success is directly connected to the safe deployment of products and services,\" he said. \"If we don't continue to do that, our value would be diminished.\"\nHuang suggested AI firms talking about a \"slow down\" could be seeking liability protections for harms their products may cause.\n\"Go and read between the lines,\" he said. \"They're actually not asking for more laws. They're asking to be relieved of the laws we do have, and I think that that's a problem.\"\nNot all AI workers think the tech could kill everyone\n- Published1 day ago\nOpenAI boss says world 'right to be afraid' but should trust AI firms\n- Published4 days ago\nWhy are there concerns AI could threaten humanity, and how real are they?\n- Published3 days ago\nNvidia is a key player in the industry, developing cutting edge computer chips that are crucial for making AI models.\nThe firm's most powerful chips face restrictions in China due to measures imposed by both Washington and Beijing.\nUS export controls aim to slow China's military and AI progress, while Chinese regulations are designed to encourage reliance on domestically produced technology.\nUS Treasury Secretary Scott Bessent and Chinese Vice Premier He Lifeng held talks in New York on Sunday as they try to strike deals on AI, tariffs and critical minerals.\nAfter the meeting, Bessent told reporters that the two sides had discussed setting up a new AI safety notification mechanism.\nIt came as President Donald Trump and his Chinese counterpart Xi Jinping are due to hold a summit in Washington later this week.\nLast week, Huang appeared at a UK summit hosted by King Charles, who warned tech leaders of the \"existential dangers\" of AI.\n\"The task before you is not merely to advance technology, but to ensure that it remains firmly in the service of humanity, community and the natural world,\" the King told the group.\nIn the US, President Donald Trump has downplayed concerns about AI's risks.\nTrump made a surprise phone call to Huang while the Nvidia boss was speaking on stage at a tech conference in Los Angeles on 14 September.\nDuring the call, Trump criticised calls to slow the pace of AI development and dismissed fears as a \"hoax\".",
    "bodyJa": "Nvidia boss rejects AI extinction fears as 'doomsday narratives'\n- Published\nNvidia CEO Jensen Huang has described warnings that AI could lead to humanity's extinction by the next decade as \"doomsday narratives\".\n\"2030 is not going to be the end of the world. There is 0% chance that's going to be the end of the world\", Huang said in an interview with CBS News, the BBC's US partner.\nHuang added: \"Scaring people is unnecessary. It is irresponsible.\"\nWarnings from researchers in recent weeks about potential risks posed by the technology escalated the debate about AI safety, with some industry executives calling for a slowdown in developing models.\nHis remarks follow claims posted on social media by former Anthropic researcher Jacob Coxon that AI developers believe the technology \"could kill us all by the end of the decade\".\nCoxon's concerns sparked debate about the technology's risks, including calls by top executives like Anthropic boss Dario Amodei and OpenAI's Sam Altman urging for AI's development to slow down.\nHuang said that such predictions are \"not grounded in science\", adding that it is in Nvidia's best interest to ensure the industry builds its products responsibly.\n\"Our company's success is directly connected to the safe deployment of products and services,\" he said. \"If we don't continue to do that, our value would be diminished.\"\nHuang suggested AI firms talking about a \"slow down\" could be seeking liability protections for harms their products may cause.\n\"Go and read between the lines,\" he said. \"They're actually not asking for more laws. They're asking to be relieved of the laws we do have, and I think that that's a problem.\"\nNot all AI workers think the tech could kill everyone\n- Published1 day ago\nOpenAI boss says world 'right to be afraid' but should trust AI firms\n- Published4 days ago\nWhy are there concerns AI could threaten humanity, and how real are they?\n- Published3 days ago\nNvidia is a key player in the industry, developing cutting edge computer chips that are crucial for making AI models.\nThe firm's most powerful chips face restrictions in China due to measures imposed by both Washington and Beijing.\nUS export controls aim to slow China's military and AI progress, while Chinese regulations are designed to encourage reliance on domestically produced technology.\nUS Treasury Secretary Scott Bessent and Chinese Vice Premier He Lifeng held talks in New York on Sunday as they try to strike deals on AI, tariffs and critical minerals.\nAfter the meeting, Bessent told reporters that the two sides had discussed setting up a new AI safety notification mechanism.\nIt came as President Donald Trump and his Chinese counterpart Xi Jinping are due to hold a summit in Washington later this week.\nLast week, Huang appeared at a UK summit hosted by King Charles, who warned tech leaders of the \"existential dangers\" of AI.\n\"The task before you is not merely to advance technology, but to ensure that it remains firmly in the service of humanity, community and the natural world,\" the King told the group.\nIn the US, President Donald Trump has downplayed concerns about AI's risks.\nTrump made a surprise phone call to Huang while the Nvidia boss was speaking on stage at a tech conference in Los Angeles on 14 September.\nDuring the call, Trump criticised calls to slow the pace of AI development and dismissed fears as a \"hoax\".",

    "title": "Will you get £13,000 a year when you stop working? Here's how to check",
    "titleJa": "Will you get £13,000 a year when you stop working? Here's how to check",
    "summaryJa": "How to find out how much state pension you're likely to receive - and what you can do about it now.",
    "bodyOriginal": "Will you get £13,000 a year when you stop working? Here's how to check\n- Published\nIt may well be decades away, but do you know how much money you will get when you stop working?\nThe current state pension is soon likely to top £13,000 a year.\nYet one in eight people surveyed by the UK tax authority have never checked how much money they are forecast to receive.\nHere's how to find out, and what you can do now to boost it.\nHow much is the state pension?\nIf you're working, it is highly likely you're contributing to the state pension - paid by the government when you hit pension age in your late 60s.\nAt the moment:\nthe flat-rate state pension - for those who reached state pension age after April 2016 - is £241.30 a week (£12,547.60 a year)\nthe old basic state pension - for those who reached state pension age before April 2016 - is £184.90 a week (£9,614.80 a year)\nMany people on the old basic state pension may receive a top-up called the additional state pension.\nMost pensioners have other income, primarily from pension savings built up over their career.\nThe state pension goes up each year in line with the highest of either inflation, wage increases, or 2.5%. So next April, the flat-rate state pension is expected to go above £13,000.\nHow do I qualify for it?\nWorkers pay National Insurance (NI) contributions. In general, you need 35 years of qualifying contributions to get a full state pension.\nYou may have gaps in your NI record if, for example, you have lived abroad. If you've taken time away from work to care for children or family members, then you get NI credits if you receive child benefit or carer's allowance.\nIt's possible to boost your contribution history with voluntary payments. Since April 2025, you have only been able to make payments for the previous six years.\nThat's one reason why it is important to check your state pension forecast well before you retire, experts say.\nHow do I check what I'll get?\nYou can see what you are forecast to receive:\nBy downloading the HM Revenue and Customs (HMRC) app, external\nUsing the official online state pension forecast webpage, external\nTo get a state pension, you will need to prove your identity using official photo ID.\nImportantly, never click on a link sent in an unsolicited email or text message, even if it looks official, as it could be a scam.\nFor more general information about tax and pensions, HMRC has launched a Tax Confident website, external.\nAnd the government-funded, independent Money Helper website has a free retirement guidance tool, external to walk you through the options.\nWhy haven't you checked?\nThe most common reason for not checking a state pension forecast was feeling that retirement was still too far away to think about, a recent survey of 5,000 consumers by HMRC found.\nLosing track of pension pots from previous jobs, and concerns about how career breaks might affect their entitlement, were also frequent responses.\nPeople aged 45-54 were the most likely to have never checked.\n\"Whether retirement is decades away or just around the corner, I'd encourage everyone to check their forecast and see if there's anything they can do now to boost their entitlement later,\" says Myrtle Lloyd, HMRC's chief customer officer.\nRelated topics\n- Published1 July",

are forecast to receive:\nBy downloading the HM Revenue and Customs (HMRC) app, external\nUsing the official online state pension forecast webpage, external\nTo get a state pension, you will need to prove your identity using official photo ID.\nImportantly, never click on a link sent in an unsolicited email or text message, even if it looks official, as it could be a scam.\nFor more general information about tax and pensions, HMRC has launched a Tax Confident website, external.\nAnd the government-funded, independent Money Helper website has a free retirement guidance tool, external to walk you through the options.\nWhy haven't you checked?\nThe most common reason for not checking a state pension forecast was feeling that retirement was still too far away to think about, a recent survey of 5,000 consumers by HMRC found.\nLosing track of pension pots from previous jobs, and concerns about how career breaks might affect their entitlement, were also frequent responses.\nPeople aged 45-54 were the most likely to have never checked.\n\"Whether retirement is decades away or just around the corner, I'd encourage everyone to check their forecast and see if there's anything they can do now to boost their entitlement later,\" says Myrtle Lloyd, HMRC's chief customer officer.\nRelated topics\n- Published1 July",

    "titleJa": "Man, 82, dies after beach fight with 76-year-old over sunlounger in Greece",
    "summaryJa": "One eyewitness said the scene was so chaotic that screaming could be heard from the other end of the beach.",
    "bodyOriginal": "Man, 82, dies after beach fight with 76-year-old over sunlounger in Greece\n- Published\nAn 82-year-old man has died after getting into a fight with a man in his 70s over a sunlounger on a beach in Greece, local media is reporting.\nWitnesses say a disagreement over the use of the loungers at Vouliagmeni beach, near Athens, escalated into a violent fight, which then further spiralled to involve other people.\nOne eyewitness told the Kathimerini newspaper that the scene was so chaotic, the screaming could be heard from the other end of the beach.\nThe younger man, who was 76, has reportedly been arrested. A 21-year-old woman who was with him was also detained but later released. Witnesses told Ta Nea daily newspaper that she had a bloodied and swollen face.\nDuring the fight, the 82-year-old collapsed. According to various reports, he received CPR and a defibrillator was used on him before an ambulance arrived. The man was taken to hospital where he later died.\nAnother witness said that the victim seemed to be waiting for other people and had reserved a sunlounger, which appeared to be the cause of the initial disagreement.\nAuthorities are investigating what led to the physical altercation and what caused the man's death.",
    "bodyJa": "Man, 82, dies after beach fight with 76-year-old over sunlounger in Greece\n- Published\nAn 82-year-old man has died after getting into a fight with a man in his 70s over a sunlounger on a beach in Greece, local media is reporting.\nWitnesses say a disagreement over the use of the loungers at Vouliagmeni beach, near Athens, escalated into a violent fight, which then further spiralled to involve other people.\nOne eyewitness told the Kathimerini newspaper that the scene was so chaotic, the screaming could be heard from the other end of the beach.\nThe younger man, who was 76, has reportedly been arrested. A 21-year-old woman who was with him was also detained but later released. Witnesses told Ta Nea daily newspaper that she had a bloodied and swollen face.\nDuring the fight, the 82-year-old collapsed. According to various reports, he received CPR and a defibrillator was used on him before an ambulance arrived. The man was taken to hospital where he later died.\nAnother witness said that the victim seemed to be waiting for other people and had reserved a sunlounger, which appeared to be the cause of the initial disagreement.\nAuthorities are investigating what led to the physical altercation and what caused the man's death.",

    "id": "german-chancellor-merz-calls-state-elect-576faa5a",
    "title": "German Chancellor Merz calls state election a 'disaster' for his party but vows to stay on",
    "titleJa": "German Chancellor Merz calls state election a 'disaster' for his party but vows to stay on",
    "summaryJa": "Exit polls show damaging losses for Merz's centre-right CDU party in the states of Berlin and Mecklenburg-Vorpommern.",
    "bodyOriginal": "German Chancellor Merz calls state election a 'disaster' for his party but vows to stay on\n- Published\nEmbattled German Chancellor Friedrich Merz has vowed to stay on despite exit polls in two local elections suggesting damaging defeats for his centre-right Christian Democratic Union (CDU) party.\nIn the north-eastern state of Mecklenburg-Vorpommern, the party was initially projected to only just scrape through, with its worst ever election result. A few hours later, however, it had dipped below the 5% threshold needed to stay in parliament. Merz called the result \"a disaster\" for his party.\nMeanwhile the far-right AfD was on track to win the most votes in Mecklenburg-Vorpommern, but it is unlikely to govern as other parties refuse to work with it.\nIn Berlin, the ruling CDU was also expected to be beaten by Die Linke (The Left).\nMerz is under mounting pressure, with poor approval ratings and rumours he could even be replaced mid-term in a so-called chancellor swap.\nVotes took place on Sunday, a fortnight after the CDU saw its vote halved as the Alternative for Germany (AfD) won a major victory in the state of Saxony-Anhalt.\nEchoing comments he made after that defeat, Merz told reporters at the party's Berlin headquarters on Sunday that he would forge ahead with his coalition government's plans to push through a package of economic, tax and welfare reforms.\n\"The reforms have to come,\" he insisted. \"I am taking on this responsibility, because I want to move our country forward\".\n\"What needs to be done now requires backbone, steadfastness and patience,\" Merz said. \"I will demonstrate this as CDU party chairman and, above all, as chancellor of our country.\"\n\"I would even go so far as to say that these reforms are the antidote to the authoritarian poison that, with the fascination of authoritarianism, is penetrating ever deeper into our society,\" Merz added.\nAs the projected results came up on the screen at the CDU's election night gathering in Berlin, there were no cheers or celebration.\nThis is a party that knows it's in trouble, and its leader quickly went on the offensive, declaring that he is going nowhere.\nMerz has long coveted the top job in German politics, and likely won't give it up easily.\nPolls for both states closed at 18:00 local time (17:00 BST), with a final result expected later on Sunday night, or even Monday morning.\nPublic broadcasters ZDF and ARD put the AfD slightly ahead in Mecklenburg-Vorpommern.\nThe party was projected to take 38% of the vote share in the state, followed in second place by the centre-left SPD, on 36%.\nFor Berlin, the broadcasters put the CDU on 20% of the vote share when polls closed, behind Die Linke - which has never topped polls in the capital before - on nearly 26%.\nThe AfD also looks set to increase its vote in Berlin, with a projected 16% of the vote.\nPrior to Sunday's elections, there had been intense speculation in Germany that Merz could be replaced unless his party's political fortunes improved.\nEarlier this week, the leaders of eight German states backed Merz, who has only been chancellor for 16 months.\nOn Sunday, Burkard Dregger from the CDU in Berlin, told the BBC it was right that Merz should stay on. \"He has a lot of work to do and we don't have time to waste to form new government in the federal level\".\nHe described the electorate as \"impatient\", adding that it was \"not realistic to expect that every issue has been solved within one year.\n\"He has got four years and we have to give him the four years,\" Dregger said.\nWhile his backers have argued that many of the problems the nation faces are inherited, Merz himself is deeply unpopular.\nThe former corporate lawyer's tack to the right on issues like immigration has failed to erode AfD support, while also alienating people further to the left.\n- Published12 hours ago\n- Published4 days ago\n- Published7 September",

athering in Berlin, there were no cheers or celebration.\nThis is a party that knows it's in trouble, and its leader quickly went on the offensive, declaring that he is going nowhere.\nMerz has long coveted the top job in German politics, and likely won't give it up easily.\nPolls for both states closed at 18:00 local time (17:00 BST), with a final result expected later on Sunday night, or even Monday morning.\nPublic broadcasters ZDF and ARD put the AfD slightly ahead in Mecklenburg-Vorpommern.\nThe party was projected to take 38% of the vote share in the state, followed in second place by the centre-left SPD, on 36%.\nFor Berlin, the broadcasters put the CDU on 20% of the vote share when polls closed, behind Die Linke - which has never topped polls in the capital before - on nearly 26%.\nThe AfD also looks set to increase its vote in Berlin, with a projected 16% of the vote.\nPrior to Sunday's elections, there had been intense speculation in Germany that Merz could be replaced unless his party's political fortunes improved.\nEarlier this week, the leaders of eight German states backed Merz, who has only been chancellor for 16 months.\nOn Sunday, Burkard Dregger from the CDU in Berlin, told the BBC it was right that Merz should stay on. \"He has a lot of work to do and we don't have time to waste to form new government in the federal level\".\nHe described the electorate as \"impatient\", adding that it was \"not realistic to expect that every issue has been solved within one year.\n\"He has got four years and we have to give him the four years,\" Dregger said.\nWhile his backers have argued that many of the problems the nation faces are inherited, Merz himself is deeply unpopular.\nThe former corporate lawyer's tack to the right on issues like immigration has failed to erode AfD support, while also alienating people further to the left.\n- Published12 hours ago\n- Published4 days ago\n- Published7 September",

    "bodyOriginal": "President Donald Trump will meet with New York City Mayor Zohran Mamdani on Monday ahead of the upcoming U.N. General Assembly, the mayor's office confirmed to CNBC on Sunday.\nThe mayor's press office said the meeting will take place at Gracie Mansion and \"will focus on issues affecting New York City and New Yorkers.\"\nMamdani, a 34-year-old democratic socialist, rose to national prominence after winning New York City's 2025 mayoral election. He has emerged as a top leader amid the Democratic Party's leftward shift, and Monday's meeting will be the latest tete-a-tete between the two political adversaries.\nTrump's Republican Party has placed Mamdani at the center of its messaging blitz ahead of November's midterm elections, where the GOP is trying to paint Democrats as \"communists.\" Democrats are surging in public polling heading into the midterms, where Republicans risk losing control of both the House and the Senate.\nTrump himself has maintained an unusually cordial relationship with Mamdani — whom he actively worked against during the mayoral race — despite his own party's attempts to attack the mayor. A native New Yorker, the president has hosted Mamdani at the White House twice for surprisingly friendly meetings.",
    "bodyJa": "President Donald Trump will meet with New York City Mayor Zohran Mamdani on Monday ahead of the upcoming U.N. General Assembly, the mayor's office confirmed to CNBC on Sunday.\nThe mayor's press office said the meeting will take place at Gracie Mansion and \"will focus on issues affecting New York City and New Yorkers.\"\nMamdani, a 34-year-old democratic socialist, rose to national prominence after winning New York City's 2025 mayoral election. He has emerged as a top leader amid the Democratic Party's leftward shift, and Monday's meeting will be the latest tete-a-tete between the two political adversaries.\nTrump's Republican Party has placed Mamdani at the center of its messaging blitz ahead of November's midterm elections, where the GOP is trying to paint Democrats as \"communists.\" Democrats are surging in public polling heading into the midterms, where Republicans risk losing control of both the House and the Senate.\nTrump himself has maintained an unusually cordial relationship with Mamdani — whom he actively worked against during the mayoral race — despite his own party's attempts to attack the mayor. A native New Yorker, the president has hosted Mamdani at the White House twice for surprisingly friendly meetings.",

    "title": "Bessent meets China Vice Premier He Lifeng ahead of Trump-Xi summit",
    "titleJa": "Bessent meets China Vice Premier He Lifeng ahead of Trump-Xi summit",
    "summaryJa": "Scott Bessent and China’s He Lifeng are holding talks on trade, AI and critical minerals ahead of Trump and Xi’s Sept. 24 summit.",
    "bodyOriginal": "Treasury Secretary Scott Bessent is meeting with Chinese Vice Premier He Lifeng ahead of Chinese President Xi Jinping's visit to the U.S. this week.\nThe talks are expected to cover artificial intelligence, tariffs, rare earths and other economic issues ahead of Trump and Xi's Sept. 24 summit in Washington, D.C.\n\"In New York City, Vice Premier He Lifeng and I are continuing our discussions on the U.S.-China economic and trade relationship ahead of [President Donald Trump's] historic summit with President Xi in Washington,\" Bessent said in a post to X along with a photo of himself and He.\nHe added: \"These talks help lay the groundwork for President Trump to advance America's economic interests and deliver results for the American people.\"\nIn brief remarks to reporters before the meeting at JPMorgan Chase in New York, Bessent said he looks forward to \"focused, fulsome and constructive talks today that will set the stage\" for this week's summit between the leaders of the world's two largest national economies.\nU.S. Trade Representative Jamieson Greer is also expected to participate in the talks.\nThe meeting comes before Xi's high-stakes visit to Washington this week, his first during Trump's second term. Trump visited Beijing earlier this year amid escalating tensions between the world's largest economies.\nBessent's meeting with He also comes amid intensifying debate in Washington over the safety of artificial intelligence and national security as the U.S. and China compete for technological leadership. The Trump administration has favored voluntary and national-security-focused safeguards over broad mandatory rules for AI developers. The issue is expected to be part of discussions between Xi and Trump during the Chinese president's visit.\nTop AI executives have recently warned that the technology could quickly become out of control and poses sweeping new threats. They urged Washington to set guardrails and regulations on the industry, something Trump himself has recently derided.\nCNBC reported Friday that JPMorgan CEO Jamie Dimon and Citigroup chief Jane Fraser are expected at a state dinner during Xi's visit. OpenAI CEO Sam Altman and Nvidia chief Jensen Huang are also set to attend.\nThe summit in Washington is expected to include high-stakes economic dialogue as the U.S. and China remain locked in competition.\nIn addition to AI, the summit is likely to broach other issues such as trade and tariffs. A key part of the current U.S.-China trade truce — Washington's suspension of heightened reciprocal tariffs on Chinese imports — is scheduled to expire Nov. 10.\nThe current truce includes Chinese commitments on rare-earth exports and U.S. agricultural purchases, while the Trump administration reduced some tariffs and suspended higher reciprocal tariffs on Chinese goods.",

hing Trump himself has recently derided.\nCNBC reported Friday that JPMorgan CEO Jamie Dimon and Citigroup chief Jane Fraser are expected at a state dinner during Xi's visit. OpenAI CEO Sam Altman and Nvidia chief Jensen Huang are also set to attend.\nThe summit in Washington is expected to include high-stakes economic dialogue as the U.S. and China remain locked in competition.\nIn addition to AI, the summit is likely to broach other issues such as trade and tariffs. A key part of the current U.S.-China trade truce — Washington's suspension of heightened reciprocal tariffs on Chinese imports — is scheduled to expire Nov. 10.\nThe current truce includes Chinese commitments on rare-earth exports and U.S. agricultural purchases, while the Trump administration reduced some tariffs and suspended higher reciprocal tariffs on Chinese goods.",

    "titleJa": "Trump says triumphal arch will be military complex with drones and snipers",
    "summaryJa": "Trump said the updated plans were at the request of the US military and for national security purposes.",
    "bodyOriginal": "Trump says triumphal arch will be military complex with drones and snipers\n- Published\nUS President Donald Trump has said his proposed triumphal arch will double as a complex to store military equipment, complete with the ability to deploy snipers and drones.\nIn a Sunday morning post, Trump said he is updating the plans at the \"strong request\" of the US military and for \"national security purposes\".\nThe \"top grade\" military complex and arch will \"house, store, and have the rapid ability to use large numbers of drones, plus Snipers, on both the roof and plaza areas, and additionally have and hold large quantities of sniper ammunition in storage\", he said.\nHe did not provide details on construction plans or timing, and it's not clear if he needs further approval for the facility.\n\"There will be no facility like this anywhere in the World,\" Trump wrote on his Truth Social platform. He added that out of \"the 59 top cities and Capitals\", Washington DC is \"the only one in the world that does not have a triumphal arch\", without specifying what those cities are.\nConstruction on Trump's 250-foot arch, planned for a site across the Potomac River from Washington DC just outside the Arlington National Cemetery, was expected to begin this month.\nA rendering of the design from earlier this year includes a golden, winged Lady Liberty on the top of the arch, flanked by two gold eagles, and with the phrases \"One Nation Under God\" and \"Liberty and Justice for All\" inscribed in gold on either side of the structure. It will stand 250-feet (76m) from its base to the top of the golden lady statue.\nAt that height, the structure would dwarf the 99-foot Lincoln Memorial nearby and be half as high as the Washington Monument.\nThe Department of Defence declined to provide additional details when reached for comment.\nTrump has pursued a number of construction projects during his second term to revamp the US capital, including a gilded makeover of the Oval Office, constructing a White House ballroom estimated to cost around $400m, paving over the White House Rose Garden, and renovating the Lincoln Memorial Reflecting Pool.\nThe triumphal arch is one of the biggest projects Trump has set his sights on.",

    "title": "U.S. urges Americans to reconsider Middle East travel as Iran tensions rise",
    "titleJa": "U.S. urges Americans to reconsider Middle East travel as Iran tensions rise",
    "summaryJa": "The State Department urged Americans to reconsider Middle East travel as Houthi attacks intensify and Iran keeps the Strait of Hormuz closed.",
    "bodyOriginal": "The U.S. State Department warned Americans to reconsider traveling to the Middle East, adding that the Iran war could quickly worsen, as Tehran maintained a defiant stance over the Strait of Hormuz.\n\"This military conflict has the potential to escalate rapidly. Americans outside the Middle East should seriously reconsider travel to and through the region,\" the State Department said late Saturday in a post on X.\nAmericans currently in the Middle East should \"exercise heightened vigilance and be aware of potential flight cancellations, airspace closures, and travel disruptions,\" the statement said.\nIran-backed Houthi rebels based in Yemen said they attacked \"sensitive\" sites in the Saudi Arabian capital Riyadh with missiles and drones on Saturday. The Houthi claims came hours after flames and a large plume of smoke were seen near the city's main airport, but local authorities have not cited the cause.\nPresident Donald Trump told Fox News on Sunday that he is in \"constant communication\" with the Houthis, following the attacks on Saudi Arabia, and claimed the Iranian-backed group has agreed not to attack the United States. Trump added that he is in a \"deciding mode\" regarding the war with Iran, saying that he is determining \"whether or not to blow up their nation\" depending on how the country behaves.\nThe White House did not immediately respond to a request for confirmation.\nU.S. embassies in the region issued security alerts for American nationals in the Middle East because of heightened tensions and the potential for unforeseen escalation.\nThe warnings come in the wake of attacks by the Houthis on Saudi Arabia in recent weeks. They launched a lightning ground offensive around Bab el-Mandeb Strait — a strategically vital oil choke point at the mouth of the Red Sea — seizing Mokha and nearby islands.\nU.S. President Donald Trump's administration last week approved the potential $24.3 billion sale of nearly 50 F-35 warplanes to Saudi Arabia, seen as a major boost for the kingdom.\n'No avenue' for return to talks\nIranian parliament speaker Mohammad Bagher Ghalibaf on Sunday said in a Telegram post that the key Strait of Hormuz shipping channel between Iran and Oman would not open until all of his country's conditions are met.\nThe former secretary of Iran's Supreme National Security Council, Mohammad Bagher Zolghadr, said last month that reopening the strait would require Washington to lift its naval blockade and sanctions, withdraw U.S. military forces from the region, pay war reparations, and release frozen Iranian assets.\nThe council also called for an end to U.S. attacks on Iran's regional allies and to threats against Iran, according to media reports.\nIn a separate social media post, Iran's armed forces warned regional neighbors that aligning themselves with the U.S. would result in retaliation by Tehran.\nThe message added that the government had received information that the U.S. is preparing to resume military actions against Iran.\nMeanwhile, Mohsen Rezaei, Secretary of Iran's Supreme National Security Council, told MS NOW on Saturday that consultations with Qatari and Pakistani mediators continue and that they have communicated their negotiation conditions to the U.S.\n\"We are in contact with the Qatari mediator; they have conveyed our conditions for halting the war to Washington, and we are awaiting President Trump's response to these terms,\" Rezaei said. \"Our conditions are: An end to the war on all fronts, the release of Iran's frozen assets, and the lifting of the naval blockade.\"\nTrump said Wednesday that the country is \"hopefully\" approaching the end of its nearly seven-month war with Iran.\nBrent crude oil, the international benchmark, is up 72% since the start of 2026 as the war choked off energy supplies flowing through the Strait of Hormuz between Iran and Oman.",

bia, seen as a major boost for the kingdom.\n'No avenue' for return to talks\nIranian parliament speaker Mohammad Bagher Ghalibaf on Sunday said in a Telegram post that the key Strait of Hormuz shipping channel between Iran and Oman would not open until all of his country's conditions are met.\nThe former secretary of Iran's Supreme National Security Council, Mohammad Bagher Zolghadr, said last month that reopening the strait would require Washington to lift its naval blockade and sanctions, withdraw U.S. military forces from the region, pay war reparations, and release frozen Iranian assets.\nThe council also called for an end to U.S. attacks on Iran's regional allies and to threats against Iran, according to media reports.\nIn a separate social media post, Iran's armed forces warned regional neighbors that aligning themselves with the U.S. would result in retaliation by Tehran.\nThe message added that the government had received information that the U.S. is preparing to resume military actions against Iran.\nMeanwhile, Mohsen Rezaei, Secretary of Iran's Supreme National Security Council, told MS NOW on Saturday that consultations with Qatari and Pakistani mediators continue and that they have communicated their negotiation conditions to the U.S.\n\"We are in contact with the Qatari mediator; they have conveyed our conditions for halting the war to Washington, and we are awaiting President Trump's response to these terms,\" Rezaei said. \"Our conditions are: An end to the war on all fronts, the release of Iran's frozen assets, and the lifting of the naval blockade.\"\nTrump said Wednesday that the country is \"hopefully\" approaching the end of its nearly seven-month war with Iran.\nBrent crude oil, the international benchmark, is up 72% since the start of 2026 as the war choked off energy supplies flowing through the Strait of Hormuz between Iran and Oman.",

    "title": "Lib Dems vow to end 'computer says no' economy to boost growth",
    "titleJa": "Lib Dems vow to end 'computer says no' economy to boost growth",
    "summaryJa": "Deputy leader Daisy Cooper also proposes a Growth and Defence Partnership with the EU in a speech to her party conference.",
    "bodyOriginal": "Lib Dems vow to end 'computer says no' economy to boost growth\n- Published\nLiberal Democrat deputy leader Daisy Cooper has warned the UK's economic growth is being held back by a \"computer says no\" approach.\nShe unveiled a 30-page growth plan, external aimed at removing barriers to business as part of her speech to the Lib Dem conference in Brighton.\nCooper, who is also the party's Treasury spokesperson, said too many ideas, start-ups and research started in Britain but ended up being taken overseas.\nShe also outlined a new Growth and Defence Partnership with the EU to reverse the economic damage of Brexit, that she claimed is currently costing the UK £90bn a year in lost tax revenue.\nSpeaking on stage in Brighton, she said: \"We build brilliant start-ups, and watch too many leave to scale somewhere else. We produce world-class research, and too little of it becomes a British product.\"\n\"Britain has the potential,\" she went on. \"The system holds it back. The computer says no.\n\"This plan tears down the barriers to investment, to innovation, and to skills.\"\nCooper called for the creation of a digital one-stop-shop service for businesses and investors, combining tax, regulatory, legal, Companies House, and general business services.\nCreating this within a new Department for Growth would simplify red tape and help small and medium-sized businesses compete and grow, she said.\nCooper said a new Growth and Defence Partnership with the EU, would be the \"single biggest growth lever we could pull\" by deepening ties with Europe.\n\"It could turbo-charge our economy and start to reverse the economic damage of Brexit which is currently costing us £90bn a year in lost tax revenue,\" she said.\n\"In power, we will strike the deal on the single market, we will strike the deal on a customs union, we will strike the deal on defence.\"\nShe claimed the Lib Dems would say \"what no other party dares to say\" that Britain \"belongs at the heart of Europe, and we will take her there\".\nSpeaking to journalists after her speech, she added she believed re-joining the EU single market and customs union could be done \"within a year\".\n\"We are very clear we want to join the single market and have a customs union and we think we can get there within a year,\" she said.\nAsked whether associate partnership could be an option for the UK, following the EU offer of a potential deal for Canada, she said: \"I don't see why we need to wait - Canada is a long way away, the geography is different, it's a different relationship.\n\"We are just a few miles away from the EU, our closest, biggest trading partner, we've got that historical relationship, we think we could get into the single market and have a customs union within 12 months.\"\nBefore becoming prime minister, Andy Burnham said he would like to see the UK re-join the EU in his lifetime but he respected the result of the 2016 referendum and had no plans to \"re-run\" Brexit arguments.\nOn Friday, Chancellor John Healey met EU ministers and asked them to let the UK into its Made in Europe scheme, aimed at protecting industries from unfair Chinese competition.\nHealey also pushed for closer UK-EU partnerships on tech, defence, and manufacturing at a meeting of EU finance ministers in Dublin the same day, as Burnham held his first official meeting with Taoiseach (Irish prime minister) Micheál Martin in No 10 North.\nSeeking to differentiate the Liberal Democrats from rival parties, she said her party would avoid \"more punishing tax hikes from Labour or painful spending cuts by the Conservatives and Reform UK\".\nShe attacked Healey for his speech earlier this month, which \"contained no vision, no ideas, and absolutely no mention of Europe\".\nCooper also attacked Reform and the Conservatives for being \"locked in a race to the bottom without a single credible costing between them\".\nShe highlighted how the new Shadow Chancellor Andrew Griffith had helped to deliver and defend the Liz Truss mini-budget, which she said \"crashed the pound, it spiked your mortgage, it cost the country billions\", and Nigel Farage defended the move.\n\"But the worst could be yet to come: Farage is modelling himself on Trump,\" she said.\n\"A President who has used the presidency to enrich himself, dismantled anti-corruption safeguards and pardoned crypto criminals.\n\"We cannot allow that kind of politics to take hold in our country -- We cannot afford to allow Nigel Farage to win the keys to No 10 or let the Tories put him there.\"\nEd Davey calls for immediate 10p cut to fuel duty\n- Published1 hour ago\nDavey says Lib Dems are 'firewall against Farage' as conference begins\n- Published21 hours ago\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.",

d defend the Liz Truss mini-budget, which she said \"crashed the pound, it spiked your mortgage, it cost the country billions\", and Nigel Farage defended the move.\n\"But the worst could be yet to come: Farage is modelling himself on Trump,\" she said.\n\"A President who has used the presidency to enrich himself, dismantled anti-corruption safeguards and pardoned crypto criminals.\n\"We cannot allow that kind of politics to take hold in our country -- We cannot afford to allow Nigel Farage to win the keys to No 10 or let the Tories put him there.\"\nEd Davey calls for immediate 10p cut to fuel duty\n- Published1 hour ago\nDavey says Lib Dems are 'firewall against Farage' as conference begins\n- Published21 hours ago\nSign up for our Politics Essential newsletter to read top political analysis, gain insight from across the UK and stay up to speed with the big moments. It'll be delivered straight to your inbox every weekday.",

    "id": "it-s-awful-how-tariffs-soaring-fuel-cos-86025492",
    "title": "‘It's awful’: How tariffs, soaring fuel costs and higher interest rates are squeezing American companies",
    "titleJa": "‘It's awful’: How tariffs, soaring fuel costs and higher interest rates are squeezing American companies",
    "summaryJa": "Tariffs, fuel prices and interest rates are squeezing American companies, particularly manufacturers, auto suppliers, retailers and transportation businesses.",
    "bodyOriginal": "Fewer, pricier flights. Freight surcharges. Manufacturers hoarding inventory. Even bankruptcy.\nFor American companies large and small, the combination of tariffs imposed under President Donald Trump's trade policies, surging fuel prices from the Iran war and, now, rising interest rates is forcing executives to make tough choices.\nAllen Eden has been holding onto extra inventory for his 25-person business, the Original Saw Co. in Britt, Iowa, which makes industrial power saws for wood and metalwork, as he grapples with spiking prices for aluminum, steel and essential parts.\nOne example: A \"little bracket\" used for his saw motors more than doubled in price this summer, surging to $87 from $42, he said.\n\"It's awful,\" Eden, 56, told CNBC. \"[I'm] just trying to keep more of the stuff around because I don't know if we can get it down the road.\"\nIt's a three-way squeeze for businesses across manufacturing, transportation and retail: Tariffs are making raw materials and goods more expensive. Higher fuel prices are pushing up the cost of making and moving them. And rising rates are making it more expensive to finance the inventory and equipment businesses need to keep running.\nWhile few sectors are completely insulated from these pressures, middle-market manufacturers are caught in a particularly tight vise. Rising steel and fuel costs are forcing them to pass at least some of those expenses on through higher prices, helping feed the stubborn inflation of the past few years.\nBut to wrangle inflation, the Federal Reserve raised interest rates for the first time in three years and signaled another hike is possible this year. That makes it more expensive for businesses to finance inventory and borrow for growth at the same time that higher input costs and record prices for diesel, which is used for trucking, squeeze margins.\nPrice increases for Eden's saws, sold both to megaretailers like Home Depot and directly to small- and medium-sized manufacturers, look inevitable, the business owner said.\nThe pain isn't being evenly distributed. Smaller companies typically rely on shorter-term lending, meaning Fed hikes pass more directly into their costs, JPMorgan Chase global strategy head Dubravko Lakos-Bujas said in a Sept. 14 note.\nBut regardless of size, capital-intensive sectors like manufacturing and equipment suppliers, logistics firms including trucking fleets, and commercial real estate also suffer more in a rising-rate environment, according to Lakos-Bujas.\n\"The combination of higher rates and higher fuel prices means that sectors with heavy exposure to both are first in the line of fire,\" said Gregory Daco, chief economist at EY-Parthenon, the global consulting arm of Ernst & Young.\n\"Any type of manufacturing is going to be disproportionately exposed to higher fuel prices,\" he said.\nRising fuel and commodity costs have strained both material makers and the retailers they serve.\nMark Costa, CEO of industrial giant Eastman Chemical, said in May that the one-two punch of interest rates and inflation was forcing his industry into a corner. Eastman makes the plastics, additives, and other materials used in products as diverse as medical devices, animal feed, and car windshields.\n\"Everyone had their back against the wall and had no room to absorb these increases,\" Costa said. \"Everyone is very quickly raising prices faster than I've ever seen in 20 years.\"\nOn the retail side, unexpected pressure from energy and raw materials costs will \"fully offset\" the benefit of $730 million in tariff refunds, Home Depot CFO Richard McPhail said last month.\n\"There's just so much uncertainty right now. … You think inflation, interest rates, fuel prices,\" McPhail said last week at a conference.\nSupply chain holes\nAmong those hardest hit are manufacturers in the domestic automobile supply chain.\nLucerne International, a privately held auto parts maker based in suburban Detroit, stopped manufacturing operations in the U.S. and canceled plans last year for a $50 million aluminum forging plant in Michigan.\n\"The onset of the Trump tariffs 2.0 has just really torn holes in our global supply chains and increased costs significantly,\" Lucerne CEO Mary Buchzeiger said, citing higher costs for raw materials, including aluminum, as well as finished parts.\nBuchzeiger, whose firm still manufactures overseas, said she has shifted U.S. operations to warehousing, distribution, and tariff-mitigation solutions for other companies, which offer \"much better margins.\"\n\"There's no doubt that there's margin pressure for suppliers,\" Paul McCarthy, CEO of vehicle supplier trade association MEMA, said. \"Some of it, we try to absorb … and then some of it does have to be passed on.\"\nGrowth, as measured by earnings before interest and taxes for the top 100 auto suppliers, fell last year to 4.2%, down from more than 6% in 2021, according to consulting firm Berylls by AlixPartners. Among the top 10 automakers, that figure is 5.2%, down from nearly 8% in 2022.\nNot all auto companies have managed the additional costs. Spanish auto parts maker Grupo Antolin, which supplies components to automakers including Ford, GM, Volkswagen and Stellantis, filed for Chapter 15 bankruptcy protection in the U.S. in July. The company cited tariffs, higher raw-material and energy costs, and supply-chain disruptions as reasons for its restructuring.\nDivide in corporate America\nBetter off are the giants of the corporate world, like the tech and finance companies that fill the S&P 500. These firms typically have more cash reserves and take out long-term debt, insulating them somewhat from the sting of higher rates.\nMost larger companies can thrive until borrowing costs rise much further. The pain would hit when the yield on the 10-year Treasury bond reaches 6%, up from around 5% now, according to JPMorgan's Lakos-Bujas, who cited 80 years of data.\nBorrowing costs are expected to stay higher for longer. Persistent inflation, which forced Warsh to raise the benchmark Fed rate against Trump's wishes, along with heavy borrowing from the U.S. government, is keeping upward pressure on rates.\nAcross corporate America, companies are grappling with these shocks in different ways. The divide comes down to one question: Who has pricing power?\nSome industries have learned they can readily pass higher costs on to consumers, while others are caught in a catch-22: If they raise prices too much, they risk destroying demand.\nAirline executives last week boasted of higher fares as customers keep booking trips, especially abroad, allowing them to pass increased fuel costs on to travelers. Airlines scaled back growth plans, cutting less profitable flights even after the collapse of Spirit Airlines this year.\nFewer flights can mean pricier airline tickets, and fares were up more than 23% in August from last year, according to the latest inflation read. Yet even strong demand has its limits.\n\"The consumer has been incredibly, incredibly resilient,\" United Chief Financial Officer Mike Leskinen said Wednesday during a Morgan Stanley conference in Laguna Beach, California.\n\"But there's some marginal routes that don't make sense in a higher fuel environment. So we cut them,\" Leskinen said. \"You should see us continue to ... behave that way.\"\nMuch of corporate America remains resilient despite higher fuel and financing costs. Profit margins for major companies hover near historic highs, propelled by strong productivity gains, labor costs that have stayed in check and surging artificial intelligence investment that is driving growth.\nBut a risk of Warsh's efforts is that higher rates don't directly address the root causes of inflation: the Iran war, the Trump administration's tariffs, and the AI boom, which has driven up the prices for everything required to build and run data centers, from electricity to memory chips, copper, and land.\nRaising rates to tap the brakes on the U.S. economy could slow it down too much, or send stocks into a tailspin, said EY-Parthenon's Daco.\n\"The economy is resilient, but it's exposed to growing pockets of risk,\" he said. \"A shock could materialize faster than we all think.\"",

Persistent inflation, which forced Warsh to raise the benchmark Fed rate against Trump's wishes, along with heavy borrowing from the U.S. government, is keeping upward pressure on rates.\nAcross corporate America, companies are grappling with these shocks in different ways. The divide comes down to one question: Who has pricing power?\nSome industries have learned they can readily pass higher costs on to consumers, while others are caught in a catch-22: If they raise prices too much, they risk destroying demand.\nAirline executives last week boasted of higher fares as customers keep booking trips, especially abroad, allowing them to pass increased fuel costs on to travelers. Airlines scaled back growth plans, cutting less profitable flights even after the collapse of Spirit Airlines this year.\nFewer flights can mean pricier airline tickets, and fares were up more than 23% in August from last year, according to the latest inflation read. Yet even strong demand has its limits.\n\"The consumer has been incredibly, incredibly resilient,\" United Chief Financial Officer Mike Leskinen said Wednesday during a Morgan Stanley conference in Laguna Beach, California.\n\"But there's some marginal routes that don't make sense in a higher fuel environment. So we cut them,\" Leskinen said. \"You should see us continue to ... behave that way.\"\nMuch of corporate America remains resilient despite higher fuel and financing costs. Profit margins for major companies hover near historic highs, propelled by strong productivity gains, labor costs that have stayed in check and surging artificial intelligence investment that is driving growth.\nBut a risk of Warsh's efforts is that higher rates don't directly address the root causes of inflation: the Iran war, the Trump administration's tariffs, and the AI boom, which has driven up the prices for everything required to build and run data centers, from electricity to memory chips, copper, and land.\nRaising rates to tap the brakes on the U     "id": "williams-sonoma-s-stock-has-soared-in-a-d751bbc5",
    "title": "Williams-Sonoma's stock has soared in a sluggish housing market. Here's how it won over Wall Street",
    "titleJa": "Williams-Sonoma's stock has soared in a sluggish housing market. Here's how it won over Wall Street",
    "summaryJa": "Williams-Sonoma is outperforming the furnishings industry due to its ability to grow profitability despite a weak housing backdrop.",
    "bodyOriginal": "Williams-Sonoma is one of the top-performing retail stocks of the year, despite weakness in the housing market that has dampened sales of home goods.\nThe company's share price had climbed about 23% year to date as of Friday, outperforming the S&P 1500 Home Furnishings index as well as competitors such as Wayfair, Arhaus, Ethan Allen and RH, formerly known as Restoration Hardware.\n\"We've been working on the product, we've been working on the service and the quality, but also the storytelling,\" said Williams-Sonoma CEO Laura Alber in a late August interview on CNBC's \"Mad Money.\" \"And that is also what's attracting ... many new customers to our brands, and then bringing people back to our brands.\"\nThe traditional investing thesis around home furnishings often revolves around home sales: As people buy new homes, they also purchase new furniture. In the U.S., which accounts for 96% of Williams-Sonoma's sales, consumers face a sluggish housing market driven by high interest rates, along with rising energy and food costs.\nYet over a three-year period, Williams-Sonoma shares have climbed more than 200%.\nFixing the underlying business fundamentals has been key to the success of the company, which includes its namesake brand along with retailers such as Pottery Barn and West Elm. In 2019, the company's operating margin, which is a key measure of profitability, was 7.9%. By 2021, it reached 17.6%.\nAfter a Covid-fueled housing boom, the market slumped. Williams-Sonoma's sales fell accordingly, but it proved to investors that it could sustain profitability.\n\"They made a number of savvy moves, including reducing the amount of promotions and also optimizing their supply chain with home deliveries and, all in, they drove over 10% expansion in their EBIT [earnings before interest and taxes] margin during those tough years,\" said Peter Keith, head of consumer research at Piper Sandler.\nThose moves continue to pay off for Williams-Sonoma. Revenue was $7.81 billion in 2025, down from $8.25 billion in 2021, but its operating income was nearly the same.\nFinding growth\nWilliams-Sonoma is now focused on capturing more of the existing home furnishings market, while maintaining strong profit margins.\nOne of the ways it's been able to do that is selling its products at full price at a time when some rivals have run more promotions.\n\"When you're not running sales, it tends to spread your overall sales volume out quite evenly ... it's really also had some positive carryout effects to their supply chain and driven margin expansion there,\" Keith said.\nOn top of that, e-commerce — which is generally more profitable than brick-and-mortar — makes up more than two-thirds of Williams-Sonoma's sales. The company is also using AI to further grow that part of the business.\nOn an earnings call in November, the company said it launched an AI sales assistant nicknamed \"Olive.\" In August, it said customers who engage with it make purchases at three times the rate of customers who don't.\nWilliams-Sonoma has also used AI to reduce costs in its supply chain and deliveries, Chief Technology and Digital Officer Sameer Hassan said on the company's first-quarter earnings call in May.\nBusiness-to-business, or B2B, sales have also been a bright spot for the company. Its most recent quarter ended in August saw nearly 15% growth in the category as it expands selling in areas such as cruise ships, senior living and student housing.\nWilliams-Sonoma has said it believes its B2B business, which currently accounts for around $1 billion in annual sales, could double over the next several years.\nPottery Barn turnaround\nKeith said the company's success with products such as candles, pillows and kitchen items has helped make the company less dependent on the underlying housing fundamentals.\nStill, furniture is the bread and butter of many of its brands, and it has had to take steps to improve that piece of the business.\nFrom fiscal 2022 to 2025, Pottery Barn, which is Williams-Sonoma's biggest brand, saw revenue fall more than 15%. In its fourth-quarter fiscal 2025 earnings call in March, the company said it leaned too heavily into decor to offset furniture declines during the post-Covid housing slump.\nPottery Barn's same-store sales were up 5.1% in its most recent quarter ended in August.\n\"This is really one of the more exciting parts of Williams-Sonoma today ... this renewed growth in Pottery Barn,\" Keith said.\nHandling tariffs\nDespite its relative strength in its sector, Williams-Sonoma faces challenges. Tariffs pose a risk for the company, as over 80% of its merchandise purchases in 2025 came from foreign manufacturers.\n\"I really am looking forward to the tariff stabilizing. If they just stay in one place, it's going to be a lot easier for everybody, including our investors,\" Alber said in the August \"Mad Money\" interview.\nWilliams-Sonoma received a tariff refund of $200 million after the Supreme Court ruled in February that President Donald Trump, who imposed tariffs under the International Emergency Economic Powers Act, did not have the authority to do so.\nAlber said the company paid back vendors and that it spent $10 million to contribute $1,000 to each employee's 401(k). The total reimbursed to vendors was $47.5 million, according to the second-quarter earnings report.\nUnlike many other retailers, Williams-Sonoma decided to keep that tariff refund separate from its reported earnings figures, which Keith said highlights the company's strong underlying fundamentals.\n\"They've built a model here with multiple brands that all have growth opportunities,\" Keith said. \"They're smaller emerging brands that have significant growth opportunities all with this omnichannel approach with stores and e-commerce, which we think is a strong competitive advantage for Williams-Sonoma in a highly, highly fragmented furniture industry.\"",

2025, Pottery Barn, which is Williams-Sonoma's biggest brand, saw revenue fall more than 15%. In its fourth-quarter fiscal 2025 earnings call in March, the company said it leaned too heavily into decor to offset furniture declines during the post-Covid housing slump.\nPottery Barn's same-store sales were up 5.1% in its most recent quarter ended in August.\n\"This is really one of the more exciting parts of Williams-Sonoma today ... this renewed growth in Pottery Barn,\" Keith said.\nHandling tariffs\nDespite its relative strength in its sector, Williams-Sonoma faces challenges. Tariffs pose a risk for the company, as over 80% of its merchandise purchases in 2025 came from foreign manufacturers.\n\"I really am looking forward to the tariff stabilizing. If they just stay in one place, it's going to be a lot easier for everybody, including our investors,\" Alber said in the August \"Mad Money\" interview.\nWilliams-Sonoma received a tariff refund of $200 million after the Supreme Court ruled in February that President Donald Trump, who imposed tariffs under the International Emergency Economic Powers Act, did not have the authority to do so.\nAlber said the company paid back vendors and that it spent $10 million to contribute $1,000 to each employee's 401(k). The total reimbursed to vendors was $47.5 million, according to the second-quarter earnings report.\nUnlike many other retailers, Williams-Sonoma decided to keep that tariff refund separate from its reported earnings figures, which Keith said highlights the company's strong underlying fundamentals.\n\"They've built a model here with multiple brands that all have growth opportunities,\" Keith said. \"They're smaller emerging brands that have significant growth opportunities all with this omnichannel approach with stores and e-commerce, which we think is a strong competitive advantage for Williams-Sonoma in a highly, highly fragmented furniture industry.\"",
