    "id": "how-is-the-us-economy-really-doing-under-51a3bfaf",
    "title": "How is the US economy really doing under President Trump?",
    "titleJa": "How is the US economy really doing under President Trump?",
    "summaryJa": "Ahead of the midterms Trump has boasted about the performance of the US economy. BBC Verify looks at inflation, jobs and economic growth in the country.",
    "bodyOriginal": "How is the US economy really doing under President Trump?\n- Published\nPresident Donald Trump has been boasting about the performance of the US economy ahead of the midterm congressional elections, claiming he has boosted incomes, reduced inflation and created jobs.\nTrump has repeatedly said: \"We have the hottest country anywhere in the world.\"\nWhile the overall US economy is faring better than many expected after Trump launched his sweeping \"Liberation Day\" tariffs in 2025, there's evidence those import taxes and the impact of the US-Israel war with Iran have pushed up inflation, with the harmful effects felt by most American households.\nThe US economy is also being helped by an AI investment boom, and could falter if that spending were to dry up.\nSo how does all this feel for the average American? BBC Verify has looked at whether the evidence supports the president's claims.\n1. US economy growing\nThe overall US economy is growing at a respectable clip by the country's recent historic standards.\nThe latest data shows US GDP, external - which is how economists measure the size of the US economy - currently expanding at an annualised rate of 2.2%.\nAnd it has increased by around 3.2% overall since the end of 2024, just before Trump took office for his second term.\nThat is more growth than any other member of the G7 group of leading economies over that period.\nThe US growth rate has been faster than was forecast by the International Monetary Fund (IMF), external in the immediate wake of Trump's announcement of a swathe of new tariffs on goods coming into the US on 2 April 2025.\nIt downgraded its forecasts at the time, citing the negative impact of Trump's import duties on investment and consumer spending.\nThough it is important to note that Trump eased the tariffs considerably in the months that followed, reducing the impact that had initially been expected on the economy.\nThe US economy has also been heavily supported in recent years by American technology companies making massive investments in AI, including by constructing data centres around the country.\nSpending on building data centres, external (excluding the IT hardware to go in them) by US businesses in August 2026 was $5bn, almost double the monthly rate when Trump returned to office.\n2. Inflation picked up\nMany American voters wanted to punish Joe Biden in the 2024 presidential election, holding him responsible for the pain caused by a significant spike in prices in the wake of the pandemic.\nThe current rate of US inflation, external is 3.7%.\nThat's still well down on the recent peak rate of 9% under Biden in 2022, but higher than the 3% rate that Donald Trump inherited in January 2025.\nEconomists estimate, external US inflation would have been lower without the new tariffs imposed by Trump since he returned to office.\nWhile the impact of the Iran war on global energy prices, with the significant disruption to oil and fuel supplies from the Middle East, has also helped push up US domestic inflation.\nThe price of a gallon of diesel in the US, external - a fuel used not only by drivers but also widely in agriculture and industry - hit a record high of $6.52 in September.\nThe price of some grocery staples , externallike beef and coffee have risen since Trump returned to office, though the price of eggs has fallen.\nAnd some US retailers have warned, external that rising energy prices caused by the Iran war will make producing food more expensive and raise prices at the till.\n3. Household income growth held back\nAverage US household incomes are still rising under Trump.\nThe median income - after adjusting for inflation - rose 2.6% in 2025 to $87,460, the highest on record, external.\nHowever, the Institute on Taxation and Economic Policy (ITEP) think tank has estimated the combined effects of the following, external on US households:\n- Trump's tax cuts\n- The expiry of extra government subsidies that had made health insurance cheaper for millions of Americans\n- Higher-than-expected price rises during Trump's second term, including those linked to tariffs and the Iran war\nITEP's conclusion is that the middle fifth of households are, on average, around $1,700 worse off in 2026 than they would have been, while the poorest fifth are around $750 worse off.\nThe richest 1%, by contrast, are estimated to be an average of $12,560 better off than they woud have been, primarily because of Trump's tax cuts.\nITEP's estimates about the impact of tariffs on American households of different income levels are broadly similar to those of the Tax Foundation think tank, external.\n4. Job creation slowed down\nTrump predicted his tariffs would result in America being \"flooded with jobs\", external as manufacturing firms set up new factories on US soil to avoid their products being taxed at the border.\nSince he returned to the White House, an average of 34,000 jobs have been added to the economy each month.\nBut that is significantly down on the 122,000 jobs added each month in the final year of Biden's presidency, external.\nAnd the number of Americans employed in manufacturing, external - 12.6 million in September 2026 - is slightly lower than it was when Trump's second term began.\nHowever, the US unemployment rate remains relatively low, external at 4.2%, which is broadly where it was when Trump returned to the White House.\nPart of the reason for this is Trump's immigration crackdown and deportation programme, which has reduced the size of the available US workforce, external and means a lower number of jobs need to be created each month to stop unemployment rising.\n5. Borrowing costs rising\nUS government borrowing has increased in Trump's second term, partly driven up by his significant tax cuts.\nThe federal government deficit - the gap between its revenues from taxes and its spending - was $2 trillion in the year to September 2026, external. That's equivalent to around 6%, external of US GDP.\nAnd the US deficit is projected to rise to above 8% of GDP by 2030, external.\nThat high rate of government borrowing is itself helping to boost US GDP growth.\nThe IMF has warned that excessive US government borrowing, external, which it uses to bridge the deficit, and its rapidly rising national debt are raising the risk of a future financial crisis in America. This would have a deeply damaging impact on most American households.\nThe growing deficit is also one of the reasons the US government gets charged more to borrow money in financial markets.\nThe 10-year US government bond yield has risen sharply since Trump returned to office in January 2025 and is now above 5%, the highest rate since the global financial crisis in 2007.\nThat increase in the market cost of US government borrowing also puts upward pressure on the interest rates on mortgages available to American households.\nThe interest rate on a new 30-year US mortgage has risen to 7.4%, external per year, up from 6.9% when Trump returned to the White House.\nThat's added to problems in the US housing market, making homes less affordable for new buyers. It has left many existing owners reluctant to move because doing so would mean giving up their cheaper mortgages, which they took out at lower rates, external and cannot take with them to a new property.\nData graphics by Erwan Rivault.",

heaper for millions of Americans\n- Higher-than-expected price rises during Trump's second term, including those linked to tariffs and the Iran war\nITEP's conclusion is that the middle fifth of households are, on average, around $1,700 worse off in 2026 than they would have been, while the poorest fifth are around $750 worse off.\nThe richest 1%, by contrast, are estimated to be an average of $12,560 better off than they woud have been, primarily because of Trump's tax cuts.\nITEP's estimates about the impact of tariffs on American households of different income levels are broadly similar to those of the Tax Foundation think tank, external.\n4. Job creation slowed down\nTrump predicted his tariffs would result in America being \"flooded with jobs\", external as manufacturing firms set up new factories on US soil to avoid their products being taxed at the border.\nSince he returned to the White House, an average of 34,000 jobs have been added to the economy each month.\nBut that is significantly down on the 122,000 jobs added each month in the final year of Biden's presidency, external.\nAnd the number of Americans employed in manufacturing, external - 12.6 million in September 2026 - is slightly lower than it was when Trump's second term began.\nHowever, the US unemployment rate remains relatively low, external at 4.2%, which is broadly where it was when Trump returned to the White House.\nPart of the reason for this is Trump's immigration crackdown and deportation programme, which has reduced the size of the available US workforce, external and means a lower number of jobs need to be created each month to stop unemployment rising.\n5. Borrowing costs rising\nUS government borrowing has increased in Trump's second term, partly driven up by his significant tax cuts.\nThe federal government deficit - the gap between its revenues from taxes and its spending - was $2 trillion in the year to September 2026, external. That's equivalent to around 6%, external of US GDP.\nAnd the US deficit is projected to rise to above 8% of GDP by 2030, external.\nThat high rate of government borrowing is itself helping to boost US GDP growth.\nThe IMF has warned that excessive US government borrowing, external, which it uses to bridge the deficit, and its rapidly rising national debt are raising the risk of a future financial crisis in America. This would have a deeply damaging impact on most American households.\nThe growing deficit is also one of the reasons the US government gets charged more to borrow money in financial markets.\nThe 10-year US government bond yield has risen sharply since Trump returned to office in January 2025 and is now above 5%, the highest rate since the global financial crisis in 2007.\nThat increase in the market cost of US government borrowing also puts upward pressure on the interest rates on mortgages available to American households.\nThe interest rate on a new 30-year US mortgage has risen to 7.4%, external per year, up from 6.9% when Trump returned to the White House.\nThat's added to problems in the US housing market, making homes less affordable for new buyers. It has left many existing owners reluctant to move because doing so would mean giving up their cheaper mortgages, which they took out at lower rates, external and cannot take with them to a new property.\nData graphics by Erwan Rivault.",

    "title": "BlackRock, GIC among investors chasing Indian telecom major Jio's IPO as anchor bids top $26 billion",
    "titleJa": "BlackRock, GIC among investors chasing Indian telecom major Jio's IPO as anchor bids top $26 billion",
    "summaryJa": "Jio Platforms plans to raise up to $3.2 billion through an IPO, which is India's largest ever in rupee terms, but the second largest in dollar terms.",
    "bodyOriginal": "India's Jio Platforms has seen the anchor investor quota for its initial public offering oversubscribed more than 30 times, according to a source familiar with the matter, drawing bids from top asset managers including BlackRock, Capital Group and GIC.\nThe country's largest telecommunications and digital services company, backed by Meta and Google, plans to raise up to 302 billion rupees ($3.2 billion) through India's largest ever IPO in rupee terms.\nAccording to the source, who is not allowed to speak on the matter due to legal restrictions, the company's anchor book received total bids worth 2.5 trillion rupees ($26.3 billion) for the 81.1 billion rupee anchor book portion.\nJio Platforms, in a release on Monday, said it had finalized the allocation of 72.47 million equity shares to anchor investors at 1,119 rupees a share, at the upper range of the price band.\nThe anchor book is a portion of the total fundraise set aside for large institutional investors before the IPO opens for public bidding.\nSome other major institutional investors who have been allocated shares include India's state-owned insurance firm Life Insurance Corporation, Fidelity Investments, JPMorgan Asset Management and Abu Dhabi Investment Authority.\nThe Jio Platforms IPO will be open to the public from Wednesday through Friday. Jio Platforms, owned by Reliance Industries, has been positioning itself as a tech company and not just a traditional utility provider. The IPO price values the company at around $108 billion — lower than the valuations of over $130 billion floated a year ago.",
    "bodyJa": "India's Jio Platforms has seen the anchor investor quota for its initial public offering oversubscribed more than 30 times, according to a source familiar with the matter, drawing bids from top asset managers including BlackRock, Capital Group and GIC.\nThe country's largest telecommunications and digital services company, backed by Meta and Google, plans to raise up to 302 billion rupees ($3.2 billion) through India's largest ever IPO in rupee terms.\nAccording to the source, who is not allowed to speak on the matter due to legal restrictions, the company's anchor book received total bids worth 2.5 trillion rupees ($26.3 billion) for the 81.1 billion rupee anchor book portion.\nJio Platforms, in a release on Monday, said it had finalized the allocation of 72.47 million equity shares to anchor investors at 1,119 rupees a share, at the upper range of the price band.\nThe anchor book is a portion of the total fundraise set aside for large institutional investors before the IPO opens for public bidding.\nSome other major institutional investors who have been allocated shares include India's state-owned insurance firm Life Insurance Corporation, Fidelity Investments, JPMorgan Asset Management and Abu Dhabi Investment Authority.\nThe Jio Platforms IPO will be open to the public from Wednesday through Friday. Jio Platforms, owned by Reliance Industries, has been positioning itself as a tech company and not just a traditional utility provider. The IPO price values the company at around $108 billion — lower than the valuations of over $130 billion floated a year ago.",

    "id": "jd-vance-refrains-from-endorsing-israeli-bd61630a",
    "title": "JD Vance refrains from endorsing Israeli leader Netanyahu as Trump offers praise",
    "titleJa": "JD Vance refrains from endorsing Israeli leader Netanyahu as Trump offers praise",
    "summaryJa": "Vice President JD Vance declined to follow Trump in endorsing Netanyahu, saying he’s “not getting involved in Israeli elections” a week before Israelis vote.",
    "bodyOriginal": "U.S. Vice President JD Vance declined to endorse Israeli Prime Minister Benjamin Netanyahu, after President Donald Trump offered his backing for the leader's reelection bid next week.\n\"The president has the most effective endorsement in American or international political history,\" Vance said in an interview on Mark Halperin's 2WAY Tonight published Monday. \"I endorse American candidates, and that's where I'm focused on in the midterms,\" he said.\nVance said he was not criticizing Netanyahu: \"I'm not anti-endorsing him. I'm not pro-endorsing him,\" he said, adding that \"I'm not getting involved in Israeli elections.\"\nThose remarks diverge from the approach by President Donald Trump, who gave the Israeli prime minister his backing in the election next week.\nTrump on Sunday praised Netanyahu, the country's longest-serving prime minister, on Truth Social as \"a Great Warrior Prime Minister, and an even greater Partner for Peace in combating the Islamic Republic of Iran.\" In a social media post, Netanyahu thanked Trump for his \"tremendous support and work together.\"\nVance has weighed in on foreign politics before. He campaigned in Budapest in April to publicly endorse then-Prime Minister Viktor Orban's reelection bid. Orban was later voted out after 16 years in power. Last year in Munich for a security conference, Vance met Alice Weidel, the leader of Germany's far-right Alternative for Germany party, which Elon Musk was also boosting at the time.\nThe Israeli vote next week will be the first national election since Hamas attacked Israel in late 2023.\nThe comments also come as U.S. public support for Israel, historically strong among both Republicans and Democrats, has fallen sharply. There has also been vigorous debate in America about the Netanyahu-led government's response to the Hamas attack.\nIn June, Vance said that Israel has almost no friends left in the world and should think hard before turning on the one it has.",
    "bodyJa": "U.S. Vice President JD Vance declined to endorse Israeli Prime Minister Benjamin Netanyahu, after President Donald Trump offered his backing for the leader's reelection bid next week.\n\"The president has the most effective endorsement in American or international political history,\" Vance said in an interview on Mark Halperin's 2WAY Tonight published Monday. \"I endorse American candidates, and that's where I'm focused on in the midterms,\" he said.\nVance said he was not criticizing Netanyahu: \"I'm not anti-endorsing him. I'm not pro-endorsing him,\" he said, adding that \"I'm not getting involved in Israeli elections.\"\nThose remarks diverge from the approach by President Donald Trump, who gave the Israeli prime minister his backing in the election next week.\nTrump on Sunday praised Netanyahu, the country's longest-serving prime minister, on Truth Social as \"a Great Warrior Prime Minister, and an even greater Partner for Peace in combating the Islamic Republic of Iran.\" In a social media post, Netanyahu thanked Trump for his \"tremendous support and work together.\"\nVance has weighed in on foreign politics before. He campaigned in Budapest in April to publicly endorse then-Prime Minister Viktor Orban's reelection bid. Orban was later voted out after 16 years in power. Last year in Munich for a security conference, Vance met Alice Weidel, the leader of Germany's far-right Alternative for Germany party, which Elon Musk was also boosting at the time.\nThe Israeli vote next week will be the first national election since Hamas attacked Israel in late 2023.\nThe comments also come as U.S. public support for Israel, historically strong among both Republicans and Democrats, has fallen sharply. There has also been vigorous debate in America about the Netanyahu-led government's response to the Hamas attack.\nIn June, Vance said that Israel has almost no friends left in the world and should think hard before turning on the one it has.",

    "id": "i-m-fed-up-of-swiping-why-singles-now-w-53c1b527",
    "title": "'I'm fed up of swiping': Why singles now want to meet IRL",
    "titleJa": "'I'm fed up of swiping': Why singles now want to meet IRL",
    "summaryJa": "The BBC hears from people who think dating events are better value for money than dating apps.",
    "bodyOriginal": "'I'm fed up of swiping': Why singles now want to meet IRL\n- Published\nChecking in at a dating event in a bar in Guildford, Olivia Miller-Davis is understandably apprehensive.\nEven bringing a friend with her doesn't remove the awkwardness at the start of the night.\n\"It's always nerve-wracking when you're meeting new people,\" the 28-year-old admits before downloading an app that will match her to other daters based on their star signs.\nThis is speed dating 2026-style and Olivia, like many people we speak to, is here because she's fed up of \"endlessly swiping\" or as some describe it \"app fatigue\".\nShe says she hates judging people with \"really limited information and just a couple of pictures\" because she doesn't feel she can \"really fully commit\" with so little to go on.\nAccording to a recent study from online regulator Ofcom 11% of adults use dating sites but it suggests the time we spend on them is dropping, from a peak of almost four hours a month in 2023, down to three hours last year.\nOlivia's first match on the night is Edward and he agrees that recent dating trends leave him feeling cold.\n\"I'm fed up with apps,\" he says.\n\"I mean, they're designed so that you don't find 'the one', because they want you to come back and use the app forever. They don't want you to get married from the app.\"\nThe event is organised by Love at First Sign, a dating company that uses an app to match people based on astrological connection, but most people are just using it as an icebreaker.\nDirector of events Lissy Cleminson says the way people date is changing and a big factor is more home working since Covid, which means people do not meet in offices or on the commute.\n\"The little meet-cutes don't happen so much when you're at home with your shirt up top and your pyjamas down bottom,\" she jokes.\nAs you may expect at a dating event many of the singles told us they were keen for that in-real-life or IRL experience.\nThere are a lot of #SingleTok and #Singlelife accounts on TikTok and Instagram reviewing dating events.\n'Everyone's ready to mingle'\nCandice Gallagher runs an account called @Candilicious and recently went to 10 different dating events in 10 weeks.\nShe describes herself as an entrepreneur and thinks in business terms dating events deliver \"much greater return on investment\".\nThe 40-year-old says all too often dating online can lead to \"chat graveyards\" with very limited conversation.\n\"At a dating event, everyone is single, everyone's ready to mingle, and your chances of having a good conversation are much greater.\"\nMany people at the event in Guildford agreed dating events were better value for money because \"you get to meet a range of people\" in person for a similar cost to one date from an app.\nThese events typically cost around £15 to £30 and often include a drink and activity or icebreaking gimmick, in this case an app that is used throughout the night.\nThe money factor\nOlivia believes money plays a big factor in dating.\n\"I wasn't working for a bit because I changed careers and because of that I put dating on hold.\"\nOlivia remembers thinking it \"couldn't be a priority\" and feeling she needed to wait until she was \"earning enough\" before dating again.\nShe is not alone in finding dating expensive.\nMore than a quarter of daters surveyed by Barclays suggested rising costs had changed how they date.\nAnd a couple of recent studies suggest the monthly cost of dating - from apps to entertainment and clothes - can add up to around £130.\nThose running apps are quick to point out online is still a big part in the way people meet.\nNew research from Match Group, which owns Tinder and Hinge, suggests that out of those who had ever had a romantic relationship, about 21% of baby boomers surveyed met their most recent partner at a pub, bar or club.\nAmong Gen Z, it was just 4%.\nThe survey of 3,007 single people also suggests that of those who had ever had a relationship, 20% met their most recent partner on a dating app and 20% met through friends.\nChine Mmegwa, head of strategy, corporate development and operations at Match Group, said Tinder has made tweaks to its service in the past year to win back younger daters.\nAs well as helping users find out more about each other in advance of dates, through interactive music and astrology features, it has introduced \"double date mode\" for friends who want to date together.\nAnd she said Tinder is doing more to encourage people to connect IRL. \"They want to be in person. You've seen us launch events across the US and now the UK. We are bringing IRL experiences into the app.\n\"What we're doing is putting IRL into our experience. And so we are bringing that gap to what they're looking for in person, using the apps.\"\nIn Guildford, Olivia says her night was a success because she met some men she might want to go on a first date with.\nWhen pushed by the BBC on whether she thought she had met \"the one\", she laughs and becomes understandably guarded.\n\"No, I'm not going to name anyone specific. But you'll be invited to the wedding if there is one!\"\nRelated topics\n- Published9 October",

    "title": "Burnham vows end to 'rip-off parking charges' under new rules",
    "titleJa": "Burnham vows end to 'rip-off parking charges' under new rules",
    "summaryJa": "Penalties are seen as too harsh on motorists who are penalised for parking on private land.",
    "bodyOriginal": "Burnham vows end to 'rip-off parking charges' under new rules\n- Published\nDrivers will be given the right to challenge \"rip off\" private parking charges and more grace when using private providers under new rules set out by Andy Burnham.\nThe Prime Minister announced the changes after drivers repeatedly raised concerns penalties issued by private providers were too harsh and left motorists unfairly penalised.\nIn one case, a woman was taken to court in a £1,906 claim after taking longer than five minutes to pay at a car park in Derby. The charge was eventually dropped.\nPrivate car parks already have an industry code of practice, but the RAC motoring group said the government's changes would protect drivers from the \"poor practices of some private parking companies\".\nBurnham, the prime minister, said: \"Being a few minutes late back to your car or typing one digit of your numberplate wrong shouldn't end with a hefty fine landing on your doormat.\n\"These charges leave people feeling ripped off and out of pocket, so I'm putting a stop to them.\"\nThe new rules will give drivers:\na guaranteed 5 minute period to decide whether to park\nA 10 minute window to leave without facing a penalty\nCancellation of charges for issues drivers can't control, like vehicle breakdowns in car parks\nCancellation of charges for honest mistakes such as stopping to check directions, as well as for medical emergencies or broken ticket machines\nMaximum charges of £20 on appeal for slip-ups like forgetting a parking permit, entering the wrong vehicle registration, or forgetting to confirm the registration in the machine when parking\nA freeze on the maximum parking charge at £100, which is the same limit as the current private parking Code of Practice\nOperators who do not comply risk losing access to DVLA data, making it far more difficult to pursue the car's owner even if they do issue a charge.\nPrivate car parks are different to council-owned car parks and streets. RAC analysis of government data showed a record 17 million private parking tickets were issued in 2025/2026 - a 17% increase from a year earlier.\nWith each charge worth up to £100, the data, analysed by the Press Association and the RAC Foundation, suggests drivers could collectively face private parking charges worth more than £4.6m each day.\nThe yellow and black envelope of a Penalty Charge Notice, or PCN, is a dreaded sight for motorists returning to their car.\nThe AA has warned some drivers pay up even if they have done nothing wrong, just to avoid the hassle. It said people felt they would not get a fair hearing if they appealed fines, with many saying they feared legal action.\nThe current private parking industry Code of Practice, created by the British Parking Association and the International Parking Community, was introduced in 2024.\nBut the culture of motorists feeling they have been harshly penalised has spurred the government to present a formalised code to Parliament.\nThe British Parking Association told the BBC it welcomed the changes, but said \"many of the principles within the new framework are already reflected in the existing voluntary Code of Practice\".\nThe new Code will apply in England, Scotland and Wales after motorists said they wanted independent oversight of the private parking industry.\nJack Cousens, head of roads policy at the AA, said drivers \"finally have something which could offer them better protections against the worst private parking operators\". He said in the past they have \"aggressively attacked drivers to the point where many simply pay up\".\nBut the RAC's head of policy Simon Williams said it wasn't the leap his firm had been campaigning for. He called for the banning of debt recovery fees being added on top of PCNs and said the current industry-run appeals bodies should be replaced by a single independent one.\nThe government said it will be consulting on the issue of debt recovery fees, as well as other recommendation from the Competition and Markets Authority.\nGet in touch\nHave you been affected by the issues raised in this story?\n- Published12 February 2025\n- Published3 days ago",

endation from the Competition and Markets Authority.\nGet in touch\nHave you been affected by the issues raised in this story?\n- Published12 February 2025\n- Published3 days ago",

    "id": "ex-openai-worker-accused-of-planting-dev-fa12b3b5",
    "title": "Ex-OpenAI worker accused of planting device had Saudi support, says court filing",
    "titleJa": "Ex-OpenAI worker accused of planting device had Saudi support, says court filing",
    "summaryJa": "Ex-OpenAI worker accused of planting device had Saudi support, says court filing- Published",
    "bodyOriginal": "Ex-OpenAI worker accused of planting device had Saudi support, says court filing\n- Published\nA Saudi national charged with secretly planting a recording device in one of OpenAI's meeting rooms has been accused of having \"considerable support\" from the Saudi government, according to a court filing, external in California.\nUS prosecutors claimed Abdulrahman Alfozan, who worked for the AI firm, was in \"frequent communication... with a member of the Saudi royal family\", and say a member of the country's military paid for a one-way flight to Saudi Arabia for his wife and son after his arrest.\nThe 35-year-old engineer was on Monday deemed a flight risk and denied bail, pending trial.\nThe Saudi government did not immediately respond to BBC requests for comment.\nAlfozan had worked at OpenAI for around a year before he allegedly made his attempt to plant an audio recorder.\nThe AI company discovered the device, which was plugged into the back of a TV in a conference meeting room and covered up with toilet paper, on 30 September.\nA camera was placed in the room and on 5 October, Alfozan was filmed entering and appearing to look behind the television where the audio recorder had been inserted.\nHe was arrested by the FBI on 9 October and his contract with OpenAI was terminated.\nThe court filing claimed the suspect's alleged conduct could pose \"a danger to the national security of the United States\", because executives from the tech firm met with government officials in the room during the days the device was believed to have been installed.\nIt said Alfozan's arrest came three days before he was scheduled to fly from San Francisco to Riyadh on a one-way itinerary with his wife and son.\nFollowing the arrest, the document claims the defendant's wife told FBI agents who interviewed her that \"her US visa was expiring\" and so she and her son were \"permanently moving back to Saudi Arabia\", and her husband intended to do the same.\nOn 10 October, the day after Alfozan was arrested, his wife and son flew from San Francisco to Doha, Qatar. They travelled on a one-way business class ticket booked and paid for by a Saudi military official.\n\"Ultimately, the defendant has little incentive to remain in the United States to see this case through,\" the prosecutors argued.\nUS district judge Alex Tse on Monday denied Alfozan's attorneys request for his release on bail, saying \"there is a risk of non-appearance that is significant\".\nThe FBI investigation is ongoing.\nAlfozan was scheduled to appear in federal court in San Francisco later on Monday. If convicted, he faces a maximum penalty of five years in prison and a $250,000 (£188,000) fine.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",
    "bodyJa": "Ex-OpenAI worker accused of planting device had Saudi support, says court filing\n- Published\nA Saudi national charged with secretly planting a recording device in one of OpenAI's meeting rooms has been accused of having \"considerable support\" from the Saudi government, according to a court filing, external in California.\nUS prosecutors claimed Abdulrahman Alfozan, who worked for the AI firm, was in \"frequent communication... with a member of the Saudi royal family\", and say a member of the country's military paid for a one-way flight to Saudi Arabia for his wife and son after his arrest.\nThe 35-year-old engineer was on Monday deemed a flight risk and denied bail, pending trial.\nThe Saudi government did not immediately respond to BBC requests for comment.\nAlfozan had worked at OpenAI for around a year before he allegedly made his attempt to plant an audio recorder.\nThe AI company discovered the device, which was plugged into the back of a TV in a conference meeting room and covered up with toilet paper, on 30 September.\nA camera was placed in the room and on 5 October, Alfozan was filmed entering and appearing to look behind the television where the audio recorder had been inserted.\nHe was arrested by the FBI on 9 October and his contract with OpenAI was terminated.\nThe court filing claimed the suspect's alleged conduct could pose \"a danger to the national security of the United States\", because executives from the tech firm met with government officials in the room during the days the device was believed to have been installed.\nIt said Alfozan's arrest came three days before he was scheduled to fly from San Francisco to Riyadh on a one-way itinerary with his wife and son.\nFollowing the arrest, the document claims the defendant's wife told FBI agents who interviewed her that \"her US visa was expiring\" and so she and her son were \"permanently moving back to Saudi Arabia\", and her husband intended to do the same.\nOn 10 October, the day after Alfozan was arrested, his wife and son flew from San Francisco to Doha, Qatar. They travelled on a one-way business class ticket booked and paid for by a Saudi military official.\n\"Ultimately, the defendant has little incentive to remain in the United States to see this case through,\" the prosecutors argued.\nUS district judge Alex Tse on Monday denied Alfozan's attorneys request for his release on bail, saying \"there is a risk of non-appearance that is significant\".\nThe FBI investigation is ongoing.\nAlfozan was scheduled to appear in federal court in San Francisco later on Monday. If convicted, he faces a maximum penalty of five years in prison and a $250,000 (£188,000) fine.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

    "title": "US bans DeepSeek AI from government use as tech tension with China continues",
    "titleJa": "US bans DeepSeek AI from government use as tech tension with China continues",
    "summaryJa": "DeepSeek is a powerful, popular and relatively inexpensive artificial intelligence model out of China.",
    "bodyOriginal": "US bans DeepSeek AI from government use as tech tension with China continues\n- Published\nThe US has ordered all artificial intelligence (AI) technology from the Chinese firm DeepSeek to be removed from most government systems.\nThe Department of Homeland Security (DHS) has banned all use of DeepSeek within civilian government agencies, and any technology built with the aid of its AI models.\nAs a powerful AI model that is open source - meaning it is free to access and less expensive to use - DeepSeek has been seen as a disruptive force in the ongoing AI technology race.\nWhile the DHS notice did not detail the exact security concerns surrounding DeepSeek, the White House has this year criticised AI firms from China.\nThe DHS, DeepSeek, and the Chinese embassy in Washington DC have been contacted for comment.\nThe DHS made the order public on Monday, but the ban took effect from the end of July.\nThe order is specific to civilian agencies, including the Department of the Treasury, the Department of State and the Department of Justice. However, agencies within the Department of Defense are excluded.\nThe ban follows criticism of Chinese AI from the Trump administration, and from American firms.\nWhite House tech lead Michael Kratsios wrote earlier this year in an internal memo that \"malicious exploitation\" of American AI firms had been occurring, mainly by rival firms in China.\nAnthropic and OpenAI, both of which are poised to list on the public stock market in the coming months, have also claimed to have had their AI models essentially copied by some Chinese AI firms, including DeepSeek.\nUS president Donald Trump has made clear that he sees China as the key US rival when it comes to development of AI, something he sees as crucial to the future of the country.\nDeepSeek has grown in popularity since its initial public release in 2025, with models being in such demand that the company's servers have gone down at times.\nWhile DeepSeek's free chatbot app is one of the most downloaded apps in the Apple App Store rankings, its AI models are also used by US tech companies. Companies like Snowflake, Vercel and OpenRouter all incorporate DeepSeek in their offerings to customers.\nStartups have flocked to open source models like DeepSeek.\nFor a technology or AI developer, using DeepSeek in their work costs a fraction of what a closed model like Google's Google's Gemini, Anthropic's Claude or OpenAI's Codex would.\nSimilarly, the expense borne by DeepSeek to develop its models has been astronomically less than what it has cost US AI firms to develop their own.\nLast year, DeepSeek said it took about $6m (£4.5m) to train the debut version of its model, while the costs associated with OpenAI's GPT-4 were roughly $100m. Such revelations sent tech stocks tumbling.\nThe most recent version of DeepSeek was released last week. Users of the model have praised it online, saying it beats even the most advanced AI tools out of OpenAI on common tasks for AI tools like computer software coding.\n- Published23 September\n- Published17 September",
    "bodyJa": "US bans DeepSeek AI from government use as tech tension with China continues\n- Published\nThe US has ordered all artificial intelligence (AI) technology from the Chinese firm DeepSeek to be removed from most government systems.\nThe Department of Homeland Security (DHS) has banned all use of DeepSeek within civilian government agencies, and any technology built with the aid of its AI models.\nAs a powerful AI model that is open source - meaning it is free to access and less expensive to use - DeepSeek has been seen as a disruptive force in the ongoing AI technology race.\nWhile the DHS notice did not detail the exact security concerns surrounding DeepSeek, the White House has this year criticised AI firms from China.\nThe DHS, DeepSeek, and the Chinese embassy in Washington DC have been contacted for comment.\nThe DHS made the order public on Monday, but the ban took effect from the end of July.\nThe order is specific to civilian agencies, including the Department of the Treasury, the Department of State and the Department of Justice. However, agencies within the Department of Defense are excluded.\nThe ban follows criticism of Chinese AI from the Trump administration, and from American firms.\nWhite House tech lead Michael Kratsios wrote earlier this year in an internal memo that \"malicious exploitation\" of American AI firms had been occurring, mainly by rival firms in China.\nAnthropic and OpenAI, both of which are poised to list on the public stock market in the coming months, have also claimed to have had their AI models essentially copied by some Chinese AI firms, including DeepSeek.\nUS president Donald Trump has made clear that he sees China as the key US rival when it comes to development of AI, something he sees as crucial to the future of the country.\nDeepSeek has grown in popularity since its initial public release in 2025, with models being in such demand that the company's servers have gone down at times.\nWhile DeepSeek's free chatbot app is one of the most downloaded apps in the Apple App Store rankings, its AI models are also used by US tech companies. Companies like Snowflake, Vercel and OpenRouter all incorporate DeepSeek in their offerings to customers.\nStartups have flocked to open source models like DeepSeek.\nFor a technology or AI developer, using DeepSeek in their work costs a fraction of what a closed model like Google's Google's Gemini, Anthropic's Claude or OpenAI's Codex would.\nSimilarly, the expense borne by DeepSeek to develop its models has been astronomically less than what it has cost US AI firms to develop their own.\nLast year, DeepSeek said it took about $6m (£4.5m) to train the debut version of its model, while the costs associated with OpenAI's GPT-4 were roughly $100m. Such revelations sent tech stocks tumbling.\nThe most recent version of DeepSeek was released last week. Users of the model have praised it online, saying it beats even the most advanced AI tools out of OpenAI on common tasks for AI tools like computer software coding.\n- Published23 September\n- Published17 September",

    "titleJa": "Vinted blocks French looters listing stolen goods for sale",
    "summaryJa": "The platform said since the weekend it had \"taken immediate action to idenitify and remove listings linked to looting\".",
    "bodyOriginal": "Vinted blocks French looters listing stolen goods for sale\n- Published\nVinted says it has removed listings of items believed to have been looted from shops during the ongoing riots in France.\nThe second hand re-selling platform said following the weekend's disorder it had \"taken immediate action to identify and remove listings linked to looting\".\nShops across several French cities were broken into and ransacked during the outbreak of riots over the weekend.\n\"The sale of stolen goods, or soliciting them, is strictly prohibited on Vinted, and we have zero tolerance for it,\" a spokesperson for the company said.\nWidespread looting was reported across Paris, Marseille and Lille, as well as other areas after protests against the cost of living and public spending turned into riots, leading to the arrests of at least 1,200 people.\nMore than 2,000 businesses were directly impacted by the weekend's violence, according to the head of the Chambers of Commerce and Industry (CCI).\nAlain Di Crescenzo told France's broadcaster RTL that the riots led to hundreds of millions of euros worth of damage.\nGroups of rioters, some wearing masks and balaclavas, were seen setting fire to cars and buildings as well as looting businesses.\nThose that stole goods now appear to be looking to sell them on fast.\n\"Since this weekend, our teams have taken immediate action to identify and remove listings linked to the looting, and we have stepped up monitoring of suspicious listings,\" Vinted told the BBC.\n\"When our rules are breached, we act against the accounts involved, up to permanent bans.\"\nThe company said it was working with French authorities and the police, and was adapting its \"processes to detect and counter emerging risks and malicious behaviour\".\neBay has not noted any increase in listings linked to the looting in France, but said it works with law enforcement to investigate suspected stolen goods and takes appropriate action, including removing listings and taking action against sellers, when authorities confirm an item is stolen.\nReuters news agency reported luxury shops and boutiques were shuttered and surrounded by security guards at the Place Vendome in Paris.\nBut it said a host of stores in the French capital, including Dior, Rolex, Louis Vuitton and Ralph Lauren had their shopfronts damaged\nIn Marseille, football club Olympique de Marseille said its official store on the city's historic main avenue had been looted.\nIt has closed the store, along with fellow Ligue 1 club Lille, which said its club shop would remain closed until further notice.",

ngs and taking action against sellers, when authorities confirm an item is stolen.\nReuters news agency reported luxury shops and boutiques were shuttered and surrounded by security guards at the Place Vendome in Paris.\nBut it said a host of stores in the French capital, including Dior, Rolex, Louis Vuitton and Ralph Lauren had their shopfronts damaged\nIn Marseille, football club Olympique de Marseille said its official store on the city's historic main avenue had been looted.\nIt has closed the store, along with fellow Ligue 1 club Lille, which said its club shop would remain closed until further notice.",

    "summaryJa": "Footage emerged on social media of hundreds of people gathered in east London to watch a bike joust.",
    "bodyOriginal": "Bikes 'not for jousting,' says Lime after duel video\n- Published\nE-bike rental company Lime has said its bikes are \"not for jousting\" after footage of two riders dressed as knights charging at each other in an east London park circulated over the weekend.\nHundreds of people congregated in London Fields, Hackney, to watch artist Jack Carden and actor Camtholomew the First joust, while riding the bright green rentable e-bikes.\nThe videos on social media showed them dressed as knights in armour, complete with chainmail and lances, attempting to knock each other off the bikes.\nA spokesperson for the company said: \"While we appreciate the medieval spirit, safety must always come first.\"\nAhead of the event, Carden said the \"free public joust\" was \"performance art\" in a post on social media.\nA video on his Instagram account of the event has been watched more than four million times.\nDespite their popularity, hospitals have reported an increase in injuries to both e-bike riders and pedestrians.\nA spokesperson for Lime said on Monday: \"We always love seeing Londoners come together and build a sense of community in unexpected ways.\n\"While we appreciate the medieval spirit, safety must always come first.\n\"Lime bikes are designed for getting around the city, not for jousting.\n\"We discourage anyone from attempting similar events, to help keep riders and those around them safe.\"\nListen to the best of BBC Radio London on Sounds and follow BBC London on Facebook, external, X, external and Instagram, external. Send your story ideas to hello.bbclondon@bbc.co.uk, external\nMore stories on this\n- Published1 day ago\n- Published9 September\n- Published2 October",

    "title": "Robot factories and hypersonic missiles: JPMorgan Chase's first $5 billion of defense investments",
    "titleJa": "Robot factories and hypersonic missiles: JPMorgan Chase's first $5 billion of defense investments",
    "summaryJa": "With $5 billion already deployed off its balance sheet, JPMorgan Chase is racing ahead on direct investments in defense tech, hardware and supply chains.",
    "bodyOriginal": "JPMorgan Chase has made $5 billion in startup investments in the first year of its U.S. security and resiliency initiative, the company said Monday, a faster-than-expected pace that indicates the bank is finding plentiful opportunities in emerging defense, manufacturing and supply chain firms.\nThe bank, which last year said it would deploy $10 billion into startups over a decade, may expand the program beyond that initial dollar amount, JPMorgan co-President Doug Petno told CNBC in an interview.\nTodd Combs, the former Berkshire Hathaway executive who leads the JPMorgan group in charge of making startup investments, has \"hit the ground running,\" Petno said. \"He's done a great job and put us in some really interesting companies,\" he added.\nMost of those investments have yet to be disclosed, but two known stakes seem emblematic of the project's mission to bolster companies that are needed for a more dangerous and chaotic era of geopolitics. JPMorgan, the biggest U.S. bank by assets, has taken direct stakes in defense-related startups Hadrian and Castelion.\nWars in Ukraine and the Middle East, as well as trade disputes with China, have threatened the flow of energy and key components needed for U.S. industries and defense, which spurred JPMorgan CEO Jamie Dimon into creating the initiative a year ago.\nHe put Petno, widely seen as one of two key possible successors, in charge of the overall investment project. Combs, a former board member of the bank, reports directly to Dimon.\nThe scope of the project extends beyond supply chain, defense and manufacturing to include frontier technologies and the pharmaceutical and health-tech industries.\n\"There's a lot of really interesting companies that have been working to solve some of these problems,\" Petno said.\nThese \"early venture-stage, advanced manufacturing companies have found ways to build these capabilities in the U.S.\" rather than relying on overseas trading partners, he said.\nIn August, the bank helped lead a $1.4 billion funding round for Hadrian, which builds automated factories that make parts for the defense, aerospace and maritime sectors. A California factory run by Hadrian has 10 robots for every human employee, according to the startup's founder.\nThat month, JPMorgan was also involved in a $1 billion funding round for Castelion, whose flagship product is a relatively low-cost hypersonic missile called Blackbeard. Castelion was founded in late 2022 by a group of former SpaceX engineers.\n\"Our approach is to find generational companies and partner with them for the long term,\" Combs said in a statement Monday.\n\"Putting more than $5 billion to work in our first year shows how many exceptional businesses are building in industries that strengthen critical supply chains,\" Combs said.\nRisky business?\nJPMorgan making billions of dollars of direct investments in nascent companies is a departure from its usual role as a lender and advisor.\nBefore the defense initiative, the bank had moved away from taking startup stakes, which can be relatively risky bets on unproven technologies. JPMorgan spun off its private equity business, One Equity Partners, more than a decade ago.\nIn its more traditional role, JPMorgan has also financed and facilitated more than $230 billion for industries that support American national interests, according to the bank.\nThat part of its security and resiliency project, meant to hit $1.5 trillion over 10 years, is led by Jay Horine, a former co-head of investment banking.\nJPMorgan built a team for the project of about three dozen bankers, who are aided by hundreds more across the firm, as it expanded the initiative to Europe and Canada.\nIts bankers are mapping distribution lines for key products, from submarines and missiles to aircraft, to identify suppliers that may lack the capital or capacity to meet rising demand, according to Petno.\nJPMorgan is also in regular communication with the U.S. Department of Defense and Department of Commerce about the government's needs, he said.",

    "title": "Bereaved families could face 'unjust' tax bill after civil service pension delays",
    "titleJa": "Bereaved families could face 'unjust' tax bill after civil service pension delays",
    "summaryJa": "The chairman of Parliament's Public Accounts Committee says families should not be taxed through no fault of their own.",
    "bodyOriginal": "Bereaved families could face 'unjust' tax bill after civil service pension delays\n- Published\nBereaved families affected by severe delays paying out civil service pensions could face an \"unjust\" tax bill, the government has been warned.\nUnder HMRC rules, certain lump sum pension payments must be paid within two years of the pension scheme being notified of a death to remain tax-free.\nConservative MP Sir Geoffrey Clifton-Brown, who chairs Parliament's Public Accounts Committee, said it was \"unconscionable\" some families could face a \"death tax\" through no fault of their own.\nThe Cabinet Office said that if delays caused a tax charge there were existing avenues to claim compensation, such as the Pensions Ombudsman.\nHowever, the ombudsman is currently advising that standard complaints are only likely to be resolved within 18 months, with more complex cases facing a longer wait.\nThe Civil Service Pension scheme manages the pensions of 1.7 million public sector workers in the UK.\nOutsourcing firm Capita took over the administration of the scheme from a company called MyCSP in December 2025, saying it inherited a backlog of more than 86,000 cases.\nDespite a two-year transition period to prepare for the takeover, problems have persisted and by February the backlog had grown to 120,000 cases.\nRetired civil servants and bereaved families have been left waiting months for pension payments, with some struggling to pay bills.\nCivil service pension backlog 'overwhelmed' Capita, boss says\n- Published12 February\nEmergency loans offered to civil servants waiting on pensions\n- Published29 January\nRetired civil servants left in pension limbo\n- Published23 January\nAccording to the latest figures up to 30 September, external, 1,643 outstanding cases of bereavement or death in service are more than 100 days old.\nOf these, only 301 are in scope to be paid within 15 days.\nThe PCS union, which represents civil servants, said that while not all these cases would ultimately be affected by the two-year tax rule, there were \"serious questions\" over how long they would remain unresolved.\nIf someone dies before the age of 75, a pension lump sum death benefit is only tax-free if it is paid within two years of the pension scheme first becoming aware of the death, and if the value is below the deceased's Lump Sum and Death Benefit Allowance.\nThe payment would be taxed at the same rate as the beneficiary's income tax rate.\nSir Geoffrey has written to Cabinet Office Minister Louise Haigh to urge the government to confirm the bereaved families affected will not face this \"unjust financial penalty\".\nHis letter came after BBC Radio 4's Money Box Live highlighted the potential tax liability.\nSir Geoffrey said \"the chaos currently engulfing the Civil Service Pension Scheme means that the likelihood of death benefit payments being made within two years is slim\".\nHe warned \"a significant number\" of family members \"will be watching the clock quickly tick down to a year, as the maladministration of the scheme enters its tenth month\".\nHe added: \"This is an additional stress they should not have to bear.\"\nMoney Box Live: Capita, What Went Wrong?\nMoney Box Live looks at what is going on with Capita, which administers millions of people's pensions\nRob Wassell, 58, has been waiting almost two years for the lump sum from his brother's civil service pension, following his death.\nOn 22 October it will be two years since the pension scheme was notified of his death so if he does not receive the payment in just a few days times, it could face being taxed.\nRob, who contacted the BBC's Money Box programme about his case, said he had been phoning Capita with increasing \"desperation\" as his situation dragged on.\n\"It's a bitter pill to swallow to have to pay tax for something which was not my fault,\" he said.\n\"It creates unnecessary worry and anguish through the process, which is already in itself difficult.\"\nRob said he needed the money to cover the estate costs he had to pay for his brother and fill a £20,000 hole in his savings.\nHowever, he said it was \"heartbreaking\" to hear of other cases where people needed the money just to survive.\nRob added that the idea that he might face \"another battle\" to recoup the tax through compensation made it feel like \"you just want to give up\".\nFran Heathcote, head of the PCS union, said it would be \"a profound injustice\" if families faced a further financial penalty because of Capita's failures.\n\"If that does happen, the government should be ashamed that families are being made to pay the price for failures that are entirely outside their control,\" she said.\nA spokesperson for the Cabinet Office, which has overall responsibility for the Civil Service Pension Scheme, said: \"The service levels following the move to Capita have been completely unacceptable and we are committed to ensuring no member is left financially worse off.\n\"We are continuing to hold Capita to account, including holding back nearly £10m in payments, and are doing everything in our power to ensure that individuals do not experience delays.\n\"If delays cause a tax charge, existing avenues for complaints can provide financial redress or compensation to cover losses.\"\nA Capita spokesperson said: \"We are deeply sorry for the frustration that the administration of the Civil Service Pension Scheme has caused members and their families.\n\"Our teams are working tirelessly to resolve outstanding cases as quickly as possible, with particular focus on people who have been waiting the longest and those facing financial hardship or challenging personal circumstances.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "titleJa": "Elon Musk says he'll give a SpaceX share to every child in America next year",
    "summaryJa": "The SpaceX boss said Monday that he'll give one of his company shares to every child in the U.S. next year. He didn't say how the share giveaway would happen.",
    "bodyOriginal": "SpaceX CEO Elon Musk said Monday that he'll give every child in the U.S. one of his shares in the company next year.\nMusk currently owns about 4.8 billion SpaceX shares, according to an August SEC filing. That figure rises to 6.4 billion when taking into account unvested awards and stock options, representing a 48.4% beneficial stake in the company.\nThere were 72 million children under 18 in the U.S. as of July 1, 2025, according to official census data.\nThat would amount to the CEO giving away about $10.5 billion worth of shares, taking into account SpaceX's closing stock price of $146.03 as of Friday.\n\"This will be the first of many,\" Musk said in a post on X, without providing further details on how the share giveaway would happen.\nCNBC has reached out to SpaceX for further comment.\nMusk's financial giving has been in the news in recent weeks primarily for his political contributions.\nThe Tesla CEO has spent more than $276 million in donations to Republican groups since July, making him the biggest known donor of the 2026 midterm election.\nThe world's richest person poured $158 million into the Senate Leadership Fund, the Republican Party's leading Senate super PAC, in September through an affiliated Texas PAC created to support Republican Ken Paxton. Musk's two contributions of $75 million and $83 million are among the largest political donations ever.\nMusk's post came hot on the heels of Anthropic revealing that it plans to commit 5% of its shares to a new public benefit fund, with the stake potentially increasing as the company's valuation grows.\nIn response to an Anthropic post on X about the fund on Sunday, Musk replied, \"I recommend giving the shares directly to the public,\" and added that's what he'd be doing.\nSubject to shareholder approval, Anthropic's fund would immediately commit 5% of Anthropic's shares, with the board adding, at its discretion, an additional 2% for every 50% increase in the company's value above a set baseline that has yet to be disclosed.\nThe fund may be used to \"explore large donations,\" including to traditional nonprofits or as direct distributions for specific populations, or for \"bolder approaches\" to study and address AI's disruption and displacement of jobs, the company said.\n— CNBC's Jennifer Liu contributed to this report.",

seline that has yet to be disclosed.\nThe fund may be used to \"explore large donations,\" including to traditional nonprofits or as direct distributions for specific populations, or for \"bolder approaches\" to study and address AI's disruption and displacement of jobs, the company said.\n— CNBC's Jennifer Liu contributed to this report.",

    "title": "Google says it can build data centers the right way. Some experts and residents are skeptical",
    "titleJa": "Google says it can build data centers the right way. Some experts and residents are skeptical",
    "summaryJa": "Google says its Minnesota AI data center will add clean energy to the grid and protect ratepayers. Experts question whether grid upgrades are needed.",
    "bodyOriginal": "If there's one thing most Americans can agree on, it's that they don't want a data center in their backyard.\nA Gallup survey conducted in March found that 71% of Americans opposed the construction of a data center in their local area. Chief among their concerns: energy usage. Half of Americans surveyed by Pew Research Center in July and August said data centers would be mostly bad for the environment and for household energy costs.\nNow Google is betting that a massive AI data center can help finance a cleaner, more reliable power grid. Its proposed deal with Xcel Energy would add more wind, solar and battery capacity than the data center is expected to use.\nUnder the agreement, Google would help pay for the added capacity and continue paying, even if it doesn't use all of the power.\nGoogle's bet that AI can finance a cleaner grid\nPine Island, Minnesota, is a small town of about 4,000 residents an hour southeast of Minneapolis. Google hopes that its new 780-megawatt data center plan will build goodwill with the Pine Island community and keep the company on track to meet its goal of operating on carbon-free energy, 24 hours a day, seven days a week by 2030.\nGoogle — whose cloud business powers its own Gemini AI and brought in nearly $25 billion in second-quarter revenue, an 82% increase from a year earlier — says it has found a model for doing this the right way. The company plans to finance the addition of 1,400 megawatts of wind, 200 megawatts of solar and 300 megawatts of battery storage to Xcel's grid.\nThose additions amount to more than the capacity of the data center itself, which Google said is because wind and solar do not generate energy at all times. Xcel Energy said the new power will serve all customers in the local area, not just Google. Xcel also said the upgrades will help advance the local grid's carbon-free energy supply.\nThe proposed agreement between Google and Xcel includes minimum demand charges and exit fees, which Google says will keep the company on the hook for the infrastructure being built on its behalf, even if the AI boom cools. Google will pay for at least 75% of its contracted capacity, even if it uses less, and would owe up to eight years' worth of those minimum demand charges if it terminates the agreement early.\n\"Nobody wants to have a big buildout and then have nowhere for that power to go and nobody to pay for that power,\" said Amanda Rome, executive vice president and chief customer officer at Xcel Energy. \"That's where these protections come in.\"\nThe agreement between Google and Xcel Energy is pending approval by the Minnesota Public Utilities Commission.\nData centers are driving a historic power buildout\nNew data centers will account for \"most\" of the projected increase in electricity demand over the next decade, according to the North American Electric Reliability Corporation, a nonprofit regulator.\nThe Department of Energy under President Joe Biden reported that more than 70% of U.S. transmission lines and power transformers were at least 25 years old and found that the cheapest ways of meeting future demand would require the nation's transmission system to more than double in size by 2050.\nBut hyperscalers argue that they can finance badly needed grid upgrades while also making the grid cleaner and more reliable.\n\"The timing of this industrial revolution couldn't be more perfect,\" said Amanda Peterson Corio, Google's global head of energy and power. \"It's right at the time when we needed capital to fix aging infrastructure in the United States.\"\nCould data centers use the grid as is?\nJigar Shah, a partner at Multiplier, a consulting firm that helps clean energy startups go public, said data center operators could be constructing smaller facilities in places where the grid already has unused capacity. That would minimize the need to build — and pay for — new generation or transmission equipment.\n\"If you fit the load growth that the data centers want into the existing grid, everybody's rates go down by a lot,\" said Shah.\nThat's because the existing grid has enormous fixed costs from the infrastructure already in place: power plants, transmission lines, substations. If one new customer comes onto the grid and pays a large slice of that, everyone else's bills go down.\n\"And so the question really is, why are people not doing these 25-megawatt data centers? Why are they doing 1,000-megawatt data centers? And it turns out people are just lazy,\" Shah said. \"They're like, well, it's easier for me to contract one data center that's one gigawatt in size than figuring out how to do something on the order of 40 data centers that are 25 megawatts each.\"\nIndustry watchdogs also warn of another reason that utilities often prefer to build new infrastructure, rather than make more use out of their existing grid.\n\"When [utilities] build something new, they fund part of that investment with dollars from their investors on Wall Street, and they enjoy incredibly high, exorbitant returns on those investments, typically around 10%,\" said David Pomerantz, executive director at the Energy and Policy Institute, a utility watchdog agency.\nBuilding a data center that fits neatly into an existing grid provides little opportunity for a utility to make new money.\nWhat if a hyperscaler offers to pay for those grid investments?\n\"One way to leverage data centers to lower people's bills is for data centers to provide that capital at much cheaper rates than the utility,\" said Pomerantz. \"But that's a big problem for the utility. And this fight is actually already emerging.\"\nStill, Shah said, the Google/Xcel project in Minnesota is a good example of a data center project acting as a catalyst for newer, greener technology.\n\"Google came in and said, well, here's a new way of doing things, using new technologies. How about we do it that way? And then that helps ratepayers. And the utility was like, yeah, that makes a lot of sense.\"\nWatch the video above for the full story, including an interview with Google's global head of energy and power.\n— CNBC's Jeniece Pettitt and Lora Kolodny contributed to this report.",

    "id": "women-may-be-at-greater-risk-of-ai-job-l-0d1f2f8b",
    "title": "Women may be at greater risk of AI job losses. Telephone switch operators and PCs show why.",
    "titleJa": "Women may be at greater risk of AI job losses. Telephone switch operators and PCs show why.",
    "summaryJa": "The history of technological progress suggests that as AI spreads, the employment impact will hit women more than men.",
    "bodyOriginal": "Decades before Siri or Alexa or ChatGPT, there was a real person, almost always a woman, at the center of the information world. She was so vital, most long-distance communication could not happen without her.\nShe was the telephone switch operator, and at one time she was part of the single largest occupation for white, U.S.-born women under age 20.\nToday, that job doesn't exist.\nThe world is struggling to figure out what the dawn of artificial intelligence means for society, culture and the economy. A lot of ordinary Americans are just wondering what it means for their jobs.\nThe history of technological progress — from automated telephone switches to the introduction of the washing machine and the personal computer — can offer some guidance. And that guidance suggests women are likely to be among the most affected by AI.\n\"AI is focused on routine tasks and numbers and finding patterns, and those types of jobs are the clerical, administrative jobs that a lot of women hold,'' said Ariane Hegewisch, a senior research fellow at the Institute for Women's Policy Research. \"It's still 90% of secretaries and clerical workers who are women.\"\nNew research backs this up. The International Labour Organization in March concluded that nearly one in 10 women in high-income countries works in occupations at the highest risk from AI.\nThe invention that made operators obsolete\nIn the 1940s, nearly 95% of America's telephone operators were female. It was a relatively well-paying job for women at the time, and a complicated one: It took months of training to be able to handle the several hundred calls an hour that could come in at peak times. Operators were expected to be speedy, precise — and polite.\nThese women were hit hard when AT&T introduced the automated telephone switch. It was one of the largest automation investments in history — a close analog to the massive AI investment now underway — and created one of the biggest technological shocks the nation had ever seen.\nIn the decades after the automatic switch was popularized, an estimated 75,000 operator jobs vanished.\nEconomists James Feigenbaum from Boston University and Daniel P. Gross from Duke University's Fuqua School of Business studied census and paycheck data from the time and followed local employment trends along the path of AT&T's rolling investment in switches across the nation.\n\"The effect of this shock on incumbent operators was to dispossess many of their jobs and careers,\" they wrote in 2020. Many switchboard operators wound up in lower-paying jobs — or dropped out of the workforce entirely, they found.\nEconomist David Autor says this outcome reflects the reality that many workers are already in their highest and best-paying occupation. When the job goes away, the next step is often down.\n\"Most people are not changing careers very often. They make their career decisions early, and they stick with those careers,\" he said. \"If those careers, if the value of that work … suddenly goes out of fashion, becomes technologically obsolete, they're going to, in general, do something not as good.\"\nBut Feigenbaum and Gross also discovered that the next generation of women fared better.\n\"Future workers found work in other fields, often taking up similar-quality jobs,\" they wrote, as the younger workers were \"more adaptive to an evolving labor market … Anxiety over the opportunities available to future generations proved to be somewhat misplaced.\"\nIn other words: One type of job went away, but other work emerged over time that was just as good.\n'Engines of liberation'\nBy the 1950s, another technological innovation would come along and have a profound effect on women: the washing machine.\nDubbed \"engines of liberation\" in a seminal paper on the topic by University of Pennsylvania economist Jeremy Greenwood and others, washing machines and other appliances dramatically reduced the time women spent on unpaid housework. That meant time could be reallocated to a paycheck outside the home, even as women's responsibility for the home remained.\nFrom 1950 to 1980, as gender norms changed, the number of employed women in the U.S. grew by more than 25 million. Their participation rate, or share of the female population in the labor force, grew to 52% from 34%. At the same time, 16 million more men found work, though the male participation rate dropped by 5 percentage points.\nThe relevant question for the AI boom today: How did the economy suddenly find jobs for these women? If AI creates a vast new pool of available workers, can the economy put them to work?\nFirst, the very entry of women into the workforce meant demand for tasks once done at home moved into the paid economy, services like childcare and food preparation. Second, as the nation grew wealthier, other employment opportunities for women emerged in the service economy — in retail, restaurants, leisure and hospitality, and even some professional services. And third, as American businesses grew, they needed more people to handle the paperwork — everything from payroll to customer accounts.\nChanges to the economy and businesses were partly related to the entry of women into the workforce, but it was also partly random luck that the U.S. was booming and businesses were changing to need more office workers.\n\"Between 1940 and 1980, there was a ton of new work created in the U.S. economy, and it was in office and clerical work that was accessible to people with a high school education,'' Autor said.\nThe rise of the PC\nThe next big revolution affecting women in the workplace was the personal computer.\nBefore PCs arrived on the scene, women were the backbone of office infrastructure. According to the 1980 U.S. census, nearly 4.7 million Americans worked as secretaries, stenographers and typists. More than 98% were women.\nWhen IBM introduced the personal computer in 1981, followed by the advent of Microsoft Word just two years later, some of the middlemen, or in this case, middlewomen, became obsolete. It didn't eliminate writing, filing or editing. It simply shifted a big chunk of those tasks from dedicated clerical workers to others in the office — executives could type their own reports, book their own travel and print their own papers.\nBut the PC wasn't entirely bad news for women in the workforce. Studies show women were already more likely than men to be using a computer at work at the dawn of the PC era. The PC put new tools at their fingertips: spreadsheets and databases and general computing power. While many roles were eliminated, many women adapted and found new ways to use the emerging technology to make themselves indispensable to their employers.\nThat's a potential outcome for AI. In some cases, it will eliminate tasks but not entire jobs, enhancing the time and ability of a worker to do the remaining value-added jobs that only humans can do.\nA 2022 paper by Marcus Dillender and Eliza Forsythe found that when companies adopted software to do office and administrative work, it resulted in a 1% decline in employment in the sector but a 3% increase in wages for college graduates.\nMany more women have earned college and advanced degrees, and hold managerial jobs, than when other technologies ripped through the economy, offering some potential protection from automation. But maybe not for long: One of the promises of AI is that it will move up the value chain of the jobs performed by humans.\nWhatever capabilities the new technology may have now, the outlook is unclear because, Hegewisch says, somewhat ominously, \"AI can learn.\"",
