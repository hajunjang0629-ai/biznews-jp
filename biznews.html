    "id": "here-s-exactly-what-paramount-promised-h-73b458f4",
    "title": "Here's exactly what Paramount promised Hollywood to land WBD — and why some are still skeptical",
    "titleJa": "Here's exactly what Paramount promised Hollywood to land WBD — and why some are still skeptical",
    "summaryJa": "Paramount CEO David Ellison's antitrust settlement eased some theatrical concerns, but questions remain about what happens when the five-year agreement ends.",
    "bodyOriginal": "A new movie every 11 days? That's what Paramount's David Ellison is promising after clearing a path this week for his company's acquisition of Warner Bros. Discovery, combining two storied Hollywood studios.\nThe CEO's settlement with a group of state attorneys general over antitrust concerns stipulates that the newly minted company will release at least 30 films into theaters in 2027 and 2028 and at least 32 films in 2029, 2030 and 2031.\nCurrently, the combined entity has 35 films scheduled to be released next year, according to data from Rentrak.\nBut questions remain about what caliber of releases the industry can expect — and what happens after the five-year agreement expires.\n\"This is much more complicated than simply asking whether 30 movies is enough,\" Paul Dergarabedian, head of marketplace trends at Rentrak, told CNBC. \"Thirty wide releases would represent a meaningful commitment to theatrical, and I think everyone in exhibition would welcome a robust pipeline of films.\n\"But ultimately the proof will be in how those movies perform, how varied the slate is, how consistently they reach theaters and how the combined company executes on those commitments,\" he said.\nHollywood has been clamoring for more theatrical titles since the Covid pandemic shuttered theaters and clogged the production pipeline. Ellison's theatrical commitment, which he touted as early as April at the industry's annual CinemaCon event, had garnered approval from the CEOs of the \"Big Three\" cinema operators — AMC's Adam Aron, Cinemark's Sean Gamble and Regal's Eduardo Acuna — even before Paramount's settlement.\nCinema United, the lobbying group that represents theater owners, had been staunchly against the merger, but gave its seal of approval this week, saying the agreement with the states \"accomplishes many of exhibition's objectives.\"\nHowever, not all exhibitors are on board. A number of theater executives, who requested anonymity to speak candidly, told CNBC they remain skeptical.\nConsolidation concerns\nParamount's settlement includes stipulations about the number of theatrical releases the company must distribute over the next five years, how many of those releases need to be distributed widely and how many need to have a budget of more than $50 million. Paramount agreed to face steep penalties if it fails to meet the thresholds.\nConsolidation among movie studios has traditionally led to fewer film releases, which, in turn, results in lower revenue, particularly for smaller theater chains and independent operators.\nOverall industry dynamics have shifted drastically since Covid disrupted the theatrical space, leading to fewer screens and fewer moviegoers. Some of these woes have been masked by higher movie ticket prices — which are expected to help boost the domestic box office above $10 billion for the first time since the pandemic — but the moviegoing industry is still adapting to new economics.\nSeveral theater operators told CNBC they were concerned the merger between Paramount and Warner Bros. would not only decrease the number of studios contributing films to the ecosystem, but also decrease competition and give the combined company a more powerful bargaining position when it comes to windowing terms and rental fees.\nWhile larger exhibitors, which operate hundreds of locations, can weather consolidation, the smaller players have far less leverage.\nSome theater owners also said they fear that Paramount will not be able to sustain its 30-plus theatrical output after the five-year deal, especially as production and marketing costs continue to rise and as Paramount contends with around $79 billion in debt once the merger closes.\n\"Of course, I worry about what happens in year six,\" Rob Lehman, president and chief operating officer at Santikos Theaters, told CNBC. \"You know, after the five years is up, does it then drop down to 18 movies a year?\"\nStill, Lehman called Paramount's guaranteed number of films \"a win for the industry.\"\nUnder the terms of its settlement agreement, if Paramount falls short of its annual quotas, it'll be fined $30 million per film, 90% of which will be paid out to film workers and 10% to the National Association of Attorneys General.\nThough $30 million per film could prove to be a material penalty if Paramount significantly misses the mark, it pales in comparison to the cost of actually making and marketing a film.\nAnd, \"quantity by itself is not enough,\" Dergarabedian said. \"You could say you are going to release 30 movies, or even 100 movies, but those movies still have to connect with audiences. If you had half as many films and every one of them became a major hit, which scenario would you rather have? So ultimately, it is not simply about how many movies are released. It is about having enough movies, released at the right cadence, that audiences actually want to see.\"\nNext year, the combined Paramount-Warner Bros. slate includes new entries in popular franchises like Sonic, Godzilla, Minecraft, A Quiet Place, Teenage Mutant Ninja Turtles, Lord of the Rings, The Conjuring and the DC superhero universe.\nA packed calendar\nThere are also simple logistical questions around 30 films released from one company in a year.\nWith 52 weeks on the calendar, that's less than 2 weeks between new releases — not accounting for marquee weekends when the industry typically stacks big premieres.\nA merged Paramount-Warner Bros. could easily cannibalize its own ticket sales if major releases are placed too close to one another.\nCombine that with growing competition for coveted premium large format screens like Imax and Dolby and the schedule looks even trickier.\nAt present, the combined slate of Paramount and Warner Bros. for 2027 contains six dates where both studios have a theatrical release planned. There are also pockets on the calendar that have three to five releases stacked up on a weekly basis.\n\"From a pure strategy standpoint, it's reasonable to expect release date shifts among the two studios' planned slates,\" Dergarabedian said. \"In some cases, it'll be to avoid overlapping audiences while, in others, it may be to diversify their cadence of box office.\"\nFor example, the combined company currently has nine horror films slated for 2027 and could look to shift dates to allow these features to have longer playability without competing.\n\"Hopefully, they put together some great movies and counterprogramming,\" Lehman said. \"Show us the kids' movies, show us the horror movies, show us the high-end action movies.\"\nThe fine print\nParamount's settlement with the state AGs mandates that at least 20 of the films released by the combined company in each of the first two years after closing have a wide release in more than 2,000 theaters. For the following three years, that increases to at least 21 films.\n\"The agreement very specifically stipulates that it only has to be 20 wide releases, which is nothing,\" said industry analyst David Poland.\nCurrently, Paramount is on track to have 14 wide releases in 2026 and Warner Bros. is set for 13, for a total of 27 wide releases between them, according to Rentrak data.\n\"The importance of wide releases cannot be overstated,\" Dergarabedian said. \"These are the films that generate the biggest theatrical impact, fill auditoriums, drive concession sales and create the kind of cultural conversation that benefits the entire moviegoing ecosystem.\"\nThen there is the definition of \"tentpole.\"\nIn Hollywood, a tentpole film is one with a high budget that makes enough money between ticket sales and merchandise tie-ins that a studio can fund smaller-budget projects that may not be as profitable.\nFor many in the industry, a tentpole feature is one that costs more than $100 million to produce, often exceeding $200 million or $250 million, and that drives significant traffic to movie theaters. Think, the Marvel Cinematic Universe, Universal's recent hit \"The Odyssey\" or Sony's \"Spider-Man: Brand New Day.\"\nThe Paramount settlement, which mandates that at least 20% of the company's annual releases be tentpole films, defines that category as a film with a budget of at least $50 million.\n\"A $50 million production budget feels like a relatively low threshold for what we traditionally think of as a tentpole movie,\" Dergarabedian said. \"But at the same time, a $50 million movie can absolutely become a tentpole if it breaks out and becomes a cultural and box office phenomenon.\"",
    "bodyJa": "A new movie every 11 days? That's what Paramount's David Ellison is promising after clearing a path this week for his company's acquisition of Warner Bros. Discovery, combining two storied Hollywood studios.\nThe CEO's settlement with a group of state attorneys general over antitrust concerns stipulates that the newly minted company will release at least 30 films into theaters in 2027 and 2028 and at least 32 films in 2029, 2030 and 2031.\nCurrently, the combined entity has 35 films scheduled to be released next year, according to data from Rentrak.\nBut questions remain about what caliber of releases the industry can expect — and what happens after the five-year agreement expires.\n\"This is much more complicated than simply asking whether 30 movies is enough,\" Paul Dergarabedian, head of marketplace trends at Rentrak, told CNBC. \"Thirty wide releases would represent a meaningful commitment to theatrical, and I think everyone in exhibition would welcome a robust pipeline of films.\n\"But ultimately the proof will be in how those movies perform, how varied the slate is, how consistently they reach theaters and how the combined company executes on those commitments,\" he said.\nHollywood has been clamoring for more theatrical titles since the Covid pandemic shuttered theaters and clogged the production pipeline. Ellison's theatrical commitment, which he touted as early as April at the industry's annual CinemaCon event, had garnered approval from the CEOs of the \"Big Three\" cinema operators — AMC's Adam Aron, Cinemark's Sean Gamble and Regal's Eduardo Acuna — even before Paramount's settlement.\nCinema United, the lobbying group that represents theater owners, had been staunchly against the merger, but gave its seal of approval this week, saying the agreement with the states \"accomplishes many of exhibition's objectives.\"\nHowever, not all exhibitors are on board. A number of theater executives, who requested anonymity to speak candidly, told CNBC     "title": "Appeals court rules that states can regulate Kalshi’s sports prediction markets, dealing another legal blow to platforms",
    "titleJa": "Appeals court rules that states can regulate Kalshi’s sports prediction markets, dealing another legal blow to platforms",
    "summaryJa": "The decision is the second in less than a month by an appeals court that states have a role in regulating sports-related event contracts.",
    "bodyOriginal": "The 6th U.S. Circuit Court of Appeals ruled on Friday that states have a right to regulate sports-related event contracts on prediction market platforms, marking a second major legal defeat for the industry as a fight at the U.S. Supreme Court looms.\nIn a unanimous decision, the three judge panel said that Ohio and Tennessee are permitted to apply their state gambling laws to Kalshi's sports-related event contracts.\n\"We hold that Kalshi has not shown that its sports-event contracts satisfy the statutory definition of a 'swap' so as to fall within the scope of the CFTC's 'exclusive jurisdiction,'\" the opinion said.\nKalshi and other prediction market platforms argue all event contracts are swaps, a type of financial derivative that is regulated by the Commodity Futures Trading Commission. However, states assert that platforms' sports-related offerings amount to gambling, and thus should be regulated by their laws related to sports betting.\nThis disagreement has spawned a legal battle across the country as states sue platforms for operating what they often claim are illegal gambling operations, while exchanges also sue states to block them from enforcing local laws on what they argue should be federally-regulated financial exchanges.\nThe CFTC has sued nine states to defend what it believes is its exclusive right to regulate event contracts, given to it by the Commodity Exchange Act. But the 6th Circuit panel rejected that notion.\n\"Even assuming that Kalshi's sports-event contracts are swaps, we alternatively hold that the CEA neither expressly nor impliedly preempts Ohio's or Tennessee's gambling laws,\" the opinion said. The decision overturns a Tennessee federal district court ruling that sided with Kalshi, and reaffirms a decision by a federal district court in Ohio that sided with the states' argument.\nKalshi nor the CFTC immediately responded to requests for comment. CNBC has also reached out to the Ohio and Tennessee attorneys general offices for comments.\nThe latest ruling now means prediction market platforms have notched two losses in legal fights at the appeals court level. The 9th U.S. Circuit Court of Appeals ruled last month that Nevada has a right to regulate sports-related event contracts, stating that they were sports bets and not swaps. Meanwhile, the 3rd U.S. Circuit Court of Appeals ruled against New Jersey in April and said the CFTC has the exclusive right to regulate all swaps, no matter the contract type.\nNew Jersey appealed that decision in a petition to the Supreme Court earlier this month. It is not clear whether the Supreme Court will take up the case now, or wait until further decisions from circuit courts on the issue of sports-related event contracts are delivered.\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.",

ices for comments.\nThe latest ruling now means prediction market platforms have notched two losses in legal fights at the appeals court level. The 9th U.S. Circuit Court of Appeals ruled last month that Nevada has a right to regulate sports-related event contracts, stating that they were sports bets and not swaps. Meanwhile, the 3rd U.S. Circuit Court of Appeals ruled against New Jersey in April and said the CFTC has the exclusive right to regulate all swaps, no matter the contract type.\nNew Jersey appealed that decision in a petition to the Supreme Court earlier this month. It is not clear whether the Supreme Court will take up the case now, or wait until further decisions from circuit courts on the issue of sports-related event contracts are delivered.\nDisclosure: CNBC and Kalshi have a commercial relationship that includes customer acquisition and a minority investment.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}

    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

  return { page: "home" };

          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
