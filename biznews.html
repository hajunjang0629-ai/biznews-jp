    "id": "hormuz-remains-blocked-iran-disputes-tr-2f433a03",
    "title": "‘Hormuz remains blocked’: Iran disputes Trump claims as traffic sinks to near 3-month lows",
    "titleJa": "「ホルムズは封鎖されたまま」：交通量が3カ月ぶりの低水準近くに落ち込む中、イランはトランプ大統領の主張に異議を唱える",
    "summaryJa": "イラン当局は、米国がホルムズ海峡を「完全に支配」しているとするドナルド・トランプ米大統領の繰り返しの主張を反発している。水曜日、イランのペルシャ湾海峡当局はXへの投稿で、「ホルムズ海峡はもはや封鎖されていないという米国当局者の主張や度重なる投稿は現実を変えるものではない。ホルムズ海峡は封鎖されたままであり、イランの条件が受け入れられるまで再開されることはない」と述べた。",
    "bodyOriginal": "Iranian authorities have pushed back on U.S. President Donald Trump's repeated claims that Washington has \"total control\" over the Strait of Hormuz.\nOn Wednesday stateside, Iran's Persian Gulf Strait Authority said in a post on X that \"Claims and repeated posts by U.S. officials that the Strait of Hormuz is no longer blocked do not change the reality: the Strait of Hormuz remains blocked and will not be reopened until Iran's conditions are accepted.\"\nTrump had said in a Truth Social post earlier that \"The U.S.A. has total control over the Strait of Hormuz. I THINK WE WILL KEEP IT!\"\nWhile both sides continue to make contradictory claims, data from trade intelligence firm Kpler showed that ship traffic through the Hormuz waterway is near a 3-month low.\nVessel transits sat at a 5-day average of around 13 on Tuesday, nearly the lowest level since May 12, according to a CNBC analysis of data provided by the trade intelligence firm Kpler. This includes ships of all types, from cargo vessels to oil tankers.\nTraffic is about 90% lower than the daily average of 130 ships that transited Hormuz before the U.S. and Israel attacked Iran on Feb. 28.\nBoth Washington and Tehran have hardened their negotiating stances, asking for \"reparations\" from the other side, among other demands.\nIran's Supreme National Security Council laid out sweeping demands over the weekend for reopening the Strait of Hormuz, including an end to the U.S. naval blockade, sanctions relief, American troop withdrawals and war reparations.\n'Confusion and bewilderment'\nThe developments come as Mohammad Reza Naqdi, a top advisor to the commander of Iran's Islamic Revolutionary Guard Corps, told PBS in an interview on Tuesday stateside that \"victory is on our side\" and that \"we have also seen how the American military is weaker than what we perceived.\"\nHe pointed to what he described as Washington's shifting objectives over the course of the conflict, including wanting to invade Kharg Island and opening the Strait of Hormuz.\n\"We saw confusion and bewilderment in America. It became a war without a strategy. Every two or three days, they announced a new objective ... They mobilized their battleships. Everything they tried, we can show how we were victorious.\"\nWhen asked if the plan was to drag the conflict out until Trump leaves office, Naqdi said the goal was for Iran to \"attain deterrence.\"\nAs such, he said that one way was to prolong the conflict and cause attrition, so if anyone wants to attack Iran, there will be a cost.\n— CNBC's Spencer Kimball and Deena Zaidi contributed to this report.",
    "bodyJa": "イラン当局は、米国がホルムズ海峡を「完全に支配」しているとするドナルド・トランプ米大統領の繰り返しの主張を反発している。\n水曜日、イランのペルシャ湾海峡当局はXへの投稿で、「ホルムズ海峡はもはや封鎖されていないという米国当局者の主張や度重なる投稿は現実を変えるものではない。ホルムズ海峡は封鎖されたままであり、イランの条件が受け入れられるまで再開されることはない」と述べた。\nトランプ大統領は以前、トゥルース・ソーシャルへの投稿で、「米国はホルムズ海峡を完全に支配している。我々はそれを維持すると思う！」と述べていた。\n双方は矛盾した主張を続けているが、貿易情報会社Kplerのデータによると、ホルムズ水道を通過する船舶の交通量は3カ月ぶりの低水準に近い。\n貿易情報会社Kplerが提供したデータをCNBCが分析したところによると、火曜日の船舶の通過回数は5日間平均約13回で、5月12日以来ほぼ最低水準となった。これには、貨物船から石油タンカーまで、あらゆる種類の船舶が含まれます。\n交通量は、米国とイスラエルが2月28日にイランを攻撃する前にホルムズを通過した船舶130隻の1日平均よりも約90％少ない。\nアメリカ政府とイラン政府は双方とも交渉姿勢を硬化させ、他の要求の中でもとりわけ相手側に「賠償」を求めている。\nイラン国家安全保障最高会議は先週末、米国の海上封鎖の解除、制裁緩和、米軍撤退、戦争賠償を含むホルムズ海峡再開に向けた包括的な要求を打ち出した。\n「混乱と当惑」\nこの展開は、イランイスラム革命防衛隊司令官の最高顧問モハマド・レザー・ナクディ氏が火曜日のインタビューで米PBSに対し、「勝利は我々の側にある」とし、「我々はまた、米軍が我々が認識していたよりもいかに弱いのかも目の当たりにした」と語った中で明らかになった。\n同氏は、カーグ島への侵攻やホルムズ海峡の開放など、紛争の過程でワシントンの目標が変化していると述べたものを指摘した。\n「我々はアメリカ国内で混乱と当惑を目の当たりにした。戦略のない戦争となった。二日か三日ごとに彼らは新たな目標を発表した…彼らは戦艦を動員した。彼らが試みたすべてを見て、我々がどのように勝利したかを示すことができる。」\nトランプ大統領が退任するまで紛争を長引かせる計画なのかとの質問に対し、ナクディ氏はイランが「抑止力を獲得する」ことが目的だと述べた。\nそのため、紛争を長引かせ消耗を引き起こすことが一つの方法であり、イランを攻撃しようとする者がいれば代償が生じるだろうと同氏は述べた。\n— CNBCのスペンサー・キンボール氏とディーナ・ザイディ氏がこのレポートに貢献しました。",

    "id": "this-chinese-firm-has-topped-micron-and-7c598fab",
    "title": "This Chinese firm has topped Micron and Kioxia in shipments of crucial NAND memory chips",
    "titleJa": "この中国企業は重要なNANDメモリチップの出荷量でマイクロンとキオクシアを上回った",
    "summaryJa": "Counterpoint Research は、大規模な DRAM セグメントとともに人工知能の需要から恩恵を受けているメモリ チップの NAND セグメントに注目しました。",
    "bodyOriginal": "BEIJING — Yangtze Memory Technologies is rapidly gaining market share in a critical chip sector, according to Counterpoint Research.\nThe company, also known as YMTC, landed in third place by shipments globally in the second quarter, behind South Korea's Samsung and SK hynix but beating out U.S. rival Micron and Japan's Kioxia, Counterpoint data released Wednesday showed.\nThat's when looking at the NAND memory segment, which contributes about one-fourth of Micron's revenue. NAND chips retain data even when devices are powered off but are slower than DRAM memory chips, which operate more quickly — at a far higher cost, forming about three-fourths of Micron's revenue.\nYMTC reached third place with a 14% share, the report said. It narrowly beat Kioxia a year ago, but fell back behind in following months, Counterpoint Research Director MS Hwang said.\n\"YMTC is projected to pull further ahead in 2027 and 2028. From that perspective, YMTC achieving third place this quarter carries significant weight in the competitive landscape,\" Hwang said.\nHe said a 15% market share is the minimum needed for a memory manufacturer to fund its own capital expenditures for future growth.\nYMTC is preparing to go public in mainland China, following the blockbuster debut of DRAM-focused Chinese memory chip company CXMT last month.\nCXMT held 7% of the DRAM market in the second quarter, in fourth place behind Micron, SK hynix and market leader Samsung, a separate Counterpoint report showed earlier this month.\nBoth DRAM and NAND memory chip markets have reached record sales, at nearly $100 billion and $46 billion, respectively, in the first quarter, according to Counterpoint.\nDespite YMTC's gains in shipments, the company still lagged behind Micron and Kioxia in terms of NAND chip revenue, the research firm said. It noted YMTC still sells more to consumer applications rather than data centers — a business expected to take half of all available NANDs by the end of 2026.\nIn order to ramp up NAND production, SK hynix is resuming investment at a facility in the Chinese coastal city of Dalian after a four-year pause, Korean media reported this week. SK hynix did not immediately respond to a CNBC request for comment.",
    "bodyJa": "北京 - Counterpoint Research によると、長江メモリーテクノロジーズは重要なチップ分野で急速に市場シェアを拡大​​している。\n水曜日に発表されたカウンターポイントのデータによると、YMTCとしても知られる同社は、第2四半期の出荷台数で世界第3位となり、韓国のサムスンとSKハイニックスに次ぐものの、米国のライバルであるマイクロンと日本のキオクシアを上回った。\nそれは、Micron の収益の約 4 分の 1 を占める NAND メモリ部門に目を向けた場合です。 NAND チップはデバイスの電源がオフになってもデータを保持しますが、より高速に動作する DRAM メモリ チップよりも遅く、コストがはるかに高く、マイクロンの収益の約 4 分の 3 を占めています。\n報告書によると、YMTCはシェア14%で3位となった。カウンターポイントのリサーチディレクターMS Hwang氏によると、同社は1年前にキオクシアを僅差で破ったが、その後数カ月で後退したという。\n「YMTCは2027年と2028年にさらに前進すると予測されています。その観点から見ると、YMTCが今四半期に3位を獲得したことは、競争環境において大きな重みを持っています」とファン氏は述べた。\n同氏は、メモリメーカーが将来の成長に向けた設備投資を賄うためには、15％の市場シェアが最低限必要だと述べた。\nYMTCは、先月のDRAMに特化した中国のメモリチップ企業CXMTの大ヒットデビューに続き、中国本土での株式公開の準備を進めている。\n今月初めのカウンターポイントの別のレポートによると、CXMTは第2四半期にDRAM市場の7％を占め、マイクロン、SKハイニックス、市場リーダーのサムスンに次いで4位となった。\nCounterpointによると、DRAMとNANDメモリチップ市場はいずれも、第1四半期にそれぞれ1,000億ドル近くと460億ドル近くの記録的な売上高に達したという。\nYMTCは出荷台数が増加しているにもかかわらず、NANDチップの収益という点では依然としてマイクロンやキオクシアに後れを取っていると調査会社は述べた。 YMTCは依然としてデータセンターよりも消費者向けアプリケーションへの販売が多く、2026年末までに利用可能なすべてのNANDの半分を占めると予想されるビジネスであると同社は指摘した。\nNAND生産を増強するため、SKハイニックスは4年間の休止期間を経て、中国沿岸都市大連の施設への投資を再開すると韓国メディアが今週報じた。 SKハイニックスはCNBCのコメント要請にすぐには応じなかった。",

    "id": "goldman-says-japan-s-1-trillion-of-reser-1c5cb6e9",
    "title": "Goldman says Japan's $1 trillion of reserves leaves 'plenty of capacity' for further yen interventions",
    "titleJa": "ゴールドマン、日本の1兆ドルの外貨準備にはさらなる円介入のための「十分な余力」があると語る",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Japan has enough cash at its disposal for a couple more rounds of yen-buying on the scale of last month's historic intervention, helped by access to a Federal Reserve facility, according to Goldman Sachs.\nOf Japan's roughly $1 trillion in U.S. dollar reserves, about $200 billion — likely the size of the July operation — sits in cash or cash equivalents, Goldman estimated.\n\"They already have at their disposal enough to do another couple rounds of what we just saw,\" which were near record size, Karen Fishman, a Goldman Sachs Research strategist, said on the bank's Exchanges podcast published late Wednesday U.S. time.\n\"Realistically, they wouldn't come close to using all of that, but I think that just sort of hits home the point that they have plenty of capacity to keep intervening if they wish,\" Fishman said. Access to the Fed's facility would theoretically make that full trillion dollars available in liquid form, she added.\nJapanese officials have said that they won't hesitate to step back in if needed. That carries \"some credibility,\" Fishman said, now that the U.S. has intervened alongside Japan to support the yen for the first time since 1998. The two countries also acted in coordination with other Group of Seven nations to curb gains in the yen after the 2011 earthquake.\nThe joint action in late July came after the yen slid toward 164 per dollar, hovering near its weakest level in four decades, and has put the Bank of Japan's September policy meeting at the center of whether that reprieve holds.\nThe Wall Street bank estimates Tokyo deployed as much as $85 billion in the first two days of last month's operation, saying it was Japan's biggest two-day foray into currency markets on record outside October 2011, when Tokyo intervened in the aftermath of the Fukushima disaster.\nThe yen had strengthened past its 200-day moving average of 158 per dollar following the intervention. But those gains are now fading: the currency slipped on Wednesday to near the key 160 level, giving back about half the strength from the intervention.\nThe intervention is \"not a sustainable fix ... ultimately just buys some time,\" said Fishman, noting that after Japan's solo action in April and May, the yen was back at 40-year lows within months.\nJapan's finance ministry has said it plans to use the Fed's FIMA repo facility, which lets central banks raise dollar cash against their Treasury holdings, sparing Tokyo from dumping Treasuries on the secondary market to fund intervention.\nThe prospect of a much bigger war chest has already shifted sentiment. Clients \"really did get quite bulled up on the yen\" last week once the Fed facility potentially put the full $1 trillion within reach for intervention, Praneet Shah, head of FX options trading at Goldman, said in the podcast.\nOptions pricing shows traders are still bracing for another sharp yen surge, and that fear itself may deter fresh selling. Shah said elevated premiums on short-dated yen calls point to a market still on guard for a sudden gap move, making investors wary of betting against the currency as it drifts back toward 160.\n\"If spot is trading up into 160, there's a real risk that you don't want to continue selling yen when you've got this large risk of a drawdown still priced by the market,\" he said.\nWhat may trigger another round\nWhether Tokyo pulls the trigger again may hinge on the carry differential between Japanese and U.S. borrowing rates, which remains the overwhelming driver of the exchange rate, according to Shah.\nThe yield on 10-year U.S. Treasury stood at 4.690% late Wednesday, compared with 2.839% for 10-year Japanese government bonds, leaving investors with a substantial incentive for holding U.S. debt.\nOn the Japanese side, markets now price a 65% chance of a 25-basis-point Bank of Japan hike in September and about 40 basis points of tightening by year-end. \"If they don't deliver\" a September hike, Fishman said, \"that would put renewed downward pressure on the yen.\"\nThe BOJ would need to hike faster than expected to shift the carry dynamics that have driven a 45% yen depreciation over five years, Shah said.\nAny misses, the market will really start to increase expectations of a subsequent intervention.Praneet ShahHead of foreign exchange options trading\nOn the U.S. side, cooler economic data could ease pressure on the yen by weakening the case for the Federal Reserve to hike rates further, and revive bets on another intervention, Shah said.\nShah pointed to July 2024, when one of the most effective rounds of BOJ-MOF intervention landed on a U.S. CPI miss, compounded by a payrolls miss days later.\n\"Any misses, I think the market will really start to increase expectations of a subsequent intervention later this week,\" he said.\nWednesday's inflation report came in line with expectations. The consumer price index rose a seasonally adjusted 0.1% in July, matching consensus forecasts, while the annual rate eased to 3.4% from 3.5% in June. Treasury yields pulled back after the release.",
    "bodyJa": "ゴールドマン・サックスによると、日本には連邦準備理事会の施設へのアクセスの助けもあり、先月の歴史的な介入規模での円買いをあと数回行うのに十分な資金が自由に使えるという。\n日本の約1兆ドルの米ドル準備のうち、おそらく7月のオペの規模に相当する約2000億ドルが現金または現金同等物として存在するとゴールドマンは推定した。\nゴールドマン・サックス・リサーチのストラテジスト、カレン・フィッシュマン氏は、米国時間水曜遅くに公開された同行のポッドキャスト「Exchanges」で、「彼らは、我々が今見たことをさらに数ラウンド行うだけの十分な資金をすでに自由に持っている」と述べ、その規模は記録的な規模に近かったと述べた。\n「現実的に言えば、彼らはそのすべてを利用することには程遠いでしょうが、彼らが望めば介入し続けるだけの十分な能力があるという点は、ある意味当たっていると思います」とフィッシュマン氏は語った。 FRBの施設にアクセスできれば、理論的にはその全額が流動性の形で利用可能になると同氏は付け加えた。\n日本の当局者らは、必要であれば躊躇なく介入すると述べた。フィッシュマン氏は、米国が1998年以来初めて円を支援するために日本とともに介入した今、これには「ある程度の信頼性」があると述べた。両国はまた、2011年の地震後の円の上昇を抑制するために他のG7諸国と連携して行動した。\n7月下旬の共同行動は、円が1ドル＝164円に向けて下落し、40年ぶりの安値付近で推移した後に行われたもので、日銀の9月政策決定会合がこの猶予が維持されるかどうかの中心となっている。\nウォール街銀行は、東京が先月のオペレーションの最初の2日間で850億ドルもの資金を投入したと推定しており、これは東京が福島事故の余波で介入した2011年10月を除けば、記録上、日本による2日間の為替市場への進出としては最大規模だったと述べた。\n介入後、円は２００日移動平均の１ドル＝１５８円を超えて上昇した。しかし、こうした上昇は現在しぼみつつある。水曜日には通貨は主要な160レベル近くまで下落し、介入による強さの約半分が戻った。\nフィッシュマン氏は、この介入は「持続可能な解決策ではなく、結局は時間を稼ぐだけだ」と述べ、4月と5月の日本の単独行動の後、円は数カ月以内に40年ぶりの安値に戻ったと指摘した。\n日本の財務省は、中央銀行が財務省保有に対してドル現金を調達できるFRBのFIMAレポ制度を利用する計画であると発表し、日本政府が介入資金のために流通市場に国債を投げ売りすることを回避できる。\nはるかに大きな軍資金が得られるという見通しにより、すでにセンチメントは変化している。ゴールドマンの外為オプション取引責任者、プラニート・シャー氏はポッドキャストの中で、FRBのファシリティーが潜在的に1兆ドル全額を介入の範囲内に置く可能性が出てから、顧客は先週「実際に円に対してかなり強気になった」とポッドキャストで述べた。\nオプションの価格設定を見ると、トレーダーは依然として円の急騰に備えており、その懸念自体が新たな売りを妨げる可能性がある。シャー氏は、円の短期コールのプレミアムの上昇は、市場が依然として突然のギャップ変動を警戒していることを示しており、円が160円に向けて逆戻りする中、投資家は円に対して賭けることに慎重になっていると述べた。\n同氏は、「現物相場が160円まで上昇している場合、ドローダウンの大きなリスクがまだ市場に織り込まれているときに、円を売り続けたくないという現実的なリスクがある」と述べた。\n次のラウンドを引き起こす可能性のあるもの\nシャー氏によると、東京が再び引き金を引くかどうかは、依然として為替レートの圧倒的な要因となっている日米借入金利のキャリー格差に左右される可能性がある。\n水曜日遅くの米10年国債利回りは4.690％、日本10年国債の利回りは2.839％となっており、投資家には米国債を保有する大きなインセンティブが残っている。\n日本側では、市場は現在、日銀が９月に２５ベーシスポイントの利上げを行い、年末までに約４０ベーシスポイントの引き締めを行う確率を６５％織り込んでいる。フィッシュマン氏は、９月利上げが「実現できなければ、円に新たな下落圧力がかかることになる」と述べた。\nシャー氏は、５年間で４５％の円安をもたらしたキャリー力学を変えるには、日銀が予想よりも速いペースで利上げする必要があると述べた。\n失敗すれば、市場はその後の介入への期待を実際に高め始めるでしょう。プラニート・シャー外国為替オプション取引責任者\nシャー氏は、米国側については、経済指標の冷え込みで米連邦準備理事会（ＦＲＢ）が追加利上げする根拠が弱まり、追加介入への賭けが復活することで円への圧力が緩和される可能性があると述べた。\nシャー氏は2024年7月を指摘し、日銀と財務省の介入の最も効果的なラウンドの1つが米国のCPIの失敗に見舞われ、その数日後に給与支払いの失敗がさらに悪化したと指摘した。\n同氏は「失敗したとしても、市場は今週後半に追加介入への期待を本格的に高め始めるだろう」と述べた。\n水曜日のインフレ報告は予想と一致した。 7月の消費者物価指数は季節調整済みで0.1％上昇し、コンセンサス予想と一致したが、年率は6月の3.5％から3.4％に鈍化した。発表後、国債利回りは低下した。",

    "id": "south-korea-s-kospi-swings-from-bear-to-7775c74d",
    "title": "South Korea's Kospi swings from bear to bull-market territory in just over a month on AI trade",
    "titleJa": "韓国のコスピ、AI取引でわずか1カ月余りで弱気相場から強気相場の領域に転落",
    "summaryJa": "AI貿易の世界的な復活が先月の歴史的な下落後の急激な回復を促進する中、韓国株は木曜日に反発し、ベンチマークのコスピをテクニカル強気相場に押し上げた。ＬＳＥＧのデータによると、コスピは序盤の取引で４％超急騰し、７月３０日の安値から約２３％まで反発した。",
    "bodyOriginal": "South Korean stocks rallied Thursday, lifting the benchmark Kospi into a technical bull market as a global revival in the AI trade fuels a sharp recovery after last month's historic sell-off.\nThe Kospi jumped over 4% in early trade, taking its rebound from its July 30 low to roughly 23%, data from LSEG showed.\nIndex heavyweights Samsung Electronics and SK Hynix led the gains, with the chip giants rising over 4% and 7%, respectively.\nInvestor appetite for technology hardware stocks is returning as the latest earnings from global tech giants point to continued heavy spending on artificial intelligence.\nThe latest leg of the Kospi's rebound has been fueled by renewed optimism over artificial-intelligence spending, helping revive interest in South Korea's heavyweight semiconductor stocks.\n\"The AI spending boom is far from over,\" David Morrison, senior market analyst at Trade Nation said in a note late Tuesday, pointing to strong results from U.S. AI-related companies. Supermicro and cloud provider CoreWeave surged overnight following better-than-expected results.\nThe developments have provided a fresh boost to Korean chipmakers, whose fortunes are closely tied to demand for the memory chips used in AI infrastructure. Samsung Electronics and SK Hynix have led the Kospi's advance, extending a sharp rebound from last month's technology-driven sell-off.\nThe rally in South Korean stocks has room to run further as strength returns to the country's heavyweight memory chipmakers, according to Fundstrat Global Advisors.\nMark Newton, the firm's head of technical strategy, said the iShares MSCI South Korea ETF has broken above a key technical level on the back of gains in Samsung Electronics and SK Hynix, improving the near-term outlook for Korean equities. The ETF's latest move confirmed a reversal pattern that Newton said \"looks attractive technically for further near-term gains.\"\nThe bigger signal may be coming from memory stocks themselves. After being among the hardest hit during the recent technology sell-off, memory shares are beginning to outperform the broader tech sector for the first time since June, Fundstrat said.\nNewton described that as \"a good sign in the short run for Memory within Technology,\" adding that the group appears to be one of the last major corners of tech to begin turning higher.\nThat matters for South Korea given the outsized influence of Samsung and SK Hynix on the country's equity market. Fundstrat said the combination of South Korea's rebound and the recovery in memory chips is broadening a rotation back into technology, even as some major U.S. tech names have struggled.\nNewton remains bullish on the market in the near term, although he cautioned that the rally could lose momentum later this month if U.S. Treasury yields and the dollar begin climbing again. For now, however, he said South Korea and memory stocks \"look to be the right vehicles for near-term risk-on exposure.\"",
    "bodyJa": "AI貿易の世界的な復活が先月の歴史的な下落後の急激な回復を促進する中、韓国株は木曜日に反発し、ベンチマークのコスピをテクニカル強気相場に押し上げた。\nＬＳＥＧのデータによると、コスピは序盤の取引で４％超急騰し、７月３０日の安値から約２３％まで反発した。\n指数の有力企業であるサムスン電子とSKハイニックスが上昇を主導し、半導体大手はそれぞれ4％と7％以上上昇した。\n世界的なハイテク大手の最新決算が人工知能への多額の支出が続いていることを示しているため、テクノロジー・ハードウェア株に対する投資家の意欲が戻ってきている。\nコスピの最近の反発は、人工知能への支出に対する新たな楽観的な見方によって促進され、韓国の有力半導体株への関心が再び高まっている。\nトレード・ネイションのシニア市場アナリスト、デービッド・モリソン氏は火曜日遅くのメモで、米国のAI関連企業の好調な業績を指摘し、「AI支出ブームはまだ終わっていない」と述べた。スーパーマイクロとクラウドプロバイダーのコアウィーブは予想を上回る業績を受けて一夜にして急騰した。\nこの開発は、AIインフラで使用されるメモリチップの需要と密接に運命を結び付けている韓国のチップメーカーに新たな後押しをもたらした。サムスン電子とSKハイニックスがコスピの躍進を主導し、先月のテクノロジー主導の下落からの急反発を延長した。\nファンドストラット・グローバル・アドバイザーズによると、韓国の有力メモリチップメーカーに力が戻り、韓国株の上昇はさらに進む余地があるという。\n同社のテクニカル戦略責任者マーク・ニュートン氏は、サムスン電子とSKハイニックスの上昇を背景にiシェアーズMSCI韓国ETFが重要なテクニカル水準を突破し、韓国株の短期的な見通しが改善したと述べた。 ETFの最新の動きは、ニュートン氏が「短期的なさらなる利益にとってテクニカル的に魅力的に見える」と述べた反転パターンを裏付けた。\nより大きなシグナルはメモリ株自体から発せられている可能性がある。ファンドストラット氏によると、メモリ株は最近のテクノロジー株下落で最も大きな打撃を受けたが、6月以来初めてハイテクセクター全体をアウトパフォームし始めているという。\nニュートン氏はこれを「メモリー・イン・テクノロジーにとって短期的には良い兆候」と表現し、このグループがテクノロジー分野で上昇傾向にある最後の主要な一角の1つであるようだと付け加えた。\n韓国の株式市場におけるサムスンとSKハイニックスの多大な影響力を考慮すると、これは韓国にとって重要だ。ファンドストラット氏は、米国の大手ハイテク企業の一部が苦戦しているにもかかわらず、韓国の景気回復とメモリチップの回復が相まってテクノロジー分野への回帰が拡大していると述べた。\nニュートン氏は目先の市場に対して依然として強気の姿勢を維持しているが、もし米国債利回りが低下しドルが再び上昇し始めれば、今月後半に上昇の勢いが失われる可能性があると警告した。ただ今のところ、韓国株とメモリー株は「短期的なリスクオン・エクスポージャーの適切な手段になりそうだ」と同氏は述べた。",

    "id": "oil-rises-on-worries-over-supply-disrupt-d328e1e8",
    "title": "Oil rises on worries over supply disruptions as spill near Oman worsens",
    "titleJa": "オマーン近郊での流出事故悪化による供給混乱への懸念から原油高",
    "summaryJa": "オマーン湾と紅海の最近の船舶への致命的な攻撃を受けて、木曜日には石油が上昇し、オマーン近郊での流出が拡大し続けたため。国際指標となるブレント原油先物（１０月渡し）は１．０１％上昇し、１バレル＝８８．０９ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は１．１５％上昇し、１バレル＝８２．３１ドルとなった。",
    "bodyOriginal": "Oil rose on Thursday recent deadly attacks on vessels in the Gulf of Oman and the Red Sea, and as a spill near Oman continued to spread.\nFutures for international benchmark Brent crude for October delivery gained 1.01% to $88.09 a barrel. U.S. West Texas Intermediate futures for September advanced 1.15% to $82.31 per barrel.\nOman's coastline has reportedly started to be affected by a massive oil spill caused by a leaking tanker that ran aground June 30 carrying an estimated 800,000 barrels of Russian oil and is under international sanctions, according to Reuters. It's leaking near a nature reserve that's home to wildlife including Arabian Sea humpback whales and Socotra cormorants, Reuters reported.\nMeanwhile, the International Energy Agency said Wednesday that global oil demand is set to fall further than previously expected this year, amid a deepening impact from the closure of the Strait of Hormuz.\n\"Renewed hostilities and maritime disruptions\" are undermining efforts to boost global oil supply, the IEA said. Supply remained 6.3 million barrels a day lower year-on-year in July.\nFurther, deadly attacks on vessels in the Gulf of Oman and the Red Sea have pushed worries over supply disruptions up another notch. While there are signs that diplomatic efforts toward reopening the Strait of Hormuz are ongoing, the over five-month-old war continues to disrupt energy flows.\n\"The lack of clarity over the possibility of a full reopening of the waterway could leave oil prices exposed to the upside at a time when the market remains tight,\" said Christopher Tahir, a senior market strategist at Exness, adding that any additional setbacks could drive oil prices further up.",
    "bodyJa": "オマーン湾と紅海の最近の船舶への致命的な攻撃を受けて、木曜日には石油が上昇し、オマーン近郊での流出が拡大し続けたため。\n国際指標となるブレント原油先物（１０月渡し）は１．０１％上昇し、１バレル＝８８．０９ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は１．１５％上昇し、１バレル＝８２．３１ドルとなった。\nロイター通信によると、オマーンの海岸線は、推定80万バレルのロシア産原油を積んで6月30日に座礁したタンカーの漏洩による大規模な原油流出の影響を受け始めており、国際制裁下にあると伝えられている。ロイター通信によると、アラビア海のザトウクジラやソコトラウなどの野生動物が生息する自然保護区付近で漏洩しているという。\n一方、国際エネルギー機関は水曜日、ホルムズ海峡閉鎖の影響が深刻化する中、今年の世界の石油需要は従来の予想よりもさらに減少する見通しであると発表した。\nＩＥＡは「敵対行為の再発と海洋混乱」が世界の石油供給拡大に向けた取り組みを台無しにしていると述べた。 ７月の供給量は前年同月比日量６３０万バレル減にとどまった。\nさらに、オマーン湾と紅海での船舶への致命的な攻撃により、供給混乱に対する懸念がさらに高まっています。ホルムズ海峡の再開に向けた外交努力が進行中の兆しがある一方で、5か月以上にわたる戦争によりエネルギーの流れは混乱し続けている。\nエクスネスのシニア市場ストラテジスト、クリストファー・タヒル氏は「水路の全面再開の可能性が不透明なため、市場が引き締まった状態が続く中、原油価格は上昇にさらされる可能性がある」と述べ、さらなる後退があれば原油価格はさらに上昇する可能性があると付け加えた。",

    "id": "inside-india-newsletter-why-global-funds-964b4c14",
    "title": "Inside India newsletter: Why global funds are flocking to GIFT City in Modi’s home state",
    "titleJa": "Inside India ニュースレター: なぜ世界の資金がモディ首相の故郷のギフトシティに集まるのか",
    "summaryJa": "こんにちは、シンガポールからメッセージを書いているプリヤンカ・サルベです。「インサイド・インディア」の最新版へようこそ。世界で最も急速に成長している大経済国のストーリーや展開をワンストップでご覧いただけます。",
    "bodyOriginal": "Hello, this is Priyanka Salve, writing to you from Singapore.\nWelcome to the latest edition of \"Inside India\" — your one-stop destination for stories and developments from the world's fastest-growing large economy.\nIndia's Gujarat International Finance Tec-City, also known as GIFT City, aspires to be what Hong Kong is to mainland China, or what Dubai International Financial Center is to the United Arab Emirates. While progress has been slow, after more than a decade of its launch, GIFT City is finally drawing interest from leading asset management firms.\nI spoke with experts to figure out if India's first and only global financial center is finally coming into its own.\nAny thoughts on today's newsletter? Share them with the team.\nThe big story\nA strong domestic investor appetite for global markets, relaxed rules for foreign currency usage, and increasing tax sops are driving leading asset management companies to India's GIFT City, more than a decade after its launch.\nGIFT City, located in Prime Minister Narendra Modi's home state of Gujarat, is emerging as an important gateway for international investors looking to access India's growth opportunity, as well as resident Indians seeking international wealth solutions, experts said.\nEarlier this year, the government improved tax structures to put GIFT City on par with global financial centers such as Singapore, said Rajesh Gandhi, Partner at Deloitte India.\nWhile these tax benefits are driving inbound investment, the government has also loosened capital controls on outbound investments made via the City, Gandhi said, adding that his firm was seeing an increase in outbound and inbound funds being set up in India's first global financial center.\nGlobal fund houses are waking up to the pent-up demand from Indian investors for overseas markets such as the U.S., and GIFT City offers the most convenient route, according to experts.\nGlobal interest\nLast week, Standard Chartered announced plans to launch its Signature CIO funds from GIFT City.\nSamir Subberwal, global head of wealth solutions, retail products, data and analytics at Standard Chartered, told CNBC that the company will launch the funds \"in the coming weeks\" and plans to expand its suite of wealth solutions over time.\nThe British international banking group was among the first foreign banks to start operating out of GIFT City in 2020. And with the launch of Signature CIO funds, it plans to expand its wealth management business in what Subberwal describes as \"one of the world's fastest-growing international financial centres.\"\nGovernment data shows that fund management entities in the city increased to 217 in May this year from 194 in November last year.\nAnother major global asset manager, BlackRock, through its joint venture with Indian billionaire Mukesh Ambani's Jio Financial Services, is looking to launch global ETFs out of GIFT City.\nJio BlackRock Asset Management, the joint venture company, secured regulatory approval to launch funds out of GIFT City in May.\nIt is preparing to start two outbound funds from the financial center before the end of September, one global equity fund and another emerging markets fund, Rishi Kohli, the firm's chief investment officer, told Moneycontrol — a news outlet part of Network18, which is owned by Ambani's Reliance Industries.\nDue to strong capital controls, there are limits on the funds that asset managers in India can deploy in overseas markets, experts said, pointing to the aggregate $7 billion ceiling on outbound investments, which has already been exhausted.\nAs a result, despite Indian markets underperforming their global peers by a wide margin, equity funds in India logged positive inflows for the 65th consecutive month, according to data from India's mutual fund industry body AMFI.\nBut funds operating from GIFT City can change that as the outbound investment limits do not apply to them, allowing these funds to tap the growing pool of Indian investors.\nLong road ahead\nBut despite these tailwinds, experts said that GIFT City has a long way to go before it can compete with global financial centers such as Singapore, Delaware in the U.S., and Dubai International Financial Center in the United Arab Emirates.\nFrom a regulatory aspect, GIFT City is on par with other global financial centers, but it needs to shed its image as an India-specific center and emerge as a destination for global capital. It also needs to match the lifestyle benefits that come with living in cities such as Dubai and Singapore.\nSome argue that it just needs \"more time\" to develop. DIFC took 20 years to become the powerhouse it is today, said Vivek Singhania, co-founder of Mumbai-based fund administration service provider Dovetail Capital. He told CNBC that regulatory structures at the GIFT City were formed around 2020, and now things are gradually coming together.\nSinghania said his firm is in discussions with a several U.S. and Singapore-based funds as well as Indian funds that are keen to set up operations in city.\nAmong those bullish on GIFT City is also Vikas Satija, managing director and chief executive at Shriram Wealth. His firm scouts for funds operating out of GIFT City for their \"high-net-worth clients\" in India and outside.\nHe predicts that by 2030, GIFT City will become a key global financial center and adds that the arrival of one of the largest global fund houses, BlackRock, is a \"big sign.\"\nNeed to know\nThe 72-hour crisis that threatened Meta's business in India\nTensions are high between Meta Platforms and Indian regulators. A parliamentary panel threatened to remove the tech giant's safe harbor protection last week, soon after after the company was pulled up over concerns about child-abuse content.\nU.S. judge ends graft case against Indian billionaire Gautam Adani\nA U.S. judge on Monday dismissed the bribery case against Indian billionaire Gautam Adani, while also rebuking a senior Department of Justice official's conduct related to the case as \"concerning.\"\nComing up\nAug. 14: India WPI inflation for July.\nAug. 17: India unemployment rate for July.",
    "bodyJa": "こんにちは、シンガポールからメッセージを書いているプリヤンカ・サルベです。\n「インサイド・インディア」の最新版へようこそ。世界で最も急速に成長している大経済国のストーリーや展開をワンストップでご覧いただけます。\nギフトシティとしても知られるインドのグジャラート国際金融テックシティは、中国本土にとっての香港、またはアラブ首長国連邦にとってのドバイ国際金融センターのような存在になることを目指しています。進歩は遅いものの、開始から 10 年以上が経ち、GIFT City はついに大手資産管理会社からの関心を集めています。\nインド初で唯一の世界金融センターがいよいよ本領を発揮しつつあるのかどうかを知るために、私は専門家に話を聞いた。\n今日のニュースレターについて何かご意見はありますか?それらをチームと共有します。\n大きな話\nグローバル市場に対する国内投資家の強い意欲、外貨使用に関する規制の緩和、税金の引き上げにより、立ち上げから10年以上が経った今、大手資産管理会社がインドのギフトシティに集まってきている。\n専門家らによると、ナレンドラ・モディ首相の地元グジャラート州にあるギフトシティは、インドの成長機会へのアクセスを求める国際投資家や、国際的な富の解決策を求める居住インド人にとっての重要な玄関口として浮上しているという。\nデロイト・インドのパートナー、ラジェシュ・ガンジー氏は、今年初めに政府はギフトシティをシンガポールなどの世界的な金融センターと同等の地位に置くために税制を改善したと述べた。\nこれらの税制優遇措置がインバウンド投資を促進している一方で、政府は市を通じて行われたアウトバウンド投資に対する資本規制も緩和しているとガンジー氏は述べ、彼の会社ではインド初の世界金融センターに設立されるアウトバウンドおよびインバウンドのファンドが増加していると付け加えた。\n専門家らによると、世界的なファンドハウスはインド人投資家による米国などの海外市場への積もり積もった需要に目覚めており、ギフトシティは最も便利なルートを提供しているという。\n世界的な関心\n先週、スタンダードチャータードはギフトシティからシグネチャーCIOファンドを立ち上げる計画を発表した。\nスタンダードチャータード社のウェルスソリューション、小売商品、データ、分析のグローバル責任者であるサミール・サブバーワル氏はCNBCに対し、同社は「今後数週間以内に」ファンドを立ち上げ、長期的にウェルスソリューションスイートを拡大する予定であると語った。\n英国の国際銀行グループは、2020年にギフトシティで営業を開始した最初の外国銀行の1つである。また、シグネチャーCIOファンドの立ち上げにより、サブバーウォル氏が「世界で最も急速に成長している国際金融センターの1つ」と表現するこの地域でウェルスマネジメント事業を拡大する計画だ。\n政府のデータによると、市内の資金管理団体は昨年11月の194社から今年5月には217社に増加した。\nもう一つの世界的大手資産運用会社ブラックロックは、インドの億万長者ムケシュ・アンバニ氏のジオ・ファイナンシャル・サービスとの合弁事業を通じて、ギフト・シティから世界的なETFを立ち上げようとしている。\n合弁会社の Jio BlackRock Asset Management は、5 月にギフト シティからファンドを立ち上げるための規制当局の承認を獲得しました。\n同社の最高投資責任者であるリシ・コーリ氏は、アンバニ氏のリライアンス・インダストリーズが所有するネットワーク18の一部報道機関であるマネーコントロールに対し、9月末までに金融センターから2つのアウトバウンドファンド、1つは世界株式ファンド、もう1つは新興市場ファンドを開始する準備を進めていると語った。\n専門家らは、強力な資本規制のため、インドの資産運用会社が海外市場に展開できる資金には制限があり、対外投資の総額上限は70億ドルで、すでに使い果たされていると指摘した。\nその結果、インドの投資信託業界団体AMFIのデータによると、インド市場のパフォーマンスが世界の市場を大幅に下回っているにもかかわらず、インドの株式ファンドは65カ月連続でプラスの流入を記録した。\nしかし、GIFT City で運営されているファンドには対外投資制限が適用されないため、この状況は変わる可能性があり、これらのファンドは増え続けるインドの投資家層を活用できるようになる。\n先は長い\nしかし専門家らは、こうした追い風にもかかわらず、ギフトシティがシンガポール、米国のデラウェア州、アラブ首長国連邦のドバイ国際金融センターなどの世界的な金融センターと競争できるようになるまでには長い道のりがあると述べた。\n規制の面から見ると、ギフトシティは他の世界的な金融センターと同等だが、インド特有のセンターというイメージを払拭し、世界資本の目的地として台頭する必要がある。また、ドバイやシンガポールなどの都市に住むことで得られるライフスタイルの利点と一致する必要もあります。\n開発には「もっと時間がかかる」だけだと主張する人もいる。ムンバイに本拠を置くファンド管理サービスプロバイダー、ダブテイル・キャピタルの共同創設者ヴィヴェク・シンハニア氏は、DIFCが今日の強大な企業になるまでに20年かかった、と語った。同氏はCNBCに対し、ギフトシティの規制体制は2020年頃に形成され、現在は徐々に整備されつつあると語った。\nシンガニア氏は、彼の会社が米国とシンガポールに本拠を置くいくつかのファンドや、市内での事業設立に熱心なインドのファンドと協議中であると述べた。\nギフト・シティに強気な見方をしている人の中には、シュリラム・ウェルスのマネージング・ディレクター兼最高経営責任者であるヴィカス・サティヤ氏もいる。彼の会社は、インド内外の「富裕層顧客」のためにギフトシティから活動するファンドをスカウトしている。\n同氏は、ギフトシティが2030年までに主要な世界金融センターになると予測し、最大の世界的ファンドハウスの1つであるブラックロックの到着は「大きな兆候」であると付け加えた。\n知っておく必要がある\nインドにおけるメタのビジネスを脅かした72時間の危機\nメタプラットフォームとインドの規制当局の間では緊張が高まっている。議会委員会は先週、同社が児童虐待コンテンツへの懸念を理由に引き上げられた直後、同社のセーフハーバー保護を解除すると脅迫した。\n米国の判事、インドの億万長者ゴータム・アダニに対する汚職訴訟を終結\n米国の判事は月曜日、インドの億万長者ゴータム・アダニ氏に対する贈収賄事件を却下する一方、この事件に関連した司法省高官の行為を「懸念事項」として非難した。\nもうすぐ\n8月14日: 7月のインドWPIインフレ。\n8月17日: インドの7月の失業率。",

    "id": "cerebras-stock-plunges-14-after-second-e-5022e2af",
    "title": "Cerebras stock plunges 14% after second earnings report following IPO",
    "titleJa": "IPO後の2回目の決算報告を受け、セレブラス株は14％急落",
    "summaryJa": "Cerebras Systems は、5 月の新規株式公開後の第 2 回決算報告で通期見通しを引き上げました。しかし、株価は延長取引で約１４％下落した。第 2 四半期の業績と LSEG のコンセンサス予測は次のとおりです。",
    "bodyOriginal": "Cerebras Systems raised its full-year guidance in the second earnings report following the chipmaker's initial public offering in May. But the stock tumbled about 14% in extended trading.\nHere's how it did in the second quarter versus LSEG consensus estimates:\n- Revenue: $180 million, versus $194 million expected\n- Loss per share: 5 cents adjusted, versus 17 cents expected\nCerebras said in a statement on Wednesday that it expects core revenue of between $214 million and $216 million this quarter.\nThe company raised its full-year outlook and now expects core revenue of between $880 million and $890 million, up from a prior range of $855 million to $865 million.\nThe $180 million sales figure for the second quarter represents total revenue. Cerebras also reported a core revenue figure of $210 million, which includes \"pass-through revenue.\"\nThe company recorded a net loss of $450.5 million, after finishing with a profit of $309.5 million, or $1.91 per share, a year earlier. Most of the loss is tied to stock-compensation costs of $386.6 million.\nCerebras CEO Andrew Feldman said in an interview that AI demand is \"through the roof\" and that companies are paying up for its specialty inference chips.\nCerebras is challenging AI chip leader Nvidia for some AI tasks, especially those that need \"low latency,\" or quick responses for interactivity. The company calls it \"fast inference.\" The company said its core gross margin will expand to between 38% and 40% in the current quarter, addressing a concern for investors.\n\"Gross margins are are in a good spot, and growing, because fast inference is priced at a premium,\" Feldman said in an interview, adding that Cerebras was able to increase the AI output of its systems.\nCerebras went public on the Nasdaq in May, capitalizing on investor interest in semiconductors that can run AI models. It priced its offering at $185 and raised $6.4 billion in the offering. The stock peaked in May and has fallen since, but closed on Wednesday at $262.06, up 42% from its IPO.\nThe chipmaker has $25.4 billion in remaining performance obligations, which it said was a sign of \"extraordinary future demand.\" Feldman said that as Cerebras grows, it will benefit from larger scale. The company also said it expects revenue to triple in the next fiscal year.\n\"We will manufacture more efficiently. We'll get better pricing on componentry. We'll amortize our manufacturing organization over more units,\" Feldman said. \"All of those point up and to the right.\"\nIn recent weeks, Cerebras announced a partnership with Nvidia rival Advanced Micro Devices, with products going into production later this year, and said that OpenAI can use its chips to serve its latest model, GPT 5.6 Sol. Cerebras also offers access to its chips through its cloud, which reported $126 million in revenue during the June quarter.\nWATCH: Cerebras sees OpenAI's chip competing with other GPUs",
    "bodyJa": "Cerebras Systems は、5 月の新規株式公開後の第 2 回決算報告で通期見通しを引き上げました。しかし、株価は延長取引で約１４％下落した。\n第 2 四半期の業績と LSEG のコンセンサス予測は次のとおりです。\n- 収益: 1 億 8,000 万ドル、予想 1 億 9,400 万ドル\n- 1 株当たりの損失: 調整後 5 セント、予想 17 セント\nセレブラスは水曜日の声明で、今四半期の中核収益は２億１４００万─２億１６００万ドルになると予想していると述べた。\n同社は通期の見通しを引き上げ、コア収益は従来の8億5,500万ドルから8億6,500万ドルの範囲から8億8,000万ドルから8億9,000万ドルになると予想している。\n第 2 四半期の 1 億 8,000 万ドルの売上高は、総収益を表します。 Cerebras はまた、「パススルー収益」を含むコア収益額が 2 億 1,000 万ドルであると報告しました。\n同社は前年同期に3億950万ドル（1株当たり1.91ドル）の利益を計上した後、4億5050万ドルの純損失を記録した。損失の大半は株式補償費用３億８６６０万ドルに関係している。\nセレブラスの最高経営責任者（CEO）アンドリュー・フェルドマン氏はインタビューで、AIの需要は「天井知らず」であり、企業は同社の専門推論チップに資金を支払っていると語った。\nCerebras は、一部の AI タスク、特に「低レイテンシー」または対話性のための素早い応答を必要とするタスクに関して、AI チップのリーダーである Nvidia に挑戦しています。同社はこれを「高速推論」と呼んでいる。同社は、今四半期の中核粗利益率が38％から40％に拡大すると述べ、投資家の懸念に対処した。\nフェルドマン氏はインタビューで「高速推論にはプレミアム価格が設定されているため、粗利益率は良好であり、伸びている」と述べ、セレブラス社は自社システムのAI出力を高めることができたと付け加えた。\nセレブラスはAIモデルを実行できる半導体に対する投資家の関心を利用して5月にナスダックに上場した。公募価格は185ドルで、公募で64億ドルを調達した。株価は5月に最高値を付け、その後下落したが、水曜日の終値はIPO比42％高の262.06ドルだった。\n同社は254億ドルの履行義務を残しているが、これは「将来の異常な需要」の兆しであると同社は述べた。フェルドマン氏は、セレブラスが成長するにつれ、規模が大きくなることで恩恵を受けるだろうと述べた。同社は来年度の売上高が3倍になるとの見通しも示した。\n「私たちはより効率的に製造します。部品の価格も安くなります。製造組織をより多くのユニットで償却します」とフェルドマン氏は語った。 「それらはすべて上と右を向いています。」\nここ数週間、Cerebras は Nvidia のライバルである Advanced Micro Devices との提携を発表し、今年後半に製品の生産が開始され、OpenAI は同社のチップを使用して最新モデル GPT 5.6 Sol を提供できると述べました。 Cerebras はクラウド経由でチップへのアクセスも提供しており、6 月四半期の収益は 1 億 2,600 万ドルと報告されています。\n注目: Cerebras は OpenAI のチップが他の GPU と競合していると見ている",

    "id": "why-japanese-firms-are-being-so-slow-to-9eeca766",
    "title": "Why Japanese firms are being so slow to use AI",
    "titleJa": "日本企業のAI活用が遅れている理由",
    "summaryJa": "日本企業のAI活用が遅れている理由- 公開されました",
    "bodyOriginal": "Why Japanese firms are being so slow to use AI\n- Published\nFacing acute labour shortages, ageing demographics and chronic productivity problems, Japanese companies should be fertile ground for the take-up of artificial intelligence (AI). Yet, compared with the US and UK, adoption in many workplaces remains sluggish and cautious.\nJapan's response to AI is beginning to resemble one of the country's slow-moving, traditional Noh plays.\nAll the masked characters up on stage agree that action is urgent, and the call is repeated with solemn agreement. Yet the actors remain frozen in place.\nGreat for heightening drama, terrible for addressing the country's immediate difficulties.\nData showing the use of AI in the workplace suggests that Japan has fallen behind. Just 8.4% of Japanese workers use AI as part of their job, according to a report, external at the end of last year by the Organisation for Economic Co-operation and Development (OECD).\nBy contrast, separate statistics puts the US figure at 50%,, external and the UK at 32%., external In Singapore, which is said to have seen the second-highest, external take up of AI after the United Arab Emirates, and the most in Asia, 56% of workers are said to use AI \"multiple times a week\"., external\nUS and Japan take action to prop up yen in rare joint move\n- Published3 August\nSo why is Japan dragging its feet? Austin Xu, co-founder of US start-up Kuse AI, says it is due to Japanese companies being conservative and risk adverse. His business recently set up an office in Japan to sell its AI systems to firms in the country.\n\"There are organisations where process and consensus culture genuinely slow things down,\" he says. \"Where tolerance for AI mistakes is close to zero, especially in anything client facing. Some would rather leave a role unfilled than let a machine handle it.\"\nXu says the situation in the US is very different, with some businesses already allowing AI agents far more freedom to boost productivity. \"In the US, AI colleagues enter as helpers and gradually become part of the workflow. The attitude [of US bosses] is often - let it try, then correct it.\"\nHe adds that Japanese companies need more proof before they trust AI enough to use it.\nParrisa Haghirian, professor of international management at the Kyoto University of Advanced Science, agrees that many Japanese companies are too risk adverse to look at AI.\n\"The challenges of adopting it are the same as adopting any change in Japanese firms. This is why AI use is still quite limited and cautious, especially in the workplace.\"\nHaghirian also contrasts this with the more entrepreneurial culture of the US, arguing that Japanese firms are highly sensitive to error, uncertainty and reputational risk.\n\"Since generative AI is still not fully reliable, it is mainly used [in Japan] for low-risk tasks such as writing, summarising, or information gathering, but much less for core operations or decision-making and for improving overall processes,\" she says.\nJapan's healthcare sector is said to be particularly slow to look at AI, with some hospitals yet to even fully digitalise patient files. \"Paper documents accumulate at a staggering scale,\" says one employee at a Japanese hospital, who asked not to be named. \"It's like the Stone Age.\"\nThe Japanese government is aware of the wider problem of low AI adoption, and is trying to get more companies to take up the technology. Last year its AI Promotion Act was passed, external by the country's parliament.\nThis aims to use light-touch regulation to encourage businesses to invest more in AI. Tokyo pledges that Japan will become \"the world's most-friendly country for developing and utilizing AI\".\nThe government believes that the increased use of AI can help Japan improve its productivity. Currently it continues to have the worst level, external in the G7 group of advanced nations.\nJapan's Ministry of Finance says that AI adoption by businesses has already increased substantially,, external with 75% of companies now using the technology, up from 11% five years ago.\nHowever, critics argue that at each of these businesses only a tiny proportion of staff are actually using the AI, and that those who do so are only using it to a very limited extent.\nProf Yasushi Ogasawara, an expert on Japan's social system and technology at Meiji University, says there aren't enough tech-savvy people in the workforce.\n\"Although the Japanese like playing with gadgets such as smartphones, digital literacy is low here,\" he says.\nThis is highlighted by one report earlier this year which said Japan faced a shortfall , externalof almost 800,000 IT professionals by 2030.\nMany companies are also said to struggle with out-of-date computer systems, with around 60% more than 20-years-old.\nMoreover, Ogasawara adds that Japanese companies are under more pressure to avoid fuelling unemployment than they are to develop AI which could result in job losses.\n\"The government is talking about AI, re-skilling, digital skills, but in reality, it is difficult to adapt human resources to digital skills because the top priority is to maintain full employment,\" he says.\nBut there is a shift in recruitment, with some companies now prioritising \"AI literacy\" in their new graduate hiring.\nIn the private sector, larger firms such as Kanematsu, a major general trading company, are hiring savvy graduates such as Uta Yamaguchi who joined in April.\n\"I use AI quite often at work,\" she says. \"Many of my colleagues use it a lot. For writing emails for my boss, summarising complicated documents, meeting recording and summarising.\"\nBut, by contrast with the US, she says AI systems that can autonomously handle multi-step work are still virtually unheard of in Japan.\nHowever, her employer, known for its forward thinking, now has them onboard.\nOgasawara says that \"change in Japan is limited\". He adds: \"Japanese society expects painless reform, so I think it can be said that drastic reform is difficult, to say the least.\"\nDisruption may be a dirty word in Japan, but without it the productivity gains the country needs could remain elusive.",
    "bodyJa": "日本企業のAI活用が遅れている理由\n- 公開されました\n深刻な労働力不足、人口の高齢化、慢性的な生産性の問題に直面している日本企業は、人工知能（AI）を導入するための肥沃な土壌となるはずです。しかし、米国や英国と比較すると、多くの職場での導入は依然として鈍く、慎重です。\nAIに対する日本の対応は、ゆっくりとした動きの伝統的な能劇に似てきている。\nステージ上の仮面をかぶった登場人物全員が行動が緊急であることに同意し、厳粛な同意のもとに呼びかけが繰り返される。それでも俳優たちはその場に固まったままだ。\nドラマを盛り上げるには素晴らしいが、この国の当面の困難に対処するには最悪だ。\n職場での AI の使用を示すデータは、日本が遅れをとっていることを示唆しています。経済協力開発機構（OECD）が昨年末発表した外部報告書によると、仕事の一部としてAIを利用している日本の労働者はわずか8.4％だという。\n対照的に、別の統計によると、米国の対外利用率は 50%、英国は 32% となっています。外部からの AI の導入率はアラブ首長国連邦に次いで 2 番目に高く、アジアでは最も多いと言われているシンガポールでは、労働者の 56% が AI を「週に複数回」使用していると言われています。\n米国と日本、異例の共同行動で円を下支えする措置を講じる\n- 8 月 3 日発行\nでは、なぜ日本は足を引っ張っているのでしょうか？米国の新興企業Kuse AIの共同創設者であるオースティン・シュー氏は、その原因は日本企業が保守的でリスク回避的であるためだと語る。彼のビジネスは最近、自社の AI システムを日本の企業に販売するために日本に事務所を設立しました。\n「プロセスとコンセンサスの文化が本当に物事を遅らせている組織があります」と彼は言います。 「特にクライアントが直面するあらゆる分野において、AI のミスに対する許容度はゼロに近い。機械に任せるよりも、役割を満たさないままにしておくことを好む人もいる。」\nXu氏は、米国の状況は大きく異なり、一部の企業ではすでにAIエージェントにはるかに自由に生産性を向上させることを許可していると述べた。 「米国では、AI の同僚がヘルパーとして入ってきて、徐々にワークフローの一部になっていきます。[米国の上司の] 態度は、多くの場合、試してみてから修正するというものです。」\n同氏は、日本企業がAIを十分に信頼して使用する前に、より多くの証拠が必要だと付け加えた。\n京都先端科学大学の国際経営学教授パリサ・ハギリアン氏も、多くの日本企業はリスクをあまりにも回避しすぎてAIに注目できないことに同意する。\n「AIを導入する際の課題は、日本企業に何らかの変化を導入する場合と同じです。これが、AIの使用が、特に職場において依然としてかなり限定的で慎重である理由です。」\nハギリアン氏はまた、これを米国のより起業家精神に富んだ文化と対比し、日本企業は誤り、不確実性、風評リスクに対して非常に敏感であると主張した。\n「生成型 AI はまだ完全に信頼できるわけではないため、（日本では）主に執筆、要約、情報収集などのリスクの低いタスクに使用されていますが、中核的な業務や意思決定、プロセス全体の改善にはあまり使用されていません」と彼女は言います。\n日本の医療分野はAIへの取り組みが特に遅れていると言われており、病院によっては患者ファイルを完全にデジタル化さえしていないところもある。 「紙の文書は驚くべき規模で蓄積されている」と日本の病院の職員の一人は匿名を条件に語る。 「石器時代のようだ。」\n日本政府はAIの導入率が低いという広範な問題を認識しており、より多くの企業にこのテクノロジーを導入してもらおうとしている。昨年、同国の議会の外で AI 推進法が可決されました。\nこれは、軽い規制を利用して企業の AI への投資を促進することを目的としています。東京都は、日本が「世界で最もAIの開発と活用に優しい国」となることを約束する。\n政府は、AIの利用拡大が日本の生産性向上に役立つと考えている。現在も先進国G7の中で最悪の水準が続いている。\n日本の財務省は、企業による AI の導入はすでに大幅に増加しており、現在では 75% の企業がこのテクノロジーを使用しており、5 年前の 11% から増加していると述べています。\nしかし、批評家たちは、これらの各企業で実際に AI を使用しているスタッフはほんの一部であり、使用しているスタッフも非常に限られた範囲でしか使用していない、と主張しています。\n日本の社会システムとテクノロジーの専門家である明治大学の小笠原泰教授は、労働力の中でテクノロジーに精通した人材が十分ではないと言う。\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "id": "trump-says-karoline-leavitt-resigning-as-2f5f78bd",
    "title": "Trump says Karoline Leavitt resigning as White House press secretary",
    "titleJa": "トランプ大統領、キャロライン・レビット氏がホワイトハウス報道官を辞任と発言",
    "summaryJa": "ドナルド・トランプ大統領は水曜日、キャロライン・レビット大統領報道官が8月末までにそのポストを離れると発表した。レビット氏の辞任は、5月1日の娘の誕生に伴い産休を経てホワイトハウスに復帰してから1カ月も経たないうちに発表された。",
    "bodyOriginal": "White House Press Secretary Karoline Leavitt will leave that post by the end of August, President Donald Trump said on Wednesday.\nLeavitt's departure was announced less than a month after she returned to the White House after having been on maternity leave for the birth of her daughter on May 1.\nLeavitt, 28, is resigning \"so she can spend more time with her beautiful young children and family, a decision I totally understand and respect!\" Trump said in a Truth Social post announcing her planned departure.\nThe president said that Leavitt will become \"one of my top outside advisors\" and work with the Republican Party to win the upcoming midterm elections in November.\nLeavitt, who has served as White House press secretary since Trump returned to the White House in January 2025, has two young children with her husband, real estate developer Nicholas Riccio.\nShe gave birth to her daughter, Viviana, on May 1, days after going on maternity leave.\nLeavitt returned to the White House for a press briefing on July 16.\nIn a post on X on Wednesday, Leavitt said, \"Being a mother and welcoming a new baby while working in one of the most demanding jobs in the world has been the most rewarding yet challenging season of my life, to say the least.\"\n\"The truth is since returning to the White House after the birth of my daughter, I have felt in my heart that I cannot be the best mom my two young children deserve while devoting the constant time, energy, and attention required of the White House Press Secretary — and that is why I have ultimately made the bittersweet decision to depart the White House and embark on a new chapter in my life,\" she wrote.\nLeavitt is the youngest White House press secretary ever.\nTrump had four White House press secretaries during his first term, from January 2017 to January 2021.\n— CNBC's Ryan Ruggiero contributed to this article",
    "bodyJa": "ドナルド・トランプ大統領は水曜日、キャロライン・レビット大統領報道官が8月末までにそのポストを離れると発表した。\nレビット氏の辞任は、5月1日の娘の誕生に伴い産休を経てホワイトハウスに復帰してから1カ月も経たないうちに発表された。\n28歳のリービット氏は「美しい幼い子供たちや家族とより多くの時間を過ごすため、その決断を私は完全に理解し、尊重します！」と辞任する。トランプ大統領は、辞任計画を発表する真実ソーシャルへの投稿でこう述べた。\n大統領は、レビット氏が「私の最高の外部顧問の一人」となり、11月に予定される中間選挙での勝利に向けて共和党と協力すると述べた。\n2025年1月にトランプ大統領がホワイトハウスに復帰して以来、ホワイトハウス報道官を務めているレビット氏には、不動産開発業者の夫ニコラス・リッチョ氏との間に2人の幼い子供がいる。\n彼女は産休に入った数日後の5月1日に娘のヴィヴィアナを出産した。\nレビット氏は7月16日に記者会見のためホワイトハウスに戻った。\n水曜日のX誌への投稿で、レビットさんは「世界で最も厳しい仕事の一つに就きながら母親となり、生まれたばかりの赤ちゃんを迎えることは、控えめに言っても私の人生で最もやりがいのある、しかし挑戦的な季節だった」と述べた。\n「実のところ、娘の出産後にホワイトハウスに戻って以来、私はホワイトハウス報道官に求められる絶え間ない時間、エネルギー、配慮を費やしながら、幼い二人の子供たちにとってふさわしい最高の母親にはなれない、と心の中で感じてきたのです。だからこそ私は最終的にホワイトハウスを去り、人生の新たな章に乗り出すという苦い決断を下したのです」と彼女は書いた。\nレビット氏はホワイトハウス報道官としては史上最年少である。\nトランプ大統領の1期目（2017年1月から2021年1月）には4人のホワイトハウス報道官がいた。\n— CNBC の Ryan Ruggiero がこの記事に寄稿しました",

    "title": "U.S. budget deficit surged in July to highest level since March 2021",
    "titleJa": "7月の米財政赤字は2021年3月以来の高水準に急増",
    "summaryJa": "財務省は水曜、メディケア費用の高騰と連邦債務の金利が国の財政状況を圧迫し続ける中、米国の財政赤字が月次で過去５年以上で最高水準に急増したと報告した。単月の大幅な増加に加え、政府会計年度の最初の 10 か月間の赤字総額は 1 兆 8,000 億ドル近くに増加し、2025 年の同時期を上回りました。",
    "bodyOriginal": "The U.S. budget deficit soared to its highest monthly level in more than five years amid a surge in Medicare costs and as interest on the federal debt continued to weigh on the nation's fiscal picture, the Treasury Department reported Wednesday.\nIn addition to the big single-month jump, the collective red ink across the first 10 months of the government's fiscal year rose to nearly $1.8 trillion and surpassed the same period in 2025.\nThe July shortfall totaled $432.3 billion, up some 48% from the same period a year ago and the largest monthly deficit since March 2021.\nMedicare expenses for the month totaled $174 billion, up from $103 billion in June and now at $955 billion for the full year. It was the single largest expenditure in July, well ahead of the $141 billion spent on Social Security and $104 billion in net interest on the national debt.\nTariff refunds also hit the budget, costing $33 billion as the administration continues to provide rebates for levies that the Supreme Court ruled illegal. Additionally, the budget took a $99 billion hit because the first of the month was a nonbusiness day, accelerating various benefits outlays as well as Supplemental Security Income and Medicare payments.\nDebt financing for the full year is behind only Social Security and Medicare as a proportion of government expenses. For the fiscal year to date, the U.S. has paid out $1.17 trillion on the $39.9 trillion national debt, of which $32.1 trillion is held by the public. Debt servicing costs in the same period a year ago totaled $1.01 trillion. Net interest, or the Treasury's gross interest minus the interest it receives, totaled $931 billion.\nPresident Donald Trump for years had been pressing the Federal Reserve to lower benchmark interest rates as a way to reduce debt costs. He has held off on criticizing the central bank since his nominee, Kevin Warsh, took over as chairman in May.\nUntil recently, markets had been looking for the Fed to raise rates to control inflation that has been running above the central bank's 2% target for more than five years. However, recent benign inflation data and a soft payroll reports have tempered those expectations, though futures traders aren't pricing in any chance of a rate cut for the next five years.",
    "bodyJa": "財務省は水曜、メディケア費用の高騰と連邦債務の金利が国の財政状況を圧迫し続ける中、米国の財政赤字が月次で過去５年以上で最高水準に急増したと報告した。\n単月の大幅な増加に加え、政府会計年度の最初の 10 か月間の赤字総額は 1 兆 8,000 億ドル近くに増加し、2025 年の同時期を上回りました。\n７月の不足額は総額４３２３億ドルで、前年同期比約４８％増加し、月間赤字としては２０２１年３月以来の大きさとなった。\n同月のメディケア費用は総額1,740億ドルと、6月の1,030億ドルから増加し、通年では9,550億ドルとなった。これは７月の単独支出としては最大で、社会保障費の１４１０億ドルや国債の純利息の１０４０億ドルを大きく上回った。\n政府が最高裁判所が違法と判断した賦課金に対するリベートを提供し続けているため、関税還付も予算に打撃を与え、330億ドルの費用がかかった。さらに、月初が休業日だったために予算は990億ドルの打撃を受け、追加保障収入やメディケアの支払いだけでなく、さまざまな給付金の支出も加速した。\n通期の国債による資金調達は、政府支出に占める割合としては社会保障とメディケアのみを下回っている。これまでの会計年度において、米国は39.9兆ドルの国債に対して1.17兆ドルを返済しており、そのうち32.1兆ドルは国民が保有している。前年同期の債務返済費は総額１兆０１００億ドルだった。純利子、つまり財務省の総利子から受け取った利子を引いた総額は９３１０億ドルとなった。\nドナルド・トランプ大統領は何年にもわたって、債務コストを削減する方法として連邦準備制度理事会に基準金利を引き下げるよう圧力をかけてきた。同氏は、5月に自身の候補者であるケビン・ウォーシュ氏が議長に就任して以来、中銀批判を控えている。\n市場は最近まで、５年以上にわたり中銀の目標である２％を上回って推移しているインフレを抑制するため、ＦＲＢが利上げを行うことを期待していた。しかし、先物トレーダーらは今後５年間の利下げの可能性を織り込んでいないものの、最近の良好なインフレ統計や軟調な雇用統計がこうした期待を和らげている。",

    "title": "SpaceX short sellers are running out of bullets as stock rebounds more than 40% off low",
    "titleJa": "株価が安値から40％以上反発する中、スペースXの空売り業者は弾切れを起こしている",
    "summaryJa": "新規公開株がIPO後の低迷から立ち直るのと同じように、スペースXに賭けていた空売り家は急速に取引から撤退している。S3パートナーズによると、スペースXへの空売り金利は水曜日、同社の上場株式の約11％に低下し、先週のピークの34％から大幅に低下した。この下落は、弱気の投資家がポジションを手仕舞いしたことと、最初の大型ロックアップ期限切れ後の株式の取引可能株数の大幅な拡大を反映している。",
    "bodyOriginal": "Short sellers betting against SpaceX are rapidly retreating from the trade, just as the newly public stock rebounds from its post-IPO slump.\nShort interest in SpaceX fell to about 11% of the company's publicly traded shares Wednesday, down sharply from a peak of 34% last week, according to S3 Partners. The decline reflects a combination of bearish investors closing out positions and a significant expansion of the stock's tradable float following the first major lockup expiration.\n\"Shorts that wanted to short are out of bullets,\" said Ihor Dusaniwsky, managing director of predictive analytics at S3 Partners. \"Only so much money you can put into a trade.\"\nThe exodus came as SpaceX shares staged a sharp rebound from their post-earnings sell-off, with short covering potentially adding fuel to the advance. Investors closing bearish positions must buy back shares, which can amplify upward moves when a stock is already rallying.\nShares jumped 11% Wednesday to around $148, lifting the stock about 10% above its $135 initial public offering price and roughly 41% above its Aug. 3 low.\nSpaceX has endured a roller-coaster ride since going public. The stock initially tumbled after the rocket and satellite company disclosed in its first earnings report last week that capital expenditures were more than twice its revenue, fueling concerns about the enormous spending required to fund its ambitions.\nThe sell-off attracted a wave of short sellers, pushing short interest to unusually elevated levels relative to the stock's limited public float. Short selling involves borrowing shares and selling them in hopes of buying them back later at a lower price.\nThat dynamic changed substantially last Thursday, when just over 911 million SpaceX shares became eligible for trading following the expiration of an initial lockup period. The newly unlocked tranche represented roughly 7% of the company's shares outstanding and exceeded the 639 million shares sold in the IPO.\nThe larger float mechanically reduced short interest as a percentage of tradable shares. But short covering has also contributed to the decline, according to S3, as investors who had wagered against SpaceX bought back stock to exit their positions.\nMore supply is coming. On Aug. 20, another 319 million shares could unlock, followed by roughly 700 million in September and close to that number in October, according to the prospectus.\nThe additional shares could create fresh volatility by giving employees and early investors more opportunities to sell. At the same time, the larger float would make it easier for investors to establish new short positions if bearish sentiment returns.",
    "bodyJa": "新規公開株がIPO後の低迷から立ち直るのと同じように、スペースXに賭けていた空売り家は急速に取引から撤退している。\nS3パートナーズによると、スペースXへの空売り金利は水曜日、同社の上場株式の約11％に低下し、先週のピークの34％から大幅に低下した。この下落は、弱気の投資家がポジションを手仕舞いしたことと、最初の大型ロックアップ期限切れ後の株式の取引可能株数の大幅な拡大を反映している。\nS3パートナーズの予測分析担当マネジングディレクター、イホル・ドゥサニウスキー氏は「ショートを希望していたショートは弾切れだ」と語った。 「取引に投入できる金額は限られている。」\nこの流出は、スペースX株が決算後の急落から急反発を示し、ショートカバーが上昇に拍車をかける可能性がある中で起こった。弱気ポジションを解消した投資家は自社株を買い戻さなければならず、株価がすでに上昇しているときに買い戻しを行うと上昇の動きがさらに増幅される可能性がある。\n水曜日の株価は11％上昇して約148ドルとなり、初公開価格の135ドルを約10％上回り、8月3日の安値を約41％上回った。\nスペースXは上場以来、ジェットコースターのような状況に耐えてきた。ロケット・人工衛星会社が先週の最初の決算報告で、設備投資が売上高の2倍以上であることを明らかにし、その野望に資金を提供するために必要な巨額の支出に対する懸念が高まった後、株価は当初下落した。\nこの下落により空売りの波が集まり、株式の限られた公開株と比較して空売り金利が異常に上昇した。空売りでは、株式を借りて、後で低い価格で買い戻すことを期待して売却します。\nこの力関係は先週の木曜日に大きく変わり、最初のロックアップ期間の終了後、9億1,100万株強のSpaceX株が取引適格になった。新たにロックが解除されたトランシェは同社の発行済み株式の約7％に相当し、IPOで販売された6億3,900万株を上回った。\n浮動株が大きくなると、取引可能な株式の割合として空売り金利が機械的に減少します。しかし、S3によれば、スペースXに賭けていた投資家がポジションを解消するために株を買い戻したため、ショートカバーも下落の一因となったという。\nさらに多くの供給が来ています。目論見書によると、8月20日にはさらに3億1,900万株がロック解除され、9月には約7億株、10月にはその数に近づく可能性があるという。\n株式の追加により、従業員や初期の投資家にさらなる売却機会が与えられ、新たなボラティリティが生じる可能性がある。同時に、浮動株が大きくなったことで、弱気なセンチメントが戻った場合、投資家は新たなショートポジションを確立しやすくなるだろう。",

    "titleJa": "「誰も望んでいない」：サイクロスポラが消費者を恐怖に陥れ、レタス価格が記録的な急落",
    "summaryJa": "複数の州でのシクロスポラの発生により、飲食店が葉物野菜を避けるようになり、7月にレタスの価格が急騰した。米労働統計局が水曜日に発表した季節調整済みデータによると、野菜の価格は6月から16.4％下落し、1カ月としては過去最大の下落となった。レタスもまた、7月に消費者物価指数の食品カテゴリー内で前月比で最も急激な下落を記録し、期間中に全体の価格が0.1％上昇した。",
    "bodyOriginal": "Lettuce prices cratered in July as the multistate cyclospora outbreak pushed diners to shun the leafy green.\nPrices for the vegetable tumbled 16.4% from June, the largest one-month decline on record, according to seasonally adjusted data released Wednesday by the Bureau of Labor Statistics. Lettuce also posted the sharpest month-over-month deflation within the consumer price index's food category in July, which saw overall prices tick up 0.1% in the period.\n\"It's very likely due to the cyclospora outbreak and consumers just not wanting to buy lettuce right now,\" said Jeremy Horpedahl, an associate economics professor at the University of Central Arkansas. The \"consumer is just wanting to stay away from this product.\"\nJuly's declines pulled lettuce prices off all-time highs posted this summer. But lettuce prices are still up around 7.5% in July compared with a year ago, more than double the pace of price growth seen across the closely followed CPI basket.\nLettuce's runup before this month was driven by the Iran war boosting fertilizer prices and President Donald Trump's mass deportations resulting in increased labor costs for U.S. farms.\nThis recent boom-and-bust price cycle may remind consumers of the cost fluctuations in eggs over recent years, Horpedahl said. While prices initially surged as the bird flu drove down supply, costs have since fallen drastically this year.\nThe Food and Drug Administration called out iceberg lettuce processed at a Taylor Farms facility in central Mexico as the likely ground zero for the waterborne parasite's recent spread. Taylor Farms voluntarily recalled products coming from that location.\nSeveral chains with lettuce in menu items reported a drop in traffic due to consumer concerns about the outbreak, even if they didn't have contaminated supplies.\nCava CEO Brett Schulman told CNBC on Wednesday that there were \"broader consumer concerns\" around leafy greens and fresh produce that affected near-term sales around the end of its second quarter. But the Mediterranean fast-casual chain's executive said sales trends have begun to rebound.\nSweetgreen said last week that it saw reduced demand as a result of the outbreak and that it was not sure when a recovery would take place. The salad chain lowered its full-year outlook, leading investors to sell shares following the report.\nChipotle said that cyclospora created a sales impact of around 2 percentage points in the back half of July. On a call late last month, executives reassured analysts that its lettuce supply wasn't affected and that the burrito chain had a \"very robust\" program for food safety.\nYum Brands CEO Chris Turner said in late July that the outbreak — which the Food and Drug Administration first connected to lettuce served at its Taco Bell chain — resulted in a \"meaningful near-term sales impact.\" But Turner said sales had been \"steadily improving.\"\nDollar sales of prepackaged salads plunged 14% during the four weeks ended July 25 compared with the year-ago period, according to NielsenIQ.\nOn the surface, Horpedahl said sharp price declines in lettuce would be viewed as good news for shoppers grappling with years of higher-than-preferred inflation levels. But he said that consumers likely won't be taking advantage of the cost reductions to the fullest extent given continued worries around food safety amid the outbreak, which has sickened thousands.\n\"Consumers are not going to rush out and buy this now just because it's cheaper,\" Horpedahl said. \"It's fallen because nobody wants it.\"\n— CNBC's Amelia Lucas contributed reporting.",
    "bodyJa": "複数の州でのシクロスポラの発生により、飲食店が葉物野菜を避けるようになり、7月にレタスの価格が急騰した。\n米労働統計局が水曜日に発表した季節調整済みデータによると、野菜の価格は6月から16.4％下落し、1カ月としては過去最大の下落となった。レタスもまた、7月に消費者物価指数の食品カテゴリー内で前月比で最も急激な下落を記録し、期間中に全体の価格が0.1％上昇した。\nセントラル・アーカンソー大学の経済学准教授、ジェレミー・ホーペダール氏は、「円胞子虫の発生と消費者が今はレタスを買いたがらないことが原因である可能性が非常に高い」と述べた。 「消費者はこの製品から距離を置きたいだけです。」\n7月の下落により、レタスの価格は今夏の史上最高値から下がった。しかし、7月のレタス価格は依然として1年前と比べて約7.5％上昇しており、これは直近のCPIバスケット全体で見られる価格上昇ペースの2倍以上である。\n今月以前のレタスの高騰は、イラン戦争による肥料価格の高騰とドナルド・トランプ大統領の大量国外追放により米国農場の人件費が上昇したことが要因だった。\n最近の好不況の価格サイクルは、消費者に近年の卵の価格変動を思い出させるかもしれない、とホルペダール氏は述べた。当初は鳥インフルエンザの影響で供給が減少したため価格が急騰したが、今年に入ってコストは大幅に低下した。\n食品医薬品局は、メキシコ中部にあるテイラー・ファームズの施設で加工されたアイスバーグ・レタスが、この水系寄生虫の最近の蔓延の震源地である可能性が高いと指摘した。テイラー・ファームズは、その場所で生産された製品を自主的に回収した。\nメニュー項目にレタスを含むいくつかのチェーン店は、たとえ汚染された供給品を持っていなかったとしても、流行に対する消費者の懸念により客足が減少したと報告した。\nCavaの最高経営責任者（CEO）ブレット・シュルマン氏は水曜日、CNBCに対し、葉物野菜や生鮮食品に関して「広範な消費者の懸念」があり、第2四半期末ごろの短期的な売上に影響を与えたと語った。しかし、このファストカジュアルチェーンのメディテラニアン幹部は、売上傾向が回復し始めていると語った。\nスイートグリーンは先週、感染拡大の影響で需要が減少しており、いつ回復するかは不透明だと述べた。サラダチェーンは通年の見通しを下方修正し、報道を受けて投資家が株を売った。\nチポトレ氏は、シクロスポラが7月後半に約2パーセントポイントの売上に影響を与えたと述べた。幹部らは先月下旬の電話会議で、レタスの供給には影響はなく、ブリトーチェーンには食品の安全性について「非常に強力な」プログラムがあるとアナリストを安心させた。\nヤム・ブランズの最高経営責任者（CEO）クリス・ターナー氏は7月下旬、今回の感染拡大（食品医薬品局が最初に同社のタコベル・チェーンで提供するレタスに関係したもの）が「短期的には売上に重大な影響」をもたらしたと述べた。しかしターナー氏は、売り上げは「着実に改善している」と述べた。\nニールセンIQによると、7月25日までの4週間で、包装済みサラダのドル建て売上高は前年同期比で14％減少した。\nホルペダール氏は、レタスの価格急落は、長年にわたって望ましいインフレ水準を上回っていて苦戦している買い物客にとって、表面上は朗報とみなされるだろうと述べた。しかし同氏は、数千人が病気になっている感染拡大の中で食品の安全性をめぐる懸念が続いていることを踏まえると、消費者はコスト削減を最大限に活用しない可能性が高いと述べた。\n「消費者は、安いからといって今すぐこれを急いで買うつもりはない」とホーペダール氏は語った。 「誰も望んでいないから落ちてしまったのです。」\n— CNBC のアメリア・ルーカスが報道に貢献しました。",

    "titleJa": "2026 年 7 月のインフレの内訳を 1 つのグラフで示します",
    "summaryJa": "7 月の消費者物価は 6 月の反動で上昇しましたが、エネルギーが 1 年前より大幅に高かったにもかかわらず、インフレは概ね鈍化していることが示されました。労働統計局が水曜日に発表したところによると、インフレのバロメーターである消費者物価指数は12カ月前に比べて3.4％上昇した。",
    "bodyOriginal": "Consumer prices rose in July — a reversal of the pullback in June — but showed inflation broadly moderating, even as energy remained sharply higher than a year ago.\nThe consumer price index, an inflation barometer, was up 3.4% from 12 months earlier, the Bureau of Labor Statistics said Wednesday.\nThat's down slightly from 3.5% in June, which marked the first decline in the annual inflation rate since January, before the war between the U.S. and Iran erupted Feb. 28.\n\"I thought it was a very benign report, right down the strike zone,\" said Mark Zandi, chief economist at Moody's. Inflation is \"still high but moving in the right direction,\" he said, \"assuming the war in Iran fades to the background.\"\nEnergy prices increased 14.7% for the 12 months ended in July amid doubts that the U.S. and Iran could reach a broader resolution to the conflict.\nPrices for gasoline, which is refined from crude oil, and other fuels and energy products were also higher as a result. Gasoline prices were up 24.6% over the year while fuel oil rose 39.1%, according to the inflation data issued Wednesday.\nConsumers paid a national average of $4.04 per gallon as of Wednesday, according to AAA — up from about $3.14 a year ago.\nAirline fares also rose 25.5% over the past 12 months, according to the CPI data.\nStill, the oil shock didn't put too much pressure on grocery prices, economists said, which have been a particular pain point for most U.S. households.\nFood prices climbed 3% over the last year, according to the CPI data, with food at home prices up 2.7%.\n\"Food prices don't seem to be too bad, but there's a lot of mix in there,\" said Brian Bethune, an economics professor at Boston College. \"Meat is way up, chicken is slightly down, egg prices have finally come back down, and now we have a problem with lettuce,\" he said.\nConcerns about ongoing cyclospora outbreaks have dampened consumer demand for lettuce, which weighed on the index for fruits and vegetables.\nOverall, the meats, poultry, fish and eggs index rose 1.9% over the 12 months ended in July, while the index for dairy fell 0.5% over the year.\nThe core CPI, which excludes food and energy, was up 2.5% on the year, with the indexes for new vehicles, apparel and shelter all notching modest increases.\n\"Affordability is still a serious problem,\" Zandi said, although \"it's much better than it has been.\"\nIf these trends continue, \"assuming energy prices don't go back up, inflation will be within spitting distance of the Fed's target,\" he said.\nThe Fed is in a 'wait-and-see mode'\nThe inflation rate is one of the key economic indicators the Federal Reserve uses to guide interest rate decisions.\nThe central bank voted last month to keep the benchmark rate in a range between 3.5%-3.75%, but policymakers signaled an increase in borrowing costs could be on the horizon.\nWith inflation remaining above the Fed's 2% target, this latest CPI reading leaves a September rate hike on the table, but the odds are higher for an October move, experts say.\n\"After more than five years of above-target inflation, policymakers want to see a clear and lasting trend before acting. Until then, this is a Fed in wait-and-see mode,\" Karen Manna, fixed income investment director at Federated Hermes, said in an email.",
    "bodyJa": "7 月の消費者物価は 6 月の反動で上昇しましたが、エネルギーが 1 年前より大幅に高かったにもかかわらず、インフレは概ね鈍化していることが示されました。\n労働統計局が水曜日に発表したところによると、インフレのバロメーターである消費者物価指数は12カ月前に比べて3.4％上昇した。\nこれは、米国とイランの間の戦争が2月28日に勃発する前の1月以来、初めて年間インフレ率の低下を記録した6月の3.5％からわずかに低下した。\nムーディーズの首席エコノミスト、マーク・ザンディ氏は「ストライクゾーンのすぐ下で、非常に良性の報告書だと思った」と述べた。同氏は、「イラン戦争が背景に消えれば、インフレは依然として高いが、正しい方向に進んでいる」と述べた。\n米国とイランが紛争の広範な解決に到達できるかどうか疑問が残る中、エネルギー価格は７月までの１２カ月で１４．７％上昇した。\nこの結果、原油から精製されるガソリンやその他の燃料、エネルギー製品の価格も上昇した。水曜日に発表されたインフレデータによると、ガソリン価格は年間で24.6％上昇し、燃料油は39.1％上昇した。\nAAAによると、水曜日の時点で消費者が支払った全国平均は1ガロン当たり4.04ドルで、1年前の約3.14ドルから​​増加した。\nＣＰＩデータによると、航空運賃も過去１２カ月で２５．５％上昇した。\nそれでも、エコノミストらによると、石油ショックは食料品価格にそれほど大きな圧力をかけなかったが、食料品価格は米国のほとんどの家計にとって特に悩みの種だった。\nCPIデータによると、食品価格は昨年3%上昇し、家庭用食品価格は2.7%上昇した。\nボストン大学の経済学教授ブライアン・ベスーン氏は、「食品価格はそれほど悪くないようだが、かなりのばらつきがある」と述べた。 「肉は大幅に上昇し、鶏肉はわずかに下落し、卵の価格はついに下落した。そして今、レタスに問題がある」と同氏は語った。\n進行中のシクロスポラの発生に対する懸念により、レタスに対する消費者の需要が減退し、果物と野菜の指数を圧迫した。\n全体として、肉、家禽、魚、卵の指数は7月までの12か月間で1.9％上昇したが、乳製品の指数は年間で0.5％低下した。\n食品とエネルギーを除いたコアCPIは前年比2.5%上昇し、新車、衣料品、住居の指数はすべて小幅な上昇を記録した。\nザンディ氏は、「価格の手頃さは依然として深刻な問題だ」としながらも、「以前よりはずっと良くなっている」と語った。\nこうした傾向が続けば、「エネルギー価格が戻らないと仮定すると、インフレ率はFRBの目標にわずかに近づくだろう」と同氏は述べた。\nFRBは「様子見モード」にある\nインフレ率は、連邦準備制度が金利決定の指針として使用する重要な経済指標の 1 つです。\n中銀は先月、基準金利を３．５─３．７５％の範囲に維持することを決議したが、政策当局者らは借入コストの上昇が近い将来に起こる可能性を示唆している。\nインフレ率が依然としてFRBの目標である2％を上回っているため、今回のCPIの統計では9月利上げの可能性は残っているが、10月利上げの可能性の方が高いと専門家は指摘する。\nフェデレーテッド・ヘルメスの債券投資ディレクター、カレン・マナ氏は電子メールで「インフレ率が５年以上目標を上回っているため、政策当局者らは行動する前に明確で持続的な傾向を確認したいと考えている。それまではＦＲＢは様子見モードだ」と述べた。",

    "titleJa": "トランプ大統領、Truth Socialの10万ドルの早期アクセスサービスを巡って訴訟",
    "summaryJa": "トランプ大統領、Truth Socialの10万ドルの早期アクセスサービスを巡って訴訟- 公開されました",
    "bodyOriginal": "Trump sued over Truth Social's $100,000 early access service\n- Published\nDonald Trump is being sued by two US media groups over a new Truth Social service that charges up to $100,000 a month for early access to his posts.\nThe lawsuit was filed on Wednesday in New York federal court by The Intercept and Freedom of the Press Foundation.\nThe suit argues that selling priority access to the president's messages raises serious concerns, external, describing it as \"extraordinary, corrupt and unconstitutional\".\nTrump Media & Technology Group (TMTG) said the lawsuit was brought by \"left-wing activists\" seeking to censor the president.\nThe BBC has approached the White House for comment. TMTG has previously dismissed concerns about the paid service.\nThe paid Truth Social service offers subscribers near-instant delivery of Trump's posts, arriving seconds before they appear for the general public. The plaintiffs say those moments matter because Trump often uses the platform to announce major developments, such as during the Iran war, that can move financial markets.\nThey argue the setup gives an unfair advantage to those who can afford it, creating a system where market-sensitive information reaches paying clients first.\nMore than 10 firms now pay up to $100,000 a month for fast access to Truth Social posts.\nTrump Media and Technology Group has said the product is aimed at businesses seeking faster data feeds and has dismissed concerns about how the information is used.\nThe company unveiled the service, called Truth API, in mid-July and said it would deliver posts from Trump and other high-profile accounts in milliseconds.\nTrump is the most followed person on the platform, with about 13 million followers, ahead of his eldest son Donald Trump Jr., who has around 7.5 million.\nSeth Stern, chief of advocacy at the Freedom of the Press Foundation's, said Trump selling priority access to news he generates, for the benefit of a private company he controls, is \"so blatantly corrupt and unconstitutional that it would have been hard to even fathom just a few years ago\".\nAnd David Bralow, chief legal officer at The Intercept, said: \"Nothing could be more antithetical to the free, independent press than the president charging for early access to his public announcements.\"\nThe lawsuit described Truth API as a \"scheme\" and a money-making opportunity, noting that Trump holds the largest stake in TMTG through a revocable trust that owns about 41% of the company – a stake worth more than $1 billion. He is the trust's sole beneficiary.\nResponding to the lawsuit, a TMTG spokesperson said: \"Information from President Trump is disseminated by countless platforms and news outlets, many of which offer subscription APIs.\n\"One of those channels is Truth Social, which was founded as an uncancellable haven for free speech after the President was unjustly de-platformed.\n\"Now, left-wing activists are trying to wrongfully weaponize the courts to censor him again and harm our shareholders.\"\nThe spokesperson also accused the Freedom of the Press Foundation of violating Truth Social's terms of service.",
    "bodyJa": "トランプ大統領、Truth Socialの10万ドルの早期アクセスサービスを巡って訴訟\n- 公開されました\nドナルド・トランプ氏は、自身の投稿への早期アクセスに月額最大10万ドルを請求する新しいTruth Socialサービスをめぐって、米国の2つのメディアグループから訴訟を起こされている。\nこの訴訟は水曜日、報道傍受と自由財団によってニューヨーク連邦裁判所に起こされた。\n訴訟では、大統領のメッセージへの優先アクセスを販売することは対外的に深刻な懸念を引き起こすと主張し、これを「異例で腐敗し憲法違反」と表現している。\nトランプ・メディア＆テクノロジー・グループ（TMTG）は、この訴訟は大統領の検閲を求める「左翼活動家」によって起こされたと述べた。\nBBCはホワイトハウスにコメントを求めた。 TMTGは以前、有料サービスに関する懸念を否定していた。\n有料の Truth Social サービスでは、加入者にトランプ氏の投稿がほぼ即時に配信され、一般公開される数秒前に配信されます。原告らは、トランプ大統領がイラン戦争中など、金融市場を動かす可能性のある重大な展開を発表するためにこのプラットフォームを頻繁に利用しているため、その瞬間が重要だと主張している。\n彼らは、この設定が余裕のある人々に不当な利益を与え、市場に敏感な情報が最初にお金を払っている顧客に届くシステムを作り出していると主張している。\n現在、10 社以上の企業が、Truth Social の投稿への迅速なアクセスに月額最大 10 万ドルを支払っています。\nトランプ・メディア・アンド・テクノロジー・グループは、この製品はより高速なデータフィードを求める企業をターゲットにしていると述べ、情報がどのように利用されるかについての懸念を否定した。\n同社は7月中旬に「Truth API」と呼ばれるこのサービスを発表し、トランプ氏やその他の著名なアカウントからの投稿を数ミリ秒で配信すると発表した。\nトランプ氏は同プラットフォームで最もフォロワー数が多く、フォロワー数は約1300万人で、約750万人の長男ドナルド・トランプ・ジュニア氏を上回っている。\nフリーダム・オブ・ザ・プレス財団の擁護責任者セス・スターン氏は、トランプ大統領が自らが管理する民間企業の利益のために、自らが生成するニュースへの優先アクセスを販売することは「あまりにも露骨な腐敗で憲法違反であり、ほんの数年前には想像することさえ難しかっただろう」と語った。\nまた、インターセプト社の最高法務責任者デビッド・ブラロウ氏は、「大統領が自らの公表内容への早期アクセスを要求することほど、自由で独立した報道機関に対抗するものはない」と述べた。\n訴訟ではTruth APIを「計画」であり金儲けの機会であると述べ、トランプ大統領がTMTGの株式の約41％を所有する取り消し可能な信託を通じてTMTGの最大株式を保有しており、その株式の価値は10億ドルを超えると指摘した。彼は信託の唯一の受益者です。\nこの訴訟に対してTMTGの広報担当者は、「トランプ大統領からの情報は無数のプラットフォームや報道機関によって拡散されており、その多くはサブスクリプションAPIを提供している。\n「それらのチャンネルの 1 つが Truth Social で、大統領が不当にプラットフォームから排除された後、言論の自由のためのキャンセル不可能な避難所として設立されました。\n「現在、左翼活動家たちは法廷を不当に武器にして彼を再び検閲し、我々の株主に損害を与えようとしている。」\n広報担当者はまた、報道の自由財団がTruth Socialの利用規約に違反していると非難した。",

    "title": "Discord ordered to suspend livestreams in Brazil",
    "titleJa": "Discord、ブラジルでライブ配信停止命令",
    "summaryJa": "Discord、ブラジルでライブ配信停止命令- 公開されました",
    "bodyOriginal": "Discord ordered to suspend livestreams in Brazil\n- Published\nBrazil's data protection authority (ANPD) has ordered Discord to suspend its livestreaming feature after a teenage girl was allegedly encouraged to take her own life in a broadcast on the platform.\nThe messaging service allows people to create and join groups based on their interests, with users able to enter voice or video calls in real time through Discord's \"Go Live\" feature.\nThe investigation by the ANPD began on 7 August after the death of a 13-year-old girl, who was reportedly pressured to end her life by others in the Discord server - or group - she was in.\nDiscord told the BBC it was \"thoughtfully reviewing\" the ANPD's order and is \"committed to user safety\".\n\"Groups or individuals who promote or encourage violence have no place on Discord,\" a spokesperson said.\n\"We swiftly investigated and shut down the private, invite-only server involved shortly after its creation and continue to cooperate with law enforcement in its investigation.\"\nAccording to Reuters, external, the ANPD said it found Discord lacks real-time access to livestream content, which prevents automated violation detection.\nThe site, which can be accessed on desktop or as a mobile app, has over 200 million monthly active users, and is popular with gamers.\nDiscord's spokesperson said in its investigation, evidence was found that the criminal activity \"was coordinated on other platforms before the Discord server was created\" as well as continuing \"after the individuals involved were banned from Discord\".\nFive teenagers have reportedly been arrested in connection to the teenage girl's death.\nDiscord now has three days to comply with the suspension and can appeal the decision within 10 business days.\nThe platform faces potential fines of up to 50m reais ($9.67m) per violation.\nThe ANPD said the suspension will remain in place until Discord proves it has implemented \"adequate protective measures for minors\", which may include age verification checks.\nIn August 2024, the social media platform X was banned in Brazil after failing to pay existing fines and to meet a deadline set by a Supreme Court judge to name a new legal representative in the country.\nIt was unbanned by the Supreme Court in October 2024 after it complied with court orders by paying fines totalling 28m reais ($5.1m; £3.8m) and agreed to appoint a local representative, as required by Brazilian law.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\nRelated topics\n- Published9 February\n- Published18 February",
    "bodyJa": "Discord、ブラジルでライブ配信停止命令\n- 公開されました\nブラジルのデータ保護当局（ANPD）は、10代の少女がプラットフォーム上の放送中に自殺を勧められたとされる問題を受けて、Discordにライブストリーミング機能を停止するよう命令した。\nこのメッセージング サービスを使用すると、ユーザーは興味に基づいてグループを作成したり参加したりでき、ユーザーは Discord の「Go Live」機能を通じてリアルタイムで音声通話またはビデオ通話に参加できるようになります。\nANPDによる捜査は、13歳の少女が死亡したことを受けて8月7日に始まった。この少女は、所属していたDiscordサーバー（またはグループ）の他者から命を絶つよう圧力をかけられたと伝えられている。\nDiscordはBBCに対し、ANPDの命令を「慎重に検討」しており、「ユーザーの安全に全力で取り組んでいる」と語った。\n広報担当者は「暴力を助長、奨励する団体や個人はDiscordに居場所はない」と述べた。\n「私たちは迅速に調査を行い、関与した招待専用サーバーを作成直後に閉鎖し、引き続き法執行機関の捜査に協力していきます。」\n外部のロイター通信によると、ＡＮＰＤは、Ｄｉｓｃｏｒｄにはライブストリームコンテンツへのリアルタイムアクセスがなく、違反の自動検出ができないことが判明したと発表した。\nこのサイトはデスクトップまたはモバイル アプリとしてアクセスでき、月間アクティブ ユーザー数は 2 億人を超え、ゲーマーに人気があります。\nDiscordの広報担当者は、調査の中で、犯罪行為が「Discordサーバーが作成される前に他のプラットフォームで調整されていた」だけでなく、「関係者がDiscordから追放された後も」継続していたという証拠が見つかったと述べた。\n伝えられるところによると、10代の少女の死に関連して5人のティーンエイジャーが逮捕された。\nDiscordは現在、停止に従うまでに3日間の猶予が与えられており、10営業日以内に決定に対して異議を申し立てることができる。\n同プラットフォームには違反ごとに最大5000万レアル（967万ドル）の罰金が科せられる可能性がある。\nANPDは、Discordが年齢確認チェックを含む「未成年者に対する適切な保護措置」を講じていることを証明するまで、停止は継続されると述べた。\n2024年8月、ソーシャルメディアプラットフォームXは、既存の罰金を支払わず、最高裁判所判事が国内で新たな法定代理人を任命するために設定した期限を守らなかったため、ブラジルで禁止された。\n裁判所の命令に従い総額2,800万レアル（510万ドル、380万ポンド）の罰金を支払い、ブラジルの法律で義務付けられている現地代表を任命することに同意したため、2024年10月に最高裁判所によって禁止が解除された。\nTech Decoded ニュースレターに登録して、世界のトップのテクノロジー ストーリーやトレンドをフォローしてください。英国外ですか？ここからサインアップしてください。\n関連トピック\n- 2 月 9 日発行\n- 2 月 18 日公開",
