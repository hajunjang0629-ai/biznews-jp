    "bodyOriginal": "Treasury yields are continuing to climb, and at a particularly bad time as higher rates worsen the impact of the nearly $40 trillion government debt load.\nLonger-dated debt has been hit particularly hard by the recent leg up, pushing the 30-year bond yield close to its highest level since the early part of the 21st century. Other maturities also have risen, owing to a number of factors conspiring to raise financing costs.\nFixed income strategists ascribe the run that began in June to a number of variables: Intensified concerns over a budget deficit that appears set to eclipse its 2025 level; inflation in an ominous holding pattern above the Federal Reserve's 2% target despite moderating data over the past two months; and a rash of corporate debt issuance competing with Treasurys for investors' favor.\nBroadly, the move can also be attributed to a rising term premium, or the extra yield investors demand to hold U.S. debt.\nTogether, the various factors have combined to create a difficult environment for fixed income, though one that has yet to materially hit the stock market. Yields turned lower Tuesday, easing a trend that has seen the 30-year yield jump more than 40 basis points, or 0.4 percentage point, since the late-June low.\n\"These are not new forces, and the rise in long-term yields has been gradual rather than sudden,\" Anshul Pradhan, head of U.S. rates research at Barclays Capital, said in a Monday client note. \"What is notable today is not the existence of these pressures, but that they appear strong enough to overwhelm individual soft-data releases. Three independent releases argued for lower yields this month; long end yields moved higher anyway.\"\nMultiple causes\nIndeed, recent inflation data has been at least moving in the right direction: Both consumer and producer prices were little changed in July, and the core measure that excludes food and energy stood at 2.5% —essentially where it was before the war against Iran began in late February.\nBut the recent moves appear to be about more than inflation.\nFor one, there's the debt and deficit situation.\nThe U.S. saw a budget shortfall of $432.3 billion in July, the widest single-month gain since March 2021 and likely locking in a $2 trillion deficit for the full year ending Sept. 30. Total government debt is a hair below $40 trillion, with the public portion of that soon to hit 100% of gross domestic product.\nDebt financing costs have totaled $1.12 trillion through July and are expected to hit $1.37 trillion for the full fiscal year, or about $84 billion more than in 2025. On net, the government has spent more on debt financing this year than anything else outside of Social Security and Medicare.\nMarket veteran Ed Yardeni coined the term \"bond vigilantes\" in the early 1980s to describe fixed income investors who go on strike to protest poor fiscal conditions. In a CNBC interview, the head of Yardeni Associates, though generally constructive on both the debt and equity markets, said, \"We're kind of testing the outer limits of where the bond vigilantes are really going to start protesting.\"\n\"They're concerned that maybe the Fed isn't being vigilant enough about inflation; they're concerned about the price of oil,\" he said. \"But at the end of the day, the bond yield wouldn't be here if the economy wasn't doing well. So I view it as a vote of confidence in the strength of the economy.\"\nAI issuance factor\nBonds are facing other tests as well.\nThe surge of investment in artificial intelligence has coincided with a rush of companies coming to market in search of capital.\nSo far this year, U.S. companies have issued nearly $1.7 trillion in bonds, up 27% from the same period a year ago and more than all of 2025 combined, according to Securities Industry and Financial Markets Association data. The trend is mirrored overseas, with government debt yields surging around the world.\nNormally, U.S. Treasury debt is considered the deepest and most liquid market in the world. But that doesn't mean there's no competition.\n\"On top of concerns about the growth of government debt, a record pace of corporate bond issuance has added substantial duration supply to U.S. fixed income markets, with consequences for the outright level of yields as well as the shape of the yield curve and term premium,\" Ian Lyngen, head of U.S. rates strategy at BMO Capital Markets, said in a note.\n\"The path of least resistance will likely favor higher long-end rates in the near-term unless there is a slowdown in the market supply of duration, sharp tightening of financial conditions or dimming of the economic outlook,\" he added.\nThe Fed factor\nThen there's the Fed itself.\nNew Chairman Kevin Warsh has been coy about where he sees rates headed, keeping with his disdain for forward guidance. A suddenly opaque central bank has added another layer of tension to a market already balancing multiple other risks, with yields rising even though the Fed has kept its benchmark steady in a range between 3.50%-3.75% all year.\nMarkets now are pricing in little chance the Fed will raise at its September meeting and, in fact, now doesn't foresee a high probability of an interest rate increase until December, according to the CME Group's FedWatch tool. In turn, that has caused markets to question whether the Fed is committed to its 2% inflation target as staunchly as official rhetoric suggests.\nStill, Yardeni is encouraged to see a market less influenced by the Fed, and expects that higher yields will soon attract buyers.\n\"The bond market is actually finally working the way it should work. It's allocating capital efficiently,\" he said. \"It wasn't doing that when the Fed was basically rigging the bond market by keeping the bond yield close to zero by dropping the federal funds rate down to zero. So this this is kind of back to market-driven interest rates.\"",
    "bodyJa": "国債利回りは上昇を続けており、金利上昇により40兆ドル近い政府債務負担の影響がさらに悪化するという特に悪い時期にある。\n最近の上昇で長期債は特に大きな打撃を受けており、３０年債利回りは２１世紀初頭以来の最高水準付近に上昇している。資金調達コストを上昇させるさまざまな要因が重なって、他の年限も上昇しています。\n債券ストラテジストらは、6月に始まった財政赤字の悪化には多くの変動要因があると考えている。2025年の水準を超えそうな財政赤字に対する懸念の高まり。過去 2 か月間データが緩やかであったにもかかわらず、インフレ率は連邦準備理事会の目標である 2% を上回る不気味なパターンで維持されている。そして投資家の好意を求めて財務省と競合する社債発行の急増。\n大まかに言えば、この動きはタームプレミアム、つまり投資家が米国債を保有するために要求する追加利回りの上昇に起因しているとも考えられる。\nさまざまな要因が重なり、債券市場には厳しい環境が生まれているが、株式市場にはまだ大きな打撃を与えていない。火曜日には利回りが低下に転じ、３０年債利回りが６月下旬の最低水準から４０ベーシスポイント（０．４％ポイント）以上上昇する傾向が緩和された。\nバークレイズ・キャピタルの米国金利調査部門責任者、アンシュル・プラダン氏は月曜の顧客向けノートで、「これらは新たな勢力ではなく、長期利回りの上昇は突然ではなく徐々に起こっている」と述べた。 「今日注目すべきことは、こうした圧力の存在ではなく、その圧力が個々のソフトデータリリースを圧倒するほど強力であるように見えることだ。今月は３つの独立したリリースが利回り低下を主張したが、とにかく長期金利は上昇した。」\n複数の原因\n実際、最近のインフレデータは少なくとも正しい方向に進んでいる。7月の消費者物価と生産者物価はほとんど変化がなく、食料とエネルギーを除いたコア指標は2.5％で、実質的には2月下旬に対イラン戦争が始まる前の水準だった。\nしかし、最近の動きはインフレ以上のものを目的としているようだ。\nまず、債務と赤字の状況が挙げられます。\n米国の7月の予算不足額は4,323億ドルで、単月としては2021年3月以来の大幅な増加となり、9月30日までの通年では2兆ドルの赤字に確定する可能性が高い。政府債務総額は40兆ドルをわずかに下回り、そのうち公的部分が国内総生産の100％に達する日も近い。\n債務調達コストは7月までに合計1兆1200億ドルに達し、会計年度通年では1兆3700億ドルに達すると予想されており、これは2025年より約840億ドル増加する。純額では、政府は今年、社会保障とメディケア以外の支出よりも債務調達に多くを支出した。\n市場のベテラン、エド・ヤルデニ氏は1980年代初頭に、劣悪な財政状況に抗議してストライキを起こす債券投資家を表す「債券自警団」という言葉を作った。 CNBCのインタビューで、ヤルデニ・アソシエーツのトップは、債券市場と株式市場の両方に対して概ね建設的ではあるものの、「債券自警団が実際にどこで抗議活動を始めるのか、我々は外側の限界を試しているようなものだ」と語った。\n同氏は「彼らはFRBがインフレについて十分に警戒していないのではないかと懸念しており、原油価格を懸念している」と述べた。 「しかし、結局のところ、経済が好調でなければ、債券利回りはここには存在しなかったでしょう。ですから私は、これを経済の強さに対する信任投票だと考えています。」\nAI発行要因\n債券は他の試練にも直面している。\n人工知能への投資の急増は、資本を求めて市場に参入する企業のラッシュと一致しています。\n証券産業・金融市場協会のデータによると、今年これまでに米国企業は1兆7000億ドル近くの社債を発行しており、前年同期比27％増で、2025年の全期間を合わせた額を上回っている。この傾向は海外でも反映されており、世界中で国債利回りが急上昇している。\n通常、米国財務省債券は世界で最も深く、最も流動性の高い市場と考えられています。しかし、それは競争が存在しないという意味ではありません。\nＢＭＯキャピタル・マーケッツの米金利戦略部門責任者イアン・リンゲン氏は「政府債務の増加に対する懸念に加え、記録的なペースでの社債発行により米国の債券市場へのデュレーション供給が大幅に増加し、その結果、利回りの完全な水準やイールドカーブの形状、期間プレミアムに影響が生じている」とノートで述べた。\n同氏は「市場のデュレーション供給の減速、金融情勢の急激な引き締め、経済見通しの暗転がない限り、短期的には抵抗が最も少ない道筋で長期金利の上昇が有利になる可能性が高い」と付け加えた。\nFRBの要因\n次にFRB自体もある。\nケビン・ウォーシュ新議長は、フォワードガイダンスを軽視しつつ、金利がどこに向かうとの見通しについては口を閉ざしている。中央銀行が突然不透明になったことで、すでに他の複数のリスクのバランスを取っている市場にさらなる緊張が加わり、FRBが年間を通じて指標を3.50～3.75％の範囲で安定させてきたにもかかわらず、利回りは上昇している。\nＣＭＥグループのフェドウォッチツールによると、市場は現在、ＦＲＢが９月会合で利上げする可能性はほとんどないと織り込んでおり、実際、１２月まで利上げの可能性は高くないと予想している。その結果、市場ではFRBが公式のレトリックが示唆するほど断固として2％のインフレ目標に取り組んでいるのかどうか疑問が生じている。\nそれでもヤルデニ氏は、市場がFRBの影響を受けにくいことを期待しており、利回りの上昇によりすぐに買い手が集まるだろうと予想している。\n同氏は「債券市場は実際、ようやく本来あるべき形で機能しつつある。資本を効率的に配分している」と述べた。 「FRBがフェデラル・ファンド金利をゼロに引き下げることで債券利回りをゼロ近くに維持するという基本的に債券市場を操作していたときには、そのようなことはしていなかった。つまり、これは一種の市場主導の金利に戻ったということだ。」",

    "bodyOriginal": "Apple on Tuesday announced that alternative, third-party app stores in the European Union will be charged a 5% commission on in-app purchases, which the iPhone maker said will \"resolve\" disagreements with regulators stemming from the implementation of Europe's Digital Markets Act.\nUnder the new rules, apps purchased through Apple's App Store using Apple's system will pay a commission of 26% on digital goods and services. Apps that use their own payment processing systems and take credit cards directly will pay Apple 20%. Apps that link out to a website to complete purchases will be charged 15%, and apps distributed through third-party app stores or the web will be charged 5%, which Apple calls a \"Core Technology Commission.\" Some fees can be cut in half by participating in various Apple programs.\nIt's a replacement for a more complicated system that Apple proposed last year. The new fee tiers take effect on Oct. 1.\nHistorically, Apple charged either 30% or 15% on all iPhone in-app purchases, and required that all non-enterprise iPhone apps be installed through its App Store. But Apple's App Store model has been under attack around the world in the past decade from lawsuits and government regulators, as critics say it operates as a monopoly on iPhone software and squeezes developers and users with fees.\nApple has argued that its App Store and in-app purchase requirements are designed to increase trust and safety and enforce issues around security and inappropriate apps.\nThe European Commission passed the Digital Markets Act in 2022, requiring \"gatekeepers\" like Apple to open up its App Store — and other Apple services and products such as Siri — to third parties. But there has been friction between Apple and the EC over the company's App Store proposals, and Apple has faced large fines.\nOnly a handful of regions require Apple to enable third-party app stores that can sell iPhone apps and Europe is the only region where users can install iPhone software from the web. Japan and Brazil have also required third-party app stores.\nIn the U.S., Apple is fighting to restrict users from linking out to payments on the web as part of the lingering Epic Games litigation. It recently proposed a 15% commission on link-out payments in the U.S.\nApple said its proposal on Tuesday resolves its disagreements with the European Commission on the matter. It also said that it worked with the EC to implement child safety measures, including adding parental restrictions on some in-app purchases.\nApple generates significant revenue from its App Store, which is reported in its profitable Services division, but it didn't highlight the App Store as a top driver of services growth in the most recent quarter for the first time since 2023, according to a Morgan Stanley note. CFO Kevan Parekh noted slower mobile gaming and other factors affecting the performance of the App Store in a call with analysts in July.\n\"Keep in mind, we also made some changes to the App Store business model in certain countries,\" Parekh said.",

    "title": "Bond yields are climbing. Here’s what that means for mortgages and other consumer borrowing",
    "titleJa": "債券利回りは上昇している。これが住宅ローンやその他の消費者借り入れにとって何を意味するかは次のとおりです",
    "summaryJa": "持続するインフレ圧力を背景に、長期債の利回りは上昇しており、専門家らは特に住宅ローンなどの長期固定金利ローンの借り入れコストが上昇し続ける可能性が高いと指摘している。米国の30年国債利回りは火曜日、19年ぶりの高水準となる5.323％に達したが、その後5.3％をわずかに下回る水準まで低下した。住宅ローンの固定金利やその他の長期ローンの主要なベンチマークである10年米国債利回りは4.7％を超えている。これに比べ、2月末のイラン戦争開始前は4%未満だった。",
    "bodyOriginal": "Against a backdrop of persisting inflationary pressures, yields on longer-term bonds have been climbing, which experts say is likely to keep borrowing costs elevated — particularly for long-term fixed-rate loans such as mortgages.\nThe yield on the U.S. 30-year Treasury bond hit 5.323% on Tuesday, a 19-year high, before edging down to just below 5.3%. The 10-year Treasury yield — a key benchmark for fixed mortgage rates and other longer-term loans — is above 4.7%. That compares to below 4% before the start of the Iran War at the end of February.\n\"The higher bond yields on long-dated securities, like the 30-year Treasury, clearly indicate discomfort over persistently high inflation in the future,\" said Lawrence Yun, chief economist for the National Association of Realtors.\nThe annual rate of inflation was 3.4% in July as measured by the consumer price index, far above the Federal Reserve's target of 2%. Before the war, in January, the annual inflation rate was 2.4%.\nWhat bond yields mean for mortgage rates\nSince 15- and 30-year fixed-rate mortgages typically follow the lead of Treasury rates, higher yields have already been pushing up mortgage rates. The average rate for a 30-year, fixed-rate mortgage was 6.75% as of Tuesday, after finishing last week at 6.69%, according to Mortgage News Daily.\n\"The impact on mortgage rates is directly related to higher bond yields,\" Yun said. \"Independent of the Federal Reserve policy, higher inflation and higher overall long-term borrowing costs will mean higher mortgage rates.\"\nHe said consumers should not expect any meaningful decline in mortgage rates.\nLast week's \"favorable economic data provided only temporary relief,\" said Jeff DerGurahian, LoanDepot's chief investment officer and head economist. Higher energy prices stemming from the Iran conflict remain \"an important part of the inflation picture,\" he said.\n\"Longer-term bond investors may need more evidence that the post-pandemic inflation cycle is truly behind us and that the economy is returning to a slower-growth, slower-inflation environment before 10- and 30-year Treasury yields move meaningfully lower,\" DerGurahian said.\nIn the meantime, there are ways to offset today's higher rates, experts say.\n\"Some may want to consider shorter-term mortgage rates, like seven-year [adjustable-rate mortgages], which lock in fixed mortgage payments for the first seven years of the loan before readjusting,\" Yun said. \"These shorter-duration loans are ideal for those who are more certain they will move to another home within that seven-year timeframe.\"\nWhat bond yields mean for other consumer loans\nRates on car loans, credit cards and student debt are also directly or indirectly tied to bond yields, meaning those monthly payments could increase as well.\n\"It typically is an immediate pass-through to some consumer rates,\" said Brett House, an economics professor at Columbia Business School. \"Variable and some fixed-rate borrowing will reset rates on a daily basis.\"\nRenewed worries about the trajectory of Fed interest rate policy could weigh on variable credit card rates, which are closely pegged to the prime rate and influence inflation expectations.\nAuto loan rates are also susceptible to broader economic factors.\n\"Auto loan rates don't move in a vacuum, but sustained pressure on Treasury yields inevitably pushes up borrowing costs across the financing spectrum,\" said Jessica Caldwell, head of insights at Edmunds.\n\"With average new-vehicle APRs already stuck around 7% and used vehicles at 10.6%, consumers are already paying heightened interest,\" she said. \"If higher bond yields keep interest rates elevated, auto lenders will have little choice but to maintain or even bump up APRs, further stretching consumer budgets.\"\nAlthough federal student loan rates are fixed for the life of the loan, rates rose for new borrowers in the year ahead based on the last 10-year Treasury note auction in May.\n\"Of course, higher borrowing costs are meant to fight inflation, but there's a potential double whammy for consumers,\" said Ted Rossman, a principal consumer finance analyst at Money Management International, a nonprofit credit counseling agency. \"When prices are high, and borrowing costs are high — as they are now — you feel like you're getting squeezed from all sides.\"",
    "bodyJa": "持続するインフレ圧力を背景に、長期債の利回りは上昇しており、専門家らは特に住宅ローンなどの長期固定金利ローンの借り入れコストが上昇し続ける可能性が高いと指摘している。\n米国の30年国債利回りは火曜日、19年ぶりの高水準となる5.323％に達したが、その後5.3％をわずかに下回る水準まで低下した。住宅ローンの固定金利やその他の長期ローンの主要なベンチマークである10年米国債利回りは4.7％を超えている。これに比べ、2月末のイラン戦争開始前は4%未満だった。\n全米不動産業者協会の首席エコノミスト、ローレンス・ユン氏は「３０年米国債のような長期債の債券利回りの上昇は、将来のインフレ高止まりに対する不快感を明確に示している」と述べた。\n消費者物価指数で測定した７月の年率インフレ率は３．４％で、米連邦準備理事会（ＦＲＢ）の目標である２％を大幅に上回った。戦前の1月の年間インフレ率は2.4％でした。\n債券利回りが住宅ローン金利に与える影響\n15年と30年の固定金利住宅ローンは通常、財務省金利に追随するため、利回りの上昇によりすでに住宅ローン金利が上昇している。モーゲージ・ニュース・デイリーによると、30年固定金利住宅ローンの平均金利は、先週6.69％で終了したが、火曜日時点では6.75％となった。\nユン氏は「住宅ローン金利への影響は債券利回りの上昇に直接関係している」と述べた。 「FRBの政策とは関係なく、インフレ率の上昇と全体的な長期借入コストの上昇は住宅ローン金利の上昇を意味する。」\n同氏は、消費者は住宅ローン金利の大幅な低下を期待すべきではないと述べた。\nローンデポの最高投資責任者兼首席エコノミスト、ジェフ・ダーグラヒアン氏は、先週の「良好な経済指標は一時的な安心感をもたらしただけだ」と述べた。同氏は、イラン紛争に起因するエネルギー価格の高騰が依然として「インフレ状況の重要な部分を占めている」と述べた。\nデアグラヒアン氏は「長期債券投資家は、パンデミック後のインフレサイクルが真に終わりを迎え、10年債と30年債の利回りが大幅に低下する前に、経済が低成長、低インフレの環境に戻りつつあることを示すさらなる証拠が必要かもしれない」と述べた。\nそれまでの間、今日の金利上昇を相殺する方法はある、と専門家らは言う。\nユン氏は「一部の人々は、再調整前にローンの最初の7年間固定住宅ローンの支払いを固定する7年（金利調整可能住宅ローン）のような、より短期の住宅ローン金利を検討したいと考えるかもしれない」と述べた。 「これらの期間の短いローンは、7 年の期限内に別の家に引っ越すことがより確実である人にとって理想的です。」\n債券利回りが他の消費者ローンに与える影響\n自動車ローン、クレジットカード、学生ローンの金利も債券利回りに直接的または間接的に結びついており、これらの月々の支払額も増加する可能性があることを意味します。\nコロンビア・ビジネス・スクールの経済学教授ブレット・ハウス氏は、「通常、一部の消費者金利への即時転嫁である」と述べた。 「変動金利および一部の固定金利の借入では、金利が毎日リセットされます。」\nFRBの金利政策の軌道をめぐる懸念が再燃し、プライムレートと密接に連動しインフレ期待に影響を与えるクレジットカードの変動金利に重しがかかる可能性がある。\n自動車ローン金利は、より広範な経済要因にも影響されます。\nエドマンズのインサイト責任者、ジェシカ・コールドウェル氏は「自動車ローン金利は単独で変動するわけではないが、米国債利回りへの持続的な圧力により、資金調達全般にわたる借入コストが必然的に上昇する」と述べた。\n同氏は「新車の平均年利率はすでに7％前後、中古車は10.6％にとどまっており、消費者はすでに高い関心を払っている」と述べた。 「債券利回りの上昇で金利が上昇したままであれば、自動車金融業者には年利を維持するか、さらには引き上げる以外に選択肢はほとんどなく、消費者の予算はさらに膨らむことになる。」\n連邦学生ローン金利はローン期間中固定されているが、5月に行われた前回10年国債入札に基づいて、今後1年間の新規借り手の金利は上昇した。\n非営利信用カウンセリング機関マネー・マネジメント・インターナショナルの首席消費者金融アナリスト、テッド・ロスマン氏は「もちろん、借り入れコストの上昇はインフレに対抗するためだが、消費者にとっては二重の打撃となる可能性がある」と述べた。 「現在のように物価が高く、借入コストが高いときは、あらゆる面から圧迫されているように感じます。」",

    "bodyOriginal": "Disney's ABC has filed a First Amendment lawsuit against the Federal Communications Commission, calling the government agency's recent investigation into the company a \"retaliatory campaign\" due to the nature of its programming, which has been critical of President Donald Trump.\nThe broadcast network filed the lawsuit on Tuesday in U.S. District Court for the District of Columbia.\nIt comes months after the FCC launched an early renewal of a set of ABC's broadcast station licenses, citing concerns around the company's diversity, equity and inclusion efforts.\nHowever, that early review process came shortly after renewed political backlash against ABC following comments made by TV host Jimmy Kimmel on his late-night show, which airs on the broadcast network. ABC has also faced criticism from the government around its daytime talk show, \"The View.\"\nABC's lawsuit calls for the FCC to halt its early broadcast renewal proceedings.\nAn FCC spokesperson said in a statement Tuesday the government entity was working in the public interest.\n\"Disney is obviously very concerned about the FCC's proceeding, as evidenced by their ongoing campaign of disinformation as well as their decision to ask a court to stop the FCC from further pursuing matters. The FCC will continue to follow the facts and law wherever they lead,\" the statement said.\nThe agency launched its review of ABC licenses in April, years ahead of their scheduled expiration. ABC shot back in May, saying in filings that it was submitting the applications \"under protest in response to an unlawful, arbitrary, and unconstitutional order\" from the FCC.\nFCC Chairman Brendan Carr told CNBC at the time that the agency's focus was on Disney's DEI practices and that the early license renewal was not tied to First Amendment matters.\nCarr was appointed by Trump to lead the federal entity meant to regulate the media and telecommunications industry. It began its investigation into Disney's stations last year for possible violations of the Communications Act of 1934 and the FCC's rules regarding its prohibition on unlawful discrimination.\nOn Tuesday, ABC said it \"continues to face irreparable harm\" from the administration, which \"has been acting\" through the FCC.\nLast week, Disney CEO Josh D'Amaro doubled down on the company's position in a CNBC interview.\n\"I think you saw in our FCC filings our position on this is clear,\" D'Amaro told CNBC's Julia Boorstin at the time. \"We're very principled on this. We're going to stand up to what we believe is journalistic and integrity, and we're not going to be told how to run that side of our business.\"\nD'Amaro took over as CEO in March from longtime Disney chief Bob Iger.\nLast week, Iger agreed to purchase a majority stake in the NBA's Los Angeles Lakers alongside Joshua Kushner, founder of Thrive Capital and brother of Jared Kushner, who is married to Trump's daughter Ivanka.\nFCC Commissioner Anna Gomez — the sole Democrat on the commission and who has opposed its actions against ABC thus far — issued a statement on Tuesday in support of ABC's move to sue the FCC.\n\"For months, the FCC has waged a campaign of censorship and control against Disney's ABC stations, using the threat of broadcast license revocations to punish a company for speech this administration doesn't like,\" Gomez said. \"I have long called on companies to push back against this kind of government intimidation, and I'm glad Disney has shown courage and stepped up. This should be a welcome sign for every broadcaster who has felt the weight of this overreaching government pressure in silence.\"",
    "bodyJa": "ディズニー傘下のABCは、ドナルド・トランプ大統領を批判してきた番組の性質上、同社に対する政府機関の最近の調査を「報復キャンペーン」であるとして、連邦通信委員会に対して憲法修正第1条に基づく訴訟を起こした。\n放送ネットワークは火曜日、コロンビア特別区連邦地方裁判所に訴訟を起こした。\nこれは、同社の多様性、公平性、包括性への取り組みに対する懸念を理由に、FCCがABCの一連の放送局ライセンスの早期更新を開始してから数か月後に行われた。\nしかし、この初期審査プロセスは、テレビ司会者のジミー・キンメル氏が放送ネットワークで放送している深夜番組での発言を受けて、ABCに対する政治的反発が再び高まった直後に行われた。 ABCは昼のトーク番組「ザ・ビュー」を巡って政府からの批判にも直面している。\nABCの訴訟では、FCCに対し放送更新手続きの早期中止を求めている。\nFCCの広報担当者は火曜日の声明で、政府機関は公益のために活動していると述べた。\n「ディズニーは明らかに、FCCの訴訟手続きを非常に懸念している。これは、継続的な偽情報キャンペーンや、FCCによるさらなる追及の停止を裁判所に求める決定から分かるように、FCCは今後も、どこまでも事実と法律に従い続ける」と声明で述べた。\n同庁は予定されていた有効期限の数年前となる4月にABCライセンスの見直しを開始した。 ABCは5月に反撃し、申請書類はFCCからの「違法かつ恣意的かつ憲法違反の命令に応じた抗議の下」に提出していると述べた。\nFCC委員長のブレンダン・カー氏は当時CNBCに対し、FCCはディズニーのDEI慣行に焦点を当てており、ライセンスの早期更新は合衆国憲法修正第1条の問題とは関係ないと語った。\nカー氏はトランプ大統領により、メディアと通信業界を規制する連邦機関のトップに任命された。同局は昨年、1934年通信法と不法差別の禁止に関するFCC規則に違反した疑いでディズニーの放送局に対する調査を開始した。\n火曜日、ABCは、FCCを通じて「行動している」政権から「取り返しのつかない損害に直面し続けている」と述べた。\n先週、ディズニーのジョシュ・ダマロ最高経営責任者（CEO）はCNBCのインタビューで同社の立場をさらに強調した。\n「私たちのFCC提出書類を見れば、この件に関する私たちの立場は明らかだ」とダマロ氏は当時CNBCのジュリア・ブールスティンに語った。 「私たちはこれに関して非常に原則を持っています。私たちはジャーナリズムと誠実であると信じているものに立ち向かうつもりであり、私たちのビジネスのその側面をどのように運営するかを指示されるつもりはありません。」\nダマロは3月にディズニーのCEOを長年務めたボブ・アイガー氏からCEOに就任した。\nアイガー氏は先週、スライヴ・キャピタルの創設者でトランプ氏の娘イヴァンカ氏と結婚しているジャレッド・クシュナー氏の弟であるジョシュア・クシュナー氏とともに、NBAのロサンゼルス・レイカーズの過半数の株式を購入することに合意した。\nFCC委員のアンナ・ゴメス委員（委員会唯一の民主党員で、これまでABCに対する行動に反対してきた人物）は火曜日、FCCを提訴するというABCの動きを支持する声明を発表した。\n「FCCは何か月もの間、ディズニー傘下のABC局に対する検閲と統制のキャンペーンを展開し、放送ライセンス取り消しの脅しを利用して、政権が気に入らない言論を行った企業を罰してきた」とゴメス氏は述べた。 「私は長い間、この種の政府の脅迫に対抗するよう企業に呼びかけてきたが、ディズニーが勇気を示し、一歩踏み出したことをうれしく思う。これは、この行き過ぎた政府の圧力の重みを沈黙で感じてきたすべての放送局にとって歓迎すべき兆候であるはずだ。」",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
