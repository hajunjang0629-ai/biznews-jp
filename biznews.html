d counter-sanctions regimes directly at the border, said Guo Shan, partner at China-focused Hutong Research.\nAuthorities could prevent Chinese citizens from leaving if their departure violates export control rules in a way that could endanger national industrial or technological security.\n\"By tying export controls directly to exit rights, the rules give Beijing added leverage against foreign governments and firms,\" Eurasia's Wang said.\nWealth flows\nThe rules are already changing behavior among private bankers who help wealthy Chinese clients move money offshore. Some have been questioned at Chinese border checkpoints about the purpose of their visits and asked to file advance applications before arrival, according to offshore wealth management firms serving mainland Chinese clients.\nBankers have grown warier of inviting mainland clients to events in Singapore, sometimes rebranding them as jewelry exhibitions rather than overseas-investment seminars to avoid scrutiny, according to a Singapore-based fund manager who advises wealthy Chinese clients on overseas holdings, who asked not to be named due to the sensitivity of the matter.\nAnother Singapore-based banker, who asked to be identified only by her surname, Fan, due to the sensitivity of the matter, said some colleagues now travel to China without documents containing sensitive information. They send them separately by courier to avoid spot checks at customs that might give authorities access to client financial data.\nA provision under the new rules bars foreign companies from providing exit-entry immigration services within mainland China, and requires registered agencies to report public-sector employees and military personnel who illicitly apply for foreign nationality or overseas permanent residency.\nThe rule raises costs for Hong Kong- and Singapore-based intermediaries handling immigration, education and real estate applications for mainland clients, pushing more of them toward opening onshore entities, Eurasia's Wang said.\nThe new framework also gives local authorities firmer legal ground to restrict departures by people they consider to owe tax on offshore wealth — a practice that predates the rules but now carries fresh teeth. \"Emigration and overseas property purchases have already slowed amid compliance uncertainty,\" Wang said.\nIn July, China imposed a 20% income tax on assets moved into offshore trusts since 2023, closing a longstanding loophole used by wealthy families for asset protection and succession planning. Local authorities also reportedly started levying taxes on insurance policy income and salaries that Chinese citizens earned overseas.\nEarlier this month, regulators set a 20% tax owed by foreigners on dividends obtained from foreign-invested enterprises, removing an incentive Chinese entrepreneurs once had to acquire foreign citizenship to take advantage of the preferential tax exemption.\n\"The various measures create the perception that laws may change without notice with retroactive effect, the tightening is coming from all sides,\" said Clifford Ng, partner at Zhonglun Law firm. Clients with no remaining family or fortune in China are now more likely to leave for good, while those with ties still in the country are choosing to comply.",

    "id": "trump-says-ai-safety-fears-a-hoax-as-he-252e888e",
    "title": "Trump says AI safety fears a 'hoax' as he rejects calls for greater safeguards",
    "titleJa": "Trump says AI safety fears a 'hoax' as he rejects calls for greater safeguards",
    "summaryJa": "The US president's comments come after Anthropic co-founder Jack Clark told the BBC an AI \"kill switch\" may need to be mandatory.",
    "bodyOriginal": "Trump says AI safety fears a 'hoax' as he rejects calls for greater safeguards\n- Published\nUS President Donald Trump has said fears about the safety of AI are a \"hoax\", as he criticised calls to have more guardrails for the fast-moving technology.\nIt comes after Jack Clark, a co-founder of AI giant Anthropic, told the BBC that a \"kill switch\" for dangerous AI that can be checked by a third party may need to be mandatory for the industry.\nClark's comments followed warnings about the risks the technology poses to humanity that have been raised in recent days by several executives and staff at leading AI firms.\nThose concerns triggered a selloff in shares of some tech firms on Monday as investors weighed the impact of a potential slowdown in the development of AI.\nIn a series of social media posts on Monday, the US president compared warnings about AI to the \"Global Warming Scam\", that he said was \"being perpetrated by the Radical Left Dumocrats\".\nTrump also called himself \"the Hoax Buster\", likening concerns about the safety of the technology to what he called \"the RUSSIA, RUSSIA, RUSSIA HOAX\".\nIn another post he wrote: \"There is a SICK conspiracy going on against AI and Data Centers, and the only one that is happy about it is China. WHOEVER WINS AI, WINS!\"\nAnd earlier on Monday, Trump posted on social media that the only \"guardrails\" needed for AI was a \"strong and smart\" president.\nAlso on Monday, Chinese state media said experts had warned that \"Washington's growing anxiety over China's rapid AI development appears to be increasingly distorting its policy priorities\".\n\"They know that China has become a strong competitor in AI, and worry that if the US slows down development or tightens regulation, China could catch up even faster,\" Xin Qiang, a professor of American Studies at Fudan University, told the Global Times.\nClark, who is one of Anthropic's seven founders, said earlier on Monday that a way of shutting off AI software completely if it gets too dangerous was something society \"might want to eventually pass rules around\".\nHe added that \"most labs have different ways of being able to pull the plug\", including Anthropic, but said lawmakers may need to enforce having one.\nClark's comments add to the growing number of tech industry and political figures calling for better safeguards.\nOn Monday, Microsoft AI became the latest major company to discuss limiting the models it is developing, as it published an outline document on what it called \"humanist AI\".\nThe firm's chief executive Mustafa Suleyman told business news channel CNBC that it had been working on the new guidance for months and had decided to publish it now due to the current debate around the technology.\nIn an indication of how concerns over the technology have been thrust into the spotlight, two high-profile figures on opposite sides of US politics are set to appear at the same event calling for a re-evaluation of AI policy.\nFormer Trump chief strategist Steve Bannon and veteran progressive Senator Bernie Sanders are due to speak at the \"Pro-Human Assembly\" in Washington on Tuesday.\nAccording to its website the gathering \"aims to define a shared vision and articulate a better, more human-centric path for AI development\".\nSanders told BBC's Newsnight last week that \"we have got to do something immediately to stop the uncontrolled growth of AI\".\n\"You've got the existential threat of the possibility of humanity being wiped out,\" he said.\nThe debate over the potential dangers posed by the technology intensified in recent days after a post by Jacob Coxon, a researcher who left Anthropic over concerns AI could wipe out humanity, went viral.\nIn response, Anthropic scientist Evan Hubinger said he thought the possibility of AI causing human extinction \"within the next decade\" was more than 10%.\nThis weekend, Anthropic chief executive Dario Amodei called for the pace of AI development to slow and be more closely monitored, as the company has done before, though some have questioned the motivations behind this.\nAmodei also said that any action to rein in AI should be done \"without sacrificing commercial advantage\".\nThe bosses of two rival AI firms, Sam Altman of OpenAI and Elon Musk of xAI, have also said they agree with Amodei's proposal for industry-wide deceleration and regulation, as well as independent monitoring of AI model development.\n- Published1 hour ago\n- Published16 hours ago\n- Published17 hours ago",
    "bodyJa": "Trump says AI safety fears a 'hoax' as he rejects calls for greater safeguards\n- Published\nUS President Donald Trump has said fears about the safety of AI are a \"hoax\", as he criticised calls to have more guardrails for the fast-moving technology.\nIt comes after Jack Clark, a co-founder of AI giant Anthropic, told the BBC that a \"kill switch\" for dangerous AI that can be checked by a third party may need to be mandatory for the industry.\nClark's comments followed warnings about the risks the technology poses to humanity that have been raised in recent days by several executives and staff at leading AI firms.\nThose concerns triggered a selloff in shares of some tech firms on Monday as investors weighed the impact of a potential slowdown in the development of AI.\nIn a series of social media posts on Monday, the US president compared warnings about AI to the \"Global Warming Scam\", that he said was \"being perpetrated by the Radical Left Dumocrats\".\nTrump also called himself \"the Hoax Buster\", likening concerns about the safety of the technology to what he called \"the RUSSIA, RUSSIA, RUSSIA HOAX\".\nIn another post he wrote: \"There is a SICK conspiracy going on against AI and Data Centers, and the only one that is happy about it is China. WHOEVER WINS AI, WINS!\"\nAnd earlier on Monday, Trump posted on social media that the only \"guardrails\" needed for AI was a \"strong and smart\" president.\nAlso on Monday, Chinese state media said experts had warned that \"Washington's growing anxiety over China's rapid AI development appears to be increasingly distorting its policy priorities\".\n\"They know that China has become a strong competitor in AI, and worry that if the US slows down development or tightens regulation, China could catch up even faster,\" Xin Qiang, a professor of American Studies at Fudan University, told the Global Times.\nClark, who is one of Anthropic's seven founders, said earlier on Monday that a way of shutting off AI software completely if it gets too dangerous was something society \"might want to eventually pass rules around\".\nHe added that \"most labs have different ways of being able to pull the plug\", including Anthropic, but said lawmakers may need to enforce having one.\nClark's comments add to the growing number of tech industry and political figures calling for better safeguards.\nOn Monday, Microsoft AI became the latest major company to discuss limiting the models it is developing, as it published an outline document on what it called \"humanist AI\".\nThe firm's chief executive Mustafa Suleyman told business news channel CNBC that it had been working on the new guidance for months and had decided to publish it now due to the current debate around the technology.\nIn an indication of how concerns over the technology have been thrust into the spotlight, two high-profile figures on opposite sides of US politics are set to appear at the same event calling for a re-evaluation of AI policy.\nFormer Trump chief strategist Steve Bannon and veteran progressive Senator Bernie Sanders are due to speak at the \"Pro-Human Assembly\" in Washington on Tuesday.\nAccording to its website the gathering \"aims to define a shared vision and articulate a better, more human-centric path for AI development\".\nSanders told BBC's Newsnight last week that \"we have got to do something immediately to stop the uncontrolled growth of AI\".\n\"You've got the existential threat of the possibility of humanity being wiped out,\" he said.\nThe debate over the potential dangers posed by the technology intensified in recent days after a post by Jacob Coxon, a researcher who left Anthropic over concerns AI could wipe out humanity, went viral.\nIn response, Anthropic scientist Evan Hubinger said he thought the possibility of AI causing human extinction \"within the next decade\" was more than 10%.\nThis weekend, Anthropic chief executive Dario Amodei called for the pace of AI development to slow and be more closely monitored, as the company has done before, though some have questioned the motivations behind this.\nAmodei also said that any action to rein in AI should be done \"without sacrificing commercial advantage\".\nThe bosses of two rival AI firms, Sam Altman of OpenAI and Elon Musk of xAI, have also said they agree with Amodei's proposal for industry-wide deceleration and regulation, as well as independent monitoring of AI model development.\n- Published1 hour ago\n- Published16 hours ago\n- Published17 hours ago",

    "id": "weapon-shortfalls-hundreds-of-buildings-ae9ff7e1",
    "title": "Weapon shortfalls, 'hundreds' of buildings and aircraft damaged, $33.4 billion spent: the U.S. government tallies costs of the Iran war",
    "titleJa": "Weapon shortfalls, 'hundreds' of buildings and aircraft damaged, $33.4 billion spent: the U.S. government tallies costs of the Iran war",
    "summaryJa": "The department revealed that the Iran war had cost an estimated $33.4 billion as of June 29.",
    "bodyOriginal": "Iranian strikes have damaged and destroyed \"hundreds of buildings and structures\" at U.S. bases in the Middle East, as well as \"dozens\" of U.S. aircraft as of the end of June, according to a government report.\nThe Iran war cost an estimated $33.4 billion as of June 29, according to the U.S. Department of Defense, which released a Lead Inspector General report to Congress on the Iran war Monday tracking the conflict up to end-June. That includes $184 million in physical damage to U.S. diplomatic facilities in four countries—Iraq, Kuwait, Saudi Arabia, and the United Arab Emirates—from Iranian strikes, it said.\nThe expenditure of U.S. munitions during the conflict said had \"resulted in strategic inventory shortfalls and revealed industrial base bottlenecks for munitions resupply.\"\nU.S. President Donald Trump posted before the release of the report that the U.S. \"is producing more Exquisite and Elite Weapons than at any time in our History.\"\nThe report showed a fifth generation F-35A damaged by enemy fire, the first time any aircraft of its type had suffered battle damage. Four F-15E fighter jets and an A-10 ground attack aircraft were destroyed as of end-June.\nThe F-35A costs $92 million per plane, while the F-15E cost $31.1 million dollars in 1998, according to the U.S. Air Force.\nSeven KC-135 refueling aircraft were damaged or destroyed, while seven helicopters and over 30 drones were lost.",
    "bodyJa": "Iranian strikes have damaged and destroyed \"hundreds of buildings and structures\" at U.S. bases in the Middle East, as well as \"dozens\" of U.S. aircraft as of the end of June, according to a government report.\nThe Iran war cost an estimated $33.4 billion as of June 29, according to the U.S. Department of Defense, which released a Lead Inspector General report to Congress on the Iran war Monday tracking the conflict up to end-June. That includes $184 million in physical damage to U.S. diplomatic facilities in four countries—Iraq, Kuwait, Saudi Arabia, and the United Arab Emirates—from Iranian strikes, it said.\nThe expenditure of U.S. munitions during the conflict said had \"resulted in strategic inventory shortfalls and revealed industrial base bottlenecks for munitions resupply.\"\nU.S. President Donald Trump posted before the release of the report that the U.S. \"is producing more Exquisite and Elite Weapons than at any time in our History.\"\nThe report showed a fifth generation F-35A damaged by enemy fire, the first time any aircraft of its type had suffered battle damage. Four F-15E fighter jets and an A-10 ground attack aircraft were destroyed as of end-June.\nThe F-35A costs $92 million per plane, while the F-15E cost $31.1 million dollars in 1998, according to the U.S. Air Force.\nSeven KC-135 refueling aircraft were damaged or destroyed, while seven helicopters and over 30 drones were lost.",

    "id": "oil-and-treasury-yields-haven-t-moved-th-82166cd8",
    "title": "Oil and Treasury yields haven’t moved this closely in seven years. That’s bad news for markets",
    "titleJa": "Oil and Treasury yields haven’t moved this closely in seven years. That’s bad news for markets",
    "summaryJa": "Oil and 10-year Treasury yields are moving in near lockstep, with their correlation at its strongest since 2019.",
    "bodyOriginal": "Oil prices and Treasury yields are moving in a tight lockstep, compounding the pressure on markets as investors grapple with worries over higher inflation.\nThe one-month rolling correlation between front-month West Texas Intermediate crude and the 10-year Treasury yield has climbed to 0.96, according to BMO Capital Markets. That's the strongest positive relationship since June 2019, and before that October 2014.\nThe synchronized moves come as oil prices have surged due to the conflict in the Middle East, with the benchmark 10-year Treasury yield briefly topping 5% Monday for the first time since October 2023.\nThe exceedingly tight relationship means another leg higher in oil could increasingly reverberate across financial markets through higher inflation expectations, elevated Treasury yields and steep borrowing costs, while potentially keeping the Federal Reserve monetary policy tighter for longer, said industry veterans.\n\"The main impact is that an oil shock now transmits more directly into financial conditions,\" said Billy Leung, investment strategist at Global X ETFs. \"Higher crude can lift inflation expectations, delay Fed easing and raise the discount rate applied across equities and credit at the same time.\"\n\"That makes energy headlines more consequential for broader markets and reduces some of the diversification investors would normally expect between commodities and government bonds,\" he added.\nThe implications stretch across asset classes.\nHigher Treasury yields reduce the relative appeal of equities as they raise financing costs for businesses, while expensive oil squeezes margins for companies dependent on energy and transportation.\nGrowth and technology stocks can be particularly exposed because their valuations depend heavily on earnings expected far into the future.\nA bond bear market?\nEd Yardeni, president of Yardeni Research, said the chain increasingly runs from energy through inflation and bonds into monetary policy and equities.\n\"It's certainly bad news that if oil prices continue to move higher, that would indicate that bond yields are moving higher, and then higher inflationary expectations raise the odds that we'll be in a tightening cycle when it comes to the Fed funds rate,\" Yardeni said.\n\"Not one and done, but there there could be two or three rate hikes up ahead here, and that in turn can certainly be unsettling for the stock market.\"\nKomal Sri-Kumar, president of Sri-Kumar Global Strategies, is already steering investors away from assets most vulnerable to higher rates. He favors short-duration fixed income and defensive equities, while recommending physical assets including real estate, copper and gold as hedges. He said technology growth stocks are more vulnerable as interest rates remain elevated.\n\"You're going to have a bond bear market, the yields headed up, and I don't see anything that stops the upward march of oil and natural gas prices either,\" said Sri-Kumar.\nConsumers face a similar double hit.\nHigher energy prices feed directly into gasoline costs and indirectly into goods and services transported by truck and rail, while rising Treasury yields filter into mortgages, auto loans and other borrowing costs, said Andy Lipow, president of Lipow Oil Associates.\n\"Both increase in the WTI crude price, along with the increase in the treasury yield, are bad news for the consumer,\" Lipow said.\nFor businesses, higher yields also raise the cost of financing inventories and investment, potentially weighing on capital-intensive projects such as the buildout of artificial intelligence and the energy infrastructure needed to support it, Lipow said.\nWhile oil and Treasurys have entered a tighter relationship, it may not be so if global tensions recede.\nLeung said the 0.96 correlation is unusually high but could unwind rapidly if geopolitical tensions ease or growth fears begin to dominate. Lipow similarly said the magnitude partly reflects the relatively short period since the U.S.-Iran conflict began.",
    "bodyJa": "Oil prices and Treasury yields are moving in a tight lockstep, compounding the pressure on markets as investors grapple with worries over higher inflation.\nThe one-month rolling correlation between front-month West Texas Intermediate crude and the 10-year Treasury yield has climbed to 0.96, according to BMO Capital Markets. That's the strongest positive relationship since June 2019, and before that October 2014.\nThe synchronized moves come as oil prices have surged due to the conflict in the Middle East, with the benchmark 10-year Treasury yield briefly topping 5% Monday for the first time since October 2023.\nThe exceedingly tight relationship means another leg higher in oil could increasingly reverberate across financial markets through higher inflation expectations, elevated Treasury yields and steep borrowing costs, while potentially keeping the Federal Reserve monetary policy tighter for longer, said industry veterans.\n\"The main impact is that an oil shock now transmits more directly into financial conditions,\" said Billy Leung, investment strategist at Global X ETFs. \"Higher crude can lift inflation expectations, delay Fed easing and raise the discount rate applied across equities and credit at the same time.\"\n\"That makes energy headlines more consequential for broader markets and reduces some of the diversification investors would normally expect between commodities and government bonds,\" he added.\nThe implications stretch across asset classes.\nHigher Treasury yields reduce the relative appeal of equities as they raise financing costs for businesses, while expensive oil squeezes margins for companies dependent on energy and transportation.\nGrowth and technology stocks can be particularly exposed because their valuations depend heavily on earnings expected far into the future.\nA bond bear market?\nEd Yardeni, president of Yardeni Research, said the chain increasingly runs from energy through inflation and bonds into monetary policy and equities.\n\"It's certainly bad news that if oil prices continue to move higher, that would indicate that bond yields are moving higher, and then higher inflationary expectations raise the odds that we'll be in a tightening cycle when it comes to the Fed funds rate,\" Yardeni said.\n\"Not one and done, but there there could be two or three rate hikes up ahead here, and that in turn can certainly be unsettling for the stock market.\"\nKomal Sri-Kumar, president of Sri-Kumar Global Strategies, is already steering investors away from assets most vulnerable to higher rates. He favors short-duration fixed income and defensive equities, while recommending physical assets including real estate, copper and gold as hedges. He said technology growth stocks are more vulnerable as interest rates remain elevated.\n\"You're going to have a bond bear market, the yields headed up, and I don't see anything that stops the upward march of oil and natural gas prices either,\" said Sri-Kumar.\nConsumers face a similar double hit.\nHigher energy prices feed directly into gasoline costs and indirectly into goods and services transported by truck and rail, while rising Treasury yields filter into mortgages, auto loans and other borrowing costs, said Andy Lipow, president of Lipow Oil Associates.\n\"Both increase in the WTI crude price, along with the increase in the treasury yield, are bad news for the consumer,\" Lipow said.\nFor businesses, higher yields also raise the cost of financing inventories and investment, potentially weighing on capital-intensive projects such as the buildout of artificial intelligence and the energy infrastructure needed to support it, Lipow said.\nWhile oil and Treasurys have entered a tighter relationship, it may not be so if global tensions recede.\nLeung said the 0.96 correlation is unusually high but could unwind rapidly if geopolitical tensions ease or growth fears begin to dominate. Lipow similarly said the magnitude partly reflects the relatively short period since the U.S.-Iran conflict began.",

    "title": "AI regulation faces political deadlock as calls grow for Congress to act",
    "titleJa": "AI regulation faces political deadlock as calls grow for Congress to act",
    "summaryJa": "With Trump opposed and Congress divided, new safety legislation on AI is unlikely to pass anytime soon despite mounting pressure.",
    "bodyOriginal": "AI regulation faces political deadlock as calls grow for Congress to act\n- Published\nWhen President Donald Trump responded to mounting calls for a slowdown in the development of artificial intelligence (AI) on Monday, he was unequivocal.\n\"AI taking over the World, destroying Humanity, and all other things bad, is a HOAX,\" he wrote on social media. He earlier argued that \"the only control or 'guardrails' that AI needs\" is a \"strong and smart\" president.\nTrump's view, unsurprisingly, is not shared by senior Democrats in Congress. It is also opposed by leading figures in the AI sector, who have in recent days issued stark safety warnings and made the case for government regulation.\nIn the US, however, new safety legislation on AI is unlikely anytime soon.\nAny bill would have to pass in both the House of Representatives and the Senate to become law. Trump's staunch opposition to new guardrails on AI means the Republican Party, which has a majority in both chambers, is unlikely to break from him and back restrictions or government controls.\nAnd even if they did, whatever bill is passed would most likely require the president's signature to take effect. Trump's dismissal of the need for regulations on Monday effectively hit pause on any hope for executive action.\nAI 'kill switch' may need to be mandatory, Anthropic co-founder tells BBC\n- Published4 hours ago\nUK government rejects 'kill switch' idea for dangerous AI\n- Published3 days ago\nBeyond this, a more immediate obstacle to any movement in Congress is the clock.\nThe House is set to enter recess at the end of the week until after the midterm elections in early November. Some leading Democrats are calling for that recess to be delayed until AI safeguards can be passed in the chamber.\n\"Congress should not leave town until something is done decisively to protect the safety and the wellbeing of the American people,\" Democratic House Minority Leader Hakeem Jeffries told reporters on Monday.\nA group of House Democrats calling for Congress to be given more time to debate the issue have also written a letter to Republican Speaker Mike Johnson, who would ultimately decide on delaying the recess.\n\"Reasonable minds may disagree about precisely how Congress should regulate this rapidly evolving technology,\" the group said. \"We cannot disagree about the imperative for Congress to act.\"\nOver the weekend, Republican congresswoman Anna Paulina Luna suggested on X that \"Congress SHOULD convene a special session\" on the issue.\nBut it is highly unlikely the recess will be delayed or a special session convened in the coming days. Speaker Johnson, who on Monday faced a barrage of questions about AI from reporters in the halls of Congress, gave no sign he intended to move quickly this week.\nWhen asked if the House would take action on AI concerns before breaking for the midterms, he replied: \"This is a very complex issue.\"\nHe said Trump would hold a meeting at the White House soon with AI executives to discuss \"the responsibility of the companies to maintain safety and what role, if any, the government has to play in that\".\n\"We want to emphasise the necessity of [AI companies] providing safe products and self-regulating,\" Johnson said, before adding: \"There is also a role potentially for Congress to play.\"\nWhat that role could look like is unclear - and is a contested question among those in Congress.\nNo consensus and competing bills\nWhile Democrats are pushing for more time to address AI safety, they are themselves divided on how best to regulate AI.\nEven if the party were to win control of both chambers of Congress in November's elections, there are no guarantees of swift action as it would have to unite behind one proposal.\nAnd there are numerous legislative proposals already on Capitol Hill that are designed to address AI safety, ranging from independent reviews, to a federal \"kill switch\", to a total moratorium on data centres proposed by Senator Bernie Sanders.\nThese diverging proposals point to a lack of consensus in Congress - but also an urgency among some lawmakers to take action.\nRepublican Senate Majority Leader John Thune and his Democratic colleague Amy Klobuchar are working on a bill that would force some AI companies to submit to federal oversight.\n\"You don't want to stifle innovation,\" Thune said on Monday, \"but I think you also want to make sure that the more advanced threats can be mitigated.\"\nDemocratic congresswoman Lori Trahan, meanwhile, has spent months working on a different bipartisan proposal in the House that would give the government the power to halt the use of an AI model if officials find there is an \"imminent catastrophic risk\".\n\"The federal government needs to put guardrails in place,\" she told the BBC, warning that the technology would eventually impact every aspect of society. \"I don't think we have any more time to wait. This is all hands on deck.\"\nTrahan has worked on her proposed legislation, the Frontier Act, jointly with Republican Jay Obernolte and, among other things, it would require independent audits of AI research labs.\nBut Trahan recognised that any movement this week was unlikely.\nCalls for self-regulation\nSome leading Republicans, including Speaker Johnson, have often referred to \"self-regulation\" when discussing government action and called on the companies to take responsibility for AI safety.\nOne of Trump's top AI advisers, David Sacks, told the BBC's US partner CBS News on Monday that some of the existential warnings by insiders had been overblown. \"I think this is becoming a panic,\" he said.\n\"First and foremost, it is on them to make their products safe,\" Sacks said. \"They should tell us how they should do that. If they can't do that, they should step aside for people who can do that.\"\n\"Why are you acting like this is something that you can't control?\" he said, referring to Anthropic's boss Dario Amodei, who has called for a slowdown in development. \"If you can't control it, then don't do it.\"\nSome experts share the view that, in the short-term at least, it is up to the AI companies to regulate themselves responsibly.\n\"You might want an act of Congress, and I would love a congressionally mandated regime that requires safety and testing and bias testing,\" said Asad Ramzanali, the director of AI & Technology Policy at Vanderbilt University.\n\"But absent that action, the companies have autonomy.\"\nOthers have expressed scepticism at the recent flurry of warnings by AI staffers.\nTrevor Traina, a tech executive who was a diplomat during Trump's first term, said: \"I don't think the typical citizen has encountered anything scary or really problematic with AI.\"\n\"We're relying on the tweets of a half-dozen people who are all vying for perceived supremacy,\" he said. \"The cynic in me thinks, 'Are they are really concerned, or are they trying to prove which model is the most awesome?'\"\nAlexandra Reeve Givens, who previously worked in government and now leads the US non-profit the Center for Democracy and Technology, said she did not think meaningful federal AI regulation would pass in the foreseeable future.\nWhile the Trump administration has set up an entirely voluntary framework for AI companies to submit their models and tools for government assessment, Givens noted that the framework itself remains a secret.\n\"There's no clear standard to make sure that the approach is even grounded in the rule of law,\" she said.\nAppeals from various groups to release the framework have so far gone ignored.\nThe White House approach, combined with a lack of political will and consensus, makes passing laws around AI difficult.\n\"There is no question that federal legislation is challenging in this climate, but Congress also has to grapple with which of the many types of AI risk need to be addressed,\" Givens said.\n\"It's not that AI is ungovernable, it's that each risk needs a tailored approach.\"\n- Published12 hours ago\n- Published12 hours ago",

    "id": "supreme-court-rejects-trump-bid-to-lift-afb8c549",
    "title": "Supreme Court rejects Trump bid to lift block on U.S. Postal Service mail-in ballots rule",
    "titleJa": "Supreme Court rejects Trump bid to lift block on U.S. Postal Service mail-in ballots rule",
    "summaryJa": "Justice Brett Kavanaugh said that applying the U.S. Postal Service rule in the 2026 midterm elections \"would be arbitrary and capricious.\"",
    "bodyOriginal": "The Supreme Court on Monday night rejected a request by the Trump administration to lift a judicial block on a controversial U.S. Postal Service rule that critics feared would make it more difficult to vote by mail in the upcoming midterm elections.\nIn an unsigned order, the Supreme Court said the administration \"is unlikely to succeed on the merits of its challenge to the\" preliminary injunction issued by a federal court judge in Boston preventing the USPS rule from being used in November's elections nationwide.\nThe decision comes less than two months before Election Day for contests that will determine which political party controls each chamber of Congress. President Donald Trump's fellow Republicans hold slim majorities in both the House of Representatives and the Senate.\nJustice Brett Kavanaugh, a Trump appointee, concurred with the ruling in a statement that said, \"there is at least a fair prospect that the final rule falls within the Postal Service's statutory authority.\"\n\"But applying the rule in the 2026 elections would be arbitrary and capricious in violation of the Administrative Procedure Act because state and local election officials do not have sufficient time to reasonably implement the rule before the elections,\" Kavanaugh added. \"For that reason, I concur in the denial of the application for stay.\"\nTwo of Kavanaugh's fellow conservatives on the nine-justice court, Justices Samuel Alito and Clarence Thomas, dissented from the decision to reject a stay of the injunction against the Postal Service rule, which was issued in late August.\nThat rule, which implemented an executive order issued by Trump in March, established new standards for ballot envelopes and required states to create lists of voters who were eligible to obtain mail ballots.\nMonday's decision by the Supreme Court only prevents the Postal Service's rule from being used in November's elections. It is possible that the court will allow the rule to be used in future elections.\nAlito, in his written dissent, said that some of the plaintiffs who had sued to challenge the Postal Service's rule lacked legal standing to do so, \"while the remainder are pursuing a claim that this Court has recently called a 'Hail Mary pass' that 'rarely succeeds.'\"\n\"The Government has a strong interest in enforcing the rule, and implementing it will also 'enhance the visibility of Federal Ballot Mail' in order to better detect election fraud,\" Alito wrote.\n\"On the other side of the balance, the plaintiff States invoke the practical effects of implementing the rule close to the midterm elections. I take that problem very seriously, but it is not enough to convince me to deny the application.\"\nCelina Stewart, CEO of the League of Women Voters, one of the plaintiffs in the case, said in a statement, \"Today, the Supreme Court refused to allow the federal government to throw our elections into chaos just weeks before Election Day.\"\n\"The Postal Service exists to deliver Americans' mail — not to rewrite election rules, demand voters' personal information, or decide which ballots make it through the system,\" Stewart said. \"This was an extraordinary attempt to interfere with voting in all 50 states, and voters should never have been put in this position. Voters should never be caught in the middle of a political power warfare.\"\nNew York Attorney General Letitia James, who was part of the coalition suing to block the rule, said in a statement, \"I am truly relieved the Court granted this reprieve.\"\n\"Voters should never have to wonder whether a ballot they legally cast will be counted because the federal government suddenly changed the rules,\" James said. \"We will keep fighting to make sure every eligible ballot is counted come November. Now, I encourage all eligible Americans to get out and vote – and vote early.\"",

  {
    "id": "i-got-paid-5-000-to-move-to-a-place-i-d-05e5dc8c",
    "title": "I got paid $5,000 to move to a place I'd never heard of",
    "titleJa": "I got paid $5,000 to move to a place I'd never heard of",
    "summaryJa": "Relocation schemes offer support for people who want to swap big cities for a cheaper, quieter life.",
    "bodyOriginal": "I got paid $5,000 to move to a place I'd never heard of\n- Published\nWhen Brianna Beyrouti looks back on her former life in the city of Portland, Oregon, she says she had been financially \"drowning\".\n\"I was absolutely living paycheque to paycheque. Every time the smallest thing came up, it was like 'Oh, gosh, the kids need shoes, how am I going to afford that?' As a single parent, everything falls on my shoulders.\"\nLast year, Brianna left Portland and its metropolitan population of 2.5 million people.\nShe and her two children moved 2,000 miles east to Muncie, Indiana, a small city with 65,000 people, a university and lots of open space, taking advantage of a scheme that contributed $5,000 towards the cost of the move to boost population growth.\nThe relocation has been a revelation for her finances. She continues to work remotely for the same bank, so her annual salary of $107,000 (£79,000) is unchanged, but she has been able to buy a home for the first time. And her mortgage is less than she used to have to pay in rent.\nIn Portland she was paying rent of $1,290 a month for an apartment, while the combined cost of her mortgage, home insurance and property tax for her detached home in Muncie is $1,100.\nAdd the fact that state income tax is lower in Indiana, and that her car insurance and energy bills have also fallen, and Brianna says she is $600 a month better off.\n\"I'm able to live my life more than I was before,\" she says. \"When my kids want something, I'm much more inclined to say yes. My quality of life has increased dramatically.\"\nCash incentive\nBrianna is not alone in swapping a big city for a smaller one.\nAs the high cost of living continues to bite in the US, many of the biggest cities are seeing their populations fall, as people leave in search of cheaper property.\nA 2025 report from the National Association of Realtors found that for people moving to a different state, affordability was their primary reason., external\nAs a result, big cities from the likes of New York and Los Angeles to Portland, Oregon have seen a dip in their populations, external in recent years, further fuelled by the greatly increased acceptance of remote working since the Covid-19 pandemic.\nBy contrast, some small towns and cities across the US, such as Muncie, are seeing their populations rise after decades of decline. The number of people who live in Muncie hit 65,466 last year, official figures showed., external This is up from 65,194 in 2020, but still way down on its population of 71,828 in 1990.\nFree cinema tickets and wine\nTo help it stand out from the crowd, and encourage remote workers to move there from outside Indiana, Muncie's local council offers them $5,000 in cash to cover their relocation costs.\nIt does this via a website called MakeMyMove, which lists several such relocation support schemes offered by similar small cities and towns across the US. These pay MakeMyMove a subscription fee.\nOther incentives locations offer potential new residents are complementary cinema tickets, restaurant vouchers, and even free bottles of wine.\nBrianna and her children are one of around 100 families to have moved to Muncie through the MakeMyMove programme. She says she hadn't heard of the city before.\nAcross the US, MakeMyMove says it helped 1,000 people in total relocate last year, and is on target to increase that to 1,500 in 2026.\nScientist Elena Chrysostomou also used a relocation support scheme to swap a big city for smalltown US. In 2024 she relocated from San Diego, California, to Jacksonville, a town of 17,700 people in rural Illinois.\nThe move was backed by the Jacksonville Regional Economic Development Corporation (JREDC), which gave her $5,000 in cash, plus a \"quality of life package\" worth $4,000 that includes free gym memberships and golf passes.\nThe JREDC says that while the region is \"already a great place to live\", the support scheme helps to \"sweeten the deal\".\nElena was spending $3,000 renting a one-bedroom apartment in San Diego, but she now owns a three-bedroom home, with a mortgage of $1,868. At the same time, her salary has gone up 22% after she changed jobs, and her commute has gone down from a 15-minute drive to one of just one minute.\n\"I never thought that I'd be able to afford a house on my own, I always thought I'd need a partner, and even then, in San Diego, it would be so tough,\" she says.\n\"It's just more freeing. There's more security and independence.\"\nWhile both she and Brianna have no regrets, they do admit to some drawbacks to their new lives. These include the narrower range of activities and restaurant choices, leaving behind friends and family, and for Brianna the difficulty of settling her children into new schools.\nAnd while in Portland Brianna enjoyed walking to parks and shops, she now relies on her car to get anywhere.\nBut overall she says she is thrilled. \"I have the biggest savings I've ever had in my life, and I'm a homeowner, and I can do things with my kids – we actually went on vacation for the first time in my youngest's life.\"\n- Published30 June\n- Published28 May",

    "bodyOriginal": "Pubs in England and Wales to allow digital ID apps to prove age\n- Published\nAlcohol buyers will be able to use a digital ID app on their phones to prove their age under new rules introduced on Tuesday.\nPubs and shops in England and Wales can use the tech in addition to current physical forms of ID - with the government saying a digital option will make age-checks quicker and more secure for customers and staff.\nCustomers will be able to choose ID apps from a range of suppliers such as the Post Office, Yoti or Luciditi, provided they are on a government-approved list.\nThe change means businesses will no longer be required to let people use physical ID, but the government contends most establishments would.\nThe plan will be technology-agnostic, meaning that the government is not setting out in detail how each app must work.\nIt argues that under the voluntary digital ID scheme, drinkers would share fewer personal details with a venue or shop - such as tapping their phone on a reader or displaying a scannable QR code rather than handing over an official document.\nThe apps will also need to guard against customers borrowing devices from older friends and relatives, and ensure the ID app belongs to the person using it.\nYoti's digital ID app, for example, will only let a user log in if a scan of their face matches that of the person who signed up for the app.\nThe app then generates a QR code that can be scanned by a business with a free checker app, which tells them the person's age.\nThis is time-limited to make duping or sharing the QR code more difficult.\nDigital government minister Stephanie Peacock said having the option for digital ID would \"mean you do not need to carry a physical ID, nor hand over sensitive personal information\" meaning people could \"feel safer on a night out'\".\nAllen Simpson, chief executive of trade body UKHospitality, said the new rules were a \"positive step\".\nHe added the industry would work with government to make sure the scheme's roll-out would not be \"burdensome\" for the hospitality sector.\nThis would include ensuring there were multiple options for suppliers and that it was cost-efficient, Simpson said.\nAccess concerns\nThe government wants digital ID apps under its scheme to work together so customers do not need to use different apps in different venues.\nIt also wants the services to work offline and accessible even without mobile data or a Wi-Fi connection.\nIn future, the digital proof of age scheme could be extended to cover tobacco and vapes.\nBut digital rights campaigners have said such measures could lead to the exclusion of some groups.\nJasleen Chaggar of Big Brother Watch said while having multiple ways to prove your identity was helpful, the Government should ensure that digital ID did not become effectively mandatory \"as it would shut out millions of people\".\n\"Many people have legitimate reasons for relying on physical ID, whether out of choice, privacy and security concerns, or because they lack the digital skills or means to use digital ID,\" she said.\n\"The Government should expressly prohibit businesses from requiring digital IDs for age checks without offering reasonable alternatives,\" she added.\nThe new rules come after a wider digital ID programme promoted by former Prime Minister Sir Keir Starmer proved controversial, and was later abandoned by Andy Burnham.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});
