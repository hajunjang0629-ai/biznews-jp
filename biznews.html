    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Meta and a coalition of state attorneys general have settled a major federal case centering on allegations that the social media giant misrepresented the extent of child mental health harms caused by apps like Facebook and Instagram.\nThe settlement was revealed in a court filing released Wednesday that details several requirements Meta must make to its apps as part of a proposed \"consent judgement.\"\nThose changes include daily usage limits and \"nighttime blocks\" for teenagers who use the company's apps, \"enhanced age assurance measures\" that would prevent children from using them, and the creation of additional tools for parents and guardians.\nAs part of the settlement, Meta agreed to pay $16.7 billion. The state of California could receive $1.5 billion to $2.1 billion if the court officially approves the settlement, according to an announcement by California Attorney General Rob Bonta. Texas was not part of the group settlement and agreed to a $1 billion payment separately.\n\"Today, we have secured a settlement with Meta that will make social media less dangerous for our kids and make a world of a difference for children and their families,\" Bonta said in a statement. \"Meta has agreed to make massive transformations that will reduce the risk of harm from its platforms — and will do it within months.\"\nSeveral state AG's touted a $17.1 billion settlement amount. That number includes more than $459 million for claims related to the Cambridge Analytica matter which dates back to 2018 and was separate from the child safety case.\nEach party waived \"all rights to appeal this Final Judgment,\" the filing states.\nMeta shares rose about 1% as of early afternoon. Snap, which is subject to the broader effort by AGs to force changes at social media companies, saw its stock sink more than 8%.\nThe trial, which kicked off with opening arguments last week, was being held at the Oakland federal courthouse in California. It was co-led by Bonta and the AGs from Colorado, New Jersey and Kentucky, who represented a bipartisan group of 29 AGs in a combined case stemming from a 2023 lawsuit.\nThe trial has been suspended pending review of the agreement between the parties, according to a court spokesperson.\nIn Bonta's announcement detailing the settlement, he noted that the effort involved a \"bipartisan coalition of 51 attorneys general.\"\nMeta said the settlement agreement \"includes a payment of approximately $18 billion,\" which will be \"distributed in annual installments over a 10-year period.\" That money will fund various youth online safety initiatives as deemed by the states.\nThe \"participating states\" will receive about $12.7 billion, or 70%, of the total settlement payment over the next 10 years, Meta said. Those states can receive the remaining $5.3 billion, or 30%, as long as Google's YouTube and TikTok implement certain app changes, such as daily time limits for youth, age-assurance measures, and a \"night mode.\" Meta's rivals must also agree to all pay an amount that matches the remaining 30%, \"with half of the remaining funds tied to YouTube's payment and half tied to TikTok's.\"\nMeta said it expects to \"accrue a legal expense of approximately $10 billion in the third quarter of 2026 related to the agreement,\" which was not previously taken into account.\nThe only notable executive to appear for Meta was Instagram chief Adam Mosseri, who testified on Tuesday that he doesn't direct employees to withhold certain child-safety and product information from him to provide cover and mislead the public. Meta CEO Mark Zuckerberg was slated to potentially testify later in the trial.\nThe settlement is the biggest yet for Meta, but not the only one it's been force to pay.\nEarlier in August, A New Mexico judge ordered Meta to contribute $567 million to an abatement fund as part of a public nuisance case centering on child-safety allegations. The judge's ruling came several months after a New Mexico jury decided that Meta should pay $375 million in damages based on the number of times it violated the state's unfair practices act.\nOther cases against Meta are still playing out, including one involving social media personal injury claims and a consolidated, nationwide federal school district case.\n\"Thousands of young people and public school districts still have claims pending in the MDL against Meta, as well as TikTok, Snap and YouTube, and we stand ready to continue that fight,\" lawyers representing the plaintiffs in those cases said in a statement Wednesday. \"We will not rest until every one of these plaintiffs sees justice for the harms caused by all of the defendants' platforms.\"",

    "bodyOriginal": "Mark Walter's TWG Global, in an extraordinary statement Wednesday morning, blasted what it called \"multipronged attacks\" against the holding company and its subsidiaries, and said \"despite what has been reported, there has been no fraud\" at those companies.\nTWG also said it \"is not looking to sell its sports assets at 'fire sale' prices to raise capital for its insurance operations.\"\nThe statement came amid a flurry of media reports about Walter's empire and federal criminal and civil investigations into the accounting for billions of dollars of financial transactions between two of his insurers and companies controlled by the Los Angeles Dodgers owner.\nThe comments are the most detailed and strongest by TWG since the probes into the insurers gained renewed attention after Walters said he would sell his majority stake in the Los Angeles Lakers earlier in August, less than a year after buying the team.\n\"TWG and the Group 1001 insurance companies have presented a plan to address any regulatory concerns,\" TWG Global said in the statement.\n\"Over the past several weeks, multipronged attacks against TWG have been advanced by unnamed sources with self-serving interests that have been reported in the media. It is important to set the record straight,\" the statement said.\n\"TWG stands firmly behind the integrity of its business and remains focused on continuing to deliver value to its stakeholders.\"\n\"Despite what has been reported, there has been no fraud,\" the company said.\nTWG said that Walter and his partners \"continuously get interest from prospective buyers and co-investors in their sports assets and, as responsible owners and investors, they consider all legitimate offers when they are received.\"\nIn addition to the Dodgers and the Lakers, Walter's sports portfolio includes stakes in Chelsea Football Club, the Professional Women's Hockey League, and the Cadillac Formula 1 Team.\nIn its statement Wednesday, TWG addressed the sale of the Lakers, saying, \" Mr. Walter was approached by Josh Kushner and his team about this transaction and the agreement represents a 25% premium to the price paid by Mr. Walter less than a year ago (and an even higher premium to the $5.0 billion valuation Mr. Walter paid in 2021)—hardly a 'fire sale.'\"\n\"Regarding the Los Angeles Dodgers, to be clear, the team is not being sold and no sale process has been initiated,\" the statement said.\nThis is breaking news. Please refresh for updates.",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Boston Scientific said Wednesday it was hit with a cyberattack this week that is affecting its operations. The disclosure sent shares of the $72 billion medical device maker lower.\nThe attack is disrupting Boston Scientific's access to company information systems and applications, including shipments services, the company said in a SEC filing.\n\"While the company is working diligently to restore affected functions and systems access, the timeline for a full restoration is not yet known,\" the filing said.\nShares were down 5.8% in premarket trading on Wednesday. Shares of the maker of devices such as pacemakers and stents have been nearly cut in half already this year, under pressure after issuing a weak profit forecast in the first quarter.\nWhen asked to comment, the company reiterated the info from the SEC filing.\nAnalysts at investment bank Piper Sandler said they spoke to company management on Wednesday morning and that they thought it may be weeks before Boston Scientific can resume normal business operations.\n\"We believe BSX may be able to return to shipping all of its products in less than three weeks,\" Matt O'Brien at Piper Sandler wrote.\n\"The company is unable to process and ship orders, so sales will likely be adversely impacted,\" he wrote, adding that \"clearly, this is not great for a company that is already seeing sales growth slow.\"",

    "title": "Fed’s preferred inflation gauge shows core prices rose 3.3% annually in July",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Prices consumers pay for a variety of goods and services rose slightly in July, according to the Federal Reserve's main inflation gauge.\nThe personal consumption expenditures price index, which the Fed uses as its preferred forecasting tool, increased a seasonally adjusted 0.2% for the month, putting the annual inflation rate at 3.7%, the Commerce Department reported Wednesday. Both were 0.1 percentage point above the Dow Jones consensus.\nBut stripping out volatile food and energy costs, core PCE posted respective gains of 0.2% and 3.3%, in line with forecasts. While the Fed considers both measures, policymakers generally see core inflation as the better measure of longer-term trends.\nThe report also showed that personal income rose 0.4% while spending increased 0.2%, both stronger than expected.\nGoods prices actually declined on the month, off 0.1%, driven by a 2.7% decrease in gasoline and other energy-related goods and a 0.9% drop in furnishings and long-lasting household equipment.\nServices prices rose 0.3%, pushed by a 1.2% increase in financial services and insurance as well as a 0.3% gain in housing.\nStock market futures pulled back a bit after the report while Treasury yields were higher.\nThe report comes with Fed officials weighing their next policy move as inflation, despite generally soft monthly readings this summer, still well above the central bank's 2% goal.\nWith the rate-setting Federal Open Market Committee not meeting formally in August, officials have a bit of a respite before making a decision at their next gathering on Sept. 15-16. Markets are pricing in only about a 1-in-3 probability of a move then, with the best chance for a rate hike coming in December.\nThough the FOMC doesn't meet, Fed officials this week gather at Jackson Hole, Wyo., for their annual symposium, the highlight being a policy speech scheduled for Friday from Chairman Kevin Warsh.\nSince taking office in May, Warsh has been circumspect about where he sees policy heading, instead preferring that markets set the tone.\nGovernment bond yields have been on the rise lately. Both the 10- and 30-year Treasurys recently saw yields hit their highest levels since 2007, just before the global financial crisis. The surge has come from a variety of factors, including investors' concern about the Fed's commitment to its inflation target as well as debt and deficit issues with the federal budget.\nTreasury Secretary Scott Bessent a week ago announced an initiative in which his department would step up its buybacks of government debt. However, market participants have expressed doubt about whether the move will have a meaningful impact on yields.\nThis is breaking news. Please refresh for updates.",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Reform proposes £30 tax rebate for HMRC phone delays\n- Published\nPeople on hold to HM Revenue and Customs (HMRC) for more than 30 minutes would get £30 off their tax bill under a Reform UK government, Robert Jenrick has announced.\nReform's economy spokesman said HMRC's treatment of taxpayers was \"offensive to working people\" and his party would tie the pay of senior HMRC officials to customer service targets.\nTo prevent abuse, the tax credit for phone delays would be limited to two occasions in a given tax year, Jenrick said.\nHMRC has said it has improved its response times since a highly critical report by a committee of MPs, external, in January 2025, accused the organisation of seeking to \"degrade its telephone service to drive taxpayers to digital channels\".\nThe Public Accounts Committee report said nearly 44,000 customers were cut off without warning after being on hold for more than an hour in 2024 and \"HMRC's treatment of taxpayers has damaged trust in the tax system\".\nJenrick highlighted the findings - which were rejected as \"completely baseless\" by the then boss of HMRC - at a media conference in central London.\n\"Frankly, it is offensive to working people and I have had enough,\" said the former Tory MP.\n\"So, we will give HMRC a big incentive to actually provide proper customer service.\n\"I'm announcing today that under a Reform government, if you spend more than half an hour waiting for HMRC to answer your call, you will get a £30 credit off your tax bill. If HMRC delay, they can repay.\n\"And to make sure that the staff actually hit their targets, we'll tie the pay of senior HMRC officials to their customer service performance.\"\nJenrick also pledged to scrap UK privacy rules in favour of a \"light-touch\" approach to data protection as part of a bid to slash \"red tape\" for businesses.\nHe said the General Data Protection Regulation (GDPR), which mirrors EU legislation and was adopted as domestic law after Brexit, had \"strangled\" tech firms and small enterprises.\nThe framework would be replaced by rules modelled on New Zealand's privacy legislation, which Reform says has the lightest-touch regime still recognised as being \"adequate\" by the EU.\nLabour accused Reform of wanting to \"scrap vital safeguards that protect people's private data\" with its \"unworkable and unserious plans\".\nHMRC has been contacted for a response.\nPhone lines stay open as tax return deadline looms\n- Published31 January\nTaxpayers 'lost £97m' calling HMRC\n- Published25 May 2016\nHMRC denies 'deliberately poor' phone service\n- Published22 January 2025\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "bodyOriginal": "The U.S. is obstructing an agreement between Iran and Oman to secure a safe transit route through the Strait of Hormuz, the Islamic Republic's hard-line Revolutionary Guard said Wednesday.\nIran and Oman have already reached an agreement on their respective shares of the vital economic artery, controversially including revenues associated with its administration, the influential military group told the semiofficial Tasnim news agency.\nThe Revolutionary Guard said the strait would remain closed if the U.S. does not accept Iran's conditions.\nIt came after Iran and Oman said in a joint statement on Tuesday that their respective foreign ministers had discussed a \"proposed framework\" to establish \"a joint temporary navigational corridor through the Strait of Hormuz and an agreement to implement a joint project to clear the Strait of mines.\"\nOil prices have extended recent losses in response to the statement, with international benchmark Brent crude falling below the $90 per barrel market overnight.\nJust five commodity vessels transited the Strait of Hormuz on Tuesday, below the 10-day average of 15, according to preliminary data from Kpler. Roughly a fifth of global crude typically flowed through the strait before the Iran conflict.\nThe joint Iran-Oman statement also noted that \"technical negotiations\" would continue \"with a view to agreeing on a permanent navigational corridor and future administration of the Strait, as well as a mechanism for information-sharing, traffic management, and the provision of relevant navigational and security services.\"\nContributing to pressure on oil prices in recent days, the U.S. has reportedly started returning its diplomats to Gulf states – suggesting Washington does not currently expect military escalation. Russia's RIA Novosti also reported late on Tuesday that the U.S. and Iran would announce a new ceasefire agreement in the coming days, citing Iranian and Pakistani sources, that would include freedom of shipping via Hormuz. However, this could not be independently verified, and the White House did not respond to MS NOW's request for comment.\nU.S. holds back on secondary sanctions\nIt comes after Treasury Secretary Scott Bessent's pledge on Monday to launch an \"economic D-day\" on the Iranian regime, threatening to target Tehran's \"enablers\" and trading partners in efforts to strangle its economy. This included a list of 60 individuals, entities and vessels.\nHowever, the U.S. has so far held off on imposing significant secondary sanctions on other nations — including, significantly, Chinese financial firms suspected of facilitating Iran's oil trade.\n\"Why would I want to blow up the global financial system? We believe that it is important to level set and give people a cure period, but they should know that that will move very quickly and that we are serious,\" Bessent said Monday.\nChina, which buys around 90% of Iran's oil, on Tuesday threatened to retaliate if the U.S. opted to expand economic pressure on nations trading with Tehran.\nBeijing \"will take all necessary measures to firmly safeguard its rights and interests,\" a Chinese Foreign Ministry spokesperson said Tuesday.",

    "id": "hyundai-has-grown-more-than-any-automake-b50334f9",
    "title": "Hyundai has grown more than any automaker in the U.S. — and it's not done yet",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "SAN FRANCISCO — Hyundai Motor Co. CEO José Muñoz smiled and nodded as a fellow executive discussed the automaker's \"mueos-ideun ganeunghada\" philosophy during the reveal of its new flagship Genesis GV90 SUV.\nThe term means \"anything is possible\" in Korean. It's a mantra for the South Korean automaker that has proved to be true for the company's U.S. ambitions as well as for Muñoz himself, a Spanish-U.S. dual national who is the first non-Korean executive to lead the automaker.\nHyundai has experienced rapid growth in the U.S. so far this decade despite an onslaught of geopolitical changes and a slowing market. And it's hoping to keep that going. The company is ramping up production at a new $7.6 billion plant in Georgia to continue to capture more sales and market share.\n\"My top three priorities are U-S-A,\" Muñoz told CNBC during an interview last week after the Genesis reveal. \"USA is helping us to really make good progress, not only in the most important market and the most competitive market in the world, but also elsewhere.\"\nHyundai Motor Group, which includes its namesake vehicles as well as the Kia and luxury Genesis brands, has increased its market share this decade more than any major automaker in the U.S., according to data from Mobility Global.\nThe group has grown its U.S. market share from 8.4% in 2020 to 11.2% through last year, and its sales have grown 50% over that period, making the South Korean company the fourth best-selling automaker in the country. Its market share is up to 11.8% through the first half of this year, according to auto intelligence firm Mobility Global.\nNo other major automaker is even close to such market share gains, with most flat to down during that timeframe. Electric vehicle manufacturer Tesla, at an estimated 2.1 percentage point increase in market share, is the only company even close, according to Mobility Global.\nHyundai's U.S. performance has helped it become the third best-selling automaker globally and the second most profitable based on operating income, Munoz said.\nHyundai Motor Group Executive Chair Euisun Chung downplayed the company's rapid rise when speaking last week to CNBC: \"It's important, but speed doesn't matter. How we grow in the right way [is what matters]. I think that's more important.\"\nBut investors have definitely taken notice of the growth, with shares of the company on the Korea stock exchange up nearly 250% since 2020.\nHyundai's $26 billion U.S. plan\nHyundai expects its growth to continue with a $26 billion investment plan through 2028 that could include making its new Metaplant in Georgia the largest vehicle assembly plant in the country.\nMuñoz told CNBC the company is considering plans to increase the expected production capacity at the plant from 500,000 units to between 700,000 and 800,000 units by 2028. It currently produces the all-electric Hyundai Ioniq 5 and Ioniq 9 as well as the Kia Sportage hybrid, with additional vehicles expected in the coming years.\nThe goal is for Hyundai to produce at least 80% of the vehicles it sells in the U.S. domestically by the end of this decade, up from roughly 40% in 2024.\n\"For that purpose, we need to add more capacity,\" Muñoz said. \"We are ramping up as fast as we can.\"\nThe investment is the largest in the company's U.S. history, as it aims to increase sales to 5.55 million vehicles globally under a \"Bold 2030 Vision\" plan outlined by Muñoz last year at the company's first investor day ever held in the U.S.\nThe plan is an ambitious outline to increase sales by roughly 35% from last year to 2030. That includes entering new markets globally, with the U.S. as an anchor for continued profitable growth.\nMuñoz on Wednesday reconfirmed those plans during the company's 2026 CEO investor day, including a 6% targeted global market share for Hyundai and Genesis.\nMuñoz last week said President Donald Trump's tariffs, including 15% on autos from South Korea, have played a role in the company accelerating its U.S. production plans.\n\"Tariffs are helping accelerate our localization plan. That's very, very simple,\" he said. \"The good thing is that we had already started before tariffs were announced. So in a way it's helping us to accelerate.\"\nThe Georgia plant is key for Hyundai and Kia, both of which have grown sales roughly 45% in the U.S. since 2020.\n\"This decade's been about a brand transformation, and the growth has been phenomenal. We've really transformed everything,\" Eric Watson, Kia America vice president of sales operations, said during an interview. \"We continue to plan to grow.\"\nKia's growth plans include increasing U.S. sales to 1.02 million vehicles in the U.S. by 2030, the company's CEO, Ho Sung Song, said earlier this year. That is expected to be assisted by Kia's entry into pickup trucks and more capable SUVs that are known as \"body-on-frame\" vehicles.\n\"We think that's an important segment to be involved in, a body on frame vehicle/truck,\" Watson said. \"It'll be an important piece of our growth strategy that we'll look forward to announcing more in the future.\"\nHyundai also plans to add such vehicles, including a midsize pickup truck. The company earlier this year debuted a rugged concept vehicle called the Boulder, which could mean additional production capacity in the U.S. for body-on-frame models.\n\"It's a new unexplored territory for us,\" Muñoz said. \"We are always, always assessing the opportunities that we have in the market.\"\nFrom 'cheap' to luxury, value\nHyundai entered the U.S. market in 1986, followed by Kia in 1993 with cheaper options than American consumers could get from U.S. automakers and aiming to compete against growing Japanese companies such as Toyota Motor.\nSince then, Hyundai executives said several transformations — from overhauling quality and design to logos and dealer showrooms — have led the brands to where they are today as quality value plays.\n\"Both Kia and Hyundai are really good at being able to offer more in the vehicle than the consumer expects, and that they expect at that price point,\" said Stephanie Brinley, associate director of Mobility Global's AutoIntelligence. \"It's not about being a 'cheap car.' It's just being able to offer a little bit more than expected.\"\nMuñoz attributed Hyundai's success to its customer focus and its ability to surprise buyers, many of whom are new to the brand, with the capabilities and features of its vehicles. He also said the global reach of Hyundai, which also owns steel plants and other suppliers, is paramount to its progress.\n\"We have determined that being competitive is a key element for the American consumer. So, affordability is something that we fully understand and we apply,\" he said. \"We want to offer the customer the right product, the right features at the right level of price.\"\nThat \"right level\" has been widening for the automaker in the U.S. It continues to sell entry-level vehicles that start in the $20,000s for Kia and Hyundai, while growing the top-end sales for both brands. Its Genesis luxury brand, meanwhile, has models that reach $100,000 or more.\nHyundai on Wednesday said it is planning more than 100 vehicle launches and refreshes across Hyundai and Genesis by 2030, including 58 in North America. It also will significantly increase its electrified vehicle offerings, including extended-range hybrids.\nGenesis, which launched a decade ago in the U.S., has seen a particularly rapid growth, to become the fastest-selling luxury brand to 1 million sales globally, according to the company.\nExecutives described its newest GV90 flagship SUV, including a model with coach doors and rotating lounge seats, as a new chapter for the Genesis brand, reiterating that \"anything is possible.\"\n\"From the very beginning, the world took notice of Genesis,\" Genesis North America Chief Operating Officer Tedros Mengiste said at the GV90 reveal as Muñoz nodded. \"And tonight you will see mueos-ideun ganeunghada – anything is possible – come to life.\"",

    "title": "Mortgage rates hit highest level in 3 weeks, weakening demand further",

    "bodyOriginal": "Mortgage interest rates moved even higher last week, causing demand for loans to weaken yet again.\nTotal mortgage application volume dropped 1% from the previous week, according to the Mortgage Bankers Association's seasonally adjusted index.\nThe average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances of up to $832,750 increased last week to 6.78% from 6.77% the prior week, with points rising to 0.66 from 0.65, including the origination fee, for loans with a 20% down payment. That is the highest level in three weeks.\nApplications to refinance a home loan, which are most sensitive to weekly rate moves, fell 2% for the week. They were 17% lower than the same week one year ago, when rates were 9 basis points lower.\n\"Refinance applications decreased, particularly for FHA and VA loans, and the average loan size for refinances was at its lowest since June 2025,\" said Joel Kan, vice president and deputy chief economist at the MBA, in a release.\nApplications for a home mortgage fell 0.3% for the week and were 5% lower than the same week a year ago.\nEven though rates are higher than last year, fewer buyers are using all cash, according to a separate report from Realtor.com. Less competition in the overall market makes sellers more likely to accept buyers who need financing.\n\"Purchase activity was down over the week, driven by a 7 percent decrease in FHA applications. The purchase market has also slowed these past two months,\" Kan added.\nMortgage rates are lower this week, according to a separate survey from Mortgage News Daily, with rates dropping Tuesday thanks to falling oil prices.\n\"News reports suggested progress in the peace process via Pakistani mediators. Oil prices dropped sharply in response, and bond yields followed the move. Bond yields correlate with mortgage rates,\" wrote Matthew Graham, chief operating officer at Mortgage News Daily.",

  {
    "id": "why-high-energy-bills-look-like-they-are-14fb3bdc",
    "title": "Why high energy bills look like they are here to stay",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Why high energy bills look like they are here to stay\n- Published\nEnergy bills may have been a long way from our minds through the sweltering summer.\nClothes on a washing line have been drying in minutes. Cold showers have been more tempting than hot ones.\nBut the latest news and forecasts on gas prices will bring a renewed sense of worry and urgency to families, as well as government ministers.\nEnergy prices will rise by nearly 4% for millions of households in October. Even more striking is a prediction from the respected consultancy Cornwall Insight of a further 9% increase at the peak of winter in January.\nWith ongoing volatility in the wholesale gas market sparked by events in the Gulf region, the energy sector says high prices are here to stay.\nEDF suggests bills will remain \"stubbornly high\" at their current level at least until the end of the decade.\nAs prices rise, so does debt\nHigh bills have, and continue to, bite. Energy prices have been central to the cost-of-living squeeze.\nThe typical household's dual-fuel bill is now 70% higher than it was at the start of 2021, before Russia's invasion of Ukraine.\nThat amounts to around £600 more each year than pre-crisis levels, according to industry body Energy UK.\nInevitably, more and more people have been unable to pay. Unpaid energy debt of more than three months is now at a record high, according to regulator Ofgem.\nSuppliers, who chart debt levels for missed payments of a month or more, estimate total unpaid bills and charges to have reached £6bn. By the end of the year, they expect that to rise to £7bn.\nThe average household in debt, without a repayment plan, owes more than the typical annual bill.\nAnd even if you are not in debt, you pay. Covering the cost of debt already adds about £60 to the average annual bill. Consultancy Baringa says everyone could, on average, be paying £100 to cover the cost of unpaid debts by the end of the year.\nSomeone who pays their bill on demand every three months, rather than a monthly direct debit, is typically already paying £150 a year to cover debt of others, owing to the greater risk of non-payment on this type of bill.\nSo, pressure on the government to help those most in need will only intensify.\nOfgem has a proposed debt relief scheme on the table, and campaigners keep telling them to get on with it, urging the government as to provide funding for it to be implemented.\nCharities and the industry also want ministers to introduce a discounted tariff for those who need it most - based on benefits, health and income data.\nEnergy UK says a targeted plan would cost £1.9bn. That would be much cheaper than the £40bn commitment to protect everyone's bills after Russia invaded Ukraine.\nBut, who would pay? It could go on everyone else's bills. Or ministers could opt to raise taxes, borrow the money, or cancel spending elsewhere - all of which are tricky political choices.\nWe've all done our bit\nThose who can have cut back on their energy use to reduce bills in recent years. Thermostats up and down the country have not been set as high as before. Batch cooking is more common.\nSo much so that Ofgem's official calculations for typical energy consumption were lowered again in July (to 9,500 kWh of gas and 2,500 kWh of electricity a year).\nMillions have shifted onto fixed tariffs, with 35% of billpayers on such a deal.\nSo, many can justifiably say they have done their bit. Others who are older or who have health conditions might not have the luxury of lowering their energy use.\nSo, community warm hubs have become popular. Some became cold hubs during the hot summer so people could make use of the air con.\nThe heatwave has reduced the amount of energy stored across Europe, which needs to be restocked, piling more pressure on prices.\nAdd to that the huge cost of upgrading the UK's electricity network and you can see why there are predictions of longstanding high energy bills - irrespective of whether a lasting peace in the Iran war brings down the international price of wholesale gas.\nAll eyes on the Budget\nIn the long-term, the government and Ofgem wants to shift the country away from our reliance on gas, with its volatile international pricing.\nExpect lots of fanfare over the sale, for the first time in the UK, of plug-in solar panels.\nIn the short-term ministers - and the new prime minister - say they are helping where they can, and promising that there is \"more to do\".\nVAT will be cut on electricity bills in October. It means the price of electricity will fall, but that's been more than outstripped by an 8% rise in the price of gas.\nIn the last Budget, then-Chancellor Rachel Reeves cut some so-called policy costs and shifted some onto general taxation instead.\nMinisters may be tempted to do more of that, but could face be criticised for simply shifting the burden off bills and onto taxes.\nSo, the options are limited. The new chancellor, John Healey, has choices to make - with lots of calls for help but with limited room for manoeuvre in the public finances.\nAll eyes will be on his first Budget, which comes soon after those higher autumn energy bills kick in.\nGet in touch\nAre you affected by issues covered in this story?\n- Published2 hours ago",

    "id": "temasek-backed-investor-behind-unitree-p-7a13967a",
    "title": "Temasek-backed investor behind Unitree pitches Singapore as Chinese robots' path to U.S.",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "SINGAPORE — Chinese robotics companies shut out of the U.S. by new restrictions on advanced robots can still reach American buyers by building genuine operations in Singapore, according to a Temasek-backed venture firm that counts humanoid maker Unitree Robotics among its portfolio companies.\nChoon Chong Tay, managing partner at Vertex Ventures China, said startups affiliated with China could still capture the U.S. market by anchoring day-to-day operations, hiring, and control of critical components in the city-state.\nChina-affiliated startups with \"substantial content\" in Singapore, where they control the chips powering these robots, can address the U.S. market, the Shanghai-based venture capitalist told CNBC on Tuesday.\nThe remarks sketch a playbook that investors with exposure to Chinese tech startups are increasingly weighing as the U.S.-China technology contest intensifies. Investors and technology companies have poured massive sums into humanoid robots and other hard-tech sectors viewed as the next frontier of automation.\nIn July, the Trump administration barred new foreign-made humanoid and other mobile robots from entering the U.S. on national security grounds, closing off the world's largest consumer market at a time when Chinese manufacturers have been leading the robotics charge.\nThe workaround proposed by Tay, however, has yet to be tested. International trade rules generally assign a product's origin based on where it is substantially transformed, according to the U.S. government. \"These are some ideas that we are actually now trying to think about,\" Tay said.\nVertex, backed by Singapore state investor Temasek, manages nearly $3 billion across U.S. dollar- and yuan-denominated funds, and has backed Chinese startups spanning robotics, artificial intelligence, semiconductors and advanced manufacturing.\nIts portfolio includes Unitree, autonomous-driving chipmaker Horizon Robotics, logistics robot provider Geek+, surgical robot maker Edge Medical, and photonics chipmaker Lightelligence.\nUnitree generates more than 40% of revenue overseas, including about 18% from the U.S., according to Kangyuxiao Li, an equity analyst at Morningstar. \"That makes the U.S. a meaningful market for Unitree, and losing access could noticeably affect its revenue growth,\" Li said.\nTay is betting that the economics will ultimately override the politics. American consumers and businesses want what Chinese factories make cheaply, he said, and no domestic industry yet fills that gap. If a Singapore-certified robot is safe and priced right, \"What other reason do you have to not allow us to export?\"\nThe firm's early bets included bike-sharing firm Mobike, acquired by Meituan in 2018 in a deal Tay said returned about 10 times the initial investment.\nThe portfolio is now overwhelmingly hardware. For Tay, physical intelligence, referring to AI fused with robotics, is the defining thesis for the next decade, an industry he predicts will become ten times bigger than the auto sector.\nThe U.S. ban last month marks a milestone in the U.S.-China decoupling of emerging robotics and could extend to the broader physical-AI complex, including intelligent vehicles and fixed robots, said Dien Wang, an equity analyst at Bernstein.\nBeijing, however, holds counter-leverage through its dominance of the rare earths used in humanoid actuators and motors, Wang said. \"Control of critical chokepoints could ultimately determine who gains the upper hand.\"",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Why Tesla has been caught up in a massive car recall in China\n- Published\nHidden car door handles - the sleek designs often found on electric vehicles (EVs) - have come under the spotlight over the past week.\nThat's after China announced its biggest ever recall of cars, with more than four million vehicles - mostly Teslas - affected.\nThe recall comes ahead of new regulations in China, requiring cars to have a mechanical release both on the inside and outside of their doors.\nPopularised by Elon Musk's electric vehicle giant, this type of handle has become commonplace around the world.\nBut several incidents have raised concerns that this design may make doors difficult to open in an emergency.\n'A real safety concern'\nHidden door handles are widely used in modern cars in China, with around 60% of the top 100 best-selling new energy vehicles, including EVs and hybrids, having them.\nThe minimalist design gives vehicles a \"sleek look and reduces wind drag\" but can be confusing to use, car industry analyst Stephen Dyer from consultancy AlixPartners told the BBC.\n\"Even I often find it difficult to locate the switch to open the door from the inside of an unfamiliar vehicle,\" said Dyer, who is based in Shanghai.\nBut beyond their usability, the handles have been blamed for endangering the lives of drivers and passengers.\nElectronically powered door handles became an industry trend, but raised \"real safety concerns\" when doors failed to open promptly, delaying rescue efforts after accidents, said Nanyang Technological University associate professor Lyu Chen.\n\"A door handle may seem simple, but it becomes safety-critical in the seconds after a crash,\" Chen said.\nChinese carmaker Xiaomi faced intense scrutiny following two fatal crashes in 2025 involving its SU7 model, when suspected electrical failures allegedly trapped occupants.\nOne of the incidents took place on a highway in Tongling city, eastern China, killing three people, according to regional news coverage cited by state-controlled media Global Times.\nRelatives of the victims said the passengers were stuck in the car as the vehicle's doors could not be unlocked after the collision, the outlet said.\nAt the time, Xiaomi's representatives said the SU7 had mechanical emergency release handles that function even without power, which are located at the bottom of each door.\nThe company added at the time that it was investigating the matter and cooperating with the police.\nThe latest models of the SU7 come with new door handles that can be opened without power.\nXiaomi has not responded to BBC requests for comment.\nTesla has also faced lawsuits in the US over its door handle designs.\nThe company has been sued by the only survivor of a crash in 2024 involving a Cybertruck - Tesla's electric pickup - that killed three college students in California.\nSurvivor Jordan Miller alleged that the Cybertruck's design trapped passengers in the burning vehicle and blocked their rescue.\nThe car did not have door handles and the electronic buttons meant to open the doors failed to work, according to his lawyers from The Veen Firm.\n\"When you design a vehicle with no mechanical way to open the doors from the outside, you are betting the electronics will work in every scenario, including a high-speed crash followed by a fire,\" said one of the lawyers in a statement.\nIn court filings, Tesla denied any wrongdoing and said the Cybertruck is compliant with US federal safety standards, the Guardian reported.\nThere have been other cases in the US of passengers, including children, allegedly being trapped in Tesla cars after the doors suddenly stopped working.\nThe BBC has contacted Tesla for comment.\nWhat is being done about hidden handles?\nIn February, China said it would ban hidden door handles, making it the first country to do so.\nThe new rules, which take effect on 1 January 2027, mean new car designs without physical release mechanisms on the inside and outside of their doors cannot be sold.\nThe cars' interior must also carry signs to show how to open the door.\nThe measures in China come ahead of the US and European Union, which typically lead regulations around road safety and emissions, Dyer noted.\nOne reason is likely to be the sheer number of EVs in China, he added.\nOn 21 August, China's State Administration for Market Regulation (SAMR) announced that Tesla and some major Chinese car makers - including Xiaomi, XPeng and Geely - would recall more than four million vehicles.\nThe manufacturers were ordered to add warning labels inside vehicle doors to show passengers how to open them. Some cars will also get a software update that will lower their windows in the event of a crash.\nTesla, which started selling the Model S sedan with hidden door handles in China in 2014, is recalling nearly three million cars, according to the SAMR.\nThe agency said the recalled cars have door handles that are \"difficult to identify\" because they are a similar colour to the vehicle's interior trim.\nIn the event of an electrical failure, the handles' design may also prevent passengers from quickly opening the doors to escape or \"hinder rescue efforts\" by bystanders, the SAMR added.\nXiaomi, XPeng and Geely will also recall a total of more than 750,000 vehicles.\n'Weak remedy'\nSome engineers say the measures may not go far enough to resolve safety concerns.\nEngineering instructor Lim Hong Wee said the measures do not address the need for a mechanical way to open the doors.\nAccess to a car during an emergency should not depend on software, said Lim from the National University of Singapore.\nThe measures mainly address the issue of people being able to get out of a vehicle, but do not provide a reliable way for rescuers to get in, said Gokul Krithivasan from risk management consultancy SecureSafe.\nWarning labels are also a \"weak remedy\", he added. \"When panicked, people fall back on their instinctive responses, and don't read small print in a dark and possibly smoke-filled cabin.\"\nFor now, it is unclear whether there will be similar recalls outside China.\nThe BBC understands that carmakers have not yet notified authorities of any plans for a similar recall in the US.\nThe world's carmakers are struggling to compete with China\n- Published27 May\nThe US National Highway Traffic Safety Administration told the BBC that it is reviewing whether it will require emergency door-exit systems in vehicles.\nIn Europe, regulators have flagged the potential hazards related to hidden handles and drafted new standards to ensure they still work even if a car's power is cut off.\nEngineering lecturer Lyu Chen said that while concealed door handles are still common in EV designs, manufacturers and regulators are paying increasing attention to how they design their doors.\nSince cars are built to sell globally, it is likely that the safety requirements in China will be adopted elsewhere, he added.\n\"The common principle is clear: emergency entry and exit should remain possible even after a loss of electrical power.\"",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "President Donald Trump submitted a proposed agreement with Saudi Arabia on civil nuclear energy to Congress on Monday, starting a mandatory review period for a pact that would open the kingdom to U.S. nuclear technology.\nA U.S. official confirmed the submission to MS NOW, saying the agreement, led by the Department of Energy, is consistent with the Atomic Energy Act. The president's position remains unchanged: the accord will move forward only if Saudi Arabia joins the Abraham Accords, the official said.\nThe Wall Street Journal reported the submission on Tuesday.\nThe deal, reached in July, would allow U.S. companies to export civilian nuclear technology to Saudi Arabia. The 30-year accord also calls for the kingdom to build AP1000 reactors, a project worth tens of billions of dollars that would benefit Westinghouse, jointly owned by Canada-based Cameco and Brookfield Asset Management.\nCongress now has 90 days of continuous session to review the agreement, which would go into effect absent objection. U.S. cooperation with foreign nations to develop civilian nuclear power requires such review under the Atomic Energy Act.\nTrump has suggested the agreement's terms would prevent Saudi Arabia from enriching uranium. \"There will be no enrichment of material!\" the president said in a social media post last month, adding that the agreement is \"totally subject to Saudi Arabia joining the very respected and successful Abraham Accords.\"\nProliferation worries\nSome Democratic lawmakers and nonproliferation advocates have criticized the pact for not including a permanent prohibition on enrichment or reprocessing, and for weakening standard controls against converting the technology to military use. Instead, the deal proposes a U.S.-built and operated enrichment facility subject to a two-year feasibility study.\n\"Washington is right to strengthen its relationship with Riyadh, but it should not do so at the expense of its effective nuclear weapons nonproliferation standards,\" Matthew Kroenig, a senior fellow at the Washington-based think tank the Atlantic Council, said in July.\nKroenig expects the two-year feasibility study to conclude that Saudi Arabia should rely solely on imported fuel-cycle services, as most countries with peaceful nuclear programs do. \"This would be a much better outcome than exporting a bomb-making capability to an additional country in an already volatile region,\" he said.\nThe landmark agreement also comes at a time when the decades-long U.S.-led global nuclear order is already fraying, said Erin Dumbacher, Stanton nuclear security senior fellow at the Council on Foreign Relations.\n\"It takes a distinct approach from the stringent nonproliferation measures the United States has insisted on in the past when exporting nuclear energy,\" said Dumbacher, who also served in the Department of Defense in the Office of the Under Secretary for Policy.\n\"It becomes a slippery slope toward more countries having nuclear material without the measures that have kept the total number of countries with nuclear weapons to only nine. More nuclear material unchecked around the world could lead to accidents, security risks, and more proliferation,\" said Dumbacher.\nRiyadh has indicated that it would not normalize ties with Israel unless an independent Palestinian state is recognized, a position that has hardened since the Gaza war began in 2023.\nSaudi officials have also said the kingdom would pursue nuclear weapons capability if Iran develops it.",

    "id": "musk-s-rocket-firm-spacex-to-build-100bn-9eae98e6",
    "title": "Musk's rocket firm SpaceX to build $100bn launch facility",
    "titleJa": "マスク氏のロケット会社スペースX、1000億ドルかけて打ち上げ施設建設へ",
    "summaryJa": "マスク氏のスペースX、ルイジアナ州に1000億ドルかけて打ち上げ施設建設へ- 公開されました",
    "bodyOriginal": "Musk's SpaceX to build $100bn launch facility in Louisiana\n- Published\nMulti-billionaire Elon Musk's rocket company SpaceX has announced that it will build its largest launch site yet in the southern US state of Louisiana.\nConstruction of the $100bn (£73bn) project - named Starbase, Louisiana - is due to start next year, with the 125,000-acre (50,585-hectare) site expanding on the company's operations beyond its current Texas headquarters and locations in Florida.\nIt will be used to \"support thousands of Starship flights a year with missions launching to Earth orbit, the Moon, Mars and beyond,\" SpaceX said on Tuesday.\nIn June, SpaceX shares started trading on New York's technology-focused Nasdaq in the world's biggest ever stock market debut.\nSpaceX said it aims to launch its first Starship flight from the new Louisiana base in 2029.\nThe facility will add more than 3,000 jobs to the region, the company said, external.\nThe Louisiana Economic Development agency said the average wage of workers at the base - the largest of its kind in the world - would be 192% more than the region's current average salary.\nIt will also create more than 8,100 new jobs indirectly, the agency estimated.\n\"The historic project will establish Louisiana as a global hub for next-generation aerospace, with the capacity and infrastructure needed to dramatically increase launch frequency and expand access to space,\" it added.\nThe facility in Louisiana will share its name with another SpaceX site on the southern tip of Texas.\nIn 2025, residents in an area of Cameron County, where the company has testing and development operations, approved incorporating the patch of land as a city called Starbase.\nInside the rural Texas town where Elon Musk is basing his business empire\n- Published20 April 2025\nThe SpaceX IPO made history. One month on has it lost momentum?\n- Published13 July\nMusk has set out ambitious goals for SpaceX, including plans to reach Mars, develop artificial intelligence (AI) models and launch data centres into space.\nIn August, SpaceX and Tesla - Musk's electric vehicle and robotics firm - announced plans to build a $16.8bn artificial intelligence (AI) chip making complex in Texas called the Terafab.\nThe facility aims to meet the companies' growing demand for computing power to support its projects including developing AI and robotics technology over the coming years.\nThe newly-listed SpaceX is under pressure to convince investors that it will be profitable even as it pursues its expansion plans.\nIts shares have tumbled by more than 30% from the highs reached shortly after it began trading but are still higher than their $135 offer price.",
    "bodyJa": "マスク氏のスペースX、ルイジアナ州に1000億ドルかけて打ち上げ施設建設へ\n- 公開されました\n億万長者イーロン・マスク氏のロケット会社スペースXは、米国南部ルイジアナ州に同社史上最大の発射場を建設すると発表した。\nルイジアナ州スターベースと名付けられた1,000億ドル（730億ポンド）のプロジェクトの建設は来年開始される予定で、125,000エーカー（50,585ヘクタール）の敷地は、現在のテキサス本社とフロリダの拠点を超えて同社の事業を拡大する予定である。\nこれは「地球周回軌道、月、火星、そしてその先へのミッションを打ち上げる年間数千回のスターシップ飛行をサポートする」ために使用されるとスペースXは火曜日に発表した。\n6月、スペースX株は、世界史上最大の株式市場デビューとして、テクノロジーに特化したニューヨークのナスダックで取引を開始した。\nスペースXは、2029年にルイジアナ州の新基地から初のスターシップ飛行を打ち上げることを目指していると述べた。\n同社によれば、この施設により、この地域に3,000人以上の雇用が増えるだろうという。\nルイジアナ州経済開発庁は、この種の基地としては世界最大である同基地の労働者の平均賃金は、この地域の現在の平均給与より192％高くなるだろうと述べた。\nまた、間接的に 8,100 人以上の新たな雇用が創出されると当局は推定している。\n「この歴史的なプロジェクトにより、ルイジアナ州は打ち上げ頻度を劇的に高め、宇宙へのアクセスを拡大するために必要な能力とインフラを備え、次世代航空宇宙の世界的ハブとして確立されるだろう」と付け加えた。\nルイジアナ州の施設は、テキサス州南端にあるスペースXの別の施設と名前を共有することになる。\n2025年、同社が試験・開発事業を行っているキャメロン郡の地域の住民は、その土地をスターベースと呼ばれる都市として編入することを承認した。\nイーロン・マスクがビジネス帝国の拠点を置くテキサスの田舎町の内部\n- 2025 年 4 月 20 日発行\nSpaceX の IPO は歴史を作りました。 1か月経って勢いがなくなったでしょうか？\n- 7 月 13 日発行\nマスク氏は、火星への到達、人工知能（AI）モデルの開発、宇宙へのデータセンターの立ち上げなどの計画を含む、スペースXの野心的な目標を掲げた。\n8月、スペースXとマスク氏の電気自動車・ロボット工学会社テスラは、テキサス州にテラファブと呼ばれる168億ドル規模の人工知能（AI）チップ製造施設を建設する計画を発表した。\nこの施設は、今後数年間にわたってAIやロボット技術の開発などのプロジェクトをサポートするためのコンピューティングパワーに対する企業の需要の高まりに応えることを目的としている。\n新たに上場したスペースXは、拡張計画を進めながらも利益を上げられると投資家に納得させる必要に迫られている。\n同社の株価は取引開始直後に付けた高値から30％以上下落したが、それでも提示価格の135ドルよりは高い。",

    "id": "oil-falls-on-easing-concerns-of-renewed-1c8fd5f6",
    "title": "Oil falls on easing concerns of renewed tensions as the U.S. pivots to economic pressure on Iran",
    "titleJa": "米国がイランへの経済圧力に軸足を移す中、緊張再燃への懸念緩和で原油下落",
    "summaryJa": "米国がイランに圧力をかけるため経済制裁に傾いている中、軍事衝突への懸念が和らぐ中、水曜日の石油は下落した。国際指標となるブレント原油先物１０月渡しは２．５２％下落し、１バレル＝８６．３５ドルとなった。米国ウェスト・テキサス・インターミディエート先物１０月限は２．１７％下落し、１バレル＝８０．５６ドルとなった。",
    "bodyOriginal": "Oil fell Wednesday, amid easing concerns about military conflict as the U.S. leans towards economic sanctions to pressure Iran.\nInternational benchmark Brent crude futures for October delivery declined 2.52% to $86.35 a barrel. U.S. West Texas Intermediate futures for October dropped 2.17% to $80.56 per barrel.\n\"US sanctions on Iran were less severe than anticipated,\" said Dan Coatsworth, head of markets at AJ Bell, adding that lower oil prices helped markets to regain some poise as government bond yields eased back from their recent highs.\nThe shift away from military action reduced the perceived risk to Gulf supply, even though the U.S. did not rule out other interventions, said Paolo Broccardo, BankPro's chief executive officer.\nIn addition, Pakistan reported meaningful progress in talks aimed at de-escalation and restoring navigation through the Strait of Hormuz, Broccardo noted.\nMeanwhile, Iran and Oman were discussing a joint temporary shipping route in the Strait of Hormuz and mind clearing mission, a precursor to a permanent arrangement to administer the waterway.\n\"Future management of the Strait and a permanent solution will follow in due course,\" Oman's foreign minister said in a social media post. \"Discussions with regional partners will be conducted in support of peace and cooperation, stability and freedom of navigation.\"\n—CNBC's Spencer Kimball contributed to the report.",
    "bodyJa": "米国がイランに圧力をかけるため経済制裁に傾いている中、軍事衝突への懸念が和らぐ中、水曜日の石油は下落した。\n国際指標となるブレント原油先物１０月渡しは２．５２％下落し、１バレル＝８６．３５ドルとなった。米国ウェスト・テキサス・インターミディエート先物１０月限は２．１７％下落し、１バレル＝８０．５６ドルとなった。\nＡＪベルの市場責任者、ダン・コーツワース氏は「米国の対イラン制裁は予想ほど厳しくなかった」と述べ、国債利回りが最近の高値から低下するなか、原油価格の下落が市場の落ち着きを取り戻したと付け加えた。\nバンクプロのパオロ・ブロカルド最高経営責任者（ＣＥＯ）は、米国が他の介入を排除しなかったとしても、軍事行動からの移行により湾岸供給に対する認識されているリスクは減少したと述べた。\nさらに、パキスタンはホルムズ海峡の緊張緩和と航行の回復を目的とした協議で有意義な進展があったと報告したとブロカルド氏は指摘した。\n一方、イランとオマーンは、ホルムズ海峡での共同の暫定航路と、水路を管理する恒久的な取り決めの前兆である心を浄化するミッションについて話し合っていた。\nオマーン外相はソーシャルメディアへの投稿で、「海峡の今後の管理と恒久的な解決策はやがて生まれるだろう」と述べた。 「地域パートナーとの協議は、平和と協力、安定と航行の自由を支援するために行われるだろう。」\n—CNBCのスペンサー・キンボール氏がこのレポートに貢献しました。",

    "title": "Amazon service Bezos once called 'artificial artificial intelligence' is shutting down",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Amazon is soon pulling the plug on its 21-year-old crowdsourced work platform, called Mechanical Turk, the company said Tuesday.\n\"We regularly evaluate our programs, tools and services and make adjustments based on those assessments,\" a notice posted to the Mechanical Turk, or MTurk, website said. \"Following an assessment, we've made the decision to close AWS Mechanical Turk, effective September 30, 2026.\"\nLaunched in 2005, Mechanical Turk matches legions of workers with simple digital jobs, or \"Human Intelligence Tasks,\" that typically pay out a few cents per task. They include labeling data, transcribing audio or video or answering surveys.\nAmazon founder Jeff Bezos described the service as \"artificial artificial intelligence,\" as it farmed out tasks that could be easily completed by humans but proved too challenging for computers.\nThe service got its name from the original Mechanical Turk, an 18th century chess-playing robot that was actually controlled by a human chess master. Amazon originally conceived of the idea to assist with labeling reams of data on its sprawling webstore, The New York Times reported.\nThe platform at one point served more than 500,000 workers, also referred to as turkers, according to Amazon. But in recent years, MTurk had been \"in decline,\" said Krista Pawloski, a data worker and organizer with Turkopticon, an employee advocacy group for data workers.\nAI models have advanced rapidly since MTurk first launched, while a growing crop of data startups such as Scale AI, Mercor and Prolific have entered the market to recruit workers to train the models.\nAmazon also looked to capitalize on the demand for AI training by marketing MTurk as a data annotation source for its SageMaker service.\n\"Workers are available 24 hours a day, 7 days a week,\" according to an Amazon Web Services webpage. \"You typically get the fastest turnaround for your human review tasks and labeling jobs when you use the Amazon Mechanical Turk workforce.\"\nPawloski said Amazon seemed to invest fewer resources into improving MTurk at the same time as more data labeling services arrived, causing many turkers to shift to competing platforms.\nRepresentatives from Amazon didn't immediately respond to a request for comment.\nQuestions have been raised about the quality of some data generated on the platform. A 2023 study from academic researchers in Switzerland found that up to 46% of Mechanical Turk workers used AI models to complete tasks.\nLast month, Amazon said it would stop accepting new Mechanical Turk customers, which many workers interpreted as a sign that the service would soon be discontinued.\nSome insurance and travel companies still depend on MTurk for data workers, and are now scrambling to find alternative platforms, Pawloski said.\nPawloski started turking in 2008 while she was on maternity leave for supplemental income, before transitioning to the work full time when she was let go from her job in 2012 to help take care of her son with special needs. In 2019, she started organizing with Turkopticon, which originally focused on Mechanical Turk workers before expanding to include data workers more broadly.\nMechanical Turk and other data annotation platforms provide \"meaningful income\" and flexible hours, similar to other gig jobs such as ride-hail services or Amazon Flex package delivery, with the added benefit of being remote and easily completed using a smartphone, Pawloski said.\n\"There's some people that still pretty much still do it full time,\" Pawloski said. \"They're concerned now.\"\nWATCH: Amazon soars on Q2 earnings",

    "id": "from-military-alliance-to-economic-partn-95bfb2c6",
    "title": "From military alliance to economic partnership: How Trump is redefining U.S.-South Korea ties",
    "titleJa": "軍事同盟から経済連携へ：トランプ大統領は米韓関係をどう再定義するか",
    "summaryJa": "ドナルド・トランプ大統領が先週、韓国との年次軍事演習を縮小するという動きを見せたのは、韓国政府がワシントンへの数千億ドル規模の投資約束を最終決定したことを受けてのことだった。専門家らは、米国の海外軍事費支出と韓国の投資実施の停滞に対するトランプ大統領の不満は、同盟関係が安全保障に基づいたものから経済に基づいたものに変化していることを示していると指摘した。",
    "bodyOriginal": "President Donald Trump's move last week to scale back annual military drills with South Korea came as Seoul finalizes hundreds of billions of dollars in investment commitments to Washington.\nTrump's frustration over U.S. military spending overseas and stalled implementation of Korea's investments signal a shift in the allies' relationship from one based on security to economics, experts said.\nThere are now doubts about whether investments will ensure U.S. commitments to Korea's security that many in Seoul and Washington hoped, said Darcie Draudt‑Véjares, a fellow at the Carnegie Endowment for International Peace. She was referring to the $350 billion Korea promised to invest in the U.S. in exchange for lower \"reciprocal\" tariffs last year.\n\"Looked at a different way, we could see a shift from a relationship centered around a military alliance to one centered around integrated industrial ecosystems,\" Draudt‑Véjares said. That puts \"economics rather than security as the basis of the U.S.-South Korea partnership.\"\nTrump on Aug. 16 said that he had instructed the Pentagon to cut military drills because they were \"costly\" and send \"inappropriate and hostile\" signals to North Korea.\nThe post was made around the time Korean Trade Minister Kim Jung-kwan arrived in Washington, D.C., to discuss the investment commitments and tariffs with Commerce Secretary Howard Lutnick.\nThe order partly stemmed from Korea's slow pace of deploying the investments, compared to Japan, Politico reported, citing people familiar with the matter.\nTrump had cancelled the annual exercises in 2018 as well after his historic meeting with Kim Jong Un in Singapore. Ulchi Freedom Shield exercise, which traces its roots to 1954, involved around 18,000 Korean troops and an undisclosed number of American soldiers this year.\nU.S. Commerce Department and the Korean Trade Ministry did not respond to CNBC's requests for comments.\nInvestments for security?\nIt would be a mistake for allies to think that increased defense spending or economic ties will buy U.S. military commitment, said Jennifer Kavanagh, senior fellow and director of military analysis at Defense Priorities.\nSemiconductor trade or cooperation on shipbuilding can continue, separate from the U.S. military presence in Asia, she said.\n\"The terms of exchange might change, but a smaller military footprint and narrower set of commitments in Asia would also free U.S. economic resources for investment at home and abroad,\" she said.\nThe two economies have deepened ties, particularly as Korean chip giants have become central to the global AI boom, with Nvidia as their most important client.\nKorean businesses are benefiting from Trump's push for reindustrialization aimed at getting ahead in the competition with China.\nKorean companies, for their part, have significantly increased investments across semiconductors, electric vehicles, and shipbuilding in the U.S. For example, Korean chip giant SK Hynix is building a $4 billion advanced packaging plant in Indiana and allocating $10 billion to invest in new product lines and back its U.S. business.\nRead more\nBut not all experts are convinced that scaling back the U.S. military footprint in Asia serves American interests.\nTrump's decision to cut the annual drills \"further exacerbates allies' concerns of the unreliability of the U.S. as a security and economic partner,\" said Bruce Klingner, a former senior Central Intelligence Agency officer in the Koreas.\nHe added that Trump is seeking to direct American voters' attention away from the Iran war ahead of the midterm elections in November.\nThe shortened military exercises do not seem to have mollified North Korea. It launched more than 10 short-range ballistic missiles toward the East Sea Thursday, the South Korean Defense Ministry said.\nRichard Haass, president emeritus of the Council on Foreign Relations, said on \"Squawk Box\" last week that Trump's decision weakens the U.S.' credibility and leverage concerning North Korea.\nThe greater danger is that South Korea could pursue nuclear weapons to protect itself, and it would be \"incomparably worse because it would ultimately bring in China and potentially Japan,\" he said. \"It's a fiasco.\"",
    "bodyJa": "ドナルド・トランプ大統領が先週、韓国との年次軍事演習を縮小するという動きを見せたのは、韓国政府がワシントンへの数千億ドル規模の投資約束を最終決定したことを受けてのことだった。\n専門家らは、米国の海外軍事費支出と韓国の投資実施の停滞に対するトランプ大統領の不満は、同盟関係が安全保障に基づいたものから経済に基づいたものに変化していることを示していると指摘した。\nカーネギー国際平和基金の研究員、ダーシー・ドラウド・ベジャレス氏は、ソウルとワシントンの多くの人が期待していた韓国の安全保障に対する米国の約束が投資によって確実に実現されるかどうかについては現在疑問が生じていると述べた。彼女は昨年、韓国が「相互」関税引き下げと引き換えに米国に3,500億ドルを投資することを約束したことに言及していた。\n「見方を変えれば、軍事同盟を中心とした関係から、統合された産業エコシステムを中心とした関係への変化が見られるかもしれない」とドラウト・ベジャレス氏は述べた。それは「米韓パートナーシップの基礎は安全保障ではなく経済」であるとしている。\nトランプ大統領は8月16日、軍事演習は「費用がかかり」、北朝鮮に「不適切で敵対的な」信号を送るため、軍事演習を中止するよう国防総省に指示したと述べた。\nこの投稿は、韓国のキム・ジュングァン通商大臣がハワード・ラトニック商務長官と投資約束と関税について話し合うためワシントンD.C.に到着した頃に投稿された。\nポリティコは事情に詳しい関係者の話として、この命令の一部は、日本に比べて韓国の投資展開のペースが遅いことに起因していると報じた。\nトランプ大統領は2018年とシンガポールでの金正恩氏との歴史的会談後も年次演習を中止していた。 1954年にそのルーツをたどる乙支フリーダムシールド演習には、今年は約1万8000人の韓国軍と非公開の米軍兵士が参加した。\n米商務省と韓国貿易省はCNBCのコメント要請に応じなかった。\nセキュリティのための投資ですか?\nディフェンス・プライオリティ社のシニア・フェロー兼軍事分析ディレクターのジェニファー・カバナー氏は、防衛支出の増加や経済連携が米国の軍事的関与を買うと同盟国が考えるのは間違いだ、と述べた。\n同氏は、アジアにおける米軍の駐留とは別に、半導体貿易や造船協力は継続できると述べた。\n同氏は「交換条件は変わるかもしれないが、アジアにおける軍事拠点の縮小と一連の約束の縮小により、米国の経済資源が国内外への投資に解放されるだろう」と述べた。\n特に韓国の半導体大手が世界的な AI ブームの中心となり、エヌビディアが最も重要な顧客となっていることから、両国経済は関係を深めている。\n韓国企業は、中国との競争で優位に立つことを目的としたトランプ大統領の再産業化推進の恩恵を受けている。\n一方、韓国企業は米国での半導体、電気自動車、造船分野への投資を大幅に増やしている。例えば、韓国の半導体大手SKハイニックスはインディアナ州に40億ドルをかけて先進的なパッケージング工場を建設し、新製品ラインへの投資と米国事業の支援に100億ドルを割り当てている。\n続きを読む\nしかし、すべての専門家が、アジアにおける米軍の拠点を縮小することが米国の利益にかなうと確信しているわけではない。\n元中央情報局高官で朝鮮担当のブルース・クリングナー氏は、年次演習を削減するというトランプ大統領の決定は「安全保障および経済パートナーとしての米国の信頼性の低さに対する同盟国の懸念をさらに悪化させている」と述べた。\n同氏は、トランプ大統領は11月の中間選挙に先立ち、米国の有権者の注意をイラン戦争から逸らそうとしているとも付け加えた。\n軍事演習の短縮は北朝鮮を和らげるものではないようだ。韓国国防省は木曜日、東海に向けて10発以上の短距離弾道ミサイルを発射したと発表した。\n外交問題評議会名誉会長のリチャード・ハース氏は先週「スコーク・ボックス」で、トランプ大統領の決定は米国を弱体化させると述べた。北朝鮮に関する信頼性と影響力。\nさらに大きな危険は、韓国が自国を守るために核兵器を追求する可能性であり、それは「最終的には中国、そして場合によっては日本を巻き込むことになるため、比較にならないほど悪いことになるだろう」と述べた。 「それは大失敗だ。」",

    "id": "ai-gold-rush-draws-crypto-firms-away-fro-8e1db318",
    "title": "AI gold rush draws crypto firms away from Bitcoin",
    "titleJa": "AIのゴールドラッシュが仮想通貨企業をビットコインから遠ざける",
    "summaryJa": "AIのゴールドラッシュが仮想通貨企業をビットコインから遠ざける- 公開されました",
    "bodyOriginal": "AI gold rush draws crypto firms away from Bitcoin\n- Published\nCompanies that once filled warehouses with computers to earn Bitcoin - a process known as mining - are now using that computing power for AI.\nBitcoin mining companies invested large sums on giant banks of powerful computers as the price of Bitcoin rocketed in recent years.\nBut those mining companies have faced falling rewards since the value of the cryptocurrency has slumped from its peak in October 2025.\nNow many are pivoting to AI and signing deals with companies such as Anthropic - who are spending billions of dollars on the infrastructure needed to keep up in the AI race.\nBitcoin mining and other key cryptocurrency terms explained\n- Published5 June\nLike AI systems, Bitcoin relies on vast networks of powerful computers housed in data centres.\nBecause Bitcoin operates without a central authority, these computers verify transactions and are rewarded with newly-created digital coins.\nBut the rewards have reduced and the value of coins has dropped since last year.\nOne bitcoin was worth about $124,000 (£91,000) at its peak in October 2025, but has since fallen sharply.\nMore recently, it has rallied to around $80,000 - meaning it is up almost 30% so far in August.\nBut, for companies that have already made the change, even that may not be enough to get them to return to the crypto industry, because the switch of use - once made - is expensive to undo.\nIndustry analysts say Bitcoin mining companies have been pivoting to AI because they have years of experience in finding cheap electricity and efficiently running large data centres.\nTerraWulf, Ionic Digital, Core Scientific, Iris Energy, Bitdeer, Riot Platforms and Hut 8 are just some of the companies increasingly diverting investment and infrastructure from bitcoin mining towards AI.\nRiot Platforms signed a $9bn, 20-year compute deal with Anthropic earlier this month.\nCompany names and websites are changing to reflect the shift too.\nApplied Blockchain has become Applied Digital.\nTerraWulf's website once described the firm as an \"infrastructure-focused bitcoin mining company\".\nIt now says it focuses on \"next-generation AI and high-performance computing\".\nEnegix, which opened a huge Bitcoin mining site in Kazakhstan to great fanfare in 2020, is now pivoting too.\n\"Today, we are moving confidently towards artificial intelligence and planning the gradual alignment of our energy and infrastructure capabilities, both in Kazakhstan and elsewhere, towards the development of AI infrastructure,\" said the company's chief executive Yerbolsyn Sarsenov.\nEnegix says it is in active discussions with AI and HPC (high-performance computing) companies and planning to transform a \"significant\" portion of the business to AI.\nBut refitting crypto mines for AI is expensive and in some cases the companies have had to sell some of their Bitcoin holdings to fund the switch.\nWolfie Zhao from The Energy Mag - a publication that rebranded from The Miner Mag to reflect the trend - predicts the industry pivot will continue even as the price of Bitcoin has risen in recent days.\n\"We expect to see many public miners continue winding down their Bitcoin mining hardware in the coming quarters,\" he said.\nAsked if the shift away from Bitcoin mining might affect the security or stability of the cryptocurrency, Zhao said he hoped more miners will enter the market as conditions improve.\nBut he predicted many of the big players would not easily be able to switch back to Bitcoin.\n\"Once that multi-gigawatt power infrastructure has been retrofitted to AI or HPC colocation, there is no turning back,\" he said.\n\"You can unplug from the Bitcoin network any time but signing a GPU colocation lease for 10 or 20 years means steady revenue and a commitment to keep the infrastructure up for the tenants.\"\nBitdeer, which claims to be the largest Bitcoin miner in the world, just announced a 16-year deal to provide compute for Anthropic.\nBut the company's chief strategy officer, Haris Basit, said Bitdeer will continue mining Bitcoin, believing many operators would ultimately pursue a dual-purpose model.\n\"Bitcoin mining is particularly well suited to that model because it is flexible and interruptible, while AI workloads can provide longer-duration contracted revenues,\" he said.\nBitcoin surges past $100k for first time\n- Published5 December 2024\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.",
    "bodyJa": "AIのゴールドラッシュが仮想通貨企業をビットコインから遠ざける\n- 公開されました\nかつてビットコインを獲得するために倉庫にコンピューターを詰め込んでいた企業（マイニングとして知られるプロセス）は、現在ではそのコンピューティング能力を AI に利用しています。\n近年、ビットコインの価格が急騰する中、ビットコイン採掘会社は強力なコンピューターを備えた巨大な銀行に巨額を投資した。\nしかし、仮想通貨の価値が2025年10月のピークから下落して以来、これらの採掘会社は報酬の減少に直面している。\n現在、多くの企業が AI に軸足を移しており、Anthropic などの企業と契約を結んでいます。Anthropic は、AI 競争で勝ち抜くために必要なインフラストラクチャに数十億ドルを費やしています。\nビットコインマイニングとその他の重要な暗号通貨用語の説明\n- 6 月 5 日発行\nAI システムと同様に、ビットコインはデータセンターに設置された強力なコンピューターの広大なネットワークに依存しています。\nビットコインは中央機関なしで動作するため、これらのコンピューターはトランザクションを検証し、新しく作成されたデジタル コインで報酬を受け取ります。\nしかし、報酬は減少し、コインの価値は昨年より下落しました。\n2025年10月のピーク時には1ビットコインの価値が約12万4000ドル（9万1000ポンド）だったが、その後急落した。\n最近では約8万ドルまで上昇しており、8月時点でほぼ30％上昇していることになる。\nしかし、すでに変更を行った企業にとっては、一度行った使用の変更を元に戻すには費用がかかるため、それでも仮想通貨業界に戻るには十分ではないかもしれません。\n業界アナリストらは、ビットコインマイニング企業がAIに軸足を移しているのは、安価な電力を見つけたり、大規模なデータセンターを効率的に運営したりする長年の経験があるためだと述べている。\nTerraWulf、Ionic Digital、Core Scientific、Iris Energy、Bitdeer、Riot Platforms、Hut 8 は、投資とインフラストラクチャをビットコイン マイニングから AI にますます転用している企業のほんの一部です。\nRiot Platforms は今月初めに Anthropic と 20 年間の 90 億ドルのコンピューティング契約を締結しました。\n社名やウェブサイトも変化を反映して変更されています。\nApplied Blockchain は Applied Digital になりました。\nTerraWulf の Web サイトでは、かつて同社を「インフラストラクチャに重点を置いたビットコイン マイニング会社」と説明していました。\n同社は現在、「次世代AIとハイパフォーマンスコンピューティング」に焦点を当てていると述べている。\n2020年に大々的に鳴り物入りでカザフスタンに巨大なビットコイン採掘場を開設したEnegixも現在、方向転換しつつある。\n同社の最高経営責任者イエルボルシン・サルセノフ氏は、「現在、当社は自信を持って人工知能の実現に向けて前進しており、カザフスタンでもその他の地域でも、AIインフラの開発に向けてエネルギーとインフラの能力を段階的に調整する計画を立てている」と述べた。\nEnegixは、AIおよびHPC（ハイパフォーマンスコンピューティング）企業と積極的に協議しており、ビジネスの「重要な」部分をAIに転換する計画を立てていると述べた。\nしかし、AI用に暗号通貨鉱山を改修するには費用がかかり、場合によっては、企業は切り替え資金のために保有ビットコインの一部を売却しなければならなかった。\nトレンドを反映して The Miner Mag からブランド名を変更した出版物である The Energy Mag の Wolfie Zhao 氏は、ビットコインの価格がここ数日上昇しているにもかかわらず、業界の方向転換は続くだろうと予測しています。\n同氏は、「多くの公的マイナーが今後数四半期にビットコインマイニングハードウェアの縮小を続けると予想している」と述べた。\nビットコインマイニングからの移行が仮想通貨の安全性や安定性に影響を与えるのではないかとの質問に対し、趙氏は状況が改善するにつれてより多くのマイナーが市場に参入することを期待していると述べた。\nしかし同氏は、大手企業の多くは簡単にはビットコインに戻れないだろうと予測した。\n「数ギガワットの電力インフラが AI または HPC コロケーションに改修されたら、もう後戻りはできません」と彼は言いました。\n「いつでもビットコイン ネットワークから切り離すことができますが、10 年または 20 年の GPU コロケーション リースに署名するということは、安定した収益と、テナントのためにインフラストラクチャを維持するという約束を意味します。」\n世界最大のビットコインマイナーであると主張する Bitdeer は、Anthropic にコンピューティングを提供する 16 年間の契約を発表したばかりです。\nしかし、同社の最高戦略責任者であるハリス・ベイシット氏は、ビットディアは多くの事業者が最終的には二重目的モデルを追求すると信じており、ビットコインのマイニングを継続すると述べた。\n同氏は、「ビットコインマイニングは柔軟で中断可能であり、AIワークロードにより長期間の契約収益をもたらすことができるため、このモデルに特に適している」と述べた。\nビットコインが初めて10万ドルを突破\n- 2024 年 12 月 5 日発行\nTech Decoded ニュースレターに登録して、世界のトップのテクノロジー ストーリーやトレンドをフォローしてください。英国外ですか？ここからサインアップしてください。",
