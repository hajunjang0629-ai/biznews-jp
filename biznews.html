    "id": "kash-patel-skips-house-hearing-after-mar-f3259224",
    "title": "Kash Patel skips House hearing after Mar-a-Lago gala with $50,000 access",
    "titleJa": "Kash Patel skips House hearing after Mar-a-Lago gala with $50,000 access",
    "summaryJa": "Kash Patel missed a congressional hearing after appearing the night before at a Mar-a-Lago gala offering donors of $50,000 access to top officials.",
    "bodyOriginal": "After a string of outages disrupted airlines, banks and even the National Security Agency, U.S. House members gathered Wednesday to question the nation's top security officials. But FBI Director Kash Patel was nowhere to be seen.\nThe night before, Patel and Homeland Security Secretary Markwayne Mullin had been advertised as \"honored guests\" at the Big Blue Bash, a lavish charitable fundraiser at President Donald Trump's Mar-a-Lago club, where attendees were offered access to a \"private roundtable\" and a stay at the venue for $50,000 a person.\nMullin appeared before lawmakers Wednesday morning at the House Homeland Security Committee's annual threat assessment hearing. Patel sent his deputy instead. And as the hearing got underway, a Justice Department jet that's been used by Patel before was still flying back from Florida.\nFlight records reviewed by CNBC show the Justice Department aircraft associated with Patel's travel left West Palm Beach, Florida, at 7:51 a.m. ET Wednesday and landed at Joint Base Andrews outside Washington at 10:20 a.m. ET — 20 minutes after the House Homeland Security Committee hearing began.\nThe FBI confirmed Patel, Mullin and Attorney General Todd Blanche attended the Mar-a-Lago event.\n\"The event is approved by Ethics, following all guidelines and regulations,\" FBI spokesperson Benjamin Williamson told CNBC by email, noting the gala \"is an annual event honoring fallen law enforcement officers and their families.\"\nPatel's absence drew bipartisan criticism on Capitol Hill. Committee Chairman Andrew Garbarino, R-N.Y., said lawmakers had spent months trying to secure Patel's testimony, only for the FBI director to make clear he had \"no intention\" of appearing.\nRep. Bennie Thompson, of Mississippi, the committee's top Democrat, said Patel's absence for a second consecutive year undermined lawmakers' ability to conduct oversight. Before 2024, FBI directors traditionally testified at the annual hearing.\nThe episode also drew attention to what was being offered at Trump's private club: a chance for donors and corporate sponsors to meet privately with some of the nation's most powerful law enforcement officials.\n\"Trump's Big Blue Bash is yet another fundraising event that encourages wealthy special interests, particularly those seeking lucrative government contracts, to rub elbows with officials responsible for awarding those contracts,\" Craig Holman, a government ethics and lobbying expert at the watchdog group Public Citizen, told CNBC.\nBilled as a tribute to federal officers and their families, the second annual black-tie gala came with a price list for access.\nGala tickets cost up to $50,000\nGeneral admission cost nearly $5,000, a VIP all-access pass $25,000, and a private roundtable with federal agency heads and a night at Trump's resort $50,000, according to the event's ticketing page. A sponsorship prospectus reviewed by CNBC advertised corporate packages reaching $1 million, including private briefings, speaking time, and the chance to name and present an award to a federal agency of the sponsor's choosing.\nAlongside Patel and Mullin, the advertised guest list also included White House border czar Tom Homan and leaders of Customs and Border Protection, the Secret Service, Drug Enforcement Administration, and Transportation Security Administration.\nIt remains unclear which officials attended private meetings or which companies bought the most expensive packages. But several sponsors had substantial business with the agencies represented.\nMotorola Solutions, the gala's top named sponsor, had approximately $237.1 million in fiscal 2026 net contract obligations from the Justice and Homeland Security departments, according to CNBC's analysis of federal records. That included a $139.6 million Bureau of Prisons radio contract, a $25.8 million Customs and Border Protection award and a nearly $18 million Secret Service contract option, all in September.\nMotorola reported roughly $1.69 million in federal lobbying expenses this year through September, according to its first-quarter, second-quarter and third-quarter disclosures. Its lobbying included homeland security funding, communications technology and other issues.\n\"Motorola Solutions was proud to support last night's Big Blue Bash, honoring the families of wounded and fallen federal officers, whom we hosted as the night's guests of honor,\" the company said through a spokesperson. \"We did not participate in private briefings.\"\nFederal contractors supported gala\nTwo other federal contractors, the Vierra Group and Teya Diversified Services, sponsored a Department of Homeland Security presentation featuring Mullin and Homan, according to the gala's published program.\nFederal contracting records show Teya received three Customs and Border Protection contracts in September worth approximately $23.3 million combined for repairs at northern border ports of entry. The awards were $9.1 million for work at 12 ports, $7.9 million for nine ports and $6.4 million for 10 ports.\nLEO Technologies, which markets artificial intelligence and surveillance products to law enforcement agencies, was also listed as a sponsor.\nVierra, Teya and LEO Technologies didn't immediately respond to CNBC's requests for comment.\nEthics rules limit charitable involvement\nFederal ethics rules require authorization for officials to participate in charitable fundraising in their official capacities and restrict the use of government titles for personal fundraising.\nHolman said companies attending such events hope to gain favor with the administration and ultimately benefit through government contracts and policies affecting their businesses.\nThere is no evidence the sponsorships influenced federal contracts or secured preferential treatment, and some new contract awards added to existing contracts.\nThe financial questions extend to Trump's own business. Organizers haven't disclosed what Mar-a-Lago was paid or how much reached the Federal Law Enforcement Officers Foundation, the nonprofit that's the event's beneficiary. The gala offered a $1 million sponsorship package — more than the charity's entire 2024 revenue of $725,476, according to its latest available IRS filing — though no purchase has been confirmed. A Republican fundraiser at Mar-a-Lago cost about $318,000 in 2023, according to a New York Times analysis of campaign finance records.\nThe event also may raise questions about taxpayer-funded travel. Organizers listed Mullin as a speaker, and flight records reviewed by CNBC show a Gulfstream jet registered to DHS arriving in West Palm Beach Tuesday evening, alongside the Justice Department plane associated with Patel's travel. It remains unclear who was aboard either aircraft or whether the flights were connected to the gala.\nDays earlier, Mullin used a government plane to attend a Louisiana State University football game shortly after a nationwide FAA ground stop. He defended the trip Wednesday to the House Homeland Security Committee, saying that government travel was required and that he personally paid for it.",
    "bodyJa": "After a string of outages disrupted airlines, banks and even the National Security Agency, U.S. House members gathered Wednesday to question the nation's top security officials. But FBI Director Kash Patel was nowhere to be seen.\nThe night before, Patel and Homeland Security Secretary Markwayne Mullin had been advertised as \"honored guests\" at the Big Blue Bash, a lavish charitable fundraiser at President Donald Trump's Mar-a-Lago club, where attendees were offered access to a \"private roundtable\" and a stay at the venue for $50,000 a person.\nMullin appeared before lawmakers Wednesday morning at the House Homeland Security Committee's annual threat assessment hearing. Patel sent his deputy instead. And as the hearing got underway, a Justice Department jet that's been used by Patel before was still flying back from Florida.\nFlight records reviewed by CNBC show the Justice Department aircraft associated with Patel's travel left West Palm Beach, Florida, at 7:51 a.m. ET Wednesday and landed at Joint Base Andrews outside Washington at 10:20 a.m. ET — 20 minutes after the House Homeland Security Committee hearing began.\nThe FBI confirmed Patel, Mullin and Attorney General Todd Blanche attended the Mar-a-Lago event.\n\"The event is approved by Ethics, following all guidelines and regulations,\" FBI spokesperson Benjamin Williamson told CNBC by email, noting the gala \"is an annual event honoring fallen law enforcement officers and their families.\"\nPatel's absence drew bipartisan criticism on Capitol Hill. Committee Chairman Andrew Garbarino, R-N.Y., said lawmakers had spent months trying to secure Patel's testimony, only for the FBI director to make clear he had \"no intention\" of appearing.\nRep. Bennie Thompson, of Mississippi, the committee's top Democrat, said Patel's absence for a second consecutive year undermined lawmakers' ability to conduct oversight. Before 2024, FBI directors traditionally testified at the annual hearing.\nThe episode also drew attention to what was being offered at Trump's private club: a chance for donors and corporate sponsors to meet privately with some of the nation's most powerful law enforcement officials.\n\"Trump's Big Blue Bash is yet another fundraising event that encourages wealthy special interests, particularly those seeking lucrative government contracts, to rub elbows with officials responsible for awarding those contracts,\" Craig Holman, a government ethics and lobbying expert at the watchdog group Public Citizen, told CNBC.\nBilled as a tribute to federal officers and their families, the second annual black-tie gala came with a price list for access.\nGala tickets cost up to $50,000\nGeneral admission cost nearly $5,000, a VIP all-access pass $25,000, and a private roundtable with federal agency heads and a night at Trump's resort $50,000, according to the event's ticketing page. A sponsorship prospectus reviewed by CNBC advertised corporate packages reaching $1 million, including private briefings, speaking time, and the chance to name and present an award to a federal agency of the sponsor's choosing.\nAlongside Patel and Mullin, the advertised guest list also included White House border czar Tom Homan and leaders of Customs and Border Protection, the Secret Service, Drug Enforcement Administration, and Transportation Security Administration.\nIt remains unclear which officials attended private meetings or which companies bought the most expensive packages. But several sponsors had substantial business with the agencies represented.\nMotorola Solutions, the gala's top named sponsor, had approximately $237.1 million in fiscal 2026 net contract obligations from the Justice and Homeland Security departments, according to CNBC's analysis of federal records. That included a $139.6 million Bureau of Prisons radio contract, a $25.8 million Customs and Border Protection award and a nearly $18 million Secret Service contract option, all in September.\nMotorola reported roughly $1.69 million in federal lobbying expenses this year through September, according to its first-quarter, second-quarter and third-quarter disclosures. Its lobbying included homeland security funding, communications technology and other issues.\n\"Motorola Solutions was proud to support last night's Big Blue Bash, honoring the families of wounded and fallen federal officers, whom we hosted as the night's guests of honor,\" the company said through a spokesperson. \"We did not participate in private briefings.\"\nFederal contractors supported gala\nTwo other federal contractors, the Vierra Group and Teya Diversified Services, sponsored a Department of Homeland Security presentation featuring Mullin and Homan, according to the gala's published program.\nFederal contracting records show Teya received three Customs and Border Protection contracts in September worth approximately $23.3 million combined for repairs at northern border ports of entry. The awards were $9.1 million for work at 12 ports, $7.9 million for nine ports and $6.4 million for 10 ports.\nLEO Technologies, which markets artificial intelligence and surveillance products to law enforcement agencies, was also listed as a sponsor.\nVierra, Teya and LEO Technologies didn't immediately respond to CNBC's requests for comment.\nEthics rules limit charitable involvement\nFederal ethics rules require authorization for officials to participate in charitable fundraising in their official capacities and restrict the use of government titles for personal fundraising.\nHolman said companies attending such events hope to gain favor with the administration and ultimately benefit through government contracts and policies affecting their businesses.\nThere is no evidence the sponsorships influenced federal contracts or secured preferential treatment, and some new contract awards added to existing contracts.\nThe financial questions extend to Trump's own business. Organizers haven't disclosed what Mar-a-Lago was paid or how much reached the Federal Law Enforcement Officers Foundation, the nonprofit that's the event's beneficiary. The gala offered a $1 million sponsorship package — more than the charity's entire 2024 revenue of $725,476, according to its latest available IRS filing — though no purchase has been confirmed. A Republican fundraiser at Mar-a-Lago cost about $318,000 in 2023, according to a New York Times analysis of campaign finance records.\nThe event also may raise questions about taxpayer-funded travel. Organizers listed Mullin as a speaker, and flight records reviewed by CNBC show a Gulfstream jet registered to DHS arriving in West Palm Beach Tuesday evening, alongside the Justice Department plane associated with Patel's travel. It remains unclear who was aboard either aircraft or whether the flights were connected to the gala.\nDays earlier, Mullin used a government plane to attend a Louisiana State University football game shortly after a nationwide FAA ground stop. He defended the trip Wednesday to the House Homeland Security Committee, saying that government travel was required and that he personally paid for it.",

    "id": "viagogo-may-have-broken-law-on-hidden-fe-a6ba23d6",
    "title": "Viagogo may have broken law on hidden fees, watchdog provisionally finds",
    "titleJa": "Viagogo may have broken law on hidden fees, watchdog provisionally finds",
    "summaryJa": "The UK's competition body says initial findings suggest the ticket-reselling website used drip pricing.",
    "bodyOriginal": "Viagogo may have broken law on hidden fees, watchdog provisionally finds\n- Published\nTicket-reselling site Viagogo may have broken the law on hidden fees, the UK's competition body has said in a provisional finding.\nThe Competition and Markets Authority (CMA) said it found that Viagogo failed to show consumers the total price upfront when they were buying tickets \"and added fees later in the process, a practice known as drip pricing\".\nThe CMA added that this was an initial finding, and it should not be assumed that the company had actually broken the law.\nIn a statement, Viagogo said it was co-operating fully with the CMA, adding that the investigation was continuing and \"no final findings have been made\".\nThe CMA said last year that it was investigating a number of companies over their online pricing practices, including Viagogo.\nThe competition watchdog said it had looked into the experience of UK fans buying tickets for events such as concerts and sport on three websites that operate under the Viagogo brand.\n\"The CMA believes that mandatory costs such as taxes and booking fees were added at later stages of the checkout process and not included in the total price from the start,\" it said.\n\"Drip pricing can cause fans to be caught out by extra charges and buy tickets they might not otherwise have selected, had they been able to compare prices accurately from the start.\"\nThe CMA said Viagogo would now have an opportunity to consider its findings and respond before a final decision is made.\n\"This is an ongoing investigation and no final findings have been made,\" Viagogo said in a statement.\n\"We have engaged constructively with the CMA and continue to cooperate fully with its investigation.\"\nThe CMA has powers to tackle anti-competitive behaviour. It can now decide if consumer laws have been broken - rather than having to go through the courts.\nDrip pricing is one of the practices the CMA has been focusing on particularly.\nOn Wednesday, it said it was investigating three companies, external over the issue, and in August it announced that the Trainline, Virgin Atlantic and RED Driving School had been engaged in the practice.\nIn general, the CMA can impose penalties of up to 10% of global turnover for a breach of consumer law. However, it will consider a number of factors, including the severity of conduct, before deciding on the size of the penalty.\nIn June this year, the watchdog ordered rival ticket reseller StubHub UK to refund more than 50,000 customers and pay a £900,000 fine for not showing people the total price upfront when buying tickets.\nStubHub UK received a 40% reduction to its financial penalty after it admitted to breaking the law and agreed to settle the case early with the CMA.",
    "bodyJa": "Viagogo may have broken law on hidden fees, watchdog provisionally finds\n- Published\nTicket-reselling site Viagogo may have broken the law on hidden fees, the UK's competition body has said in a provisional finding.\nThe Competition and Markets Authority (CMA) said it found that Viagogo failed to show consumers the total price upfront when they were buying tickets \"and added fees later in the process, a practice known as drip pricing\".\nThe CMA added that this was an initial finding, and it should not be assumed that the company had actually broken the law.\nIn a statement, Viagogo said it was co-operating fully with the CMA, adding that the investigation was continuing and \"no final findings have been made\".\nThe CMA said last year that it was investigating a number of companies over their online pricing practices, including Viagogo.\nThe competition watchdog said it had looked into the experience of UK fans buying tickets for events such as concerts and sport on three websites that operate under the Viagogo brand.\n\"The CMA believes that mandatory costs such as taxes and booking fees were added at later stages of the checkout process and not included in the total price from the start,\" it said.\n\"Drip pricing can cause fans to be caught out by extra charges and buy tickets they might not otherwise have selected, had they been able to compare prices accurately from the start.\"\nThe CMA said Viagogo would now have an opportunity to consider its findings and respond before a final decision is made.\n\"This is an ongoing investigation and no final findings have been made,\" Viagogo said in a statement.\n\"We have engaged constructively with the CMA and continue to cooperate fully with its investigation.\"\nThe CMA has powers to tackle anti-competitive behaviour. It can now decide if consumer laws have been broken - rather than having to go through the courts.\nDrip pricing is one of the practices the CMA has been focusing on particularly.\nOn Wednesday, it said it was investigating three companies, external over the issue, and in August it announced that the Trainline, Virgin Atlantic and RED Driving School had been engaged in the practice.\nIn general, the CMA can impose penalties of up to 10% of global turnover for a breach of consumer law. However, it will consider a number of factors, including the severity of conduct, before deciding on the size of the penalty.\nIn June this year, the watchdog ordered rival ticket reseller StubHub UK to refund more than 50,000 customers and pay a £900,000 fine for not showing people the total price upfront when buying tickets.\nStubHub UK received a 40% reduction to its financial penalty after it admitted to breaking the law and agreed to settle the case early with the CMA.",

    "id": "takaichi-gets-chilly-reception-in-china-fa0c4782",
    "title": "Takaichi gets chilly reception in China on first Japan leader visit since 2019",
    "titleJa": "Takaichi gets chilly reception in China on first Japan leader visit since 2019",
    "summaryJa": "Takaichi received a subdued welcome on her trip to attend the APEC summit, as Beijing shows limited appetite for repairing ties strained by Taiwan dispute.",
    "bodyOriginal": "Japanese Prime Minister Sanae Takaichi received a subdued welcome on her first trip to China as premier, signaling Beijing's limited appetite for repairing ties strained by a simmering row over Taiwan.\nAt gatherings such as this week's Asia-Pacific Economic Cooperation summit in Shenzhen, protocol details — including who greets a visiting leader at the airport and where they are positioned in official photographs — often convey political messages.\nTakaichi was met on the tarmac Wednesday by a retired Chinese diplomat, rather than a serving official, and Japan's ambassador to China, Kenji Kanasugi.\nThe low-key reception contrasted sharply with the warmer welcomes given to other visiting leaders, including South Korean President Lee Jae Myung, while U.S. President Donald Trump was greeted personally by Chinese President Xi Jinping.\nIn the leaders' group photo, Takaichi was placed in the back row, off to the side and several places from Xi, who stood alongside Trump and Russian President Vladimir Putin.\n\"Beijing sought to downgrade her official status to that of a head of government rather than a head of state,\" said Jeremy Chan, senior analyst at Eurasia Group.\nDuring Thursday morning's greeting line, Takaichi spent several minutes trying to talk to the Chinese leader without an interpreter present, while most leaders exchanged handshakes and kept walking.\n\"It has become increasingly difficult for her to engage in formal or even informal conversations with Xi,\" said Kei Koga, an associate professor at Nanyang Technological University in Singapore, who sees Takaichi's intention as to still \"project the image that she could still communicate with him despite the ongoing tensions.\"\nTakaichi's subdued reception signaled Beijing's lack of enthusiasm to repair ties with Tokyo, analysts said, potentially prolonging China's curbs on critical mineral exports that have gripped Japanese industries for the past year.\n\"China's frosty reception of Takaichi shows quite clearly that Beijing is not yet ready to forgive her over her remarks about Taiwan,\" Chan said, expecting the bilateral relationship to remain strained until Takaichi leaves office.\nThat could leave Japan grappling with continued restrictions on rare earth supplies from China next year, said Tianchen Xu, senior economist at the Economist Intelligence Unit.\nRelations deteriorated sharply after Takaichi said in November 2025 that a Taiwan Strait crisis could constitute a situation threatening Japan's survival and warrant a self-defense response.\nWhile the substance broadly aligned with Japan's existing security policy, previous prime ministers had generally avoided stating it so explicitly in a Taiwan scenario.\nChina reacted angrily and demanded that Takaichi retract the remarks. She has not done so, while stating that the door to dialogue with Beijing remains open, with minimal high-level contact over the past year.\nChina has since tightened restrictions affecting Japan, including controls on dual-use and rare earth exports with potential military uses. It also discouraged its citizens from traveling to Japan and halted Japanese seafood imports.\nTakaichi's visit marked the first trip to China by a Japanese prime minister since Shinzo Abe traveled to Chengdu in December 2019 for a trilateral summit with Chinese and South Korean leaders.\nNo formal Takaichi-Xi meeting has been publicly scheduled during her visit. Meanwhile, Xi is expected to join Trump and Putin for a historic trilateral gathering on Thursday, alongside a bilateral meeting with Trump.\nTakaichi needs to show a \"reflection of what she said about Taiwan a year ago,\" said Huiyao Wang, founder of the Beijing-based Center for China and Globalization, which is often seen as close to Beijing's thinking.\nWang said Tokyo should show greater flexibility, pointing to Trump's comments that the U.S. would avoid getting involved in the Taiwan issue. He argued that Japan holding firm on the issue would not help relations with Beijing.\nSuch reflection, he said, \"would really help to clarify some of those misunderstandings between the two countries.\"",

aichi shows quite clearly that Beijing is not yet ready to forgive her over her remarks about Taiwan,\" Chan said, expecting the bilateral relationship to remain strained until Takaichi leaves office.\nThat could leave Japan grappling with continued restrictions on rare earth supplies from China next year, said Tianchen Xu, senior economist at the Economist Intelligence Unit.\nRelations deteriorated sharply after Takaichi said in November 2025 that a Taiwan Strait crisis could constitute a situation threatening Japan's survival and warrant a self-defense response.\nWhile the substance broadly aligned with Japan's existing security policy, previous prime ministers had generally avoided stating it so explicitly in a Taiwan scenario.\nChina reacted angrily and demanded that Takaichi retract the remarks. She has not done so, while stating that the door to dialogue with Beijing remains open, with minimal high-level contact over the past year.\nChina has since tightened restrictions affecting Japan, including controls on dual-use and rare earth exports with potential military uses. It also discouraged its citizens from traveling to Japan and halted Japanese seafood imports.\nTakaichi's visit marked the first trip to China by a Japanese prime minister since Shinzo Abe traveled to Chengdu in December 2019 for a trilateral summit with Chinese and South Korean leaders.\nNo formal Takaichi-Xi meeting has been publicly scheduled during her visit. Meanwhile, Xi is expected to join Trump and Putin for a historic trilateral gathering on Thursday, alongside a bilateral meeting with Trump.\nTakaichi needs to show a \"reflection of what she said about Taiwan a year ago,\" said Huiyao Wang, founder of the Beijing-based Center for China and Globalization, which is often seen as close to Beijing's thinking.\nWang said Tokyo should show greater flexibility, pointing to Trump's comments that the U.S. would avoid getting involved in the Taiwan issue. He argued that Japan holding firm on the issue would not help relations with Beijing.\nSuch reflection, he said, \"would really help to clarify some of those misunderstandings between the two countries.\"",

    "title": "Trump holds talks separately with Putin and Xi ahead of their historic trilateral meeting",
    "titleJa": "Trump holds talks separately with Putin and Xi ahead of their historic trilateral meeting",
    "summaryJa": "U.S. President Donald Trump met individually on Thursday with Russian President Vladimir Putin, as well as Chinese President Xi Jinping.",
    "bodyOriginal": "SHENZHEN, China — U.S. President Donald Trump met with Vladimir Putin and Xi Jinping separately on Thursday, ahead of a scheduled trilateral with his Russian and Chinese counterparts, according to pool notes and Chinese state media.\nEarlier on Thursday, the leaders and other members of the Asia-Pacific Economic Cooperation gathered for a summit. Trump and Xi entered the room side by side.\nXi said China would provide $20 million to support APEC cooperation, and establish a \"Center for Asia-Pacific Community Studies in Shenzhen to conduct policy research and exchanges and provide intellectual support.\"\nLater in the morning session, Trump said that he opposed regulating artificial intelligence as it would \"stifle\" the industry.\n\"The United States has been a Pacific power for hundreds of years, and we continue to work to promote growth and stability, sovereignty, prosperity, and peace throughout this region,\" Trump said.\nU.S. officials said last week that Trump did not plan to raise Nvidia's Jensen Huang and allegations of an affair with a Chinese spy at his meetings.\n\"By hosting APEC in Shenzhen, China took the opportunity to showcase another of its economic powerhouse cities, this time one that is home to some of the country's leading technology companies and innovators,\" AmCham China President Michael Hart said.\n\"The scale of China's economic strength and technological ambition is clear to U.S. businesses,\" he said. \"They recognize the importance of the Chinese market, but also understand that they need to remain competitive, innovative, and prepared to compete in an increasingly sophisticated business environment.\"",
    "bodyJa": "SHENZHEN, China — U.S. President Donald Trump met with Vladimir Putin and Xi Jinping separately on Thursday, ahead of a scheduled trilateral with his Russian and Chinese counterparts, according to pool notes and Chinese state media.\nEarlier on Thursday, the leaders and other members of the Asia-Pacific Economic Cooperation gathered for a summit. Trump and Xi entered the room side by side.\nXi said China would provide $20 million to support APEC cooperation, and establish a \"Center for Asia-Pacific Community Studies in Shenzhen to conduct policy research and exchanges and provide intellectual support.\"\nLater in the morning session, Trump said that he opposed regulating artificial intelligence as it would \"stifle\" the industry.\n\"The United States has been a Pacific power for hundreds of years, and we continue to work to promote growth and stability, sovereignty, prosperity, and peace throughout this region,\" Trump said.\nU.S. officials said last week that Trump did not plan to raise Nvidia's Jensen Huang and allegations of an affair with a Chinese spy at his meetings.\n\"By hosting APEC in Shenzhen, China took the opportunity to showcase another of its economic powerhouse cities, this time one that is home to some of the country's leading technology companies and innovators,\" AmCham China President Michael Hart said.\n\"The scale of China's economic strength and technological ambition is clear to U.S. businesses,\" he said. \"They recognize the importance of the Chinese market, but also understand that they need to remain competitive, innovative, and prepared to compete in an increasingly sophisticated business environment.\"",

    "id": "gilts-v-kilts-what-is-happening-with-sco-5637c721",
    "title": "Gilts v kilts: What is happening with Scottish government bonds?",
    "titleJa": "Gilts v kilts: What is happening with Scottish government bonds?",
    "summaryJa": "MSPs have heard both the pros and cons of the government's plan to launch its first ever bond to the market.",
    "bodyOriginal": "Gilts v kilts: What is happening with Scottish government bonds?\n- Published\nThe Scottish government is facing questions about its plan to issue its first ever bonds.\nThe move would allow ministers to borrow money from investors who in return receive regular interest payments.\nThe aim is to raise about £1.5bn by the end of the parliamentary term, with the funds to be used on long-term projects such as building hospitals or maintaining roads.\nNamed \"kilts\", a nod to UK government \"gilts\", the scheme has provoked much debate.\nThis week, MSPs on Holyrood's finance committee heard about the potential risks and rewards.\nWhat are bonds?\nA bond is a financial tool used by a government to borrow money. They are sold with a promise for the buyer, or investor, to be paid back at the end of an agreed term.\nThe government will also make regular payments to the investor.\nIn the UK, a government bond is called a gilt. They are typically bought by financial institutions such as pension funds, insurance companies and commercial banks.\nAs a play on this term, the Scottish bonds have been nicknamed \"kilts\".\nWhen will the 'kilts' be launched?\nThe Scottish government has said it expects the bonds to be issued within this financial year, subject to market conditions.\nFormer First Minister Humza Yousaf commissioned initial work in 2023 after advisers in the Scottish government's investor panel recommended making bonds available to the market as a means of raising Scotland's profile and attracting investment.\nIn November last year, the government announced that it had received an identical credit rating to the UK's score.\nThis was based on \"prudent fiscal management\" and the country's economic stability - though ministers were warned this could change if Scotland moved towards independence.\nWith market volatility due to conflicts in Ukraine and the Middle East, some have questioned whether now is a good time to launch bonds.\nBut at Holyrood, David McMillan, professor in finance and accounting at the University of Stirling, told MSPs: \"You can't wait for a perfect time because there's going to be no perfect time.\"\nHow much could they raise?\nThe government wants to raise £1.5bn through bonds by 2031, although that would only be a fraction of its near £70bn budget.\nAbout four-fifths of the Scottish government's budget is used on resource spending, which goes towards day-to-day costs such as funding the NHS, benefits payments and paying salaries.\nA smaller portion is made up of capital spending, typically used on long-term physical assets such as buildings and bridges, or maintaining roads or paths.\nThe Scottish government is unable to borrow for resource spending other than to correct forecasting errors.\nHowever, for capital spending, it can borrow as much as £450m a year at 2023-24 levels up to a total cap of £3bn - to be uprated with inflation.\nAdjusted for inflation, the government could borrow about £491m in the current financial year, with a total limit of about £3.3bn.\nWhat are the pros and cons?\nEconomists have noted that Scottish bonds would be a more costly way of borrowing than existing routes provided by the UK government through the National Loans Fund.\nIt has been estimated, external that interest rates on \"kilts\" would be 0.3 percentage points above gilts, plus an additional £2m per bond in administrative costs.\nThe Scottish government has not released costings, citing market sensitivities, but has insisted, external issuing bonds would represent value for money relative to the costs of borrowing through the UK scheme.\nMinisters argue that issuing bonds would be a good opportunity to market the country to investors, and would be helpful if Scotland became independent.\nDr Ben Cormier, a senior lecturer at the University of Strathclyde's department of government and public policy, told Holyrood's finance committee that while the Scottish bonds could cost marginally more than the UK scheme, they would \"bring flexibility to public finances and debt management\".\nMcMillan agreed with the plans \"in principle\", but warned they would lose \"credibility\" with investors if limited to five years.\nCormier warned that independence was the one thing \"that could materially change the nature of risk associated with Scottish bonds\".\nConservative MSP Liam Kerr said bonds could be more expensive than borrowing through the National Loans Fund and voiced concerns about a lack of transparency in the programme.\nMcMillan agreed there should be \"full information\" available, saying: \"You've got to have a clear, full and frank conversation with the public.\"\nRelated topics\n- Published13 November 2025\n- Published13 November 2025\n- Published3 November",
    "bodyJa": "Gilts v kilts: What is happening with Scottish government bonds?\n- Published\nThe Scottish government is facing questions about its plan to issue its first ever bonds.\nThe move would allow ministers to borrow money from investors who in return receive regular interest payments.\nThe aim is to raise about £1.5bn by the end of the parliamentary term, with the funds to be used on long-term projects such as building hospitals or maintaining roads.\nNamed \"kilts\", a nod to UK government \"gilts\", the scheme has provoked much debate.\nThis week, MSPs on Holyrood's finance committee heard about the potential risks and rewards.\nWhat are bonds?\nA bond is a financial tool used by a government to borrow money. They are sold with a promise for the buyer, or investor, to be paid back at the end of an agreed term.\nThe government will also make regular payments to the investor.\nIn the UK, a government bond is called a gilt. They are typically bought by financial institutions such as pension funds, insurance companies and commercial banks.\nAs a play on this term, the Scottish bonds have been nicknamed \"kilts\".\nWhen will the 'kilts' be launched?\nThe Scottish government has said it expects the bonds to be issued within this financial year, subject to market conditions.\nFormer First Minister Humza Yousaf commissioned initial work in 2023 after advisers in the Scottish government's investor panel recommended making bonds available to the market as a means of raising Scotland's profile and attracting investment.\nIn November last year, the government announced that it had received an identical credit rating to the UK's score.\nThis was based on \"prudent fiscal management\" and the country's economic stability - though ministers were warned this could change if Scotland moved towards independence.\nWith market volatility due to conflicts in Ukraine and the Middle East, some have questioned whether now is a good time to launch bonds.\nBut at Holyrood, David McMillan, professor in finance and accounting at the University of Stirling, told MSPs: \"You can't wait for a perfect time because there's going to be no perfect time.\"\nHow much could they raise?\nThe government wants to raise £1.5bn through bonds by 2031, although that would only be a fraction of its near £70bn budget.\nAbout four-fifths of the Scottish government's budget is used on resource spending, which goes towards day-to-day costs such as funding the NHS, benefits payments and paying salaries.\nA smaller portion is made up of capital spending, typically used on long-term physical assets such as buildings and bridges, or maintaining roads or paths.\nThe Scottish government is unable to borrow for resource spending other than to correct forecasting errors.\nHowever, for capital spending, it can borrow as much as £450m a year at 2023-24 levels up to a total cap of £3bn - to be uprated with inflation.\nAdjusted for inflation, the government could borrow about £491m in the current financial year, with a total limit of about £3.3bn.\nWhat are the pros and cons?\nEconomists have noted that Scottish bonds would be a more costly way of borrowing than existing routes provided by the UK government through the National Loans Fund.\nIt has been estimated, external that interest rates on \"kilts\" would be 0.3 percentage points above gilts, plus an additional £2m per bond in administrative costs.\nThe Scottish government has not released costings, citing market sensitivities, but has insisted, external issuing bonds would represent value for money relative to the costs of borrowing through the UK scheme.\nMinisters argue that issuing bonds would be a good opportunity to market the country to investors, and would be helpful if Scotland became independent.\nDr Ben Cormier, a senior lecturer at the University of Strathclyde's department of government and public policy, told Holyrood's finance committee that while the Scottish bonds could cost marginally more than the UK scheme, they would \"bring flexibility to public finances and debt management\".\nMcMillan agreed with the plans \"in principle\", but warned they would lose \"credibility\" with investors if limited to five years.\nCormier warned that independence was the one thing \"that could materially change the nature of risk associated with Scottish bonds\".\nConservative MSP Liam Kerr said bonds could be more expensive than borrowing through the National Loans Fund and voiced concerns about a lack of transparency in the programme.\nMcMillan agreed there should be \"full information\" available, saying: \"You've got to have a clear, full and frank conversation with the public.\"\nRelated topics\n- Published13 November 2025\n- Published13 November 2025\n- Published3 November",

    "title": "Musk accuses Zelenskyy of lying about Starshield restrictions in Ukraine",
    "titleJa": "Musk accuses Zelenskyy of lying about Starshield restrictions in Ukraine",
    "summaryJa": "Elon Musk was asked about Zelenskyy claims over the Starshield network, and he said, \"I don't want to blow your mind, but Zelenskyy is not always truthful.\"",
    "bodyOriginal": "SpaceX founder Elon Musk accused Ukrainian President Volodymyr Zelenskyy of being untruthful about restrictions around Ukraine's Starshield network and said Kyiv wanted to use Starlink for offensive operations.\nAsked at The New York Times' Dealbook Summit about Zelenskyy's claims that Starshield had been slowed down, Musk said, \"That's false ... I don't want to blow your mind, but Zelenskyy is not always truthful.\"\nWhen pressed on whether he meant Ukraine was not always truthful, Musk doubled down with a reply: \"No, it's not always truthful.\"\nHis comments came after Zelenskyy on Wednesday said speed restrictions remained in place on Starshield, hampering Ukraine's ability to intercept Russian missile and drone strikes. \"We are discussing this with the American side,\" he said.\nRussia invaded Ukraine in February 2022, stoking a conflict that has resulted in a refugee crisis and hundreds of thousands of deaths. Ukraine has been able to beat back Russian forces more effectively than many observers thought possible, despite having a much smaller land area and population.\nHowever, it relies heavily on SpaceX's Starlink and Starshield for capabilities like battlefield communications and drone operations. Musk has previously said that \"if we were to turn off Starlink, the entire Ukrainian front would collapse immediately.\"\nThe SpaceX CEO sought to distinguish between Starlink, a commercial satellite network, and Starshield, a military system developed by SpaceX and operated by the U.S. government.\nUkraine military violated Starlink terms of service and used it for offensive drone strikes to kill people.Elon MuskCEO, SpaceX\nMusk said that Starlink is subject to speed limits because it is not intended for offensive military operations, adding that such missions should instead use the Starshield network.\n\"Any action taken by Starshield is up to the War Department. Starlink is commercial and is not intended as a weapon of war,\" Musk said, referring to the U.S. Department of Defense.\nIn October, Musk said the U.S. government and President Donald Trump were responsible for any restrictions on Ukraine's Starshield network after slowdowns to the service were reported.\n\"Starshield systems are owned and controlled by the U.S. government. Any limits on speed or usage are decided by the US military and ultimately POTUS,\" Musk wrote on X.\nThe Wall Street Journal later reported on Oct. 20 that Musk had ordered the slowdown, citing U.S. officials and people familiar with the matter.\n\"What I'm trying to tell you is Zelenskyy is actually asking to use the Starlink commercial satellites for events of military actions, and we have declined to do so, as we have declined to do so from the beginning of this conflict,\" Musk added in the interview.\nOn Oct. 24, Musk said SpaceX had restricted Ukraine's access to Starlink because Kyiv had violated the service's terms by using it for offensive drone strikes, a claim Ukrainian officials disputed.\n\"Ukraine military violated Starlink terms of service and used it for offensive drone strikes to kill people. That loophole was closed last week,\" Musk wrote on X one day after.\nCNBC has reached out to Ukraine's ministry of foreign affairs for comment but did not receive a response. The president's office could not immediately be reached.",

ring to the U.S. Department of Defense.\nIn October, Musk said the U.S. government and President Donald Trump were responsible for any restrictions on Ukraine's Starshield network after slowdowns to the service were reported.\n\"Starshield systems are owned and controlled by the U.S. government. Any limits on speed or usage are decided by the US military and ultimately POTUS,\" Musk wrote on X.\nThe Wall Street Journal later reported on Oct. 20 that Musk had ordered the slowdown, citing U.S. officials and people familiar with the matter.\n\"What I'm trying to tell you is Zelenskyy is actually asking to use the Starlink commercial satellites for events of military actions, and we have declined to do so, as we have declined to do so from the beginning of this conflict,\" Musk added in the interview.\nOn Oct. 24, Musk said SpaceX had restricted Ukraine's access to Starlink because Kyiv had violated the service's terms by using it for offensive drone strikes, a claim Ukrainian officials disputed.\n\"Ukraine military violated Starlink terms of service and used it for offensive drone strikes to kill people. That loophole was closed last week,\" Musk wrote on X one day after.\nCNBC has reached out to Ukraine's ministry of foreign affairs for comment but did not receive a response. The president's office could not immediately be reached.",

    "title": "Elon Musk says record $446m spending on US midterms was 'pretty foolish'",
    "titleJa": "Elon Musk says record $446m spending on US midterms was 'pretty foolish'",
    "summaryJa": "The multi-billionaire also said he was \"not Maga\", distancing himself from the political movement linked to Trump.",
    "bodyOriginal": "Elon Musk says record $446m spending on US midterms was 'pretty foolish'\n- Published\nElon Musk said on Wednesday that he felt \"pretty foolish\" about the record sum he spent on the US midterm elections, following sweeping Republican defeats.\nThe Tesla and SpaceX chief executive was the election's top individual donor, giving $446m (£339m) to support President Donald Trump's party, particularly in Texas where many of Musk's firms are based.\nMusk, who had backed Trump's second White House bid, also said he was \"not Maga\" - the Make America Great Again movement associated with the president.\nDemocrats won control of the both chambers in the US Congress, flipping both swing seats and making historic gains in places that have for decades been controlled by Republicans.\nThe election was seen as a bruising defeat for Trump, who has faced pressure over the impact his policies have had on the cost of living in the US.\nMusk was speaking virtually, external at the New York Times DealBook Summit, an annual conference hosted in the city attended by major business and political leaders.\n\"I'm not Maga,\" Musk said, referring to the right-wing political movement.\nHe added: \"I'm not sure what Maga means... if that means sort of blind adherence to a set of policies by the Republican Party, then I certainly don't have that.\"\nThis marks a major shift in tone by Musk, who has previously been seen wearing a Maga hat.\n\"I'm not just Maga, I'm dark Maga,\" he joked at a Trump rally in 2024.\nFor several months at the start of Trump's second term in the White House, Musk served as an unpaid \"special government employee\" and Senior Advisor to the President, leading the Department of Government Efficiency (Doge) to cut government spending.\nIn October 2026, the Pentagon named Musk as a co-lead of a future of warfare study called Project Meridian, while he continued to travel with and advise Trump.\nMusk went on to say he did not see much for the money he had spent on the Republicans' campaign, though he added that it was likely that candidates would have fared worse without the spending.\nThe large number of Republican losses could have implications for Musk and his businesses.\nDemocrats coming into power in both the Senate and House of Representatives have pledged greater scrutiny of tech companies, including over the building of controversial data centres.\nIn Georgia, where SpaceX has data centre operations, the newly elected Democrat governor promised to limit the rollout of the massive buildings, as well as the tax breaks tech companies often get to build them.\nDemocratic lawmakers have also suggested that SpaceX, which has gained an estimated $10bn in new government contracts since Trump was re-elected, should be investigated.\nOne of the most striking midterms wins went to Democrat James Talarico, who beat Republican Ken Paxton for a US Senate seat in Texas.\nAccording to BBC analysis, Musk had spent at least $45m in support of Paxton.\nTexas is where key operations for Musk's car company Tesla and rocket and technology firm SpaceX are based.\nMusk said on Wednesday that he believes Texas' new governor, Democrat Gina Hinojosa, is \"going to be quite moderate\".\nHinojosa defeated Republican Governor Greg Abbott, ending more than three decades of the party's control of the state.\nThe Tesla boss added : \"I don't think she's a far-left governor. And based on everything I've heard about her, I think things will be fine in Texas with Gina as governor.\"\n- Published5 November\n- Published4 November",
    "bodyJa": "Elon Musk says record $446m spending on US midterms was 'pretty foolish'\n- Published\nElon Musk said on Wednesday that he felt \"pretty foolish\" about the record sum he spent on the US midterm elections, following sweeping Republican defeats.\nThe Tesla and SpaceX chief executive was the election's top individual donor, giving $446m (£339m) to support President Donald Trump's party, particularly in Texas where many of Musk's firms are based.\nMusk, who had backed Trump's second White House bid, also said he was \"not Maga\" - the Make America Great Again movement associated with the president.\nDemocrats won control of the both chambers in the US Congress, flipping both swing seats and making historic gains in places that have for decades been controlled by Republicans.\nThe election was seen as a bruising defeat for Trump, who has faced pressure over the impact his policies have had on the cost of living in the US.\nMusk was speaking virtually, external at the New York Times DealBook Summit, an annual conference hosted in the city attended by major business and political leaders.\n\"I'm not Maga,\" Musk said, referring to the right-wing political movement.\nHe added: \"I'm not sure what Maga means... if that means sort of blind adherence to a set of policies by the Republican Party, then I certainly don't have that.\"\nThis marks a major shift in tone by Musk, who has previously been seen wearing a Maga hat.\n\"I'm not just Maga, I'm dark Maga,\" he joked at a Trump rally in 2024.\nFor several months at the start of Trump's second term in the White House, Musk served as an unpaid \"special government employee\" and Senior Advisor to the President, leading the Department of Government Efficiency (Doge) to cut government spending.\nIn October 2026, the Pentagon named Musk as a co-lead of a future of warfare study called Project Meridian, while he continued to travel with and advise Trump.\nMusk went on to say he did not see much for the money he had spent on the Republicans' campaign, though he added that it was likely that candidates would have fared worse without the spending.\nThe large number of Republican losses could have implications for Musk and his businesses.\nDemocrats coming into power in both the Senate and House of Representatives have pledged greater scrutiny of tech companies, including over the building of controversial data centres.\nIn Georgia, where SpaceX has data centre operations, the newly elected Democrat governor promised to limit the rollout of the massive buildings, as well as the tax breaks tech companies often get to build them.\nDemocratic lawmakers have also suggested that SpaceX, which has gained an estimated $10bn in new government contracts since Trump was re-elected, should be investigated.\nOne of the most striking midterms wins went to Democrat James Talarico, who beat Republican Ken Paxton for a US Senate seat in Texas.\nAccording to BBC analysis, Musk had spent at least $45m in support of Paxton.\nTexas is where key operations for Musk's car company Tesla and rocket and technology firm SpaceX are based.\nMusk said on Wednesday that he believes Texas' new governor, Democrat Gina Hinojosa, is \"going to be quite moderate\".\nHinojosa defeated Republican Governor Greg Abbott, ending more than three decades of the party's control of the state.\nThe Tesla boss added : \"I don't think she's a far-left governor. And based on everything I've heard about her, I think things will be fine in Texas with Gina as governor.\"\n- Published5 November\n- Published4 November",

    "summaryJa": "The firm started just five years ago and is now one of the biggest names in artificial intelligence.",
    "bodyOriginal": "AI giant Anthropic valued at up to $1.5tn ahead of stock market debut\n- Published\nAnthropic has seen its value jump to as much as $1.5tn (£1.14tn) as its shares are set to start trading on the stock market on Thursday.\nThe artificial intelligence (AI) company behind the popular chatbot Claude said its shares will be priced at $83 each when it lists on the Nasdaq, a tech-focused stock exchange based in New York.\nThat will make it one of the most valuable companies in the world.\nAnthropic's stock market debut will make it the first US firm focused exclusively on AI to go public. It will also mark a crucial test for the fast-growing industry, which faces questions over whether the huge amounts of money being poured into the technology will be profitable.\nThe firm said earlier this month it would offer its shares for between $70 and $78 each, which valued the company at up to $1.3tn.\nBut demand for Anthropic's stock debut - commonly referred to as its initial public offering, or IPO - is very high, according to one early investor in the company who spoke with the BBC on condition of anonymity.\nThe person said shares were more than 10 times oversubscribed ahead of the public listing, meaning demand for Anthropic shares exceeded the number of shares available.\nIf that turns out to be the case, Anthropic's valuation could quickly blow past its target on Thursday when trading begins.\nCrucial test for AI\nDepending on how strong that demand is, Anthropic could even exceed the early market valuation of Elon Musk's SpaceX, which was the world's most highly valued stock debut when it went public with a value of $2.2tn in June.\nHowever, in the weeks that followed, SpaceX shares fell significantly in price.\nAs it stands, Anthropic's listing will see the firm raise more than $68bn from its initial investors. It is also expecting another $26bn from private placements. So the total amount the company will raise is expected to be $94bn.\nThe amount of cash Anthropic has raised from its listing is already more than SpaceX raised in June.\nOpenAI, the maker of ChatGPT and Anthropic's biggest AI rival, is expected to go public next year.\nUntil then, Anthropic will be the only public company in the US that is entirely focused on the technology, or one that was founded and built around AI tools and products. Its scope is different from tech giants like Google and Microsoft that also develop AI but are involved in other tech services.\nThe seven Anthropic founders who are about to become multi-billionaires\n- Published7 hours ago\nThere is excitement around Anthropic's listing, but also some concern from investors around its ability to generate revenue and profits going forward.\nYang Wang, a principle financial analyst with Counterpoint Research, said the central issue for Anthropic is whether its business \"can keep pace\" as hundreds of billions of dollars in financial obligations come due in the next couple of years.\n\"Nevertheless, it is not an everyday occurrence for public investors to gain direct exposure to a frontier-model developer with the potential to shape the next stage of productivity,\" Wang said.\nWhile nearly every other major tech company is pouring huge amounts of money into the technology and infrastructure required for their own AI tools, they are built around social media or online retail or online search. AI tools and applications are secondary.\n\"Anthropic going public gives us a whole new window into what AI demand looks like,\" Marta Norton, who heads strategy at investment firm Empower, told the BBC.\nRapid rise\nAnthropic was started by a group of co-founders, led by siblings Dario Amodei and Daniela Amodei, all of whom left their work at OpenAI to start a new AI firm.\nThe company has carved itself out in the ongoing AI race as more focused on building the technology with safety top of mind.\nIt refused to comply with a demand by the US Department of Defense that Anthropic's tools be used in an essentially unrestricted way.\nCEO Dario Amodei has been outspoken in his belief that AI tools may soon be so powerful that they present a threat to human existence.\nThe company has urged developers to slow the development of AI, arguing that advanced systems could pose \"catastrophic\" risks to humanity if they are not handled with appropriate safeguards.\nRival firm OpenAI has also voiced similar concerns about the technology's risks and delayed its plans to list on the stock market to address AI safety concerns.\nNonetheless, Anthropic is looking to grow quickly and gain more access to financing through the public markets in order to do so.\nNorton said Anthropic going public now, in a time of market volatility comes down to the simple fact that the company needs access to more money.\n\"AI is financially demanding,\" Norton said. \"The public markets open up the financial spigot a little bit more, and so the time has come.\"\nBut broader anxieties have started to grow about the AI industry's business model, which is reliant on expensive computer chips that are in short supply. The technology is also dependent on controversial data centres and funding such operations require deals with other tech companies.\nThe Federal Reserve Bank has expressed concern about the rapid growth of AI-related debt being financed through \"complex and opaque\" structures, according to minutes from its October meeting to discuss a potential rate rise.\nA few of the meeting's participants also noted that \"AI-related exposures were becoming increasingly concentrated among a small number of firms\".\nWith additional reporting by Rachel Clun\nRelated topics\n- Published9 hours ago\n- Published1 day ago",

    "bodyOriginal": "Crew unaware of risks before Mike Lynch's yacht Bayesian sank, say investigators\n- Published\nThe crew of the Bayesian superyacht did not know about critical safety risks that left it vulnerable in powerful winds before it sank off the coast in northern Sicily, killing seven people, British investigators say.\nBritish tech tycoon Mike Lynch, 59, and his daughter Hannah, 18, were among seven people who died when the vessel sank on 19 August 2024.\nThe sinking of the Bayesian unfolded with \"extraordinary speed\" when a violent downburst of freak hurricane-force winds knocked it onto its side in less than 15 seconds, the UK's Marine Accident Investigation Branch (MAIB) final report said.\nSafety information provided to the crew did not identify this type of risk, the MAIB said.\n\"It was very dynamic, very quick,\" said MAIB principal inspector Simon Graves. \"The speed of events overtook the crew and prevented them from taking any other action.\"\nThe accident also led to the deaths of Morgan Stanley International bank chairman Jonathan Bloomer, 70, and his wife, Judy, 71; American lawyer Chris Morvillo, 59, and his wife Neda Morvillo, 57; and crew member Rick Thomas, 59.\nRob Loder, chief inspector of marine accidents said: \"Our thoughts remain with the families and loved ones of the seven who lost their lives, and with all those affected by the loss of Bayesian. This accident developed with extraordinary speed.\"\nFifteen survivors escaped from the 56-metre (184ft) luxury yacht and managed to get to a life raft that had been launched by a crew member.\nThe marine investigation found that the Bayesian \"had a vulnerability to high winds that was not recognised, because the yacht had never been assessed at anchor with its sails down\".\nIn addition, \"the extreme winds that night were also not explicitly forecast, so the crew had no warning of the risk\", Loder added.\nIn the early hours of 19 August 2024 the Bayesian was anchored outside of Porticello port, on the north coast of Sicily.\nWith thunderstorms rapidly coming in, wind speeds went from 8 knots to about 70 knots (80mph) within minutes. The weather forecast had only predicted gusts of up to 27 knots (31mph).\nThe MAIB report stated that with no sails set Bayesian was vulnerable to being knocked over in severe winds.\nIt also found that any knockdown - where the boat was suddenly tipped sideways - would be \"irrecoverable once the yacht passed the angle of vanishing stability\", assessed in the study as being 73 degrees. Once the vessel passed this angle it could not right itself.\nIn addition, the centreboard, which provides stability when a ship is under sail, was raised. The report said the centreboard was not needed when the Bayesian was using its motors and was rarely lowered at anchor. The way the boat was loaded, and the angle of the wind, also contributed to the accident.\nInspectors said a \"downburst of hurricane-force winds\" was the most likely cause of the ship keeling over.\nThey happen when cold, dense air plunges rapidly, sending out violent winds across the surface.\nThe MAIB said that none of risks were covered in the UK training syllabus, nor in published guidance available to crew.\nOnce the vessel was on its side, it rapidly filled with water and sank.\nAs it heeled over, five people were injured, either by falling or by items falling on them and a deckhand was thrown into the sea, the report said.\nAs water started entering the yacht, two of the guests \"used the furniture drawers as an improvised ladder to exit into the central alleyway\", then climbed along the internal walls to get into the saloon.\nThe MAIB's final report into the sinking, published on Thursday, appeared to contrast with recent reports from Italy, where prosecution experts have reportedly blamed errors by the crew rather than problems with the yacht.\nThe investigation was carried out alongside a criminal probe in Italy, where captain James Cutfield, chief engineer Tim Parker Eaton and deckhand Matthew Griffith are under investigation over potential charges of multiple manslaughter and culpable shipwreck.\nBritish investigators said that Italian prosecutors had restricted access to some witnesses and evidence.\n\"It is possible that the circumstances depicted in this report may alter following disclosure of evidence withheld by the Italian authorities,\" the report says.\nHowever, the MAIB's Graves said he was satisfied with the British investigation.\n\"We are content with our investigation, the investigation that we've undertaken, and the information we've used to feed into it.\"\nThe report also found that alcohol consumption had not contributed to the sinking.\nThe MAIB report makes seven recommendations to four agencies. It calls for new regulations to be set for single-hulled sailing vessels, and new rules around life rafts.\nIt also urges collaboration between the Met Office and its global counterpart to improve information-sharing of severe weather forecasts with mariners.\nThe Maritime and Coastguard Agency is also investigating the sinking.\nRelated topics\n- Published15 May 2025\n- Published21 June 2025\n- Published15 April 2025",

lo port, on the north coast of Sicily.\nWith thunderstorms rapidly coming in, wind speeds went from 8 knots to about 70 knots (80mph) within minutes. The weather forecast had only predicted gusts of up to 27 knots (31mph).\nThe MAIB report stated that with no sails set Bayesian was vulnerable to being knocked over in severe winds.\nIt also found that any knockdown - where the boat was suddenly tipped sideways - would be \"irrecoverable once the yacht passed the angle of vanishing stability\", assessed in the study as being 73 degrees. Once the vessel passed this angle it could not right itself.\nIn addition, the centreboard, which provides stability when a ship is under sail, was raised. The report said the centreboard was not needed when the Bayesian was using its motors and was rarely lowered at anchor. The way the boat was loaded, and the angle of the wind, also contributed to the accident.\nInspectors said a \"downburst of hurricane-force winds\" was the most likely cause of the ship keeling over.\nThey happen when cold, dense air plunges rapidly, sending out violent winds across the surface.\nThe MAIB said that none of risks were covered in the UK training syllabus, nor in published guidance available to crew.\nOnce the vessel was on its side, it rapidly filled with water and sank.\nAs it heeled over, five people were injured, either by falling or by items falling on them and a deckhand was thrown into the sea, the report said.\nAs water started entering the yacht, two of the guests \"used the furniture drawers as an improvised ladder to exit into the central alleyway\", then climbed along the internal walls to get into the saloon.\nThe MAIB's final report into the sinking, published on Thursday, appeared to contrast with recent reports from Italy, where prosecution experts have reportedly blamed errors by the crew rather than problems with the yacht.\nThe investigation was carried out alongside a criminal probe in Italy, where captain James Cutfield, chief engineer Tim Parker Eaton and deckhand Matthew Griffith are under investigation over potential charges of multiple manslaughter and culpable shipwreck.\nBritish investigators said that Italian prosecutors had restricted access to some witnesses and evidence.\n\"It is possible that the circumstances depicted in this report may alter following disclosure of evidence withheld by the Italian authorities,\" the report says.\nHowever, the MAIB's Graves said he was satisfied with the British investigation.\n\"We are content with our investigation, the investigation that we've undertaken, and the information we've used to feed into it.\"\nThe report also found that alcohol consumption had not contributed to the sinking.\nThe MAIB report makes seven recommendations to four agencies. It calls for new regulations to be set for single-hulled sailing vessels, and new rules around life rafts.\nIt also urges collaboration between the Met Office and its global counterpart to improve information-sharing of severe weather forecasts with mariners.\nThe Maritime and Coastguard Agency is also investigating the sinking.\nRelated topics\n- Published15 May 2025\n- Published21 June 2025\n- Published15 April 2025",

    "title": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'",
    "titleJa": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'",
    "summaryJa": "A former McDonald's worker calls on the firm to “change the way they treat younger employees” as a judge rules a legal case against the chain can go ahead.",
    "bodyOriginal": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'\n- Published\nA former McDonald's worker who says a manager failed to protect her when she was being sexualised by customers, has called on the firm to “change the way they treat younger employees”.\nHope, who worked at a branch in the West Midlands in 2023, also told BBC News she saw older colleagues eyeing up 16- and 17-year-old workers, and talking about wanting to sleep with them when they turned 18.\nHope is one of hundreds of workers bringing a discrimination claim against McDonald's. This week, a judge ruled against McDonald's attempt to have their claims struck out, a move that Hope welcomed.\nMcDonald's said: \"Ensuring a safe, respectful and inclusive working environment across our restaurants and offices remains a fundamental priority.\"\nThe latest developments come after a BBC investigation in 2023 which heard that workers, some as young as 17, were being groped and harassed.\nLast year, McDonald's staff told us they still faced sexual abuse and harassment.\nHope, who is now 22, says that her branch of McDonalds had a very sexualised, \"toxic\" environment.\nShe spoke of a time a manager came up behind her and put his hands on her shoulders. From then on, whenever she saw him coming over, she says she \"moved quick\" to get away from him.\n\"I got the hell out of there,\" she says.\nAnother time, she says a manager failed to protect her when she says she was being sexualised and objectified by two customers on a night shift.\nHope says she told the manager what was happening, but he told her to \"just suck it up and deal with it\".\nHer main concern, however, was for the younger teenagers, who she says weren't being looked after.\n\"You could tell there were other staff members waiting for their 18th birthdays. That sort of like toxic culture where it's like, 'Oh, you know, it's not illegal now.' It was that feeling from quite a few of them,\" she says.\n\"And why would you? That is literally a child still.\"\nLegal action\nHundreds of current and former McDonald's employees are bringing a discrimination claim against the firm.\nThe fast-food chain had attempted to have the complaints thrown out but this week at the London Central Employment Tribunal, Judge Glennie ruled that 450 cases can go ahead and they are now expected to be heard at the Employment Tribunal in April.\nThe BBC understands that these relate to indirect discrimination, not sexual harassment.\nHope told us she was not taking part in the legal case for money, saying they didn't know if they were going to get anything.\nInstead, she said it was to try and \"change the way they treat younger employees\".\n\"It's going to change the way they treat allegations. It's going to shake up the whole internal process and make life easier for the kids who are now having their first jobs. And it's going to make it a lot safer, I think, as well. And that's something you can't put a price on, the safety of the young these days.''\nShe also accused McDonald's of trying to \"delay the inevitable\" by attempting to have the claims thrown out.\n\"And the judge quite rightly looked at them and said: 'No. We're not going to do that.'\"\nThe claims were presented by law firm Leigh Day, which is acting for the current and former employees.\nThe claims focus on the vulnerability of young or female workers in the workplace and follow allegations of widespread harassment and discrimination across McDonald's restaurants in the UK.\nLeigh Day partner Kiran Daurka told the BBC: \"We're really delighted that the judge has found that these claims can go forward to a full hearing. It's really important for access to justice that these cases are heard.\"\nA McDonald's spokesperson said they could not comment on the specifics of ongoing legal proceedings.\nIn a statement, they said the company had \"embedded an extensive set of robust and far-reaching initiatives\" as part of its \"steadfast commitment\" to its staff, adding that this work continues.\n\"Any form of harassment, discrimination or inappropriate behaviour is unacceptable and has no place in our restaurants or offices. We are confident that with the guidance and partnership of external experts, we and our franchisees have industry leading safeguarding measures in place,\" the spokesperson added.\n- Published18 July 2023",

commitment\" to its staff, adding that this work continues.\n\"Any form of harassment, discrimination or inappropriate behaviour is unacceptable and has no place in our restaurants or offices. We are confident that with the guidance and partnership of external experts, we and our franchisees have industry leading safeguarding measures in place,\" the spokesperson added.\n- Published18 July 2023",
