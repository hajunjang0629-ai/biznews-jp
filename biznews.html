    "summaryJa": "スコット・ベッセント財務長官がダラスで予定している共和党大会演説で、政治が同財務長官に対する市場の信頼にどのような影響を与える可能性があるかについて疑問が生じている。",
    "bodyOriginal": "Treasury Secretary Scott Bessent's push to calm the bond market is colliding with a more political role, as his planned Republican convention speech raises questions about the credibility he needs to manage U.S. debt markets.\nBessent's prime-time speech at the Republicans' midterm convention in Dallas on Wednesday will mark the first time in 50 years that a sitting Treasury secretary has spoken at a national political convention. The Dallas meeting is the first time the GOP has held a midterm convention. But the principles that have kept Treasury secretaries off the national convention stage since Treasury Secretary William E. Simon spoke at the Republican National Convention in 1976 are the same.\n\"Treasury generally doesn't have a tremendous power but for the market credibility of the Treasury secretary,\" said Stephen Myrow, managing partner of Beacon Policy Advisors, and a former advisor to Treasury Secretary Hank Paulson. The Treasury Department can't print money, unlike the Federal Reserve.\nBessent is the last government official due to speak before Trump, sandwiched between U.S. House candidates from Arizona and Michigan and a woman billed on the convention agenda as an \"everyday American, working mother and economic policy advocate.\"\nHis speech will come against the backdrop of the Treasury Department on Wednesday saying it would buy back as much as $6 billion in long-term treasury debt this week, with a cap of at least $4 billion in operations later this year. The department began the buyback program in 2024 to solve a well-documented problem where trading can be thin for some long-term debt.\nBut the 64-year-old former hedge fund trader has described those operations in broader terms. There was a \"fever that was building,\" in the markets, Bessent said at an event Tuesday organized by conservative news organization Breitbart. He said he acted to stem that.\nThat intervention worked at first after Bessent announced enhanced buybacks on Aug. 19. The news, which prompted Treasury yields to fall, came after days of headlines worrying about a global sell-off in government bonds.\nBut the effect was short-lived. Yields on long-term Treasury debt rose Wednesday after the department disclosed the size of the buybacks, which had been anticipated. The 10-year Treasury note yielded 4.84% mid-afternoon Wednesday, higher than any point of Trump's term. Higher yields on Treasury debt can help savers who can earn income from holding debt, but it can squeeze borrowers who face higher costs for new mortgages and auto loans.\nThe Treasury secretary's role in helping to manage the vast, vital market for government debt makes the position particularly sensitive within the Cabinet. The Treasury secretary has played a critical role in stabilizing the economy during market crises, such as the 2007-2008 financial crisis or the 2020 pandemic.\nAlthough all Cabinet officials are political actors to a degree — they report to and are appointed by the elected president — some Treasury secretaries have been careful to avoid overt politics.\n\"I was never asked to speak at an explicitly political event and was careful not to do so to avoid violating the Hatch Act,\" former Treasury Secretary Janet Yellen said, referring to the law that limits the political activities of most executive branch employees. She served under President Joe Biden until Trump took office in 2025.\nThe 1939 law puts some restrictions on certain executive branch officials' engagement in partisan politics, but political activity is permissible in some cases so long as officials don't use their official title or public resources. \"Other Biden appointees did speak at political events observing these rules,\" Yellen said.\nOther Treasury secretaries have been involved in political conventions. Treasury Secretary James Baker appeared in a video at the 1988 Republican National Convention. He resigned effective that day to run George W. Bush's presidential campaign. Robert Rubin spoke at the 2000 Democratic convention, a year after he stepped down as Bill Clinton's Treasury secretary.\nBessent has been aggressive in using his public profile to pursue the administration's political adversaries.\n\"I say sometimes I feel like an emergency room doctor,\" Bessent said at the Breitbart event Tuesday. \"The Biden economy just was like American people got hit by a truck.\" But workers are doing much better under Trump, Bessent said. The bottom 25% of earners has seen greater wage gains than the top 25%, he said.\nThe Treasury Department didn't respond to requests for comment about the political nature of Bessent's speech Thursday. He has waved off questions about his political ambitions beyond his current job.\nBessent is from South Carolina, home of the late Republican Sen. Lindsey Graham. Bessent told students at Southern Methodist University on Tuesday that he had fielded calls in the wake of Graham's sudden death in July.\n\"They said, 'Oh, you should run for his seat,' and I said, 'you know what, I have one very demanding boss right now. I do not need 5.5 million South Carolinians as boss,'\" Bessent said.\nBessent isn't a natural orator. His delivery is sometimes considered awkward, and he tends to fall into financial jargon.\nAnd yet Bessent has risen to the top of an administration where the president is constantly assessing his underlings for their loyalty and the aggression of their defense of his policies, whatever they may be.\n\"We don't have a typical, traditional president. So we wouldn't expect to have a traditional Treasury secretary,\" Myrow said.\nBut if the markets don't trust Bessent, perhaps because they see him as putting politics first, Bessent could be stuck in a downward spiral of escalating demands from the president and weakening effectiveness, Myrow said.\n\"The real value Bessent has for Trump is his credibility in the market,\" Myrow said. \"If he ends up sufficiently losing market credibility, he's burning up the value he provides to Trump and the country.\"\n— Steve Liesman contributed to this report.",
    "bodyJa": "債券市場の沈静化を目指すスコット・ベッセント財務長官の取り組みは、より政治的な役割と衝突している。同氏が計画している共和党大会での演説が、米国債券市場の管理に必要な同氏の信頼性に疑問を投げかけているからだ。\n水曜日にダラスで開催される共和党中間大会でのベッセント氏のゴールデンタイム演説は、現職財務長官が全国政治大会で演説するのは50年ぶりとなる。ダラス会議は共和党が中間党大会を開催するのは初めて。しかし、1976年にウィリアム・E・サイモン財務長官が共和党全国大会で講演して以来、財務長官を全国大会の舞台から遠ざけてきた原則は同じである。\nビーコン・ポリシー・アドバイザーズのマネジング・パートナーで、ハンク・ポールソン財務長官の元顧問スティーブン・マイロー氏は、「財務省は一般に、財務長官の市場での信頼性以外には絶大な権力を持っていない」と語る。財務省は連邦準備制度とは異なり、紙幣を印刷することができません。\nベッセント氏はトランプ大統領の前で演説する予定の最後の政府高官で、アリゾナ州とミシガン州の下院候補者と、大会の議題に「平凡なアメリカ人でワーキングマザーで経済政策の擁護者」として名を連ねている女性の間に挟まれている。\n同氏の講演は、財務省が今週、年内のオペの上限を少なくとも40億ドルとし、最大60億ドルの長期国債を買い戻すと発表したことを背景に行われることになる。同省は、一部の長期債務の取引が薄くなる可能性があるという十分に文書化された問題を解決するために、2024年に買い戻しプログラムを開始した。\nしかし、64歳の元ヘッジファンドトレーダーは、これらの業務をより広範な観点から説明した。保守系報道機関ブライトバートが火曜日に主催したイベントでベッセント氏は、市場では「熱が高まっている」と述べた。彼はそれを阻止するために行動したと述べた。\nこの介入は、ベッセント氏が8月19日に自社株買いの強化を発表した後、最初は機能した。このニュースが米国債利回りの低下を促したのは、世界的な国債の下落を懸念する見出しが数日続いた後であった。\nしかし、その効果は短命でした。水曜日、同省が予想されていた自社株買いの規模を明らかにしたことを受けて、長期国債利回りが上昇した。水曜日の午後半ばの10年米国債利回りは4.84％と、トランプ大統領の任期中のどの時点よりも高かった。財務省債の利回りの上昇は、借金を保有することで収入を得られる貯蓄者にとっては助けになるが、新たな住宅ローンや自動車ローンのコスト増に直面する借り手は圧迫される可能性がある。\n広大で重要な国債市場の管理を支援するという財務長官の役割は、内閣内でその立場を特にデリケートなものにしている。財務長官は、2007年から2008年の金融危機や2020年のパンデミックなどの市場危機の際に、経済の安定化において重要な役割を果たしてきました。\nすべての閣僚はある程度政治的主体であるが、彼らは選挙で選ばれた大統領に報告し、大統領によって任命されるが、一部の財務長官はあからさまな政治を避けるよう注意している。\nジャネット・イエレン元財務長官は、ほとんどの行政府職員の政治活動を制限する同法に言及し、「私は明らかに政治的なイベントでの講演を求められたことは一度もなかったし、ハッチ法に違反しないように注意していた」と語った。彼女は2025年にトランプ大統領が就任するまでジョー・バイデン大統領の下で勤務した。\n1939年の法律は、特定の行政府職員の党派政治への関与に一定の制限を設けているが、公務員がその官職や公的な資源を利用しない限り、政治活動は場合によっては許容される。イエレン氏は「バイデン氏に任命された他の人たちも、これらの規則を守って政治行事で講演した」と述べた。\n他の財務長官も政治大会に参加している。ジェームズ・ベイカー財務長官は1988年の共和党全国大会でビデオに出演した。同氏はジョージ・W・ブッシュ大統領の選挙運動を率いるため、その日付けで辞任した。ロバート・ルービンは、ビル・クリントン政権の財務長官を辞任した翌年、2000年の民主党大会で講演した。\nベッセント氏は、政権の政敵を追及するために自らの公的なプロフィールを積極的に利用してきた。\nベッセント氏は火曜日のブライトバートのイベントで、「時々救急治療室の医師のような気分になると言う」と語った。 「バイデン経済はまさにアメリカ国民がトラックに轢かれたようなものだった。」しかし、トランプ政権下で労働者の業績ははるかに良くなっているとベッセント氏は語った。同氏によると、所得の下位25％の賃金上昇率は上位25％よりも大きかったという。\n財務省は木曜日のベッセント氏の演説の政治的性質についてのコメント要請に応じなかった。彼は現在の仕事を超えた政治的野心についての質問をはねつけた。\nベッセント氏は共和党の故リンジー・グラハム上院議員の故郷であるサウスカロライナ州出身。ベッセント氏は火曜日、南メソジスト大学の学生に対し、7月にグラハム氏が急死したことを受けて電話対応を行ったと語った。\n「彼らは『ああ、君は彼の議席に立候補すべきだ』と言ったので、私は『ご存知のとおり、今、非常に要求の厳しい上司が一人います。550万人のサウスカロライナ州人を上司にする必要はありません』と言いました」とベッセント氏は語った。\nベッセント氏は生来の雄弁家ではない。彼の話し方は時々ぎこちないと思われ、経済用語に陥る傾向がある。\nそれにもかかわらず、ベッセント氏は、大統領が部下たちの忠誠心や政策擁護の攻撃性を常に評価している政権のトップに上り詰めた。\nマイロー氏は「われわれには典型的な伝統的な大統領がいない。したがって、伝統的な財務長官がいることは期待できない」と語った。\nしかし、おそらく市場がベッセント氏を政治を第一に考えているとみなしているためか、市場が信頼しなければ、ベッセント氏は大統領からの要求がエスカレートし、実効性が弱まるという下向きのスパイラルに陥る可能性があるとマイロウ氏は述べた。\n「ベッセント氏がトランプ氏に持つ本当の価値は、市場における彼の信頼性だ」とマイロー氏は語った。 「もし彼が市場の信頼を十分に失うことになれば、彼がトランプと国に提供する価値を燃やしてしまうことになる。」\n— Steve Liesman 氏がこのレポートに貢献しました。",

    "id": "republicans-to-tout-congressional-stock-83efc8ae",
    "title": "Republicans to tout congressional stock-trading ban at midterm convention as Trump trades",
    "titleJa": "共和党、トランプ氏の取引に伴う議会の株式取引禁止を中間党大会で宣伝へ",
    "summaryJa": "共和党は、ドナルド・トランプ大統領自身の投資口座が何百万ドルもの活発な取引を続けているにもかかわらず、中間党大会を利用して議会での株式取引禁止を汚職撲滅の売り込みの一環としている。アンナ・パウリナ・ルナ下院議員（共和党、フロリダ州）は、ダラス大会開幕日の水曜日に「政府の誠実さ」に重点を置く議会株取引の制限を要求すると予想される少なくとも２人の講演者のうちの１人である。",
    "bodyOriginal": "Republicans are using their midterm convention to make a congressional stock-trading ban part of their anti-corruption pitch — even as President Donald Trump's own investment accounts continue actively trading millions of dollars.\nRep. Anna Paulina Luna, R-Fla., is one of at least two speakers expected to call for restrictions on congressional stock trading during the Dallas convention's opening day Wednesday, which includes a focus on \"Government Integrity.\"\nSince returning to office, Trump has maintained an unusually large and active investment portfolio.\nAcross eight accounts, he disclosed at least $858 million in assets and more than 21,000 trades in 2025, according to an earlier CNBC analysis of his annual financial disclosure. During his entire first term, he reported roughly 500 trades.\nThe activity has continued this year.\nTrump disclosed 1,051 transactions in June alone, totaling between $78.1 million and $263.1 million. His accounts bought and sold stocks, bonds and exchange-traded funds, including multimillion-dollar moves involving Meta, Berkshire Hathaway, Visa and Mastercard and as much as $50,000 in newly public SpaceX.\nSome of those investments are in industries directly affected by presidential decisions.\nCNBC reported Wednesday that Trump's nine largest disclosed oil and gas holdings gained an estimated $1.5 million to $4.4 million from the eve of the Iran war through Aug. 31, while his accounts continued buying and selling energy stocks during the conflict.\nCNBC found no evidence Trump directed those trades, traded on advance knowledge of government decisions or shaped policy to benefit his investments.\nThe Trump Organization has said outside financial institutions have full discretion over investment decisions and rely heavily on automated strategies. The White House has said Trump cannot direct individual transactions and that \"there are no conflicts of interest.\"\nTrump nevertheless remains the beneficiary of the assets and benefits when they increase in value.\nMeanwhile, Luna's Wednesday convention billing also comes less than two months after House Republicans passed the first major congressional stock-trading restrictions in years.\nThe GOP-led Stop Insider Trading Act cleared the House 232-198 in July. It would bar members of Congress from buying individual stocks while in office, but allow them to retain existing holdings and sell shares after publicly disclosing their intent at least seven days in advance. The restrictions would not apply to the president.\nA congressional stock-trading ban has broad public support, fueled by years of scrutiny over lawmakers' well-timed trades and rapidly growing portfolios. However, critics say the House bill still leaves potential conflicts intact.\n\"It's a stock trading ban that still allows stock trading,\" Rep. Seth Magaziner, D-R.I., who has worked with Republicans on a more sweeping proposal, told CNBC in July.",
    "bodyJa": "共和党は、ドナルド・トランプ大統領自身の投資口座が何百万ドルもの活発な取引を続けているにもかかわらず、中間党大会を利用して議会での株式取引禁止を汚職撲滅の売り込みの一環としている。\nアンナ・パウリナ・ルナ下院議員（共和党、フロリダ州）は、ダラス大会開幕日の水曜日に「政府の誠実さ」に重点を置く議会株取引の制限を要求すると予想される少なくとも２人の講演者のうちの１人である。\n大統領に復帰して以来、トランプ氏は異例に大規模で活発な投資ポートフォリオを維持している。\n同氏の年次財務開示に関する以前のCNBC分析によると、同氏は8つの口座にわたって、2025年に少なくとも8億5,800万ドルの資産と2万1,000件以上の取引を開示したという。最初の任期全体で、彼はおよそ 500 件の取引を報告しました。\n今年も活動は継続されました。\nトランプ氏は6月だけで1,051件の取引を明らかにし、総額は7,810万ドルから2億6,310万ドルに達した。彼の口座では株、債券、ETFの売買が行われ、その中にはメタ、バークシャー・ハサウェイ、ビザ、マスターカードに関わる数百万ドルの動きや、新たに公開されたスペースX社の5万ドルもの資金も含まれていた。\nそうした投資の中には、大統領の決定によって直接影響を受ける業界への投資もある。\nCNBCは水曜、トランプ大統領が公表した9大石油・ガス保有資産は、イラン戦争前夜から8月31日までに推定150万ドルから440万ドルの利益を得たが、同氏の口座は紛争中もエネルギー株の売買を続けていたと報じた。\nCNBCは、トランプ氏がこれらの取引を指示したり、政府の決定を事前に知って取引したり、自身の投資に利益をもたらす政策を形成したりする証拠は見つからなかった。\nトランプ・オーガニゼーションは、外部の金融機関が投資決定に関して完全な裁量権を有しており、自動化された戦略に大きく依存していると述べた。ホワイトハウスは、トランプ大統領が個別の取引を指示することはできず、「利益相反は存在しない」と述べた。\nそれにもかかわらず、トランプ氏は資産とその価値が上昇した際の恩恵の受益者であり続ける。\n一方、ルナ氏の水曜党大会の請求も、下院共和党がここ数年で初めての大規模な株式取引制限を議会で可決してから２カ月も経たないうちに提出された。\n共和党主導のインサイダー取引停止法は7月に下院232対198で可決された。これにより、議員が在任中に個別株を購入することは禁じられるが、少なくとも7日前までに意向を公表した上で既存の保有株を保持し、株式を売却することは認められる。この制限は大統領には適用されない。\n議会による株式取引の禁止は、議員らのタイミングの良い取引と急速に成長するポートフォリオに対する長年の監視に支えられ、幅広い国民の支持を得ている。しかし、批評家らは、下院法案は依然として潜在的な紛争をそのまま残していると主張している。\n共和党と協力してより抜本的な提案に取り組んできたセス・マガジンジャー下院議員（民主党、ロードアイランド州）は7月、CNBCに対し、「これは株式取引を依然として許可する株式取引禁止措置だ」と語った。",

    "id": "apple-s-new-boss-starts-with-big-gamble-dc3fa3c1",
    "title": "Apple's new boss starts with big gamble on costly first folding iPhone",
    "titleJa": "Appleの新社長、高価な初の折りたたみiPhoneへの大きな賭けから始まる",
    "summaryJa": "Appleの新社長、高価な初の折りたたみiPhoneへの大きな賭けから始まる- 公開されました",
    "bodyOriginal": "Apple's new boss starts with big gamble on costly first folding iPhone\n- Published\nJohn Ternus has entered his second week as Apple's chief executive and the company has revealed the first major change to the iPhone since it was released almost 20 years ago.\nTernus, who took on Apple's top job after Tim Cook stepped down, was onstage on Wednesday at the company's annual product release event in front of huge images of the first foldable iPhone.\nWith a book-style format, the new iPhone, dubbed the Duo, is the largest ever size of the product. And with a US starting price of $1,999 (£1,475) going up to $3,200, it is also the most expensive. UK prices start at £1,999.\nTernus said the Duo was \"inspired by the iPad\" but called the folding features \"fluid and completely intuitive.\"\nThe foldable phone has been a work-in-progress inside Apple for several years.\nWhen unfolded, the new Duo has the look of a small iPad. When folded in half, it has the look of a wider iPhone.\nTernus said during the event that Apple wanted to avoid the look and feel of other foldable smart phones on the market, which he said \"feel like two phones stuck together... making a larger screen feel much smaller.\"\nThe Duo, he said, is the \"result of a series of remarkable innovations that we think will redefine the experience of using a foldable phone.\"\nTernus was directly involved in developing the foldable iPhone as he spent many years as a top executive inside Apple's hardware division before being tapped earlier this year as Cook's successor.\nBen Wood, chief analyst at technology research firm FDM, said it was likely Ternus's promotion was timed specifically \"to coincide with what will be arguably one of the biggest iPhone launches for many years\".\n\"Nothing happens by accident at Apple,\" Wood added.\nCarolina Milanesi, an analyst at Creative Strategies who attended the Wednesday presentation, said the spotlight on Ternus made it feel \"almost like he was a product himself.\"\nAltering the design of the iPhone may address some criticism that Apple has yet to land a major product hit or truly exciting innovation since the first iPhone came out in 2007.\n\"The foldable risks becoming a premium-priced ornament in the portfolio, imparting badge value but not meaningful growth,\" said Dipanjan Chatterjee, an analyst at Forrester.\nPreviously, the highest starting price of the newest iPhone was $900 (£664). Apple also revealed on Wednesday the new iPhone 18 and 18 Pro, which start at $1,200 (£885) and $1,300 (£959) respectively.\nChatterjee said the foldable iPhone could go the way of Apple's Vision Pro headset, which the company priced at $3,699 (£2,729) and has not been a hit with buyers. Or, he said, it could be the company's next Apple Watch which, while not as popular as the iPhone, is bought by millions of people each year.\nThe way people have become accustomed to the way the iPhone operates is another potential hurdle to Apple seeing big sales of the new design.\n\"Foldables are interesting devices\", Milanesi noted. \"A lot of people are intrigued by it, but the software and the learning curve that you have from moving from a traditional phone to a foldable is real.\"\nWood noted that the current market for foldable smartphones from the likes of Samsung and Huawei make up only 2% of smartphone sales. Even with Apple's version likely driving interest and demand, sales are only expected to reach 4% of the total market in the next decade, according to data and analytics firm FDM.\nThe iPhone has been Apple's top-selling product and accounts for more than half of the company's sales each year.\nIn recent quarters, the company has boasted that the iPhone is more in-demand than ever, with the most recent version of the device becoming its most successful product launch.\nThe company also revealed more about the coming relaunch of its audio and chat assistant Siri, which it now calls Siri AI.\nStarting with the iPhone 18, the bot will now be able to go across information on a person's phone, like messages and emails, to find information, answer queries and take action on a person's behalf.\nSome Siri AI features will also be available on the new Apple Watch, including the ability to take notes of conversations and transcribe them, should a wearer enable that feature.\nTernus referred to new AI-enabled capabilities on the iPhone as an \"intelligent personal hub\", and admitted that Apple would be making use of \"the most private details of your daily life.\"\nHe insisted that all of it will remain private, with the AI features often running \"on device\", meaning not through third-party companies. And when a third-party is required for a function, Ternus said it will remain private in a remote server, or cloud.\n\"Others see that data as something to collect and store\", Ternus said. \"Here, not even Apple can access what's yours.\"\nRelated topics\n- Published7 days ago",
    "bodyJa": "Appleの新社長、高価な初の折りたたみiPhoneへの大きな賭けから始まる\n- 公開されました\nジョン・ターナス氏がアップルの最高経営責任者に就任して2週間目に入り、同社は約20年前にiPhoneが発売されて以来初めてとなるiPhoneへの大きな変更を明らかにした。\nティム・クック氏の辞任後、アップルのトップの座を引き継いだターナス氏は水曜日、同社の年次製品発表イベントのステージに初の折りたたみ式iPhoneの巨大な画像の前で登壇した。\nDuo と呼ばれる新しい iPhone はブックスタイルのフォーマットで、これまでの製品の中で最大のサイズです。また、米国での開始価格は 1,999 ドル (1,475 ポンド) から 3,200 ドルまでと、最も高価でもあります。英国での価格は1,999ポンドから。\nTernus 氏は、Duo は「iPad からインスピレーションを得た」ものであると述べたが、折りたたみ機能は「流動的で完全に直感的」であると述べた。\nこの折りたたみ式スマートフォンは、Apple 社内で数年間にわたって開発が進められてきました。\n新しい Duo を広げると、小さな iPad のような外観になります。半分に折りたたむと、幅広のiPhoneのように見えます。\nターヌス氏はイベント中に、アップルは市場にある他の折りたたみ式スマートフォンの外観と操作感を避けたかったと述べ、「2台の携帯電話をくっつけたような感じ…大きな画面がずっと小さく感じられる」と語った。\n同氏は、Duo は「折りたたみ式携帯電話の使用体験を再定義すると考えられる一連の驚くべきイノベーションの結果」であると述べた。\nターナス氏は、今年初めにクック氏の後継者に抜擢されるまで、アップルのハードウェア部門のトップとして長年務め、折り畳み式iPhoneの開発に直接関わった。\nテクノロジー調査会社FDMの首席アナリスト、ベン・ウッド氏は、ターナスのプロモーションは「おそらくここ数年で最大規模のiPhoneの発売の1つとなるであろうiPhoneの発売に合わせて」特別にタイミングを合わせられた可能性が高いと述べた。\n「アップルでは偶然に起こることは何もない」とウッド氏は付け加えた。\n水曜日のプレゼンテーションに出席したクリエイティブ・ストラテジーズのアナリスト、カロリナ・ミラネシ氏は、テルヌスにスポットライトが当たったことで「まるで彼自身が商品になったかのような気分になった」と語った。\niPhoneのデザインを変更することで、2007年に初代iPhoneが発売されて以来、Appleはまだ大ヒット商品や本当にエキサイティングなイノベーションを生み出していないという一部の批判に対処できるかもしれない。\nフォレスター社のアナリスト、ディパンジャン・チャタジー氏は「折り畳み式製品はポートフォリオの中で高級な装飾品となり、バッジの価値をもたらすものの、意味のある成長にはならない恐れがある」と述べた。\n以前は、最新の iPhone の最高開始価格は 900 ドル (664 ポンド) でした。 Appleは水曜日に、それぞれ1,200ドル（885ポンド）と1,300ドル（959ポンド）からの新しいiPhone 18と18 Proも発表した。\nチャタジー氏は、この折りたたみ式iPhoneは、同社の価格が3,699ドル（2,729ポンド）で購入者に人気のなかったAppleのVision Proヘッドセットに代わる可能性があると述べた。あるいは、iPhoneほど人気はないものの、毎年何百万人もの人が購入する同社の次期Apple Watchになる可能性もある、と同氏は語った。\n人々がiPhoneの操作方法に慣れてしまっていることも、Appleが新デザインの大量販売を目指す上での潜在的なハードルとなる。\n「折りたたみ式デバイスは興味深いデバイスです」とミラネージ氏は述べた。 「多くの人がこれに興味を持っていますが、従来の携帯電話から折りたたみ式携帯電話に移行する際にソフトウェアと学習曲線が必要になるのは現実です。」\nウッド氏は、サムスンやファーウェイなどの折りたたみ式スマートフォンの現在の市場がスマートフォンの売上高に占める割合はわずか2％に過ぎないと指摘した。データ分析会社FDMによると、Appleのバージョンが関心と需要を促進している可能性が高いにもかかわらず、今後10年間の売上高は市場全体の4％にとどまると予想されている。\niPhone は Apple の最も売れている製品であり、毎年同社の売上高の半分以上を占めています。\n同社はここ数四半期、iPhoneの需要がこれまで以上に高まっており、同デバイスの最新バージョンが最も成功した製品発売になったと豪語してきた。\n同社はまた、現在「Siri AI」と呼ばれているオーディオおよびチャットアシスタント「Siri」の今後の再発売についてもさらに明らかにした。\niPhone 18 以降、ボットはメッセージや電子メールなど、ユーザーの携帯電話上の情報を横断して情報を検索し、質問に答え、ユーザーに代わってアクションを実行できるようになります。\n装着者がその機能を有効にすれば、会話をメモして文字に起こす機能など、一部の Siri AI 機能も新しい Apple Watch で利用できるようになります。\nTernus氏は、iPhoneのAIを活用した新しい機能を「インテリジェントな個人ハブ」と呼び、Appleが「日常生活の最もプライベートな詳細」を利用することを認めた。\n同氏は、AI機能は多くの場合「デバイス上」で実行され、サードパーティ企業を介さないことを意味し、すべてが非公開のままになると主張した。また、機能にサードパーティが必要な場合、その機能はリモート サーバーまたはクラウド内で非公開のままになると Ternus 氏は述べています。\n「他の人たちは、データを収集して保存するものだと考えています」とテルナス氏は言う。 「ここでは、Apple ですらあなたのものにはアクセスできません。」\n関連トピック\n- 7 日前に公開",

    "id": "trump-says-oil-and-gas-prices-won-t-fall-6fd91617",
    "title": "Trump says oil and gas prices won't fall until 'right after' midterm election",
    "titleJa": "トランプ大統領、石油・ガス価格は中間選挙「直後」まで下落しないと発言",
    "summaryJa": "ドナルド・トランプ大統領は水曜日、イラン戦争で上昇したエネルギー価格は約2カ月後に迫った中間選挙が終わるまでは下がらないだろうと述べた。トランプ大統領は共和党中間党大会に出席するためテキサス州に向かう前、アンドリュース統合基地で記者団に対し「選挙直後、原油価格は下落するだろう」と語った。",
    "bodyOriginal": "President Donald Trump on Wednesday said energy prices that have been elevated due to the Iran war will not come down until after the midterm elections, which are nearly two months away.\n\"Right after the election, oil prices are going to be tumbling downward,\" Trump told reporters at Joint Base Andrews before heading to Texas for the Republican Party's midterm convention.\nHe had been asked how he plans to explain to Americans why oil prices have just soared to highs not seen since the early weeks of the war. Global benchmark Brent crude futures on Wednesday traded above $101 per barrel for the first time since July, while U.S. West Texas Intermediate futures surpassed $96 per barrel at session highs.\n\"I think it's very easy to explain to America,\" Trump said. \"All you have to do is say, 'Will you let Iran have a nuclear weapon?' And the answer is no.\"\nTrump also insisted that the war against Iran, now in its seventh month with no clear resolution in sight, will end \"immediately after the election.\"\n\"They can't hold out any longer,\" said Trump, who has repeatedly claimed victory in the ongoing war, when asked to explain his prediction.\nBut he then suggested that Iran seeks to benefit from an election outcome unfavorable to Trump.\n\"They're desperate to try and affect the election, so that we can get a nice weak group of people in there, and leave them alone and let them have their nuclear weapon,\" the president said.\nThe comments amount to a rare acknowledgement from Trump that neither the war, nor the higher prices it has generated, are likely to end in the near future.\nThey also underscore how the protracted conflict continues to weigh down Trump and the GOP in an election cycle that has been dominated by concerns about inflation and affordability.\nTrump has claimed dozens of times throughout the war that a peace deal with Tehran is nearly at hand, only for none to emerge. But he lately appears to have given up on the prospect of a diplomatic victory, in favor of defeating Iran by destroying its military and starving its economy.\nThe U.S. military said Tuesday its forces have destroyed 10 Iranian tankers in the last week, while Iran's Revolutionary Guard has taken credit for destroying oil tankers in the Persian Gulf.\n\"I would say that the attacks are caused by us,\" Trump said, adding, \"you're going to see a lot more.\"\nTrump also claimed Wednesday that record-breaking gas prices will fall below $2 per gallon, but not until after the early November midterms — suggesting relief was still at least eight weeks away.\n\"I think it's going to take a little bit longer than the midterm,\" he said.\nThe remark slightly tempers Trump's recent assurance on Truth Social that oil prices \"will drop precipitously\" when the U.S. wins the war. \"It will all happen quickly,\" he wrote.\nBut fuel analyst Patrick De Haan of GasBuddy said he is still skeptical of Trump's latest prediction that oil and gas prices will fall after the midterms.\n\"I don't see any guarantees at all of that happening,\" De Haan said on X.",
    "bodyJa": "ドナルド・トランプ大統領は水曜日、イラン戦争で上昇したエネルギー価格は約2カ月後に迫った中間選挙が終わるまでは下がらないだろうと述べた。\nトランプ大統領は共和党中間党大会に出席するためテキサス州に向かう前、アンドリュース統合基地で記者団に対し「選挙直後、原油価格は下落するだろう」と語った。\n同氏は、原油価格が戦争初期の数週間以来見られない高値まで急騰した理由を米国人にどのように説明するつもりかと尋ねられていた。水曜日の世界のベンチマークであるブレント原油先物は7月以来初めて1バレル当たり101ドルを超え、米国のウェスト・テキサス・インターミディエイト先物は取引高値で1バレル当たり96ドルを超えた。\nトランプ大統領は「米国に説明するのは非常に簡単だと思う」と述べた。 「あなたがしなければならないことは、『イランに核兵器を持たせますか？』と言うだけです。」そして答えはノーだ。」\nトランプ大統領はまた、イランとの戦争は現在7カ月目に入っているが、明確な解決の見通しは立っておらず、「選挙直後」に終わると主張した。\n現在進行中の戦争で勝利を繰り返し主張してきたトランプ氏は、自身の予測について説明を求められた際、「彼らはこれ以上持ちこたえることはできない」と述べた。\nしかし同氏は、イランがトランプ大統領にとって不利な選挙結果から利益を得ようとしていると示唆した。\n「彼らは選挙に影響を与えようと躍起になっている。そうすれば、われわれは弱い立場の人々をそこに引き入れ、彼らを放っておいて核兵器を持たせることができる」と大統領は語った。\nこのコメントは、戦争も、それによって生じた物価上昇も、近い将来には終わらない可能性が高いというトランプ大統領の異例の認識を示したものだ。\n彼らはまた、インフレと手頃な価格に対する懸念が支配的な選挙サイクルの中で、長引く紛争がいかにトランプ大統領と共和党の重荷となっているかを強調している。\nトランプ大統領は戦時中、テヘランとの和平合意が近づいていると何十回も主張してきたが、結局何も合意には至らなかった。しかし彼は最近、外交勝利の可能性を諦め、軍事力を破壊し経済を飢えさせることでイランを倒すことを支持しているようだ。\n米軍は火曜日、自軍が先週イランのタンカー10隻を破壊したと発表し、一方イラン革命防衛隊はペルシャ湾で石油タンカーを破壊した功績を称えた。\nトランプ大統領は「攻撃は我々によって引き起こされたと言えるだろう」と述べ、「今後もさらに多くのことが起こるだろう」と付け加えた。\nトランプ大統領は水曜日、記録的なガソリン価格は1ガロン当たり2ドルを下回るが、それは11月初めの中間選挙後になるだろうと主張し、救済はまだ少なくとも8週間先であることを示唆している。\n同氏は「中間期よりももう少し時間がかかると思う」と述べた。\nこの発言は、米国が戦争に勝てば原油価格は「急激に下落する」というトランプ大統領の最近の真実ソーシャル番組での確信を若干和らげるものだ。 「すべてはすぐに起こるだろう」と彼は書いた。\nしかし、ガスバディの燃料アナリスト、パトリック・デ・ハーン氏は、中間選挙後に石油・ガス価格が下落するというトランプ大統領の最新の予測には依然として懐疑的だと述べた。\nデ・ハーンは『X』で「そのようなことが起こるという保証はまったくない」と語った。",

    "id": "what-a-historic-summer-box-office-reveal-708835b8",
    "title": "What a historic summer box office reveals about massive shifts in the theatrical industry",
    "titleJa": "歴史的な夏の興行収入が明らかにする演劇業界の大規模な変化について",
    "summaryJa": "ハリウッドが夏の新記録を樹立した。5月1日から9月7日までの国内興行収入は47億6000万ドルで、映画史上最高額となった。",
    "bodyOriginal": "Hollywood has a new summer record.\nThe domestic box office tallied $4.76 billion in ticket sales during the period between May 1 and Sept. 7, the highest haul in cinematic history.\nThe key moviegoing season, which starts the first weekend in May and runs through Labor Day weekend, is a pivotal piece of the theatrical calendar, typically responsible for 40% of the total annual domestic box office.\nThe previous summer record was cemented in 2013 when films including Disney and Marvel's \"Iron Man 3,\" Illumination's \"Despicable Me 2,\" Warner Bros.' \"Man of Steel,\" Pixar's \"Monsters University\" and Universal's \"Fast & Furious 6\" led the period to $4.75 billion.\nThe 2026 season was boosted by Sony's \"Spider-Man: Brand New Day\" and Universal's \"The Odyssey,\" which together contributed more than $1.5 billion to the summer tally, or more than 30%.\nIt was also helped by an extra week of ticket sales. In 2013, the summer began on May 3 and ended Sept. 2, a period that was seven days shorter.\n\"This should be a blueprint for future summers,\" said Paul Dergarabedian, head of marketplace trends at Rentrak. \"One movie should not have to carry an entire season. You need the event pictures, the family films, the breakout surprises, and the independent films working together to keep people coming back. This summer showed what that combination can deliver.\"\nThe summer 2026 box office ended nearly 10% ahead of 2019, according to data from Rentrak, the year before Covid shutdowns hamstrung ticket sales and before streaming took a bite out of moviegoing in earnest.\nThis strong showing has positioned the 2026 year-to-date haul to be just 7.5%, or $595 million, behind that pre-pandemic marker and reaffirmed box office analysts' predictions that the full-year box office can top $10 billion for the first time in seven years.\nHeading into the summer movie season, 2026 lagged behind 2019 by 24%, or about $830 million in sales, according to Rentrak.\nWhile this year's box office is making gains, the figures don't tell the full story.\nThe shifting movie landscape\nCinema operators, studios and analysts are celebrating the strong summer, citing a return to pre-pandemic normalcy, but industry dynamics have shifted.\nThe post-pandemic era in the theatrical space has been defined by fewer screens, fewer moviegoers and fewer movies.\nTheaters may still appear crowded, but there are fewer auditoriums, meaning attendance remains down from 2019 levels by almost a quarter of a billion admissions, according to data from S&P Global Market Intelligence.\nAnd, there are fewer films to see on the big screen. So far in 2026, only 68 films have garnered wide releases — meaning they opened in or eventually played in more than 2,000 theaters — according to data from Rentrak. That's a 14% drop from the same period in 2019, when 79 films had wide releases.\nThese declines have been masked by higher movie ticket prices, particularly from premium large-format, or PLF, experiences, which are particularly popular with Gen Z and millennials.\nIn 2019, the average movie ticket cost $9.16, according to exhibition trade organization Cinema United. In 2026, a ticket costs an average of $12.75, according to market research from EntTelligence. And that's just for a standard screening.\nPLF tickets average around $18.26, according to data from EntTelligence, with Imax skewing that figure with its $20.57 average ticket price.\nAudiences are increasingly opting for these more expensive PLF screenings and have yet to be deterred by the price tag. Tickets are consistently selling out for specialty screenings like Imax's 70 mm showings of \"The Odyssey\" and the upcoming \"Dune: Part Three.\"\nThere's such demand for premium screenings that studios are getting creative when marketing their films.\nDisney, for example, will be shut out of Imax screens when \"Avengers: Doomsday\" is released on the same day as the third \"Dune\" in December. In response, the company has created a certification for PLF theaters that it's calling \"Infinity Vision.\" Essentially, Disney is promoting cinemas that have big screens, \"bright images and outstanding sound.\"\n\"When you see the Infinity Vision badge, you know you are in for an incredible theatrical experience,\" the company touts on a dedicated website for the certification.\nAlready the film has snared more than $50 million in presales, Disney said Wednesday during the Goldman Sachs' Communcacopia + Technology conference. The company noted that more than 70% of sales are for Infinity Vision tickets.\nWhat are moviegoers watching?\nAt the same time that audiences are embracing big blockbusters on the biggest screens, the theatrical industry has also seen a return of moviegoers for smaller-budget and genre films.\nNotably, this summer movie season didn't kick off with a big-budget action film or superhero team-up. Instead, the first major hit of the season came with the release of Disney's \"The Devil Wears Prada 2.\" That was followed by Universal's \"Obsession\" and A24's \"Backrooms,\" two low-budget horror films from YouTube creators-turned-filmmakers.\nIt was further fueled by residual ticket sales of Lionsgate's \"Michael,\" the Michael Jackson biopic, which debuted in April. Then \"Toy Story 5\" arrived in mid-June. Those five films combined generated more than $1.4 billion toward the summer haul.\n\"This summer demonstrated the importance of a consistent flow of compelling content that appeals to a wide variety of moviegoers, coupled with the unique draw of the larger-than-life, immersive environment our movie theaters provide,\" Justin McDaniel, senior vice president of global content at Cinemark, wrote in a statement last week after the cinema chain surpassed its previous summer box office record ahead of Labor Day weekend.\nMarcus Theatres, the fourth-largest theater circuit in North America, also posted a record summer period. The company noted that not only did summer revenue hit an all-time high, but so did its concession, merchandise and food and beverage sales. It also marked the highest summer attendance since 2019 and the highest premium large-format screen attendance for any summer, Marcus said.\n\"The tremendous turnouts for a wide range of diverse films created unique memory-making moments for all audiences — from the tears to the laughter to the thrills and chills — that cannot be replicated at home,\" Jeff Tomachek, president of Marcus Theatres, wrote in a statement Tuesday. \"As we look ahead to the rest of the year, several new and highly anticipated films await, giving moviegoers even more reason to enjoy a great time at the movies with friends and family.\"\nIn addition to the dual release of \"Dune: Part Three\" and \"Avengers: Doomsday,\" dubbed \"Dunesday,\" the final four months of the 2026 slate include a slew of horror films — \"Resident Evil,\" \"Clayface\" and \"Other Mommy\" — as well as smaller-budget genre films like \"Practical Magic 2,\" \"Digger,\" \"Wicker\" and \"Verity\" alongside bigger-budget movies like \"The Hunger Games: Sunrise on the Reaping,\" \"Hexed\" and \"Jumanji: Open World.\"",
    "bodyJa": "ハリウッドが夏の新記録を樹立した。\n5月1日から9月7日までの国内興行収入は47億6000万ドルで、映画史上最高額となった。\n5 月の最初の週末に始まり、レイバーデーの週末まで続く重要な映画シーズンは、劇場カレンダーの極めて重要な部分であり、通常、国内の年間興行収入総額の 40% を占めます。\n前回の夏の記録は、ディズニーとマーベルの『アイアンマン3』、イルミネーションの『怪盗グルーの月泥棒2』、ワーナー・ブラザースの映画などが公開された2013年に確立された。 「マン・オブ・スティール」、ピクサーの「モンスターズ・ユニバーシティ」、ユニバーサルの「ワイルド・スピード 6」がこの期間を47億5000万ドルに導いた。\n2026年シーズンはソニーの『スパイダーマン：ブランニュー・デイ』とユニバーサルの『オデッセイ』が後押しし、合わせて夏の累計に15億ドル以上、つまり30％以上を貢献した。\nチケット販売が1週間延長されたことも助けとなった。 2013 年の夏は 5 月 3 日に始まり、9 月 2 日に終わりましたが、その期間は 7 日短かったです。\nレントラックのマーケットプレイストレンド責任者、ポール・ダーガラベディアン氏は「これは将来の夏に向けた青写真となるはずだ」と語った。 「1 つの映画がシーズン全体を担当する必要はありません。イベントの写真、家族向けの映画、ブレイクアウトのサプライズ、そして人々を再び呼び戻すために連携する独立した映画が必要です。この夏は、その組み合わせが何をもたらすことができるかを示しました。」\nRentrakのデータによると、2026年夏の興行収入は2019年よりも10％近く早く終了した。この前年は、新型コロナウイルスの影響でチケット販売が停止され、ストリーミングが映画鑑賞に本格的に影響を与える前の年だった。\nこの好調な成績により、2026年の年初来の興行収入はパンデミック前の指標をわずか7.5％、つまり5億9,500万ドル下回る水準となり、通年の興行収入が7年ぶりに100億ドルを超える可能性があるという興行アナリストの予測が再確認された。\nレントラックによると、夏の映画シーズンに向けて、2026年の売上高は2019年に比べ24％、約8億3000万ドル遅れた。\n今年の興行収入は増加しているが、数字がすべてを物語っているわけではない。\n移り変わる映画の風景\n映画館経営者、スタジオ、アナリストらはパンデミック前の正常な状態に戻ったと言って好調な夏を祝っているが、業界の力関係は変化している。\n劇場業界におけるパンデミック後の時代は、スクリーンの減少、映画観客の減少、映画の減少によって定義されています。\nS&P グローバル マーケット インテリジェンスのデータによると、劇場は依然として混雑しているように見えますが、講堂の数は減り、入場者数は 2019 年の水準から 2 億 5 億人近く減少したままです。\nそして、大スクリーンで観られる映画も少なくなっている。レントラックのデータによると、2026年のこれまでに大々的に公開された映画はわずか68本、つまり2,000以上の劇場で公開されたか、最終的には上映されたということだ。これは、79本の映画が広範囲に公開された2019年の同時期と比べて14％減少した。\nこうした下落は、特にZ世代やミレニアル世代に人気の高いプレミアム・ラージフォーマット（PLF）体験による映画チケット価格の高騰によって隠蔽されてきた。\n展示業界団体シネマ・ユナイテッドによると、2019年の映画チケットの平均価格は9.16ドルだった。 EntTelligence の市場調査によると、2026 年の航空券の平均価格は 12.75 ドルです。そしてそれはあくまで標準的な審査の場合です。\nEntTelligenceのデータによると、PLFのチケットは平均約18.26ドルだが、Imaxの平均チケット価格は20.57ドルでこの数字を歪めている。\n視聴者はこうしたより高価な PLF 上映を選択する傾向にありますが、まだその価格に躊躇することはありません。 Imax の 70 mm 上映『オデッセイ』や今後公開予定の『デューン: パート 3』などの専門上映のチケットは常に売り切れています。\nプレミアム上映に対する需要が非常に高いため、スタジオは映画をマーケティングする際に工夫を凝らしています。\n例えばディズニーは、12月に第3弾『デューン』と同じ日に『アベンジャーズ／ドゥームズデイ』が公開されると、Imaxスクリーンから締め出される。これに応えて、同社は「Infinity Vision」と呼ぶPLF劇場向けの認証を作成した。基本的に、ディズニーは大スクリーン、「明るい映像と優れた音響」を備えた映画館を推進しています。\n同社は認定専用ウェブサイトで「Infinity Visionバッジを見れば、素晴らしい劇場体験が待っていることが分かる」と宣伝している。\nディズニーは水曜日、ゴールドマン・サックスのコミューンカピア＋テクノロジー・カンファレンスで、この映画はすでに5,000万ドル以上の前売り金を集めていると述べた。同社は、売上の70％以上がInfinity Visionのチケットによるものだと指摘した。\n映画ファンは何を観ているのでしょうか？\n観客が最大のスクリーンで大ヒット作を鑑賞するのと同時に、演劇業界でも低予算のジャンル映画を求める映画ファンが戻ってきています。\n注目すべきは、この夏の映画シーズンは、巨額の予算をかけてアクション映画やスーパーヒーローのチームアップで始まったわけではないことだ。その代わりに、今シーズン最初の大ヒットはディズニーの「プラダを着た悪魔 2」の公開でした。続いて、ユニバーサルの『Obsession』と A24 の『Backrooms』という、YouTube クリエイターから映画製作者に転身した 2 本の低予算ホラー映画が公開されました。\n4月に公開されたライオンズゲートのマイケル・ジャクソン伝記映画「マイケル」の残りのチケット販売がさらに勢いを増した。そして6月中旬に『トイ・ストーリー5』が登場しました。これら 5 本の映画は、夏の興行収入に合わせて 14 億ドル以上を生み出しました。\nシネマークのグローバルコンテンツ担当シニアバイスプレジデント、ジャスティン・マクダニエル氏は、レイバーデーの週末を前にシネマークが過去の夏の興行収入記録を上回ったことを受け、先週の声明で「この夏は、映画館が提供する実物よりも広大で没入型の環境という独特の魅力と相まって、幅広い映画ファンにアピールする魅力的なコンテンツの一貫した流れの重要性を証明した」と述べた。\n北米で 4 番目に大きい劇場であるマーカス シアターも、記録的な夏の期間を記録しました。同社は、夏の収益が過去最高を記録しただけでなく、売店、商品、食品および飲料の売上も過去最高を記録したと指摘した。また、2019年以来最高の夏の観客動員数を記録し、プレミアム大判スクリーンへの観客動員数も夏としては最高を記録したとマーカス氏は述べた。\nマーカス・シアターズの社長ジェフ・トマチェック氏は火曜日の声明で、「多種多様な映画に対する驚異的な観客動員数は、涙から笑い、スリルやゾクゾクに至るまで、すべての観客にユニークな思い出作りの瞬間を生み出した。それは家庭では再現できないものだ」と述べた。 「今年の残りの期間に目を向けると、いくつかの新作の非常に期待されている映画が待っており、映画ファンには友人や家族と映画で素晴らしい時間を楽しむさらなる理由が与えられます。」\n「デューン：パート 3」と「アベンジャーズ：ドゥームズデイ」（「デューンズデイ」と呼ばれる）の 2 本の公開に加え、2026 年の最後の 4 か月には、「バイオハザード」、「クレイフェイス」、「アザー マミー」など多数のホラー映画が含まれるほか、「プラクティカル マジック 2」、「ディガー」、「ウィッカー」、「ヴェリティ」などの低予算ジャンルの映画も上映されます。 「ハンガー・ゲーム：サンライズ・オン・ザ・リーピング」、「ヘキシード」、「ジュマンジ：オープンワールド」などのより大きな予算の映画。",

    "summaryJa": "ファイナンシャル・アドバイザーらによると、世界的に債券が売られ、株価が過去最高値付近で推移し、投資家が地政学的な不確実性と格闘している中、今は投資家にとってポートフォリオのリバランスを検討する特に良い時期かもしれないという。ニューオーリンズを拠点とする認定ファイナンシャル・プランナーであり、CNBCのファイナンシャル・アドバイザー・カウンシルのメンバーでもあるジュード・ブードロー氏は、「これは世の中で最もセクシーではないが、おそらく最も有益な投資アイデアの1つだと思う」と語った。",
    "bodyOriginal": "As global bonds sell off, stocks hover near all-time highs and investors grapple with geopolitical uncertainty, it may be a particularly good time for investors to consider rebalancing their portfolios, according to financial advisors.\n\"I feel like it's one of the least sexy — but probably most useful — investment ideas around,\" said Jude Boudreaux, a certified financial planner based in New Orleans and member of CNBC's Financial Advisor Council.\nWhat is rebalancing?\nWhen investors rebalance, they bring their asset allocation back to a target level.\nFor example, investors may have determined that a mix of 60% stocks and 40% bonds — the classic 60/40 portfolio — is appropriate given their tolerance for market risk and the number of years until they retire.\nBut the market naturally throws those allocations out of whack over time.\nStocks, which are the traditional growth engine of a portfolio, have boomed in recent years.\nThe S&P 500 stock index saw returns of 24% in 2023, 23% in 2024 and 16% in 2025 — well above the long-term average of around 10% — due to factors like euphoria over technology companies and artificial intelligence.\nThough the S&P 500 has dipped slightly from an all-time high in August, stocks are still up more than 11% so far in 2026.\nMeanwhile, bonds have swooned since the start of the Iran war at the end of February, amid a broad sell-off.\nAs a rule, bond prices move opposite to their yield — and yields on government bonds around the world have climbed to multiyear highs. Investor concerns about inflation and debt have pressured global government borrowing costs.\nThe yield on 10-year U.S. Treasury bonds on Wednesday hit its highest level since 2023.\nAs a result, investment funds that track the prices of long-term bonds have fallen in value. For example, as of Wednesday afternoon, the iShares 7-10 Year Treasury Bond ETF (IEF) is down more than 4% so far this year, excluding dividends. The Fidelity Long-Term Treasury Bond Index Fund (FNBGX) has fallen more than 5%.\nTake this all together, and it's likely investors' asset allocations have gotten stock-heavy — and their portfolios perhaps riskier than intended.\n\"No doubt, equities have become a larger part of most portfolios and not just those that are technology-heavy,\" said Cathy Curtis, a certified financial planner based in Oakland, California, and a member of CNBC's Financial Advisor Council. \"Gains have been fairly broad across the market.\"\nThe benefits of rebalancing\nAside from toggling back to a targeted portfolio risk, rebalancing carries many additional benefits, advisors said.\nFor example, it helps investors lock in profits from their winning investments by shifting gains to another part of their portfolio.\n\"It's a disciplined way to buy low and sell high, which historically is the fundamental idea of what to do in [financial] markets,\" Boudreaux said.\nIn today's market, investors would most likely be shifting profits from stocks to the bond side of their portfolio — simultaneously reducing their stock allocation and raising their bond allocation.\nWhile investors may be wary of buying bond funds right now given their depressed value, it's an opportunity to buy them at a slight discount, advisors said. It's a common recommendation when stocks fall, too, known as \"buying the dip.\"\nRebalancing also helps take emotion out of investing and the temptation to time the market — a behavior that often carries bad outcomes — by providing a framework for trading.\nThis is important in today's environment for investors who may be tempted to ditch stocks amid uncertainties like the Iran war. Stocks slid Wednesday as oil prices topped $100 a barrel, fueling inflation concerns.\n\"Right now, investors have plenty to worry about: multiple geopolitical conflicts, a new [Federal Reserve] chair, the election cycle, rising deficits, and AI disruption,\" Curtis said. \"Rather than trying to figure out which of those issues will ultimately matter to the markets, investors can use rebalancing to reduce risk to a more reasonable level.\"\nThe same is true for those who are tempted to ride a stock-heavy portfolio, lured by a false sense of security after years of booming returns, advisors said.\n\"When the market is up, people forget it can go down,\" said CFP Kamila Elliott, co-founder of Collective Wealth Partners based in Atlanta and a member of CNBC's Financial Advisor Council.\n'This isn't a fire sale'\nInvestors shouldn't confuse this rebalancing for selling all their stocks and moving entirely to cash, she said.\n\"We're not telling people to sell out of all your equity — this isn't a fire sale,\" Elliott said.\nInstead, it's time to make sure investors are realigned to their risk tolerance, a measure of how much comfort they have with potential loss in their investment portfolio, she said.\nInvestors approaching retirement may use the current environment as an opportunity to rebalance profits from their stock portfolio and add to a cash account, which they can use in the early years of retirement for income if their stock holdings have fallen in value, Elliott said.\nInvestors can determine their stomach for and ability to handle losses by filling out a risk tolerance questionnaire, which is available on the websites of most major asset managers like Vanguard Group, Fidelity Investments and T. Rowe Price, Elliott said.\nThose enrolled in a 401(k) plan can also likely log into their account and fill out a questionnaire on their administrator's website, she said.\nOf course, it's important to remember that rebalancing can have tax implications for certain investors, particularly those with taxable brokerage accounts, advisors said.\nUnlike with tax-advantaged retirement accounts like 401(k)s and IRAs, buying and selling within taxable accounts can generate a tax bill.\nInvestors may be able to shift allocations gradually over time, or beef up an allocation on one side of their portfolio without selling elsewhere.\n\"Rebalancing doesn't necessarily mean getting to a target allocation all at once,\" Curtis said. \"New cash flows, withdrawals and tax-aware trades can also be used to move a portfolio back towards a desired allocation.\"",
    "bodyJa": "ファイナンシャル・アドバイザーらによると、世界的に債券が売られ、株価が過去最高値付近で推移し、投資家が地政学的な不確実性と格闘している中、今は投資家にとってポートフォリオのリバランスを検討する特に良い時期かもしれないという。\nニューオーリンズを拠点とする認定ファイナンシャル・プランナーであり、CNBCのファイナンシャル・アドバイザー・カウンシルのメンバーでもあるジュード・ブードロー氏は、「これは世の中で最もセクシーではないが、おそらく最も有益な投資アイデアの1つだと思う」と語った。\nリバランスとは何ですか?\n投資家がリバランスを行うと、資産配分が目標レベルに戻ります。\nたとえば、投資家は、市場リスクに対する許容度と引退までの年数を考慮すると、株式 60%、債券 40% の組み合わせ (古典的な 60/40 ポートフォリオ) が適切であると判断している可能性があります。\nしかし、市場は時間の経過とともにこれらの配分が自然に狂ってしまいます。\nポートフォリオの伝統的な成長エンジンである株式は、近年急成長しています。\nS&P 500 株価指数のリターンは、テクノロジー企業や人工知能に対する高揚感などの要因により、2023 年に 24%、2024 年に 23%、2025 年に 16% となり、長期平均の約 10% を大きく上回りました。\nS&P500種株価指数は8月の過去最高値からは若干下落したが、株価は2026年現在までに11％以上上昇している。\n一方、２月末のイラン戦争開始以来、債券は広範囲に売られる中、急落している。\n一般に、債券価格は利回りと逆の動きをしており、世界中の国債利回りは数年ぶりの高水準にまで上昇している。インフレと債務に対する投資家の懸念により、世界の政府の借入コストが圧迫されている。\n水曜日の10年米国債利回りは2023年以来の高水準を記録した。\nその結果、長期債の価格に連動する投資ファンドの価値が下落した。例えば、水曜日午後の時点で、iシェアーズ7-10年国債ETF（IEF）は、配当を除くと年初から4％以上下落している。フィデリティ長期国債インデックスファンド（FNBGX）は５％以上下落した。\nこれらを総合すると、投資家の資産配分が株式偏重になり、ポートフォリオが意図したよりもリスクが高くなっている可能性が高い。\nカリフォルニア州オークランドに拠点を置く認定ファイナンシャル・プランナーであり、CNBCのファイナンシャル・アドバイザー評議会のメンバーでもあるキャシー・カーティス氏は、「テクノロジー中心のポートフォリオだけでなく、ほとんどのポートフォリオにおいて株式が大きな部分を占めているのは間違いない」と語る。 「市場全体でかなり幅広い利益が得られました。」\nリバランスのメリット\nアドバイザーらによると、リバランスには、目標とするポートフォリオのリスクに戻すだけでなく、さらに多くのメリットがあるという。\nたとえば、投資家が利益をポートフォリオの別の部分に移すことで、成功した投資からの利益を確定するのに役立ちます。\n「安く買って高く売るという規律ある方法であり、歴史的には（金融）市場で何をすべきかについての基本的な考え方だ」とブードロー氏は語った。\n今日の市場では、投資家は株式からの利益をポートフォリオの債券側に移す可能性が高く、同時に株式の配分を減らし、債券の配分を増やすことになるでしょう。\nアドバイザーらによると、価格が低迷している現在、投資家は債券ファンドの購入に慎重かもしれないが、わずかな割引価格で債券ファンドを購入できるチャンスだという。これは、株価が下落したときによく推奨される「押し目買い」としても知られています。\nリバランスはまた、取引のフレームワークを提供することで、投資から感情を取り除き、市場のタイミングを計りたいという誘惑（しばしば悪い結果をもたらす行動）を取り除くのにも役立ちます。\nこれは、イラン戦争のような不確実性の中で株を手放したくなるかもしれない投資家にとって、今日の環境では重要だ。水曜日、原油価格が1バレル＝100ドルを突破し、インフレ懸念が高まる中、株価は下落した。\nカーティス氏は「現在、投資家は懸念すべきことがたくさんある。複数の地政学的な紛争、（連邦準備制度の）新議長、選挙サイクル、財政赤字の増大、AIの混乱などだ」と述べた。 「投資家は、これらの問題のどれが最終的に市場にとって重要になるかを見極めようとするのではなく、リバランスを利用してリスクをより合理的なレベルまで減らすことができる。」\nアドバイザーらによると、何年にもわたる急成長を遂げた後の誤った安心感に誘われて、株式中心のポートフォリオに乗りたがる人々にも同様のことが当てはまるという。\nアトランタに本拠を置くコレクティブ・ウェルス・パートナーズの共同創設者であり、CNBCのファイナンシャル・アドバイザー評議会のメンバーであるCFPカミラ・エリオット氏は、「市場が上昇しているとき、人々は市場が下落する可能性があることを忘れている」と語った。\n「これは投げ売りではありません」\n投資家はこのリバランスを、保有株をすべて売却して完全に現金に移行することと混同すべきではないと同氏は述べた。\n「私たちは人々に株式をすべて売り飛ばすように言っているわけではありません。これは投げ売りではありません」とエリオット氏は語った。\nむしろ、投資家がリスク許容度（投資ポートフォリオの潜在的な損失に対してどの程度安心しているかを示す尺度）に再調整する時期が来ていると同氏は述べた。\nエリオット氏によると、退職を間近に控えた投資家は、現在の環境を株式ポートフォリオからの利益をリバランスし、現金口座に追加する機会として利用する可能性があり、保有株の価値が下がった場合、退職後の初期の収入源として利用できるという。\nエリオット氏によると、投資家は、バンガード・グループ、フィデリティ・インベストメンツ、T・ロウ・プライスなど、ほとんどの大手資産運用会社のウェブサイトで入手できるリスク許容度アンケートに記入することで、損失に対する許容度や損失に対処する能力を判断できるという。\n401(k) プランに登録している人も、自分のアカウントにログインして、管理者の Web サイトでアンケートに回答できる可能性が高いと彼女は言いました。\nもちろん、リバランスは特定の投資家、特に課税対象の証券口座を持つ投資家にとって税務上の影響を与える可能性があることを覚えておくことが重要だとアドバイザーらは述べた。\n401(k) や IRA などの税制上の有利な退職金口座とは異なり、課税口座内で売買すると税金が発生する可能性があります。\n投資家は、時間の経過とともに徐々に配分を変更したり、他の部分を売らずにポートフォリオの一方の配分を強化したりできる可能性があります。\nカーティス氏は「リバランスは必ずしも一度に目標配分に達することを意味するわけではない」と述べた。 「新たなキャッシュフロー、引き出し、税金を意識した取引を利用して、ポートフォリオを望ましい配分に戻すこともできます。」",

    "id": "coreweave-ceo-chalks-up-public-ai-pushba-65ee9be3",
    "title": "CoreWeave CEO chalks up public AI pushback to the speed of change: 'And that is frightening'",
    "titleJa": "CoreWeave CEO、AIによる公共の反発を変化のスピードに言及：「それは恐ろしいことだ」",
    "summaryJa": "CoreWeave CEOのMike Intrator氏は今週、ゴールドマン・サックスのCommunacopia + Technology ConferenceでCNBCに語った。",
    "bodyOriginal": "The public opposition to artificial intelligence and data centers is front and center at the Goldman Sachs Communcacopia + Technology Conference.\nCoreWeave CEO Mike Intrator told CNBC's David Faber that companies haven't explained the technology's benefits well enough to the public.\n\"I don't think we have done a particularly good job of talking about the benefits of what the data centers allow the AI companies to be able to deliver to people, to governments, to decision making,\" Intrator said in comments that aired Wednesday.\nThe annual conference brings together leaders across the biggest tech and media companies, and AI adoption — along with the pushback many local communities are showing towards its buildout — is perhaps one of the biggest opportunities, and risks, facing businesses of every kind.\nIntrator insisted that the fear around the transformation isn't about data centers, specifically, but is about how fast things are changing.\n\"It is really about: Hey, you know the world is changing, and it's changing very quickly, and that's going to have impacts on myself. It's going to have impacts on my children, and what is that going to look like? And that is frightening,\" he added.\nAs Goldman's conference got underway, another set of comments in the tech world caught attention as an AI researcher quit his job at Anthropic Tuesday, warning the rapidly-evolving technology \"could kill us all by the end of the decade.\"\nJacob Coxon, who worked at both Anthropic and its chief competitor OpenAI, accused the companies of \"gambling with our lives\" in the race towards AI superintelligence.\n\"Do not underestimate the power of this technology. These will soon be superhuman systems that can hack anything, revolutionize any field overnight, and acquire real power and resources. We have all witnessed the progress in each of these domains, and progress is not slowing,\" Coxon wrote in a post on X announcing his resignation.",
    "bodyJa": "人工知能とデータセンターに対する国民の反対は、ゴールドマン・サックス・コミューンカコピア + テクノロジー・カンファレンスの中心にあります。\nCoreWeaveの最高経営責任者（CEO）Mike Intrator氏はCNBCのDavid Faberに対し、企業はこのテクノロジーの利点を国民に十分に説明していないと語った。\nイントレーター氏は水曜日に放映されたコメントの中で、「AI企業がデータセンターによって人々や政府、意思決定に提供できることの利点について、私たちが特にうまく話してきたとは思えない」と述べた。\nこの年次カンファレンスには最大手のテクノロジー企業やメディア企業のリーダーが一堂に会し、AIの導入は、その構築に対して多くの地域社会が示している反発と同様に、おそらくあらゆる種類の企業が直面する最大のチャンスであり、リスクの1つである。\nイントレーター氏は、変革を巡る不安は特にデータセンターに関するものではなく、物事の変化の速さに関するものだと主張した。\n「それはまさに、『ねえ、世界は変化していることを知っているだろう、そしてそれは非常に急速に変化している、そしてそれは私にも影響を与えるだろう。それは私の子供たちにも影響を与えるだろう、そしてそれはどのようなものになるだろうか？そしてそれは恐ろしいことだ』と彼は付け加えた。\nゴールドマンのカンファレンスが始まると、AI研究者がアンスロピック・チューズデイでの仕事を辞め、急速に進化するテクノロジーが「10年代の終わりまでに我々全員を滅ぼす可能性がある」と警告したことで、テクノロジー業界の別のコメントが注目を集めた。\nAnthropic とその最大の競合企業である OpenAI の両方で働いていたジェイコブ・コクソン氏は、両社が AI の超知能化を目指す競争で「命を賭けている」と非難した。\n「このテクノロジーの力を過小評価しないでください。これらは間もなく、あらゆるものをハッキングし、あらゆる分野を一夜にして革命を起こし、真の力とリソースを獲得できる超人的なシステムになるでしょう。私たちは皆、これらの各領域の進歩を目撃しており、進歩は減速していません」とコクソン氏は辞任を発表するXへの投稿で書いた。",

    "bodyOriginal": "Air traffic failure was avoidable, says Transport Secretary\n- Published\nA technical failure of the UK's air traffic control system that has caused widespread flight chaos was avoidable, according to the Transport Secretary.\nHeidi Alexander told the Commons she had ordered an independent investigation by the aviation watchdog into the system operated by Nats, which went down for four hours on Tuesday.\nMore than 2,000 flights have been cancelled as disruption continued for a second day with passengers stuggling to fly out of and into the UK.\nAfter meeting with the boss of Nats, Martin Rolfe, Alexander said a cyberattack could be ruled out, but she added: \"I do not believe this issue was unavoidable.\"\nNats has apologised for its third major technical fault in three years.\nAlexander said she discussed with Rolfe how Nats, which is 49% owned by the government, \"responded to resolve and minimise the disruption as quickly as possible\".\nShe said there had to be \"tough questions about resilience of Nats systems\", adding: \"We also need to think about consumer redress issues.\"\nEarlier on Wednesday the government said it had confidence in Rolfe, who has led Nats for 11 years as airlines such as Wizz Air and Ryanair called for him to step down.\nNats has been asked to investigate the incident and report back in one week. But Alexander said she has also asked the Civil Aviation Authority to conduct an independent review and present an update in six months' time.\nAirlines UK, which represents the country's carriers, said it had written to Alexander to \"register serious concerns over yesterday's technical failure at Nats - the third major system failure in three years - which has caused major disruption across the UK's aviation network\".\nAirlines UK's chief executive Tim Alderslade, said: \"The result is a system where airlines pick up the bill for the mistakes of others, while the organisations responsible face little or no financial consequence.\n\"Accountability should sit where responsibility lies and the Civil Aviation Bill offers the opportunity to address this.\"\nIt is not the first time disruption has blighted Nats' control system. In 2023, a computer shutdown over the August bank holiday weekend caused chaos for 700,000 passengers.\nIt took an engineer, who had been unable to correct the fault from home, three hours to get to work.\nThere was another, smaller Nats outage in 2025, which caused 150 cancellations.\nNats is a public-private partnership, with the government holding the majority stake. The rest is split between a group of UK airlines including BA, easyJet and Virgin Atlantic as well as Heathrow and Nats staff.\nWhat do we know so far about the glitch?\nNats first confirmed it was investigating a \"technical issue\" at 13:46 BST on Tuesday, \"which is causing some disruption to flight departures\".\nThe glitch occurred at Nats' Swanwick Centre in Hampshire, where one of its two air traffic control centres are. The other is in Prestwick, Ayrshire.\nAround 90 minutes later, it said it had identified that the issue was with its flight processing system.\nThis processes flight plans and other operational information used by controllers to manage air traffic.\nIt continually updates flight information as aircraft progress through UK airspace, helping controllers maintain a safe and orderly flow of traffic.\nBy 19:30, Nats said the system issue had been resolved and it was working to clear the backlog of flights.\nHowever, by Wednesday evening, the number of flights that had been cancelled or failed to take off since the fault first emerged had grown to more than 2,000, according to flight analytics firm Cirium.\nRelated topics\n- Published8 hours ago",
    "bodyJa": "航空交通の失敗は避けられたと運輸長官が語る\n- 公開されました\n運輸長官によると、広範な飛行混乱を引き起こした英国の航空交通管制システムの技術的障害は回避可能だった。\nハイジ・アレクサンダーさんは下院に対し、火曜日に4時間にわたってダウンしたナッツ社が運営するシステムについて、航空監視機関に独立した調査を指示したと語った。\n英国への出入国に乗客が苦労し、混乱が２日も続き、２０００便以上が欠航となった。\nアレクサンダー氏は、ナショナルズの監督マーティン・ロルフ氏と面会した後、サイバー攻撃の可能性は否定できないが、「この問題が避けられなかったとは思わない」とも付け加えた。\nナッツは、この3年間で3度目となる重大な技術的欠陥について謝罪した。\nアレクサンダー氏は、政府が49％出資するナッツが「混乱をできるだけ早く解決し、最小限に抑えるためにどのように対応するか」についてロルフ氏と話し合ったと述べた。\n同氏は「Natsシステムの回復力について厳しい質問」が必要だと述べ、「消費者救済の問題についても考える必要がある」と付け加えた。\nウィズエアやライアンエアなどの航空会社がロルフ氏の辞任を要求する中、政府は水曜日初め、11年間ナショナルズを率いてきたロルフ氏に信頼を置いていると述べた。\nナッツは事件を調査し、1週間以内に報告するよう求められている。しかし、アレクサンダー氏は民間航空局に対し、独立した調査を実施し、6か月以内に最新情報を提示するよう要請したとも述べた。\n同国の航空会社を代表する英国航空は、「英国の航空ネットワーク全体に大きな混乱を引き起こした、昨日のナッツの技術的障害（ここ3年間で3度目となる大規模なシステム障害）について深刻な懸念を表明する」ようアレクサンダーに書簡を送ったと発表した。\n英国航空のティム・アルダースレイド最高経営責任者（CEO）は、「その結果、航空会社が他人のミスのツケを受け取る一方、責任を負う組織は財務上の影響をほとんど、またはまったく受けないというシステムができ上がった」と述べた。\n「責任の所在には説明責任が求められるべきであり、民間航空法案はこれに対処する機会を提供するものである。」\n混乱によってナッツの管理システムが破壊されたのはこれが初めてではない。 2023 年、8 月の銀行休業日の週末にコンピューターがシャットダウンし、70 万人の乗客に混乱が生じました。\n自宅から障害を修正できなかったエンジニアは、職場に行くまでに 3 時間かかりました。\n2025 年にも小規模な Nats 障害が発生し、150 件のキャンセルが発生しました。\nNats は官民パートナーシップであり、政府が過半数の株式を保有しています。残りは、BA、イージージェット、ヴァージン・アトランティック航空を含む英国の航空会社グループと、ヒースロー空港とナッツのスタッフの間で分割される。\nこの不具合について今のところわかっていることは何でしょうか?\nナッツは火曜日の英国標準時13時46分に「飛行機の出発に多少の混乱を引き起こしている」「技術的問題」を調査していることを初めて認めた。\nこの不具合は、2か所ある航空交通管制センターのうちの1つが置かれているハンプシャー州のナッツのスワンウィック・センターで発生した。もう 1 つはエアシャー州プレストウィックにあります。\n約90分後、同社は問題が自社の飛行処理システムにあることを特定したと発表した。\nこれは、管制官が航空交通を管理するために使用する飛行計画やその他の運航情報を処理します。\n航空機が英国の空域を通過するたびに飛行情報を継続的に更新し、管制官が安全で秩序ある交通の流れを維持できるように支援します。\nナット氏は、システムの問題は19時30分までに解決され、滞空便の解消に取り組んでいると述べた。\nしかし、航空分析会社シリウムによると、水曜夕方までに、最初に障害が発生して以来欠航または離陸できなかった航空機の数は2,000便以上に増加した。\n関連トピック\n- 8 時間前に公開",

    "id": "investors-worried-about-rising-bond-yiel-e7220124",

  {
    "id": "treasury-department-to-buy-back-up-to-6-4beb8838",
    "title": "Treasury Department to buy back up to $6 billion in longer-term debt, triple the normal level",
    "titleJa": "財務省、通常の3倍となる最大60億ドルの長期国債を買い戻す",
    "summaryJa": "財務省は水曜日、債券市場の機能維持を目的としたオペで最大60億ドルの国債を買い戻すと発表した。待望の発表は、通常の自社株買い業務の額を3倍に増やすもので、8月19日のスコット・ベッセント財務長官の、同省が発行済証券の通常額を少なくとも2倍にするという発表に続くものだ。",
    "bodyOriginal": "The Treasury Department on Wednesday said it will buy back up to $6 billion of government debt in an operation aimed at keeping bond markets functioning.\nThe much-anticipated announcement triples the normal buyback operation and follows an announcement Aug. 19 from Treasury Secretary Scott Bessent that the department would at least double the normal amount for already-issued securities.\nTreasury also said future operations will be at least $4 billion.\nThough the operation ostensibly is aimed at keeping government debt markets liquid — in this case for 10- and 20-year notes — the extraordinary measure also has been seen as an effort to put a lid on Treasury yields, which had hit highs not seen since prior to the global financial crisis in 2008.\nMarket reaction, however, was negative. Treasury yields rose further but were volatile with long-dated securities rising as much as 5 basis points each before easing.\nThe benchmark 10-year issue hit 4.841% around 11:30 a.m. ET. The 20-year climbed to 5.314% while the 30-year bond rose 5 basis points to also punch through what had been seen as the important 5.3% level, most recently yielding 5.307%. One basis point equals 0.01%.\n\"Hank Paulson's bazooka this is not,\" said bond fund manager Mark Spindel, chief investment officer at Potomac River Capital, referring to the former Treasury secretary's actions during the financial crisis. \"And it took an act of Congress in that crisis.\"\nThere had been speculation heading into Wednesday's announcement that the buyback level could be many times the initial release, in which Treasury said the amount will \"at least\" double the normal $2 billion operation.\n\"Moving the sizes up to $6 billion would amount to tripling the size of the buybacks, which would be a meaningful escalation but would not be wildly out of line with the spirit of the 'at least double' language.,\" Wrightson ICAP analysts wrote earlier this week.\n\"Quadrupling or even quintupling the size to the $8 billion to $10 billion range is not out of the question, but would represent a second major shift in the Treasury's debt strategy in just two weeks,\" they added. \"It would be an admission that the Treasury hadn't thought through its hasty August 19 announcement in the first place.\"\nThe actual buybacks will happen Thursday in a 20-minute operation that will conclude at 2 p.m. ET.\nHigher Treasury yields have come against a confluence of factors: Surging government debt that recently passed $40 trillion, elevated inflation fears from tariffs and the Iran war, and a corresponding resurgence in energy prices that saw crude oil top $100 a barrel Wednesday.\nAt the same time, the long end of the Treasury curve is the less active part of a market that is considered the deepest and most liquid in the world.\nTreasury issuance this year has jumped 11.8% from 2025, and the $31.8 trillion in publicly held debt is up 8.2%.\n\"Treasury announced buybacks less than hoped for (or feared depending on your point of view),\" Mizuho economist Alex Pelle wrote. \"The risk is that the Treasury ratchets this up in some manner given the market's reaction. However, I think the pressure to go against standard operating procedure will abate somewhat on the other side of the midterms.\"\nThe accelerated buybacks have faced critics, with some questioning what impact the amount would have on such a massive market, as well as the move being a break from Treasury moving in a predictable manner on the process.\nOne prominent critic was Stanley Druckenmiller, head of Duquesne Family Office and a former mentor to Bessent.\n\"Once markets believe Treasury is defending a price, every rise in yields becomes a test of official resolve, and the operations must grow to survive the tests,\" Druckenmiller wrote in a Wall Street Journal op-ed.\n\"Governments defending prices against fundamentals always lose. The only variable is how much they spend before conceding,\" he added.\nTreasury's maneuvering, which also has included a parallel move to support the Japanese yen, come as Federal Reserve Chairman Kevin Warsh has preached less involvement in financial markets. The Fed has a rate decision coming in a week, with traders pricing in a rate hike.\n\"Actions not words are what matter, and action in this case mean changes in the direction of fiscal policy or interest rates,\" said Anil Kashyarp, a University of Chicago economist.\n—CNBC's Steve Liesman contributed.",
    "bodyJa": "財務省は水曜日、債券市場の機能維持を目的としたオペで最大60億ドルの国債を買い戻すと発表した。\n待望の発表は、通常の自社株買い業務の額を3倍に増やすもので、8月19日のスコット・ベッセント財務長官の、同省が発行済証券の通常額を少なくとも2倍にするという発表に続くものだ。\n財務省はまた、今後の運用額は少なくとも４０億ドルになると述べた。\nこのオペは表面上、国債市場（今回の場合は10年債と20年債）の流動性を維持することを目的としているが、この異例の措置は、2008年の世界金融危機以前以来の高値を付けていた米国債利回りに歯止めをかけるための措置ともみられている。\nしかし、市場の反応は否定的でした。米国債利回りはさらに上昇したが、長期債は緩和前にそれぞれ最大５ベーシスポイント上昇するなど不安定だった。\n基準となる１０年債は東部時間午前１１時半ごろに４．８４１％に達した。 20年債は5.314％に上昇し、30年債も5ベーシスポイント上昇し、重要とみられていた5.3％水準を突破し、直近の利回りは5.307％となった。 1 ベーシス ポイントは 0.01% に相当します。\nポトマック・リバー・キャピタルの債券ファンドマネジャー、マーク・スピンデル最高投資責任者は、金融危機時の元財務長官の行動に言及し、「ハンク・ポールソンのバズーカではない」と述べた。 「そして、その危機において議会の行為が必要でした。」\n水曜日の発表には買い戻し水準が当初発表の何倍にもなる可能性があるとの憶測が流れており、財務省はその額が通常の20億ドルのオペの「少なくとも」2倍になると述べた。\nライトソンICAPのアナリストらは今週初め、「規模を60億ドルに引き上げることは自社株買いの規模が3倍になることになり、意味のある拡大にはなるが、『少なくとも2倍』という文言の精神から大きく外れるものではない」と書いている。\nさらに「規模を４倍、さらには５倍の８０億─１００億ドルの範囲に拡大することは不可能ではないが、わずか２週間で財務省の債務戦略における２度目の大きな転換となるだろう」と付け加えた。 「それは財務省が8月19日の性急な発表を最初から熟慮していなかったということを認めることになるだろう。」\n実際の買い戻しは木曜日の午後２時に終了する２０分間のオペレーションで行われる。 ET。\n米国債利回りの上昇には、最近40兆ドルを超えた政府債務の急増、関税やイラン戦争によるインフレ懸念の高まり、それに対応して水曜日に原油価格が1バレル＝100ドルを突破したエネルギー価格の復活といった要因が重なったことが背景にある。\n同時に、国債カーブの長い端は、世界で最も深く、最も流動性が高いと考えられている市場の中で、あまり活発ではない部分です。\n今年の国債発行額は２０２５年から１１．８％増加し、３１兆８０００億ドルの公的債務は８．２％増加した。\nみずほのエコノミスト、アレックス・ペレ氏は「財務省が発表した自社株買いは期待（見方によっては懸念）ほどではなかった」と書いた。 「リスクは、市場の反応を考慮して、財務省が何らかの形でこれを加速させることだ。しかし、標準的な業務手順に反する圧力は、中間選挙の反対側には多少弱まるだろう。」\n自社株買いの加速は批判者に直面しており、その額がこのような大規模な市場にどのような影響を与えるのかを疑問視する人もいるほか、この動きは財務省がプロセスを予測可能な形で進めていることからの中断であるとの見方もある。\n著名な批評家の一人は、デュケイン・ファミリー・オフィスの所長でベッセント氏の元指導者であるスタンリー・ドラッケンミラー氏だった。\nドラッケンミラー氏はウォール・ストリート・ジャーナルの論説で「財務省が価格を守っていると市場が信じると、利回りの上昇はすべて公式の決意を試すものとなり、試練に耐えるためにはオペを拡大する必要がある」と述べた。\n同氏は「ファンダメンタルズに反して物価を守る政府は常に負ける。唯一の変数は、譲歩するまでにどれだけの支出をするかだ」と付け加えた。\n米連邦準備制度理事会（FRB）のケビン・ウォーシュ議長が金融市場への関与を減らすと説いている中で、財務省のこの策略には日本円を支援するという並行した動きも含まれている。 FRBは1週間以内に金利決定を予定しており、トレーダーらは利上げを織り込んでいる。\nシカゴ大学の経済学者アニル・カシャープ氏は「重要なのは言葉ではなく行動であり、この場合の行動とは財政政策や金利の方向性の変更を意味する」と述べた。\n—CNBCのスティーブ・リースマン氏が寄稿しました。",

  {
    "id": "brent-crude-oil-tops-101-for-first-time-596865c2",
    "title": "Brent crude oil tops $101 for first time since July as fighting escalates in Persian Gulf",
    "titleJa": "ペルシャ湾での戦闘激化でブレント原油が7月以来初めて101ドルを突破",
    "summaryJa": "ペルシャ湾で米国とイランの戦闘が激化し、ホルムズ海峡を通じたエネルギー輸出が減少するのではないかとの投資家の懸念が高まるなか、水曜日、原油価格は３％以上上昇した。北海ブレント先物は東部時間午前１１時１２分までに３．４％上昇し１バレル＝１０１．２５ドルとなった。国際指標が１０１ドルを超えたのは７月以来初めて。米国ウェスト・テキサス・インターミディエート先物は３．６％高の９６．３８ドルで取引された。",
    "bodyOriginal": "Crude oil prices jumped more than 3% on Wednesday as fighting between the U.S. and Iran escalates in the Persian Gulf, raising investors' fears that energy exports through the Strait of Hormuz will fall.\nBrent futures were up 3.4% at $101.25 a barrel by 11:12 a.m. ET. It is the first time the international benchmark has crossed $101 since July. U.S. West Texas Intermediate futures traded 3.6% higher to $96.38.\nThe U.S. military destroyed five Iranian crude oil tankers Tuesday in retaliation for attempted attacks on an American warship. The U.S. warship successfully evaded Iranian attack and no American personnel were harmed, U.S. Central Command said.\nThe escalation in the U.S.-Iran conflict, now in its seventh month, is raising the risk of oil prices surging above $120 a barrel as attacks on shipping intensify, said Daan Struyven, co-head of global commodities research at Goldman Sachs, in an interview with CNBC's \"Squawk Box Asia.\"\nGoldman's base case remains for Persian Gulf exports to gradually recover as producers adapt to disruptions, including through alternative shipping routes and eventually additional pipeline capacity.\nBut the recent escalation has increased the chances of a more bullish scenario in which exports fail to recover in the coming months due to attacks on tankers, Struyven said.\nThe U.S. and Iran largely refrained from fighting for about a month after an outburst of violence in July. Washington has pivoted to applying economic pressure on Tehran. But fighting has erupted again as Iran continues to attack commercial traffic in anda round Hormuz.",
    "bodyJa": "ペルシャ湾で米国とイランの戦闘が激化し、ホルムズ海峡を通じたエネルギー輸出が減少するのではないかとの投資家の懸念が高まるなか、水曜日、原油価格は３％以上上昇した。\n北海ブレント先物は東部時間午前１１時１２分までに３．４％上昇し１バレル＝１０１．２５ドルとなった。国際指標が１０１ドルを超えたのは７月以来初めて。米国ウェスト・テキサス・インターミディエート先物は３．６％高の９６．３８ドルで取引された。\n米軍は火曜日、米軍艦への攻撃未遂への報復としてイランの原油タンカー５隻を破壊した。米中央軍によると、米軍艦はイランの攻撃を回避することに成功し、米軍関係者に被害はなかった。\nゴールドマン・サックスの世界商品調査共同責任者、ダーン・ストルイベン氏はCNBC「スコーク・ボックス・アジア」とのインタビューで、米国とイランの紛争激化は現在7カ月目に入り、海運業への攻撃が激化するにつれ、原油価格が1バレル＝120ドルを超えて急騰するリスクを高めていると述べた。\nゴールドマンの基本シナリオは、生産者が代替輸送ルートや最終的にはパイプライン能力の追加などを通じて混乱に適応するにつれて、ペルシャ湾の輸出が徐々に回復するとの見通しを維持している。\nしかし、最近の事態の激化により、タンカーへの攻撃により今後数カ月間輸出が回復しないという、より強気なシナリオの可能性が高まったとストルイベン氏は述べた。\n米国とイランは、7月に暴動が勃発してから約1か月間、戦闘をほぼ控えた。米国政府はテヘランに経済的圧力をかけることに方針を転換した。しかし、イランがホルムズ周辺の商業交通を攻撃し続けているため、戦闘が再び勃発している。",

    "id": "robinhood-ceo-says-companies-can-t-contr-fd0e560d",
    "title": "Robinhood CEO says companies can't control how their stock is tokenized as AMC clash escalates",
    "titleJa": "ロビンフッドCEO、AMC衝突激化で企業は自社株のトークン化方法を制御できないと発言",
    "summaryJa": "ロビンフッドのヴラド・テネフ氏は、トークン保有者が議決権を持たないことを認めながらも、上場企業は自社株を中心に構築された金融商品をコントロールすることはできないと述べた。",
    "bodyOriginal": "Robinhood CEO Vlad Tenev defended the company's push into tokenized stocks on Wednesday, saying public companies can't control the financial products built around their shares once they go public, after AMC recently slammed Robinhood's tokenization efforts.\nTokenization is the process of issuing digital representations of publicly traded securities, real world assets or any other form of value on a blockchain network. Holders of tokenized assets don't have outright ownership of the assets themselves.\nTenev spoke about Robinhood's tokenization effort as a technology-neutral financial wrapper around publicly traded stocks. Once a company's shares are publicly traded, he told CNBC's \"Squawk Box,\" the shareholder owns transferable property and other financial institutions should be able to create products that reference those shares – without asking the issuer for permission.\n\"Issuers should have control and do have control over the rights and obligations of the stock that they issue, but that doesn't mean they control everything about it,\" he said. \"In particular, they don't control other companies issuing their own securities that reference those shares.\"\n\"Issuer consent depends on what exactly you're doing,\" he added, \"and in the case of Robinhood stock tokens – which are tokenized securities that are issued by a separate entity that are backed by underlying shares – those should not automatically require issuer consent.\"\nThe comments come on the heels of AMC CEO Adam Aron's fiery criticism of Robinhood's tokenized stocks, which include tokenized AMC shares. Aron said that the increasingly popular practice of tokenization allows the brokerage to create exposure to AMC stock without the issuing company's involvement, undermining the traditional relationship between companies and their shareholders.\nTenev acknowledged that, unlike an ordinary shareholder, holders of stock tokens don't receive voting rights in the underlying company. The tokens are structured as debt securities backed by the underlying shares, although Tenev also declined to say how Robinhood plans to exercise the voting rights attached to those shares.\nWhen asked whether Robinhood would vote those underlying shares, he said the company \"hasn't really announced plans for the voting aspect of that.\"",
    "bodyJa": "最近AMCがロビンフッドのトークン化への取り組みを非難したことを受け、ロビンフッドの最高経営責任者（CEO）ヴラド・テネフ氏は水曜日、同社のトークン化株への取り組みを擁護し、上場企業は一度上場すると自社株を中心に構築された金融商品をコントロールすることはできないと述べた。\nトークン化とは、ブロックチェーン ネットワーク上で、上場証券、現実世界の資産、またはその他の形式の価値のデジタル表現を発行するプロセスです。トークン化された資産の所有者は、資産自体の完全な所有権を持ちません。\nテネフ氏は、上場株式のテクノロジー中立な金融ラッパーとしてのロビンフッドのトークン化の取り組みについて語った。同氏はCNBCの「スコーク・ボックス」に対し、企業の株式が公開されれば、株主は譲渡可能な資産を所有しており、他の金融機関は発行者の許可を求めずにそれらの株式を参照する商品を作成できるはずだと語った。\n同氏は「発行体は発行する株式の権利と義務を管理すべきであり、実際に管理しているが、それは発行体がすべてを管理するという意味ではない」と述べた。 「特に、それらの株式を参照する独自の証券を発行する他の企業を支配していません。」\n同氏はさらに、「発行者の同意は、まさに何をしようとしているかによって決まる。ロビンフッド株式トークンの場合、原株を裏付けとした別の事業体によって発行され、トークン化された証券であるが、自動的に発行者の同意を必要とするべきではない。」と付け加えた。\nこのコメントは、トークン化されたAMC株式を含むロビンフッドのトークン化株式に対するAMC CEOのアダム・アーロン氏の激しい批判に続いて出た。アーロン氏は、ますます一般的になっているトークン化の手法により、発行会社の関与なしに証券会社がAMC株へのエクスポージャーを生み出すことが可能となり、企業と株主との間の伝統的な関係が損なわれていると述べた。\nテネフ氏は、普通株主とは異なり、株式トークンの保有者は基礎となる企業の議決権を受け取らないことを認めた。トークンは原株を裏付けとする債券として構成されているが、テネフもロビンフッドがこれらの株に付随する議決権をどのように行使する予定であるかについては言及を避けた。\nロビンフッドがこれらの原株について議決権を行使するかとの質問に対し、同氏は同社が「議決権の面での計画は実際には発表していない」と述べた。",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/09/09/robinhood-ceo-says-companies-cant-control-how-their-stock-is-tokenized-as-amc-clash-escalates.html",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Mortgage rates moved up again last week, prompting more borrowers to search for savings. They found that in riskier, adjustable-rate mortgages (ARMs).\nDemand for those loans made up 8.5% of all mortgage applications last week, up from 8% the previous week, according to the Mortgage Bankers Association, and the highest level since June. In the first years of the pandemic, when mortgage rates fell to historic lows, demand for ARMs was barely 3%.\nARMs offer lower rates and can be fixed for up to 10 years. As a comparison, the average contract interest rate last week for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, increased to 6.85% from 6.79% the previous week, with points increasing to 0.67 from 0.65, including the origination fee, for loans with a 20% down payment. The average rate for a 5-year ARM fell to 5.82% from 5.94%.\nHigher rates on the 30-year fixed caused total mortgage demand to drop again. Total application volume dropped 2.7% for the week, according to the MBA's seasonally adjusted index.\n\"Mortgage rates moved higher last week, driven by ongoing investor concerns over inflation and the federal budget deficit. The 30-year fixed rate increased to 6.85 percent, the highest since June 2025 and 36 basis points higher than a year ago,\" said Joel Kan, MBA's vice president and deputy chief economist.\nApplications to refinance a home loan fell hardest, down 6% for the week and 25% lower than the same week one year ago. That is the slowest pace since May 2025.\nApplications for a mortgage to purchase a home were essentially flat, down 0.2% for the week. They were 4% higher than the same week one year ago.\n\"Higher mortgage rates continue to weigh on prospective homebuyers looking to act, even as housing inventory has increased in many markets,\" Kan added.\nMortgage rates were unchanged to start this week, according to a separate survey from Mortgage News Daily. Investors are waiting for monthly inflation numbers set to be released at the end of this week. Those could move mortgage rates sharply in either direction, depending on the outcome.",

    "id": "petrol-prices-rise-by-5p-over-a-week-as-7c263e03",
    "title": "Petrol prices rise by 5p over a week as Iran war sends oil higher",
    "titleJa": "イラン戦争で原油高、ガソリン価格が1週間で5ペンス上昇",
    "summaryJa": "イラン戦争で原油高、ガソリン価格が1週間で5ペンス上昇- 公開されました",
    "bodyOriginal": "Petrol prices rise by 5p over a week as Iran war sends oil higher\n- Published\nThe average price of unleaded petrol has risen by 5p a litre in the space of a week, according to the RAC, which warned there was \"no sign of any relief\" for drivers.\nThe motoring organisation said a litre of unleaded now costs 167.17p - the biggest weekly increase since April - while diesel has also risen by 5p to 188.63p.\nFuel prices have soared since the US-Israel war with Iran began at the end of February, with the fighting severely disrupting supplies of crude oil - a key ingredient in petrol and diesel - across the Middle East.\nThe price of Brent crude, the global benchmark for oil, has returned to $100 a barrel, for the first time since July, as hostilities escalated again.\nUS forces struck five Iranian tankers after Tehran targeted one of its warships, while Yemen's Iran-backed Houthi movement also attacked oil facilities in Saudi Arabia.\nThe price of Brent is some way off the $120 it hit in April, but remains well above the $70 it was trading at before the conflict started.\n'Having to dig deeper'\nRAC senior policy officer Rod Dennis said the latest increase in fuel prices showed just how exposed drivers in the UK can be to events thousands of miles away.\nThe 5p a litre rise meant the cost of filling a family-sized car had increased by £2.75 over the past week, he added.\n\"Drivers are having to dig ever deeper into their pockets every time they fill up, and there's no sign of any relief yet,\" said Dennis.\n\"With the cost of a barrel of oil having averaged $96 for the last week, wholesale prices are surging and that's already feeding through to prices at the forecourt.\"\nHe urged motorists to drive as efficiently as possible and to ensure they find the cheapest forecourts they can.\nThe last time petrol was this high was in September 2022, while diesel is still a bit below the 191.54p it reached in April.\nRelated topics\n- Published1 hour ago\n- Published5 hours ago\n- Published5 days ago",
    "bodyJa": "イラン戦争で原油高、ガソリン価格が1週間で5ペンス上昇\n- 公開されました\nRACによると、無鉛ガソリンの平均価格は1週間で1リットル当たり5ペンス上昇しており、ドライバーにとっては「何の救済の兆しも見られない」と警告している。\n自動車業界団体によると、無鉛ガソリンの価格は現在1リットル当たり167.17ペンスで、4月以来最大の週間値上がりとなっているが、ディーゼルも5ペンス上がって188.63ペンスとなっている。\n2月末に米国・イスラエルとイランとの戦争が始まって以来、燃料価格は高騰しており、戦闘により中東全域でガソリンとディーゼルの重要な原料である原油の供給が大幅に混乱している。\n戦闘が再び激化する中、原油の世界的なベンチマークであるブレント原油価格は7月以来初めて1バレル＝100ドルに戻った。\nイラン政府が軍艦1隻を標的にした後、米軍はイランのタンカー5隻を攻撃し、一方、イエメンのイランが支援するフーシ派もサウジアラビアの石油施設を攻撃した。\nブレントの価格は4月に付けた120ドルからはかなり離れているが、依然として紛争が始まる前に取引されていた70ドルを大きく上回っている。\n「もっと深く掘り下げないといけない」\nRACの上級政策責任者であるロッド・デニス氏は、最近の燃料価格の値上げは、英国のドライバーが数千マイル離れた出来事にいかにさらされているかを示していると述べた。\n1リットルあたり5ペンスの値上がりは、家族用サイズの車の給油コストが過去1週間で2.75ポンド増加したことを意味すると付け加えた。\n「ドライバーはガソリンを満タンにするたびに、ますますポケットを深く探さなければならなくなり、まだ軽減される兆しはない」とデニス氏は語った。\n「先週の石油1バレルの価格は平均96ドルだったため、卸売価格は高騰しており、それがすでに前庭価格に波及している。」\n同氏はドライバーに対し、可能な限り効率的に運転し、できるだけ安い前庭を確実に見つけるよう促した。\nガソリン価格が最後にこれほど高かったのは2022年9月だが、ディーゼル価格は4月に付けた191.54ペンスをまだわずかに下回っている。\n関連トピック\n- 1 時間前に公開\n- 5 時間前に公開\n- 5 日前に公開",
