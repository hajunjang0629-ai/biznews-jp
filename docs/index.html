    "titleJa": "NBA、カワイ・レナードのサラリーキャップ疑惑でクリッパーズのオーナー・バルマー氏に1年間の出場停止処分",
    "summaryJa": "NBAはまた、ロサンゼルス・クリッパーズに3,000万ドルの罰金を科し、チームは2029年からのドラフトで毎年1つずつ、計5つの1巡目指名権を剥奪されると発表した。",
    "bodyOriginal": "The NBA on Wednesday said it had suspended Los Angeles Clippers owner Steve Ballmer for one year as part of a broad array of sanctions on the basketball team and its executives for violating the league's salary cap circumvention rules related to star player Kawhi Leonard.\nThe NBA said that Leonard \"violated the circumvention rules by pressuring the Clippers to assist him in obtaining off-court income opportunities, successfully obtaining those opportunities, and failing to reimburse payments by the Clippers for personal expenses.\" Leonard was ordered to pay the league $700,000 in connection with his violations.\nBallmer \"knowingly\" sought to help Leonard obtain off-court income opportunities, and approved a business deal that \"that he knew was a precondition for Aspiration to enter into an endorsement agreement with Mr. Leonard, and for his failure to create conditions under which his organization abided by the NBA's circumvention rules,\" the NBA said.\nAs part of the sanctions issued Wednesday, the Clippers were fined $30 million and \"shall forfeit five first-round draft picks, one in each of the 2029, 2030, 2031, 2032, and 2033 NBA Drafts,\" the league said.\nIn addition to Ballmer's suspension, \"Clippers President of Business Operations Gillian Zucker is suspended without pay for one year for being primarily and directly culpable for the impermissible endorsement arrangements and for providing false and misleading statements to investigators,\" the league said.\nClippers President of Basketball Operations Lawrence Frank was suspended without pay for six months for his involvement with \"impermissible endorsement arrangements and for approving impermissible expenses incurred by Mr. Leonard and his family,\" the NBA said.\nThis is breaking news. Please refresh for updates.",
    "bodyJa": "NBAは水曜日、スター選手カワイ・レナードに関連したリーグのサラリーキャップ回避規定に違反したバスケットボールチームとその幹部に対する広範な制裁の一環として、ロサンゼルス・クリッパーズのオーナー、スティーブ・バルマー氏を1年間の出場停止処分にしたと発表した。\nNBAは、レナードが「クリッパーズに対しコート外での収入機会の獲得を支援するよう圧力をかけ、それらの機会を首尾よく獲得し、クリッパーズによる個人的費用の支払いを返済しなかったことにより、回避規則に違反した」と述べた。レナードは違反行為に関連してリーグに70万ドルの支払いを命じられた。\nバルマー氏は「承知の上で」レナード氏がコート外で収入を得られるよう支援しようとし、「アスピレーション社がレナード氏との推薦契約を結ぶための前提条件であること、そしてバルマー氏がNBAの回避規則を遵守する条件をバルマー氏が作り出すことができなかったことを認識していた」商取引を承認したとNBAは発表した。\n水曜日に出された制裁の一環として、クリッパーズには3,000万ドルの罰金が科せられ、「2029年、2030年、2031年、2032年、2033年のNBAドラフトでそれぞれ1つずつ、計5つのドラフト1巡目指名権を剥奪される」とリーグは発表した。\nバルマー氏の出場停止処分に加え、「クリッパーズの事業運営部門社長のジリアン・ザッカー氏は、許容されない承認取り決めと捜査官に虚偽で誤解を招く供述を行ったことに主として直接の責任があるとして、１年間の無給出場停止処分を受ける」とリーグは発表した。\nNBAは、クリッパーズのバスケットボール運営部門のローレンス・フランク社長が、「容認できないスポンサー契約への関与と、レナード氏とその家族が負担した容認できない出費を承認したこと」により、6か月の無給停職処分を受けたと発表した。\nこれは速報です。更新を確認するには更新してください。",

    "id": "ustr-s-greer-huddles-with-house-republic-f7721694",
    "title": "USTR's Greer huddles with House Republicans amid Trump trade spats",
    "titleJa": "USTRのグリア氏、トランプ大統領の貿易摩擦のさなか、下院共和党議員と密会",
    "summaryJa": "ドナルド・トランプ大統領によるカナダとの貿易戦争や牛肉輸入計画に議員らが動揺するなか、ジェイミソン・グリア通商代表は水曜日、下院共和党議員らと集まりました。ラルフ・ノーマン下院議員（共和党、サウスカロライナ州）は会議を終えた後、「良い議論、活発な議論だった」と述べ、議員らは「関税やカナダに対する懸念を表明していた」と述べた。",
    "bodyOriginal": "U.S. Trade Representative Jamieson Greer huddled with House Republicans on Wednesday as lawmakers reel from President Donald Trump's trade war with Canada and plans to import beef.\n\"It was a good discussion, a lively discussion,\" Rep. Ralph Norman, R-S.C., said after exiting the meeting, saying lawmakers were \"expressing their concerns about the tariffs, about Canada.\"\n\"It's not good, but I think they'll come to a conclusion on it. I think it'll be a meaningful result on this, and it may take some time; everybody's aware about the midterms, everybody knows about the timeline,\" he said, asked about potential escalation in the trade war with Canada.\nGreer's visit to Capitol Hill comes as Trump's whipsawing tariff agenda creates new vulnerabilities for Republicans on the campaign trail. An escalating tit-for-tat tariff battle with Canada could harm businesses and consumers in northern border states. Meanwhile, Trump's plan to lower tariffs on 300,000 metric tons of imported beef caused an uproar among cattle ranchers, who have long been allies of the president.\nRepublicans are trying to defend their narrow majorities in the House and Senate while voters register discontent with the cost of living, according to public polling.\n\"Most of the questions were regional,\" said Rep. Tim Burchett, R-Tenn. \"I'm confident this administration is working towards resolving a lot of the problems we have, but everybody knows it's affordability.\"\nAsked whether there are any talks ongoing with Canada, Burchett said: \"It doesn't sound like there are any right now.\"\nMost Republicans who attended the meeting sought to put the ball in Canada's court to de-escalate the trade war, consistent with the White House's messaging.\nCommerce Secretary Howard Lutnick said on CNBC on Wednesday that Ottawa is \"trying to blow it up for these political reasons.\"\n\"You're watching them play politics in Canada, and they're just using us, and it's really embarrassing,\" Lutnick said.\nCanadian Prime Minister Mark Carney on Tuesday blamed the Trump administration for the talks breaking down, saying the White House has been \"doing memes\" and \"throwing shade\" against his nation amid the growing trade war.\nThe U.S. slapped 50% tariffs on a bevy of goods in late August after trade talks broke down. Canada has since retaliated with its own tariffs. The Canadians accused the U.S. of making unreasonable demands, and the U.S. said Canada asked for changes at the last minute before the deal was to take effect.\n\"The United States of America gave them the best possible deal,\" Rep. Brian Mast, R-Fla., chair of the House Foreign Affairs Committee, said of Canada after the Greer meeting. \"The opportunity sits for them to come to the table.\"",
    "bodyJa": "ドナルド・トランプ大統領によるカナダとの貿易戦争や牛肉輸入計画に議員らが動揺するなか、ジェイミソン・グリア通商代表は水曜日、下院共和党議員らと集まりました。\nラルフ・ノーマン下院議員（共和党、サウスカロライナ州）は会議を終えた後、「良い議論、活発な議論だった」と述べ、議員らは「関税やカナダに対する懸念を表明していた」と述べた。\n同氏はカナダとの貿易戦争激化の可能性について質問し、「良くはないが、彼らはこの件について結論を出すだろう。この件に関しては有意義な結果になると思うが、時間がかかるかもしれない。中間選挙については誰もが知っており、タイムラインについては誰もが知っている」と述べた。\nグリア氏の国会議事堂訪問は、トランプ氏の鞭打ち関税政策が選挙活動中の共和党員に新たな脆弱性を生み出している中で行われた。カナダとの報復関税合戦が激化すれば、北部国境州の企業や消費者に損害を与える可能性がある。一方、30万トンの輸入牛肉に対する関税を引き下げるというトランプ大統領の計画は、大統領の長年の同盟国である畜産農家の間で騒動を引き起こした。\n世論調査によると、有権者が生活費に不満を示す中、共和党は上下両院で僅差の多数派を守ろうとしている。\n「質問のほとんどは地域に関するものだった」とティム・バーチェット下院議員（共和党、テネシー州）は語った。 「現政権が我々が抱えている多くの問題の解決に取り組んでいると確信しているが、それが手頃な価格であることは誰もが知っている。」\nバーチェット氏は、カナダと何らかの協議が進行しているかとの質問に対し、「現時点では協議が行われていないように見える」と述べた。\n会合に出席した共和党議員の大半は、ホワイトハウスのメッセージと一致して、貿易戦争の沈静化に向けてカナダの法廷にボールを置こうとした。\nハワード・ラトニック商務長官は水曜日、CNBCで、オタワは「政治的理由でそれを爆破しようとしている」と述べた。\n「カナダで彼らが政治活動をしているのを見ていると、彼らはただ私たちを利用しているだけだ。それは本当に恥ずかしいことだ」とラトニック氏は語った。\nカナダのマーク・カーニー首相は火曜日、貿易戦争が激化する中、ホワイトハウスが自国に対して「ミームを行って」「日陰を投げかけている」と述べ、交渉決裂の責任はトランプ政権にあると非難した。\n米国は通商交渉決裂後、8月下旬に一連の製品に50％の関税を課した。その後、カナダは独自の関税で報復した。カナダ側は米国が不当な要求をしたと非難し、米国はカナダが合意発効直前になって変更を求めたと述べた。\n下院外交委員会委員長のブライアン・マスト下院議員（共和党、フロリダ州）はグリア会談後、カナダについて「米国は可能な限り最善の合意を提示した」と述べた。 「彼らがテーブルに着くチャンスが到来している。」",

    "id": "microsoft-to-start-disclosing-azure-quar-0c8b29bc",
    "title": "Microsoft to start disclosing Azure quarterly revenue as company consolidates business units",
    "titleJa": "Microsoft、事業部門の統合に伴いAzureの四半期収益の開示を開始",
    "summaryJa": "Microsoftは、Azureクラウド事業の四半期収益の開示を初めて開始し、アマゾン ウェブ サービスやグーグルのクラウドプラットフォームと競合する同社の事業のより明確な全体像を投資家に提供する。水曜日のプレゼンテーションで発表されたこの変更は、Microsoftの営業セグメントを3つから2つに削減することによる、報告構造の広範な変更の一環である。以前の体制は 2015 年から実施されていました。",
    "bodyOriginal": "Microsoft will start disclosing quarterly revenue for its Azure cloud business for the first time, providing investors with a clearer picture of its business that competes with Amazon Web Services and Google's cloud platform.\nThe change, announced in a presentation on Wednesday, is part of a broader shift in Microsoft's reporting structure, as the company trims its operating segments from three to two. The prior structure had been in place since 2015.\nMicrosoft's Azure unit has been a major beneficiary of the artificial intelligence boom, as customers turn to major cloud infrastructure platforms for access to the AI models needed to develop new agents and other tools. Analysts at Stifel estimated in July that about half of Azure's revenue growth in the 2026 fiscal year came from OpenAI, while Anthropic has also become more reliant on Microsoft's cloud.\n\"There's no question Al represents a profound shift in both technology and business,\" CEO Satya Nadella wrote in the presentation. \"It is changing what we build and how we operate, and it is blurring the boundaries between our products and reshaping our business models.\"\nAmazon began disclosing revenue from AWS, the market leader, in 2015. Alphabet, which ranks third in cloud, started providing total revenue from Google Cloud Platform and Workspace productivity subscriptions in 2020.\nMicrosoft, by contrast, has only been providing the year-over-year growth rate for Azure, and started offering actual sales on an annual basis dating back to last year.\nAnother big change to Azure is that it will exclude GitHub cloud services, developer cloud services, the Security Copilot assistant and healthcare and life sciences cloud products, according to the presentation. In 2021, the company started announcing growth from Azure and other cloud services, later lumping in some revenue from the GitHub and Nuance Communications acquisitions.\n\"Under this reporting structure, Azure becomes more purely our consumption-based platform and infrastructure business,\" Nadella wrote in the deck.\nGoing forward, Microsoft's two segments will be Agents and Infra, and Devices and Consumer.\nThe first will include Azure and Microsoft 365 cloud products, as well as productivity and server licensing, industry solutions and frontier and support services. The latter will comprise search and advertising, Xbox, and revenue from sales of devices and Windows operating system licenses to device makers.\nInside Agents and Infra, Microsoft will be able to showcase momentum from a series of AI assistants, including the Microsoft 365 Copilot for commercial customers and the GitHub Copilot coding agent. Microsoft said in July that it had over 30 million paid seats for the 365 Copilot, up from more than 20 million as of April.\nMicrosoft is also providing two years of recast financial results and adjusted guidance, but will stop showing costs and operating margins for the three old segments.\nWith the new structure, Azure revenue grew 42% to $29.42 billion in the June quarter, compared with 43% using the old Azure and other cloud services metric. That means Azure represented almost 33% of Microsoft's total revenue in the latest period.\nManagement said fiscal first-quarter Azure revenue should grow 44% to 45% at constant currency. In July the company called for 45% growth at constant currency for Azure and other cloud services.\nMicrosoft is targeting $75.15 billion to $75.75 billion in Agents and Infra revenue, with $14.7 billion to $15.2 billion in Devices and Consumer revenue. There are no changes to the outlook for overall revenue, cost of revenue or operating expenses.\nWATCH: BofA's Liani on Microsoft upgrade: Investors are underestimating how it is differentiating in AI",
    "bodyJa": "Microsoftは、Azureクラウド事業の四半期収益の開示を初めて開始し、アマゾン ウェブ サービスやグーグルのクラウドプラットフォームと競合する同社の事業のより明確な全体像を投資家に提供する。\n水曜日のプレゼンテーションで発表されたこの変更は、Microsoftの営業セグメントを3つから2つに削減することによる、報告構造の広範な変更の一環である。以前の体制は 2015 年から実施されていました。\n顧客が新しいエージェントやその他のツールの開発に必要な AI モデルにアクセスするために主要なクラウド インフラストラクチャ プラットフォームに目を向けているため、Microsoft の Azure 部門は人工知能ブームの大きな恩恵を受けてきました。 Stifelのアナリストらは7月、2026会計年度のAzureの収益増加の約半分はOpenAIによるもので、AnthropicもMicrosoftのクラウドへの依存度を高めていると推定した。\nCEOのサティア・ナデラ氏はプレゼンテーションの中で、「アルがテクノロジーとビジネスの両方に大きな変化をもたらすことに疑問の余地はない」と述べた。 「私たちが何を構築し、どのように運営するかが変化し、製品間の境界があいまいになり、ビジネスモデルが再構築されています。」\nAmazon は、2015 年に市場リーダーである AWS からの収益の開示を開始しました。クラウドで 3 位にランクされている Alphabet は、2020 年に Google Cloud Platform と Workspace の生産性サブスクリプションからの総収益の提供を開始しました。\n対照的に、Microsoft は Azure の前年比成長率のみを提供しており、昨年から実際の売上高を年間ベースで提供し始めました。\nプレゼンテーションによると、Azure に対するもう 1 つの大きな変更は、GitHub クラウド サービス、開発者向けクラウド サービス、Security Copilot アシスタント、ヘルスケアおよびライフ サイエンスのクラウド製品が除外されることです。 2021年、同社はAzureやその他のクラウドサービスによる成長を発表し始め、後にGitHubとNuance Communicationsの買収による収益の一部を一括計上した。\n「この報告構造の下では、Azure はより純粋に消費ベースのプラットフォームおよびインフラストラクチャ ビジネスになります」と Nadella 氏は資料の中で述べています。\n今後、Microsoft の 2 つのセグメントは、エージェントとインフラ、デバイスとコンシューマになります。\n1 つ目には、Azure と Microsoft 365 のクラウド製品に加え、生産性とサーバーのライセンス、業界ソリューション、フロンティアおよびサポート サービスが含まれます。後者には、検索と広告、Xbox、デバイス メーカーへのデバイスと Windows オペレーティング システムのライセンスの販売からの収益が含まれます。\nエージェントとインフラ内で、Microsoft は、商用顧客向けの Microsoft 365 Copilot や GitHub Copilot コーディング エージェントを含む一連の AI アシスタントの勢いを示すことができます。 Microsoftは7月、365 Copilotの有料シート数は3000万以上で、4月時点の2000万以上から増加したと発表した。\nMicrosoftはまた、2年間の修正された財務結果と調整後のガイダンスを提供しているが、3つの古いセグメントのコストと営業利益率の表示を中止する。\n新しい構造により、6 月四半期の Azure の収益は 42% 増加して 294 億 2000 万ドルとなりました。これに対し、古い Azure およびその他のクラウド サービスの指標を使用した場合は 43% 増加しました。これは、Azure が最新期間における Microsoft の総収益のほぼ 33% を占めたことを意味します。\n経営陣は、会計年度第 1 四半期の Azure 収益は為替変動の影響を除いて 44% ～ 45% 増加するはずだと述べています。同社は7月に、Azureやその他のクラウドサービスの固定通貨ベースで45％の成長を要求した。\nMicrosoftは、エージェントとインフラの売上高が751億5000万ドルから757億5000万ドル、デバイスとコンシューマの売上高が147億ドルから152億ドルになることを目標としている。全体の収益、収益原価、営業費用の見通しに変更はありません。\n注目: Microsoft アップグレードに関する BofA のリアニ氏: 投資家は AI での差別化を過小評価している",

    "sourceUrl": "https://www.cnbc.com/2026/09/02/microsoft-to-disclose-azure-revenue-as-part-of-segment-changes.html",

  {
    "id": "snowflake-spikes-22-on-healthy-results-a-c6e97b4f",
    "title": "Snowflake spikes 22% on healthy results and AI coding momentum",
    "titleJa": "Snowflake は健全な結果と AI コーディングの勢いで 22% 急上昇",
    "summaryJa": "データ分析ソフトウェアメーカーが予想を上回る業績とガイダンスを発表したことを受け、スノーフレーク株は水曜日の時間外取引で22％上昇した。LSEGコンセンサスと比較した同社のパフォーマンスは次のとおりです。",
    "bodyOriginal": "Snowflake shares rose 22% in extended trading on Wednesday after the data analytics software maker reported results and guidance that surpassed expectations.\nHere's how the company performed relative to LSEG consensus:\n- Earnings per share: 62 cents adjusted vs. 45 cents expected\n- Revenue: $1.55 billion vs. $1.48 billion expected\nSnowflake's revenue jumped 35% year over year in the fiscal second quarter, which ended on July 31, according to a statement. The company recorded a net loss of $191.7 million, or 55 cents per share, smaller than the net loss of $297.9 million, or 89 cents per share, one year ago.\nThe company pointed to gains from the CoCo artificial intelligence coding agent, which now has 9,100 accounts, an increase of over 2,000 during the quarter.\nFor the fiscal third quarter, Snowflake said it sees $1.59 billion in product revenue, above the $1.50 billion consensus among analysts polled by StreetAccount. Management pushed up its product revenue forecast for the fiscal year, calling for $6.07 billion, compared with $5.84 billion in May. It's now forecasting a 14.5% adjusted operating margin, wider than the 13.5% figure it had projected in May.\nAs of Wednesday's close, Snowflake shares were up 39%, while the S&P 500 index had gained about 12% in the same period. If the stock moves as high on Thursday as it did after hours on Wednesday, it would represent the fourth highest jump since Snowflake went public in 2020.\nExecutives will discuss the results with analysts on a conference call starting at 5 p.m. ET.",
    "bodyJa": "データ分析ソフトウェアメーカーが予想を上回る業績とガイダンスを発表したことを受け、スノーフレーク株は水曜日の時間外取引で22％上昇した。\nLSEGコンセンサスと比較した同社のパフォーマンスは次のとおりです。\n- 1 株当たり利益: 調整後 62 セント、予想 45 セント\n- 収益: 15 億 5,000 万ドル対予想 14 億 8,000 万ドル\n声明によると、スノーフレークの売上高は、7月31日に終了した会計年度第2四半期に前年同期比35％増加した。同社の純損失は1億9,170万ドル（1株あたり55セント）で、1年前の純損失2億9,790万ドル（1株あたり89セント）よりも縮小した。\n同社は、CoCo 人工知能コーディング エージェントによる利益を指摘し、現在アカウント数は 9,100 であり、当四半期中に 2,000 以上増加しました。\nスノーフレークは、会計年度第3四半期の製品売上高が15億9000万ドルになると予想しており、StreetAccountが調査したアナリストのコンセンサスである15億9000万ドルを上回っていると述べた。経営陣は会計年度の製品売上高予想を5月の58億4000万ドルから60億7000万ドルに上方修正した。同社は現在、調整後営業利益率が14.5％と予想しており、5月に予想していた13.5％を上回っている。\n水曜日の終値時点で、スノーフレークの株価は39％上昇し、S&P500指数は同期間に約12％上昇した。もし木曜日の株価が水曜の時間外株価と同じくらい高くなれば、スノーフレークが2020年に上場して以来4番目に高い値上がりとなる。\n幹部らは午後５時からの電話会議でアナリストらと結果について話し合う予定だ。 ET。",

    "id": "the-los-angeles-angels-are-being-sold-fo-8cadf703",
    "title": "The Los Angeles Angels are being sold for a record $4 billion. Here's what every MLB team is now worth",
    "titleJa": "ロサンゼルス・エンゼルスが史上最高額の40億ドルで売却されることになった。 MLB チームの現在の価値は次のとおりです",
    "summaryJa": "スタン・クロエンケ監督は、MLBチームとその地域スポーツネットワークであるエンジェルス・ブロードキャスト・テレビジョンを40億ドルで評価する契約で、モレノ家からロサンゼルス・エンゼルスを買収することに同意した。今年初めに発表されたCNBCのMLB評価額によると、エンゼルスのMLB評価額の記録は2025年の球団収入の10倍に相当する。比較すると、先月MLBが承認したホセ・フェリシアーノとクワンザ・ジョーンズへのサンディエゴ・パドレスの39億ドルの売却は、収益が8倍の倍数となった。",
    "bodyOriginal": "Stan Kroenke has agreed to buy the Los Angeles Angels from the Moreno family in a deal that values the MLB team and its regional sports network, Angels Broadcast Television, at $4 billion.\nThe record MLB valuation for the Angels is equivalent to 10 times the team's 2025 revenue, according to CNBC's MLB valuations published earlier this year. In comparison, the $3.9 billion sale of the San Diego Padres to José Feliciano and Kwanza Jones, approved by the MLB last month, had a multiple of eight times revenue.\nCNBC has updated its MLB valuations based on the Angels deal, focusing on valuation-to-revenue multiples, market and stadium economics.\nThe average MLB team is now worth $4.04 billion, 37% more than our MLB valuations in March. The New York Yankees top the list with a value of $12 billion, 28% more than in March. The least valuable MLB team is still the Miami Marlins, but we now value the team at $2.2 billion, a 57% increase from March. The New York Mets, now worth $5.4 billion, jumped to fifth on our list, leapfrogging the San Francisco Giants and Philadelphia Phillies.\nBankers CNBC spoke with regarding the Angels deal stressed that location is a big factor in the trophy appeal of owning a sports team. To wit: The recent announcement that Josh Kushner and Bob Iger have agreed to buy the NBA's Los Angeles Lakers at a $12.5 billion valuation.\nWe did not adjust the value of the Los Angeles Dodgers from our March rankings, keeping it at $8 billion, due to the controversy surrounding the team's owner, Mark Walter.",
    "bodyJa": "スタン・クロエンケ監督は、MLBチームとその地域スポーツネットワークであるエンジェルス・ブロードキャスト・テレビジョンを40億ドルで評価する契約で、モレノ家からロサンゼルス・エンゼルスを買収することに同意した。\n今年初めに発表されたCNBCのMLB評価額によると、エンゼルスのMLB評価額の記録は2025年の球団収入の10倍に相当する。比較すると、先月MLBが承認したホセ・フェリシアーノとクワンザ・ジョーンズへのサンディエゴ・パドレスの39億ドルの売却は、収益が8倍の倍数となった。\nCNBCは、エンゼルスとの契約に基づいて、評価額対収益倍率、市場およびスタジアムの経済性に焦点を当てて、MLBの評価額を更新した。\n現在、平均的な MLB チームの資産価値は 40 億 4,000 万ドルで、3 月時点の MLB 評価額より 37% 増加しています。ニューヨーク・ヤンキースが120億ドルでトップとなり、3月より28％増加した。 MLB チームの価値が最も低いチームは依然としてマイアミ マーリンズですが、現在チームの価値は 22 億ドルと評価されており、3 月から 57% 増加しています。現在54億ドルの資産を持つニューヨーク・メッツは、サンフランシスコ・ジャイアンツとフィラデルフィア・フィリーズを抜き去り、リストの5位に躍り出た。\nエンゼルスとの契約に関してCNBCが取材した銀行関係者は、スポーツチームを所有するトロフィーの魅力には立地が大きな要素であると強調した。つまり、ジョシュ・クシュナーとボブ・アイガーがNBAのロサンゼルス・レイカーズを125億ドルの評価額で買収することに合意したという最近の発表だ。\nチームのオーナー、マーク・ウォルター氏をめぐる論争のため、ロサンゼルス・ドジャースの価値は3月のランキングから調整せず、80億ドルに据え置いた。",

    "id": "states-now-must-report-undocumented-immi-ccb1c87d",
    "title": "States now must report undocumented immigrants to DHS or risk federal funding, DOJ says",
    "titleJa": "司法省は今後、各州は不法移民をDHSに報告しなければならない、さもなければ連邦資金の危険にさらされると述べた",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "All states going forward must report undocumented immigrants known to be in a state to the U.S. Department of Homeland Security or risk losing federal funding for programs meant to aid low-income individuals, the Department of Justice said in a new legal opinion.\nThe DOJ, in issuing the opinion, revised the Office of Legal Counsel's prior opinion from 1998, which found that only specific state agencies that administered the Temporary Assistance for Needy Families and the Supplemental Security Income programs needed to provide information to federal immigration authorities.\n\"Congress wrote this requirement plainly,\" Assistant Attorney General T. Elliot Gaiser of the DOJ's Office of Legal Counsel, said in a statement.\n\"When a state chooses to participate in TANF, it accepts the obligation to report illegal aliens in the United States,\" Gaiser said. \"Tax dollars intended to help vulnerable Americans should not perversely encourage illegal entry into the United States, but rather should reinforce our laws and our borders.\"\nThe DOJ in a statement Wednesday said the Office of Legal Counsel's Sept. 1 opinion \"explains that Congress defined 'State' broadly in the Personal Responsibility and Work Opportunity Reconciliation Act of 1996.\"\n\"As a result, when a state accepts federal TANF or SSI funds, the entire state government — including all component agencies — is bound by federal law to share information with DHS about individuals the state knows to be not lawfully present,\" the DOJ said.\nThe new opinion only applies proactively, not to past enrollments in TANF and SSI.\nAll 50 states, the District of Columbia and several U.S. territories participate in both programs. Federal TANF funding grants top $16.4 billion annually, according to the DOJ.\n\"Our clarification does not impose new obligations on states,\" said Deputy Assistant Attorney General Joshua Craddock, the Office of Legal Counsel official who wrote the new opinion.\n\"It simply restores the original meaning of the statute Congress enacted and ensures that DHS receives the information it is legally entitled to,\" Craddock said.\n\"States that accept TANF funding must abide by federal law, and failure to comply may lead to serious consequences, including loss of program funding.\"\nCNBC has requested comment on the new opinion from the attorneys general of more than a dozen of the largest U.S. states, and asked if they will challenge its guidance.\nThis is developing news. Please check back for details.",
    "bodyJa": "司法省は新たな法的見解の中で、今後すべての州は、州内にいることが判明している不法移民を国土安全保障省に報告する必要があり、報告しなければ、低所得者支援プログラムへの連邦予算を失う危険があると述べた。\n司法省はこの意見を発表するにあたり、1998年の法律顧問局の以前の意見を修正し、その意見では、困窮家族に対する一時的援助と補足保障収入プログラムを管理する特定の州機関のみが連邦移民当局に情報を提供する必要があるとした。\n「議会はこの要件を明確に書いた」と司法省法律顧問局のT・エリオット・ガイザー司法次官補は声明で述べた。\n「州がTANFへの参加を選択した場合、その州は米国内の不法滞在者を報告する義務を受け入れることになる」とガイザー氏は述べた。 「弱い立場にあるアメリカ人を助けるための税金は、アメリカへの不法入国を邪悪に奨励すべきではなく、むしろ我が国の法律と国境を強化すべきである。」\n司法省は水曜日の声明で、法律顧問局の9月1日の意見は「議会が1996年の個人責任と労働機会調整法で『国家』を広範に定義したことを説明している」と述べた。\n「その結果、州が連邦TANFまたはSSI基金を受け入れる場合、すべての構成機関を含む州政府全体は、連邦法により、州が合法的に存在していないことがわかっている個人に関する情報をDHSと共有する義務がある」と司法省は述べた。\n新しい意見は積極的にのみ適用され、TANF および SSI への過去の登録には適用されません。\n50 州すべて、コロンビア特別区、およびいくつかの米国準州が両方のプログラムに参加しています。司法省によると、連邦TANF資金助成金は年間164億ドルを超える。\n「われわれの明確化は州に新たな義務を課すものではない」と新たな意見書を書いた法律顧問局職員のジョシュア・クラドック司法次官補は述べた。\n「これは単に議会が制定した法令の本来の意味を復元し、DHSが法的に受け取る権利のある情報を確実に受け取ることを保証するものである」とクラドック氏は述べた。\n「TANFの資金提供を受け入れる州は連邦法を遵守しなければならず、従わない場合はプログラム資金の損失を含む深刻な結果につながる可能性がある。」\nCNBCは、米国の主要な12以上の州の司法長官に新たな意見についてコメントを求め、その指針に異議を唱えるつもりか尋ねた。\nこれは発展途上のニュースです。詳細については改めてご確認ください。",

    "id": "netherlands-moves-billions-in-gold-to-lo-a631e022",
    "title": "Netherlands moves billions in gold to London in 'crisis preparedness' move",
    "titleJa": "オランダ、「危機への備え」として数十億ドルの金をロンドンに移動",
    "summaryJa": "オランダ、「危機への備え」として数十億ドルの金をロンドンに移動- 公開されました",
    "bodyOriginal": "Netherlands moves billions in gold to London in 'crisis preparedness' move\n- Published\nThe Dutch central bank (DNB) has confirmed that billions of dollars in gold has been taken out of north America and relocated to London, citing \"increasing geopolitical unrest\".\nDNB said on Wednesday that 86 tonnes of gold had been removed from the US and Canada in a complex operation that took several months. It is now being held by the Bank of England, where the precious metal can be traded more easily \"in a crisis situation\".\nBank president Olaf Sleijpen said the move was \"necessary to strengthen our resilience and preparedness\".\nThe decision comes amid an ongoing trade dispute between the US and Canada, with both countries announcing fresh tariffs on each other after failed trade talks.\nDNB said the transfer, which took place between March and August, saw 27 tonnes of gold bars moved from New York and Ottawa to Zeist in the Netherlands.\nA similar quantity and quality was then moved to London, with no need to melt the bars down.\nExactly how so much gold was transported across the Atlantic Ocean has not been revealed.\nThe rest of the transfer was carried out by selling the gold in New York, and repurchasing it in London, the bank said, external.\n\"Combining the processes of buying and selling and physical transport has allowed DNB to spread the risks associated with such a complex physical gold relocation,\" the statement said.\nDNB did not confirm what it was referring to with its mention of \"geopolitical unrest\" but the US economy remains in an uncertain position due to the country's ongoing war with Iran, which has impacted global trade.\nCanada, meanwhile, has been hit hard by US tariffs on its key sectors of steel, aluminium, lumber and automobiles as well as an additional 50% levy on about C$28bn ($20bn; £15bn) of Canadian goods announced in August.\nDNB said that gold that is held with the Bank of England \"is regarded as the world's most easily tradable gold,\" and therefore more readily available in a crisis than if it was still in the US or Canada.\nPrior to Wednesday's announcement, the DNB held 31.3% of its gold in New York and 19.7% in Ottawa. This has now fallen to 18.5% in both countries.\nThe total Dutch gold stock was 612.4 tonnes at the end of 2025 and has been valued at €72.2 billion, DNB said.\nThe bank's share of gold in London has increased from 18.1% to 32.1% after the move, while it still holds 30.8% of its reserves in the Netherlands.\nRelated topics\n- Published2 days ago\n- Published7 days ago",
    "bodyJa": "オランダ、「危機への備え」として数十億ドルの金をロンドンに移動\n- 公開されました\nオランダ中央銀行（DNB）は、「地政学的不安の増大」を理由に、数十億ドルの金が北米から持ち出され、ロンドンに移されたことを確認した。\nDNBは水曜日、数カ月かかった複雑な作業により86トンの金が米国とカナダから持ち出されたと発表した。現在はイングランド銀行が保有しており、「危機的状況において」貴金属をより容易に取引できるようになっている。\n同行のオラフ・スライペン頭取は、今回の措置は「われわれの回復力と備えを強化するために必要だった」と述べた。\nこの決定は、米国とカナダの間で進行中の貿易紛争のさなか行われ、貿易交渉の失敗を受けて両国は相互に新たな関税を発表した。\nDNBによると、この移送は3月から8月にかけて行われ、27トンの金塊がニューヨークとオタワからオランダのザイストに移送されたという。\nその後、バーを溶かす必要がなく、同様の量と品質がロンドンに移されました。\nいったいどのようにしてこれほどの金が大西洋を越えて運ばれたのかは明らかになっていない。\n同銀行によると、残りの送金はニューヨークで金を売却し、ロンドンで買い戻す形で外部で行われたという。\n「DNBは、売買と物理的な輸送のプロセスを組み合わせることで、このような複雑な物理的な金の移転に伴うリスクを分散することができた」と声明では述べている。\nDNBは「地政学的不安」という言及が何を指しているかは確認していないが、世界貿易に影響を与えているイランとの戦争が続いているため、米国経済は依然として不確実な立場にある。\n一方、カナダは、鉄鋼、アルミニウム、木材、自動車といった主要分野に対する米国の関税と、8月に発表されたカナダ製品約280億カナダドル（200億ドル、150億ポンド）に対する50％の追加関税によって大きな打撃を受けている。\nDNBは、イングランド銀行が保有する金は「世界で最も簡単に取引できる金とみなされている」ため、米国やカナダに保管されている場合よりも危機時に容易に入手できると述べた。\n水曜日の発表前、DNBは金の31.3％をニューヨークに、19.7％をオタワに保有していた。これは現在、両国とも 18.5% に低下しています。\nDNBによると、オランダの金の総在庫は2025年末時点で612.4トンで、その価値は722億ユーロに上るという。\n移転後、ロンドンにおける同銀行の金のシェアは18.1％から32.1％に増加したが、オランダでは依然として準備金の30.8％を保有している。\n関連トピック\n- 2 日前に公開\n- 7 日前に公開",

    "id": "uber-to-cut-over-3-000-jobs-in-major-glo-67af94b0",
    "title": "Uber to cut over 3,000 jobs in major global restructuring",
    "titleJa": "ウーバー、世界規模の大規模なリストラで3000人以上の人員削減へ",
    "summaryJa": "ウーバー、世界規模の大規模なリストラで3000人以上の人員削減へ- 公開されました",
    "bodyOriginal": "Uber to cut over 3,000 jobs in major global restructuring\n- Published\nUber is cutting more than 3,000 jobs worldwide as part of a major overhaul designed to shrink management layers and refocus spending on its core business.\nThe cuts amount to roughly 10% of its global workforce, bringing staffing back to levels last seen in 2021.\nChief executive Dara Khosrowshahi told staff in a company email that the taxi and delivery firm had expanded quickly but accumulated too many layers and small teams that slowed decision‑making.\nHe said the reductions would put Uber, which has its global head office in San Francisco, US, in a better position for its \"biggest opportunities ahead of us\".\nThe move marks one of Uber's largest restructurings in years and signals a shift towards a leaner operating model.\nShares rose nearly 2% after the announcement, with investors appearing to welcome the proposals.\nCuts affect both managers and non-managers, and Uber said it plans to fold many of its smallest teams into larger groups, however, the firm has not confirmed the locations most affected by job cuts.\nSuch changes are intended to make Uber \"simpler\" and \"faster,\" while freeing up money to reinvest in areas it considers central to its future, Khosrowshahi said.\nThe restructuring comes as Uber steps up investment in autonomous vehicle partnerships and expands its ride‑hailing, delivery, and robotaxi operations.\nUber is also tightening up its office strategy, asking nearly all employees to work in person at designated hubs and limiting remote roles to about 1%.\nAnalysts said the layoffs could generate up to $2bn in annual savings.\nUnlike many large technology companies that have cut jobs amid heavy spending on artificial intelligence (AI), Uber had avoided major reductions since the pandemic.\nThe latest changes bring its workforce back to just under 30,000 people, roughly where it stood before its most recent period of expansion.\nRelated topics\n- Published8 June",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
