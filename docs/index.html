  {
    "id": "why-japanese-firms-are-being-so-slow-to-9eeca766",
    "title": "Why Japanese firms are being so slow to use AI",
    "titleJa": "日本企業のAI活用が遅れている理由",
    "summaryJa": "日本企業のAI活用が遅れている理由- 公開されました",
    "bodyOriginal": "Why Japanese firms are being so slow to use AI\n- Published\nFacing acute labour shortages, ageing demographics and chronic productivity problems, Japanese companies should be fertile ground for the take-up of artificial intelligence (AI). Yet, compared with the US and UK, adoption in many workplaces remains sluggish and cautious.\nJapan's response to AI is beginning to resemble one of the country's slow-moving, traditional Noh plays.\nAll the masked characters up on stage agree that action is urgent, and the call is repeated with solemn agreement. Yet the actors remain frozen in place.\nGreat for heightening drama, terrible for addressing the country's immediate difficulties.\nData showing the use of AI in the workplace suggests that Japan has fallen behind. Just 8.4% of Japanese workers use AI as part of their job, according to a report, external at the end of last year by the Organisation for Economic Co-operation and Development (OECD).\nBy contrast, separate statistics puts the US figure at 50%,, external and the UK at 32%., external In Singapore, which is said to have seen the second-highest, external take up of AI after the United Arab Emirates, and the most in Asia, 56% of workers are said to use AI \"multiple times a week\"., external\nUS and Japan take action to prop up yen in rare joint move\n- Published3 August\nSo why is Japan dragging its feet? Austin Xu, co-founder of US start-up Kuse AI, says it is due to Japanese companies being conservative and risk adverse. His business recently set up an office in Japan to sell its AI systems to firms in the country.\n\"There are organisations where process and consensus culture genuinely slow things down,\" he says. \"Where tolerance for AI mistakes is close to zero, especially in anything client facing. Some would rather leave a role unfilled than let a machine handle it.\"\nXu says the situation in the US is very different, with some businesses already allowing AI agents far more freedom to boost productivity. \"In the US, AI colleagues enter as helpers and gradually become part of the workflow. The attitude [of US bosses] is often - let it try, then correct it.\"\nHe adds that Japanese companies need more proof before they trust AI enough to use it.\nParrisa Haghirian, professor of international management at the Kyoto University of Advanced Science, agrees that many Japanese companies are too risk adverse to look at AI.\n\"The challenges of adopting it are the same as adopting any change in Japanese firms. This is why AI use is still quite limited and cautious, especially in the workplace.\"\nHaghirian also contrasts this with the more entrepreneurial culture of the US, arguing that Japanese firms are highly sensitive to error, uncertainty and reputational risk.\n\"Since generative AI is still not fully reliable, it is mainly used [in Japan] for low-risk tasks such as writing, summarising, or information gathering, but much less for core operations or decision-making and for improving overall processes,\" she says.\nJapan's healthcare sector is said to be particularly slow to look at AI, with some hospitals yet to even fully digitalise patient files. \"Paper documents accumulate at a staggering scale,\" says one employee at a Japanese hospital, who asked not to be named. \"It's like the Stone Age.\"\nThe Japanese government is aware of the wider problem of low AI adoption, and is trying to get more companies to take up the technology. Last year its AI Promotion Act was passed, external by the country's parliament.\nThis aims to use light-touch regulation to encourage businesses to invest more in AI. Tokyo pledges that Japan will become \"the world's most-friendly country for developing and utilizing AI\".\nThe government believes that the increased use of AI can help Japan improve its productivity. Currently it continues to have the worst level, external in the G7 group of advanced nations.\nJapan's Ministry of Finance says that AI adoption by businesses has already increased substantially,, external with 75% of companies now using the technology, up from 11% five years ago.\nHowever, critics argue that at each of these businesses only a tiny proportion of staff are actually using the AI, and that those who do so are only using it to a very limited extent.\nProf Yasushi Ogasawara, an expert on Japan's social system and technology at Meiji University, says there aren't enough tech-savvy people in the workforce.\n\"Although the Japanese like playing with gadgets such as smartphones, digital literacy is low here,\" he says.\nThis is highlighted by one report earlier this year which said Japan faced a shortfall , externalof almost 800,000 IT professionals by 2030.\nMany companies are also said to struggle with out-of-date computer systems, with around 60% more than 20-years-old.\nMoreover, Ogasawara adds that Japanese companies are under more pressure to avoid fuelling unemployment than they are to develop AI which could result in job losses.\n\"The government is talking about AI, re-skilling, digital skills, but in reality, it is difficult to adapt human resources to digital skills because the top priority is to maintain full employment,\" he says.\nBut there is a shift in recruitment, with some companies now prioritising \"AI literacy\" in their new graduate hiring.\nIn the private sector, larger firms such as Kanematsu, a major general trading company, are hiring savvy graduates such as Uta Yamaguchi who joined in April.\n\"I use AI quite often at work,\" she says. \"Many of my colleagues use it a lot. For writing emails for my boss, summarising complicated documents, meeting recording and summarising.\"\nBut, by contrast with the US, she says AI systems that can autonomously handle multi-step work are still virtually unheard of in Japan.\nHowever, her employer, known for its forward thinking, now has them onboard.\nOgasawara says that \"change in Japan is limited\". He adds: \"Japanese society expects painless reform, so I think it can be said that drastic reform is difficult, to say the least.\"\nDisruption may be a dirty word in Japan, but without it the productivity gains the country needs could remain elusive.",
    "bodyJa": "日本企業のAI活用が遅れている理由\n- 公開されました\n深刻な労働力不足、人口の高齢化、慢性的な生産性の問題に直面している日本企業は、人工知能（AI）を導入するための肥沃な土壌となるはずです。しかし、米国や英国と比較すると、多くの職場での導入は依然として鈍く、慎重です。\nAIに対する日本の対応は、ゆっくりとした動きの伝統的な能劇に似てきている。\nステージ上の仮面をかぶった登場人物全員が行動が緊急であることに同意し、厳粛な同意のもとに呼びかけが繰り返される。それでも俳優たちはその場に固まったままだ。\nドラマを盛り上げるには素晴らしいが、この国の当面の困難に対処するには最悪だ。\n職場での AI の使用を示すデータは、日本が遅れをとっていることを示唆しています。経済協力開発機構（OECD）が昨年末発表した外部報告書によると、仕事の一部としてAIを利用している日本の労働者はわずか8.4％だという。\n対照的に、別の統計によると、米国の対外利用率は 50%、英国は 32% となっています。外部からの AI の導入率はアラブ首長国連邦に次いで 2 番目に高く、アジアでは最も多いと言われているシンガポールでは、労働者の 56% が AI を「週に複数回」使用していると言われています。\n米国と日本、異例の共同行動で円を下支えする措置を講じる\n- 8 月 3 日発行\nでは、なぜ日本は足を引っ張っているのでしょうか？米国の新興企業Kuse AIの共同創設者であるオースティン・シュー氏は、その原因は日本企業が保守的でリスク回避的であるためだと語る。彼のビジネスは最近、自社の AI システムを日本の企業に販売するために日本に事務所を設立しました。\n「プロセスとコンセンサスの文化が本当に物事を遅らせている組織があります」と彼は言います。 「特にクライアントが直面するあらゆる分野において、AI のミスに対する許容度はゼロに近い。機械に任せるよりも、役割を満たさないままにしておくことを好む人もいる。」\nXu氏は、米国の状況は大きく異なり、一部の企業ではすでにAIエージェントにはるかに自由に生産性を向上させることを許可していると述べた。 「米国では、AI の同僚がヘルパーとして入ってきて、徐々にワークフローの一部になっていきます。[米国の上司の] 態度は、多くの場合、試してみてから修正するというものです。」\n同氏は、日本企業がAIを十分に信頼して使用する前に、より多くの証拠が必要だと付け加えた。\n京都先端科学大学の国際経営学教授パリサ・ハギリアン氏も、多くの日本企業はリスクをあまりにも回避しすぎてAIに注目できないことに同意する。\n「AIを導入する際の課題は、日本企業に何らかの変化を導入する場合と同じです。これが、AIの使用が、特に職場において依然としてかなり限定的で慎重である理由です。」\nハギリアン氏はまた、これを米国のより起業家精神に富んだ文化と対比し、日本企業は誤り、不確実性、風評リスクに対して非常に敏感であると主張した。\n「生成型 AI はまだ完全に信頼できるわけではないため、（日本では）主に執筆、要約、情報収集などのリスクの低いタスクに使用されていますが、中核的な業務や意思決定、プロセス全体の改善にはあまり使用されていません」と彼女は言います。\n日本の医療分野はAIへの取り組みが特に遅れていると言われており、病院によっては患者ファイルを完全にデジタル化さえしていないところもある。 「紙の文書は驚くべき規模で蓄積されている」と日本の病院の職員の一人は匿名を条件に語る。 「石器時代のようだ。」\n日本政府はAIの導入率が低いという広範な問題を認識しており、より多くの企業にこのテクノロジーを導入してもらおうとしている。昨年、同国の議会の外で AI 推進法が可決されました。\nこれは、軽い規制を利用して企業の AI への投資を促進することを目的としています。東京都は、日本が「世界で最もAIの開発と活用に優しい国」となることを約束する。\n政府は、AIの利用拡大が日本の生産性向上に役立つと考えている。現在も先進国G7の中で最悪の水準が続いている。\n日本の財務省は、企業による AI の導入はすでに大幅に増加しており、現在では 75% の企業がこのテクノロジーを使用しており、5 年前の 11% から増加していると述べています。\nしかし、批評家たちは、これらの各企業で実際に AI を使用しているスタッフはほんの一部であり、使用しているスタッフも非常に限られた範囲でしか使用していない、と主張しています。\n日本の社会システムとテクノロジーの専門家である明治大学の小笠原泰教授は、労働力の中でテクノロジーに精通した人材が十分ではないと言う。\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "title": "Trump says Karoline Leavitt resigning as White House press secretary",
    "titleJa": "トランプ大統領、キャロライン・レビット氏がホワイトハウス報道官を辞任と発言",
    "summaryJa": "ドナルド・トランプ大統領は水曜日、キャロライン・レビット大統領報道官が8月末までにそのポストを離れると発表した。レビット氏の辞任は、5月1日の娘の誕生に伴い産休を経てホワイトハウスに復帰してから1カ月も経たないうちに発表された。",
    "bodyOriginal": "White House Press Secretary Karoline Leavitt will leave that post by the end of August, President Donald Trump said on Wednesday.\nLeavitt's departure was announced less than a month after she returned to the White House after having been on maternity leave for the birth of her daughter on May 1.\nLeavitt, 28, is resigning \"so she can spend more time with her beautiful young children and family, a decision I totally understand and respect!\" Trump said in a Truth Social post announcing her planned departure.\nThe president said that Leavitt will become \"one of my top outside advisors\" and work with the Republican Party to win the upcoming midterm elections in November.\nLeavitt, who has served as White House press secretary since Trump returned to the White House in January 2025, has two young children with her husband, real estate developer Nicholas Riccio.\nShe gave birth to her daughter, Viviana, on May 1, days after going on maternity leave.\nLeavitt returned to the White House for a press briefing on July 16.\nIn a post on X on Wednesday, Leavitt said, \"Being a mother and welcoming a new baby while working in one of the most demanding jobs in the world has been the most rewarding yet challenging season of my life, to say the least.\"\n\"The truth is since returning to the White House after the birth of my daughter, I have felt in my heart that I cannot be the best mom my two young children deserve while devoting the constant time, energy, and attention required of the White House Press Secretary — and that is why I have ultimately made the bittersweet decision to depart the White House and embark on a new chapter in my life,\" she wrote.\nLeavitt is the youngest White House press secretary ever.\nTrump had four White House press secretaries during his first term, from January 2017 to January 2021.\n— CNBC's Ryan Ruggiero contributed to this article",
    "bodyJa": "ドナルド・トランプ大統領は水曜日、キャロライン・レビット大統領報道官が8月末までにそのポストを離れると発表した。\nレビット氏の辞任は、5月1日の娘の誕生に伴い産休を経てホワイトハウスに復帰してから1カ月も経たないうちに発表された。\n28歳のリービット氏は「美しい幼い子供たちや家族とより多くの時間を過ごすため、その決断を私は完全に理解し、尊重します！」と辞任する。トランプ大統領は、辞任計画を発表する真実ソーシャルへの投稿でこう述べた。\n大統領は、レビット氏が「私の最高の外部顧問の一人」となり、11月に予定される中間選挙での勝利に向けて共和党と協力すると述べた。\n2025年1月にトランプ大統領がホワイトハウスに復帰して以来、ホワイトハウス報道官を務めているレビット氏には、不動産開発業者の夫ニコラス・リッチョ氏との間に2人の幼い子供がいる。\n彼女は産休に入った数日後の5月1日に娘のヴィヴィアナを出産した。\nレビット氏は7月16日に記者会見のためホワイトハウスに戻った。\n水曜日のX誌への投稿で、レビットさんは「世界で最も厳しい仕事の一つに就きながら母親となり、生まれたばかりの赤ちゃんを迎えることは、控えめに言っても私の人生で最もやりがいのある、しかし挑戦的な季節だった」と述べた。\n「実のところ、娘の出産後にホワイトハウスに戻って以来、私はホワイトハウス報道官に求められる絶え間ない時間、エネルギー、配慮を費やしながら、幼い二人の子供たちにとってふさわしい最高の母親にはなれない、と心の中で感じてきたのです。だからこそ私は最終的にホワイトハウスを去り、人生の新たな章に乗り出すという苦い決断を下したのです」と彼女は書いた。\nレビット氏はホワイトハウス報道官としては史上最年少である。\nトランプ大統領の1期目（2017年1月から2021年1月）には4人のホワイトハウス報道官がいた。\n— CNBC の Ryan Ruggiero がこの記事に寄稿しました",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;

    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
