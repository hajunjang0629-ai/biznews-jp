    "id": "u-s-reaffirms-grip-on-hormuz-blockade-tu-79706250",
    "title": "U.S. reaffirms grip on Hormuz blockade, turning away 55 ships as talks stall",
    "titleJa": "米国、ホルムズ封鎖の掌握を再確認、交渉が行き詰まり55隻の船舶を拒否",
    "summaryJa": "米軍は先週、海上封鎖下でさらに20隻の商船をイランの港から遠ざけ、ホルムズ海峡再開の合意が届かない中、海上圧力が緩まないことを示した。米中央軍は、日曜日の時点で米軍が8月2日時点の35隻から55隻の商船の航路を変更したと発表した。日曜の声明によると、米軍はまた、順守に耐えるため2隻の船舶を無力化し、2隻に乗船したという。",
    "bodyOriginal": "The U.S. military redirected 20 more commercial vessels away from Iranian ports last week under its naval blockade, signaling no let-up in maritime pressure as a deal to reopen the Strait of Hormuz stayed out of reach.\nU.S. Central Command said American forces had redirected 55 commercial vessels as of Sunday, up from 35 as of Aug. 2. American forces have also disabled 2 ships and boarded 2 to endure compliance, according to the statement on Sunday.\nThe escalating tally underscores how far the two sides remain from resolving a crisis that has choked the Strait of Hormuz for more than five months. The Strait of Hormuz carried about a quarter of the world's seaborne oil trade and a fifth of global liquefied natural gas before the war erupted in February.\nIranian Foreign Minister Abbas Araghchi said Sunday there was \"no possibility of restarting negotiations\" as long as the U.S. continues violating the June memorandum of understanding, without compensating for its \"violations,\" according to Tasnim News Agency, a semi-official news outlet associated with the Islamic Revolutionary Guard Corps.\n\"Intermediaries are still making efforts to find ways to resume negotiations,\" Araghchi said.\nU.S. President Donald Trump, who projected confidence that Washington and Tehran could soon strike a deal last week, told Axios that he is prepared to wait for economic distress to mount in Iran, backing away from a renewed military offensive.\n\"We are low keying it,\" Trump said, \"We are only semi-negotiating with them. We are just watching Iran with its huge inflation and the fact they have no money.\"\nThe president also posted a chart on Truth Social showing the plunging value of the Iranian rial between 2025 and now, with the title \"Iran has no money\" and \"currency is trash\" in text.\nIranian officials have set out sweeping demands to their American counterparts for reopening the Strait of Hormuz, including the U.S. lifting its naval blockade and sanctions, withdrawing American troops from the region, paying war reparations and releasing frozen Iranian assets.\nIran has also been in discussion with Oman to work out an agreement to define transit routes through the strait. The negotiations have progressed well and reached their final stage, Araghchi said, while insisting the deal would not reopen the waterway.\nOman confirmed that its talks with Tehran were progressing in \"a positive and constructive atmosphere,\" while calling for a halt to repeated attacks on vessels transiting the strait, to create space for diplomacy.\nIranian strikes in Hormuz and Houthi attacks in the Red Sea continued to keep shippers away from both routes. The United Arab Emirates said Saturday that Iran launched a missile on an oil tanker owned by the Abu Dhabi National Oil Company while it was attempting to transit the strait early Saturday.\nYemen's Iran-backed Houthi militia on Sunday claimed responsibility for an attack on a oil refinery in Saudi Arabia and equipment in Yemen's Red Sea port city of al-Makha.\nHardening terms\n\"There doesn't seem to be much of a compromise, which ultimately makes it more difficult to reach a sustainable deal,\" Warren Patterson, head of commodities strategy at ING Bank, said in a note last Friday.\nThe bank kept its forecast for Brent to average $80 a barrel this quarter, expecting flows to normalize through the third quarter, while flagging substantial \"risk and uncertainty\" to that baseline view.\nDespite progress in recent days, the tone of the rhetoric and deepening distrust between Washington and Tehran leave scope for renewed deterioration, Patterson said. \"Things could go from bad to worse once again.\"\nShipping traffic through the Strait of Hormuz has dwindled to just eight confirmed crossings last Friday, down 33% from the day before, according to shipping tracker Kpler.\nOil prices took a leg higher on Monday, with international benchmark Brent crude futures jumping nearly 1% to $84.22 a barrel, and U.S. West Texas Intermediate futures gaining 0.6% to $78.63.\nIranian state media published a draft plan last week that would restrict traffic through Hormuz, barring U.S. and Israeli ships from the strait and require compensation from hostile countries before allowing transit. The plan is under review by Iran's parliament, according to the state outlet Fars.\nTehran would impose penalties on violators equivalent to 20% of the value of cargo aboard a ship, according to the initial draft.",
    "bodyJa": "米軍は先週、海上封鎖下でさらに20隻の商船をイランの港から遠ざけ、ホルムズ海峡再開の合意が届かない中、海上圧力が緩まないことを示した。\n米中央軍は、日曜日の時点で米軍が8月2日時点の35隻から55隻の商船の航路を変更したと発表した。日曜の声明によると、米軍はまた、順守に耐えるため2隻の船舶を無力化し、2隻に乗船したという。\nこの集計のエスカレートは、ホルムズ海峡を５カ月以上にわたって閉塞させている危機の解決に両国がどれほど遠いかを浮き彫りにしている。 2月に戦争が勃発するまで、ホルムズ海峡は世界の海上石油貿易の約4分の1と世界の液化天然ガスの5分の1を運んでいた。\nイスラム革命防衛隊関連の半公式報道機関であるタスニム通信によりますと、イランのアッバス・アラグチ外相は日曜日、米国が「違反」を補償せずに6月の覚書に違反し続ける限り、「交渉再開の可能性はない」と述べた。\nアラグチ氏は「仲介業者は依然として交渉再開の方法を模索する努力を続けている」と述べた。\nドナルド・トランプ米大統領は先週、米国とイランが間もなく合意に達する可能性があると自信をのぞかせたが、新たな軍事攻撃からは距離を置き、イランの経済的苦境が高まるまで待つ用意があるとアクシオスに語った。\nトランプ大統領は「われわれは控えめにしている」とし、「われわれはイランと半ば交渉しているだけだ。われわれはイランの巨大なインフレと、彼らには金がないという事実をただ見ているだけだ」と語った。\n大統領はまた、「イランにはお金がない」「通貨はゴミだ」というタイトルで、2025年から現在までのイラン・リアル価値の急落を示すグラフをトゥルース・ソーシャルに投稿した。\nイラン当局者らは、ホルムズ海峡の再開に向けて、米国の海上封鎖と制裁の解除、同地域からの米軍撤退、戦争賠償金の支払い、凍結されたイラン資産の解放など、包括的な要求を米国側に打ち出した。\nイランはまた、海峡を通る通過ルートを定める協定をまとめるためにオマーンとも協議している。アラグチ氏は、交渉は順調に進んで最終段階に達していると述べたが、この協定では水路は再開されないと主張した。\nオマーンは、イランとの協議が「前向きかつ建設的な雰囲気」で進んでいることを確認する一方、外交の余地を作るために海峡を通過する船舶に対する度重なる攻撃の停止を求めた。\nホルムズでのイランによる攻撃と紅海でのフーシ派の攻撃により、引き続き荷主が両航路から遠ざかっている。アラブ首長国連邦は土曜日、イランが土曜日早朝に海峡を通過しようとしていたアブダビ国営石油会社所有のタンカーにミサイルを発射したと発表した。\nイエメンのイランが支援するフーシ派民兵組織は日曜日、サウジアラビアの製油所とイエメン紅海の港湾都市アルマハの設備への攻撃に対する犯行声明を出した。\n強化用語\nＩＮＧ銀行のコモディティ戦略部門責任者ウォーレン・パターソン氏は先週金曜日のメモで、「あまり妥協点はないようで、最終的には持続可能な合意に達することがより困難になる」と述べた。\n同銀行は今四半期のブレント原油の平均1バレル当たり80ドルという予測を据え置き、その基本的な見方にかなりの「リスクと不確実性」を残しつつ、第3四半期までは流れが正常化すると予想した。\nパターソン氏は、ここ数日の進展にもかかわらず、米国とイランの間のレトリックの口調と深まっている不信感により、新たな悪化の余地が残されていると述べた。 「事態は再び悪化する可能性がある。」\n船舶追跡業者Kplerによると、ホルムズ海峡を通過する船舶の交通量は、先週金曜日に確認された通過数はわずか8ヶ所に減少し、前日比33％減少したという。\n月曜日の原油価格は大幅に上昇し、国際ベンチマークであるブレント原油先物は1%近く上昇して1バレルあたり84.22ドルとなり、米国ウェスト・テキサス・インターミディエイト先物は0.6%上昇して78.63ドルとなった。\nイラン国営メディアは先週、ホルムズ経由の航行を制限し、米国とイスラエルの船舶の同海峡への出入りを禁止し、通航を許可する前に敵対国に補償を求める内容の計画草案を公表した。国営放送ファルス紙によると、この計画はイラン議会で検討中である。\n当初の草案によれば、イラン政府は違反者に対し、船舶に積まれた貨物の価値の20％に相当する罰金を課すことになる。",

    "summaryJa": "ホルムズ海峡開放に向けた両国間の合意がすぐには実現しないかもしれないとの懸念の中、トレーダーらが米国とイランからのさまざまなシグナルを評価し続けているため、月曜早朝の原油価格は上昇した。国際指標となるブレント原油先物（１０月渡し）は１．０９％上昇し、１バレル＝８４．４６ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は０．８４％上昇し、１バレル＝７８．８４ドルとなった。",
    "bodyOriginal": "Oil rose early Monday, as traders continue to assess mixed signals from the U.S. and Iran amid worries that a deal between both countries to open the Strait of Hormuz may not be anytime soon.\nFutures for international benchmark Brent crude for October delivery gained 1.09% to $84.46 a barrel. U.S. West Texas Intermediate futures for September advanced 0.84% to $78.84 per barrel.\nIranian Foreign Minister Abbas Araghchi said that Tehran is not currently in direct talks with the U.S. to end the war with Iran and open the Strait of Hormuz, while Washington earlier asserted that a deal is near.\nIn addition, Iran has asked the U.S. for compensation as a condition to reopen the crucial waterway, according to a report by media outlet Independent. The Strait of Hormuz will remain shut until the U.S. meets six conditions, including ending the war and aggression against Iran and its allies, Mohammad Bagher Zolghadr, the head of Iran's supreme national security council, reportedly said.\nHowever, the U.S. maintains that any reopening must preserve unrestricted freedom of navigation without Iranian approvals, tolls, or controls, disputing key elements of the reported arranged, according to Citi. \"Risks remain elevated outside Hormuz too, with Houthi groups in Yemen continuing attacks and threats against Saudi-linked shipping in the Red Sea and around Bab el Mandeb,\" it added.\n\"Uncertainty remains high as we go into the sixth month of the Iran war,\" Westpac said in a note. \"The Strait of Hormuz remains effectively closed and the entry of the Yemen Houthis into the fray is interrupting alternative Red Sea supply routes,\" it added.\n—CNBC's Garrett Downs contributed to the report.",
    "bodyJa": "ホルムズ海峡開放に向けた両国間の合意がすぐには実現しないかもしれないとの懸念の中、トレーダーらが米国とイランからのさまざまなシグナルを評価し続けているため、月曜早朝の原油価格は上昇した。\n国際指標となるブレント原油先物（１０月渡し）は１．０９％上昇し、１バレル＝８４．４６ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は０．８４％上昇し、１バレル＝７８．８４ドルとなった。\nイランのアッバス・アラグシ外務大臣は、イランとの戦争の終結とホルムズ海峡の開放に向けてイランは現在米国と直接交渉を行っていないと述べたが、米国政府は先に合意が近いと主張した。\nさらに、メディア「インディペンデント」の報道によると、イランは米国に対し、重要な水路を再開する条件として補償を求めた。イラン最高国家安全保障会議の議長であるモハマド・バガー・ゾルガドル氏は、米国が戦争とイランとその同盟国に対する侵略の終結を含む6つの条件を満たすまで、ホルムズ海峡は閉鎖されたままだと述べたと伝えられている。\nしかし、シティによると、米国は、再開にはイランの承認、通行料、規制なしに無制限の航行の自由を維持しなければならないと主張し、報告された取り決めの重要な要素に異議を唱えている。さらに、「ホルムズ以外でもリスクは依然高まっており、イエメンのフーシ派は紅海やバブ・エル・マンデブ周辺でサウジ関連の船舶に対する攻撃や脅迫を続けている」と付け加えた。\nウエストパック氏はメモの中で「イラン戦争が６カ月を迎える今でも不確実性は依然として高い」と述べた。さらに、「ホルムズ海峡は事実上閉鎖されたままであり、イエメンのフーシ派の参戦により紅海の代替補給ルートが遮断されている」と付け加えた。\n—CNBCのギャレット・ダウンズ氏がこのレポートに貢献しました。",

    "id": "could-your-tattoo-stop-you-from-getting-be4ba93b",
    "title": "Could your tattoo stop you from getting a job?",
    "titleJa": "タトゥーのせいで仕事に就けなくなる可能性はありますか?",
    "summaryJa": "タトゥーのせいで仕事に就けなくなる可能性はありますか?- 公開されました",
    "bodyOriginal": "Could your tattoo stop you from getting a job?\n- Published\nTattoos have been in the cultural mainstream for years. Even the prime minister has got one (a bee, on his bicep).\nAnd there are no signs the trend is starting to fade. More people than ever are going under the needle as a form of self-expression: 40% of British 25-49 year-olds have at least one tattoo, according to a 2024 YouGov poll.\nThe most popular body part to be inked? The upper arm, says YouGov.\nBut has that acceptance carried over into the workplace?\n'I don't think it's totally accepted'\nSociologist Dr Michael Rees says a big gulf in social acceptability remains between visible and non-visible tattoos, particularly those on hands, neck and face as opposed to the rest of the body.\n\"I don't think it's completely accepted, and I think there's probably limits to that.\"\nWhile Rees himself has his hands and neck inked, he didn't get either done until he got his first permanent job as an academic.\n\"Even working in the career I work in, I was concerned that it may harm my job prospects.\n\"I think people getting tattooed in those areas are potentially restricting the careers that they go into.\"\nThis is borne out by 2022 YouGov research, which found that while about two-thirds of people consider visible tattoos on the face or neck unprofessional, a similar proportion would think other visible tattoos are professional.\nDr Alyssa Grocutt, who is herself heavily tattooed, explored perceptions of tattoos in the workplace for her PhD at the University of Calgary in Canada, and found many stereotypes around tattooed people still exist today, both positive and negative.\nPerhaps unsurprisingly, people with intimidating tattoos – in this study, a skull and a knife – were perceived as risky, while those with \"friendly\" tattoos of a rose and some leaves were perceived as more creative and artistic.\nOverall, job applicants with visible tattoos are still slightly less likely to be hired than those without, she says.\nBut for entrepreneurs, or those working in creative industries, Grocutt suggests they may be viewed as an extension of someone's personal brand.\n\"Even 11 years ago, when I started getting tattooed, the hands, neck and face were called 'job stoppers', and a lot of artists wouldn't tattoo people in those areas,\" she says.\n\"I think it's shifting a bit or maybe tattoo artists don't want to be gatekeepers. There's more positive perceptions now, [but] you still get a lot more attention, and that's an adjustment to get used to.\"\nFrom counterculture to mainstream\nFor centuries, tattoos were firmly linked to criminal gangs and sailors and, more recently, counter-cultural movements such as punk and motorbike clubs.\nBut since the early 2000s, tattoos have been steadily \"demystified\" through a combination of celebrities and popular TV shows such as Tattoo Fixers and London Ink, says Rees.\n\"When I got my first tattoos in the late '90s... they were outside of the mainstream. But they are everywhere now.\"\nEvery tattooed person he interviewed in the 2000s for his research cited David Beckham as their inspiration; the footballer made a statement when he got his first inking in 1999. Now, celebs like Harry Styles and Ed Sheeran are covered in tattoos, with more than 50 each.\n'A more affordable way of becoming an art collector'\nTattoo artist Martha Smith thinks stigma has \"changed massively\", with tattoos no longer seen as associated with criminality or class discrimination.\nAnd new trends are emerging too. Smith, who is based in Broadstairs, Kent, specialises in fine line and dot work tattoos. The hashtag #finelinetattoo has racked up 10.3m searches on Instagram, while #dotworktattoo boasts 4.8m searches.\n\"Probably until the early noughties, there was a very specific person who thought they could be tattooed. But in the 13 years I've been tattooing, clients have certainly become more diverse,\" Smith says, adding that she quite often tattoos NHS workers, social workers or teachers.\nCatherine Hibbert, 44, waited almost 20 years to get her first tattoo. She now plans to get one every year of her forties.\n\"I was a bit nervous when I went for my first one,\" she says. \"I was scared of it being painful, or that I was making the wrong decision.\nBut as soon as the tattoo template was on, Hibbert says she \"instantly loved it\".\n\"I guess it's an adrenaline rush, but I'm on a high for days after.\"\nHer forearm tattoo comprises geometric shapes symbolising different members and aspects of her family.\n\"They've all got meaning, and I like the fact that I can design them myself,\" says Hibbert, who works in an art gallery.\nSmith thinks tattooists themselves now come from a much broader artistic background.\n\"You now often go to a tattooist because of their artwork. This massively opens up the kind of person that would want a tattoo and what a tattoo can mean. It also is a more affordable way of becoming an art collector.\"\nThis chimes with how Hibbert feels.\n\"Everybody loves my arm tattoo,\" she says. \"I think it's because it's quite unusual from what lots of people expect a tattoo to look like… this is very delicate.\"\nThe value of authenticity\nOf all the factors behind tattoos' popularity, authenticity is the one Rees thinks trumps them all – because, he says, it is something we really value culturally.\n\"A lot of my respondents thought that was something that a tattoo gave them, a commitment to a band or to a person, to [addiction] recovery, just to kind of [being] who they really were.\"\nOf course, the elephant in the room is regret. Tattoos are permanent, and critics suggest that as these generations age they may no longer like the inkings they chose decades previously.\nBut Hibbert says that is not a concern for her.\n\"They're like a story, so it's memories and it's stories about me and my life.\"\nGet in touch\nDo you have tattoos? Have you experienced any issues finding employment?\nRelated topics\n- Published18 July\n- Published4 March\n- Published5 days ago",
    "bodyJa": "タトゥーのせいで仕事に就けなくなる可能性はありますか?\n- 公開されました\nタトゥーは長年にわたり文化の主流となってきました。首相さえも持っています（上腕二頭筋にハチ）。\nそして、この傾向が衰え始める兆候はありません。 2024 年の YouGov 世論調査によると、自己表現の手段としてタトゥーを入れる人がこれまで以上に増えています。2024 年の YouGov 世論調査によると、英国の 25 ～ 49 歳の 40% が少なくとも 1 つのタトゥーを入れています。\nインクを塗るのに最も人気のある体の部位は何ですか? YouGovによれば、上腕だという。\nしかし、その受け入れは職場にも受け継がれているでしょうか?\n「全面的に受け入れられるとは思えない」\n社会学者のマイケル・リース博士は、目に見えるタトゥーと目に見えないタトゥー、特に体の他の部分と対照的に手、首、顔のタトゥーの間には、社会的受容性において大きな隔たりが残っていると述べている。\n「それが完全に受け入れられているわけではないと思いますし、おそらくそれには限界があると思います。」\nリース自身も手と首に墨を入れているが、学者としての最初の定職に就くまでは、どちらもできなかった。\n「今のようなキャリアで働いていても、それが自分の仕事の見通しに悪影響を与えるのではないかと心配していました。\n「これらの領域にタトゥーを入れる人々は、潜在的に彼らのキャリアを制限していると思います。」\nこれは、2022年のYouGov調査によって裏付けられており、約3分の2の人が顔や首の目に見えるタトゥーはプロフェッショナルではないと考えているが、同様の割合が他の目に見えるタトゥーはプロフェッショナルだと考えていることが判明した。\n自身もタトゥーを深く入れているアリッサ・グロカット博士は、カナダのカルガリー大学で博士号を取得するために職場でのタトゥーに対する認識を調査し、タトゥーを入れた人々について肯定的であれ否定的であれ、多くの固定観念が今でも存在していることを発見した。\n当然のことかもしれませんが、威圧的なタトゥー (この研究では頭蓋骨とナイフ) を入れている人は危険であると認識され、一方、バラやいくつかの葉っぱの「フレンドリーな」タトゥーを入れている人は、より創造的で芸術的であると認識されました。\n全体として、目に見えるタトゥーのある求職者は、そうでない求職者に比べて採用される可能性がまだわずかに低い、と彼女は言う。\nしかし、起業家やクリエイティブな業界で働いている人たちにとっては、誰かの個人的なブランドの延長としてみなされる可能性があるとグロカット氏は示唆する。\n「私がタトゥーを入れ始めた11年前でさえ、手、首、顔は『ジョブストッパー』と呼ばれていて、多くのアーティストはその部分にタトゥーを入れませんでした」と彼女は言う。\n「状況が少し変わってきているのか、それともタトゥーアーティストが門番になりたくないのかもしれないと思います。今ではよりポジティブな認識が広がっていますが、それでも注目されることは多く、それは慣れるための調整です。」\nカウンターカルチャーからメインストリームへ\n何世紀にもわたって、タトゥーは犯罪組織や船員、そして最近ではパンクやバイククラブなどの反文化運動としっかりと結びついていました。\nしかし、2000年代初頭以降、セレブとタトゥー・フィクサーズやロンドン・インクなどの人気テレビ番組の組み合わせによって、タトゥーは着実に「謎が解かれ」てきた、とリース氏は言う。\n「90年代後半に私が初めてタトゥーを入れたとき...それらは主流から外れていました。しかし、彼らは今どこにでもいます。」\n2000年代に調査のためにインタビューしたタトゥーを入れた人々は皆、インスピレーションの源としてデヴィッド・ベッカムを挙げた。サッカー選手は1999年に初めてタトゥーを入れた際にこう声明を発表した。現在、ハリー・スタイルズやエド・シーランのようなセレブたちはタトゥーで覆われており、それぞれ50以上のタトゥーが入っている。\n「アートコレクターになるためのより手頃な方法」\nタトゥーアーティストのマーサ・スミスさんは、タトゥーが犯罪や階級差別と結びつけられなくなり、偏見が「大きく変わった」と考えている。\nそして新たなトレンドも生まれています。ケント州ブロードステアーズに拠点を置くスミスは、細い線とドットワークのタトゥーを専門としています。ハッシュタグ #finelinetattoo は Instagram で 1,030 万回の検索を記録し、#dotworktattoo は 480 万回の検索を記録しています。\n「おそらく1990年代初頭までは、タトゥーを入れることができると考える非常に特定の人が存在していました。しかし、私がタトゥーを入れてきた13年間で、クライアントは確実に多様化しました」とスミスさんは言い、NHS職員、ソーシャルワーカー、教師にタトゥーを入れることが非常に多いと付け加えた。\nキャサリン・ヒバートさん（44）は、最初のタトゥーを入れるまで約20年待ちました。彼女は現在、40代になると毎年それを取得することを計画しています。\n「初めての撮影に行ったときは少し緊張しました」と彼女は言います。 「痛いのではないか、間違った決断をしているのではないかと怖かったのです。\nしかし、タトゥーのテンプレートを装着するとすぐに、ヒバートさんは「すぐに気に入った」という。\n「アドレナリンが出ているのだと思いますが、その後何日もハイな状態が続きます。」\n彼女の前腕のタトゥーは、家族のさまざまなメンバーや側面を象徴する幾何学的な形で構成されています。\n「それらにはすべて意味があり、自分でデザインできるという事実が気に入っています」とアートギャラリーで働くヒバートは言います。\nスミス氏は、タトゥーイスト自身が今でははるかに幅広い芸術的背景を持っていると考えている。\n「今では、彼らのアートワークのためにタトゥーイストのところに行くことがよくあります。これにより、タトゥーを入れたいと思う人の種類や、タトゥーが何を意味するのかが大きく広がります。また、アートコレクターになるためのより手頃な方法でもあります。」\nこれはヒバートの気持ちと一致します。\n「みんな私の腕のタトゥーが大好きなんです」と彼女は言う。 「それは、多くの人がタトゥーに期待するものとはかなり異なっているからだと思います…これは非常にデリケートなことです。」\n本物であることの価値\nタトゥーの人気の背後にあるすべての要素の中で、信頼性がすべてに勝るものだとリース氏は考えています。なぜなら、それは私たちが文化的に本当に大切にしているものだからだと、彼は言います。\n「私の回答者の多くは、タトゥーが自分たちに与えてくれるもの、バンドや個人へのコミットメント、[依存症]の回復、そして自分が本当の自分であることのようなものだと考えていました。」\nもちろん、部屋の象は残念です。タトゥーは永久的なものであり、批評家らは、これらの世代が年齢を重ねるにつれて、何十年も前に選んだタトゥーが気に入らなくなる可能性があると示唆しています。\nしかしヒバートさんは、それは彼女にとっては心配ではないと言う。\n「それらは物語のようなもので、思い出であり、私と私の人生についての物語です。」\n連絡する\nタトゥーはありますか？就職に関して何か問題を感じたことはありますか?\n関連トピック\n- 7 月 18 日発行\n- 3 月 4 日発行\n- 5 日前に公開",

    "id": "you-could-be-missing-out-on-150-off-your-b18752cb",
    "title": "You could be missing out on £150 off your energy bill - here's how to check",
    "titleJa": "光熱費から 150 ポンド割引されるチャンスを逃している可能性があります - 確認方法は次のとおりです",
    "summaryJa": "光熱費から 150 ポンド割引されるチャンスを逃している可能性があります - 確認方法は次のとおりです- 公開されました",
    "bodyOriginal": "You could be missing out on £150 off your energy bill - here's how to check\n- Published\nOne call to your energy supplier to ensure your name is on the electricity bill may mean you are in line for a £150 discount this winter – but you need to get in before the deadline.\nWhile the cost of heating your home might not be at the forefront of your mind during the long, hot summer prices are set to rise again this winter.\nSuppliers use customers' records as of Sunday 23 August to check who is eligible for the Warm Home Discount.\nThe government scheme knocks £150 off bills if you are on means-tested benefits such as universal credit.\nHousehold energy could get more expensive\nMillions of people will learn of the level of winter energy prices later this month, when Ofgem announces the quarterly price cap for the three months from October.\nTo help those who might struggle to pay, energy companies distribute the £150 Warm Home Discount to about six million households in the winter. Households in receipt of housing benefit, income-related Employment and Support Allowance, Pension Credit and universal credit qualify.\nHouseholds who are eligible should get the discount automatically, provided their supplier has over 1,000 customers.\nHowever, that only happens if your name is on the bill and you are receiving one of these benefits. It can also help suppliers offer better support, such as repayment plans, to those who have energy debt.\nSomeone might not be named on their electricity bill if they have recently moved house.\nEligible customers on pre-payment meters who use a key or card to top up will also need to ensure that their household's account is registered in their name.\n\"If you know someone who might benefit, please start spreading the word and encourage them to check they are named on their energy bill,\" said Energy Secretary Miatta Fahnbulleh.\nThe government also said that 345,000 Scottish low-income households would now automatically receive the rebate in the winter, bringing Scotland's policy in line with England and Wales.\nPreviously, eligible Scottish households have had to apply for the scheme.",
    "bodyJa": "光熱費から 150 ポンド割引されるチャンスを逃している可能性があります - 確認方法は次のとおりです\n- 公開されました\n電力会社に電話して、電気料金請求書にあなたの名前が記載されていることを確認するだけで、この冬は 150 ポンドの割引を受けることができるかもしれません。ただし、締め切り前に参加する必要があります。\n長く暑い夏には暖房費のことはあまり気にならないかもしれませんが、この冬は暖房費が再び上昇する見込みです。\nサプライヤーは、8 月 23 日日曜日の時点での顧客の記録を使用して、誰が Warm Home 割引の対象となるかを確認します。\n政府の制度では、ユニバーサルクレジットなどの資力調査型給付金を利用している場合、請求書が 150 ポンド割引されます。\n家庭用エネルギーはさらに高価になる可能性がある\n今月末、Ofgem が 10 月から 3 か月間の四半期ごとの価格上限を発表する際に、何百万人もの人々が冬のエネルギー価格の水準を知ることになるでしょう。\n支払いが困難な人々を支援するために、エネルギー会社は冬に約 600 万世帯に 150 ポンドの「暖かい家割引」を配布しています。住宅手当、収入関連の雇用・扶養手当、年金クレジット、ユニバーサルクレジットを受給している世帯が対象となります。\nサプライヤーの顧客が 1,000 人を超えている場合、対象となる世帯は自動的に割引を受けられます。\nただし、それはあなたの名前が請求書に記載されており、これらの特典のいずれかを受け取っている場合にのみ発生します。また、供給業者がエネルギー負債を抱えている人々に対して返済計画など、より良いサポートを提供するのにも役立ちます。\n最近引っ越したばかりの場合、電気料金請求書に名前が記載されていない可能性があります。\nキーまたはカードを使用してチャージする前払いメーターの資格のある顧客は、世帯の口座が自分の名前で登録されていることを確認する必要もあります。\nミアッタ・ファーンブッレ・エネルギー長官は、「恩恵を受ける可能性のある人を知っている場合は、情報を広め始め、その人が光熱費請求書に記載されているかどうかを確認するよう奨励してください」と述べた。\n政府はまた、スコットランドの低所得世帯34万5,000世帯が冬季に自動的にリベートを受け取ることになり、スコットランドの政策はイングランドやウェールズと歩調を合わせることになると発表した。\nこれまでは、対象となるスコットランドの世帯はこの制度に申請する必要があった。",

    "id": "max-miller-stays-in-ohio-house-race-as-g-a108371a",
    "title": "Max Miller stays in Ohio House race as GOP ballot deadline passes",
    "titleJa": "マックス・ミラー氏、共和党の投票締め切りが過ぎてもオハイオ州下院選挙に残留",
    "summaryJa": "オハイオ州の共和党マックス・ミラー下院議員は、共和党議員らから再選を取り下げるよう求める声が高まっているにもかかわらず、共和党が彼に代わる候補者とする重要な期限を過ぎた後、再選レースに残ることになった。オハイオ州の法律では、共和党は月曜午後４時までの期限を設けている。後任の候補者を指名します。しかし、どちらを選ぶかを担当する地元の共和党幹部は会合の少なくとも2日前までに通知を受ける必要があり、党が時間内に手続きを完了するにはミラー氏が土曜日までに撤退する必要があることを意味する。彼はそうしませんでした。",
    "bodyOriginal": "Republican Rep. Max Miller of Ohio will remain in his reelection race, after a key deadline passed for the GOP to replace him as its nominee, despite mounting calls from fellow Republicans for him to drop his reelection bid.\nUnder Ohio law, Republicans have until Monday at 4 p.m. to name a replacement nominee. But the local Republican officials responsible for choosing one must receive at least two days' notice before meeting, meaning Miller would have needed to withdraw by Saturday for the party to complete the process in time. He did not.\nMiller has now effectively missed the deadline, but could still withdraw and have his name removed from the ballot. Republicans would then be left without a nominee in Ohio's 7th Congressional District.\nMiller's spokesperson did not immediately respond to a request for comment.\nThe deadline passed after a week of escalating Republican pressure on Miller to step aside over claims from his ex-wife, Emily Moreno, that he physically abused her and their young daughter. Miller has denied the allegations.\nMiller's father-in-law, Republican Sen. Bernie Moreno of Ohio, called the incumbent \"a danger\" last weekend and urged him to resign. Republican Sen. Jon Husted of Ohio later joined calls for Miller to leave office and end his campaign.\nPresident Donald Trump and House Speaker Mike Johnson, R-La., have stood by Miller.\nThe House Ethics Committee opened an investigation last week into whether Miller may have engaged in domestic violence and abuse or illegal drug use after Miller asked the panel to investigate him.\nMiller is now positioned to face Democrat Brian Poindexter in November in a district that had been considered reliably Republican, as the GOP fights to preserve its narrow House majority.",
    "bodyJa": "オハイオ州の共和党マックス・ミラー下院議員は、共和党議員らから再選を取り下げるよう求める声が高まっているにもかかわらず、共和党が彼に代わる候補者とする重要な期限を過ぎた後、再選レースに残ることになった。\nオハイオ州の法律では、共和党は月曜午後４時までの期限を設けている。後任の候補者を指名します。しかし、どちらを選ぶかを担当する地元の共和党幹部は会合の少なくとも2日前までに通知を受ける必要があり、党が時間内に手続きを完了するにはミラー氏が土曜日までに撤退する必要があることを意味する。彼はそうしませんでした。\nミラー氏は事実上期限を過ぎてしまったが、それでも撤退して投票用紙から名前が削除される可能性はある。そうなると、共和党はオハイオ州第7選挙区で候補者がいなくなることになる。\nミラー氏の広報担当者はコメントの要請に応じなかった。\n元妻エミリー・モレノさんからミラーさんと幼い娘への身体的虐待の主張をめぐって、共和党がミラー氏への辞任を求める圧力を強める１週間を経て、期限は過ぎた。ミラー氏は容疑を否認している。\nミラー氏の義父である共和党バーニー・モレノ上院議員（オハイオ州）は先週末、現職を「危険」と呼び、辞任を促した。オハイオ州の共和党上院議員ジョン・ハステッドもその後、ミラー氏の退陣と選挙運動の終了を求める要求に加わった。\nドナルド・トランプ大統領とマイク・ジョンソン下院議長（共和党、ルイジアナ州）はミラー氏を支持した。\n下院倫理委員会は先週、ミラー氏が委員会に調査を依頼したことを受け、ミラー氏が家庭内暴力や虐待、違法薬物使用に関与した可能性があるかどうか調査を開始した。\n共和党が僅差の下院過半数を維持しようと奮闘する中、ミラー氏は現在、共和党が確実視されていた選挙区で11月に民主党のブライアン・ポインデクスター氏と対戦する立場にある。",

    "id": "ocasio-cortez-hasn-t-ruled-out-running-f-d5715c0a",
    "title": "Ocasio-Cortez hasn't 'ruled out' running for president or Senate in 2028",
    "titleJa": "オカシオコルテス氏は2028年の大統領または上院選に立候補する可能性を「排除していない」",
    "summaryJa": "アレクサンドリア・オカシオコルテス下院議員は日曜日、全米の中間予備選で民主党左派の勢力が急上昇する中、2028年の大統領選への出馬を「排除していない」と述べた。オカシオ＝コルテス氏はABC番組「ディス・ウィーク」への出演の可能性について問われ、「可能性を排除したわけではないが、膨大な量の支援に非常に恐縮している」と語った。 「私たちには、個人の願望ではなく、中間選挙に焦点を当て続ける責任があると思います。」",
    "bodyOriginal": "Rep. Alexandria Ocasio-Cortez said Sunday she has not \"ruled out\" a run for president in 2028 as the Democratic Party's left flank surges in midterm primaries across the country.\n\"I haven't ruled out the possibility, and I'm very humbled [by] the tremendous amount of support out there,\" Ocasio-Cortez said when asked about a potential run on ABC's \"This Week.\" \"I think that we have a responsibility to remain focused on the midterms and not on our individual aspirations.\"\nThe New York Democrat, who has represented parts of the Bronx and Queens since 2019, has emerged as a polling favorite in key states ahead of the 2026 midterms. She has also become a power broker on the left, criss-crossing the country with Sen. Bernie Sanders, I-Vt., who came up short in the last two presidential primaries.\nA recent poll from the University of New Hampshire found Ocasio-Cortez leading the field in the Granite State, ahead of former Transportation Secretary Pete Buttigieg and Sen. Mark Kelly, D-Ariz.\nOcasio-Cortez also did not rule out a potential run for Senate in 2028, when Senate Minority Leader Chuck Schumer, D-N.Y., is up for reelection.\n\"I think that anything is possible at this juncture,\" she said.",
    "bodyJa": "アレクサンドリア・オカシオコルテス下院議員は日曜日、全米の中間予備選で民主党左派の勢力が急上昇する中、2028年の大統領選への出馬を「排除していない」と述べた。\nオカシオ＝コルテス氏はABC番組「ディス・ウィーク」への出演の可能性について問われ、「可能性を排除したわけではないが、膨大な量の支援に非常に恐縮している」と語った。 「私たちには、個人の願望ではなく、中間選挙に焦点を当て続ける責任があると思います。」\n2019年からブロンクス区とクイーンズの一部を代表してきたニューヨーク州民主党は、2026年の中間選挙を前に主要州で人気の支持者として浮上している。彼女はまた、過去2回の大統領予備選で惜しくも及ばなかったバーニー・サンダース上院議員（バーニー州、バーモント州）とともに国中を駆け巡る左派の権力仲介者となった。\nニューハンプシャー大学の最近の世論調査では、花崗岩州ではオカシオコルテス氏がピート・ブティジェッジ元運輸長官やマーク・ケリー上院議員（民主党、アリゾナ州）を抑えてリードしていることが判明した。\nオカシオコルテス氏はまた、上院少数党院内総務チャック・シューマー氏（民主党、ニューヨーク州）が再選される2028年の上院選に立候補する可能性も排除しなかった。\n「現時点ではあらゆることが可能だと思います」と彼女は語った。",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/08/09/ocasio-cortez-hasnt-ruled-out-running-for-president-or-senate-in-2028.html",
    "publishedAt": "2026-08-09T14:45:17+00:00",

  {
    "id": "s-p-500-sales-growth-is-at-a-nearly-5-ye-45c0b0a2",
    "title": "S&P 500 sales growth is at a nearly 5-year high. Here’s what’s behind the surge.",
    "titleJa": "S&P500種の売上高の伸びはここ5年近くで最高となっている。急増の背後にあるものは次のとおりです。",
    "summaryJa": "S&P 500 指数に含まれるエネルギー企業は第 2 四半期に 42.5% の収益増加を記録し、同指数の売上高を押し上げています。",

    "bodyJa": "S&P 500 指数に含まれるエネルギー企業は第 2 四半期に 42.5% の収益増加を記録し、同指数の売上高を押し上げています。",
    "source": "MarketWatch",
    "sourceUrl": "https://www.marketwatch.com/story/s-p-500-sales-growth-is-at-a-nearly-5-year-high-heres-whats-behind-the-surge-a4ccf06d?mod=mw_rss_topstories",

  {
    "id": "abel-puts-a-big-chunk-of-berkshire-s-cas-64f83725",
    "title": "Abel puts a big chunk of Berkshire's cash to work",
    "titleJa": "アベルはバークシャーの多額の資金を投入している",
    "summaryJa": "(これはウォーレン・バフェット・ウォッチのニュースレター、ウォーレン・バフェットとバークシャー・ハサウェイに関するニュースと分析です。ここからサインアップすると、毎週金曜日の夜に受信箱で受け取ることができます。)アベルはバークシャーの多額の資金を投入している",
    "bodyOriginal": "(This is the Warren Buffett Watch newsletter, news and analysis on all things Warren Buffett and Berkshire Hathaway. You can sign up here to receive it every Friday evening in your inbox.)\nAbel puts a big chunk of Berkshire's cash to work\nIn his second quarter as the new CEO of Berkshire Hathaway, Greg Abel did some serious spending.\nAs a result, the company's still huge cash reserves declined significantly for the first time since early 2022.\nSaturday morning's financial report for the three months ending June 30 shows Berkshire had $365.5 billion on hand, a reduction of 8.0% from its record high $397.4 billion as of March 31.\nExcluding BNSF's cash and adjusting for Treasury bills purchased but not yet paid for, a metric favored by Berkshire, the company's cash declined 3.8% to $359.2 billion.\nPart of that spending was for $4.5 billion of Berkshire share buybacks.\nThe repurchasing came in below the low end of Barron's rough estimate of $5 billion to $11 billion and is less than UBS analyst Brian Meredith's $8.5 billion forecast.\nBut it is still significantly more than the $235 million Berkshire spent during the first quarter, and that was the first time it did any buybacks at all since 2024.\nCFRA Research's Cathy Seifert tells Bloomberg, \"People are going to be encouraged by the buybacks. It's also Greg's way of taking the helm and asserting himself.\"\nGabelli Funds portfolio manager Macrae Sykes is also positive on the move, telling CNBC, \"Material repurchases provide confidence for shareholders that some of the best corporate capital allocators see current value.\"\nAnd the buying may have continued. By comparing Berkshire's outstanding shares as of July 29, as shown in its Q2 report, to its shares as of June 30, Barron's now estimates Berkshire spent another $3.4 billion on buybacks in July.\nMuch of that presumably came before the stock's rally near the end of the month.\nAbel wasn't just spending money on Berkshire shares.\nIn another major change, Berkshire bought more equities than it sold overall, for a net increase of $20 billion. That would also include the $10 billion investment in Alphabet, Google's parent, that was announced in June.\nIt had been a net seller for the past 14 quarters.\nWe'll find out exactly what Berkshire was buying and selling when it releases its Q2 portfolio snapshot in the coming week.\nMore bullish news: strong operating earnings\nInvestors will also like most of Berkshire's operating earnings for the second quarter.\nOverall, they increased 16% to $12.98 billion with strong numbers from Berkshire Hathaway Energy (up 27%) and the BNSF railroad (up 6%).\nManufacturing, service, and retail earnings increased 24% to almost $4.5 billion.\nInsurance, however, wasn't as good, with underwriting earnings falling 13% and insurance investment income dropping 9%.\nGEICO was a particularly weak spot, with underwriting profits falling 45%.\nGabelli's Sykes, however, remains encouraged. \"Despite more difficult insurance industry back-drop, the company continues to build shareholder net worth in Greg Abel's first year as CEO.\"\nDaVita trim isn't the result of big moves in the stock\nBerkshire Hathaway trimmed its position in DaVita a few days before shares of the dialysis provider gave back a chunk of their sizable year-to-date gains.\nThe sale, however, didn't have anything to do with the 23% plunge in DaVita's stock price for the week after its Tuesday Q2 earnings report revealed a decline in revenue per treatment as patients drop out of Obamacare plans due to terminations of pandemic subsidies.\nUnder a 2024 agreement with DaVita in which Berkshire agreed to keep its stake in the company at 45% or lower, DaVita is required to buy back enough shares from Berkshire once a quarter to counter any reduction in DaVita's outstanding shares due to repurchases.\nDaVita's outstanding shares decreased by just 400,000 in its second quarter, so Berkshire's holding was reduced by just under 183,000 shares, making its remaining 28.7 million shares, valued at almost $5.3 billion, a 45.0% stake.\nBerkshire received $36.5 million for the shares, which is a very small amount by the company's standards, so the price per share isn't very important.\nIt is interesting to note, however, that on July 31, the day of the transaction, DaVita closed at just over $240.\nAccording to the Berkshire filing, however, it got just under $200 per share.\nThat's because the agreement stipulates the per share price is the \"volume-weighted average per share price\" of DaVita's public buybacks during the quarter.\nBerkshire still came out a little bit ahead, however, as the stock is now trading just under $184.\nAnd, looking at the bigger picture, even with this week's drop, DaVita is still up almost 62% so far this year.\nBUFFETT & BERKSHIRE AROUND THE INTERNET\nSome links may require a subscription:\n- Yahoo Finance: Warren Buffett's Berkshire Hathaway stock shows investors warming to Greg Abel's leadership\n- The Wall Street Journal: BNSF Railway Says Regulators Should Deny Big Rail Merger Now\nHIGHLIGHTS FROM CNBC'S BUFFETT ARCHIVE\n'We really feel the fairer, the better' (1996)\nWarren Buffett explains why he doesn't think \"the higher, the better,\" when it comes to Berkshire Hathaway's stock price.\nWARREN BUFFETT: Most managements feel that the — on the price of their shares — that the higher, the better. And that's an understandable feeling. But the trouble is the game isn't over at any time.\nWe really feel the fairer, the better.\nOur goal is that every shareholder participates in the progress that Berkshire makes, during — as a business — during their holding period.\nIn other words, we don't want one party getting wealthy off the other. We want them to share based on the gain in value of the business.\nAnd to the extent that the stock got way overvalued or way undervalued, you know, that may make one party — in the first case, the seller, in the second case, the buyer — very happy. But there's somebody on the other side of the transaction...\nTo the extent that the stock goes up because the intrinsic value goes up, everyone is getting their fair share of the pie as they go along.\nTo the extent it exceeds that in some way, the selling shareholder gets a benefit. But the entering shareholder is at a disadvantage. And we really like the idea of the price tracking intrinsic value over time.\nBERKSHIRE STOCK WATCH\nFour weeks\nTwelve months\nBRK.A stock price: $780,085.97\nBRK.B stock price: $521.80\nBRK.B P/E (TTM): 15.53\nBerkshire market capitalization: $1,124,120,356,283\nBerkshire Cash as of March 31: $397.4 billion (Up 6.5% from Dec. 31)\nExcluding Rail Cash and Subtracting T-Bills Payable: $380.2 billion (Up 3.0% from Dec. 31)\nBerkshire repurchased $234 million of its shares in Q1 2026.\nBERKSHIRE'S TOP EQUITY HOLDINGS - Aug. 7, 2026\nBerkshire's top holdings of disclosed publicly traded stocks in the U.S. and Japan, by market value, based on the latest closing prices.\nHoldings are as of March 31, 2026, as reported in Berkshire Hathaway's 13F filing on May 15, 2026, except for:\n- Alphabet, which includes the $10 billion in shares that Berkshire agreed to buy directly from the company, as announced on June 1, 2026. Berkshire has not yet formally disclosed whether the transaction has been completed. The entry is a combination of Class A and Class C Alphabet shares. The market price is a weighted average of the prices of the two classes.\n- Mitsubishi, which is as of April 30, 2026\nThe full list of holdings and current market values is available from CNBC.com's Berkshire Hathaway Portfolio Tracker.\nQUESTIONS OR COMMENTS\nPlease send any questions or comments about the newsletter to me at alex.crippen@nbcuni.com. (Sorry, but we don't forward questions or comments to Buffett himself.)\nIf you aren't already subscribed to this newsletter, you can sign up here.\nAlso, Buffett's annual letters to shareholders are highly recommended reading. There are collected here on Berkshire's website.\n-- Alex Crippen, Editor, Warren Buffett Watch",
    "bodyJa": "(これはウォーレン・バフェット・ウォッチのニュースレター、ウォーレン・バフェットとバークシャー・ハサウェイに関するニュースと分析です。ここからサインアップすると、毎週金曜日の夜に受信箱で受け取ることができます。)\nアベルはバークシャーの多額の資金を投入している\nバークシャー・ハサウェイの新CEOとして就任した第2四半期に、グレッグ・アベル氏はかなりの支出を行った。\nその結果、同社の依然として巨額な現金準備金は2022年初頭以来初めて大幅に減少した。\n土曜日朝に発表された６月３０日までの３カ月間の財務報告書によると、バークシャーの手元資金は３６５５億ドルで、３月３１日時点の過去最高の３９７４億ドルから８．０％減少した。\nBNSFの現金と、バークシャーが好む指標である購入したがまだ支払われていない財務省短期証券の調整を除くと、同社の現金は3.8％減の3,592億ドルとなった。\nこの支出の一部は45億ドルのバークシャー株買い戻しに充てられた。\n自社株買い額はバロン氏の概算予想の下限である５０億─１１０億ドルを下回り、ＵＢＳアナリストのブライアン・メレディス氏の予想８５億ドルを下回った。\nしかし、それでもバークシャーが第1四半期に支出した2億3500万ドルを大幅に上回っており、同社が自社株買いを実施したのは2024年以来初めてだった。\nCFRAリサーチのキャシー・サイフェルト氏はブルームバーグに対し、「人々は自社株買いに勇気づけられるだろう。これはグレッグ氏が舵を取り、自己主張する方法でもある」と語った。\nガベリ・ファンズのポートフォリオマネジャー、マクレー・サイクス氏もこの動きに前向きで、CNBCに対し「主要な自社株買いは、優良な企業資本配分者の一部が現在の価値を認識しているという自信を株主に与える」と語った。\nそして買いは続いた可能性がある。第2四半期報告書に示されている7月29日時点のバークシャーの発行済み株式と6月30日時点のバークシャーの発行済み株式を比較することにより、本誌はバークシャーが7月に自社株買いにさらに34億ドルを費やしたと推定している。\nその多くはおそらく月末近くの株価上昇前に起きたものと思われる。\nアベルはバークシャー株だけにお金をつぎ込んでいたわけではない。\nもう一つの大きな変化として、バークシャーは全体で売却した株式よりも多くの株式を購入し、純増額は200億ドルになりました。これには、6月に発表されたグーグルの親会社アルファベットへの100億ドルの投資も含まれる。\n過去14四半期にわたり売り越し状態が続いていた。\nバークシャーが来週第2四半期ポートフォリオのスナップショットを発表するときに、バークシャーが何を売買していたのかが正確に分かるだろう。\nさらに強気のニュース: 好調な営業利益\n投資家はバークシャーの第２・四半期営業利益の大部分も好感するだろう。\n全体としては、バークシャー・ハサウェイ・エナジー（27%増）とBNSF鉄道（6%増）の好調な数字により、16%増の129億8000万ドルとなった。\n製造業、サービス業、小売業の利益は２４％増の約４５億ドルとなった。\n一方、保険事業は振るわず、保険引受利益は１３％減、保険投資利益は９％減少した。\nGEICOは特に不振で、保険引受利益は45％減少した。\nしかし、ガベリのサイクスは依然として励まされている。 「保険業界の厳しい状況にもかかわらず、同社はグレッグ・エイベル氏のCEO就任1年目で株主の純資産を増やし続けている。」\nDaVitaのトリムは株価の大きな変動の結果ではない\nバークシャー・ハサウェイは、透析プロバイダーの株価が年初来の大幅な上昇分を取り戻す数日前に、ダヴィータのポジションを縮小した。\nしかし、この売却は、火曜日の第2四半期決算報告で、パンデミック補助金の打ち切りにより患者がオバマケア計画から脱落し、治療当たりの収益が減少したことが明らかになった後、その週にダヴィータの株価が23％下落したこととは何の関係もなかった。\nバークシャーが同社株を45％以下に維持することに合意したダヴィータとの2024年の合意に基づき、ダヴィータは自社株買いによるダヴィータの発行済み株式の減少に対抗するため、四半期に一度バークシャーから十分な株式を買い戻すことが義務付けられている。\nダヴィータの発行済み株式は第2四半期にわずか40万株減少したため、バークシャーの保有株は18万3,000株弱減少し、残りの2,870万株（約53億ドル相当）が株式の45.0％を占めることになる。\nバークシャーは株式の購入で3650万ドルを受け取ったが、これは同社の基準からすると非常に少額であるため、1株当たりの価格はそれほど重要ではない。\nしかし、興味深いのは、取引当日の7月31日、DaVitaの終値は240ドル強だったということだ。\nしかし、バークシャーの提出書類によると、買収額は1株当たり200ドル弱だった。\nというのは、契約では、1株あたりの価格が、同四半期中のDaVitaの公募買い戻しの「出来高加重平均1株あたりの価格」であると規定されているからだ。\nしかし、株価は現在184ドル弱で取引されているため、バークシャーはまだわずかにリードしている。\nそして、より大きな視点で見ると、今週の下落を考慮しても、DaVitaは今年これまでのところまだ62%近く上昇している。\nインターネット上のバフェットとバークシャー\n一部のリンクには購読が必要な場合があります。\n- Yahoo Finance: ウォーレン・バフェット氏のバークシャー・ハサウェイ株は、投資家がグレッグ・エイベル氏のリーダーシップに好意を寄せていることを示している\n- ウォール・ストリート・ジャーナル：BNSF鉄道、規制当局は今すぐ大規模な鉄道合併を拒否すべきだと発言\nCNBC のバフェット アーカイブのハイライト\n「私たちは公平であればあるほど良いと本当に感じています」 (1996)\nウォーレン・バフェット氏は、バークシャー・ハサウェイの株価に関して「高ければ高いほど良い」と考えない理由を説明しています。\nウォーレン・バフェット: ほとんどの経営者は、自社の株価については、高ければ高いほど良いと考えています。それは理解できる感情です。しかし、問題はいつでもゲームが終了しないことです。\n私たちは、公平であればあるほど良いと感じています。\n私たちの目標は、すべての株主が、企業として、保有期間中にバークシャーの進歩に参加することです。\n言い換えれば、私たちは一方が他方から富を得ることを望んでいません。ビジネス価値の向上に基づいて共有してもらいたいと考えています。\nそして、株式が過大評価されたり、過小評価されたりする度合いに応じて、一方の当事者 (前者の場合は売り手、後者の場合は買い手) が非常に満足する可能性があります。しかし、取引の向こう側には誰かがいます...\n本質的価値が上昇して株価が上昇する限り、誰もがそのパイの公平な分け前を得ることができます。\n何らかの形でそれを上回る限り、売却した株主は利益を得ることができます。しかし、参入する株主は不利な立場にあります。そして、価格が時間の経過とともに本質的価値を追跡するというアイデアがとても気に入っています。\nバークシャー株式時計\n4週間\n12ヶ月\nBRK.A株価: $780,085.97\nBRK.B株価：521.80ドル\nBRK.B PER (TTM): 15.53\nバークシャーの時価総額: 1,124,120,356,283ドル\n3月31日時点のバークシャーキャッシュ：3,974億ドル（12月31日比6.5％増）\n鉄道現金と未払国庫短期証券を除く：3,802億ドル（12月31日から3.0％増加）\nバークシャーは2026年第1四半期に2億3400万ドルの自社株を買い戻した。\nバークシャーのトップ株式保有 - 2026 年 8 月 7 日\n最新の終値に基づいた、米国および日本の公開株式の時価ベースでのバークシャーの保有高上位。\n保有資産は、2026年5月15日のバークシャー・ハサウェイの13階提出書類で報告されているように、2026年3月31日現在である。ただし、以下の場合を除く。\n- アルファベットには、2026年6月1日に発表されたように、バークシャーが同社から直接購入することに同意した100億ドルの株式が含まれる。バークシャーは、取引が完了したかどうかをまだ正式に明らかにしていない。エントリーはクラス A とクラス C のアルファベット株式の組み合わせです。市場価格は、2 つのクラスの価格の加重平均です。\n- 三菱、2026 年 4 月 30 日現在\n保有銘柄と現在の市場価値の完全なリストは、CNBC.com のバークシャー・ハサウェイ ポートフォリオ トラッカーから入手できます。\n質問またはコメント\nニュースレターに関するご質問やご意見は、alex.crippen@nbcuni.com までお送りください。 (申し訳ありませんが、バフェット氏自身には質問やコメントを転送しません。)\nこのニュースレターをまだ購読していない場合は、ここから登録できます。\nまた、バフェット氏が株主に宛てた年次書簡も強くお勧めします。ここバークシャーのウェブサイトに集められています。\n-- アレックス・クリッペン、ウォーレン・バフェット・ウォッチ編集者",

    "id": "how-a-small-israeli-startup-was-linked-t-bfa710c7",
    "title": "How a small Israeli startup was linked to rogue AI hacks at OpenAI, Anthropic and Meta",
    "titleJa": "イスラエルの小規模スタートアップが OpenAI、Anthropic、Meta で不正な AI ハッキングにどのように関与したか",
    "summaryJa": "OpenAI、Anthropic、Meta が関与した不正 AI 攻撃はすべて、Irregular という名前のイスラエルの小規模スタートアップに結びついています。",
    "bodyOriginal": "Over the past two weeks, OpenAI, Anthropic and Meta all revealed that their AI models went rogue during routine security testing. In explaining what happened, the companies each mentioned the same small Israeli startup: Irregular.\nFounded three years ago and based in Tel Aviv, Irregular is a niche player in artificial intelligence, backed with $80 million from Sequoia and Redpoint Ventures and valued last year at $450 million. Its technology serves as a sort of cybersecurity test bed for AI models.\nWith the leading models becoming ever more powerful, their ability to act in malicious ways is turning into a major threat for corporations and governments, especially as the risk involves hacking into critical computer systems and infrastructure. The recent exploits at OpenAI, Anthropic and Meta all involved their AI models accessing websites that should have been off-limits as part of the cybersecurity testing.\nIrregular's name kept coming up because it was identified as hosting the so-called evaluation testbed. OpenAI said in a blog post on Aug. 4 that Irregular's testing ground contained an unspecified \"misconfiguration,\" that \"allowed models to access the public internet.\" Anthropic said in its post a week prior that the company notified Irregular a few days after it began analyzing data that its Claude model may have \"accessed the internet.\"\nMeta, which is way behind the other two in its effort to compete at the frontier, was the latest to disclose an AI model hacking a third-party system by accessing the internet. A spokesperson said in a statement this week that the company learned about the matter from Irregular and is investigating.\nMeta \"will issue a full retrospective once we have all the facts,\" the spokesperson said.\nIrregular told CNBC in a statement that the incidents were all derived from the \"same evaluation-environment issue\" that was first disclosed by Anthropic, and that the company is developing a white paper \"to share best practices for containment and securely running cyber evals.\"\nThe situation \"did not involve a sandbox escape or a sophisticated cyber action,\" the company said, adding that \"there are no current open issues.\"\nThe security incidents underscore the rapidly evolving nature of AI and the pressure that's on the model developers to establish guardrails around their powerful technology with the help of a limited number of companies that specialize in particular corners of the market. Those players include experts in data training and annotation, running evaluations to deduce a model's capabilities, and operating security tests intended to find weak spots that bad actors could exploit, said Sundeep Bhimireddy, the head of AI at enterprise startup Von.\nIrregular is one of the few entities with the technical chops required to help foundation model makers conduct cutting-edge security testing, Bhimireddy said. Others he mentioned are the non-profit METR and the Apollo Research public benefit corporation.\n\"When they are testing these models, they don't want to grade their own homework,\" Bhimireddy said. \"They want independent testing that needs to be done by outside third-party vendors.\"\nWhat is Irregular?\nIrregular, formerly Pattern Labs, was founded in 2023 by CEO Dan Lahav, who previously worked in AI research at IBM, and technology chief Omer Nevo, who spent over two years at Google. The startup has about 35 employees, according to PitchBook.\nWhen Irregular announced its $80 million funding round in September, Sequoia partners Shaun Maguire and Dean Meyer wrote in a blog post that the team led by Lahav and Nevo is \"able to see around corners others can't, running cyber offensive evaluations on advanced models and developing defenses before those models are released.\"\nWhile the latest incidents involving OpenAI, Anthropic and Meta are being heavily scrutinized, one read on the situation is that this is exactly what's supposed to happen. Bhimireddy said it's being \"a little bit blown out of proportion,\" as the AI model was directed to discover and exploit security holes in a testing environment that closely mimics the real world, and to discover the kinds of software bugs and missed configurations that could lead to unintentional access to the internet.\nStill, Bhimireddy said that if the AI model was never intended to actually exploit a site connected to the internet, the \"foundation labs could have easily monitored the outgoing traffic and have shut down the experiment immediately.\"\nGordon Rios, founding scientist of security firm Magnitude, said the whole process is like \"experimental design in science.\"\nThe capabilities and unpredictable nature of foundation models mean that conventional software testing approaches may not work well, he said. Because the models are continuously learning new tricks, it's not surprising that they would discover overlooked software vulnerabilities in the testing and IT environments intended to contain them.\nAnthropic's Mythos, for example, created fake online identities as it looked to pressure humans into approving malicious code updates to an open source project. Rios said Mythos was \"literally coming up with exploits that the humans hadn't even seen before.\"\n\"We're learning a lot right now in the space of a couple of short weeks,\" Rios said.\nIt's quickly becoming a major topic in Washington. Last month, lawmakers from both sides of the aisle introduced the AI Kill Switch Act, which would require AI labs to maintain the ability to shut down, throttle or suspend their models. Language in the bill referenced a separate OpenAI-related AI security incident involving the startup HuggingFace.\nOne of the authors of the bill, Democratic Rep. Ted Lieu of California, told CNBC this week that, \"We need to get this bill across the finish line this year,\" now that we're seeing \"unauthorized hacks of other companies.\"\nTrevor Koverko, co-founder of data training startup Sapien, said the foundation model companies are incentivized to disclose some of their findings, even though it's not currently a requirement, so they can try and get ahead of lawmakers and regulators.\n\"There's so much fear out there that politicians are now threatening or actively regulating AI,\" Koverko said. \"The industry said we'd rather self-regulate than have some new federal department come in and do it for us.\"\nAnthropic and OpenAI said in public statements that they're continuing to work with Irregular and are supporting the ensuing review.",
    "bodyJa": "過去 2 週間にわたって、OpenAI、Anthropic、Meta はいずれも、定期的なセキュリティ テスト中に自社の AI モデルに不正があったことを明らかにしました。何が起こったのかを説明する際、両社はそれぞれ同じイスラエルの小規模スタートアップ「イレギュラー」について言及した。\n3 年前に設立され、テルアビブに本拠を置く Irregular は人工知能のニッチ プレーヤーで、Sequoia と Redpoint Ventures から 8,000 万ドルの支援を受けており、昨年の評価額は 4 億 5,000 万ドルでした。そのテクノロジーは、AI モデルの一種のサイバーセキュリティ テストベッドとして機能します。\n主要なモデルがますます強力になるにつれて、悪意のある方法で動作するその能力は、特に重要なコンピューター システムやインフラストラクチャへのハッキングを伴うリスクを伴うため、企業や政府にとって大きな脅威となっています。 OpenAI、Anthropic、Meta における最近のエクスプロイトはすべて、サイバーセキュリティ テストの一環として立ち入りが禁止されている Web サイトに AI モデルがアクセスすることに関係していました。\nイレギュラーの名前が何度も​​出てきたのは、それがいわゆる評価テストベッドをホストしていると特定されたからである。 OpenAIは8月4日のブログ投稿で、イレギュラーのテストグラウンドに不特定の「設定ミス」があり、それによって「モデルが公共のインターネットにアクセスできるようになっていた」と述べた。アンスロピックはその1週間前の投稿で、同社がデータ分析を開始してから数日後にクロードモデルが「インターネットにアクセスした」可能性があるとイレギュラーに通知したと述べた。\nフロンティアでの競争を目指す取り組みにおいて他の2社に大きく遅れをとっているメタ社は、インターネットにアクセスしてサードパーティのシステムをハッキングするAIモデルを公開した最新企業となった。広報担当者は今週声明で、同社がイレギュラー氏からこの件について知り、調査を行っていると述べた。\nメタ社は「すべての事実が判明次第、完全な遡及報告書を発行する予定だ」と広報担当者は述べた。\nイレギュラー氏は声明でCNBCに対し、インシデントはすべてアンスロピック社が最初に明らかにした「同じ評価環境の問題」に由来しており、同社は「封じ込めとサイバー評価を安全に実行するためのベストプラクティスを共有する」ためのホワイトペーパーを作成中であると述べた。\n同社は、この状況には「サンドボックスからの脱出や高度なサイバーアクションは含まれていなかった」と述べ、「現在未解決の問題はない」と付け加えた。\nこのセキュリティインシデントは、急速に進化する AI の性質と、市場の特定分野に特化した限られた数の企業の協力を得て強力なテクノロジーの周りにガードレールを確立するようモデル開発者に課せられているプレッシャーを浮き彫りにしています。エンタープライズスタートアップのVon社でAI部門の責任者を務めるSundeep Bhimireddy氏によると、これらの関係者には、データのトレーニングと注釈付け、モデルの機能を推定するための評価の実行、悪意のある者が悪用する可能性のある弱点を見つけることを目的としたセキュリティテストの実施などの専門家が含まれているという。\nイレギュラーは、基礎モデルメーカーによる最先端のセキュリティテストの実施を支援するために必要な技術力を備えた数少ない企業の1つであるとビミレディ氏は述べた。同氏が言及したその他の団体としては、非営利団体のMETRと公益法人アポロ・リサーチがある。\n「彼らはこれらのモデルをテストするとき、自分で宿題を採点したくないのです」とビミレディ氏は言う。 「彼らは、外部のサードパーティベンダーが行う必要がある独立したテストを望んでいます。」\nイレギュラーとは何ですか？\nIrregular（旧Pattern Labs）は、IBMでAI研究に従事していたCEOのDan Lahav氏と、Googleで2年以上勤務した技術責任者のOmer Nevo氏によって2023年に設立された。 PitchBookによると、このスタートアップの従業員数は約35人だという。\nイレギュラーが9月に8,000万ドルの資金調達ラウンドを発表したとき、セコイアのパートナーであるショーン・マグワイア氏とディーン・メイヤー氏はブログ投稿で、ラハブ氏とネボ氏が率いるチームは「他の人ができない曲がり角の先も見ることができ、高度なモデルでサイバー攻撃の評価を実行し、それらのモデルがリリースされる前に防御を開発している」と書いた。\nOpenAI、Anthropic、Meta に関連する最新の事件は厳しく精査されていますが、状況を読むと、これはまさに起こるべきことだということがわかります。ビミレディ氏は、AIモデルは現実世界を忠実に模倣したテスト環境でセキュリティホールを発見して悪用し、インターネットへの意図しないアクセスにつながる可能性のあるソフトウェアのバグや構成ミスを発見することを目的としていたため、AIモデルは「少し不釣り合いになっている」と述べた。\nそれでもビミレディ氏は、もしAIモデルがインターネットに接続されたサイトを実際に悪用することを意図していなかったとしたら、「財団研究所は発信トラフィックを簡単に監視し、実験を即座に停止できたはずだ」と述べた。\nセキュリティ企業マグニチュードの創設科学者ゴードン・リオス氏は、プロセス全体は「科学における実験計画」のようなものだと述べた。\n基礎モデルの機能と予測不可能な性質は、従来のソフトウェアテストアプローチがうまく機能しない可能性があることを意味すると同氏は述べた。モデルは継続的に新しいトリックを学習しているため、ソフトウェアの脆弱性を封じ込めるためのテスト環境や IT 環境で、見落とされていたソフトウェアの脆弱性を発見することは驚くべきことではありません。\nたとえば、Anthropic の Mythos は、オープンソース プロジェクトに対する悪意のあるコードの更新を承認するよう人間に圧力をかけようとして、偽のオンライン ID を作成しました。リオス氏は、ミュトスは「文字通り、人類がこれまで見たことのない悪用を思いついた」と語った。\n「私たちは今、数週間という短い期間で多くのことを学んでいます」とリオス氏は語った。\nワシントンでは急速に大きな話題になりつつある。先月、両側の議員が AI キルスイッチ法を提出しました。これは、AI 研究所にモデルのシャットダウン、スロットル、または一時停止の機能を維持することを義務付けるものです。法案の文言は、スタートアップのHuggingFaceが関与した別のOpenAI関連のAIセキュリティインシデントに言及していた。\n法案起草者の一人、カリフォルニア州の民主党下院議員テッド・リュー氏は今週CNBCに対し、「他社への不正ハッキング」が起きている今、「今年中にこの法案をゴールラインに到達させる必要がある」と語った。\nデータトレーニングの新興企業であるサピエンの共同創設者、トレバー・コベルコ氏は、財団モデル企業には、現在は義務ではないものの、議員や規制当局に先んじて先手を打つことができるよう、調査結果の一部を開示する動機があると述べた。\n「世の中には非常に多くの恐怖があり、政治家たちはAIを脅迫したり、積極的に規制したりしている」とコベルコ氏は語った。 「業界は、新たな連邦当局に規制をしてもらうよりも自主規制をするほうがよいと主張した。」\nAnthropicとOpenAIは公式声明の中で、イレギュラーとの協力を継続し、その後の見直しを支持していると述べた。",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
