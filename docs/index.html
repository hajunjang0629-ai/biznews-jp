    "summaryJa": "Susan Collins, a Republican in a tight race to keep her senate seat in next month's elections, said she had been working with the White House on tariff relief.",
    "bodyOriginal": "White House says the US is lifting tariffs on some Canadian goods\n- Published\nThe US is lifting some of its 50% tariffs on Canadian goods, with the White House saying on Friday it was working to \"protect the economic prosperity and national security of the American people\".\nThe exemptions could also boost Republican candidates in the midterms elections on 3 November, as many US voters list affordability and economic pressures as top issues.\nRepublican Senator Susan Collins, who is in a tight race in Maine to keep her seat in the election, first announced the exemptions, saying they would help her state's agriculture industry.\nAfter trade talks collapsed this summer, the US and Canada started an escalating tariff war that has affected both sides of the border.\nThe White House, in a statement, said that starting 30 October the US would remove certain products from the list of Canadian goods it taxes, such as plywood sheets, some paper products, certain machinery and refrigeration equipment, and certain packing crates and boxes.\nIt added those items would be replaced with certain valves, carpets, waste products, among others.\nThe White House said the action reflects President Trump's \"continued efforts to defend American workers and ensure fair trade\", as well as \"offsetting the burden and disadvantage on U.S. commerce from Canada's discriminatory treatment\".\nThe BBC has contacted the White House, US commerce department and trade representative for further comment.\nAlso on Friday, President Donald Trump said that Canada is \"working very hard\" on a trade deal with the US.\nCanadian Prime Minister Mark Carney said on Friday that Canada is open to a mutually beneficial deal, but is willing to wait it out.\n\"We could sign it this afternoon if the US were there. If it has to be months from now or longer than that, or another administration, before a proper deal comes into place, we will do that,\" he said, according to CBC.\nCanada's internal trade minister Dominic LeBlanc confirmed on Thursday that a delegation met with members of the Canada-United States Economic Relations Advisory Committee - the ninth meeting since April 2026. The committee members discussed the ongoing impact of US tariffs in Canada.\nSo far, Canada has not commented on the White House's announcement.\nLeBlanc's office did not immediately respond on Friday to the BBC's request for comment.\nThe US-Canada trade war in 5 charts\n- Published31 August\nThe Wall Street Journal had reported that the exemptions, largely focused on Canadian agricultural and forestry, were made in a bid to help Collins and other Republicans in the upcoming midterm elections.\nThe reductions could be offset by raising levies on other Canadian goods, the Journal reported.\nIn a statement Collins put out before the White House announcement, the incumbent lawmaker, who is trying to clinch her sixth term, said she had \"secured additional tariff exemptions products crucial to Maine's agricultural industries, including blueberry, potato, apple, and seaweed producers\".\n\"Many of our farmers and growers rely on specialized equipment, packaging materials, and other products from Canada that are either unavailable from American suppliers or cannot be replaced without incurring significant expense,\" she posted on X.\nCollins said she has asked US officials and senior administration officials to seek additional relief and encourage a broader trade agreement with Canada.\nMaine's economy, as well as that of other border states, is deeply linked to Canada and they have felt the effects of the month-long trade war.\nMichigan lawmaker Mike Rogers, also a Republican, has called on Trump to end the standoff after spending months supporting the policy in recent advertisements airing in his trade-reliant state.\nRelated topics\n- Published1 day ago",

    "title": "Scalpers offer Apple iPhone Duo buyers hundreds extra outside Beijing launch",
    "titleJa": "Scalpers offer Apple iPhone Duo buyers hundreds extra outside Beijing launch",
    "summaryJa": "Apple's global launch of the foldable iPhone Duo brought scalpers to the Beijing flagship store looking to pay big for the already pricey devices.",
    "bodyOriginal": "The iPhone Duo has an eye-popping price tag, but initial interest in Apple's first foldable phone in China appears solid.\nOn the day of the global launch on Friday, scalpers like Alex Wang stood outside the flagship store in Beijing's popular shopping area, Sanlitun, offering to pay customers an extra 3,000 Chinese yuan ($448) to buy their newly purchased phones on the spot.\n\"I feel the Duo can be sold with a higher price for half a month,\" he told CNBC while watching the lines of Duo customers who had pre-booked their phones. \"The main reason is the tight supply.\"\nThough foldables are still a niche product globally, China's market is the single largest, according to Counterpoint Research.\nApple fan Mary Tong, who was first in a line of about 100 people at the Sanlitun store, showed up at 6 a.m. to pick up her foldable device.\n\"Apple has been the laggard,\" she said. \"I think many Chinese do prefer foldable phones.\"\nHuawei is promoting its own AI assistant XiaoYi to boost the Chinese smartphone maker's competitiveness against Apple and other homegrown rivals. Huawei, which already has a broad lineup of foldable phones, launched a new trifold called the Mate XT2 that is priced at about $3,000 on Sept. 7, two days before Apple's Duo announcement.\nChina's Xiaomi unveiled its own pricey foldable, the 18 Fold, around the same time.\nEven before the Beijing Apple store's regular opening hours, customers without a reservation showed up to test their luck to get their hands on the new phone. Apple had said the Duo would not be available for walk-in purchase on launch day in mainland China and would be \"limited\" in other countries. Each online purchase was restricted to two phones.\nZhang Zheng said he had tried to order one on the site but was discouraged by the delivery timeline, which stretched to January 2027. He said he still wants to buy one.\n\"I think it will be useful for work and it's cool to look at,\" he said.\nWhile there was buzz about the device itself, expectations for Apple Intelligence were negligible. The company said a version of the AI system is set for beta testing this month for the mainland China market and will include features like live translation, Clean Up in photos, and writing tools.\nOn Oct. 14, Beijing approved Alibaba AI models for use in Duo and other Apple devices as part of the U.S. tech giant's pending AI rollout in the country. Apple received Chinese regulatory clearance over the summer.\nChinese official media cited ex-CEO Tim Cook on a recent China trip as saying Apple's revamped Siri AI would not be available in the country yet.\nDuo customer John Zhao said he had tried Apple Intelligence while working overseas, and it was \"nice but not beyond imagination.\" He expects the Chinese version to be less exciting.",

    "title": "Trump's executive order targets mortgage insurance, refinance costs. What it means for borrowers",
    "titleJa": "Trump's executive order targets mortgage insurance, refinance costs. What it means for borrowers",
    "summaryJa": "Trump's executive order on housing aims to lower mortgage costs. Here's what it means for homeowners and buyers.",
    "bodyOriginal": "President Donald Trump has signed an executive order that aims to reduce mortgage costs as rising interest rates and inflation make homeownership less affordable.\nThe order, titled \"Decreasing Housing Costs for the American People,\" directs federal agencies to proactively cancel mortgage insurance on eligible future loans and expand a program to make refinancing cheaper, among other actions.\nIn an X post on Thursday, Federal Housing Finance Agency director Bill Pulte said \"millions of Americans will save thousands and thousands of dollars.\"\nBut it's difficult to know the future consumer impact without more details, according to Keith Gumbinger, vice president of mortgage website HSH.\nTrump's executive order comes less than two weeks before the Nov. 3 midterm elections, with rising costs and housing affordability a major concern among voters. It builds on previous orders to restrict Wall Street firms from buying single-family homes, among other actions.\nHomeownership has become less affordable in recent years. In 2025, the monthly payment for a 30-year fixed-rate mortgage on a median-priced home was roughly 33% of the median family's income, up from 26% in 2022, according to the Federal Reserve's latest Survey of Consumer Finances published in early October.\nWhether you're a current homeowner or future buyer, here are some of the key things to know about the new executive order.\nMortgage insurance changes\nConventional loans — mortgages not insured or backed by U.S. government programs — typically require private mortgage insurance, or PMI, when a down payment is less than 20% of the home's purchase price. By contrast, Federal Housing Administration mortgages require mortgage insurance on all loans.\nTrump's executive order directs the FHFA to create a pilot program that cancels eligible borrowers' mortgage insurance \"proactively\" once their home equity reaches a certain threshold, according to the White House. This would apply to mortgages originated after the pilot program launches.\nCurrently, conventional loan borrowers can generally remove PMI once their loan balance is below 80% of the purchase price or once they have reached 20% equity, according to Fannie Mae. Once your balance is below 80%, you can ask your loan servicer if you're eligible to remove PMI, or they may remove it automatically when your balance reaches 78% of the original value.\nIn a statement Thursday, Seth Appleton, president of U.S. mortgage insurers, an industry trade organization, said: \"We commend the President's focus on lowering costs for future homeowners, and the private mortgage insurance industry is proud to already be delivering on that goal.\"\nTypically, the cost of PMI can be 0.2% to 2% of the loan annually, but varies based on your down payment size, credit score, amount borrowed and other factors, according to Fannie Mae.\nFor example, if you purchased a $600,000 home with a 10% down payment and a 30-year fixed-rate mortgage at 7.3%, your monthly mortgage insurance could be $351, according to a private mortgage calculator from Freddie Mac.\n\"Most mortgages ... are carrying PMI at this point in time, especially with the way home prices have been and down payments being as small as they've been in recent years,\" Gumbinger said.\nDuring the second quarter of 2026, the median home down payment was 13.7% of the home's purchase price, or $27,100, according to a September report from Realtor.com.\nMortgage refinancing costs\nTrump's executive order also aims to reduce mortgage refinancing costs by making permanent the FHFA's pilot program that waives the lender's title insurance policy and allows \"cost-friendly alternatives,\" according to the White House.\n\"I don't know that it's necessarily a game-changer in terms of the cost of housing, which is dictated by home price and mortgage rates at the moment,\" Gumbinger said. \"But you know, every little bit certainly helps.\"\nAs of Oct. 23, mortgage interest rates for 30-year fixed-rate mortgages were 7.32%, according to Freddie Mac, and refinance demand was down 59% in mid-October, compared to the same week the previous year.\nOriginally planned through November 2027, the FHFA pilot was \"limited in scope,\" for refinances with a loan-to-value ratio below 80%, in a handful of states, former FHFA director Sandra Thompson said during a Congressional hearing in April 2024.\nThompson estimated that consumers could save $500 to $1,500 in closing costs for loans sold under the pilot program.\nMaking the program permanent could save borrowers because the lender's title insurance policy, which is usually required for new loans and refinances, \"has always been fairly pricey,\" Gumbinger said.\nThe lender's title and title insurance-related fees generally make up the largest share of mortgage closing costs, according to a 2025 Urban Institute report.",

s originated after the pilot program launches.\nCurrently, conventional loan borrowers can generally remove PMI once their loan balance is below 80% of the purchase price or once they have reached 20% equity, according to Fannie Mae. Once your balance is below 80%, you can ask your loan servicer if you're eligible to remove PMI, or they may remove it automatically when your balance reaches 78% of the original value.\nIn a statement Thursday, Seth Appleton, president of U.S. mortgage insurers, an industry trade organization, said: \"We commend the President's focus on lowering costs for future homeowners, and the private mortgage insurance industry is proud to already be delivering on that goal.\"\nTypically, the cost of PMI can be 0.2% to 2% of the loan annually, but varies based on your down payment size, credit score, amount borrowed and other factors, according to Fannie Mae.\nFor example, if you purchased a $600,000 home with a 10% down payment and a 30-year fixed-rate mortgage at 7.3%, your monthly mortgage insurance could be $351, according to a private mortgage calculator from Freddie Mac.\n\"Most mortgages ... are carrying PMI at this point in time, especially with the way home prices have been and down payments being as small as they've been in recent years,\" Gumbinger said.\nDuring the second quarter of 2026, the median home down payment was 13.7% of the home's purchase price, or $27,100, according to a September report from Realtor.com.\nMortgage refinancing costs\nTrump's executive order also aims to reduce mortgage refinancing costs by making permanent the FHFA's pilot program that waives the lender's title insurance policy and allows \"cost-friendly alternatives,\" according to the White House.\n\"I don't know that it's necessarily a game-changer in terms of the cost of housing, which is dictated by home price and mortgage rates at the moment,\" Gumbinger said. \"But you know, every little bit certainly helps.\"\nAs of Oct. 23, mortgage interest rates for 30-year fixed-rate mortgages were 7.32%, according to Freddie Mac, and refinance demand was down 59% in mid-October, compared to the same week the previous year.\nOriginally planned through November 2027, the FHFA pilot was \"limited in scope,\" for refinances with a loan-to-value ratio below 80%, in a handful of states, former FHFA director Sandra Thompson said during a Congressional hearing in April 2024.\nThompson estimated that consumers could save $500 to $1,500 in closing costs for loans sold under the pilot program.\nMaking the program permanent could save borrowers because the lender's title insurance policy, which is usually required for new loans and refinances, \"has always been fairly pricey,\" Gumbinger said.\nThe lender's title and title insurance-related fees generally make up the largest share of mortgage closing costs, according to a 2025 Urban Institute report.",

    "titleJa": "Meta shares are down 9% this week. Here's why Mike Khouw is buying now",
    "summaryJa": "Meta shares just had their worst week in four years. Here's why Mike Khouw is buying now",
    "bodyOriginal": "Size is a relative matter. The standard Manhattan apartment would seem almost claustrophobic compared to the vast expanses offered by suburban living. A similar dynamic is playing out in the market.\nMega-cap companies are generally defined as those with market capitalizations exceeding $200 billion. Of course, the largest companies are another order of magnitude larger than that. For example, Meta, which reported stellar earnings this week, has a current market capitalization of $1.65 trillion.\nBut concerns about its AI buildout expenses wiped $135 billion from its market cap in just four sessions, or put another way, roughly the value on and entire Uber. Market cap is one way to understand how big these companies are, but another is by examining the size of their operations, and their opportunities.\nConsider Muse.\nMeta's personal AI agent is designed to be more of an active digital assistant than a conventional conversational chatbot. Muse can open browsers, fill out forms, send emails, schedule appointments, book travel, and (potentially) even make purchases.\nTo understand how large an economic opportunity this represents for the company, consider what something like that might be worth. $5 per month per user? (Not in subscription fees necessarily, mind you, just monetizable economic value). That seems a bit low for something so powerful. $10/month? Quite realistically. Then consider the size of Meta's ecosystem's daily active user base across Facebook, Instagram, WhatsApp, and Messenger. That number is truly \"mega\": 3.6 billion, supposedly counting each person only once. If we assume that each of those individuals has and uses a global phone - 5.86 billion unique people on the planet do - that means Meta interacts at least once with 61.4% of them each day.\nIf Muse is worth $120/year and reaches just 1% of Meta's Daily Active People, that's $4.3 billion/year. If it's worth half that amount, but reaches 20% of their daily actives, that's $43.2 billion/year. The first number seems absurdly low as a back-of-the-napkin figure, but the $135 billion valuation loss in less than a week is offset by $20 billion in revenue (the company trades at just under 7x revenue). If Muse can generate $30 billion in revenues, it is a megacap company in its own right!\nSo why has the company sold off if everything is so rosy? A massive $25 billion lawsuit in New Mexico, a potential PR headache related to a deal struck between the company and its founder to resolve potential tax liabilities associated with a possible billionaire's tax in California that preserves his voting rights, and, of course, concerns about debt, on the balance sheet and off, to finance the enormous investment that the company is making (and expanding) in AI, and AI jitters generally. But at 20x FY earnings, and less than 17x FY2027 estimated earnings, the company is now pricing a lot of that in. Those headaches create headwinds, but the underlying story provides support.\nThe trade\nI like selling December strangles here, specifically the 580/745 strangle, for which one would collect about $21.30/share as of today's closing prices. The trade makes profits virtually anywhere between the 1-year highs and lows - and it's pretty much right in the middle of that range now.\nDisclosures: Tidal owns/holds all the securities mentioned in the article.\nAll opinions expressed by CNBC Pro contributors are solely their opinions and do not reflect the opinions of CNBC, or its parent company or affiliates, and may have been previously disseminated by them on television, radio, internet or another medium. This content is provided as part of our editorial output for informational purposes only and does not constitute financial, investment, tax or legal advice or a recommendation to buy any security or other financial asset. The content is general in nature and does not reflect any individual's unique personal circumstances. The above content might not be suitable     "summaryJa": "The Iran war is transforming global energy markets and benefiting U.S. companies, especially liquefied natural gas exporters.",
    "bodyOriginal": "Before the Iran war, Qatar was one of the biggest natural gas exporters in the world. After only eight months, the Gulf state is now buying supplies from its principal competitor — the United States.\nQatarEnergy struck a deal Thursday with U.S. exporter Cheniere Energy to buy 4 million metric tons of liquefied natural gas, or LNG, annually through 2054. The purchase price is indexed to the U.S. Henry Hub price plus a fixed fee. Deliveries are expected to begin in the 2030s.\n\"We look forward to reliably supplying QatarEnergy from both Sabine Pass and Corpus Christi into the second half of this century,\" Cheniere CEO Jack Fusco said in a statement.\nThe gas that Doha will buy is less than 1% of the global LNG trade of more than 400 million metric tons. But \"in terms of an individual deal, this is about as big as you see in the U.S,\" said Alex Munton, director of global gas and LNG at Rapidan Energy in Houston.\nThe deal signals how the Iran war is reshaping global energy markets to the benefit of U.S. companies, cementing the dominance of American LNG exporters. Shares of Cheniere and Venture Global, the other independent U.S. player, have gained 26% and 40%, respectively, since the start of the war.\nQatar knocked out\nQatar was second only to the U.S. in LNG exports before the war. But shipments have since collapsed in the eight months since Iran bombed its key production facility at Ras Laffan. The attack badly damaged two production lines, taking out about 17% of Qatar's LNG export capacity.\nIt will take about three years to repair the damage at Ras Laffan, Qatar's energy minister, Saad Sherida Al-Kaabi, has said. The Persian Gulf state has declared force majeure — citing unexpected, uncontrollable events preventing contracts from being honored — every month since the March attack.\n\"It did give us a big blow, if you will, for our production capability for the next few years,\" Al-Kaabi said in an interview on the sidelines of the United Nations General Assembly in September. Qatar is exporting \"very little\" LNG right now because \"we can't export through the Hormuz Strait,\" he said.\n\"Very sparingly, some ships are crossing the straits but a very small amount, it's not something that would even be measurable in a percentage point,\" the energy minister said.\nFreedom of navigation\nAnd it is far from clear what security conditions in Hormuz will look like when the repairs are done at Ras Laffan. The decades-long contract with Cheniere indicates that Qatar sees a risk that freedom of navigation will never return to Hormuz as Iran keeps attacking tankers, Munton said.\nIt is harder to find ways to get around Hormuz in the case of LNG because it is fundamentally a waterborne product, the analyst said.\n\"It's liquefied so it can be put on a ship and that requires access to seaborne routes,\" Munton said. \"They've got to access the Strait of Hormuz. There's no other way of getting LNG to market. They're just stuck.\"\nWith its production badly damaged and Hormuz blocked off, QatarEnergy is expanding its LNG trading business through the Cheniere deal, Munton said.\nIt secured a $3 billion loan earlier this month from Chinese banks that could allow it to secure more U.S. LNG to honor its international delivery commitments, said Manav Gupta, a UBS analyst, in a note to clients Thursday.\nBullish Wall Street\nVenture Global, for example, is in advanced talks with QatarEnergy to supply 3 million metric tons annually, unnamed sources told Reuters.\nWith the Qatar deal, Cheniere is disproving the bears' case that it will struggle to secure incremental sales which would in turn constrain capacity expansion, Gupta said. UBS has a stock price target of $340 on Cheniere, implying 18% upside from Thursday's close.\nWall Street is broadly bullish on both Cheniere and Venture Global. Nearly 90% of equity analysts who cover Cheniere rate it a buy, with an average price target of $314, implying about 9% upside from Thursday's close.\nNearly 60% of analysts recommend Venture Global as a buy with the rest rating it a hold. The average price target of $17 would amount to some 35% upside from Thursday's close.\n\"The U.S. once again is being called on by buyers to diversify supply,\" Munton said. \"So much is under construction in the U.S. that you get to the point where now the U.S. is becoming disproportionately big in terms of global [LNG] market share.\"",

    "title": "Fewer people are flying as airfare soars. Here's why airlines aren't worried",
    "titleJa": "Fewer people are flying as airfare soars. Here's why airlines aren't worried",
    "summaryJa": "Airlines are reporting fewer people flew in the third quarter as airfare surged on fuel costs, but executives say travelers are mostly swallowing higher fares.",
    "bodyOriginal": "Fewer people are flying this year, but with airfare this high and climbing, airline executives say that's just fine.\nThe number of people screened at U.S. checkpoints is on track for its first annual decline since 2020. Major U.S. carriers have said capturing higher fares is more important than fully filling their planes or flying record numbers of travelers.\n\"We're actively prioritizing yield versus load factor and really happy as we see it. It fits right in with the premium investments that we're making,\" American Airlines Chief Commercial Officer Nat Pieper said on the company's earnings call Thursday.\nAmerican's load factor, a gauge of how full planes are flying, fell to 83.4% in the third quarter from 86% in the same quarter of 2025.\nFares keep climbing\nThe price of plane tickets has skyrocketed as airlines grapple with a spike in jet fuel prices, their biggest expense after labor, and pass more of those costs on to customers.\nFares in September were up more than 22% from a year earlier, according to the latest inflation read. Fare tracker Hopper said it expects this holiday season to come with the most expensive ticket prices in years.\nThe average Southwest Airlines fare in the third quarter, for example, was $231.69, up close to $50 from a year earlier. That doesn't include Southwest's new fees, like its extra charges for checked bags or a seat closer to the front of the plane.\nThe airline's count of revenue passengers, however, fell 3.2% from a year ago, to about 33.5 million people.\nStill, both fares and the passenger counts exceeded Southwest's expectations.\n\"Passenger fares came in about $3 above what our forecast was and the more important thing is that passenger volumes also exceeded our expectations,\" Southwest CEO Bob Jordan said on an earnings call Thursday.\nSince April — when airlines began warning in earnest about profits taking a hit from the spike in jet fuel — through Thursday, about 9.3 million fewer people were screened at airport checkpoints compared with the same period of 2025, according to the Transportation Security Administration. While that's down less than 2% from last year, it follows years of growth.\nWith jet fuel prices more than double year-ago levels — as seen in U.S. Gulf Coast spot prices going for $4.63 a gallon, according to the U.S. Energy Information Administration — airlines have been focused on recovering as much of the fuel spike as possible.\nEven despite some drops, airline executives said during their earnings calls that travel demand overall is robust, especially for profitable premium cabins like business class.\nAnd not every carrier is seeing a decline. United Airlines flew 2.4% more passengers in the third quarter than it did a year ago, and said its unit revenue rose by 16%, the biggest increase since the pandemic.\n\"I've been pleasantly surprised at the industry's ability this year to raise yields and pass through much of the increase in fuel prices,\" CEO Scott Kirby said on the company's earnings call Wednesday. \"So it's possible that airlines will continue to focus on yields at the expense of load factor and that alone could get us to double-digit margins next year.\"\nProfit hit\nMost airlines are anticipating that fuel costs will continue to bite, but executives say they're confident in their pricing power.\nUnited, for example, said it expects to pay an average of $4.80 a gallon for fuel in the fourth quarter, up from an average price of $3.90 a gallon in the third.\nAmerican, United, Delta Air Lines and Southwest all cut their profit forecasts for 2026 this month when they reported earnings. American is the only one of the four that expects to post a loss this year.\nAmerican and others have also reduced growth plans or warned the industry could dial back on its goals for expanding capacity, which could keep fares elevated. Reduced capacity can make bookable seats scarcer, driving up prices even more if demand holds.\nThe carriers said demand has been particularly strong for premium seats, which command hundreds, if not thousands of dollars, more than coach tickets.\nSmaller airlines set to report results in the coming weeks, including Frontier Airlines and Allegiant Air, have traditionally focused on more price-sensitive customers, which could show if those travelers are pulling back at all.\nOne factor that could also affect air travel is the demise of Spirit Airlines, which went out of business in early May.\n\"Some of its customers have likely stopped flying,\" Bank of America said in a research note Thursday.",

id demand has been particularly strong for premium seats, which command hundreds, if not thousands of dollars, more than coach tickets.\nSmaller airlines set to report results in the coming weeks, including Frontier Airlines and Allegiant Air, have traditionally focused on more price-sensitive customers, which could show if those travelers are pulling back at all.\nOne factor that could also affect air travel is the demise of Spirit Airlines, which went out of business in early May.\n\"Some of its customers have likely stopped flying,\" Bank of America said in a research note Thursday.",

    "id": "ai-s-black-october-critical-php-flaws-se-95dcdc15",
    "title": "AI's 'Black October': Critical PHP flaws set off global security scramble",
    "titleJa": "AI's 'Black October': Critical PHP flaws set off global security scramble",
    "summaryJa": "Governments and businesses around the globe are scrambling to contain the fallout after the PHP vulnerabilities leaked online.",
    "bodyOriginal": "Cybersecurity teams around the globe are rushing to patch PHP programming language flaws this week, in an artificial intelligence safety moment that's being described as \"Black October.\"\nNearly 70% of all websites use PHP, according to some estimates.\n\"In the last 2 days there have been several dozen cyber attacks which, in isolation, would each have been the worst to happen in an entire calendar year,\" John Milinovich, senior director of product management at Figma, wrote in a post on X on Thursday. \"Every sector from government to education to big tech and banks is being massively affected, and people are starting to freak out.\"\nResearchers at Google's Wiz and the AI firm Calif discovered major vulnerabilities in PHP in August by using advanced AI models from OpenAI and Google. But by Tuesday, the warnings had spread online, prompting governments and businesses around the globe to scramble to contain the fallout.\nMajor AI companies have been warning about the technology's advancing cybersecurity capabilities since April, when Anthropic announced a limited rollout of its powerful model called Mythos. Concerns mounted in July, when OpenAI disclosed that two of its models escaped containment, accessed the open internet and breached a company called Hugging Face.\nExperts believe the PHP security flaws serve as the latest example of what's to come.\nJason Clinton, deputy chief information security officer at Anthropic, wrote in a post on X on Thursday that the cybersecurity landscape is likely to get \"a lot worse\" before it gets better.\n\"Security leaders, never let a crisis go to waste: please go to your boards and ask for help right now,\" Clinton said. \"Not for ai, for the basics. (we need to hold on for ~18 months.)\"\nWhile many large companies have access to advanced models that they can use to harden their systems, serious bugs could be more challenging for small- and medium-sized businesses to address, Chris Krebs, former director of the U.S. Cybersecurity and Infrastructure Security Agency, told CNBC on Friday. He encouraged smaller companies to \"constantly\" scan for vulnerabilities, deploy patches as fast as possible or take legacy systems offline.\n\"This is a significant week or two in cybersecurity,\" Krebs told CNBC's \"Squawk Box.\" \"As I mentioned, 3% of all critical vulnerabilities ever discovered have been found in the last month.\"\nFigma's Milinovich encouraged individuals to set up two-factor authentication for \"everything,\" use a password manager, set up an identity protection app and move smart devices to their own network. He added that people should lean in and experiment with AI to understand how powerful the tools have become.\n\"While I still firmly believe that AI will be a net positive for humanity, it's more clear to me than ever that the societal and individual risk is very real, and is playing out NOW,\" Milinovich said.\nKrebs added that company leaders and employees should check in on their security teams.\n\"Make sure they're doing okay,\" he said. \"They've had a heck of a week.\"\n—CNBC's Isabel O’Brien contributed to this report\nWATCH: Chris Krebs on AI discovering cyber vulnerabilities: It’ll get worse before it gets better",
    "bodyJa": "Cybersecurity teams around the globe are rushing to patch PHP programming language flaws this week, in an artificial intelligence safety moment that's being described as \"Black October.\"\nNearly 70% of all websites use PHP, according to some estimates.\n\"In the last 2 days there have been several dozen cyber attacks which, in isolation, would each have been the worst to happen in an entire calendar year,\" John Milinovich, senior director of product management at Figma, wrote in a post on X on Thursday. \"Every sector from government to education to big tech and banks is being massively affected, and people are starting to freak out.\"\nResearchers at Google's Wiz and the AI firm Calif discovered major vulnerabilities in PHP in August by using advanced AI models from OpenAI and Google. But by Tuesday, the warnings had spread online, prompting governments and businesses around the globe to scramble to contain the fallout.\nMajor AI companies have been warning about the technology's advancing cybersecurity capabilities since April, when Anthropic announced a limited rollout of its powerful model called Mythos. Concerns mounted in July, when OpenAI disclosed that two of its models escaped containment, accessed the open internet and breached a company called Hugging Face.\nExperts believe the PHP security flaws serve as the latest example of what's to come.\nJason Clinton, deputy chief information security officer at Anthropic, wrote in a post on X on Thursday that the cybersecurity landscape is likely to get \"a lot worse\" before it gets better.\n\"Security leaders, never let a crisis go to waste: please go to your boards and ask for help right now,\" Clinton said. \"Not for ai, for the basics. (we need to hold on for ~18 months.)\"\nWhile many large companies have access to advanced models that they can use to harden their systems, serious bugs could be more challenging for small- and medium-sized businesses to address, Chris Krebs, former director of the U.S. Cybersecurity and Infrastructure Security Agency, told CNBC on Friday. He encouraged smaller companies to \"constantly\" scan for vulnerabilities, deploy patches as fast as possible or take legacy systems offline.\n\"This is a significant week or two in cybersecurity,\" Krebs told CNBC's \"Squawk Box.\" \"As I mentioned, 3% of all critical vulnerabilities ever discovered have been found in the last month.\"\nFigma's Milinovich encouraged individuals to set up two-factor authentication for \"everything,\" use a password manager, set up an identity protection app and move smart devices to their own network. He added that people should lean in and experiment with AI to understand how powerful the tools have become.\n\"While I still firmly believe that AI will be a net positive for humanity, it's more clear to me than ever that the societal and individual risk is very real, and is playing out NOW,\" Milinovich said.\nKrebs added that company leaders and employees should check in on their security teams.\n\"Make sure they're doing okay,\" he said. \"They've had a heck of a week.\"\n—CNBC's Isabel O’Brien contributed to this report\nWATCH: Chris Krebs on AI discovering cyber vulnerabilities: It’ll get worse before it gets better",

    "id": "doctors-call-moderna-merck-cancer-vaccin-ea2fac52",
    "title": "Doctors call Moderna, Merck cancer vaccine data a major advancement — despite Wall Street reaction",
    "titleJa": "Doctors call Moderna, Merck cancer vaccine data a major advancement — despite Wall Street reaction",
    "summaryJa": "Six melanoma specialists said the Moderna and Merck vaccine results represent a clinically meaningful result for melanoma patients who underwent surgery.",
    "bodyOriginal": "Leaked confidential data. A major stock sell-off.\nBeneath the chaos surrounding Moderna and Merck's latest data on their personalized cancer vaccine, oncologists see something else: an important milestone in melanoma treatment.\nThe companies on Thursday released detailed results from a Phase 3 trial on their mRNA-based shot after partial data leaked on social media platforms earlier that day.\nThe vaccine, known as intismeran autogene, reduced the risk of melanoma recurrence or death by 42% when given alongside Merck's immunotherapy Keytruda, compared with Keytruda alone. The combination also reduced the risk of cancer spreading to distant parts of the body or death by 38%, compared with just the immunotherapy, according to the trial on roughly 1,100 patients whose tumors were removed by surgery.\nThe stock market's reaction contrasted with the assessment of six melanoma specialists, who told CNBC the results represent a clinically meaningful advance that could eventually become a standard of care for patients who undergo surgery first and have not received immunotherapy before their operation.\n\"This has the potential to be a major breakthrough in melanoma treatment and also cancer immunotherapy in general that will open the door to greater outcomes for patients,\" said Dr. Sekwon Jang, a melanoma specialist at Inova Schar Cancer and principal investigator at one of the trial's U.S. sites.\nDr. Janice Mehnert, NYU Langone skin cancer specialist and trial investigator, added that \"this is the first time we're seeing that when you add something to immunotherapy, you actually boost the efficacy of the immunotherapy.\"\nThe vaccine is not far from potentially entering the market for the first time and reaching melanoma patients. In an interview ahead of the results, Moderna CEO Stéphane Bancel said the company is finishing a filing with regulators as it aims to get the drug fully approved next year.\n\"It's a very, very happy moment for the field, for patients,\" he said.\nMajor advance in melanoma\nAn immunotherapy like Keytruda wakes up the immune system to detect and attack cancer cells. Unlike preventative vaccines, which protect against infections that can cause cancer, Moderna and Merck's treatment acts like a blueprint to train the immune system to recognize and hunt residual cancer cells based on the specific mutations in an individual patient's tumor.\nThe significance of the Phase 3 data extends beyond delaying a recurrence, doctors said. Melanoma can become much more difficult to treat when it returns after surgery and spreads to distant parts of the body, such as the lungs, brain or liver. Patients with advanced disease may require additional treatments, including immunotherapy, radiation or further surgery, and those methods are not guaranteed to work.\nPreventing the cancer from returning could spare patients from ever facing the risks and complexities of metastatic disease altogether.\n\"If we can essentially cure more patients with earlier-stage melanoma and never have to deal with unresectable metastatic disease — that's a wonderful advance,\" said Dr. Michael Postow, chief of the Melanoma Service at Memorial Sloan Kettering Cancer Center and an investigator on the trial.\nIdeally, patients in the future may be able to undergo surgery and receive the vaccine and Keytruda without needing further melanoma treatment, Postow told CNBC.\nStill, questions remain about whether the combination ultimately helps patients live longer, what the benefit looks like over longer periods of time and which patients benefit most.\nThe results also leave open where the personalized vaccine would fit into a changing melanoma treatment landscape, some experts said.\nThe trial tested the vaccine after surgery, alongside Keytruda, rather than against immunotherapy regimens given before surgery. That's an approach increasingly used for eligible patients with resectable melanoma, where the primary tumor can be removed. The data do not show that using the vaccine approach is more or less effective than receiving immunotherapy before surgery.\nThe medical community will get more clarity after Moderna and Merck present the detailed results at the European Society for Medical Oncology conference on Saturday.\nInvestors diverged from doctors\nModerna shares fell as much as 25% Thursday, before regaining some ground, after partial data from the trial leaked on social media. The sell-off came despite the positive results, underscoring the gap between the treatment's clinical promise and investor expectations for its commercial potential. Moderna shares are also up nearly 600% this year due to the cancer shot optimism, creating more potential for a Wall Street letdown.\nInvestors had hoped the vaccine and Keytruda would replicate the results of an earlier phase 2 trial, which showed a roughly 49% reduction in the risk of recurrence or death at five years, RBC Capital Markets analyst Trung Huynh wrote in a note Thursday. Huynh described the phase 3 results as clinically meaningful and likely to support regulatory approval, but said the primary efficacy result landed at the low end of investor expectations.\nBut there was a key difference in the studies: The phase 3 trial included patients with a broader range of risk profiles, including some at lower risk of recurrence than those enrolled in the earlier phase 2 trial, said Dr. George Ansstas, who leads the melanoma department at Washington University in St. Louis. That may have slightly tempered the results, since patients considered lower risk have less chance of recurrence to begin with.\nYet, \"it's great data actually. It's overall consistent with what we've proven in the phase 2 trial,\" said Ansstas, who also worked on the phase 2 trial.\nThe combination showed little difference from Keytruda alone during the first six months of treatment, the companies said. But a separate analysis of the phase 3 data offered a more encouraging signal about the treatment's effect after the six-month mark. The vaccine and Keytruda reduced the risk of recurrence or death by 58% after that point, compared with Keytruda alone.\nAnsstas said the benefit of the personalized cancer vaccine may take several months to emerge because each shot must be custom-manufactured, a process that can take roughly six weeks, while patients begin Keytruda in the meantime. After vaccination begins, the immune system also needs time and repeated doses to develop a response against tumors.\nThat timeline could help explain why the group that received the combination regimen saw even greater benefits around six months, Ansstas said. Still, the explanation is a hypothesis rather than proof of when the vaccine's effect begins.\nDr. Hussein Tawbi, a melanoma expert and trial investigator at the University of Texas MD Anderson Cancer Center, also highlighted the relatively mild side effects associated with the vaccine, including injection-site reactions.\nKeytruda and other cancer therapies can cause potentially serious immune-related side effects. Detailed safety results on Saturday should help clarify the trade-offs of adding the vaccine to the immunotherapy regimen.\nMore work to be done\nFor Moderna, the stakes extend beyond melanoma. The company is working to build a business beyond its Covid vaccine, while Merck is preparing for the eventual loss of patent protection on Keytruda.\nThe companies have several hurdles ahead of them, including selling an individualized therapy that takes several weeks to create for a patient at scale.\n\"I think the downside is that it's super labor-intensive, and you're gonna have to make vaccines for each person, and so you can't just stockpile a million vaccines and then just ship it out when somebody needs it,\" said Dr. Adil Daud, co-director of the Melanoma Center at the University of California San Francisco, who was the lead investigator on the phase 3 trial. \"There is the time and expense, and it's probably going to cost like a lot of money.\"\nModerna and Merck have not disclosed any details about the manufacturing costs for the vaccine.\nHe added that most people who walk into the clinic with a tumor that has not been surgically removed may stick to receiving Keytruda before an operation because \"that approach is simpler and doesn't put the patient through the delay\" of creating the vaccine.\nDaud said he expects the vaccine combination to be used primarily in the adjuvant setting, after surgery, rather than replace established immunotherapy regimens given before an operation. For patients who receive immunotherapy before surgerybut show little or no response, the vaccine combination could offer another option, he said, though that would likely be for a smaller group of patients.\nFor many others, doctors are likely to stick with providing treatment before surgery, including Keytruda alone or a combination of immunotherapies, Daud said.\nModerna and Merck still need to validate the approach in other cancers, including non-small cell lung cancer, bladder cancer and renal cell carcinoma. Success in melanoma does not automatically guarantee that the approach will work in other tumors.\n\"I can dream of creating a log cabin, but we got some wood chops, and we've just knocked down one tree,\" Merck Research Laboratories President Dean Li said in an interview ahead of the results. \"Knocking one tree does not give you a cabin or a village.\"\nModerna's Bancel sees a bright future for the vaccine, saying he believes it will eventually be able to help \"literally thousands and then tens of thousands and then hundreds of thousands of people across different tumors around the world.\"",
    "bodyJa": "Leaked confidential data. A major stock sell-off.\nBeneath the chaos surrounding Moderna and Merck's latest data on their personalized cancer vaccine, oncologists see something else: an important milestone in melanoma treatment.\nThe companies on Thursday released detailed results from a Phase 3 trial on their mRNA-based shot after partial data leaked on social media platforms earlier that day.\nThe vaccine, known as intismeran autogene, reduced the risk of melanoma recurrence or death by 42% when given alongside Merck's immunotherapy Keytruda, compared with Keytruda alone. The combination also reduced the risk of cancer spreading to distant parts of the body or death by 38%, compared with just the immunotherapy, according to the trial on roughly 1,100 patients whose tumors were removed by surgery.\nThe stock market's reaction contrasted with the assessment of six melanoma specialists, who told CNBC the results represent a clinically meaningful advance that could eventually become a standard of care for patients who undergo surgery first and have not received immunotherapy before their operation.\n\"This has the potential to be a major breakthrough in melanoma treatment and also cancer immunotherapy in general that will open the door to greater outcomes for patients,\" said Dr. Sekwon Jang, a melanoma specialist at Inova Schar Cancer and principal investigator at one of the trial's U.S. sites.\nDr. Janice Mehnert, NYU Langone skin cancer specialist and trial investigator, added that \"this is the first time we're seeing that when you add something to immunotherapy, you actually boost the efficacy of the immunotherapy.\"\nThe vaccine is not far from potentially entering the market for the first time and reaching melanoma patients. In an interview ahead of the results, Moderna CEO Stéphane Bancel said the company is finishing a filing with regulators as it aims to get the drug fully approved next year.\n\"It's a very, very happy moment for the field, for patients,\" he said.\nMajor advance in melanoma\nAn immunotherapy like Keytruda wakes up the immune system to detect and attack cancer cells. Unlike preventative vaccines, which protect against infections that can cause cancer, Moderna and Merck's treatment acts like a blueprint to train the immune system to recognize and hunt residual cancer cells based on the specific mutations in an individual patient's tumor.\nThe significance of the Phase 3 data extends beyond delaying a recurrence, doctors said. Melanoma can become much more difficult to treat when it returns after surgery and spreads to distant parts of the body, such as the lungs, brain or liver. Patients with advanced disease may require additional treatments, including immunotherapy, radiation or further surgery, and those methods are not guaranteed to work.\nPreventing the cancer from returning could spare patients from ever facing the risks and complexities of metastatic disease altogether.\n\"If we can essentially cure more patients with earlier-stage melanoma and never have to deal with unresectable metastatic disease — that's a wonderful advance,\" said Dr. Michael Postow, chief of the Melanoma Service at Memorial Sloan Kettering Cancer Center and an investigator on the trial.\nIdeally, patients in the future may be able to undergo surgery and receive the vaccine and Keytruda without needing further melanoma treatment, Postow told CNBC.\nStill, questions remain about whether the combination ultimately helps patients live longer, what the benefit looks like over longer periods of time and which patients benefit most.\nThe results also leave open where the personalized vaccine would fit into a changing melanoma treatment landscape, some experts said.\nThe trial tested the vaccine after surgery, alongside Keytruda, rather than against immunotherapy regimens given before surgery. That's an approach increasingly used for eligible patients with resectable melanoma, where the primary tumor can be removed. The data do not show that using the vaccine approach is more or less effective than receiving immunotherapy before surgery.\nThe medical community will get more clarity after Moderna and Merck present the detailed results at the European Society for Medical Oncology conference on Saturday.\nInvestors diverged from doctors\nModerna shares fell as much as 25% Thursday, before regaining some ground, after partial data from the trial leaked on social media. The sell-off came despite the positive results, underscoring the gap between the treatment's clinical promise and investor expectations for its commercial potential. Moderna shares are also up nearly 600% this year due to the cancer shot optimism, creating more potential for a Wall Street letdown.\nInvestors had hoped the vaccine and Keytruda would replicate the results of an earlier phase 2 trial, which showed a roughly 49% reduction in the risk of recurrence or death at five years, RBC Capital Markets analyst Trung Huynh wrote in a note Thursday. Huynh described the phase 3 results as clinically meaningful and likely to support regulatory approval, but said the primary efficacy result landed at the low end of investor expectations.\nBut there was a key difference in the studies: The phase 3 trial included patients with a broader range of risk profiles, including some at lower risk of recurrence than those enrolled in the earlier phase 2 trial, said Dr. George Ansstas, who leads the melanoma department at Washington University in St. Louis. That may have slightly tempered the results, since patients considered lower risk have less chance of recurrence to begin with.\nYet, \"it's great data actually. It's overall consistent with what we've proven in the phase 2 trial,\" said Ansstas, who also worked on the phase 2 trial.\nThe combination showed little difference from Keytruda alone during the first six months of treatment, the companies said. But a separate analysis of the phase 3 data offered a more encouraging signal about the treatment's effect after the six-month mark. The vaccine and Keytruda reduced the risk of recurrence or death by 58% after that point, compared with Keytruda alone.\nAnsstas said the benefit of the personalized cancer vaccine may take several months to emerge because each shot must be custom-manufactured, a process that can take roughly six weeks, while patients begin Keytruda in the meantime. After vaccination begins, the immune system also needs time and repeated doses to develop a response against tumors.\nThat timeline could help explain why the group that received the combination regimen saw even greater benefits around six months, Ansstas said. Still, the explanation is a hypothesis rather than proof of when the vaccine's effect begins.\nDr. Hussein Tawbi, a melanoma expert and trial investigator at the University of Texas MD Anderson Cancer Center, also highlighted the relatively mild side effects associated with the vaccine, including injection-site reactions.\nKeytruda and other cancer therapies can cause potentially serious immune-related side effects. Detailed safety results on Saturday should help clarify the trade-offs of adding the vaccine to the immunotherapy regimen.\nMore work to be done\nFor Moderna, the stakes extend beyond melanoma. The company is working to build a business beyond its Covid vaccine, while Merck is preparing for the eventual loss of patent protection on Keytruda.\nThe companies have several hurdles ahead of them, including selling an individualized therapy that takes several weeks to create for a patient at scale.\n\"I think the downside is that it's super labor-intensive, and you're gonna have to make vaccines for each person, and so you can't just stockpile a million vaccines and then just ship it out when somebody needs it,\" said Dr. Adil Daud, co-director of the Melanoma Center at the University of California San Francisco, who was the lead investigator on the phase 3 trial. \"There is the time and expense, and it's probably going to cost like a lot of money.\"\nModerna and Merck have not disclosed any details about the manufacturing costs for the vaccine.\nHe added that most people who walk into the clinic with a tumor that has not been surgically removed may stick to receiving Keytruda before an operation because \"that approach is simpler and doesn't put the patient through the delay\" of creating the vaccine.\nDaud said he expects the vaccine combination to be used primarily in the adjuvant setting, after surgery, rather than replace established immunotherapy regimens given before an operation. For patients who receive immunotherapy before surgerybut show little or no response, the vaccine combination could offer another option, he said, though that would likely be for a smaller group of patients.\nFor many others, doctors are likely to stick with providing treatment before surgery, including Keytruda alone or a combination of immunotherapies, Daud said.\nModerna and Merck still need to validate the approach in other cancers, including non-small cell lung cancer, bladder cancer and renal cell carcinoma. Success in melanoma does not automatically guarantee that the approach will work in other tumors.\n\"I can dream of creating a log cabin, but we got some wood chops, and we've just knocked down one tree,\" Merck Research Laboratories President Dean Li said in an interview ahead of the results. \"Knocking one tree does not give you a cabin or a village.\"\nModerna's Bancel sees a bright future for the vaccine, saying he believes it will eventually be able to help \"literally thousands and then tens of thousands and then hundreds of thousands of people across different tumors around the world.\"",

    "id": "doj-sues-to-block-alaska-from-certifying-4ebcc09a",
    "title": "DOJ sues to block Alaska from certifying Senate race winner if Republican narrowly loses",
    "titleJa": "DOJ sues to block Alaska from certifying Senate race winner if Republican narrowly loses",
    "summaryJa": "The Alaska race is one of several contests around the United States that could determine whether Republicans retain their slim majority in the Senate",
    "bodyOriginal": "The Department of Justice filed an extraordinary lawsuit seeking to block Alaska from certifying the winner of its upcoming U.S. Senate election if incumbent Republican Sen. Dan Sullivan loses.\nThe lawsuit cites what it suggests is likely voter confusion from having another candidate, named Daniel J. Sullivan, on the ballot and the chance that could help Democratic nominee Mary Peltola win what is expected to be a close contest between her and the incumbent Sullivan.\nThe DOJ is asking a judge to bar Alaska from certifying \"any result that may be impacted by voter confusion ... pending an investigation to determine whether votes cast for Daniel J. Sullivan were meant to be cast for Senator Sullivan.\"\nThe Alaska race is one of several Senate contests around the United States that could determine whether Republicans retain their slim majority in the upper chamber of Congress. Alaska's general election for the Senate is conducted by ranked-choice voting. Voters rank their candidates in order of preference.\n\"Should Alaska certify any electoral results tainted by the inclusion on the ballot of Daniel J. Sullivan — whose candidacy, Defendant Beecher [Alaska Elections Director Carol Beecher] found, is 'for the purpose of confusing or misleading voters and compromising the fairness of the ballot' — the State and its officers will fail in its obligation to protect the integrity of its election,\" the suit in U.S. District Court in Alaska says.\n\"The United States accordingly brings this lawsuit to protect the integrity of the 2026 Senate election in Alaska,\" says the suit, which names the state, Beecher, Alaska's Election Boards, and the state Ballot Counting Review Board as defendants.\nCNBC has requested comment from the DOJ, both Sullivans and Peltola about the suit.\nThe suit says that \"the sole purpose\" of the candidacy of Daniel J. Sullivan \"is to benefit the Peltola campaign by reducing the number of votes for Senator Sullivan.\" The suit says Daniel J. Sullivan decided to run as a Republican \"with the intention of misleading supporters of Senator Sullivan into voting for him.\"\nDaniel J. Sullivan received just 2.5% of the vote in Alaska's open primary on Aug. 28, but that was enough to win him one of four spots on the Senate general election ballot.\nPeltola got 49.5% in the primary, and Sen. Sullivan received 41.1%. Another Republican, Gerald Heikes, received just 1.1% of the primary vote, earning him the fourth spot on the ballot.\nAlthough Daniel J. Sullivan sought to run as a Republican, the Division of Elections decided not to list that party next to his name on the general election ballot. Both Sen. Sullivan and Heikes have the words \"registered Republican\" next to their name on the ballot.\nIn its suit, the DOJ said, \"Daniel J. Sullivan's presence on the ballot threatens to mislead Alaskan\ncitizens who want to vote for Senator Sullivan.\"\n\"For example, some supporters of Senator Sullivan likely will inadvertently vote for Daniel J. Sullivan,\" the suit says.\n\"Other supporters of Senator Sullivan likely will be confused as to how to rank the three Republican candidates as to defeat Peltola. They might not rank Senator Sullivan at all, resulting in votes for Daniel J. Sullivan to be transferred to Peltola after Daniel J. Sullivan's all-but-guaranteed elimination in the first or second round of tabulations.\"\nThe Cook Political Report with Amy Walter rates the Alaska Senate race as one of seven \"toss-up\" contests for that chamber.\nFiftyPlusOne's average of polling in the race shows Peltola, the former U.S. House member from Alaska, with a narrow two-point lead over Sullivan.",

s Daniel J. Sullivan decided to run as a Republican \"with the intention of misleading supporters of Senator Sullivan into voting for him.\"\nDaniel J. Sullivan received just 2.5% of the vote in Alaska's open primary on Aug. 28, but that was enough to win him one of four spots on the Senate general election ballot.\nPeltola got 49.5% in the primary, and Sen. Sullivan received 41.1%. Another Republican, Gerald Heikes, received just 1.1% of the primary vote, earning him the fourth spot on the ballot.\nAlthough Daniel J. Sullivan sought to run as a Republican, the Division of Elections decided not to list that party next to his name on the general election ballot. Both Sen. Sullivan and Heikes have the words \"registered Republican\" next to their name on the ballot.\nIn its suit, the DOJ said, \"Daniel J. Sullivan's presence on the ballot threatens to mislead Alaskan\ncitizens who want to vote for Senator Sullivan.\"\n\"For example, some supporters of Senator Sullivan likely will inadvertently vote for Daniel J. Sullivan,\" the suit says.\n\"Other supporters of Senator Sullivan likely will be confused as to how to rank the three Republican candidates as to defeat Peltola. They might not rank Senator Sullivan at all, resulting in votes for Daniel J. Sullivan to be transferred to Peltola after Daniel J. Sullivan's all-but-guaranteed elimination in the first or second round of tabulations.\"\nThe Cook Political Report with Amy Walter rates the Alaska Senate race as one of seven \"toss-up\" contests for that chamber.\nFiftyPlusOne's average of polling in the race shows Peltola, the former U.S. House member from Alaska, with a narrow two-point lead over Sullivan.",

    "titleJa": "TikTok U.S. hunts for multiple gigawatts of computing capacity, sources tell CNBC",
    "summaryJa": "The operator of the social media platform in the U.S. has sounded out opportunities to obtain capacity over the coming years.",
    "bodyOriginal": "TikTok's U.S. entity is looking to secure multiple gigawatts of computing capacity, sources told CNBC, amid a global scramble for digital infrastructure deals.\nThe company, officially TikTok USDS Joint Venture, operates the social media platform in the U.S. and has sounded out opportunities to obtain capacity over the coming years, two people familiar with the discussions, who asked to remain anonymous as they weren't authorized to share the information, told CNBC.\nTikTok U.S. is looking for four gigawatts of compute power by the early 2030s, one source said.\nCompanies across the world are looking to secure more compute capacity as artificial intelligence workloads become more prominent.\nA company spokesperson told CNBC that the company \"runs primarily on Oracle Cloud Infrastructure in the U.S. and Oracle will continue to be our primary cloud infrastructure provider.\"\nOracle Cloud Infrastructure, or OCI, typically runs in facilities that Oracle leases. CNBC has approached Oracle for comment.\nThere are signs TikTok U.S.' product plans could require extra compute going forward.\nThe company has numerous machine learning roles live on its website. A job advert posted by TikTok states that the company is \"shipping a flagship B2B AI product at the frontier of large-model inference and creative automation.\"\nTikTok U.S. localizes algorithm training\nTikTok USDS Joint Venture was established in 2026 in compliance with U.S. President Donald Trump's executive order mandating the divestiture of TikTok in the U.S. from its Chinese parent company, ByteDance.\nIn January, TikTok U.S. said it would \"retrain, test, and update\" its prized recommendation algorithm, which is built on machine learning, on U.S. user data. The company's recommendation algorithm will be \"secured in Oracle's U.S. cloud environment,\" it said.\nTikTok U.S. has three managing investors, Silver Lake, Oracle and MGX, each holding 15%. The Dell Family Office, the investment firm of Michael Dell, is also an investor. ByteDance retained 19.9% of the new entity.",

    "summaryJa": "Kashim Chowdhury denied being dishonest when not telling employers he had other jobs.",
    "bodyOriginal": "Civil servant who juggled five jobs says he was 'surprised' to be charged with fraud\n- Published\nA civil servant accused of fraudulently juggling multiple government jobs says he was ''surprised'' to have been charged with fraud.\nKashim Chowdhury told the jury at Southwark Crown Court he had not been dishonest in failing to tell his employers he had other government jobs.\n\"At that time I was just on auto pilot, I was like a robot, I was not thinking clearly,\" he said.\nChowdhury, 55, from east London, is accused of nine counts of fraud. He denies acting dishonestly or intending to make a dishonest gain.\nBetween 2020 and 2023 Chowdhury had eight overlapping public sector jobs. He was contractually obliged to work full time and was paid a full-time salary by each organisation. He is accused of fraudulently earning more than £284,000.\nIn March 2023 Chowdhury began working for the Home Office despite being under contract to work full time at the Department for Environment, Food and Rural Affairs (Defra), the UK Health Security Agency (UKHSA), the Department for Business and Trade and the Food Standards Agency.\nThe court was told he started the Home Office job while on sick leave from three of his other jobs.\nProsecuting barrister Lucy Organ asked him: \"If you were really sick for work, how were you able to start your work at the Home Office?\"\nChowdhury said: \"I did not want this job at the Home Office, I was told there would be adequate support and I could work whatever hours I wanted to work.\"\nOrgan also asked why he did not submit a sick note to the Home Office \"You were using these sick notes to be able to cope. It was all too much wasn't it?\"\nChowdhury rejected the suggestion, adding: \"I wanted to carry on working.\"\nIn May 2023, Chowdhury was contracted to work 183 hours a week, more than the number of hours in seven days.\nHe told the jury he agreed with his employers to work flexibly and that his work was project or output based. He said this was agreed \"informally\" via text messages but the phones used to send the texts had gone missing when his house was searched by investigators.\nHe said that to cope with the workload he would work from 07:00 on Saturdays and Sundays and not finish until 20:00 or 21:00.\nCivil servant faked illness with make-up to juggle five jobs, court hears\n- Published14 October\nCivil servant admits he 'made mistakes' juggling five government jobs\n- Published2 days ago\nOrgan asked him: \"Wasn't that a bit much for you?\"\n\"I was house bound, I was looking after my mum,\" he said.\nThe prosecution alleges Chowdhury managed to keep his overlapping jobs secret because he worked entirely remotely. He told his employers he was the sole carer for his elderly mother and the prosecution alleges he \"exploited this opportunity\".\nHis line manager at the UKHSA, Aleesha Adams, organised a video call with him in May 2023 to discuss his sick leave.\nShe previously told the court she was surprised when he logged on wearing white make-up because his name led her to expect to see an Asian man with darker skin.\nShe told the court that as the meeting went on the make-up started coming off his forehead. ''He was sweating, it was like rubbing off so it was darker underneath and darker on the neck.\"\nBut Chowdhury denied having worn make-up at the meeting\n''That's a smear, I've never worn make-up in my life. At that particular time, I was suffering from anxiety and depression. I had already submitted my sick note, there was no need to put on make-up.''\nThe trial continues.",
    "bodyJa": "Civil servant who juggled five jobs says he was 'surprised' to be charged with fraud\n- Published\nA civil servant accused of fraudulently juggling multiple government jobs says he was ''surprised'' to have been charged with fraud.\nKashim Chowdhury told the jury at Southwark Crown Court he had not been dishonest in failing to tell his employers he had other government jobs.\n\"At that time I was just on auto pilot, I was like a robot, I was not thinking clearly,\" he said.\nChowdhury, 55, from east London, is accused of nine counts of fraud. He denies acting dishonestly or intending to make a dishonest gain.\nBetween 2020 and 2023 Chowdhury had eight overlapping public sector jobs. He was contractually obliged to work full time and was paid a full-time salary by each organisation. He is accused of fraudulently earning more than £284,000.\nIn March 2023 Chowdhury began working for the Home Office despite being under contract to work full time at the Department for Environment, Food and Rural Affairs (Defra), the UK Health Security Agency (UKHSA), the Department for Business and Trade and the Food Standards Agency.\nThe court was told he started the Home Office job while on sick leave from three of his other jobs.\nProsecuting barrister Lucy Organ asked him: \"If you were really sick for work, how were you able to start your work at the Home Office?\"\nChowdhury said: \"I did not want this job at the Home Office, I was told there would be adequate support and I could work whatever hours I wanted to work.\"\nOrgan also asked why he did not submit a sick note to the Home Office \"You were using these sick notes to be able to cope. It was all too much wasn't it?\"\nChowdhury rejected the suggestion, adding: \"I wanted to carry on working.\"\nIn May 2023, Chowdhury was contracted to work 183 hours a week, more than the number of hours in seven days.\nHe told the jury he agreed with his employers to work flexibly and that his work was project or output based. He said this was agreed \"informally\" via text messages but the phones used to send the texts had gone missing when his house was searched by investigators.\nHe said that to cope with the workload he would work from 07:00 on Saturdays and Sundays and not finish until 20:00 or 21:00.\nCivil servant faked illness with make-up to juggle five jobs, court hears\n- Published14 October\nCivil servant admits he 'made mistakes' juggling five government jobs\n- Published2 days ago\nOrgan asked him: \"Wasn't that a bit much for you?\"\n\"I was house bound, I was looking after my mum,\" he said.\nThe prosecution alleges Chowdhury managed to keep his overlapping jobs secret because he worked entirely remotely. He told his employers he was the sole carer for his elderly mother and the prosecution alleges he \"exploited this opportunity\".\nHis line manager at the UKHSA, Aleesha Adams, organised a video call with him in May 2023 to discuss his sick leave.\nShe previously told the court she was surprised when he logged on wearing white make-up because his name led her to expect to see an Asian man with darker skin.\nShe told the court that as the meeting went on the make-up started coming off his forehead. ''He was sweating, it was like rubbing off so it was darker underneath and darker on the neck.\"\nBut Chowdhury denied having worn make-up at the meeting\n''That's a smear, I've never worn make-up in my life. At that particular time, I was suffering from anxiety and depression. I had already submitted my sick note, there was no need to put on make-up.''\nThe trial continues.",

    "title": "American Express is cutting 5% of its workforce to 'prepare for AI'",
    "titleJa": "American Express is cutting 5% of its workforce to 'prepare for AI'",
    "summaryJa": "Amex, which reported third-quarter results earlier Friday, is taking a $336 million restructuring charge in the quarter, CEO Stephen Squeri said Friday.",
    "bodyOriginal": "American Express is cutting thousands of employees as the leading credit card company prepares for artificial intelligence to take over more of its internal processes.\nAmex is eliminating 5% of its global workforce and taking a $336 million restructuring charge, CEO Stephen Squeri told analysts Friday on the company's third-quarter earnings call. The firm had almost 77,000 employees at the end of 2025.\nChief Financial Officer Christophe Le Caillec told CNBC in an interview that the restructuring was to make American Express \"leaner, more agile, and also to prepare for AI.\"\n\"You don't want to automate processes that are not optimally structured,\" Le Caillec said. \"So what we're doing here is to reduce layers and increase spans of controls, so that we can automate and take advantage of AI in the coming quarters and the coming years.\"\nThe Amex announcement reflects a broader trend across financial services, where banks are working to replace repetitive roles with AI automation. On Thursday, Barclays confirmed plans to trim 5,000 jobs — also roughly 5% of its staff — in another tech-driven cost initiative. The moves come even as the sector is enjoying robust profits from growing consumer spending and resilient credit.\nDuring the analyst call, Squeri said that the charge was to improve the company's efficiency.\n\"We've got good momentum, but to accelerate innovation and win over the next few years, we needed to become [a] more agile and efficient organization,\" Squeri said.\n'Run rogue'\nSqueri devoted a 10-minute section of his prepared remarks to his views on AI, focusing mainly on how it will be used to personalize experiences and offers for Amex cardholders.\nWhile the CEO emphasized the need to meet customers' desires to use AI, including agents, he added that Amex is \"not going to let assistants run rogue through our system.\"\n\"We need to protect our customers [and] merchants, and we're only going to allow agents to access our systems that are either approved through API or MCP channels,\" he said, citing two ways to securely connect outside platforms with Amex systems.\nAmex posted quarterly results that topped Wall Street profit expectations. Adjusted earnings per share were $4.68, topping the $4.48 average estimate of analysts, according to LSEG.\nThe company raised its full-year earnings guidance to a range of $18.30 to $18.60 per share, on an unadjusted basis, up from its previous target of $17.30 to $17.90.\nThat metric was helped by proceeds from Amex's sale of its stake in Global Business Travel Group, part of which went into the restructuring plan, Le Caillec said.\nTotal revenue rose 9% to $20.06 billion, also coming in slightly below Wall Street's $20.12 billion LSEG forecast. Executives attributed part of the spending drag to recent exits from small business co-brand partnerships.\nShares of the card company fell roughly 3% in morning trading.",
    "bodyJa": "American Express is cutting thousands of employees as the leading credit card company prepares for artificial intelligence to take over more of its internal processes.\nAmex is eliminating 5% of its global workforce and taking a $336 million restructuring charge, CEO Stephen Squeri told analysts Friday on the company's third-quarter earnings call. The firm had almost 77,000 employees at the end of 2025.\nChief Financial Officer Christophe Le Caillec told CNBC in an interview that the restructuring was to make American Express \"leaner, more agile, and also to prepare for AI.\"\n\"You don't want to automate processes that are not optimally structured,\" Le Caillec said. \"So what we're doing here is to reduce layers and increase spans of controls, so that we can automate and take advantage of AI in the coming quarters and the coming years.\"\nThe Amex announcement reflects a broader trend across financial services, where banks are working to replace repetitive roles with AI automation. On Thursday, Barclays confirmed plans to trim 5,000 jobs — also roughly 5% of its staff — in another tech-driven cost initiative. The moves come even as the sector is enjoying robust profits from growing consumer spending and resilient credit.\nDuring the analyst call, Squeri said that the charge was to improve the company's efficiency.\n\"We've got good momentum, but to accelerate innovation and win over the next few years, we needed to become [a] more agile and efficient organization,\" Squeri said.\n'Run rogue'\nSqueri devoted a 10-minute section of his prepared remarks to his views on AI, focusing mainly on how it will be used to personalize experiences and offers for Amex cardholders.\nWhile the CEO emphasized the need to meet customers' desires to use AI, including agents, he added that Amex is \"not going to let assistants run rogue through our system.\"\n\"We need to protect our customers [and] merchants, and we're only going to allow agents to access our systems that are either approved through API or MCP channels,\" he said, citing two ways to securely connect outside platforms with Amex systems.\nAmex posted quarterly results that topped Wall Street profit expectations. Adjusted earnings per share were $4.68, topping the $4.48 average estimate of analysts, according to LSEG.\nThe company raised its full-year earnings guidance to a range of $18.30 to $18.60 per share, on an unadjusted basis, up from its previous target of $17.30 to $17.90.\nThat metric was helped by proceeds from Amex's sale of its stake in Global Business Travel Group, part of which went into the restructuring plan, Le Caillec said.\nTotal revenue rose 9% to $20.06 billion, also coming in slightly below Wall Street's $20.12 billion LSEG forecast. Executives attributed part of the spending drag to recent exits from small business co-brand partnerships.\nShares of the card company fell roughly 3% in morning trading.",
