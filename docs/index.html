    "bodyOriginal": "Arrest made after fire at Hitler's mountaintop Eagle's Nest retreat\n- Published\nPolice in the southern German state of Bavaria have detained a suspect during a fire at Adolf Hitler's Alpine mountain retreat, the Kehlsteinhaus, also known as the Eagle's Nest.\nDispatchers in Traunstein received a fire alarm from the building at 21:15 local time (19:15 GMT) on Friday and firefighters found it engulfed in flames.\nDifficult terrain was hindering efforts to extinguish the blaze and it was still burning early on Saturday, police said, with some 200 emergency personnel deployed. There were no reports of injuries.\nThe retreat, above the town of Berchtesgaden, was one of several buildings in the area used by the Nazi dictator and his entourage during World War Two.\nHitler and top Nazi officials used his nearby Berghof residence to plan the invasion of the USSR in 1941 and the whole complex was considered one of his headquarters.\nHe also used the area as a backdrop for propaganda films portraying him as a lover of animals and nature.\nA criminal investigation is under way to determine whether the suspect is connected to the fire.\nCompleted by the Nazis in 1938, the Eagle's Nest escaped destruction after their defeat in 1945.\nSince then, it has become a popular tourist destination and houses a mountain inn.\nIt serves as \"a cautionary reminder of the abysses of the inhumane Nazi dictatorship\", according to its official website, external.\nDuring WW2, Hitler and his followers were responsible for the deaths of tens of millions of people, including the mass murder of European Jews. Homosexuals, gypsies, the disabled and ethnic minorities were sent to concentration camps and put to death.\nThere has been a wider debate in Germany and Vienna over whether to preserve, repurpose or demolish buildings connected to Hitler.\nWhile some say these buildings should be preserved for historical reasons, others have raised concerns that they could be used as monuments or places of pilgrimage for neo-Nazis and far-right extremists.\nIn June, Berlin authorities announced they would tear down one of Hitler's bunkers - described at the time as \"the power centre of Nazi Germany\" - to build flats and offices on the site.\nThose critical of the plans said the bunker had \"significant historical value\" and that it should have been turned into a museum and memorial site with an exhibit about the end of the war.\nAnd in July, after years of controversy, Austrian authorities refurbished the house in the town of Braunau am Inn in which Hitler was born and turned it into a police station.\nRelated topics\n- Published15 November 2025",
    "bodyJa": "Arrest made after fire at Hitler's mountaintop Eagle's Nest retreat\n- Published\nPolice in the southern German state of Bavaria have detained a suspect during a fire at Adolf Hitler's Alpine mountain retreat, the Kehlsteinhaus, also known as the Eagle's Nest.\nDispatchers in Traunstein received a fire alarm from the building at 21:15 local time (19:15 GMT) on Friday and firefighters found it engulfed in flames.\nDifficult terrain was hindering efforts to extinguish the blaze and it was still burning early on Saturday, police said, with some 200 emergency personnel deployed. There were no reports of injuries.\nThe retreat, above the town of Berchtesgaden, was one of several buildings in the area used by the Nazi dictator and his entourage during World War Two.\nHitler and top Nazi officials used his nearby Berghof residence to plan the invasion of the USSR in 1941 and the whole complex was considered one of his headquarters.\nHe also used the area as a backdrop for propaganda films portraying him as a lover of animals and nature.\nA criminal investigation is under way to determine whether the suspect is connected to the fire.\nCompleted by the Nazis in 1938, the Eagle's Nest escaped destruction after their defeat in 1945.\nSince then, it has become a popular tourist destination and houses a mountain inn.\nIt serves as \"a cautionary reminder of the abysses of the inhumane Nazi dictatorship\", according to its official website, external.\nDuring WW2, Hitler and his followers were responsible for the deaths of tens of millions of people, including the mass murder of European Jews. Homosexuals, gypsies, the disabled and ethnic minorities were sent to concentration camps and put to death.\nThere has been a wider debate in Germany and Vienna over whether to preserve, repurpose or demolish buildings connected to Hitler.\nWhile some say these buildings should be preserved for historical reasons, others have raised concerns that they could be used as monuments or places of pilgrimage for neo-Nazis and far-right extremists.\nIn June, Berlin authorities announced they would tear down one of Hitler's bunkers - described at the time as \"the power centre of Nazi Germany\" - to build flats and offices on the site.\nThose critical of the plans said the bunker had \"significant historical value\" and that it should have been turned into a museum and memorial site with an exhibit about the end of the war.\nAnd in July, after years of controversy, Austrian authorities refurbished the house in the town of Braunau am Inn in which Hitler was born and turned it into a police station.\nRelated topics\n- Published15 November 2025",

    "title": "Trump is pushing a massive AI buildout. His own voters are wary of what comes with it",
    "titleJa": "Trump is pushing a massive AI buildout. His own voters are wary of what comes with it",
    "summaryJa": "A new CNBC survey finds broad voter opposition to nearby AI data centers, creating a political challenge for Trump and Republicans ahead of the midterm election.",
    "bodyOriginal": "President Donald Trump has cast America's artificial intelligence race with China as a national-security imperative, pushing faster development of the technology and an immense buildout of the data centers and power infrastructure needed to fuel it.\nBut the new CNBC All-America Economic Survey reveals a growing political tension beneath that agenda: Republican voters broadly support the push for AI development, but many oppose building the sprawling infrastructure needed to power it in their own backyards.\nNearly 55% of MAGA supporters want companies to keep developing advanced AI while Congress works on regulations, versus 27% who favor a pause. But only 29% would support a data center within 10 miles of their home, while 40% oppose one. Among all Republicans and Republican-leaning voters — not just those who identify themselves with the MAGA movement — those who say they would support a data center near their home falls to 24%.\nAcross the electorate, 63% don't want a nearby AI data center and just 13% support one. Democrats lead the opposition: 80% oppose nearby facilities while just 4% support them.\nThat resistance is increasingly forcing Trump and vulnerable Republicans who once championed data centers to recalibrate as they head into a bleak midterm election environment for the party.\n\"Many people are annoyed by these data centers,\" said Brad Carson, a former Democratic congressman from Oklahoma and co-founder of Public First Action PAC, an AI-industry-backed political group pushing for stronger regulation and safeguards. \"People are also strongly insistent upon reasonable guardrails of AI, and that's going to be hard to beat.\"\nThe CNBC survey of 1,000 registered voters nationwide was conducted Oct. 14-18 by Hart Research Associates and Public Opinion Strategies and has a margin of error of plus or minus 3.1 percentage points. The data-center proximity question was asked of a half-sample of roughly 500 voters, with a margin of error of plus or minus 4.38 percentage points.\nRead the full survey results here.\nThe politics have shifted from the early AI boom, when Washington and Silicon Valley sold the technology as an avenue for investment, growth and American dominance.\nBut as the buildout accelerates, its physical costs are becoming harder to ignore. Communities are fighting data centers over spiking electric bills, soaring electricity and water demand, noise, land use and taxpayer subsidies. Coupled with job-displacement fears from AI, opponents now point to the facilities as a physical symbol of who benefits from the boom and who gets stuck with the bill.\nThe industry rejects that framing.\n“The data center industry provides significant, tangible benefits,” said Dan Diorio of the Data Center Coalition, pointing to jobs, investment and tax revenue while adding that operators are committed to “paying for the energy we use.\"\nBut when asked their top concerns if Republicans retain Congress, 18% of voters in the survey cited a failure to regulate AI and data centers. That tied continued military efforts in Iran and outranked continued Immigration and Customs Enforcement deportations at 15%, cuts to health insurance subsidies at 10% and an extension of Trump's tariffs at 5%.\nEven among voters who want Republicans to retain control, 17% cited weak AI and data center oversight — second only to a failure to bring down prices.\nGOP strategists have taken note.\nIn August, the National Republican Senatorial Committee warned AI companies that data center backlash was threatening Sen. Jon Husted's reelection in Ohio, calling the issue a midterm \"sleeper\" that could sour politicians nationwide on future projects, Axios reported.\nAs Ohio lieutenant governor in 2024, Husted helped announce a $10 billion Amazon Web Services expansion, calling AI facilities \"crucial to America's economic superiority.\" Now, in a tight Senate race against Democrat Sherrod Brown, who has made data-center opposition a campaign issue, Husted is promoting stalled legislation to make large facilities cover their own grid and generation costs rather than pass them on to residential ratepayers.\nTexas tells a similar story. Less than a year after Gov. Greg Abbott hailed the state as an \"epicenter of AI development,\" he halted data center permits pending grid- and water-impact reviews and called for ending state tax incentives.\nTrump himself is showing signs of the political pressure. In a Truth Social post Wednesday, he said data center developers should pay host communities a financial \"dividend\" and generate their own power, arguing that local payouts can turn unpopular projects into popular ones.\nFor now, Democrats hold a modest edge on managing the issue: 32% of voters trust them to handle data center expansion, versus 24% for the Republicans. But 27% said neither party would do a better job than the other.\nAnd the CNBC survey indicates this skepticism runs deeper than local zoning. Overall, 52% of registered voters want advanced AI development paused until Congress passes safety regulations, compared to 32% who favor moving ahead to keep pace with China. Democrats remain far more cautious: 70% favor a pause, while just 18% support pushing forward.\n\"The debate has shifted dramatically,\" Carson told CNBC. \"A year ago, there were many people who said, 'Let it cook, no regulation at all, exempt the companies from normal rules.'\" Carson said sentiment toward AI has \"deteriorated a lot over the last six months.\"",

    "summaryJa": "She was a close family member of the first victim, a man who had travelled from the Democratic Republic of Congo.",
    "bodyOriginal": "Woman, 65, becomes second patient to die of Ebola in Kenya\n- Published\nKenya has recorded its second death from Ebola as it handles its first ever outbreak of the disease.\nA woman, aged 65, who was a close family member of the first victim, a man who had travelled from the Democratic Republic of Congo, died after being placed in quarantine, the health ministry said.\nSeven other Ebola patients were receiving treatment at two isolation facilities, it added.\nAll the cases were within \"one cluster, with no evidence of community spread\", the ministry said.\nMore than 4,000 people have died in Africa since Ebola was confirmed in DR Congo in May, making it the second most deadly outbreak of the disease.\nKenya's latest victim had been under quarantine when she developed symptoms on 13 October, the health ministry said.\nThe first death, on 5 October, was that of a man who fell ill in September and was treated in several hospitals in DR Congo before arriving in the Kenyan capital, Nairobi, where he died a few days later.\nThose still being treated are three other relatives of the first victim, three health workers and a hospital cleaner.\nThe US has warned its citizens against travelling to Kenya, while neighbouring countries such as Uganda, Ethiopia and Somalia are also on alert.\nEbola is a rare but deadly disease, external caused by a virus. As the disease progresses, vomiting and diarrhoea develop and it can lead to organ failure. Some, but not all, patients develop internal and external bleeding.\nThe disease spreads from one person to another by contact with infected bodily fluids such as blood or vomit.\nThe Bundibugyo species of Ebola is relatively rare, with no approved vaccine or treatment - though trials are under way.\nWith more than 9,500 cases in DR Congo, Kenya faces a steady risk of new cases arriving across borders, according to the International Rescue Committee, which has been working alongside both governments to contain the spread.\nKenya has introduced enhanced screening for travellers arriving from DR Congo and nine other countries it considers to be at high risk: Uganda, Tanzania, Rwanda, Burundi, Angola, Zambia, Ethiopia, South Sudan and the Central African Republic.\nTravellers arriving from those countries are required to complete a digital surveillance form before boarding their flights and present a QR code to port health officials on arrival.\nKenya also ordered enhanced public health screening of aircraft arriving from those countries, as authorities seek to prevent further imported cases.\nWithin the country, the government has been sharing public messages to create awareness about Ebola, including encouraging people to promptly report any suspected cases and seek care at a hospital.\nIs Ebola under control in Kenya after nine cases confirmed?\n- Published3 days ago\nWoman with Ebola in Nigeria confirmed as wife of Swiss diplomat\n- Published1 day ago\nNigeria's health minister said its sole confirmed case of Ebola appeared to be genetically related to a strain identified earlier in Kenya.\nProf Ali Pate said there was no evidence so far that the Kenyan patient had travelled to Nigeria, but that further testing was under way.\nHealth officials have been investigating whether Nigeria's first case crossed paths with Kenya's first patient. Both are believed to have travelled through Uganda's Entebbe airport earlier this month.\nUganda's health ministry announced on Friday that people who had travelled to DR Congo would no longer be able to transit via Uganda as part of its prevention measures.\nGo to BBCAfrica.com, external for more news from the African continent.\nFollow us on Twitter @BBCAfrica, external, on Facebook at BBC Africa, external or on Instagram at bbcafrica, external",
    "bodyJa": "Woman, 65, becomes second patient to die of Ebola in Kenya\n- Published\nKenya has recorded its second death from Ebola as it handles its first ever outbreak of the disease.\nA woman, aged 65, who was a close family member of the first victim, a man who had travelled from the Democratic Republic of Congo, died after being placed in quarantine, the health ministry said.\nSeven other Ebola patients were receiving treatment at two isolation facilities, it added.\nAll the cases were within \"one cluster, with no evidence of community spread\", the ministry said.\nMore than 4,000 people have died in Africa since Ebola was confirmed in DR Congo in May, making it the second most deadly outbreak of the disease.\nKenya's latest victim had been under quarantine when she developed symptoms on 13 October, the health ministry said.\nThe first death, on 5 October, was that of a man who fell ill in September and was treated in several hospitals in DR Congo before arriving in the Kenyan capital, Nairobi, where he died a few days later.\nThose still being treated are three other relatives of the first victim, three health workers and a hospital cleaner.\nThe US has warned its citizens against travelling to Kenya, while neighbouring countries such as Uganda, Ethiopia and Somalia are also on alert.\nEbola is a rare but deadly disease, external caused by a virus. As the disease progresses, vomiting and diarrhoea develop and it can lead to organ failure. Some, but not all, patients develop internal and external bleeding.\nThe disease spreads from one person to another by contact with infected bodily fluids such as blood or vomit.\nThe Bundibugyo species of Ebola is relatively rare, with no approved vaccine or treatment - though trials are under way.\nWith more than 9,500 cases in DR Congo, Kenya faces a steady risk of new cases arriving across borders, according to the International Rescue Committee, which has been working alongside both governments to contain the spread.\nKenya has introduced enhanced screening for travellers arriving from DR Congo and nine other countries it considers to be at high risk: Uganda, Tanzania, Rwanda, Burundi, Angola, Zambia, Ethiopia, South Sudan and the Central African Republic.\nTravellers arriving from those countries are required to complete a digital surveillance form before boarding their flights and present a QR code to port health officials on arrival.\nKenya also ordered enhanced public health screening of aircraft arriving from those countries, as authorities seek to prevent further imported cases.\nWithin the country, the government has been sharing public messages to create awareness about Ebola, including encouraging people to promptly report any suspected cases and seek care at a hospital.\nIs Ebola under control in Kenya after nine cases confirmed?\n- Published3 days ago\nWoman with Ebola in Nigeria confirmed as wife of Swiss diplomat\n- Published1 day ago\nNigeria's health minister said its sole confirmed case of Ebola appeared to be genetically related to a strain identified earlier in Kenya.\nProf Ali Pate said there was no evidence so far that the Kenyan patient had travelled to Nigeria, but that further testing was under way.\nHealth officials have been investigating whether Nigeria's first case crossed paths with Kenya's first patient. Both are believed to have travelled through Uganda's Entebbe airport earlier this month.\nUganda's health ministry announced on Friday that people who had travelled to DR Congo would no longer be able to transit via Uganda as part of its prevention measures.\nGo to BBCAfrica.com, external for more news from the African continent.\nFollow us on Twitter @BBCAfrica, external, on Facebook at BBC Africa, external or on Instagram at bbcafrica, external",

    "id": "what-next-for-france-as-riots-rattle-mar-323a11e5",
    "title": "What next for France as riots rattle markets? Three questions facing investors ahead of more protests",
    "titleJa": "What next for France as riots rattle markets? Three questions facing investors ahead of more protests",
    "summaryJa": "French unrest pushed bond yields to a 24-year high as investors weigh budget, growth and sectors risks ahead of more protests.",
    "bodyOriginal": "France's unrest is fueling investor concerns over the country's fiscal outlook, after borrowing costs hit their highest level since 2002 earlier this week.\nWith further demonstrations planned, fund managers are assessing whether prolonged disruption could weaken growth, undermine confidence and make it harder for the government to deliver planned budget savings.\nRating agency Moody's on Friday kept its Aa3 credit rating on France, a level it still deems \"high grade,\" but maintained its negative outlook on the nation.\n\"The negative outlook reflects the increased risk that the fragmentation of France's political landscape will continue to impair the functioning of the country's legislative institutions,\" Moody's said in its report.\nMoody's noted that it could return France's outlook to stable if its institutions can narrow its budget deficit.\nCan France's government pass its budget?\nFrance's government aims to reduce the budget deficit to 5% of GDP in 2027, from a projected 5.4% in 2026. The National Assembly is due to resume debating on the budget's tax measures, which are intended to generate savings, on Oct. 27 but opposition lawmakers are resisting the plans.\nAlain Durré, head of EMEA economic research at Natixis CIB, said the government was determined to prevent a sharp rise in borrowing costs.\nDurré said the government could try to stick to its fiscal targets by invoking Article 49.3 — which allows it to push a bill through the assembly without a final vote unless lawmakers can pass a no-confidence motion — or by using executive ordinances.\nThat could help settle nerves and restore investor confidence, Durré added, noting that recent pressure on French sovereign debt has been driven primarily by tactical portfolio reallocations, with traditional buy-and-hold investors \"still sitting on the sidelines.\"\nThe yield on benchmark 10-year French government bonds, known as OATs, climbed 11 basis points Thursday to its highest level since 2002. That pushed the spread over 10-year German Bunds — the benchmark for euro zone debt — to its widest level since November 2011.\nCharlotte de Montpellier, senior economist for France and Switzerland at ING, said the unrest \"adds another layer of uncertainty\" to the budgetary and political concerns already weighing on French assets, and \"reinforces the perception that any future government will find it difficult to deliver the reforms and savings required.\"\n\"It remains unclear whether the 2027 budget will clear parliament,\" said Matthew Ryan, head of market strategy at Ebury. \"Even if it does, it seems set to be so riddled with concessions to both the left and the right that the deficit problem is left insufficiently addressed.\"\nWhat damage will the unrest do to France's growth outlook?\nFresh demonstrations are planned for Oct. 24, and a union-backed national day of strikes and protests is set for Nov. 5, with anti-establishment Yellow Vest protestors among those calling for further rallies.\nIn a note on Oct. 20 after the violence of the previous weekend, de Montpellier said that, while the market can look past short-lived disruption, \"a lasting loss of confidence can have a bigger impact.\"\n\"These events further darken an economic outlook that was already unfavorable,\" she said. \"We had expected French GDP growth of just 0.3% in 2026 and 0.6% in 2027. If the unrest continues, confidence deteriorates further or market tensions intensify, growth could be even weaker.\"\nThe Yellow Vest movement may have reduced French GDP growth in the fourth quarter of 2018 by 0.1 percentage point, according to an INSEE estimate cited by de Montpellier. Industrial action during the spring 2023 pension protests reduced first-quarter GDP growth by around 0.1 percentage point, according to the Banque de France.\nIn her Oct. 20 note, she said violence could keep households away from city centers and prompt tourists to postpone trips and businesses to delay investment.\nDurré said French consumer sentiment was already near historic lows before the latest protests, leaving little room for the country to absorb a fresh macroeconomic shock.\nHe added the unrest raises \"two key red flags\" for markets.\n\"First, the risk that prolonged disruption drags on GDP growth. Second, fears that political pressure could derail government plans for critical spending cuts ... Either way, that would widen the deficit and blow past the government's 5% GDP target.\"\nWhich French sectors are most exposed?\nFrance's CAC 40 has fallen 4.5% over the past month. ING identified retail, hospitality and tourism, and transport and logistics as the sectors most directly exposed to the turmoil.\nDe Montpellier said shops and shopping centers face lower footfall, closures and lost sales; hotels, cafés, restaurants and travel services risk losing activity that customers are less likely to reschedule. Transport and logistics could also be hit if disruption persists, she added.\nCarrefour shares plunged more than 14% Wednesday after the supermarket giant cut its profit outlook and reduced investment, citing the unrest — along with rising energy costs — as a drag on consumer sentiment. CEO Alexandre Bompard said the country faces an \"unprecedented situation.\"\nMore than 2,000 businesses had been directly affected by Tuesday, ING said, citing estimates from France's network of chambers of commerce.\nThe impact could extend well beyond companies most directly exposed to the unrest, said Kevin Thozet, portfolio advisor and member of the investment committee at Carmignac.\n\"For equities, this does not help banks, given the higher cost of equity, while prolonged uncertainty can slow loan growth and create credit problems,\" he told CNBC via email.\nFrance's prestigious luxury sector generates most of its sales abroad. LVMH has relatively limited direct exposure to the French market, with France accounting for just 8% of its 2025 revenue. But the demonstrations could weigh on tourism and therefore tax-free purchases, which account for around 20% of LVMH's revenue in France, Thozet said.\n\"A further six months of political vacuum is a very long time for markets, the economy and entrepreneurs,\" he added.",
    "bodyJa": "France's unrest is fueling investor concerns over the country's fiscal outlook, after borrowing costs hit their highest level since 2002 earlier this week.\nWith further demonstrations planned, fund managers are assessing whether prolonged disruption could weaken growth, undermine confidence and make it harder for the government to deliver planned budget savings.\nRating agency Moody's on Friday kept its Aa3 credit rating on France, a level it still deems \"high grade,\" but maintained its negative outlook on the nation.\n\"The negative outlook reflects the increased risk that the fragmentation of France's political landscape will continue to impair the functioning of the country's legislative institutions,\" Moody's said in its report.\nMoody's noted that it could return France's outlook to stable if its institutions can narrow its budget deficit.\nCan France's government pass its budget?\nFrance's government aims to reduce the budget deficit to 5% of GDP in 2027, from a projected 5.4% in 2026. The National Assembly is due to resume debating on the budget's tax measures, which are intended to generate savings, on Oct. 27 but opposition lawmakers are resisting the plans.\nAlain Durré, head of EMEA economic research at Natixis CIB, said the government was determined to prevent a sharp rise in borrowing costs.\nDurré said the government could try to stick to its fiscal targets by invoking Article 49.3 — which allows it to push a bill through the assembly without a final vote unless lawmakers can pass a no-confidence motion — or by using executive ordinances.\nThat could help settle nerves and restore investor confidence, Durré added, noting that recent pressure on French sovereign debt has been driven primarily by tactical portfolio reallocations, with traditional buy-and-hold investors \"still sitting on the sidelines.\"\nThe yield on benchmark 10-year French government bonds, known as OATs, climbed 11 basis points Thursday to its highest level since 2002. That pushed the spread over 10-year German Bunds — the benchmark for euro zone debt — to its widest level since November 2011.\nCharlotte de Montpellier, senior economist for France and Switzerland at ING, said the unrest \"adds another layer of uncertainty\" to the budgetary and political concerns already weighing on French assets, and \"reinforces the perception that any future government will find it difficult to deliver the reforms and savings required.\"\n\"It remains unclear whether the 2027 budget will clear parliament,\" said Matthew Ryan, head of market strategy at Ebury. \"Even if it does, it seems set to be so riddled with concessions to both the left and the right that the deficit problem is left insufficiently addressed.\"\nWhat damage will the unrest do to France's growth outlook?\nFresh demonstrations are planned for Oct. 24, and a union-backed national day of strikes and protests is set for Nov. 5, with anti-establishment Yellow Vest protestors among those calling for further rallies.\nIn a note on Oct. 20 after the violence of the previous weekend, de Montpellier said that, while the market can look past short-lived disruption, \"a lasting loss of confidence can have a bigger impact.\"\n\"These events further darken an economic outlook that was already unfavorable,\" she said. \"We had expected French GDP growth of just 0.3% in 2026 and 0.6% in 2027. If the unrest continues, confidence deteriorates further or market tensions intensify, growth could be even weaker.\"\nThe Yellow Vest movement may have reduced French GDP growth in the fourth quarter of 2018 by 0.1 percentage point, according to an INSEE estimate cited by de Montpellier. Industrial action during the spring 2023 pension protests reduced first-quarter GDP growth by around 0.1 percentage point, according to the Banque de France.\nIn her Oct. 20 note, she said violence could keep households away from city centers and prompt tourists to postpone trips and businesses to delay investment.\nDurré said French consumer sentiment was already near historic lows before the latest protests, leaving little room for the country to absorb a fresh macroeconomic shock.\nHe added the unrest raises \"two key red flags\" for markets.\n\"First, the risk that prolonged disruption drags on GDP growth. Second, fears that political pressure could derail government plans for critical spending cuts ... Either way, that would widen the deficit and blow past the government's 5% GDP target.\"\nWhich French sectors are most exposed?\nFrance's CAC 40 has fallen 4.5% over the past month. ING identified retail, hospitality and tourism, and transport and logistics as the sectors most directly exposed to the turmoil.\nDe Montpellier said shops and shopping centers face lower footfall, closures and lost sales; hotels, cafés, restaurants and travel services risk losing activity that customers are less likely to reschedule. Transport and logistics could also be hit if disruption persists, she added.\nCarrefour shares plunged more than 14% Wednesday after the supermarket giant cut its profit outlook and reduced investment, citing the unrest — along with rising energy costs — as a drag on consumer sentiment. CEO Alexandre Bompard said the country faces an \"unprecedented situation.\"\nMore than 2,000 businesses had been directly affected by Tuesday, ING said, citing estimates from France's network of chambers of commerce.\nThe impact could extend well beyond companies most directly exposed to the unrest, said Kevin Thozet, portfolio advisor and member of the investment committee at Carmignac.\n\"For equities, this does not help banks, given the higher cost of equity, while prolonged uncertainty can slow loan growth and create credit problems,\" he told CNBC via email.\nFrance's prestigious luxury sector generates most of its sales abroad. LVMH has relatively limited direct exposure to the French market, with France accounting for just 8% of its 2025 revenue. But the demonstrations could weigh on tourism and therefore tax-free purchases, which account for around 20% of LVMH's revenue in France, Thozet said.\n\"A further six months of political vacuum is a very long time for markets, the economy and entrepreneurs,\" he added.",

    "title": "What a day in customer service looks like — as AI changes everything",
    "titleJa": "What a day in customer service looks like — as AI changes everything",
    "summaryJa": "Customer service can be a \"really, really difficult job.\" Will AI make it easier — or cause even more headaches?",
    "bodyOriginal": "For Kaylee Harris, who works in customer service for a credit card company, a day at work now looks very different.\nHer hours used to be filled with calls, note-taking and lengthy card disclosures. Now, thanks to artificial intelligence, she can focus more on each customer, Harris told CNBC.\nFor Shannon, AI has also changed things — but not in a good way. She works in customer service for a telecommunications company in Cardiff, Wales, and did not want to share her surname for fear of being identified by her employer. She told CNBC that AI-generated notes at her current workplace are often riddled with errors, \"so I just write my own.\"\nAt her previous employer, a property services company, senior management told staff to \"ChatGPT it\" if they didn't know the answer. AI agents booked appointments, but when they couldn't offer a customer the requested date, they passed the case to a human.\nStaff were \"constantly fighting fires,\" Shannon said. \"All the complicated cases came to us, causing a lot of burnout.\"\nGood for both employees and customers?\nIn theory, automation in customer service should mean human agents spend less time on admin and more time helping customers with problems that require human judgment, empathy and experience.\nNikola Mrkšić, CEO and co-founder of London-headquartered PolyAI, which develops voice AI systems for customer service, said contact-center agents can face \"maximum abuse for minimum wage.\"\nThey often deal with frustrated customers while working under strict performance metrics, sometimes without the authority or information to resolve problems, he told CNBC. He sees AI agents as a way to help shoulder that load.\nMaximum abuse for minimum wageNikola MrkšićPolyAI\n\"It's a really, really difficult job,\" he said. \"I think with AI, we have a shot at bridging the gap to make it better for both [customers and employees].\"\nBritish telecom and media company Virgin Media O2 launched an AI voice agent in September, which it said was designed to do just that. The agent handles routine issues so human advisors can spend more time on complex or sensitive cases.\nAt U.K.-based customer experience company ArvatoConnect, CEO Debra Maxwell told CNBC the company aims for 70% of interactions to be handled by technology and 30% by people.\nOne AI tool it developed for the U.K. government's procurement agency, the Crown Commercial Service, generates draft supplier viability assessments with 97% accuracy, she said, reducing the need for hours of manual data extraction.\nThe mental load of harder cases\nAs AI takes on routine tasks, human agents may be left dealing with a greater share of complicated cases — and be required to pick up the slack when the technology fails.\nThe pressure on customer-service staff comes amid reports of rising workloads across the industry.\nAccording to MaxContact's 2025/26 U.K. Contact Centre KPI Benchmarking Insights Report, more than half of surveyed contact-center decision-makers said agent workloads had increased, up from around 40% in 2024, although the survey doesn't establish what is driving the rise.\n[R]elatively straightforward tasks can provide a bit of psychological respite between more demanding onesAmanda JonesKing's College London\nAmanda Jones, who researches organizational behavior and the future of work at King's College London, specializes in work intensification — the process by which jobs become more demanding over time. She told CNBC that AI could make call-center work even more intense if human agents are increasingly left with the toughest interactions.\n\"Some customers may already be frustrated by the time they reach that human,\" she said. \"One thing we sometimes overlook is that relatively straightforward tasks can provide a bit of psychological respite between more demanding ones. If those disappear, the intensity of the working day could increase considerably, even if the overall volume of work doesn't.\"\nJones cautioned that productivity gains may also bring more intense performance targets. And as routine tasks are automated, workers could lose opportunities to develop the experience needed for more demanding work.\n\"So, we could end up expecting people to perform more demanding work while simultaneously reducing the experiences that traditionally helped prepare them for it,\" she said.\nThe human touch\nArvatoConnect's Maxwell argued that average handling times may need to increase as employees take on more complex cases.\n\"We assess whether [human] agents understood the customer's needs, exercised sound judgement and reached the right resolution,\" she said. \"Not whether they followed a script or hit an arbitrary time target.\"\nHarris sees the upsides of AI tools, despite occasional system glitches that create more work. But she worries that the push to automate is coming, ultimately, at the expense of customer experience.\n\"As a country, I think we are focusing on getting things done faster and choosing quantity over quality … resulting in customers being fed up with the way AI is being pushed on everyone,\" she said.\nShannon also sees the potential benefits of using AI, but doesn't think it should ever replace real customer service.\n\"I believe people buy from people; with AI you don't get to experience that,\" she said. \"I go the extra mile. Can AI give that feeling? Can it feel genuine?\"",

at productivity gains may also bring more intense performance targets. And as routine tasks are automated, workers could lose opportunities to develop the experience needed for more demanding work.\n\"So, we could end up expecting people to perform more demanding work while simultaneously reducing the experiences that traditionally helped prepare them for it,\" she said.\nThe human touch\nArvatoConnect's Maxwell argued that average handling times may need to increase as employees take on more complex cases.\n\"We assess whether [human] agents understood the customer's needs, exercised sound judgement and reached the right resolution,\" she said. \"Not whether they followed a script or hit an arbitrary time target.\"\nHarris sees the upsides of AI tools, despite occasional system glitches that create more work. But she worries that the push to automate is coming, ultimately, at the expense of customer experience.\n\"As a country, I think we are focusing on getting things done faster and choosing quantity over quality … resulting in customers being fed up with the way AI is being pushed on everyone,\" she said.\nShannon also sees the potential benefits of using AI, but doesn't think it should ever replace real customer service.\n\"I believe people buy from people; with AI you don't get to experience that,\" she said. \"I go the extra mile. Can AI give that feeling? Can it feel genuine?\"",

    "title": "Turmoil hits AI buildout as neoclouds face pressure, credit risks mount and Solidigm pulls IPO",
    "titleJa": "Turmoil hits AI buildout as neoclouds face pressure, credit risks mount and Solidigm pulls IPO",
    "summaryJa": "Stock slumps, pulled IPOs and rising spreads on credit default swaps this week sets stage for hyperscaler earnings.",
    "bodyOriginal": "Neoclouds tanked. Credit default swaps soared. Meta turned cash flow negative. And SK Hynix's Solidigm unit canceled plans for its initial public offering.\nIt's been a rocky week for the AI infrastructure trade.\nThe Nasdaq followed Thursday's beating with an additional drop on Friday to end the week down 0.7%. Among the hyperscalers, the worst performer was Alphabet, shares of which sank 6% ahead of the internet giant's third-quarter earnings report next week. Microsoft and Amazon are also on the docket, and they each saw shares fall less than 1%.\nWhile the tech market has thus far avoided a dramatic across-the-board sell-off, the artificial intelligence build-out is showing signs of strain.\nShares of neoclouds CoreWeave, Nebius and IREN all fell sharply this week, bringing their losses for October to well over 30% each. CoreWeave, the leader of the pack, has seen spreads on its CDS widen past 11%, generally viewed as a distress level, as investors have to pay up for protection against default.\nMeanwhile, yields on the company's 2031 and 2032 unsecured notes topped 15%.\n\"What investors are doing is throwing every baby out with the bathwater and saying anyone who is a neocloud\" will be devalued, Roundhill Investments CEO Dave Mazza told CNBC's \"Squawk on the Street\" on Thursday.\nFears aren't limited to the U.S. market. Shares of Elice Group, a South Korean cloud provider, dropped 30% in their market debut on Tuesday, and shares of Australia's NextDC plunged 39.5% on Wednesday after the data center operator slashed its annual earnings forecast.\nAI optimism has been the major market driver for the past couple of years, as unrelenting demand for new models and services pushes the world's biggest tech companies to spend on infrastructure at historic rates. However, skeptics are getting more vocal in their concerns that returns on AI investment won't justify the capital expenditures.\nAnalysts at research and advisory firm Gartner predict that 80% of neocloud companies will either cease operations or be absorbed by 2030.\nNvidia CEO Jensen Huang, perhaps the leading AI evangelist remains bullish. Huang said this week at a company conference in Berlin that \"demand for the neoclouds is off the charts.\"\n\"The demand of the capital is much greater than the availability of the capital,\" Huang told CNBC's Arjun Kharpal. \"That's going to get solved.\"\nWithdrawn IPO\nWall Street isn't convinced. On Thursday, South Korean memory giant SK Hynix, one of the biggest winners in the AI boom, said it's pulling an IPO for its U.S.-based Solidigm unit, citing market volatility. SK Hynix purchased Solidigm, which makes NAND and SSD storage for data centers, from Intel in 2021.\n\"While an IPO was expected to ease investment burdens and expand capacity for shareholder returns, the review has been discontinued in light of market conditions and share price trends,\" SK Hynix said in a release.\nDespite the turmoil, all of tech's mega-caps have maintained their investment-grade rating even as they've opened their wallets to fuel their build-outs, including through debt. Even with that group of companies, the market is showing some jitters.\nMeta saw its stock plunge 7% on Thursday after the company reported negative free cash flow in the third quarter of over $2 billion while raising the floor of its full-year capex to $135 billion from $130 billion. Meta also said it plans to spend about $825 billion over the coming years on various leases and contracts, with over $450 billion of those leases being non-cancellable take-or-pay agreements.\nSpreads on Meta's five-year CDS reached all-time highs of over 124 basis points. CDS on Nvidia and Oracle also touched records, with their spreads hitting 126 basis points and 343 basis points, respectively, this week. Oracle's stock has lost over one-third of its value this year, and now the company faces risks of a credit rating downgrade.\nJohn Williams, who leads the derivatives practice at law firm Milbank LLP, says investors are seeking numerous ways beyond buying CDS to hedge their bets with respect to the AI trade.\n\"There's so much investment going into it that it's just very appropriate to look for risk management tools, completely regardless of whether you're bullish or bearish,\" Williams said. \"It would be crazy for people not to be looking for appropriate risk management tools for it.\"\nBrian Stutland, portfolio manager at Equity Armor Investments, told CNBC's \"SquawkBox Asia\" last week that it's \"all kind of tied together,\" referring to AI's impact on the whole market.\n\"Can you drop a bowling ball in one part of the pool and not get any waves downstream to the rest of the Nasdaq?\" he said. \"I don't know. I have some concern about that.\"\n— CNBC's Katie Tarasov contributed to this report\nWATCH: Concerned about rising CDS spreads in data center build-out",

ctice at law firm Milbank LLP, says investors are seeking numerous ways beyond buying CDS to hedge their bets with respect to the AI trade.\n\"There's so much investment going into it that it's just very appropriate to look for risk management tools, completely regardless of whether you're bullish or bearish,\" Williams said. \"It would be crazy for people not to be looking for appropriate risk management tools for it.\"\nBrian Stutland, portfolio manager at Equity Armor Investments, told CNBC's \"SquawkBox Asia\" last week that it's \"all kind of tied together,\" referring to AI's impact on the whole market.\n\"Can you drop a bowling ball in one part of the pool and not get any waves downstream to the rest of the Nasdaq?\" he said. \"I don't know. I have some concern about that.\"\n— CNBC's Katie Tarasov contributed to this report\nWATCH: Concerned about rising CDS spreads in data center build-out",

    "bodyOriginal": "Australian MP's condition improves after alleged car attack\n- Published\nThe condition of Helen Haines, the Australian MP hit by a car five days ago in north-east Victoria, has improved from critical to serious but stable.\nThe independent MP, 65, had both her legs amputated after what authorities say was a deliberate attack outside her electorate office in Wangaratta, north-east of Melbourne, on Monday.\nIn the latest update on Saturday morning, the Alfred Hospital in Melbourne said Haines was in a serious but stable condition, the first improvement since she was airlifted there.\nHer alleged attacker, 43-year-old Brendan Nugent, was arrested shortly after the incident and has since appeared in court on three charges.\nThe politician's husband, Phil Haines, said on Wednesday that the \"horrendous incident\" had caused his wife significant injuries but \"her heart and her mind\" were \"in good shape\".\nNugent, who was arrested moments after he allegedly drove his Toyota LandCruiser into the MP, appeared in court to face three charges: dangerous driving causing serious injury, intentionally causing serious injury, and causing harm to a Commonwealth public official.\nPolice said more charges might be laid, including attempted murder.\nHis lawyer said his client had \"mental health concerns\" but did not give any further detail.\nVictoria Police has said its investigation, with support from the Australian Federal Police, remains ongoing and a motive is yet to be established.\nInvestigators are looking into whether drug use or medication played a part in the incident.\nNugent's family has said they were long-time friends with Haines.\nShortly after the alleged attack, Australian Prime Minister Anthony Albanese told ABC television that there had been a \"rise in temperature\" and \"too much shouting, not enough discourse\" in Australia.\nHaines, known for stances such as supporting stronger climate action, entered parliament in 2019 after working as a nurse and midwife.\n- Published2 days ago\n- Published3 days ago",
    "bodyJa": "Australian MP's condition improves after alleged car attack\n- Published\nThe condition of Helen Haines, the Australian MP hit by a car five days ago in north-east Victoria, has improved from critical to serious but stable.\nThe independent MP, 65, had both her legs amputated after what authorities say was a deliberate attack outside her electorate office in Wangaratta, north-east of Melbourne, on Monday.\nIn the latest update on Saturday morning, the Alfred Hospital in Melbourne said Haines was in a serious but stable condition, the first improvement since she was airlifted there.\nHer alleged attacker, 43-year-old Brendan Nugent, was arrested shortly after the incident and has since appeared in court on three charges.\nThe politician's husband, Phil Haines, said on Wednesday that the \"horrendous incident\" had caused his wife significant injuries but \"her heart and her mind\" were \"in good shape\".\nNugent, who was arrested moments after he allegedly drove his Toyota LandCruiser into the MP, appeared in court to face three charges: dangerous driving causing serious injury, intentionally causing serious injury, and causing harm to a Commonwealth public official.\nPolice said more charges might be laid, including attempted murder.\nHis lawyer said his client had \"mental health concerns\" but did not give any further detail.\nVictoria Police has said its investigation, with support from the Australian Federal Police, remains ongoing and a motive is yet to be established.\nInvestigators are looking into whether drug use or medication played a part in the incident.\nNugent's family has said they were long-time friends with Haines.\nShortly after the alleged attack, Australian Prime Minister Anthony Albanese told ABC television that there had been a \"rise in temperature\" and \"too much shouting, not enough discourse\" in Australia.\nHaines, known for stances such as supporting stronger climate action, entered parliament in 2019 after working as a nurse and midwife.\n- Published2 days ago\n- Published3 days ago",

    "bodyOriginal": "How does the UK state pension compare with other countries?\n- Published\nGetting older is something few of us want to think about. Yet how we fund our later years, and how much we'll get, has been a hot topic.\nThe triple lock formula - state pensions increasing by the greatest of 2.5%, earnings growth, or inflation - means those benefits have risen far faster than the earnings of workers since its introduction in 2011.\nBut as housing costs have also been rising fast, pensioner poverty has actually increased slightly in the last decade.\nNevertheless, even if you take those costs into consideration, pensioners are less likely to be in relative poverty - that is, having to get by on less than 60% of the income of the typical household - than families with children or working-age people.\nAnd funding the triple lock has already cost the state billions more than initially envisaged. With that cost set to balloon further, the debate over whether that is sustainable, or fair, has raged for a while.\nAndy Burnham intends to start a new system in a few years, which would see the state pension increase by at least inflation or 2.5%, and remove the automatic annual link with average earnings. It will likely mean less generous increases, although it will keep track with earnings growth over the longer term.\nBut are pensioners being short-changed in other ways? How do we compare with other countries?\nOne way of measuring that is to look at how generous the typical pension is relative to workers' average earnings - the replacement rate.\nThe OECD considers the outlook for those born at the start of the millennium in different countries on average wages, and assumes the pension system as it existed in 2022 is in place.\nOn that basis, looking at the basic state pension, retirement benefits in the UK look low compared with other wealthy countries.\nAnd that is even when you consider that our system compels workers to be automatically enrolled in occupational schemes.\nIf you consider both of those, then after tax, UK retirement benefits would be 54.2% of average UK earnings, compared with an average of 63.2% across wealthy countries.\nBurnham vows to end existing pension triple lock in 2030 to help fund care\n- Published29 September\nState pension likely to top £13,000 a year\n- Published15 September\nWhat is the triple lock and why are people talking about it?\n- Published29 September\nBut then there is income from other occupational and personal pensions, which are more prevalent in the UK. Include those and the gap narrows.\nHowever, that does also mean that those relying on just the state pension for their incomes are a fair bit worse off than many retired people elsewhere.\nSo does that make the case for boosting spending on public pensions in the UK?\nWell, the amount spent on the state pension is set to top £150bn a year, the single most expensive benefit to fund.\nBut other figures from the OECD show that the UK state spends a lower amount on total retirement benefits, relative to the size of its economy, than the average wealthy country.\nBut there are two issues to consider.\nFirstly, this is about political choices, and the UK chooses to dedicate larger amounts to items such as universal healthcare.\nAnd secondly, with ageing populations, the OECD reckons the amount needed for pensions may be set to soar in many nations by 2060 (the exceptions largely being those that are deploying changes).\nIts predictions for the UK are likely to rise by less under the revised triple lock system being put in place by Andy Burnham but it may still mean more borrowing.\nAs it is, £1 in every £13 the UK government spends is to pay the interest on existing debt. And countries with more generous pensions, such as Italy, have faced pressure to reform.\nSo in many ways, with auto-enrolment into workplace pensions, the UK appears to be ahead of the game in insisting on universal privately funded pensions for workers. But that system raises another issue: the gender pension gap.\nThe gender pension gap is the difference between the average pension income of men and women aged 65 and over, as a percentage of men's average pension income.\nIt found that the typical gap in most wealthy countries is around 22.8% in favour of men.\nBut in the UK women typically get a pension that is a third less than what a man gets - in the main, due to the reliance on private pensions - although it should be noted that the most recent data the OECD has for the UK is for 2021.\nWomen are more likely to have received lower pay over the course of their working lives, taken career breaks or worked part time. And the hit to pension pots can be stark.\nSo step back and look at the big picture and British pensioners - and those who have yet to retire - may feel others have it better elsewhere.\nBut the message from all of this isn't to dwell on outrage but to take action.\nThe state pension has become more generous over the years, but if you want to enjoy the same kind of retirement as those elsewhere, get saving.\nThat is - if you can, and if you haven't left it too late.",

    "id": "uk-to-invest-100m-in-world-first-ai-bios-7aae0e6c",
    "title": "UK to invest £100m in 'world first' AI Biosecurity Lab",
    "titleJa": "UK to invest £100m in 'world first' AI Biosecurity Lab",
    "summaryJa": "The chancellor will unveil AI spending aimed at shoring up the UK's defences in Wednesday's Budget.",
    "bodyOriginal": "UK to invest £100m in 'world first' AI Biosecurity Lab\n- Published\nThe UK says it will establish a national AI Biosecurity Lab (AIBL) to help strengthen its defences against emerging biological threats.\nAs part of Wednesday's Budget, the government will commit £100m to establishing the new, \"world first\" institute with the support of leading AI firms.\nThe chancellor will also pledge millions of pounds in spending across a range of initiatives aimed at shoring up the UK's ability to respond to evolving cyber, biological and AI-enabled threats.\n\"AI will transform daily life: every firm, community, hospital, school, and every aspect of our economy can benefit,\" John Healey said.\n\"I understand and share the concerns of working people, so I am setting out a distinctively British approach to AI.\n\"One that doesn't leave workers behind and defends our national interest, while ensuring the benefits of AI-enabled growth are felt right across the country.\"\nThe full details about the role and remit of the new lab are yet to emerge.\nBut the AI Minister Kanishka Narayan said it would be a \"major new global institution\" that brings together \"world-leading scientific expertise\" to ensure the UK can safeguard its citizens and goals as AI develops.\n\"That means staying ahead of emerging threats, from cyber attacks to biological risks, while building more of the critical technology our security depends on,\" he said.\n\"By backing British science, advanced chips and our own AI companies, we can strengthen our national security, rebuild Britain's industrial strength and create good, skilled jobs across the country.\"\nThe AI Biosecurity Lab's creation will also be supported by leading AI developers, with OpenAI and Anthropic providing £200m worth of AI model credits that can be spent on the use of their models.\nWhat is AI, how does it work and why are some people concerned about it?\n- Published14 September\nDon't leave AI to tech bros and oligarchs, UK's AI minister says\n- Published23 hours ago\nThe Chancellor's plans to boost AI spending will also see an additional £120m committed to the UK's AI Security Institute (AISI).\nEstablished by the former Conservative government in 2023, the lab evaluates the risks of the most advanced and powerful models - and has been championed for its role in helping build a collaborative and open approach to AI testing.\nThe additional funding announced by the Chancellor will aim to help ensure the lab can continue its efforts and work, particularly amid growing calls for technical standards and guardrails for AI development.\nIt will come alongside a £60m investment in what it coined a \"National Cyber Shield\" which it said would use agentic AI to boost cyber-defences, and £70m funding towards a National Exposure and Real-Time Vulnerability (NERV) Centre.\nThis, it said, would harness AI tools to detect cyber vulnerabilities across the UK's critical infrastructure and economy.\nIt comes after the UK government revealed it was among organisations around the world to have taken some sites offline as a precaution after critical flaws were surfaced in a popular programming language.\nResearchers who helped surface the vulnerabilities in PHP - a popular server-side scripting language used in web development for decades - warned platforms which use it could be exposed to potential hacks.\nThere have been no reports of any successful exploits of the flaw, coined php2shell, so far.\nBut experts have warned that the incident shows how quickly and easily bugs which have lain long dormant may be surfaced - and potentially exploited - using AI.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\n- Published12 October\n- Published11 September\n- Published30 September",

, UK's AI minister says\n- Published23 hours ago\nThe Chancellor's plans to boost AI spending will also see an additional £120m committed to the UK's AI Security Institute (AISI).\nEstablished by the former Conservative government in 2023, the lab evaluates the risks of the most advanced and powerful models - and has been championed for its role in helping build a collaborative and open approach to AI testing.\nThe additional funding announced by the Chancellor will aim to help ensure the lab can continue its efforts and work, particularly amid growing calls for technical standards and guardrails for AI development.\nIt will come alongside a £60m investment in what it coined a \"National Cyber Shield\" which it said would use agentic AI to boost cyber-defences, and £70m funding towards a National Exposure and Real-Time Vulnerability (NERV) Centre.\nThis, it said, would harness AI tools to detect cyber vulnerabilities across the UK's critical infrastructure and economy.\nIt comes after the UK government revealed it was among organisations around the world to have taken some sites offline as a precaution after critical flaws were surfaced in a popular programming language.\nResearchers who helped surface the vulnerabilities in PHP - a popular server-side scripting language used in web development for decades - warned platforms which use it could be exposed to potential hacks.\nThere have been no reports of any successful exploits of the flaw, coined php2shell, so far.\nBut experts have warned that the incident shows how quickly and easily bugs which have lain long dormant may be surfaced - and potentially exploited - using AI.\nSign up for our Tech Decoded newsletter to follow the world's top tech stories and trends. Outside the UK? Sign up here.\n- Published12 October\n- Published11 September\n- Published30 September",

    "id": "student-movement-takes-serbia-s-vu-i-to-764ed8f6",
    "title": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election",
    "titleJa": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election",
    "summaryJa": "The Student List has emerged from almost two years of anti-corruption protests to form the biggest challenge to Vučić's rule.",
    "bodyOriginal": "Student movement takes Serbia's Vučić to the wire in neck-and-neck election\n- Published\nIf Sunday's parliamentary elections really are a battle for the heart of Serbia, then who better than a cardiologist to be one of the leading figures in the race.\nIlija Srdanović appears an unlikely opponent for Serbia's long-serving leader, Aleksandar Vučić, arriving for an interview by motorbike sporting a fluorescent yellow jacket emblazoned with pro-student slogans.\nHe has been selected as top candidate for an opposition movement posing the most serious challenge to Vučić since the Serbian Progressive Party (SNS) entered government in 2012.\nThe Student List has emerged from almost two years of anti-corruption protests led by young Serbians, outraged by the deaths of 16 people when a railway station's canopy collapsed in Serbia's second city Novi Sad.\nWhat you need to know about Serbia's pivotal election\n- Published1 day ago\nInstead of running for office themselves, student-led assemblies at the country's university faculties have chosen 250 candidates to stand in the parliamentary election, with Srdanović, professor at Novi Sad University, heading the list.\n\"It is absolutely normal to stand with my students to help them in their fair struggle,\" Srdanović told the BBC.\nThe Student List is up against a Serbian leader who has served successively as deputy prime minister, prime minister and president since 2012. When he called these snap elections last month, he stood down as president to run again for the role of prime minister.\nWhatever Vučić's title, there has never been any doubt that he was the man in charge – an image enthusiastically promoted by Serbia's largely uncritical media.\nHe retains strong support among a significant section of Serbia's population. They view him as a strong leader who stands up for the country's interests. He can also point to significant economic growth over the past decade and numerous improvements in infrastructure.\nVučić has painted the student movement as foreign-backed and seeking to \"bring down our state\". \"Let us always protect and defend it,\" he told supporters at a final campaign rally.\nJust like the protest movement from which it developed, the Student List has no hierarchy or nominated leader. This makes it a proposition unlike any other in Serbia's relatively short democratic history.\nReliable polls are thin on the ground, but analysts are predicting an extremely tight vote.\nIlija Srdanović may head the list of candidates – but he is not the movement's leader and would not necessarily be first choice prime minister if they won.\nSrdanović insists that the Student List has a clear vision: \"We offer to our citizens the core values of civilised society, which this previous regime has taken away from our citizens for the last time.\"\nThe other candidates on the Student List range from academics to athletes – and economists to engineers. None of them has a political background. But the students who selected them believe that is a strength, rather than a weakness.\n\"We've gathered people who are actually the best in their fields, and we really think that they are competent enough to rule the country,\" says Aleksandra, a student at Novi Sad University who only wants to give her first name.\n\"All of them are gathered around the same vision of a country where the freedom of speech is ruling, where you can walk to your home in the middle of the night and you will not be beaten up by some hooligans,\" she adds.\nThe Student List and its supporters say that Aleksandar Vučić and the SNS dominate state institutions and media coverage.\nAt the last parliamentary election in 2023, the International Election Observation Mission noted \"overwhelming ruling party advantage\" due to \"bias in the media\" and \"misuse of public office and resources\".\nThe BBC approached leading figures in the SNS for an interview but was not offered a response.\nFor the past 18 months, there has also been a full-time, pro-SNS camp in the small park between the National Assembly and the Presidency building in the centre of Belgrade. Its residents have repeatedly attacked journalists and made the park a no-go zone for local people.\nVučić has called the camp \"a symbol of resistance\" against those who \"cannot stand different opinions\".\nBut his major challenge remains what happened outside Novi Sad railway station two years ago.\nThe station's renovation was a key part of his signature infrastructure project – the high-speed line linking Belgrade and Budapest. So it has been difficult for Vučić to distance himself from the disaster.\nProtests followed, with participants accusing the authorities of corruption and having \"blood on their hands\".\n\"This is a problem for the government,\" says Magda Anastasijevic, the Eastern Europe analyst for the conflict monitor, ACLED.\n\"Vučić has survived this in the past, he was always able to find a scapegoat and blame whatever problems on them. This was not the case for the canopy.\"\nOn the diplomatic front, he has performed a delicate balancing act.\nMembership talks with the EU continue, albeit fitfully, even as Serbia retains close ties with Russia and China – both countries that refuse to recognise Kosovo's unilateral declaration of independence from Serbia.\nVučić has warned those links could be severed if the Student List took power.\n\"When you ask them: will you impose sanctions on Russia? Silence, umming and ah-ing, but no answer,\" he told the audience at a pre-election rally.\n\"You know what the Chinese think, you've heard what Vladimir Putin said. So you decide. Think about who has our best interests at heart.\"\nThe final rallies of the campaign saw the SNS stage an event at Belgrade Arena, with Aleksandar Vučić as the only speaker. But on the other side of the Sava River, the Student List attracted a reported 150,000 people in Slavija Square to listen to a mixture of students and candidates.\nThe contrasting visions were clear to see: the strong, sole leader – or a collective approach. Now Serbia's electorate must decide which they prefer.",

e contrasting visions were clear to see: the strong, sole leader – or a collective approach. Now Serbia's electorate must decide which they prefer.",

    "id": "moody-s-holds-steady-on-france-s-credit-35a7a7d0",
    "title": "Moody's holds steady on France's credit rating as country grapples with turmoil and higher yields",
    "titleJa": "Moody's holds steady on France's credit rating as country grapples with turmoil and higher yields",
    "summaryJa": "Moody's left its credit rating on France at Aa3, giving the country some relief in a week of unrest.",
    "bodyOriginal": "Moody's opted to maintain its credit rating on France as the country contended with a week of civil unrest and rising political risk.\nThe agency kept France's credit rating at Aa3, a level Moody's still deems \"high grade,\" but it also maintained its negative outlook on the nation.\n\"The negative outlook reflects the increased risk that the fragmentation of France's political landscape will continue to impair the functioning of the country's legislative institutions,\" Moody's said in its report.\nMoody's noted that it could return France's outlook to stable if its institutions can narrow the deficit.\nInvestors were anticipating Moody's rating decision as France, the second-largest economy in the euro zone, grappled with protests and a sharp surge in bond yields.\n\"This political instability, also visible in the current social tensions, risks hampering the French government's ability to address key policy challenges such as an elevated fiscal deficit, rising debt burden, and durable increase in borrowing costs, thus leading to a more rapid weakening in the sovereign's key credit metrics than we currently expect,\" Moody's said in its report Friday.\nThis week, the nation's 10-year bond yield surpassed 5% for the first time since 2002. The spread against German bunds is also at a 15-year peak.\nCurrently, France's deficit-to-GDP ratio is at roughly 5.5% of its GDP, sharply above the 3% limit for member nations in the European Union. The country faces more than $1 trillion of debt that will mature by 2030. Just a month ago, the French finance ministry warned that the nation's debt-to-GDP ratio is expected to hit 121.7% in 2027.\nAt the same time, France has been rocked by protests. Last weekend, more than 500,000 people marched to express their frustration against declining public services and high costs of living.\nS&P Global and Fitch cut their ratings on France in 2025.",

    "title": "Father who killed Oregon school gunman describes anguish over children he couldn't save",
    "titleJa": "Father who killed Oregon school gunman describes anguish over children he couldn't save",
    "summaryJa": "Kaylub Giamanco has been hailed as a hero for killing a teenager who fatally shot three children and a teacher.",
    "bodyOriginal": "Father who killed Oregon school gunman describes anguish over children he couldn't save\n- Published\nA father who fatally shot a gunman at his daughters' school in the US state of Oregon has described his anguish over being unable to save more pupils after \"hearing children pleading for their lives\".\nThree students and a teacher were killed by a 16-year-old former student at Silver Rail Elementary School earlier this month. The attacker was then killed by Kaylub Giamanco.\n\"I want to apologise for not saving their babies,\" Giamanco, who has been hailed as a hero, said of his thoughts for the parents of the children killed, in an interview with Oregon Public Broadcasting (OPB) that aired on Friday.\n\"The gratitude for saving people's children is awesome, but there were ones that I didn't save.\"\nGiamanco, 36, said he wanted to meet the victims' families and \"cry with them and hold them\".\nHe credited a teacher who fought the attacker with giving him the chance to intervene without losing his own life.\n\"I would love to give her a hug because that's a real true hero,\" he said.\nThe students who were killed were all boys, aged five, eight and 11. They were among six people in total who were shot in a classroom at the school, police said. Alongside the teacher who was killed, another child and a teacher were wounded.\nGiamanco told OPB that the day of the attack began with breakfast and making packed lunches. He and his wife had spent extra time getting their daughters ready because it was school picture day.\nThe carpenter had taken lunch to work but decided to go home to eat with his wife instead. That decision brought him past the school as the attack began.\nHe initially wondered whether someone carrying a long gun was playing a prank. Then he saw him fire at a pickup truck and head towards the school.\nGiamanco retrieved a handgun from his vehicle and called emergency services.\n\"I said, 'I'm sorry, I have to go in. People are going to die',\" he told the broadcaster.\nHe followed the attacker, who shot through the school's locked glass doors. Hearing children pleading for their lives and more gunfire, Giamanco crawled towards the building.\n\"I told myself this is probably the last thing that I'm ever going to do,\" he said.\nGiamanco crawled through a shattered window and reached the classroom, where a teacher was locked in a struggle with the gunman. He opened the door and fired.\nGiamanco told OPB he fired again when the attacker reached for his weapon. He then placed his own gun on the ground and raised his hands as an officer appeared.\nHe described feeling like the \"last line of defence\" between the children and the gunman, and said he \"was supposed to be there\" that day.\nAfterwards, he called his wife to say he would not be home for lunch and that she needed to get to the school immediately. He then called his mother to tell her what had happened.\n\"Mum, I just had to take the life of what I think is might be a child because he ran into my daughter's school with a gun,\" he said.\nPolice identified the gunman as Griffin J John II - a former pupil who had attended special education classes at the school. His motive remains under investigation.\nPolice said the teacher who confronted the attacker had thrown her phone at him, tackled him and fought to take his shotgun. Bend Police Chief Mike Krantz said she \"almost certainly helped prevent more bloodshed\".\nThe youngest victim was Rhoam Summer, aged five. His father said the family was \"broken and lost\".\nMegan Lambert, 25, the teacher who was killed, was working in what her family described as her \"dream job\".\n\"She always fought for the underdog and those with special needs,\" they said.\nThe other two boys have not been publicly named at their families' request.\nThe injured teacher has been named as Becky Drury, 54. She said in a statement shared with US media that the gunman shot her as she tried to shut her classroom door.\nGiamanco's name became public less than a day after the shooting. His mother, Kenda Freeman, read a family statement saying he was not seeking recognition and asking for privacy.\nShortly after the attack, Oregon Governor Tina Kotek praised his intervention while acknowledging its emotional cost.\n\"Your actions carry a heavy emotional burden, and I just want you to know that my thoughts are with you as well,\" she said.\nGiamanco told OPB he now lies awake after his family goes to bed, replaying the attack.\n\"I relive, I see faces, I hear voices, I hear screams.\"",

    "id": "trump-dropping-some-canada-tariffs-but-r-28339fe6",
    "title": "Trump dropping some Canada tariffs but 'replacing' them with other products",
    "titleJa": "Trump dropping some Canada tariffs but 'replacing' them with other products",
    "summaryJa": "Sen. Susan Collins announced Canada was dropping Canadian tariffs, but the White House later said it was \"replacing\" the ones removed from the list.",
    "bodyOriginal": "The White House on Friday said it would drop tariffs on some Canadian goods, but replace them with other products from the major U.S. trade partner.\nThe move was revealed after Sen. Susan Collins, R-Maine, took credit for pushing the Trump administration to issue tariff exemptions on several categories of Canadian imports she says are \"crucial\" for her state's industries.\nBut Collins' announcement, which The Wall Street Journal first reported, did not mention that while tariffs would be removed for some Canadian products, new ones would be added to the list of goods subject to steep U.S. duties. The White House announced the new tariffs less than an hour after Collins touted the new exemptions to the tariffs, which are unpopular in the state where she's fighting for reelection.\nPresident Donald Trump earlier Friday signed a proclamation \"removing certain products\" from the list of items that he slapped 50% tariffs on over the summer using a 96-year-old trade law.\nBut he is \"replacing those products with certain valves, carpets, waste products, and others,\" according to a White House fact sheet detailing the proclamation.\nThe changes are being made to \"further refine the scope of the tariffs on certain Canadian products,\" according to the fact sheet, which does not mention Maine.\nThe new additions and removals from the list of goods covered by the \"Section 338\" tariffs will take effect Oct. 30, four days before the Nov. 3 U.S. election, the fact sheet said.\nAsked what Collins had agreed to in her conversations pushing Trump administration officials for lower tariffs on products affecting her state, her spokeswoman Phoebe Keller told CNBC that the senator \"requested exemptions for products that are important to Maine and will continue to do so.\"\nBefore the fact sheet was made public, Collins' office sent a press release crediting the senator with securing the new tariff exemptions on \"nine categories of products crucial for Maine's agricultural industries.\"\nThat announcement came as voters have already started casting ballots in the pivotal Maine Senate race, where Trump's unpopular tariffs have been a top issue.\nCollins' Democratic opponent, fifth-generation Maine logger Troy Jackson, quickly pushed back, insisting Collins deserves blame for enabling Trump's tariff policies.\n\"Trump's trade wars have made life harder and more expensive for Mainers. Susan Collins enabled this chaos, voted to confirm the people behind it, and now wants credit for bringing a cup of water to put out the fire,\" Jackson said in a statement.\nTrump has slapped heavy tariffs on a wide range of Canadian goods during his second term as president as he has escalated a trade war against the top U.S. economic partner. Many of those tariffs have put considerable strain on businesses in Maine, which imports far more products from Canada than from any other country.\nWhite House spokesman Matthew Middleton told CNBC in a statement Friday afternoon that Trump's latest tariff proclamation is part of his efforts to \"address Canada's discriminatory treatment of U.S. commerce.\"\n\"The President is taking action in response to Canada's continued discrimination against and additional retaliation targeting U.S. commerce, with the goal of protecting American farmers, manufacturers, and workers,\" said Middleton. \"This administration will continue to use every available tool to restore reciprocity in our bilateral trade relationships and safeguard the economic prosperity and national security of the American people.\"\nCollins has previously touted her efforts to push back on the president's protectionist trade policies. In the first televised debate between Collins and Jackson on Oct. 6, the GOP incumbent took credit for removing some items from Trump's list of tariffs on Canadian goods, including road salt.\nJackson fired back, \"What about everything else? We can't eat road salt.\"\nIn her press release Friday, Collins said she has asked U.S. Trade Representative Jamieson Greer and Commerce Secretary Howard Lutnick \"for tariff relief\" for the Maine-centric products, stressing the \"burdens additional costs impose on Maine businesses and families.\"\n\"I will continue working directly with Administration officials to seek additional relief from tariffs and encourage a broader trade agreement with Canada, our neighbor, ally and largest trading partner,\" she said.\nAccording to the U.S. Census Bureau, Mexico is the largest U.S. trading partner.\nThe products being exempted from the Section 338 tariffs include corrugated paper, plastic boxes and packing bags, refrigeration equipment, multiple forms of machinery and seaweed and algae products, according to Collins.",
