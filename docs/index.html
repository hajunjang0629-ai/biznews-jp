    "summaryJa": "今年初めにChatGPTで広告を配信するというOpenAIの動きは、スーパーボウルのコマーシャルという形で最大のライバルであるAnthropicから嘲笑を買った。",
    "bodyOriginal": "OpenAI on Monday announced that its advertising business has hit $1 billion in annualized revenue run rate, a milestone that the company is touting as proof of its \"diversified business model.\"\nThe artificial intelligence company is gearing up for what is expected to be a massive IPO, and is under pressure to justify its $852 billion valuation to investors. OpenAI said Monday that its ad business, which is roughly 200 days old, builds on its existing revenue engines like its enterprise offerings, consumer subscriptions and usage-based application programming interfaces.\nOpenAI began testing ads within its ChatGPT chatbot in the U.S. in February, a decision that was both highly anticipated and controversial. Digital advertising has long been the cash cow for other big tech companies like Google and Meta, but OpenAI's move was ridiculed by its chief rival, Anthropic, which made OpenAI's ad push the focus of its first Super Bowl campaign.\nChatGPT Ads are now available in more than 40 countries, and OpenAI said it's rolling out self-service access across India, Europe, the Middle East and North Africa on Monday. Ads within the chatbot appear for OpenAI's Go subscribers and its free tier, which makes up the vast majority of its 1 billion weekly active users.\nOpenAI said Monday that its ads are clearly labeled and do not influence ChatGPT's answers. Advertisers do not have access to users' private conversations.\n\"Our next phase of growth will bring ChatGPT Ads to more markets and introduce additional formats, objectives, buying options, and measurement capabilities,\" OpenAI said in a release. \"We will also explore new ways for businesses to interact with consumers in more native ways in ChatGPT.\"\n—CNBC's Kate Rooney contributed to this report\nWATCH: Experts weigh in on the market’s ability to handle Anthropic and OpenAI going public",
    "bodyJa": "OpenAIは月曜日、広告事業の年間収益ランレートが10億ドルに達したと発表したが、これは同社が「多角的なビジネスモデル」の証拠として宣伝しているマイルストーンである。\n人工知能企業は大規模なIPOになると予想されているものに向けて準備を進めており、投資家に対して8,520億ドルの評価額を正当化するというプレッシャーにさらされている。 OpenAIは月曜日、設立から約200日が経過した同社の広告事業は、エンタープライズ向けサービス、消費者向けサブスクリプション、使用量ベースのアプリケーション・プログラミング・インターフェースなどの既存の収益源を基盤にしていると述べた。\nOpenAI は 2 月に米国で ChatGPT チャットボット内の広告のテストを開始しましたが、この決定は大いに期待され、物議を醸しました。デジタル広告は長い間、GoogleやMetaなど他の大手ハイテク企業にとってのドル箱だったが、OpenAIの動きは最大のライバルであるAnthropicによって嘲笑され、OpenAIの広告が最初のスーパーボウルキャンペーンの焦点を押し上げられた。\nChatGPT広告は現在40カ国以上で利用可能で、OpenAIは月曜日にインド、ヨーロッパ、中東、北アフリカ全域でセルフサービスアクセスを展開すると発表した。チャットボット内の広告は、OpenAI の Go 購読者とその無料枠を対象に表示されます。この購読者は、毎週 10 億人のアクティブ ユーザーの大部分を占めています。\nOpenAIは月曜日、同社の広告には明確なラベルが付けられており、ChatGPTの回答には影響を与えないと述べた。広告主はユーザーのプライベートな会話にアクセスできません。\n「当社の次の成長段階では、ChatGPT Adsをより多くの市場に導入し、追加のフォーマット、目的、購入オプション、測定機能を導入する」とOpenAIはリリースで述べた。 「私たちはまた、ChatGPT でよりネイティブな方法で企業が消費者と対話するための新しい方法も模索していきます。」\n—CNBCのケイト・ルーニーがこのレポートに寄稿しました\n注目: Anthropic と OpenAI の上場に対応する市場の能力について専門家が検討",

    "id": "aon-ceo-says-insurance-broker-seeks-to-b-88b73963",

    "titleJa": "エーオンCEO、保険ブローカーはライバルUSIの買収で「最高の中間市場プラットフォーム」の構築を目指していると語る",
    "summaryJa": "保険ブローカーのエーオンは月曜日、競合するUSI保険サービスをプライベートエクイティ会社KKRから買収すると発表した。この170億ドルの取引はエーオンが新たな負債で資金調達する予定で、規制当局の承認を条件として第4四半期に完了する見通しだ。",
    "bodyOriginal": "Insurance broker Aon announced on Monday it will purchase rival USI Insurance Services from private equity firm KKR.\nThe $17 billion deal, which will be funded by Aon with new debt, is anticipated to close in the fourth quarter, subject to regulatory approvals.\nCEO Greg Case in an appearance on CNBC's \"Squawk Box\" Monday said that the merger will establish the \"premier U.S. middle-market platform.\"\n\"This means we're going to be in a position to bring world class solutions to the underserved U.S. middle market, and … set a new standard of client leadership for the 200,000 middle-market companies in the U.S. and their 48 million employees,\" he said.\nThe acquisition for Aon builds on the company's purchase of NFP in 2024, another insurance broker focused on the U.S. middle market.\nUSI, according to a press release announcing the deal, is the tenth largest insurance broker in the U.S. The company has more than $3 billion in annual revenue, and more than 10,500 employees.\nOnce a deal is closed, USI CEO Mike Sicard will transition to Aon's president and global CEO of middle market.\n\"Joining Aon represents a truly energizing next chapter for our firm and an opportunity to accelerate our momentum as part of the Aon United platform,\" Sicard said in the release. \"Our firms share strong, one-firm cultures with a deep commitment to working together to bring the best of our capabilities to clients.\"\nIn a press release, KKR partner Chris Harrington said Aon is the ideal partner to support USI's next growth chapter.\nShares of Aon slipped about 1% in premarket trading Monday. But despite the initial slide, Case said the opportunity to serve the middle market at the scale the company now can through the acquisition has tremendous value potential for shareholders.\n\"Maybe the greatest I've seen in my 20-year career as CEO,\" he said.",
    "bodyJa": "保険ブローカーのエーオンは月曜日、競合するUSI保険サービスをプライベートエクイティ会社KKRから買収すると発表した。\nこの170億ドルの取引はエーオンが新たな負債で資金調達する予定で、規制当局の承認を条件として第4四半期に完了する見通しだ。\nCEOのグレッグ・ケース氏は月曜日、CNBCの「Squawk Box」に出演し、合併により「米国の最高の中間市場プラットフォーム」が確立されると述べた。\n「これは、当社が十分なサービスを受けていない米国の中堅市場に世界クラスのソリューションをもたらす立場に立つことを意味し、米国の20万社の中堅企業とその4,800万人の従業員に顧客リーダーシップの新たな基準を設定することになる」と同氏は述べた。\nエーオンの買収は、同社が2024年に米国の中間市場に焦点を当てた別の保険ブローカーであるNFPを買収したことに基づくものだ。\nこの取引を発表したプレスリリースによると、USI は米国で 10 番目に大きな保険ブローカーであり、年間収益は 30 億ドル以上、従業員は 10,500 名以上です。\n取引が成立すれば、USIのマイク・シカード最高経営責任者（CEO）はエーオンの社長兼中間市場担当グローバルCEOに就任する。\nシカード氏はリリースの中で、「エーオンへの参加は、当社にとって真に活力に満ちた次の章であり、エーオン・ユナイテッド・プラットフォームの一部として当社の勢いを加速する機会となる」と述べた。 「当社は、顧客に当社の能力を最大限に発揮するために協力するという強いコミットメントを持つ、強力な単一企業文化を共有しています。」\nKKRパートナーのクリス・ハリントン氏はプレスリリースで、AonはUSIの次の成長章をサポートする理想的なパートナーであると述べた。\nエーオンの株価は月曜の市場前取引で約１％下落した。しかし、最初のスライドにもかかわらず、ケース氏は、買収を通じて同社が現在可能な規模で中間市場にサービスを提供できる機会は、株主にとって多大な価値をもたらす可能性があると述べた。\n「おそらく、CEOとしての20年間のキャリアの中で最高のものかもしれない」と彼は語った。",

    "summaryJa": "米軍がララック島でイランのロケットランチャー２基を攻撃したことを受け、月曜、原油価格が急騰し、ワシントンとテヘランが戦闘に復帰したことを示した。国際ベンチマークであるブレント原油先物９月渡しは３．３％上昇し、１バレル＝９０．９９ドルで取引された。米国ウェスト・テキサス・インターミディエイト先物前月は3.6％上昇し、1バレル＝86.36ドルで取引された。",
    "bodyOriginal": "Oil prices jumped Monday after U.S. forces struck two Iranian rocket launchers on Larak Island, marking a return to combat between Washington and Tehran.\nFutures for international benchmark Brent crude for September delivery gained 3.3% to trade at $90.99 a barrel. Front-month U.S. West Texas Intermediate futures added 3.6%, trading at $86.36 per barrel.\n\"I can confirm that earlier today U.S. forces struck two Iranian launchers on Larak Island. Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz,\" Navy Capt. Tim Hawkins, a U.S. Central Command spokesperson, said in a statement.\nAccording to the Associated Press, Sunday's attack was the first publicly acknowledged U.S. strike on Iranian positions since late July.\nThe U.S. attack on Larak Island killed and wounded several Iranian soldiers, Iran's Revolutionary Guards Corps said, adding that it has responded with attacks on American military bases in Jordan, based on reports by the Iranian media.\nMeanwhile, U.S. President Donald Trump extended his military threats against Iran to Kharg Island, the country's main oil export terminal, saying in a Sunday evening Truth Social post that it's \"going to be blown to smithereens!\"\nVessel traffic through the Strait of Hormuz, a key route for global energy shipments, has been severely disrupted by the Middle East conflict, which has entered its sixth month.\n\"Supply risk will persist and oil inventories will continue to deplete in the coming weeks and months,\" said Tamas Varga, analyst at PVM Oil Associates, adding that \"the Iranian crisis has likely changed the security status quo in the Middle East.\"\n\"Rising strikes on refineries in the Middle East and Russia have further constrained already-stretched global refining capacity, pushing refined products margins to new highs,\" Goldman said in a note.\n—CNBC's Anniek Bao contributed to the report.",
    "bodyJa": "米軍がララック島でイランのロケットランチャー２基を攻撃したことを受け、月曜、原油価格が急騰し、ワシントンとテヘランが戦闘に復帰したことを示した。\n国際ベンチマークであるブレント原油先物９月渡しは３．３％上昇し、１バレル＝９０．９９ドルで取引された。米国ウェスト・テキサス・インターミディエイト先物前月は3.6％上昇し、1バレル＝86.36ドルで取引された。\n米中央軍報道官ティム・ホーキンス海軍大佐は声明で、「今日初めに米軍がララック島でイランの発射台２基を攻撃したことを確認した。イスラム革命防衛隊部隊が機雷を搭載したロケット弾をホルムズ海峡に発射する準備をしているのが目撃された」と述べた。\nAP通信によると、日曜日の攻撃は、7月下旬以来、イラン陣地に対する米国の攻撃が公的に認められた初めてのことだった。\nイラン革命防衛隊は、ララク島への米国の攻撃で複数のイラン兵士が死傷したと発表し、イランメディアの報道に基づき、ヨルダンの米軍基地への攻撃で対抗したと付け加えた。\n一方、ドナルド・トランプ米大統領は、イランに対する軍事的脅威を同国の主要石油輸出ターミナルであるカーグ島にまで拡大し、日曜夜のトゥルース・ソーシャルへの投稿で、「木っ端微塵に吹き飛ばされるだろう！」と述べた。\n世界のエネルギー輸送の重要なルートであるホルムズ海峡を通過する船舶の交通は、6か月に入った中東紛争により大幅に混乱している。\nＰＶＭオイル・アソシエイツのアナリスト、タマス・バルガ氏は「供給リスクは残り、今後数週間から数カ月は石油在庫の枯渇が続くだろう」と述べ、「イラン危機は中東の安全保障の現状を変えた可能性が高い」と付け加えた。\nゴールドマンはメモの中で「中東とロシアの製油所に対するストライキの増加により、すでに逼迫している世界の精製能力がさらに制約され、精製製品のマージンが新たな高水準に押し上げられている」と述べた。\n—CNBCのアニーク・バオ氏がこのレポートに貢献しました。",

  {
    "id": "santoli-why-investors-should-be-on-high-57589c8a",
    "title": "Santoli: Why investors should be on high alert heading into September",
    "titleJa": "サントリ：9月に向けて投資家が厳重な警戒を払うべき理由",
    "summaryJa": "まず、Mike Santoli のマーケット メモを受信箱で入手してください。ここから購読してください映画と同様に市場でも、第 2 幕のゆっくりとした静かなシーンを通じてサスペンスが高まります。",
    "bodyOriginal": "Get Mike Santoli's Market Memo in your inbox first. SUBSCRIBE HERE\nIn markets as in movies, suspense builds through the slow, quiet scenes of the second act.\nThe stock market is doing just enough, through slim trading volumes and narrow index trading ranges, to escape August with its uptrend intact.\nThe S&P 500 is within half a percent of where it closed three weeks ago. It has slouched and equivocated in the two weeks since it hit the last record high just above 7800.\nBut the index has stayed within 2% of the peak, the pullbacks so far halting a handful of points above what had been the top of the former multi-month range.\nSure, the upwelling of relief that greeted Nvidia's strong results and bold guidance was dramatic. But for the full week, the stock was up just 1.3%, back to levels from three months earlier.\nSemiconductors as a group held right where they \"should\" have, preserving the path of their post-July rebound.\nThe market, in other words, has done its best not to do anything that would require disturbing the portfolio managers at the beach.\nThis is where one is conditioned to expect a discussion of calm before storms, of late-summer hurricanes and the punishing realities of September markets.\nYes, as is noted everywhere, September historically is the worst month of the year for stocks. But it's utterly unclear what one is meant to take from this fact, other than to keep expectations muted - which is always advisable in my book. Given most late-summer midterm-election-year weakness has been more than recovered right afterward, the proper course of action now becomes even more obscure.\nThere is massive variation around historical monthly return patterns. When stocks have already been strong in a given year, as they have in 2026, September has been less scary.\nThe ranking of monthly performance changes significantly if one goes back 20, 80 or 100 years. None of these spans truly represents a statistically significant sample. And of course, this is all about calendar months, not every possible 30-day slice of market history.\nThe Vix, 10-Year Treasury yield at key levels\nGiven all this, I'd argue the reason to be alert now is not purely the turn of the month, but the fact that - much like the S&P and the semis in August - various key market metrics are coiling near consequential thresholds, which if they're crossed could imply a change in market character.\nThe CBOE S&P 500 Volatility Index (VIX) has slipped below 15. Appropriately so, given the placid recent range and the clockwork mechanics of sector rotation and low-correlation restraining index-level volatility.\nStill, much below 15 gets away from \"comfortable stability\" and toward \"eerie complacency\" territory. Historically, this time of year, vol is biased pretty clearly higher. For now, the VIX futures curve is sloped healthily upward into coming months, but things can shift in a hurry.\nThe 10-year Treasury yield has nudged back above 4.7%, reacting in part to the clear message from Federal Reserve Chairman Kevin Warsh at Jackson Hole on Friday that for the near term, he shares his committee's view that short-term rates are the tool to employ against stubborn inflation and that it might need to be used soon.\nAs discussed last week, there is no known tripwire level where bond yields kneecap equities. Bursts of fixed-income volatility tend to do more damage to stocks than a steady ratcheting higher of rates. (Just because everyone says this doesn't mean it's wrong.)\nStill, the suspense over the next Fed move might itself color the tape. After Warsh's Friday speech, market-implied odds for a September hike were a bit above 50%.\nNear-coin-flip probabilities less than three weeks before a Fed decision is a kind of \"What if?\" proposition that can hold risk appetites in check, and perhaps might become more a feature of a less-communicative Fed facing an economy running on two speeds - corporate-capex aggression and housing/consumer caution.\nI'll say again, a 10-year Treasury yield just under 5% is not misaligned with the present 5-6% nominal-growth economy. Nor is it unusually far above the current Federal funds policy rate.\nBut might it still pinch?\nSure, as many tech bulls today point out, the late-90s tech boom and full-employment jubilee occurred with yields between 5-6%. But back then, 5-6% was experienced as \"low\" rates.\nTreasuries were more than a decade into a massive secular bull market as the '90s bubble inflated. The decade had begun with 10s yielding near 9% and they were just below 8% as late as December 1994, eight months before the Netscape IPO touched off the Internet-stock frenzy.\nThe rise in yields toward 5% today feels more intrusive to the current investing generation, and leaves most debt issued in recent years underwater in terms of price.\n(On the bright side, a buyer of high-grade debt today enjoys a buffer of decent nominal and real yields, and bonds would gain more in value from a 1-percentage-point decline in yield than they'd lose from an equivalent rise.)\nAside from yields pushing the upper end of the range, the broad commodity indexes are rising toward five-year highs, corporate-debt spreads are remarkably tight and one quirky risk-appetite gauge I watch - the relative performance of lower-quality/cheaper Citi vs. defensive/pricey JP Morgan - has retreated back toward its early-2026 breakout level. This ratio peaked just before the SpaceX IPO in June, when exuberance over Wall Street's role in the AI-dealmaking craze was palpable.\nA key feature of the turn into September, which begins a year's third and final act, is that analysts and investors start to calibrate their views of next year. Corporate-conference season gets rolling and earnings models need freshening after summer.\nAmong the questions now: How will stocks metabolize an inevitable deceleration in earnings growth from this year's heroic, if overstated, pace. Charles Schwab noted last week that Nvidia and Micron together are providing one-third of aggregate 2026 earnings growth and the top-ten earners account for two-thirds.\nYes, the median company has returned to profit growth, but to a less-impressive degree. And might the 15% gain in the equal-weighted S&P 500 already account for much of that?\nMarket Temperature Gauge\nThis indicator from John Kolovos of Macro Risk Advisors uses several data points to reflect both what investors are saying and what they are doing.\nKolovos on the latest reading: \"Overall little change, but sentiment does lean overly bullish as survey data such as Investors Intelligence shows too many bulls, while real time market metrics show a relatively high degree of complacency.\"\nAround the Street\nPrediction markets, through a skeptical lens, try to launder the reckless public impulse to gamble by presenting themselves as socially useful venues for risk management.\nThe predominance of sports betting on the platforms, including in states where it wasn't before allowed, does little directly to help this argument. Nor do frivolous contracts on what word a public figure might utter.\nYet the Baffler, the contrarian political-criticism and satire magazine, last week offered a long essay detailing how the now-vital and stolid insurance industry was born of a similar zeal for anything-goes wagering (alongside the pricing of maritime-cargo policies) in London coffeehouses.\n\"While this insurance became essential to the execution of international expeditions, not everything that went on at Lloyd's or among the underwriters of eighteenth-century London was so crucial to commerce. Some people were as likely to 'insure' that the pope would die as they were that a merchant ship wouldn't sink. In fact, bets on whether people would live or die were incredibly popular. Gamblers would bet on the fates of prisoners awaiting execution and of prominent people whose illnesses were reported on in the newspaper.\"\nFood for thought, and a reminder that the speculative drive needed to price consequential economic risks is inseparable from the punter's urge.\nStill, the proliferation of \"perpetual futures\" listed on some of the same upstart exchanges tied to existing stock indexes and public and private equities has always reminded me of the action in the \"bucket shops\" of the early 20th century. As I've noted on the air several times, Depression-era securities laws specifically banned such activities.\nThe Wall Street Journal's Jason Zweig, who has a comprehensive grasp of financial history and a deft touch for illuminating it, explores the echoes here.\nMarket on Close\nThe analyst corps that covers Nvidia is mostly adoring. The consensus price target for the stock implies 50% upside from here and a $7.5 trillion market value. They are merely chasing the remarkable revenue and profit growth, unprecedented at Nvidia's scale, while staring incredulously at its compressed valuation.\nThe stock is below 20-times next-12-months forecast earnings and below 15 on next fiscal year's projection. On free cash flow, it's easily the cheapest mega-cap on offer.\nMy read here is that the market will simply refuse to pay a premium for what could soon be peak profit growth until the company proves through a longer cycle that it's not a hit-driven hardware maker.\nThere is precedent from recent history that might be relevant. Apple in the years following its initial iPhone-release profit bonanza saw its valuation slide down a similar slope (in an early-2010s market that itself was less expensive than today's).\nThe knock on Apple for years was that tech-device margins always evaporate, smartphones would commodify, etc.\nDemonstrating smooth, reliable upgrade cycles, fostering a services-based revenue stream and returning enormous sums of capital through buybacks and dividends slowly got Apple clear of the nagging valuation discount.\nTo the point where, now, Apple fetches an arguably rich premium, near a 30 P/E, for its defensive properties against the swings of AI sentiment and spending.\nSUBSCRIBE TO MIKE SANTOLI'S MARKET MEMO HERE",
    "bodyJa": "まず、Mike Santoli のマーケット メモを受信箱で入手してください。ここから購読してください\n映画と同様に市場でも、第 2 幕のゆっくりとした静かなシーンを通じてサスペンスが高まります。\n株式市場は、取引量の少なさと指数の取引範囲の狭さにより、上昇傾向を保ったまま8月を乗り切るのに十分な成績を収めている。\nS&P500指数は3週間前の終値から0.5パーセント以内に位置している。 7800をわずかに上回る過去最高値を記録して以来、2週間で前かがみになり曖昧な状況が続いている。\nしかし、同指数は最高値の２％以内にとどまっており、これまでの下落により、以前の複数カ月の範囲の最高値を数ポイント上回る水準で止まっている。\n確かに、NVIDIA の好調な業績と大胆な指導を歓迎した安堵感の湧き上がりは劇的でした。しかし、週全体では株価はわずか1.3％上昇し、3カ月前の水準に戻った。\n半導体企業はグループ全体として「あるべき」位置を維持し、7月以降の反発路線を維持した。\n言い換えれば、市場はポートフォリオマネジャーの邪魔をするようなことは一切行わないよう最善を尽くしてきたということだ。\nここでは、嵐の前の静けさ、夏の終わりのハリケーン、そして9月市場の厳しい現実についての議論が期待されるようになっています。\nはい、どこでも指摘されているように、歴史的に9月は株にとって一年で最悪の月です。しかし、期待を抑えておくこと以外に、この事実から何を理解するつもりなのかは全く不明である――私の本では常にそうすることが推奨されている。夏の終わりの中間選挙年の弱さのほとんどが直後に回復以上だったことを考えると、適切な行動方針はさらに不透明になっている。\n過去の月次収益パターンには大きなばらつきがあります。 2026 年のように、その年の株価がすでに好調であれば、9 月はそれほど怖くありません。\n20年、80年、100年遡ると月次業績の順位は大きく変わります。これらの範囲はいずれも、統計的に有意なサンプルを実際に表すものではありません。そしてもちろん、これはすべて暦月に関するものであり、市場履歴の 30 日間のすべてのスライスを意味するわけではありません。\nVix、主要な水準での 10 年国債利回り\nこれらすべてを踏まえると、私が今警戒すべき理由は、純粋に月の変わり目ということではなく、S&Pや8月のセミと同じように、さまざまな重要な市場指標が重大な閾値付近に渦巻いており、それらを超えた場合には市場の性質の変化を示唆する可能性があるという事実だと私は主張する。\nCBOE S&P 500 ボラティリティ・インデックス (VIX) は 15 を下回りました。最近の穏やかなレンジと、セクターのローテーションと低相関が指数レベルのボラティリティを抑制する時計仕掛けの仕組みを考慮すると、当然のことです。\nそれでも、15 歳をはるかに下回ると、「快適な安定」から遠ざかり、「不気味な自己満足」の領域に向かっています。歴史的に見て、この時期の取引量はかなり明らかに高く偏っています。今のところ、VIX 先物曲線は今後数カ月に向けて健全な上向きに傾いていますが、状況は急速に変化する可能性があります。\n10年米国債利回りは4.7％を再び超え、金曜のジャクソンホールでのケビン・ウォーシュ連邦準備制度理事会議長の、短期金利は頑固なインフレに対抗する手段であり、すぐに使用する必要があるかもしれないという短期金利の見解を委員会と共有するという明確なメッセージの一端に反応している。\n先週議論したように、債券がニーキャップ株の利回りを示す既知のトリップワイヤーレベルは存在しません。債券のボラティリティの急激な上昇は、金利が着実に上昇するよりも株価に大きなダメージを与える傾向があります。 （みんながそう言っているからといって、それが間違っているというわけではありません。）\nそれでも、FRBの次の動きを巡る不安自体がテープを彩るかもしれない。ウォーシュ氏の金曜日の講演後、市場が示唆する９月利上げの確率は５０％をやや上回る水準となった。\nFRBの決定まで3週間以内にコイントスに近い確率が発生するのは、一種の「もしも」だ。これはリスク選好を抑制できる提案であり、企業の設備投資の積極性と住宅・消費者の警戒という2つのスピードで経済が動いている状況に直面している、コミュニケーション力の低いFRBの特徴となるかもしれない。\nもう一度言いますが、5％弱の10年米国債利回りは、現在の5～6％の名目成長経済と乖離していません。現在のフェデラルファンド政策金利を異常に大きく上回るわけでもない。\nしかし、まだピンチになる可能性がありますか？\n確かに、今日多くのハイテク強気派が指摘しているように、90年代後半のハイテクブームと完全雇用の記念碑は5～6％の利回りで起きた。しかし、当時は 5 ～ 6% が「低い」金利だと認識されていました。\n90年代のバブルが膨張するにつれ、米国債は10年以上にわたり大規模な長期強気相場に入った。この 10 年間は 10 株の利回りが 9% 近くで始まり、ネットスケープの IPO がインターネット株の熱狂を引き起こす 8 か月前の 1994 年 12 月の時点では 8% をわずかに下回っていました。\n現在の5％に向けた利回りの上昇は、現在の投資世代にとってより煩わしいものに感じられ、近年発行された債券のほとんどは価格の面で水面下にある。\n（明るい面としては、現在、高格付債券の買い手はそこそこの名目利回りと実質利回りのバッファーを享受しており、利回りが1パーセントポイント低下した場合、債券の価値は同等の上昇で失うよりも大きくなるだろう。）\n利回りがレンジの上限を押し上げていることは別として、広範な商品指数は5年ぶりの高値に向けて上昇しており、社債スプレッドは著しく縮小しており、私が注目している奇妙なリスク選好の指標の1つ、つまり低品質/割安のシティとディフェンシブ/高価なJPモルガンの相対的なパフォーマンスは、2026年初頭のブレイクアウトレベルに向けて後退している。この比率は6月のSpaceX IPOの直前にピークに達し、その時はAI取引の流行におけるウォール街の役割に対する熱狂が明白であった。\n1年の第3幕であり最後の幕が始まる9月への変わり目の主な特徴は、アナリストと投資家が来年についての見方を調整し始めることだ。企業カンファレンスシーズンが本格化し、夏以降は収益モデルを刷新する必要がある。\n現在、注目されているのは、誇張されているとしても、今年の英雄的なペースから避けられない利益成長の減速を株価がどのように代謝するかである。チャールズ・シュワブ氏は先週、エヌビディアとマイクロンを合わせて2026年の総利益成長率の3分の1をもたらし、稼ぎ頭上位10社が3分の2を占めていると指摘した。\nはい、中央値の企業は利益成長に戻りましたが、程度はそれほど印象的ではありませんでした。そして、均等加重の S&P 500 の 15% の上昇がすでにその大部分を占めているのでしょうか?\n市場温度計\nマクロ リスク アドバイザーズのジョン コロボス氏によるこの指標は、投資家の発言と行動の両方を反映するためにいくつかのデータ ポイントを使用しています。\n最新のデータについてコロヴォス氏は「全体的にはほとんど変化はないが、インベスターズ・インテリジェンスなどの調査データでは強気派が多すぎることが示されている一方、リアルタイムの市場指標では比較的高い満足感が示されており、地合いは過度に強気に傾いている」と述べた。\nストリートの周り\n予測市場は、懐疑的なレンズを通して、社会的に有用なリスク管理の場であると見せかけることで、ギャンブルへの無謀な大衆の衝動を洗浄しようとします。\n以前はスポーツ賭博が許可されていなかった州も含めて、プラットフォーム上でのスポーツ賭博が優勢であることは、この議論に直接役立つことはほとんどありません。公人がどのような言葉を発するかについての軽薄な契約も同様である。\nしかし、逆張りの政治批評・風刺雑誌『バッフラー』は先週、今や活力を持っているが閑散とした保険業界が、ロンドンのコーヒーハウスで（海上貨物保険の価格設定と並行して）何でもありの賭けへの同様の熱意からどのようにして生まれたのかを詳述する長いエッセイを掲載した。\n「この保険は国際遠征の遂行に不可欠なものとなったが、ロイズや18世紀のロンドンの保険会社の間で起こっていたことすべてが商業にとってそれほど重要だったわけではない。商船が沈まないようにするのと同じくらい、教皇が死ぬことに『保険』をかける人もいた。実際、人が生きるか死ぬかについての賭けは信じられないほど人気があった。ギャンブラーは処刑を待つ囚人や著名人の運命に賭けた。」病気が新聞で報道された人々。」\n思考の材料であり、結果として生じる経済的リスクの価格を見積もるのに必要な投機的衝動は、投資家の衝動と切り離せないものであることを思い出させてくれます。\nそれでも、既存の株価指数や公開株式や非公開株式と結び付けられた同じ新興取引所の一部に上場される「永久先物」の急増は、常に20世紀初頭の「バケツショップ」での行為を思い出させます。私が何度か放送で指摘したように、大恐慌時代の証券法ではそのような行為が特に禁止されていました。\nウォール・ストリート・ジャーナルのジェイソン・ツヴァイク氏は、金融の歴史を包括的に把握し、それを浮き彫りにする巧みなタッチで、その反響をここで探ります。\n市場はクローズ\nNvidia をカバーするアナリスト部隊は、ほとんどが熱狂的です。株価のコンセンサス目標株価は、ここからの50％の上昇と7.5兆ドルの市場価値を意味します。彼らは、圧縮された評価額を信じられない様子で見つめながら、NVIDIA の規模では前例のない目覚ましい収益と利益の成長を追い求めているだけです。\n株価は今後12カ月間の予想利益の20倍を下回り、来期予想の15倍も下回っている。フリーキャッシュフローで言えば、これは明らかに最も安価なメガキャップです。\nここで私が読んだのは、同社がヒット主導型のハードウェアメーカーではないことを長期サイクルを通じて証明するまでは、近いうちにピークに達する可能性のある利益成長に対して市場はプレミアムを支払うことを拒否するだろう、ということだ。\n最近の歴史に関連する可能性のある前例があります。 Apple は、最初に iPhone を発売して大利益を上げてから数年間、その評価額が同様の坂を下降しました (2010 年代初頭の市場では、それ自体が今日よりも安価でした)。\nAppleにとって長年の打撃は、ハイテク機器のマージンが常に蒸発し、スマートフォンがコモディティ化することなどだった。\nスムーズで信頼性の高いアップグレード サイクルを実証し、サービスベースの収益源を育成し、自社株買いや配当を通じて巨額の資本を還元することで、Apple はしつこい評価額の割引から徐々に解放されました。\n現在、Apple は、AI のセンチメントと支出の変動に対する防御特性に対して、PER 30 倍近くというおそらく高額なプレミアムを付けています。\nここからマイク・サントリのマーケットメモを購読してください",

    "title": "France is becoming the ‘poster child’ of sovereign debt problems as government borrowing costs hit near 2008 highs",
    "titleJa": "政府の借入コストが2008年の最高値近くに達し、フランスはソブリン債務問題の「代表作」になりつつある",
    "summaryJa": "フランスの財政悪化と政治的行き詰まりは債券投資家の懸念を強めており、再び厳しい予算闘争が迫り、借入コストは金融危機時代の最高水準に近づいている。欧州連合第2位の経済大国は、近年、度重なる政情不安と増大する財政負担に耐えている。財政赤字や債務制限に関する欧州委員会の規則に繰り返し違反しており、状況を収束させるための改革、歳出削減、増税の試みが失敗し、歴代首相が追放されている。",
    "bodyOriginal": "France's deteriorating public finances and political deadlock are becoming a growing concern for bond investors, with borrowing costs near financial-crisis-era highs as another difficult budget battle looms.\nThe European Union's second-largest economy has endured recurring political instability and mounting fiscal strain in recent years. It has repeatedly broken European Commission rules on budget deficits and debt limits, and successive prime ministers have been ousted after failed attempts at reform, spending cuts and tax rises to bring the situation under control.\nFrance is subject to the EU's excessive deficit procedure, with the Council recommending that it end its excessive deficit by 2029 — but it has a long way to go.\nEU treaties set reference values of 3% of GDP for government deficits and 60% for government debt. Last year, France's deficit reached 5.1% of GDP, while the debt-to-GDP ratio surpassed 115%.\nThe IMF projected in July that France's gross government debt would reach about 118.5% of GDP in 2026 and exceed 120% in 2027, remaining above that level through 2030.\nAt the same time, the economy is struggling to grow, contracting 0.2% quarter-on-quarter in the first three months of this year and stagnating in the second quarter.\nThe upheaval has caused acute stress in the country's bond markets, with French government bond yields rising dramatically over the past year — exacerbated by the U.S.-Iran war's impact on borrowing costs worldwide — giving France some of the highest government borrowing costs in the G7.\nFrench 10-year government bond yields hit their highest level since 2008, above 4.13%, last week and remained near 4.1% on Friday. Bond yields and prices move in opposite directions.\nThe French National Assembly is ideologically fractured, leading to no-confidence votes, government collapse and deadlocks over the national budget.\nFrance is expected to submit its 2027 budget plans to parliament by early October. Last year's budget led to a deadlock that saw Prime Minister Sebastien Lecornu force the bill through parliament after months of delays.\nLecornu became the fifth person to hold the role in just two years when he was appointed in 2025. His resignation just 27 days into the job, saying political discord had made it too difficult to build a workable government program. Lecornu was reappointed days after quitting.\nAnother source of uncertainty that's weighed on French bonds is the 2027 presidential election, where far-right candidate Marine Le Pen is currently the frontrunner to succeed Emmanuel Macron.\n'Poster child' for debt problems\nJohn Stopford, head of multi-asset income at Ninety One, told CNBC that swelling deficits and slowing growth have become a global problem in the wake of the Covid-19 pandemic, wars and successive energy crises, but France \"stands out.\"\n\"It's not just a French problem, but you could argue that in many ways France is one of the poster child [countries],\" he said on a call. \"So I don't think it's unique to France [but] France's public finances have been going in the wrong direction.\"\nThere is a broader challenge, he said, for developed governments to find a way to balance their books and bring debt onto a more sustainable path. Failing to do so is likely to lead to a \"bond market revolt\" at some point, Stopford added.\n\"I can see why people are concerned,\" he said of France. \"It's not obvious how this ends in a good way.\"\nThe big uncertainty hanging over the OATs market is next year's presidential election, Stopford said.\nDuring a candidate debate on Thursday, Le Pen said that the government \"must drastically cut its spending,\" adding that she was \"extremely concerned\" about the trajectory of Paris's debt levels.\nBut Stopford told CNBC the market had been skeptical about whether Le Pen had much appetite for putting the public finances on a more sustainable footing.\n\"Clearly we may get a change of regime or policy priorities post May next year, but people doubt that there's much appetite for material fiscal consolidation,\" he said. \"So yes, I think we might be building up to a crisis. I'm just not sure it's today.\"\nLittle sign of improvement\nThéophile Legrand, a rates strategist at Natixis CIB, told CNBC that his team already views OATs as \"pre-stressed.\"\n\"What could delay a recovery is not only domestic politics, but also the broader macro backdrop,\" he said. \"The market is not expecting France to return to a 3% deficit as early as 2027, but it does look for signs that the 2027 budget is consistent with a credible medium-term path for stabilizing public debt. That path is becoming harder to deliver. The war-related backdrop and higher long-end rates already complicate the fiscal equation, while this summer's heatwaves and wildfires add another layer of uncertainty.\"\nThe final months of this year and the first quarter of 2027 were the most likely window for another bout of volatility in OATs, Legrand added, as the budget debate and presidential dynamics become more closely intertwined.\n\"That said, we do not expect a repeat of the 2024/2025 shock pattern. OAT valuations already look materially stressed: our fair value model suggests OATs are around 15 basis points cheap even before adding any political premium, and our year-end forecast is around 75 basis points on the 10-year OAT-Bund spread if the budget is passed, versus around 80 basis points if it is not and France moves to a special budget law,\" he said.\nApril LaRusse, head of investment specialists at Insight Investment, said that despite increasingly bleak headlines related to the French economy, there is \"surprisingly little sign that France is preparing for the kind of fiscal adjustment that its debt dynamics would seem to require.\"\n\"Growth expectations are being revised lower, debt is set to keep rising and bond yields are now at levels not seen since the financial crisis,\" she said. \"Yet meaningful spending restraint remains politically difficult. With pension reform effectively on hold until after the 2027 election and parliament deeply fragmented, the government appears focused on maintaining political stability rather than tackling the underlying fiscal problem.\"\nThe question for investors now, she said, is whether policymakers can muster the political will to put public finances on a more sustainable path before market pressures intensify.\n\"French government bonds already trade more cheaply than their Italian equivalents, which would have been unthinkable not that long ago — but they could get even cheaper in a negative scenario,\" she said.",
    "bodyJa": "フランスの財政悪化と政治的行き詰まりは債券投資家の懸念を強めており、再び厳しい予算闘争が迫り、借入コストは金融危機時代の最高水準に近づいている。\n欧州連合第2位の経済大国は、近年、度重なる政情不安と増大する財政負担に耐えている。財政赤字や債務制限に関する欧州委員会の規則に繰り返し違反しており、状況を収束させるための改革、歳出削減、増税の試みが失敗し、歴代首相が追放されている。\nフランスはEUの過剰赤字手続きの対象となっており、理事会は2029年までに過剰赤字を解消するよう勧告しているが、その道のりは長い。\nEUの条約では、政府赤字の基準値をGDP比3％、政府債務の基準値を60％と定めている。昨年、フランスの財政赤字はGDPの5.1％に達し、債務の対GDP比は115％を超えた。\nIMFは7月、フランスの政府総債務が2026年にはGDPの約118.5％に達し、2027年には120％を超え、2030年までその水準を上回る状態が続くと予想した。\n同時に、経済は成長に苦戦しており、今年の最初の3か月は前四半期比で0.2％縮小し、第2四半期には停滞した。\nこの混乱は同国の債券市場に深刻なストレスを引き起こしており、フランス国債の利回りは過去1年間で劇的に上昇しており、米国とイランの戦争が世界の借入コストに与えた影響によりさらに悪化しており、フランスはG7の中で最も高い政府借入コストの一部となっている。\nフランス１０年国債利回りは先週、４．１３％超と２００８年以来の高水準を付け、金曜日も４．１％付近で推移した。債券の利回りと価格は逆方向に動きます。\nフランス国民議会はイデオロギー的に亀裂が生じており、不信任投票、政府の崩壊、国家予算の行き詰まりにつながっている。\nフランスは２０２７年度予算案を１０月初旬までに議会に提出する予定。昨年の予算案は膠着状態に陥り、数カ月の遅れを経てセバスティアン・レコルヌ首相が法案を議会で強行採決した。\nレコルヌ氏は2025年に任命され、わずか2年間でこの役職に就いた5人目の人物となった。政治的不一致により実行可能な政府プログラムを構築することが非常に困難になっているとして、就任わずか27日で辞任した。レコルヌ氏は辞任から数日後に再任された。\nフランス国債を圧迫するもう一つの不確実要因は、極右候補マリーヌ・ルペン氏が現在エマニュエル・マクロン氏後継の最有力候補となっている2027年の大統領選挙だ。\n借金問題の「看板児」\nナインティワンのマルチアセット収入責任者、ジョン・ストップフォード氏はＣＮＢＣに対し、新型コロナウイルス感染症のパンデミック、戦争、相次ぐエネルギー危機を受けて、財政赤字の膨張と成長鈍化が世界的な問題となっているが、フランスは「際立っている」と語った。\n同氏は電話会議で、「これはフランスだけの問題ではないが、多くの点でフランスは代表的な国の一つであると言えるだろう」と語った。 「ですから、これはフランスに限ったことではないと思いますが、フランスの財政は間違った方向に進んでいます。」\n同氏は、先進国政府が帳尻を合わせ、債務をより持続可能な軌道に乗せる方法を見つけるという広範な課題があると述べた。そうしなければ、ある時点で「債券市場の反乱」が起こる可能性が高いとストップフォード氏は付け加えた。\n同氏はフランスについて「人々が懸念する理由が分かる」と語った。 「これがどのように良い形で終わるかは明らかではありません。」\nOAT市場に立ちはだかる大きな不確実性は来年の大統領選挙だ、とストップフォード氏は語った。\nルペン氏は木曜日の候補者討論会で、政府は「歳出を大幅に削減しなければならない」と述べ、パリの債務水準の推移について「非常に懸念している」と付け加えた。\nしかしストップフォード氏はＣＮＢＣに対し、市場はルペン氏に財政をより持続可能な基盤に置くことにそれほど意欲があるかどうかについて懐疑的だったと語った。\n同氏は「来年５月以降に政権や政策の優先順位が変更される可能性があるのは明らかだが、実質的な財政健全化への意欲がそれほどあるのかどうかを人々は疑っている」と述べた。 「そうですね、私たちは危機に直面しているかもしれないと思います。ただ、それが今日なのかどうかはわかりません。」\n改善の兆しはほとんどない\nナティクシスCIBの金利ストラテジスト、テオフィル・ルグラン氏はCNBCに対し、同氏のチームはすでにOATが「プレストレス」であると見ていると語った。\n同氏は「回復を遅らせる可能性があるのは国内政治だけでなく、より広範なマクロ背景もある」と述べた。 「市場はフランスが早ければ2027年にも3％の財政赤字に戻るとは予想していないが、2027年の予算が公的債務安定化に向けた信頼できる中期的道筋と一致する兆しを探している。その道筋を実現するのはますます困難になっている。戦争関連の背景と長期金利の上昇によりすでに財政方程式が複雑になっているが、今夏の熱波と山火事でさらに不確実性が高まっている。」\n予算審議と大統領の力学がより密接に絡み合っているため、今年の最後の数カ月間と2027年の第1四半期は、OATのボラティリティが再び高まる可能性が最も高い時期だとルグラン氏は付け加えた。\n「とはいえ、われわれは2024年／2025年のショックパターンが繰り返されるとは予想していない。OATのバリュエーションはすでにかなり強調されているようだ。当社の公正価値モデルは、政治的プレミアムを加える前であってもOATが約15ベーシスポイント割安であることを示唆しており、われわれの年末予想は、予算が可決されれば10年OATと独国債のスプレッドが約75ベーシスポイントとなるのに対し、予算が可決されずフランスが特別予算法に移行した場合は約80ベーシスポイントとなる」と述べた。\nインサイト・インベストメントの投資スペシャリスト責任者、エイプリル・ラルース氏は、フランス経済に関連した暗い見出しが増えているにもかかわらず、「フランスが債務動向に必要と思われる種類の財政調整を準備しているという兆候は驚くほどほとんどない」と述べた。\n同氏は「成長期待は下方修正されており、債務は増加を続ける見通しで、債券利回りは現在、金融危機以来見られない水準にある」と述べた。 「しかし、意味のある支出抑制は依然として政治的に難しい。年金改革は2027年の選挙後まで事実上延期され、議会は大きく分裂しているため、政府は根本的な財政問題に取り組むよりも政治の安定を維持することに重点を置いているようだ。」\n同氏は、投資家にとって今の問題は、政策立案者が市場の圧力が強まる前に財政をより持続可能な軌道に乗せる政治的意志を結集できるかどうかだ、と述べた。\n「フランス国債はすでにイタリア国債よりも安く取引されているが、少し前までは考えられなかったが、マイナスのシナリオではさらに安くなる可能性がある」と同氏は述べた。",

    "id": "jackson-hole-analyst-roundup-warsh-s-spe-73eaf0bb",
    "title": "Jackson Hole analyst roundup: Warsh's speech sends hike chances higher, may put Fed `at odds' with Treasury",
    "titleJa": "ジャクソンホールのアナリストまとめ：ウォーシュ氏の講演で利上げの可能性が高まり、FRBは財務省と「対立」する可能性がある",
    "summaryJa": "ジャクソンホール会合でのケビン・ウォーシュ連邦準備制度理事会議長の演説でのスタンスが予想外にタカ派的で、来月の利上げに対する市場の期待が高まった。月曜日は金が下落し、アジア株も下落した。 ＣＭＥのフェドウォッチツールによると、フェデラルファンド先物トレーダーらは９月に１５％ポイント利上げの確率が６０．４％とみており、金曜日の約５６％から上昇している。",
    "bodyOriginal": "Federal Reserve Chair Kevin Warsh's stance in his speech at the Jackson Hole meeting was unexpectedly hawkish, boosting market expectations for a rate hike next month.\nGold fell and Asian stocks declined on Monday. Traders of fed funds futures see a 60.4% chance of a quarter-point hike in September, up from around 56% on Friday, according to the CME's FedWatch tool.\nHere's what market watchers are saying about Warsh's speech:\nHawkish surprise\n\"Chair Warsh's Jackson Hole address surprised us in its specificity about the economy and outlook and with its lean in a decidedly hawkish direction,\" Deutsche Bank said. The firm continues to expect the Fed to hike 50 basis points this year, with increases at the September and December Federal Open Market Committee meetings.\n\"The emphasis on inflation risks, together with Warsh's explicit commitment to achieving price stability and his reluctance to pre-commit to future policy actions, reinforces the elevated risks of policy tightening this year, although it could also be the case of talking without action, UOB said in a note.\nNear-term data focus\n\"The sensitivity to near-term inflation data is high,\" Nomura said in a note. \"Warsh delivered hawkish remarks at the Jackson Hole economic symposium, emphasizing the importance of the inflation target and implying policy may need to react if disinflation is not occurring with speed.\"\nReinforcing independence\nWarsh's assessment that U.S. economic performance has been robust \"was seen as reducing the case for near-term rate cuts,\" according to James Ooi, market strategist at Tiger Brokers. His \"emphasis on the 2% inflation target could be read as an effort to reinforce the Fed's independence and credibility, reassuring markets that monetary policy will not bend to fiscal pressures.\"\nHike skepticism\nMatthew J. Maley, chief market strategist at Miller Tabak + Co. however believes that \"there remains no empirical basis for the rate hike.\"\n\"Warsh appears to be talking up inflation so that he can claim credit for taming it when headline measures inevitably come down,\" Maley said, adding that the labor market data has been weak while the inflation data has been better than expected since the last FOMC meeting.\nFed vs Treasury\nWarsh's reiteration that short-term interest rates should remain the main instrument of monetary policy implies that he will continue to shorten the average duration of the Fed's balance sheet, Gavekal Research said in a note.\n\"This seems to put the Fed at odds with the US Treasury, which earlier in August announced that it will step up its buybacks of long-term treasury securities in an apparent attempt to prevent yields rising further at the long end,\" Gavekal added.\nNegative for gold\n\"Warsh pledged to return inflation to the 2% target and indicated rates could rise further, strengthening the dollar and reversing part of the debasement trade that had lifted gold roughly 14% in August—its strongest monthly gain this century,\" according to Susquehanna.\n—CNBC's Joanna Ossinger contributed to this report.",
    "bodyJa": "ジャクソンホール会合でのケビン・ウォーシュ連邦準備制度理事会議長の演説でのスタンスが予想外にタカ派的で、来月の利上げに対する市場の期待が高まった。\n月曜日は金が下落し、アジア株も下落した。 ＣＭＥのフェドウォッチツールによると、フェデラルファンド先物トレーダーらは９月に１５％ポイント利上げの確率が６０．４％とみており、金曜日の約５６％から上昇している。\n市場関係者らはウォーシュ氏の講演について次のように述べている。\nタカ派の驚き\nドイツ銀行は「ウォーシュ議長のジャクソンホール演説は、経済と見通しに関する具体性と、明らかにタカ派的な方向への傾きにわれわれを驚かせた」と述べた。同社は引き続き、FRBが今年50ベーシスポイント（ｂｐ）利上げを実施し、９月と12月の連邦公開市場委員会で利上げすると予想している。\nＵＯＢはメモで、「インフレリスクの強調は、ウォーシュ氏の物価安定達成への明確なコミットメントや将来の政策行動への事前コミットメントへの消極的姿勢と相まって、今年の政策引き締めのリスクの高まりを強めているが、行動を伴わずに話している場合もあり得る」と述べた。\n短期的なデータ重視\n野村氏はメモで「短期的なインフレ統計に対する感応度は高い」と述べた。 「ウォーシュ氏はジャクソンホールの経済シンポジウムでタカ派的な発言をし、インフレ目標の重要性を強調し、インフレ解消が急速に進まない場合には政策が対応する必要がある可能性があることを示唆した。」\n独立性の強化\nタイガー・ブローカーズの市場ストラテジスト、ジェームス・オイ氏によると、米国の経済状況は堅調であるというウォーシュ氏の評価は「短期的な利下げの可能性を減らすものとみられている」という。同氏の「2％のインフレ目標の強調は、金融政策が財政圧力に屈しないことを市場に安心させ、FRBの独立性と信頼性を強化する取り組みと解釈される可能性がある」。\n懐疑論をハイキングする\nしかし、ミラー・タバック社の首席市場ストラテジスト、マシュー・Ｊ・メイリー氏は「利上げの実証的根拠は依然として存在しない」と考えている。\nメイリー氏は「ウォーシュ氏は、総合政策が必然的に下振れする際に、インフレを抑制した功績を主張するために、インフレを話題にしているようだ」と述べ、前回のFOMC会合以降、インフレ統計は予想よりも良かったが、労働市場統計は弱いと付け加えた。\nFRB対財務省\nガベカル・リサーチはノートで、ウォーシュ氏が短期金利が引き続き金融政策の主要手段であるべきだと繰り返し述べたことは、同氏がＦＲＢのバランスシートの平均デュレーションを引き続き短縮することを示唆していると述べた。\nガベカル氏は「これはFRBと米財務省との対立を生むようだ。米財務省は8月初旬、長期金利のさらなる上昇を阻止する目的で長期国債の買い戻しを強化すると発表した」と付け加えた。\n金にはマイナス\nサスケハナ氏によると、「ウォーシュ氏はインフレ率を目標の2％に戻すと約束し、金利がさらに上昇してドルが上昇し、8月に金を約14％押し上げた地盤下落の一部が反転する可能性があると示唆した。これは今世紀最大の月間上昇率となった」と述べた。\n—CNBC の Joanna Ossinger がこのレポートに寄稿しました。",

    "titleJa": "敵対行為が再び激化する中、トランプ大統領はイランの石油ハブであるカールグ島を爆破すると脅迫",
    "summaryJa": "ドナルド・トランプ米大統領は、イランに対する軍事的脅迫を同国の主要石油輸出ターミナルであるカーグ島にまで拡大し、「木っ端微塵に吹き飛ばされるだろう！」と述べた。このコメントは、両国間の敵対関係が再燃する中、週末に米国とイランが攻撃を交わした後に発表された。",
    "bodyOriginal": "U.S. President Donald Trump extended his military threats against Iran to Kharg Island, the country's main oil export terminal, saying it's \"going to be blown to smithereens!\"\nThe comments came after the U.S. and Iran traded attacks over the weekend, as hostilities flared anew between the two countries.\nAmerican forces struck two Iranian rocket launchers on Larak Island on Sunday after the military said Revolutionary Guard forces were preparing rockets carrying sea mines for launch into the Strait of Hormuz, U.S. Central Command confirmed to MS NOW.\n\"Earlier today U.S. forces struck two Iranian launchers on Larak Island. Islamic Revolutionary Guard Corps forces were observed preparing to launch rockets with sea mines into the Strait of Hormuz,\" Navy Capt. Tim Hawkins, a U.S. Central Command spokesperson, said in a statement.\n\"Last week, CENTCOM completed clearing sea mines from the strait's international shipping routes. U.S. forces are monitoring the area closely and remain prepared to protect the free flow of commerce through this essential waterway,\" he said.\nSunday's attack was the first publicly acknowledged U.S. strike on Iranian positions since late July, according to The Associated Press. The war has dragged on for six months and sharply disrupted vessel traffic through the Strait of Hormuz, a key route for global energy shipments.\nIran's Revolutionary Guards Corps said the U.S. attack on Larak Island killed and wounded several Iranian soldiers, and it has responded with attacks on American military bases in Jordan, according to Iranian media reports.\nThe IRGC said the combined missile and drone operation targeted the King Hussein and Al Azraq bases, according to media reports.\nThe strikes \"destroyed the technical and repair infrastructure, as well as the enemy fighter deployment sites,\" inflicting \"heavy damage,\" Iranian military forces reportedly said, while vowing increasingly forceful responses.\nLarak, a small Iranian island in the Strait of Hormuz, has become a key military and shipping-control point for Tehran, used by the Revolutionary Guards to monitor vessel traffic through one of the world's most important maritime routes.\nThe U.S. Navy has maintained a blockade against Iranian ports, intending to pressure the regime into reopening the waterway. Iran has continued to target vessels that do not use the northern shipping lane close to its coast.\nAnother tanker was struck by an unknown projectile while transiting inbound in the Strait of Hormuz on Saturday, using the southern lane along the Omani coast, according to the UK Maritime Trade Operations. The agency reported no casualties, while advising vessels to navigate the Strait with caution.",
    "bodyJa": "ドナルド・トランプ米大統領は、イランに対する軍事的脅迫を同国の主要石油輸出ターミナルであるカーグ島にまで拡大し、「木っ端微塵に吹き飛ばされるだろう！」と述べた。\nこのコメントは、両国間の敵対関係が再燃する中、週末に米国とイランが攻撃を交わした後に発表された。\n米中央軍がMS NOWに確認したところ、革命防衛隊がホルムズ海峡への発射に向けて機雷を搭載したロケット弾を準備していると軍が発表したことを受け、日曜、米軍はララク島でイラン製ロケット砲2基を攻撃したと明らかにした。\n米中央軍報道官のティム・ホーキンス海軍大佐は声明で、「本日未明、米軍はララク島でイランの発射台２基を攻撃した。イスラム革命防衛隊部隊が機雷を搭載したロケット弾をホルムズ海峡に発射する準備をしているのが目撃された」と述べた。\n同氏は、「先週、セントコムは海峡の国際航路から機雷の除去を完了した。米軍はこの地域を注意深く監視しており、この重要な水路を通る自由な通商を守る準備を続けている」と述べた。\nAP通信によると、日曜の攻撃は7月下旬以来、米国によるイラン陣地への攻撃が公的に認められた初めてのことだった。戦争は6か月間続き、世界のエネルギー輸送の重要なルートであるホルムズ海峡を通る船舶の交通は大幅に混乱した。\nイランメディアの報道によると、イラン革命防衛隊は、米国によるララク島攻撃で複数のイラン兵士が死傷し、ヨルダンの米軍基地への攻撃で対抗したと発表した。\nメディア報道によると、革命防衛隊は、ミサイルと無人機の複合作戦が国王フセイン基地とアル・アズラク基地を標的にしたと発表した。\n伝えられるところによると、イラン軍は空爆により「技術インフラや修理インフラ、さらには敵の戦闘機配備場所が破壊され」、「重大な損害」を与えたと伝えられる一方、ますます強硬な対応をすると表明した。\nホルムズ海峡にあるイランの小さな島ララクは、テヘランの軍事および船舶管制の重要な拠点となっており、革命防衛隊が世界で最も重要な海路の一つを通る船舶交通を監視するために使用されている。\n米海軍はイランの港湾封鎖を維持し、イラン政権に水路の再開を圧力をかけるつもりだ。イランは、自国の海岸に近い北部航路を利用しない船舶を標的にし続けている。\n英国海事貿易業務局によると、土曜日、オマーン沿岸の南側航路を利用してホルムズ海峡を航行中、別のタンカーが未知の飛翔体に衝突された。同庁は死傷者は出ていないと報告したが、船舶に対し海峡を慎重に航行するよう勧告した。",

    "title": "How the US-Canada trade war is being felt on both sides of the border",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "The US-Canada trade war in 5 charts\n- Published\nThe US and Canada appear no closer to resolving their ongoing trade dispute.\nTensions have been simmering between the two neighbours since President Donald Trump returned to the White House just over 18 months ago, and unleashed a wide-ranging global programme of tariffs.\nCanada was one of the first countries the Trump administration hit with levies, and is one of two countries to respond with its own reciprocal measures.\nCurrently, the US has hit Canada's key sectors of steel, aluminium, lumber and automobiles with tariffs, and last week imposed an additional 50% levy on about C$28bn ($20bn; £15bn) of Canadian goods.\nCanada has hit back with its own counter-tariffs on American goods, announcing on Tuesday what it calls a \"dollar-for-dollar\" and \"strategic\" retaliation designed to match the US tariffs.\nWith no resolution in sight, how has this enduring trade war affected Canada and the US, and what could come next?\nHere are five charts to help break it all down.\nTrade war hits Ontario hardest\nThe tariffs and counter-tariffs have hit some states and provinces harder than others.\nIn Canada, some provinces have been more exposed to US sectoral tariffs on steel, steel derivatives, aluminium, and autos and vehicle parts that don't comply with the current North American trade deal, known as the USMCA.\nOntario, the most populous province with a significant manufacturing sector, has been hardest hit by the auto and steel tariffs.\nSeveral Ontario auto parts and assembly plants have announced layoffs and production cuts, and the province is estimated to have lost tens of thousands of manufacturing jobs since early 2025.\nMetal exports from Quebec - which produces steel, copper and aluminium - fell 36% between February 2025 and 2026, and there was a 3.6% drop in employment in the sector, according to data released in July.\nThe Royal Bank of Canada estimates that Ontario and Quebec are the most impacted by US sectoral tariffs, while Newfoundland and Labrador, New Brunswick, Alberta, Saskatchewan and Prince Edward Island are the least exposed.\nAdditional US tariffs on $20bn worth of Canadian goods that came into effect on 22 August are expected to impact all provinces in some way, though British Columbia, Quebec and Ontario will feel the brunt.\nSwing states in the cross hairs\nThe US economy is much larger and the impact of Canada's counter-tariffs won't be as stark.\nBut some states will feel the pain of Canada's retaliation more than others, with tariffs levied on C$28bn worth of US goods from steel to furniture, cosmetics and toilet paper, as of 8 September.\nAccording to data by Statistics Canada, the swing state of Ohio will be hardest hit, with C$3.2bn - or 12% - of its exports soon to be tariffed by Canada, followed by Illinois and Pennsylvania.\nFor Ohio, it's the tax on steel that will particularly hurt, as well as the tax on laundry machines. In Illinois, where farm equipment giant John Deere is based, it will be the new tariffs on farm and construction equipment.\nDerek Holt, an economist with Scotiabank, noted that Canada's counter-tariffs appear to be \"very deliberately oriented\" towards some swing states that could decide the US balance of power in the upcoming midterm elections.\nFrom the lowest tariff rates to one with the pack\nPrime Minister Carney has assured Canadians that, despite the high-profile trade fight, they face some of the lowest US tariff rates compared to other countries.\nBut with the latest 50% tariffs imposed on a range of Canadian goods, the average effective US tariff rate on Canada is now higher than Mexico's, and is approaching the rate faced by others like the UK and Vietnam.\nAn average effective tariffs rate reflects the average tariff paid across all imports.\nAccording to data by the Royal Bank of Canada, external, the average effective US tariff rate on Canada in June was 2.9% - the lowest among major US trade partners. It has now nearly doubled to 5.7%.\nBy comparison, the US effective tariff on the UK is 6.2%. China still faces the highest US tariffs at an average of around 20.5%.\nCanada's exports are going elsewhere\nCanada, by the happenstance of being neighbours with the world's largest economy, is hugely reliant on US trade.\nTheir proximity - and free trade agreements in place since the 1980s - has allowed the two countries to develop one of the world's most deeply economically integrated trading relationships.\nThe US buys more than 70% of Canadian exports, and is a top US trading partner alongside Mexico and China.\nBut the tariff fight has already started to shift Canadian businesses to other markets. Carney has pledged to double Canada's non-US exports over the next decade.\nBank of Canada statistics suggest that Canadian firms are exporting more to countries other than the US since Trump's return to the White House in January 2025.\nSome businesses are adapting to find customers elsewhere.\nMatteo Sgaramella, who owns Toronto-based menswear clothing company Outclass, told the BBC he has started attending trunk shows in Paris instead of New York, helping him reach more customers in Europe.\n\"The reception has been amazing,\" he said, adding that some European stores are particularly enthused about supporting Canadian products due to the ongoing trade war with the US.\n\"We're kind of seen as the one country that's kind of standing up to the Americans right now,\" Sgaramella said.\nOther businesses, however, are struggling to diversify their trade, particularly in Ontario manufacturing sectors that are deeply integrated with the US.\nA recent report by the Canadian Chamber of Commerce pointed out three such regions in Ontario - Oshawa, London and Kitchener-Cambridge-Waterloo - as being particularly vulnerable.\n\"These cities remain heavily tied to the US market, while growth in exports outside the US has been limited or insufficient to offset broader weakness in trade activity and local economic conditions,\" the report said.\nWhile some businesses are lagging, foreign direct investment into Canada hit C$96.8 billion in 2025, the highest inflow of capital to the Canadian economy since 2007.\nCanada's economy also strongly rebounded in the second quarter of 2026 to 3.3% growth in the country's GDP, thanks to a jump in exports and domestic investment.\nThese latest figures have warded off recession concerns, at least for now.\nCarney is hoping to attract even more investment. In September, his government will host the first-ever Canada Investment Summit, bringing major investors, CEOs and business leaders to Toronto for two days.\nFewer jobs and less disposable income\nOn both sides of the border, tariffs have hit jobs and disposable income.\nAccording to an analysis commissioned by Canadian American Business Council (CABC), if the US and Canada allow the USMCA to fail, there would be tens of thousands of jobs lost, primarily in the manufacturing industries directly affected by tariffs and that are highly reliant on the US market.\nAround 55,000 manufacturing jobs have already been lost in Canada from January 2025 to January 2026, according to Bank of Canada data.\nNot all figures are bad, however, as employment has steadily risen in Canadian sectors that are not vulnerable to US tariffs.\nBut there is a risk of further Canadian job losses due to the recent 50% tariffs imposed by the Trump administration.\nCalgary-based economist Trevor Tombe estimates that a total of 90,000 jobs across Canada could be lost if these new US tariffs persist.\nIn the US, the non-partisan Center for American Progress estimates, external that Trump's \"Liberation Day\" tariffs, placed last year on dozens of America's trade partners, have also led to tens of thousands of jobs lost manufacturing, transportation and warehousing sectors.\nEven for those whose jobs remain secure, the tariffs have meant higher sticker prices on everyday items.\nThe US-based Tax Foundation estimates, external that an American household could pay $840 more on average this year due to Trump's tariffs on a number of nations, including Canada.\nCanada's counter-tariffs are much more targeted and are designed to limit the impact on Canadian consumers, but economists say businesses will likely now pay more to manufacture goods, as a bulk of the taxes will be applied on industrial supplies imported from the US.",

    "id": "my-parents-won-t-lend-me-10k-but-helped-45261769",
    "title": "'My parents won't lend me £10k but helped my brother': When families play financial favourites",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "'My parents won't lend me £10k but helped my brother': When families play financial favourites\n- Published\nDo your parents have a favourite child and give them more money, gifts or help?\nFinancial favouritism can cause jealousy and resentment long into adulthood and, in some cases, even spark legal disputes after a parent dies. But experts say there are strategies that can help you avoid it.\nJohn says his parents, who have always supported his younger brother, recently refused to lend him £10,000 towards a house deposit after he broke up with his partner.\nThis was despite the money being \"well within their financial grasp\", he says.\nHis parents had previously given his brother a deposit to buy a home and subsidised his living expenses.\nJohn, 47, whose real name we have changed, says he was viewed as the more academic one growing up and expected to stand on his \"own two feet\" financially, while his brother, 42, struggled to make his way in the world and was \"coddled\".\nHe says the favouritism has made him believe \"the needs of others take precedence over my own\", leaving him feeling \"isolated\" and affecting friendships and romantic relationships.\n'Powerful emotional meaning'\nForums like Mumsnet and Reddit, external are full of posts complaining about siblings being shown preferential treatment regarding money.\nCommon gripes include the amount of financial support adult children have received, external from their parents during their lifetime, the way inheritance is divided, external, and whether a sibling has supported their parents more than others, external.\nDr Fenia Christodoulidi, from counselling service Relate, says that disagreements about money between siblings are rarely just about the money itself.\n\"Financial support from parents often carries a powerful emotional meaning and some siblings tend to interpret differences in support as signs of favouritism, unequal love or a lack of recognition.\"\nShe adds that even when parents have \"practical reasons\" for treating their children differently, failing to communicate these clearly can \"leave room for misunderstanding and resentment\".\nThose reasons might include an adult child needing more support because they earn significantly less, have an illness, or have to pay more to get on the housing ladder due to rising prices, external.\n'It's never been a problem'\nEllis, who works in finance in London, tells the BBC that she and her siblings have had \"different levels of support at different times\" from their parents and it's never been a problem.\nBut her colleague Tasha, the youngest of seven, says her siblings have fallen out over perceived favouritism, even though she thinks her parents treat them all the same.\n\"I just think people sometimes get a bit uncertain or jealous and that's quite normal,\" says the 33-year-old.\n\"Sometimes people stop talking for a bit or go to process what they are feeling, and they come back together and they just hash it out.\"\n'Open conversations help'\nHaving \"open conversations about expectations and the reasons behind decisions\" can help reduce feelings of resentment about money, Christodoulidi says.\nBut for some, it's not that easy.\n\"Talking about money is verboten in my family - be it salaries or savings or financial assistance,\" says John.\n\"Any time I've tried to air my feelings my parents just become evasive so now I don't bother.\"\nJohn says he is now planning his financial future on the basis he won't have any inheritance - although he expects to be asked to step in if his parents get ill or lose capacity.\nHe says he has a \"great relationship with his brother\" but feels resentment towards his parents for creating the \"imbalance\" between them.\nClaire Webb, a solicitor and mediator at Family Solutions Now, regularly helps siblings who have disputes over inheritance and other money matters.\n\"One sibling might argue the other was given more money earlier on in life, say, to buy a house, and that the parents said this would be reflected in the will.\n\"Then the will says, 'everything should be shared equally'. So you have all of that historic feeling of unfairness being dredged up.\"\nTo avoid conflict, she says parents need to be clear with their children about what they want while they are still alive.\n'A deep-down family bond'\nSiblings who do fall out should consider mediation before taking legal action, she adds. This is when a trained professional helps them remedy their problems.\nThe good news is, siblings who take the legal route more often than not reach an amicable solution.\n\"Most of the time there is a deep-down family bond - and if you can crack what started the problem they often find a way through.\"\nTips for resolving money quarrels between siblings\n1. Recognise what's behind the row: It may be about feeling valued or treated fairly, rather than the money itself\n2. Avoid making assumptions about a sibling's financial situation or the reasons behind parental decisions\n3. Encourage open, respectful conversations where everyone has the opportunity to explain how they feel\n4. Parents should communicate their intentions as clearly as possible, particularly if they are supporting children differently for practical reasons\n5. Consider family counselling if conversations repeatedly become stuck or emotionally charged\n6. Consider mediation before taking legal action in inheritance disputes.\n7. Choose powers of attorney carefully: Parents usually appoint their children to oversee their care and finances if they get ill or lose mental capacity. But if there's a risk they'll fall out, they can appoint someone else including a solicitor.\nSources: Relate, Family Now Solutions",

    "id": "aon-nears-17-billion-deal-to-buy-insuran-1f1fffc5",
    "title": "Aon nears $17 billion deal to buy insurance broker USI, WSJ reports",
    "titleJa": "エーオン、保険ブローカーUSI買収で170億ドルの合意に近づいているとWSJが報じた",
    "summaryJa": "ウォール・ストリート・ジャーナル紙が日曜日に報じたところによると、エーオンはプライベートエクイティ会社KKRから保険仲介会社USIを買収するため、負債を含め約170億ドルの契約に近づいているという。同紙は関係者の話として、早ければ月曜日にも合意が発表される可能性があると報じた。",
    "bodyOriginal": "Aon is nearing a roughly $17 billion deal, including debt, to acquire insurance brokerage USI from private-equity firm KKR, The Wall Street Journal reported Sunday.\nA deal could be announced as soon as Monday, the Journal said, citing people familiar with the matter.\nUSI is an insurance brokerage and consulting firm based in Valhalla, N.Y., that specializes in risk management, employee benefits and retirement consulting. The company has about $3 billion in annual revenue, according to its website.\nKKR bought USI from private-equity firm Onex in 2017 and has since increased its ownership stake, becoming the company's largest shareholder in 2023.\nA possible deal for USI would follow a string of prominent exits for KKR, including sales of data-center cooling firm CoolIT and Circor's commercial and defense aerospace business earlier this year. KKR reported a record $1.29 billion in asset sales for the quarter that ended in June.\nA USI deal would help Aon — a large insurance broker and consultancy with a market capitalization of $75 billion — extend its reach into midsize businesses and boost earnings per share as soon as 2028, the Journal reported, citing a person familiar with the matter.\nAon reported second-quarter adjusted earnings of $3.81 per share on July 29, topping Wall Street analysts' estimates. The stock has since fallen by 5.6%, closing at $355.40 on Friday.",
    "bodyJa": "ウォール・ストリート・ジャーナル紙が日曜日に報じたところによると、エーオンはプライベートエクイティ会社KKRから保険仲介会社USIを買収するため、負債を含め約170億ドルの契約に近づいているという。\n同紙は関係者の話として、早ければ月曜日にも合意が発表される可能性があると報じた。\nUSI は、ニューヨーク州ヴァルハラに拠点を置く保険仲介およびコンサルティング会社で、リスク管理、従業員福利厚生、退職コンサルティングを専門としています。同社のウェブサイトによると、同社の年間収益は約30億ドルだという。\nKKRは2017年にプライベートエクイティ会社OnexからUSIを買収し、その後出資比率を高め、2023年には同社の筆頭株主となる。\nUSIとの取引の可能性は、今年初めのデータセンター冷却会社CoolITやCircorの商業・防衛航空宇宙事業の売却など、KKRの一連の著名な撤退に続くものとなるだろう。 KKRは、6月に終了した四半期の資産売却額が12億9000万ドルという記録的な額を報告した。\nUSIとの契約は、時価総額750億ドルの大手保険ブローカー兼コンサルティング会社であるエーオンにとって、早ければ2028年にも中堅企業へのリーチを拡大し、一株利益を押し上げるのに役立つだろうと、関係者の話として同誌が報じた。\nエーオンは7月29日、第2四半期の調整後1株当たり利益が3.81ドルとウォール街アナリストの予想を上回ったと報告した。その後株価は5.6％下落し、金曜日の終値は355.40ドルとなった。",

    "id": "eight-killed-and-others-missing-after-fe-b5813a13",
    "title": "Eight killed and others missing after ferry capsizes off northern Cyprus",
    "titleJa": "キプロス北部沖でフェリー転覆、8人死亡、1人行方不明",
    "summaryJa": "キプロス北部沖でフェリー転覆、8人死亡、1人行方不明- 公開されました",
    "bodyOriginal": "Eight killed and others missing after ferry capsizes off northern Cyprus\n- Published\nAt least eight people have died and more than a dozen others are still missing after a passenger boat capsized off northern Cyprus, the head of the Turkish administration there has said.\nÜnal Üstel, prime minister of the self-proclaimed Turkish republic on Cyprus, said the ferry had been carrying 259 passengers and eight crew members when it began taking on water after departing the coastal town of Kyrenia.\nThe ship's captain and seven crew members have been detained as part of an investigation into \"how this tragedy occurred\", Üstel wrote on social media.\nA search and rescue operation to find the passengers still unaccounted for is under way, which Turkish authorities have joined.\nThe privately owned ferry left the left the popular holiday resort of Kyrenia at about 12:30 local time (09:30 GMT).\nÜstel said the boat had been scheduled to travel to Turkey on Saturday, but had been delayed due to poor weather conditions.\nHe told Turkish media outlet TRT that the boat was hit by two waves before it capsized.\nWhile the captain of the vessel was trying to recover from the first wave, a second wave hit and it began taking on water, he told the outlet.\nHelicopters and coastguard boats have been dispatched to the scene, while ambulances have been stationed on the beach ready to receive rescued passengers.\nÜstel wrote on social media that the \"priority right now is human life\", adding that security forces, rescue teams and health officials were all on the scene.\nHe added the disaster will be thoroughly investigated and \"even the slightest negligence will be uncovered\".\n\"No one will be spared, regardless of who they are, who is found to be at fault or responsible,\" Üstel said.\nErhan Arikli, the transport minister of the self-declared Turkish Republic of Northern Cyprus (TRNC), which is only recognised by Turkey, told local media that 100 passengers had been taken to shore.\nTurkey's President Recep Tayyip Erdogan sent his condolences to Turkish Cypriots and said efforts to reach those who were still missing \"continue uninterrupted\".\n\"Immediately after the accident, we launched extensive search-and-rescue operations in co-operation with the authorities of the Turkish Republic of Northern Cyprus,\" he said at a military ceremony on Sunday.\nMustafa Koc saved around 65 people with his boat after the vessel capsized. He told the BBC that he felt the crew should have waited until the sea was calm.\n\"It wasn't safe for them,\" he said. \"The sea was quite choppy.\"\nKoc added: \"People died. It's not right.\"\nHe said the boat had arrived in Kyrenia on Saturday and \"had some damage in the front\".\nThe ferry - a high-speed 40m long, 10m wide Filo Jet vessel - sails under the flag of Turkey, according to Marine Traffic.\nOn Sunday evening, Arikli told TRT the ship had completely sunk.\nFilo Denizcilik, the company which operates the capsized passenger boat, said it was \"deeply saddened by the tragic accident\".\nA hotline has been set up to provide passengers' relatives with information. The nationalities of those who were aboard and the status of the injured are unclear.\nLocal television has broadcast images of the upside-down ferry in the water, with people wearing life vests atop its hull.\nThe TRNC, which is recognised only by Turkey, controls the northern third of the island of Cyprus, which has been divided since 1974.\nAdditional reporting by Sherie Ryder",
    "bodyJa": "キプロス北部沖でフェリー転覆、8人死亡、1人行方不明\n- 公開されました\nキプロス北部沖で旅客船が転覆し、少なくとも8人が死亡、十数人が依然として行方不明であると、同国のトルコ政府トップが発表した。\nキプロスにある自称トルコ共和国のウナル・ウステル首相は、フェリーがキレニアの海岸沿いの町を出発した後、入水を開始したとき、乗客259名と乗組員8名を乗せていたと述べた。\nウステル氏はソーシャルメディアで、「この悲劇がどのように起こったのか」に関する捜査の一環として、船長と乗組員7人が拘束されたと述べた。\n現在も行方不明の乗客を発見するための捜索救助活動が行われており、トルコ当局もこれに参加している。\n私有フェリーは現地時間12時30分（グリニッジ標準時09時30分）頃に人気の休暇リゾート地キレニアを出発した。\nウステル氏は、ボートは土曜日にトルコに向かう予定だったが、悪天候のため遅れたと語った。\n同氏はトルコメディアＴＲＴに対し、ボートは転覆する前に２度の波にさらされたと語った。\n船長が第一波から回復しようとしていたところ、第二波が襲来し、水が浸み始めたと同メディアに語った。\nヘリコプターと沿岸警備隊のボートが現場に出動し、救急車もビーチに配備され、救助された乗客の受け入れに備えている。\nウステルさんはソーシャルメディアに「今の優先事項は人命だ」と書き、治安部隊、救助チーム、保健当局がすべて現場に出動していると付け加えた。\n同氏は、災害は徹底的に調査され、「わずかな過失さえも明らかにされるだろう」と付け加えた。\n「誰であろうと、過失や責任があると判明した人は誰も救われない」とウステル氏は語った。\nトルコのみが承認している自主宣言北キプロス・トルコ共和国（TRNC）のエルハン・アリクリ運輸大臣は、地元メディアに対し、乗客100人が岸に連行されたと語った。\nトルコのレジェップ・タイイップ・エルドアン大統領はキプロス系トルコ人に哀悼の意を表し、行方不明者に連絡する取り組みは「中断されることなく続く」と述べた。\n同氏は日曜日の軍事式典で、「事故直後、我々は北キプロス・トルコ共和国当局と協力して大規模な捜索救助活動を開始した」と述べた。\n船が転覆した後、ムスタファ・コックさんはボートで約65人を救出した。同氏はBBCに対し、乗組員は海が静まるまで待つべきだったと感じたと語った。\n「彼らにとっては安全ではなかった」と彼は語った。 「海はかなり波立っていた。」\nコッチ氏は「人々が亡くなった。それは正しくない」と付け加えた。\n同氏は、ボートは土曜日にキレニアに到着したが、「前部に多少の損傷があった」と述べた。\nマリン・トラフィックによると、フェリーは長さ40メートル、幅10メートルの高速船フィロ・ジェットで、トルコの旗を掲げて航行している。\n日曜日の夕方、アリクリ氏はTRTに対し、船は完全に沈没したと語った。\n転覆した旅客船を運航する会社フィロ・デニズチリク氏は、「悲劇的な事故に深く悲しんでいる」と述べた。\n乗客の親族に情報を提供するホットラインが設置されている。乗っていた人の国籍や負傷者の状況は不明。\n地元テレビは、船体の上に救命胴衣を着た人々がいる、逆さまのフェリーが水中に沈む映像を放送した。\nTRNCはトルコのみが承認しており、1974年以来分割されているキプロス島の北3分の1を支配している。\nSherie Ryder による追加レポート",

    "title": "Trump criticizes NBC over election comment as Treasury denies some NYT, WSJ and Bloomberg reporters G20 credentials",
    "titleJa": "財務省がNYT、WSJ、ブルームバーグ記者の一部G20資格を否定、トランプ大統領、選挙コメントでNBCを批判",
    "summaryJa": "トランプ大統領のNBCへの攻撃は、財務省がニューヨーク・タイムズ紙、ウォール・ストリート・ジャーナル紙、ブルームバーグ紙の記者らのG20への出席を禁止した後に起きた。",
    "bodyOriginal": "President Donald Trump on Sunday lashed out at NBC News \"Meet the Press\" host Kristen Welker, suggesting she would be reported to the Federal Communications Commission over her alleged characterization of election results.\nThe president slammed Welker after Trump said the \"Meet the Press\" host said that he has had \"mixed results\" with candidates he has endorsed during this election cycle. A handful of Trump's chosen candidates have lost in primaries this year, such as Minnesota gubernatorial candidate and MyPillow CEO Mike Lindell and Iowa gubernatorial candidate Rep. Randy Feenstra, R-Iowa.\n\"How can anyone be allowed to say this, working for freely given Public Airwaves?\" Trump said in a Truth Social post. \"Because of this purposeful inaccuracy, she will be reported to the FCC for rebuke or punishment.\"\nWelker's comments were not made on Sunday's broadcast of \"Meet the Press.\" Instead, the NBC host made the remark during a pre-show segment on a local Washington, D.C., affiliate, WRC-TV, CNN's Brian Stelter said in a post on X.\n\"He's going to loom large over these midterms. There's no doubt about that. He, of course, has endorsed a slate of candidates in the primaries,\" Welker said in that segment. \"He's had some mixed results, but most recently, his pick of Senator Darline Graham, of course, the sister of the late Senator Lindsey Graham, was successful in her primary battle, so now she takes on Dr. Annie Andrews in South Carolina.\"\nA spokesperson for NBC News said in a statement: \"Kristen is one of the best in the business and we stand by her.\"\nThe president's attack on Welker comes after the Treasury Department barred economics journalists from The New York Times, The Wall Street Journal and Bloomberg from attending this week's G20 meetings in North Carolina, according to the Times.\nThe reporters were not granted credentials by the Treasury Department.\nNearly 300 members of the media, including one Times reporter, will have high-level access to policymakers throughout the event, a Treasury spokesperson said in a statement.\nThe exclusions are the latest example of the Trump administration seeking to restrict press access. Last year, the Pentagon imposed a strict new press policy that saw nearly all media outlets exit rather than sign an agreement to abide by the policy.\nWhile Trump has long derided the news media as \"fake news\" and lashed out at reporters, his Federal Communications Commission chief Brendan Carr has been more willing to act on alleged bias during his second term. Last year, Carr called for action against Jimmy Kimmel over comments made on his ABC late-night show. ABC later temporarily pulled the program from the air before restoring it.\nTrump appeared to direct Carr to target NBC in his social media post.\n\"The Press is a Disgrace to our Nation, and I hope that Chairman Brendan Carr, and the fine people of his Commission, will take this Threat to our Country very seriously,\" he said.\nIn an earlier Truth Social post, Trump expressed his displeasure with polling used by the press to forecast election results, and suggested Carr's FCC would also look into that.\n\"THE FAKE POLLS USED BY OUR CROOKED MEDIA ARE OUT OF CONTROL, AND SOMETHING MUST BE DONE ABOUT IT. FCC TO THE RESCUE!\" the president said.\nThe president stormed out of an interview with Welker earlier this year after being pressed on his controversial \"weaponization\" fund and on evidence of his persistent claims of election fraud.",
    "bodyJa": "ドナルド・トランプ大統領は日曜日、NBCニュース「ミート・ザ・プレス」の司会者クリステン・ウェルカー氏を激しく非難し、彼女が選挙結果を特徴づけた疑いがあるとして連邦通信委員会に報告されるだろうと示唆した。\nトランプ大統領が、「ミート・ザ・プレス」の司会者が、今回の選挙期間中に自身が支持した候補者たちと「まちまちの結果」をもたらしたと発言したことを受け、大統領はウェルカー氏を非難した。ミネソタ州知事候補でマイピローCEOのマイク・リンデル氏やアイオワ州知事候補のランディ・フェーンストラ下院議員（共和党、アイオワ州）など、トランプ氏が選んだ少数の候補者が今年の予備選で敗れた。\n「無償で与えられた公共放送のために働いている人が、どうしてこんなことを言えるのでしょうか?」トランプ大統領は真実ソーシャルへの投稿でこう語った。 「この意図的な不正確さのため、彼女は叱責または懲罰のためにFCCに報告されるだろう。」\nウェルカー氏のコメントは日曜日の放送「ミート・ザ・プレス」では行われなかった。その代わり、NBC司会者は地元ワシントンD.C.の系列局WRC-TVの番組前のコーナーで発言したとCNNのブライアン・ステルター氏がXに関する投稿で述べた。\n「彼は中間選挙で大きな存在となるだろう。それについては疑いの余地はない。もちろん、彼は予備選挙で候補者リストを支持している」とウェルカー氏はそのコーナーで語った。 「彼の成績はまちまちだが、最近では彼が選んだダーリン・グラハム上院議員（もちろん故リンジー・グラハム上院議員の妹）が予備選で勝利を収め、現在はサウスカロライナ州でアニー・アンドリュース博士と対戦している。」\nNBCニュースの広報担当者は声明で「クリステンはこの業界で最高の人物の一人であり、我々は彼女を支持する」と述べた。\n同紙によると、大統領のウェルカー氏への攻撃は、財務省がニューヨーク・タイムズ紙、ウォール・ストリート・ジャーナル紙、ブルームバーグ紙の経済記者らの今週ノースカロライナ州で開催されるG20会議への出席を禁止した後に発端となった。\n記者らには財務省から資格が与えられていなかった。\n財務省報道官は声明で、タイムズ記者１人を含むメディア関係者３００人近くがイベント期間中、政策立案者らと高レベルの接触ができると述べた。\nこの除外は、報道機関へのアクセスを制限しようとするトランプ政権の最新の例である。昨年、国防総省は厳格な新たな報道政策を課し、ほぼすべての報道機関がその政策を遵守するための協定に署名することなく撤退した。\nトランプ大統領は長年報道機関を「フェイクニュース」と嘲笑し、記者たちを激しく非難してきたが、連邦通信委員会のブレンダン・カー委員長は２期目の任期中に偏見の疑いに対してより積極的に行動する姿勢を見せている。カー氏は昨年、ジミー・キンメル氏のABC深夜番組での発言を巡り、同氏に対する行動を呼びかけた。 ABCはその後、番組を一時的に放送から外し、その後復活させた。\nトランプ大統領はソーシャルメディアへの投稿でカー氏にNBCを標的にするよう指示したとみられる。\n「報道は我が国の恥であり、ブレンダン・カー委員長と委員会の優秀な人々が我が国に対するこの脅威を真剣に受け止めてくれることを期待する」と述べた。\nトランプ氏は以前のトゥルース・ソーシャルへの投稿で、報道機関が選挙結果を予測するために利用する世論調査に不快感を表明し、カー氏のFCCも調査するつもりだと示唆した。\n「私たちの不正なメディアが使用する偽の世論調査は制御不能になっており、これについて何かをしなければなりません。FCC が救助します!」と大統領は言いました。\n大統領は今年初め、物議を醸している自身の「武器化」資金と選挙不正の執拗な主張の証拠について追及された後、ウェルカー氏との会見を突然打ち切った。",

    "title": "'A giant leap forward': Nasa launches powerful new space telescope",
    "titleJa": "「大きな飛躍」：NASAが強力な新型宇宙望遠鏡を打ち上げ",
    "summaryJa": "「大きな飛躍」：NASAが強力な新型宇宙望遠鏡を打ち上げ- 公開されました",
    "bodyOriginal": "'A giant leap forward': Nasa launches powerful new space telescope\n- Published\nNasa's powerful next-generation telescope has blasted off into space from its launchpad in Florida, with a mission to explore dark energy, black holes and other mysteries of the Universe.\nThe Nancy Grace Roman telescope will capture vast panoramic views of space, with a field of vision 100 times larger than both the Hubble and James Webb space telescopes, Nasa says.\nThe mission begins with a 100-day journey to a vantage point roughly one million miles from Earth, where the telescope will then start charting planets outside our solar system, known as exoplanets.\n\"Roman is going to change the way we look at the Universe,\" said Nicky Fox, a Nasa administrator.\nThe successful launch of the telescope took place on Sunday morning local time from the Kennedy Space Center in Florida.\nJackie Townsend, a project manager on Nasa's Roman telescope, described it as \"glorious\" at a news conference afterwards. \"The ride was magnificent. It put us right where we wanted to be.\"\nAbout 30 minutes after launch, Roman separated from its SpaceX rocket and is now heading towards its orbiting point around a million miles away.\nFox said Roman \"is going to discover tens of thousands, maybe even 100,000 new exoplanets\" - referring to planets located outside of our solar system.\n\"Why do we care so much about exoplanets? Because one of our main goals at Nasa is answering the question, 'Are we alone in the universe'?\" she added.\nUS President Donald Trump dialled in to the space agency's news conference to congratulate the scientists working on the project.\n\"You're the hottest in space, and we have the hottest country anywhere in the world. So, let's keep it all going. You're a big part of it,\" Trump said.\nAstronomer Jenifer Millard said the telescope will be four times further from Earth than the Moon is, where a lot of infrared space cameras - made to pick up what she describes as \"heat light\"- operate.\nShe told the BBC this is to make sure infrared light from the Moon and Earth don't interfere with the cameras.\nNasa's James Webb Space Telescope, launched in 2021, also orbits the Sun around one million miles from Earth, but its field of vision is not as expansive. Nasa's Hubble Space Telescope, launched in 1990, orbits at about 300 miles above Earth's surface.\nWhile Roman will look outward into the Universe, Millard said scientists are also anticipating it will find thousands of new worlds in our own galaxy.\nThe telescope is named after physicist Nancy Grace Roman, who was Nasa's first chief astronomer in the 1960s and its first female executive.\nDuring her career, she was instrumental in getting the Hubble Space Telescope approved by US Congress and later said its most interesting discovery was dark energy.\nThe new telescope is similarly expected to revolutionise our understanding of the Universe, including through investigating dark energy. It has a five-year primary lifespan with a goal to operate for 10 years.\nNasa says its \"crisp, sweeping surveys will help scientists investigate dark energy and dark matter, discover and characterise exoplanets, map billions of galaxies, study black holes, and explore objects from our own solar system to the edge of the observable Universe.\"\nDark matter, which is invisible, acts as a kind of gravitational glue, while dark energy is believed to be a repulsive force driving the Universe's expansion. Together, they are thought to make up about 95% of the Universe.\n\"One of our main goals at Nasa is answering the question: are we alone in the Universe?\" Fox said at a Sunday morning news conference.\n\"With Roman, we are going to make this giant leap forward... that is going to allow us to look at these distant, distant worlds and start to really resolve the atmosphere around them to let us know: could they be habitable?\"\nMillard said, through the work of telescopes like Roman, scientists are hoping to create \"enormous cosmic maps\" of the Universe at various stages.\n\"They'll be almost like an onion, so you can peel back layer upon layer... and see how the distribution of galaxies changes through cosmic time,\" she said.\n\"What we want to do is use this distribution to try and figure out dark matter and dark energy because we know they exist, we see their effects, but what they are is a real mystery.\"\nRelated topics\n- Published26 July",
    "bodyJa": "「大きな飛躍」：NASAが強力な新型宇宙望遠鏡を打ち上げ\n- 公開されました\nNASA の強力な次世代望遠鏡は、暗黒エネルギー、ブラック ホール、その他の宇宙の謎を探索するという使命を帯びて、フロリダの発射台から宇宙に飛び立ちました。\nナンシー・グレース・ローマン望遠鏡は、ハッブル宇宙望遠鏡とジェームズ・ウェッブ宇宙望遠鏡の両方よりも100倍大きい視野で、宇宙の広大なパノラマの景色を捉えることができるとNASAは述べています。\nこのミッションは、地球から約100万マイル離れた有利な地点までの100日間の旅から始まり、そこで望遠鏡は太陽系の外にある系外惑星として知られる惑星の地図を作成し始める。\nNASAの管理官ニッキー・フォックス氏は、「ローマンは宇宙に対する私たちの見方を変えることになるだろう」と語った。\n望遠鏡の打ち上げは現地時間日曜日の朝、フロリダ州のケネディ宇宙センターから打ち上げられました。\nNASAのローマン望遠鏡のプロジェクトマネージャーであるジャッキー・タウンゼント氏は、その後の記者会見でそれを「素晴らしい」と述べた。 「乗り心地は素晴らしかった。行きたかった場所にたどり着くことができた。」\n打ち上げから約30分後、ローマンはスペースXロケットから分離し、現在約100万マイル離れた周回点に向かって進んでいる。\nフォックス氏は、ローマン氏が「数万個、もしかしたら10万個もの新たな系外惑星を発見する予定だ」と述べた。これは太陽系の外にある惑星のことを指す。\n「なぜ私たちは系外惑星のことをそこまで気にするのでしょうか? NASA での主な目標の 1 つは、『宇宙で私たちだけなのか?』という質問に答えることだからです。」彼女は付け加えた。\nドナルド・トランプ米大統領は宇宙機関の記者会見に電話し、このプロジェクトに取り組んでいる科学者たちを祝福した。\nトランプ大統領は「あなた方は宇宙で最もホットな存在であり、我が国は世界中で最もホットな国だ。だから、このまま進めていこう。あなた方はその重要な役割を担っている」と語った。\n天文学者のジェニファー・ミラード氏は、この望遠鏡は月よりも地球から4倍離れたところにあり、そこでは彼女が「熱光」と呼ぶものを捕捉するために作られた多くの赤外線宇宙カメラが稼働していると述べた。\n彼女はBBCに対し、これは月と地球からの赤外線がカメラに干渉しないようにするためだと語った。\n2021年に打ち上げられたNASAのジェームズ・ウェッブ宇宙望遠鏡も、地球から約100万マイル離れた太陽の周りを周回しているが、その視野はそれほど広くない。 1990 年に打ち上げられた NASA のハッブル宇宙望遠鏡は、地表から約 300 マイル上空を周回しています。\nローマンは宇宙の外に目を向けるが、科学者たちは私たちの銀河系内に何千もの新しい世界が発見されることも期待している、とミラード氏は語った。\nこの望遠鏡は、1960年代にNASAの初代主任天文学者であり、初の女性幹部でもあった物理学者ナンシー・グレース・ローマンにちなんで名付けられました。\n彼女はそのキャリアの中でハッブル宇宙望遠鏡を米国議会に承認させるのに尽力し、後にその最も興味深い発見はダークエネルギーであると語った。\n新しい望遠鏡も同様に、暗黒エネルギーの調査などを通じて、宇宙に対する私たちの理解に革命をもたらすことが期待されています。一次耐用年数は 5 年で、10 年間の稼働が目標です。\nNASAは、「その鮮明で広範囲にわたる調査は、科学者が暗黒エネルギーと暗黒物質を調査し、系外惑星を発見して特徴づけ、何十億もの銀河の地図を作成し、ブラックホールを研究し、私たちの太陽系から観測可能な宇宙の果てまで物体を探索するのに役立つだろう」と述べている。\n目に見えない暗黒物質は一種の重力接着剤として機能しますが、暗黒エネルギーは宇宙の膨張を引き起こす斥力であると考えられています。これらを合わせると、宇宙の約 95% を構成すると考えられています。\n「NASA​​ での私たちの主な目標の 1 つは、宇宙には私たちだけなのか? という質問に答えることです。」フォックス氏は日曜朝の記者会見で語った。\n「ローマンとともに、私たちはこの大きな飛躍を遂げるつもりです...それによって、私たちはこれらの遠く離れた世界に目を向け、それらを取り巻く大気を実際に解決し始めて、私たちに知らせることができます：それらは居住可能である可能性がありますか？」\nミラード氏は、ローマンのような望遠鏡の働きを通じて、科学者たちはさまざまな段階で宇宙の「巨大な宇宙地図」を作成したいと考えていると述べた。\n「それらはほとんどタマネギのようなものなので、層を一枚ずつ剥がしていき、宇宙時間の経過とともに銀河の分布がどのように変化するかを観察することができます」と彼女は語った。\n「私たちがやりたいのは、この分布を使って暗黒物質と暗黒エネルギーを解明しようとすることです。なぜなら、暗黒物質と暗黒エネルギーが存在することはわかっていて、その影響も観察できるからです。しかし、それらが何なのかは本当の謎なのです。」\n関連トピック\n- 7 月 26 日発行",

    "title": "He beat Big Tobacco. Will the same playbook work against Meta and social media?",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
