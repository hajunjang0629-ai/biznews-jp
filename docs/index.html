    "bodyOriginal": "The Sept. 11, 2001, terror attacks reshaped how we travel, from how we pack our toiletries to what we wear when we fly. Airport checkpoints for almost a quarter century for most travelers have meant shoes off. Limitations on liquids. And no tearful, cinematic gateside farewells or joyful welcomes.\nBut 25 years later, the U.S. government is starting to ease some of the restrictions, which include measures that were tied to other attacks attempted in the months after 9/11.\nLast year, the Department of Homeland Security, which was formed after the attacks, said flyers can leave their shoes on at airports, a major change for travelers going through regular security.\nThat rule was introduced after Richard Reid, who became known as the \"shoe bomber,\" tried and failed to ignite explosive material in his shoe on a Paris-to-Miami flight in December 2001.\nRules for liquids are officially unchanged. Those regulations for liquids in carry-ons stem from 2006, when British officials foiled a plot to bring liquid explosives on flights.\nNew scanners installed at some airport checkpoints allow travelers to leave liquids in their bags before going through screening, though availability varies by airport and checkpoint. Limits on liquid container size remain in effect.\n\"The technologies today are better than they were a long time ago and some of the technology that's been deployed is better than it was five years ago,\" said Jeff Price, a professor at the Metropolitan State University of Denver's Department of Aviation and Aerospace Science and an airport management consultant.\nAnother change since that era is the number of options customers have for airport screening. The Transportation Security Administration, for $76.75 covering five years, offers PreCheck, in which travelers undergo prescreening services and can use expedited screening lanes.\n\"If you've got a few bucks, yeah, you can reduce the amount of screening and jump the line,\" Price said. \"The other side of that is when you do become a member of PreCheck, you give up a lot more of your personal data to the government, and that's the trade-off.\"\nThere's also a private option with Clear, with a shorter identification check line, in exchange for prescreened biometric data.\nGate greetings return\nThe new changes are going beyond security.\nTSA this week launched a free program allowing eligible trusted travelers, including TSA PreCheck members, to apply for access to secure gate areas without a boarding pass.\nThe program is called \"Gateside,\" and the agency has rolled it out at 13 U.S. airports, including Dallas Fort Worth International Airport, Los Angeles International Airport, Detroit Metropolitan Wayne County Airport and Salt Lake City International Airport.\nThe area beyond TSA screening has been heavily restricted since 9/11. In launching the program, the agency said PreCheck members who use the program can \"meet family members at their gate, join a friend on a long layover for lunch or dinner, visit airport dining and shopping locations, or greet service members returning from deployment.\"\nParticipants must apply online one to three days in advance and receive approval before entering through security.\nPrivatization attempt\nSome of the tweaks to security have been more rocky.\nThe TSA late last month scrapped a program it called TSA Gold+ that would provide privatized security at certain airports.\nThe new head of TSA, David Cummins, who took the top role in early August, said that a new screening partnership program will \"replace TSA Gold+ to better harness the role of the private sector in delivering a safer, more secure, and more efficient aviation system.\"\nTSA didn't respond to requests for further comment.\nTampa International Airport in Florida had reviewed the program starting in May, in part because it could shield the airport from the impact of government shutdowns, airport Chief Operating Officer John Tiliacos told reporters last month. Those shutdowns left TSA officers without regular paychecks for months, and staffing shortages led to long lines at airports around the country. The chance to add new technology was also a draw.\nTampa decided not to move forward with the program, and TSA announced its replacement shortly after. Tampa's Tiliacos told reporters last month \"we weren't quite satisfied that we were getting all of the answers to our questions regarding the technology\" and that drove the airport's decision to opt out.\nEvolving threats\nWhile some rules travelers have lived with for decades might be fading, the aviation sector is still dealing with changing threats.\n\"You have AI. You've got cybersecurity issues that continue to pop up. Drones are a major issue,\" said Keith Jeffries, vice president of aviation security company K2 Security Screening Group, who is retired from the TSA and was the agency's security director at Los Angeles International Airport. \"It's the role of security and protecting, especially the transportation sector, it's getting broader, and other technologies are trying to keep up.\"\nAs security technology evolves, so does the energy of potential attackers to overcome whatever obstacle they have and send their message.\nDeterrents are important, but Jeffries said: \"There is no such thing as the perfect security mousetrap. It doesn't exist.\"",

    "bodyOriginal": "AI boom helps drive surprise UK growth in July\n- Published\nThe UK's economy grew faster than expected in July partly helped by businesses using artificial intelligence (AI).\nThe economy expanded by 0.4%, the Office for National Statistics (ONS) said, whereas analysts had predicted no growth.\nGrowth in July was helped by a strong performance from the services sector, and particularly computer programming.\nExperts said the figure showed the UK economy was proving resilient in the face of shocks such as the war in Iran, but they expect growth to slow in the months ahead as high energy prices affect households.\nJuly's figure follows growth of 0.3% in June and zero growth in May.\nAccording to the ONS director of economic statistics, Liz McKeown, there was evidence that businesses involved with AI and related technologies helped to boost the sector, not just in July but in May and June as well.\nThe ONS said many of the IT businesses reporting the largest turnover \"appear to be involved with AI\", though it said it is difficult to quantify the exact impact of AI.\nMcKeown also said some businesses had said that the warm weather and football world cup had affected activity in July, although she said the effects \"differed across industries, benefitting some businesses while creating challenges for others\".\nThe ONS said that in the three months to July, which gives a better underlying picture, the economy grew by 0.4% compared with the previous three months.\nRob Arnold, co-founder of Ascendea, an AI firm which employs nine people, believes the UK hasn't seen the real economic growth potential from the technology yet.\nHe says his company is able to develop apps for other businesses \"100 times quicker at a 50th of the cost\" because of AI, but that the UK government needs to do more to invest in the sector as there are currently better opportunities in the US.\nHe knows a few small UK-based AI firms that have either moved to the US or are thinking of doing so due to a lack of UK government support.\nAlongside grants and funding, he says the government also needs to invest in training companies on how to use AI as it can be dangerous if not understood properly. \"It's like playing with a weapon,\" he says.\nPaul Dales, the chief UK economist at Capital Economics, said July's data showed \"the resilience of the economy in the first half of the year continued into the second half\".\nHowever, he added that higher energy prices and borrowing costs would soon start to hit growth, especially if the rises seen this week are sustained.\nThe Iran war has led to a sharp jump in oil prices, which has fed through to higher energy and fuel prices - affecting households and businesses.\nThis rise in energy costs has led to fears that inflation will remain high, and increase the chance that central banks will hike interest rates to keep price rises under control.\nThe Bank of England is meeting next week to discuss interest rates. Economists widely expect rates to be held, but some have predicted an increase before the end of the year.\nChancellor John Healey said the economy, was \"demonstrating a welcome resilience, despite serious global uncertainty\".\n\"Our growth although still fragile was the fastest in the G7 in the first half of the year,\" he added.\n\"But, the conflict in the Middle East does have impacts here at home - from the cost of the weekly family shop to the cost of government borrowing.\"\nHealey is to present his first Budget in October. He told BBC News this week that he wants people to confident about the economy, despite acknowledging the challenge of \"historic high\" borrowing costs.\nShadow chancellor Andrew Griffith said nobody in the government \"should be high-fiving themselves\" over the latest figures.\n\"Our construction and production sectors are shrinking, unemployment is up under Labour, and we've got the highest government borrowing rates in almost 30 years.\"\nWhat's happening to the UK economy and how does it affect you?\n- Published2 hours ago\nAre interest rates on the way up again?\n- Published2 hours ago\nYael Selfin, chief economist at KPMG, said while July's headline growth figure was strong, it \"masks a weaker picture for households\".\n\"Consumer-facing services contracted in July, as retail and hospitality activity fell following earlier increases in activity in the summer,\" she said.\n\"Higher energy and fuel prices are likely to place further pressure on household budgets, while elevated mortgage rates will continue to weigh on housing activity and wider consumer spending.\"\nRichard Carter, the head of fixed interest research at investment firm Quilter Cheviot, said the growth seem in July \"may not last, especially as activity is likely to stall ahead of the Budget.\n\"The war in the Middle East continues to drive a lot of the economic data, but the UK is the most exposed to the fallout,\" he said.\n\"Calls for pro-growth measures will get louder as the Budget nears, but whether or not the government has the room to act remains to be seen.\"\nAdditional reporting by Mitchell Labiak\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "bodyOriginal": "The Iran-backed Houthi militant group has seized control of Yemen's port city of Mokha on the Red Sea coast, bringing Tehran closer to securing another point of leverage in its six-month-long conflict with the U.S.\nThe Houthis' capture of Mokha is regarded as a severe setback to Saudi Arabia and the Yemeni forces it backs. It could also increase Iranian pressure around two critically important oil choke points on either side of the Arabian Peninsula: the Bab el-Mandeb Strait and the Strait of Hormuz.\nThe Houthis seized control of the city on Yemen's Red Sea coast on Thursday, according to The Associated Press, citing Yemeni and Houthi officials. CNBC could not independently confirm the report.\nMokha, a strategic city on Yemen's Red Sea coast that gave its name to Mocha coffee, is situated about 75 kilometers (46 miles) north of the Bab el-Mandeb Strait, a waterway that connects the Red Sea to the Gulf of Aden and to global markets.\nThe strategic importance of the Bab el-Mandeb Strait has grown significantly since the start of the U.S. and Israel's war against Iran in late February, with the waterway emerging as an alternative route for crude moving toward Asia.\nIt is now feared that the Houthis' advance toward the Bab el-Mandeb Strait could have major ramifications for global trade, particularly if the militant group ratchets up threats or attacks on Red Sea shipping.\nThe capture of Mokha represents a \"major blow\" to Saudi Arabia as it raises the possibility of the group exerting a tighter grip on the Bab el-Mandeb Strait, according to Hamish Kinnear, principal Middle East and North Africa analyst at risk intelligence company Verisk Maplecroft.\n\"The Houthis were already threatening Saudi shipping from previous positions, but their capture of Mocha opens up the possibility of further advances towards the Bab el-Mandeb coastline and a tighter grip on the chokepoint,\" Kinnear said in a research note.\nAs the war continues, Kinnear said both Tehran and Washington believe time is on their side, making a new truce unlikely for now.\n\"Oil and gas prices, and more specifically refined products such as diesel, will continue to tick upwards while that remains the case – even if US convoys and Strait of Hormuz export alternatives cushion the price impact,\" Kinnear said.\nWhat next for oil prices?\nOil prices traded lower on Friday morning, but both major benchmarks remained on course to end the week above $100 per barrel for the first time since mid-May.\nInternational benchmark Brent crude futures with November expiry traded 2.1% lower at $105.37 per barrel, while U.S. West Texas Intermediate futures with October expiry were last seen 1.7% lower at $100.76.\nThe resilience of the oil market is being tested by a clearer recognition of the mounting threat to regional supply, strategists at ING said, with energy market participants seen repricing both the duration and severity of the conflict.\nEven as flows continue through the Strait of Hormuz, ING's strategists said flows remain well below pre-war levels, underlining how fragile the situation has become.\n\"Saudi energy infrastructure and crude oil exports from the Red Sea are increasingly at risk, with the Houthis in Yemen targeting Saudi Arabia,\" ING's Warren Patterson and Ewa Manthey said in a research note published Friday.\n\"As the Houthis have taken control of the Red Sea port of Mokha in Yemen, recent events increase the threat to shipping around the Bab al-Mandeb Strait,\" they added.",

    "bodyOriginal": "Chinese chipmaker Enflame, which is developing domestic alternatives to U.S. rivals like Nvidia, has seen its stock soar 206% after debuting in Shanghai.\nThe company saw huge demand, with its initial retail offering drawing orders for over 6,000 times the shares available before it reallocated more stock to that group.\nEnflame, which is backed by tech giant Tencent, is considered one of China's so-called \"four little dragons\" of AI chipmaking and is the last of that group to go public.\nThe other three all surged on listing, and have remained higher since. In December, MetaX soared nearly 700% on its first day of trading, while Moore Threads gained over 400% on its trading debut. Biren jumped 76% on its IPO in January.\nInvestors are betting on the ability of domestic AI chipmakers to replace Nvidia in China. International chipmakers led by Nvidia accounted for nearly 60% of China's AI accelerator market in 2025, according to IDC data cited in Enflame's prospectus, translated by CNBC.\nNvidia has seen its exports in China's data center compute market shuttered by U.S. export controls and Beijing's lukewarm interest in importing advanced chips as the country pursues tech self-sufficiency.\nChina's semiconductor buildout is accelerating. Goldman Sachs said in an August report that growing foundation models and AI applications in China were driving development across AI chips, foundries, memory and advanced packaging.\nThe analysts expect China's semiconductor capital spending to reach $82 billion by 2030, driven by capacity expansion in memory and advanced nodes amid a growing generative AI trend.\nLocal startups such as Moonshot AI's Kimi K3 closed the gap to the frontier with leading U.S. models, and Chinese AI systems are seeing growing uptake across the globe. Rival Z.ai said its GLM-5.3-Flash model runs entirely on China-made chips. Analysts said the company likely used a combination of chips from leading Chinese domestic player Huawei, as well as chips from Enflame and other local companies.\nAlibaba is also developing its own AI chips and accompanying software, as well as optimizing systems for leading Chinese models.\nRevenue surges\nFounded in 2018, Enflame is building AI processors as China looks to boost its efforts in model building amid major capability gains from domestic developers.\nEnflame said it plans to use proceeds from the listing to develop and commercialize its fifth- and sixth-generation AI chips, as it seeks to match the performance of high-end products from international rivals.\nThe company reported revenue of 990 million yuan ($147 million) in 2025, up from 722 million yuan a year earlier, but has yet to turn a profit.\nTech hardware has become a key driver of Chinese stock performance in recent months.\nIn July, shares of chipmaker CXMT, which makes dynamic random-access memory (DRAM) chips, a key feature of some AI systems, soared nearly 466% in their debut on Shanghai's tech-heavy STAR Market, making CXMT the most valuable China-listed company.",

    "bodyOriginal": "U.S. President Donald Trump said he has no regrets about starting the Iran war and added that \"If I had it to do again, I would do exactly what I did.\"\nSpeaking to Fox News presenter Laura Ingraham on Thursday stateside, Trump said that he would have attacked Iran despite the impact on the midterm elections.\n\"If we hadn't done Iran, you would be cruising to midterms victory right now,\" Ingraham told Trump, to which Trump replied \"supposing we were cruising, and all of a sudden Iran has a nuclear weapon. They would use it.\"\nHe added that if Iran had a nuclear weapon, the Islamic Republic would \"wipe out\" Israel and the Middle East, and start hitting U.S. cities.\nHis comments come as markets brace for a longer Iran war, after a Wall Street Journal report revealed that top White House advisors had discussed with Trump the possibility that the Iran war could drag on beyond his current term.\nTrump has said that the war will end immediately after the midterm elections and oil and gas prices will also fall, adding on to his months-long claims that the conflict will end soon.\nIn separate comments to NewsNation on Thursday, Trump denied reports that there was any damage to U.S. assets, after Iran claimed it had damaged multiple U.S. fighter aircraft at a base in Jordan.\n\"No damage. No nothing,\" Trump said, when asked if there was any truth to the reports.\nEconomic pressure\nWashington is continuing efforts to isolate Iran from its economic network, with Treasury Secretary Scott Bessent flagging sanctions against \"a large bank\" next week.\n\"We're going to do it on Monday because we want to honor the memory of our fallen citizens on 9/11. But watch this space on Monday.\"\nBessent said that the administration has sanctioned and closed the Dubai branches of the second largest bank in Egypt, claiming that the bank had given the Iran $1.8 billion dollars. The \"largest Turkish bank\" that had been giving to the Iranians was also sanctioned, although Bessent did not specify which bank were these.\nTrump, in the NewsNation interview, was also asked how Iran could continue holding out under the current economic pressure.\n\"I don't know that they're gonna be able to hold out,\" Trump said. \"But it'll get settled after the elections. Or maybe sooner. But it'll get settled right after the election.\"",

    "title": "Chinese AI labs secretly used millions of Claude exchanges to train their models, Anthropic says",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Anthropic said it detected and disrupted unauthorized large-scale efforts by China-based AI labs including Alibaba, Moonshot and DeepSeek to train their models using Claude.\nThe U.S. AI company said in a threat intelligence report released Thursday that the firms were involved in what it described as \"illicit distillation,\" a process in which outputs from a more capable AI model are used to train another model and replicate some of its capabilities without authorization.\n\"Some of these exchanges included sensitive information, including from individual users, major multinational companies, and state-affiliated actors ... These practices are likely inconsistent with privacy laws and the labs' own terms of service,\" according to the report.\nAnthropic said operators affiliated with Alibaba used Claude outputs to help train its Qwen models, while Moonshot routed some Kimi user requests to Claude and used some of the resulting exchanges to train its own models.\nThe Alibaba operation was the largest distillation campaign Anthropic said it has measured, involving more than 151 million exchanges with Claude between May and July.\nThe activity peaked at nearly 3 million exchanges per day from more than 3,500 fraudulent accounts, according to the report. The company said Alibaba also used Claude for broader AI research, including reinforcement learning and model architecture.\nMoonshot and DeepSeek\nAnthropic also detailed activity involving Moonshot AI, the Beijing-based company behind the Kimi family of AI models.\nMoonshot silently forwarded some customer requests intended for Kimi to Claude and then displayed Claude's responses to users, who thought they were using a Kimi model, according to the report.\nIn one 10-day period, Moonshot relayed nearly 300,000 customer requests to Anthropic, the vast majority of which were routed to Claude Opus models. The requests were routed through a network of 5,380 accounts that Anthropic described as fraudulent, most of which appeared to be located in Singapore and Japan.\nThe report said Moonshot saved at least some of those exchanges and extracted Claude's reasoning transcripts to use as training data for its own models.\nMore than 23 million exchanges were attributed to Moonshot between May and July, according to the report.\nSome of the customer requests routed to Claude contained sensitive information. The company said it did not know whether Moonshot had notified customers that their requests were being sent to Anthropic.\nThe company said DeepSeek — which rose into prominence last year due to its capabilities and cheap costs — also used tactics similar to Moonshot, transferring exchanges to Claude without notifying DeepSeek customers. Anthropic said it observed more than 12 million distillation attacks attributable to DeepSeek over 14 days in July 2026.\nThe report, which named several other major Chinese AI companies, covers activity the company said it disrupted between December 2025 and August 2026 across seven areas, including cyber operations, influence operations, surveillance, scams and fraud, biological misuse, conventional weapons development and distillation.\nAlibaba, Moonshot, DeepSeek, Xiaomi and Anthropic did not immediately respond to CNBC's requests for comment.",

    "title": "Can Europe recharge its battery industry?",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Can Europe recharge its battery industry?\n- Published\nEurope has taken some big swings in the battery industry in recent years and has made a couple of high-profile misses.\nBoth Sweden's Northvolt, external and Norway's Morrow, external filed for bankruptcy and there are fears in Europe that the continent has missed another technology shift.\nWith more transport and industry switching from fossil fuels to electricity, batteries are likely to be a growth business.\nBut the length of time required to bring new products to market, coupled with brutal competition, especially from China, means taking a substantial risk.\nCould the answer lie at an almost unimaginably small scale? An increasing number of investors and researchers think so.\nA single nanometre is one-billionth of a metre, but it's at that level that some of the most consequential work is being done.\n\"If you can make this work, it touches so many industries [but] it's a risky business,\" says Christian Rood, chief executive of Dutch tech firm LeydenJar.\nNamed after a 18th century precursor to electric cells, LeydenJar uses a technique known as plasma deposition to make a lighter, more efficient anode – an essential component of all batteries.\nSilicon is a highly effective and cheap material to use in anodes, but pure silicon expands and contracts as the battery operates and is recharged, which causes it to crack.\nHowever, using plasma deposition, LeydenJar can - layer by tiny layer - make an ultra-thin pure silicon foil which resists cracking, allowing a significant increase in battery life, charging speed, and energy density (up to 50%, according to LeydenJar).\n\"Where normally a pure silicon anode would fall apart, [this] remains stable, so it was a very wonderful invention,\" says Rood.\n\"We address the bottleneck in the battery.\"\nCommercial-scale production will start at the end of 2026, but it has taken 10 years to get to this point – the very definition of the time and investment required for so-called Deep Tech innovations.\nIt's no coincidence that LeydenJar's factory is in the Dutch city of Eindhoven - home to ASML and other important players in the computer chip industry.\n\"A lot of people talk theoretically about ecosystems; I can tell you this is one of our sources of competitive advantage,\" Rood says.\n\"It's really the crossover from semiconductors to batteries that makes us different - once you've demonstrated the principle in the lab, industrialization requires you to work with the semiconductor technology and suppliers.\n\"That means a lot of risk, but also a lot of opportunity in terms of patenting, in terms of securing your whole intellectual property. And that's much more difficult to do in the US or in China.\"\nAcross the Netherlands and Europe more widely there are multiple smaller Deep Tech start-ups looking to develop nanotechnology in the battery market.\nOne of those is Powall, a start-up in the Dutch city of Delft that is developing commercial-scale equipment for nanocoating the powders that are the raw materials of today's batteries.\nAgain, the scale is tiny, and once again the technique was born in the semiconductor industry.\nIndividual powder granules are measured in micrometres, the coatings in nanometres - they are applied using a technique known as atomic layer deposition.\nRoderik Colen, CEO of Powall, tells me that the system offers multiple opportunities to adjust and improve the performance of today's batteries.\n\"Your battery works less well than before after using it thousands of times - that degrading or aging can be slowed down when you're using a nanocoating,\" Colen explains.\n\"You can have an exciting new material with a higher capacity or fast charging, all these novel developments. They typically have one element which is very good, but they suffer on the durability side.\"\nAnd that means they will never be a commercial product.\n\"That's where we then come in, to give them the protective coating to effectively enable these new materials.\"\nThe powders and the coating are carried by gas and brought together in a chemical reaction.\nIt is, says Colen, a precise but flexible process which can be almost endlessly adapted.\n\"You have great accuracy in how thick you want to have it. And that makes a difference in performance.\"\nNeither LeydenJar nor Powall are trying to build an entire battery, and both have commercial relationships with customers in Asia.\nBut Christian Rood of LeydenJar says companies like his can fortify Europe's position in what has become a global contest.\n\"The easy comparison is with semiconductors, where there's really a race for the best chip technology.\n\"[Dutch tech giant] ASML is not producing chips; it focuses on a critical step in the production of chips, and in that way, has a seat at the table when it comes to the whole semiconductor battle.\n\"This is our ambition as well – to have a position where our battery anode is so unique that we have an important position in the supply chain.\"\nSo, how do these ambitions play into Europe's goals in the battery industry?\nAlexander Brown is a senior analyst at the Berlin-based independent think-tank the Mercator Institute for China Studies (Merics).\n\"I think having one part of the supply chain based in Europe is great and if that can be a very advanced technological part, which offers the opportunity for high margins, that's fantastic,\" Brown tells me.\nBut he cautions that while \"there can be collaboration as well as competition at the same time\", China in particular will continue to work to reduce its dependence on other regions.\n\"China is working very hard to develop local alternatives for technologies, including these niche technologies.\n\"It's no secret that China would love to replace ASML - they're working very hard to do that, and it's not unforeseeable that they will achieve that goal eventually.\n\"So, I think Europe has traditional strengths in developing very exquisite high-quality products, which can find markets all over the world.\n\"But I also think it's important for that not to be the only strategy [from the continent's policy makers].\"\nThe challenges of working in such a specialised field are not only technological.\nLeydenJar has already reached commercial scale, but Rood says that raising funds within Europe is not always easy.\n\"There is sufficient financing in Europe, but the risk attitude is quite different than in Asia and in the US,\" says Rood.\n\"That means for a company like us that you have to work with different sources of funding at the same time,\" Rood explains.\nHe lists government grants, debt financing, help from the European Investment Bank and investors willing to buy a share of the business.\n\"They set a lot of challenging conditions, and they all want to do their own due diligence. It's hard work,\" Rood says.\nPowall's Colen says Europe, and the Netherlands in particular, is an \"innovation powerhouse\", and battery technology offers a chance for the continent to make an impact, if the appetite for the risk is there.\n\"It's a relatively young industry where factories are being built left, right and centre. They're searching for the right tech. So that's where you can play a big role, because the volumes are huge.\"\nPerhaps Europe's place in that business lies not in building huge battery gigafactories, but at the other end of the scale altogether.\nAs Colen puts it, \"small changes make big differences.\"\nMore Technology of Business\n- Published3 July\n- Published12 June\n- Published26 June",

    "id": "i-asked-my-husband-to-pay-into-my-pensio-6bc8ba6e",
    "title": "I asked my husband to pay into my pension when we had a child - here's why",
    "titleJa": "子どもが生まれたとき、私は夫に年金を払ってくれるように頼みました - その理由は次のとおりです",
    "summaryJa": "子どもが生まれたとき、私は夫に年金を払ってくれるように頼みました - その理由は次のとおりです- 公開されました",
    "bodyOriginal": "I asked my husband to pay into my pension when we had a child - here's why\n- Published\nWhen Molly and Taylor Haylett started their family, they hadn't really planned for what it would mean financially.\n\"Our first child surprised us, so we weren't prepared for it,\" says Molly, 30, a financial adviser from Essex.\nMolly and Taylor, who's a train driver, were earning similar amounts, but once Molly spent more time at home with their baby, the balance changed.\n\"Taylor's career propelled and mine took a step back,\" she says. \"There's an unintended impact on the person who spends more time at home with the kids.\"\nOne of the things the couple decided to do was have Taylor contribute to Molly's pension while she was off work.\n\"We were looking after both our futures, not just Taylor's,\" Molly says.\nIt is something she thinks far more couples should discuss before having children.\n'You've got to just ask him'\nShe explains that she recently had a conversation about this with a friend as she is going to stop working after having children.\n\"My friend said, 'How would I even ask him to do that?' And I said, 'You've got to just ask him.'\n\"People think only about the present and paying the bills but the person taking time off work could end up with much less in the future.\"\nTaylor, 33, admits it was not something he knew about but was on board with Molly's suggestion.\n\"We committed to a life together and if I could help out I would and I was pleased that I did,\" he says.\nHe adds that Molly is the more organised of the two when it comes to planning and budgeting, but says he still wants to understand where their money is going.\n\"I don't just give her money and let her do what she wants. We have open conversations and she'll talk me through it.\"\nResearch by Octopus Money found more than a third of parents reduced or paused pension contributions during parental leave, while 63% did not know their partner could contribute on their behalf.\nA partner can make what is known as a third-party pension contribution. For someone with no or low earnings, up to £2,880 can be paid in each tax year, with basic-rate tax relief increasing that to £3,600.\nFor someone still earning, their partner can also contribute, subject to the recipient's pension limits.\nKatie Guild, co-founder of financial community Nugget Savings, says the pension gap can begin during maternity leave because an employee's own contributions can fall as their pay drops, and contributions may stop altogether during periods of unpaid leave.\nShe says couples should consider whether the partner continuing to work could help make up some of that shortfall.\nBefore having a baby, she recommends working through a few key questions:\nGuild says these conversations are easier before a baby arrives than when parents are sleep-deprived and adjusting to life with a newborn.\nMolly and Taylor now have two children, aged two and five, and say they were much more prepared the second time around and stopped thinking about household costs as something that always needed to be divided exactly in half.\nThe couple, who each earn around £60,000, have their own bank accounts alongside a joint account for bills, but are flexible with the amount each contributes when their circumstances change.\nDuring Molly's maternity leave, for example, they adjusted the split and she's found it helpful to \"view finances as a household\".\nThe couple say they are teaching their children about money from an early age.\nThey set pensions up for both kids when they were born and have been paying into them through a monthly direct debit.\nMolly explains: \"It's like a gift for the future as they can't touch that money until they're in their 60s and we won't be there to see that.\"\nThey also use Junior ISAs, although Molly points out that once the children are old enough, the money becomes theirs to spend \"and if they want to, they can take that money and blow it in Ibiza\".\nTaylor says their five-year-old is given small jobs to earn a couple of pounds, rather than simply being bought everything she asks for.\nThey are also beginning to introduce the idea of saving by telling her that she can spend a pound now or hold on to it and potentially have more later.\nGuild says couples should check what support they can receive, including funded childcare hours, external and Tax-Free Childcare, external.\nShe adds that conversations about money should not stop once parental leave begins and when the baby arrives she advises couples should:\nRelated topics\n- Published24 July",
    "bodyJa": "子どもが生まれたとき、私は夫に年金を払ってくれるように頼みました - その理由は次のとおりです\n- 公開されました\nモリーとテイラー・ヘイレットが家族を始めたとき、それが経済的にどのような意味を持つかについてはまったく計画していませんでした。\n「私たちの最初の子供は私たちを驚かせたので、私たちはそれに対する準備ができていませんでした」とエセックス州のファイナンシャルアドバイザー、モリーさん（30）は言います。\nモリーと電車の運転士であるテイラーの収入は同程度だったが、モリーが赤ちゃんと家で過ごす時間が増えるとバランスが変わった。\n「テイラーのキャリアは前進したが、私のキャリアは後退した」と彼女は言う。 「子供たちと家でより多くの時間を過ごす人には、予期せぬ影響が生じます。」\n夫婦が決めたことの一つは、モリーが仕事を休んでいる間、テイラーに彼女の年金を拠出してもらうことであった。\n「私たちはテイラーだけでなく、自分たちの将来も考えていました」とモリーは言う。\nそれは、はるかに多くのカップルが子供を産む前に話し合うべきだと彼女は考えている。\n「彼に聞いてみればいいよ」\n彼女は、子供ができたら仕事をやめるつもりなので、最近このことについて友人と話し合ったと説明しました。\n「私の友人は言いました、『どうやって彼にそんなことを頼むの？』そして私は、「彼に聞いてみればいいよ」と言いました。\n「人々は現在のことと請求書を支払うことだけを考えますが、仕事を休むと、将来的にははるかに少ない収入になる可能性があります。」\n33歳のテイラーさんは、それは自分が知っていたことではなかったが、モリーさんの提案に乗っていたことを認めた。\n「私たちは一緒に生活することを約束しました。私が手伝うことができるなら、そうしますし、そうすることができてうれしかったです」と彼は言います。\n彼は、計画と予算編成に関しては、モリーのほうが二人よりも組織的だが、それでも二人のお金がどこに使われているのか理解したいと思っていると付け加えた。\n「私は彼女にお金を与えて、彼女がやりたいようにやらせるだけではありません。私たちはオープンな会話をしており、彼女はそれについて私に話してくれます。」\nオクトパス・マネーの調査によると、親の3分の1以上が育児休暇中に年金拠出金を減額または一時停止したが、63％はパートナーが自分に代わって年金拠出できることを知らなかった。\nパートナーは、いわゆる第三者年金拠出を行うことができます。無収入または低所得者の場合、各課税年度に最大 2,880 ポンドを支払うことができ、基本税率の減税により 3,600 ポンドまで増加します。\nまだ収入がある人の場合は、受給者の年金限度額に応じて、そのパートナーも拠出することができます。\n金融界のナゲット・セービングズの共同創設者であるケイティ・ギルド氏は、給料が下がると従業員自身の拠出金も減り、無給休暇期間中は拠出金が完全に打ち切られる可能性があるため、年金格差は産休中に始まる可能性があると語る。\n彼女は、カップルはパートナーが仕事を続けることでその不足分を補うことができるかどうかを検討すべきだと言う。\n彼女は、赤ちゃんを産む前に、いくつかの重要な質問に取り組むことを勧めています。\nギルドによると、こうした会話は、両親が睡眠不足で新生児との生活に慣れているときよりも、赤ちゃんが生まれる前のほうがやりやすいという。\nモリーとテイラーには現在、2歳と5歳の2人の子供がいるが、2回目のときはずっと準備ができて、家計の費用を常にちょうど半分に分ける必要があるという考えをやめたと言う。\n夫婦はそれぞれ約6万ポンドの収入を得ており、請求書用の共同口座と並行して自分たちの銀行口座を持っているが、状況が変わった場合にはそれぞれの拠出額を柔軟に調整している。\nたとえば、モリーさんの産休中、夫婦は分割を調整し、彼女は「家計を家計として見る」ことが役立つことに気づいた。\n夫婦は子どもたちに幼い頃からお金について教えているという。\n彼らは二人の子供が生まれたときに年金を設定し、毎月の口座振替で支払っています。\nモリーは、「彼らは60代になるまでそのお金に触れることができないので、それは将来への贈り物のようなものです。そして私たちはそれを見るためにそこにいるつもりはありません。」と説明します。\n彼らはジュニアISAも利用しているが、モリー氏は、子どもたちが十分な年齢に達すれば、そのお金は自分たちのものになり、「その気になれば、そのお金を持ってきてイビサで使い果たすことができる」と指摘する。\nテイラーさんによると、5歳の息子はただ単に欲しいものをすべて買ってもらうのではなく、数ポンド稼ぐために小さな仕事を与えられているという。\nまた、彼らは彼女に、今 1 ポンド使ってもいいし、それを我慢して後でもっと使えるかもしれないと伝えて、節約するという考えを導入し始めています。\nギルドは、カップルは資金提供された保育時間、外部の非課税保育、外部の非課税保育など、どのようなサポートが受けられるかを確認する必要があると述べています。\n彼女は、育児休暇が始まってもお金に関する会話をやめるべきではないと付け加え、赤ちゃんが生まれたら、カップルには次のことをすべきだとアドバイスしています。\n関連トピック\n- 7 月 24 日発行",

    "bodyOriginal": "Are interest rates on the way up again?\n- Published\nThere's nothing like talk of energy prices and potential higher borrowing costs to remind us that the summer holidays are well and truly over.\nSurging oil prices have been pushing up what drivers pay at the fuel pumps and eating away at household budgets for months, and concerns remain over whether the economic impact of the US-Iran war will drive the cost of living higher.\nCiting the Middle East conflict and warning inflation was \"set to remain well above\" its 2% target for some time, the European Central Bank recently raised interest rates to 2.5%.\nOther central banks are also responding, with the US and the UK poised to make interest-rate decisions next week.\nUp first on Wednesday is the US Federal Reserve, which has held rates steady between 3.5% and 3.75% for five meetings in a row. It last made a change - a rate cut - in December.\nBut a strong jobs market and President Donald Trump saying he does not think oil prices will come down until the Iran war ends, which he expects to happen after November's elections, has led many on Wall Street to bet on a rate hike this month.\nNewly-appointed Fed Chair Kevin Warsh has remained tight-lipped on where he sees interest rates going, but his repeated comments that the central bank's focus should be on slowing price rises has further fuelled expectations of an increase.\nEconomists at Deutsche Bank said recently that a rate hike is \"the most likely policy outcome\", noting comments from Warsh and other members of the Fed.\nViews differ somewhat, with Grace Zwemmer, US economist at Oxford Economics, expecting rates to remain unchanged, but almost universally a rate cut appears to be off the table.\nTrump, though, is again pressing for lower rates.\n\"The Fed Board, with its great new leader, must get smart - BE PATRIOTS for a change,\" he posted on social media last week.\nOil, gas and borrowing costs surge as fears over Middle East escalate\n- Published10 hours ago\nFed has 'work to do' if price rises don't ease for Americans, Warsh says\n- Published28 August\nBorrowers expecting mortgage rates to drop have hopes dashed\n- Published2 days ago\nThe US-Iran war and resulting higher global oil and gas prices are stoking the inflation fears. Shipments through the Strait of Hormuz waterway, one of the world's busiest oil and gas routes, have been restricted due to the war and a barrel of Brent crude is now around $105 (£78), approaching levels last seen at the outbreak of the conflict.\nAlong with directly driving up costs for homes and businesses, higher energy prices can also make transporting goods more expensive and those extra costs can be passed down to consumers through steeper prices for the likes of food and other staples.\nCentral banks try to limit price rises with higher interest rates. By pushing up the cost of borrowing for things such as mortgages and credit cards, they seek to slow consumer spending and inflation. Higher rates also can give people incentives to save instead of spend.\nBut its a balancing act, as higher rates can also encourage businesses to hold off on investing and hiring.\nWhen the Bank of England meets later next week, it is expected to try to look both at current price pressures and the wider economic picture.\nMillions of UK households are set to see energy bills rise to the highest level for three years heading into the winter and gas prices have risen above 200p per therm for the first time since the end of 2022.\nInflation in the UK is at 2.9%, and it is expected to jump in coming months.\nBut despite those predictions, there appears to be broad agreement that the Bank will leave rates at 3.75%.\nThat's because there is \"no sign\" of the so-called second-round effects of the price shock feeding through the economy, such as workers requesting wage rises or businesses hiking prices, according to Oxford Economics.\nThis gives the Bank \"some breathing space,\" added economist Alexander Harvey.\nYael Selfin, chief economist at KPMG, said that outside of the US, in places such as the UK, the economic environment has been \"much weaker\" than where it was in 2022, when the last inflation shock hit the world. UK inflation reached a record high of 11.1% in October that year.\nInterest rates are already higher than four years ago, she added, and consumers, somewhat scarred by previous price hikes, have changed how they spend.\nAlso, four years ago \"businesses were hiring aggressively, vacancies were at record highs, and more people were moving jobs than normal\", Harvey said, as the economy rebooted following Covid.\n\"The conditions were in place for employees to push for significant pay rises in response to a significant inflation shock,\" he said. \"That's in stark contrast to the current labour market.\"\nNow, hiring is much weaker than average and there is less pressure to recruit - giving employees less leverage to demand higher pay.\n- Published2 days ago",

    "title": "Alstom to build new battery-electric train fleet",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Alstom to build new battery-electric train fleet\n- Published\nWork to create the UK's first battery-electric trains for long-distance main line services is set to begin in 2028, the Department for Transport (DfT) has announced.\nThe 29 new Adessia Stream trains are expected to enter service in 2034 and will be built at Alstom's Litchurch Lane factory in Derby.\nThe government said the investment of almost £1bn would help support more than 350 jobs at Alstom and a further 6,000 jobs across the UK supply chain.\nPrime Minister Andy Burnham said the new trains would deliver \"faster, more reliable journeys to the north and thousands of British jobs for the next generation\".\nHe added: \"I've lost count of the number of times someone has stopped me to tell me about the train that never came.\n\"And when that happens, it means missed shifts, missed appointments, and missed opportunities. Today, that starts to change.\"\nThe DfT said the trains would help deliver the Transpennine Route Upgrade's aim to boost capacity by 30%, with thousands of additional seats a day across the Pennines by the early to mid-2030s.\nThey will run between key destinations across the north including Liverpool Lime Street and Scarborough, Manchester Airport and Saltburn, and Manchester Piccadilly and Hull.\nThe DfT added that journey times will be cut by up to 10 minutes between Manchester and Leeds and up to 14 minutes between Manchester and York.\nThe trains will be bought by Rock Rail and leased to TransPennine Express, the government added.\nAlstom, which boasts the largest rolling stock train manufacturing site outside of China, secured a £370m contract in 2024 to produce 10 new London Elizabeth line trains.\nThis came less than three months after a redundancy consultation put 1,300 jobs at risk at its Litchurch Lane factory, which dates back to 1876.\nRob Whyte, managing director UK at Alstom, called the latest agreement a \"landmark moment for Britain's railway\".\nHe said: \"We couldn't be prouder that the country's first main line battery-electric trains will be designed and built in Britain.\n\"The fleet will transform journeys across northern England while showcasing the very best of British engineering, innovation and advanced manufacturing.\"\nIn a statement, DfT said journeys on the new fleet would be \"quieter, smoother and more reliable\", while offering \"improved accessibility, more luggage space and onboard Wi-Fi\".\nStep-free boarding - the \"elimination of gaps between the train and platform\" - are also being promised as part of a commitment to accessibility, alongside three dedicated wheelchair spaces, two accessible toilets, family-friendly areas and cycle and buggy storage on each train.\nGet in touch\nTell us which stories we should cover in Derby\nListen to BBC Radio Derby on Sounds and follow BBC Derby on Facebook, external, on X, external, or on Instagram, external. Send your story ideas to eastmidsnews@bbc.co.uk, external or via WhatsApp, external on 0808 100 2210.",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Oracle shares jumped 7% in extended trading on Thursday after the software vendor issued stronger-than-expected quarterly results.\nHere's how the company performed relative to LSEG consensus:\n- Earnings per share: $1.92 adjusted vs. $1.74 expected\n- Revenue: $19.35 billion vs. $19.14 billion expected\nOracle's revenue grew almost 30% year over year in the fiscal first quarter, which ended on Aug. 31, according to a statement. Net income of $4.68 billion, or $1.56 per share, was up from $2.93 billion, or $1.01 per share, a year ago.\nFor the fiscal second quarter, Oracle called for $1.85 to $1.93 in adjusted earnings per share, with revenue growth between 30% and 34%. Analysts surveyed by LSEG were looking for $1.89 in adjusted earnings per share, with $21.20 billion in revenue, which would indicate 32% growth.\nMuch of Oracle's expansion is tied to data center growth, as the company tries to become a bigger player in the artificial intelligence boom.\n\"Nothing that we know today would lead us to believe that New Mexico or any of our other sites are delayed relative to the schedules that we included, for example, in our fiscal '27 outlook,\" Hilary Maxson, Oracle's finance chief, said in a briefing with reporters.\nBut Oracle has a weaker cash position than hyperscaler competitors and a lower credit rating. The company now sits on $125 billion in debt, and negative free cash flow came in at $5.4 billion, compared with negative $362 million a year earlier.\nCapital expenditures soared to $28.50 billion from $8.50 billion last year. During the quarter, the company said it delivered 850 megawatts of data center capacity.\nOracle shares have dropped 22% this year as of Thursday's close, while the S&P 500 has gained roughly 11%.\nCloud revenue soared 62% in the quarter to $11.61 billion, topping the $11.51 billion consensus among analysts polled by StreetAccount. Revenue from cloud infrastructure more than doubled to $7.4 billion, beating the $7.09 billion consensus estimate.\nOracle's software category contributed $5.55 billion in revenue, down about 3% and lower than StreetAccount's $5.61 billion consensus.\nFor the 2027 fiscal year, Oracle now sees $8.10 in adjusted earnings per share on at least $90 billion in revenue. The LSEG consensus called for $8.07 earnings per share and $89.76 billion in revenue. Guidance on capital spending for the full year is unchanged, Maxson said in the briefing.\nAt the end of the quarter Oracle's remaining performance obligations stood at $664 billion, above StreetAccount's $630.6 billion consensus. The sum includes contracted but unrecognized revenue, deferred revenue and uncollected invoices. New AI contracts won't have any impact on Oracle's plans to raise capital, according to the statement.\nDuring the quarter, Oracle announced AI agents for human resources teams and obtained a Pentagon contract worth up to $7 billion over a decade.\nExecutives will discuss the results with analysts on a conference call starting at 5 p.m. ET.\nWATCH: Oracle calls are trading a lot richer than puts ahead of earnings, says IG Group's Julia Spina",

    "id": "friday-s-cpi-inflation-report-is-even-mo-83b4e95d",
    "title": "Friday's CPI inflation report is even more important than usual. Here's what to expect",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "金曜日朝に発表される報告書は、来週金利を決定する前にFRBが得るインフレパズルの最後のピースとなる。労働統計局は午前8時30分に8月の消費者物価指数を発表する。",
    "bodyOriginal": "A report due out Friday morning will be the last piece of the inflation puzzle the Federal Reserve will get before making its decision on interest rates next week.\nThe Bureau of Labor Statistics will release the August consumer price index report at 8:30 a.m.\nIf the Dow Jones consensus is correct, the report will show that costs for all measured goods and services rose 0.4% last month, putting the annual inflation rate at 3.4%. However, excluding food and energy prices, the respective outlooks for core inflation are 0.2% and 2.4%.\nCombined with Thursday's producer price index data — a measure of wholesale inflation — the CPI will help tell Fed officials what their primary inflation gauge, the personal consumption expenditures price index, will show when it is released at the end of September.\nThe information also is expected to figure heavily into the Federal Open Market Committee's interest rate call next Wednesday, with a percentage point either way possibly meaning the difference between a hold and a hike.\n\"The September FOMC decision ultimately hinges on the CPI data ... since a majority of PCE components are derived from CPI,\" Nomura economists said in a note. \"Currently, we maintain our Fed call of no rate hike at the September FOMC meeting. However, if August CPI data, especially PCE-relevant components, surprises to the upside, that would significantly increase the likelihood of policy firming next week.\"\nFollowing Thursday's PPI release, traders raised the odds for a quarter percentage point increase to more than 73%, according to the CME Group's FedWatch gauge of futures prices.\nHowever, expectations have been volatile and highly dependent on data as well as fluctuating energy prices, making the stakes for Friday's release even higher. Fed Chair Kevin Warsh has indicated a reliance on market indicators for direction on monetary policy.\n\"The September Fed decision looked finely balanced at the turn of the month. September's surge in energy prices will likely tip the balance towards a hike when the Fed meets next week,\" said Bill Adams, chief U.S. economist at Fifth Third Commercial Bank. \"A big surprise from the August CPI report's release tomorrow or a last-minute deal with Iran could still influence the decision.\"",
    "bodyJa": "金曜日朝に発表される報告書は、来週金利を決定する前にFRBが得るインフレパズルの最後のピースとなる。\n労働統計局は午前8時30分に8月の消費者物価指数を発表する。\nダウ・ジョーンズのコンセンサスが正しければ、報告書は、測定されたすべての商品とサービスのコストが先月0.4%上昇し、年間インフレ率が3.4%になることを示すことになる。ただし、食品とエネルギー価格を除くと、コアインフレ率の見通しはそれぞれ0.2％と2.4％となる。\n木曜日の生産者物価指数（卸売インフレの指標）データと組み合わせると、CPIはFRB当局者に主要なインフレ指標である個人消費支出価格指数が9月末に発表されるときに何を示すかを伝えるのに役立つだろう。\nこの情報はまた、来週水曜日の連邦公開市場委員会の金利決定に大きく反映されると予想されており、どちらにしてもパーセントポイントが据え置きと利上げの違いを意味する可能性がある。\n野村のエコノミストらはノートで「９月のＦＯＭＣの決定は最終的にはＣＰＩデータに左右される。ＰＣＥ構成要素の大部分はＣＰＩから得られるためだ」と述べた。 「現時点で、われわれは９月のＦＯＭＣ会合では利上げは行わないとのＦＲＢの主張を維持する。しかし、８月のＣＰＩ統計、特にＰＣＥ関連の構成要素が予想外の上値を示せば、来週政策が決定される可能性が大幅に高まるだろう。」\nＣＭＥグループのフェドウォッチの先物価格ゲージによると、木曜日のＰＰＩ発表を受けて、トレーダーらは４分の１ポイント上昇の確率を７３％以上に引き上げた。\nしかし、期待は不安定で、データや変動するエネルギー価格に大きく依存しており、金曜日の発表に対する賭けはさらに高まっている。 FRBのケビン・ウォーシュ議長は、金融政策の方向性について市場指標に依存しているとの考えを示した。\nフィフス・サード・コマーシャル・バンクの首席米国エコノミスト、ビル・アダムズ氏は「９月のＦＲＢの決定は、月の変わり目時点では非常にバランスが取れているように見えた。９月のエネルギー価格の高騰により、来週のＦＯＭＣ時にはバランスが利上げ方向に傾く可能性が高い」と述べた。 「明日発表される８月のＣＰＩ報告による大きなサプライズや、イランとの土壇場での合意が依然として決定に影響を与える可能性がある。」",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Between taking SpaceX public in the largest IPO on record and rolling out a fleet of driverless Tesla Cybercabs in Austin, Texas, Elon Musk has also been digging tunnels. His tunneling venture, The Boring Co. announced late Wednesday that it's now valued at $23 billion.\nCreated inside SpaceX in 2017 and spun out a year later, The Boring Co. says its aim is to \"revolutionize transportation\" by creating underground loops with stations where passengers can board and exit.\nWhile Boring Co. has announced about a dozen city projects, its only loop for public use today is in Las Vegas, where passengers can travel in Tesla vehicles between the downtown convention center and various casino resorts via its Las Vegas Convention Center (LVCC) Loop.\nIn July of last year, Boring Co. also reached a deal to build 20 miles of tunnels in Nashville, Tennessee, a project dubbed the Music City Loop, to carry paying passengers between downtown and the airport in Tesla vehicles.\nThe fast-tracked project sparked a partisan feud, and a survey by Vanderbilt University in March found that most Nashville residents didn't want the tunnels in their city. A month before the survey, the company broke ground in Nashville, and it shared clips this week showing its Prufrock machines digging into the city's limestone geology.\nWith the latest financing, Boring Co. has reeled in an additional $3 billion in a round led by the United Arab Emirates, where the company plans to build over 150 kilometers (93 miles) of tunnels, including a project announced in February of last year, the Dubai Loop.\nTo finance the costly endeavors, Musk has turned to many of the same investors that previously backed Tesla, SpaceX, and his buyout of Twitter in 2022. Those investors include Valor Equity Partners, Sequoia Capital, Andreessen Horowitz, Singapore's Temasek and Baron Capital.\nAs with his other companies, where Musk's grand promises have sometimes failed to materialize, many of Boring Co.'s plans have fizzled. In 2018, the company abandoned tunnel projects it had pursued in Los Angeles, with others in Chicago and the Washington, D.C. area never coming to fruition.\nEarlier this year, Boring Co. ran a contest, the Tunnel Vision Challenge, promising winners a \"free\" one-mile tunnel. The Baltimore Ravens, who had entered the challenge and won, turned down Musk's offer after initial meetings with the company.\nSome communities are hesitant to work with Musk's company due to its safety and environmental track record. In Las Vegas, Boring Co. racked up hundreds of environmental violations, ProPublica reported, with additional workplace safety and environmental violations in its home state of Texas.\nBoring Co. didn't respond to a request for comment.\nThe company sees plenty of opportunities for growth, including expansion plans underway in Las Vegas.\n\"Over the past two years, The Boring Company has grown from a single operating Loop system to a multi-city tunneling program, pairing faster machine design with the first hard-rock project, the first international construction contract, and a substantial expansion of Vegas Loop,\" the company wrote in its post on Wednesday about fundraising.\nFollowing the announcement, Musk posted on X, \"Congrats Boring Company team!\"\nIn June, the company won approval from the Nevada System of Higher Education to build a station at the University of Nevada Las Vegas campus, and it's working to extend the reach of its Vegas Loop to the airport and to Allegiant Stadium, where the NFL's Raiders play.\nThe Boring Co.'s growing ambitions are a potential boon for Tesla. The companies have worked together for years, with Tesla paying Boring Co. about $1 million in 2025 to dig a \"Cybertunnel\" under its Austin Gigafactory, connecting a Cybertruck assembly line to a lot for loading the vehicles. Tesla vehicles are used to shuttle passengers between Boring Co.'s stations.\nWATCH: Elon Musk at G20",

    "summaryJa": "ノースカロライナ州コンコード – レイチェル・ワゴナーさんは、ノースカロライナ州コンコードについて、3 人の子供を育てる場所として常に思い描いていたような場所であると説明しています。安全で、良い学校があり、活気のあるダウンタウンと、他の家族でいっぱいの近所です。しかし最近では、その牧歌的な生活を手に入れるのが難しくなってきています。ワゴナーさんは夫が外で働いている間、夫との間にできた3人の子供たちと家にいるが、食料品やガソリン代の高騰で家計が圧迫され、ここ1年は有給の仕事に戻ることを検討してきた。",
    "bodyOriginal": "CONCORD, N.C. – Rachel Wagoner describes Concord, North Carolina, as the kind of place where she always envisioned raising her three children: safe, with good schools, a lively downtown and neighborhoods filled with other families.\nBut lately, that idyllic life has become harder to afford. Wagoner stays home with the three children she has with her husband while he works outside the home, but rising grocery and gasoline costs have squeezed the family's budget enough that she has spent the past year considering going back to a paid job.\n\"It gets harder and harder to make ends meet,\" Wagoner told CNBC. Things her family once considered routine \"have now become a luxury, like eating out and coming and shopping downtown.\"\nThe cost-of-living squeeze has become a defining issue in North Carolina's pivotal open Senate race to replace retiring Republican Sen. Thom Tillis, as well as in numerous other contests that will determine control of the chamber.\nMeanwhile, Concord keeps growing. Across Cabarrus County, just northeast of Charlotte, subdivisions are spreading, major employers are expanding and billions of dollars in investment are pouring in, including from Eli Lilly. Unemployment is low and poverty is below the national rate.\nEssentially, the county is prospering by most measures. Yet talk to many residents, and that prosperity feels out of reach.\n\"Everything feels big,\" said Nichole Mattes, a mother in nearby Kannapolis who said rent, gasoline and groceries have left her living paycheck to paycheck. \"You can't be a single-income household right now. ... It feels impossible.\"\nSenate candidate and former two-term Democratic Gov. Roy Cooper has spent months campaigning under the slogan \"Make Stuff Cost Less.\"\n\"From the grocery store to the gas station, working families here in Concord and around the state are hurting as prices skyrocket,\" Cooper said at a Sept. 2 event.\nHis opponent, Republican Michael Whatley, is trying to flip the script by arguing that Democrats like Cooper helped create today's affordability headaches.\nThe former Republican National Committee chair and a close ally of President Donald Trump has pointed to increases in energy, healthcare and housing costs during Cooper's tenure and attacked his opposition to Republican tax cuts.\n\"If Candidate Cooper wants to 'make stuff cost less,' he oughta look in the mirror,\" Whatley campaign spokesman DJ Griffin said in a statement to CNBC.\nIt's up to voters to choose who to blame, said Michael Bitzer, a political scientist at Catawba College in Salisbury, North Carolina.\n\"Both candidates know people are dissatisfied and feeling the squeeze,\" Bitzer told CNBC. \"Cooper wants voters focused on what they are paying now. Whatley wants them to trace those costs through Cooper's tenure in Raleigh and the inflation of the Biden years.\"\nCabarrus as a measuring stick\nCabarrus County and its Charlotte suburbs provide a prime test case to see which explanation breaks through, said Christopher Cooper, a political scientist at Western Carolina University who is not related to Roy Cooper.\nIt remains Republican territory, but by considerably smaller margins than a decade ago. Trump won Cabarrus by nearly 20 percentage points in 2016, but his margin fell to 9.5 points in 2020 and 7.6 points in 2024.\nPart of that shift has come as Charlotte's growth has pushed farther outward, bringing more Democratic-leaning voting patterns into once-rural and exurban communities, Christopher Cooper told CNBC.\n\"You see an influx of people coming from Charlotte,\" Willie Brown, who has lived in the area for six years, told CNBC. \"You saw all the new apartment complexes building up right here.\"\nThe political shift is not unique to the Cabarrus suburbs. In battleground Georgia, for instance, Republican presidential nominee Mitt Romney won Georgia's suburban Cobb County by more than 12 percentage points in 2012. Twelve years later, former Vice President and Democratic presidential nominee Kamala Harris carried it by nearly 15 points.\nBut growth has put more pressure on household budgets.\nIn Cabarrus, the median household earns about $89,000 a year, according to the U.S. Census Bureau. The Massachusetts Institute of Technology's Living Wage Calculator estimates that two working parents with two children would need $113,966 in combined annual income before taxes to cover basic expenses there — roughly $25,000 more than the countywide median household income.\nFor Wagoner, closing that financial gap could mean finding a second paycheck. But returning to work would also mean giving up some of what she values most about staying home while potentially bringing new costs of its own.\n\"It would really hurt our children too,\" she said.\nMIT estimates child care costs around $22,466 a year for a Cabarrus household with two working adults and two children.\nA national issue, a North Carolina test\nSo far, Cooper's message has seemed to have the most breakthrough.\nHe's held a consistent polling advantage throughout the race, though at least one poll shows the race tightening. High Point University had him leading Whatley 50% to 42% among likely voters in April. By August, the gap had narrowed to 50% to 45%.\nThe April survey was conducted March 26-April 6 and included a sample of 703 likely voters. The August survey was conducted Aug. 3-Aug. 12 and included a sample of 660 likely voters. Because both were online surveys rather than randomized polls, High Point did not include a margin of error.\nThat narrowing comes as Whatley becomes better known. An Elon University poll conducted in late July found 53% of registered voters had heard at least \"some\" about him, up from 35% in a March Elon poll. The corresponding figure for Cooper was 84%.\nThe July survey was conducted July 23-July 31 and included a final sample of 800 North Carolina adults. The March survey was conducted March 13-March 20 and also included 800 adults. Both were conducted online by YouGov; the margin of error for registered voters was plus or minus about 4.4 percentage points in each poll.\nStill, Bitzer said Cooper remains well-positioned, buoyed by a personal brand built over decades in North Carolina politics and two gubernatorial wins while Trump carried the state.\n\"Cooper has an authenticity with rural voters that many Democrats struggle to match,\" Bitzer said. \"It doesn't come across as patronizing.\"\nThat could come in handy in Republican-leaning areas like Cabarrus, where Democrats do not necessarily need to win to improve their statewide position.\n\"Cooper just needs to keep Cabarrus close, and that would be a good sign.\" Christopher Cooper said. \"He's had success in the past limiting Democratic losses outside the state's major population centers.\"\nBut those margins are ultimately made up of voters like Wagoner. She describes herself as an independent and told CNBC she has not settled on a Senate candidate. Asked whether affordability would influence her vote, Wagoner did not hesitate.\n\"Oh, of course,\" she said.\nMattes, meanwhile, is still learning about the candidates. Brown also said he plans to vote but has not settled on a candidate, telling CNBC that healthcare and the cost of living are among the issues that matter most.\n\"Concord is a great place to live,\" he said. \"But... hopefully we can afford it.\"",
    "bodyJa": "ノースカロライナ州コンコード – レイチェル・ワゴナーさんは、ノースカロライナ州コンコードについて、3 人の子供を育てる場所として常に思い描いていたような場所であると説明しています。安全で、良い学校があり、活気のあるダウンタウンと、他の家族でいっぱいの近所です。\nしかし最近では、その牧歌的な生活を手に入れるのが難しくなってきています。ワゴナーさんは夫が外で働いている間、夫との間にできた3人の子供たちと家にいるが、食料品やガソリン代の高騰で家計が圧迫され、ここ1年は有給の仕事に戻ることを検討してきた。\n「家計をやりくりするのがますます難しくなっている」とワゴナーさんはCNBCに語った。彼女の家族が以前は日常的だと思っていたことは、「今ではダウンタウンに外食したり、ダウンタウンに来て買い物をしたりするなど、贅沢になっています。」\n生活費の圧迫は、引退する共和党上院議員トム・ティリス氏の後任を巡るノースカロライナ州の極めて重要な上院公開選挙戦や、下院の主導権を握る他の多くの選挙戦において決定的な問題となっている。\nその間、コンコードは成長を続けています。シャーロットのすぐ北東にあるカバラス郡全体では、分譲地が広がり、大手雇用主が拡大し、イーライリリーなどから数十億ドルの投資が流入している。失業率は低く、貧困率は全国水準を下回っています。\n基本的に、この郡はほとんどの点で繁栄している。しかし、多くの住民と話をすると、その繁栄は手の届かないところにあると感じています。\nカナポリス近郊に住む母親、ニコール・マッツさんは「何もかもが大きく感じられる」と語った。家賃、ガソリン代、食料品で生活費が足りなくなったという。 「今は片働き世帯にはなれない。……それは不可能だと思うよ。」\n上院候補で元民主党知事を２期務めたロイ・クーパー氏は、「物品のコストを削減する」というスローガンのもと、数カ月かけて選挙活動を行ってきた。\nクーパー氏は9月2日のイベントで、「食料品店からガソリンスタンドに至るまで、ここコンコードや州内の勤労者世帯は物価の高騰で打撃を受けている」と述べた。\n反対派の共和党員マイケル・ワットリー氏は、クーパー氏のような民主党員が今日の手頃な価格の悩みを生み出したと主張して、筋書きをひっくり返そうとしている。\n元共和党全国委員会委員長でドナルド・トランプ大統領の親しい盟友である同氏は、クーパー氏の在任期間中のエネルギー、医療、住宅費の増加を指摘し、共和党減税への同氏の反対を攻撃した。\nワットリー陣営のスポークスマン、DJ・グリフィン氏はCNBCへの声明で、「クーパー候補が『物品のコストを安くしたい』と望むなら、鏡を見るべきだ」と述べた。\nノースカロライナ州ソールズベリーのカトーバ大学の政治学者マイケル・ビッツァー氏は、誰を非難するかは有権者次第だと述べた。\nビッツァー氏はＣＮＢＣに対し、「両候補とも国民が不満を持ち、圧迫感を感じていることを承知している」と語った。 「クーパー氏は、有権者が今支払っている金額に注目してほしいと考えている。ワットリー氏は、ローリーでのクーパー氏の在職期間とバイデン時代のインフレを通じて、そのコストを追跡してもらいたいと考えている。」\n物差しとしてのカバラス\nロイ・クーパーとは無関係であるウェスタンカロライナ大学の政治学者クリストファー・クーパー氏は、カバラス郡とそのシャーロット郊外は、どの説明が突破されるかを見極める主要なテストケースとなると述べた。\n同州は依然として共和党の領土だが、その差は10年前に比べてかなり縮小している。トランプ氏は2016年にカバラス氏に20ポイント近くの差をつけて勝利したが、その差は2020年には9.5ポイント、2024年には7.6ポイントに低下した。\nクリストファー・クーパー氏はCNBCに対し、シャーロットの成長がさらに外側に押し出し、かつては田舎や郊外だったコミュニティに民主党寄りの投票パターンが持ち込まれたことで、その変化の一部が生じたと語った。\n「シャーロットから人が流入しているようだ」とこの地域に6年間住んでいるウィリー・ブラウンさんはCNBCに語った。 「ここに新しい集合住宅が建っているのを見ましたね。」\n政治的変化はカバラス郊外に限ったことではない。例えば激戦区ジョージア州では、2012年に共和党大統領候補のミット・ロムニー氏がジョージア州郊外のコブ郡で12ポイント以上の差をつけて勝利した。その12年後、元副大統領で民主党大統領候補のカマラ・ハリス氏が15ポイント近くの差をつけて勝利した。\nしかし、経済成長は家計への圧力をさらに高めている。\n米国国勢調査局によると、カバラスでは世帯の平均年収が約8万9000ドルだという。マサチューセッツ工科大学の生活賃金計算ツールによると、共働きで子供 2 人がいる場合、基礎的な支出をまかなうには税引き前年収合計で 113,966 ドルが必要になると試算されており、これは郡全体の世帯収入の中央値より約 25,000 ドル多いことになります。\nワゴナーにとって、その経済的ギャップを埋めることは、2番目の給料を見つけることを意味する可能性があります。しかし、仕事に戻るということは、彼女が家にいることで最も大切にしていることの一部を放棄することを意味すると同時に、新たなコストが発生する可能性もある。\n「それは私たちの子供たちにも本当に傷つくでしょう」と彼女は言いました。\nMIT は、働く大人 2 名と子供 2 名がいるカバラスの世帯の育児費用を年間約 22,466 ドルと見積もっています。\n全国的な問題、ノースカロライナ州のテスト\nこれまでのところ、クーパー氏のメッセージは最も画期的なものであるように思われる。\n彼はレースを通して一貫して支持率で有利を保ってきたが、少なくとも1つの世論調査ではレースが緊迫していることが示されている。ハイポイント大学では、4月の有権者候補の中で同氏がワットリー氏を50％対42％リードしていた。 8月までにその差は50％対45％に縮まった。\n4月の調査は3月26日から4月6日にかけて実施され、有権者となる可能性の高い703人のサンプルが含まれていた。 8月の調査は8月3日～8月に実施された。 12 には、有権者と思われる 660 人のサンプルが含まれていました。どちらもランダム化された世論調査ではなくオンライン調査であったため、High Point には誤差の範囲は含まれていませんでした。\nワットリーの知名度が高まるにつれ、その幅は狭まっていきます。 7月下旬に実施されたイーロン大学の世論調査では、登録有権者の53％が彼について少なくとも「ある程度」聞いたことがあることが判明し、3月のイーロン大学の世論調査の35％から増加した。クーパーの対応する数字は 84% でした。\n7月の調査は7月23日から7月31日まで実施され、ノースカロライナ州成人800人の最終サンプルが含まれた。 3月の調査は3月13日から3月20日にかけて実施され、成人800人も対象となった。どちらも YouGov によってオンラインで実施されました。登録有権者の誤差の範囲は、各世論調査でプラスマイナス約 4.4 パーセント ポイントでした。\nそれでもビッツァー氏は、クーパー氏はノースカロライナ州政治で数十年かけて築いた個人ブランドと、トランプ氏が州を担いながら知事選で２度勝利したことによって、依然として有利な立場にあると述べた。\nビッツァー氏は、「クーパー氏は地方の有権者に信頼感を持っており、多くの民主党議員がそれに匹敵するのに苦労している」と述べた。 「それは恩着せがましいとは思えません。」\nこれは、州全体の地位を向上させるために民主党が必ずしも勝利する必要がないカバラスのような共和党寄りの地域では役立つ可能性がある。\n「クーパーはカバラスを近づけるだけでいいし、それは良い兆候だろう。」クリストファー・クーパーは語った。 「彼は過去に州の主要な人口密集地以外で民主党の損失を抑えることに成功してきた。」\nしかし、その差は最終的にはワゴナーのような有権者によって占められる。彼女は自身を無所属だと述べ、上院候補者はまだ決まっていないとCNBCに語った。手頃な価格が投票に影響を与えるかとの質問に、ワゴナー氏は躊躇しなかった。\n「ああ、もちろん」と彼女は言った。\n一方、マテス氏はまだ候補者について勉強中だ。ブラウン氏はまた、投票するつもりだが候補者は決まっていないとし、医療と生活費が最も重要な問題の一つであるとCNBCに語った。\n「コンコードは住むには素晴らしい場所です」と彼は言った。 「しかし...うまくいけば、私たちはそれを買う余裕があります。」",

    "title": "Oil, gas and borrowing costs surge as fears over Middle East escalate",

    "summaryJa": "中東への懸念が高まる中、石油、ガス、借入コストが高騰- 公開されました",
    "bodyOriginal": "Oil, gas and borrowing costs surge as fears over Middle East escalate\n- Published\nThe price of oil has jumped to $105 a barrel amid signs the conflict in the Middle East will not be resolved quickly, fuelling fears that inflation could accelerate.\nWith the conflict between the US and Iran in the Gulf intensifying in recent days, the cost of both crude oil and gas has been rising sharply. Brent crude went back above $100 a barrel on Wednesday and has continued to climb.\nThe war has led to the effective closure of the Strait of Hormuz, preventing supplies of oil and gas from the Gulf from reaching global markets.\nConcerns have also grown after Iran-aligned Houthi forces were reported to have seized Yemen's port of Mocha, a key Red Sea port.\nThe move could elevate fears of further shipping disruptions.\nWorries over higher inflation have in turn helped to push bond yields in the UK to their highest level in decades.\nSpeaking at a Republican Party convention in Texas on Wednesday, President Trump said he did not think the fighting would end until after the US mid-term elections in November.\nThe price of natural gas has also been soaring on wholesale markets. In the UK, it rose above 200p a therm for the first time since the end of 2022.\nStorage levels in Europe are much lower than normal for the time of year, and the need to fill reserves ahead of the winter has helped to push up prices.\nUK consumers are protected from short term spikes on the wholesale gas markets by Ofgem's price cap. But if prices remain high for an extended period, households still face steeper bills.\nThe cap is already due to increase by 3.6% at the start of October, with the next change after that coming in January.\nThe increase in energy costs has in turn raised fears of a spike in inflation, and this has also pushed up yields on government bonds around the world.\nIn the UK, yields on 10-year bonds were at their highest since 2007 today, while those on 20- and 30-year bonds were at levels not seen since 1998.\nThis implies a higher cost of borrowing for the government, at a time when public finances are under pressure.\nBut it could also have a direct impact on households as well, as it affects the rates paid by consumers for some financial products, such as fixed-rate mortgages.\nRelated topics\n- Published36 minutes ago",
    "bodyJa": "中東への懸念が高まる中、石油、ガス、借入コストが高騰\n- 公開されました\n中東紛争がすぐには解決しない兆候を背景に原油価格が１バレル＝１０５ドルに急騰し、インフレが加速するのではないかとの懸念が高まっている。\nここ数日、湾岸地域における米国とイランの紛争が激化しており、原油とガスの価格が高騰している。ブレント原油は水曜日に1バレル＝100ドルを超え、上昇を続けている。\nこの戦争によりホルムズ海峡は事実上閉鎖され、湾岸からの石油とガスの供給が世界市場に届かなくなった。\nイランと同盟を組むフーシ派部隊がイエメンの紅海の重要港であるモカ港を占領したと報じられたことを受けて、懸念も高まっている。\nこの動きにより、輸送にさらなる混乱が生じるのではないかとの懸念が高まる可能性がある。\nインフレ高進への懸念が英国の債券利回りをここ数十年で最高水準に押し上げた。\nトランプ大統領は水曜日、テキサス州で開かれた共和党大会で演説し、11月の米中間選挙が終わるまで戦闘が終わるとは思わないと述べた。\n卸売市場でも天然ガス価格が高騰している。英国では２０２２年末以来初めて１サーム当たり２００ペンスを超えた。\nヨーロッパの貯蔵レベルは例年よりもはるかに低く、冬を前に埋蔵量を埋める必要性が価格を押し上げる一因となっている。\n英国の消費者は、Ofgem の価格上限により、ガス卸売市場の短期的な高騰から保護されています。しかし、物価が長期間にわたって高止まりすれば、家計は依然として高額な請求に直面することになる。\n上限はすでに10月初めに3.6％引き上げられる予定で、その後の次の変更は1月になる。\nエネルギーコストの上昇によりインフレ急増の懸念が高まり、これにより世界中の国債利回りも上昇している。\n英国では今日、10年債の利回りが2007年以来の最高水準となった一方、20年債と30年債の利回りは1998年以来の水準となった。\nこれは、財政が圧迫されている現在、政府の借入コストが上昇していることを意味している。\nしかし、固定金利住宅ローンなど一部の金融商品に対して消費者が支払う金利にも影響するため、家計にも直接影響を与える可能性がある。\n関連トピック\n- 36 分前に公開",

    "id": "humans-need-to-surf-the-wave-of-ai-rathe-dd548a39",
    "title": "Humans need to 'surf the wave' of AI rather than get swallowed by it, Chesky says at Communacopia",
    "titleJa": "人間はAIに飲み込まれるのではなく、AIの「波に乗る」必要があるとチェスキー氏がコミュナコピアで語る",
    "summaryJa": "Nvidia CEO のジェンセン・フアン氏、Uber CEO のダラ・コスロシャヒ氏、SpaceX CFO のブレット・ジョンセン氏が、ゴールドマン・サックス・コミュナコピア + テクノロジー・カンファレンスで講演する予定です。",
    "bodyOriginal": "The Goldman Sachs Communacopia + Technology Conference continued on Thursday with Nvidia CEO Jensen Huang, Uber CEO Dara Khosrowshahi, and SpaceX CFO Bret Johnsen among the notable names set to take the stage.\nArtificial intelligence has been a big topic of discussion so far at the annual meeting of top executives, which started Tuesday.\nAirBnb CEO Brian Chesky said the technology wasn't \"inherently good or bad\" in an interview with CNBC's David Faber that aired Thursday. He said the technology's potential is in human hands.\n\"I'm not confident I'm right. I'm not confident that it's going to be positive, but I think it can be. It's like nuclear power; it can either light up a city or destroy a city,\" Chesky said.\nHe added that his AI theory is of a \"cognitive revolution\" that helps humans get smarter along with the technology.\n\"We need to remind people of how valuable they will be to society, and that AI is a wave, and we can surf the wave rather than get swallowed underneath the water,\" he said.",
    "bodyJa": "ゴールドマン・サックス・コミュナコピア＋テクノロジー・カンファレンスは木曜日も引き続き開催され、Nvidia CEOのジェンセン・ファン氏、UberのCEOであるDara Khosrowshahi氏、SpaceXのCFOであるBret Johnsen氏といった著名な人物が登壇予定だった。\n人工知能は、火曜日に始まった年次経営幹部会議でこれまでのところ大きな話題となっている。\nAirBnbの最高経営責任者（CEO）ブライアン・チェスキー氏は、木曜日に放映されたCNBCのデイビッド・フェイバー氏とのインタビューで、この技術は「本質的に良いも悪いも無い」と語った。同氏は、このテクノロジーの可能性は人間の手中にあると述べた。\n「自分が正しいかどうかは自信がない。プラスになるかどうかは自信はないが、プラスになる可能性はあると思う。これは原子力発電のようなもので、都市を照らすこともできるし、破壊することもできる」とチェスキー氏は語った。\n同氏は、自身のAI理論はテクノロジーとともに人間の賢さの向上を助ける「認知革命」であると付け加えた。\n「私たちは人々に、自分たちが社会にとってどれほど価値があるのか​​、そしてAIは波であり、私たちは水に飲み込まれるのではなく波に乗ることができるということを思い出させる必要がある」と述べた。",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/09/10/goldman-sachs-communacopia-technology-conference-ai-tech.html",
    "publishedAt": "2026-09-10T15:46:35+00:00",

  {
    "id": "kimmel-says-interview-with-senate-candid-289c8878",
    "title": "Kimmel says interview with Senate candidate Talarico won't air on ABC amid FCC threats",
    "titleJa": "キンメル氏、FCCの脅しの中、上院候補タラリコ氏のインタビューはABCでは放送されないと語る",
    "summaryJa": "ディズニー傘下のABC社で深夜トーク番組の司会を務めるジミー・キンメル氏は、連邦通信委員会の精査に備えていくつかの予防措置を講じている。キンメル氏は水曜夜、民主党上院議員候補ジェームズ・タラリコ氏のインタビューを国営テレビで放送しないと発表した。インタビューは代わりに木曜日に YouTube で放送されます。",
    "bodyOriginal": "Jimmy Kimmel, the late-night talk show host with Disney-owned ABC, is taking some precautions in the face of scrutiny by the Federal Communications Commission.\nKimmel said on Wednesday night that he will not air an interview with Democratic U.S. Senate candidate James Talarico on national television. The interview will air on YouTube on Thursday instead.\n\"For some reason, and I can't seem to figure out what that reason is, something has changed,\" Kimmel said during his Wednesday night broadcast. \"Now that [Trump] is president, his FCC has threatened me, threatened our show, threatened our network, ABC, our affiliates, our local stations, based on simple, traditional editorial decisions.\"\nHe added that the decision not to broadcast the interview on TV is \"out of consideration\" for ABC affiliates who he said would have to \"deal with this nonsense\" of FCC scrutiny.\n\"In the America we live in right now, that is the best we can do, until November, of course,\" Kimmel said.\nThe FCC did not immediately respond to a request for comment.\nTalarico, a Texas state representative, is locked in a tight Senate race against Texas Attorney General Ken Paxton, who's gotten an endorsement from President Donald Trump. Public polling has shown Talarico slightly ahead of Paxton, a controversial figure in Texas who was impeached by the state House of Representatives over allegations of corruption. He was acquitted by the state Senate.\nIn January, the FCC called into question whether TV talk shows are \"bona fide\" news programs and are therefore exempt from equal airtime rules for political candidates. \"The View,\" another ABC program, has faced similar scrutiny from the FCC.\nKimmel said Wednesday that he has been interviewing political candidates, including Trump himself, for years.\nKimmel's show has become a lightning rod for debates around broadcasting rights, First Amendment protections and government intervention.\nLast year, ABC-affiliate station owners opted not to air \"Jimmy Kimmel Live!\" after comments he made during a monologue following the killing of Charlie Kirk. ABC suspended the show for roughly a week, and Kimmel later said, \"It was never my intention to make light of the murder of a young man.\"\nBut ABC has faced continued pressure from the Trump administration since.\nIn April, the FCC launched an early renewal process for ABC-owned stations, citing an investigation into the company's diversity, equity and inclusion practices.\nABC filed the license renewals, but in August it sued the agency over First Amendment concerns, calling its investigation into the company a \"retaliatory campaign.\"\n— CNBC's Garrett Downs contributed to this report.",
    "bodyJa": "ディズニー傘下のABC社で深夜トーク番組の司会を務めるジミー・キンメル氏は、連邦通信委員会の精査に備えていくつかの予防措置を講じている。\nキンメル氏は水曜夜、民主党上院議員候補ジェームズ・タラリコ氏のインタビューを国営テレビで放送しないと発表した。インタビューは代わりに木曜日に YouTube で放送されます。\nキンメル氏は水曜夜の放送で、「どういうわけか、その理由は分からないが、何かが変わった」と語った。 「（トランプ氏が）大統領になった今、彼のFCCは、単純で伝統的な編集上の決定に基づいて、私を脅迫し、私たちの番組を脅し、私たちのネットワーク、ABC、系列局、地方局を脅迫しました。」\n同氏は、インタビューをテレビで放送しないという決定は、FCCの精査という「このナンセンスな行為」に対処しなければならないであろうABC系列局への「考慮外」であるとも付け加えた。\n「私たちが現在住んでいるアメリカでは、それが11月まではできる最善のことだ」とキンメル氏は語った。\nFCCはコメント要請に応じなかった。\nテキサス州下院議員タラリコ氏は、上院でドナルド・トランプ大統領の支持を得ているテキサス州司法長官ケン・パクストン氏との接戦に巻き込まれている。世論調査によると、汚職容疑で州下院で弾劾されたテキサス州の物議を醸す人物であるパクストン氏をタラリコ氏がわずかに上回っている。彼は州上院によって無罪となった。\nFCCは1月、テレビのトーク番組が「正真正銘の」ニュース番組であり、したがって政治的候補者に対する放送時間の均等規定から免除されているのかどうか疑問を呈した。別のABC番組「ザ・ビュー」もFCCから同様の監視にさらされている。\nキンメル氏は水曜日、トランプ氏自身を含む政治候補者に何年もインタビューしてきたと語った。\nキンメルの番組は、放送権、憲法修正第 1 条の保護、政府の介入をめぐる議論の避雷針となった。\n昨年、ABC系列局のオーナーらは「ジミー・キンメル・ライブ!」を放送しないことを選択した。チャーリー・カーク殺害後の独白中に彼が述べたコメントの後。 ABCは番組を約1週間中断したが、キンメル氏は後に「若者の殺害を軽視するつもりはなかった」と語った。\nしかしABCはそれ以来、トランプ政権からの圧力にさらされ続けている。\nFCCは4月、同社の多様性、公平性、包括性の実践に関する調査を理由に、ABC所有の放送局の早期更新プロセスを開始した。\nABCはライセンス更新を申請したが、8月に合衆国憲法修正第1条への懸念を理由に同社に対する調査を「報復キャンペーン」であるとして訴訟を起こした。\n— CNBC のギャレット・ダウンズがこのレポートに寄稿しました。",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/09/10/abc-kimmel-talarico-fcc.html",
    "publishedAt": "2026-09-10T15:45:09+00:00",
    "category": "テクノロジー",
    "imageUrl": "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&q=80",
