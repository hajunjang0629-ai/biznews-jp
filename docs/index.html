    "summaryJa": "Scott Bessent told CNBC that several government agencies \"were in favour of putting Megaspeed on the entity list for months\".",
    "bodyOriginal": "Pressure grows on Trump's Commerce Secretary Lutnick in fallout from Nvidia scandal\n- Published\nUS Treasury Secretary Scott Bessent has blamed the Commerce Department, run by Howard Lutnick, for failing to properly oversee the export of high-spec Nvidia chips, as the fallout from the scandal widens.\nThere is growing pressure on Lutnick across the political spectrum to explain his department's actions.\nJensen Huang was ousted as Nvidia CEO after revelations he had an affair with a businesswoman who was also allegedly a Chinese spy.\nMegaspeed, the firm she worked for, had been probed by US government agencies over suspicions it had been smuggling Nvidia chips into China, reports said, but is not on a list of firms that US companies are prevented from working with.\nBessent told CNBC several agencies \"were in favour of putting Megaspeed on the entity list for months\".\n\"But Commerce has the pen... and you will have to ask them about their internal process,\" he added.\nBessent's comments come after Lutnick was called to testify before the Senate Banking Committee next month over the Commerce Department's role in allowing Nvidia to export its advanced chips.\nOther congressional committees have asked both Lutnick and his department to retain all records relating to Nvidia and Huang.\nBessent said he was \"frustrated\" by delays in putting the company on the export control list and reports of leakage of AI chips into China.\n\"President Trump made it very clear that China should not receive any Nvidia chips above H100s, so any leakage is very frustrating because it hurts our great companies in the AI race, because it gives the Chinese an advantage,\" he said.\nLast year, the Commerce Department had been investigating Megaspeed over suspicions it had been smuggling some of Nvidia's advanced AI chips into China, according to the New York Times. Megaspeed has been contacted for comment.\nThere was also pressure on the Commerce Department to add it to the list, but separate reporting in the Financial Times said the department was delaying efforts to have the cloud computing firm included.\nHowever, Bessent also pointed the finger at Nvidia.\n\"The story has been thus far of Jensen Huang's personal foibles,\" he told CNBC's Squawk Box programme, external.\n\"The real story here should be: Did Nvidia know their client, and was there a robust effort at Nvidia to make sure that there was no leakage and that they were selling to what were obviously pass-through shell companies?\n\"It's important that anyone at the company there be held accountable for that.\"\nHow a sex scandal at Nvidia is putting pressure on the White House\n- Published7 hours ago\nHow AI visionary Jensen Huang was undone by his own bad decisions\n- Published1 day ago\nHuang has been summoned to testify before the Senate Banking Committee about his affair with the former Megaspeed executive, who is suspected of being a Chinese spy.\nThe Commerce Secretary has also been summoned to appear before the committee in December.\n\"Recent reports raise serious concerns about our national security and the protection of sensitive US technology,\" committee chairman, Republican Senator Tim Scott posted on X.\nDemocrats on key congressional committees have asked the Commerce Department and Lutnick to keep all records relating to decisions to allow Nvidia to sell its advanced AI chips to Chinese companies, including all their communications with or about Nvidia and Jensen Huang.\nWays and Means Committee Ranking Member Richard E. Neal and Senate Finance Committee Ranking Member Ron Wyden are starting investigations into the way Nvidia was allowed to sell these chips.\nAccording to Neal and Wyden, Nvidia's advanced H200 chips could be sold to Chinese firms if they were first imported from their manufacturing facility in Taiwan into America for inspection.\nA 25% tariff - a levy that is paid to the federal government - was imposed on those chips, under a section of the Trade Act that Neal and Wyden say is meant to allow the US president to take action against imports that risk national security.\n\"Trump's use of the statute appears to have done the opposite, undermining US national security and putting Americans at risk,\" they said.",

    "id": "how-a-sex-scandal-at-nvidia-is-putting-p-2c3c8833",
    "title": "How a sex scandal at Nvidia is putting pressure on the White House",
    "titleJa": "How a sex scandal at Nvidia is putting pressure on the White House",
    "summaryJa": "Jensen Huang's personal life may have triggered the crisis, but the questions now reach into the White House itself.",
    "bodyOriginal": "How a sex scandal at Nvidia is putting pressure on the White House\n- Published\nHow close is Donald Trump to Jensen Huang?\nThe answer is very.\nThe Nvidia boss was one of the few business leaders with direct access to the US president. He had met Trump repeatedly, travelled with him to Britain and, in May, joined him on Air Force One for his trip to China.\nJensen Huang wasn't just another tech billionaire seeking the president's ear. He had become an important voice in one of the biggest arguments inside the administration: how much of America's most advanced technology should be allowed to reach China.\nNvidia makes the chips that power the AI revolution. Washington has restricted exports of its most advanced processors to China since 2022, believing they could help Beijing develop its military and technological capabilities.\nBut enforcing those restrictions is difficult. Chips can be bought legally by customers in countries such as Singapore and Malaysia and then diverted to China. Chinese companies can also rent access to computing power through data centres outside the country.\nJensen Huang has long argued that the restrictions are counterproductive. They shut Nvidia out of a huge market and encourage Chinese companies to develop their own alternatives. Trump appeared sympathetic to this view, allowing Nvidia to resume sales of certain chips to China last year in return for a share of the revenue, although its most advanced Blackwell chips remain off limits.\nBut that relationship now looks rather more complicated.\nThe allegations surrounding Jensen Huang's reported affair with Alice Huang, of no relation but a former executive at Singapore-based company Megaspeed, have raised the possibility that a foreign intelligence operation was targeting not just a powerful businessman, but someone with unusually close access to the American president.\nUS intelligence reportedly suspects Alice Huang of having links to Chinese intelligence. Beijing has rejected the allegations. Nvidia's board says it has no reason to believe company secrets or national security were compromised. But the affair has opened up a much bigger question: what did the administration in Washington know, and what did it do about it?\nThat question leads directly to Commerce Secretary Howard Lutnick.\nHis department was responsible for controlling exports of sensitive American technology. It was also being pressed to act on concerns about Megaspeed, an Nvidia customer suspected of helping divert advanced chips to China.\nOn Thursday, Megaspeed chief executive, Tan Yong Pong, also known as James Tan, said the company \"takes its compliance obligations under US export control laws extremely seriously\" and is \"committed to working constructively and transparently with the US government\". He said the company had co-operated with US Commerce Department inspections.\nA highly classified memo was shared with Lutnick about the concerns surrounding Alice Huang and Megaspeed. He resisted taking action against the company, a decision that is now under scrutiny.\nOther senior officials wanted a tougher response.\nTreasury Secretary Scott Bessent was among those who reportedly questioned why Megaspeed had not been placed on the Commerce Department's blacklist.\nOn Friday, Bessent pointed the finger at Commerce for not blacklisting the company, telling CNBC that several government agencies \"were in favour of putting Megaspeed on the entity list for months\".\n\"But Commerce has the pen... and you will have to ask them about their internal process,\" he added.\nThere have also been questions about why an investigation into the Singapore-based company was stopped after Nvidia intervened. The New York Times reported that Nvidia's general counsel contacted Commerce Department investigators probing suspected chip smuggling by Megaspeed invoking a senior Trump appointee. The department allegedly then froze its investigation and handed the case to the Justice Department.\nThis apparently highlighted a significant disagreement about the direction of Trump's China policy. Huang wanted access to the Chinese market. Other officials were supposedly worried about the national security consequences. Lutnick was caught in the middle.\nNow the political pressure is building.\nMembers of Congress from both parties want answers. Democrats have launched an investigation into how the Commerce Department vetted Chinese companies approved to buy AI chips. Republicans are also questioning the administration's approach.\nAnd Jensen Huang's departure has not eased the pressure.\nRepublican representative John Moolenaar, who chairs the House Select Committee on China, said it was in the national interest for Nvidia and other American AI firms to succeed, but that companies \"should never jeopardise our nation's security\" by giving Chinese firms access to their most advanced chips.\nSenator Elizabeth Warren, the top Democrat on the Senate Banking Committee, said Huang's resignation did not absolve him of responsibility, and urged Lutnick to explain why export control loopholes remain open.\nMeanwhile Jensen Huang's team told Republican lawmakers on Wednesday that he plans to cooperate with their request to testify behind closed doors.\nThe White House has not responded to the BBC's request for comment.\nIt has, however, told the New York Post that Trump has complete confidence in Lutnick, describing him as \"the most transformative commerce secretary in modern history\".\nThat is a fairly emphatic show of support, particularly amid reports that officials are weighing whether Lutnick should be forced out.\nThere are some obvious questions. If Lutnick had indeed been warned about the risks, why did his department fail to act? And if other senior officials were indeed pressing for action, why did it take so long?\nThe BBC has contacted the Commerce Department for comment. But there is an even bigger question for Trump.\nThe president cultivated a close relationship with Huang. He was directly involved in decisions about chip sales to China. And, according to reporting in the New York Times, he was briefed on the intelligence concerns.\nThis is becoming difficult to dismiss as the misjudgement of one businessman or one government department.\nJensen Huang's personal life may have triggered the crisis, but the questions now reach into the White House itself. How much influence did he have? What did the president know? And who was ultimately responsible for protecting America's most sensitive technology?",

vated a close relationship with Huang. He was directly involved in decisions about chip sales to China. And, according to reporting in the New York Times, he was briefed on the intelligence concerns.\nThis is becoming difficult to dismiss as the misjudgement of one businessman or one government department.\nJensen Huang's personal life may have triggered the crisis, but the questions now reach into the White House itself. How much influence did he have? What did the president know? And who was ultimately responsible for protecting America's most sensitive technology?",

    "id": "heat-pumps-how-much-heat-does-your-home-5b02e7b0",
    "title": "Heat pumps: How much heat does your home really need?",
    "titleJa": "Heat pumps: How much heat does your home really need?",
    "summaryJa": "Knowing how much heat your home loses is important before installing a new heating system.",
    "bodyOriginal": "Heat pumps: How much heat does your home really need?\n- Published\nFloorplans. Air duct diagrams. Heat pump specifications. Most people in the market for a new heating system probably don't want to think about this level of detail.\nBut, perhaps surprisingly, some do want to think about those things. In extreme depth.\nEvery day, roughly 150 new users sign up to an app called Cool Calc, which works out the heat requirements of properties in the US.\nJust over one third of those new users are not tradespeople but private homeowners, says founder and chief executive Bill Fiore.\nWhen choosing a heating system, people can find themselves bombarded with information – how powerful a heat pump do they need, for example? It isn't always easy to take a tradesperson at their word.\n\"As an overall trend, we are seeing homeowners be more informed,\" explains Fiore. \"They want to do a calculation on their own.\"\nA heat loss calculation is a figure, usually measured in watts, that defines how much heat a home loses during cold weather. It's worked out room by room and is a key part of designing an efficient heating system.\nThis estimate is especially important to get right when installing a heat pump, which is sized fairly precisely, according to the projected heat loss.\nShould that calculation be off, the heat pump will likely perform poorly. You could be left with an underpowered device that struggles to warm your property, for example. Given the costs involved, homeowners are often anxious to ensure installers avoid such mistakes.\nCertain new technologies are not, for the moment, helping, adds Fiore. \"People are going to AI and they're getting a lot of misinformation because it's not backed by anything credible,\" he says. Cool Calc is planning to integrate with AI chatbots to try and improve the quality of the advice they spew out.\nIt is probably a good idea to be cautious about your new heating system's design, says Kevin Kircher at Purdue University. He and colleagues recently conducted a study, yet to be published, examining the heat loss calculations provided by tradespeople to roughly 75 US homeowners.\n\"We were surprised,\" says Kircher. \"The heat loss calculations often led to overestimating the design heat loads by a factor of two or more.\" That would result in oversized systems that use much more power than necessary.\nNot only that, some people reported charges of more than $1,000 (£745) – and in one case as much as $2,500 – just for a heat loss survey, adds Kircher.\nBesides using excessive amounts of energy, an oversized heating system can also feel uncomfortable, says Dan Dempsey, a former senior engineering fellow for a major heating and cooling provider in the US.\nDempsey, who took part in Kircher and his colleagues' study, lives in Indiana. He says it is his retirement hobby to monitor the performance of heating and cooling systems in the homes of friends and family members, by analysing data from their smart thermostats.\n\"I spent five years manually downloading everything, every week,\" he says. He points out that oversized systems tend to cycle a lot, meaning they switch on and off again in quick succession.\nThis leads to discernible swings in temperature: rooms that fail to remain at their target temperature of, say, 20C, but rather fluctuate, which feels uncomfortable, says Dempsey.\nFor people seeking a better understanding of their home's heat loss, various free or partially free apps, including Cool Calc and AutoHVAC, are available. There are options for UK homeowners, too, such as web app Heatpunk.\nMany things can influence the heat loss figure, including the amount of insulation in your home, whether the building has double or triple glazing, and also the size of your radiators.\nHeatpunk allows people to draw a floor plan of their home and input data about the property in order to estimate its performance. Thousands of people use it every month, mostly professional installers, says Andy Rankin, founder and managing director of Midsummer Energy.\nThe web app also suggests specific heat pump models for each property, based on the results of the calculation. Naturally, these are models available through Midsummer Energy. \"It's been a very effective marketing tool,\" says Rankin.\nDwellow, another company that offers heat pump installations in the UK, is keen to follow suit. The firm recently launched its own heat loss estimator.\nWhile professional heat loss calculations remain essential, getting people to do their own \"self surveys\" first could ultimately reduce how much time professional heating engineers must spend analysing properties says Ian Mclaren, Dwellow's co-founder and director.\n\"Going into a home and just being able to check the information rather than start from scratch could turn a survey into a half-hour trip – far more efficient and less costly,\" says Mclaren.\nThere's no substitute for engineers doing a good job when it is their turn, however, stresses Maurizio Sibilla, of the Centre for Advanced Built Environment Research at the University of West England, Bristol.\n\"The solution is better installer practice, clearer customer-facing evidence, and improved methods, not expecting homeowners to do the engineering themselves,\" he says, adding that providing homeowners with information about the calculation and also data on heat pump performance post-installation can reassure them that the system works as expected.\nDoing your own heat loss calculation may end up \"over-intellectualising\" things, says Adam Chapman, chief geek at heat pump training firm and installer network Heat Geek.\n\"I don't personally see what a homeowner would gain from it,\" he says. \"We will guarantee the efficiency with way less radiators and pipework upgrades than any other system out there.\"\nChapman points out that only the most careful of surveys will capture a home's heat loss well.\nHe says it is common for Heat Geek installers to discover retrofitted windows that haven't been foam-insulated into their openings, leaving draughty gaps, or cavity walls that a homeowner thought had been insulated – but which were actually missed by the builder.\n\"It's stuff you can't see,\" he says. \"What we actually need is home surveys that go and spot for these sorts of things.\"\nMore Technology of Business\n- Published4 November\n- Published28 October\n- Published23 October",
    "bodyJa": "Heat pumps: How much heat does your home really need?\n- Published\nFloorplans. Air duct diagrams. Heat pump specifications. Most people in the market for a new heating system probably don't want to think about this level of detail.\nBut, perhaps surprisingly, some do want to think about those things. In extreme depth.\nEvery day, roughly 150 new users sign up to an app called Cool Calc, which works out the heat requirements of properties in the US.\nJust over one third of those new users are not tradespeople but private homeowners, says founder and chief executive Bill Fiore.\nWhen choosing a heating system, people can find themselves bombarded with information – how powerful a heat pump do they need, for example? It isn't always easy to take a tradesperson at their word.\n\"As an overall trend, we are seeing homeowners be more informed,\" explains Fiore. \"They want to do a calculation on their own.\"\nA heat loss calculation is a figure, usually measured in watts, that defines how much heat a home loses during cold weather. It's worked out room by room and is a key part of designing an efficient heating system.\nThis estimate is especially important to get right when installing a heat pump, which is sized fairly precisely, according to the projected heat loss.\nShould that calculation be off, the heat pump will likely perform poorly. You could be left with an underpowered device that struggles to warm your property, for example. Given the costs involved, homeowners are often anxious to ensure installers avoid such mistakes.\nCertain new technologies are not, for the moment, helping, adds Fiore. \"People are going to AI and they're getting a lot of misinformation because it's not backed by anything credible,\" he says. Cool Calc is planning to integrate with AI chatbots to try and improve the quality of the advice they spew out.\nIt is probably a good idea to be cautious about your new heating system's design, says Kevin Kircher at Purdue University. He and colleagues recently conducted a study, yet to be published, examining the heat loss calculations provided by tradespeople to roughly 75 US homeowners.\n\"We were surprised,\" says Kircher. \"The heat loss calculations often led to overestimating the design heat loads by a factor of two or more.\" That would result in oversized systems that use much more power than necessary.\nNot only that, some people reported charges of more than $1,000 (£745) – and in one case as much as $2,500 – just for a heat loss survey, adds Kircher.\nBesides using excessive amounts of energy, an oversized heating system can also feel uncomfortable, says Dan Dempsey, a former senior engineering fellow for a major heating and cooling provider in the US.\nDempsey, who took part in Kircher and his colleagues' study, lives in Indiana. He says it is his retirement hobby to monitor the performance of heating and cooling systems in the homes of friends and family members, by analysing data from their smart thermostats.\n\"I spent five years manually downloading everything, every week,\" he says. He points out that oversized systems tend to cycle a lot, meaning they switch on and off again in quick succession.\nThis leads to discernible swings in temperature: rooms that fail to remain at their target temperature of, say, 20C, but rather fluctuate, which feels uncomfortable, says Dempsey.\nFor people seeking a better understanding of their home's heat loss, various free or partially free apps, including Cool Calc and AutoHVAC, are available. There are options for UK homeowners, too, such as web app Heatpunk.\nMany things can influence the heat loss figure, including the amount of insulation in your home, whether the building has double or triple glazing, and also the size of your radiators.\nHeatpunk allows people to draw a floor plan of their home and input data about the property in order to estimate its performance. Thousands of people use it every month, mostly professional installers, says Andy Rankin, founder and managing director of Midsummer Energy.\nThe web app also suggests specific heat pump models for each property, based on the results of the calculation. Naturally, these are models available through Midsummer Energy. \"It's been a very effective marketing tool,\" says Rankin.\nDwellow, another company that offers heat pump installations in the UK, is keen to follow suit. The firm recently launched its own heat loss estimator.\nWhile professional heat loss calculations remain essential, getting people to do their own \"self surveys\" first could ultimately reduce how much time professional heating engineers must spend analysing properties says Ian Mclaren, Dwellow's co-founder and director.\n\"Going into a home and just being able to check the information rather than start from scratch could turn a survey into a half-hour trip – far more efficient and less costly,\" says Mclaren.\nThere's no substitute for engineers doing a good job when it is their turn, however, stresses Maurizio Sibilla, of the Centre for Advanced Built Environment Research at the University of West England, Bristol.\n\"The solution is better installer practice, clearer customer-facing evidence, and improved methods, not expecting homeowners to do the engineering themselves,\" he says, adding that providing homeowners with information about the calculation and also data on heat pump performance post-installation can reassure them that the system works as expected.\nDoing your own heat loss calculation may end up \"over-intellectualising\" things, says Adam Chapman, chief geek at heat pump training firm and installer network Heat Geek.\n\"I don't personally see what a homeowner would gain from it,\" he says. \"We will guarantee the efficiency with way less radiators and pipework upgrades than any other system out there.\"\nChapman points out that only the most careful of surveys will capture a home's heat loss well.\nHe says it is common for Heat Geek installers to discover retrofitted windows that haven't been foam-insulated into their openings, leaving draughty gaps, or cavity walls that a homeowner thought had been insulated – but which were actually missed by the builder.\n\"It's stuff you can't see,\" he says. \"What we actually need is home surveys that go and spot for these sorts of things.\"\nMore Technology of Business\n- Published4 November\n- Published28 October\n- Published23 October",

    "id": "nvidia-on-track-for-longest-weekly-losin-9a4c6ed2",
    "title": "Nvidia on track for longest weekly losing streak since 2012 as market value sinks by $1.6 trillion",
    "titleJa": "Nvidia on track for longest weekly losing streak since 2012 as market value sinks by $1.6 trillion",
    "summaryJa": "Jensen Huang's resignation added to Nvidia's market woes, with the stock already in a downward slide since early October.",
    "bodyOriginal": "Nvidia investors turned bearish before this week's Jensen Huang saga. But the selling on Wall Street accelerated in the past few days, sending the stock toward its sixth straight weekly drop, the longest losing streak since 2012.\nThe chip giant, which spent most of the year as the world's most valuable company, has lost 29% of its value over that stretch as of Thursday's close. That's a drop of roughly $1.6 trillion in market cap, and it fell below Apple in the process.\nHuang, who co-founded Nvidia and led it for 33 years, resigned on Thursday after two separate extramarital affairs — one with an alleged Chinese spy and the other with an employee — were made public. The board named finance chief Colette Kress as interim CEO while it conducts a search for a full-time successor.\nNvidia shares fell 4.3% on Thursday, bringing their loss for the week to 11%. News of the first reported affair hit the front pages over the weekend, when Huang sent a letter to employees apologizing for being \"unfaithful to my wife.\" The board convened late Wednesday after The New York Times reported on the other affair, this one with the company's vice president of health care.\nBy early Thursday morning, Huang was out, capping a stunning fall for the Nvidia co-founder, who had emerged as one of President Donald Trump's top allies in the corporate world.\n\"With the unfortunate departure of CEO Jensen Huang we expect a challenging transition for NVIDIA over the next few months,\" Gil Luria, an analyst at D.A. Davidson, wrote in a report on Thursday. Luria lowered his price target to $200 from $300, but maintained his buy rating. \"We believe the market has appropriately adjusted for this transition,\" he wrote.\nLast week, prior to Huang's departure, Nvidia shares dropped about 9%. Much of the decline came after the midterm elections, which resulted in sweeping victories for Democrats and the passage of dozens of ballot measures that could slow the artificial intelligence buildout.\nIn the weeks before the election, Nvidia's stock was sliding alongside the rest of the AI trade on concerns that rising interest rates would punish debt-heavy companies. While Nvidia is wildly profitable, big customers like neoclouds are reliant on the debt markets.\nHeading into next week, the pressure is on Kress. Nvidia is scheduled to report quarterly results on Tuesday. Analysts are projecting 91% year-over-year revenue growth to $108.9 billion, according to LSEG. That's up 18-fold from the same quarter in 2022, just before OpenAI launched ChatGPT and kicked off the generative AI era.\nAnalysts at Oppenheimer wrote in a report on Thursday that, even though they see the company reporting solid earnings, \"we expect fundamentals to take a backseat near term.\"\n\"The departure of Mr. Huang could, in our view, translate to a lingering share overhang,\" they wrote.\nWATCH: Sell rating on Nvidia",
    "bodyJa": "Nvidia investors turned bearish before this week's Jensen Huang saga. But the selling on Wall Street accelerated in the past few days, sending the stock toward its sixth straight weekly drop, the longest losing streak since 2012.\nThe chip giant, which spent most of the year as the world's most valuable company, has lost 29% of its value over that stretch as of Thursday's close. That's a drop of roughly $1.6 trillion in market cap, and it fell below Apple in the process.\nHuang, who co-founded Nvidia and led it for 33 years, resigned on Thursday after two separate extramarital affairs — one with an alleged Chinese spy and the other with an employee — were made public. The board named finance chief Colette Kress as interim CEO while it conducts a search for a full-time successor.\nNvidia shares fell 4.3% on Thursday, bringing their loss for the week to 11%. News of the first reported affair hit the front pages over the weekend, when Huang sent a letter to employees apologizing for being \"unfaithful to my wife.\" The board convened late Wednesday after The New York Times reported on the other affair, this one with the company's vice president of health care.\nBy early Thursday morning, Huang was out, capping a stunning fall for the Nvidia co-founder, who had emerged as one of President Donald Trump's top allies in the corporate world.\n\"With the unfortunate departure of CEO Jensen Huang we expect a challenging transition for NVIDIA over the next few months,\" Gil Luria, an analyst at D.A. Davidson, wrote in a report on Thursday. Luria lowered his price target to $200 from $300, but maintained his buy rating. \"We believe the market has appropriately adjusted for this transition,\" he wrote.\nLast week, prior to Huang's departure, Nvidia shares dropped about 9%. Much of the decline came after the midterm elections, which resulted in sweeping victories for Democrats and the passage of dozens of ballot measures that could slow the artificial intelligence buildout.\nIn the weeks before the election, Nvidia's stock was sliding alongside the rest of the AI trade on concerns that rising interest rates would punish debt-heavy companies. While Nvidia is wildly profitable, big customers like neoclouds are reliant on the debt markets.\nHeading into next week, the pressure is on Kress. Nvidia is scheduled to report quarterly results on Tuesday. Analysts are projecting 91% year-over-year revenue growth to $108.9 billion, according to LSEG. That's up 18-fold from the same quarter in 2022, just before OpenAI launched ChatGPT and kicked off the generative AI era.\nAnalysts at Oppenheimer wrote in a report on Thursday that, even though they see the company reporting solid earnings, \"we expect fundamentals to take a backseat near term.\"\n\"The departure of Mr. Huang could, in our view, translate to a lingering share overhang,\" they wrote.\nWATCH: Sell rating on Nvidia",

    "title": "As Nvidia reels from Huang's affairs, who stands to gain?",
    "titleJa": "As Nvidia reels from Huang's affairs, who stands to gain?",
    "summaryJa": "That shift comes as Nvidia grapples with the fallout from Huang's resignation, following revelations about his multiple affairs.",
    "bodyOriginal": "Nvidia's leadership crisis is creating an opening for its biggest rivals as well as partners, as investors bet that Jensen Huang's departure could loosen the AI chip giant's grip on an industry it has long dominated.\nFrom AMD to Broadcom and even partner TSMC, chipmakers are emerging as potential beneficiaries of the upheaval, with market watchers pointing to a possible redistribution of manufacturing capacity and a narrowing of Nvidia's technological lead.\n\"What you're seeing in markets now is a bit of a rotation into other advanced chip design companies, on the assumption that this will enable other companies effectively to catch up,\" said Mark Franklin, head of multi-asset solutions for Asia at Manulife Investment Management.\nThat shift comes as Nvidia grapples with the fallout from Huang's resignation, following revelations about his multiple affairs including with a woman believed by the U.S. intelligence community to be a Chinese spy.\nHuang's departure could give competitors an opportunity to close the gap as Nvidia navigates leadership uncertainty, Franklin highlighted, adding that the rotation was already helping fuel positive momentum in other semiconductor stocks.\nFarzin Azam, managing director of equities trading at Mizuho Americas, said the shift was evident on trading desks, with investors moving toward chipmakers less exposed to Nvidia's management turmoil.\n\"Names such as TSMC, names such as Broadcom, names such as Advanced Micro will come as winners of this because they don't have this overhang of a management disruption,\" Azam told CNBC.\nNvidia shares have plunged 11% so far this week, while rivals AMD and Broadcom have gained 30% and 24%, respectively.\nTSMC, which manufactures Nvidia's most advanced processors, has also rallied 11% over the same period, as it stands to benefit, irrespective of which chip designer gains or loses. A rotation away from AI names perceived as risky also positions TSMC as a relatively safer play for those bullish on the overall theme.\nThe rotation away from Nvidia has also extended into less speculative corners of the semiconductor industry, including analog chipmakers such as Texas Instruments, Analog Devices and Infineon, as investors adopt a more defensive stance, he said.\nTexas Instruments has climbed about 13% this week, while Analog Devices and Germany's Infineon have advanced 12% and 14%, respectively.\nA crack in Nvidia's dominance\nBeyond the immediate market reaction, Huang's exit could fundamentally reshape competition across the AI supply chain, according to Dylan Patel, chief executive at semiconductor research firm SemiAnalysis.\nPatel said Huang had personally cultivated relationships with manufacturers and component suppliers, helping Nvidia secure scarce production capacity ahead of rivals.\nThat advantage could now come under pressure as companies including Google and Amazon strive to expand AI chip production.\nThe two hyperscalers were already gaining ground in securing supply-chain capacity relative to Nvidia, Patel said, and could accelerate those efforts without Huang's influence over suppliers.\n\"If Nvidia can't muster the supply chain, then technology is the only competitive advantage. And without Jensen, can they maintain technology advantages? Given they're only a year ahead of their biggest competitors, it's not like the gap is massive,\" Patel said.\nThe challenge is particularly acute as hyperscalers increasingly develop proprietary AI chips to reduce their reliance on Nvidia, while AMD and other semiconductor companies race to capture a larger slice of the market.\nYet the upheaval doesn't necessarily signal an end to the broader AI investment boom.\nFranklin noted that major technology companies are projecting higher AI spending in 2027, with further increases possible in 2028, signaling the investment cycle remains structurally intact even as investors reassess which companies stand to benefit.\nThe bigger question is whether growing competition and the proliferation of open-source technologies eventually commoditize AI capabilities, putting pressure on chip prices and investment returns, he said.\nFor Nvidia, the immediate outlook may depend less on its earnings than on whether its next leadership team can reassure investors.\nAzam said the stock appeared inexpensive relative to its earnings growth prospects, but warned that ongoing investigations and management uncertainty could limit any sustained recovery.\nHe expects Nvidia's earnings due Nov. 17 to remain strong, with investors likely to focus more closely on management's plans for navigating the crisis.\nThe result could be a reshuffling of winners within the semiconductor industry, with Franklin saying that investors were becoming more comfortable staying invested while rotating and diversifying their portfolios, instead of abandoning the market altogether.",
    "bodyJa": "Nvidia's leadership crisis is creating an opening for its biggest rivals as well as partners, as investors bet that Jensen Huang's departure could loosen the AI chip giant's grip on an industry it has long dominated.\nFrom AMD to Broadcom and even partner TSMC, chipmakers are emerging as potential beneficiaries of the upheaval, with market watchers pointing to a possible redistribution of manufacturing capacity and a narrowing of Nvidia's technological lead.\n\"What you're seeing in markets now is a bit of a rotation into other advanced chip design companies, on the assumption that this will enable other companies effectively to catch up,\" said Mark Franklin, head of multi-asset solutions for Asia at Manulife Investment Management.\nThat shift comes as Nvidia grapples with the fallout from Huang's resignation, following revelations about his multiple affairs including with a woman believed by the U.S. intelligence community to be a Chinese spy.\nHuang's departure could give competitors an opportunity to close the gap as Nvidia navigates leadership uncertainty, Franklin highlighted, adding that the rotation was already helping fuel positive momentum in other semiconductor stocks.\nFarzin Azam, managing director of equities trading at Mizuho Americas, said the shift was evident on trading desks, with investors moving toward chipmakers less exposed to Nvidia's management turmoil.\n\"Names such as TSMC, names such as Broadcom, names such as Advanced Micro will come as winners of this because they don't have this overhang of a management disruption,\" Azam told CNBC.\nNvidia shares have plunged 11% so far this week, while rivals AMD and Broadcom have gained 30% and 24%, respectively.\nTSMC, which manufactures Nvidia's most advanced processors, has also rallied 11% over the same period, as it stands to benefit, irrespective of which chip designer gains or loses. A rotation away from AI names perceived as risky also positions TSMC as a relatively safer play for those bullish on the overall theme.\nThe rotation away from Nvidia has also extended into less speculative corners of the semiconductor industry, including analog chipmakers such as Texas Instruments, Analog Devices and Infineon, as investors adopt a more defensive stance, he said.\nTexas Instruments has climbed about 13% this week, while Analog Devices and Germany's Infineon have advanced 12% and 14%, respectively.\nA crack in Nvidia's dominance\nBeyond the immediate market reaction, Huang's exit could fundamentally reshape competition across the AI supply chain, according to Dylan Patel, chief executive at semiconductor research firm SemiAnalysis.\nPatel said Huang had personally cultivated relationships with manufacturers and component suppliers, helping Nvidia secure scarce production capacity ahead of rivals.\nThat advantage could now come under pressure as companies including Google and Amazon strive to expand AI chip production.\nThe two hyperscalers were already gaining ground in securing supply-chain capacity relative to Nvidia, Patel said, and could accelerate those efforts without Huang's influence over suppliers.\n\"If Nvidia can't muster the supply chain, then technology is the only competitive advantage. And without Jensen, can they maintain technology advantages? Given they're only a year ahead of their biggest competitors, it's not like the gap is massive,\" Patel said.\nThe challenge is particularly acute as hyperscalers increasingly develop proprietary AI chips to reduce their reliance on Nvidia, while AMD and other semiconductor companies race to capture a larger slice of the market.\nYet the upheaval doesn't necessarily signal an end to the broader AI investment boom.\nFranklin noted that major technology companies are projecting higher AI spending in 2027, with further increases possible in 2028, signaling the investment cycle remains structurally intact even as investors reassess which companies stand to benefit.\nThe bigger question is whether growing competition and the proliferation of open-source technologies eventually commoditize AI capabilities, putting pressure on chip prices and investment returns, he said.\nFor Nvidia, the immediate outlook may depend less on its earnings than on whether its next leadership team can reassure investors.\nAzam said the stock appeared inexpensive relative to its earnings growth prospects, but warned that ongoing investigations and management uncertainty could limit any sustained recovery.\nHe expects Nvidia's earnings due Nov. 17 to remain strong, with investors likely to focus more closely on management's plans for navigating the crisis.\nThe result could be a reshuffling of winners within the semiconductor industry, with Franklin saying that investors were becoming more comfortable staying invested while rotating and diversifying their portfolios, instead of abandoning the market altogether.",

    "summaryJa": "Huang abruptly quit on Thursday as head of one of the world's most valuable companies after revelations of alleged extramarital affairs.",
    "bodyOriginal": "Ex-Nvidia CEO Jensen Huang summoned to testify before Congress about affair with alleged Chinese spy\n- Published\nFormer Nvidia CEO Jensen Huang has been summoned to testify next month before a Senate committee about his alleged affair with a woman suspected of being a Chinese spy.\nHuang abruptly quit on Thursday as head of one of the world's most valuable companies after revelations of alleged extramarital affairs, in a stunning fall from grace that sent shockwaves through Silicon Valley.\nCommerce Secretary Howard Lutnick, who is under scrutiny over exports of sensitive Nvidia AI chips to China, has also been summoned to appear before the Senate Banking Committee in December.\nNvidia has lost $550bn (£415bn) in stock market value in just five days as the scandal dominated headlines.\nSenator Tim Scott sent letters on Thursday to Huang and Lutnick requesting their testimony in front of the Senate Banking Committee.\n\"Recent reports raise serious concerns about our national security and the protection of sensitive US technology,\" the South Carolina Republican posted on X.\n\"The American people deserve answers,\" he added.\nScott asked Huang to appear voluntarily on 3 December, but also warned the panel could issue a subpoena to compel his testimony.\nThree House of Representatives committees - on intelligence and foreign affairs and a panel on China - have also sent a letter to Huang summoning him for a closed-door interview on 1 December.\nHow AI visionary Jensen Huang was undone by his own bad decisions\n- Published13 hours ago\nThe rise and fall of Jensen Huang - how the tech superstar became mired in scandal\n- Published13 hours ago\nLutnick is under scrutiny because unnamed officials in President Donald Trump's administration have been briefing US media that the commerce secretary stalled efforts to tighten export restrictions on advanced AI chips to China.\nA commerce department spokesperson told US media that Lutnick had \"proactively\" agreed to appear before the Senate Banking Committee.\nHuang, who has been Nvidia's public face since 1993, admitted on Sunday to having been \"unfaithful\" to his wife after reports he had an affair with a suspected Chinese spy, Alice Huang.\nOn Wednesday, he was reported to have had a second relationship, this time with an Nvidia executive.\nAlice Huang (no relation) worked as an executive at the Singaporean firm Megaspeed. She has been suspected of being an intelligence asset for China, according to the New York Times. China has rejected that allegation as a smear.\nUS Attorney General Todd Blanche said on Thursday the Department of Justice had not yet drawn any conclusions about whether Alice Huang was engaged in espionage for Beijing.\nNvidia officials have repeatedly declined to comment since Wednesday. A personal representative of Huang also declined to comment on Thursday.\nAccording to US media, Huang's alleged second affair was with a long-time Nvidia executive, Kimberly Powell, who reported directly to him within the company.\nSources have told the BBC that Nvidia employees had noticed the pair were unusually close.\nWho is Nvidia's interim CEO Colette Kress - and who could take over permanently?\n- Published15 hours ago\nHuang had been widely expected to weather the storm after the first affair became public, even as Nvidia announced it had launched an investigation into whether its CEO had been \"the target of a foreign intelligence effort\".\nOne current Nvidia staff member told the BBC that the initial reports of his infidelity were more or less brushed off by rank-and-file workers inside the company.\nIt wasn't until Huang's alleged affair with the Nvidia executive became public that workers started to feel \"this is crazy\", the person said.\nAnother Nvidia employee said they had been told not to speak with the press or otherwise comment on the situation in public.\nMany staff have earned millions of dollars in compensation through their ability to cash out their Nvidia shares as the stock soared.\nNvidia has said it has \"no reason to believe that either national security or Nvidia secrets were compromised\", but pledged that its independent inquiry would look at all available information.\nThe company's meteoric rise had been led by Jensen Huang, who became a major booster of the AI industry, which relies on Nvidia for the powerful computer chips it manufactures.\nInitially those chips were designed for computer gaming.\nBut as AI technology evolved in the last four years into chatbots and large language models, companies building AI tools suddenly required huge numbers of the Nvidia computer chips that could process large amounts of data.\nNvidia is now hunting a permanent replacement for Huang. Chief Financial Officer Colette Kress was named on Thursday as interim CEO.\nSeveral tech insiders that the BBC spoke with this week noted that Huang's downfall has been a major topic of conversation in San Francisco Bay area circles, an area filled with tech employees, industry executives and billionaires.\nHuang has been married to Lori Huang for 40 years. Both of their children are also executives at Nvidia.\nNvidia's stock fall this week is the most significant five-day drop the company has seen since going public 27 years ago.\nIts market value rose by more than 470% in the past five years, peaking just a few weeks ago. It is now down by 31% against a backdrop of wider uncertainty in the tech sector.\nRelated topics\n- Published10 hours ago\n- Published2 days ago",
    "bodyJa": "Ex-Nvidia CEO Jensen Huang summoned to testify before Congress about affair with alleged Chinese spy\n- Published\nFormer Nvidia CEO Jensen Huang has been summoned to testify next month before a Senate committee about his alleged affair with a woman suspected of being a Chinese spy.\nHuang abruptly quit on Thursday as head of one of the world's most valuable companies after revelations of alleged extramarital affairs, in a stunning fall from grace that sent shockwaves through Silicon Valley.\nCommerce Secretary Howard Lutnick, who is under scrutiny over exports of sensitive Nvidia AI chips to China, has also been summoned to appear before the Senate Banking Committee in December.\nNvidia has lost $550bn (£415bn) in stock market value in just five days as the scandal dominated headlines.\nSenator Tim Scott sent letters on Thursday to Huang and Lutnick requesting their testimony in front of the Senate Banking Committee.\n\"Recent reports raise serious concerns about our national security and the protection of sensitive US technology,\" the South Carolina Republican posted on X.\n\"The American people deserve answers,\" he added.\nScott asked Huang to appear voluntarily on 3 December, but also warned the panel could issue a subpoena to compel his testimony.\nThree House of Representatives committees - on intelligence and foreign affairs and a panel on China - have also sent a letter to Huang summoning him for a closed-door interview on 1 December.\nHow AI visionary Jensen Huang was undone by his own bad decisions\n- Published13 hours ago\nThe rise and fall of Jensen Huang - how the tech superstar became mired in scandal\n- Published13 hours ago\nLutnick is under scrutiny because unnamed officials in President Donald Trump's administration have been briefing US media that the commerce secretary stalled efforts to tighten export restrictions on advanced AI chips to China.\nA commerce department spokesperson told US media that Lutnick had \"proactively\" agreed to appear before the Senate Banking Committee.\nHuang, who has been Nvidia's public face since 1993, admitted on Sunday to having been \"unfaithful\" to his wife after reports he had an affair with a suspected Chinese spy, Alice Huang.\nOn Wednesday, he was reported to have had a second relationship, this time with an Nvidia executive.\nAlice Huang (no relation) worked as an executive at the Singaporean firm Megaspeed. She has been suspected of being an intelligence asset for China, according to the New York Times. China has rejected that allegation as a smear.\nUS Attorney General Todd Blanche said on Thursday the Department of Justice had not yet drawn any conclusions about whether Alice Huang was engaged in espionage for Beijing.\nNvidia officials have repeatedly declined to comment since Wednesday. A personal representative of Huang also declined to comment on Thursday.\nAccording to US media, Huang's alleged second affair was with a long-time Nvidia executive, Kimberly Powell, who reported directly to him within the company.\nSources have told the BBC that Nvidia employees had noticed the pair were unusually close.\nWho is Nvidia's interim CEO Colette Kress - and who could take over permanently?\n- Published15 hours ago\nHuang had been widely expected to weather the storm after the first affair became public, even as Nvidia announced it had launched an investigation into whether its CEO had been \"the target of a foreign intelligence effort\".\nOne current Nvidia staff member told the BBC that the initial reports of his infidelity were more or less brushed off by rank-and-file workers inside the company.\nIt wasn't until Huang's alleged affair with the Nvidia executive became public that workers started to feel \"this is crazy\", the person said.\nAnother Nvidia employee said they had been told not to speak with the press or otherwise comment on the situation in public.\nMany staff have earned millions of dollars in compensation through their ability to cash out their Nvidia shares as the stock soared.\nNvidia has said it has \"no reason to believe that either national security or Nvidia secrets were compromised\", but pledged that its independent inquiry would look at all available information.\nThe company's meteoric rise had been led by Jensen Huang, who became a major booster of the AI industry, which relies on Nvidia for the powerful computer chips it manufactures.\nInitially those chips were designed for computer gaming.\nBut as AI technology evolved in the last four years into chatbots and large language models, companies building AI tools suddenly required huge numbers of the Nvidia computer chips that could process large amounts of data.\nNvidia is now hunting a permanent replacement for Huang. Chief Financial Officer Colette Kress was named on Thursday as interim CEO.\nSeveral tech insiders that the BBC spoke with this week noted that Huang's downfall has been a major topic of conversation in San Francisco Bay area circles, an area filled with tech employees, industry executives and billionaires.\nHuang has been married to Lori Huang for 40 years. Both of their children are also executives at Nvidia.\nNvidia's stock fall this week is the most significant five-day drop the company has seen since going public 27 years ago.\nIts market value rose by more than 470% in the past five years, peaking just a few weeks ago. It is now down by 31% against a backdrop of wider uncertainty in the tech sector.\nRelated topics\n- Published10 hours ago\n- Published2 days ago",

    "summaryJa": "More than 900 victims are thought to have fallen prey to the FaceStealer scheme in the last 18 months.",
    "bodyOriginal": "North Korean hackers used fake video calls in $400m crypto hack, says FBI\n- Published\nState-sponsored hackers from North Korea have taken more than $400 million in cryptocurrency by using fake video calls to steal people's identities, US authorities say.\nMore than 900 victims have fallen prey to the scheme, which the FBI refers to as FaceStealer, in the last 18 months, according to the bureau.\n\"The North Korean regime relies on proceeds from large-scale cryptocurrency theft to fund its illicit weapons program, stealing billions of dollars in recent years,\" says FBI cyber director Brett Leatherman.\nThis comes a week after the world's largest crypto exchange Binance revealed that hackers had used fake job interviews to steal a record $6.3bn (£4.7bn) from the company.\nUS law enforcement agencies attributed the Binance hack, thought to be the largest crypto hack to date, to North Korea-linked actors. Pyongyang has denied this claim.\nAuthorities say FaceStealer, the latest scheme, \"aggressively targets\" those who work in the cryptocurrency and web3 sectors, particularly those who are involved in the development and maintenance of open-source software.\nAccording to the FBI and US Justice Department, FaceStealer hackers use fake or hijacked social media accounts to invite potential victims into video calls hosted over \"imposter versions\" of Zoom, Microsoft Teams, and Google Meet.\nNext, the hackers play pre-recorded videos of previous victims the target is acquainted with to simulate a legitimate call – except that the audio would appear to malfunction.\nA message then pops up on the target's screen, asking them to \"fix\" the audio by clicking on a link. This \"fix\" would eventually download malware onto the target's device, which allows hackers to access their contact lists and apps, widening their pool of potential victims.\nHackers would secretly record these calls and use the recordings as material to scam their new victims, according to the US authorities.\nThe FBI has described FaceStealer as \"a highly effective social engineering scheme capable of deceiving even the most experienced technical and security conscious computer user\".\n\"It exploits our trust in ubiquitous video conference platforms and valued personal relationships,\" Patrick Grandy, assistant director in charge of the bureau's Los Angeles field office, said in a statement on Thursday.\n\"If you can't imagine a scenario where you might fall prey to it, you are not thinking creatively enough.\"",

    "titleJa": "Zelensky welcomes US bringing Europe into Russia-Ukraine peace talks",
    "summaryJa": "The Ukrainian president says it makes sense for European leaders to be involved as Ukraine hopes to eventually join the EU.",
    "bodyOriginal": "Zelensky welcomes US bringing Europe into Russia-Ukraine peace talks\n- Published\nUkraine's president has welcomed a pledge from US envoys, Jared Kushner and Steve Witkoff, to include delegates from the European Union in the next round of peace talks with Russia.\nEuropean leaders have expressed deepening security concerns this week, and Volodymyr Zelensky said bringing them into the talks would ensure the EU has a \"voice\" in negotiations.\nKushner and Witkoff met Zelensky in Dublin on Thursday evening as part of a busy day of shuttle diplomacy - they met Vladimir Putin in Moscow earlier, who said that Russia's position on the war - and its demand for territory - has not changed.\nThe meetings follow talks in Abu Dhabi last week that failed to reach a breakthrough in ending the war.\nBut Thursday did see Russia and Ukraine agree to another prisoner exchange - the largest swap yet since Russia launched its full-scale invasion in 2022.\nKushner said it would return \"thousands of people to their families\", but further details like how many prisoners would be exchanged or a timeline, were not given.\nUS envoys meet Zelensky in Dublin after talks with Putin in Moscow\n- Published9 hours ago\nEurope's security 'fundamentally reshaped' by war in Ukraine\n- Published15 hours ago\nZelensky has for several years been calling for European delegates to be included in the peace talks, and says it makes sense because of Kyiv's longer-term ambition to join the European Union.\nOn Thursday, Kushner said that the US has been \"working very, very closely over the past several months with Europeans and I think that that's been very important.\"\nHe added that he had stressed to Putin how important it is to have European delegates \"at the table\".\n\"He's willing to give it a try,\" Kushner added.\nUkraine and Europe have long been concerned about the current US government's commitment to European security and its softening towards the Kremlin.\nMoscow has been dismissive of European involvement, although Europeans have long argued that they are central to any post-war dynamics on their continent.\nEarlier on Thursday, Vice President of the European Commission Kaja Kallas, the EU's top diplomat, told BBC's Newshour the presence of a European delegate showed the Kremlin \"now realised that Europe is a big player\".\nKallas also expressed doubts that there was Russian momentum towards a peace deal.\nTaoiseach (Irish Prime Minister) Micheál Martin told a host of Euro leaders gathered in the Irish capital on Thursday that he believed the security of the region has been \"fundamentally reshaped\" by Russia's war.\n\"Many member states [of the EU] feel an existential threat because of what has happened in Ukraine and the potential, if Ukraine was to fall, for further aggression on the European continent,\" he told reporters.\nApproximately one-fifth of Ukraine remains under control of Russian forces, and cross-border incursions are increasingly common.\nTensions between the US and Ukraine were on display on Thursday before Witkoff and Kushner's meeting with Zelensky.\nEarlier, the Ukrainian leader said that the military was facing more \"systematic\" restrictions to Starlink's military-grade satellite service, Starshield, meaning Kyiv was struggling to intercept Russian jet-powered drones.\nThe technology owned by Elon Musk's SpaceX company has played a vital role in government and military connectivity in Ukraine, and increasingly assists in facilitating communication on Ukraine's front line.",

missive of European involvement, although Europeans have long argued that they are central to any post-war dynamics on their continent.\nEarlier on Thursday, Vice President of the European Commission Kaja Kallas, the EU's top diplomat, told BBC's Newshour the presence of a European delegate showed the Kremlin \"now realised that Europe is a big player\".\nKallas also expressed doubts that there was Russian momentum towards a peace deal.\nTaoiseach (Irish Prime Minister) Micheál Martin told a host of Euro leaders gathered in the Irish capital on Thursday that he believed the security of the region has been \"fundamentally reshaped\" by Russia's war.\n\"Many member states [of the EU] feel an existential threat because of what has happened in Ukraine and the potential, if Ukraine was to fall, for further aggression on the European continent,\" he told reporters.\nApproximately one-fifth of Ukraine remains under control of Russian forces, and cross-border incursions are increasingly common.\nTensions between the US and Ukraine were on display on Thursday before Witkoff and Kushner's meeting with Zelensky.\nEarlier, the Ukrainian leader said that the military was facing more \"systematic\" restrictions to Starlink's military-grade satellite service, Starshield, meaning Kyiv was struggling to intercept Russian jet-powered drones.\nThe technology owned by Elon Musk's SpaceX company has played a vital role in government and military connectivity in Ukraine, and increasingly assists in facilitating communication on Ukraine's front line.",

    "title": "The rise of 'housefishing' - when does using AI go from enhancing to misleading?",
    "titleJa": "The rise of 'housefishing' - when does using AI go from enhancing to misleading?",
    "summaryJa": "Experts warn that using AI to enhance property images can go too far and mislead prospective buyers.",
    "bodyOriginal": "The rise of 'housefishing' - when does using AI go from enhancing to misleading?\n- Published\nHave you ever been impressed by the pictures of a property on an estate agent's website, only to find the place looks completely different when you view it in person?\nThen there's a chance that AI was used to enhance the images you saw.\nFrom repainted walls to imaginary lawns, estate agents are increasingly using the technology to make homes seem more appealing, arguing it helps buyers visualise the potential of a place.\nBut experts warn it can go too far and mislead prospective buyers - a trend dubbed \"housefishing\".\nSo how much AI enhancement is too much?\n'The rooms were much smaller'\nEarlier this year Olivia Nicole, 29, was searching online for five-bedroom properties in south-west London when a house on Rightmove caught her eye.\nBut when she arrived to view it several days later she initially thought she had come to the wrong place.\n\"The rooms were much smaller than they were in the pictures and the decor was totally different,\" she tells the BBC. \"Some structural features were also different.\"\nFor example, there was a raised section of the wall behind the sofa that didn't appear in the images. The windows were also noticeably smaller. Olivia was so surprised she took her own pictures of the property for comparison.\nIt later turned out the pictures she had seen on Rightmove, which also appeared on the Zoopla and Winkworth websites, were enhanced with AI.\nBut that wasn't clear in the listing, Olivia says, and she feels the agent wasted her time.\n\"It was frustrating, because I had taken several hours off work for the viewing which I had to make up for.\"\nAll three companies told the BBC they had strict guidelines on how AI could be used on their websites and have since taken the images down.\n'A surge of AI listings'\nEstate agents have long used wide-angle lens cameras or Photoshop to make homes seem bigger or more appealing to buyers, but AI is making this process much easier and more accessible.\nIt is difficult to quantify how common the practice is, says the Guild of Property Professionals, a trade group of independent estate agents, but it has issued guidance on how to use AI enhancement responsibly.\nAccording to a recent survey, external of 906 UK homebuyers, one in five who had who purchased a home in the past year said they had viewed a property where the listing photos had been digitally enhanced to make the home appear better than it actually was.\nJack Bushrod reviews quirky property listings he finds on Rightmove for his social media channel, Housing Horrors, and says he has seen a \"surge\" of AI-enhanced images over the last six months.\nHe thinks using AI is fine up to a point - to declutter a busy room, or add furniture to an empty one so a prospective buyer can see its potential.\nBut he draws the line at anything that misleads a prospective buyer or wastes their time.\n\"I've seen one house where they had removed a pillar and added a window. Others might use AI to remove stains on the carpet or cracks in tiles. It's little details you would only notice in person.\"\nHe says most of the enhanced images he's seen weren't clearly labelled as AI-generated.\nCara, 38, is currently selling her home in Lowestoft, Suffolk, and says she was surprised when she saw the AI-enhanced pictures of her property her estate agent, Howards, put on Rightmove.\nIn one photo, her son's room was completely emptied of toys and clutter.\nIn another, of her daughter's room, the agent appears to have removed a doll's house, brightened the room, and used AI to change the shape of a rug, but that image has since been taken down.\nCara has had several viewings so far and says that one person has commented on the differences. But she says she trusts Howards, which has acknowledged the use of AI in the property listing.\n\"If they'd changed something structurally or it was really wild and didn't look like our home at all then I would put my foot down,\" she says.\nA spokeswoman told the BBC that Howards had now introduced a policy of labelling all AI-enhanced photos. She added that the firm never used AI \"to misrepresent the fundamental features of a property\".\n\"It's about helping people imagine the possibilities, not changing the reality of what's being sold.\"\n'Jumping on the bandwagon'\nTrading Standards told the BBC that estate agents can use AI to make basic enhancements to photos, or to virtually furnish an empty room or garden, as long as they indicate they have used the technology.\nBut it says structurally changing a room, for example by adding a window, or hiding features could mislead consumers and break the law.\nJack Bushrod thinks all estate agents should have to clearly label AI-enhanced photos and mention any use of the tech prominently in the key features slide of a property listing.\nHe also expects to see more housefishing as time goes on.\n\"My worry is the more estate agents use AI, others will see the trend and jump on the bandwagon.\"\nAdditional reporting by Star McFarlane\nRelated topics\n- Published18 September\n- Published3 November",

    "bodyOriginal": "Cerebras Systems reported better-than-expected revenue and quarterly guidance in its earnings report on Thursday, and touted a new deal with Microsoft. The stock soared 17% in extended trading.\nHere's how the company performed relative to LSEG consensus:\n- Loss per share: 67 cents. It's not immediately clear how the number compares with the loss of 14 cents expected\n- Core revenue: $230.9 million vs. $214.7 million expected\nCerebras' core revenue grew 70% from $135.7 million, compared with 103% growth in the second quarter, according to a statement.\n\"I think there is opportunity created by, particularly on the hardware side, the sale of hardware, where long lead times in GPUs and more expense creates opportunity for us,\" Cerebras CEO Andrew Feldman told CNBC in an interview, referring to graphics processing units.\nExecutives will announce a new relationship with Microsoft, one of the world's top cloud providers, on a conference call with analysts, Feldman said. The call starts at 5 p.m. ET.\n\"We believe revenue begins to show up in Q1 '27,\" Feldman said in the interview, adding that Microsoft signed the deal in October. Cerebras has also landed deals with other major cloud providers Amazon and Oracle.\nCerebras is evaluating its financing options to meet the ramping demand, Feldman said in the interview.\nThe company is trying to challenge Nvidia in the AI chip market. Its earnings land on the same day that Nvidia CEO Jensen Huang resigned from the company he co-founded after multiple scandals involving extramarital affairs.\nFor the fourth quarter, Cerebras expects a core gross margin of 47% to 49%, with $310 million to $330 million in revenue. Analysts polled by LSEG were looking for a 42.1% margin and $271 million in revenue.\nCerebras said it expects revenue to triple in 2027. That implies about $2.85 billion in revenue. Analysts surveyed by LSEG were looking for $2.92 billion.\nCerebras shares have slumped by about 47% since the company debuted on Nasdaq in May.\nWATCH: This AI chip stock is struggling. Paul Meeks thinks it's an opportunity to buy",

    "title": "Alice Huang tied to Nvidia’s biggest Chinese competitor",
    "titleJa": "Alice Huang tied to Nvidia’s biggest Chinese competitor",
    "summaryJa": "The woman with whom Jensen Huang reportedly had a relationship also owned stakes in companies that provided computing power to Huawei, a key Nvidia competitor.",
    "bodyOriginal": "Alleged Chinese spy Alice Huang may have owned stakes in businesses in China that benefited Nvidia's biggest competitor in China, Huawei, at the same time that she was in business with Nvidia and also reportedly having a romantic affair with its ousted CEO Jensen Huang.\nThe connection between Alice Huang and Huawei was first discovered by analysts at private intelligence firm Tesari. The firm exclusively shared its findings with CNBC. Tesari, which uses artificial intelligence to collect evidence and specializes in national security investigations around the world, provides intelligence research to private companies and the U.S. government.\nThis previously unreported entanglement may raise questions about Alice Huang's intent and conduct in her relationship with the CEO and whether Jensen Huang knew his romantic partner was closely connected with his competition. Jensen Huang has acknowledged having an affair, though the precise timing of his relationship with Alice Huang is unknown.\nThe mysterious saga of Alice Huang involves a tangle of interlocking corporations and transactions that show her connection to entities that ultimately provided computing power to Huawei in China.\nHuawei is known as a Chinese government \"state champion\" in the technology and telecommunications sectors, meaning it receives enormous financial support from the government in Beijing so it can lower prices and undercut global competitors. It is considered a key part of the Chinese government's push for global technical dominance and is closely linked to the Chinese Communist Party.\nBusinesses connected to Alice Huang were linked with supplying Nvidia computing power to Huawei, according to documents reviewed by CNBC, around the same time she and Jensen Huang were first publicly seen together, in December 2023.\nIn 2024, Nvidia said Huawei was a top competitor, specifically in artificial intelligence chips including graphics processing units, central processing units and networking chips.\n\"This activity, which surfaced through our analysis of Alice's network, warrants a national security and [technology] counterproliferation investigation,\" said Brian Andersen, Tesari's vice president for national security applications and a former supervisory special agent with Homeland Security Investigations.\nIf the Commerce Department's Bureau of Industry Security and Homeland Security Investigations found evidence that anyone transferred \"controlled equipment\" to Huawei without authorization, potential charges might include export-control violations, conspiracy and smuggling, Andersen said.\nThe connection between Alice Huang and Huawei is so convoluted that analysts at Tesari told CNBC that based on their previous investigative experience, they suspect it was designed to deliberately obscure the relationship.\nNvidia and Huawei did not respond to CNBC's requests for comment. Jensen Huang did not respond to a voicemail left on a mobile phone. Alice Huang could not be reached.\nAccording to Chinese corporate records and media reports compiled by Tesari and provided to CNBC, Alice Huang, whose Chinese name is Huang Le and who according to documents at the time was based in Hong Kong, in 2019 sold a cloud business she owned called Osmanthus to a Chinese gaming company called 7Road. A subsidiary of 7Road, which was based in Singapore, was spun off as \"Megaspeed\" in 2023. Megaspeed would go on to become a key Nvidia customer, helping facilitate at least $7.5 billion in Nvidia chip shipments to Chinese firms, The Information reported Tuesday.\nAs early as 2016, Alice Huang had also become a co-owner of a financial firm known as Shanghai Hexi, which heavily invests in tech and data centers. In 2021, Hexi in turn acquired 27 percent of a company called Shanghai Century Longteng, a data center developer, which Hexi held until 2024. That firm owned a controlling 50.1 percent stake in a data center facility called Shenzhen Yifeng Technology Co. Ltd. in mainland China.\nThe key customer of that data center was Huawei Cloud, the Shenzhen, China-based subsidiary of Huawei Technologies.\nIn addition, Alice Huang's firm Hexi guaranteed the loans required to finance the Shenzhen data center, which did business with Huawei.\nHexi did not immediately respond to a message via its LinkedIn page sent outside of normal business hours.\nCNBC translated corporate records and Chinese news articles in Mandarin that Tesari provided.\nIt's not clear if the Shenzhen data center was able to acquire Nvidia GPUs, but its majority owner began purchasing the chips in 2023. That company is known as Zhejiang Century Huatong Group and is a business partner of Alice Huang's Hexi through their joint ownership of Century Longteng.\nThat made Alice Huang a part owner of a data center providing computing power to Huawei. And that was happening at around the same time the first known sightings of Alice Huang and Jensen Huang in public together.\nAnd that raises the question of why Huawei, which has access to Chinese-made chips, would need to rent computing power from an outside entity.\nHexi exited its stake in the data center development company in 2024, but individuals within Alice Huang's network are still connected to the Shenzhen data center. Her husband Kang Wei is a longtime business associate who founded Hexi, where Alice Huang previously held an executive role. In 2022, Kang became an executive of Century Longteng, which owns the controlling stake in the Shenzhen data center, and he also attended the company's signing of the Huawei agreement.",

    "summaryJa": "A Microsoft outage on Thursday affected users of services like Outlook, Teams and 365.",
    "bodyOriginal": "Microsoft suffered a widespread outage on Thursday that impacted thousands of users across regions, according to outage-tracking website Downdetector.com.\nThe outage began shortly before 1 p.m. and impacted Microsoft 365 services, Outlook and Teams. At the time, about 130,000 users reported issues with Outlook.\nAmazon Web Services and Google users also reported outages on the site.\n\"We are aware and investigating reports of users experiencing issues with Microsoft 365 services, primarily issues with Exchange Online,\" a Microsoft spokesperson wrote in a statement to CNBC. \"We appreciate our customers' patience while we work to restore services as soon as possible.\"\nMicrosoft shared updates on the outage from its Microsoft 365 Status account on social media platform X.\nAmazon wrote on X that services were \"operating normally\" and an \"unrelated disruption elsewhere on the internet is prompting some inaccurate news reports.\" The company referred users to its health dashboard for \"accurate data.\"\nAt 4 p.m., Microsoft said it had \"validated an alternative service health check method\" that brought some affected servers back online.\n\"We're now applying this change more broadly,\" Microsoft wrote. \"We're also preparing automated recovery systems to continually detect and restart unresponsive servers, to maintain service stability while this change progresses.\"\nMicrosoft initially said infrastructure \"elevated load across multiple regions\" was responsible for the connectivity problems.\nThe company later determined that the elevated load was caused by a \"number of servers being unexpectedly unavailable; straining the remaining infrastructure\" and that some servers were failing automated health checks.\n\"We've taken steps to prevent additional servers from being impacted while we work to return the affected servers to service,\" Microsoft wrote.",

    "id": "cisco-beats-on-earnings-says-ai-infrastr-e7811e34",
    "title": "Cisco beats on earnings, says AI infrastructure revenue will double this fiscal year",
    "titleJa": "Cisco beats on earnings, says AI infrastructure revenue will double this fiscal year",
    "summaryJa": "Cisco is trying to become a bigger player in AI after missing out on the early years of the boom.",
    "bodyOriginal": "Cisco shares rose in extended trading on Thursday after the maker of networking gear reported better-than-expected fiscal first-quarter results.\nHere's how the company did compared to LSEG consensus estimates:\n- EPS: $1.40 adjusted vs. $1.33 expected\n- Revenue: $18.5 billion vs. $18.1 billion expected.\nRevenue increased 24% from $14.88 billion a year earlier, Cisco said in a statement. Net income rose to $4.6 billion, or $1.14 per share, from $2.9 billion, or 72 center per share, a year ago.\nCisco is trying to gain a foothold in the artificial intelligence buildout after missing out on the early years of the generative AI boom. The company's stock price is up about 35% this year as of Thursday's close, trouncing the Nasdaq, which has gained 9% over that stretch.\nCisco raised its expectation for AI infrastructure revenue from hyperscalers to $9 billion this fiscal year, more than double the figure in fiscal 2026.\n\"Organizations are turning to Cisco for our trusted, market-defining technology and our expertise to help them scale, secure and optimize their environments for the agentic AI era,\" CEO Chuck Robbins said in the statement.\nFor the fiscal second quarter, Cisco said it expects revenue of between $18 billion and $18.2 billion, topping the average analyst estimate of $17.88 billion, according to LSEG. The company is projecting adjusted earnings per share of $1.34 to $1.36, beating the $1.23 average estimate.",
    "bodyJa": "Cisco shares rose in extended trading on Thursday after the maker of networking gear reported better-than-expected fiscal first-quarter results.\nHere's how the company did compared to LSEG consensus estimates:\n- EPS: $1.40 adjusted vs. $1.33 expected\n- Revenue: $18.5 billion vs. $18.1 billion expected.\nRevenue increased 24% from $14.88 billion a year earlier, Cisco said in a statement. Net income rose to $4.6 billion, or $1.14 per share, from $2.9 billion, or 72 center per share, a year ago.\nCisco is trying to gain a foothold in the artificial intelligence buildout after missing out on the early years of the generative AI boom. The company's stock price is up about 35% this year as of Thursday's close, trouncing the Nasdaq, which has gained 9% over that stretch.\nCisco raised its expectation for AI infrastructure revenue from hyperscalers to $9 billion this fiscal year, more than double the figure in fiscal 2026.\n\"Organizations are turning to Cisco for our trusted, market-defining technology and our expertise to help them scale, secure and optimize their environments for the agentic AI era,\" CEO Chuck Robbins said in the statement.\nFor the fiscal second quarter, Cisco said it expects revenue of between $18 billion and $18.2 billion, topping the average analyst estimate of $17.88 billion, according to LSEG. The company is projecting adjusted earnings per share of $1.34 to $1.36, beating the $1.23 average estimate.",
