    "bodyOriginal": "United Kingdom Prime Minister Andy Burnham said Iran was involved in the incident at the Royal Air Force base in Fairford on Sunday that led to the arrest of five men on suspicion of explosive and terrorism offences.\nSpeaking to the BBC Wednesday, Burnham said that \"There are strong indications that Iran played a part in what happened over the weekend at RAF Fairford,\" without providing additional details. In response, Iranian Foreign Minister Abbas Araghchi said on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, located in Gloucestershire, has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.\nLondon had initially denied the U.S. permission to use UK bases for its war on Iran, but former Prime Minister Keir Starmer had allowed it for \"defensive strikes.\"\nBurnham's BBC interview comes as U.S. Secretary of State Marco Rubio told Fox News on Monday that the incident at RAF Fairford \"clearly involves the hands of a foreign actor,\" without giving any details or evidence.\nThe Iranian Embassy in London on Monday \"categorically\" rejected speculation linking the country to the alleged plot.\nAll the five arrested suspects are UK nationals aged between 23 and 25, and one reportedly called the police himself. They have been released on bail.\nIran UNGA delegation leaves U.S.\nSeparately, a U.S. official told MS NOW that Rubio \"kicked out\" the Iranian delegation as the United Nations General Assembly was over, saying that they had \"overstayed their welcome.\"\nThe officials, including Aragachi, left on Monday morning U.S. time. \"UNGA was over, so it was time for them to go,\" the official added.\nIndirect negotiations between Washington and Tehran over Iran's nuclear program and the Strait of Hormuz failed to bear any fruit over the course of the U.N. General Assembly.\nTehran had proposed a seven-day deal at the UNGA, under which the Strait of Hormuz would be opened and nuclear talks resumed with the U.S. if Washington returned to the terms of the Islamabad deal framework.\nThe Islamabad memorandum of understanding in June led to a ceasefire agreement between the U.S. and Iran that collapsed in early July. The Trump administration is unwilling to return to the terms of the June agreement, according to a report by the Wall Street Journal.\nPresident Donald Trump on Sunday called the latest Iranian proposal \"unacceptable,\" telling reporters that Tehran wants a swift deal because of the economic pressure it is under.\n— CNBC's Anniek Bao contributed to this report.",
    "bodyJa": "United Kingdom Prime Minister Andy Burnham said Iran was involved in the incident at the Royal Air Force base in Fairford on Sunday that led to the arrest of five men on suspicion of explosive and terrorism offences.\nSpeaking to the BBC Wednesday, Burnham said that \"There are strong indications that Iran played a part in what happened over the weekend at RAF Fairford,\" without providing additional details. In response, Iranian Foreign Minister Abbas Araghchi said on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, located in Gloucestershire, has been used as the U.S. Air Force's command outpost for operations from Europe and for American strikes on Iranian missile sites.\nLondon had initially denied the U.S. permission to use UK bases for its war on Iran, but former Prime Minister Keir Starmer had allowed it for \"defensive strikes.\"\nBurnham's BBC interview comes as U.S. Secretary of State Marco Rubio told Fox News on Monday that the incident at RAF Fairford \"clearly involves the hands of a foreign actor,\" without giving any details or evidence.\nThe Iranian Embassy in London on Monday \"categorically\" rejected speculation linking the country to the alleged plot.\nAll the five arrested suspects are UK nationals aged between 23 and 25, and one reportedly called the police himself. They have been released on bail.\nIran UNGA delegation leaves U.S.\nSeparately, a U.S. official told MS NOW that Rubio \"kicked out\" the Iranian delegation as the United Nations General Assembly was over, saying that they had \"overstayed their welcome.\"\nThe officials, including Aragachi, left on Monday morning U.S. time. \"UNGA was over, so it was time for them to go,\" the official added.\nIndirect negotiations between Washington and Tehran over Iran's nuclear program and the Strait of Hormuz failed to bear any fruit over the course of the U.N. General Assembly.\nTehran had proposed a seven-day deal at the UNGA, under which the Strait of Hormuz would be opened and nuclear talks resumed with the U.S. if Washington returned to the terms of the Islamabad deal framework.\nThe Islamabad memorandum of understanding in June led to a ceasefire agreement between the U.S. and Iran that collapsed in early July. The Trump administration is unwilling to return to the terms of the June agreement, according to a report by the Wall Street Journal.\nPresident Donald Trump on Sunday called the latest Iranian proposal \"unacceptable,\" telling reporters that Tehran wants a swift deal because of the economic pressure it is under.\n— CNBC's Anniek Bao contributed to this report.",

    "title": "AI boom could trigger market shocks, Bank of England boss warns",
    "titleJa": "AI boom could trigger market shocks, Bank of England boss warns",
    "summaryJa": "Andrew Bailey says the central bank is watching the waves of cash being invested in artificial intelligence \"very carefully\".",
    "bodyOriginal": "AI boom could trigger market shocks, Bank of England boss warns\n- Published\nArtificial intelligence (AI) could trigger financial market shocks and the UK needs to be prepared for them, the governor of the Bank of England has warned.\nAndrew Bailey said the central bank is watching the huge amounts of money being invested in AI \"very carefully\" and cautioned that \"not everybody always wins\".\nThe money that has been spent on and loaned to AI firms over the last few years in the hope of large returns is causing markets to value some of them as multi-trillion dollar businesses.\nAsked if he believed an AI bubble could burst, Bailey said: \"You could see some correction of asset prices at some point.\"\nHe was speaking exclusively to the BBC about what the risks and benefits of AI could be for the UK economy.\nBailey said he believed the technology has \"great potential to strengthen growth in our economies\", adding that this was something the country needed.\n\"But it also brings with it substantial risks and so we have to be on top of both of those.\"\nOne such risk is what happens if the big bets being made on AI don't pay off.\nAI chipmaker Nvidia is currently the world's most valuable listed company, with a market valuation of $5.5tn (£4.14tn), thanks largely to investors who believe in the big profits AI could create.\nMeanwhile, tech giants Alphabet, Meta, Microsoft, and Amazon are spending hundreds of billions of dollars on the technology.\nAnd two of the largest AI companies in the world – Anthropic and OpenAI – are also preparing to sell shares in their firms on the US stock market in moves which many believe will lead to hundreds of billions of dollars more flowing into the industry.\n\"There is a large, very large, amount of investment going into this sector now, and of course that's natural because it's a major area of growth,\" said Bailey.\n\"And of course you see that the asset prices of the companies that are developing it have gone up a lot and that reflects the fact that there are high expectations of what it can deliver.\"\n\"Everybody is currently priced to be a winner,\" he added, but warned that \"you look back at the past, not everybody is a winner\".\n\"Google was not the first market leader in internet search. It was Netscape. Nobody can remember Netscape today. It doesn't exist. So not everybody always wins.\n\"We are prepared for the fact that there will be, I think, some shocks come along to markets and we have to deal with that. We have to make sure the system is resilient.\"\nCyber attacks, deepfakes, and interest rates\nBailey also pointed to other risks from AI, such as from the technology being used for cyber attacks.\nHe said AI has created a \"much more powerful way of uncovering vulnerabilities\".\n\"It's revealing things that have been in bits of operating software that we've had, and all of us have had.\"\n\"In the wrong hands... it's a very powerful, potentially very powerful, weapon,\" he added.\nAnother risk is the rise of deepfakes – AI-made pictures and videos of people that look real – which can be used to fool the public.\nBailey has had first-hand experience of this. In June, deepfake images depicting him and Nigel Farage having a physical fight were promoted on social media platform X.\nHe told the BBC that the fake images were being done in such a way that the Bank has struggled to find out where they came from.\n\"We've got to be able to trace these things back. And we need a lot of help from the tech sector to do that,\" he said.\nHowever, Bailey said a big potential benefit from AI is its ability of \"speeding up the work that supports the Monetary Policy Committee [MPC]\" which sets interest rates.\n\"It's not taking a decision, but it's a tool in the hands of the policy maker and that's good,\" he said.\n- Published15 hours ago\n- Published1 day ago",

    "id": "south-korean-president-lee-pushes-back-o-76c03093",
    "title": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation",
    "titleJa": "South Korean President Lee pushes back on Alaska LNG project after Trump touts Seoul's participation",
    "summaryJa": "The U.S. announced plans for up to $200 billion in South Korean investment, though Seoul has yet to finalize the participation in the Alaska LNG project.",
    "bodyOriginal": "South Korea's \"historic\" $200 billion investment into the U.S., which President Donald Trump said would transform his country \"for generations,\" is not a done deal in totality.\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\nThe joint joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.\nOverall, the investment package includes $22.3 billion for a 6,472-megawatt natural gas power facility in Encinal, Texas, that will supply electricity to co-located data centers. The project will be led by developer Related Companies and U.S. power company NextEra Energy, with the first phase expected to begin commercial operations in 2029 and the full facility coming online in stages by 2032.\nTrump said the investments would turn South Korea's commitments into \"huge construction projects\" and create \"tens of thousands of American jobs.\"\n\"These are massive energy projects, adding power capacity in the United States,\" Trump said. \"This is new construction, new manufacturing, and great jobs for American workers.\"\nThe two countries said they would seek to expand Korean companies' participation in the Texas project across equipment supply, engineering and construction, as well as long-term operations and maintenance. The U.S. also intends to give Korean companies opportunities to supply equipment, including turbines, to similar projects in the country.\nAnother $120 billion has been allocated to plans for eight large-scale nuclear reactors in the U.S. Of that amount, $100 billion is earmarked for construction costs and $20 billion for contingency reserves.\nThe nuclear agreement was signed by both governments as well as Westinghouse Electric, Korea Electric Power Corp. and Korea Hydro & Nuclear Power. The plan also calls for pursuing a potential significant minority investment in Westinghouse by Korean companies, with the terms subject to commercial negotiations.",
    "bodyJa": "South Korea's \"historic\" $200 billion investment into the U.S., which President Donald Trump said would transform his country \"for generations,\" is not a done deal in totality.\nThe South Korean investment plan includes nuclear power plants, a natural gas power facility in Texas and potentially the long-planned Alaska LNG project.\nTrump in a Truth Social post late Wednesday stateside said the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion, drawing a response from South Korea's President Lee Jae Myung, who emphasized that involvement in some of the projects remains subject to commercial considerations.\nLee in an X post on Thursday local time said that participation in the Alaska LNG project was dependent on its financial viability and legal compliance. He added that investments in nuclear power plants would also require assessment of commercial viability on a plant-by-plant basis.\nTrump had hailed South Korean investments in his post late Wednesday stateside, saying that the countries had agreed to work on the Alaska LNG project, pegging its value at $50 billion.\nThe joint joint statement earlier on Wednesday, however, had mentioned that work on the project was contingent on \"commercial reasonableness,\" without highlighting details on allocations toward the project.\nThe Alaska LNG project seeks to transport natural gas roughly 1,300 kilometers from fields on Alaska's North Slope to the southern part of the state, where it would be liquefied for export to markets including Asia, reported Yonhap. The project has faced longstanding questions over its economics given the large upfront investment required.\nIndustry Minister Kim Jung-kwan had described it as \"high-risk\" last year and said participation would be difficult unless it could generate sufficient cash flow.\nOverall, the investment package includes $22.3 billion for a 6,472-megawatt natural gas power facility in Encinal, Texas, that will supply electricity to co-located data centers. The project will be led by developer Related Companies and U.S. power company NextEra Energy, with the first phase expected to begin commercial operations in 2029 and the full facility coming online in stages by 2032.\nTrump said the investments would turn South Korea's commitments into \"huge construction projects\" and create \"tens of thousands of American jobs.\"\n\"These are massive energy projects, adding power capacity in the United States,\" Trump said. \"This is new construction, new manufacturing, and great jobs for American workers.\"\nThe two countries said they would seek to expand Korean companies' participation in the Texas project across equipment supply, engineering and construction, as well as long-term operations and maintenance. The U.S. also intends to give Korean companies opportunities to supply equipment, including turbines, to similar projects in the country.\nAnother $120 billion has been allocated to plans for eight large-scale nuclear reactors in the U.S. Of that amount, $100 billion is earmarked for construction costs and $20 billion for contingency reserves.\nThe nuclear agreement was signed by both governments as well as Westinghouse Electric, Korea Electric Power Corp. and Korea Hydro & Nuclear Power. The plan also calls for pursuing a potential significant minority investment in Westinghouse by Korean companies, with the terms subject to commercial negotiations.",

    "id": "passengers-and-crew-foil-co-pilot-s-appa-4c364129",
    "title": "Passengers and crew foil co-pilot's apparent attempt to crash FlyDubai flight to Israel",
    "titleJa": "Passengers and crew foil co-pilot's apparent attempt to crash FlyDubai flight to Israel",
    "summaryJa": "One of the pilots on a FlyDubai flight headed for Israel stabbed the second pilot, according to Israeli Prime Minister Benjamin Netanyahu.",
    "bodyOriginal": "On-duty flight crew and passengers managed to foil a pilot's apparent attempt to crash a FlyDubai flight, after reports emerged of a fight in the cockpit.\nThe incident on flight FZ1073 from Dubai to Tel Aviv happened when a co-pilot stabbed a pilot, according to Israeli Prime Minister Benjamin Netanyahu, who praised the victim's quick thinking.\n\"Despite being stabbed and seriously injured, he fought back, resisted, opened the cockpit door, and enabled passengers and crew to overpower the attacker — preventing a catastrophic mid-air disaster. He saved the lives of 174 people, including Israeli citizens and other nationals,\" Netanyahu wrote in a post on X.\nFZ1073 was diverted to the Tabuk airport in Saudi Arabia, the airline said, after being successfully secured and diverted by flight crew.\nFlyDubai in a statement said that an \"altercation\" occurred on the flight deck of the plane, but did not mention a stabbing.\nHowever, the airline added that the underlying reasons and motives for the clash is currently unknown, urging all parties to refrain from speculation.\nThe injured pilot was identified by Netanyahu as Indian national Smit Machchhar. No details have been released on the identity of the attacker, except that he was being interrogated by Saudi authorities.\nThe Indian embassy in Riyadh said on X that Machchhar is in a hospital in Tabuk, and is reported to be in stable condition.\nThe Israeli Prime Minister also identified the passenger who broke into the cockpit as Yaniv Hayun, calling him a \"hero\" and adding he deserved \"a global medal of honor.\"\nFlight data from tracking site FlightRadar24 showed that the plane had experienced extreme altitude fluctuations before broadcasting a \"general emergency\" squawk code.\nFZ1073 had dropped from over 14,000 feet in just 29 seconds, and FlightRadar24 also added that vertical speeds ranging from approximately -30,000 to +10,000 feet per minute were observed from the transponder data.\nFor context, vertical speeds during normal operations rarely exceed plus or minus 4,000 feet per minute, it added.",
    "bodyJa": "On-duty flight crew and passengers managed to foil a pilot's apparent attempt to crash a FlyDubai flight, after reports emerged of a fight in the cockpit.\nThe incident on flight FZ1073 from Dubai to Tel Aviv happened when a co-pilot stabbed a pilot, according to Israeli Prime Minister Benjamin Netanyahu, who praised the victim's quick thinking.\n\"Despite being stabbed and seriously injured, he fought back, resisted, opened the cockpit door, and enabled passengers and crew to overpower the attacker — preventing a catastrophic mid-air disaster. He saved the lives of 174 people, including Israeli citizens and other nationals,\" Netanyahu wrote in a post on X.\nFZ1073 was diverted to the Tabuk airport in Saudi Arabia, the airline said, after being successfully secured and diverted by flight crew.\nFlyDubai in a statement said that an \"altercation\" occurred on the flight deck of the plane, but did not mention a stabbing.\nHowever, the airline added that the underlying reasons and motives for the clash is currently unknown, urging all parties to refrain from speculation.\nThe injured pilot was identified by Netanyahu as Indian national Smit Machchhar. No details have been released on the identity of the attacker, except that he was being interrogated by Saudi authorities.\nThe Indian embassy in Riyadh said on X that Machchhar is in a hospital in Tabuk, and is reported to be in stable condition.\nThe Israeli Prime Minister also identified the passenger who broke into the cockpit as Yaniv Hayun, calling him a \"hero\" and adding he deserved \"a global medal of honor.\"\nFlight data from tracking site FlightRadar24 showed that the plane had experienced extreme altitude fluctuations before broadcasting a \"general emergency\" squawk code.\nFZ1073 had dropped from over 14,000 feet in just 29 seconds, and FlightRadar24 also added that vertical speeds ranging from approximately -30,000 to +10,000 feet per minute were observed from the transponder data.\nFor context, vertical speeds during normal operations rarely exceed plus or minus 4,000 feet per minute, it added.",

  {
    "id": "the-ai-telling-farmers-when-to-harvest-ab1be124",
    "title": "The AI telling farmers when to harvest",
    "titleJa": "The AI telling farmers when to harvest",
    "summaryJa": "Will farmers want AI tools to help judge when to pick fruit, or is their own intuition enough?",
    "bodyOriginal": "The AI telling farmers when to harvest\n- Published\nWhen the first day of the apple harvest rolled around in Washington State last year, the fruit was ripe and the pickers were ready – but the weather had other ideas.\n\"It was like 38C… it's not safe for people to work in that heat,\" recalls Joel Carter at Okanagan Specialty Fruits. \"We had to stop at 10 o'clock in the morning.\"\nHe says that artificial intelligence (AI) models that forecast ideal harvest dates, taking into account the weather, would be useful. \"You need to know more than just when your fruit is going to be ripe. How long do you have to pick it?\" he says. \"That's where these models are really helpful.\"\nCarter's company has more than 1,250 acres of apple orchards in Washington, and the fruit is grown for sliced apple portions – often sold to hotels and schools, for example. The firm is investing in technology with the hope of maximising productivity. Even the apples are genetically engineered so that they don't brown easily once cut.\nBut planning a harvest is tricky. New tools that count and analyse fruit on the tree or vine, and predict when crops will ripen, are emerging. It matters because prices for fruit, especially high-value berries such as strawberries or blueberries can fluctuate wildly. Getting the harvest date wrong means you book seasonal workers when you don't actually need them, and risk missing out on the biggest profits.\nOkanagan Specialty Fruits is already experimenting with cameras from a Canadian firm called Vivid Machines. The cameras are mounted atop tractors and they scoop up imagery of the apple trees as the tractor trundles by. AI identifies buds, flowers or fruit in that footage.\n\"Right now, Vivid is telling us crop estimates and harvest dates,\" says Carter. He notes that the system is good at picking out very tiny flower buds, which are hard to see at a glance with the naked eye.\nBut the accuracy of forecasts is noticeably dependent on the quality of historical information fed in to the system, adds Carter. \"This isn't something where an AI can scrape the internet and figure out what's the average [yield] for Granny Smith,\" he explains. \"It's going to be bespoke to your farm.\"\nApples are at least somewhat forgiving – the harvest window for those Granny Smiths is three weeks long, says Carter. For other fruit, such as berries, you might only have a few days.\n\"If a strawberry crop is on, you have to harvest it – otherwise your entire crop gets diseased very, very quickly,\" says Raymond Martin, co-founder and chief operating officer of FruitCast, a UK company that offers harvest forecasts to fruit growers here.\nHis firm offers growers crop predictions for strawberries and also raspberries, blackberries, blueberries and tomatoes. \"We're moving on to grapes next year,\" adds Martin.\nDon't experienced farmers know when their fruit will be ripe, I ask? Martin says they generally do – but not necessarily across their entire farm, which might be many acres in size, or have both outdoor and indoor growing areas. \"We do exactly what the farmers could do but we just do it on a scale that they can't.\"\nThe system analyses footage of ripening fruit that can be captured by drones, someone walking up and down a field with a smartphone, or a camera mounted on a farm vehicle.\nThis year has been challenging, notes Martin, with hot weather and severe drought hitting much of the UK. This has stressed many fruit plants, putting them into thermal dormancy and slowing down fruit production.\nThe FruitCast model accounts for weather and irrigation conditions in its forecasts. The company says, \"our forecasts land within 10% of actual picked volume one week out (90% accurate) and within 17% three weeks out (83% accurate). We guarantee less than 20% error…\"\nAngus Soft Fruits is one company that has worked with FruitCast. AI tech for forecasting fruit ripeness is not yet \"a finished solution\" says operations director Neill Finlayson: \"This journey is still ongoing and, whilst significant progress has been made, the industry remains some way from achieving a fully integrated forecasting ecosystem.\"\nDriscoll's, a California headquartered fruit seller with a big operation in the UK, also confirmed to BBC News that some of its independent fruit growers in the UK have used FruitCast's technology.\nResearchers are also exploring new ways of analysing fruit in intense detail. Many farmers already use handheld brix meters to gauge the sugar content of their crop. These devices work by measuring how much light has changed direction, or refracted, after passing through a liquid – indicating the volume of solids present.\nSome such meters use infrared light, meaning there's no need to cut into the fruit to take measurements. But Yasaman Ghasempour at Princeton University says millimetre waves, high frequency radio waves, can penetrate deeper \"They basically respond very well to humidity, water [and sugar],\" she says.\nShe and her students have come up with a millimetre wave-based ripeness detector, external that could be used by farmers – or even customers searching for perfectly ripe fruit in shops. Her students tried it out at a local market in New Jersey. \"[Staff] there got kind of scared that we were doing something shady,\" laughs Ghasempour.\nSuch fine-grained analysis of fruit, if currently unripe, could also help inform forecasts of when it will be ripe.\nBut while some growers, such as Carter, are interested in trying out new tech, many will wonder whether investing in it is really worthwhile. \"Adoption is very complicated,\" says Jing Zhang at North Carolina State University. \"The grower has to have confidence in the research and whether or not it works.\"\nZhang has been working on a system to automatically count the number of blueberries, external captured in smartphone images of blueberry bushes.\nThe simplest systems need not be expensive. Kevin Wang at the University of Florida has developed another crop-counting tool that can harvest imagery, external from $100 (£74) drones.\nIn the future, such information could feed in to ripeness predictions. However, he points out that some farmers might be uneasy about sharing commercially sensitive information about their growing strategies, such as fertiliser and irrigation plans, with third parties and AI models.\nBen Palone is senior director of automation and commercialisation at Western Growers, an association that represents farmers in the western US. He says harvest forecasts have some potential as \"an optimisation tool\".\nBut farmers will likely continue to rely on human intelligence. \"Growers like to have people in the mix to make some of those very critical decisions – especially when it comes to harvests,\" he says.\n- Published19 August\n- Published12 August\n- Published7 August",
    "bodyJa": "The AI telling farmers when to harvest\n- Published\nWhen the first day of the apple harvest rolled around in Washington State last year, the fruit was ripe and the pickers were ready – but the weather had other ideas.\n\"It was like 38C… it's not safe for people to work in that heat,\" recalls Joel Carter at Okanagan Specialty Fruits. \"We had to stop at 10 o'clock in the morning.\"\nHe says that artificial intelligence (AI) models that forecast ideal harvest dates, taking into account the weather, would be useful. \"You need to know more than just when your fruit is going to be ripe. How long do you have to pick it?\" he says. \"That's where these models are really helpful.\"\nCarter's company has more than 1,250 acres of apple orchards in Washington, and the fruit is grown for sliced apple portions – often sold to hotels and schools, for example. The firm is investing in technology with the hope of maximising productivity. Even the apples are genetically engineered so that they don't brown easily once cut.\nBut planning a harvest is tricky. New tools that count and analyse fruit on the tree or vine, and predict when crops will ripen, are emerging. It matters because prices for fruit, especially high-value berries such as strawberries or blueberries can fluctuate wildly. Getting the harvest date wrong means you book seasonal workers when you don't actually need them, and risk missing out on the biggest profits.\nOkanagan Specialty Fruits is already experimenting with cameras from a Canadian firm called Vivid Machines. The cameras are mounted atop tractors and they scoop up imagery of the apple trees as the tractor trundles by. AI identifies buds, flowers or fruit in that footage.\n\"Right now, Vivid is telling us crop estimates and harvest dates,\" says Carter. He notes that the system is good at picking out very tiny flower buds, which are hard to see at a glance with the naked eye.\nBut the accuracy of forecasts is noticeably dependent on the quality of historical information fed in to the system, adds Carter. \"This isn't something where an AI can scrape the internet and figure out what's the average [yield] for Granny Smith,\" he explains. \"It's going to be bespoke to your farm.\"\nApples are at least somewhat forgiving – the harvest window for those Granny Smiths is three weeks long, says Carter. For other fruit, such as berries, you might only have a few days.\n\"If a strawberry crop is on, you have to harvest it – otherwise your entire crop gets diseased very, very quickly,\" says Raymond Martin, co-founder and chief operating officer of FruitCast, a UK company that offers harvest forecasts to fruit growers here.\nHis firm offers growers crop predictions for strawberries and also raspberries, blackberries, blueberries and tomatoes. \"We're moving on to grapes next year,\" adds Martin.\nDon't experienced farmers know when their fruit will be ripe, I ask? Martin says they generally do – but not necessarily across their entire farm, which might be many acres in size, or have both outdoor and indoor growing areas. \"We do exactly what the farmers could do but we just do it on a scale that they can't.\"\nThe system analyses footage of ripening fruit that can be captured by drones, someone walking up and down a field with a smartphone, or a camera mounted on a farm vehicle.\nThis year has been challenging, notes Martin, with hot weather and severe drought hitting much of the UK. This has stressed many fruit plants, putting them into thermal dormancy and slowing down fruit production.\nThe FruitCast model accounts for weather and irrigation conditions in its forecasts. The company says, \"our forecasts land within 10% of actual picked volume one week out (90% accurate) and within 17% three weeks out (83% accurate). We guarantee less than 20% error…\"\nAngus Soft Fruits is one company that has worked with FruitCast. AI tech for forecasting fruit ripeness is not yet \"a finished solution\" says operations director Neill Finlayson: \"This journey is still ongoing and, whilst significant progress has been made, the industry remains some way from achieving a fully integrated forecasting ecosystem.\"\nDriscoll's, a California headquartered fruit seller with a big operation in the UK, also confirmed to BBC News that some of its independent fruit growers in the UK have used FruitCast's technology.\nResearchers are also exploring new ways of analysing fruit in intense detail. Many farmers already use handheld brix meters to gauge the sugar content of their crop. These devices work by measuring how much light has changed direction, or refracted, after passing through a liquid – indicating the volume of solids present.\nSome such meters use infrared light, meaning there's no need to cut into the fruit to take measurements. But Yasaman Ghasempour at Princeton University says millimetre waves, high frequency radio waves, can penetrate deeper \"They basically respond very well to humidity, water [and sugar],\" she says.\nShe and her students have come up with a millimetre wave-based ripeness detector, external that could be used by farmers – or even customers searching for perfectly ripe fruit in shops. Her students tried it out at a local market in New Jersey. \"[Staff] there got kind of scared that we were doing something shady,\" laughs Ghasempour.\nSuch fine-grained analysis of fruit, if currently unripe, could also help inform forecasts of when it will be ripe.\nBut while some growers, such as Carter, are interested in trying out new tech, many will wonder whether investing in it is really worthwhile. \"Adoption is very complicated,\" says Jing Zhang at North Carolina State University. \"The grower has to have confidence in the research and whether or not it works.\"\nZhang has been working on a system to automatically count the number of blueberries, external captured in smartphone images of blueberry bushes.\nThe simplest systems need not be expensive. Kevin Wang at the University of Florida has developed another crop-counting tool that can harvest imagery, external from $100 (£74) drones.\nIn the future, such information could feed in to ripeness predictions. However, he points out that some farmers might be uneasy about sharing commercially sensitive information about their growing strategies, such as fertiliser and irrigation plans, with third parties and AI models.\nBen Palone is senior director of automation and commercialisation at Western Growers, an association that represents farmers in the western US. He says harvest forecasts have some potential as \"an optimisation tool\".\nBut farmers will likely continue to rely on human intelligence. \"Growers like to have people in the mix to make some of those very critical decisions – especially when it comes to harvests,\" he says.\n- Published19 August\n- Published12 August\n- Published7 August",

    "title": "Vape prices to rise as new tax takes effect",
    "titleJa": "Vape prices to rise as new tax takes effect",
    "summaryJa": "Vape prices to rise as new tax takes effect- Published",
    "bodyOriginal": "Vape prices to rise as new tax takes effect\n- Published\nThe price of vapes is set to rise as a new tax comes into effect, with the aim of making vaping less attractive to children and young people.\nThe Vaping Product Duty will be imposed at a rate of £2.20 per 10ml of e-liquid. However, many customers will not see a jump in prices immediately, as sellers have six months to sell old stock at the pre-duty price.\nThe government wants to reduce the appeal of vapes by making them more expensive, as more evidence of its adverse effect on health comes out, particularly on children and young people.\nThe vaping industry has lobbied against the new tax, saying that affordable vapes help people to quit smoking.\nThe duty will apply to all vaping products regardless of whether they contain nicotine.\nTobacco rates were also raised on Thursday, by £2.20 per 100 cigarettes or 50g of tobacco. HMRC said this maintains the financial incentive for smokers to switch to vaping.\nStocking up v cutting down\nThe BBC spoke to vapers in Reading who had mixed views on whether the new tax would encourage people to quit.\nMackenzie Bird, 19, has been a regular vaper for three years. She said she was \"fine\" with the duty and it wouldn't stop her from vaping.\n\"I don't know how many people it'll actually deter,\" she said.\n\"I'll probably just stock up.\"\nHowever, Cara Lewis-Rimes and Dylan Killner said they might reconsider the habit in light of higher prices.\nCara said she thinks the changes will force vapers to cut down because of the cost of living.\nDylan said he might be inclined to quit altogether.\n\"I don't think it's doing me any favours... the health factor around it as well is not great.\"\nFighting illegal trade\nHMRC is also launching a stamp for vaping products which are traceable throughout the supply chain.\nAll vapes sold in the UK must carry this stamp from April.\nThe new tax is also an effort to combat illicit trade, which is a growing problem on UK high streets. Last month, the prime minister announced new powers for councils that will address the decline of the high street, including the amount of vape shops.\nChanges to planning law in England mean every new shop selling e-cigarettes, or vapes, would need to apply to their local council for permission to open.\nHealth Minister Karin Smyth said: \"These measures are an important step in our ambition to tackle youth vaping by reducing the affordability of vaping products, which goes hand-in-hand with the work we are already doing to tackle the appeal and availability of vapes on our high streets.\"\nJames Murray, the Financial Secretary to the Treasury, said the government was \"backing all those retailers who play by the rules\".\nBut Jordan Apap, a sales assistant in Berkshire Vapers, said the new tax would \"put a lot of strain on legitimate vape shops\" that provide more specialist advice and services than convenience stores and phone shops that sell vapes.\n\"There is a real and genuine risk that we will cease to exist within a year or two,\" he said.\nVaping rates for schoolchildren appear to drop - is it falling out of favour?\n- Published22 September\nPolice raid barbers and vape shops suspected of being fronts for crime gangs\n- Published10 April 2025\nJohn Dunne, the director general of the UK Vaping Industry Association, said: \"This is nothing short of a tax on public health.\"\nHe said vapes had helped \"millions of adults cut down on or stop smoking\".\n\"Protecting young people is essential. But that means stronger enforcement against illegal and rogue traders, not making legal vaping more expensive for adults trying to stay away from cigarettes.\"\nExperts say vaping is much safer than smoking, but it is not risk free and the long-term effects are less clear.\nA recent review of vaping studies found that it had an association with problems in children and young people including wheezing and coughing, poor oral and dental health, poor sleep, mental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha",

K high streets. Last month, the prime minister announced new powers for councils that will address the decline of the high street, including the amount of vape shops.\nChanges to planning law in England mean every new shop selling e-cigarettes, or vapes, would need to apply to their local council for permission to open.\nHealth Minister Karin Smyth said: \"These measures are an important step in our ambition to tackle youth vaping by reducing the affordability of vaping products, which goes hand-in-hand with the work we are already doing to tackle the appeal and availability of vapes on our high streets.\"\nJames Murray, the Financial Secretary to the Treasury, said the government was \"backing all those retailers who play by the rules\".\nBut Jordan Apap, a sales assistant in Berkshire Vapers, said the new tax would \"put a lot of strain on legitimate vape shops\" that provide more specialist advice and services than convenience stores and phone shops that sell vapes.\n\"There is a real and genuine risk that we will cease to exist within a year or two,\" he said.\nVaping rates for schoolchildren appear to drop - is it falling out of favour?\n- Published22 September\nPolice raid barbers and vape shops suspected of being fronts for crime gangs\n- Published10 April 2025\nJohn Dunne, the director general of the UK Vaping Industry Association, said: \"This is nothing short of a tax on public health.\"\nHe said vapes had helped \"millions of adults cut down on or stop smoking\".\n\"Protecting young people is essential. But that means stronger enforcement against illegal and rogue traders, not making legal vaping more expensive for adults trying to stay away from cigarettes.\"\nExperts say vaping is much safer than smoking, but it is not risk free and the long-term effects are less clear.\nA recent review of vaping studies found that it had an association with problems in children and young people including wheezing and coughing, poor oral and dental health, poor sleep, mental health problems and eye symptoms.\nThe NHS has said that children and non-smokers should never vape.\nAdditional reporting by Neranjana Elapatha",

    "title": "Energy bills are going up - here's what you can do about it",
    "titleJa": "Energy bills are going up - here's what you can do about it",
    "summaryJa": "Household energy bills have risen again but there are ways to keep a lid on your expenditure.",
    "bodyOriginal": "Energy bills are going up - here's what you can do about it\n- Published\nEnergy prices have now risen by nearly 4%, with forecasts of a much bigger jump to come in January.\nRegulator Ofgem's price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity.\nForecasters have suggested a 16% increase is possible in January, due to high wholesale prices paid by suppliers as a result of the conflict in the Middle East.\nWhile that's beyond consumers' control, charities say the government should offer more support - beyond a VAT cut on electricity bills which takes effect on Thursday - and households should reset for winter again.\nThat includes reading the meter now, and taking other steps to keep a check on rising bills.\n1. Consider switching to a fixed rate\nThe energy regulator, Ofgem, is advising people to consider fixing - so that the price you are charged per unit of gas or electricity does not change every three months, although the total bill will still vary depending on how much energy you use.\nThe trouble is that it is very difficult to work out whether a fixed deal is a good deal at the moment.\nShould energy prices rise sharply, then those who have fixed already have the certainty of what they will pay for each unit of energy. That price may well be lower than the forecast price in January.\nHowever, if events in the Gulf region settle down, and a peace deal in the Iran war leads to lower international gas prices, then a longer-term fix might not seem such good value compared with the price cap.\nSo consumer group Which? also recommends keeping an eye on any exit fees when picking a fixed deal. If variable prices fall below your fixed rate and you want to get out of it before the end of your agreement period, you may have to pay a hefty sum.\nBefore you fix, consumer website MoneySavingExpert advises you look at all the deals available, not just what your own supplier is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",
    "bodyJa": "Energy bills are going up - here's what you can do about it\n- Published\nEnergy prices have now risen by nearly 4%, with forecasts of a much bigger jump to come in January.\nRegulator Ofgem's price cap affects about 20 million households in England, Scotland and Wales and sets a maximum price for each unit of gas and electricity.\nForecasters have suggested a 16% increase is possible in January, due to high wholesale prices paid by suppliers as a result of the conflict in the Middle East.\nWhile that's beyond consumers' control, charities say the government should offer more support - beyond a VAT cut on electricity bills which takes effect on Thursday - and households should reset for winter again.\nThat includes reading the meter now, and taking other steps to keep a check on rising bills.\n1. Consider switching to a fixed rate\nThe energy regulator, Ofgem, is advising people to consider fixing - so that the price you are charged per unit of gas or electricity does not change every three months, although the total bill will still vary depending on how much energy you use.\nThe trouble is that it is very difficult to work out whether a fixed deal is a good deal at the moment.\nShould energy prices rise sharply, then those who have fixed already have the certainty of what they will pay for each unit of energy. That price may well be lower than the forecast price in January.\nHowever, if events in the Gulf region settle down, and a peace deal in the Iran war leads to lower international gas prices, then a longer-term fix might not seem such good value compared with the price cap.\nSo consumer group Which? also recommends keeping an eye on any exit fees when picking a fixed deal. If variable prices fall below your fixed rate and you want to get out of it before the end of your agreement period, you may have to pay a hefty sum.\nBefore you fix, consumer website MoneySavingExpert advises you look at all the deals available, not just what your own supplier is offering.\n2. Pay by direct debit\nOfgem says about five million people still pay their bill when it arrives every three months. For some that's because they do not want their supplier to estimate their usage in case they are overcharged.\nTaking regular meter readings, or having a smart meter, while paying by monthly direct debit solves that problem. Moreover, paying by direct debit costs less per unit than by so-called standard credit.\nYou will usually - although not always - need to switch to direct debit if you want to take advantage of the fixed deals on offer.\nCustomers on prepayment schemes - usually people on low incomes struggling to pay bills - used to pay a higher rate than others, but now they pay slightly less than the capped direct debit variable rate.\nThere are also a range of pricing schemes offering cheaper off-peak electricity, for example if you are charging an electric car overnight.\n3. Check what financial support you can get\nThere are a range of ways people on low incomes can access support.\nThis winter anyone on means-tested benefits will get £150 off their electricity bill.\nYour supplier will apply the discount automatically unless you are in Scotland, where you will need to contact your energy company to ask for the help.\nSome people will also be eligible for a Cold Weather Payment, external and most pensioners will receive the winter fuel payment, after political pressure forced the government to U-turn on its plan to restrict it to the poorest pensioners.\nBeyond that, most energy suppliers offer hardship grants for people struggling to pay their bills and the government's Fuel Direct Scheme, external can help you repay energy debt.\nYou can get more advice from Ofgem, external, Citizens Advice, external, or your own energy supplier. Trade body Energy UK has a list of support schemes, external.\nPeople on low incomes may also be eligible for grants to help with insulating their homes, and there are local schemes offering grants for solar panels, heat pumps and the like.\nBut if you are hunting around for grants, watch out for scams pretending to be official money-off schemes.\n4. Take another look at your energy use\nOnce the temperature outside starts to fall again, it is important to stay warm, especially for the very young, old, and those with health conditions or reduced mobility.\nBut there are plenty of ways you can keep bills lower without letting the temperature in your home fall below the recommended 18C minimum.\nYou may already have hung thicker curtains and blocked the draughts over the last couple of winters, but do not forget to switch off radiators in rooms you are not using and wrap up.\nMoneySavingExpert advises to \"heat the human not the home\".\nTurning down the flow rate on a combi boiler can save you money as often the water is being heated higher than it needs to be.\nBatch cooking and using an air fryer or microwave rather than heating up the oven for a small item can save energy.\nTake shorter showers and wash clothes at 30C rather than 40C. Dry clothes outdoors if you can, rather than using a tumble dryer, or hang clothes indoors but ventilate well or use a dehumidifier to avoid damp.\nIf you are thinking about moving home, or undertaking renovations, it is worth thinking through how to reduce bills. When it comes to white goods, look for energy-efficient appliances.",

    "id": "trump-thinking-about-diesel-export-ban-b-ef8c1d13",
    "title": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "titleJa": "Trump 'thinking about' diesel export ban, but says it could have 'negative impact' on gasoline",
    "summaryJa": "Trump recently said he was \"very seriously\" considering a diesel export ban, despite warnings from the U.S. oil industry that doing so would raise prices.",
    "bodyOriginal": "President Donald Trump on Wednesday said he is still \"thinking about\" banning diesel exports in an attempt to get a handle on high energy prices, but noted that doing so may have a \"negative impact on gasoline.\"\nTrump, asked in the Oval Office if he has decided on a ban, said his aides think it would help diesel \"but it might raise the price of other things.\"\n\"And I think we're in a good place because oil prices are going to start to come down,\" Trump added.\nJust three days earlier, Trump said he was \"very seriously\" considering the move, despite warnings from the U.S. oil industry that it would force refineries to cut production and ultimately raise domestic energy prices.\nBut his latest comments appeared to show him cooling to the idea of an export ban, even as he declined to rule it out entirely.\n\"We're in a very good place,\" Trump said, highlighting a recent resurgence in crude exports through the Strait of Hormuz.\nThe strait is a major throughway for the global oil trade that saw ship traffic stifled after the U.S. and Israel attacked Iran in late February. But this week it saw daily exports return to prewar levels.\nEnergy Secretary Chris Wright, standing next to Trump at the Resolute Desk, said, \"You've seen diesel prices come down the last week. I think you'll see them move meaningfully down in the coming weeks and days.\"\nBut Wright acknowledged that diesel supplies are \"tight\" because of export loss related to conflicts in Russia and the Middle East, as well as from China.\n\"So that's a lot of interruptions. But American refiners are running at record highs,\" Wright said, \"and you will hear announcements from our our friends in Europe about new diesel supplies that'll come to the market. That'll meaningfully push diesel prices down.\"\nWhen a reporter asked if Wright has advised against a diesel export ban, Trump interjected, saying, \"No, I think it's something that we think about and we talk about every day.\"\n\"But it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",
    "bodyJa": "President Donald Trump on Wednesday said he is still \"thinking about\" banning diesel exports in an attempt to get a handle on high energy prices, but noted that doing so may have a \"negative impact on gasoline.\"\nTrump, asked in the Oval Office if he has decided on a ban, said his aides think it would help diesel \"but it might raise the price of other things.\"\n\"And I think we're in a good place because oil prices are going to start to come down,\" Trump added.\nJust three days earlier, Trump said he was \"very seriously\" considering the move, despite warnings from the U.S. oil industry that it would force refineries to cut production and ultimately raise domestic energy prices.\nBut his latest comments appeared to show him cooling to the idea of an export ban, even as he declined to rule it out entirely.\n\"We're in a very good place,\" Trump said, highlighting a recent resurgence in crude exports through the Strait of Hormuz.\nThe strait is a major throughway for the global oil trade that saw ship traffic stifled after the U.S. and Israel attacked Iran in late February. But this week it saw daily exports return to prewar levels.\nEnergy Secretary Chris Wright, standing next to Trump at the Resolute Desk, said, \"You've seen diesel prices come down the last week. I think you'll see them move meaningfully down in the coming weeks and days.\"\nBut Wright acknowledged that diesel supplies are \"tight\" because of export loss related to conflicts in Russia and the Middle East, as well as from China.\n\"So that's a lot of interruptions. But American refiners are running at record highs,\" Wright said, \"and you will hear announcements from our our friends in Europe about new diesel supplies that'll come to the market. That'll meaningfully push diesel prices down.\"\nWhen a reporter asked if Wright has advised against a diesel export ban, Trump interjected, saying, \"No, I think it's something that we think about and we talk about every day.\"\n\"But it just seems that it would have a negative impact on gasoline,\" he said. \"That would go up a little bit and diesel would come down a little bit.\"\nTrump also repeated his claim that Russia's war against Ukraine was \"really the biggest problem for diesel.\"\nDiesel prices have soared to record highs amid the continuing conflicts in Iran and Ukraine, which have caused major disruptions to global energy flows. Oil prices rose on Wednesday as the prospect of U.S. talks with Iran appeared to stall out once again.",

    "summaryJa": "Paramount CEO David Ellison announced outgoing Mattel chief Ynon Kreiz will serve as the co-CEO of the anticipated combination of Paramount and WBD.",
    "bodyOriginal": "Paramount Skydance CEO David Ellison announced on Wednesday the appointment of outgoing Mattel Chief Executive Officer Ynon Kreiz as his co-CEO of the anticipated combination of Paramount and Warner Bros. Discovery.\nThe pair will lead as \"one team,\" with Kreiz set to take on the operational duties of the media company, according to a press release. Kreiz will become co-CEO effective at the closing of the merger and will also join the company's board of directors.\n\"Ellison will focus on the company's long-term strategy, creative vision and direction, including its talent relationships, strategic partnerships, technology and capital allocation,\" Paramount stated in the release. \"Kreiz will focus on the company's day-to-day management and integration of the combined businesses.\"\nThe announcement comes less than two weeks after Paramount settled an antitrust lawsuit with a group of state attorneys general that sought to block the $110 billion merger. A federal judge on Wednesday entered an order to allow the merger to close.\n\"Bringing together Paramount and Warner Bros. Discovery to create a next-generation global media company is a transformational moment for our industry,\" said Ellison in the release. \"Leading it takes a rare combination of strategic vision, operational depth and experience running a public company at the highest levels of media. Ynon brings all three.\"\nEarlier on Wednesday, Mattel announced Kreiz was departing the company after eight years in the top job. During his tenure, Kreiz led the company through major transformations and oversaw the release of \"Barbie,\" the highest-grossing domestic film release of 2023.\nThe events on Wednesday set up the end of a long back-and-forth battle through which Ellison has sought to expand his media empire.\nHe first set his sights on Warner Bros. Discovery in September 2025 and since then has faced a bidding war against Netflix and a legal challenge over antitrust concerns. The transaction, which will be one of the largest media mergers in history, is expected to be completed in the coming weeks.",

    "title": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold",
    "titleJa": "Micron beats on earnings and issues strong guidance as data center revenue jumps 11-fold",
    "summaryJa": "Micron is up over 500% in the past year as the company benefits from soaring AI demand.",
    "bodyOriginal": "Micron reported better-than-expected quarterly results on Wednesday as the memory maker continues to benefit from soaring demand for AI infrastructure. The stock rose slightly in extended trading.\nHere's how the company did relative to LSEG consensus:\n- Earnings per share: $33.42 adjusted vs. $31.61 expected\n- Revenue: $54.23 billion vs. $51.07 billion expected\nRevenue almost quadrupled in the fiscal fourth quarter from $11.32 billion a year earlier, according to a statement.\nFor the fiscal first quarter, Micron said it expects revenue of about $61.5 billion and adjusted earnings per share of $38.15. Analysts polled by LSEG had expected $35.40 in adjusted earnings per share on $57 billion in revenue.\nMicron's stock has soared more than 500% in the past year, benefiting from a worldwide supply crunch caused by historic levels of demand for memory chips needed for artificial intelligence models and workloads. The shortage has led to a spike in memory costs and resulted in increased prices for consumer electronics like Apple's iPads and MacBooks.\nHendi Susanto, portfolio at Gabelli Funds, said in an email after the release that it was \"another strong beat and raise for Micron.\"\n\"At this point, I have not heard any negative data points pointing to the memory cycle reversing toward a decline anytime soon for the foreseeable future,\" Susanto wrote.\nMicron is the only U.S.-based maker of high-bandwidth memory, HBM, made up of stacks of general-purpose dynamic random-access memory, or DRAM. Fourth-quarter DRAM revenue increased 343% from a year ago to $39.8 billion, representing 73% of total sales.\nCEO Sanjay Mehrotra said on the earnings call that the company has a \"strong roadmap for future HBM products\" and is working with Nvidia on the industry's \"first custom HBM implementation.\"\nNet income in the latest quarter climbed to $37.7 billion, or $32.87 per share, from $3.2 billion, or $2.83 per share a year ago.\nAdvanced graphics and central processors from chip giants like Nvidia and AMD need increasing amounts of HBM to handle AI workloads, and the world's leading providers can't make enough.\nThat's why Micron is investing $250 billion to build two new campuses for making HBM. The largest broke ground in Clay, New York, in January, while its first new fab in Boise, Idaho, is scheduled to come online next year.\nHBM leaders SK Hynix and Samsung are also in the midst of massive new HBM factory buildouts in their home country of South Korea. Micron holds the smallest HBM market share of the three, but its market cap has still topped $1.2 trillion.\nMehrotra participated in a summit on AI regulation hosted by President Donald Trump on Tuesday, days after attending a White House dinner with Chinese President Xi Jinping on his first visit to the U.S. in more than a decade.\nOn the call, Mehrotra said Micron increased compensation for every employee in fiscal 2026. Hundreds of Micron staffers threatened to strike at its factories in Taiwan over labor negotiations and pay. Similar strikes at rivals SK Hynix and Samsung have result in bonuses upwards of $500,000.\nWATCH: Micron's $50 billion buildout in its hometown of Boise is minting millionaires",
    "bodyJa": "Micron reported better-than-expected quarterly results on Wednesday as the memory maker continues to benefit from soaring demand for AI infrastructure. The stock rose slightly in extended trading.\nHere's how the company did relative to LSEG consensus:\n- Earnings per share: $33.42 adjusted vs. $31.61 expected\n- Revenue: $54.23 billion vs. $51.07 billion expected\nRevenue almost quadrupled in the fiscal fourth quarter from $11.32 billion a year earlier, according to a statement.\nFor the fiscal first quarter, Micron said it expects revenue of about $61.5 billion and adjusted earnings per share of $38.15. Analysts polled by LSEG had expected $35.40 in adjusted earnings per share on $57 billion in revenue.\nMicron's stock has soared more than 500% in the past year, benefiting from a worldwide supply crunch caused by historic levels of demand for memory chips needed for artificial intelligence models and workloads. The shortage has led to a spike in memory costs and resulted in increased prices for consumer electronics like Apple's iPads and MacBooks.\nHendi Susanto, portfolio at Gabelli Funds, said in an email after the release that it was \"another strong beat and raise for Micron.\"\n\"At this point, I have not heard any negative data points pointing to the memory cycle reversing toward a decline anytime soon for the foreseeable future,\" Susanto wrote.\nMicron is the only U.S.-based maker of high-bandwidth memory, HBM, made up of stacks of general-purpose dynamic random-access memory, or DRAM. Fourth-quarter DRAM revenue increased 343% from a year ago to $39.8 billion, representing 73% of total sales.\nCEO Sanjay Mehrotra said on the earnings call that the company has a \"strong roadmap for future HBM products\" and is working with Nvidia on the industry's \"first custom HBM implementation.\"\nNet income in the latest quarter climbed to $37.7 billion, or $32.87 per share, from $3.2 billion, or $2.83 per share a year ago.\nAdvanced graphics and central processors from chip giants like Nvidia and AMD need increasing amounts of HBM to handle AI workloads, and the world's leading providers can't make enough.\nThat's why Micron is investing $250 billion to build two new campuses for making HBM. The largest broke ground in Clay, New York, in January, while its first new fab in Boise, Idaho, is scheduled to come online next year.\nHBM leaders SK Hynix and Samsung are also in the midst of massive new HBM factory buildouts in their home country of South Korea. Micron holds the smallest HBM market share of the three, but its market cap has still topped $1.2 trillion.\nMehrotra participated in a summit on AI regulation hosted by President Donald Trump on Tuesday, days after attending a White House dinner with Chinese President Xi Jinping on his first visit to the U.S. in more than a decade.\nOn the call, Mehrotra said Micron increased compensation for every employee in fiscal 2026. Hundreds of Micron staffers threatened to strike at its factories in Taiwan over labor negotiations and pay. Similar strikes at rivals SK Hynix and Samsung have result in bonuses upwards of $500,000.\nWATCH: Micron's $50 billion buildout in its hometown of Boise is minting millionaires",

    "id": "sen-hawley-openai-ceo-sam-altman-decline-af436986",
    "title": "Sen. Hawley: OpenAI CEO Sam Altman declined to testify at rogue AI hearing",
    "titleJa": "Sen. Hawley: OpenAI CEO Sam Altman declined to testify at rogue AI hearing",
    "summaryJa": "A Senate subcommittee on Wednesday is examining rogue AI, after a series of AI cyberattacks and increasing warnings about the risks of the technology.",
    "bodyOriginal": "OpenAI CEO Sam Altman declined an invitation to appear at a Senate subcommittee hearing on Wednesday on the risks of rogue artificial intelligence, according to Sen. Josh Hawley, R-Mo.\nHawley, who chairs the Senate Homeland Security and Governmental Affairs subpanel that held the hearing, sent a letter to Altman on Sept. 25 requesting his presence to \"help shed light on\nthe Subcommittee's ongoing investigation into recent rogue AI incidents involving OpenAI models.\" NBC News first reported that Altman did not accept the invitation to testify.\n\"He turned us down,\" Hawley said of Altman at the hearing. \"I think that's unfortunate because I think the American people deserve to know exactly what's going on at all of these companies. And to give us the sort of transparency that I think is needed for not just comfort, but to have an understanding of what these companies — that are the most powerful companies in the world — are doing right now with the most powerful technology ever known to man.\"\nA spokesperson for OpenAI noted that Altman received the invitation to testify on Friday, just five days ahead of the hearing. Altman on Tuesday appeared at the company's annual DevDay developer conference in San Francisco as other AI officials — including OpenAI President Greg Brockman — were in Washington meeting with President Donald Trump.\n\"OpenAI is deeply engaged with Congress on federal policies to advance AI safety, including through dozens of meetings in recent weeks with members of both parties in both chambers,\" the spokesperson said. \"We look forward to continuing to work constructively and proactively with Senator Hawley and members of Congress on federal AI safety legislation that materially raises the safety bar.\"\nHawley's overture to Altman comes weeks after he opened an investigation into OpenAI earlier this month. Hawley sought information on a cyberattack involving hundreds of OpenAI agents that broke out of their testing sandbox and hacked into the systems of another AI company called Hugging Face.\nThe cyber attack was one in a series of recent hacks involving frontier AI models that have raised alarms and prompted calls for Congress to act to rein in the rapidly evolving technology.\nHawley requested information from Altman on the cyber attack and on the existential risks of the technology and set an Oct. 1 deadline. A spokesperson for Hawley said OpenAI is expected to provide additional documents by the end of the week.\n\"The American people deserve to know the details of what went on in the Hugging Face incident and other incidents of AI models going rogue. This investigation will seek those answers,\" Hawley said in the Sept. 10 letter.",
    "bodyJa": "OpenAI CEO Sam Altman declined an invitation to appear at a Senate subcommittee hearing on Wednesday on the risks of rogue artificial intelligence, according to Sen. Josh Hawley, R-Mo.\nHawley, who chairs the Senate Homeland Security and Governmental Affairs subpanel that held the hearing, sent a letter to Altman on Sept. 25 requesting his presence to \"help shed light on\nthe Subcommittee's ongoing investigation into recent rogue AI incidents involving OpenAI models.\" NBC News first reported that Altman did not accept the invitation to testify.\n\"He turned us down,\" Hawley said of Altman at the hearing. \"I think that's unfortunate because I think the American people deserve to know exactly what's going on at all of these companies. And to give us the sort of transparency that I think is needed for not just comfort, but to have an understanding of what these companies — that are the most powerful companies in the world — are doing right now with the most powerful technology ever known to man.\"\nA spokesperson for OpenAI noted that Altman received the invitation to testify on Friday, just five days ahead of the hearing. Altman on Tuesday appeared at the company's annual DevDay developer conference in San Francisco as other AI officials — including OpenAI President Greg Brockman — were in Washington meeting with President Donald Trump.\n\"OpenAI is deeply engaged with Congress on federal policies to advance AI safety, including through dozens of meetings in recent weeks with members of both parties in both chambers,\" the spokesperson said. \"We look forward to continuing to work constructively and proactively with Senator Hawley and members of Congress on federal AI safety legislation that materially raises the safety bar.\"\nHawley's overture to Altman comes weeks after he opened an investigation into OpenAI earlier this month. Hawley sought information on a cyberattack involving hundreds of OpenAI agents that broke out of their testing sandbox and hacked into the systems of another AI company called Hugging Face.\nThe cyber attack was one in a series of recent hacks involving frontier AI models that have raised alarms and prompted calls for Congress to act to rein in the rapidly evolving technology.\nHawley requested information from Altman on the cyber attack and on the existential risks of the technology and set an Oct. 1 deadline. A spokesperson for Hawley said OpenAI is expected to provide additional documents by the end of the week.\n\"The American people deserve to know the details of what went on in the Hugging Face incident and other incidents of AI models going rogue. This investigation will seek those answers,\" Hawley said in the Sept. 10 letter.",

    "id": "crude-oil-exports-through-the-strait-of-a306098d",
    "title": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained",
    "titleJa": "Crude oil exports through the Strait of Hormuz hit prewar levels, but fuel shipments remain constrained",
    "summaryJa": "It is unclear how long the recovery can be sustained given that it relies on the U.S. military protecting tankers in the Persian Gulf.",
    "bodyOriginal": "Crude oil exports from the Strait of Hormuz have basically returned to levels normal before the Iran war, as U.S. military escorts have boosted shipments and pipelines have redirected flows.\nCrude transiting Hormuz reached a seven-day average of 13.5 million barrels per day as of Monday, which matches a prewar baseline for shipments through the strait, according to data published Wednesday by Kpler, a firm that tracks tankers and global trade flows.\nIran has claimed throughout the war that it controls Hormuz and has declared the closure of the strait multiple times. But Tehran is losing its influence as strong volumes pass through Hormuz, said Matt Smith, director of commodity research at Kpler.\nCrude oil shipments from the Middle East region, including the Persian Gulf and Red Sea, are sometimes higher than prewar levels. The region reached a seven-day average of 19.5 million bpd as of Monday, surpassing a prewar baseline of about 17 million bpd, the Kpler data showed.\nBut the recovery is uneven, said Natasha Kaneva, head of global commodities strategy at JPMorgan. The \"crude market has largely normalized even as refined product supplies remain constrained,\" Kaneva said.\nThe world faces a global fuel crisis as supplies from the Middle East are constrained and Ukraine pounds Russian refineries. Refined products shipped through Hormuz are at a seven-day average of 677,000 bpd as of Monday compared with 3.6 million bpd before the war, according to Kpler.\nCrude and product shipments together stood at a seven-day average of 14.2 million bpd, which is about 80% of the Hormuz prewar baseline of about 17 million bpd, the data showed.\nThe global fuel supply shortfall has pushed diesel prices in the U.S. to record highs, which poses a major threat to the health of the economy. President Donald Trump is considering an export ban as he faces political pressure from Republican lawmakers ahead of the midterm elections.\n\"The biggest source of pain is the diesel market,\" Francisco Blanch, head of global commodities at Bank of America, told CNBC's \"Squawk on the Street\" on Sept. 8.\nIran exports crater\nIran's own crude oil exports, meanwhile, have cratered as the U.S. Navy blockades the Islamic Republic, according to Kpler data. Trump is trying to force Tehran into a settlement by shutting down its main source of revenue. The U.S. has also ramped up its sanction campaign.\nTreasury Secretary Scott Bessent told Fox News on Sunday that Iran will make its final crude deliveries to China in about two weeks, leaving them with \"nothing left to trade for anything.\"\n\"There are some in Washington who say, let the blockade do its work — we can wait out Iran,\" Helima Croft, head of global commodity strategy at RBC Capital Markets, told CNBC's \"Power Lunch\" on Sept. 25.\nBut there is no hard evidence that U.S. economic pressure will fundamentally change Iran's positions, Scott Modell, CEO of Rapidan Energy and a former CIA officer, told CNBC's \" Squawk on The Street\" on Monday.\nIran last week offered to reopen Hormuz in seven days if the U.S. returns to the failed memorandum of understanding from June. The U.S. made major concessions under the MOU, agreeing to lift its blockade and allow Iran to negotiate with Oman a future system of administration for Hormuz.\nThe MOU collapsed over the summer into renewed fighting. Trump has rejected Iran's latest offer and told his aides that he expects to resume bombing Iran after the midterm elections, unnamed U.S. officials told The Wall Street Journal.\nHow the Gulf has adapted\nWhile the level of exports are at or near prewar levels, the security conditions in the strait are far from normal. Iran continues to fire on tankers in attacks that are sometimes lethal.\nIn response, more than 70% of the crude oil that crossed Hormuz in August switched tankers off the coast of the United Arab Emirates or Oman, according to Kpler. Shuttle tankers bring oil through Hormuz to the Gulf of Oman. The cargo is then loaded onto another tanker that delivers it to Asia.\nThis shuttle system is protected by the U.S. military and reduces the risk of exposure to attack from Iran. But it is unclear how long this system can be sustained given that it relies on U.S. military protection.\n\"It's very expensive, and it's a huge U.S. military commitment,\" Croft said.\nAnd the Gulf states don't view the \"patchwork arrangement\" of ship-to-ship transfers and military escorts as an acceptable substitute for Hormuz being open, she said.\nPipelines operated by Saudi Arabia and the United Arab Emirates are also doing a lot of heavy lifting. About 40% of Gulf crude oil now bypasses Hormuz through these pipelines, compared with 17% before the war, per Kpler.\nBut pipelines are also vulnerable to attack. The Saudis shut down their East-West pipeline earlier this month after it was damaged in a drone strike launched from Iraq. Loadings have picked up at Saudi's Red Sea port of Yanbu in a sign that the pipeline is running again.\nCrude flows remained resilient during the pipeline outage because Riyadh was able to shift its exports back through Hormuz due to the shuttle system protected by the U.S. military.\nBut the region's oil supplies could face disruption again as stalemated diplomacy raises the risk of renewed fighting.\n\"The president I think is going to escalate after the midterms, we keep hearing that the Iranians are going to escalate into the midterms,\" Rapidan's Modell said. \"The direction of travel is toward escalation.\"",
