    "bodyOriginal": "Flock boss admits surveillance firm took too long to act over police abuse\n- Published\nFlock, the US surveillance firm, is rolling out new safeguards to prevent police misuse of its technology which, its founder and chief executive admits, should have happened sooner.\nPolice have used Flock to track romantic partners, external and stalk strangers, leading to growing public backlash against the company. It has also been used to find stolen cars and missing people.\nAsked whether it had taken Flock too long to protect tens of thousands of its cameras, licence plate readers and drones from police abuse, Garrett Langley said: \"Yeah... yes.\"\nFlock is cutting the number of days most data is retained, from 30 days to seven and abnormal searches and uses will also automatically be flagged.\nFlock cameras have been used by police to not only track former and current romantic partners, but in one case, even a woman who had had an abortion, external.\nPolice across the US have quit, external or been fired, external for misuse of the technology.\nA man in Indiana recently told local news he found out through a public records request that police had set a Flock alert, external for his vehicle, despite not being suspected of any wrongdoing.\nAt least 50 cities have this year cut ties with Flock, external due to a public backlash.\nHowever, Langley told the BBC that another 16 cities that had turned off Flock services have in the last three months come back to the company. Generally, it's running at a 7:1 ratio of new customers to lost customers, he said.\nLangley said that, just six months ago, he asked in a meeting of the company's board why there seemed to be a growing public focus on Flock.\nThis was around the time that Amazon's Ring, a doorbell camera firm, cancelled a partnership with Flock after an outcry over a Super Bowl advert which sparked concern about unwanted surveillance.\n\"Historically, my point of view as a chief executive of a private company was, I don't know if I should be making these decisions. I don't know if it's my job to say how long data should be retained,\" Langley said.\nHe added that he has come to agree with groups like the American Civil Liberties Union and the Electronic Frontier Foundation that police should need an active case number to search Flock's data.\n\"They're right. I think it should be required.\"\nHe added: \"Our employees and communities have said loud and clear, they expect companies like Flock to have a stronger point of view as the expert. I resisted that because I didn't want to have that responsibility.\"\nLangley has now accepted that responsibility. At the same time as he is strengthening Flock's safeguards, he is pitching his company's products as crucial to combatting crime and improving policing in the US.\nCities that don't use Flock are effectively choosing \"to be less safe\", he claimed.\nNevertheless, he does not deny that Flock has been misused by members of law enforcement.\n\"We're only as good as the data coming in,\" Langley said. \"When you see these cases of wrongful arrest, the data was bad and the officer failed to follow the rules. But it's easier to pick a villain that's a company like us.\"\n'Easy villain'\nLangley said that, with clearly visible cameras in cities and neighbourhoods, the public increasingly, external sees the firm as an outlet for their growing concerns about privacy and technology, external.\n\"Because you can see our cameras, it's easier to get mad,\" Langley said.\nIn the US, there is no comprehensive law protecting or governing the collection, use or sale of people's personal data.\nLangley mentioned a woman he recently met in Cleveland who was vociferously against Flock in her community. When he asked her why she disliked the technology so much, she told him it was ultimately a tool for police to \"abuse their power.\"\nIt turned out that police \"kind of feel the same way\" as her, Langley said.\nConversations he had with police would often turn to officers saying of their colleagues 'we knew that person was not good. We had no way to prove it'.\nThat resulted in the new audit feature for Flock, which was released as an option earlier this year.\nIt automatically creates an audit log of searches being done on Flock, and flags unusual search behaviour.\nMost police customers turned on the feature when it became an option. Misuse proved so rampant that Langley decided Flock needed to make the audit feature standard.\nOfficers who abuse their position are \"horrible\", Langley said, adding that they should be punished with more than just dismissal.\n\"If anyone is going to be the one that spearheads getting rid of abusive cops? Sign me up,\" Langley said. \"We trust these individuals with deadly weapons.\n\"I think a camera is very far from a deadly weapon, but I would say it's a very powerful tool. We should hold it incredibly accountable.\"",
    "bodyJa": "フロックのボス、監視会社が警察の虐待に対する対応に時間がかかりすぎたと認める\n- 公開されました\n米国の監視会社フロックは、警察による自社技術の悪用を防ぐための新たな安全策を展開しているが、創業者兼最高経営責任者もこれはもっと早く行われるべきだったと認めている。\n警察はFlockを恋人や社外の追跡、見知らぬ人へのストーキングなどに利用しており、同社に対する国民の反発が高まっている。盗難車や行方不明者の捜索にも使われています。\nフロック社が数万台のカメラ、ナンバープレートリーダー、ドローンを警察の虐待から守るのに時間がかかりすぎたのではないかとの質問に対し、ギャレット・ラングレー氏は「そうだね…そうだ」と答えた。\nFlock はほとんどのデータの保存日数を 30 日から 7 日に短縮しており、異常な検索や使用にも自動的にフラグが立てられます。\n警察は群れのカメラを使用して、元および現在の恋人を追跡するだけでなく、あるケースでは中絶した女性さえも外部から追跡している。\n米国中の警察は、テクノロジーの悪用を理由に社外、あるいは社外で解雇されたかを問わず、辞職している。\nインディアナ州の男性は最近地元ニュースに対し、不正行為の疑いがないにもかかわらず、警察が車の外にフロック警報を設定していたことを公文書開示請求を通じて知ったと語った。\n今年、少なくとも50都市が国民の反発を理由に外部のフロックとの関係を断った。\nしかし、ラングレー氏はBBCに対し、Flockサービスを停止していたさらに16都市が過去3カ月間で同社に戻ってきたと語った。一般的に、新規顧客と失われた顧客の比率は 7:1 で運営されていると同氏は語った。\nラングレー氏は、わずか半年前、同社の取締役会で、なぜフロックに対する世間の注目が高まっているように見えるのか尋ねたと語った。\nこれは、ドアベルカメラ会社であるアマゾンのリングが、望まない監視に対する懸念を引き起こしたスーパーボウルの広告に対する抗議を受けて、フロックとの提携を解除した頃のことだった。\n「これまで、民間企業の最高経営責任者としての私の見解は、こうした決定を下すべきかどうかは分からない、というものだった。データをどのくらいの期間保持すべきかを言うのが私の仕事かどうかは分からない」とラングレー氏は語った。\n同氏は、警察がフロック氏のデータを検索するには有効な事件番号が必要であるという米国自由人権協会や電子フロンティア財団などの団体の意見に同意するようになったと付け加えた。\n「彼らは正しい。それが義務付けられるべきだと思う。」\n同氏はさらに、「当社の従業員や地域社会は、フロックのような企業が専門家としてより強い視点を持つことを期待しているとはっきりと主張している。私がそれに抵抗したのは、そのような責任を負いたくなかったからである」と付け加えた。\nラングレー氏は現在、その責任を受け入れている。同氏はフロック社の安全対策を強化すると同時に、米国の犯罪と闘い、警察の取り締まりを改善するために同社の製品が不可欠であると売り込んでいる。\nFlockを利用していない都市は事実上「安全性が低い」ことを選択していることになる、と同氏は主張した。\nそれにもかかわらず、彼はフロックが法執行機関のメンバーによって悪用されたことを否定しません。\n「私たちが判断できるのは、データが入ってくることだけです」とラングレー氏は語った。 「こうした不当逮捕の事例を見ると、データが悪かったし、警察官が規則に従わなかったことがわかります。しかし、当社のような企業を悪者に選ぶのは簡単です。」\n「気楽な悪役」\nラングレー氏は、都市や近隣地域にはっきりと見えるカメラが設置されているため、外部の人々はますます同社を、プライバシーやテクノロジーに対する増大する懸念のはけ口とみなすようになっていると述べた。\n「私たちのカメラが見えるので、怒りやすくなります」とラングレー氏は言う。\n米国には、人々の個人データの収集、使用、販売を保護または管理する包括的な法律はありません。\nラングレー氏は、クリーブランドで最近出会った、地域社会でフロックに声高に反対していた女性について言及した。彼がなぜこのテクノロジーをそんなに嫌うのかと尋ねたとき、彼女はそれが最終的には警察が「権力を乱用する」ためのツールだと答えた。\n警察も彼女と「同じように感じている」ことが判明した、とラングレー氏は語った。\n彼が警察と交わした会話の中で、警察官が同僚について「あの人が良くないことはわかっていた」と話すことがよくあった。それを証明する方法はありませんでした。」\nその結果、Flock の新しい監査機能が誕生し、今年初めにオプションとしてリリースされました。\nFlock 上で行われた検索の監査ログを自動的に作成し、異常な検索動作にフラグを立てます。\n警察の顧客のほとんどは、この機能がオプションになったときにオンにしました。悪用が横行していることが判明したため、ラングレー氏はフロック社が監査機能を標準にする必要があると判断した。\nラングレー氏は、地位を乱用する警察官は「ひどい」と述べ、解雇以上の罰を与えるべきだと付け加えた。\n「もし誰かが虐待警官を排除する先頭に立ってくれるとしたら？私に登録してください」とラングレー氏は語った。 「私たちは、これらの人々が致命的な武器を持っていることを信頼しています。\n「カメラは致命的な武器とは程遠いと思いますが、非常に強力なツールだと思います。私たちはそれに信じられないほどの責任を負わなければなりません。」",

    "id": "iran-looks-to-ramp-up-economic-alliance-39c6494e",
    "title": "Iran looks to ramp up economic alliance with BRICS nations as war with U.S. drags on",
    "titleJa": "米国との戦争が長引く中、イランはBRICS諸国との経済同盟を強化しようとしている",
    "summaryJa": "イランは米国とイスラエルとの戦争からほぼ半年が経ち、イランが経済同盟の強化を目指している中、同国の中央銀行総裁が木曜、BRICS新開発銀行に参加する予定であると発表した。BRICS同盟は2006年に設立メンバーのブラジル、ロシア、インド、中国によって設立され、2010年には南アフリカも加わった。",
    "bodyOriginal": "Iran is set to join the BRICS New Development Bank, the country's central bank chief said Thursday, as Tehran seeks to shore up its economic alliances almost six months into its war with the U.S. and Israel.\nThe BRICS alliance was set up in 2006 by founding members Brazil, Russia, India and China, with South Africa joining in 2010.\nIt has since expanded to include Iran, Egypt, Ethiopia, Saudi Arabia, the UAE and Indonesia, with various other nations — including Belarus, Cuba and Nigeria — joining as partner countries.\nIranian state media reported Thursday that Abdolnasser Hemmati, governor of the Central Bank of Iran, had announced Iran would soon become a member of the BRICS Bank. Hemmati is currently in India ahead of next month's BRICS Summit, according to Iran's Tasnim News Agency.\n\"We are seeking to establish bilateral and trilateral monetary cooperation with member states,\" Hemmati said, per Tasnim's report.\nThe NDB was established by Brazil, Russia, India, China and South Africa to help mobilize resources for infrastructure and sustainable development projects in emerging markets and developing countries.\nA spokesperson for the NDB told CNBC the bank cannot confirm information regarding Iran's membership.\n\"NDB membership is open to members of the United Nations. The Bank's membership is open to borrowing and non-borrowing member countries,\" they said. \"NDB recently welcomed Uzbekistan as its tenth member country, which officially joined the Bank on June 5, 2026.\"\nIran would have to move through the NDB's accession process before it can become an official member country. Current prospective members are Uruguay, Colombia, Ethiopia, Angola and Zimbabwe.\nJoining the bank would make Iran eligible to seek financing for projects in areas such as transport, sanitation, digital infrastructure and urban development.\nLongstanding sanctions on Iran have severely constrained its access to international capital, particularly from Western financial institutions and markets. The war with the U.S. and Israel has further ramped up the pressure on the Iranian economy, with inflation surging, growth plummeting and its currency in freefall.\nU.S. President Donald Trump, who has previously labeled BRICS policies \"anti-American,\" has threatened to slap 25% tariffs on goods imported to the U.S. from any country that directly or indirectly purchases goods or services from Iran.\nCNBC reached out to the White House for comment on Iran joining the BRICS bank.\nChina is Iran's biggest trading partner, according to the World Bank's most recent data. In 2025, China bought more than 80% of Iran's shipped oil, according to Kpler data.\nIt is unclear whether that trading relationship has shifted since the U.S.-Iran war began.",
    "bodyJa": "イランは米国とイスラエルとの戦争からほぼ半年が経ち、イランが経済同盟の強化を目指している中、同国の中央銀行総裁が木曜、BRICS新開発銀行に参加する予定であると発表した。\nBRICS同盟は2006年に設立メンバーのブラジル、ロシア、インド、中国によって設立され、2010年には南アフリカも加わった。\nそれ以来、イラン、エジプト、エチオピア、サウジアラビア、UAE、インドネシアを含むまで拡大し、ベラルーシ、キューバ、ナイジェリアを含む他のさまざまな国もパートナー国として参加しています。\nイラン国営メディアは木曜日、イラン中央銀行のアブドルナセル・ヘマティ総裁が、イランが間もなくBRICS銀行の加盟国になると発表したと報じた。イランのタスニム通信によると、ヘマティ氏は現在、来月のBRICS首脳会議に先立ちインドを訪れている。\nタスニムの報告書によると、ヘマティ氏は「われわれは加盟国との二国間および三国間通貨協力の確立を目指している」と述べた。\nNDB は、新興市場や発展途上国におけるインフラストラクチャーや持続可能な開発プロジェクトにリソースを動員することを目的として、ブラジル、ロシア、インド、中国、南アフリカによって設立されました。\nＮＤＢの広報担当者はＣＮＢＣに対し、同行はイランの加盟に関する情報を確認できないと語った。\n「NDBの会員資格は国連加盟国に開かれている。世銀の会員資格は借入加盟国と非借入加盟国に開かれている」と彼らは述べた。 「NDBは最近ウズベキスタンを10番目の加盟国として歓迎し、2026年6月5日に正式に加盟した。」\nイランが正式加盟国になるには、NDBの加盟手続きを経る必要がある。現在の加盟候補国はウルグアイ、コロンビア、エチオピア、アンゴラ、ジンバブエです。\n銀行に参加すれば、イランは交通、衛生、デジタルインフラ、都市開発などの分野のプロジェクトへの融資を求める資格が得られる。\nイランに対する長年の制裁により、特に西側の金融機関や市場からの国際資本へのアクセスが厳しく制限されている。米国とイスラエルとの戦争はイラン経済への圧力をさらに強め、インフレは急上昇し、成長は急落し、通貨は暴落した。\nドナルド・トランプ米大統領はこれまでBRICS政策を「反米」と呼んできたが、イランから直接・間接的に商品やサービスを購入する国から米国に輸入される商品に25％の関税を課すと脅迫した。\nCNBCはイランのBRICS銀行への参加についてホワイトハウスにコメントを求めた。\n世界銀行の最新データによると、中国はイランの最大の貿易相手国である。 Kplerのデータによると、2025年には中国がイランに出荷された原油の80％以上を購入した。\n米国とイランの戦争が始まって以来、その貿易関係が変化したかどうかは不明である。",

    "id": "zero-hours-crackdown-could-cost-firms-up-0e71d3a9",
    "title": "Zero hours crackdown could cost firms up to £2.9bn a year",
    "titleJa": "ゼロ時間取り締まりは企業に年間最大29億ポンドの損害を与える可能性がある",
    "summaryJa": "ゼロ時間取り締まりは企業に年間最大29億ポンドの損害を与える可能性がある- 公開されました",
    "bodyOriginal": "Zero hours crackdown could cost firms up to £2.9bn a year\n- Published\nBusinesses could face costs of up to £2.9bn a year because of a crackdown on zero hours contracts, according to the government's own analysis.\nLabour's employment reforms are set to cut the number of hours staff can work before they must be offered guaranteed time.\nOfficial analysis released on Wednesday showed it could cost employers between £350m and £2.9bn, based on the eventual threshold of hours the policy impacts.\nSkills Minister Baroness Jacqui Smith said the reforms would ensure workers are \"fairly paid\" but business groups said the cost to employers was \"disproportionate\" compared to how much it would help workers.\nGovernment analysis said there were \"potential trade-offs\" that include more administrative costs and less flexibility for companies, including making it \"harder for employers to respond to changes in demand\".\nAt the upper end of its estimate, about £1.2bn in costs would come from businesses who are forced to pay workers compensation for cancelled shifts.\nHowever, the middle estimate of how much the policy would cost overall is £1.1bn.\nThe total cost depends on who the policy eventually applies to: if it applies to people working 48 hours a week, as some unions have called for, it will cost companies more.\nThe government's preference is for it to fall somewhere between eight and 20 hours a week.\nIn that case, the overall cost would fall far short of the higher estimates cited in the analysis.\nOfficials also wrote that the reforms could provide a £10bn boost to the economy because of better wellbeing and productivity.\nThat would lower the net average cost of the reforms to between £300m and £1.4bn.\nIt said the overall cost figures do not capture the full range of benefits because they are \"not possible to monetise\".\nHow will the changes to workers' rights affect you?\n- Published16 December 2025\nIt said hospitality and retail companies, many of which rely heavily on zero hours workers, would be most affected by the change.\nThe document was released as part of a consultation into how many hours should eventually fall under the new rules.\nBaroness Smith told Sky News the government will \"look very carefully\" at how it brings in the changes.\n\"I don't think it's fair for somebody to be on a contract where they literally don't know whether or not they're going to be working at all, and yet they're bound by that contract.\"\nThe number of people on zero hours contracts hit a record high of 1.23 million last December, a 91,000 annual increase, according to official data.\nBut business groups said the costs were more than had originally been forecast.\nKate Shoesmith, director of policy at the British Chambers of Commerce, said it would be \"a further hammer blow\" for companies that are struggling.\n\"We are already facing a youth unemployment crisis – now is not the time to make it even more costly for employers to hire.\"\nHelen Dickinson, the chief executive of British Retail Consortium, questioned whether the reforms would \"actually deliver value for workers\" because of the cost to businesses.\nShe added that retailers would also have to pay \"hundreds of millions of pounds\" to update their payroll systems.\nThe Trades Union Congress said most of the extra costs would only come if businesses cancelled workers' shifts at the last minute.\nA spokesperson for the TUC said: \"The aim of this legislation is to stop this practice and give variable hours workers security and stability - so good employers have nothing to fear.\"\nCharlotte Brumpton-Childs, GMB national secretary, called zero hours contracts \"archaic\", adding that businesses were \"of course … going to grumble\" about the policy.\nRelated topics\n- Published10 October 2024",
    "bodyJa": "ゼロ時間取り締まりは企業に年間最大29億ポンドの損害を与える可能性がある\n- 公開されました\n政府独自の分析によると、ゼロ時間契約の取り締まりにより、企業は年間最大29億ポンドのコストに直面する可能性がある。\n労働党の雇用改革では、労働時間の保証が必要となる前に職員が働ける時間を削減する予定だ。\n水曜日に発表された公式分析では、政策が影響する最終的な労働時間の基準に基づいて、雇用主に3億5000万ポンドから29億ポンドの損失が生じる可能性があることが示された。\nジャッキー・スミス男爵夫人技能大臣は、この改革により労働者に「公正な賃金」が保障されると述べたが、経済団体は雇用主のコストが労働者を助ける額と比べて「不釣り合い」だと主張した。\n政府の分析では、管理コストの増加や企業の柔軟性の低下などの「潜在的なトレードオフ」があり、その中には「雇用主が需要の変化に対応することが難しくなる」ことも含まれるとしている。\n推定の上限では、キャンセルされたシフトに対する労働者補償の支払いを余儀なくされている企業からのコストが約12億ポンドに上る。\nただし、政策全体の費用の中間推定値は 11 億ポンドです。\n総コストは、この政策が最終的に誰に適用されるかによって決まる。一部の労働組合が要求しているように週48時間働く人々に適用されれば、企業のコストはさらに高くなるだろう。\n政府は週に8時間から20時間の範囲内に収まることを望んでいる。\nその場合、全体的なコストは、分析で引用されたより高い見積もりをはるかに下回ることになります。\n当局者らはまた、この改革により福利厚生と生産性が向上し、経済に100億ポンドの押し上げ効果がもたらされる可能性があると書いている。\nそうすれば、改革の純平均コストは3億ポンドから14億ポンドに引き下げられることになる。\n全体的なコストの数字は「収益化が不可能」であるため、あらゆるメリットを捉えていないと同社は述べた。\n労働者の権利の変更はあなたにどのような影響を与えますか?\n- 2025 年 12 月 16 日公開\n同報告書は、その多くがゼロ時間労働者に大きく依存している接客業と小売業がこの変化によって最も大きな影響を受けるだろうと述べた。\nこの文書は、最終的に新しい規則の対象となる時間数に関する協議の一環として発表された。\nスミス男爵夫人はスカイニュースに対し、政府がどのように変化をもたらすかについて「非常に注意深く検討する」と語った。\n「文字通り、実際に働くかどうかも分からない契約を結んでいるのに、その契約に拘束されている人がいるのは不公平だと思います。」\n公式データによると、ゼロ時間契約の人の数は昨年12月に過去最高の123万人に達し、年間9万1000人増加した。\nしかし企業団体は、コストが当初の予想を上回ったと述べた。\n英国商工会議所の政策部長ケイト・シュースミス氏は、これは苦境にある企業にとって「さらなる鉄槌」となるだろうと述べた。\n「私たちはすでに若者の失業危機に直面しています。今は雇用主にとって雇用コストをさらに高くする時期ではありません。」\n英国小売業コンソーシアムの最高経営責任者ヘレン・ディキンソン氏は、企業にコストがかかるため、改革が「実際に労働者に価値をもたらす」かどうか疑問を呈した。\n同氏は、小売業者も給与システムを更新するために「数億ポンド」を支払わなければならないだろうと付け加えた。\n労働組合会議は、追加費用のほとんどは企業が従業員のシフトを直前にキャンセルした場合にのみ発生すると述べた。\nTUCの広報担当者は、「この法律の目的は、この慣行を阻止し、変形労働時間労働者に安全と安定を与えることである。したがって、優良な雇用主は何も恐れる必要はない」と述べた。\nGMB全国書記のシャーロット・ブランプトン・チャイルズ氏は、ゼロ時間契約を「時代遅れ」と呼び、企業はこの政策について「もちろん…不平を言うだろう」と付け加えた。\n関連トピック\n- 2024 年 10 月 10 日公開",

    "id": "an-inside-look-at-sk-hynix-720-billion-a-5a1daec5",
    "title": "An inside look at SK Hynix $720 billion AI-fueled buildout that's taking over South Korea",
    "titleJa": "韓国を引き継ぐSKハイニックスの7,200億ドル規模のAIを活用した増強の内部に迫る",
    "summaryJa": "高帯域幅メモリの大手メーカーであるSK Hynixは、AIの需要を満たすためにメモリ工場に7,200億ドルを注ぎ込んでいる。独占的なファーストルックを入手しました。",
    "bodyOriginal": "In South Korea, where a mountainous landscape makes building huge projects an incredible undertaking, the world's leading maker of high-bandwidth computer memory is investing $720 billion on what it says will be the largest network of memory factories in the world.\nSK Hynix, whose market cap has jumped more than fivefold in the past year and now tops $1 trillion, is making a big bet that extreme demand from artificial intelligence is here to stay. Soaring prices exacerbated by capacity constraints are changing the fabric of the classic boom-and-bust industry, with AI chip giants like Nvidia willing to take on more risk as they scramble to secure supply.\nThe industry is reliant on just a few players. SK Hynix controlled 58% of the high-bandwidth memory, or HBM, market in the first quarter, followed by fellow South Korean giant Samsung and U.S.-based Micron, both at 21%, according to Counterpoint Research.\nTo help fund its ambitious buildout, SK Hynix, which trades on the Korea Exchange, reeled in $26.5 billion in July by listing shares on the Nasdaq, the most money ever raised by a foreign company listing on U.S. markets.\nIt's been a tough month for new investors. Since reaching a high of almost $195 on July 14, the U.S.-listed shares are down by about 21%, closing on Wednesday at $154.41. The drop has coincided with broader volatility in the AI trade, particularly chip stocks, and a decline in the Korean market, which gets about half its value from SK Hynix and Samsung.\nBut none of that will deter SK Hynix from pursuing its historic buildout. It's part of a larger plan unveiled by South Korean President Lee Jae Myung in June to double the country's memory production in five years, which includes construction of multiple new Samsung megafabs.\nCNBC got a behind-the-scenes peak into SK Hynix's expansion last month, with the first on-camera tour of the Yongin Cluster, as well as an inside look at memory cleanrooms in Cheongju, where the company is also undergoing a major infrastructure push.\n'It's like a war'\nHeight is the most striking difference between U.S. chip fabs and the three SK Hynix sites we toured in South Korea. The first fab at the Yongin Cluster had walls built about halfway up the towering structure, which SK Hynix said will reach the height of a 50-story apartment building. It will have six cleanrooms connected over several floors, instead of sprawling out in a single story like at new fabs in Arizona from Taiwan Semiconductor Manufacturing Co. and Intel.\nMade by stacking general-purpose dynamic random access memory, HBM is the highest bandwidth memory capable of rapid data access that helps AI processors execute tasks. Those stacks of HBM take up so much DRAM it's depleting the supply for consumer electronics, as AI giants sign contracts that are years longer than the typical short-term agreements for what was historically considered a low-margin commodity.\n\"It's like a war,\" said Chey Tae-won, chairman of SK Group, the controlling owner of SK Hynix, in an interview in Seoul. \"Everybody wants to buy the memory chips. Without that, they cannot produce their AI computing and AI chips.\"\nTae-won told CNBC that \"prices went up too fast\" and that he hopes all this buildout will help. \"I'm trying to do my best,\" he said.\nSK Hynix reported in July that it signed 10 long-term agreements with major customers. Nvidia just \"secured a stable supply of HBM\" and agreed to co-develop next-generation memory as part of a $500 billion deal with SK Group that includes building new data centers with SK Telecom by 2027.\nTae-won showed CNBC a wafer with a message on it from Nvidia CEO Jensen Huang that read, \"Please make more.\" He said he meets occasionally with major industry leaders like Microsoft's Satya Nadella, Google's Sundar Pichai, and Meta's Mark Zuckerberg. Huang and AMD CEO Lisa Su came to South Korea in recent months for meetings about memory.\nMS Hwang, research director at Counterpoint Research, said all the hotels near SK Hynix and Samsung's memory fab expansions are fully booked.\n\"If you name any company in Big Tech, they are all in Korea to sign a contract,\" he said.\nSK Hynix also makes memory chips at three fabs in China, but is prohibited from selling its leading-edge HBM there because of U.S. export controls. China has its own emerging makers of the coveted memory needed for AI, including CXMT, which just had a blockbuster debut on the Shanghai market.\n\"It's a race, and now the counterparty of the race is China,\" Hwang said. \"That's going to be a lot more dangerous than anything else in the world.\"\nPresident Lee is now urging speed on the fab buildouts in South Korea, while the U.S. also scrambles to add capacity.\nRace to build bigger and faster\nMicron is spending $50 billion to build two huge new memory fabs in Boise, Idaho, with the first one scheduled to start making wafers in 2027. And in Clay, New York, it's building a $100 billion campus with up to four fabs.\nSK Hynix is also building its first U.S. facility, where construction is set to conclude in 2028. The $4 billion fab in West Lafayette, Indiana, is for packaging — where memory chips will be stacked and wired together — rather than front-end manufacturing.\nIn addition to its Indiana plans, SK Hynix has existing U.S. operations. In 2020, it agreed to buy Intel's NAND business for $9 billion, eventually creating the subsidiary Solidigm, which is headquartered near Sacramento, California. In January, SK Hynix restructured that business and launched a $10 billion \"AI Company\" in the U.S., but there are no plans related to front-end manufacturing.\nRegarding U.S. chip fab plans, Tae-won said SK Hynix has been studying possible sites for more than a month.\n\"I'm willing to do it, but the problem is that I really have to find the right place,\" he said.\nIn the meantime, Tae-won said memory is at a \"turning point\" with the next technological leap to custom HBM that will help insulate SK Hynix's massive investment from risk.\nCustom HBM is now being co-designed with AI processors, a trend that's accelerating with next-generation HBM5.\n\"Nvidia wants their own custom chips and Google wants their own customized HBM, so it's not just a commodity,\" Tae-won said. \"It actually changes the memory chip's status.\"\nWATCH: Exclusive look inside SK Hynix's $720 billion bet on AI memory",
    "bodyJa": "山岳地帯の多い韓国では、大規模なプロジェクトの構築が信じられないほどの事業となっているが、高帯域幅コンピュータメモリの世界大手メーカーは、世界最大のメモリ工場ネットワークになると主張するものに7,200億ドルを投資している。\n過去 1 年間で時価総額が 5 倍以上に跳ね上がり、現在 1 兆ドルを超えている SK ハイニックスは、人工知能に対する極端な需要が今後も続くと大きな賭けをしています。生産能力の制約によってさらに悪化した価格の高騰は、古典的な好不況産業の構造を変えており、エヌビディアのようなAIチップ大手は供給確保に向けてより多くのリスクを引き受けることをいとわない。\n業界はほんの数人のプレーヤーに依存しています。カウンターポイント・リサーチによると、SKハイニックスは第1四半期の高帯域幅メモリ（HBM）市場の58％を占め、次いで同じ韓国の大手サムスンと米国に本拠を置くマイクロンが21％で続いた。\n韓国取引所に上場しているSKハイニックスは、その野心的な事業拡大に資金を提供するため、7月にナスダックに株式を上場して265億ドルを巻き上げたが、これは外国企業が米国市場に上場して調達した資金としては過去最高額となる。\n新規投資家にとっては厳しい月となった。 7月14日に約195ドルの高値を付けて以来、米国上場株は約21％下落し、水曜日の終値は154.41ドルとなった。この下落は、AI取引、特に半導体株のボラティリティの拡大と、SKハイニックスとサムスンから約半分の価値を得ている韓国市場の下落と同時に起きた。\nしかし、そのどれもがSKハイニックスの歴史的な構築を追求するのを妨げるものではない。これは、韓国のイ・ジェミョン大統領が6月に発表した、国内のメモリ生産を5年間で倍増させるという大規模な計画の一環であり、サムスン製の複数の新しいメガファブの建設も含まれている。\nCNBCは先月、SKハイニックスの拡大の舞台裏を取材し、龍仁クラスターの初のカメラツアーのほか、同社も大規模なインフラ整備を進めている清州のメモリクリーンルームの内部を視察した。\n「まるで戦争のようだ」\n米国のチップ製造工場と、私たちが視察した韓国の SK ハイニックスの 3 つの拠点との最も顕著な違いは、高さです。龍仁クラスターの最初のファブには、そびえ立つ建物の中腹あたりに壁が建てられており、SKハイニックスによると、その高さは50階建てのマンションの高さに達するという。台湾積体電路製造とインテルのアリゾナ州の新しい工場のように平屋に広がるのではなく、6つのクリーンルームが複数のフロアにまたがって接続される予定だ。\n汎用ダイナミック ランダム アクセス メモリを積み重ねて作られた HBM は、AI プロセッサのタスク実行を支援する高速データ アクセスが可能な最高帯域幅メモリです。これらの HBM のスタックは DRAM を大量に消費するため、家庭用電化製品への供給が枯渇しつつあります。これは、AI 大手が、歴史的に利益率の低い商品と考えられていた一般的な短期契約よりも何年も長い契約を締結しているためです。\n「これは戦争のようなものだ」とSKハイニックスの支配株主であるSKグループのチェイ・テウォン会長はソウルでのインタビューで語った。 「誰もがメモリチップを購入したいと考えています。それがなければ、AIコンピューティングやAIチップを生産することはできません。」\nテウォン氏はCNBCに対し、「価格があまりにも早く上がりすぎた」とし、このすべての増強が助けになることを期待していると述べた。 「最善を尽くしたいと思っています」と彼は言った。\nSKハイニックスは7月、主要顧客と10件の長期契約を締結したと報告した。 Nvidiaは「HBMの安定供給を確保」したばかりで、2027年までにSKテレコムと新たなデータセンターを建設することを含むSKグループとの5000億ドルの契約の一環として、次世代メモリを共同開発することに合意した。\nテウォンさんはCNBCに対し、「もっと作ってください」というNVIDIA CEOのジェンスン・ファンからのメッセージが書かれたウエハースを見せた。同氏は、マイクロソフトのサティア・ナデラ氏、グーグルのサンダー・ピチャイ氏、メタ社のマーク・ザッカーバーグ氏といった業界の主要リーダーと時々会っていると語った。 Huang氏とAMD CEOのLisa Su氏はここ数カ月、メモリに関する会議のため韓国を訪れた。\nカウンターポイント・リサーチのリサーチ・ディレクター、MS・ファン氏は、SKハイニックスとサムスンのメモリ工場拡張施設付近のホテルはすべて満室だと述べた。\n「ビッグテック企業の名前を挙げれば、その企業はすべて韓国で契約を結んでいる」と同氏は語った。\nSKハイニックスも中国の3つの工場でメモリチップを製造しているが、米国の輸出規制のため、中国で最先端のHBMを販売することは禁止されている。中国には、上海市場で大ヒットデビューを果たしたばかりのCXMTなど、AIに必要なメモリを製造する新興メーカーが自国に存在する。\n「これはレースであり、今やレースの相手は中国だ」とファン氏は語った。 「それは世界の他のどんなものよりもはるかに危険なものになるだろう。」\n李大統領は現在、韓国での工場建設の加速を促しており、米国も生産能力の追加に急ぐ。\nより大きく、より速く構築するために競う\nマイクロンは500億ドルを投じてアイダホ州ボイジーに2つの巨大な新しいメモリファブを建設しており、最初の1つは2027年にウェーハの製造を開始する予定だ。そしてニューヨーク州クレイでは、最大4つのファブを備えた1000億ドルのキャンパスを建設中である。\nSKハイニックスも米国初の施設を建設中で、2028年に建設が完了する予定だ。インディアナ州ウェストラファイエットにある40億ドルの工場は、フロントエンド製造ではなく、パッケージング（メモリチップを積み重ねて配線する場所）向けだ。\nインディアナ州の計画に加えて、SK ハイニックスは既存の米国事業を展開している。 2020年にインテルのNAND事業を90億ドルで買収することで合意し、最終的にカリフォルニア州サクラメント近郊に本社を置く子会社Solidigmを設立した。 SKハイニックスは1月に同事業を再編し、米国で100億ドル規模の「AIカンパニー」を立ち上げたが、フロントエンド製造に関連する計画はない。\n米国のチップ工場計画に関してテウォン氏は、SKハイニックスが1カ月以上にわたり候補地を検討していると述べた。\n「喜んでそうするつもりだが、問題は適切な場所を本当に見つけなければならないことだ」と彼は語った。\n一方、テウォン氏は、SKハイニックスの巨額投資をリスクから守るのに役立つカスタムHBMへの次の技術的飛躍により、メモリは「転換点」にあると述べた。\nカスタム HBM は現在、AI プロセッサーと共同設計されており、この傾向は次世代 HBM5 で加速しています。\n「NVIDIA は独自のカスタム チップを望んでおり、Google も独自のカスタマイズされた HBM を望んでいます。したがって、HBM は単なる商品ではありません」と Tae-won 氏は述べました。 「それは実際にメモリチップのステータスを変更します。」\n見る: SK Hynix の AI メモリに対する 7,200 億ドルの賭けの内部を独占的に見る",

    "id": "economy-grew-in-april-to-june-as-sun-and-8640a84e",
    "title": "Economy grew in April to June as sun and World Cup helped some UK businesses",
    "titleJa": "太陽とワールドカップが一部の英国企業を支援したため、4月から6月にかけて経済は成長した",
    "summaryJa": "太陽とワールドカップが一部の英国企業を支援したため、4月から6月にかけて経済は成長した- 公開されました",
    "bodyOriginal": "Economy grew in April to June as sun and World Cup helped some UK businesses\n- Published\nAn added boost from summer sun and sports fixtures for some businesses helped the UK economy to grow by 0.4% between April and June, according to official data.\nBut the figure - in line with economists' expectations - is below the 0.6% expansion recorded in the first three months of this year.\nThe Office for National Statistics (ONS) said growth had \"remained relatively robust\", with services sector propelling growth in the second quarter while manufacturing also grew.\nComputer programming, advertising and the pharmaceutical industry were areas of strength, the ONS said. That was offset by falls in power generation and sewerage.\nThe ONS said some businesses reported that \"good weather and sporting events may have had a positive effect\" in June, boosting month-on-month growth to 0.3% in June. However, May's growth was revised down from 0.1% to zero growth.\nThe men's football World Cup, which kicked off mid-June, boosted customers at hospitality venues showing the matches.\nJune also saw several of summer's heatwaves.\nThe slowdown in growth over the three months to the end of June compared to the start of the year reflected the ongoing impact of the war in Iran as well as political uncertainty in the run up to Sir Keir Starmer's resignation as prime minister at the end of June.\nChancellor of the Exchequer, John Healey MP said: \"I know people are worried about the impact of the conflict in the Middle East on their cost of living, which has been too high for too long and it has added pressure on British businesses.\"\nHe said the government's aim was to make the country \"more resilient\" and to \"drive growth in every postcode\".\nShadow chancellor Sir Mel Stride said Labour had \"mismanaged the economy with their tax and borrowing spree, leaving it weak and vulnerable to the effects of shocks like the Iran War.\n\"Labour need to realise that it's their poor decisions which have stifled growth and made the cost of living worse,\" he said.\nFergus Jimenez-England, Associate Economist National Institute of Economic and Social Research said the UK economy had \"weathered the recent energy shock better than many feared\", but said the recent pace of growth was unlikely to be sustained.\n\"Both inflation and unemployment are set to rise in the coming months while business sentiment remains fragile and could dampen further with ongoing energy price volatility.\n\"The economy has shown welcome resilience so far, but we are not out of the woods yet.\"\nSuren Thiru, ICAEW chief economist, said households and firms had \"largely shrugged off the shockwaves from the Iran war\".\nBut he also expected weaker growth in the second half of the year, making the chancellor's Budget in October \"more challenging\".",
    "bodyJa": "太陽とワールドカップが一部の英国企業を支援したため、4月から6月にかけて経済は成長した\n- 公開されました\n公式データによると、夏の日差しと一部の企業のスポーツ観戦が追い風となり、英国経済は４─６月に０．４％成長した。\nしかし、この数字はエコノミストの予想と一致し、今年最初の３カ月間に記録した０．６％の拡大を下回っている。\n国家統計局（ＯＮＳ）は、第２・四半期の成長をサービス部門がけん引する一方、製造業も成長し、成長は「引き続き比較的堅調」だったと述べた。\nONSによると、コンピュータープログラミング、広告、製薬産業が得意分野だという。これを発電と下水道の減少で相殺した。\nＯＮＳによると、一部の企業は６月に「好天とスポーツイベントが好影響を及ぼした可能性がある」と報告しており、６月の前月比伸び率は０．３％に押し上げられた。ただ、５月の成長率は０．１％からゼロ成長に下方修正された。\n6月中旬に開幕した男子サッカーワールドカップは、試合を観戦するホスピタリティ会場の客足を伸ばした。\n6月には夏の熱波も何度か見られました。\n年初と比べて6月末までの3カ月間の成長鈍化は、イラン戦争の影響が続いていることと、6月末のキア・スターマー卿の首相辞任に向けた政治的不確実性を反映している。\n財務大臣のジョン・ヒーリー議員は、「中東紛争が生活費に与える影響を国民が心配していることは承知している。あまりに長期にわたって高すぎる生活費が英国企業への圧力を高めている」と語った。\n同氏は、政府の目的は国を「より強靭にし」、「あらゆる郵便番号で成長を促進する」ことだと述べた。\n影の宰相メル・ストライド卿は、労働党が「税金と借金乱発で経済の管理を誤ったため、経済は弱体化し、イラン戦争のようなショックの影響を受けやすくなった」と述べた。\n同氏は「労働党は成長を阻害し、生活費を悪化させているのは自らの誤った決定であることを認識する必要がある」と述べた。\n国立経済社会研究所のアソシエイトエコノミスト、ファーガス・ヒメネス＝イングランド氏は、英国経済は「多くの人が懸念していたよりもうまく最近のエネルギーショックを乗り切った」としながらも、最近の成長ペースが維持される可能性は低いと述べた。\n「インフレと失業率は今後数カ月で上昇する見通しだが、景況感は依然脆弱で、エネルギー価格の変動が続いているためさらに鈍化する可能性がある。\n「経済はこれまでのところ歓迎すべき回復力を示しているが、まだ危機を脱していない。」\nICAEWの首席エコノミスト、スレン・ティルー氏は、家計と企業は「イラン戦争による衝撃をほぼ回避している」と述べた。\nしかし同氏は、今年下半期の成長鈍化も予想しており、10月の首相予算案は「より困難」になると予想した。",

    "title": "Twitch faces backlash over Amazon using content to train AI",
    "titleJa": "TwitchはAmazonがAIのトレーニングにコンテンツを使用したことで反発に直面している",
    "summaryJa": "TwitchはAmazonがAIのトレーニングにコンテンツを使用したことで反発に直面している- 公開されました",
    "bodyOriginal": "Twitch faces backlash over Amazon using content to train AI\n- Published\nTwitch has been criticised by users after it emerged the popular streaming platform allowed their content to be used to train Amazon's artificial intelligence (AI) models.\nAmazon owns Twitch and a setting allowing the US tech giant to take data generated by creators and audiences to train AI is turned on by default.\nUsers can now opt out of that, Twitch said on Wednesday, but the announcement sparked a backlash with some users questioning why it was allowed in the first place.\nTwitch's chief product officer Mike Minton, said it's \"respecting\" users by letting them opt out but on why data was collected by default, he admitted: \"If it's opt-in, nobody would opt-in. That's the honest answer.\"\nUsers who remain opted in could have any of their channel content used for training, Minton said during a livestream, adding that the data collected will not be re-sold to other companies.\nOn the same livestream, Mary Kish, head of community at Twitch, took viewers through a tutorial on how to disable generative AI training through a user's channel settings.\nDoing so will prevent Amazon from using streams, clips, images, chats and other channel content to train its generative AI models.\nData collection for AI training has become an industry standard, Kish said.\n\"We don't expect you to be happy or excited about this. I don't expect anyone to react to this favourably,\" she added.\nThe stream's chat column was flooded with hundreds of comments from users criticising the move.\nOne viewer wrote: \"Nobody would opt in because nobody wants to feed AI with our creativity and content.\"\nAnother said Twitch had an \"opportunity to set an industry standard\" to push back against data collection for AI.\nIt is not clear when Amazon began collecting Twitch users' data to train its AI models.\nMinton said during the stream that he did not know if users' data had already been scraped for training, adding that he was unsure what Amazon \"has done in terms of model training and what they've used and not used.\"\nAmazon, which bought Twitch for nearly $1bn (£740m) in 2014, runs a host of AI services and has heavily invested in the its development as it seeks to compete with Google, Meta and other technology giants.\nAmazon has been contacted for comment.\nRelated topics\n- Published16 hours ago",
    "bodyJa": "TwitchはAmazonがAIのトレーニングにコンテンツを使用したことで反発に直面している\n- 公開されました\nTwitchは、人気のストリーミングプラットフォームが自社のコンテンツをAmazonの人工知能（AI）モデルのトレーニングに使用できるようにしたことが明らかになり、ユーザーから批判されている。\nAmazonはTwitchを所有しており、米国のテクノロジー巨人がAIをトレーニングするためにクリエイターと視聴者によって生成されたデータを取得できるようにする設定がデフォルトでオンになっています。\nTwitchは水曜日、ユーザーはこれをオプトアウトできると発表したが、この発表は反発を引き起こし、そもそもなぜそれが許可されているのか疑問を抱くユーザーもいた。\nTwitchの最高プロダクト責任者マイク・ミントン氏は、ユーザーにオプトアウトを許可することでユーザーを「尊重」していると述べたが、データがデフォルトで収集される理由については「オプトインなら誰もオプトインしないだろう。それが正直な答えだ」と認めた。\nミントン氏はライブストリーム中に、オプトインしたままのユーザーは自分のチャンネルコンテンツをトレーニングに使用できると述べ、収集されたデータが他の企業に再販売されることはないと付け加えた。\n同じライブストリームで、Twitch のコミュニティ責任者である Mary Kish 氏が、ユーザーのチャンネル設定を通じて生成 AI トレーニングを無効にする方法についてのチュートリアルを視聴者に案内しました。\nそうすることで、Amazon は生成 AI モデルをトレーニングするためにストリーム、クリップ、画像、チャット、その他のチャネル コンテンツを使用できなくなります。\nAIトレーニングのためのデータ収集は業界の標準になっている、とキッシュ氏は語った。\n「私たちは、皆さんがこの件で喜んだり、興奮したりすることを期待していません。誰もこれに好意的に反応するとは思っていません」と彼女は付け加えた。\nストリームのチャット欄には、この動きを批判するユーザーからの数百件のコメントが殺到した。\nある視聴者は、「誰もAIに私たちの創造性やコンテンツを与えたくないと思うので、オプトインする人はいないだろう」と書いた。\n別の関係者は、TwitchにはAIによるデータ収集に反対する「業界標準を設定する機会」があると述べた。\nAmazonがAIモデルをトレーニングするためにいつTwitchユーザーのデータを収集し始めたかは明らかではない。\nミントン氏は配信中に、ユーザーのデータがトレーニングのためにすでに収集されているかどうかは分からないと述べ、アマゾンが「モデルのトレーニングに関して何を行ったのか、またユーザーが何を使用し、何を使用しなかったのか」が分からないと付け加えた。\n2014年にTwitchを約10億ドル（7億4,000万ポンド）で買収したAmazonは、多数のAIサービスを運営しており、GoogleやMeta、その他のテクノロジー大手との競争を目指してその開発に多額の投資を行っている。\nアマゾンにはコメントを求められている。\n関連トピック\n- 16 時間前に公開",

    "id": "south-korea-s-kospi-has-staged-a-stunnin-c122be32",
    "title": "South Korea’s Kospi has staged a stunning comeback. How long will the bull market last?",
    "titleJa": "韓国のコスピが見事な復活を遂げた。強気相場はいつまで続くのでしょうか？",
    "summaryJa": "韓国のコスピは、投資家が指数を支配する同国の半導体大手に群がる中、最近の下落から反転し、強気相場の領域に戻った。先月、レバレッジをかけたポジションと強制的な売りによって部分的に下落し、ベンチマークは弱気市場の領域に押し込まれた後、強気市場の一般的に使用される基準である7月の安値から20％以上上昇した。",
    "bodyOriginal": "South Korea's Kospi has staged a reversal from its latest rout, returning to bull-market territory as investors pile back into the country's semiconductor giants that dominate the index.\nThe benchmark has climbed more than 20% from its July low, the commonly used threshold for a bull market, after a rout driven partly by leveraged positions and forced selling pushed it into bear-market territory last month.\nThe speed of the turnaround underscores the massive volatility in tech stocks and raises a bigger question: How much longer will the South Korean rally last?\nFor bulls, the answer rests largely on whether the fundamentals behind Korea's semiconductor giants can keep pace with increasingly optimistic expectations. Strong U.S. technology earnings and continued commitments to AI infrastructure spending have helped revive confidence that demand for memory chips will remain robust.\n\"The AI rally and continued strong earnings have been a constant during the sell-off, so it is fundamentals returning the market back to normalcy rather than the other way around,\" said Peter Kim, head of global investment strategy at KB Securities.\nKim said valuations and earnings were never seriously in doubt during the semiconductor rout, which was instead driven by technical factors and fund flows. The unwinding of leveraged positions has also eased after regulators tightened rules and brokerages normalized margin and risk requirements. That could leave the market on firmer footing than during the run-up preceding the crash.\nConcentration risks — or rewards?\nThe Kospi's dependence on just a handful of semiconductor companies makes its bull run overly exposed to shifts in sentiment toward AI.\n\"Korea's equity market is basically synonymous with the AI hardware trade at this point,\" said Phillip Wool, head of research at Rayliant Global Advisors.\nThe rebound has been partly technical, Wool said, as forced selling subsided, dip buyers returned and fear of missing out took hold. But stronger-than-expected Big Tech earnings have also reinforced expectations for AI infrastructure spending and helped underpin upward revisions to growth forecasts for Korean hardware companies.\n\"Anything that calls this narrative into question, whether it's soft guidance on capex from hyperscalers, sagging token pricing, Fed tightening fears, we can expect to see a pullback,\" Wool said. \"Expect continued volatility as long as there's uncertainty about how AI hardware spending will play out.\"\nSupporting the bull case, Billy Leung, investment strategist at Global X ETFs pointed to Korea's corporate-governance reforms and \"Value-Up\" program, which have helped reduce the \"Korea discount.\"\nThe \"Korea discount\" refers to the longstanding tendency of South Korean companies to trade at lower valuations than comparable global peers.\n\"The KOSPI is in a bull market, but the more important question is whether the rally is being driven by speculation or by a genuine improvement in fundamentals,\" Leung said.\nHe sees Korea as closer to a fundamentally supported bull market than a speculative bubble, with semiconductor earnings' expectations continuing to rise. But elevated retail participation, heavy index concentration and ambitious market targets are also beginning to resemble late-cycle behavior.\nOthers warned about reading too much into the 20% milestone.\n\"I would be cautious about describing this as a completely new bull market,\" said Jung In Yun of Fibonacci Asset Management Global. The rebound represents both a technical recovery from forced selling and \"a genuine return of stability,\" he said.\nHis base case is for the broader bull trend to continue, backed by semiconductor earnings and improved risk appetite, but at a slower and bumpier pace. \"After such a steep rebound, some consolidation would be healthy, and investors should not expect the market to rise at the same pace from here.\"",
    "bodyJa": "韓国のコスピは、投資家が指数を支配する同国の半導体大手に群がる中、最近の下落から反転し、強気相場の領域に戻った。\n先月、レバレッジをかけたポジションと強制的な売りによって部分的に下落し、ベンチマークは弱気市場の領域に押し込まれた後、強気市場の一般的に使用される基準である7月の安値から20％以上上昇した。\n反転のスピードはハイテク株のボラティリティの高さを強調しており、韓国の株価上昇はいつまで続くのかという、より大きな疑問を投げかけている。\n強気派にとって、答えは主に、韓国の半導体大手の背後にあるファンダメンタルズが、ますます楽観的な期待に追いつくことができるかどうかにかかっています。米国の好調なテクノロジー収益とAIインフラ投資への継続的な取り組みにより、メモリチップの需要は引き続き堅調であるという確信が再び高まっている。\nＫＢセキュリティーズのグローバル投資戦略責任者、ピーター・キム氏は「ＡＩの上昇と好調な収益の継続は、下落局面でも常に続いており、市場を正常な状態に戻すのがファンダメンタルズであり、その逆ではない」と述べた。\nキム氏は、半導体暴落の際に評価や利益が大きく疑われたことはなく、代わりに技術的要因と資金の流れによって動かされたと述べた。規制当局が規則を強化し、証券会社が証拠金とリスクの要件を正規化したことで、レバレッジをかけたポジションの巻き戻しも緩和された。そうすれば、市場は暴落前の準備期間よりも堅固な基盤を保つ可能性がある。\n集中のリスク — それとも報酬?\nコスピはほんの一握りの半導体企業に依存しているため、その強気相場はAIに対するセンチメントの変化に過度にさらされている。\nレイリアント・グローバル・アドバイザーズの調査責任者フィリップ・ウール氏は、「現時点では韓国の株式市場は基本的にAIハードウェア取引と同義だ」と述べた。\nウール氏は、無理な売りが沈静化し、押し目買いが戻ってきて、買い逃すのではないかという懸念が根付いたため、反発は部分的にはテクニカルなものだったと述べた。しかし、予想を上回るビッグテック企業の収益もAIインフラ支出への期待を高め、韓国のハードウェア企業の成長予測の上方修正を裏付ける一因となった。\n「ハイパースケーラーによる設備投資に関するソフトガイダンス、トークン価格の低迷、FRBの引き締め懸念など、この物語に疑問を投げかけるものはすべて、反動が予想される」とウール氏は述べた。 「AI ハードウェアへの支出がどうなるか不確実性がある限り、ボラティリティは続くことが予想されます。」\n強気派の主張を支持するグローバルX ETFの投資ストラテジスト、ビリー・レオン氏は、韓国のコーポレートガバナンス改革と「バリューアップ」プログラムが「韓国ディスカウント」の削減に役立っていると指摘した。\n「韓国ディスカウント」とは、韓国企業が世界の同等の企業よりも低い評価額で取引されるという長年の傾向を指す。\nレオン氏は「ＫＯＳＰＩは強気相場にあるが、より重要な問題は、その上昇が投機によってもたらされているのか、それともファンダメンタルズの真の改善によってもたらされているのかということだ」と述べた。\n同氏は、半導体利益への期待が引き続き上昇しており、韓国は投機バブルではなく、基本的に支えられた強気市場に近いと見ている。しかし、小売参加者の増加、指数集中の集中、野心的な市場目標もまた、サイクル後期の行動に似てきています。\n20%というマイルストーンを深読みしすぎることについて警告する人もいた。\nフィボナッチ・アセット・マネジメント・グローバルのジョン・インユン氏は、「これを全く新たな強気相場と表現することには慎重だ」と述べた。同氏は、この回復は強制的な売りからの技術的な回復と「真の安定性の回復」の両方を表していると述べた。\n同氏の基本シナリオは、半導体収益とリスク選好度の改善を背景に、広範な強気トレンドが継続するものの、そのペースはより遅く、より不安定になるだろうとしている。 「これほど急反発した後は、ある程度の調整は健全だろう。投資家は市場がここから同じペースで上昇すると期待すべきではない。」",

  {
    "id": "hormuz-remains-blocked-iran-disputes-tr-2f433a03",
    "title": "‘Hormuz remains blocked’: Iran disputes Trump claims as traffic sinks to near 3-month lows",
    "titleJa": "「ホルムズは封鎖されたまま」：交通量が3カ月ぶりの低水準近くに落ち込む中、イランはトランプ大統領の主張に異議を唱える",
    "summaryJa": "イラン当局は、米国がホルムズ海峡を「完全に支配」しているとするドナルド・トランプ米大統領の繰り返しの主張を反発している。水曜日、イランのペルシャ湾海峡当局はXへの投稿で、「ホルムズ海峡はもはや封鎖されていないという米国当局者の主張や度重なる投稿は現実を変えるものではない。ホルムズ海峡は封鎖されたままであり、イランの条件が受け入れられるまで再開されることはない」と述べた。",
    "bodyOriginal": "Iranian authorities have pushed back on U.S. President Donald Trump's repeated claims that Washington has \"total control\" over the Strait of Hormuz.\nOn Wednesday stateside, Iran's Persian Gulf Strait Authority said in a post on X that \"Claims and repeated posts by U.S. officials that the Strait of Hormuz is no longer blocked do not change the reality: the Strait of Hormuz remains blocked and will not be reopened until Iran's conditions are accepted.\"\nTrump had said in a Truth Social post earlier that \"The U.S.A. has total control over the Strait of Hormuz. I THINK WE WILL KEEP IT!\"\nWhile both sides continue to make contradictory claims, data from trade intelligence firm Kpler showed that ship traffic through the Hormuz waterway is near a 3-month low.\nVessel transits sat at a 5-day average of around 13 on Tuesday, nearly the lowest level since May 12, according to a CNBC analysis of data provided by the trade intelligence firm Kpler. This includes ships of all types, from cargo vessels to oil tankers.\nTraffic is about 90% lower than the daily average of 130 ships that transited Hormuz before the U.S. and Israel attacked Iran on Feb. 28.\nBoth Washington and Tehran have hardened their negotiating stances, asking for \"reparations\" from the other side, among other demands.\nIran's Supreme National Security Council laid out sweeping demands over the weekend for reopening the Strait of Hormuz, including an end to the U.S. naval blockade, sanctions relief, American troop withdrawals and war reparations.\n'Confusion and bewilderment'\nThe developments come as Mohammad Reza Naqdi, a top advisor to the commander of Iran's Islamic Revolutionary Guard Corps, told PBS in an interview on Tuesday stateside that \"victory is on our side\" and that \"we have also seen how the American military is weaker than what we perceived.\"\nHe pointed to what he described as Washington's shifting objectives over the course of the conflict, including wanting to invade Kharg Island and opening the Strait of Hormuz.\n\"We saw confusion and bewilderment in America. It became a war without a strategy. Every two or three days, they announced a new objective ... They mobilized their battleships. Everything they tried, we can show how we were victorious.\"\nWhen asked if the plan was to drag the conflict out until Trump leaves office, Naqdi said the goal was for Iran to \"attain deterrence.\"\nAs such, he said that one way was to prolong the conflict and cause attrition, so if anyone wants to attack Iran, there will be a cost.\n— CNBC's Spencer Kimball and Deena Zaidi contributed to this report.",
    "bodyJa": "イラン当局は、米国がホルムズ海峡を「完全に支配」しているとするドナルド・トランプ米大統領の繰り返しの主張を反発している。\n水曜日、イランのペルシャ湾海峡当局はXへの投稿で、「ホルムズ海峡はもはや封鎖されていないという米国当局者の主張や度重なる投稿は現実を変えるものではない。ホルムズ海峡は封鎖されたままであり、イランの条件が受け入れられるまで再開されることはない」と述べた。\nトランプ大統領は以前、トゥルース・ソーシャルへの投稿で、「米国はホルムズ海峡を完全に支配している。我々はそれを維持すると思う！」と述べていた。\n双方は矛盾した主張を続けているが、貿易情報会社Kplerのデータによると、ホルムズ水道を通過する船舶の交通量は3カ月ぶりの低水準に近い。\n貿易情報会社Kplerが提供したデータをCNBCが分析したところによると、火曜日の船舶の通過回数は5日間平均約13回で、5月12日以来ほぼ最低水準となった。これには、貨物船から石油タンカーまで、あらゆる種類の船舶が含まれます。\n交通量は、米国とイスラエルが2月28日にイランを攻撃する前にホルムズを通過した船舶130隻の1日平均よりも約90％少ない。\nアメリカ政府とイラン政府は双方とも交渉姿勢を硬化させ、他の要求の中でもとりわけ相手側に「賠償」を求めている。\nイラン国家安全保障最高会議は先週末、米国の海上封鎖の解除、制裁緩和、米軍撤退、戦争賠償を含むホルムズ海峡再開に向けた包括的な要求を打ち出した。\n「混乱と当惑」\nこの展開は、イランイスラム革命防衛隊司令官の最高顧問モハマド・レザー・ナクディ氏が火曜日のインタビューで米PBSに対し、「勝利は我々の側にある」とし、「我々はまた、米軍が我々が認識していたよりもいかに弱いのかも目の当たりにした」と語った中で明らかになった。\n同氏は、カーグ島への侵攻やホルムズ海峡の開放など、紛争の過程でワシントンの目標が変化していると述べたものを指摘した。\n「我々はアメリカ国内で混乱と当惑を目の当たりにした。戦略のない戦争となった。二日か三日ごとに彼らは新たな目標を発表した…彼らは戦艦を動員した。彼らが試みたすべてを見て、我々がどのように勝利したかを示すことができる。」\nトランプ大統領が退任するまで紛争を長引かせる計画なのかとの質問に対し、ナクディ氏はイランが「抑止力を獲得する」ことが目的だと述べた。\nそのため、紛争を長引かせ消耗を引き起こすことが一つの方法であり、イランを攻撃しようとする者がいれば代償が生じるだろうと同氏は述べた。\n— CNBCのスペンサー・キンボール氏とディーナ・ザイディ氏がこのレポートに貢献しました。",

  {
    "id": "this-chinese-firm-has-topped-micron-and-7c598fab",
    "title": "This Chinese firm has topped Micron and Kioxia in shipments of crucial NAND memory chips",
    "titleJa": "この中国企業は重要なNANDメモリチップの出荷量でマイクロンとキオクシアを上回った",
    "summaryJa": "Counterpoint Research は、大規模な DRAM セグメントとともに人工知能の需要から恩恵を受けているメモリ チップの NAND セグメントに注目しました。",
    "bodyOriginal": "BEIJING — Yangtze Memory Technologies is rapidly gaining market share in a critical chip sector, according to Counterpoint Research.\nThe company, also known as YMTC, landed in third place by shipments globally in the second quarter, behind South Korea's Samsung and SK hynix but beating out U.S. rival Micron and Japan's Kioxia, Counterpoint data released Wednesday showed.\nThat's when looking at the NAND memory segment, which contributes about one-fourth of Micron's revenue. NAND chips retain data even when devices are powered off but are slower than DRAM memory chips, which operate more quickly — at a far higher cost, forming about three-fourths of Micron's revenue.\nYMTC reached third place with a 14% share, the report said. It narrowly beat Kioxia a year ago, but fell back behind in following months, Counterpoint Research Director MS Hwang said.\n\"YMTC is projected to pull further ahead in 2027 and 2028. From that perspective, YMTC achieving third place this quarter carries significant weight in the competitive landscape,\" Hwang said.\nHe said a 15% market share is the minimum needed for a memory manufacturer to fund its own capital expenditures for future growth.\nYMTC is preparing to go public in mainland China, following the blockbuster debut of DRAM-focused Chinese memory chip company CXMT last month.\nCXMT held 7% of the DRAM market in the second quarter, in fourth place behind Micron, SK hynix and market leader Samsung, a separate Counterpoint report showed earlier this month.\nBoth DRAM and NAND memory chip markets have reached record sales, at nearly $100 billion and $46 billion, respectively, in the first quarter, according to Counterpoint.\nDespite YMTC's gains in shipments, the company still lagged behind Micron and Kioxia in terms of NAND chip revenue, the research firm said. It noted YMTC still sells more to consumer applications rather than data centers — a business expected to take half of all available NANDs by the end of 2026.\nIn order to ramp up NAND production, SK hynix is resuming investment at a facility in the Chinese coastal city of Dalian after a four-year pause, Korean media reported this week. SK hynix did not immediately respond to a CNBC request for comment.",
    "bodyJa": "北京 - Counterpoint Research によると、長江メモリーテクノロジーズは重要なチップ分野で急速に市場シェアを拡大​​している。\n水曜日に発表されたカウンターポイントのデータによると、YMTCとしても知られる同社は、第2四半期の出荷台数で世界第3位となり、韓国のサムスンとSKハイニックスに次ぐものの、米国のライバルであるマイクロンと日本のキオクシアを上回った。\nそれは、Micron の収益の約 4 分の 1 を占める NAND メモリ部門に目を向けた場合です。 NAND チップはデバイスの電源がオフになってもデータを保持しますが、より高速に動作する DRAM メモリ チップよりも遅く、コストがはるかに高く、マイクロンの収益の約 4 分の 3 を占めています。\n報告書によると、YMTCはシェア14%で3位となった。カウンターポイントのリサーチディレクターMS Hwang氏によると、同社は1年前にキオクシアを僅差で破ったが、その後数カ月で後退したという。\n「YMTCは2027年と2028年にさらに前進すると予測されています。その観点から見ると、YMTCが今四半期に3位を獲得したことは、競争環境において大きな重みを持っています」とファン氏は述べた。\n同氏は、メモリメーカーが将来の成長に向けた設備投資を賄うためには、15％の市場シェアが最低限必要だと述べた。\nYMTCは、先月のDRAMに特化した中国のメモリチップ企業CXMTの大ヒットデビューに続き、中国本土での株式公開の準備を進めている。\n今月初めのカウンターポイントの別のレポートによると、CXMTは第2四半期にDRAM市場の7％を占め、マイクロン、SKハイニックス、市場リーダーのサムスンに次いで4位となった。\nCounterpointによると、DRAMとNANDメモリチップ市場はいずれも、第1四半期にそれぞれ1,000億ドル近くと460億ドル近くの記録的な売上高に達したという。\nYMTCは出荷台数が増加しているにもかかわらず、NANDチップの収益という点では依然としてマイクロンやキオクシアに後れを取っていると調査会社は述べた。 YMTCは依然としてデータセンターよりも消費者向けアプリケーションへの販売が多く、2026年末までに利用可能なすべてのNANDの半分を占めると予想されるビジネスであると同社は指摘した。\nNAND生産を増強するため、SKハイニックスは4年間の休止期間を経て、中国沿岸都市大連の施設への投資を再開すると韓国メディアが今週報じた。 SKハイニックスはCNBCのコメント要請にすぐには応じなかった。",

    "id": "goldman-says-japan-s-1-trillion-of-reser-1c5cb6e9",
    "title": "Goldman says Japan's $1 trillion of reserves leaves 'plenty of capacity' for further yen interventions",
    "titleJa": "ゴールドマン、日本の1兆ドルの外貨準備にはさらなる円介入のための「十分な余力」があると語る",

    "bodyOriginal": "Japan has enough cash at its disposal for a couple more rounds of yen-buying on the scale of last month's historic intervention, helped by access to a Federal Reserve facility, according to Goldman Sachs.\nOf Japan's roughly $1 trillion in U.S. dollar reserves, about $200 billion — likely the size of the July operation — sits in cash or cash equivalents, Goldman estimated.\n\"They already have at their disposal enough to do another couple rounds of what we just saw,\" which were near record size, Karen Fishman, a Goldman Sachs Research strategist, said on the bank's Exchanges podcast published late Wednesday U.S. time.\n\"Realistically, they wouldn't come close to using all of that, but I think that just sort of hits home the point that they have plenty of capacity to keep intervening if they wish,\" Fishman said. Access to the Fed's facility would theoretically make that full trillion dollars available in liquid form, she added.\nJapanese officials have said that they won't hesitate to step back in if needed. That carries \"some credibility,\" Fishman said, now that the U.S. has intervened alongside Japan to support the yen for the first time since 1998. The two countries also acted in coordination with other Group of Seven nations to curb gains in the yen after the 2011 earthquake.\nThe joint action in late July came after the yen slid toward 164 per dollar, hovering near its weakest level in four decades, and has put the Bank of Japan's September policy meeting at the center of whether that reprieve holds.\nThe Wall Street bank estimates Tokyo deployed as much as $85 billion in the first two days of last month's operation, saying it was Japan's biggest two-day foray into currency markets on record outside October 2011, when Tokyo intervened in the aftermath of the Fukushima disaster.\nThe yen had strengthened past its 200-day moving average of 158 per dollar following the intervention. But those gains are now fading: the currency slipped on Wednesday to near the key 160 level, giving back about half the strength from the intervention.\nThe intervention is \"not a sustainable fix ... ultimately just buys some time,\" said Fishman, noting that after Japan's solo action in April and May, the yen was back at 40-year lows within months.\nJapan's finance ministry has said it plans to use the Fed's FIMA repo facility, which lets central banks raise dollar cash against their Treasury holdings, sparing Tokyo from dumping Treasuries on the secondary market to fund intervention.\nThe prospect of a much bigger war chest has already shifted sentiment. Clients \"really did get quite bulled up on the yen\" last week once the Fed facility potentially put the full $1 trillion within reach for intervention, Praneet Shah, head of FX options trading at Goldman, said in the podcast.\nOptions pricing shows traders are still bracing for another sharp yen surge, and that fear itself may deter fresh selling. Shah said elevated premiums on short-dated yen calls point to a market still on guard for a sudden gap move, making investors wary of betting against the currency as it drifts back toward 160.\n\"If spot is trading up into 160, there's a real risk that you don't want to continue selling yen when you've got this large risk of a drawdown still priced by the market,\" he said.\nWhat may trigger another round\nWhether Tokyo pulls the trigger again may hinge on the carry differential between Japanese and U.S. borrowing rates, which remains the overwhelming driver of the exchange rate, according to Shah.\nThe yield on 10-year U.S. Treasury stood at 4.690% late Wednesday, compared with 2.839% for 10-year Japanese government bonds, leaving investors with a substantial incentive for holding U.S. debt.\nOn the Japanese side, markets now price a 65% chance of a 25-basis-point Bank of Japan hike in September and about 40 basis points of tightening by year-end. \"If they don't deliver\" a September hike, Fishman said, \"that would put renewed downward pressure on the yen.\"\nThe BOJ would need to hike faster than expected to shift the carry dynamics that have driven a 45% yen depreciation over five years, Shah said.\nAny misses, the market will really start to increase expectations of a subsequent intervention.Praneet ShahHead of foreign exchange options trading\nOn the U.S. side, cooler economic data could ease pressure on the yen by weakening the case for the Federal Reserve to hike rates further, and revive bets on another intervention, Shah said.\nShah pointed to July 2024, when one of the most effective rounds of BOJ-MOF intervention landed on a U.S. CPI miss, compounded by a payrolls miss days later.\n\"Any misses, I think the market will really start to increase expectations of a subsequent intervention later this week,\" he said.\nWednesday's inflation report came in line with expectations. The consumer price index rose a seasonally adjusted 0.1% in July, matching consensus forecasts, while the annual rate eased to 3.4% from 3.5% in June. Treasury yields pulled back after the release.",
    "bodyJa": "ゴールドマン・サックスによると、日本には連邦準備理事会の施設へのアクセスの助けもあり、先月の歴史的な介入規模での円買いをあと数回行うのに十分な資金が自由に使えるという。\n日本の約1兆ドルの米ドル準備のうち、おそらく7月のオペの規模に相当する約2000億ドルが現金または現金同等物として存在するとゴールドマンは推定した。\nゴールドマン・サックス・リサーチのストラテジスト、カレン・フィッシュマン氏は、米国時間水曜遅くに公開された同行のポッドキャスト「Exchanges」で、「彼らは、我々が今見たことをさらに数ラウンド行うだけの十分な資金をすでに自由に持っている」と述べ、その規模は記録的な規模に近かったと述べた。\n「現実的に言えば、彼らはそのすべてを利用することには程遠いでしょうが、彼らが望めば介入し続けるだけの十分な能力があるという点は、ある意味当たっていると思います」とフィッシュマン氏は語った。 FRBの施設にアクセスできれば、理論的にはその全額が流動性の形で利用可能になると同氏は付け加えた。\n日本の当局者らは、必要であれば躊躇なく介入すると述べた。フィッシュマン氏は、米国が1998年以来初めて円を支援するために日本とともに介入した今、これには「ある程度の信頼性」があると述べた。両国はまた、2011年の地震後の円の上昇を抑制するために他のG7諸国と連携して行動した。\n7月下旬の共同行動は、円が1ドル＝164円に向けて下落し、40年ぶりの安値付近で推移した後に行われたもので、日銀の9月政策決定会合がこの猶予が維持されるかどうかの中心となっている。\nウォール街銀行は、東京が先月のオペレーションの最初の2日間で850億ドルもの資金を投入したと推定しており、これは東京が福島事故の余波で介入した2011年10月を除けば、記録上、日本による2日間の為替市場への進出としては最大規模だったと述べた。\n介入後、円は２００日移動平均の１ドル＝１５８円を超えて上昇した。しかし、こうした上昇は現在しぼみつつある。水曜日には通貨は主要な160レベル近くまで下落し、介入による強さの約半分が戻った。\nフィッシュマン氏は、この介入は「持続可能な解決策ではなく、結局は時間を稼ぐだけだ」と述べ、4月と5月の日本の単独行動の後、円は数カ月以内に40年ぶりの安値に戻ったと指摘した。\n日本の財務省は、中央銀行が財務省保有に対してドル現金を調達できるFRBのFIMAレポ制度を利用する計画であると発表し、日本政府が介入資金のために流通市場に国債を投げ売りすることを回避できる。\nはるかに大きな軍資金が得られるという見通しにより、すでにセンチメントは変化している。ゴールドマンの外為オプション取引責任者、プラニート・シャー氏はポッドキャストの中で、FRBのファシリティーが潜在的に1兆ドル全額を介入の範囲内に置く可能性が出てから、顧客は先週「実際に円に対してかなり強気になった」とポッドキャストで述べた。\nオプションの価格設定を見ると、トレーダーは依然として円の急騰に備えており、その懸念自体が新たな売りを妨げる可能性がある。シャー氏は、円の短期コールのプレミアムの上昇は、市場が依然として突然のギャップ変動を警戒していることを示しており、円が160円に向けて逆戻りする中、投資家は円に対して賭けることに慎重になっていると述べた。\n同氏は、「現物相場が160円まで上昇している場合、ドローダウンの大きなリスクがまだ市場に織り込まれているときに、円を売り続けたくないという現実的なリスクがある」と述べた。\n次のラウンドを引き起こす可能性のあるもの\nシャー氏によると、東京が再び引き金を引くかどうかは、依然として為替レートの圧倒的な要因となっている日米借入金利のキャリー格差に左右される可能性がある。\n水曜日遅くの米10年国債利回りは4.690％、日本10年国債の利回りは2.839％となっており、投資家には米国債を保有する大きなインセンティブが残っている。\n日本側では、市場は現在、日銀が９月に２５ベーシスポイントの利上げを行い、年末までに約４０ベーシスポイントの引き締めを行う確率を６５％織り込んでいる。フィッシュマン氏は、９月利上げが「実現できなければ、円に新たな下落圧力がかかることになる」と述べた。\nシャー氏は、５年間で４５％の円安をもたらしたキャリー力学を変えるには、日銀が予想よりも速いペースで利上げする必要があると述べた。\n失敗すれば、市場はその後の介入への期待を実際に高め始めるでしょう。プラニート・シャー外国為替オプション取引責任者\nシャー氏は、米国側については、経済指標の冷え込みで米連邦準備理事会（ＦＲＢ）が追加利上げする根拠が弱まり、追加介入への賭けが復活することで円への圧力が緩和される可能性があると述べた。\nシャー氏は2024年7月を指摘し、日銀と財務省の介入の最も効果的なラウンドの1つが米国のCPIの失敗に見舞われ、その数日後に給与支払いの失敗がさらに悪化したと指摘した。\n同氏は「失敗したとしても、市場は今週後半に追加介入への期待を本格的に高め始めるだろう」と述べた。\n水曜日のインフレ報告は予想と一致した。 7月の消費者物価指数は季節調整済みで0.1％上昇し、コンセンサス予想と一致したが、年率は6月の3.5％から3.4％に鈍化した。発表後、国債利回りは低下した。",

    "title": "South Korea's Kospi swings from bear to bull-market territory in just over a month on AI trade",
    "titleJa": "韓国のコスピ、AI取引でわずか1カ月余りで弱気相場から強気相場の領域に転落",
    "summaryJa": "AI貿易の世界的な復活が先月の歴史的な下落後の急激な回復を促進する中、韓国株は木曜日に反発し、ベンチマークのコスピをテクニカル強気相場に押し上げた。ＬＳＥＧのデータによると、コスピは序盤の取引で４％超急騰し、７月３０日の安値から約２３％まで反発した。",
    "bodyOriginal": "South Korean stocks rallied Thursday, lifting the benchmark Kospi into a technical bull market as a global revival in the AI trade fuels a sharp recovery after last month's historic sell-off.\nThe Kospi jumped over 4% in early trade, taking its rebound from its July 30 low to roughly 23%, data from LSEG showed.\nIndex heavyweights Samsung Electronics and SK Hynix led the gains, with the chip giants rising over 4% and 7%, respectively.\nInvestor appetite for technology hardware stocks is returning as the latest earnings from global tech giants point to continued heavy spending on artificial intelligence.\nThe latest leg of the Kospi's rebound has been fueled by renewed optimism over artificial-intelligence spending, helping revive interest in South Korea's heavyweight semiconductor stocks.\n\"The AI spending boom is far from over,\" David Morrison, senior market analyst at Trade Nation said in a note late Tuesday, pointing to strong results from U.S. AI-related companies. Supermicro and cloud provider CoreWeave surged overnight following better-than-expected results.\nThe developments have provided a fresh boost to Korean chipmakers, whose fortunes are closely tied to demand for the memory chips used in AI infrastructure. Samsung Electronics and SK Hynix have led the Kospi's advance, extending a sharp rebound from last month's technology-driven sell-off.\nThe rally in South Korean stocks has room to run further as strength returns to the country's heavyweight memory chipmakers, according to Fundstrat Global Advisors.\nMark Newton, the firm's head of technical strategy, said the iShares MSCI South Korea ETF has broken above a key technical level on the back of gains in Samsung Electronics and SK Hynix, improving the near-term outlook for Korean equities. The ETF's latest move confirmed a reversal pattern that Newton said \"looks attractive technically for further near-term gains.\"\nThe bigger signal may be coming from memory stocks themselves. After being among the hardest hit during the recent technology sell-off, memory shares are beginning to outperform the broader tech sector for the first time since June, Fundstrat said.\nNewton described that as \"a good sign in the short run for Memory within Technology,\" adding that the group appears to be one of the last major corners of tech to begin turning higher.\nThat matters for South Korea given the outsized influence of Samsung and SK Hynix on the country's equity market. Fundstrat said the combination of South Korea's rebound and the recovery in memory chips is broadening a rotation back into technology, even as some major U.S. tech names have struggled.\nNewton remains bullish on the market in the near term, although he cautioned that the rally could lose momentum later this month if U.S. Treasury yields and the dollar begin climbing again. For now, however, he said South Korea and memory stocks \"look to be the right vehicles for near-term risk-on exposure.\"",
    "bodyJa": "AI貿易の世界的な復活が先月の歴史的な下落後の急激な回復を促進する中、韓国株は木曜日に反発し、ベンチマークのコスピをテクニカル強気相場に押し上げた。\nＬＳＥＧのデータによると、コスピは序盤の取引で４％超急騰し、７月３０日の安値から約２３％まで反発した。\n指数の有力企業であるサムスン電子とSKハイニックスが上昇を主導し、半導体大手はそれぞれ4％と7％以上上昇した。\n世界的なハイテク大手の最新決算が人工知能への多額の支出が続いていることを示しているため、テクノロジー・ハードウェア株に対する投資家の意欲が戻ってきている。\nコスピの最近の反発は、人工知能への支出に対する新たな楽観的な見方によって促進され、韓国の有力半導体株への関心が再び高まっている。\nトレード・ネイションのシニア市場アナリスト、デービッド・モリソン氏は火曜日遅くのメモで、米国のAI関連企業の好調な業績を指摘し、「AI支出ブームはまだ終わっていない」と述べた。スーパーマイクロとクラウドプロバイダーのコアウィーブは予想を上回る業績を受けて一夜にして急騰した。\nこの開発は、AIインフラで使用されるメモリチップの需要と密接に運命を結び付けている韓国のチップメーカーに新たな後押しをもたらした。サムスン電子とSKハイニックスがコスピの躍進を主導し、先月のテクノロジー主導の下落からの急反発を延長した。\nファンドストラット・グローバル・アドバイザーズによると、韓国の有力メモリチップメーカーに力が戻り、韓国株の上昇はさらに進む余地があるという。\n同社のテクニカル戦略責任者マーク・ニュートン氏は、サムスン電子とSKハイニックスの上昇を背景にiシェアーズMSCI韓国ETFが重要なテクニカル水準を突破し、韓国株の短期的な見通しが改善したと述べた。 ETFの最新の動きは、ニュートン氏が「短期的なさらなる利益にとってテクニカル的に魅力的に見える」と述べた反転パターンを裏付けた。\nより大きなシグナルはメモリ株自体から発せられている可能性がある。ファンドストラット氏によると、メモリ株は最近のテクノロジー株下落で最も大きな打撃を受けたが、6月以来初めてハイテクセクター全体をアウトパフォームし始めているという。\nニュートン氏はこれを「メモリー・イン・テクノロジーにとって短期的には良い兆候」と表現し、このグループがテクノロジー分野で上昇傾向にある最後の主要な一角の1つであるようだと付け加えた。\n韓国の株式市場におけるサムスンとSKハイニックスの多大な影響力を考慮すると、これは韓国にとって重要だ。ファンドストラット氏は、米国の大手ハイテク企業の一部が苦戦しているにもかかわらず、韓国の景気回復とメモリチップの回復が相まってテクノロジー分野への回帰が拡大していると述べた。\nニュートン氏は目先の市場に対して依然として強気の姿勢を維持しているが、もし米国債利回りが低下しドルが再び上昇し始めれば、今月後半に上昇の勢いが失われる可能性があると警告した。ただ今のところ、韓国株とメモリー株は「短期的なリスクオン・エクスポージャーの適切な手段になりそうだ」と同氏は述べた。",

    "title": "Oil rises on worries over supply disruptions as spill near Oman worsens",

    "summaryJa": "オマーン湾と紅海の最近の船舶への致命的な攻撃を受けて、木曜日には石油が上昇し、オマーン近郊での流出が拡大し続けたため。国際指標となるブレント原油先物（１０月渡し）は１．０１％上昇し、１バレル＝８８．０９ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は１．１５％上昇し、１バレル＝８２．３１ドルとなった。",
    "bodyOriginal": "Oil rose on Thursday recent deadly attacks on vessels in the Gulf of Oman and the Red Sea, and as a spill near Oman continued to spread.\nFutures for international benchmark Brent crude for October delivery gained 1.01% to $88.09 a barrel. U.S. West Texas Intermediate futures for September advanced 1.15% to $82.31 per barrel.\nOman's coastline has reportedly started to be affected by a massive oil spill caused by a leaking tanker that ran aground June 30 carrying an estimated 800,000 barrels of Russian oil and is under international sanctions, according to Reuters. It's leaking near a nature reserve that's home to wildlife including Arabian Sea humpback whales and Socotra cormorants, Reuters reported.\nMeanwhile, the International Energy Agency said Wednesday that global oil demand is set to fall further than previously expected this year, amid a deepening impact from the closure of the Strait of Hormuz.\n\"Renewed hostilities and maritime disruptions\" are undermining efforts to boost global oil supply, the IEA said. Supply remained 6.3 million barrels a day lower year-on-year in July.\nFurther, deadly attacks on vessels in the Gulf of Oman and the Red Sea have pushed worries over supply disruptions up another notch. While there are signs that diplomatic efforts toward reopening the Strait of Hormuz are ongoing, the over five-month-old war continues to disrupt energy flows.\n\"The lack of clarity over the possibility of a full reopening of the waterway could leave oil prices exposed to the upside at a time when the market remains tight,\" said Christopher Tahir, a senior market strategist at Exness, adding that any additional setbacks could drive oil prices further up.",
    "bodyJa": "オマーン湾と紅海の最近の船舶への致命的な攻撃を受けて、木曜日には石油が上昇し、オマーン近郊での流出が拡大し続けたため。\n国際指標となるブレント原油先物（１０月渡し）は１．０１％上昇し、１バレル＝８８．０９ドルとなった。米国ウェスト・テキサス・インターミディエート先物９月限は１．１５％上昇し、１バレル＝８２．３１ドルとなった。\nロイター通信によると、オマーンの海岸線は、推定80万バレルのロシア産原油を積んで6月30日に座礁したタンカーの漏洩による大規模な原油流出の影響を受け始めており、国際制裁下にあると伝えられている。ロイター通信によると、アラビア海のザトウクジラやソコトラウなどの野生動物が生息する自然保護区付近で漏洩しているという。\n一方、国際エネルギー機関は水曜日、ホルムズ海峡閉鎖の影響が深刻化する中、今年の世界の石油需要は従来の予想よりもさらに減少する見通しであると発表した。\nＩＥＡは「敵対行為の再発と海洋混乱」が世界の石油供給拡大に向けた取り組みを台無しにしていると述べた。 ７月の供給量は前年同月比日量６３０万バレル減にとどまった。\nさらに、オマーン湾と紅海での船舶への致命的な攻撃により、供給混乱に対する懸念がさらに高まっています。ホルムズ海峡の再開に向けた外交努力が進行中の兆しがある一方で、5か月以上にわたる戦争によりエネルギーの流れは混乱し続けている。\nエクスネスのシニア市場ストラテジスト、クリストファー・タヒル氏は「水路の全面再開の可能性が不透明なため、市場が引き締まった状態が続く中、原油価格は上昇にさらされる可能性がある」と述べ、さらなる後退があれば原油価格はさらに上昇する可能性があると付け加えた。",

  {
    "id": "inside-india-newsletter-why-global-funds-964b4c14",
    "title": "Inside India newsletter: Why global funds are flocking to GIFT City in Modi’s home state",
    "titleJa": "Inside India ニュースレター: なぜ世界の資金がモディ首相の故郷のギフトシティに集まるのか",
    "summaryJa": "こんにちは、シンガポールからメッセージを書いているプリヤンカ・サルベです。「インサイド・インディア」の最新版へようこそ。世界で最も急速に成長している大経済国のストーリーや展開をワンストップでご覧いただけます。",
    "bodyOriginal": "Hello, this is Priyanka Salve, writing to you from Singapore.\nWelcome to the latest edition of \"Inside India\" — your one-stop destination for stories and developments from the world's fastest-growing large economy.\nIndia's Gujarat International Finance Tec-City, also known as GIFT City, aspires to be what Hong Kong is to mainland China, or what Dubai International Financial Center is to the United Arab Emirates. While progress has been slow, after more than a decade of its launch, GIFT City is finally drawing interest from leading asset management firms.\nI spoke with experts to figure out if India's first and only global financial center is finally coming into its own.\nAny thoughts on today's newsletter? Share them with the team.\nThe big story\nA strong domestic investor appetite for global markets, relaxed rules for foreign currency usage, and increasing tax sops are driving leading asset management companies to India's GIFT City, more than a decade after its launch.\nGIFT City, located in Prime Minister Narendra Modi's home state of Gujarat, is emerging as an important gateway for international investors looking to access India's growth opportunity, as well as resident Indians seeking international wealth solutions, experts said.\nEarlier this year, the government improved tax structures to put GIFT City on par with global financial centers such as Singapore, said Rajesh Gandhi, Partner at Deloitte India.\nWhile these tax benefits are driving inbound investment, the government has also loosened capital controls on outbound investments made via the City, Gandhi said, adding that his firm was seeing an increase in outbound and inbound funds being set up in India's first global financial center.\nGlobal fund houses are waking up to the pent-up demand from Indian investors for overseas markets such as the U.S., and GIFT City offers the most convenient route, according to experts.\nGlobal interest\nLast week, Standard Chartered announced plans to launch its Signature CIO funds from GIFT City.\nSamir Subberwal, global head of wealth solutions, retail products, data and analytics at Standard Chartered, told CNBC that the company will launch the funds \"in the coming weeks\" and plans to expand its suite of wealth solutions over time.\nThe British international banking group was among the first foreign banks to start operating out of GIFT City in 2020. And with the launch of Signature CIO funds, it plans to expand its wealth management business in what Subberwal describes as \"one of the world's fastest-growing international financial centres.\"\nGovernment data shows that fund management entities in the city increased to 217 in May this year from 194 in November last year.\nAnother major global asset manager, BlackRock, through its joint venture with Indian billionaire Mukesh Ambani's Jio Financial Services, is looking to launch global ETFs out of GIFT City.\nJio BlackRock Asset Management, the joint venture company, secured regulatory approval to launch funds out of GIFT City in May.\nIt is preparing to start two outbound funds from the financial center before the end of September, one global equity fund and another emerging markets fund, Rishi Kohli, the firm's chief investment officer, told Moneycontrol — a news outlet part of Network18, which is owned by Ambani's Reliance Industries.\nDue to strong capital controls, there are limits on the funds that asset managers in India can deploy in overseas markets, experts said, pointing to the aggregate $7 billion ceiling on outbound investments, which has already been exhausted.\nAs a result, despite Indian markets underperforming their global peers by a wide margin, equity funds in India logged positive inflows for the 65th consecutive month, according to data from India's mutual fund industry body AMFI.\nBut funds operating from GIFT City can change that as the outbound investment limits do not apply to them, allowing these funds to tap the growing pool of Indian investors.\nLong road ahead\nBut despite these tailwinds, experts said that GIFT City has a long way to go before it can compete with global financial centers such as Singapore, Delaware in the U.S., and Dubai International Financial Center in the United Arab Emirates.\nFrom a regulatory aspect, GIFT City is on par with other global financial centers, but it needs to shed its image as an India-specific center and emerge as a destination for global capital. It also needs to match the lifestyle benefits that come with living in cities such as Dubai and Singapore.\nSome argue that it just needs \"more time\" to develop. DIFC took 20 years to become the powerhouse it is today, said Vivek Singhania, co-founder of Mumbai-based fund administration service provider Dovetail Capital. He told CNBC that regulatory structures at the GIFT City were formed around 2020, and now things are gradually coming together.\nSinghania said his firm is in discussions with a several U.S. and Singapore-based funds as well as Indian funds that are keen to set up operations in city.\nAmong those bullish on GIFT City is also Vikas Satija, managing director and chief executive at Shriram Wealth. His firm scouts for funds operating out of GIFT City for their \"high-net-worth clients\" in India and outside.\nHe predicts that by 2030, GIFT City will become a key global financial center and adds that the arrival of one of the largest global fund houses, BlackRock, is a \"big sign.\"\nNeed to know\nThe 72-hour crisis that threatened Meta's business in India\nTensions are high between Meta Platforms and Indian regulators. A parliamentary panel threatened to remove the tech giant's safe harbor protection last week, soon after after the company was pulled up over concerns about child-abuse content.\nU.S. judge ends graft case against Indian billionaire Gautam Adani\nA U.S. judge on Monday dismissed the bribery case against Indian billionaire Gautam Adani, while also rebuking a senior Department of Justice official's conduct related to the case as \"concerning.\"\nComing up\nAug. 14: India WPI inflation for July.\nAug. 17: India unemployment rate for July.",
    "bodyJa": "こんにちは、シンガポールからメッセージを書いているプリヤンカ・サルベです。\n「インサイド・インディア」の最新版へようこそ。世界で最も急速に成長している大経済国のストーリーや展開をワンストップでご覧いただけます。\nギフトシティとしても知られるインドのグジャラート国際金融テックシティは、中国本土にとっての香港、またはアラブ首長国連邦にとってのドバイ国際金融センターのような存在になることを目指しています。進歩は遅いものの、開始から 10 年以上が経ち、GIFT City はついに大手資産管理会社からの関心を集めています。\nインド初で唯一の世界金融センターがいよいよ本領を発揮しつつあるのかどうかを知るために、私は専門家に話を聞いた。\n今日のニュースレターについて何かご意見はありますか?それらをチームと共有します。\n大きな話\nグローバル市場に対する国内投資家の強い意欲、外貨使用に関する規制の緩和、税金の引き上げにより、立ち上げから10年以上が経った今、大手資産管理会社がインドのギフトシティに集まってきている。\n専門家らによると、ナレンドラ・モディ首相の地元グジャラート州にあるギフトシティは、インドの成長機会へのアクセスを求める国際投資家や、国際的な富の解決策を求める居住インド人にとっての重要な玄関口として浮上しているという。\nデロイト・インドのパートナー、ラジェシュ・ガンジー氏は、今年初めに政府はギフトシティをシンガポールなどの世界的な金融センターと同等の地位に置くために税制を改善したと述べた。\nこれらの税制優遇措置がインバウンド投資を促進している一方で、政府は市を通じて行われたアウトバウンド投資に対する資本規制も緩和しているとガンジー氏は述べ、彼の会社ではインド初の世界金融センターに設立されるアウトバウンドおよびインバウンドのファンドが増加していると付け加えた。\n専門家らによると、世界的なファンドハウスはインド人投資家による米国などの海外市場への積もり積もった需要に目覚めており、ギフトシティは最も便利なルートを提供しているという。\n世界的な関心\n先週、スタンダードチャータードはギフトシティからシグネチャーCIOファンドを立ち上げる計画を発表した。\nスタンダードチャータード社のウェルスソリューション、小売商品、データ、分析のグローバル責任者であるサミール・サブバーワル氏はCNBCに対し、同社は「今後数週間以内に」ファンドを立ち上げ、長期的にウェルスソリューションスイートを拡大する予定であると語った。\n英国の国際銀行グループは、2020年にギフトシティで営業を開始した最初の外国銀行の1つである。また、シグネチャーCIOファンドの立ち上げにより、サブバーウォル氏が「世界で最も急速に成長している国際金融センターの1つ」と表現するこの地域でウェルスマネジメント事業を拡大する計画だ。\n政府のデータによると、市内の資金管理団体は昨年11月の194社から今年5月には217社に増加した。\nもう一つの世界的大手資産運用会社ブラックロックは、インドの億万長者ムケシュ・アンバニ氏のジオ・ファイナンシャル・サービスとの合弁事業を通じて、ギフト・シティから世界的なETFを立ち上げようとしている。\n合弁会社の Jio BlackRock Asset Management は、5 月にギフト シティからファンドを立ち上げるための規制当局の承認を獲得しました。\n同社の最高投資責任者であるリシ・コーリ氏は、アンバニ氏のリライアンス・インダストリーズが所有するネットワーク18の一部報道機関であるマネーコントロールに対し、9月末までに金融センターから2つのアウトバウンドファンド、1つは世界株式ファンド、もう1つは新興市場ファンドを開始する準備を進めていると語った。\n専門家らは、強力な資本規制のため、インドの資産運用会社が海外市場に展開できる資金には制限があり、対外投資の総額上限は70億ドルで、すでに使い果たされていると指摘した。\nその結果、インドの投資信託業界団体AMFIのデータによると、インド市場のパフォーマンスが世界の市場を大幅に下回っているにもかかわらず、インドの株式ファンドは65カ月連続でプラスの流入を記録した。\nしかし、GIFT City で運営されているファンドには対外投資制限が適用されないため、この状況は変わる可能性があり、これらのファンドは増え続けるインドの投資家層を活用できるようになる。\n先は長い\nしかし専門家らは、こうした追い風にもかかわらず、ギフトシティがシンガポール、米国のデラウェア州、アラブ首長国連邦のドバイ国際金融センターなどの世界的な金融センターと競争できるようになるまでには長い道のりがあると述べた。\n規制の面から見ると、ギフトシティは他の世界的な金融センターと同等だが、インド特有のセンターというイメージを払拭し、世界資本の目的地として台頭する必要がある。また、ドバイやシンガポールなどの都市に住むことで得られるライフスタイルの利点と一致する必要もあります。\n開発には「もっと時間がかかる」だけだと主張する人もいる。ムンバイに本拠を置くファンド管理サービスプロバイダー、ダブテイル・キャピタルの共同創設者ヴィヴェク・シンハニア氏は、DIFCが今日の強大な企業になるまでに20年かかった、と語った。同氏はCNBCに対し、ギフトシティの規制体制は2020年頃に形成され、現在は徐々に整備されつつあると語った。\nシンガニア氏は、彼の会社が米国とシンガポールに本拠を置くいくつかのファンドや、市内での事業設立に熱心なインドのファンドと協議中であると述べた。\nギフト・シティに強気な見方をしている人の中には、シュリラム・ウェルスのマネージング・ディレクター兼最高経営責任者であるヴィカス・サティヤ氏もいる。彼の会社は、インド内外の「富裕層顧客」のためにギフトシティから活動するファンドをスカウトしている。\n同氏は、ギフトシティが2030年までに主要な世界金融センターになると予測し、最大の世界的ファンドハウスの1つであるブラックロックの到着は「大きな兆候」であると付け加えた。\n知っておく必要がある\nインドにおけるメタのビジネスを脅かした72時間の危機\nメタプラットフォームとインドの規制当局の間では緊張が高まっている。議会委員会は先週、同社が児童虐待コンテンツへの懸念を理由に引き上げられた直後、同社のセーフハーバー保護を解除すると脅迫した。\n米国の判事、インドの億万長者ゴータム・アダニに対する汚職訴訟を終結\n米国の判事は月曜日、インドの億万長者ゴータム・アダニ氏に対する贈収賄事件を却下する一方、この事件に関連した司法省高官の行為を「懸念事項」として非難した。\nもうすぐ\n8月14日: 7月のインドWPIインフレ。\n8月17日: インドの7月の失業率。",
    "source": "CNBC",

  {
    "id": "cerebras-stock-plunges-14-after-second-e-5022e2af",
    "title": "Cerebras stock plunges 14% after second earnings report following IPO",
    "titleJa": "IPO後の2回目の決算報告を受け、セレブラス株は14％急落",
    "summaryJa": "Cerebras Systems は、5 月の新規株式公開後の第 2 回決算報告で通期見通しを引き上げました。しかし、株価は延長取引で約１４％下落した。第 2 四半期の業績と LSEG のコンセンサス予測は次のとおりです。",
    "bodyOriginal": "Cerebras Systems raised its full-year guidance in the second earnings report following the chipmaker's initial public offering in May. But the stock tumbled about 14% in extended trading.\nHere's how it did in the second quarter versus LSEG consensus estimates:\n- Revenue: $180 million, versus $194 million expected\n- Loss per share: 5 cents adjusted, versus 17 cents expected\nCerebras said in a statement on Wednesday that it expects core revenue of between $214 million and $216 million this quarter.\nThe company raised its full-year outlook and now expects core revenue of between $880 million and $890 million, up from a prior range of $855 million to $865 million.\nThe $180 million sales figure for the second quarter represents total revenue. Cerebras also reported a core revenue figure of $210 million, which includes \"pass-through revenue.\"\nThe company recorded a net loss of $450.5 million, after finishing with a profit of $309.5 million, or $1.91 per share, a year earlier. Most of the loss is tied to stock-compensation costs of $386.6 million.\nCerebras CEO Andrew Feldman said in an interview that AI demand is \"through the roof\" and that companies are paying up for its specialty inference chips.\nCerebras is challenging AI chip leader Nvidia for some AI tasks, especially those that need \"low latency,\" or quick responses for interactivity. The company calls it \"fast inference.\" The company said its core gross margin will expand to between 38% and 40% in the current quarter, addressing a concern for investors.\n\"Gross margins are are in a good spot, and growing, because fast inference is priced at a premium,\" Feldman said in an interview, adding that Cerebras was able to increase the AI output of its systems.\nCerebras went public on the Nasdaq in May, capitalizing on investor interest in semiconductors that can run AI models. It priced its offering at $185 and raised $6.4 billion in the offering. The stock peaked in May and has fallen since, but closed on Wednesday at $262.06, up 42% from its IPO.\nThe chipmaker has $25.4 billion in remaining performance obligations, which it said was a sign of \"extraordinary future demand.\" Feldman said that as Cerebras grows, it will benefit from larger scale. The company also said it expects revenue to triple in the next fiscal year.\n\"We will manufacture more efficiently. We'll get better pricing on componentry. We'll amortize our manufacturing organization over more units,\" Feldman said. \"All of those point up and to the right.\"\nIn recent weeks, Cerebras announced a partnership with Nvidia rival Advanced Micro Devices, with products going into production later this year, and said that OpenAI can use its chips to serve its latest model, GPT 5.6 Sol. Cerebras also offers access to its chips through its cloud, which reported $126 million in revenue during the June quarter.\nWATCH: Cerebras sees OpenAI's chip competing with other GPUs",
    "bodyJa": "Cerebras Systems は、5 月の新規株式公開後の第 2 回決算報告で通期見通しを引き上げました。しかし、株価は延長取引で約１４％下落した。\n第 2 四半期の業績と LSEG のコンセンサス予測は次のとおりです。\n- 収益: 1 億 8,000 万ドル、予想 1 億 9,400 万ドル\n- 1 株当たりの損失: 調整後 5 セント、予想 17 セント\nセレブラスは水曜日の声明で、今四半期の中核収益は２億１４００万─２億１６００万ドルになると予想していると述べた。\n同社は通期の見通しを引き上げ、コア収益は従来の8億5,500万ドルから8億6,500万ドルの範囲から8億8,000万ドルから8億9,000万ドルになると予想している。\n第 2 四半期の 1 億 8,000 万ドルの売上高は、総収益を表します。 Cerebras はまた、「パススルー収益」を含むコア収益額が 2 億 1,000 万ドルであると報告しました。\n同社は前年同期に3億950万ドル（1株当たり1.91ドル）の利益を計上した後、4億5050万ドルの純損失を記録した。損失の大半は株式補償費用３億８６６０万ドルに関係している。\nセレブラスの最高経営責任者（CEO）アンドリュー・フェルドマン氏はインタビューで、AIの需要は「天井知らず」であり、企業は同社の専門推論チップに資金を支払っていると語った。\nCerebras は、一部の AI タスク、特に「低レイテンシー」または対話性のための素早い応答を必要とするタスクに関して、AI チップのリーダーである Nvidia に挑戦しています。同社はこれを「高速推論」と呼んでいる。同社は、今四半期の中核粗利益率が38％から40％に拡大すると述べ、投資家の懸念に対処した。\nフェルドマン氏はインタビューで「高速推論にはプレミアム価格が設定されているため、粗利益率は良好であり、伸びている」と述べ、セレブラス社は自社システムのAI出力を高めることができたと付け加えた。\nセレブラスはAIモデルを実行できる半導体に対する投資家の関心を利用して5月にナスダックに上場した。公募価格は185ドルで、公募で64億ドルを調達した。株価は5月に最高値を付け、その後下落したが、水曜日の終値はIPO比42％高の262.06ドルだった。\n同社は254億ドルの履行義務を残しているが、これは「将来の異常な需要」の兆しであると同社は述べた。フェルドマン氏は、セレブラスが成長するにつれ、規模が大きくなることで恩恵を受けるだろうと述べた。同社は来年度の売上高が3倍になるとの見通しも示した。\n「私たちはより効率的に製造します。部品の価格も安くなります。製造組織をより多くのユニットで償却します」とフェルドマン氏は語った。 「それらはすべて上と右を向いています。」\nここ数週間、Cerebras は Nvidia のライバルである Advanced Micro Devices との提携を発表し、今年後半に製品の生産が開始され、OpenAI は同社のチップを使用して最新モデル GPT 5.6 Sol を提供できると述べました。 Cerebras はクラウド経由でチップへのアクセスも提供しており、6 月四半期の収益は 1 億 2,600 万ドルと報告されています。\n注目: Cerebras は OpenAI のチップが他の GPU と競合していると見ている",
    "source": "CNBC",
