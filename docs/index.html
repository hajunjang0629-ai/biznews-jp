    "id": "americans-incomes-rose-and-poverty-fell-82b63a03",
    "title": "Americans' incomes rose and poverty fell in 2025, Census Bureau says",
    "titleJa": "Americans' incomes rose and poverty fell in 2025, Census Bureau says",
    "summaryJa": "The data comes as the Federal Reserve is considering interest-rate increases that could slow economic growth.",
    "bodyOriginal": "Americans' inflation-adjusted incomes rose and poverty declined in 2025, according to new Census Bureau data released Tuesday, as the Federal Reserve meets to decide whether inflation still requires higher interest rates.\nReal median household income rose by 2.6% to $87,460 last year, the Census Bureau reported as part of a suite of data releases Tuesday. The poverty rate fell by a nearly half-point to 10.2%. The poverty threshold for a family of four last year was $32,970.\nTreasury Secretary Scott Bessent celebrated the data, which were released as he was testifying to a House committee about the economy. The Census Bureau data are \"several inconvenient facts\" for the Trump administration's political opponents, he said.\nDemocrats used the committee hearing to assail Bessent over high gas prices and other economic strains. The average rate for new 30-year fixed-rate mortgage rose above 7% last week. Prices increases by 3.4% in August from the year before, as measured by consumer price index.\nThe Census data covers 2025 and doesn't account for recent changes in inflation or other economic shifts since the Iran war started. But for the first year of Trump's presidency, the data show the median American household's income rose even after adjusting for inflation.\nThe agency doesn't break down the causes for the improvements' in Americans' livelihoods. The underlying data suggest that an improving labor market helped boost household income.\nThe decline in poverty appeared to be concentrated among families with children and working-age families, rather than among retirees.\nAnother measure of poverty that accounts for families' gains from the social safety net was unchanged for 2025. That may come under pressure as Republican's tax-and-policy law enacted in the summer of 2025 is phased in. The measure known as the \"Big, Beautiful Bill\" cut taxes on some working families but paid for it in part by reducing federal outlays through tightening restrictions on parts of programs for low-income people.\nThe Congressional Budget Office projects that spending on food stamps, known as SNAP, will fall by $211 billion through 2035 years as a result of the law because fewer people will be eligible for nutrition assistance.\nMeanwhile the Fed is on the precipice of raising its benchmark short-term interest rate. New Chairman Kevin Warsh has said he is concerned about inflation. The Fed's tool to fight inflation — interest rates — is a blunt instrument. By raising rates, the Fed raises borrowing costs across the economy. That slows price increases by generally weakening economic growth.\nThe Fed has to weigh that risk against the damage inflation does to Americans' livelihoods. Fed officials have frequently pointed out that price increases weigh most heavily on the lowest tier of earners who have the least ability to change their spending plans.\nThe Fed will announce its rate decision Wednesday afternoon.",
    "bodyJa": "Americans' inflation-adjusted incomes rose and poverty declined in 2025, according to new Census Bureau data released Tuesday, as the Federal Reserve meets to decide whether inflation still requires higher interest rates.\nReal median household income rose by 2.6% to $87,460 last year, the Census Bureau reported as part of a suite of data releases Tuesday. The poverty rate fell by a nearly half-point to 10.2%. The poverty threshold for a family of four last year was $32,970.\nTreasury Secretary Scott Bessent celebrated the data, which were released as he was testifying to a House committee about the economy. The Census Bureau data are \"several inconvenient facts\" for the Trump administration's political opponents, he said.\nDemocrats used the committee hearing to assail Bessent over high gas prices and other economic strains. The average rate for new 30-year fixed-rate mortgage rose above 7% last week. Prices increases by 3.4% in August from the year before, as measured by consumer price index.\nThe Census data covers 2025 and doesn't account for recent changes in inflation or other economic shifts since the Iran war started. But for the first year of Trump's presidency, the data show the median American household's income rose even after adjusting for inflation.\nThe agency doesn't break down the causes for the improvements' in Americans' livelihoods. The underlying data suggest that an improving labor market helped boost household income.\nThe decline in poverty appeared to be concentrated among families with children and working-age families, rather than among retirees.\nAnother measure of poverty that accounts for families' gains from the social safety net was unchanged for 2025. That may come under pressure as Republican's tax-and-policy law enacted in the summer of 2025 is phased in. The measure known as the \"Big, Beautiful Bill\" cut taxes on some working families but paid for it in part by reducing federal outlays through tightening restrictions on parts of programs for low-income people.\nThe Congressional Budget Office projects that spending on food stamps, known as SNAP, will fall by $211 billion through 2035 years as a result of the law because fewer people will be eligible for nutrition assistance.\nMeanwhile the Fed is on the precipice of raising its benchmark short-term interest rate. New Chairman Kevin Warsh has said he is concerned about inflation. The Fed's tool to fight inflation — interest rates — is a blunt instrument. By raising rates, the Fed raises borrowing costs across the economy. That slows price increases by generally weakening economic growth.\nThe Fed has to weigh that risk against the damage inflation does to Americans' livelihoods. Fed officials have frequently pointed out that price increases weigh most heavily on the lowest tier of earners who have the least ability to change their spending plans.\nThe Fed will announce its rate decision Wednesday afternoon.",

    "id": "us-borrowing-costs-hit-highest-level-sin-9b18365a",
    "title": "US borrowing costs hit highest level since 2007",
    "titleJa": "US borrowing costs hit highest level since 2007",
    "summaryJa": "The effective interest rate on US government bonds over 10 years, known as the 10-year Treasury yield, has risen as high as 5.04% but has eased back since.",
    "bodyOriginal": "US borrowing costs hit highest level since 2007\n- Published\nUS government borrowing costs climbed to their highest level since 2007 after a jump in oil prices further fuelled concerns about inflation.\nThe effective interest rate on US government bonds over 10 years, known as the 10-year Treasury yield, rose as high as 5.04% but has eased back since.\nGovernment bond yields have been rising globally for months, driven by worries that inflation caused by the oil price surge since the start of the US-Israel war with Iran will lead to higher interest rates.\nThe US has been buying back bonds back in a bid to drive the Treasury yield down, with Treasury Secretary Scott Bessent calling the intervention \"successful\".\nThe global benchmark wholesale oil price rose to over $109 a barrel on Tuesday, up from around $86 at the end of August, after renewed concerns about Saudi Arabia's ability to export oil following rising tensions in the region.\nInvestors are anticipating the US Federal Reserve Chair Kevin Warsh will raise interest rates to combat the inflation caused by higher oil prices.\nHowever, US President Donald Trump opposes a rate hike, having long argued lower rates are great for boosting the economy.\nHe fell out with Warsh's predecessor Jerome Powell over his decision not to cut rates.\nHigher interest rates and inflation tend to drive up the yields bond investors demand on government borrowing.\nBond yields can also be a sign of how much faith investors have in a given government, with a higher yield reflecting less confidence.\nCompetition for debt from artificial intelligence (AI) firms is also driving up yields.\nTech giants are borrowing massive piles of cash to build huge data centres. This raises interest rates on tech firm's debt which increases government bond yields in response.\nCarol Schleif, chief market strategist at BMO Wealth Management, said bond markets had been signalling for weeks that higher interest rates may be needed.\nWhile the rise in borrowing costs has been \"orderly\" this year, rather than sudden, she said rates could remain elevated if geopolitical tensions and high energy prices remain \"front and center\".\nRelated topics\n- Published6 hours ago\n- Published2 September",
    "bodyJa": "US borrowing costs hit highest level since 2007\n- Published\nUS government borrowing costs climbed to their highest level since 2007 after a jump in oil prices further fuelled concerns about inflation.\nThe effective interest rate on US government bonds over 10 years, known as the 10-year Treasury yield, rose as high as 5.04% but has eased back since.\nGovernment bond yields have been rising globally for months, driven by worries that inflation caused by the oil price surge since the start of the US-Israel war with Iran will lead to higher interest rates.\nThe US has been buying back bonds back in a bid to drive the Treasury yield down, with Treasury Secretary Scott Bessent calling the intervention \"successful\".\nThe global benchmark wholesale oil price rose to over $109 a barrel on Tuesday, up from around $86 at the end of August, after renewed concerns about Saudi Arabia's ability to export oil following rising tensions in the region.\nInvestors are anticipating the US Federal Reserve Chair Kevin Warsh will raise interest rates to combat the inflation caused by higher oil prices.\nHowever, US President Donald Trump opposes a rate hike, having long argued lower rates are great for boosting the economy.\nHe fell out with Warsh's predecessor Jerome Powell over his decision not to cut rates.\nHigher interest rates and inflation tend to drive up the yields bond investors demand on government borrowing.\nBond yields can also be a sign of how much faith investors have in a given government, with a higher yield reflecting less confidence.\nCompetition for debt from artificial intelligence (AI) firms is also driving up yields.\nTech giants are borrowing massive piles of cash to build huge data centres. This raises interest rates on tech firm's debt which increases government bond yields in response.\nCarol Schleif, chief market strategist at BMO Wealth Management, said bond markets had been signalling for weeks that higher interest rates may be needed.\nWhile the rise in borrowing costs has been \"orderly\" this year, rather than sudden, she said rates could remain elevated if geopolitical tensions and high energy prices remain \"front and center\".\nRelated topics\n- Published6 hours ago\n- Published2 September",

    "id": "openai-cfo-sarah-friar-emphasizes-need-t-4acab306",
    "title": "OpenAI CFO Sarah Friar emphasizes 'need to take safety seriously' on AI risks",
    "titleJa": "OpenAI CFO Sarah Friar emphasizes 'need to take safety seriously' on AI risks",
    "summaryJa": "Friar joined CNBC's Jim Cramer on \"Mad Money\" as the debate over technology's safety risks rages on.",
    "bodyOriginal": "OpenAI CFO Sarah Friar told CNBC's Jim Cramer that she is not worried about the possibility of AI agents using weapons of mass destruction to kill, but said, \"We do need to take safety seriously.\"\n\"And if it means we have to pace the frontier and slow down, absolutely, we're going to listen to our researchers and do that,\" she said.\n\"As the CFO, I need to then make business decisions around it,\" she added. \"We're pacing that frontier and taking that safety and alignment really seriously.\"\nTune into \"Mad Money\" tonight at 6 p.m. for the full interview between CNBC's Jim Cramer and OpenAI CFO Sarah Friar. Watch in real time on CNBC+ or the CNBC Pro stream.\nFriar's comments come as the debate about the safety of artificial intelligence has exploded over the last week, sparked by a former Anthropic researcher who quit his job and warned that the rapidly-evolving technology could \"kill us all by the end of the decade.\"\nIn the days since, concerns around the AI's ability to harm have reached a fever pitch in and out of Washington, with Anthropic chief Dario Amodei, SpaceX Elon Musk and OpenAI CEO Sam Altman agreeing with calls for an industry-wide slowdown.\nOn Saturday, Amodei penned a blog post that argued for slower development of AI models to \"reduce the risk that something goes seriously wrong.\"\nBut whether the renewed safety concerns affect both frontier labs' timelines toward an initial public offering is still unclear. Anthropic's debut had been widely expected to come sometime in the next month. Altman, in an interview with Fortune published Saturday, said that an IPO in 2026 would be \"ill-advised.\"\nIn August, CNBC reported that Friar told employees that the lab \"will be a public company in 2027,\" but that it could debut earlier if \"our business continues to inflect.\"",
    "bodyJa": "OpenAI CFO Sarah Friar told CNBC's Jim Cramer that she is not worried about the possibility of AI agents using weapons of mass destruction to kill, but said, \"We do need to take safety seriously.\"\n\"And if it means we have to pace the frontier and slow down, absolutely, we're going to listen to our researchers and do that,\" she said.\n\"As the CFO, I need to then make business decisions around it,\" she added. \"We're pacing that frontier and taking that safety and alignment really seriously.\"\nTune into \"Mad Money\" tonight at 6 p.m. for the full interview between CNBC's Jim Cramer and OpenAI CFO Sarah Friar. Watch in real time on CNBC+ or the CNBC Pro stream.\nFriar's comments come as the debate about the safety of artificial intelligence has exploded over the last week, sparked by a former Anthropic researcher who quit his job and warned that the rapidly-evolving technology could \"kill us all by the end of the decade.\"\nIn the days since, concerns around the AI's ability to harm have reached a fever pitch in and out of Washington, with Anthropic chief Dario Amodei, SpaceX Elon Musk and OpenAI CEO Sam Altman agreeing with calls for an industry-wide slowdown.\nOn Saturday, Amodei penned a blog post that argued for slower development of AI models to \"reduce the risk that something goes seriously wrong.\"\nBut whether the renewed safety concerns affect both frontier labs' timelines toward an initial public offering is still unclear. Anthropic's debut had been widely expected to come sometime in the next month. Altman, in an interview with Fortune published Saturday, said that an IPO in 2026 would be \"ill-advised.\"\nIn August, CNBC reported that Friar told employees that the lab \"will be a public company in 2027,\" but that it could debut earlier if \"our business continues to inflect.\"",

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
