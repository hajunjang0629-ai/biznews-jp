    "id": "russia-china-may-be-more-aggressive-if-t-cab74c8c",
    "title": "Russia, China may be more aggressive if they feel Trump is on 'his way out': Brookings",
    "titleJa": "Russia, China may be more aggressive if they feel Trump is on 'his way out': Brookings",
    "summaryJa": "Russia and China may be more aggressive if they feel that U.S. President Donald Trump is on \"his way out\" after the Democratic Party flipped the midterms.",
    "bodyOriginal": "Russia and China could become more aggressive over the next two years if they conclude that President Donald Trump is politically weakened and on \"his way out\" after Democrats won control of both chambers of Congress, Brookings Institution senior fellow Robert Kagan told CNBC.\nSpeaking on \"Squawk Box Asia,\" Kagan said the war with Iran had also exposed how Washington has \"proved itself rather incapable militarily\" in terms of capacity, which would be critical in Asia.\n\"Everybody can see how much our stocks are depleted in terms of interceptors and missiles, which are of vital interest in the Asian theater,\" he said.\nCongressional Budget Office reports have estimated that the conflict depleted as much as two-thirds of U.S. missile-defense interceptors since June 2025, largely because of efforts to defend Israel against Iranian attacks. This could leave the U.S. with constrained inventories for several years.\nKagan said the deployment of three U.S. aircraft carriers to the Middle East had reduced the U.S. naval presence available in Asia, potentially giving China more room to act assertively in the region.\n\"I think Trump's only interest right now is in cutting economic deals with China. I don't think he has any real interest in confronting China, but that is going to lead China to be even more aggressive,\" he said.\nIn December, Trump approved an $11 billion arms package for Taiwan, but later held back on a second package worth about $14 billion, calling it a \"bargaining chip\" in talks with China.\nChina claims self-governing Taiwan as its territory. While Washington does not have a mutual defense treaty with the island, U.S. law requires it to provide Taiwan with the means to defend itself.\nFormer CIA Director William Burns said in 2023 that Chinese President Xi Jinping had instructed the military to be ready to invade Taiwan by 2027, while stressing that this did not mean Xi had decided to launch an invasion that year or at all.\nKagan's comments come as U.S., China and Russia discuss a possible trilateral summit between Trump, Xi and President Vladimir Putin at the APEC Leaders' meeting in Shenzhen later this month.\nChinese Foreign Ministry spokesperson Mao Ning said Wednesday that Beijing was \"in communication with relevant parties regarding a meeting between the three heads of state,\" although no agenda has been announced.\nPutin had reportedly floated the idea of a three-way summit with Trump and Xi in October to discuss ending the war in Ukraine, without Ukrainian President Volodymyr Zelenskyy at the table.\n\"If it's clear that Donald Trump is on his way out, and the United States may be returning to something like normal, I don't want to overstate that, but they may feel both of them, both Russia and China, may feel that the time to move is in the next two years,\" Kagan said.",
    "bodyJa": "Russia and China could become more aggressive over the next two years if they conclude that President Donald Trump is politically weakened and on \"his way out\" after Democrats won control of both chambers of Congress, Brookings Institution senior fellow Robert Kagan told CNBC.\nSpeaking on \"Squawk Box Asia,\" Kagan said the war with Iran had also exposed how Washington has \"proved itself rather incapable militarily\" in terms of capacity, which would be critical in Asia.\n\"Everybody can see how much our stocks are depleted in terms of interceptors and missiles, which are of vital interest in the Asian theater,\" he said.\nCongressional Budget Office reports have estimated that the conflict depleted as much as two-thirds of U.S. missile-defense interceptors since June 2025, largely because of efforts to defend Israel against Iranian attacks. This could leave the U.S. with constrained inventories for several years.\nKagan said the deployment of three U.S. aircraft carriers to the Middle East had reduced the U.S. naval presence available in Asia, potentially giving China more room to act assertively in the region.\n\"I think Trump's only interest right now is in cutting economic deals with China. I don't think he has any real interest in confronting China, but that is going to lead China to be even more aggressive,\" he said.\nIn December, Trump approved an $11 billion arms package for Taiwan, but later held back on a second package worth about $14 billion, calling it a \"bargaining chip\" in talks with China.\nChina claims self-governing Taiwan as its territory. While Washington does not have a mutual defense treaty with the island, U.S. law requires it to provide Taiwan with the means to defend itself.\nFormer CIA Director William Burns said in 2023 that Chinese President Xi Jinping had instructed the military to be ready to invade Taiwan by 2027, while stressing that this did not mean Xi had decided to launch an invasion that year or at all.\nKagan's comments come as U.S., China and Russia discuss a possible trilateral summit between Trump, Xi and President Vladimir Putin at the APEC Leaders' meeting in Shenzhen later this month.\nChinese Foreign Ministry spokesperson Mao Ning said Wednesday that Beijing was \"in communication with relevant parties regarding a meeting between the three heads of state,\" although no agenda has been announced.\nPutin had reportedly floated the idea of a three-way summit with Trump and Xi in October to discuss ending the war in Ukraine, without Ukrainian President Volodymyr Zelenskyy at the table.\n\"If it's clear that Donald Trump is on his way out, and the United States may be returning to something like normal, I don't want to overstate that, but they may feel both of them, both Russia and China, may feel that the time to move is in the next two years,\" Kagan said.",

    "id": "inside-the-chip-talent-war-trade-secrets-fb4339a5",
    "title": "Inside the chip talent war: Trade secrets and rising Chinese rivals",
    "titleJa": "Inside the chip talent war: Trade secrets and rising Chinese rivals",
    "summaryJa": "Growing competition for semiconductor talent is fueling a battle over trade secrets as Chinese chipmakers gain ground.",
    "bodyOriginal": "A former Samsung Electronics employee who later joined Chinese memory chipmaker ChangXin Memory Technologies, or CXMT, was reportedly sentenced by the Seoul High Court on Oct. 22 to five years in prison for leaking Samsung's technology.\nThe sentence was reduced from seven years at his first trial in April. The former employee had joined CXMT in 2016.\nThe case highlights an intensifying battle over semiconductor know-how as Chinese chipmakers narrow the gap with established rivals, putting the race for top engineering talent increasingly at odds with efforts to protect trade secrets.\nIn 2023, a South Korean court granted Samsung's request to block a former DRAM researcher from joining U.S. rival Micron. It ruled that the two-year non-compete was not excessive and was necessary to protect Samsung's technology and business information, JoongAng Ilbo reported.\nClosing the gap\nA decade ago, Chinese memory chipmakers were not Samsung's biggest concern when it came to losing experienced engineers.\nInstead, the South Korean company was more focused on employees leaving for established rivals such as SK Hynix and Micron, according to a former employee who asked not to be identified because the information was private.\nSamsung has been monitoring where certain departing employees went — to signal to remaining staff that moving to competitors would be difficult — according to a former employee.\nThe company also used non-compete agreements restricting employees from joining rivals for two years, as part of their employment contracts, with senior employees holding valuable technical expertise likely facing closer scrutiny.\nBut Samsung's concern extended beyond individual departures.\n\"It wasn't just about one employee leaving. The company wanted to send a message to those who stayed that moving to a competitor wouldn't be easy,\" the former employee said.\nMeanwhile, Chinese semiconductor companies have sought to close the technology gap by recruiting experienced overseas engineers with high salaries, stock options, housing and family support, according to Jeongku Choi, a senior analyst at Counterpoint Research.\nTheir expertise has helped Chinese chipmakers overcome technical bottlenecks, particularly as U.S. export restrictions have limited China's access to advanced chipmaking equipment, Choi said.\nOnce viewed as unlikely to catch up with established players, Chinese manufacturers are now seen as \"meaningful competitors,\" she added.\nCounterpoint's Memory Tracker for the second quarter of 2026 projected CXMT's share of global DRAM revenue would reach 10%.\nEstablished chipmakers are strengthening legal protections and internal security measures while adjusting compensation packages to retain key engineers, according to Choi.\nSouth Korea has also designated certain semiconductor manufacturing technologies as \"National Core Technologies,\" raising the penalties for unauthorized leaks of those technologies, Choi said.\nThe legal battle could intensify as Chinese memory companies expand beyond their home market.\n\"I believe that this management of trade secrets will expand its scope even further to IP and legal areas once Chinese memory companies move beyond the Chinese market and begin to expand their exports,\" Choi said.\nProtecting trade secrets\nThe growing competition is putting greater focus on how semiconductor companies protect the knowledge accumulated by engineers working on complex manufacturing processes.\nIn Taiwan, home to the world's largest contract chipmaker TSMC, protections for trade secrets have evolved alongside the semiconductor industry’s growing strategic importance.\nJamie J. Yang, a partner specializing in antitrust and intellectual property at Innovatus Law, said Taiwan limits post-employment non-compete agreements to two years and requires employers to compensate former employees at least half their average monthly salary during the restricted period.\nYang added that the complexity of semiconductor manufacturing makes it difficult for any single engineer to possess enough knowledge to replicate an entire production line elsewhere.\n\"There is just very little chance that one person ... will know enough to replicate that line in any of the other companies,\" Yang said.\nMoves by engineers between rival semiconductor companies could increase modestly as competition for top talent intensifies, while trade secret litigation is also likely to rise as firms seek to protect their technological edge, she added.\nBut the challenges extend beyond Taiwan.\nIn Singapore, Zechariah Chan, a partner at law firm Lee & Lee, said protecting trade secrets can be particularly difficult in the semiconductor industry, where proprietary knowledge often involves intangible manufacturing techniques and methods.\nYou cannot 'take' the information back after the engineer has become aware of it.Zechariah ChanPartner, Lee & Lee Law Firm\nProving that a competitor has used proprietary manufacturing techniques can also be difficult, as outsiders generally see only the final product, according to Chan.\n\"There is no bright line between an engineer's expertise and proprietary information,\" he said. General skills and knowledge stay with the engineer, while trade secrets remain with the company.\nIn Singapore, non-compete clauses are enforceable only if they protect legitimate business interests and are reasonable in scope, geographical area and duration.\nIn Hong Kong, courts generally take a restrictive approach to non-compete clauses, enforcing them only when they protect legitimate business interests and go no further than necessary, according to Jezamine Fewins, head of litigation at Lewis Silkin in Hong Kong.\nCourts are more willing to protect trade secrets through court injunctions, Fewins said.\n\"The difficulty is that often the trade secret is carried in the employee's head,\" she added. Information is more likely to qualify as a trade secret if its disclosure to a competitor could cause significant harm to the former employer and the company has taken steps to restrict access.\nFor chipmakers, Fewins said the key is to clearly define what constitutes a trade secret, make employees aware of that information and put safeguards in place to limit access.\nSamsung and CXMT did not respond to CNBC's request for comment.",

o a competitor could cause significant harm to the former employer and the company has taken steps to restrict access.\nFor chipmakers, Fewins said the key is to clearly define what constitutes a trade secret, make employees aware of that information and put safeguards in place to limit access.\nSamsung and CXMT did not respond to CNBC's request for comment.",

    "id": "liv-golf-faces-liquidation-after-bc-part-97bfbdc5",
    "title": "LIV Golf faces liquidation after BC Partners scraps rescue plan",
    "titleJa": "LIV Golf faces liquidation after BC Partners scraps rescue plan",
    "summaryJa": "LIV Golf faces liquidation after BC Partners dropped a proposed $300 million rescue plan amid insufficient player commitments.",
    "bodyOriginal": "LIV Golf could be headed for liquidation after BC Partners Credit reportedly dropped plans to finance a relaunch of the breakaway league.\nThe investment firm had pledged up to $300 million for a revamped version of LIV, known as LIV 2.0, but withdrew the plan after LIV Golf failed to secure enough player commitments, according to the Associated Press.\nLIV is scheduled to appear in U.S. bankruptcy court Thursday, with the hearing now expected to focus on liquidation of its assets. The league's ultimate fate remains unclear.\nLIV Golf and BC Partners did not immediately respond to CNBC's requests for comment.\nLIV filed for Chapter 11 bankruptcy protection in September after Saudi Arabia's Public Investment Fund said it would stop funding the league after the 2026 season.\nPIF had invested more than $5 billion since LIV launched in 2022, according to its Chapter 11 filing.\nBC Partners' proposed relaunch would have made players majority owners of the reorganized league and featured a scaled-back schedule.\nBut LIV has lost several prominent players, including Jon Rahm and Sergio Garcia, as it sought commitments for the new venture.\nRahm said Tuesday that uncertainty over the league's future and proposed changes to its format influenced his decision to leave.\n\"There were too many unknowns at the time, and there's still quite a few,\" he told reporters ahead of the Abu Dhabi Championship. Rahm added that the revamped competition appeared to be moving away from the team format that initially attracted him.\nGarcia, who secured a release from his LIV contract in October, has outlined plans to return to the DP World Tour and explore a possible return to the PGA Tour.\nOnly four players had publicly committed to LIV 2.0: Richard Bland, Cameron Tringale, Brendan Steele and Ben Campbell, according to Golf Digest.\nLIV launched in 2022 as a challenger to the PGA Tour, recruiting prominent players including Phil Mickelson, Dustin Johnson and Bryson DeChambeau with lucrative contracts.\nIts arrival split men's professional golf, with the PGA Tour suspending members who competed in LIV events. The disputes later spilled into the courts, with players challenging suspensions and the rival organizations pursuing competing legal claims.\nThe PGA Tour denied the allegations, while LIV dismissed the counterclaims.\nA June 2023 framework agreement between the PGA Tour, DP World Tour and PIF ended their litigation and proposed combining their commercial businesses, although the deal was never completed.",

u with lucrative contracts.\nIts arrival split men's professional golf, with the PGA Tour suspending members who competed in LIV events. The disputes later spilled into the courts, with players challenging suspensions and the rival organizations pursuing competing legal claims.\nThe PGA Tour denied the allegations, while LIV dismissed the counterclaims.\nA June 2023 framework agreement between the PGA Tour, DP World Tour and PIF ended their litigation and proposed combining their commercial businesses, although the deal was never completed.",

    "title": "Interest rates expected to rise for first time in over three years",
    "titleJa": "Interest rates expected to rise for first time in over three years",
    "summaryJa": "Most analysts are predicting an increase from 3.75% to 4%, the first increase in more than three years.",
    "bodyOriginal": "Interest rates expected to rise for first time in over three years\n- Published\nPolicymakers at the Bank of England are expected to raise interest rates on Thursday in what would be the first increase to the benchmark rate for more than three years.\nMost analysts are predicting an rise from 3.75% to 4% in a move that would increase the cost of borrowing for individuals and businesses, but boost savers.\nThe Bank rate has fallen from its 2023-24 peak of 5.25%, although the Bank's Monetary Policy Committee (MPC) has left the rate unchanged at its last six meetings.\nRising inflation, driven primarily by the cost of petrol and diesel, will push policymakers into an interest rate hike, analysts suggest.\nThe announcement will be made by the Bank at 12:00 GMT on Thursday.\nClose attention will also be paid to any hints from the MPC on the future direction of interest rates.\n\"The decision is increasingly less about whether rates reach 4% and more about what follows after that,\" said Chris Cheverall, head of UK at trading platform CMC Markets.\n\"A quarter-point rise is already widely expected, but the Bank now has to balance inflation that is still too high against an economy where the growth outlook has weakened sharply.\"\nThe Consumer Prices Index (CPI) measure of inflation is well below its peak of a few years ago but has been heading back up and is expected to go higher.\nIt was 3.5% in the year to September 2026, up from 3.1% the previous month and well above the central bank's 2% target.\nThe ongoing impact of the Iran war, primarily on the cost of energy and fuel, has filtered through to the UK inflation rate. Millions of domestic energy customers are braced for a hefty rise in prices in January.\nHow borrowers and savers are affected\nThe Bank of England last raised rates in August 2023.\nIts base rate is what it charges other banks and building societies to borrow money, which influences what they charge their own customers for mortgages as well as the interest rate they pay on savings.\nWere the Bank rate to rise, there would be an immediate impact on the 510,000 tracker mortgage-holders.\nA 0.25 percentage point rise would mean a £31 increase in monthly repayments for someone with a typical tracker home loan, according to calculations by banking trade body UK Finance.\nThe 470,000 mortgage-holders on variable deals would need to wait for their lender's reaction to any Bank rate rise. Typically, a 0.25 percentage point rise would mean a £14 increase per month in repayments.\nThe picture for those on fixed deals is more nuanced.\nWhile their monthly payments are not immediately affected by a rate change, their future deals are, and lenders have already \"priced in\" the expected rate rise when quoting new deals.\nAs of 4 November, the average two-year fixed residential mortgage rate was 5.96%, while the average five-year rate stood at 5.99%, according to financial information service Moneyfacts.\nIt means anyone rolling off a five-year deal faces a much bigger mortgage bill.\nBroker L&C said that average mortgage rates offered by the 10 biggest lenders suggested some borrowers now faced paying almost £5,000 more each year in repayments on a £200,000 mortgage over 25 years than those who secured a remortgage deal in 2021.\nFive years ago, the average five-year fixed remortgage rate among the 10 biggest lenders was 1.30%.\nRelatively high fixed rates have prompted some people to consider choosing trackers, in the hope that the rate would be lower, even if the Bank rate rises in the coming months.\n\"The right choice ultimately depends on borrowers being confident they can stomach future rises. The devil is in the detail,\" said Rachel Springall from Moneyfacts.\nThe cost of some other new loans could be influenced by the Bank rate.\nSavers, on the flipside, could see the interest rates offered to them improve in light of any rise in the Bank rate.\nUltimately, lenders - as well as policymakers at the Bank of England - are having to judge what may happen to the UK's economic outlook which is highly connected to changes in international events.\n- Published19 hours ago\n- Published6 days ago",
    "bodyJa": "Interest rates expected to rise for first time in over three years\n- Published\nPolicymakers at the Bank of England are expected to raise interest rates on Thursday in what would be the first increase to the benchmark rate for more than three years.\nMost analysts are predicting an rise from 3.75% to 4% in a move that would increase the cost of borrowing for individuals and businesses, but boost savers.\nThe Bank rate has fallen from its 2023-24 peak of 5.25%, although the Bank's Monetary Policy Committee (MPC) has left the rate unchanged at its last six meetings.\nRising inflation, driven primarily by the cost of petrol and diesel, will push policymakers into an interest rate hike, analysts suggest.\nThe announcement will be made by the Bank at 12:00 GMT on Thursday.\nClose attention will also be paid to any hints from the MPC on the future direction of interest rates.\n\"The decision is increasingly less about whether rates reach 4% and more about what follows after that,\" said Chris Cheverall, head of UK at trading platform CMC Markets.\n\"A quarter-point rise is already widely expected, but the Bank now has to balance inflation that is still too high against an economy where the growth outlook has weakened sharply.\"\nThe Consumer Prices Index (CPI) measure of inflation is well below its peak of a few years ago but has been heading back up and is expected to go higher.\nIt was 3.5% in the year to September 2026, up from 3.1% the previous month and well above the central bank's 2% target.\nThe ongoing impact of the Iran war, primarily on the cost of energy and fuel, has filtered through to the UK inflation rate. Millions of domestic energy customers are braced for a hefty rise in prices in January.\nHow borrowers and savers are affected\nThe Bank of England last raised rates in August 2023.\nIts base rate is what it charges other banks and building societies to borrow money, which influences what they charge their own customers for mortgages as well as the interest rate they pay on savings.\nWere the Bank rate to rise, there would be an immediate impact on the 510,000 tracker mortgage-holders.\nA 0.25 percentage point rise would mean a £31 increase in monthly repayments for someone with a typical tracker home loan, according to calculations by banking trade body UK Finance.\nThe 470,000 mortgage-holders on variable deals would need to wait for their lender's reaction to any Bank rate rise. Typically, a 0.25 percentage point rise would mean a £14 increase per month in repayments.\nThe picture for those on fixed deals is more nuanced.\nWhile their monthly payments are not immediately affected by a rate change, their future deals are, and lenders have already \"priced in\" the expected rate rise when quoting new deals.\nAs of 4 November, the average two-year fixed residential mortgage rate was 5.96%, while the average five-year rate stood at 5.99%, according to financial information service Moneyfacts.\nIt means anyone rolling off a five-year deal faces a much bigger mortgage bill.\nBroker L&C said that average mortgage rates offered by the 10 biggest lenders suggested some borrowers now faced paying almost £5,000 more each year in repayments on a £200,000 mortgage over 25 years than those who secured a remortgage deal in 2021.\nFive years ago, the average five-year fixed remortgage rate among the 10 biggest lenders was 1.30%.\nRelatively high fixed rates have prompted some people to consider choosing trackers, in the hope that the rate would be lower, even if the Bank rate rises in the coming months.\n\"The right choice ultimately depends on borrowers being confident they can stomach future rises. The devil is in the detail,\" said Rachel Springall from Moneyfacts.\nThe cost of some other new loans could be influenced by the Bank rate.\nSavers, on the flipside, could see the interest rates offered to them improve in light of any rise in the Bank rate.\nUltimately, lenders - as well as policymakers at the Bank of England - are having to judge what may happen to the UK's economic outlook which is highly connected to changes in international events.\n- Published19 hours ago\n- Published6 days ago",

  {
    "id": "what-wall-street-billionaires-are-saying-e1b9ccd0",
    "title": "What Wall Street billionaires are saying about Democrats' midterm sweep",
    "titleJa": "What Wall Street billionaires are saying about Democrats' midterm sweep",
    "summaryJa": "Billionaire political spending met criticism from ... billionaires in the wake of Tuesday's blue wave election.",
    "bodyOriginal": "America's billionaires woke up Wednesday to a political reckoning — and a Wall Street rally.\nAs Democrats celebrated a sweeping midterm victory, some of the country's wealthiest donors traded barbs over record election spending. Others warned the results could threaten the artificial intelligence boom.\nWall Street, however, cheered the outcome. The Dow Jones Industrial Average soared 1,569 points, or 3%, while the S&P 500 gained 1.6% and the Nasdaq Composite rose 1.4%, as investors welcomed political gridlock, reduced uncertainty and President Donald Trump's willingness to accept the results.\nVirgin Group founder Richard Branson took aim at the billions spent influencing the election.\n\"I have felt embarrassed by the billions that tech entrepreneurs and hedge fund managers have spent,\" Branson wrote Wednesday on LinkedIn, calling for campaign finance reform. Branson did not give donations that met the threshold reporting in the 2026 election cycle.\nHis comments came as Elon Musk, the election's largest individual donor, watched his preferred Republicans lose the Texas Senate and governor races despite pouring $224 million into the state — nearly half his record $474 million in political giving nationwide, according to a CNBC analysis of campaign finance records.\nEarly Wednesday, the Tesla and SpaceX CEO suggested on X that data centers in space were looking increasingly appealing before joking that his \"election-interfering space lasers\" had failed.\nLinkedIn co-founder Reid Hoffman, another major political donor, took a sharper tone.\n\"We should get money out of politics,\" Hoffman wrote late Tuesday on X, accusing Musk of spending \"outrageous amounts to keep authoritarian clowns in power\" while defending his own contributions to Democrats.\nOther Democratic megadonors celebrated. \"The world changed yesterday,\" Alex Soros wrote Wednesday on X, hailing the results as a generational victory after his family contributed roughly $103 million to Democratic political efforts.\nBut beyond the political sparring, some of the country's richest investors were focused on a potentially bigger consequence of the Democratic sweep: the future of the AI boom.\nEven before polls closed Tuesday, Pershing Square founder Bill Ackman warned on CNBC's \"Squawk on the Street\" that slowing AI development could jeopardize America's technological edge. \"Practically speaking, we can't slow down,\" he said.\nAs results rolled in Tuesday night, billionaire investor Chamath Palihapitiya sounded an even starker warning.\nPalihapitiya initially questioned whether the early results would hold, but warned that if they did, the implications for the AI trade could be severe.\n\"And the only way to sink the AI trade is to sink the data centers,\" Palihapitiya said during an election-night livestream of the \"All-In\" podcast.\nTexas offered an early test of those fears. Democratic Gov.-elect Gina Hinojosa, who has proposed a moratorium on new data-center construction until stronger safeguards are established, defeated three-term Republican incumbent Greg Abbott.\nDuring the same livestream, Altimeter Capital CEO Brad Gerstner warned the Democratic wave could mean at least 10 to 15 gigawatts of expected AI data-center capacity would not come online in 2027. Wall Street analyst Dan Ives estimated Wednesday that 10% of planned U.S. data centers would no longer go ahead.\nAMD CEO Lisa Su acknowledged the growing resistance to AI's expansion, urging technology companies to demonstrate the benefits of data centers to local communities.\n\"At the end of the day, what we need to do is ensure that everybody wins from AI,\" Su told CNBC Wednesday.\nYet Wall Street may have found opportunity in the same slowdown that worried AI's biggest backers.\nFewer new data centers could increase the value of existing facilities while easing the enormous spending burden on technology giants. Big Tech stocks surged Wednesday, adding more than $750 billion in market value at one point, even as smaller, debt-dependent data-center operators tumbled.",
    "bodyJa": "America's billionaires woke up Wednesday to a political reckoning — and a Wall Street rally.\nAs Democrats celebrated a sweeping midterm victory, some of the country's wealthiest donors traded barbs over record election spending. Others warned the results could threaten the artificial intelligence boom.\nWall Street, however, cheered the outcome. The Dow Jones Industrial Average soared 1,569 points, or 3%, while the S&P 500 gained 1.6% and the Nasdaq Composite rose 1.4%, as investors welcomed political gridlock, reduced uncertainty and President Donald Trump's willingness to accept the results.\nVirgin Group founder Richard Branson took aim at the billions spent influencing the election.\n\"I have felt embarrassed by the billions that tech entrepreneurs and hedge fund managers have spent,\" Branson wrote Wednesday on LinkedIn, calling for campaign finance reform. Branson did not give donations that met the threshold reporting in the 2026 election cycle.\nHis comments came as Elon Musk, the election's largest individual donor, watched his preferred Republicans lose the Texas Senate and governor races despite pouring $224 million into the state — nearly half his record $474 million in political giving nationwide, according to a CNBC analysis of campaign finance records.\nEarly Wednesday, the Tesla and SpaceX CEO suggested on X that data centers in space were looking increasingly appealing before joking that his \"election-interfering space lasers\" had failed.\nLinkedIn co-founder Reid Hoffman, another major political donor, took a sharper tone.\n\"We should get money out of politics,\" Hoffman wrote late Tuesday on X, accusing Musk of spending \"outrageous amounts to keep authoritarian clowns in power\" while defending his own contributions to Democrats.\nOther Democratic megadonors celebrated. \"The world changed yesterday,\" Alex Soros wrote Wednesday on X, hailing the results as a generational victory after his family contributed roughly $103 million to Democratic political efforts.\nBut beyond the political sparring, some of the country's richest investors were focused on a potentially bigger consequence of the Democratic sweep: the future of the AI boom.\nEven before polls closed Tuesday, Pershing Square founder Bill Ackman warned on CNBC's \"Squawk on the Street\" that slowing AI development could jeopardize America's technological edge. \"Practically speaking, we can't slow down,\" he said.\nAs results rolled in Tuesday night, billionaire investor Chamath Palihapitiya sounded an even starker warning.\nPalihapitiya initially questioned whether the early results would hold, but warned that if they did, the implications for the AI trade could be severe.\n\"And the only way to sink the AI trade is to sink the data centers,\" Palihapitiya said during an election-night livestream of the \"All-In\" podcast.\nTexas offered an early test of those fears. Democratic Gov.-elect Gina Hinojosa, who has proposed a moratorium on new data-center construction until stronger safeguards are established, defeated three-term Republican incumbent Greg Abbott.\nDuring the same livestream, Altimeter Capital CEO Brad Gerstner warned the Democratic wave could mean at least 10 to 15 gigawatts of expected AI data-center capacity would not come online in 2027. Wall Street analyst Dan Ives estimated Wednesday that 10% of planned U.S. data centers would no longer go ahead.\nAMD CEO Lisa Su acknowledged the growing resistance to AI's expansion, urging technology companies to demonstrate the benefits of data centers to local communities.\n\"At the end of the day, what we need to do is ensure that everybody wins from AI,\" Su told CNBC Wednesday.\nYet Wall Street may have found opportunity in the same slowdown that worried AI's biggest backers.\nFewer new data centers could increase the value of existing facilities while easing the enormous spending burden on technology giants. Big Tech stocks surged Wednesday, adding more than $750 billion in market value at one point, even as smaller, debt-dependent data-center operators tumbled.",

    "id": "democrats-take-congress-in-a-blue-wave-h-65a70ba7",
    "title": "Democrats take Congress in a blue wave. Here's what it means for your money",
    "titleJa": "Democrats take Congress in a blue wave. Here's what it means for your money",
    "summaryJa": "Blue wave gives Democrats control of Congress. Here's how their agenda could affect your money, from healthcare and taxes to student loans and Social Security.",
    "bodyOriginal": "With Democrats flipping control of Congress in the midterm election, the shift in power on Capitol Hill could reshape household budgets — from student loan bills and health insurance premiums to housing costs and taxes.\nExperts say results show that rising costs were top of mind for voters.\n\"I see this election as a repudiation of the anti-affordability agenda from the Trump administration,\" said Daniel Bunn, president and CEO of the Tax Foundation, a nonpartisan, nonprofit research organization.\n\"Whether that's the conflict in the Middle East or the tariffs, just top to bottom, it's clear to me that was a real concern of the electorate,\" he said.\nWhite House spokesman Matthew Middleton said in an emailed statement that the Trump administration has delivered \"tangible wins to make life more affordable for American families.\" Officials \"will continue to put hardworking American's first with or without support from Democrats,\" he wrote.\nDemocrats won control of both the House of Representatives and Senate, which could make it easier for the party to advance legislation. They can also use hearings and investigations to press federal agencies and companies to answer for policies and practices that impact consumers, and exert leverage over confirmation of President Donald Trump's nominees.\nBut turning campaign promises into changes people feel in their finances won't be easy. Trump can veto bills a Democrat-controlled Congress passes, limiting how much of their agenda could become law. Based on projections, Democrats will lack the numbers needed to override a presidential veto.\nAny changes will also take time: Newly elected members of Congress won't take office until January.\nHere are eight ways Democrats’ new congressional majority could affect your money.\n1. Healthcare\n\"Not surprisingly, the Dems are going to be keyed in on affordability with respect to healthcare,\" said Zach Gaumer, vice president of health policy at the Bipartisan Policy Center, a nonpartisan think tank.\nLikely target areas include:\n- ACA subsidies: Democrats could try to reinstate at least a portion of the enhanced premium subsidies for Affordable Care Act marketplace insurance plans, Gaumer said. Those enhanced subsidies expired at the end of 2025, after the Republican-controlled Congress and Trump declined to extend them. Millions of ACA enrollees saw their monthly insurance premiums increase sharply as a result.\n- Medicaid: Starting in 2027, states will be required to implement work requirements as a condition of Medicaid enrollment, due to the \"one big beautiful bill\" act, or OBBBA, the Republican-led Congress passed in 2025. Democrats will likely try to loosen those rules, and thereby avoid a large increase in the number of uninsured, Gaumer said.\n- Long-term care: Medicare generally doesn't cover long-term care services, but Democrats may try to add some LTC coverage to the program's purview, Gaumer said. \"That's an interest of several Democrats on the Hill right now,\" he said.\n2. Taxes\nOBBBA made Trump's 2017 tax cuts permanent and added temporary tax breaks. These included new deductions for tip income, overtime earnings, seniors and auto loan interest, which will expire after 2028 without an extension.\nDemocrats may support extending these provisions. But as the Democrat-controlled Congress maps out its agenda, lawmakers will have to address the federal budget deficit. For fiscal year 2026, the budget deficit ballooned to nearly $2 trillion, the Treasury announced in October.\nNewly elected Democratic senators James Talarico of Texas, Troy Jackson of Maine and Annie Andrews of South Carolina all campaigned on expanding the child tax credit. Earlier this year, Senate Democrats also floated ideas to expand the standard deduction and create income tax exemptions for lower-earning Americans — which are costly proposals, according to Bunn from the Tax Foundation.\n\"I've called these termites in the tax code,\" he said. \"You cannot consistently narrow your base, especially for the income tax, and expect your spending priorities to be well-funded.\"\n3. Student loans\nWith Democrats in control of Congress, they are likely to hold hearings and subpoena Trump officials over the administration's student loan policies, said higher education expert Mark Kantrowitz.\nOne priority may be pressing the Education Department to fix the popular Public Service Loan Forgiveness program, which cancels the remaining federal student debt of eligible government and nonprofit workers after a decade. Over the summer, Trump officials reassessed repayment timelines, delaying some borrowers' forgiveness date by years.\nBroad student loan forgiveness is unlikely: Trump could veto such a bill, and the Supreme Court blocked the Biden administration's plan. More attainable changes could include restoring tax-free treatment of forgiven student debt, raising the new borrowing caps and expanding repayment options — measures that may attract bipartisan support, Kantrowitz said.\nTrump has also said he may support legislation capping federal student loan interest rates, a proposal that could give Democrats common ground in their push to ease borrowers’ costs.\n4. Housing\nHousing affordability was a key election issue, and Democrats will likely explore ways to deliver relief, such as introducing measures to help first-time homebuyers, according to an Oct. 30 analysis by Desjardins, a Canadian financial services company.\nHowever, lawmakers generally have little direct impact on home prices, which are based on market conditions. Mortgage rates, too, are influenced by forces generally beyond congressional control. The yield on the 10-year Treasury, which remains higher than it was before the Iran war — due at least partly to concerns about inflation eroding the value of those bonds — influences mortgage rates.\n\"Jumpstarting the housing market relies on a calmer geopolitical environment and bond market in the short run,\" plus more housing supply and a \"more dynamic labor market in the long run,\" said Jake Krimmel, senior economist at Realtor.com.\nThe bipartisan 21st Century ROAD to Housing Act, which automatically became law July 11 without the president's signature due to a constitutional provision, is \"a model for what can pass in a divided Washington,\" Krimmel said. It includes measures to encourage housing construction, reduce regulatory barriers, expand financing options and limit purchases of single-family homes by large institutional investors.\n5. Retirement\nThe incoming class of senators will have to address Social Security insolvency.\nThe program's trustees project that the trust fund Social Security relies on to help pay retirement benefits, formally known as the Old-Age and Survivors Insurance Trust Fund, may be depleted in the fourth quarter of 2032. Without action from Congress before then, benefits could face an across-the-board cut of 22%.\nA number of Democratic lawmakers and some Republicans have called for increased payroll taxes on high earners to help shore up Social Security.\nA potential SECURE 3.0 bill — a follow-up to bipartisan retirement-savings laws passed in 2019 and 2022 — could help expand workers' access to workplace retirement plans like 401(k)s, for example, among a roster of other reforms, experts said.\n6. Credit cards\n\"Trump promised to cap credit card rates at 10%,\" said Aaron Klein, a senior fellow in economic studies at the Brookings Institution, a think tank. \"A Democratic Congress might be willing to do that.\"\nAny such cap is likely to be closer to 36% than to the 10% cap Trump has sought, Jaret Seiberg, a financial services policy analyst at TD Cowen, an investment bank, wrote in a research note Wednesday. Lawmakers in the current Congress have proposed legislation with these thresholds.\nA cap would likely be welcome news for low- and middle-income Americans, Klein said. They are more likely than wealthy households to use debt to finance their lives and to carry a credit card balance — and therefore owe interest on their charges, he said.\nCardholders might see other impacts of such a policy, such as lower credit limits and a clawback of certain card rewards, he said.\n7. Cryptocurrency\nDemocrats' takeover of Congress could stall efforts to put crypto-friendly regulations into federal law, but everyday investors shouldn't expect much to change immediately.\n\"Platforms will keep offering the products they offer today, and they still have friendly regulators at the SEC and CFTC who are approving an ever-wider range of crypto products,\" said Lee Reiners, a cryptocurrency regulation expert and lecturing fellow of economics at Duke University.\nThe election results could threaten the Clarity Act, which would give the Commodity Futures Trading Commission greater authority over cryptocurrency trading while reducing the Securities and Exchange Commission's role. The bill passed the House in July 2025 by a 294-134 vote, but failed to advance in the Senate in September on a 49-50 procedural vote. \"CLARITY is dead,\" said Reiners, adding that he sees little chance of the bill passing during the lame-duck session before Democrats take control in January.\nAny future legislation aimed at creating a regulatory framework for digital assets would likely need to address Democrats' concerns about investor protections and conflicts of interest involving Trump's crypto businesses, said Martin Mulyadi, an accounting professor at Shenandoah University.\nThe SEC and CFTC can also continue developing crypto-friendly rules without Congress. But those rules are easier for a future administration to reverse than legislation, said Marcel Miu, a certified financial planner and founder of Simplify Wealth Planning based in Austin, Texas. \"I'd tell investors to size their crypto investments as if the rules could change repeatedly over the coming years,\" Miu said.\n8. Inflation\nThe Iran war has led oil prices — and those of gasoline, jet fuel, heating oil, diesel and other fuels refined from oil — to surge. That has trickled into higher prices across the U.S. economy, experts said.\nOil prices fell on Wednesday on hopes that the election outcome will push Trump to make a deal to end the war.\n\"Ending the war in Iran would be the biggest policy lever to reducing inflation,\" the Brookings Institution's Klein said.\nA Democrat-led Congress could try to limit Trump's ability to continue the war, perhaps by cutting funding.\n\"Congress' biggest power is the power of the purse,\" Klein said. \"Wars are expensive.\"\n— CNBC's Lorie Konish and Stephanie Dhue contributed reporting.",

n the short run,\" plus more housing supply and a \"more dynamic labor market in the long run,\" said Jake Krimmel, senior economist at Realtor.com.\nThe bipartisan 21st Century ROAD to Housing Act, which automatically became law July 11 without the president's signature due to a constitutional provision, is \"a model for what can pass in a divided Washington,\" Krimmel said. It includes measures to encourage housing construction, reduce regulatory barriers, expand financing options and limit purchases of single-family homes by large institutional investors.\n5. Retirement\nThe incoming class of senators will have to address Social Security insolvency.\nThe program's trustees project that the trust fund Social Security relies on to help pay retirement benefits, formally known as the Old-Age and Survivors Insurance Trust Fund, may be depleted in the fourth quarter of 2032. Without action from Congress before then, benefits could face an across-the-board cut of 22%.\nA number of Democratic lawmakers and some Republicans have called for increased payroll taxes on high earners to help shore up Social Security.\nA potential SECURE 3.0 bill — a follow-up to bipartisan retirement-savings laws passed in 2019 and 2022 — could help expand workers' access to workplace retirement plans like 401(k)s, for example, among a roster of other reforms, experts said.\n6. Credit cards\n\"Trump promised to cap credit card rates at 10%,\" said Aaron Klein, a senior fellow in economic studies at the Brookings Institution, a think tank. \"A Democratic Congress might be willing to do that.\"\nAny such cap is likely to be closer to 36% than to the 10% cap Trump has sought, Jaret Seiberg, a financial services policy analyst at TD Cowen, an investment bank, wrote in a research note Wednesday. Lawmakers in the current Congress have proposed legislation with these thresholds.\nA cap would likely be welcome news for low- and middle-income Americans, Klein said. They are more likely than wealthy households to use debt to finance their lives and to carry a credit card balance — and therefore owe interest on their charges, he said.\nCardholders might see other impacts of such a policy, such as lower credit limits and a clawback of certain card rewards, he said.\n7. Cryptocurrency\nDemocrats' takeover of Congress could stall efforts to put crypto-friendly regulations into federal law, but everyday investors shouldn't expect much to change immediately.\n\"Platforms will keep offering the products they offer today, and they still have friendly regulators at the SEC and CFTC who are approving an ever-wider range of crypto products,\" said Lee Reiners, a cryptocurrency regulation expert and lecturing fellow of economics at Duke University.\nThe election results could threaten the Clarity Act, which would give the Commodity Futures Trading Commission greater authority over cryptocurrency trading while reducing the Securities and Exchange Commission's role. The bill passed the House in July 2025 by a 294-134 vote, but failed to advance in the Senate in September on a 49-50 procedural vote. \"CLARITY is dead,\" said Reiners, adding that he sees little chance of the bill passing during the lame-duck session before Democrats take control in January.\nAny future legislation aimed at creating a regulatory framework for digital assets would likely need to address Democrats' concerns about investor protections and conflicts of interest involving Trump's crypto businesses, said Martin Mulyadi, an accounting professor at Shenandoah University.\nThe SEC and CFTC can also continue developing crypto-friendly rules without Congress. But those rules are easier for a future administration to reverse than legislation, said Marcel Miu, a certified financial planner and founder of Simplify Wealth Planning based in Austin, Texas. \"I'd tell investors to size their crypto investments as if the rules could change repeatedly over the coming years,\" Miu said.\n8. Inflation\nThe Iran war has     "title": "Pound rises to its highest level since the Brexit referendum",

    "summaryJa": "Pound reaches highest level against a basket of currencies since the Brexit referendum a decade ago",
    "bodyOriginal": "Pound rises to its highest level since the Brexit referendum\n- Published\nThe pound has risen to its highest overall level since the Brexit referendum over a decade ago.\nSterling has risen notably in recent weeks against the euro and the dollar, ahead of an expected rise in interest rates.\nThe most-watched measure of the value of the British currency against a basket of 18 of the world's main currencies this week reached its joint highest level since the June 2016 referendum, according to Bank of England figures.\nThe value reached 86.4 on an index where 100 equals the value in 2005. The Bank will officially confirm the calculation on Thursday.\nThe value of sterling fell significantly after the Brexit referendum in June 2016, and reached further lows during the Brexit process, the Covid pandemic and the 2022 mini-Budget.\nSome traders said the UK was being seen in a different light given relative political stability, solid growth and the rapprochement with the European Union.\nSterling has responded strongly to Brexit developments and political uncertainty in recent years.\nJim O'Neill, an economist and former Treasury minister, said: \"I'm not surprised. People were, and to a lesser extent, are, underestimating the improving momentum in the UK,\"\nA stronger pound can help rein in inflation, and increase buying power for consumers on imports and on holidays.\nUK growth so far this year has outperformed all expectations, but there are signs that higher energy and fuel prices have now hit consumer confidence.\nThe Bank's nine member Monetary Policy Committee faces an important decision on interest rates on Thursday, with the first rise in three years widely expected.\nOn Wednesday sterling was up 0.28% against the dollar at $1.3434 and was flat against the euro at €1.1996 as of 23:01 GMT.",
    "bodyJa": "Pound rises to its highest level since the Brexit referendum\n- Published\nThe pound has risen to its highest overall level since the Brexit referendum over a decade ago.\nSterling has risen notably in recent weeks against the euro and the dollar, ahead of an expected rise in interest rates.\nThe most-watched measure of the value of the British currency against a basket of 18 of the world's main currencies this week reached its joint highest level since the June 2016 referendum, according to Bank of England figures.\nThe value reached 86.4 on an index where 100 equals the value in 2005. The Bank will officially confirm the calculation on Thursday.\nThe value of sterling fell significantly after the Brexit referendum in June 2016, and reached further lows during the Brexit process, the Covid pandemic and the 2022 mini-Budget.\nSome traders said the UK was being seen in a different light given relative political stability, solid growth and the rapprochement with the European Union.\nSterling has responded strongly to Brexit developments and political uncertainty in recent years.\nJim O'Neill, an economist and former Treasury minister, said: \"I'm not surprised. People were, and to a lesser extent, are, underestimating the improving momentum in the UK,\"\nA stronger pound can help rein in inflation, and increase buying power for consumers on imports and on holidays.\nUK growth so far this year has outperformed all expectations, but there are signs that higher energy and fuel prices have now hit consumer confidence.\nThe Bank's nine member Monetary Policy Committee faces an important decision on interest rates on Thursday, with the first rise in three years widely expected.\nOn Wednesday sterling was up 0.28% against the dollar at $1.3434 and was flat against the euro at €1.1996 as of 23:01 GMT.",

    "id": "what-was-really-behind-wednesday-s-monst-1a2bfe8e",
    "title": "What was really behind Wednesday's monster rally? Trump quickly making peace",
    "titleJa": "What was really behind Wednesday's monster rally? Trump quickly making peace",
    "summaryJa": "The stock market skyrocketed after a decisive sweep for Democrats in the 2026 midterm elections, a move that Trump's reaction added to.",
    "bodyOriginal": "The stock market skyrocketed on Wednesday on the heels of a decisive sweep for Democrats in the 2026 midterm elections. But that was not necessarily the only driver of the climb.\n\"President Trump's acknowledgement of the Democrats' victory in the midterms and his expressed openness to collaborating with the opposition have helped markets to rally on hopes that contestation of the results and more adverse polarization can be avoided,\" said Thomas Hempell, Generali Investments senior economist.\nTrump told The New York Times and The Wall Street Journal overnight Tuesday that he accepted the results and would work with Democrats. Those headlines coincided with a rebound in stock market futures.\nIn the lead-up to this year's midterms, some on Wall Street grew increasingly concerned about the prospect of Trump contesting the election results. The Department of Justice's Alaska election lawsuit led to fears over delays with the outcome that would exacerbate the uneasiness in the market that's typically removed once the elections conclude.\nCNBC's Fed Survey showed that among 30 fund managers, strategists and economists, 63% believe that the extended uncertainty around the balance of power created by legal challenges to the election results posed \"some\" market risk. That was a slight increase from 61% in September. Additionally, 14% believed it represented \"significant\" market risk, which was up from 7%.\nNow, investors are breathing a sigh of relief over Trump's acceptance of the results, which should \"act as a break on extreme policy outcomes and bring down risk premia,\" so long as the president's decision remains, said George Saravelos, head of FX Research at Deutsche Bank.\n'An X factor'\nTrump has a history of rallying markets, as well as driving them lower, with his announcements. Jay Woods of Freedom Capital Markets, who noted that the rebound in stocks overnight was partially due to the president's \"initial tone and reaction to the results,\" said the focus will shift to whether Trump's latest move will actually have staying power.\n\"I think Trump is going to try to do and say the right thing, but at two in the morning, he may change his mind,\" the chief market strategist said. \"He is an X factor.\"\nWoods added that he's \"encouraged\" by Wednesday's massive rally, but he noted that there are still headwinds that could plague the market over the coming weeks — such as concerns about inflationary pressures as a result of higher energy prices from the conflict in the Middle East.\n\"How Trump reacts to it will help us navigate those headwinds,\" he said.\nOsaic's Philip Blancato said he believes that if Trump \"continues to play nice\" with Democrats, the market is going to have a \"very strong\" end to the year.\nStocks historically tend to rally after the midterms anyway, but this time around, some were worried the solid run-up in the S&P 500 this year was going to potentially hinder those gains. After Trump's reaction, Blancato said he doesn't think the S&P 500 hitting 8,000 by year-end is totally out of the question and that there's \"a lot predicated on him, but not completely.\"\nThe broad market index gained more than 1% on Wednesday, with its closing price implying a roughly 4% gain to that level.\nHowever, investors should be prepared for any future volatility if Trump's rhetoric does not remain the same, the chief market strategist said.\n\"The president's always going to be a wildcard,\" he said. \"Let's not let one day make a year. This is an instant reaction to this thing. There's still plenty of things to be hashed out.\"",

    "id": "democrats-flip-dozens-of-gop-seats-repub-cfb8cccb",
    "title": "Democrats flip dozens of GOP seats. Republicans haven't flipped a single one",
    "titleJa": "Democrats flip dozens of GOP seats. Republicans haven't flipped a single one",
    "summaryJa": "Democrats have flipped seven Senate seats, nearly 30 House districts, five governorships and up to 12 state legislative chambers in a historic 2026 midterm rout.",
    "bodyOriginal": "Seven Senate seats. At least 24 House districts. Five governorships. Twelve state legislative chambers. By Wednesday afternoon, that's how far Democrats' historic midterm rout had reached.\nRepublicans, meanwhile, had yet to flip a single Democratic-held congressional seat, governorship or state legislative chamber, according to Associated Press data. Their remaining opportunities for congressional pickups are largely confined to two newly gerrymandered House districts that weren't even supposed to be competitive in the first place.\nThe lopsided results underscored the breadth of the GOP's shellacking, with Democrats breaking decades of Republican dominance in reliably red states and reshaping the balance of power from Washington to state capitols.\nAs of late Wednesday, nine House seats remained uncalled by the AP along with two Senate seats and two governors races. The one seat Republicans may have a chance of flipping that hasn't been redistricted ahead of this election is Maine's 2nd District, FiftyPlusOne head of research Mary Radcliffe said by email.\nIn Kansas, voters elected their first Democratic U.S. senator since 1932, ending a 94-year losing streak. In Texas, Democrats toppled three-term Republican Gov. Greg Abbott and captured a Senate seat that had eluded the party since 1988. Republican-held Senate seats also fell in Iowa, South Carolina and Ohio, along with seats in Maine and North Carolina.\nThe same wave swept through governors' mansions. Democrats scored upsets in Georgia, Iowa, Ohio and Nevada — all states President Donald Trump won in 2024 — giving the party a majority of the nation's governorships for the first time since 2010.\nUpheaval even reached state capitols, where Republican legislative majorities that had endured for decades fell like dominoes.\nDemocrats seized control of the Texas House for the first time in more than two decades, flipped both chambers of the Wisconsin Legislature and wrested the North Carolina House from Republicans after 16 years in the minority.\nIn Pennsylvania, Democrats captured the state Senate for the first time since before 1994, giving the party complete control of state government. They also reclaimed lower chambers in Michigan and Minnesota, restoring full Democratic control in both states. In Arizona, unofficial results pointed toward Democrats taking both legislative chambers for the first time in roughly 60 years.\nEven where Republicans held on to legislative majorities, Democrats stripped away veto-proof supermajorities in Florida, Indiana, Kansas and Missouri. Not since the aftermath of Watergate in 1974 had the GOP faced a statehouse reckoning of this magnitude, according to the Democratic Legislative Campaign Committee.\nThe scale of the losses is all the more remarkable given how aggressively Republicans had tried to protect their power. At Trump's urging, GOP lawmakers spent months pursuing an extraordinary mid-decade redistricting campaign, redrawing congressional boundaries in Texas, Florida and North Carolina to tilt the electoral map in their favor.\nYet the gerrymandering push did little to blunt the Democratic wave. And the damage might not be over. Republicans were still fighting to hold Senate seats in Alaska and Mississippi, with several House contests also uncalled Wednesday.\n— Kevin Breuninger contributed to this report.",
    "bodyJa": "Seven Senate seats. At least 24 House districts. Five governorships. Twelve state legislative chambers. By Wednesday afternoon, that's how far Democrats' historic midterm rout had reached.\nRepublicans, meanwhile, had yet to flip a single Democratic-held congressional seat, governorship or state legislative chamber, according to Associated Press data. Their remaining opportunities for congressional pickups are largely confined to two newly gerrymandered House districts that weren't even supposed to be competitive in the first place.\nThe lopsided results underscored the breadth of the GOP's shellacking, with Democrats breaking decades of Republican dominance in reliably red states and reshaping the balance of power from Washington to state capitols.\nAs of late Wednesday, nine House seats remained uncalled by the AP along with two Senate seats and two governors races. The one seat Republicans may have a chance of flipping that hasn't been redistricted ahead of this election is Maine's 2nd District, FiftyPlusOne head of research Mary Radcliffe said by email.\nIn Kansas, voters elected their first Democratic U.S. senator since 1932, ending a 94-year losing streak. In Texas, Democrats toppled three-term Republican Gov. Greg Abbott and captured a Senate seat that had eluded the party since 1988. Republican-held Senate seats also fell in Iowa, South Carolina and Ohio, along with seats in Maine and North Carolina.\nThe same wave swept through governors' mansions. Democrats scored upsets in Georgia, Iowa, Ohio and Nevada — all states President Donald Trump won in 2024 — giving the party a majority of the nation's governorships for the first time since 2010.\nUpheaval even reached state capitols, where Republican legislative majorities that had endured for decades fell like dominoes.\nDemocrats seized control of the Texas House for the first time in more than two decades, flipped both chambers of the Wisconsin Legislature and wrested the North Carolina House from Republicans after 16 years in the minority.\nIn Pennsylvania, Democrats captured the state Senate for the first time since before 1994, giving the party complete control of state government. They also reclaimed lower chambers in Michigan and Minnesota, restoring full Democratic control in both states. In Arizona, unofficial results pointed toward Democrats taking both legislative chambers for the first time in roughly 60 years.\nEven where Republicans held on to legislative majorities, Democrats stripped away veto-proof supermajorities in Florida, Indiana, Kansas and Missouri. Not since the aftermath of Watergate in 1974 had the GOP faced a statehouse reckoning of this magnitude, according to the Democratic Legislative Campaign Committee.\nThe scale of the losses is all the more remarkable given how aggressively Republicans had tried to protect their power. At Trump's urging, GOP lawmakers spent months pursuing an extraordinary mid-decade redistricting campaign, redrawing congressional boundaries in Texas, Florida and North Carolina to tilt the electoral map in their favor.\nYet the gerrymandering push did little to blunt the Democratic wave. And the damage might not be over. Republicans were still fighting to hold Senate seats in Alaska and Mississippi, with several House contests also uncalled Wednesday.\n— Kevin Breuninger contributed to this report.",

    "titleJa": "Democrats map out an agenda to address affordability and corruption after midterm sweep",
    "summaryJa": "In control of Congress, Democrats are preparing to pursue legislation to address affordability, while also trying to rein-in President Donald Trump",
    "bodyOriginal": "The newly elected Democratic majorities in the Senate and the House are planning to pass a flurry of bills as soon as they take the reins next January, CNBC has learned, and are preparing to tussle with an antagonistic President Donald Trump.\nThe legislative push aims to show a united Democratic caucus taking quick action on the issues they were elected to solve, especially oppressively high costs on everything from gas to groceries.\nIn their first 100 hours after being sworn in, House Democrats plan to bring to the floor bills reinstating the enhanced health insurance subsidies that expired under the GOP-held Congress, and reversing the Medicaid cuts Trump signed into law last year.\nDemocrats — likely led by Minority Leader Hakeem Jeffries (D-N.Y.), who is poised to become the first Black Speaker of the House in U.S. history — also plan to push forward a bill that would undo Trump's sweeping tariffs and reassert Congress' role in setting import taxes. And they will again vote on legislation to end the Iran war or force Trump to seek congressional authorization to keep it going. Some details of the Democrats' plans had been previously reported by the New York Times.\nBut Democrats will need to strike a balance between these legislative priorities and a robust oversight and investigatory agenda that the party is mapping out to scrutinize Trump, his family, cabinet and supporters in the business world.\n\"We haven't evaluated who are going to be the targets of the investigation right out of the gate. We'll have those conversations over the next couple of weeks,\" Jeffries told CNBC on Wednesday.\n\"But clearly, things aren't going right for the American people. Capitalism is broken in the way in which it is being experienced by so many working-class Americans and middle-class Americans. We've got to make sure we build an economy, a free market economy, that works for everyday Americans,\" Jeffries said.\nDemocrats on the campaign trail for months hammered home a message of affordability. And as corruption emerged as a top issue for voters in the waning months of the election, they tried to connect the Trump administration's perceived bad behavior to Americans' pocketbooks.\nAlready, prominent Democrats are taking a similar tack as they prepare to assume majorities in both chambers.\nSen. Ron Wyden of Oregon, the top Democrat on the Senate Finance Committee, said in a statement on Wednesday that the panel's top priorities \"will be affordability for us, accountability for them.\"\nWyden said the committee would double down on its efforts to make sure billionaires pay their fair share in taxes, address the \"corporate chokehold on our nation's health care system\" and reassert congressional authority over trade. He also vowed to target the \"special interests\" that had cozied up to Trump in the past two years.\n\"From the banks that helped cover up Epstein's crimes, to insurance companies that are delaying and denying health care to churn a profit, to the pharmaceutical company CEOs that price gouge while enjoying Trump's hand-delivered windfalls, when I am chair, they will be forced to answer to the Senate Finance Committee for their role in hurting the American people and enabling Trump's corruption,\" Wyden said.\nRep. Robert Garcia of California, the top-ranking Democrat on the House Oversight Committee, has vowed to take on Trump's family, corporate corruption, Department of Homeland Security and Immigration and Customs Enforcement overreach and the handling of files related to disgraced sex offender Jeffrey Epstein.\nGarcia issued a pointed, two-word statement as results tipped toward Democrats on Tuesday night: \"Lawyer up.\"\nAnd Rep. Pramila Jayapal, D-Wash., a former chair of the Congressional Progressive Caucus and member of the House Judiciary and Foreign Affairs committees, said in a recent interview with CNBC that she believed Democrats should target figures like Elon Musk, as well as cabinet secretaries like Defense Secretary Pete Hegseth, Secretary of Health and Human Services Robert F. Kennedy Jr., and Attorney General Todd Blanche.\nBut she acknowledged the challenges that could come with pursuing a large number of potential targets all at once, especially with a potentially unwieldy and ideologically diverse Democratic caucus.\n\"I think what we should do is pick one or two cases that really exemplify the worst of the corruption, and that we feel we have the most evidence of wrongdoing,\" Jayapal said. \"There are so many things — I think it's important to focus on a couple.\"\nMeanwhile, other Democrats are angling for some kind of ethics reform package that could include prohibitions on stock trading and use of prediction markets for government officials, a federal ban on gerrymandering and limiting super PAC spending.\n\"My expectation is that when Democrats are the majority, we will pass a strong bill to ban stock trading in Congress, in the executive branch, and beyond, and that this will be part of a larger package of ethics reforms that we pursue,\" said Rep. Seth Magaziner, D-R.I., a longtime advocate for such legislation.",

taries like Defense Secretary Pete Hegseth, Secretary of Health and Human Services Robert F. Kennedy Jr., and Attorney General Todd Blanche.\nBut she acknowledged the challenges that could come with pursuing a large number of potential targets all at once, especially with a potentially unwieldy and ideologically diverse Democratic caucus.\n\"I think what we should do is pick one or two cases that really exemplify the worst of the corruption, and that we feel we have the most evidence of wrongdoing,\" Jayapal said. \"There are so many things — I think it's important to focus on a couple.\"\nMeanwhile, other Democrats are angling for some kind of ethics reform package that could include prohibitions on stock trading and use of prediction markets for government officials, a federal ban on gerrymandering and limiting super PAC spending.\n\"My expectation is that when Democrats are the majority, we will pass a strong bill to ban stock trading in Congress, in the executive branch, and beyond, and that this will be part of a larger package of ethics reforms that we pursue,\" said Rep. Seth Magaziner, D-R.I., a longtime advocate for such legislation.",

    "titleJa": "Crude oil prices fall below $90 a barrel as Vance blames GOP election defeat on Iran war",
    "summaryJa": "Crude oil prices tumbled Wednesday after Vice President JD Vance blamed the Republicans' steep midterm election losses on the Iran war.",
    "bodyOriginal": "Crude oil prices tumbled Wednesday after Vice President JD Vance blamed the war against Iran for Republican midterm election reversals.\nU.S. West Texas Intermediate lost 8.3% to close at $88.12 a barrel. Brent crude futures, the international benchmark, shed 8.7% to settle at $94.62.\n\"The reason we lost is the war,\" Vance said in a social media post Wednesday. \"The president himself said so last night.\"\nDemocrats swept the House and Senate in Tuesday's elections, giving the party leverage to pressure President Donald Trump to end the unpopular war that has spiked gasoline and diesel prices.\n\"The elections are leading the market to conclude that Trump might now be inclined to make a deal,\" said Andy Lipow, president of Lipow Oil Associates.\nThe Democrats may try to restrict funding for the war, Lipow said. Trump's announcement earlier this week that the U.S. will cut some funding to Israel could force Jerusalem to accept Washington's decisions, he said.\nTrump told the Financial Times on Tuesday that he has no immediate plans to strike Iran. The oil market had priced in the risk of a major escalation after the elections, gaining more than 10% in October.\nEscalation risk still real\nOil futures have fallen more than 14% this week as senior U.S. and Iranian officials indicated they're open to a diplomatic settlement of the conflict, which has disrupted global energy supplies for eight months.\nThe sell-off \"could be getting a bit overdone,\" said Rebecca Babin, senior energy trader at CIBC. The market is in a \"shoot first, ask questions\" later mode as emotions run high after the unexpected election results, Babin said.\nMany observers expected a Democrat tsunami could push Trump to escalate with Iran, Babin said. \"Vance's commentary and the public lack of backing from key allies have challenged that assumption,\" she said.\nBut the odds still favor military escalation in the region, warned Bob McNally, president of Rapidan Energy and a former advisor to President George W. Bush.\n\"Iran is hardened in its uncompromising position,\" McNally said. \"Trump, having now paid a huge price for his determination to prevent Iran from obtaining a nuclear weapon, is unlikely to let go of this legacy goal and walk away.\"",

    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
