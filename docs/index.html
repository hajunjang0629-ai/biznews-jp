    "titleJa": "米国、イランに対して「前例のない」経済戦術を発動へ。海軍はトラブルに見舞われた空母エイブラハム・リンカーンの救援に取り組んでいる",
    "summaryJa": "スコット・ベッセント財務長官によると、米国は「イランに対してこれまでに例のない」経済措置を適用する予定だという。ベッセント氏はニュースマックスとのインタビューで、「これは世界がこれまでに経験したことのないような経済的孤立と、イランの港への物の出入りを阻止するホルムズ海峡の継続的な封鎖の組み合わせになるだろう」と述べたが、それ以上詳しくは述べなかった。",
    "bodyOriginal": "The U.S. will be applying economic measures \"that have never been seen on Iran,\" according to Treasury Secretary Scott Bessent.\n\"It will be a combination of economic isolation like the world has never seen before, and the continued blockade in the Strait of Hormuz that will keep anything from going in or out of the Iranian ports,\" Bessent said in an interview with Newsmax, without elaborating further.\nHis statements come as U.S. Defense Secretary Pete Hegseth reportedly said late Thursday stateside that the U.S. military can keep a naval blockade of Iran going \"indefinitely.\" The Navy will rotate ships in and out \"as we have, and we'll continue to,\" Hegseth told reporters.\nMedia reports have said that the U.S. aircraft carrier USS George Washington was headed to replace the USS Abraham Lincoln, which has been deployed for over 250 days in the Middle East. Its deployment had been expected to end in May.\nThe George Washington strike group departed Vietnam on Aug. 12, the Navy said in a statement.\nHegseth also told reporters that reports about poor conditions aboard the Lincoln, including food shortages, declining morale, and even attempts by sailors to jump overboard, were \"completely misrepresented.\"\nAfter Hegseth's comments, Rep. Mike Levin (D-Calif.) said on X that he had sent a letter to Hegseth and Acting Secretary of the Navy Hung Cao to express serious concerns about conditions aboard the Lincoln.\n\"The reports coming from military families and loved ones about the conditions aboard the USS Lincoln are simply unacceptable. Reports include concerns of moldy showers, broken toilets, lack of hot water, lack of access to fresh produce, and supply shortages,\" the letter said.\nSailors and marines are also said to have an \"overwhelming workload,\" which is contributing to \"extreme fatigue and burnout,\" it said.\nIn a post on X, U.S. Central Command said that reports alleging a brawl aboard the carrier were false, and that no service members have died.\nThis came after Iranian media claimed on Tuesday that seven U.S. Navy personnel have been killed and several wounded \"in a violent clash\" on the Lincoln.",
    "bodyJa": "スコット・ベッセント財務長官によると、米国は「イランに対してこれまでに例のない」経済措置を適用する予定だという。\nベッセント氏はニュースマックスとのインタビューで、「これは世界がこれまでに経験したことのないような経済的孤立と、イランの港への物の出入りを阻止するホルムズ海峡の継続的な封鎖の組み合わせになるだろう」と述べたが、それ以上詳しくは述べなかった。\n同氏の発言は、ピート・ヘグセス米国防長官が木曜日遅く、米軍はイランに対する海上封鎖を「無期限」に継続することができると米国内で述べたと伝えられている中で行われた。ヘグセス氏は記者団に対し、海軍は「これまでと同様、今後も船舶の出入りをローテーションする」と語った。\nメディアの報道によると、米国の空母ジョージ・ワシントンは、中東に250日以上配備されている空母エイブラハム・リンカーンの後継として向かう予定だという。その配備は5月に終了すると予想されていた。\n海軍は声明で、ジョージ・ワシントン打撃群は8月12日にベトナムを出発したと発表した。\nヘグセス氏はまた、食糧不足や士気の低下、さらには船員による飛び降りの試みなど、リンカーン号の劣悪な船内の状況に関する報道は「完全に誤って伝えられている」と記者団に語った。\nヘグセスのコメントの後、マイク・レビン下院議員（民主党、カリフォルニア州）はXで、ヘグセスとフン・カオ海軍長官代理に書簡を送り、リンカーン艦内の状況について深刻な懸念を表明したと述べた。\n書簡には「USSリンカーンの船内の状況について軍人の家族や愛する人たちから寄せられた報告はまったく受け入れられない。報告にはカビの生えたシャワー、壊れたトイレ、お湯の不足、生鮮食品へのアクセスの欠如、物資不足などの懸念が含まれている」と述べた。\n船員と海兵隊員は「圧倒的な仕事量」を抱えており、それが「極度の疲労と燃え尽き症候群」の一因となっているとも述べた。\n米中央軍はＸへの投稿で、空母内で乱闘があったとする報道は虚偽であり、軍人は死亡していないと述べた。\nこれは、イランメディアが火曜日、リンカーン号での「暴力的な衝突」で米海軍関係者７人が死亡、数人が負傷したと主張したことを受けてのことだった。",

    "id": "uber-partners-with-china-s-pony-ai-for-2-c75bd382",
    "title": "Uber partners with China's Pony.ai for 2,000 robotaxis in Europe",
    "titleJa": "ウーバー、中国のPony.aiと提携し、ヨーロッパで2,000台のロボタクシーを導入",
    "summaryJa": "北京 — 米国の配車サービス大手ウーバーは、運営会社ポニー・アイ（Pony.ai）との提携により、世界的なロボタクシーのサービス範囲を拡大している。両社は、Pony.aiの自動運転タクシー2,000台をヨーロッパ全土に配備し、ロボタクシー提携を中東に拡大する計画であると金曜日に発表した。",
    "bodyOriginal": "BEIJING — U.S. ride-hailing giant Uber is ramping up its global robotaxi coverage with operator Pony.ai.\nThe companies plan to deploy 2,000 of Pony.ai's self-driving taxis across Europe, and expand the robotaxi partnership to the Middle East, they announced Friday.\nIn late March, Uber and Pony.ai launched a commercial robotaxi service in Croatia's capital Zagreb — which they claim is the first in Europe.\nThe partnership announced Friday will roll out robotaxis to four other European cities. The companies did not name the cities or share an exact timeframe.\nHaving a large-enough vehicle fleet is critical for commercialization. The more cars available, the more data can be collected to demonstrate safety to regulators and boost operational efficiency. Greater availability encourages more people to use the service.\nAlphabet-backed robotaxi operator Waymo is the global leader with a fleet of around 5,000 vehicles, primarily in the U.S. It is testing rides in London, and reportedly set up new entities in four major EU economies in June.\nWaymo also has plans underway in Tokyo, and is engaging with officials around the world to \"lay the groundwork for global operations,\" it said in a statement to CNBC.\nChinese rivals Baidu Apollo Go and WeRide, meanwhile, are ramping up plans and tests for operating autonomous rides in Europe.\nUber is part of many of their plans.\nWeRide and Uber in June announced plans to launch Spain's first robotaxi taxi pilot in Madrid later this year. The two companies also partner in Abu Dhabi and Dubai.\nUber on Thursday announced its Japanese subsidiary signed an agreement with a local taxi operator to manage daily fleet operations for a test deployment of robotaxis in Tokyo later this year.\nUber's goal is \"to become the world's leading commercialization platform for autonomous vehicles,\" CEO Dara Khosrowshahi said earlier this month, according to a FactSet earnings call transcript.\nPart of that strategy is gathering \"a super set of data\" that it can share with its partners to accelerate autonomous vehicle development, he said.\nPony.ai is scheduled to release quarterly earnings Tuesday.\n— CNBC's Lora Kolodny contributed to this report.",
    "bodyJa": "北京 — 米国の配車サービス大手ウーバーは、運営会社ポニー・アイ（Pony.ai）との提携により、世界的なロボタクシーのサービス範囲を拡大している。\n両社は、Pony.aiの自動運転タクシー2,000台をヨーロッパ全土に配備し、ロボタクシー提携を中東に拡大する計画であると金曜日に発表した。\n3 月下旬、Uber と Pony.ai はクロアチアの首都ザグレブで商用ロボタクシー サービスを開始しました。これはヨーロッパ初だと彼らは主張しています。\n金曜日に発表された提携では、ロボタクシーをヨーロッパの他の4都市に展開する予定だ。両社は都市名や正確な期間については明らかにしなかった。\n商用化には十分な数の車両を保有することが重要です。利用可能な車両が増えれば増えるほど、より多くのデータを収集して規制当局に安全性を証明し、運用効率を高めることができます。可用性が向上すると、より多くの人がサービスを利用するようになります。\nアルファベットが支援するロボタクシー運営会社ウェイモは、主に米国で約5,000台の車両を保有する世界的リーダーである。同社はロンドンで試乗を行っており、6月にはEUの主要4カ国に新しい事業体を設立したと報じられている。\nウェイモは東京でも計画を進めており、「世界的な事業の基礎を築く」ために世界中の当局者と協力しているとCNBCへの声明で述べた。\n一方、中国のライバルである百度アポロゴーとウィライドは、ヨーロッパで自動運転乗り物を運行する計画とテストを強化している。\nUber は彼らの計画の多くに含まれています。\nWeRideとUberは6月、スペイン初のロボタクシータクシーの試験運用を今年後半にマドリッドで開始する計画を発表した。両社はアブダビとドバイでも提携している。\nウーバーは木曜日、同社の日本法人が、今年後半に東京でロボタクシーを試験導入するため、日々の車両運行を管理するため地元のタクシー事業者と契約を結んだと発表した。\nファクトセットの決算会見記録によると、ウーバーの目標は「自動運転車の世界をリードする商業化プラットフォームになること」だと、CEOのダラ・コスロシャヒ氏が今月初めに語った。\nその戦略の一環として、自動運転車の開発を加速するためにパートナーと共有できる「スーパーセットのデータ」を収集することがある、と同氏は述べた。\nPony.aiは火曜日に四半期決算を発表する予定だ。\n— CNBC の Lora Kolodny がこのレポートに貢献しました。",

    "id": "from-apple-to-ford-how-chinese-tech-is-b-391c409b",
    "title": "From Apple to Ford: How Chinese tech is becoming harder for global companies to ignore",
    "titleJa": "アップルからフォードまで：世界企業にとって中国のテクノロジーを無視することがいかに困難になっているか",
    "summaryJa": "米国政府は中国政府の技術的野望を抑制する取り組みを強化しているが、人工知能から電気自動車のバッテリーに至るまで、中国の技術は世界最大手の企業のビジネスにますます組み込まれつつある。Appleは中国のAIに関してAlibabaとBaiduを活用し、一方Fordはバッテリー技術に関してCATLに目を向けた。フォルクスワーゲンは中国でのスマートEVの開発でXpengと提携し、ステランティスはEVの生産と共同購入でリープモーターとの提携を拡大している。",
    "bodyOriginal": "Washington has been stepping up efforts to curb Beijing's technological ambitions, but from artificial intelligence to electric vehicle batteries, Chinese technology is becoming increasingly embedded in the businesses of some of the world's biggest companies.\nApple has tapped Alibaba and Baidu for AI in China, while Ford has turned to CATL for battery technology. Volkswagen has teamed up with Xpeng to develop smart EVs in China, while Stellantis is expanding its partnership with Leapmotor on EV production and joint purchasing.\nAnalysts say a broad shift is underway, with Chinese companies becoming sources of technology and innovation that global businesses cannot easily sidestep.\n\"Five years ago, China was primarily where global companies went to sell. Today, in certain sectors, it is where they go to source capability,\" Kitty Fok, managing director at market research firm IDC China, told CNBC.\nThat development comes even as Washington has expanded efforts to restrain Chinese technology.\nSince blacklisting Huawei in 2019, it has imposed sweeping curbs on advanced chips and chipmaking equipment, restricting certain U.S. investments in Chinese semiconductors, quantum technology and AI, and proscribing firms including contract chipmaker Semiconductor Manufacturing International Corporation, or SMIC.\nFrom market to technology source\nChina has built formidable positions across a growing number of technology industries.\nAutomakers including BYD, Changan and Chery accounted for nearly 63% of the global electric vehicle market in 2025, while battery makers including CATL, BYD, CALB and Gotion held close to 70%, according to Soumen Mandal, principal analyst at Counterpoint Research.\nMandal pointed to cost, scale, manufacturing depth, supply-chain integration and the speed of innovation as powerful reasons for global companies to continue engaging with Chinese firms.\n\"China's technological rise is shifting from low-cost manufacturing to scale, supply-chain depth, and speed of innovation,\" Mandal said, adding that global companies are maintaining a balance between geopolitical risk and commercial realities.\nThat shift is particularly advanced in electric vehicle batteries.\nCATL has become deeply integrated into the global automotive industry. Ford, for example, is working with CATL to use its lithium-iron phosphate battery technology at a $3.5 billion battery plant in Michigan.\nFok said the integration of Chinese EV battery technology into global supply chains can be difficult to unwind.\n\"In EV batteries, the structural shift is already complete,\" she said. \"Switching suppliers is not a procurement decision you make in a quarter. It takes years of engineering, testing, and recertification.\"\nFor some companies, however, working with Chinese technology firms remains primarily about competing inside China.\nMultinational companies that need AI services or cloud infrastructure for their China operations have to work with local providers because of restrictions on foreign providers, according to Fok.\n\"Inside China, a lot of this isn't a choice,\" she said, pointing to Apple's work with Alibaba and Baidu.\nLian Jye Su, chief analyst at Omdia, said access to the Chinese market remains the primary driver for many such partnerships, particularly as global automakers increasingly turn to Chinese vendors for software, AI and other systems to sell in China.\nBut that is not the only driver. Su said a \"slow yet persistent structural shift\" was taking place in supply chains and innovation flows in areas including batteries, electric vehicles, energy storage and applied AI.\nAI could be the next frontier\nThe trend is also beginning to play out in artificial intelligence, where increasingly capable Chinese models are challenging the idea that companies turn to Chinese technology mainly because it is cheaper.\nAn IDC survey of European companies earlier this year found security and compliance requirements and superior performance, not costs, were the top two reasons for extensive adoption of Chinese AI models.\n\"So the popular narrative that Western companies are rushing to Chinese AI because it's cheap gets this backwards,\" Fok said. \"The decision is performance-led and compliance-gated.\"\nUnlike U.S.-based Anthropic and OpenAI, Chinese firms including Alibaba and DeepSeek have focused on open-source models, making them more accessible to developers globally.\nThe Chinese AI advance comes even as U.S. restrictions have constrained Beijing in areas such as cutting-edge semiconductors, according to Su, while also accelerating domestic innovation.\n\"The key impact of the U.S. restriction is that it has become a catalyst for Chinese domestic innovation and efficiency,\" Su said, adding that Chinese vendors remain competitive in AI, batteries and automotive software.\nLimits to the shift\nGeopolitical considerations continue to shape how and where Chinese technology is adopted.\nSu expects the resistance to Chinese technology to be strongest in areas including advanced semiconductors, services linked to cybersecurity, defense, and national security.\nRather than a straightforward technological boycott or embrace, analysts say Chinese technology adoption will vary by sector.\nCounterpoint's Mandal expects Chinese technology adoption to expand globally across areas including EVs, batteries, consumer electronics, robotics, drones and selected areas of AI and semiconductors, leading to what he described as \"a more fragmented but pragmatic global technology ecosystem.\"\nFok said the shift is already structural in batteries and electronics manufacturing, while AI is in transition and automotive software remains at an early stage.",
    "bodyJa": "米国政府は中国政府の技術的野望を抑制する取り組みを強化しているが、人工知能から電気自動車のバッテリーに至るまで、中国の技術は世界最大手の企業のビジネスにますます組み込まれつつある。\nAppleは中国のAIに関してAlibabaとBaiduを活用し、一方Fordはバッテリー技術に関してCATLに目を向けた。フォルクスワーゲンは中国でのスマートEVの開発でXpengと提携し、ステランティスはEVの生産と共同購入でリープモーターとの提携を拡大している。\nアナリストらは、中国企業が世界企業が容易に回避できない技術とイノベーションの源泉となり、幅広い変化が進行していると述べている。\n市場調査会社IDCチャイナのマネジングディレクター、キティ・フォク氏はCNBCに対し、「5年前、中国は主にグローバル企業が売りに行く場所だった。しかし現在、特定の分野では、中国は能力を調達する場所になっている」と語った。\nこの発展は、米国政府が中国の技術を抑制する取り組みを拡大している中でも起こった。\n2019年にファーウェイをブラックリストに登録して以来、ファーウェイは先端チップとチップ製造装置に大幅な制限を課し、中国の半導体、量子技術、AIへの米国の一部投資を制限し、受託チップメーカーのセミコンダクター・マニュファクチャリング・インターナショナル・コーポレーション（SMIC）を含む企業を禁止してきた。\n市場から技術ソースまで\n中国は、ますます多くのテクノロジー産業にわたって恐るべき地位を築いてきました。\nカウンターポイント・リサーチの主任アナリスト、ソウメン・マンダル氏によると、BYD、長安、奇瑞などの自動車メーカーは2025年の世界の電気自動車市場の63％近くを占め、CATL、BYD、CALB、Gotionなどの電池メーカーは70％近くを占めた。\nマンダル氏は、グローバル企業が中国企業との関わりを続ける強力な理由として、コスト、規模、製造の深さ、サプライチェーンの統合、イノベーションのスピードを挙げた。\nマンダル氏は「中国の技術的台頭は、低コスト製造から規模、サプライチェーンの深さ、イノベーションのスピードへと移行している」と述べ、グローバル企業は地政学的リスクと商業的現実のバランスを維持していると付け加えた。\nこの変化は電気自動車のバッテリーで特に進んでいます。\nCATL は世界の自動車産業に深く組み込まれています。たとえば、フォードはCATLと協力して、ミシガン州にある35億ドルの電池工場でそのリン酸鉄リチウム電池技術を使用している。\nフォク氏は、中国のEVバッテリー技術を世界のサプライチェーンに統合することは、元に戻すのが難しい可能性があると述べた。\n「EV用バッテリーでは、構造転換はすでに完了している」と同氏は語った。 「サプライヤーの切り替えは、四半期で決定する調達の決定ではありません。エンジニアリング、テスト、再認定には何年もかかります。」\nしかし、一部の企業にとって、中国のテクノロジー企業との協業は依然として主に中国国内での競争に関係している。\nフォク氏によると、中国での事業運営にAIサービスやクラウドインフラストラクチャを必要とする多国籍企業は、外国プロバイダーに対する制限があるため、地元プロバイダーと連携する必要があるという。\n「中国国内では、こうしたことの多くは選択の余地がない」と彼女は語り、アップルとアリババやバイドゥとの協力を指摘した。\nオムディアの首席アナリスト、リアン・ジェ・スー氏は、特に世界的な自動車メーカーが中国で販売するソフトウェア、AI、その他のシステムについて中国ベンダーに頼る傾向が強まっており、中国市場へのアクセスが依然として多くのこうした提携の主な原動力となっていると述べた。\nしかし、ドライバーはそれだけではありません。スー氏は、バッテリー、電気自動車、エネルギー貯蔵、応用AIなどの分野でサプライチェーンとイノベーションの流れで「ゆっくりだが持続的な構造変化」が起きていると述べた。\nAIは次のフロンティアになる可能性がある\nこの傾向は人工知能にも現れ始めており、企業が主に安価であるという理由で中国の技術に頼るという考えに対して、ますます高機能な中国製モデルが挑戦している。\n今年初めにヨーロッパ企業を対象とした IDC の調査では、中国の AI モデルが広範に採用される上位 2 つの理由は、コストではなく、セキュリティとコンプライアンスの要件、および優れたパフォーマンスであることが判明しました。\n「つまり、西側企業が中国製AIが安いという理由で殺到しているという一般的な説は、これを逆向きにしているのです」とフォク氏は語った。 「この決定はパフォーマンス主導であり、コンプライアンスに基づいて行われます。」\n米国に本拠を置くAnthropicやOpenAIとは異なり、AlibabaやDeepSeekなどの中国企業はオープンソースモデルに焦点を当てており、世界中の開発者がオープンソースモデルを利用しやすくしている。\nスー氏によると、中国のAIの進歩は、米国の規制により中国政府が最先端の半導体などの分野で制約を受けている一方で、国内のイノベーションも加速しているという。\nスー氏は「米国の規制の主な影響は、中国国内の技術革新と効率化の触媒となったことだ」と述べ、中国ベンダーはAI、電池、自動車ソフトウェアの分野で競争力を維持していると付け加えた。\nシフトの制限\n地政学的な考慮は、中国の技術がどこでどのように採用されるかを形成し続けています。\nスー氏は、中国のテクノロジーに対する抵抗が、先端半導体、サイバーセキュリティー、防衛、国家安全保障に関連するサービスなどの分野で最も強いと予想している。\nアナリストらは、単純な技術ボイコットや受け入れではなく、中国の技術導入は分野によって異なるだろうと述べている。\nカウンターポイントのマンダル氏は、中国技術の採用がEV、電池、家庭用電化製品、ロボット工学、ドローン、AIや半導体の一部の分野を含む分野で世界的に拡大し、同氏が言うところの「より細分化されているが実用的な世界的な技術エコシステム」につながると予想している。\nフォク氏は、この変化は電池やエレクトロニクス製造においてすでに構造的なものとなっているが、AIは過渡期にあり、自動車用ソフトウェアはまだ初期段階にあると述べた。",

    "id": "i-got-an-89-refund-how-to-cancel-and-avo-708c402b",
    "title": "I got an £89 refund – how to cancel and  avoid unwanted subscriptions",
    "titleJa": "89 ポンドの払い戻しを受けました – 不要な定期購入をキャンセルして回避する方法",
    "summaryJa": "89 ポンドの払い戻しを受けました – 不要な定期購入をキャンセルして回避する方法- 公開されました",
    "bodyOriginal": "I got an £89 refund – how to cancel and avoid unwanted subscriptions\n- Published\nEver been confused by a random amount leaving your bank then had that sinking feeling it's a subscription you forgot to cancel or didn't mean to sign up to?\nFrom TV streaming, to meal deliveries and beauty boxes there are subscriptions for almost everything.\nOften the first order is free or heavily discounted so you give it a try and tell yourself you'll cancel it before the deadline. But it's easy to forget and sometimes not straightforward.\nFollowing Prime Minister Andy Burnham's crackdown on subscription traps, three people tell us how they got into - and out of theirs.\n1. Set reminders\nSophie Branscombe, 23 from Wirral, says she signed up for a free trial of a photo editor app then saw a payment of £89.99 had gone out of her bank.\n\"It was a free trial, and they did make it clear I was signing up to a subscription, but there was no reminder of when [the free period] would end,\" she says.\nSophie says she wasn't able to get a refund through the firm. Instead she submitted a refund request via Apple \"report a problem\" which refunded everything. The BBC has asked the company for a response.\nSophie's advice to others is to set reminders as soon as you sign up to a subscription for when the free trial ends.\n\"Make it a habit of checking what subscriptions run out and if you also find that you don't like something after signing up to a free trial, cancel straight away,\" she says.\n2. Read the small print\nHussein Zaaiter, 21 from West London was using a free software trial for his university work and says when he tried to cancel he faced several complications.\n\"I tried online chat, email and even the phone at one point as they were constantly charging me,\" he says.\nHe says a payment of £16 left his account, then another of £32 before he froze his card. \"They tried to charge me seven times,\" he says.\nHe contacted his bank to explain the situation in the hope of being reimbursed.\n\"I felt like it was marketed as a free trial that was easy to cancel.\n\"It was difficult to contact them, and the cancellation was near impossible,\" he says.\nHussein's tip for others is to read the terms and conditions and take caution before starting subscriptions. The BBC has contacted the firm for a response.\n3. Don't assume your trial will end\nRosalinda Kwafo-Akoto, 22 from the West Midlands signed up for a one-week free TV trial. After the trial, the subscription would be £9.99 a month.\n\"I remembered before the end of the week that the trial was ending and tried to cancel it so I wouldn't be charged,\" she says.\nShe says she couldn't find the subscription anywhere on her account so assumed that they had automatically ended and removed it.\nAfter a week, she realised that money had been taken out of her account.\nShe says it took her an hour and a half to get through to speak to someone on customer service and locate the subscription. Ros managed to cancel it and was refunded the full amount.\nRos's tip for others is don't assume that a subscription will automatically cancel just because you can't find it on your account.\n\"These companies make it as difficult as possible for you to cancel so make sure you get a confirmation email of your cancellation,\" she says. The BBC has contacted the firm for a response.",
    "bodyJa": "89 ポンドの払い戻しを受けました – 不要な定期購入をキャンセルして回避する方法\n- 公開されました\n銀行から出金されるランダムな金額に混乱し、それがキャンセルするのを忘れていた、またはサインアップするつもりはなかったサブスクリプションであると感じて沈んだことはありませんか?\nテレビストリーミングから食事の配達、ビューティーボックスに至るまで、ほぼあらゆるものを定期購入できます。\n多くの場合、最初の注文は無料または大幅に割引されるため、試してみて期限前にキャンセルするつもりだと自分に言い聞かせます。しかし、それは忘れられやすく、簡単ではないこともあります。\nアンディ・バーナム首相によるサブスクリプションの罠の取り締まりを受けて、3 人がどのようにして罠にはまり、そしてそこから抜け出したのかを語ります。\n1. リマインダーを設定する\nウィラル在住のソフィー・ブランコムさん（23）は、写真編集アプリの無料トライアルに登録したところ、銀行から89.99ポンドの支払いがあったと語った。\n「それは無料トライアルであり、定期購読にサインアップしていることは明らかにされましたが、[無料期間]がいつ終了するかについての通知はありませんでした」と彼女は言います。\nソフィーさんは、会社を通じて返金を受けることができなかったと言う。代わりに、彼女は Apple の「問題を報告」を通じて返金リクエストを提出し、すべてが返金されました。 BBCは同社に回答を求めた。\nソフィーから他の人へのアドバイスは、サブスクリプションにサインアップしたらすぐに、無料トライアルが終了するときのリマインダーを設定することです。\n「定期購入の期限が切れたら、定期購入をチェックする習慣をつけましょう。また、無料トライアルにサインアップした後で気に入らない点が見つかったら、すぐにキャンセルしてください」と彼女は言います。\n2. 小さな文字を読む\n西ロンドン在住のフセイン・ザイターさん（21）は、大学の仕事で無料ソフトウェアのトライアル版を利用していたが、キャンセルしようとした際にいくつかの問題に直面したと語る。\n「常に料金を請求されていたため、オンライン チャット、電子メール、さらには電話を試したこともありました」と彼は言います。\n彼は、カードを凍結する前に、16 ポンドの支払いが口座から消え、その後、さらに 32 ポンドの支払いがあったと述べています。 「彼らは7回も私を起訴しようとした」と彼は言う。\n彼は返金されることを期待して、銀行に連絡して状況を説明しました。\n「簡単にキャンセルできる無料お試しとして宣伝されているように感じました。\n「連絡するのが難しく、キャンセルはほぼ不可能でした」と彼は言う。\nフセイン氏が他の人たちにアドバイスしたのは、サブスクリプションを開始する前に利用規約を読み、注意することです。 BBCは同社に返答を求めた。\n3. トライアルが終了するとは思わないでください\nウェスト・ミッドランズ出身のロザリンダ・クワフォ＝アコトさん（22）は、1週間の無料テレビトライアルに登録した。試用後のサブスクリプションは月額 9.99 ポンドになります。\n「週末になる前に裁判が終了することを思い出し、請求されないように裁判をキャンセルしようとしました」と彼女は言います。\n彼女は、自分のアカウントのどこにもサブスクリプションが見つからなかったため、自動的に終了して削除されたのだと思ったと言いました。\n1週間後、彼女は自分の口座からお金が引き出されていることに気づきました。\n彼女は、カスタマーサービスの担当者と話し、サブスクリプションを見つけるまでに 1 時間半かかったと言います。ロスさんはなんとかキャンセルし、全額返金されました。\nRos が他の人にアドバイスしたのは、自分のアカウントにサブスクリプションが見つからないからといって、サブスクリプションが自動的にキャンセルされるとは思わないことです。\n「これらの会社は可能な限りキャンセルを難しくしているので、必ずキャンセルの確認メールを受け取るようにしてください」と彼女は言います。 BBCは同社に返答を求めた。",

    "id": "i-lost-14-000-in-a-month-investors-hit-7a28ea49",
    "title": "'I lost $14,000 in a month': Investors hit by Korean stock market's wild swings",
    "titleJa": "「1か月で1万4000ドル失った」：韓国株式市場の乱高下に投資家が打撃",
    "summaryJa": "「1か月で1万4000ドル失った」：韓国株式市場の乱高下に投資家が打撃- 公開されました",
    "bodyOriginal": "'I lost $14,000 in a month': Investors hit by Korean stock market's wild swings\n- Published\nBank worker Yongjoon Kim lost 20 million Korean won ($14,000; £10,500) on the South Korean stock market last month.\nKim's money was meant to help buy a home, as he is getting married later this year.\nInstead the value of his tech investments slumped by around 25% in July.\n\"It's going to sting and I'm going to have to work really hard to make up for this,\" Kim says. \"But for others who have taken more risk, they're going to feel the pain.\"\nMany of his friends are worse off, and now in a \"desperate\" situation after \"going all in\" with their savings, he says.\nWhile plenty of investors are piling into technology stocks, sharp market swings mean the bets don't always pay off, with prices often moving on every major headline.\nNowhere is that instability more pronounced than in South Korea's tech-heavy Kospi, widely regarded as the world's most volatile stock index.\nA global frenzy around artificial intelligence has driven wild swings in the value of the country's biggest chipmakers.\nThe Kospi faced \"one of the sharpest corrections\" in its history between June and August, comparable to the drops seen during Covid-19 and the 1997 Asian financial crisis, says Wee Khoon Chong from financial services company BNY.\nThe index more than doubled its value since the start of the year to rise above 9,000 points in mid-June, before plunging to 5,500 within a few weeks. It has now recovered some ground to about 6,800 points.\nA key reason for the sell-off in recent weeks has been concerns over the huge amounts of money being spent on AI, Chong adds.\nThe slump has had a big impact on many of the country's personal investors who bought tech stocks over the past year.\nFor Woongsa Kim, a look at his shares trading app is a painful reminder of what he had made then lost by investing in the South Korean stock market.\nAt the start of the year, he used about half of a bonus from work to buy shares in tech giant SK Hynix.\nThe stock quadrupled in value before most of those gains were wiped out, leaving his investment, now worth about 300 million won, at roughly half the value of its peak.\n\"Thinking about it just brings tears to my eyes,\" Kim told the BBC.\nThe sell-off came after tech shares had soared for months, \"generating the extreme euphoria\" that has moved some personal investors to take out loans to invest, says investment analyst Tobias Reger.\nIt has been most acutely felt by people who used leverage - a form of borrowing in the financial markets.\nLeveraging lets an investor control a larger number of stocks than their own cash would otherwise allow, which delivers a bigger profit if the shares rise.\nHowever, if the stocks fall past an agreed level it can trigger what is known as a margin call - when a broker demands payment of the debt.\nBy the end of July an estimated 1.2 million South Korean personal investor accounts had faced margin calls, equivalent to about one in every 30 working-age adults in the country.\nLeveraged trading is a growing trend among personal investors that has also picked up in markets like Taiwan and the US, says Frank Benzimra, the head of Asia equity strategy at financial services group Societe Generale.\nThat has raised the risks around AI-related stocks, he adds.\n'Gut-wrenching' slump\nAfter his US-listed Nvidia shares soared by more than 1,000%, Chanyong Park, who works in marketing, says he put most of the profits into SK Hynix shares. But that bet went sour as their value has fallen by around $10,000.\n\"This was money I'd invested to save before planning to leave my job around October to start my own business. But now I'm seriously wondering whether I'll have enough.\"\nPark plans to hold on to his SK Hynix shares in hopes of a rebound, although recent swings have made him hesitant to invest more.\n\"It doesn't always feel like movements are driven by rational reasons - sometimes it still feels a lot like gambling,\" he says.\nAnother investor Youngji Park says he went \"all in\", putting the majority of his available cash into Samsung shares that peaked at a total value of 45 million Korean won.\nBut his investment has suffered a \"gut-wrenching\" slump, Park says.\nThe 20-somethings betting big on tech stocks\n- Published20 July\nWould you choose £50,000 over the chance of £1m?\n- Published27 July\nHe too plans to keep hold of his shares in the hope that they will rise again.\n\"I feel like a fool for trusting the Korean stock market,\" he says. \"It's a long-term game now. I'll just have to wait it out.\"\nCollege student Soomin Yi says she pooled money with a friend to invest in SK Hynix after experiencing \"fomo\" (fear of missing out).\nBut she now wishes she had sold her shares in the company when they peaked at three million won each in June, instead of buying into speculation that they would rise to five million won.\n\"We didn't really have anyone around us who is experienced in investing, and we did not study investing seriously before buying the stock,\" Yi says.\nWhat this means for the rest of the world\nThe huge swings in Korean shares are also raising concerns about some other markets around the world.\nTech-heavy indexes like Japan's Nikkei 225 seem to be moving in tandem with the Kospi's wild swings, Societe Generale's Benzimra says.\nBut the majority of the world's stock markets are unlikely to see that level of violent moves as they include a wider mix of companies, he adds.\n\"I don't think we can see the same kind of volatility in large diversified markets such as the [Tokyo Stock Price Index] or the US equity markets,\" Benzimra says.\nAnd traders who diversified their portfolios say it has helped cushion the blow from the stock market rout.\n\"I think this whole episode is a warning to Korean investors, especially young investors, not to put everything in one basket and hope for the best,\" says Yongjoon Kim, who also has shares in overseas markets.\nHe adds that he should have taken a more cautious approach to investing in tech stocks.\nHis fiancée, Gaeon Lee, is optimistic that the market will recover despite losing part of the savings they had set aside for a new home.\nBut she worries about Kim, saying the constant need to monitor their investments has taken a toll on him.\n\"Seeing our home savings take a hit in the stock market was definitely a wake-up call,\" she says.\nAdditional reporting by Sangmi Han, Suhnwook Lee and Yijin Sim",
    "bodyJa": "「1か月で1万4000ドル失った」：韓国株式市場の乱高下に投資家が打撃\n- 公開されました\n銀行員キム・ヨンジュンさんは先月、韓国株式市場で2000万韓国ウォン（1万4000ドル、1万500ポンド）を失った。\nキムさんは今年後半に結婚するため、そのお金は家の購入に充てられる予定だった。\nその代わり、同氏のテクノロジー投資の価値は7月に約25％下落した。\n「ヒリヒリするだろうし、これを補うために本当に一生懸命働かなければならないだろう」とキムは言う。 「しかし、より多くのリスクを負った他の人たちにとっては、痛みを感じることになるでしょう。」\n彼の友人の多くはさらに状況が悪化しており、貯金を「すべて使い果たした」後、現在は「絶望的な」状況にあると彼は言う。\n多くの投資家がハイテク株に群がっている一方で、市場の急激な変動により、賭けが必ずしも報われるわけではなく、主要な見出しごとに価格が変動することがよくあります。\nその不安定さは、世界で最も不安定な株価指数として広くみなされている韓国のハイテク株の多いコスピほど顕著である。\n人工知能をめぐる世界的な熱狂により、国内最大手のチップメーカーの価値が大きく変動している。\n金融サービス会社BNYのウィー・クーン・チョン氏によると、コスピは6月から8月にかけて、新型コロナウイルス感染症や1997年のアジア金融危機の際に見られた下落に匹敵する、株価史上「最も急激な調整の一つ」に直面したという。\n同指数は年初から値を２倍以上に上げ、６月中旬には９０００ポイントを超えたが、数週間以内に５５００ポイントまで下落した。現在は約6,800ポイントまで回復している。\nここ数週間の株価下落の主な理由は、AIに巨額の資金が費やされていることへの懸念だとチョン氏は付け加えた。\nこの不況は、過去１年間ハイテク株を購入した国内の個人投資家の多くに大きな影響を与えた。\nキム・ウンサさんにとって、株式取引アプリを見ると、韓国の株式市場への投資で得たものの、失ったものを痛烈に思い出すことになる。\n今年の初めに、彼は仕事から得たボーナスの約半分を使ってハイテク大手SKハイニックスの株を購入した。\n株式の価値は4倍になり、その利益のほとんどは消失し、現在約3億ウォン相当の彼の投資額はピーク時の価値の約半分になった。\n「思い出すだけで涙があふれてきます」とキムさんはBBCに語った。\n投資アナリストのトビアス・レーガー氏によると、ハイテク株が数カ月にわたって急騰し、「極度の幸福感を生み出し」、一部の個人投資家がローンを組んで投資するようになった後に、この下落が起きたという。\nそれを最も痛感しているのは、金融市場での借り入れの一形態であるレバレッジを利用した人々です。\nレバレッジを活用すると、投資家は自分の現金よりも多くの株をコントロールできるようになり、株が上昇すればより大きな利益が得られます。\nただし、株価が合意されたレベルを超えて下落すると、ブローカーが債務の支払いを要求する、いわゆるマージンコールが発生する可能性があります。\n7月末までに、推定120万の韓国の個人投資家口座が追証に直面しており、これは国内の労働年齢成人の約30人に1人に相当する。\n金融サービスグル​​ープのソシエテ・ジェネラルでアジア株式戦略の責任者を務めるフランク・ベンジムラ氏によると、レバレッジ取引は個人投資家の間で拡大傾向にあり、台湾や米国などの市場でも盛り上がっているという。\nそのためAI関連株をめぐるリスクが高まっている、と同氏は付け加えた。\n「はらわたが張り裂けるような」スランプ\n米国に上場しているエヌビディア株が1,000％以上急騰した後、マーケティング担当のチャンヨン・パーク氏は、利益のほとんどをSKハイニックス株につぎ込んだと語る。しかし、その価値は約10,000ドル下落したため、その賭けは失敗しました。\n「これは、自分のビジネスを始めるために10月頃に仕事を辞める計画を​​立てる前に、私が貯蓄するために投資したお金でした。しかし今、十分なお金があるかどうか真剣に悩んでいます。」\nパク氏は回復を期待してSKハイニックス株を保有し続けるつもりだが、最近の変動により追加投資を躊躇している。\n「運動が必ずしも合理的な理由によって動かされているとは限りません。それでもギャンブルのように感じることがあります」と彼は言います。\n別の投資家ヨンジ・パーク氏は、利用可能な現金の大半をサムスン株に注ぎ込み、最高値で総額4,500万韓国ウォンに達したと「全力を尽くした」と語った。\nしかし、彼の投資は「はらわたが張り裂けるような」不振に見舞われている、とパーク氏は言う。\nハイテク株に大きく賭けている20代\n- 7 月 20 日発行\n100万ポンドのチャンスより5万ポンドを選びますか?\n- 7 月 27 日発行\n同氏も株価が再び上昇することを期待して株式を保有し続けるつもりだ。\n「韓国の株式市場を信頼している自分が愚か者になったような気がする」と彼は言う。 「今は長期戦。それを待つしかない」。\n大学生のスミン・イーさんは、「フォモ」（逃すことへの恐怖）を経験した後、友人とお金を出し合ってSKハイニックスに投資したと話す。\nしかし彼女は今では、株価が500万ウォンに上がるという憶測に乗るのではなく、6月の300万ウォンのピーク時に同社株を売却しておけばよかったと思っているという。\n「私たちの周りには投資経験のある人がほとんどおらず、株を買う前に投資について真剣に勉強しませんでした」とイー氏は言う。\nこれが世界の他の国々にとって何を意味するか\n韓国株の大幅な変動は、世界の他の一部市場でも懸念を引き起こしている。\nソシエテ・ジェネラルのベンジムラ氏は、日本の日経225などハイテク株を中心とした指数はコスピの乱高下と連動して動いているようだと語る。\nしかし、世界の株式市場の大部分には、より幅広い企業が含まれているため、そのレベルの暴力的な動きは見られそうにないと同氏は付け加えた。\n「（東京株価指数）や米国株式市場のような大規模な分散市場では、同じようなボラティリティは見られないと思います」とベンジムラ氏は言う。\nまた、ポートフォリオを多様化したトレーダーらは、それが株式市場の暴落による打撃を和らげるのに役立ったと言っている。\n海外市場でも株式を保有しているキム・ヨンジュン氏は、「このエピソード全体が、韓国の投資家、特に若い投資家に対する警告だと思う。すべてを一つの籠に入れて最良の結果を期待しないように」と語る。\n同氏は、ハイテク株への投資にはもっと慎重なアプローチを取るべきだったと付け加えた。\n彼の婚約者、ガオン・リーさんは、新居のために貯めていた貯蓄の一部を失ったにもかかわらず、市場は回復すると楽観視している。\nしかし、彼女はキム氏のことを心配しており、彼らの投資を常に監視する必要があることがキム氏に大きな負担を与えていると語った。\n「我が家の貯蓄が株式市場で大打撃を受けているのを見て、間違いなく警鐘を鳴らされました」と彼女は言う。\nSangmi Han、Suhnwook Lee、Yijin Sim による追加レポート",

    "id": "openai-loses-revenue-chief-denise-dresse-bfc3090b",
    "title": "OpenAI loses revenue chief Denise Dresser, second major executive departure in days",
    "titleJa": "OpenAI、収益責任者のデニス・ドレッサー氏を失い、ここ数日で2度目となる主要幹部の辞任となる",
    "summaryJa": "OpenAIは木曜日、最高収益責任者のデニス・ドレッサー氏が人工知能研究所に入社してから1年も経たないうちにその職を離れると発表したが、これは大ヒットとなるIPOに向けて準備を進めている企業にとっては驚くべき退職である。同社のリリースによると、ドレッサー氏は「他の機会を追求するため」退職するという。 OpenAIは、サイバーセキュリティ企業Wizの社長兼最高執行責任者（COO）を務めていたダリ・ラジク氏を後任に採用した。",
    "bodyOriginal": "OpenAI said Thursday that Chief Revenue Officer Denise Dresser is leaving her role less than a year after she joined the artificial intelligence lab, a startling exit for a company that's gearing up for what's expected to be a blockbuster IPO.\nThe company said Dresser is leaving \"to pursue other opportunities,\" according to a release. OpenAI has hired Dali Rajic, who previously served as the president and chief operating officer of the cybersecurity company Wiz, to replace her.\n\"The opportunity to work hands-on with the most transformative technology in the world has been nothing short of incredible,\" Dresser wrote in a post on LinkedIn on Thursday. \"I am so proud of what we have accomplished and, even more, of how this team has shown up for our customers and one another.\"\nDresser's departure marks the second senior exit at OpenAI in days. Longtime OpenAI executive Brad Lightcap announced his decision to leave the company on Tuesday, writing in a post on X that he is going to \"start something new.\"\nLightcap had been at OpenAI for eight years and was a longtime friend and colleague of the company's CEO, Sam Altman. Dresser, by contrast, was hired in December after she spent more than a decade as an executive at Salesforce. Her exit poses a particular conundrum for OpenAI, in large part because she brought the company enterprise expertise that it sorely needed to take on its chief rival, Anthropic.\nDresser was also tapped to take over many of Lightcap's responsibilities in April, when OpenAI said Lightcap was transitioning to a new role focused on \"special projects.\"\nIn addition to Lightcap and Dresser, Fidji Simo, who had been OpenAI's product and business chief, announced last month she was stepping down from her role at the company to focus on recovery after a \"severe exacerbation of a chronic illness.\" Three other OpenAI executives left the company in April.\nThe exits come during a crucial moment for OpenAI, as it readies for a potentially massive public market debut. The company confidentially filed its IPO prospectus with the Securities and Exchange Commission in June, just days after Anthropic did the same.\nOpenAI closed a funding round in March at a staggering $852 billion valuation, and it will face pressure to justify that figure to investors ahead of its IPO. The company has been racing to build out its enterprise business and win customers in the fiercely competitive market, which was one of Dresser's main priorities.\nIn January, OpenAI CFO Sarah Friar told CNBC that enterprise customers accounted for roughly 40% of OpenAI's business as of January, but that she expected that figure to grow to closer to 50% by the end of the year. Dresser told CNBC in April that OpenAI's enterprise business was \"on track\" to reach that goal.\nDresser will stay on at OpenAI for a brief period to \"work closely with the business team to support our customers,\" OpenAI said. She wrote in her LinkedIn post that she has been working with OpenAI President Greg Brockman to ensure a \"smooth transition.\"\n\"No one works harder than this team,\" Dresser wrote. \"I'm deeply grateful to every one of you.\"\nWATCH: OpenAI’s Denise Dresser discusses launch of new deployment company",
    "bodyJa": "OpenAIは木曜日、最高収益責任者のデニス・ドレッサー氏が人工知能研究所に入社してから1年も経たないうちにその職を離れると発表したが、これは大ヒットとなるIPOに向けて準備を進めている企業にとっては驚くべき退職である。\n同社のリリースによると、ドレッサー氏は「他の機会を追求するため」退職するという。 OpenAIは、サイバーセキュリティ企業Wizの社長兼最高執行責任者（COO）を務めていたダリ・ラジク氏を後任に採用した。\nドレッサー氏は木曜、LinkedInへの投稿で「世界で最も革新的なテクノロジーを実際に扱う機会は、信じられないほど素晴らしいものであった」と書いた。 「私たちが達成してきたことをとても誇りに思います。そしてそれ以上に、このチームがお客様やお互いのためにどのように貢献してきたかを誇りに思います。」\nドレッサー氏の退職は、ここ数日でOpenAIにおける2人目の上級幹部の退職となる。 OpenAIの幹部を長年務めたブラッド・ライトキャップ氏は火曜日に退社の決定を発表し、Xへの投稿で「何か新しいことを始める」と書いた。\nLightcap 氏は OpenAI に 8 年間勤務しており、同社 CEO の Sam Altman 氏の長年の友人であり同僚でもありました。対照的に、ドレッサー氏は、Salesforce で 10 年以上幹部を務めた後、12 月に採用されました。彼女の退任は、OpenAI にとって特別な難問となっている。その主な理由は、彼女が同社の最大のライバルである Anthropic に対抗するために切実に必要とされていたエンタープライズ専門知識を持ち込んだためである。\nOpenAIがLightcapが「特別プロジェクト」に重点を置いた新しい役割に移行すると発表した際、ドレッサー氏は4月にもLightcapの多くの責任を引き継ぐよう抜擢された。\nライトキャップ氏とドレッサー氏に加え、OpenAIの製品およびビジネス責任者を務めていたフィジ・シモ氏も先月、「慢性疾患の重度の悪化」からの回復に専念するため同社での役職を辞任すると発表した。 OpenAIの他の幹部3人は4月に同社を退職した。\n今回の撤退は、OpenAIにとって、潜在的に大規模な公開市場デビューの準備をしている重要な時期に行われた。同社は、Anthropicが同様のことを行ったわずか数日後の6月に、秘密裏にIPO目論見書を証券取引委員会に提出した。\nOpenAIは3月に8,520億ドルという驚異的な評価額で資金調達ラウンドを終了したが、IPOを前に投資家に対してその数字を正当化するというプレッシャーに直面することになる。同社はエンタープライズ ビジネスを構築し、熾烈な競争市場で顧客を獲得するために競い合ってきましたが、これはドレッサーの主要な優先事項の 1 つでした。\nOpenAIの最高財務責任者サラ・フライアー氏は1月、CNBCに対し、1月時点でOpenAIのビジネスの約40％を企業顧客が占めているが、その数字は年末までに50％近くまで増加すると予想していると語った。ドレッサー氏は4月にCNBCに対し、OpenAIのエンタープライズ事業はその目標達成に向けて「軌道に乗っている」と語った。\nOpenAIによると、ドレッサー氏は「ビジネスチームと緊密に連携して顧客をサポートする」ため、短期間OpenAIに残る予定だという。彼女はLinkedInへの投稿で、「スムーズな移行」を確実にするためにOpenAI社長のグレッグ・ブロックマンと協力していると書いた。\n「このチームほど熱心に働く人はいない」とドレッサー氏は書いた。 「皆さん一人一人に深く感謝しています。」\n注目: OpenAI のデニス・ドレッサー氏が新しい導入会社の立ち上げについて語る",

    "title": "Trade court upholds Trump's closure of 'de minimis' loophole",
    "titleJa": "貿易裁判所、トランプ大統領の「最小限の」抜け穴閉鎖を支持",
    "summaryJa": "連邦貿易裁判所は木曜日、800ドル未満の商品を無税で米国に輸入することを認める「de minimis」免除規定のドナルド・トランプ大統領の撤廃を支持した。関税や他の形態の保護主義の主要な支持者であるトランプ氏は、未徴収の輸入税収入で米国に数十億ドルの損失を与えていると主張する抜け穴の閉鎖が続いていることを称賛した。",
    "bodyOriginal": "A federal trade court on Thursday upheld President Donald Trump's elimination of the \"de minimis\" exemption, which allowed goods valued under $800 to be imported to the U.S. tax free.\nTrump, a major proponent of tariffs and other forms of protectionism, celebrated the continued closure of the loophole, which he claims has cost the U.S. billions of dollars in uncollected import-tax revenue.\nAttorneys for the plaintiff, a Michigan-based auto-parts distributor, did not immediately respond to CNBC's request for comment on the ruling.\nThe company, Detroit Axle, had sued the Trump administration in May 2025, more than three months after Trump signed an executive order rescinding the de minimis exemption.\nThe plaintiff argued that Trump lacked the legal authority to scrap the loophole under the International Emergency Economic Powers Act, or IEEPA.\nTrump had used the same law to try to impose sweeping \"liberation day\" tariffs on nearly every country in the world last year. In February, the Supreme Court struck those duties down on the grounds that IEEPA did not authorize them.\nBut in Thursday's ruling, a three-judge panel on the U.S. Court of International Trade found that the statute does allow Trump to scrap the de minimis exemption.\n\"In reaching this conclusion, we find that the President's power to 'nullify [or] void . . . exercising any . . . privilege' does not run afoul of separation of powers principles,\" they wrote in the order, quoting the law.\nThey concluded that, unlike in key cases challenging Trump's global tariffs, the rescission of the duty-free loophole \"is not an exercise of the power of the purse\" and \"is not an exercise of the power to legislate.\" In striking down his global duties, the Supreme Court said Trump needed congressional approval.\nThe de minimis exemption was heavily exploited in the retail industry, especially by e-commerce giants like Shein and Temu that sell large quantities of low-price clothes and other goods.\nTo take advantage of the exemption, some companies shipped individual packages directly from Chinese manufacturers to American consumers. Larger companies set up warehouses in Canada and Mexico and then sent individual shipments over the border one by one, allowing them to avoid costly tariffs, regardless of where the goods were manufactured.\nEconomists have warned that ending the exemption could disproportionately impact lower-income and minority American consumers who buy inexpensive goods online.\nBut Trump, in a Truth Social post Thursday afternoon, called the trade court's ruling a \"BIG WIN\" on \"one of the most DESPICABLE loopholes in American Trade Policy.\"\nDe minimis \"became a giant loophole for TARIFF Cheats\" and was exploited by criminals shipping drugs and other illegal products into the U.S., Trump wrote.\n\"With the stroke of my mighty pen — NO AUTOPEN!!! — we ended this ridiculous giveaway, and made Foreign Goods play by the rules,\" Trump boasted. \"The Importers sued. Today, THEY LOST.\"\n— CNBC's Gabrielle Fonrouge contributed to this report.",
    "bodyJa": "連邦貿易裁判所は木曜日、800ドル未満の商品を無税で米国に輸入することを認める「de minimis」免除規定のドナルド・トランプ大統領の撤廃を支持した。\n関税や他の形態の保護主義の主要な支持者であるトランプ氏は、未徴収の輸入税収入で米国に数十億ドルの損失を与えていると主張する抜け穴の閉鎖が続いていることを称賛した。\nミシガン州に本拠を置く自動車部品販売会社である原告の弁護士は、判決に関するCNBCのコメント要請にすぐには応じなかった。\n同社のデトロイト・アクスルは、トランプ大統領がミニミス免除を取り消す大統領令に署名してから3カ月以上後の2025年5月にトランプ政権を訴えていた。\n原告は、トランプ大統領には国際緊急経済権限法（IEEPA）に基づく抜け穴を廃止する法的権限がないと主張した。\nトランプ大統領は昨年、同じ法律を利用して世界のほぼすべての国に広範な「解放記念日」関税を課そうとしていた。最高裁判所は2月、IEEPAが認可していないという理由でこれらの義務を無効にした。\nしかし、木曜日の判決で、米国国際貿易裁判所の3人の裁判官からなる合議体は、同法によりトランプ大統領がミニミス免除を廃止することを認めているとの判断を下した。\n「この結論に達するにあたり、『あらゆる特権の行使を無効にする』という大統領の権限は三権分立の原則に抵触しないことが判明した」と彼らは法律を引用しながら命令書の中で述べた。\n彼らは、トランプ大統領の世界的な関税に異議を唱える重要な訴訟とは異なり、免税の抜け穴の撤回は「財布の権力の行使ではない」、「立法権の行使ではない」と結論づけた。最高裁判所は、トランプ氏が国際的な任務を放棄するには議会の承認が必要だと述べた。\nこの最低限度の免除は小売業界、特に低価格の衣料品やその他の商品を大量に販売するSheinやTemuのような電子商取引大手によって大きく活用された。\nこの免除を利用するために、一部の企業は中国の製造業者から米国の消費者に個別のパッケージを直接発送しました。大手企業はカナダとメキシコに倉庫を設置し、個別の荷物を次々と国境を越えて発送することで、商品がどこで製造されたかに関係なく、高額な関税を回避できるようにしている。\nエコノミストらは、免除を終了すると、オンラインで安価な商品を購入する低所得層や少数派の米国消費者に不当な影響を与える可能性があると警告している。\nしかし、トランプ大統領は木曜午後の真実ソーシャルへの投稿で、通商裁判所の判決は「米国の通商政策における最も卑劣な抜け穴の一つ」に対する「大きな勝利」だと述べた。\nデミニミスは「タリフ不正行為の巨大な抜け穴となり」、麻薬やその他の違法製品を米国に輸送する犯罪者によって悪用されたとトランプ大統領は書いた。\n「私の力強いペンの一筆で――自動運転禁止!!!――我々はこのばかばかしい景品を終わらせ、外国製品にルールを守らせた」とトランプ大統領は自慢した。 「輸入業者は訴訟を起こしました。今日、輸入業者は敗訴しました。」\n— CNBC のガブリエル・フォンルージュがこのレポートに寄稿しました。",

    "title": "Workday skyrockets 19% before trading halted on report of Silver Lake takeover",
    "titleJa": "ワークデイはシルバーレイク買収報道で取引停止前に19％急騰",
    "summaryJa": "プライベートエクイティ会社シルバーレイクが人事ソフトウェアメーカーの買収交渉を行っているとの報道を受け、ワークデイ株は19％超急騰した。株価は午後遅くの取引で一時停止され、ロイターの報道を受けて同社の時価総額は最後に５００億ドルを超えた。",
    "bodyOriginal": "Workday shares popped more than 19% on a report that private equity firm Silver Lake is in talks to buy the human resources software maker.\nShares were briefly halted in late afternoon trading and the company's market value last topped more than $50 billion following the report from Reuters.\nThe discussions, citing sources familiar with the matter, have been ongoing in recent months, according to Reuters.\nWorkday and Silver Lake did not immediately respond to CNBC's request for comment.\nSoftware companies like Workday have come under immense pressure in recent months on mounting concerns that artificial intelligence tools will upend their business models. The stock is down about 3% this year and 7% from a year ago.\nIn March, co-founder Aneel Bhusri was renamed CEO after Carl Eschenbach stepped down. Bhusri has held various leadership roles at the company, including a stint as CEO and co-CEO.\n\"Aneel Bhusri, the CEO, and Egon [Durban] from Silver Lake know each other well through many connections. So we we think certainly this could make sense, and I think this goes back to how badly hit software's been,\" analyst Brent Thill told CNBC's \"Power Lunch.\"\nIn May, the company posted better-than-expected results and upped it forecast on AI tailwinds.",
    "bodyJa": "プライベートエクイティ会社シルバーレイクが人事ソフトウェアメーカーの買収交渉を行っているとの報道を受け、ワークデイ株は19％超急騰した。\n株価は午後遅くの取引で一時停止され、ロイターの報道を受けて同社の時価総額は最後に５００億ドルを超えた。\nロイター通信によると、この問題に詳しい関係者の話として、この協議はここ数カ月続いているという。\nワークデイとシルバーレイクはCNBCのコメント要請にすぐには応じなかった。\nワークデイのようなソフトウェア企業はここ数カ月、人工知能ツールが自社のビジネスモデルを一変させるのではないかとの懸念が高まり、多大なプレッシャーにさらされている。株価は今年約３％下落し、前年比では７％下落した。\nカール・エッシェンバッハ氏の辞任を受け、3月に共同創設者のアニール・ブースリ氏がCEOに改名された。ブスリ氏は、CEO および共同 CEO を含む、同社でさまざまな指導的役割を果たしてきました。\n「CEOのアニール・ブスリ氏とシルバーレイクのエゴン氏（ダーバン氏）は、多くの人脈を通じてお互いをよく知っている。したがって、これは確かに理にかなっていると我々は考えている。そして、これはソフトウェアがどれほどひどい打撃を受けているかに遡ると思う」とアナリストのブレント・ティル氏はCNBCの「パワーランチ」で語った。\n同社は5月に予想を上回る業績を発表し、AIの追い風を受けて予想を上方修正した。",

    "title": "Anthropic CFO Krishna Rao is leading early IPO meetings with investors and has not discussed valuation, sources say",
    "titleJa": "Anthropic CFOのクリシュナ・ラオ氏は投資家とのIPO初期ミーティングを主導しており、バリュエーションについては議論していないと情報筋は言う。",
    "summaryJa": "Anthropic CFO の Krishna Rao 氏が初期の投資家会議を主導しており、Claude AI モデルや管理などの大きなテーマに焦点を当てています。",
    "bodyOriginal": "Anthropic's early meetings with prospective investors ahead of its potentially historic initial public offering have been high level and have not included discussions about specific financials or a valuation, sources told CNBC's David Faber.\nThe artificial intelligence company confidentially filed its prospectus with the Securities and Exchange Commission in June, setting the stage for its highly anticipated public markets debut. The company has not disclosed an official timeline for when it plans to go public, but it has been holding preliminary meetings to test the waters with some investors in recent weeks.\nAnthropic CFO Krishna Rao is leading the meetings, the people said.\nIn those meetings, Anthropic has discussed big-picture topics like its family of Claude AI models, how the company developed its popular coding assistant Claude Code, its position in the enterprise market, its management and the number of releases it has executed, the people said.\nA representative for Anthropic did not immediately respond to CNBC's request for comment.\nAnthropic was founded in 2021 by a group of researchers and executives who defected from OpenAI, now the company's chief rival. In late May, Anthropic closed a funding round at a $965 billion valuation, topping OpenAI, which was valued at $852 billion in late March.\nThe company is best known for its cutting-edge Claude models, and it's found success selling its technology to large enterprises — a fiercely competitive market for AI developers. Anthropic said in May that its run-rate revenue crossed $47 billion, up from the roughly $10 billion in revenue that it generated in all of 2025.\nBecause of its anticipated run rate, some Anthropic investors expect that the company could seek a valuation of $2 trillion or more, according to two sources familiar with the matter. But that number is based on their own analyses and is not a figure that is coming from Anthropic, the sources said.\nThe Financial Times was first to report that investors were floating the $2 trillion expectation.\nOpenAI is also gearing up for a potentially massive IPO. The company confidentially filed its prospectus with regulators shortly after Anthropic did, but as of late June, it had not held pre-IPO meetings or outlined an official timeline for the listing, as CNBC previously reported.\nElon Musk's SpaceX, which acquired his AI startup xAI earlier this year, made a record-breaking debut on the Nasdaq in June. The stock has had a volatile first two months of trading, and is off roughly 38% from its intraday high.\n— CNBC's Kate Rooney contributed to this report.",
    "bodyJa": "歴史的な可能性のある新規株式公開に先立つアンスロピックの将来の投資家との初期の会合はハイレベルなものであり、特定の財務内容や評価額に関する議論は含まれていなかったと関係者がCNBCのデービッド・フェイバーに語った。\nこの人工知能企業は 6 月に証券取引委員会に目論見書を極秘に提出し、待望の公開市場デビューの準備を整えました。同社は上場計画の正式なスケジュールを明らかにしていないが、ここ数週間、一部の投資家とテストのための事前会合を開催している。\n関係者によると、人類最高財務責任者（CFO）のクリシュナ・ラオ氏が会議を主導しているという。\nこれらの会議で、Anthropic は、同社の Claude AI モデル ファミリ、人気のコーディング アシスタントである Claude Code の開発方法、エンタープライズ市場における同社の地位、その管理、実行したリリースの数などの大きな話題について話し合ったと関係者は述べています。\nAnthropicの代表者はCNBCのコメント要請にすぐには応じなかった。\nAnthropic は、現在同社の最大のライバルである OpenAI から離反した研究者と幹部のグループによって 2021 年に設立されました。 5月下旬、Anthropicは9,650億ドルの評価額で資金調達ラウンドを完了し、3月下旬に8,520億ドルと評価されたOpenAIを上回った。\n同社は最先端のクロード モデルで最もよく知られており、AI 開発者にとって競争の激しい市場である大企業へのテクノロジーの販売で成功を収めています。アンスロピックは5月、ランレート収益が470億ドルを超え、2025年全体で生み出した約100億ドルの収益を上回ったと発表した。\n関係筋２人によると、アンスロピック社の投資家の一部は、ランレートが予想されるため、同社の評価額が２兆ドル以上になる可能性があると予想している。しかし、この数字は独自の分析に基づいたものであり、Anthropic が発表した数字ではない、と情報筋は述べた。\n投資家が2兆ドルの予想を変動させていることを最初に報じたのはフィナンシャル・タイムズだった。\nOpenAI はまた、潜在的に大規模な IPO に向けて準備を進めています。同社は、アンスロピックが提出した直後に規制当局に目論見書を極秘に提出したが、CNBCが以前報じたように、6月下旬の時点でIPO前の会合を開催しておらず、上場に向けた公式スケジュールの概要も説明していなかった。\nイーロン・マスク氏のスペースXは今年初めに同氏のAIスタートアップxAIを買収し、6月にナスダック市場で記録的なデビューを果たした。同社株は最初の２カ月間の取引が不安定で、日中の高値から約３８％値を下げている。\n— CNBC の Kate Rooney がこのレポートに寄稿しました。",

    "title": "Cisco shares slide 9% despite earnings beat and stronger-than-expected guidance",
    "titleJa": "シスコ株は利益を上回り、予想を上回るガイダンスにもかかわらず9％下落",
    "summaryJa": "シスコの株価は木曜日、ネットワーキング機器ベンダーの予想を上回る収益報告と強力なガイダンスがウォール街に印象を与えることができなかったため、9％下落した。ＬＳＥＧによると、同社は今四半期の売上高が１８０億─１８２億ドルになる見通しで、平均予想の１６８億ドルを上回るとの見通しを示した。会計年度第 4 四半期の収益は 18% 増加して 17 ドルとなりました。アナリストは168億ドルを見込んでいたが、30億ドルだった。",
    "bodyOriginal": "Cisco shares dropped 9% on Thursday, as the networking equipment vendor's better-than-expected earnings report and strong guidance failed to impress Wall Street.\nThe company said revenue in the current quarter will be between $18 billion and $18.2 billion, topping the $16.8 billion average estimate, according to LSEG. Revenue in the fiscal fourth quarter increased 18% to $17. 3 billion, while analysts were looking for $16.8 billion.\nAnalysts at Piper Sandler wrote, in a note after the report, that Cisco showed good numbers for the quarter, but their guidance \"looks conservative given the current demand environment.\" Some investors \"may start to nitpick that we're seeing peak growth,\" wrote the analysts, who recommend holding the stock.\nHeading into earnings, Cisco shares were up more than 60% for the year, as the company finally started to show that it was benefitting from the artificial intelligence boom. Even though the forecast for this year is solid, with Cisco projecting revenue growth of about 15%, analysts see sales growth dipping next fiscal year back into the single digits.\nStill, Cisco CEO Chuck Robbins focused on the across-the-board beat.\n\"We had a record year, we had a record quarter,\" Robbins told CNBC's Jim Cramer on Thursday. After issuing guidance that was better than analysts expected, they said, \"Why are you being so conservative,\" Robbins added.\n\"We're starting a new fiscal year. We're operating in incredible markets,\" Robbins said. \"But it's also a time that we're going to start the year being a little bit prudent.\"\nAnalysts at KeyBanc Capital Markets remain bullish on the stock, with the equivalent of a buy rating. In a note after the report, they wrote that Cisco will likely see market share gains with the hyperscalers increasing their capital expenditures and with so-called neoclouds and others ramping their spending.\nHyperscalers, or the internet giants driving much of the AI spend, placed $4 billion of infrastructure orders in the quarter, bringing the total for the fiscal year to $9.3 billion, Cisco said. That group accounted for about $4 billion of revenue in the past fiscal year, with Cisco expecting that number to almost double in fiscal 2027 to $7.5 billion.\nThe stock was trading at around $113 as of mid-day Thursday. Its record closing high was $130 in June.\nWATCH: Cisco beats on Q4 results",
    "bodyJa": "シスコの株価は木曜日、ネットワーキング機器ベンダーの予想を上回る収益報告と強力なガイダンスがウォール街に印象を与えることができなかったため、9％下落した。\nＬＳＥＧによると、同社は今四半期の売上高が１８０億─１８２億ドルになる見通しで、平均予想の１６８億ドルを上回るとの見通しを示した。会計年度第 4 四半期の収益は 18% 増加して 17 ドルとなりました。アナリストは168億ドルを見込んでいたが、30億ドルだった。\nパイパー・サンドラーのアナリストらは、レポート後のメモで、シスコは同四半期に良好な数字を示したが、同社のガイダンスは「現在の需要環境を考慮すると保守的に見える」と述べた。アナリストらは、一部の投資家は「成長のピークに達しているとうるさく言い始めるかもしれない」と述べ、株式の保有を推奨している。\n決算に向けて、同社が人工知能ブームの恩恵を受けていることをようやく示し始めたため、シスコの株価は年間で60％以上上昇した。今年の予測は堅調であり、シスコは約 15% の売上成長を予測していますが、アナリストは来会計年度の売上成長が 1 桁に戻ると見ています。\nそれでも、Cisco CEO のチャック・ロビンス氏は、全体的なビートに焦点を当てました。\n「記録的な年、記録的な四半期を過ごした」とロビンス氏は木曜日、CNBCのジム・クレイマーに語った。アナリストの予想よりも良いガイダンスを発表した後、彼らは「なぜそんなに保守的なのか」とロビンズ氏は付け加えた。\nロビンズ氏は「われわれは新会計年度をスタートする。われわれは信じられないほどの市場で事業を展開している」と語った。 「しかし、今年は少し慎重にスタートする時期でもあります。」\nキーバンク・キャピタル・マーケッツのアナリストらは依然として同株に対して強気の見方を示しており、買いに相当する評価となっている。レポート後のメモの中で、彼らは、ハイパースケーラーが設備投資を増やし、いわゆるネオクラウドなどの投資が増加することで、シスコは市場シェアを獲得する可能性が高いと書いている。\nシスコによると、ハイパースケーラー、つまりAI支出の多くを推進しているインターネット大手は、同四半期に40億ドルのインフラストラクチャを発注し、会計年度の総額は93億ドルになったとシスコは述べた。同グループは前会計年度の収益のうち約40億ドルを占めており、シスコはその数字が2027年度にはほぼ倍増の75億ドルになると予想している。\n木曜日正午の時点で、株価は約113ドルで取引されていた。終値の最高値は6月の130ドルだった。\n注目: シスコが第 4 四半期の結果で勝利",

    "titleJa": "なぜ9月が株式市場にとって一年で最悪の月なのか",

  {
    "id": "big-short-investor-steve-eisman-sees-an-0b889511",
    "title": "'Big Short' investor Steve Eisman sees an Achilles' heel in the AI boom",
    "titleJa": "「ビッグ・ショート」投資家スティーブ・アイスマン氏、AIブームのアキレス腱を見ている",
    "summaryJa": "スティーブ・アイスマン氏は、人工知能ブームはOpenAIとAnthropicというたった2社の運命にますます依存するようになっていると警告している。世界金融危機に先立って住宅市場に賭けたことで最もよく知られる同投資家は、AI新興企業2社がマイクロソフト、アマゾン、アルファベット傘下のグーグル、オラクルのAI関連収益のおよそ70％、そしてクラウド収益の25％から35％を占めていると述べた。",
    "bodyOriginal": "Steve Eisman is warning that the artificial intelligence boom has become increasingly dependent on the fortunes of just two companies: OpenAI and Anthropic.\nThe investor, best known for his bet against the housing market ahead of the global financial crisis, said the two AI startups account for roughly 70% of AI-related revenue at Microsoft, Amazon, Alphabet's Google and Oracle — and as much as 25% to 35% of their cloud revenue.\n\"The futures of these massive companies, in a sense, are a bet that OpenAI, Anthropic are going to succeed,\" Eisman said late Tuesday on CNBC's \"Fast Money.\"\n\"The Real Eisman Playbook\" podcast host and former Neuberger Berman senior portfolio manager believes that the biggest revenue threat could come from China, as Chinese open-source AI models are significantly cheaper and appear to be gaining market share.\n\"The Achilles' heel of this whole story ... is if something bad happens to Anthropic and OpenAI ... the Chinese open-end models, open-weight models are much cheaper. And if they start really taking a lot of market share and it sounds like, from what I'm hearing, that they're starting to, you could have a big price war. And then we have a problem,\" he said\nEisman's warning adds another prominent voice to a growing debate over whether the extraordinary spending behind the AI boom can generate sufficient returns.\nMichael Burry, another investor whose wager against the housing bubble was chronicled in \"The Big Short,\" has taken an even more bearish view. Burry has questioned whether much of current and future AI demand ultimately comes from end customers, arguing instead that a significant portion is financed through what he has described as circular arrangements.\nBurry is putting his money where his mouth is, placing bearish bets against some of the biggest beneficiaries of the AI boom, including Nvidia, and others that are positioned against the broader semiconductor sector.",
    "bodyJa": "スティーブ・アイスマン氏は、人工知能ブームはOpenAIとAnthropicというたった2社の運命にますます依存するようになっていると警告している。\n世界金融危機に先立って住宅市場に賭けたことで最もよく知られる同投資家は、AI新興企業2社がマイクロソフト、アマゾン、アルファベット傘下のグーグル、オラクルのAI関連収益のおよそ70％、そしてクラウド収益の25％から35％を占めていると述べた。\n「これら大企業の将来は、ある意味、OpenAIとAnthropicが成功するかどうかの賭けだ」とアイスマン氏は火曜日遅く、CNBCの「ファストマネー」で語った。\nポッドキャスト「ザ・リアル・アイスマン・プレイブック」の司会者で元ニューバーガー・バーマンのシニア・ポートフォリオ・マネージャーである同氏は、中国のオープンソースAIモデルの方が大幅に安価で市場シェアを獲得しているように見えるため、収益の最大の脅威は中国から来る可能性があると考えている。\n「この話全体のアキレス腱は…AnthropicとOpenAIに何か悪いことが起こった場合…中国のオープンエンドモデル、オープンウェイトモデルの方がはるかに安い。そしてもし彼らが実際に多くの市場シェアを奪い始め、私の聞いた話によるとそうなり始めているように思えたら、大規模な価格競争が起こる可能性がある。そして、我々には問題がある」と同氏は語った。\nアイスマン氏の警告は、AIブームの背後にある異常な支出が十分な利益を生み出すことができるかどうかをめぐる議論の高まりに、新たな注目すべき声を加えている。\n住宅バブルに対する賭けが『ザ・ビッグ・ショート』で記録された別の投資家マイケル・バリー氏は、さらに弱気な見方をしている。 Burry氏は、現在および将来のAI需要の多くが最終的に最終顧客から来るのかどうか疑問を呈し、その代わりにかなりの部分が循環型取り決めと表現したものを通じて資金提供されていると主張した。\nバーリー氏は、AIブームの最大の受益者であるエヌビディアや、より広範な半導体セクターに敵対する立場にある他の企業に対して弱気の賭けをしており、口では言い分を述べている。",

  {
    "id": "harvey-nichols-bought-by-sports-direct-o-e1d6cbad",
    "title": "Harvey Nichols bought by Sports Direct owner",
    "titleJa": "ハーベイ・ニコルズがスポーツ・ダイレクトのオーナーに買収される",
    "summaryJa": "ハーベイ・ニコルズがスポーツ・ダイレクトのオーナーに買収される- 公開されました",
    "bodyOriginal": "Harvey Nichols bought by Sports Direct owner\n- Published\nLuxury department store Harvey Nichols has been bought by the owners of Sports Direct, which warned a \"significant restructuring\" will be needed to ensure the 200-year-old business remains sustainable.\nMike Ashley's Frasers Group will take control of the Harvey Nichols stores, including its flagship in Knightsbridge, as well as the international franchise.\nThe department store was immortalised in BBC sitcom Absolutely Fabulous, but had faced challenges in recent years. The firm had appointed administrators in June.\nMichael Murray, Frasers' chief executive and Ashley's son-in-law, called the store a \"British institution with significant potential\" but added \"clear meaningful change is needed\".\n\"The turnaround will require tough choices and we are prepared to make those decisions, even if that means a smaller business in the near term, to create a stronger and more sustainable Harvey Nichols for the long-term,\" he said.\nHarvey Nichols carries more than 800 premium and luxury brands and has over 1,000 employees. Its other stores are located in Manchester, Birmingham, Bristol, Leeds and Edinburgh.\nFrasers Group will also acquire the online business, and stores will continue to operate under their existing licensing.\nEarlier this week, Harvey Nichols warned in its latest accounts that it would need to \"cease trading\" within a year if it failed to secure new investment.\nIt had faced \"sustained trading and operational challenges\" recently and Frasers Group said it will need to conduct a review of the store's portfolio, structure and cost base.\nA recent auction for the store saw Frasers battle retail rival Next to take control of the firm.\nDubbed \"Harvey Nicks\" by Edina and Patsy from Absolutely Fabulous, the two often found an excuse to nip into the department store for a spot of shopping and a long liquid lunch in the heyday of the 1990s.\nHarvey Nichols chief executive Julia Goddard said the deal marked \"an important milestone\" for the company and \"provides a strong platform for the next phase of the business's evolution\".\n\"Over the past year, we have made significant progress in repositioning this iconic business, investing in our flagship store, broadening our customer proposition, and strengthening the brand DNA,\" she added.\n'Secures jobs'\nLindsay Hallam, senior managing director of administrator FTI Consulting, who advised Frasers Group on the sale, said she was \"pleased to have secured a buyer, providing continuity for Harvey Nichols and enabling it to move forward under new ownership\".\n\"We are particularly pleased the transaction secures more than 1,000 jobs and provides a strong platform for its next chapter.\n\"Our focus was to find a solution that protected the underlying value of the business, securing a future for a 200-year-old retailer, and delivering the best possible outcome for stakeholders\".\nHarvey Nichols's restaurant in the Oxo Tower, London is being sold off separately and is not included in the deal.\nFrasers Group owns several high street retail chains and luxury fashion brands including Sports Direct, Flannels, Jack Wills and House of Fraser.",
    "bodyJa": "ハーベイ・ニコルズがスポーツ・ダイレクトのオーナーに買収される\n- 公開されました\n高級デパートのハーベイ・ニコルズはスポーツ・ダイレクトのオーナーらに買収され、スポーツ・ダイレクトは200年の歴史を持つビジネスを持続可能にするには「大規模なリストラ」が必要になると警告した。\nマイク・アシュリー氏率いるフレイザーズ・グループは、ナイツブリッジの旗艦店を含むハーベイ・ニコルズの店舗と国際フランチャイズの経営権を握ることになる。\nこのデパートは BBC のコメディ番組「Absolutely Fabulous」で不滅の名声を博しましたが、近年は課題に直面していました。同社は6月に管理者を任命していた。\nフレイザーズの最高経営責任者でアシュリーさんの義理の息子であるマイケル・マレー氏は、同店を「大きな可能性を秘めた英国の施設」と呼びながらも、「明らかに有意義な変化が必要だ」と付け加えた。\n同氏は、「再建には厳しい選択が必要であり、長期的により強力で持続可能なハーベイ・ニコルズを構築するために、たとえそれが短期的には事業の縮小を意味するとしても、そうした決断を下す用意がある」と述べた。\nハーベイ ニコルズは 800 以上の高級ブランドを取り扱い、1,000 人以上の従業員を抱えています。他の店舗はマンチェスター、バーミンガム、ブリストル、リーズ、エディンバラにあります。\nフレイザーズ・グループはオンライン事業も買収し、店舗は既存のライセンスに基づいて営業を継続する。\nハーベイ・ニコルズ氏は今週初め、最新の決算で、新たな投資を確保できなければ1年以内に「取引を停止」する必要があると警告した。\n同社は最近「取引と運営の継続的な課題」に直面しており、フレイザーズ・グループは同店のポートフォリオ、構造、コストベースの見直しを行う必要があると述べた。\n同店の最近のオークションでは、フレイザーズが小売業のライバルであるネクストと経営権を争う形となった。\n『Absolutely Fabulous』のエディナとパッツィーから「ハーベイ・ニックス」と呼ばれた2人は、1990年代の全盛期にはショッピングスポットや長い液体ランチを求めてデパートに立ち寄る口実をよく見つけていた。\nハーベイ・ニコルズの最高経営責任者ジュリア・ゴダード氏は、今回の契約は同社にとって「重要なマイルストーン」であり、「ビジネスの進化の次の段階に向けた強力な基盤を提供する」と述べた。\n「この1年間、私たちはこの象徴的なビジネスの位置付けを変更し、旗艦店に投資し、顧客への提案を拡大し、ブランドDNAを強化するという点で大きな進歩を遂げました」と彼女は付け加えた。\n「雇用を確保する」\nフレイザーズ・グループに売却について助言した管理会社FTIコンサルティングのシニア・マネージング・ディレクター、リンジー・ハラム氏は、「ハーベイ・ニコルズに継続性をもたらし、新たな所有権のもとで前進できるよう買い手を確保できたことをうれしく思う」と語った。\n「この取引により1,000人以上の雇用が確保され、次の章への強力な基盤が提供されたことを特に嬉しく思います。\n「私たちが焦点を当てたのは、ビジネスの根本的な価値を保護し、創業 200 年の小売業者の将来を確保し、ステークホルダーに可能な限り最高の結果をもたらすソリューションを見つけることでした。」\nロンドンのオクソタワーにあるハーベイ・ニコルズ氏のレストランは個別に売却されており、今回の契約には含まれていない。\nフレイザーズ グループは、スポーツ ダイレクト、フランネルズ、ジャック ウィルズ、ハウス オブ フレイザーなど、いくつかのハイストリート小売チェーンと高級ファッション ブランドを所有しています。",
    "source": "BBC",
    "sourceUrl": "https://www.bbc.co.uk/news/articles/cd69p89gl6xo?at_medium=RSS&at_campaign=rss",
    "publishedAt": "2026-08-13T13:32:40+00:00",
    "category": "マクロ経済",
    "imageUrl": "https://ichef.bbci.co.uk/ace/standard/240/cpsprodpb/a892/live/8a5b37d0-9714-11f1-bb91-6bb44c42ed47.jpg",
    "readTime": 4

  {
    "id": "wholesale-prices-were-flat-in-july-below-9db53d0a",
    "title": "Wholesale prices were flat in July, below expectations for 0.2% increase",
    "titleJa": "7月の卸売物価は横ばいで、予想の0.2％上昇を下回った。",
    "summaryJa": "労働統計局が木曜日に発表した製品とサービスの卸売コストは7月に横ばいであり、インフレの最新の明るい兆候となった。基調的なインフレ圧力の指標である生産者物価指数は、ダウ・ジョーンズのコンセンサス予想の0.2％を下回り、6月に0.1％下落した後、今月は変わらずだった。 ６月の数字は前回発表の０．３％減から修正された。",
    "bodyOriginal": "Wholesale costs for goods and services were flat in July, the Bureau of Labor Statistics reported Thursday in the latest positive sign for inflation.\nThe producer price index, a measure of underlying inflation pressures, was unchanged for the month, below the 0.2% Dow Jones consensus estimate and after falling 0.1% in June. The June figure was revised from a previously reported decline of 0.3%.\nExcluding food and energy, the core PPI rose 0.2%, against the forecast for a 0.3% gain. The core PPI excluding trade services increased 0.4%.\nOn an annual basis, the headline PPI increased 4.7% for the all-items index and 4.2% for core, according to unadjusted figures.\nThe report follows several other indicators telling a similar story – that after a ramp-up in inflation earlier this year fueled by the Iran war and President Donald Trump's tariffs, the rate of price increases is beginning to ease.\nStock market futures were positive after the report while Treasury yields were lower. Traders further reduced the odds for a September rate hike from the Federal Reserve.\n\"Net, net, pipeline pressures at the lower stages of production are not adding to the inflation risks the consumer faces,\" said Chris Rupkey, chief economist at Fwdbonds. \"It counts as good news that for a second consecutive month, PPI final demand prices have not gone up adding to the cost of living crisis faced by Americans.\"\nServices prices rose 0.2% for the month, pushed by a 6.5% surge in portfolio management, a category that can show outsized gains in the first month of the quarter due to reporting requirements.\nGoods prices fell 0.7%, helped by a 3.1% decrease in energy, including a 5.7% slide in the gasoline index. Food prices fell 0.9% though core goods prices rose 0.1%.\nFederal Reserve officials have been weighing the various inputs to the price picture as several key officials have been pushing for interest rate hikes to get inflation back to the central bank's 2% target.\nOn Wednesday, the BLS reported that the consumer price index rose just 0.1% in July as falling energy prices during the month helped lower price pressures. However, the headline annual inflation rate of 3.4% was still well above the Fed's goal.\nCore consumer inflation was considerably tamer, posting a 0.2% monthly gain and 2.5% annual rate that put the level back to where it was prior to the start of the war.\nMarket expectations have switched in recent days, with traders now pricing in a rate hike in October or December after putting heavy odds that the Federal Open Market Committee would move at its next meeting on Sept. 15-16.\nIn other economic news Thursday, initial jobless claims rose to a seasonally adjusted 209,000 for the week ended Aug. 8, up 9,000 from the prior period and above the 204,000 estimate.",
    "bodyJa": "労働統計局が木曜日に発表した製品とサービスの卸売コストは7月に横ばいであり、インフレの最新の明るい兆候となった。\n基調的なインフレ圧力の指標である生産者物価指数は、ダウ・ジョーンズのコンセンサス予想の0.2％を下回り、6月に0.1％下落した後、今月は変わらずだった。 ６月の数字は前回発表の０．３％減から修正された。\n食品とエネルギーを除くコアＰＰＩは予想の０．３％上昇に対し０．２％上昇した。貿易サービスを除くコアＰＰＩは０．４％上昇した。\n未調整の数値によると、年間ベースで総合PPIは全項目指数で4.7%上昇、コア指数で4.2%上昇した。\nこの報告書は、イラン戦争とドナルド・トランプ大統領の関税によって今年初めにインフレが加速した後、物価上昇率が緩和し始めているという同様の内容を伝える他のいくつかの指標を踏襲している。\n報道後、株式市場先物相場は上昇したが、米国債利回りは低下した。トレーダーらは米連邦準備理事会（ＦＲＢ）が９月に利上げを行う可能性をさらに引き下げた。\nフォワードボンズの首席エコノミスト、クリス・ラプキー氏は「生産の下位段階におけるパイプラインの正味の圧力は、消費者が直面するインフレリスクを増大させていない」と述べた。 「２カ月連続でＰＰＩ最終需要価格が上昇せず、米国人が直面する生活費危機をさらに悪化させていないことは朗報とみられる。」\nサービス価格は同月で0.2％上昇したが、これはポートフォリオ管理の6.5％上昇に押され、ポートフォリオ管理は報告義務により四半期初月に大幅な上昇を示す可能性があるカテゴリーだった。\n商品価格は０．７％下落したが、これはガソリン指数の５．７％下落を含むエネルギーの３．１％下落に支えられた。コア財価格は０．１％上昇したものの、食品価格は０．９％下落した。\nインフレ率を中銀の目標である２％に戻すために複数の主要当局者が利上げを推進している中、連邦準備理事会当局者らは物価情勢へのさまざまな要因を検討している。\n水曜日、BLSは、同月のエネルギー価格下落が物価圧力の低下に寄与したため、7月の消費者物価指数はわずか0.1％上昇したと報告した。しかし、主要な年間インフレ率である3.4%は依然としてFRBの目標を大きく上回っていた。\nコア消費者インフレは大幅に抑制され、月間上昇率 0.2%、年率 2.5% を記録し、戦争開始前の水準に戻りました。\n市場の予想はここ数日で切り替わっており、トレーダーらは連邦公開市場委員会が９月１５─１６日の次回会合で政策を決定する可能性が高いとの見方を示し、現在は１０月か１２月の利上げを織り込んでいる。\n木曜日の他の経済ニュースでは、8月8日までの週の新規失業保険申請件数は季節調整済みで20万9,000件に増加し、前期比9,000件増加し、予想の20万4,000件を上回った。",

    "id": "water-bills-set-to-rise-for-many-after-f-bb05ff4d",
    "title": "Water bills set to rise for many after firms permitted extra funding",
    "titleJa": "企業が追加資金を許可したことで、多くの人にとって水道料金が値上がりする見通し",
    "summaryJa": "企業が追加資金を許可したことで、多くの人にとって水道料金が値上がりする見通し- 公開されました",
    "bodyOriginal": "Water bills set to rise for many after firms permitted extra funding\n- Published\nWater companies have been given the green light to increase bills for customers by an extra £3.4bn in coming years to meet increased pressures on infrastructure and the environment.\nNearly a third of the extra funding provisionally approved for 13 water companies in England and Wales is earmarked for making sure water services are maintained.\nSome of the rest will be used to meet rising demand from housebuilding and data centres and to address pollutants known as \"forever chemicals\".\nPrime Minister Andy Burnham said the proposal was \"real money out of family budgets at a time when they are struggling with the cost of living\", and an environmental group described the decision as \"an insult\".\nCustomers of five water companies - Severn Trent Water, Southern Water, Thames Water, Wessex Water, and South East Water - are facing additional bill rises over the next two years, on top of increases that were already announced in 2024.\nThe new increases will vary between firms.\nSouthern, for example, will charge £43 extra next year, while South Eastern will only charge £1 more in 2029. The increases will only come into effect if they are given final approval later this year.\nThe other eight water firms identified - Anglian Water, Dwr Cymru Welsh Water, Hafren Dyfrdwy, Northumbrian Water, Wouth West Water, United Utiliites, Yorkshire Water, SES Water - would recover their additional spending through customer bills after 2030.\nMany consumers are angry at being asked to pay anything more against a backdrop of interruptions to supply sometimes lasting for days, and rivers, lakes and beaches too polluted to use safely.\nBut water companies argue that these problems can only be solved by boosting spending to replace pipes, build treatment plants and establish new reservoirs.\n'Deliver or face clawback'\nThe regulator, Ofwat, said the extra spending would enable the firms to support growth and better environmental outcomes, and ensure important upgrades were not delayed.\n\"We will track performance to ensure companies are delivering the expected improvements for customers and the environment,\" said Helen Campbell, executive director for delivery at Ofwat.\n\"If they don't, expenditure can be clawed back.\"\nWater companies need approval from the regulator, Ofwat, to raise customers' bills, a process that takes place every five years to set spending budgets for the years ahead.\nThis decision to allow increased charges comes on top of already-agreed bill rises that were negotiated with the water companies in 2024.\nThe process allows firms to apply for additional funds for projects that were not known about at the time of the last review.\nAs part of the outlined increase, Ofwat has approved funding for schemes including provision for new data centres in Manchester, additional wastewater capacity in Newquay and to bring forward work by Wessex Water to tackle PFAS pollutants, originally planned for 2030-35.\nHowever, the decision is provisional. There is a period of public consultation, with a final decision due in December.\n'No blank cheque'\nOfwat said water companies had submitted a total of £4.3bn worth of requests, but some of their proposed extra spending had been rejected.\nBurnham said he understood why people were angry as they had been asked to pay more for years while pollution incidents and leaks continued.\n\"Where water companies seek to pass unnecessary costs onto households, they will be challenged,\" he said.\nAmy Fairman, from campaign group River Action, said: \"Ofwat waving through yet more water bill hikes is an insult.\"\nWater companies had failed to make sufficient investment over the last 30 years, she said, leaving customers with \"leaks, pollution and soaring bills\".\nThere should be greater public control of water companies, she added. \"No more blank cheques for failure.\"\nRelated topics\n- Published19 hours ago\n- Published2 days ago\n- Published31 July",
    "bodyJa": "企業が追加資金を許可したことで、多くの人にとって水道料金が値上がりする見通し\n- 公開されました\n水道会社には、インフラや環境への圧力の高まりに対応するため、今後数年間で顧客への請求額をさらに34億ポンド増やす許可が与えられている。\nイングランドとウェールズの水道会社 13 社に対して暫定的に承認された追加資金の 3 分の 1 近くは、水道サービスの維持に充てられています。\n残りの一部は、住宅建設やデータセンターからの需要の高まりに対応し、「永遠の化学物質」として知られる汚染物質に対処するために使用される。\nアンディ・バーナム首相は、この提案は「生活費に困っているときに家計から実際にお金を出した」ものだと述べ、環境保護団体はこの決定を「侮辱」だと評した。\nセバーン・トレント・ウォーター、サザン・ウォーター、テムズ・ウォーター、ウェセックス・ウォーター、サウス・イースト・ウォーターの5つの水道会社の顧客は、2024年にすでに発表されている料金値上げに加え、今後2年間でさらなる料金値上げに直面している。\n新たな増加額は企業によって異なります。\n例えば、サザン航空は来年43ポンドの追加料金を請求するが、サウスイースタン航空は2029年に1ポンドの追加料金のみを請求する予定である。値上げは、今年後半に最終承認が得られた場合にのみ有効となる。\n特定された他の8つの水道会社（Anglian Water、Dwr Cymru Welsh Water、Hafren Dyfrdwy、Northumbrian Water、Wouth West Water、United Utiliites、Yorkshire Water、SES Water）は、2030年以降に追加支出を顧客請求を通じて回収する予定だ。\n多くの消費者は、供給の中断が時には数日間続くことや、川、湖、海岸が汚染されすぎて安全に使用できないことを背景に、これ以上の支払いを求められることに憤慨している。\nしかし、水道会社は、これらの問題は、パイプの交換、処理施設の建設、新しい貯水池の設置のための支出を増やすことによってのみ解決できると主張している。\n「成功するか、クローバックに直面するか」\n規制当局のオフワット氏は、追加支出により企業は成長と環境改善を支援し、重要なアップグレードが遅れないようにすることができると述べた。\nオフワット社の提供担当エグゼクティブディレクター、ヘレン・キャンベル氏は、「企業が顧客と環境に期待される改善を確実に提供できるよう、業績を追跡していく」と述べた。\n「そうでなければ、支出が巻き戻される可能性がある。」\n水道会社が顧客の請求額を引き上げるには規制当局のオフワットの承認が必要だが、このプロセスは今後数年間の支出予算を設定するために5年ごとに行われる。\n料金の値上げを許可するこの決定は、2024年に水道会社と交渉され、すでに合意された料金の値上げに加えて行われる。\nこのプロセスにより、企業は前回の審査時点では知られていなかったプロジェクトに対して追加資金を申請できるようになる。\n計画された増額の一環として、オフワットは、マンチェスターの新しいデータセンターの提供、ニューキーの下水処理能力の追加、当初2030年から35年に予定されていたPFAS汚染物質に取り組むウェセックス・ウォーターの取り組みの前倒しなどの計画への資金提供を承認した。\nただし、この決定は暫定的なものです。公開協議の期間があり、12月に最終決定が下される予定だ。\n「白紙小切手は不可」\nオフワット氏は、水道会社が総額43億ポンド相当の申請を提出したが、追加支出案の一部は拒否されたと述べた。\nバーナム氏は、汚染事件や漏洩が続く中、何年にもわたって追加料金の支払いを求められてきたため、人々が怒っている理由が理解できたと述べた。\n「水道会社が不必要なコストを家庭に転嫁しようとする場合、彼らは異議を唱えられるだろう」と同氏は述べた。\n選挙運動団体「リバー・アクション」のエイミー・フェアマン氏は「さらなる水道料金値上げに手を振っているのは侮辱だ」と述べた。\n同氏によると、水道会社は過去30年間、十分な投資を怠っており、顧客は「漏水、汚染、料金の高騰」を抱えているという。\n水道会社に対する公的管理を強化すべきだと彼女は付け加えた。 「失敗に対する空のチェックはもう必要ありません。」\n関連トピック\n- 19 時間前に公開\n- 2 日前に公開\n- 7 月 31 日公開",

    "title": "Trump-linked oil venture delays Greenland drilling plans after government warning",
    "titleJa": "トランプ大統領関連の石油ベンチャー、政府警告を受けてグリーンランド掘削計画を延期",
    "summaryJa": "ドナルド・トランプ大統領とつながりのあるテキサスに本拠を置く企業は、許可なく機器を陸上に持ち込んだとして北極圏の島政府が合弁パートナーに対し「強い警告」を発したことを受け、グリーンランドでの石油掘削計画を延期した。ナスダック上場の石油・ガス探査会社グリーンランド・エナジー・カンパニーは水曜日、現在2027年冬を目標とした許可スケジュールに向けて取り組んでおり、グリーンランド東海岸のジェイムソン・ランド盆地の炭化水素の可能性を解き放つ計画を遅らせていると発表した。",
    "bodyOriginal": "A Texas-based company with links to President Donald Trump has delayed plans to drill for oil in Greenland, after the Arctic island's government issued a \"strong warning\" to its joint venture partner for bringing equipment ashore without permission.\nGreenland Energy Company, a Nasdaq-listed oil and gas exploration firm, said Wednesday that it was now working toward a targeted permit timeline for winter 2027, delaying its plans to try to unlock the hydrocarbon potential of the Jameson Land Basin on Greenland's east coast.\nLondon-listed 80 Mile, the joint venture partner of Greenland Energy for the project, also confirmed the delay to drilling plans following talks with Greenlandic authorities.\n\"Operating in the Arctic requires patience, flexibility and a long-term perspective. We will use this time to refine our plans and deepen relationships with local communities, strategic partners and relevant authorities,\" Greenland Energy Company CEO Robert Price said in a statement.\n80 Mile holds the licenses and runs the permitting through its wholly owned subsidiary, White Flame Energy. The exploration licenses were granted before Greenland stopped issuing new licenses in 2021, citing the worsening climate crisis.\nThe project delay comes two weeks after Greenland's government issued a sharp rebuke to White Flame Energy for failing to get permission from local authorities to bring drilling equipment to the island's east coast.\nGreenland Energy Company and 80 Mile both confirmed to CNBC that the companies received a formal warning from Greenland's government.\nGreenland's government issues a warning\nThe notice from Greenland's government to 80 Mile concerned the landing of drilling equipment near the strategically important Nerlerit Inaat airport, a transport hub regarded as the gateway to northeast Greenland.\nAhead of the landing of equipment, Greenland Energy and 80 Mile said they had permission from and entered into a contract to lease storage space within an existing Greenland Airports storage area near the port but were unaware that this arrangement required a separate permit from the mineral resources authority.\nGreenland's government said late last month that White Flame Energy did not have the necessary approvals before initiating this operation.\nGreenland Energy and 80 Mile said in a joint statement that they \"take the warning very seriously and note it in full.\" They added that they intend to \"work closely\" with Greenlandic authorities going forward.\n80 Mile holds three licences for exploration and possible exploitation of oil in the Jameson Land Basin. Greenland Energy is funding the costs associated with managing two exploration wells.\nShares of Greenland Energy closed more than 44% lower on Wednesday, while 80 Mile shares were down over 20%.\nGreenland Energy and the Trump administration\nThe push to explore the oil potential of the Jameson Land Basin comes as Trump has renewed his push to acquire Greenland.\nGreenland Energy has links to several people and businesses associated with the Trump administration.\nBoard member Carol Craig founded a defense-tech company involved in a Pentagon contracting program supporting Trump's Golden Dome missile-defense initiative.\nRead more\nThe company also has a documentary deal with Envoy Media, founded by \"Dr. Phil\" McGraw, who spoke at a Trump rally in 2024 and serves on the president's Religious Liberty Commission.\nLarry Swets, an entrepreneur and the chairman of Greenland Energy, has been reported to be close to the Trump administration. According to the Guardian, Price was asked during a meeting on the Jameson Land Basin in June whether Swets had links to Trump and replied: \"Not that I know of.\"\nJameson Land Basin oil potential\nGreenland Energy, which was formed through a SPAC merger in March, says its primary mission is to unlock the frontier oil potential of the Jameson Land Basin, a roughly 2-million-acre onshore licensed area.\nIt describes the area as one of, if not the last, highly prospective yet completely undrilled basins in the world, with clear genetic links to the North Sea and a scale comparable to many of the world's major producing regions.\nLewis Lawrence, senior research analyst of Europe upstream at Wood Mackenzie, said there is clearly potential associated with the area, noting the geology appears to be genetically similar to the mid-Norwegian shelf, \"which obviously is one of the hotbeds of oil and gas activity.\"\nBut past attempts to drill in promising spots in Greenland have failed, he added.\n\"There has been exploration in Greenland in the past [and] that's all been unsuccessful. So, 21 wells, most of them offshore, and they have all been unsuccessful wells. There's been hundreds of millions of dollars wasted, particularly on offshore drilling, which is significantly more expensive,\" Lawrence told CNBC in a phone interview.\n\"So, companies have had a look. They've come, they've drilled, they've not found anything and they've left.\"\nLawrence also said there would be logistical challenges on the basin, which he called one of the most remote drilling sites in the world.",
    "bodyJa": "ドナルド・トランプ大統領とつながりのあるテキサスに本拠を置く企業は、許可なく機器を陸上に持ち込んだとして北極圏の島政府が合弁パートナーに対し「強い警告」を発したことを受け、グリーンランドでの石油掘削計画を延期した。\nナスダック上場の石油・ガス探査会社グリーンランド・エナジー・カンパニーは水曜日、現在2027年冬を目標とした許可スケジュールに向けて取り組んでおり、グリーンランド東海岸のジェイムソン・ランド盆地の炭化水素の可能性を解き放つ計画を遅らせていると発表した。\n同プロジェクトのグリーンランド・エナジーの合弁パートナーであるロンドン上場の80マイルも、グリーンランド当局との協議を受けて掘削計画の遅れを認めた。\nグリーンランド・エナジー・カンパニーのロバート・プライス最高経営責任者（CEO）は声明で、「北極での活動には忍耐、柔軟性、長期的な視点が必要だ。われわれはこの時間を利用して計画を磨き、地元社会、戦略的パートナー、関係当局との関係を深めていく」と述べた。\n80 Mile はライセンスを保有し、その完全子会社である White Flame Energy を通じて許可を運営しています。この探査ライセンスは、グリーンランドが気候危機の悪化を理由に2021年に新規ライセンスの発行を停止する前に付与された。\nこのプロジェクトの遅延は、グリーンランド政府がホワイト・フレーム・エナジー社に対し、掘削設備を島の東海岸に持ち込む許可を地元当局から得ていなかったとして厳しく叱責してから２週間後に生じた。\nグリーンランド・エナジー・カンパニーと80マイルはいずれもCNBCに対し、両社がグリーンランド政府から正式な警告を受けていたことを認めた。\nグリーンランド政府が警告を発令\nグリーンランド政府から80マイルへの通知は、グリーンランド北東部への玄関口とされる輸送拠点である戦略的に重要なネルレリット・イナート空港付近への掘削設備の着陸に関するものであった。\n機器の着陸に先立ち、グリーンランド・エナジーと80マイルは、港近くのグリーンランド空港の既存の保管エリア内の保管スペースをリースする許可を得て契約を締結したが、この取り決めには鉱物資源局からの別の許可が必要であることは知らなかったと述べた。\nグリーンランド政府は先月末、ホワイト・フレーム・エナジーがこの事業を開始する前に必要な承認を取得していないと発表した。\nグリーンランド・エナジーと80マイルは共同声明で「警告を非常に真剣に受け止め、全面的に留意する」と述べた。彼らは、今後グリーンランド当局と「緊密に協力する」つもりだと付け加えた。\n80 マイルは、ジェイムソン陸盆地における石油の探査と開発の可能性について 3 つのライセンスを保有しています。 Greenland Energy は、2 つの探査井の管理に関連する費用に資金を提供しています。\n水曜日のグリーンランド・エナジー株は44％以上下落して取引を終え、80マイル株は20％以上下落した。\nグリーンランド・エネルギーとトランプ政権\nトランプ大統領がグリーンランド獲得への取り組みを再開したことを受けて、ジェイムソン陸盆地の石油の可能性を探る取り組みが始まった。\nグリーンランド・エナジーは、トランプ政権に関連する複数の人物や企業とつながりがある。\n取締役のキャロル・クレイグ氏は、トランプ大統領のゴールデン・ドームミサイル防衛構想を支援する国防総省の契約プログラムに関与する防衛テクノロジー企業を設立した。\n続きを読む\n同社はまた、2024年のトランプ集会で講演し、大統領の信教の自由委員会の委員を務める「ドクター・フィル」・マグロウ氏が設立したエンボイ・メディアとドキュメンタリー契約を結んでいる。\n起業家でグリーンランド・エナジー会長のラリー・スウェッツ氏はトランプ政権に近いと報じられている。ガーディアン紙によると、プライス氏は6月にジェームソン・ランド盆地で行われた会合で、スウィッツとトランプ氏の関係があるのか​​と問われ、「私が知っていることはない」と答えたという。\nジェイムソン土地盆地の石油ポテンシャル\n3月にSPACとの合併により設立されたグリーンランド・エナジーは、その主な使命は、約200万エーカーの陸上認可地域であるジェイムソン・ランド・ベーシンのフロンティア石油の可能性を解き放つことであると述べている。\n同報告書では、この地域は、北海との明らかな遺伝的つながりがあり、世界の主要産地の多くに匹敵する規模を持つ、世界で最後ではないにしても、非常に将来性の高い、しかし完全に未掘削の盆地の1つであると説明されています。\nウッド・マッケンジー社の欧州上流部門上級研究アナリスト、ルイス・ローレンス氏は、この地域には明らかに潜在的な可能性があると述べ、地質はノルウェー中部棚と遺伝的に類似しているようで、「明らかに石油・ガス活動の温床の一つである」と指摘した。\nしかし、グリーンランドの有望な場所で掘削を試みた過去の試みは失敗に終わったと同氏は付け加えた。\nローレンス氏はCNBCの電話インタビューで、「グリーンランドでは過去にも探査が行われたが、すべて失敗に終わった。つまり、21本の井戸があり、そのほとんどが沖合にあったが、すべて失敗した井戸だった。特に海洋掘削では数億ドルが無駄になっているが、これははるかに高価だ」とローレンス氏はCNBCの電話インタビューで語った。\n「そこで、企業は調査を行ったが、来て掘削したが、何も見つからず撤退した。」\nローレンス氏はまた、世界で最も辺鄙な掘削現場の一つである盆地では物流上の問題が生じるだろうと述べた。",

    "id": "flock-boss-admits-surveillance-firm-took-6867cfd1",
    "title": "Flock boss admits surveillance firm took too long to act over police abuse",
    "titleJa": "フロックのボス、監視会社が警察の虐待に対する対応に時間がかかりすぎたと認める",
