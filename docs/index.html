    "summaryJa": "President Donald Trump demanded the Federal Reserve slash interest rates to 1% \"or less,\" hours after the central bank announced its first rate hike since 2023.",
    "bodyOriginal": "President Donald Trump on Wednesday demanded the Federal Reserve slash interest rates to 1% \"or less,\" hours after the central bank announced its first rate hike since 2023.\n\"We are 'carrying' almost every country in the World, and that cannot go on any longer,\" Trump wrote in a Truth Social post.\n\"LOWER THE INTEREST RATES FOR THE UNITED STATES OF AMERICA, AND FAST!\" he wrote.\nThe Fed, led by Trump-picked Chairman Kevin Warsh, earlier Wednesday afternoon raised benchmark interest rates a quarter percentage point, to a target range of 3.75%-4%.\nThe decision, by the 12-member Federal Open Market Committee, was unanimous.\n\"Inflation remains elevated,\" the committee said in a statement following its latest meeting.\nBut Trump, who has relentlessly pressured the Fed to drastically lower borrowing costs, insisted in his Truth post that rates in the U.S. \"should be 1%, or less, because we are the Best Credit in the World — BY FAR.\"\n\"Our Country is BOOMING with new Investment!\" wrote Trump, who has repeatedly claimed that the U.S. has raked in as much as $20 trillion or more during his second term. Fact-checkers say Trump's figures are false.\n\"If we stopped Trading with every country that we have a Deficit with, which is most of them, we would make, at least, 1.5 Trillion Dollars a year,\" Trump claimed in Wednesday's post.\nLess than two weeks earlier, Trump threatened that if the Fed doesn't cut rates, he will cut off trade with countries that have trade surpluses with the U.S. That group includes most of the U.S.'s top trading partners, along with dozens of other countries.\nThis is breaking news. Please refresh for updates.",

    "titleJa": "House votes to hold Leon Black in contempt of Congress over Epstein subpoenas defiance",
    "summaryJa": "Billionaire Leon Black is suing the House Committee on Oversight and Government Reform seeking to block subpoenas it issued him in its probe of Jeffrey Epstein.",
    "bodyOriginal": "The House of Representatives voted Wednesday to hold billionaire Leon Black in contempt of Congress for his refusal to comply with subpoenas issued to him related to a committee's ongoing investigation of the notorious late sex offender Jeffrey Epstein.\nThe vote by unanimous consent sets the stage for House Speaker Mike Johnson, R-La., to certify the matter to refer Black's conduct to the Department of Justice for possible criminal prosecution.\nIt came a day after the House Committee on Oversight and Government Reform, in a 41-0 vote, passed a resolution recommending the full House hold the former Apollo Global Management CEO in contempt.\nIt is not clear whether the DOJ ultimately will prosecute Black.\nDefendants convicted of contempt of Congress face a possible sentence of not less than one month and not more than 12 months in prison.\nA DOJ spokesperson, in a statement to MS NOW, said, \"The Department of Justice is expecting to receive the referral from [the] House Oversight Committee and takes allegations of contempt of Congress seriously.\"\n\"For the past 18 months, the Department has repeatedly said it will follow additional investigative leads in all matters relating to Jeffrey Epstein,\" the spokesperson said. \"The US Attorney's Office for the District of Columbia will review the referral of Mr. Black carefully and will not hesitate to pursue additional cases where the evidence supports.\"\nThe contempt action stems from Black's failure to appear for a transcribed deposition by the committee on Sept. 3 after it issued him a subpoena for that appearance, and his failure to comply fully with a separate subpoena seeking copies of nondisclosure agreements he has been party to.\nBlack gave the committee one of the NDAs, which his lawyers said was the \"only\" one that Epstein knew about, but withheld others.\n\"No one is above the law,\" House Oversight Chairman Rep. James Comer, R-Ky., said in a statement.\n\"Leon Black defied two subpoenas, and the U.S. House of Representatives acted swiftly to find him in contempt of Congress,\" Comer said. \"We will continue to seek transparency for the American people and justice for survivors in our investigation of the federal government's handling of the Jeffrey Epstein and Ghislaine Maxwell criminal cases.\"\nRep. Robert Garcia of California, the ranking Democrat on the House oversight panel, said, \"This vote is an important step towards justice and accountability.\"\n\"We will continue to center the survivors in our fight to hold those responsible for these horrific crimes,\" Garcia said. \"We are just getting started.\"\nBlack's attorneys blasted the House for its contempt holding, calling it \"an outrageous action that ignores the facts and the truth about Mr. Black.\"\n\"The House of Representatives has rushed through every stage of this inquiry. First, the Committee on Oversight and Government Reform and Chairman Comer rushed to issue him subpoenas,\" the lawyers, Susan Estrich and Aaron Cutler, said in a statement.\n\"Then, the Committee rushed to hold him in contempt, even in the face of active litigation and an ethics complaint. Now, the full House is holding him in contempt without any regard to the active litigation challenging the lawfulness of the Committee's actions and the ethics complaint against Chairman [James] Comer.\n\"Mr. Black is a private citizen who has helped create hundreds of thousands of jobs, has given away more than $700 million in philanthropic and charitable contributions, and has supported research that has been at the vanguard of cancer treatment,\" the attorneys said. \"To think, he is being held in contempt over invalid subpoenas is ridiculous. It is so out of line that the behavior of this Committee is reminiscent of the 1950's where another Congressional Committee abused its investigative authority and destroyed people's lives.\"\nBlack sued the committee and Comer on Sept. 3, seeking to block those subpoenas. That lawsuit is pending in U.S. District Court in Washington.\n\"The subpoenas are invalid to the extent they exceed [the committee's] delegated authority in seeking private information that bears no legitimate connection to [its] legislative purpose,\" the suit says.\nThe civil complaint says the subpoenas issued by the panel \"would also expose women who value their privacy, who have no known or public connection to Epstein, who bargained for confidentiality and have refused to release it, and who have no ability to protect themselves and their privacy before the Committee.\"\nIn their statement Wednesday, Black's lawyers said: \"Our lawsuit shows the Committee and Chairman Comer abused their Congressional power and broke the law.\"\nThey also said that they believe a confidential ethics complaint they filed against Comer \"will further show that Chairman Comer violated the rules of the House.\"\nBlack has not been charged with any wrongdoing in connection with his dealings with Epstein, who killed himself in 2019 after being charged with child sex trafficking.\nBut he stepped down as Apollo's CEO in March 2021, two months after the firm disclosed that Black had paid Epstein $158 million for tax and estate planning advice from 2012 through 2017.\nBlack, who has said Epstein's advice led to significant savings for him, knew at the time that Epstein had pleaded guilty in Florida state court in 2008 to two prostitution-related charges, among them soliciting prostitution from an underage girl.\n\"Mr. Black has repeatedly said that he feels terrible for Epstein's victims and that he regrets ever doing business with Epstein,\" Black's lawyers said Wednesday.\n\"He never abused a woman. He never was with an underage woman. He never engaged in sex trafficking. He never paid Epstein for access to women. He was never blackmailed by Epstein. Mr. Black had no knowledge of any of Epstein's heinous conduct. He never forced any woman to sign any NDA.\"",

    "id": "trump-s-kennedy-center-closure-is-unlawf-1bc57353",
    "title": "Trump's Kennedy Center closure is 'unlawful,' Rep. Beatty tells judge in emergency hearing request",
    "titleJa": "Trump's Kennedy Center closure is 'unlawful,' Rep. Beatty tells judge in emergency hearing request",
    "summaryJa": "President Donald Trump says renovations at the Kennedy Center will not occur until the courts allow his name to be restored on the performing arts center.",
    "bodyOriginal": "Rep. Joyce Beatty asked a judge Wednesday to hold an emergency hearing on what the Ohio Democrat called the \"unlawful\" closure of the Kennedy Center by President Donald Trump and the performing arts facility's board of trustees.\nBeatty's motion says the closure is in \"apparent violation\" of a prior order from Judge Christopher Cooper in U.S. District Court in Washington.\nCooper later Wednesday ordered Trump and the board to respond to Beatty's request by Thursday morning.\n\"The Court will schedule a prompt hearing if necessary after reviewing the response,\" Cooper said in his order.\nBeatty's request came a day after the board, of which she is an ex officio member, voted to close the Kennedy Center for renovations. Trump later Tuesday said it would close \"immediately.\"\nTrump also said planned renovations and reconstruction of the Washington center would not begin until a federal appeals court or the Supreme Court rules that his name can be included in the facility's official name.\nA staff member for a law firm representing Beatty visited the center Wednesday morning and was barred from entering, according to the congresswoman's motion. The staffer \"was informed by several security staff members that the building is currently closed to the public,\" the motion said.\n\"In addition, the staff member was informed that construction is beginning on the interior of the building and that the public is completely barred from accessing the facility for 'safety reasons,'\" the filing said.\n\"Closing the Kennedy Center without Judge Cooper's approval appears to directly violate his order. This is an assault on the rule of law,\" Beatty's lawyers, Norm Eisen and Nathaniel Zelinsky, said in a statement.\n\"The board cannot simply ignore Judge Cooper's rulings whenever it suits them. In this country, no one — including the president — is above the law,\" the attorneys said.\nThe lawyers pointed to a May ruling by Cooper in which he ordered that Trump's name be removed from the center and which enjoined the board from shuttering the center \"until the Board approves any closure consistent with\" Cooper's ruling \"and the Court issues a further Order dissolving or modifying this preliminary injunction.\"\nThe Kennedy Center's board, which Trump named himself to head, voted in December to rename the center, which honors the late President John F. Kennedy. The facility then became known as the Trump Kennedy Center, though Congress never formally changed its name.\nBeatty filed a lawsuit in December seeking to reverse the board's action. Cooper ordered in May that Trump's name be stripped off.\n\"Congress gave the Kennedy Center its name, and only Congress can change it,\" Cooper wrote in his ruling.\nThe Department of Justice, which represents Trump and the board in the case, did not immediately respond to a request for comment.\nThe DOJ is appealing a decision by Cooper issued on Tuesday that barred the board from adding Trump's name back to the building and naming the grounds of the center after him.\nThe board in an Aug. 13 resolution said it intended \"to recognize and honor President Trump's future existential and unprecedented contributions to the survival of the Center.\"\nThe board planned to inscribe the words \"renovated and restored by President Donald J. Trump\" underneath the words that currently say, \"The John F. Kennedy Memorial Center for the Performing Arts.\"\nThe board also said it would name the center's physical grounds \"The President Donald J. Trump Plaza.\"\nCooper, in his order Tuesday, said, \"Simply put, Defendants cannot install memorials for President Trump or anyone or anything else at the Kennedy Center without Congress's blessing.\"\n\"\"The board resolution bucks a federal court order and a statute Congress enacted,\" the judge said.",

    "id": "jeff-gundlach-says-the-fed-should-have-h-d5d7823d",
    "title": "Jeff Gundlach says the Fed should have hiked rates by more to fight rising inflation",
    "titleJa": "Jeff Gundlach says the Fed should have hiked rates by more to fight rising inflation",
    "summaryJa": "The Fed should have hiked rates by half percentage point rather than a quarter, the investor told CNBC.",
    "bodyOriginal": "The Federal Reserve should have hiked rates by more on Wednesday instead of a just a quarter point, according to Jeff Gundlach, founder of DoubleLine.\n\"I would have called that stun and done,\" Gundlach said Wednesday on CNBC's \"Closing Bell,\" a play on the term \"one and done\" referring to the belief by some that the Fed may only do one or two hikes instead of embarking on a tightening cycle.\nGundlach, one of the most prominent bond investors, said a half-point hike would have provided the market with a \"truing up\" to the Fed funds rates.\nThe 2-year Treasury rate was more than 100 basis points above the Fed funds rate, according to Gundlach. The yield on the 2-year U.S. Treasury, which tracks short-term Fed interest rate expectations, climbed around 7 basis points in Wednesday afternoon trading.\nGundlach said he worries that the inflation problem facing the U.S. may not be \"fully respected.\"\n\"I would have just done the 50 and then see what the data does,\" Gundlach said.\nTo be sure, Gundlach said he has previously advocated for larger rate hikes than the Fed has implemented. He said the 2-year Treasury \"leads\" the Fed, a hypothesis that the investor said was proven correct on Wednesday.\nGundlach said he wasn't surprised to see stocks take a leg down during Federal Reserve Chairman Kevin Warsh's post-decision press conference. The Dow Jones Industrial Average fell 700 points in late afternoon trading, with losses accelerating during and in the aftermath of Warsh's gathering.\n\"I thought the content was pretty thin,\" Gundlach said of Warsh's press conference, later adding that the central bank chief was \"opaque.\"\nGundlach also said he didn't approve of Warsh's push to bring task forces in to evaluate several key aspects on the Fed's operation.\n\"It's like a company that's having trouble that wants to hire consultants,\" Gundlach said. \"The consultants always want to figure out what the … people at the company really want to hear, and then they tell them what they want to hear.\"",

    "title": "Boeing CEO: 737 Max production taking 'a little bit longer' to stabilize than expected",
    "titleJa": "Boeing CEO: 737 Max production taking 'a little bit longer' to stabilize than expected",
    "summaryJa": "Boeing CEO Kelly Ortberg said wing production at its Renton, Washington, factory is a hold up, adding the company has plans to address it.",
    "bodyOriginal": "Boeing's 737 Max production is taking \"a little bit longer\" than expected to stabilize, and the company expects to increase its output of the planes next year, CEO Kelly Ortberg told investors Wednesday.\nBoeing stock extended its losses for the day and was down more than 5% in afternoon trading after Ortberg's comments.\nThe manufacturer has been working to steadily ramp up the output of its best-selling plane after years of safety and quality crises. Ortberg said wing production at its Renton, Washington, factory is a constraint now, adding the company has plans in place to address it.\nBoeing is producing about 47 of the aircraft per month.\nOrtberg reiterated to investors at a Morgan Stanley industry conference that he expects certification of the Max 10, the largest model in the family \"very soon.\" That plane is years behind schedule.\nKelly didn't say that he expected aircraft orders from China when President Donald Trump is scheduled to host Chinese leader Xi Jinping at the White House on Sept. 24.\nOrders from China are \"going to be announced by the airlines at their pace,\" he said.",

    "id": "pentagon-cto-says-u-s-government-shouldn-37712a0e",
    "title": "Pentagon CTO says U.S. government shouldn't take stakes in tech giants, questions adding AI rules",
    "titleJa": "Pentagon CTO says U.S. government shouldn't take stakes in tech giants, questions adding AI rules",
    "summaryJa": "President Donald Trump has angrily pushed back on the calls from industry and lawmakers for an AI slowdown or greater regulation.",
    "bodyOriginal": "The top Pentagon technology official said Wednesday the Trump administration shouldn't seek to nationalize or take partial government stakes in artificial intelligence companies.\n\"I hope not,\" Emil Michael, Department of Defense chief technology officer, told CNBC's \"Squawk on the Street\" when asked about that prospect of partial government ownership, which has emerged amid growing concerns about rapid AI advancement.\nDespite its frequent warnings about the dangers of big-government socialism, President Donald Trump's second administration has taken stakes in a growing portfolio of private-sector companies, including a 10% stake in Intel and a \"golden share\" in U.S. Steel, now a subsidiary of Nippon Steel.\nBut when it comes to AI, Michael told CNBC, \"We don't want government to get in the middle.\"\n\"That doesn't really go well in terms of nationalization,\" he said, noting that U.S. AI leaders are among the \"biggest companies in the history of the world.\"\nMichael also repeatedly signaled opposition to ramping up government regulatory oversight of those companies, even as AI leaders such as Anthropic CEO Dario Amodei have warned the industry should slow its fast-improving models to mitigate risks.\n\"This is the the sort of tension you get between people who want to pre-regulate like Europe, and those who want to hold companies responsible for good products being developed that are aligned and safe, not releasing them until they have those dimensions in them,\" he said.\nHe acknowledged that the recent example of the AI hack of Hugging Face is \"concerning,\" but added, \"I don't know what kind of regulation would stop that from happening.\"\nAt the same time, he said it would be \"dangerous\" to place all trust in the hands of a few AI chiefs.\n\"I think we're going to make sure that all the laws are enforced,\" Michael said, noting there are already \"a ton of laws on the book from the Federal Trade Commission.\"\nTrump, whose administration strongly supports the rapid growth of AI and data centers in an effort to box out China, has angrily pushed back on the calls for an AI slowdown or greater regulation.\nThe president accused those raising alarms of pushing a \"hoax\" and a \"scam.\"\nMichael agreed with Trump and other administration officials that there is a \"coordinated campaign to scare people to make irrational decisions that benefit some of these incumbents\" in AI.\nMichael suggested that those developing new tech could voluntarily \"just stop some of these things until they figure it out.\"\n\"The promoters of some of these extinction, death-cult-like philosophies are part of that effort,\" he said.",

ration strongly supports the rapid growth of AI and data centers in an effort to box out China, has angrily pushed back on the calls for an AI slowdown or greater regulation.\nThe president accused those raising alarms of pushing a \"hoax\" and a \"scam.\"\nMichael agreed with Trump and other administration officials that there is a \"coordinated campaign to scare people to make irrational decisions that benefit some of these incumbents\" in AI.\nMichael suggested that those developing new tech could voluntarily \"just stop some of these things until they figure it out.\"\n\"The promoters of some of these extinction, death-cult-like philosophies are part of that effort,\" he said.",

    "title": "House set to pass sweeping Russia sanctions bill honoring Lindsey Graham",
    "titleJa": "House set to pass sweeping Russia sanctions bill honoring Lindsey Graham",
    "summaryJa": "The Lindsey Graham Russia sanctions bill is on a path to become law after the House votes in favor.",
    "bodyOriginal": "The U.S. House is expected to pass a Russia sanctions bill introduced over a year ago by the late Sen. Lindsey Graham, R-S.C., on Wednesday afternoon, sending it to President Donald Trump's desk.\nThe bill, titled the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026, would target Russia's economy, intending to penalize the country over its continued full-scale invasion of Ukraine. I\nThe legislation would allow Trump to impose tariffs up to 100% on countries including China and India, that are within the top five purchasers of Russian crude oil or gas. Money from oil sales is critical to funding Russia's war effort. It would also put sanctions on Russian leaders, officials and financial institutions and expand sanctions on Iran.\nSenators voted overwhelmingly in favor of the bill last month and passed it by a vote of 86-11 with strong bipartisan support. However, opponents of the bill say it gives Trump too much tariff authority.\nReps. Gregory Meeks, D-N.Y., Don Beyer, D-Va., and Richard Neal, D-Ma., said in a joint statement last week that while House Democrats staunchly support Ukraine, this bill would \"do more harm than good.\"\n\"This bill would dramatically expand presidential tariff authorities while failing to mandate sanctions on Russia, both of which are unacceptable. These flaws would raise Americans' prices while undermining support for Ukraine in the long term,\" the lawmakers said.\nPresuming the measure clears the House, Trump intends to sign the bill into law, a White House official confirmed.",
    "bodyJa": "The U.S. House is expected to pass a Russia sanctions bill introduced over a year ago by the late Sen. Lindsey Graham, R-S.C., on Wednesday afternoon, sending it to President Donald Trump's desk.\nThe bill, titled the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026, would target Russia's economy, intending to penalize the country over its continued full-scale invasion of Ukraine. I\nThe legislation would allow Trump to impose tariffs up to 100% on countries including China and India, that are within the top five purchasers of Russian crude oil or gas. Money from oil sales is critical to funding Russia's war effort. It would also put sanctions on Russian leaders, officials and financial institutions and expand sanctions on Iran.\nSenators voted overwhelmingly in favor of the bill last month and passed it by a vote of 86-11 with strong bipartisan support. However, opponents of the bill say it gives Trump too much tariff authority.\nReps. Gregory Meeks, D-N.Y., Don Beyer, D-Va., and Richard Neal, D-Ma., said in a joint statement last week that while House Democrats staunchly support Ukraine, this bill would \"do more harm than good.\"\n\"This bill would dramatically expand presidential tariff authorities while failing to mandate sanctions on Russia, both of which are unacceptable. These flaws would raise Americans' prices while undermining support for Ukraine in the long term,\" the lawmakers said.\nPresuming the measure clears the House, Trump intends to sign the bill into law, a White House official confirmed.",

    "title": "OpenAI investors have approached the company about a new funding round",
    "titleJa": "OpenAI investors have approached the company about a new funding round",
    "summaryJa": "OpenAI is gearing up for what is widely expected to be a blockbuster IPO next year, after it confidentially filed its prospectus in June.",
    "bodyOriginal": "OpenAI investors have approached the company with proposals to kick-start a new funding round, but no formal discussions are underway, multiple sources told CNBC.\nInvestors have floated a $1.2 trillion valuation to OpenAI, and some have positioned the potential new funding round as a way for employees to sell stock, according to the people, who asked not to be named in order to discuss nonpublic information.\nOpenAI, which raised $122 billion at a $852 billion valuation in March, is not currently engaged in conversations, the people said. Following the round, OpenAI completed a secondary share sale totaling roughly $7 billion in August, allowing employees to cash in a portion of their holdings.\n\"We still have an incredible balance sheet,\" OpenAI CFO Sarah Friar told CNBC's Jim Cramer in an interview on Tuesday.\nThe Financial Times was first to report the potential round. OpenAI declined to comment.\nOpenAI burst onto the mainstream in 2022 following the launch of its artificial intelligence chatbot ChatGPT, and it's ballooned into one of the most valuable private companies in the world.\nThe startup is gearing up for what is widely expected to be a blockbuster initial public offering next year, after it confidentially filed its prospectus with the Securities and Exchange Commission in June.\nFriar told employees during an all-hands meeting last month that OpenAI \"will be a public company in 2027,\" but that it could make its public market debut sooner if \"our business continues to inflect.\"\nOpenAI has been under intense scrutiny in recent months after two of its models escaped containment, accessed the open internet and breached the open-source developer platform Hugging Face. OpenAI CEO Sam Altman endorsed a proposal to slow the pace of model development on Saturday in an effort to better address safety risks.\nIn an interview with Fortune on Saturday, Altman said that now would be an \"ill-advised\" moment to go public, in part because of the widespread concerns about safety.\nWATCH: OpenAI CFO Sarah Friar: I am a tech optimist, but it is also important to align around safety",
    "bodyJa": "OpenAI investors have approached the company with proposals to kick-start a new funding round, but no formal discussions are underway, multiple sources told CNBC.\nInvestors have floated a $1.2 trillion valuation to OpenAI, and some have positioned the potential new funding round as a way for employees to sell stock, according to the people, who asked not to be named in order to discuss nonpublic information.\nOpenAI, which raised $122 billion at a $852 billion valuation in March, is not currently engaged in conversations, the people said. Following the round, OpenAI completed a secondary share sale totaling roughly $7 billion in August, allowing employees to cash in a portion of their holdings.\n\"We still have an incredible balance sheet,\" OpenAI CFO Sarah Friar told CNBC's Jim Cramer in an interview on Tuesday.\nThe Financial Times was first to report the potential round. OpenAI declined to comment.\nOpenAI burst onto the mainstream in 2022 following the launch of its artificial intelligence chatbot ChatGPT, and it's ballooned into one of the most valuable private companies in the world.\nThe startup is gearing up for what is widely expected to be a blockbuster initial public offering next year, after it confidentially filed its prospectus with the Securities and Exchange Commission in June.\nFriar told employees during an all-hands meeting last month that OpenAI \"will be a public company in 2027,\" but that it could make its public market debut sooner if \"our business continues to inflect.\"\nOpenAI has been under intense scrutiny in recent months after two of its models escaped containment, accessed the open internet and breached the open-source developer platform Hugging Face. OpenAI CEO Sam Altman endorsed a proposal to slow the pace of model development on Saturday in an effort to better address safety risks.\nIn an interview with Fortune on Saturday, Altman said that now would be an \"ill-advised\" moment to go public, in part because of the widespread concerns about safety.\nWATCH: OpenAI CFO Sarah Friar: I am a tech optimist, but it is also important to align around safety",

    "id": "henry-zeffman-andy-burnham-and-his-chanc-9b0db7ce",
    "title": "Henry Zeffman: Andy Burnham and his chancellor have a battle on their hands as the Budget approaches",
    "titleJa": "Henry Zeffman: Andy Burnham and his chancellor have a battle on their hands as the Budget approaches",
    "summaryJa": "The Budget is only six weeks away and the economy is undoubtedly the biggest challenge facing the prime minister.",
    "bodyOriginal": "Henry Zeffman: Andy Burnham and his chancellor have a battle on their hands as the Budget approaches\n- Published\nToday's inflation figures underscore that the economy is the biggest challenge facing Andy Burnham.\nIt is only 42 days until John Healey's first Budget, and there is increasingly apparent concern at all levels of the government and Labour Party about how that Budget can – or, as it may prove, cannot – substantiate Burnham's rhetoric about offering the biggest change in British politics in 40 years.\nMuch of the tricky economic environment, yes, is driven by global factors including the persistence, and to some degree worsening, of the conflicts in the Middle East and Ukraine.\nAnd the AI boom pushing up borrowing costs is another issue affecting many countries.\nBut there are clearly domestic factors particular to Britain, and on that front it was very striking to hear the former Bank of England chief economist Andy Haldane telling LBC on Tuesday that without signs of cuts to public spending \"the markets now suspect that this is a traditional tax and spend socialist government with better TikTok videos\".\nFrom somebody who at times has informally advised Burnham's operation, that will sting, not least because a similar criticism has been voiced in recent weeks by the prominent economist Lord O'Neill – another sometime adviser.\nThe prime minister gave a direct response to Haldane, saying: \"That doesn't tell the story. We are not that.\"\nHe identified \"putting digital ID on hold\" as an example of how he had already \"taken difficult decisions in this job in relation to reprioritising government spending\" and vowed to continue to \"take difficult decisions to make sure the economy remains on track\".\nDigital ID is a striking choice of example. Burnham announced that he was abandoning the scheme in the days before he became prime minister so that he could focus on policies affecting the everyday cost of living.\nBut the spending was then, within the new government's first few days, re-allocated to cut VAT on household electricity bills.\nSo in that sense it was not a reduction in public spending, just a reprioritisation. And in any case, the former cabinet minister Darren Jones criticised Burnham at the time on the grounds that the government had not yet allocated the money for digital ID.\nCertainly the signs from Healey's first major speech as chancellor last week were that he wants to reassure the markets, promising to \"control public spending\" and praising Rachel Reeves for beginning to \"recover Britain's fiscal discipline\".\nBurnham and Healey would hardly be the first PM-chancellor double act to adopt different tones and emphasise different priorities in their public appearances.\nAs a junior minister at the Treasury almost 25 years ago, Healey was engaged in the question of how to boost growth around the country, long before it became central to Burnham's vision for Britain.\nBut there are people in government who are beginning to wonder whether their economic visions are quite as aligned as expected. \"It's what everyone is thinking and some of us are vocalising,\" one government source said.\nThere are also those who fear the adverse political consequences of a Labour government seeking to go out of its way to demonstrate its fiscal credibility. Arguably that was behind the removal of the Winter Fuel Allowance for most pensioners as one of Sir Keir Starmer's first acts, an early factor in his political demise.\nFor Labour's political opponents, all this amounts to a question of whether the prime minister is willing to disappoint his own MPs. Yet it's worth remembering that with winter fuel the frustration in parliament was primarily caused by the furious reaction of Labour MPs' constituents.\nArguably this presents a more fundamental tension: are the kinds of policies needed to soothe the markets politically deliverable given Labour's electoral coalition and its need to shore up the 'progressive' vote?\nThe Budget is only six weeks away and will be the first and most important sign of the new government's answer to that question.\nBurnham refuses to rule out tax rises in autumn Budget\n- Published25 August\nCall to raise tax thresholds among union demands ahead of Budget\n- Published2 hours ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",
    "bodyJa": "Henry Zeffman: Andy Burnham and his chancellor have a battle on their hands as the Budget approaches\n- Published\nToday's inflation figures underscore that the economy is the biggest challenge facing Andy Burnham.\nIt is only 42 days until John Healey's first Budget, and there is increasingly apparent concern at all levels of the government and Labour Party about how that Budget can – or, as it may prove, cannot – substantiate Burnham's rhetoric about offering the biggest change in British politics in 40 years.\nMuch of the tricky economic environment, yes, is driven by global factors including the persistence, and to some degree worsening, of the conflicts in the Middle East and Ukraine.\nAnd the AI boom pushing up borrowing costs is another issue affecting many countries.\nBut there are clearly domestic factors particular to Britain, and on that front it was very striking to hear the former Bank of England chief economist Andy Haldane telling LBC on Tuesday that without signs of cuts to public spending \"the markets now suspect that this is a traditional tax and spend socialist government with better TikTok videos\".\nFrom somebody who at times has informally advised Burnham's operation, that will sting, not least because a similar criticism has been voiced in recent weeks by the prominent economist Lord O'Neill – another sometime adviser.\nThe prime minister gave a direct response to Haldane, saying: \"That doesn't tell the story. We are not that.\"\nHe identified \"putting digital ID on hold\" as an example of how he had already \"taken difficult decisions in this job in relation to reprioritising government spending\" and vowed to continue to \"take difficult decisions to make sure the economy remains on track\".\nDigital ID is a striking choice of example. Burnham announced that he was abandoning the scheme in the days before he became prime minister so that he could focus on policies affecting the everyday cost of living.\nBut the spending was then, within the new government's first few days, re-allocated to cut VAT on household electricity bills.\nSo in that sense it was not a reduction in public spending, just a reprioritisation. And in any case, the former cabinet minister Darren Jones criticised Burnham at the time on the grounds that the government had not yet allocated the money for digital ID.\nCertainly the signs from Healey's first major speech as chancellor last week were that he wants to reassure the markets, promising to \"control public spending\" and praising Rachel Reeves for beginning to \"recover Britain's fiscal discipline\".\nBurnham and Healey would hardly be the first PM-chancellor double act to adopt different tones and emphasise different priorities in their public appearances.\nAs a junior minister at the Treasury almost 25 years ago, Healey was engaged in the question of how to boost growth around the country, long before it became central to Burnham's vision for Britain.\nBut there are people in government who are beginning to wonder whether their economic visions are quite as aligned as expected. \"It's what everyone is thinking and some of us are vocalising,\" one government source said.\nThere are also those who fear the adverse political consequences of a Labour government seeking to go out of its way to demonstrate its fiscal credibility. Arguably that was behind the removal of the Winter Fuel Allowance for most pensioners as one of Sir Keir Starmer's first acts, an early factor in his political demise.\nFor Labour's political opponents, all this amounts to a question of whether the prime minister is willing to disappoint his own MPs. Yet it's worth remembering that with winter fuel the frustration in parliament was primarily caused by the furious reaction of Labour MPs' constituents.\nArguably this presents a more fundamental tension: are the kinds of policies needed to soothe the markets politically deliverable given Labour's electoral coalition and its need to shore up the 'progressive' vote?\nThe Budget is only six weeks away and will be the first and most important sign of the new government's answer to that question.\nBurnham refuses to rule out tax rises in autumn Budget\n- Published25 August\nCall to raise tax thresholds among union demands ahead of Budget\n- Published2 hours ago\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

  {
    "id": "world-s-top-performing-sovereign-wealth-57b69376",
    "title": "World's top-performing sovereign wealth fund warns of looming pullback in U.S. stock market",
    "titleJa": "World's top-performing sovereign wealth fund warns of looming pullback in U.S. stock market",
    "summaryJa": "Investors behind the world's top-performing sovereign wealth fund warned Wednesday that the U.S. equity market could be due a correction.Jo Townsend, CEO of the Guardians of New Zealand Superannuation — which manages the country's $54 billion wealth fund — warned of a potential downturn as she revealed the fund had grown 14.2% in the year to June 30.",
    "bodyOriginal": "Investors behind the world's top-performing sovereign wealth fund warned Wednesday that the U.S. equity market could be due a correction.\nJo Townsend, CEO of the Guardians of New Zealand Superannuation — which manages the country's $54 billion wealth fund — warned of a potential downturn as she revealed the fund had grown 14.2% in the year to June 30.\nThe New Zealand Superannuation Fund, which had a value of 94.4 billion New Zealand dollars ($54.4 billion) at the end of the 2026 financial year, was ranked the world's best-performing sovereign wealth fund earlier this year by analytics firm Global SWF.\nThe Guardians said Wednesday that the returns posted in the fiscal year represented annual fund growth of NZ$9.3 billion but came in 0.1 percentage point below its benchmark index.\nNew Zealand Super Fund warns U.S. equity returns may cool\nWhile Townsend said Wednesday that the fund had performed exceptionally well in 2026, she cautioned that the returns enjoyed by stock market investors in recent years are likely to slow.\n\"Returns for U.S. equities over the past couple of years are close to double annualized returns for the past 20 years, so we would expect there to be some reversion to the mean at some point,\" she said in a statement alongside the performance update.\n\"In the short term, a concentrated portfolio can achieve strong results; however, over the long-term, we firmly believe a more diversified portfolio is better suited to our mandate.\"\nThe wealth fund has delivered an annual average return of 9.68% over the past two decades.\nEarlier this year, the Guardians announced it had lowered the fund's long-term expected annual return from 7.8% to 7.2%, which Townsend said on Wednesday reflected the fund management's view that returns on equities were likely to decrease. The fund has also reduced its active risk budget, she said.\nHow the fund's diversified strategy drove growth\nThe fund's managers publish data on their portfolio holdings every six months. Its most recent update, reflective of its portfolio at the end of December, showed the fund's most valuable positions were a NZ$3 billion stake in Nvidia, with Apple, Microsoft, Alphabet and Amazon accounting for the remainder of its top five positions by value.\nIts total U.S. equity portfolio was worth NZ$31.7 billion at the end of last year.\nEstablished in 2001 in a bid to make pension costs for New Zealand's aging population more affordable, New Zealand's wealth fund also allocates capital to timber, real estate and private markets, alongside other alternatives.\nThe first withdrawals from the New Zealand Superannuation Fund are expected in 2054.\nTownsend's view on what's in store for stock markets echoes a recent warning to investors from the head of the management team behind Norway's sovereign wealth fund, the world's largest.\nNicolai Tangen, the CEO of Norges Bank Investment Management, told CNBC last month: \"We should not be expecting the same kind of returns going forward as we've seen over the last six months.\"\nNBIM manages Norway's $2.3 trillion oil fund, which posted a record first-half profit nearing $185 billion.",
    "bodyJa": "Investors behind the world's top-performing sovereign wealth fund warned Wednesday that the U.S. equity market could be due a correction.\nJo Townsend, CEO of the Guardians of New Zealand Superannuation — which manages the country's $54 billion wealth fund — warned of a potential downturn as she revealed the fund had grown 14.2% in the year to June 30.\nThe New Zealand Superannuation Fund, which had a value of 94.4 billion New Zealand dollars ($54.4 billion) at the end of the 2026 financial year, was ranked the world's best-performing sovereign wealth fund earlier this year by analytics firm Global SWF.\nThe Guardians said Wednesday that the returns posted in the fiscal year represented annual fund growth of NZ$9.3 billion but came in 0.1 percentage point below its benchmark index.\nNew Zealand Super Fund warns U.S. equity returns may cool\nWhile Townsend said Wednesday that the fund had performed exceptionally well in 2026, she cautioned that the returns enjoyed by stock market investors in recent years are likely to slow.\n\"Returns for U.S. equities over the past couple of years are close to double annualized returns for the past 20 years, so we would expect there to be some reversion to the mean at some point,\" she said in a statement alongside the performance update.\n\"In the short term, a concentrated portfolio can achieve strong results; however, over the long-term, we firmly believe a more diversified portfolio is better suited to our mandate.\"\nThe wealth fund has delivered an annual average return of 9.68% over the past two decades.\nEarlier this year, the Guardians announced it had lowered the fund's long-term expected annual return from 7.8% to 7.2%, which Townsend said on Wednesday reflected the fund management's view that returns on equities were likely to decrease. The fund has also reduced its active risk budget, she said.\nHow the fund's diversified strategy drove growth\nThe fund's managers publish data on their portfolio holdings every six months. Its most recent update, reflective of its portfolio at the end of December, showed the fund's most valuable positions were a NZ$3 billion stake in Nvidia, with Apple, Microsoft, Alphabet and Amazon accounting for the remainder of its top five positions by value.\nIts total U.S. equity portfolio was worth NZ$31.7 billion at the end of last year.\nEstablished in 2001 in a bid to make pension costs for New Zealand's aging population more affordable, New Zealand's wealth fund also allocates capital to timber, real estate and private markets, alongside other alternatives.\nThe first withdrawals from the New Zealand Superannuation Fund are expected in 2054.\nTownsend's view on what's in store for stock markets echoes a recent warning to investors from the head of the management team behind Norway's sovereign wealth fund, the world's largest.\nNicolai Tangen, the CEO of Norges Bank Investment Management, told CNBC last month: \"We should not be expecting the same kind of returns going forward as we've seen over the last six months.\"\nNBIM manages Norway's $2.3 trillion oil fund, which posted a record first-half profit nearing $185 billion.",

    "summaryJa": "Shares of J.B. Hunt plunged more than 10% Wednesday after the company warned of an earnings drop between 5% and 10%.",
    "bodyOriginal": "Shares of J.B. Hunt plunged more than 10% on Wednesday after the trucking company said it expects its earnings to drop in the third quarter.\n\"We kind of want to be transparent with investors and give an update that in light of these costs that are sort of hitting us, we are expecting our Q2 to Q3 earnings to actually drop 5% to 10%,\" CFO Brad Delco said at the Morgan Stanley Industrials conference.\nDelco said between costs for recruiting, advertising, onboarding, training and sign-on bonuses, the company expects to see about $25 million more in the third quarter compared with the second quarter. He said that means J.B. Hunt is \"preparing for growth.\"\nStill, he added the company has also seen \"some of the most radical and abnormal swings\" in fuel prices that it has ever seen and record-high diesel prices, which are causing at least a $10 million headwind.\nDelco added that he expects volumes to improve sequentially to offset the incremental pressures.\n\"It really is more of a timing issue,\" he said. \"I think you can look at a glass half-empty or a glass half-full. I'm really glad that we have visibility to these costs right now.\"\nDelco also said J.B. Hunt is working on repairing its margins, though he believes the company still has a long way to go.\nJ.B. Hunt stock has risen nearly 100% over the past year.",

    "id": "bizarre-volatility-bet-in-the-options-pi-ceb8f4d3",
    "title": "Bizarre volatility bet in the options pits is a head scratcher ahead of Fed rate decision",
    "titleJa": "Bizarre volatility bet in the options pits is a head scratcher ahead of Fed rate decision",
    "summaryJa": "The biggest trade in options on the Cboe VIX Index Tuesday was an unusual $6 million purchase of deep, deep in-the-money-puts.",
    "bodyOriginal": "The biggest trade in options on the Cboe VIX Index Tuesday was an unusual $6 million purchase of deep, deep in-the-money-puts that might be an unusual interest-rate play ahead of Wednesday's highly-anticipated Federal Reserve rate decision.\nAround 10 a.m. Chicago time, someone purchased 563 110-strike VIX puts expiring Oct. 21 for $5.1 million, as well as $1.2 million of the 130-strike puts expiring Nov. 18, the scheduled release date for next month's FOMC minutes. Not only was the premium more than any other single trade on the day, the choice to use extremely options so deep in the money – the VIX ended the session at 17.2 – with no open interest prior to Tuesday, is odd on its own.\nDeep in the money puts have a much higher delta, or probability of expiring in the money, suggesting a high conviction that the VIX will move lower.\nTaken at face value, it's a bet volatility will decline over the next two months. The 110-strike puts cost $91 each and the 130-strike puts cost $110 each, bringing the total breakeven on the trade to a little over $19.\nThat's if they were standalone positions, which most traders I spoke to said is unlikely to be the case. Their estimation of what else the trader might have on in connection to the trade, however, was varied.\n\"If someone is short a bunch of the calls, they may buy the puts and the futures to mitigate risk,\" Noel Smith, founder and chief investment officer of Convex Asset Management, said in a call. \"People buy these tiny little VIX calls for 10 cents because if they go to 20 they can say they made a hundred. But the seller of those calls, they may have something else they want, but they have this wingy risk on the book they need to manage.\"\nCombine the odd trade with other notable activity in VIX options, futures and S&P 500 options, and an argument begins to emerge that market-makers and big traders across volatility products are at odds over how to price the near-term range of outcomes despite the bond market saying an interest-rate hike is a 90% certainty.\nOptions volume in the VIX has been above average for almost a week as the gauge climbed to just over 18 at its high last Thursday. Yet swings in the S&P 500 have been below one percent for the past five days, despite the VIX holding above 16, which implies a daily move of one percent. At the same time, S&P 500 options are implying a move of 0.8% at expiry on Wednesday, unusually low for a Fed meeting.\nIf you believe the S&P options, and recent trading behavior, it would suggest VIX is too high. Similarly, the gap between the VIX index and futures as of Tuesday's close is near the highest since June.\nThe bizarre buyer of puts may be trying to take advantage of this by trading a spread between VIX options and the underlying futures, according to one explanation offered by SpotGamma's Brent Kochuba.\n\"You can own that super deep in-the-money put against a long call and long future position,\" Kochuba said. \"As long as VIX is under 110, you can lock in whatever the difference in price is between the option and the future.\"",
    "bodyJa": "The biggest trade in options on the Cboe VIX Index Tuesday was an unusual $6 million purchase of deep, deep in-the-money-puts that might be an unusual interest-rate play ahead of Wednesday's highly-anticipated Federal Reserve rate decision.\nAround 10 a.m. Chicago time, someone purchased 563 110-strike VIX puts expiring Oct. 21 for $5.1 million, as well as $1.2 million of the 130-strike puts expiring Nov. 18, the scheduled release date for next month's FOMC minutes. Not only was the premium more than any other single trade on the day, the choice to use extremely options so deep in the money – the VIX ended the session at 17.2 – with no open interest prior to Tuesday, is odd on its own.\nDeep in the money puts have a much higher delta, or probability of expiring in the money, suggesting a high conviction that the VIX will move lower.\nTaken at face value, it's a bet volatility will decline over the next two months. The 110-strike puts cost $91 each and the 130-strike puts cost $110 each, bringing the total breakeven on the trade to a little over $19.\nThat's if they were standalone positions, which most traders I spoke to said is unlikely to be the case. Their estimation of what else the trader might have on in connection to the trade, however, was varied.\n\"If someone is short a bunch of the calls, they may buy the puts and the futures to mitigate risk,\" Noel Smith, founder and chief investment officer of Convex Asset Management, said in a call. \"People buy these tiny little VIX calls for 10 cents because if they go to 20 they can say they made a hundred. But the seller of those calls, they may have something else they want, but they have this wingy risk on the book they need to manage.\"\nCombine the odd trade with other notable activity in VIX options, futures and S&P 500 options, and an argument begins to emerge that market-makers and big traders across volatility products are at odds over how to price the near-term range of outcomes despite the bond market saying an interest-rate hike is a 90% certainty.\nOptions volume in the VIX has been above average for almost a week as the gauge climbed to just over 18 at its high last Thursday. Yet swings in the S&P 500 have been below one percent for the past five days, despite the VIX holding above 16, which implies a daily move of one percent. At the same time, S&P 500 options are implying a move of 0.8% at expiry on Wednesday, unusually low for a Fed meeting.\nIf you believe the S&P options, and recent trading behavior, it would suggest VIX is too high. Similarly, the gap between the VIX index and futures as of Tuesday's close is near the highest since June.\nThe bizarre buyer of puts may be trying to take advantage of this by trading a spread between VIX options and the underlying futures, according to one explanation offered by SpotGamma's Brent Kochuba.\n\"You can own that super deep in-the-money put against a long call and long future position,\" Kochuba said. \"As long as VIX is under 110, you can lock in whatever the difference in price is between the option and the future.\"",

    "title": "Mortgage demand from homebuyers drops 19% from a year ago, as interest rates surge abruptly higher",
    "titleJa": "Mortgage demand from homebuyers drops 19% from a year ago, as interest rates surge abruptly higher",
    "summaryJa": "Mortgage rates have surged to the highest level since the start of 2025, causing a major pullback in mortgage demand.",
    "bodyOriginal": "Fast-rising interest rates are taking their toll on mortgage demand, as both potential homebuyers and current homeowners head to the sidelines. Total mortgage application volume dropped 4.1% last week compared with the previous week, according to the Mortgage Bankers Association's seasonally adjusted index. Last week's results include a separate adjustment for the Labor Day holiday.\nThe average contract interest rate for 30-year fixed-rate mortgages with conforming loan balances, $832,750 or less, increased to 6.97% from 6.85% percent, with points increasing to 0.72 from 0.67, including the origination fee, for loans with a 20% down payment. That is a weekly average run by the MBA, but by last Thursday, rates had moved over 7%, according to a separate survey from Mortgage News Daily.\n\"Ongoing market concerns over spiking energy prices, persistently high inflation, and future monetary policy pushed bond yields and mortgage rates higher last week,\" said Joel Kan, MBA's vice president and deputy chief economist.\nApplications to refinance a home loan, which are most sensitive to weekly rate changes, dropped 9% for the week and were 65% lower than the same week one year ago. Last year at this time, the interest rate on the 30-year fixed was 58 basis points, or more than half a percentage point, lower.\n\"The current level of rates eliminated much of the benefit to refinance for many borrowers, resulting in declines in conventional, FHA, and VA refinance applications,\" Kan added.\nApplications for a mortgage to purchase a home dropped 1% for the week and were 19% lower than the same week one year ago. Potential buyers are still contending with high home prices. While the supply of homes for sale has been gaining in much of the country, much of that supply is on the higher end of the market.\nMortgage rates continued to move higher to start this week. The average rate on the 30-year fixed hit 7.22% on Tuesday, according to Mortgage News Daily, just ahead of the next meeting of the Federal Reserve Wednesday. Rates are now almost a full percentage point higher than they were a year ago.\n\"Over the past 6 [business] days, the average is up 0.33%, which is is the most abrupt jump since October 2024,\" wrote Matthew Graham, chief operating officer at Mortgage News Daily. \"At least some of the recent volatility is due to the implications of recent economic data and oil price implications on Fed policy.\"",

ad of the next meeting of the Federal Reserve Wednesday. Rates are now almost a full percentage point higher than they were a year ago.\n\"Over the past 6 [business] days, the average is up 0.33%, which is is the most abrupt jump since October 2024,\" wrote Matthew Graham, chief operating officer at Mortgage News Daily. \"At least some of the recent volatility is due to the implications of recent economic data and oil price implications on Fed policy.\"",

    "id": "canada-invited-to-become-eu-s-first-asso-007095ae",
    "title": "Canada invited to become EU’s first ‘associate member’ as Trump trade war intensifies",
    "titleJa": "Canada invited to become EU’s first ‘associate member’ as Trump trade war intensifies",
    "summaryJa": "EU chief Ursula von der Leyen said the bloc wants to open the door for Canada to become its first associate member, signaling a major deepening of ties.",
    "bodyOriginal": "European Commission President Ursula von der Leyen on Wednesday said the European Union is opening the door for Canada to become the first associate member of the 27-nation bloc.\nThe announcement marks a significant change in EU policy and signals a major deepening of ties between Brussels and Ottawa.\nSpeaking in her annual state of the European Union address in Strasbourg, France, the EU chief said the bloc wants to bring the relationship with Canada \"to the highest level possible.\"\n\"And, dear Mark, I said we must urgently reimagine our partnerships so I would like to work with you on opening the door for Canada to being the first associate member of the European Union,\" Von der Leyen said.\nCanadian Prime Minister Mark Carney, who was in attendance for the speech and is due to address EU lawmakers on Thursday, had previously said Ottawa was keen to pursue a \"unique security and economic alliance\" with Europe, but not full membership.\nCanada is currently locked in a bitter trade war with the U.S. and has pledged to match President Donald Trump's tariffs dollar for dollar.\nVon der Leyen said the EU and Canada \"see the world with the same eyes\" and pledged to work together on issues such as AI, climate change, geopolitics and Arctic security.\nThe EU and Canada already have a free trade agreement, one that eliminated 99% of all tariff lines when it provisionally came into force in 2017. The pact is known as the EU-Canada Comprehensive Economic and Trade Agreement, or CETA.\n\"We will move from CETA to an alliance for the future, to create a common prosperity and economic security space,\" Von der Leyen said.\nThe EU has previously been reluctant to entertain the prospect of flexible membership categories, notably when German Chancellor Friedrich Merz pushed for the EU to consider associate membership for Ukraine earlier in the year.\nAsked whether Von der Leyen's push to embrace Canada as the EU's first associate member was history in the making, Berenberg chief economist Holger Schmieding said: \"I think this is a big step, indeed.\"\n\"Europe is trying to openly form new partnerships or deepen partnerships with all countries in the world that are sort of like-minded,\" Schmieding told CNBC's \"Squawk Box Europe\" on Wednesday.\n\"It is not necessarily against the U.S., but it is clearly in favor of making us less dependent on the U.S. and less dependent on China, and that deeper partnership with other countries, like-minded democracies, is actually something we see in the economic re-arm,\" he added.\nIn early June, Finnish President Alexander Stubb outlined his vision for a much larger European Union, saying the bloc should \"think big\" to project power on the global stage. As part of this, Stubb said the EU might consider increasing its membership to 40 states and named Canada, the U.K., Turkey, Norway and Iceland as potential candidates to join.\n\"Wouldn't it be lovely if Canada was the 28th state of the European Union rather than the 51st state of the United States?\" Stubb said on June 3, referring to Trump's ambitions to annex Canada.\n'Middle powers'\nAt the start of the year, Carney told delegates at the World Economic Forum in Davos, Switzerland that so-called \"middle powers\" must band together to counter the rise of hard power and build a more cooperative and peaceful world.\n\"We have a situation where it is totally unpredictable what the United States are doing and we have aggressive industrial policy by China — and therefore, it's so important that we strengthen our ties with democratic countries, and Canada is one example,\" Bernd Lange, who chairs the European Parliament's trade committee, told CNBC on Wednesday.\nAlongside Ottawa, Lange said the EU should push to build stronger economic ties with Brazil, Indonesia Japan and South Korea.\n\"It's so important that we work together and build a bloc and as Mr. Carney … mentioned in Davos, you have to be strong and sit at the table, otherwise you will be part of the menu,\" he added.",

    "title": "Petrol and diesel price rises push UK inflation higher",
    "titleJa": "Petrol and diesel price rises push UK inflation higher",
    "summaryJa": "Summer holidays and disruption to global oil supplies by the Middle East conflict stoked price growth.",
    "bodyOriginal": "Petrol and diesel price rises push UK inflation higher\n- Published\nRises in petrol, diesel and airfares pushed UK inflation up to its highest level in five months in the year to August.\nInflation accelerated to 3.1% from 2.9%, according to the Office for National Statistics (ONS).\nThe cost of filling up a vehicle soared in August as the conflict in the Middle East continued to disrupt global oil supplies. Petrol prices jumped to their highest for nearly four years, the ONS said, while diesel also rocketed.\nMeanwhile, the cost of flying jumped during the key month for summer getaways.\nOverall, motor fuel prices rose by 23% compared to August last year.\nOil hit more than $91 a barrel as the US-Israel war with Iran went on. That compares to around $73 just before hostilities began earlier this year.\nAs a result, average petrol prices have continued to climb and between July and August, they rose by 9.1p to 161.3p per litre.\n\"This is the highest price recorded since November 2022,\" said the ONS. At that point, Russia's full-scale invasion of Ukraine had pushed up global energy costs.\nCapital Economics said, at this point, the effect of higher oil prices has not spilled over into other areas such as food and drink, where the pace of inflation remained at 1.3% in the year to August.\nBut its chief UK economist, Paul Dales, said: \"Everyone knows that bigger rises in inflation are on their way.\"\nGrant Fitzner, chief economist at the ONS, said: \"Rising crude oil and petrol prices increased both the annual cost of raw materials and the price of goods leaving factories respectively.\"\nDales estimates that a combination of higher oil and gas prices and \"the eventual 'first-round' effect of businesses passing on some of their higher energy costs\" will lead to inflation peaking at 4.2% in January.\n'Things are down'\nAs well as hitting drivers in the pocket, higher oil prices also affect forecourts.\nGoran Raven, owner of Essex petrol station RJ Raven, told the BBC: \"Things are down. We've got lots of pressure on us at the moment. I'd say we're about 20% down on this time last year.\"\nRaven said changes in the oil price have a \"real-time impact on us\".\nIn recent days, Brent crude - the global benchmark for oil prices - has surpassed $100 a barrel.\n\"We only have small tanks here, so we need a tanker almost every day at the moment and we have to pay a daily spot price,\" said Raven. \"When the price goes up, we have to go up with it. There's no way around it.\n\"The margins here are wafer-thin on fuel. People like to think we're earning a lot on it. Unfortunately, we really aren't. It's single digits of pence we earn per litre.\"\nThe rise in inflation means it has moved further away from the Bank of England's 2% target.\nThe bank uses interest rates to control inflation.\nThe rate currently stands at 3.75% and the Bank of England is meeting on Thursday to decide whether to change it.\nChancellor John Healey, who is preparing to announce his first Budget next month, said: \"The war in the Middle East is impacting on inflation worldwide, not just here at home. In our bills, our weekly shop and at the petrol pumps.\"\nHe said: \"Despite this serious global uncertainty, our UK economy is proving resilient.\"\nThe most recent figures showed that the UK economy expanded by 0.4% in July, boosted by investment in artificial intelligence.\nBut, for the second quarter between April and June, Britain's economic growth slowed to 0.4% from 0.6% in January to March.\nWhat is happening to UK prices?\n- Published2 hours ago\nWhat will the energy cap changes mean for my bills?\n- Published26 August\nCommenting on inflation, shadow chancellor Andrew Griffith said the government's \"jobs tax and employment red tape are being passed on to consumers in the weekly shop and their mad energy policies are pushing up costs and leaving Brits exposed\".\nThe government is cutting VAT on household electricity bills from 5% to zero on 1 October, saving a typical household about £45 a year.\nAt the same time, the price cap on both electricity and gas bills will rise by 4%.\nIt means a home using a typical amount of gas and electricity will pay £60 a year more.\nYael Selfin, chief economist at KPMG, said the VAT cut will only partially offset the impact of higher gas prices, which have been rising because of the Iran war and disruption to global supplies, including liquefied natural gas.\n\"If gas prices remain around current levels, household energy bills could rise by a further double-digit amount from January, with an even larger increase possible if wholesale prices climb further,\" she said.\n'Everything is extremely expensive'\nEmma Ashfield, a nursery worker from Northern Ireland who is raising her eight-year-old daughter, said everything is already \"extremely expensive\".\n\"You are trying to keep food on the table, [buy] clothes, trying to provide for them,\" she said. \"You would basically need a second job.\"\nWith winter approaching, she says energy costs are another worry: \"I find electric very pricey… and it is costly trying to heat my apartment too.\n\"My wee girl is always wanting the heating on, so that's another thing.\"\nLiberal Democrat Treasury spokesperson Daisy Cooper said: \"Trump's illegal war - egged on by the Conservatives and Reform UK - is once again hitting British families hard. This must be a wake up-call for the government.\"\nGet in touch\nHow are rising costs affecting you?",

    "id": "intel-sk-hynix-shares-jump-on-report-the-96cffeb4",
    "title": "Intel, SK Hynix shares jump on report they're discussing U.S. memory chip manufacturing",
    "titleJa": "Intel, SK Hynix shares jump on report they're discussing U.S. memory chip manufacturing",
    "summaryJa": "The deal could be a big win for Intel which has been looking to gain marquee customers for its manufacturing, or foundry, business.",
    "bodyOriginal": "SK Hynix is in talks with Intel to manufacture its memory chips in the U.S. for the first time, Reuters reported Wednesday, sending shares of both companies higher in premarket trading.\nIntel rose 3.2% while SK Hynix's Nasdaq-listed shares were 2.6% higher.\nUnder one scenario, SK Hynix would lease part of Intel's chipmaking facility in Ohio, Reuters reported, citing people familiar with the matter. Intel and SK Hynix could also form a joint venture with Intel and major cloud firms, Reuters said.\nSK Hynix could also look at other ways to structure the deal, the news agency reported. The talks are exploratory, and no decisions have been made, one of the sources told Reuters.\nIntel and SK Hynix did not immediately respond to CNBC's request for comment on the report.\nIf a deal is struck, it would be a big win for Intel, which has been looking to gain marquee customers for its manufacturing, or foundry business, which is a key pillar of CEO Lip-Bu Tan's strategy. The arrangement could also advance the U.S. government's efforts to bring more semiconductor manufacturing to America's shores.\nSK Hynix is one of the world's leading suppliers of high-bandwidth memory (HBM), a key component of Nvidia's chips. It also produces other types of memory chips that are crucial for AI applications.\nA deal between Intel and SK Hynix to manufacture advanced memory like HBM could face opposition from the South Korean government because the technologies are considered sensitive, Reuters reported, citing three sources.\nSK Hynix, which listed its American depository receipts on the Nasdaq in July, has been a big beneficiary of the AI boom. The rush to build data centers has created a shortage of memory chips, sharply driving up prices and enabling SK Hynix and its rival Samsung to rake in huge profits.\nSK Hynix's South Korea-listed stock is up 400% over the last year.\nIn June, SK Hynix announced plans to double capacity over the next five years. Demand for HBM is \"enormous,\" Chairman Chey Tae-won told CNBC in July.\nSK Hynix already has plans to boost U.S. production. Last month, the company broke ground on its first U.S. facility, located in Indiana. CEO Kwak Noh-Jung said the $4 billion factory will make the state a \"key HBM production base in America\" by 2030.",
    "bodyJa": "SK Hynix is in talks with Intel to manufacture its memory chips in the U.S. for the first time, Reuters reported Wednesday, sending shares of both companies higher in premarket trading.\nIntel rose 3.2% while SK Hynix's Nasdaq-listed shares were 2.6% higher.\nUnder one scenario, SK Hynix would lease part of Intel's chipmaking facility in Ohio, Reuters reported, citing people familiar with the matter. Intel and SK Hynix could also form a joint venture with Intel and major cloud firms, Reuters said.\nSK Hynix could also look at other ways to structure the deal, the news agency reported. The talks are exploratory, and no decisions have been made, one of the sources told Reuters.\nIntel and SK Hynix did not immediately respond to CNBC's request for comment on the report.\nIf a deal is struck, it would be a big win for Intel, which has been looking to gain marquee customers for its manufacturing, or foundry business, which is a key pillar of CEO Lip-Bu Tan's strategy. The arrangement could also advance the U.S. government's efforts to bring more semiconductor manufacturing to America's shores.\nSK Hynix is one of the world's leading suppliers of high-bandwidth memory (HBM), a key component of Nvidia's chips. It also produces other types of memory chips that are crucial for AI applications.\nA deal between Intel and SK Hynix to manufacture advanced memory like HBM could face opposition from the South Korean government because the technologies are considered sensitive, Reuters reported, citing three sources.\nSK Hynix, which listed its American depository receipts on the Nasdaq in July, has been a big beneficiary of the AI boom. The rush to build data centers has created a shortage of memory chips, sharply driving up prices and enabling SK Hynix and its rival Samsung to rake in huge profits.\nSK Hynix's South Korea-listed stock is up 400% over the last year.\nIn June, SK Hynix announced plans to double capacity over the next five years. Demand for HBM is \"enormous,\" Chairman Chey Tae-won told CNBC in July.\nSK Hynix already has plans to boost U.S. production. Last month, the company broke ground on its first U.S. facility, located in Indiana. CEO Kwak Noh-Jung said the $4 billion factory will make the state a \"key HBM production base in America\" by 2030.",

    "id": "yield-on-10-year-treasury-hovers-above-5-da7f9266",
    "title": "Yield on 10-year Treasury hovers above 5% as investors await Fed decision",
    "titleJa": "Yield on 10-year Treasury hovers above 5% as investors await Fed decision",
    "summaryJa": "Yields on U.S. Treasurys were little changed Wednesday morning, as investors awaited the outcome of the Federal Reserve's two-day September meeting.At 4:30 a.m. ET, the benchmark 10-year Treasury yield was flat at 5.004%, while yields on the longer-dated 20- and 30-year Treasury notes were unchanged at 5.409% and 5.372%, respectively.",
    "bodyOriginal": "Yields on U.S. Treasurys were little changed Wednesday morning, as investors awaited the outcome of the Federal Reserve's two-day September meeting.\nAt 4:30 a.m. ET, the benchmark 10-year Treasury yield was flat at 5.004%, while yields on the longer-dated 20- and 30-year Treasury notes were unchanged at 5.409% and 5.372%, respectively.\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\nThe Fed's Federal Open Market Committee is set to announce its latest monetary policy decision at 2 p.m. ET on Wednesday.\nFed funds futures were last pricing in a roughly 92.5% chance of a quarter-point hike, according to the CME FedWatch tool, up from a 33% likelihood a month ago.\nData released on Friday showed the U.S. annual inflation rate hit 3.4% in August, while the most recent personal consumption expenditures price index — which the Fed uses as its preferred forecasting tool — increased by 3.7% on an annual basis in July. Oil prices, meanwhile, remain above $100 a barrel, adding to inflation concerns.\nThe hot inflation data has put pressure on the long end of the Treasury curve in recent weeks, pushing the 10-year Treasury yield to a post-2007 high on Tuesday.\nBrent Wilsey, chief investment officer at San Diego-based Wilsey Asset Management, said in an emailed note on Wednesday that a hold from the Fed could have ramifications for investors and the central bank.\n\"If the Federal Reserve were to keep rates steady Wednesday, that could surprise stocks, and surprises are rarely received well in markets,\" he said. \"It could also damage the Fed's credibility, and reignite concerns that the central bank is caving to political pressure to keep rates steady.\"\nThe Trump administration has repeatedly put pressure on the Fed to lower rates.\nJonathan Pryor, co-head of FX dealing at Marex, said in a Wednesday morning note that the Fed is \"moving into a new phase of monetary policy.\"\n\"Earlier in the year, it looked like we were entering into a rate cutting cycle that may last for six or twelve months, but now it feels like the tables have turned,\" he said.\n\"Central banks are trying to make sensible decisions and tackle inflation, predominantly supply-side inflation, at a time when global bond markets are receiving significant attention. It is a difficult balance to strike, and one that markets are acutely aware of.\"",
    "bodyJa": "Yields on U.S. Treasurys were little changed Wednesday morning, as investors awaited the outcome of the Federal Reserve's two-day September meeting.\nAt 4:30 a.m. ET, the benchmark 10-year Treasury yield was flat at 5.004%, while yields on the longer-dated 20- and 30-year Treasury notes were unchanged at 5.409% and 5.372%, respectively.\nOne basis point equals 0.01%, and yields and prices move in opposite directions.\nThe Fed's Federal Open Market Committee is set to announce its latest monetary policy decision at 2 p.m. ET on Wednesday.\nFed funds futures were last pricing in a roughly 92.5% chance of a quarter-point hike, according to the CME FedWatch tool, up from a 33% likelihood a month ago.\nData released on Friday showed the U.S. annual inflation rate hit 3.4% in August, while the most recent personal consumption expenditures price index — which the Fed uses as its preferred forecasting tool — increased by 3.7% on an annual basis in July. Oil prices, meanwhile, remain above $100 a barrel, adding to inflation concerns.\nThe hot inflation data has put pressure on the long end of the Treasury curve in recent weeks, pushing the 10-year Treasury yield to a post-2007 high on Tuesday.\nBrent Wilsey, chief investment officer at San Diego-based Wilsey Asset Management, said in an emailed note on Wednesday that a hold from the Fed could have ramifications for investors and the central bank.\n\"If the Federal Reserve were to keep rates steady Wednesday, that could surprise stocks, and surprises are rarely received well in markets,\" he said. \"It could also damage the Fed's credibility, and reignite concerns that the central bank is caving to political pressure to keep rates steady.\"\nThe Trump administration has repeatedly put pressure on the Fed to lower rates.\nJonathan Pryor, co-head of FX dealing at Marex, said in a Wednesday morning note that the Fed is \"moving into a new phase of monetary policy.\"\n\"Earlier in the year, it looked like we were entering into a rate cutting cycle that may last for six or twelve months, but now it feels like the tables have turned,\" he said.\n\"Central banks are trying to make sensible decisions and tackle inflation, predominantly supply-side inflation, at a time when global bond markets are receiving significant attention. It is a difficult balance to strike, and one that markets are acutely aware of.\"",
