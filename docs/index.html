    "title": "Measles is surging in the U.S. — and outbreaks can cost millions",
    "titleJa": "Measles is surging in the U.S. — and outbreaks can cost millions",
    "summaryJa": "A new tool developed by Johns Hopkins researchers estimates that the 2025 measles outbreak in the U.S. carried an economic cost of more than $37 million.",
    "bodyOriginal": "Measles outbreaks aren't just a public health threat. They can also be a financial burden on the U.S. — and the cost could only deepen as the once-eliminated disease spreads more widely.\nThe U.S. is expected to lose its official measles elimination status following a review by the Pan American Health Organization this week, after cases ratcheted to recent highs this year.\nMore than 5,100 measles cases have been reported nationwide in 2026 as of early November, marking the country's worst outbreak in more than three decades. Eight deaths associated with the disease have been confirmed by states so far in 2026: six in Pennsylvania, one in New York and one in Wisconsin.\nBased on this year's case count, a new tool developed by researchers at Johns Hopkins University estimates an economic cost of nearly $83 million for the outbreaks. That total includes $56 million in public health response costs, almost $25 million in lost productivity and more than $1.8 million in direct medical expenses.\nThe tool also estimates that 2025 measles outbreaks in the U.S. — which involved 2,289 confirmed cases nationwide – carried an economic cost of more than $37 million.\nThe costs extend beyond treating people who become sick, accounting for the resources health departments spend investigating and containing outbreaks, as well as wages lost when people have to miss work. The tool uses more recent, state-specific cost and financing data than an initial study by the researchers, which relied on historical outbreak costs.\nThe estimates from the tool are not a definitive accounting of what the outbreaks actually cost. But it illustrates the hefty bill tied to the spread of a disease that can be prevented through vaccination, and the potential economic consequences of falling childhood immunization rates. CNBC previously reported on how the return of measles in the U.S. exposes weaknesses in the nation's public health system that raise concerns about the return of other eliminated diseases.\n\"We're starting to see a whole bunch of people who decided not to get vaccinated as kids or have never gotten exposed to measles because they benefited from herd immunity, who now make it into adulthood and risk potentially getting quite seriously ill and requiring very significant medical expenses, or dying at the hospital,\" Bryan Patenaude, a health economist at the International Vaccine Access Center at the Johns Hopkins Bloomberg School of Public Health, who helped develop the tool, said in an interview.\nThe costs of containing measles\nMeasles outbreaks can trigger a costly public health response, even when many people who are exposed never become sick.\nWhen a case is identified, public health officials must investigate the infection, identify and notify people who may have been exposed, coordinate with hospitals and schools, and sometimes organize vaccination campaigns to prevent further spread. Those efforts can divert staff and resources from other public health priorities.\nCosts could differ heavily depending on the state.\nJohns Hopkins' data includes national averages alongside state-specific inputs, including inpatient hospital costs and wages from government data or trusted health policy sources. In New York, for example, the average inpatient hospital stay is roughly $4,200 a day, while the minimum wage is $16 per hour.\nThe tool estimates that the 48 cases reported by New York in 2025 carried an estimated $1.1 million in costs, including nearly $749,000 in public health responses, $333,000 in productivity losses and roughly $24,500 in direct medical expenses.\nMeanwhile, the 803 cases in Texas, the epicenter of the largest U.S. measles outbreak in 2025, carried estimated costs of nearly $13 million, according to the tool. That includes $9 million in public health costs, $4 million in productivity losses and around $288,000 in direct medical expenses.\nThe tool builds on a study published by Patenaude and other researchers in August, which examined the costs of measles outbreaks in the U.S. The researchers reviewed published studies and government reports to compile historical estimates of medical expenses and public health response costs across 18 states.\nThe paper estimated that outbreaks carried a historical average cost of nearly $59,000 per case, just from the public health response. The researchers also estimated how costs scale with outbreak size, separating fixed up-front response expenses from the additional costs associated with each new case.\n\"A lot of this is incurred up front, and that's because of the human labor that's involved in contact tracing and all of the different actors that sort of need to be mobilized to deal with the fact that there's an outbreak,\" Patenaude told CNBC. \"It's a largely labor-driven cost.\"\nThat model estimated roughly $298,000 in fixed costs and about $16,300 for each additional case. But it relied on historical data, including a particularly large 2019 outbreak in New York City, where contact-tracing labor costs were high. The researchers also excluded productivity losses from that model because most of the historical studies they reviewed did not consistently account for them.\nThe costs of lost productivity\nThe economic burden of measles extends beyond the costs of treating infected patients and organizing a public health response.\nPeople who are exposed to measles may have to quarantine, even if they never develop symptoms. Parents can also be forced to miss work to care for sick or exposed children, while workers who contract the disease may lose wages during their recovery.\nA 2025 study by Joey Mattingly, a pharmacist and health economist at the University of Utah, used published epidemiological and cost data to model the potential economic burden of a hypothetical 1,500-case outbreak. His analysis included direct medical expenses, public health spending and lost productivity, and examined how the estimates changed under different assumptions, including hospitalization rates.\nThe study estimated that the hypothetical outbreak could cost about $90 million, including roughly $26 million in productivity losses.\nThe economic ripple effects of a case\nThose indirect costs can add up quickly because measles is highly contagious and a single infected person can expose dozens of others. Those contacts may need to quarantine or miss work while health officials determine whether they have been infected, creating costs even when they never develop the disease.\nMattingly estimated that each person who is quarantined could amount to roughly $300 in lost productivity alone.\nIf a single measles case exposes 40 to 50 people who then need to quarantine, that could translate into an estimated $12,000 to $15,000 in lost productivity, even if none of those contacts become sick.\nThat ripple effect is one reason Mattingly argues that the economic costs of outbreaks can quickly outweigh the investment required to vaccinate people against measles.\n\"Even if you don't get the infection, the contact costs you,\" he said. \"And so it's just showing that there's this multiplication or exponential growth on the economic side that happens.\"\nThe financial burden can also fall unevenly across communities. While the costs of responding to an outbreak may be shared among local, state and federal agencies, Mattingly said the impact is often felt directly by local health departments.\n\"It's not like your health department is sitting around waiting for measles outbreaks,\" he said. \"They're working, doing all these other things, and imagine having to just drop what you're doing because there's been a huge outbreak in the community.\"\nPatenaude said the findings could help state and local health departments better anticipate the resources needed to contain outbreaks — particularly as measles cases continue to rise.\n\"It's not super expensive to treat and deal with a single case of measles compared to a single case of cancer,\" he said. \"But if you have these outbreaks popping up and you're having to constantly divert resources that could be spent elsewhere by state and local health departments on measles, then you're going to wind up spending a lot of money very quickly.\"",

  {
    "id": "u-s-china-should-harbor-no-illusions-as-b3b84a76",
    "title": "U.S., China should ‘harbor no illusions’ as they cooperate, compete on AI, Bessent says",
    "titleJa": "U.S., China should ‘harbor no illusions’ as they cooperate, compete on AI, Bessent says",
    "summaryJa": "During Xi's September visit, Washington and Beijing agreed to launch an AI dialogue with a communications channel to help defuse serious incidents.",
    "bodyOriginal": "The U.S. and China should \"harbor no illusions\" about their differences as they engage to contain the risks of artificial intelligence, while competing with each other at the same time, Treasury Secretary Scott Bessent said.\nBessent said in prepared remarks to the National Committee on U.S.-China Relations in New York Tuesday that the two governments had established a new dialogue mechanism on \"super intelligence,\" or SI, aimed at guarding against \"shared risks\" and averting any \"misunderstanding between our two systems.\"\nThe mechanism will see both sides exchanging \"best practices\" for testing advanced models before they are released, and \"keeping human judgement firmly in command of the technology,\" Bessent said, expecting both sides to alert each other to serious incidents involving the SI models.\nBessent, however, stopped short of making any commitment to limit advancement of the technology, as Beijing and Washington remain locked in an intense race to achieve global dominance in AI.\nThe Trump administration has largely resisted broadening restrictions on AI development over concerns of ceding a competitive edge to China, though the president has more recently signaled some openness to putting in place regulatory safeguards.\n\"I don't mind guardrails,\" he said in a CBS interview released Sunday, adding that he did not want regulations to put the U.S. in \"a deep second position\" behind China, which he said had no such restrictions.\nChina's foreign ministry in September dismissed calls to slow down frontier models, saying that fearmongering and confrontation would only disrupt global AI governance. Huiyao Wang, founder of Center for China and Globalization, a think tank that closely aligns with Beijing's thinking, said last month that the U.S.-China talks should \"confront AI risks and manage them together.\"\nDuring Xi's September visit, Washington and Beijing agreed to launch an AI dialogue with a communications channel to help defuse serious incidents. The two leaders are expected to meet for the third time next week, with Bessent joining, on the sidelines of the Asia-Pacific Economic Cooperation Leaders' Meeting from Nov. 18 to 19.\nAs the technology advances, the two nations will need to demonstrate how they can \"reconcile the demands of competition with the responsibilities of leadership,\" Bessent said in his Tuesday speech. \"Our interests will not always coincide, and our approach to every challenge likewise will not always converge,\" he added.\nWashington had briefly suspended access by foreign nationals to Anthropic's Mythos and Fable 5 models in June before restoring it weeks later. The U.S. government has also restricted exports of the most advanced chips to Beijing, and accused Chinese developers of copying American models through what it calls industrial-scale distillation.\nXie Feng, China's ambassador to the U.S., told the audience at the gala that efforts by both countries were \"indispensable\" to addressing issues from global flashpoints to \"improving artificial intelligence governance.\" Cooperation \"may not resolve every challenge,\" he said, but \"none can be resolved without it.\"\nThe event was organized at a time when controversy around Nvidia Corp CEO Jensen Huang's affair with an alleged Chinese spy has been making headlines.\nThe billionaire tech executive, who joined Trump's delegation to Beijing in May and was invited to the state dinner in Washington in September, is at the center of a major corporate and national security scandal after admitting to an extramarital affair with a Chinese businesswoman whom the U.S. intelligence officials suspect of espionage.\nWhile Huang's presence at the upcoming summit has been thrown into doubt, other business leaders such as Tesla and SpaceX CEO Elon Musk and Mastercard's Michael Miebach could be on Trump's delegation next week, according to South China Morning Post.",
    "bodyJa": "The U.S. and China should \"harbor no illusions\" about their differences as they engage to contain the risks of artificial intelligence, while competing with each other at the same time, Treasury Secretary Scott Bessent said.\nBessent said in prepared remarks to the National Committee on U.S.-China Relations in New York Tuesday that the two governments had established a new dialogue mechanism on \"super intelligence,\" or SI, aimed at guarding against \"shared risks\" and averting any \"misunderstanding between our two systems.\"\nThe mechanism will see both sides exchanging \"best practices\" for testing advanced models before they are released, and \"keeping human judgement firmly in command of the technology,\" Bessent said, expecting both sides to alert each other to serious incidents involving the SI models.\nBessent, however, stopped short of making any commitment to limit advancement of the technology, as Beijing and Washington remain locked in an intense race to achieve global dominance in AI.\nThe Trump administration has largely resisted broadening restrictions on AI development over concerns of ceding a competitive edge to China, though the president has more recently signaled some openness to putting in place regulatory safeguards.\n\"I don't mind guardrails,\" he said in a CBS interview released Sunday, adding that he did not want regulations to put the U.S. in \"a deep second position\" behind China, which he said had no such restrictions.\nChina's foreign ministry in September dismissed calls to slow down frontier models, saying that fearmongering and confrontation would only disrupt global AI governance. Huiyao Wang, founder of Center for China and Globalization, a think tank that closely aligns with Beijing's thinking, said last month that the U.S.-China talks should \"confront AI risks and manage them together.\"\nDuring Xi's September visit, Washington and Beijing agreed to launch an AI dialogue with a communications channel to help defuse serious incidents. The two leaders are expected to meet for the third time next week, with Bessent joining, on the sidelines of the Asia-Pacific Economic Cooperation Leaders' Meeting from Nov. 18 to 19.\nAs the technology advances, the two nations will need to demonstrate how they can \"reconcile the demands of competition with the responsibilities of leadership,\" Bessent said in his Tuesday speech. \"Our interests will not always coincide, and our approach to every challenge likewise will not always converge,\" he added.\nWashington had briefly suspended access by foreign nationals to Anthropic's Mythos and Fable 5 models in June before restoring it weeks later. The U.S. government has also restricted exports of the most advanced chips to Beijing, and accused Chinese developers of copying American models through what it calls industrial-scale distillation.\nXie Feng, China's ambassador to the U.S., told the audience at the gala that efforts by both countries were \"indispensable\" to addressing issues from global flashpoints to \"improving artificial intelligence governance.\" Cooperation \"may not resolve every challenge,\" he said, but \"none can be resolved without it.\"\nThe event was organized at a time when controversy around Nvidia Corp CEO Jensen Huang's affair with an alleged Chinese spy has been making headlines.\nThe billionaire tech executive, who joined Trump's delegation to Beijing in May and was invited to the state dinner in Washington in September, is at the center of a major corporate and national security scandal after admitting to an extramarital affair with a Chinese businesswoman whom the U.S. intelligence officials suspect of espionage.\nWhile Huang's presence at the upcoming summit has been thrown into doubt, other business leaders such as Tesla and SpaceX CEO Elon Musk and Mastercard's Michael Miebach could be on Trump's delegation next week, according to South China Morning Post.",

    "title": "Bessent reportedly moved to military base over Iranian threats on his life",
    "titleJa": "Bessent reportedly moved to military base over Iranian threats on his life",
    "summaryJa": "The move comes as the Department of Justice said late Tuesday that three Iranian nationals have been indicted on terrorism-related charges.",
    "bodyOriginal": "U.S. Treasury Secretary Scott Bessent was reportedly moved from his Washington, D.C., home to a military base due to Iranian threats on his life.\nThe New York Times, citing officials familiar with the matter, said that U.S. officials had concluded Iranian plotting against current and former American officials had reached a more advanced stage.\nSeparately, Reuters reported that the severity of the threats against Bessent was not immediately clear.\nBessent has led \"Operation Economic Outcast,\" a Treasury campaign launched in August to isolate Iran economically through sanctions and other financial measures, in addition to the U.S. military actions.\nThe Times reported that Bessent's role in that campaign has made him one of the Trump administration officials Iran most wanted to target.\nThe move comes as the Department of Justice Department said late Tuesday that three Iranian nationals had been indicted on terrorism-related charges.\nThe department said the three were allegedly involved in nearly 20 attacks and attempted attacks across Europe and the United States.\nThe alleged plots included a September 2026 attack targeting RAF Fairford in the U.K., where U.S. military personnel were stationed.\n\"Anyone who plans a terrorist plot on a military base housing American servicemembers will be prosecuted by the United States government,\" Attorney General Todd Blanche said.\nEarlier in October, British Prime Minister Andy Burnham said Iran was involved in the incident at RAF Fairford that led to the arrest of five men on suspicion of explosives and terrorism offences.\nIranian Foreign Minister Abbas Araghchi then rejected the allegation, writing on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, in Gloucestershire, is a key U.S. Air Force operating location in Europe and has supported deployments of American strategic bombers and other aircrafts.\nStalled negotiations\nSeparately, U.S. Secretary of State Marco Rubio reportedly said military action against Iran may not be necessary if economic sanctions and Washington's naval blockade are working.\nOn Monday, President Donald Trump said on Truth Social that \"Qatar, Saudi Arabia, UAE, Bahrain, Kuwait, and others, would prefer the status quo, in other words, a continuation of the Greatest Naval Blockade in History.\"\n\"We are seeing positive momentum toward an end to this Conflict,\" Trump added.\nAsked Tuesday why he would not simply declare an end to the Iran war, Trump said he wanted to ensure U.S. allies in the region were \"not hurt\" and that there was a \"long term solution.\nHowever, Iranian officials have denied that negotiations are underway. Security chief Mohsen Rezaei said claims that talks were continuing were aimed at \"easing economic pressures and reducing oil prices.\"\nBrent and West Texas Intermediate crude prices edged higher during Wednesday's Asia trading session, at about $92 and $86 per barrel, respectively.",
    "bodyJa": "U.S. Treasury Secretary Scott Bessent was reportedly moved from his Washington, D.C., home to a military base due to Iranian threats on his life.\nThe New York Times, citing officials familiar with the matter, said that U.S. officials had concluded Iranian plotting against current and former American officials had reached a more advanced stage.\nSeparately, Reuters reported that the severity of the threats against Bessent was not immediately clear.\nBessent has led \"Operation Economic Outcast,\" a Treasury campaign launched in August to isolate Iran economically through sanctions and other financial measures, in addition to the U.S. military actions.\nThe Times reported that Bessent's role in that campaign has made him one of the Trump administration officials Iran most wanted to target.\nThe move comes as the Department of Justice Department said late Tuesday that three Iranian nationals had been indicted on terrorism-related charges.\nThe department said the three were allegedly involved in nearly 20 attacks and attempted attacks across Europe and the United States.\nThe alleged plots included a September 2026 attack targeting RAF Fairford in the U.K., where U.S. military personnel were stationed.\n\"Anyone who plans a terrorist plot on a military base housing American servicemembers will be prosecuted by the United States government,\" Attorney General Todd Blanche said.\nEarlier in October, British Prime Minister Andy Burnham said Iran was involved in the incident at RAF Fairford that led to the arrest of five men on suspicion of explosives and terrorism offences.\nIranian Foreign Minister Abbas Araghchi then rejected the allegation, writing on X that Burnham was \"barking up the wrong tree.\"\nRAF Fairford, in Gloucestershire, is a key U.S. Air Force operating location in Europe and has supported deployments of American strategic bombers and other aircrafts.\nStalled negotiations\nSeparately, U.S. Secretary of State Marco Rubio reportedly said military action against Iran may not be necessary if economic sanctions and Washington's naval blockade are working.\nOn Monday, President Donald Trump said on Truth Social that \"Qatar, Saudi Arabia, UAE, Bahrain, Kuwait, and others, would prefer the status quo, in other words, a continuation of the Greatest Naval Blockade in History.\"\n\"We are seeing positive momentum toward an end to this Conflict,\" Trump added.\nAsked Tuesday why he would not simply declare an end to the Iran war, Trump said he wanted to ensure U.S. allies in the region were \"not hurt\" and that there was a \"long term solution.\nHowever, Iranian officials have denied that negotiations are underway. Security chief Mohsen Rezaei said claims that talks were continuing were aimed at \"easing economic pressures and reducing oil prices.\"\nBrent and West Texas Intermediate crude prices edged higher during Wednesday's Asia trading session, at about $92 and $86 per barrel, respectively.",

    "id": "alibaba-announces-plans-to-list-t-head-i-cc64fd18",
    "title": "Alibaba announces plans to list T-Head, its Nvidia chip rival",
    "titleJa": "Alibaba announces plans to list T-Head, its Nvidia chip rival",
    "summaryJa": "Alibaba noted it had already filed confidentially on Sept. 11 to list T-Head on the Hong Kong Stock Exchange.",
    "bodyOriginal": "Chinese tech and e-commerce giant Alibaba announced late Tuesday that the Hong Kong Stock Exchange will allow the company to spin off its semiconductor subsidiary T-Head.\nTo do so, Alibaba said it plans a public offering for shares of T-Head in Hong Kong, subject to approval from the exchange and the China Securities Regulatory Commission.\nThe filing did not disclose a date or proposed size of a listing.\nAlibaba noted it had already filed confidentially on Sept. 11 to list T-Head on the Hong Kong Stock Exchange.\nMeanwhile, Hong Kong-listed shares of Alibaba traded 1% lower Wednesday morning. The stock is down about 29% year-to-date.\nIn late September, Alibaba announced its next-generation AI chip, the Zhenwu V900, that it said delivers three times the performance of its predecessor, the Zhenwu M890 released in May.\nAlibaba is one of several Chinese companies, including Huawei, developing homegrown semiconductors to power artificial intelligence, amid growing U.S. restrictions on China's ability to access the chips.\nShort seller Culper Research alleged in May that Alibaba was able to obtain restricted Nvidia chips by indirectly financing entities in Southeast Asia. Alibaba did not immediately respond to a request for comment.\nNews of Nvidia CEO Jensen Huang's affair with an alleged Chinese spy involved with one of those entities has dragged down the stock to its lowest valuation since late March, weighing on the overall U.S. stock market.\nAmid the tech stock volatility, U.S.-based AI giant Anthropic said in an updated filing Tuesday that it will offer 825 million shares in its upcoming IPO at a price range between $70 and $78 per share.\nTrading on the Nasdaq is expected to begin on Nov. 19, people familiar with the details told CNBC. They were granted anonymity because they were not authorized to speak publicly.\nChinese tech stocks have underperformed their U.S. peers, despite investor excitement last year around AI breakthroughs by DeepSeek.\nBaidu has reportedly delayed the listing of its AI chip entity Kunlunxin, as has Chinese memory chip company YMTC, according to news reports this month. Neither company immediately responded to requests for comment.\nIn the last few months, China's financial regulators have increased their scrutiny on tech IPOs and the rush of capital into the sector.\n—CNBC's Fred Imbert, Ashley Capoot and Leslie Picker contributed to this report",
    "bodyJa": "Chinese tech and e-commerce giant Alibaba announced late Tuesday that the Hong Kong Stock Exchange will allow the company to spin off its semiconductor subsidiary T-Head.\nTo do so, Alibaba said it plans a public offering for shares of T-Head in Hong Kong, subject to approval from the exchange and the China Securities Regulatory Commission.\nThe filing did not disclose a date or proposed size of a listing.\nAlibaba noted it had already filed confidentially on Sept. 11 to list T-Head on the Hong Kong Stock Exchange.\nMeanwhile, Hong Kong-listed shares of Alibaba traded 1% lower Wednesday morning. The stock is down about 29% year-to-date.\nIn late September, Alibaba announced its next-generation AI chip, the Zhenwu V900, that it said delivers three times the performance of its predecessor, the Zhenwu M890 released in May.\nAlibaba is one of several Chinese companies, including Huawei, developing homegrown semiconductors to power artificial intelligence, amid growing U.S. restrictions on China's ability to access the chips.\nShort seller Culper Research alleged in May that Alibaba was able to obtain restricted Nvidia chips by indirectly financing entities in Southeast Asia. Alibaba did not immediately respond to a request for comment.\nNews of Nvidia CEO Jensen Huang's affair with an alleged Chinese spy involved with one of those entities has dragged down the stock to its lowest valuation since late March, weighing on the overall U.S. stock market.\nAmid the tech stock volatility, U.S.-based AI giant Anthropic said in an updated filing Tuesday that it will offer 825 million shares in its upcoming IPO at a price range between $70 and $78 per share.\nTrading on the Nasdaq is expected to begin on Nov. 19, people familiar with the details told CNBC. They were granted anonymity because they were not authorized to speak publicly.\nChinese tech stocks have underperformed their U.S. peers, despite investor excitement last year around AI breakthroughs by DeepSeek.\nBaidu has reportedly delayed the listing of its AI chip entity Kunlunxin, as has Chinese memory chip company YMTC, according to news reports this month. Neither company immediately responded to requests for comment.\nIn the last few months, China's financial regulators have increased their scrutiny on tech IPOs and the rush of capital into the sector.\n—CNBC's Fred Imbert, Ashley Capoot and Leslie Picker contributed to this report",

    "id": "anthropic-opens-australian-retail-ipo-of-c74830ac",
    "title": "Anthropic opens Australian retail IPO offering as AI scrutiny intensifies",
    "titleJa": "Anthropic opens Australian retail IPO offering as AI scrutiny intensifies",
    "summaryJa": "Anthropic opened its Australia retail IPO offering on Wednesday, allowing individual investors to apply for shares ahead of its planned IPO.",
    "bodyOriginal": "Anthropic, the maker of AI chatbot Claude, opened its Australian retail initial public offering on Wednesday, giving individual investors access to shares ahead of the company's planned Nasdaq listing.\nThe offering opened at 10 a.m. Australian Eastern Daylight Time on Wednesday and is expected to close at 5 p.m. on Nov. 17, according to the timetable published by participating broker Stake.\nAnthropic is seeking to raise as much as $64.4 billion in its IPO, with a separate $26 billion private placement, bringing a combined total to as much as $90.4 billion. Shares are expected to be priced between $70 to $78 each.\nThe Australian retail offering is expected to consist of newly issued Class A common shares under a prospectus to be lodged with the Australian Securities and Investments Commission, Anthropic said on its website.\nParticipating brokers include Commonwealth Bank of Australia's CommSec unit as lead broker, along with Bell Potter, LGT Wealth, Macquarie Group, Morgans, Morgan Stanley Wealth Management, Sharesies and Stake.\nAnthropic said the prospectus would be available on its IPO website once the Australian retail offering opens. Investors will need to review the document and apply through participating brokers under the terms of the offer.\nAustralia is one of the small numbers of markets outside the U.S. where retail investors will be able to buy the company's shares directly, alongside Japan, Canada and parts of Europe.\nThe San Francisco-based AI startup has applied to list its Class A common stock on the Nasdaq Global Select Market under the ticker symbol \"ANT.\" Anthropic said it does not plan to seek a listing on the Australian Securities Exchange.\nAI scrutiny grows\nThe offering comes as Australia moves to tighten oversight of AI companies after an OpenAI agent gained unauthorized access to the medical statistics website of Medicare, the country's universal health insurance program.\nPrime Minister Anthony Albanese said Tuesday that the government would introduce mandatory reporting for certain AI-related incidents and establish an AI safety regulator with powers to enforce penalties.\n\"The law needs to get ahead of, and in some cases, make sure that it catches up with what is a very fast-changing world,\" Albanese told Reuters.\nThe government is also considering changes to criminal law for cases involving serious misconduct.\nThe country has also ruled out a copyright-law exemption that would allow AI companies to train models on Australian content without licensing it.\nOpen AI and Anthropic told Australian parliament last month that they would support mandatory reporting of data breaches involving their AI agents, acknowledging that disclosure is currently voluntary.",
    "bodyJa": "Anthropic, the maker of AI chatbot Claude, opened its Australian retail initial public offering on Wednesday, giving individual investors access to shares ahead of the company's planned Nasdaq listing.\nThe offering opened at 10 a.m. Australian Eastern Daylight Time on Wednesday and is expected to close at 5 p.m. on Nov. 17, according to the timetable published by participating broker Stake.\nAnthropic is seeking to raise as much as $64.4 billion in its IPO, with a separate $26 billion private placement, bringing a combined total to as much as $90.4 billion. Shares are expected to be priced between $70 to $78 each.\nThe Australian retail offering is expected to consist of newly issued Class A common shares under a prospectus to be lodged with the Australian Securities and Investments Commission, Anthropic said on its website.\nParticipating brokers include Commonwealth Bank of Australia's CommSec unit as lead broker, along with Bell Potter, LGT Wealth, Macquarie Group, Morgans, Morgan Stanley Wealth Management, Sharesies and Stake.\nAnthropic said the prospectus would be available on its IPO website once the Australian retail offering opens. Investors will need to review the document and apply through participating brokers under the terms of the offer.\nAustralia is one of the small numbers of markets outside the U.S. where retail investors will be able to buy the company's shares directly, alongside Japan, Canada and parts of Europe.\nThe San Francisco-based AI startup has applied to list its Class A common stock on the Nasdaq Global Select Market under the ticker symbol \"ANT.\" Anthropic said it does not plan to seek a listing on the Australian Securities Exchange.\nAI scrutiny grows\nThe offering comes as Australia moves to tighten oversight of AI companies after an OpenAI agent gained unauthorized access to the medical statistics website of Medicare, the country's universal health insurance program.\nPrime Minister Anthony Albanese said Tuesday that the government would introduce mandatory reporting for certain AI-related incidents and establish an AI safety regulator with powers to enforce penalties.\n\"The law needs to get ahead of, and in some cases, make sure that it catches up with what is a very fast-changing world,\" Albanese told Reuters.\nThe government is also considering changes to criminal law for cases involving serious misconduct.\nThe country has also ruled out a copyright-law exemption that would allow AI companies to train models on Australian content without licensing it.\nOpen AI and Anthropic told Australian parliament last month that they would support mandatory reporting of data breaches involving their AI agents, acknowledging that disclosure is currently voluntary.",

    "id": "robot-vessels-take-on-the-dangerous-work-393689e2",
    "title": "Robot vessels take on the dangerous work of mine hunting",
    "titleJa": "Robot vessels take on the dangerous work of mine hunting",
    "summaryJa": "The conflict in the Gulf is an opportunity for the US to test its autonomous mine-hunting systems.",
    "bodyOriginal": "Robot vessels take on the dangerous work of mine hunting\n- Published\nTraversing the Strait of Hormuz remains one of the most dangerous trips a vessel can take.\nDespite assistance from the US Navy, ships are still being attacked.\n\"To transit the Strait of Hormuz you need agreement between the captain and the crew to take the risk. You need war risk insurance. And the captain has to make the final decision,\" says Steve Cameron, a former merchant navy officer and maritime consultant.\nMissiles and drones are a threat from the air, but under the surface mines may also be lurking.\n\"If you're a captain, you'd like to see evidence mines aren't present,\" Cameron adds.\nModern mines rest on the seabed and detonate when they detect an acoustic or magnetic signal, triggering a pressure wave that will break the keel of a passing vessel.\nOthers can rise through shallow waters or float, or be powered towards a target.\nThe technology itself is not difficult or costly, but the mere threat can stop a tanker fleet from sailing.\nIan McFarlane of French defence group Thales is a naval architect who knows mine warfare well. \"Mines are a very cheap way of waging a naval war, as the Royal Navy is acutely aware,\" he says.\nFinding sea mines has traditionally been the job of specialist mine-hunting vessels, with crews of around 80 sailors.\nTo keep humans out of harm's way, an increasing amount of the work is done by systems that are autonomous and monitored from the shore.\nThey might only need 20 personnel, working in shifts on land. With the recruitment and retention challenges facing Nato navies these highly-portable robot systems are very attractive.\nSuch tech has been under development for 20 years.\nDuring the 2003 Iraq war the US Navy poked around the seabed looking for mines with a torpedo-shaped robot called the Remus 100.\nPinging around with sonar these little machines operated down to around 100ft depth and spared divers a difficult and dangerous task.\nThe latest conflict in the Gulf is testing much more capable systems.\nThe US military is sparing with details about their mine-hunting craft, but we have seen glimpses of them.\nIranian forces hauled an uncrewed US autonomous sub, external out of the waters of the Strait of Hormuz in early September.\nThe Pentagon claimed this robot, an Extra Large Uncrewed Underwater Vehicle (XLUUV) from US autonomous defence tech venture Anduril, was a malfunctioning older device with no classified equipment on-board.\nWhatever its mission, no sailors were imperilled. That, says William Lupton, a naval analyst with Shephard Group, \"was a drop in the ocean compared to having prisoners taken\", and part of the point of uncrewed vessels.\nWhat if an uncrewed vessel is captured? Nato navies are reluctant to go into details, but computer drives can be wiped or destroyed remotely by various means. This may have taken place inside the humming circuit boards of the XLUUV seized by Iran.\nSuch autonomous tech is being embraced by forces around the world.\nCooperation between Thales, the Royal Navy, and France's Marine Nationale has produced a robot motor launch.\nThe Thales Uncrewed Surface Vehicle (USV) is packed with sensors programmed to detect mines via sonar that was developed for the oil and gas industries.\nIt tows a 5m long rectangular box, similar to a large torpedo, that takes a hi-resolution look at the seabed and creates a 3D picture refined by AI. The latest mines are designed to blend into their surroundings and the software spots anything that looks like a mine.\nAutonomous systems are cheaper than conventional minehunters, plus they can be deployed, along with containerised control centres, by air.\nSteve Prest, associate fellow at the RUSI defence think tank, introduced uncrewed mine hunting into the Royal Navy and was its first fleet robotics officer, a title he acquired in 2014.\n\"There is a bunch of ways to look for a mine using robot boats or robot subs, and while you can't prove the negative, that no mines are there, you can reduce the risk.\"\nHe says US robot minehunters can either blow up a mine or just mark the spot as somewhere to avoid.\n\"We'll see more use of autonomy but also the missions and capability will expand. And AI will be analysing data from those vessels on the spot as opposed to data being analysed when a drone returns.\"\nThe Royal Navy recently announced its concept of a hybrid navy - mixing drones with conventional warships. But Prest thinks for this vision to succeed the fleet must operate as one distributed force, sharing data in what he terms a cognitive architecture.\nThe robot only makes a real difference as part of this scheme and it's a mistake to focus on individual uncrewed assets. \"Uncrewed or autonomous vessels are not the operating system. They are applications running on it.\"\nWhile robots are on the rise, people are what really matter in the Strait.\nNeil Roberts speaks for insurers at Lloyd's of London on marine matters and says the psychological impact of the mine threat is inescapable, as is the uncertainty around just how many mines, if any, are out there.\n\"The US says it has cleared the Omani route and believes the mine threat is being managed, with shipments running at about 75% of pre-conflict levels.\"\nFear of the unknown is the most potent aspect of the sea mine threat and robots are now the weapon of choice to confront that fear.\nTechnology of Business\n- Published28 October\n- Published23 October\n- Published9 October",
    "bodyJa": "Robot vessels take on the dangerous work of mine hunting\n- Published\nTraversing the Strait of Hormuz remains one of the most dangerous trips a vessel can take.\nDespite assistance from the US Navy, ships are still being attacked.\n\"To transit the Strait of Hormuz you need agreement between the captain and the crew to take the risk. You need war risk insurance. And the captain has to make the final decision,\" says Steve Cameron, a former merchant navy officer and maritime consultant.\nMissiles and drones are a threat from the air, but under the surface mines may also be lurking.\n\"If you're a captain, you'd like to see evidence mines aren't present,\" Cameron adds.\nModern mines rest on the seabed and detonate when they detect an acoustic or magnetic signal, triggering a pressure wave that will break the keel of a passing vessel.\nOthers can rise through shallow waters or float, or be powered towards a target.\nThe technology itself is not difficult or costly, but the mere threat can stop a tanker fleet from sailing.\nIan McFarlane of French defence group Thales is a naval architect who knows mine warfare well. \"Mines are a very cheap way of waging a naval war, as the Royal Navy is acutely aware,\" he says.\nFinding sea mines has traditionally been the job of specialist mine-hunting vessels, with crews of around 80 sailors.\nTo keep humans out of harm's way, an increasing amount of the work is done by systems that are autonomous and monitored from the shore.\nThey might only need 20 personnel, working in shifts on land. With the recruitment and retention challenges facing Nato navies these highly-portable robot systems are very attractive.\nSuch tech has been under development for 20 years.\nDuring the 2003 Iraq war the US Navy poked around the seabed looking for mines with a torpedo-shaped robot called the Remus 100.\nPinging around with sonar these little machines operated down to around 100ft depth and spared divers a difficult and dangerous task.\nThe latest conflict in the Gulf is testing much more capable systems.\nThe US military is sparing with details about their mine-hunting craft, but we have seen glimpses of them.\nIranian forces hauled an uncrewed US autonomous sub, external out of the waters of the Strait of Hormuz in early September.\nThe Pentagon claimed this robot, an Extra Large Uncrewed Underwater Vehicle (XLUUV) from US autonomous defence tech venture Anduril, was a malfunctioning older device with no classified equipment on-board.\nWhatever its mission, no sailors were imperilled. That, says William Lupton, a naval analyst with Shephard Group, \"was a drop in the ocean compared to having prisoners taken\", and part of the point of uncrewed vessels.\nWhat if an uncrewed vessel is captured? Nato navies are reluctant to go into details, but computer drives can be wiped or destroyed remotely by various means. This may have taken place inside the humming circuit boards of the XLUUV seized by Iran.\nSuch autonomous tech is being embraced by forces around the world.\nCooperation between Thales, the Royal Navy, and France's Marine Nationale has produced a robot motor launch.\nThe Thales Uncrewed Surface Vehicle (USV) is packed with sensors programmed to detect mines via sonar that was developed for the oil and gas industries.\nIt tows a 5m long rectangular box, similar to a large torpedo, that takes a hi-resolution look at the seabed and creates a 3D picture refined by AI. The latest mines are designed to blend into their surroundings and the software spots anything that looks like a mine.\nAutonomous systems are cheaper than conventional minehunters, plus they can be deployed, along with containerised control centres, by air.\nSteve Prest, associate fellow at the RUSI defence think tank, introduced uncrewed mine hunting into the Royal Navy and was its first fleet robotics officer, a title he acquired in 2014.\n\"There is a bunch of ways to look for a mine using robot boats or robot subs, and while you can't prove the negative, that no mines are there, you can reduce the risk.\"\nHe says US robot minehunters can either blow up a mine or just mark the spot as somewhere to avoid.\n\"We'll see more use of autonomy but also the missions and capability will expand. And AI will be analysing data from those vessels on the spot as opposed to data being analysed when a drone returns.\"\nThe Royal Navy recently announced its concept of a hybrid navy - mixing drones with conventional warships. But Prest thinks for this vision to succeed the fleet must operate as one distributed force, sharing data in what he terms a cognitive architecture.\nThe robot only makes a real difference as part of this scheme and it's a mistake to focus on individual uncrewed assets. \"Uncrewed or autonomous vessels are not the operating system. They are applications running on it.\"\nWhile robots are on the rise, people are what really matter in the Strait.\nNeil Roberts speaks for insurers at Lloyd's of London on marine matters and says the psychological impact of the mine threat is inescapable, as is the uncertainty around just how many mines, if any, are out there.\n\"The US says it has cleared the Omani route and believes the mine threat is being managed, with shipments running at about 75% of pre-conflict levels.\"\nFear of the unknown is the most potent aspect of the sea mine threat and robots are now the weapon of choice to confront that fear.\nTechnology of Business\n- Published28 October\n- Published23 October\n- Published9 October",

    "id": "stickers-and-building-sets-help-drive-to-1fcd06be",
    "title": "Stickers and building sets help drive toy sales ahead of Christmas rush",
    "titleJa": "Stickers and building sets help drive toy sales ahead of Christmas rush",
    "summaryJa": "A bumper year so far for toy sales comes as debate intensifies over screen time and tech connectivity.",
    "bodyOriginal": "Stickers and building sets help drive toy sales ahead of Christmas rush\n- Published\nTraditional games and stickers are helping to drive a bumper year for toy sales, figures show.\nThe data comes ahead of the crucial Christmas run-in for retailers, which peaks at 23 toys sold every second in the UK.\nThe number of toys sold up to October was 17% higher than the same period last year and growth is at a 10-year high, according to research company Circana.\nThe increase comes despite consumers' cost-of-living pressures, and there are signs that some of the biggest growth in sales is for toys priced between £5 and £10.\nDespite relatively low sales in recent years, the toy sector has been buoyed by sales to \"kidults\".\nThe kidult market - which is toys and games for those aged over 12 - has been growing, particularly as adults buy toys for themselves.\nThis growth has continued with a 22% increase in the value of sales in the first half of the year.\nBut Melissa Symonds, UK toys director at Circana, said that toys for children - which still represents the majority of sales - had recorded a good year so far.\nGrowing public debate around children's screen time and the role of technology meant squishy toys, stickers and building sets such as Lego were popular.\n\"Connected toys account for less than 1% of market sales, showing that traditional, hands-on play remains overwhelmingly popular,\" she said.\nConcerns have been raised about the suitability of some connected devices.\nA BBC investigation found an AI teddy marketed as being \"perfect\" for children as young as three said \"I can't help with killing you\" after seemingly mishearing a question.\nMeanwhile, debate has intensified about keeping youngsters free from smartphones during the school day.\nOne in five parents of children aged three to nine say the chance to play together as a family influences what they buy, according to market intelligence company The Insights Family.\nPaul Reader, who chairs the Dream Toys selection panel of retailers and experts across the sector, said that parents wanted to engage with their children's play.\n\"Nothing beats a board game with that. Nothing beats a bit of interaction,\" he said.\n'Shop around but check safety'\nThe panel he chairs has selected a list of toys that retailers believe will be some of the most popular this year.\nIt includes variations on popular toys of recent years, including slime, a soft tiger that roars and grows, and a shark that breaks out of an egg.\nSymonds said that, despite rising sales in the year so far, nearly half of toy sales came in the build-up to Christmas, and families were still looking closely at costs.\nThere was significant growth in toys priced between £5 and £10, she said.\nReader also urged anyone looking for a bargain to shop around, but to ensure that toys were bought from reputable traders so they were genuine and safe.\nGet in touch\nAre you going for traditional toys this Christmas? How much are you spending on toys this Christmas?",

airs the Dream Toys selection panel of retailers and experts across the sector, said that parents wanted to engage with their children's play.\n\"Nothing beats a board game with that. Nothing beats a bit of interaction,\" he said.\n'Shop around but check safety'\nThe panel he chairs has selected a list of toys that retailers believe will be some of the most popular this year.\nIt includes variations on popular toys of recent years, including slime, a soft tiger that roars and grows, and a shark that breaks out of an egg.\nSymonds said that, despite rising sales in the year so far, nearly half of toy sales came in the build-up to Christmas, and families were still looking closely at costs.\nThere was significant growth in toys priced between £5 and £10, she said.\nReader also urged anyone looking for a bargain to shop around, but to ensure that toys were bought from reputable traders so they were genuine and safe.\nGet in touch\nAre you going for traditional toys this Christmas? How much are you spending on toys this Christmas?",

    "id": "poundland-hopeful-for-last-minute-rescue-aedade87",
    "title": "Poundland hopeful for last-minute rescue deal to stave off collapse",
    "titleJa": "Poundland hopeful for last-minute rescue deal to stave off collapse",
    "summaryJa": "The BBC understands the discount chain, which has been edging towards administration, will be given more time to find a buyer.",
    "bodyOriginal": "Poundland hopeful for last-minute rescue deal to stave off collapse\n- Published\nPoundland and its 11,000 employees are hopeful that the retailer's impending collapse can be delayed to allow time for a last-minute rescue deal.\nThe discount chain has been edging towards administration after being blocked by its owners from accessing cash in its bank accounts.\nA deadline to secure a buyer for the business is set to expire at midnight, but sources close to the situation have told the BBC that they expect more time will be given, thanks to the release of £10m in funding.\nA committee of MPs is set to question Gordon Brothers, Poundland's US owners, on Wednesday following accusations that the investment firm hopes to profit from selling off Poundland's 600 stores and stock piecemeal.\nGordon Brothers - which bought the chain for just £1 last year - is accused of forcing that outcome by restricting Poundland's access to available cash needed to restock stores and pay wages and rent, ahead of the crucial Christmas trading period.\nThe investment firm has denied the claims.\nBut pressure remains on Poundland's owners after a takeover bid was rejected. The decision prompted calls for answers from politicians, including Prime Minister Andy Burnham.\nAbout £50m had been frozen by Gordon Brothers, the BBC understands, meaning Poundland bosses were unable to restock shelves across its 600 shops.\nHowever, sources close to the matter told the BBC on Tuesday that a release of £10m by its owners, while \"small in the scale of things\" could help at least postpone the chain's collapse while a longer term solution was explored.\nViews on Poundland performance differ\nThe 10-day moratorium to protect Poundland from its creditors expires on Thursday, but if there is a prospect of a solvent deal, the deadline could be extended.\nViews on the chain's performance differ between those running operations and the owners.\nPoundland boss Barry Williams told staff last week that like-for-like sales, which exclude new store openings, were up 11.4%. The sales period included Halloween, but Williams said this was £1.5m ahead of budget.\nHe added the business made a profit of £18.1m in the year to September, which was a \"strong recovery\" from the previous year where there were losses of £68m.\nHowever, Gordon Brothers has painted a different picture, saying the chain remains \"challenged and vulnerable to any potential downturn in future trading\".\nThere has been interest from the likes of Poundstretcher, Tesco and B&M in picking up Poundland stores which could mean continuing employment for workers in the event the chain is broken up and sold off in chunks.\nThe main issue is whether a piecemeal sale would protect more jobs than a buyer willing to keep Poundland as a national chain.",
    "bodyJa": "Poundland hopeful for last-minute rescue deal to stave off collapse\n- Published\nPoundland and its 11,000 employees are hopeful that the retailer's impending collapse can be delayed to allow time for a last-minute rescue deal.\nThe discount chain has been edging towards administration after being blocked by its owners from accessing cash in its bank accounts.\nA deadline to secure a buyer for the business is set to expire at midnight, but sources close to the situation have told the BBC that they expect more time will be given, thanks to the release of £10m in funding.\nA committee of MPs is set to question Gordon Brothers, Poundland's US owners, on Wednesday following accusations that the investment firm hopes to profit from selling off Poundland's 600 stores and stock piecemeal.\nGordon Brothers - which bought the chain for just £1 last year - is accused of forcing that outcome by restricting Poundland's access to available cash needed to restock stores and pay wages and rent, ahead of the crucial Christmas trading period.\nThe investment firm has denied the claims.\nBut pressure remains on Poundland's owners after a takeover bid was rejected. The decision prompted calls for answers from politicians, including Prime Minister Andy Burnham.\nAbout £50m had been frozen by Gordon Brothers, the BBC understands, meaning Poundland bosses were unable to restock shelves across its 600 shops.\nHowever, sources close to the matter told the BBC on Tuesday that a release of £10m by its owners, while \"small in the scale of things\" could help at least postpone the chain's collapse while a longer term solution was explored.\nViews on Poundland performance differ\nThe 10-day moratorium to protect Poundland from its creditors expires on Thursday, but if there is a prospect of a solvent deal, the deadline could be extended.\nViews on the chain's performance differ between those running operations and the owners.\nPoundland boss Barry Williams told staff last week that like-for-like sales, which exclude new store openings, were up 11.4%. The sales period included Halloween, but Williams said this was £1.5m ahead of budget.\nHe added the business made a profit of £18.1m in the year to September, which was a \"strong recovery\" from the previous year where there were losses of £68m.\nHowever, Gordon Brothers has painted a different picture, saying the chain remains \"challenged and vulnerable to any potential downturn in future trading\".\nThere has been interest from the likes of Poundstretcher, Tesco and B&M in picking up Poundland stores which could mean continuing employment for workers in the event the chain is broken up and sold off in chunks.\nThe main issue is whether a piecemeal sale would protect more jobs than a buyer willing to keep Poundland as a national chain.",
    "source": "BBC",

    "publishedAt": "2026-11-11T00:02:07+00:00",

    "id": "nvidia-s-huang-tries-to-project-business-ab16bd03",
    "title": "Nvidia's Huang tries to project 'business as usual' in return to office after affair revelation",
    "titleJa": "Nvidia's Huang tries to project 'business as usual' in return to office after affair revelation",
    "summaryJa": "Nvidia employees described the mood as \"sad\" as CEO Jensen Huang returned to the office after disclosing an affair.",
    "bodyOriginal": "Nvidia CEO Jensen Huang walked into the chipmaker's Santa Clara, California, headquarters on Monday and conducted his regular morning meeting with top-level executives, people familiar with the meeting told CNBC.\nOn Sunday, Huang had disclosed an extramarital affair to employees.\nHuang kicked off the closed-door gathering by addressing his infidelity and sharing how sorry he was to his staff, according to the people, who asked not to be named because they were not authorized to speak publicly. They said Huang didn't take any questions and quickly pivoted to business and top agenda items of the day.\nThe CEO was also in the office on Tuesday, conducting meetings just one week ahead of the company's quarterly earnings report.\nNvidia did not immediately respond to a request for comment.\nPeople inside the artificial intelligence chip giant said Huang tried to project \"business as usual,\" even as the probe moved forward into his affair with an alleged Chinese spy. The CEO was in a romantic relationship with Alice Huang, a former Megaspeed executive, according to The Financial Times.\nSentiment toward Jensen Huang shifted on Sunday after the 63-year-old revealed in an email to employees that he had an affair, though he did not disclose with whom he had the relationship.\n\"I know an apology cannot undo what I have done,\" he wrote. \"I hope our family will heal and that, over time, I can earn back your trust.\" Nvidia's board opened an investigation and hired Wachtell, Lipton, Rosen & Katz to conduct the probe on Tuesday.\nEmployees inside the firm described the mood to CNBC as \"sad.\" One employee told CNBC that they were shocked by Jensen Huang's revelations.\nPeople also told CNBC that longtime employees viewed Jensen Huang as an idol who could do no wrong and thought of him as a guiding light. Many employees at the company are also struggling to come to grips with the CEO's actions, the people said.\nJensen Huang co-founded Nvidia in 1993 to build graphics processing units for video game graphics. In recent years, the company has become synonymous with the AI boom, powering the technology that underpins large language models and the massive data center buildout.\nA central figure in the development of every AI layer, the Nvidia CEO is also a key voice in Washington, even accompanying President Donald Trump on his trip to China in May. In September, Jensen Huang and his wife were pictured at the same table as Chinese President Xi Jinping for the White House's state dinner.\nThe news of the CEO's affair has drawn increased scrutiny on his continued support for more AI chip sales to China.",
    "bodyJa": "Nvidia CEO Jensen Huang walked into the chipmaker's Santa Clara, California, headquarters on Monday and conducted his regular morning meeting with top-level executives, people familiar with the meeting told CNBC.\nOn Sunday, Huang had disclosed an extramarital affair to employees.\nHuang kicked off the closed-door gathering by addressing his infidelity and sharing how sorry he was to his staff, according to the people, who asked not to be named because they were not authorized to speak publicly. They said Huang didn't take any questions and quickly pivoted to business and top agenda items of the day.\nThe CEO was also in the office on Tuesday, conducting meetings just one week ahead of the company's quarterly earnings report.\nNvidia did not immediately respond to a request for comment.\nPeople inside the artificial intelligence chip giant said Huang tried to project \"business as usual,\" even as the probe moved forward into his affair with an alleged Chinese spy. The CEO was in a romantic relationship with Alice Huang, a former Megaspeed executive, according to The Financial Times.\nSentiment toward Jensen Huang shifted on Sunday after the 63-year-old revealed in an email to employees that he had an affair, though he did not disclose with whom he had the relationship.\n\"I know an apology cannot undo what I have done,\" he wrote. \"I hope our family will heal and that, over time, I can earn back your trust.\" Nvidia's board opened an investigation and hired Wachtell, Lipton, Rosen & Katz to conduct the probe on Tuesday.\nEmployees inside the firm described the mood to CNBC as \"sad.\" One employee told CNBC that they were shocked by Jensen Huang's revelations.\nPeople also told CNBC that longtime employees viewed Jensen Huang as an idol who could do no wrong and thought of him as a guiding light. Many employees at the company are also struggling to come to grips with the CEO's actions, the people said.\nJensen Huang co-founded Nvidia in 1993 to build graphics processing units for video game graphics. In recent years, the company has become synonymous with the AI boom, powering the technology that underpins large language models and the massive data center buildout.\nA central figure in the development of every AI layer, the Nvidia CEO is also a key voice in Washington, even accompanying President Donald Trump on his trip to China in May. In September, Jensen Huang and his wife were pictured at the same table as Chinese President Xi Jinping for the White House's state dinner.\nThe news of the CEO's affair has drawn increased scrutiny on his continued support for more AI chip sales to China.",
    "source": "CNBC",
    "sourceUrl": "https://www.cnbc.com/2026/11/10/nvidia-jensen-huang-affair-office.html",
    "publishedAt": "2026-11-10T23:11:34+00:00",
    "category": "テクノロジー",

  {
    "id": "schumer-accuses-trump-of-defending-nvidi-f16d8273",
    "title": "Schumer accuses Trump of defending Nvidia CEO Jensen Huang at cost of national security",
    "titleJa": "Schumer accuses Trump of defending Nvidia CEO Jensen Huang at cost of national security",
    "summaryJa": "Rep. John Moolenaar, R-Mich., the Republican chairman of the Select Committee on China, told CNBC he expects answers about Jensen Huang's relationship.",
    "bodyOriginal": "Democratic leader Sen. Charles Schumer ripped President Donald Trump on Tuesday for defending embattled Nvidia CEO Jensen Huang at the expense of U.S. national security.\n\"The press reports that Trump was briefed more than a year ago that Nvidia's CEO was having an affair with a suspected Chinese spy, and Trump didn't do anything – anything – about it,\" Schumer, D-N.Y., said on the Senate floor.\n\"Can you believe that?\" said Schumer, the Senate's minority leader.\nSchumer's broadside came on the heels of New York Times reports that Trump had been briefed about Huang's extramarital affair with Megaspeed executive Alice Huang — whom U.S. intelligence concluded was a spy for China — and opted not to do anything about it.\nTrump suggested to reporters on Monday that he only recently learned of the allegations about Alice Huang, and the president commented Monday that he \"really\" believes Jensen Huang's claim to him directly that he had no idea Alice Huang was a spy.\n\"One of our most important companies that is involved in national security, and the CEO might be having an affair with a Chinese spy, and Trump did nothing about it,\" Schumer said Tuesday.\n\"What a dereliction of duty. He's supposed to protect America, not China, not his friends,\" Schumer said. \"Trump has been busy trying to defend Jensen Huang when he ought to be defending our national security. It's that simple, it's obvious.\"\nSchumer's comments escalated growing bipartisan concern in Congress about the Nvidia CEO and his company. Nvidia makes advanced chips that are essential components in developing artificial intelligence models, a sector that is the focus of keen competition between the United States and China.\nSchumer noted that Trump earlier this year invited Huang to join him on a state visit to Beijing, and that he took Huang's advice by granting the People's Republic of China \"access to some of our most advanced AI chips.\"\nNvidia also donated $25 million to Trump's controversial White House ballroom project, the Democrat said.\n\"Despite talking a big game, Trump continues to show a troubling resistance to confront China on AI and to protect American national security,\" Schumer said. \"I've been saying it for years: our cutting-edge AI chips are too valuable to fall into the hands of potential adversaries.\"\nSchumer in his speech called on Republicans to join Democrats in passing several pieces of legislation — the AI Overwatch Act, the Match Act, and the Chip Security Act — which he said would \"cut off China's access to advanced American technology.\"\n\"We also need answers on Nvidia's influence campaign and how [it] affected the Trump administration's national security decisions, including the loosening – the loosening – of key export controls,\" Schumer said. \"We need a full accounting for Trump's failure to address foreign espionage in the American tech industry.\"\nCNBC has requested comment from the White House about Schumer's remarks.\nThe remarks came nearly a week after Democrats won enough Senate and House races nationwide to take majority control of both chambers of Congress in January. Schumer hopes to be selected majority leader.\nRegardless of which Democrats are tapped to serve as majority leaders in both chambers, the party will have the ability to launch investigations into Nvidia and Huang.\nEarlier Tuesday, Rep. John Moolenaar, R-Mich., said on CNBC's \"Squawk Box\" that Congress needs to \"get to the bottom\" of Jensen Huang's relationship with Alice Huang.\nMoolenaar, who chairs the House Permanent Select Committee on China, said he wants to know whether Huang shared privileged information with a Chinese spy; whether Huang was influenced to lobby against preventing chip sales to China; and whether China was given preference in purchasing Nvidia's limited supply of advanced chips.\nAnd he urged a thorough internal investigation of Huang.\n\"If it becomes less of an investigation, more of damage control, that's not going to work because people have to have confidence,\" Moolenaar said.\n\"We're dealing with the country, the Chinese Communist Party that is a foremost adversary, that's funding wars and supporting Russia, supporting Iran, North Korea,\" he said. \"And we have basically a Cold War race with technology. We cannot allow the premier company at the forefront of this to, in some way, be irresponsible.\"\nCongressional scrutiny of Huang's affair has intensified since members returned to Washington on Monday, a day after Nvidia announced it was opening an independent investigation into Jensen Huang's conduct.\nRep. Jay Obernolte, R-Calif., co-chair of the House AI task force, raised concerns that the scandal could plague talks over export controls for advanced AI chips.\n\"It's important not to have a personal scandal interfere with the substantive policy discussion about to what degree we should be allowing the export of cutting edge chips to our geopolitical competitors like China,\" Obernolte told CNBC. \"I hope this isn't a distraction because that's a very important conversation that needs to happen.\"\nHouse Minority Leader Hakeem Jeffries, D-N.Y., said at a news conference on Monday that \"we're going to need a full briefing specifically as it relates to the Nvidia issue so we can all get to the bottom of what has happened and what the implications are in terms of national security\"\nMoolenaar co-authored a letter with Florida Rep. Brian Mast and Arkansas Rep. Rick Crawford on Nov. 5 asking Huang to appear before the Select Committee on China, the House Foreign Affairs Committee and House Select Committee on Intelligence. Mast chairs the foreign affairs panel, and Crawford chairs intelligence.\n\"Recent reports raise significant national security concerns regarding the PRC's access to sensitive U.S. technology and information,\" the three Republicans wrote.\nMast said Tuesday he did not know whether Huang had responded to the letter he authored with Moolenar and Crawford demanding the tech CEO brief them.\n\"I can't say that I've heard an answer back yet that,\" Mast told reporters at the Capitol.\nMast then rattled off a list of questions he has for Huang, including where the company has been selling chips, what Megaspeed may have been using them for, who has been remotely accessing Nvidia chips, and what information was passed between Huang and the potential spy.\n\"Obviously questions relating to his relationship and what information was or was not passed about anything,\" Mast said when asked what he wants answered.\nMast said he \"can't say it would hurt\" to hear from the Commerce Department as well, noting he speaks regularly to the Bureau of Industry and Security.\n\"So that's obviously something that falls directly under Commerce,\" he said",
    "bodyJa": "Democratic leader Sen. Charles Schumer ripped President Donald Trump on Tuesday for defending embattled Nvidia CEO Jensen Huang at the expense of U.S. national security.\n\"The press reports that Trump was briefed more than a year ago that Nvidia's CEO was having an affair with a suspected Chinese spy, and Trump didn't do anything – anything – about it,\" Schumer, D-N.Y., said on the Senate floor.\n\"Can you believe that?\" said Schumer, the Senate's minority leader.\nSchumer's broadside came on the heels of New York Times reports that Trump had been briefed about Huang's extramarital affair with Megaspeed executive Alice Huang — whom U.S. intelligence concluded was a spy for China — and opted not to do anything about it.\nTrump suggested to reporters on Monday that he only recently learned of the allegations about Alice Huang, and the president commented Monday that he \"really\" believes Jensen Huang's claim to him directly that he had no idea Alice Huang was a spy.\n\"One of our most important companies that is involved in national security, and the CEO might be having an affair with a Chinese spy, and Trump did nothing about it,\" Schumer said Tuesday.\n\"What a dereliction of duty. He's supposed to protect America, not China, not his friends,\" Schumer said. \"Trump has been busy trying to defend Jensen Huang when he ought to be defending our national security. It's that simple, it's obvious.\"\nSchumer's comments escalated growing bipartisan concern in Congress about the Nvidia CEO and his company. Nvidia makes advanced chips that are essential components in developing artificial intelligence models, a sector that is the focus of keen competition between the United States and China.\nSchumer noted that Trump earlier this year invited Huang to join him on a state visit to Beijing, and that he took Huang's advice by granting the People's Republic of China \"access to some of our most advanced AI chips.\"\nNvidia also donated $25 million to Trump's controversial White House ballroom project, the Democrat said.\n\"Despite talking a big game, Trump continues to show a troubling resistance to confront China on AI and to protect American national security,\" Schumer said. \"I've been saying it for years: our cutting-edge AI chips are too valuable to fall into the hands of potential adversaries.\"\nSchumer in his speech called on Republicans to join Democrats in passing several pieces of legislation — the AI Overwatch Act, the Match Act, and the Chip Security Act — which he said would \"cut off China's access to advanced American technology.\"\n\"We also need answers on Nvidia's influence campaign and how [it] affected the Trump administration's national security decisions, including the loosening – the loosening – of key export controls,\" Schumer said. \"We need a full accounting for Trump's failure to address foreign espionage in the American tech industry.\"\nCNBC has requested comment from the White House about Schumer's remarks.\nThe remarks came nearly a week after Democrats won enough Senate and House races nationwide to take majority control of both chambers of Congress in January. Schumer hopes to be selected majority leader.\nRegardless of which Democrats are tapped to serve as majority leaders in both chambers, the party will have the ability to launch investigations into Nvidia and Huang.\nEarlier Tuesday, Rep. John Moolenaar, R-Mich., said on CNBC's \"Squawk Box\" that Congress needs to \"get to the bottom\" of Jensen Huang's relationship with Alice Huang.\nMoolenaar, who chairs the House Permanent Select Committee on China, said he wants to know whether Huang shared privileged information with a Chinese spy; whether Huang was influenced to lobby against preventing chip sales to China; and whether China was given preference in purchasing Nvidia's limited supply of advanced chips.\nAnd he urged a thorough internal investigation of Huang.\n\"If it becomes less of an investigation, more of damage control, that's not going to work because people have to have confidence,\" Moolenaar said.\n\"We're dealing with the country, the Chinese Communist Party that is a foremost adversary, that's funding wars and supporting Russia, supporting Iran, North Korea,\" he said. \"And we have basically a Cold War race with technology. We cannot allow the premier company at the forefront of this to, in some way, be irresponsible.\"\nCongressional scrutiny of Huang's affair has intensified since members returned to Washington on Monday, a day after Nvidia announced it was opening an independent investigation into Jensen Huang's conduct.\nRep. Jay Obernolte, R-Calif., co-chair of the House AI task force, raised concerns that the scandal could plague talks over export controls for advanced AI chips.\n\"It's important not to have a personal scandal interfere with the substantive policy discussion about to what degree we should be allowing the export of cutting edge chips to our geopolitical competitors like China,\" Obernolte told CNBC. \"I hope this isn't a distraction because that's a very important conversation that needs to happen.\"\nHouse Minority Leader Hakeem Jeffries, D-N.Y., said at a news conference on Monday that \"we're going to need a full briefing specifically as it relates to the Nvidia issue so we can all get to the bottom of what has happened and what the implications are in terms of national security\"\nMoolenaar co-authored a letter with Florida Rep. Brian Mast and Arkansas Rep. Rick Crawford on Nov. 5 asking Huang to appear before the Select Committee on China, the House Foreign Affairs Committee and House Select Committee on Intelligence. Mast chairs the foreign affairs panel, and Crawford chairs intelligence.\n\"Recent reports raise significant national security concerns regarding the PRC's access to sensitive U.S. technology and information,\" the three Republicans wrote.\nMast said Tuesday he did not know whether Huang had responded to the letter he authored with Moolenar and Crawford demanding the tech CEO brief them.\n\"I can't say that I've heard an answer back yet that,\" Mast told reporters at the Capitol.\nMast then rattled off a list of questions he has for Huang, including where the company has been selling chips, what Megaspeed may have been using them for, who has been remotely accessing Nvidia chips, and what information was passed between Huang and the potential spy.\n\"Obviously questions relating to his relationship and what information was or was not passed about anything,\" Mast said when asked what he wants answered.\nMast said he \"can't say it would hurt\" to hear from the Commerce Department as well, noting he speaks regularly to the Bureau of Industry and Security.\n\"So that's obviously something that falls directly under Commerce,\" he said",
