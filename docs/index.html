    "bodyOriginal": "The U.S. halted flight departures across the country for hours on Friday for the second time since 9/11, blaming aging technology that was overloaded, affecting key information for multiple air traffic control centers.\nMore than 10,000 flights were disrupted during the nationwide ground stop, and delays and cancellations were set to stretch into the weekend, if not longer.\nTransportation Secretary Sean Duffy said at a press conference late Friday that that telecommunications routers were overloaded with data. \"They went down,\" he said.\nHomeland Security Secretary Markwayne Mullin said Friday at the White House that there was no indication that the issues were a threat to the United States. He later said at a press conference that it doesn't appear to be a cyber attack, and that it \"appears this was mechanically driven.\"\nThe Federal Aviation Administration canceled the ground stop at 8:15 p.m. ET Friday after it lasted formore than four hours and disrupted the travel plans of hundreds of thousands of travelers, including some sports teams.\nThe agency earlier said in post on X that there was a \"temporary telecommunications outage\" and that it halted flights out of an \"abundance of caution.\"\nWhen it issued the ground stop at about 4 p.m., the FAA said the communications issues were \"impacting multiple Air Route Traffic Control Centers.\" These facilities guide airplanes at high altitudes along their routes.\nWhile the FAA lifted the ground stop, travel chaos continued at airports, which were forced to find places for parked planes. Delays were set to continue even as flights start taking off again.\nCarriers canceled more flights as the disruption wore on. JetBlue Airways told staff it would cancel the remainder of the day's flights, aside from European routes, as well as others scheduled for Saturday so that crews and planes are in place to resume operations, according to a memo seen by CNBC.\nA ground stop halts flights at their departure point. Disruptions tend to snowball if ground stops drag on as flight crews reach their maximum number of duty hours for a day.\nThere were 11,000 flights scheduled to depart U.S. airports after 4 p.m. ET on Friday, according to flight-data firm Cirium, with 1.5 million passengers. There were about 600 diverted flights on Friday, 104 of them sent to other airports, Cirium said.\nInternational flights had started taking off from coastal hubs before 6 p.m. ET.\nThe FAA said earlier in the night that flights will be allowed to depart as en route traffic facilities recover, \"through coordination with the air traffic control system.\"\nThe FAA's technicians are investigating, the agency said.\nNationwide ground stops are extremely rare. In January 2023, the FAA halted flights because of issues with a pilot alert system. Before that, traffic was halted nationwide after the Sept. 11, 2001, terror attacks.\nAging technology\nTechnical issues have repeatedly snarled air traffic in the U.S. in recent years. Aging infrastructure and staffing shortages have angered airline executives for years.\nIn September, hundreds of flights into Newark, New Jersey, and Philadelphia were canceled, delayed or diverted after a Verizon fiber cable was accidentally cut. Officials said it occurred during construction in New Jersey, severing a backup feed of key data for air traffic controllers.\nIn 2025, air traffic controllers lost contact with aircraft heading to and from Newark Liberty International Airport, an equipment failure that led to massive flight delays and raised more concerns about aging U.S. aviation infrastructure and staffing shortages.\n\"It's going to continue to fail,\" Duffy said Friday of U.S. air traffic control infrastructure. The U.S. is in the middle of an overhaul of the technology, and Duffy urged lawmakers for more funding.\nInbound international flights will be managed on a case by case basis, the FAA said.\nThe major U.S. airlines issued statements saying they would work with customers who were affected by the ground stop and encouraged travelers to check for updates.\n— CNBC's Kevin Breuninger and Phil LeBeau contributed to this article.",

ould work with customers who were affected by the ground stop and encouraged travelers to check for updates.\n— CNBC's Kevin Breuninger and Phil LeBeau contributed to this article.",

    "id": "trump-doesn-t-plan-to-raise-nvidia-spy-i-007e0f59",
    "title": "Trump doesn’t plan to raise Nvidia, spy issue during China trip: U.S. officials",
    "titleJa": "Trump doesn’t plan to raise Nvidia, spy issue during China trip: U.S. officials",
    "summaryJa": "Nvidia CEO Jensen Huang resigned this week after reports of multiple affairs, including one with a suspected Chinese spy, Alice Huang.",
    "bodyOriginal": "President Donald Trump is not expected to raise allegations of a Chinese intelligence operation involving former Nvidia CEO Jensen Huang during his upcoming meeting with Chinese President Xi Jinping, senior U.S. officials said Friday.\nOfficials also said that Elon Musk, the CEO of Tesla and SpaceX, will accompany Trump on the trip to Shenzhen, China, for the Asia-Pacific Economic Cooperation summit on Nov. 18 and 19.\nThe White House, earlier Friday, said Trump plans to have a three-way summit there with Xi and Russian President Vladimir Putin.\nJensen Huang's relationship with the suspected spy, Alice Huang, who is not related to him, has raised concerns that a Singapore-based company where she was an executive diverted restricted Nvidia chips to China.\n\"The situation with Nvidia should not really have any bearing on the trip,\" an official said on the press call, speaking on the condition that they not be identified.\n\"In all of our discussions and negotiations with the Chinese, we do not negotiate American export controls ... and we don't expect it to figure at all in any of our conversations with the Chinese while we're there.\"\nAsked if Trump would raise the allegations against Alice Huang to Chinese leader Xi Jinping, the official said, \"The focus of a meeting with President Xi, at least on the economic side, is going to be about implementation of the trade agreement.\"\n\"When it comes to some of these national security matters and examinations and investigations that are going on in the U.S., [that is] probably not something that we're going to read the Chinese in on at this moment,\" the official said.\nAnother official said, \"I don't expect the president to raise it — the Alice Huang issue.\"\nChina has called the allegations against Alice Huang baseless.\nHuang resigned this week as Nvidia's CEO after damning reports that he had an affair with Alice Huang, who was an executive of Megaspeed, a cloud-computing company that is being eyed for possible facilitation of sending billions of dollars worth of Nvidia chips in violation of U.S. restrictions on those chips.\nThe scandal has rocked Nvidia and raised questions about whether the Commerce Department, which is led by Howard Lutnick, has been aggressive enough at blocking advanced chips from ending up in China.\nDuring Friday's call, a reporter asked why Musk was going on the trip with Trump.\n\"I don't want to speak for the president on exactly why Elon's going,\" an official said.\n\"Obviously, he has tremendous business interests in the U.S.-China relationship. He's a big part of our national security,\" the official said. \"There are numerous reasons, given the engagement that the president is going to have, where I think Elon would be of tremendous benefit, just even as an advisor to the president.\"",

d for possible facilitation of sending billions of dollars worth of Nvidia chips in violation of U.S. restrictions on those chips.\nThe scandal has rocked Nvidia and raised questions about whether the Commerce Department, which is led by Howard Lutnick, has been aggressive enough at blocking advanced chips from ending up in China.\nDuring Friday's call, a reporter asked why Musk was going on the trip with Trump.\n\"I don't want to speak for the president on exactly why Elon's going,\" an official said.\n\"Obviously, he has tremendous business interests in the U.S.-China relationship. He's a big part of our national security,\" the official said. \"There are numerous reasons, given the engagement that the president is going to have, where I think Elon would be of tremendous benefit, just even as an advisor to the president.\"",

    "id": "spacex-launches-starship-in-key-test-fli-f7d6831c",
    "title": "SpaceX launches Starship in key test flight of massive rocket",
    "titleJa": "SpaceX launches Starship in key test flight of massive rocket",
    "summaryJa": "The test flight is SpaceX's first attempt to ​catch both the Super Heavy booster and upper stage spacecraft of the rocket at its launch site in Starbase, Texas.",
    "bodyOriginal": "In a key test flight on Friday, SpaceX tried but failed to recover both stages of its massive Starship rocket.\nThe rocket lifted off from the company's South Texas launch facility at 4:47 p.m. local time, or 5:47 p.m. ET. SpaceX had to abort its plans to catch and reuse the booster, instead diverting it to splash into the Gulf of Mexico, where it burst into flames.\nTest Flight 15, the most ambitious Starship mission to date, was the first time Elon Musk's company attempted to catch both the booster and upper stage, or spacecraft portion, of the massive rocket.\nEarlier on Friday, SpaceX obtained authorization from the Federal Aviation Administration. Hours later, the FAA issued a nationwide ground stop after reporting communication problems affecting \"multiple\" air traffic control centers. The SpaceX license wasn't effected by the flight stoppage, a spokesperson for the FAA told CNBC.\nThe upper stage of the Starship continued its trajectory into orbit after the company failed to catch and salvage the booster. The rocket is expected to fly around the Earth fourteen times in total. If successful, SpaceX will land the upper stage back at its Starbase facility on Saturday.\nStarship's success is critical to SpaceX and its ambitions to eventually lift cargo and people to the surface of the Moon and Mars. In the near-term, SpaceX needs to send more satellites into orbit to expands its Starlink satellite internet service, which is currently the company's profit center.\nThe company's constellation already includes over 11,000 active satellites in low Earth orbit. One Starship rocket has the capacity to carry up to 60 Starlink v3 satellites into orbit, the company has said, representing about 20 times the capacity of earlier Falcon 9 rockets.\nIn the previous Starship test flight, the company released 26 v3 satellites, and released another 26 in the Friday test flight, with the goal of \"Starlink becoming 51% of the internet,\" SpaceX said in a post on X.\nWhen it comes to launches, \"SpaceX is likely a full decade ahead of peers on this front,\" William Blair analysts wrote in a note out on Friday. \"Even if tonight's catch is unsuccessful, a delay by a few months is not that consequential.\"\nMeanwhile, SpaceX is facing fresh criticism over restrictions imposed on its Starshield satellite internet service in Ukraine. Starshield is built on Starlink technology and is the military-tier of SpaceX's satellite internet service.\nEarlier this week, Ukraine President Volodymyr Zelenskyy said his country's military forces had experienced limits on Starshield without warning again, harming their ability to defend against Russia's ongoing aerial attacks. Similar limits on Starshield in Ukraine were temporarily imposed last month.\nSome U.S. senators have condemned the restrictions, and urged Congress to investigate SpaceX.",
    "bodyJa": "In a key test flight on Friday, SpaceX tried but failed to recover both stages of its massive Starship rocket.\nThe rocket lifted off from the company's South Texas launch facility at 4:47 p.m. local time, or 5:47 p.m. ET. SpaceX had to abort its plans to catch and reuse the booster, instead diverting it to splash into the Gulf of Mexico, where it burst into flames.\nTest Flight 15, the most ambitious Starship mission to date, was the first time Elon Musk's company attempted to catch both the booster and upper stage, or spacecraft portion, of the massive rocket.\nEarlier on Friday, SpaceX obtained authorization from the Federal Aviation Administration. Hours later, the FAA issued a nationwide ground stop after reporting communication problems affecting \"multiple\" air traffic control centers. The SpaceX license wasn't effected by the flight stoppage, a spokesperson for the FAA told CNBC.\nThe upper stage of the Starship continued its trajectory into orbit after the company failed to catch and salvage the booster. The rocket is expected to fly around the Earth fourteen times in total. If successful, SpaceX will land the upper stage back at its Starbase facility on Saturday.\nStarship's success is critical to SpaceX and its ambitions to eventually lift cargo and people to the surface of the Moon and Mars. In the near-term, SpaceX needs to send more satellites into orbit to expands its Starlink satellite internet service, which is currently the company's profit center.\nThe company's constellation already includes over 11,000 active satellites in low Earth orbit. One Starship rocket has the capacity to carry up to 60 Starlink v3 satellites into orbit, the company has said, representing about 20 times the capacity of earlier Falcon 9 rockets.\nIn the previous Starship test flight, the company released 26 v3 satellites, and released another 26 in the Friday test flight, with the goal of \"Starlink becoming 51% of the internet,\" SpaceX said in a post on X.\nWhen it comes to launches, \"SpaceX is likely a full decade ahead of peers on this front,\" William Blair analysts wrote in a note out on Friday. \"Even if tonight's catch is unsuccessful, a delay by a few months is not that consequential.\"\nMeanwhile, SpaceX is facing fresh criticism over restrictions imposed on its Starshield satellite internet service in Ukraine. Starshield is built on Starlink technology and is the military-tier of SpaceX's satellite internet service.\nEarlier this week, Ukraine President Volodymyr Zelenskyy said his country's military forces had experienced limits on Starshield without warning again, harming their ability to defend against Russia's ongoing aerial attacks. Similar limits on Starshield in Ukraine were temporarily imposed last month.\nSome U.S. senators have condemned the restrictions, and urged Congress to investigate SpaceX.",

    "id": "nvidia-is-done-with-jensen-huang-the-fal-5b538cd5",
    "title": "Nvidia is done with Jensen Huang. The fallout in Washington is just beginning",
    "titleJa": "Nvidia is done with Jensen Huang. The fallout in Washington is just beginning",
    "summaryJa": "The Republican-led Congress wants to see Jensen Huang in Washington before Democrats take control in January.",
    "bodyOriginal": "Jensen Huang is out at Nvidia. Washington is just getting started with him and the company he co-founded.\nHuang, the leather-jacket-clad CEO of the world's most important chipmaker, resigned from Nvidia on Thursday after revelations that he had an affair with a suspected Chinese spy. But the spy saga is gripping Washington, and lawmakers are preparing for investigations into how the now-ex-CEO's affair may have damaged U.S. artificial intelligence dominance, the national security implications and the executive's close relationship with President Donald Trump and his Cabinet.\nRepublicans will have their chance first during their last six weeks controlling both chambers of Congress. GOP leaders immediately summoned Huang to Capitol Hill and said they would subpoena him if he doesn't agree to show up. In January, Democrats, who are already eager to make their mark with oversight when they take over the U.S. House and Senate, will be in the driver's seat.\n\"In this environment where there's some really high stakes when it comes to our national security, I would expect there would be some follow-up, yeah,\" Senate Majority Leader John Thune, R-S.D., told reporters at the Capitol on Thursday.\nHuang and the woman with whom he reportedly had a relationship, Alice Huang, an executive at the Singaporean technology company Megaspeed and an alleged Chinese spy have drawn congressional attention. And Commerce Secretary Howard Lutnick has drawn fire after reports this week that he stalled President Donald Trump's crackdowns on firms routing Nvidia chips to China.\nSome Congress members have also called for an investigation into the role of the Bureau of Industry and Security, a subagency of the Commerce Department that manages and enforces export controls, in the Huang scandal.\nThe New York Times reported on Monday that Nvidia's general counsel, Tim Teter, claimed in emails to Commerce investigators probing Alice Huang's company that he'd been in touch with Jeffrey Kessler, who leads BIS. The Commerce investigation into Megaspeed, which allegedly smuggled restricted chips to China, was then transferred to the Justice Department.\nBy Thursday night, Senate banking committee Chair Tim Scott, R-S.C., summoned both Huang and Lutnick to testify before his committee in December. Later that same night, Lutnick had \"proactively agreed to appear voluntarily before the Banking Committee to address their questions,\" Kristen Eichamer, a Commerce Department spokesperson, said in a statement.\nScott threatened to subpoena Huang if he does not appear. A banking panel spokesperson did not immediately respond Friday morning when asked if they'd heard from Huang.\n\"Recent reports raise serious concerns about our national security and the protection of sensitive U.S. technology,\" Scott wrote to Huang. \"The American people deserve answers.\"\nAnd with Democrats poised to take control of both chambers come January, the tech mogul's close ties to the White House will add fuel to an already burning fire as the new majority spools up myriad investigations into the Trump administration.\nSenate Minority Leader Chuck Schumer, D-N.Y., in a post to X on Thursday, said \"Congress must demand answers from Mr. Huang and others at Nvidia about how they may have put U.S. national security at risk.\" Schumer is in a contested race to become Senate majority leader in the next Congress.\nThe senators who will lead those investigations, and hold subpoena power in the new Congress, are gearing up for Nvidia to take center stage.\nSen. Elizabeth Warren, D-Mass., the likely incoming chair of the Senate banking panel, said in a statement Thursday that \"Mr. Huang, NVIDIA executives, and NVIDIA's board of directors still owe Congress answers about the company's compliance with U.S. export controls\nWarren and Sen. Chris Coons, D-Del., the top Democrat on the Senate Foreign Relations subpanel with jurisdiction over East Asia and the Pacific, sent a letter Wednesday to Lutnick, Secretary of State Marco Rubio and White House Chief of Staff Stephen Miller instructing them to preserve all documents and communications related to Nvidia's exports of \"advanced AI chips to China or to entities that may divert such chips to China.\"\nEven before Democrats take control in January, Huang is expected to appear before Congress.\nHouse Foreign Affairs Committee Chair Brian Mast, R-Fla., is actively negotiating for Huang to testify before House committees and told reporters Thursday the Nvidia CEO has agreed to appear in the coming weeks.\nDetails of that testimony are still being worked out, Mast said. It would likely include his committee, as well as the House intelligence panel and the House Permanent Select Committee on China, and it would be under oath and transcribed. It's not clear at this point whether it would be public.\n\"We want to see him basically in a week … Sooner rather than later,\" Mast told reporters Thursday, adding that he believed it would happen before Thanksgiving.\nIf Huang doesn't willingly appear, Mast said he will subpoena him.\nMast, along with House Select China Committee Chair Rep. John Moolenaar, R-Mich., and House Intelligence Committee Chair Rep. Rick Crawford, R-Ark., sent a second request Thursday to Huang and Teter requesting they appear and giving them an 8 p.m. ET Friday deadline to respond. Mast also sent a second request to Kessler.\nRep. Josh Gottheimer, D-N.J., a member of the House Intelligence Committee, said Friday during an appearance on CNBC's \"The Exchange\" that he wants answers from Huang on the national security and export implications of the affair.\n\"From an intelligence committee perspective, you can imagine from an AI perspective, how important this is for our national security, for our critical infrastructure and understand when it comes to chip policy, what exactly got to China and ... did Megaspeed divert chips?\" Gottheimer said.\nThe calls for immediate investigation into Huang and Nvidia on the day of his resignation represent a stunning fall from grace in the halls of power for the former CEO. Huang was one of the most effective voices for the AI industry in Washington — able to toggle between leveraging his relationship with Trump and defending his industry from fears about AI's risks to lawmakers.\n\"He is always the TED Talk guy,\" one senior Democratic staff member who was granted anonymity to describe private meetings they had attended with Huang, told CNBC. \"He's really good and articulate, and really good at explaining why AI is important and why it's so important for the United States to be leading here.\"\nThe staffer said Huang was a \"happy warrior\" for AI, and stayed longer than scheduled or anticipated for questions from lawmakers. But in the meetings with lawmakers the aide attended, they said Huang did not aggressively push against export controls or get too \"deep in the weeds\" to really \"lobby one way or the other\" with the lawmakers.\nHuang has repeatedly resisted export controls publicly, a move that has rubbed some lawmakers the wrong way.\nSome lawmakers even lamented the loss of Huang, despite the inevitable buzzsaw he now faces on Capitol Hill.\n\"It's just sad all around,\" Sen. John Fetterman, D-Pa., said of Huang's resignation.",
    "bodyJa": "Jensen Huang is out at Nvidia. Washington is just getting started with him and the company he co-founded.\nHuang, the leather-jacket-clad CEO of the world's most important chipmaker, resigned from Nvidia on Thursday after revelations that he had an affair with a suspected Chinese spy. But the spy saga is gripping Washington, and lawmakers are preparing for investigations into how the now-ex-CEO's affair may have damaged U.S. artificial intelligence dominance, the national security implications and the executive's close relationship with President Donald Trump and his Cabinet.\nRepublicans will have their chance first during their last six weeks controlling both chambers of Congress. GOP leaders immediately summoned Huang to Capitol Hill and said they would subpoena him if he doesn't agree to show up. In January, Democrats, who are already eager to make their mark with oversight when they take over the U.S. House and Senate, will be in the driver's seat.\n\"In this environment where there's some really high stakes when it comes to our national security, I would expect there would be some follow-up, yeah,\" Senate Majority Leader John Thune, R-S.D., told reporters at the Capitol on Thursday.\nHuang and the woman with whom he reportedly had a relationship, Alice Huang, an executive at the Singaporean technology company Megaspeed and an alleged Chinese spy have drawn congressional attention. And Commerce Secretary Howard Lutnick has drawn fire after reports this week that he stalled President Donald Trump's crackdowns on firms routing Nvidia chips to China.\nSome Congress members have also called for an investigation into the role of the Bureau of Industry and Security, a subagency of the Commerce Department that manages and enforces export controls, in the Huang scandal.\nThe New York Times reported on Monday that Nvidia's general counsel, Tim Teter, claimed in emails to Commerce investigators probing Alice Huang's company that he'd been in touch with Jeffrey Kessler, who leads BIS. The Commerce investigation into Megaspeed, which allegedly smuggled restricted chips to China, was then transferred to the Justice Department.\nBy Thursday night, Senate banking committee Chair Tim Scott, R-S.C., summoned both Huang and Lutnick to testify before his committee in December. Later that same night, Lutnick had \"proactively agreed to appear voluntarily before the Banking Committee to address their questions,\" Kristen Eichamer, a Commerce Department spokesperson, said in a statement.\nScott threatened to subpoena Huang if he does not appear. A banking panel spokesperson did not immediately respond Friday morning when asked if they'd heard from Huang.\n\"Recent reports raise serious concerns about our national security and the protection of sensitive U.S. technology,\" Scott wrote to Huang. \"The American people deserve answers.\"\nAnd with Democrats poised to take control of both chambers come January, the tech mogul's close ties to the White House will add fuel to an already burning fire as the new majority spools up myriad investigations into the Trump administration.\nSenate Minority Leader Chuck Schumer, D-N.Y., in a post to X on Thursday, said \"Congress must demand answers from Mr. Huang and others at Nvidia about how they may have put U.S. national security at risk.\" Schumer is in a contested race to become Senate majority leader in the next Congress.\nThe senators who will lead those investigations, and hold subpoena power in the new Congress, are gearing up for Nvidia to take center stage.\nSen. Elizabeth Warren, D-Mass., the likely incoming chair of the Senate banking panel, said in a statement Thursday that \"Mr. Huang, NVIDIA executives, and NVIDIA's board of directors still owe Congress answers about the company's compliance with U.S. export controls\nWarren and Sen. Chris Coons, D-Del., the top Democrat on the Senate Foreign Relations subpanel with jurisdiction over East Asia and the Pacific, sent a letter Wednesday to Lutnick, Secretary of State Marco Rubio and White House Chief of Staff Stephen Miller instructing them to preserve all documents and communications related to Nvidia's exports of \"advanced AI chips to China or to entities that may divert such chips to China.\"\nEven before Democrats take control in January, Huang is expected to appear before Congress.\nHouse Foreign Affairs Committee Chair Brian Mast, R-Fla., is actively negotiating for Huang to testify before House committees and told reporters Thursday the Nvidia CEO has agreed to appear in the coming weeks.\nDetails of that testimony are still being worked out, Mast said. It would likely include his committee, as well as the House intelligence panel and the House Permanent Select Committee on China, and it would be under oath and transcribed. It's not clear at this point whether it would be public.\n\"We want to see him basically in a week … Sooner rather than later,\" Mast told reporters Thursday, adding that he believed it would happen before Thanksgiving.\nIf Huang doesn't willingly appear, Mast said he will subpoena him.\nMast, along with House Select China Committee Chair Rep. John Moolenaar, R-Mich., and House Intelligence Committee Chair Rep. Rick Crawford, R-Ark., sent a second request Thursday to Huang and Teter requesting they appear and giving them an 8 p.m. ET Friday deadline to respond. Mast also sent a second request to Kessler.\nRep. Josh Gottheimer, D-N.J., a member of the House Intelligence Committee, said Friday during an appearance on CNBC's \"The Exchange\" that he wants answers from Huang on the national security and export implications of the affair.\n\"From an intelligence committee perspective, you can imagine from an AI perspective, how important this is for our national security, for our critical infrastructure and understand when it comes to chip policy, what exactly got to China and ... did Megaspeed divert chips?\" Gottheimer said.\nThe calls for immediate investigation into Huang and Nvidia on the day of his resignation represent a stunning fall from grace in the halls of power for the former CEO. Huang was one of the most effective voices for the AI industry in Washington — able to toggle between leveraging his relationship with Trump and defending his industry from fears about AI's risks to lawmakers.\n\"He is always the TED Talk guy,\" one senior Democratic staff member who was granted anonymity to describe private meetings they had attended with Huang, told CNBC. \"He's really good and articulate, and really good at explaining why AI is important and why it's so important for the United States to be leading here.\"\nThe staffer said Huang was a \"happy warrior\" for AI, and stayed longer than scheduled or anticipated for questions from lawmakers. But in the meetings with lawmakers the aide attended, they said Huang did not aggressively push against export controls or get too \"deep in the weeds\" to really \"lobby one way or the other\" with the lawmakers.\nHuang has repeatedly resisted export controls publicly, a move that has rubbed some lawmakers the wrong way.\nSome lawmakers even lamented the loss of Huang, despite the inevitable buzzsaw he now faces on Capitol Hill.\n\"It's just sad all around,\" Sen. John Fetterman, D-Pa., said of Huang's resignation.",

    "id": "microsoft-deeply-sorry-for-global-outage-51201e7d",
    "title": "Microsoft 'deeply sorry' for global outage as it reports broad recovery",
    "titleJa": "Microsoft 'deeply sorry' for global outage as it reports broad recovery",
    "summaryJa": "Experts say the event is a \"stark reminder\" of how heavily the world relies on a small group of big tech providers.",
    "bodyOriginal": "Microsoft 'deeply sorry' for global outage as it reports broad recovery\n- Published\nMicrosoft has said it is \"deeply sorry\" for the service outage to its products, including Outlook and Teams, which has caused disruption around the world.\nServices were broadly recovering by Friday afternoon, nearly 24 hours after issues began. Microsoft said it was making \"encouraging progress\", but added it does not know when services will fully recover.\nThe outage hit more than 70 countries, disrupting everything from business operations to government services and personal users. More than 430 million people use the affected products worldwide.\nMicrosoft said it was a technical issue introduced during a \"network capacity upgrade\" and not related to cyber or artificial intelligence agents.\nExperts said the event was a \"stark reminder\" of how heavily businesses and vital services rely on a small group of big tech providers.\nUsers began reporting they were having trouble accessing Microsoft 365 products on Thursday.\nBy Friday, the far-reaching issue was affecting institutions from the Japanese government and the Philippines Supreme Court to the Australian spy agency, and trains, hospitals and courts in North America.\nWhy is Microsoft's outage lasting so long and will emails be lost?\n- Published11 hours ago\nCourts, spies and MPs: How the Microsoft outage has been felt around the world\n- Published12 hours ago\nIn the UK, some parts of the NHS, including GPs and hospitals, were affected, as were some schools and police forces.\nUK cyber minister Liz Lloyd said the incident had \"limited\" impact on critical frontline services such as 999 calls, and there had been no disruption to the transport network.\nIn Canada, however, the national rail network said passengers may not be able to receive email updates about their trips, and hospitals across the country also had issues with emails.\nIn the US, staff members from the House of Representatives told Politico it had set back an entire day of legislative work as everything was on Microsoft's Outlook.\nSingapore's government acknowledged some of its systems had been impacted, and in India, the outage disrupted work for many on Friday.\nIn Turkey, advisers and officials attending the COP31 climate summit in Antalya were left frustrated by being unable to access Outlook.\nThe issues also affected smaller businesses and individuals.\nPeter Pentz, a winemaker in South Africa, said his entire business was basically brought to a \"standstill\".\nHis winery's communication with exports was also brought to a standstill, he said, and \"critical production work\" was been halted as the Cape West Coast winery \"relies on these systems for parts of our day-to-day operations\".\nGeorgia from Staffordshire in England said she was due to complete her first house purchase today after waiting eight months to get to this point - but the outage has delayed that.\n\"The solicitor mentioned there may be a delay due to not being able to contact other agencies.\n\"We're not the only one completing today, there are hundreds of houses and for them to ring everyone in time is unfeasible,\" Georgia said.\n'Encouraging recovery signals'\nMicrosoft first acknowledged users in the Americas were unable to access Exchange Online mailboxes at 17:54 GMT on Thursday, and shortly after warned the disruption was possibly affecting Microsoft 365 globally.\nWhile it launched an investigation and engineers began working to restore services, by 04:36 on Friday Microsoft was reporting only a \"partial recovery\" in some parts of the world.\nBy 13:32, the tech giant said there were \"broader improvements\" in North America, \"sustained improvements\" across much of Europe and \"encouraging recovery signals\" in the Asia Pacific region.\nMicrosoft said it restored services gradually due to the scale of the problem and to help ensure services remain stable once they are up and running again.\n\"We are deeply sorry for the disruption this incident has caused our customers and partners,\" a Microsoft spokesperson said.\n\"We know the trust they place in our services and take that responsibility extremely seriously.\"\nMicrosoft said it has no \"ETA\" for when services will be fully recovered.\nA full post-incident report will be released once Microsoft has completed a review.\nExperts said while workers may have been happy to not have email access for the day, the incident showed the dependence many organisations have on these cloud-based services.\n\"The global Microsoft outage is a stark reminder of how heavily we rely on a handful of big tech providers,\" said Rob Demain, chief executive of cybersecurity firm e2e-assure.\nMatt Saunders, field chief technology officer at tech consultancy Adaptavist, said it would be challenging to mitigate against a similar problem.\n\"Classic IT disaster planning strategies suggest using a second service for resilience, but in practice, it's almost impossible for a business to function without tools such as Microsoft,\" he said.\n\"In the wake of this outage, organisations must have a plan in place for how to work without such tools, for when incidents like this occur.\"\nRelated topics\n- Published8 hours ago\n- Published12 hours ago",

    "id": "supreme-court-will-hear-robinhood-effort-80fe6669",
    "title": "Supreme Court will hear Robinhood effort to toss IPO info omissions lawsuit",
    "titleJa": "Supreme Court will hear Robinhood effort to toss IPO info omissions lawsuit",
    "summaryJa": "The Trump administration had urged the Supreme Court to hear an appeal by Robinhood of a lower-court's decision to revive an investors' lawsuit over the IPO.",
    "bodyOriginal": "The Supreme Court on Friday agreed to consider an effort by Robinhood to block a class-action lawsuit over the company's omission of interim financial data from the online broker's initial public offering in 2021.\nRobinhood wants the Supreme Court to overturn a ruling by the 9th Circuit U.S. Court of Appeals that revived a lawsuit by investors against the company and firms involved with the IPO, including Goldman Sachs and J.P. Morgan Securities.\nA San Francisco federal court judge had previously dismissed the lawsuit.\nThe Trump administration had urged the Supreme Court to hear Robinhood's appeal.\nIn its order granting Robinhood's request, the Supreme Court said it would focus solely on the question of whether a company that issues stock can be found liable under the misleading-omissions prong of Section 11(a) of the Securities Act of 1933 based on a determination that the issuer failed to disclose interim financial information that is material within the meaning of Section 11(a), without an additional inquiry to determine whether the omission rendered any affirmative statement misleading.\nRobinhood's IPO came on the heels of a surge in investor interest during the Covid-19 pandemic of so-called meme stocks, and trading in the crypto asset Dogecoin.\nIn July 2021, Robinhood conducted its IPO, \"for which it prepared a registration statement\" that \"contained only limited information about Robinhood's performance during the second quarter of 2021,\" the 9th Circuit panel that heard the case noted.\n\"After the initial public offering, Robinhood reported financial results from that second quarter, and its stock price dropped,\" the panel wrote.\nThe investors who sued Robinhood and the other defendants alleged that the registration statement omitted material information that was legally required to be disclosed.",
    "bodyJa": "The Supreme Court on Friday agreed to consider an effort by Robinhood to block a class-action lawsuit over the company's omission of interim financial data from the online broker's initial public offering in 2021.\nRobinhood wants the Supreme Court to overturn a ruling by the 9th Circuit U.S. Court of Appeals that revived a lawsuit by investors against the company and firms involved with the IPO, including Goldman Sachs and J.P. Morgan Securities.\nA San Francisco federal court judge had previously dismissed the lawsuit.\nThe Trump administration had urged the Supreme Court to hear Robinhood's appeal.\nIn its order granting Robinhood's request, the Supreme Court said it would focus solely on the question of whether a company that issues stock can be found liable under the misleading-omissions prong of Section 11(a) of the Securities Act of 1933 based on a determination that the issuer failed to disclose interim financial information that is material within the meaning of Section 11(a), without an additional inquiry to determine whether the omission rendered any affirmative statement misleading.\nRobinhood's IPO came on the heels of a surge in investor interest during the Covid-19 pandemic of so-called meme stocks, and trading in the crypto asset Dogecoin.\nIn July 2021, Robinhood conducted its IPO, \"for which it prepared a registration statement\" that \"contained only limited information about Robinhood's performance during the second quarter of 2021,\" the 9th Circuit panel that heard the case noted.\n\"After the initial public offering, Robinhood reported financial results from that second quarter, and its stock price dropped,\" the panel wrote.\nThe investors who sued Robinhood and the other defendants alleged that the registration statement omitted material information that was legally required to be disclosed.",

    "id": "nvidia-hasn-t-selected-search-firm-for-p-04ef5531",
    "title": "Nvidia hasn’t selected search firm for permanent Huang replacement, board tells CNBC",
    "titleJa": "Nvidia hasn’t selected search firm for permanent Huang replacement, board tells CNBC",
    "summaryJa": "Nvidia hasn't yet selected a search firm to work with in identifying a successor for former CEO Jensen Huang, the company's board told CNBC.\"We are in the process of selecting a search firm for the Nvidia CEO role,\" the board said in a Friday statement. \"We have not formally engaged any potential candidates.\"",
    "bodyOriginal": "Nvidia hasn't yet selected a search firm to work with in identifying a successor for former CEO Jensen Huang, the company's board told CNBC.\n\"We are in the process of selecting a search firm for the Nvidia CEO role,\" the board said in a Friday statement. \"We have not formally engaged any potential candidates.\"\nThe comments come after speculation has swirled about who might be tapped to replace Huang. Nvidia announced Thursday that Huang would step down as CEO of the chipmaker after multiple reported affairs, including one with a woman purported to be a Chinese spy.\nNvidia named CFO Colette Kress as interim CEO and said it will begin a search for a permanent CEO to replace Huang, adding that it will consider both internal and external candidates.\nThe Financial Times reported Friday that Nvidia's board has approached Arm CEO Rene Haas in its search for Huang's successor, citing people familiar with the matter.\nNvidia's board said, \"Any speculation regarding individual candidates, whether internal or external, is premature.\"\nBefore joining the SoftBank-backed chip company in 2013, Haas spent seven years at Nvidia, serving in a variety of roles including vice president of its computing products business.\nThis is breaking news. Please refresh for updates.",
    "bodyJa": "Nvidia hasn't yet selected a search firm to work with in identifying a successor for former CEO Jensen Huang, the company's board told CNBC.\n\"We are in the process of selecting a search firm for the Nvidia CEO role,\" the board said in a Friday statement. \"We have not formally engaged any potential candidates.\"\nThe comments come after speculation has swirled about who might be tapped to replace Huang. Nvidia announced Thursday that Huang would step down as CEO of the chipmaker after multiple reported affairs, including one with a woman purported to be a Chinese spy.\nNvidia named CFO Colette Kress as interim CEO and said it will begin a search for a permanent CEO to replace Huang, adding that it will consider both internal and external candidates.\nThe Financial Times reported Friday that Nvidia's board has approached Arm CEO Rene Haas in its search for Huang's successor, citing people familiar with the matter.\nNvidia's board said, \"Any speculation regarding individual candidates, whether internal or external, is premature.\"\nBefore joining the SoftBank-backed chip company in 2013, Haas spent seven years at Nvidia, serving in a variety of roles including vice president of its computing products business.\nThis is breaking news. Please refresh for updates.",

    "id": "lutnick-faces-questions-over-nvidia-spy-fc3b4656",
    "title": "Lutnick faces questions over Nvidia spy scandal. His sons’ firm has deep ties to the chipmaker",
    "titleJa": "Lutnick faces questions over Nvidia spy scandal. His sons’ firm has deep ties to the chipmaker",
    "summaryJa": "Jensen Huang’s resignation as Nvidia CEO has brought renewed scrutiny to Commerce Secretary Howard Lutnick and his family’s financial ties to the chipmaker.",
    "bodyOriginal": "In late September, Cantor Fitzgerald hosted Nvidia CEO Jensen Huang and other top executives from the chipmaker for investor meetings in New York, according to a Cantor research report reviewed by CNBC.\nThe Wall Street firm liked what it heard.\n\"We continue to view NVDA as the best risk/reward in our coverage,\" Cantor analyst C.J. Muse and his colleagues wrote in a research report dated Oct. 3 that maintained a $350 price target and overweight rating on the stock.\nYet the firm formerly run by Commerce Secretary Howard Lutnick and now led by his sons, Brandon and Kyle, reported a nearly 50% decline in the number of Nvidia shares it held between September 2025 and March 2026, according to a CNBC analysis of securities filings that excludes options. Nvidia had been one of the largest stock positions reported in Cantor's filings.\nThe decline coincided with White House and U.S. intelligence officials pressing Lutnick to crack down on Megaspeed, a Singapore-based company suspected of funneling Nvidia's advanced artificial intelligence chips to China. Lutnick repeatedly resisted those efforts, according to Axios.\nBy the time Cantor hosted Huang in New York, Lutnick had also received a classified intelligence warning, according to Axios, about Huang's ties to a suspected Chinese spy and had appeared alongside the CEO at a G20 technology summit in North Carolina.\nEven as Cantor pared back its Nvidia stake, it continued doing business across the chipmaker's AI empire. A CNBC review of securities filings, corporate announcements and Wall Street research found the firm has helped arrange billions of dollars in financing for Nvidia's business partners while maintaining close ties to the chipmaker's leadership.\nThose ties have drawn fresh scrutiny following Huang's resignation Thursday and Axios' reporting that Lutnick repeatedly resisted a crackdown on companies suspected of smuggling Nvidia chips to China, despite President Donald Trump authorizing new export restrictions on those companies for a third time on Nov. 5.\nAn ethics expert said the relationship between Lutnick and his former firm's investments may raise questions, given what the secretary knew about Nvidia.\nRichard Painter, the former chief White House ethics lawyer for President George W. Bush and now a corporate law professor at the University of Minnesota said that while \"there's no proof of\" Lutnick sharing nonpublic information with Cantor Fitzgerald, \"the appearance doesn't look great.\"\n\"His conversations with his sons better be about publicly available information,\" Painter told CNBC.\nThere is no evidence that Lutnick's sons had advance knowledge of the intelligence concerns, that changes in Cantor's reported holdings were tied to any warnings or that the firm's business interests influenced their father's decisions.\n\"Cantor has to date from time to time had only immaterial stand-alone proprietary positions in Nvidia, unlike the positions reflected in 13F filings which were entered into in the ordinary course of business in connection with client swap transactions, that are common in institutional markets,\" a Cantor spokesperson told CNBC.\nCantor declined to answer CNBC's other questions. The Commerce Department, the White House, Howard Lutnick and his sons did not respond to CNBC's requests for comment or detailed questions about the findings.\nAs scrutiny of Huang intensified, Cantor Chairman Brandon Lutnick was publicly praising the chipmaker's leadership. \"Nvidia is one of the great companies on the planet, and they have an amazing leadership team,\" Brandon Lutnick told Fox Business on Wednesday.\nTrump is standing by Howard Lutnick. A White House official told Reuters on Thursday that the president maintains \"complete confidence\" in the commerce secretary.\nBut cracks in the administration's unity emerged Friday, when Treasury Secretary Scott Bessent told CNBC's \"Squawk Box\" that the Departments of Treasury, Defense and State and the Office of the U.S. Trade Representative all \"were in favor of putting Megaspeed on the entity list for months.\"\nBessent pointed to Commerce as the department responsible for imposing the entity list, which identifies restricted businesses and other groups, adding, \"You will have to ask them about their internal processes.\"\nA shrinking Nvidia position\nNvidia was Cantor's second-largest reported stock position before Howard Lutnick left Wall Street to become commerce secretary in February 2025, behind only bitcoin investor MicroStrategy, now known as Strategy. At the end of 2024, the firm disclosed more than 3.5 million Nvidia shares worth $479 million, according to its quarterly securities filing.\nThat share count held steady through September 2025, but its value climbed 36% to $652 million, according to Cantor's quarterly securities filing, as the Trump administration moved over the summer to ease restrictions on Nvidia's H20 chip sales to China.\nOver the following six months, however, the number of Nvidia shares Cantor reported holding fell by 49%, to 3 million in December and 1.78 million by the end of March 2026, with their value dropping from $652 million to $310 million, according to a CNBC analysis of securities filings.\nPressure on Howard Lutnick was also mounting on Capitol Hill. Sens. Jim Banks, R-Ind., and Elizabeth Warren, D-Mass., in March urged the secretary to suspend or reconsider Nvidia's export licenses after three people linked to Nvidia customer Super Micro Computer were indicted on charges of conspiring to smuggle AI chips to China.\n\"The Trump administration, I think, leaks like a sieve when it comes to non-public government information getting to various hedge fund guys,\" Painter said, though he stressed there is no evidence Howard Lutnick had shared such information with his sons.\nThe filings do not establish why Cantor's reported share count fell or whether its overall financial exposure to Nvidia declined. Nvidia’s stock had more than doubled from its April 2025 lows by late October, before retreating in the following months. The stock fell about 6.5% between the end of September and the end of March.\nCantor's reported Nvidia holdings remained near that lower level through June 30, the latest quarter covered by public disclosures, at 1.81 million shares. Its next quarterly filing is due Monday.\nCantor has not publicly explained the decline.\nMost of those shares were attributed to CF Secured, a Cantor brokerage subsidiary that uses stocks and derivatives to hedge customer transactions, according to its audited financial statements. Cantor also disclosed substantial Nvidia options positions during the time period CNBC examined, overwhelmingly skewed toward put options, which can protect against declines in the stock price.\nClassified warnings and a $3 billion deal\nAs concerns about Huang escalated inside the Trump administration in May, according to Axios, Cantor was helping finance the expansion of one of Nvidia's newest business partners, securities filings show.\nOn May 7, Nvidia and Australia-based cloud computing provider IREN announced a five-year, $3.4 billion cloud computing contract and a strategic partnership giving the chipmaker the right to invest up to $2.1 billion in IREN.\n\"That's not a passive financial investment. Nvidia is a partner who wins as we deliver,\" IREN co-CEO Daniel Roberts told investors on the company's quarterly earnings call that day.\nFive days later, as Trump headed to China aboard Air Force One, Secretary of State Marco Rubio warned him about Huang's relationship with a suspected Chinese spy, The New York Times reported on Tuesday. Huang, who had not initially been invited on the trip, joined the president's delegation during a refueling stop in Alaska.\nHoward Lutnick had already been sent a highly classified intelligence memo detailing concerns about Huang's relationship, Axios reported.\nOn May 12, the day Trump departed for China, IREN announced the pricing of a convertible bond offering that ultimately raised $3 billion when it closed two days later. Cantor was one of seven bookrunners on the deal, alongside JPMorgan Chase and Goldman Sachs.\nOn the day the offering closed, May 14, Lutnick's Commerce Department quietly cleared roughly 10 Chinese companies, including Alibaba and ByteDance, to buy Nvidia's advanced H200 chips, though some of those approvals predated the intelligence memo.\nIt is unclear when IREN hired Cantor for the offering or how much the firm earned from the deal. Cantor declined to answer CNBC's questions about its work with IREN.\nStill, Cantor reported a substantial position in IREN's stock.\nBy the end of June, Cantor reported $115 million in IREN shares and $362 million in Nvidia shares. Together, the two companies accounted for more than 9% of the value of Cantor's reported $5.2 billion in securities holdings, excluding options, according to CNBC's analysis of the filing.\nCantor didn't answer CNBC's questions about its work with IREN.\nBeyond the stock\nIREN was not the only company in Nvidia's orbit that turned to Cantor for financing.\nIn October 2025, Cantor advised AI infrastructure developer Lancium on a $600 million financing deal to support its data center campus in Abilene, Texas, the first site of Stargate, the massive AI infrastructure project backed by OpenAI, SoftBank and Oracle.\nNewmark, a commercial real estate firm controlled by Cantor, also helped finance the Abilene campus, arranging a $7.1 billion construction loan in May 2025.\nTen months later, Nvidia agreed to invest $2 billion for a roughly 20% stake in Lancium, with up to $1 billion more tied to future milestones, The Information reported in August. Lancium, which is also backed by Blackstone, confirmed an investment and a technology partnership on Aug. 24 without disclosing financial terms.\nIt's unclear whether Cantor continued advising Lancium after the financing deal or played a role in Nvidia's investment. Neither Cantor nor Lancium responded to questions about the investment.\nCantor's reported ties also extend to Nvidia's supply chain.\nIn May 2025, days after Howard Lutnick announced the transfer of his ownership stake in Cantor to his children via trusts, Semafor reported that bankers at the firm had informally advised executives at Taiwan Semiconductor Manufacturing Co., which makes Nvidia's most advanced chips, on navigating Washington. Cantor called Semafor's report \"baseless and false.\"\nTSMC received billions of dollars in federal subsidies created during the Biden administration and administered by the Commerce Department to fund its U.S. manufacturing expansion.\nDemocratic senators called for an ethics investigation in December into whether the Lutnick family stood to benefit from his push to expand AI data centers.\nAnd on Wednesday, Sens. Warren and Chris Coons, D-Del., demanded that Howard Lutnick, Rubio and White House chief of staff Stephen Miller preserve records on Nvidia's chip exports to China and intelligence warnings about Huang.\nThe senators questioned whether \"prudent defensive counter-intelligence action was taken or national security recommendations were overruled.\"\n\"The place where I think the Trump administration has most failed here is in being persuaded by Jensen Huang and others to license the export of some advanced chips,\" Coons said Friday on CNBC's \"Squawk Box,\" accusing the administration of turning a blind eye to the black market for more advanced chips.",
    "bodyJa": "In late September, Cantor Fitzgerald hosted Nvidia CEO Jensen Huang and other top executives from the chipmaker for investor meetings in New York, according to a Cantor research report reviewed by CNBC.\nThe Wall Street firm liked what it heard.\n\"We continue to view NVDA as the best risk/reward in our coverage,\" Cantor analyst C.J. Muse and his colleagues wrote in a research report dated Oct. 3 that maintained a $350 price target and overweight rating on the stock.\nYet the firm formerly run by Commerce Secretary Howard Lutnick and now led by his sons, Brandon and Kyle, reported a nearly 50% decline in the number of Nvidia shares it held between September 2025 and March 2026, according to a CNBC analysis of securities filings that excludes options. Nvidia had been one of the largest stock positions reported in Cantor's filings.\nThe decline coincided with White House and U.S. intelligence officials pressing Lutnick to crack down on Megaspeed, a Singapore-based company suspected of funneling Nvidia's advanced artificial intelligence chips to China. Lutnick repeatedly resisted those efforts, according to Axios.\nBy the time Cantor hosted Huang in New York, Lutnick had also received a classified intelligence warning, according to Axios, about Huang's ties to a suspected Chinese spy and had appeared alongside the CEO at a G20 technology summit in North Carolina.\nEven as Cantor pared back its Nvidia stake, it continued doing business across the chipmaker's AI empire. A CNBC review of securities filings, corporate announcements and Wall Street research found the firm has helped arrange billions of dollars in financing for Nvidia's business partners while maintaining close ties to the chipmaker's leadership.\nThose ties have drawn fresh scrutiny following Huang's resignation Thursday and Axios' reporting that Lutnick repeatedly resisted a crackdown on companies suspected of smuggling Nvidia chips to China, despite President Donald Trump authorizing new export restrictions on those companies for a third time on Nov. 5.\nAn ethics expert said the relationship between Lutnick and his former firm's investments may raise questions, given what the secretary knew about Nvidia.\nRichard Painter, the former chief White House ethics lawyer for President George W. Bush and now a corporate law professor at the University of Minnesota said that while \"there's no proof of\" Lutnick sharing nonpublic information with Cantor Fitzgerald, \"the appearance doesn't look great.\"\n\"His conversations with his sons better be about publicly available information,\" Painter told CNBC.\nThere is no evidence that Lutnick's sons had advance knowledge of the intelligence concerns, that changes in Cantor's reported holdings were tied to any warnings or that the firm's business interests influenced their father's decisions.\n\"Cantor has to date from time to time had only immaterial stand-alone proprietary positions in Nvidia, unlike the positions reflected in 13F filings which were entered into in the ordinary course of business in connection with client swap transactions, that are common in institutional markets,\" a Cantor spokesperson told CNBC.\nCantor declined to answer CNBC's other questions. The Commerce Department, the White House, Howard Lutnick and his sons did not respond to CNBC's requests for comment or detailed questions about the findings.\nAs scrutiny of Huang intensified, Cantor Chairman Brandon Lutnick was publicly praising the chipmaker's leadership. \"Nvidia is one of the great companies on the planet, and they have an amazing leadership team,\" Brandon Lutnick told Fox Business on Wednesday.\nTrump is standing by Howard Lutnick. A White House official told Reuters on Thursday that the president maintains \"complete confidence\" in the commerce secretary.\nBut cracks in the administration's unity emerged Friday, when Treasury Secretary Scott Bessent told CNBC's \"Squawk Box\" that the Departments of Treasury, Defense and State and the Office of the U.S. Trade Representative all \"were in favor of putting Megaspeed on the entity list for months.\"\nBessent pointed to Commerce as the department responsible for imposing the entity list, which identifies restricted businesses and other groups, adding, \"You will have to ask them about their internal processes.\"\nA shrinking Nvidia position\nNvidia was Cantor's second-largest reported stock position before Howard Lutnick left Wall Street to become commerce secretary in February 2025, behind only bitcoin investor MicroStrategy, now known as Strategy. At the end of 2024, the firm disclosed more than 3.5 million Nvidia shares worth $479 million, according to its quarterly securities filing.\nThat share count held steady through September 2025, but its value climbed 36% to $652 million, according to Cantor's quarterly securities filing, as the Trump administration moved over the summer to ease restrictions on Nvidia's H20 chip sales to China.\nOver the following six months, however, the number of Nvidia shares Cantor reported holding fell by 49%, to 3 million in December and 1.78 million by the end of March 2026, with their value dropping from $652 million to $310 million, according to a CNBC analysis of securities filings.\nPressure on Howard Lutnick was also mounting on Capitol Hill. Sens. Jim Banks, R-Ind., and Elizabeth Warren, D-Mass., in March urged the secretary to suspend or reconsider Nvidia's export licenses after three people linked to Nvidia customer Super Micro Computer were indicted on charges of conspiring to smuggle AI chips to China.\n\"The Trump administration, I think, leaks like a sieve when it comes to non-public government information getting to various hedge fund guys,\" Painter said, though he stressed there is no evidence Howard Lutnick had shared such information with his sons.\nThe filings do not establish why Cantor's reported share count fell or whether its overall financial exposure to Nvidia declined. Nvidia’s stock had more than doubled from its April 2025 lows by late October, before retreating in the following months. The stock fell about 6.5% between the end of September and the end of March.\nCantor's reported Nvidia holdings remained near that lower level through June 30, the latest quarter covered by public disclosures, at 1.81 million shares. Its next quarterly filing is due Monday.\nCantor has not publicly explained the decline.\nMost of those shares were attributed to CF Secured, a Cantor brokerage subsidiary that uses stocks and derivatives to hedge customer transactions, according to its audited financial statements. Cantor also disclosed substantial Nvidia options positions during the time period CNBC examined, overwhelmingly skewed toward put options, which can protect against declines in the stock price.\nClassified warnings and a $3 billion deal\nAs concerns about Huang escalated inside the Trump administration in May, according to Axios, Cantor was helping finance the expansion of one of Nvidia's newest business partners, securities filings show.\nOn May 7, Nvidia and Australia-based cloud computing provider IREN announced a five-year, $3.4 billion cloud computing contract and a strategic partnership giving the chipmaker the right to invest up to $2.1 billion in IREN.\n\"That's not a passive financial investment. Nvidia is a partner who wins as we deliver,\" IREN co-CEO Daniel Roberts told investors on the company's quarterly earnings call that day.\nFive days later, as Trump headed to China aboard Air Force One, Secretary of State Marco Rubio warned him about Huang's relationship with a suspected Chinese spy, The New York Times reported on Tuesday. Huang, who had not initially been invited on the trip, joined the president's delegation during a refueling stop in Alaska.\nHoward Lutnick had already been sent a highly classified intelligence memo detailing concerns about Huang's relationship, Axios reported.\nOn May 12, the day Trump departed for China, IREN announced the pricing of a convertible bond offering that ultimately raised $3 billion when it closed two days later. Cantor was one of seven bookrunners on the deal, alongside JPMorgan Chase and Goldman Sachs.\nOn the day the offering closed, May 14, Lutnick's Commerce Department quietly cleared roughly 10 Chinese companies, including Alibaba and ByteDance, to buy Nvidia's advanced H200 chips, though some of those approvals predated the intelligence memo.\nIt is unclear when IREN hired Cantor for the offering or how much the firm earned from the deal. Cantor declined to answer CNBC's questions about its work with IREN.\nStill, Cantor reported a substantial position in IREN's stock.\nBy the end of June, Cantor reported $115 million in IREN shares and $362 million in Nvidia shares. Together, the two companies accounted for more than 9% of the value of Cantor's reported $5.2 billion in securities holdings, excluding options, according to CNBC's analysis of the filing.\nCantor didn't answer CNBC's questions about its work with IREN.\nBeyond the stock\nIREN was not the only company in Nvidia's orbit that turned to Cantor for financing.\nIn October 2025, Cantor advised AI infrastructure developer Lancium on a $600 million financing deal to support its data center campus in Abilene, Texas, the first site of Stargate, the massive AI infrastructure project backed by OpenAI, SoftBank and Oracle.\nNewmark, a commercial real estate firm controlled by Cantor, also helped finance the Abilene campus, arranging a $7.1 billion construction loan in May 2025.\nTen months later, Nvidia agreed to invest $2 billion for a roughly 20% stake in Lancium, with up to $1 billion more tied to future milestones, The Information reported in August. Lancium, which is also backed by Blackstone, confirmed an investment and a technology partnership on Aug. 24 without disclosing financial terms.\nIt's unclear whether Cantor continued advising Lancium after the financing deal or played a role in Nvidia's investment. Neither Cantor nor Lancium responded to questions about the investment.\nCantor's reported ties also extend to Nvidia's supply chain.\nIn May 2025, days after Howard Lutnick announced the transfer of his ownership stake in Cantor to his children via trusts, Semafor reported that bankers at the firm had informally advised executives at Taiwan Semiconductor Manufacturing Co., which makes Nvidia's most advanced chips, on navigating Washington. Cantor called Semafor's report \"baseless and false.\"\nTSMC received billions of dollars in federal subsidies created during the Biden administration and administered by the Commerce Department to fund its U.S. manufacturing expansion.\nDemocratic senators called for an ethics investigation in December into whether the Lutnick family stood to benefit from his push to expand AI data centers.\nAnd on Wednesday, Sens. Warren and Chris Coons, D-Del., demanded that Howard Lutnick, Rubio and White House chief of staff Stephen Miller preserve records on Nvidia's chip exports to China and intelligence warnings about Huang.\nThe senators questioned whether \"prudent defensive counter-intelligence action was taken or national security recommendations were overruled.\"\n\"The place where I think the Trump administration has most failed here is in being persuaded by Jensen Huang and others to license the export of some advanced chips,\" Coons said Friday on CNBC's \"Squawk Box,\" accusing the administration of turning a blind eye to the black market for more advanced chips.",

    "id": "why-is-microsoft-s-outage-lasting-so-lon-3f86df29",
    "title": "Why is Microsoft's outage lasting so long and will emails be lost?",
    "titleJa": "Why is Microsoft's outage lasting so long and will emails be lost?",
    "summaryJa": "Microsoft says it is continuing to restore services including Outlook and Teams following a global outage.",
    "bodyOriginal": "Why is Microsoft's outage lasting so long and will emails be lost?\n- Published\nA major Microsoft outage has impacted schools, healthcare systems, businesses, courts and governments around the world.\nServices including Teams, Outlook and AI software Copilot, are being restored almost 24 hours since issues first surfaced.\nMicrosoft said the outage was not a cyber-security incident and was caused by a technical issue. It has apologised for the disruption.\nHere's what we know about the services affected and what went wrong.\nWhat happened?\nSome Microsoft 365 services have been affected by \"connectivity problems\" with problems reported in at least 74 countries.\nFrom late on Thursday, customers reported varying levels of access - many were unable to send or receive emails, view certain files or details on their calendar apps.\nBut some users were able to use Teams, messaging and online meeting functions without issues.\nAs of Friday afternoon, Microsoft said it had seen \"encouraging recovery progress\" in Europe and improvement in North America.\nThe company added that it was focused on \"addressing the remaining areas of disruption\" but warned \"some users may still experience intermittent issues\".\nIn a later statement, the company said it was continuing to see improvements \"with email queues significantly reduced and approaching normal levels\".\nThe company attributed the ongoing outage to an issue during an earlier network capacity upgrade.\n\"We have addressed the underlying issue and continue to restore service to remaining customers and regions,\" it said on Friday.\nWill emails affected by the outage ever arrive?\nAlthough services are beginning to resume, Microsoft has warned of continued \"intermittent access issues\", meaning some users will still struggle to load their inboxes and could experience \"delayed email delivery\".\nIn other words, it is not quite safe to assume every email you send is going to arrive in its intended recipient's inbox right away.\nEarlier, Microsoft said it would be extending the \"timeout window\" to 48 hours \"to help protect delayed messages as delivery catches up\".\nThe email timeout window refers to the amount of time Outlook will wait to receive an email.\nWhen they do show up, the timestamp will be when they were delivered rather than when they were sent.\nWhy has it taken so long to fix?\nAlthough email service Outlook appears to be resuming, the outage has so far lasted for more than 20 hours - in outage terms that is considered a long time.\nProf James Ferryman from the University of Reading's department of computer science said the details the company has disclosed provide some clues.\n\"What Microsoft has told us is that the part of its servers that sets up secure connections is getting swamped, and once that happens the server just stops answering,\" he said.\n\"The trouble is that this kind of failure snowballs.\n\"One server falls over, its work gets passed to the next one, and meanwhile huge numbers of phones and laptops keep trying to get back in.\n\"You can't just turn it all back on at once. You have to bring it back bit by bit.\"\nThe challenge is therefore not just fixing the fault, but managing the huge surge of devices trying to reconnect once services start coming back online.\nGergely Orosz, a former leading software engineer at several major tech companies including Skype and Uber, said this could be the \"most disruptive\" business email outage \"of all time\".\nHe said it was still difficult to know just how many people have been affected by the disruption, but added he \"cannot recall\" an outage over business email ever taking this long to return to normal.\nAustralian cyber-security expert Troy Hunt told the BBC the outage could have far-reaching consequences.\n\"Microsoft is a massive part of the internet backbone and reminds us how critical email still is.\n\"Not only does this outage affect many people's ability to work but also things like the ability to communicate about appointments, purchase things that need verification, create or access accounts and services,\" he said.\nIn a statement, Microsoft said it was \"deeply sorry for the disruption this incident has caused our customers and partners.\n\"We know the trust they place in our services and take that responsibility extremely seriously. We are seeing broad recovery and stability across our services.\"\nHow many people have been affected?\nMore than 430 million people use Microsoft 365 apps according to Microsoft's website. The full scale of the outage has not been confirmed.\nMicrosoft 365 is used by companies worldwide and is expected to have a knock-on effect to other services.\nTech giants OpenAI and Anthropic both earlier reported problems as a result of the outage.\nChatGPT-maker OpenAI said it was investigating an issue affecting its connections to Microsoft's services, which had caused some tools to not work as expected.\nFrom city governments in the US to Australian spy agencies, disruption across the globe has been widespread.\nCourts from Los Angeles to Texas earlier warned that communications might be delayed.\nIn Canada, the public broadcaster CBC reported that a healthcare network running several hospitals in Toronto was experiencing email issues, but that patient care was not affected.\nThe government of Japan also said its shared IT platform had been disrupted.\nAcross the UK, GP surgeries, pharmacies, police and schools have been affected by the outage.\nSome GP surgeries had urged patients not to submit messages via their website while police forces were also earlier asking the public to call if they want to make a report.\nAdditional reporting by Henry Moore\nGet in touch\nHave you or your business been affected by the outage?",

ings like the ability to communicate about appointments, purchase things that need verification, create or access accounts and services,\" he said.\nIn a statement, Microsoft said it was \"deeply sorry for the disruption this incident has caused our customers and partners.\n\"We know the trust they place in our services and take that responsibility extremely seriously. We are seeing broad recovery and stability across our services.\"\nHow many people have been affected?\nMore than 430 million people use Microsoft 365 apps according to Microsoft's website. The full scale of the outage has not been confirmed.\nMicrosoft 365 is used by companies worldwide and is expected to have a knock-on effect to other services.\nTech giants OpenAI and Anthropic both earlier reported problems as a result of the outage.\nChatGPT-maker OpenAI said it was investigating an issue affecting its connections to Microsoft's services, which had caused some tools to not work as expected.\nFrom city governments in the US to Australian spy agencies, disruption across the globe has been widespread.\nCourts from Los Angeles to Texas earlier warned that communications might be delayed.\nIn Canada, the public broadcaster CBC reported that a healthcare network running several hospitals in Toronto was experiencing email issues, but that patient care was not affected.\nThe government of Japan also said its shared IT platform had been disrupted.\nAcross the UK, GP surgeries, pharmacies, police and schools have been affected by the outage.\nSome GP surgeries had urged patients not to submit messages via their website while police forces were also earlier asking the public to call if they want to make a report.\nAdditional reporting by Henry Moore\nGet in touch\nHave you or your business been affected by the outage?",

    "title": "Wholesale prices rose 0.3% in October, putting annual rate at 6.5%, the highest in nearly four years",
    "titleJa": "Wholesale prices rose 0.3% in October, putting annual rate at 6.5%, the highest in nearly four years",
    "summaryJa": "The producer price index was expected to increase 0.4% in October, according to the Dow Jones consensus.",
    "bodyOriginal": "Wholesale prices increased less than expected in October, but inflation pressures persisted and the Federal Reserve is likely still on target for an interest rate increase soon.\nThe producer price index, which measures the prices domestic producers get for their products before they reach the consumer, rose a seasonally adjusted 0.3% for the month, against the Dow Jones consensus for a 0.4% increase, the Bureau of Labor Statistics reported Friday.\nStripping out food and energy, core PPI posted a 0.3% gain, meeting expectations.\nOn an annual basis, headline PPI accelerated 6.5%, up 0.2 percentage point for the highest annual rate since November 2022.\nThe report comes just a few weeks ahead of the Federal Reserve's next policy meeting, Dec. 8-9. Markets are fully pricing in a quarter percentage point increase in the central bank's key overnight borrowing rate, with slight odds that the Federal Open Market Committee might opt for a half-point hike.\nStock market futures added to gains following the release while Treasury yields were mixed.\nEarlier this week, the BLS reported that inflation at the cash register was hotter than expected.\nThe headline consumer price index saw a 0.4% increase in October while core was up 0.3%, both 0.1 percentage point higher than expected. Because of the government shutdown in October 2025, the BLS couldn't collect some data and refrained from putting out a 12-month inflation figure for CPI.\nHowever, the figures showed that the Fed remains a good distance from its 2% inflation goal.\n\"Today's PPI data – which shows some signs of improving, albeit still too-high – is unlikely to change the Fed's approach in December because the CPI data was already outside their comfort zone,\" said Chris Zaccarelli, chief investment officer for Northlight Asset Management.\nMoreover, policymakers are beginning to worry that inflation generated by the Iran war and higher fuel prices, along with President Donald Trump's tariffs, are beginning to spread through the economy. The Fed generally would look through such price pressures as temporary, but the breadth of inflation could indicate that inflation is becoming more entrenched.\n\"We've had some signs of trouble now for several months in a row,\" Chicago Fed President Austan Goolsbee said in a CNBC interview Friday. \"If you look at how broad-based the inflation is, it's not just that we're above the target and have been for some time. It's that in categories that are not driven by oil prices and not driven by tariffs, you're still seeing stalled progress and in some cases going the wrong way.\"\nStripping out food, energy and trade services, PPI saw an increase of 0.5% in October.\nGoods prices increased 0.5% in October, with more than 60% of that move driven by goods excluding food and energy, which actually saw a 0.1% decrease. On an annual basis, the goods index jumped 10.2%, the biggest 12-month surge since October 2022.\nFinal demand services prices increased 0.2%, most of which was linked to transportation and warehousing services, and within that category a 3.9% gain in truck transportation of freight.\n\"We've been above 2% for almost six years, and while it sometimes we were making progress, lately we're not making any progress, and if anything, it's going the wrong way,\" Goolsbee said. \"Inflation is rising; it's proved far more persistent than we predicted at the beginning from the supply shocks.\"\nOther items in the PPI report also showed multiyear gains. Prices for intermediate processed goods soared 14.6% from October 2025, the biggest annual gain since July 2022. Intermediate prices for services posted a 6.9% increase, the most since November 2022.",
