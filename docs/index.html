    "bodyOriginal": "As a central figure who helped negotiate the blockbuster $246 billion tobacco master settlement in 1998, Mike Moore sees the writing on the wall for Meta and its social media rivals like TikTok and Google's YouTube.\nMoore was the Mississippi attorney general leading the charge against Big Tobacco. He's long since retired from public office, but is using his experience to help inform state AGs in the crafting of a potential sweeping settlement with the social media industry, which has been similarly accused of knowingly fostering addiction and harming America's youth.\nMeta this week agreed to pay almost $17 billion in a landmark settlement with a coalition of state AGs that had sued the company for misrepresenting the extent of child mental health damage caused by Facebook and Instagram. It's by far the biggest deal yet in the massive litigation wave facing social media companies, but experts say the matter is far from over as a bundle of cases remain open.\nAs co-leader of Attention Initiative, a newly created nonprofit, Moore told CNBC he sees the opportunity for a grand settlement that involves a wider swath of companies and impactful remedies, including a permanent national public education fund to \"reduce the number of young people who fall prey to the addiction and the many harms it has caused.\"\nMeta agreed to changes including daily usage limits and \"nighttime blocks\" for teenagers who use the company's apps, \"enhanced age assurance measures\" that would prevent children from using them, and the creation of additional tools for parents and guardians. An independent auditor will monitor and report on whether Meta is complying with the settlement's terms over a five-year period.\n\"The settlement with the states is a great first step in helping protect our children from the dangers on social media,\" Moore said, in his first public comments on the matter. \"The attorneys general have done a great job with their investigations and lawsuits in exposing the bad practices of Meta and the social media industry and now providing a template of corrective actions the industry must take.\"\nWhile Moore sees major parallels to the tobacco battle almost three decades ago, the universe of Big Tech and social media presents an array of challenges that may limit the viability of the old playbook. Unlike tobacco, a static product with no real defensible qualities outside of recreation, consumer technology is ever evolving, and the lines between harmfully addictive and beneficial to society can be extremely blurry.\n\"Cigarettes are cigarettes,\" said Jonathan Caulkins, a professor of public policy at Carnegie Mellon University's Heinz College. By contrast, he said there are stark differences between apps like Facebook and TikTok and, \"in the world of AI and social media, it is simply impossible to know what those technologies are going to be doing for good and ill five and 10 and 15 years into the future.\"\nCaulkins said he's not convinced that a \"single settlement\" can resolve all the alleged health-related concerns, given the rapid advancements in technology.\nStill, Moore said it's important to develop proposed settlement language to ensure that litigators are going after the most significant fixes. In his view, that includes a public education fund, though there are dozens of states along with cities, counties and school districts that will all be pursuing various remedies.\nThe Attention Initiative's goal, he said, is to \"make sure everybody hears loud and clear\" that \"we need a remediation public education program, prevention program, whatever you might want to call it.\"\n\"It's best done on a national scale rather than piece by piece, city by city, county by county, state by state, which just wastes a lot of money,\" he said.\nThe Meta settlement came just over a week into a federal trial in Oakland, California, that was co-led on the plaintiff side by California AG Rob Bonta. The case was brought in 2023, and accused Meta of violating federal and state laws, including the Children's Online Privacy Protection Act, or COPPA, and various consumer protection statutes.\nAfter the agreement was announced, Bonta called it, \"a floor conceptually, not a ceiling,\" and said it \"gives notice to others in the industry that we're not done, and we expect similar outcomes from them as well.\"\nMeta didn't comment on whether a bigger settlement is in the works to clear its remaining legal hurdles. The company made clear in its statement after the announcement that part of its payout is contingent on YouTube and TikTok implementing similar changes to their services.\nGoogle and TikTok didn't respond to requests for comment. Snap, which also faces a number of lawsuits, declined to comment.\nAssuming 'nothing will change'\nThe Attention Initiative was created by 22-year-old Josh Jacobs. He modeled the Colorado nonprofit in part after the public health group Truth Initiative, which was started as part of the tobacco settlement and is chaired by Moore.\nJacobs previously co-founded an online ad and e-commerce startup with college friends and became disenchanted with what he characterized as the social media industry's \"perverse incentives of maximizing for engagement over all else.\"\nHe started researching the similarities between social media and tobacco, an endeavor that led to him cold-calling Moore. He felt the need to take action while the topic is hot.\n\"Most people my age aren't following this trial through the news,\" Jacobs said. \"They're seeing it on social media, and the comments under those posts are almost entirely cynical. The assumption is that nothing will change.\"\nMany techies, however, fear too much change.\nIt's an industry that's long been concerned about regulations and laws infringing on free speech, and experts say there are nuances that make social media hard to regulate. Age verifications and parental controls come with notorious loopholes. Teenagers in Australia are reportedly using social media apps more now despite a ban late last year, in part because they can use virtual private networks (VPNs) and bypass local laws.\nThen there's the emergence of artificial intelligence chatbots and companions that create a host of other concerns for underage usage, but that aren't generally considered part of the social media industry.\nAllison Ball, a former Facebook product leader, previously invested in Jacobs' startup. Now a venture capitalist, Ball said she admires the work Jacobs and Moore are doing but wants them to stay \"maniacally focused on what could actually help\" instead of advocating for regulations that she believes could have unintended consequences.\n\"It's the hardest thing in modern society to get right,\" Ball said. \"Where to limit freedoms and who to hold accountable, that's super difficult for the government to get right.\"\nShe agreed that education is important but that \"it's just not going to solve the whole problem.\"\nFrom tobacco to social media\nAmong those who were deeply engaged in the tobacco case, Moore isn't alone in recognizing the similarities to social media.\nLawyers Joe Rice and Steve Berman were two of the key architects of the tobacco settlement and, like Moore, were also heavily involved in opioid-related litigation. Berman speculates that Meta will next settle the school districts case, which stemmed from some 1,200 districts across the country accusing the Facebook parent and other social media companies of spreading intentionally addictive features.\n\"They're going to have to take care of this problem, or they're just going to be litigated forever,\" Berman said.\nRice, whose law firm Motley Rice is involved in multiple social media trials, said that in order for a master settlement to take place, the tech companies have to come together in a way that's unfamiliar to them given how much they compete with one another.\n\"At some point in time, it's possible that the two or three largest platforms can say, 'Look, we should all agree to this,'\" he said. \"They're not in lockstep right now.\"\nMoore said that he's initiated potential master settlement language with AGs, but he declined to comment further. He's enlisting his colleagues at the Truth Initiative to work with Jacobs and representatives from the AGs' offices.\nUntil there's broader resolution, court cases remain on the calendar.\nAmong them is a case involving Snap in New Mexico, where state AG Raul Torrez, a board member with the Truth Initiative, is leading a child-sexual exploitation lawsuit. It's similar to a case that Meta lost in New Mexico earlier this year. The trial there is scheduled for about a year from now.\nWATCH: Meta's post settlement challenges: Here's what to know.",

    "title": "What new tariff walls in U.S.-Canada trade war mean for the economy's critical metals",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "As the U.S. and Canada stare down tens of billions of dollars in dueling tariff regimes as a result of President Trump's new trade war against the nation's second-biggest trading partner, companies, economists, and investors are back in the game of attempting to forecast the level of volatility to expect on corporate balance sheets and in stock prices.\nThe U.S. government's 50% tariffs on a wide range of Canadian goods were met with Canada's $20 billion in retaliatory tariffs slated to go into effect on Sept. 8. They encompass more than 700 U.S. goods, meant to mirror the size of Trump's import taxes on Canadian wine, cement, hockey sticks and more. The counter-tariffs, which range from 15% to 50%, target a wide array of U.S. imports into Canada, including dairy, seafood, appliances, wood and paper products, and clothes.\nThere were some real-time market winners as the new trade war dominated headlines last Monday. Consider the reaction in steel and materials stocks, including Nucor, Steel Dynamics, Cleveland-Cliffs and Century Aluminum, which all shot up on Monday after the U.S.-Canada trade talks broke down, and after many had fallen the week before on bets a new U.S-Canada deal would lower tariffs on steel and aluminum. The VanEck Steel ETF (SLX) rose 1.6% on Monday alone, while the State Street Materials Select Sector SPDR (XLB) hit an intraday all-time high — surpassing its previous all-time record price reached in February — as the metals stocks and other producers rallied.\nBut the new trade war rally didn't last. XLB ended the five-day trading week in negative territory and SLX was close to flat. To be sure, these funds have already booked some hefty gains in 2026. Year-to-date, both ETFs are beating the S&P 500, with SLX up over 28% and XLB up over 18%, according to Morningstar data as of Aug. 28.\nAtsi Sheth, chief credit officer at Moody's Ratings, said uncertainty is the watchword now. \"Expect much more of this uncertainty for some time to come,\" Sheth said.\nWhich businesses win in a trade war and which lose depends on an increasingly complex supply chain. One of the most complicated is the auto sector, where parts cross back and forth over the border multiple times in the production of a vehicle.\n\"For the auto sector, our view is that the sector is so integrated that the tariffs just don't impact the country you are tariffing but your own country,\" Sheth said of the U.S.-Canada automobile manufacturing ecosystem.\nU.S. steel companies are more likely to benefit, she said, because the U.S. market is larger.\n\"The auto sector, there are no winners. Steel ... U.S. has a little edge,\" Sheth said.\n\"The new tariffs create a meaningful but manageable headwind,\" said Angelo Kourkafas, senior global investment strategist at Edward Jones, a headwind that cuts both ways, as higher steel and aluminum costs also start working through U.S. manufacturers, autos, and construction on this side of the border.\nKyle Mohrbach, senior executive for North America automotive at o9 Solutions, a supply chain technology and consulting firm, said the greatest exposure sits in components and materials that are Canadian-sourced, single-sourced, hard to substitute, or required to keep an assembly line moving. In the automotive sector, that includes everything from steel, stampings, and powertrain components to braking systems, electronics and specialized subassemblies.\nWhy short-term winners in trade wars are hard to trust\nScott Beaulier, dean of the College of Business and professor of economics at the University of Wyoming, draws a distinction between stocks that benefit and businesses that benefit. \"A tariff can create an immediate scarcity premium for domestic steel and aluminum producers. But the durable winners will be firms that have three things: domestic capacity they can bring online, relatively secure energy and raw-material inputs, and customers unable to easily substitute away from them,\" Beaulier said. That's a much smaller group than \"American metals companies,\" he said.\nAluminum is a good example, according to Beaulier.\n\"The United States remains heavily import-dependent, and Canada has supplied an extraordinary share of U.S. primary aluminum. You can't tariff our dependence away overnight,\" Beaulier said, adding that smelters are enormously capital- and energy-intensive, and new capacity takes years rather than months to build.\n\"In the meantime, the tariff can raise the price received by U.S. producers while simultaneously raising input costs for American manufacturers using aluminum. I'd be cautious about treating an initial pop in metals stocks as evidence of a durable economy-wide gain,\" Beaulier said.\nCompanies are already scrambling to manage the volatile situation, said Melissa Irmen, director of advocacy for the National Association of Foreign-Trade Zones, which represents over 1,300 companies and over 500,000 employees. \"We have already been seeing some supply chain shifts and sourcing decisions adjusted,\" Irmen said.\nA foreign-trade zone lets companies bring imported materials into the U.S. without paying tariffs right away, and if those goods are re-exported or reworked into a different product, the company can defer, reduce, or sometimes avoid the duty entirely.\nIrmen said corporate adjustments to the latest rules of origin for trade — which dictate whether supply chain relocations can result in tariff avoidance — saw a lot of warehousing move to Canada over the past few years. But now, companies may just permanently alter their supply chains to avoid the uncertainty.\n\"All of the tariff uncertainty will permanently change the landscape. Companies are not able to make the fast decisions required for the tariff changes. Supply chains don't work that way,\" Irmen said. \"We tell our members things will not go back to the way they were pre-2025. Try to look as long term as you can,\" she added.\nThe difference between a supply chain and border matters\nMeanwhile, only time will tell how the market handles these shocks, and experts say one shouldn't be immediately seduced by any quick positive reaction, such as in steel.\n\"The stock pop is a headline reflex, honestly — mills reprice to replacement cost the second a 50% wall goes up, so of course Nucor and Cleveland-Cliffs jumped,\" said Dan Luttner, managing partner at NEOS by Argon & Company, a supply chain consulting firm. \"But that's not the interesting question. The interesting question is who controls their feedstock inside the wall versus who's still exposed to it?\"\nLuttner said the SLX and XLB moves illustrated a market repricing instantly to a 50% tariff wall, but the action said little about which companies inside those funds actually control their own fates in a trade war. He said Nucor and Cleveland-Cliffs run electric arc furnaces and integrated capacity that never touches Canadian ore or slab, so they keep the price umbrella structurally. Still, there is no single trade on that structural element to the business: Nucor's shares are up close to 50% this year, while Cleveland-Cliffs is in negative territory in 2026 due to ongoing balance sheet stress. Century Aluminum is tricky for another reason, according to Luttner. Because U.S. primary aluminum capacity is thin, a lot of what feeds it still crosses the border as alumina or semi-finished product.\n\"So the upside is real, but it's not immune to the same friction it's supposed to be protected from,\" Luttner said.\nThen there are metals plays like Freeport-McMoRan, the third-largest holding in XLB at 6.5% of the ETF, which doesn't really belong in this basket at all, because it's a copper and critical-minerals policy story, an entirely different trade story that is also benefitting from the AI boom.\nLuttner said the border itself is a supply chain, not a line on a map. North American steel and aluminum have run on an integrated, multi-crossing system for three decades.\n\"Canadian primary aluminum into U.S. extruders, U.S.-melted steel going north for finishing, coming back south inside finished autos and appliances. A tariff doesn't tax that shipment once. It compounds every time the metal re-crosses,\" Luttner said. That is what corporate planning teams are up against right now: pulling apart bills of materials line by line to find where a part physically crosses the border more than once. \"That's where this actually bites,\" Luttner added.\nThat makes the new trade war between the U.S. and Canada very different from another recent trade chokepoint for the economy, the Strait of Hormuz.\n\"Hormuz is geography, the oil has nowhere else to go. This is policy — the volume can reroute, reshore, or get absorbed into price, it just takes 12 to 24 months of capital and requalification to do it,\" Luttner said. \"It's a slow-motion reallocation. So the real story isn't which stock popped, it's which manufacturers had already de-risked their supply chain before this week, and which ones are only now finding out how many times their product crosses that border,\" Luttner said.\nMoody's Sheth said the rating agency will be watching closely the performance within heavy manufacturing, steel and aluminum. Ultimately, the larger companies can usually withstand shocks better but the uncertainty of the situation can cause the most damage as companies reconfigure their long term options and supply chains. \"Companies won't sit on their hands and wait,\" Sheth said.\n—CNBC's Kevin Breuninger contributed to this report.",

    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

    "bodyOriginal": "Tariff refunds have muddied retailers' earnings reports in recent weeks as Wall Street struggles to parse through the confusion.\nMost major retailers applied for refunds after the Supreme Court ruled in February that the International Emergency Economic Powers Act did not authorize President Donald Trump to impose the tariffs. That money began flowing in during the second quarter, as retailers saw major boosts to their profits.\nFor the most part, those returns have helped companies offset cost inflation and prop up margins, especially as they face cost pressures like the rising price of fuel. But the way those retailers have reported those refunds and incorporated them into their earnings has differed greatly, leading to confusion about how to read the strength of their results and their future outlooks.\n\"These trails aren't always clean in terms of finding the right way to apply, in a fair sense, the rebate to prices,\" Bryan Eshelman, a managing director in the retail practice at consulting firm AlixPartners, told CNBC.\nEshelman said there are two factors at play with how retailers handled the refunds. Determining where the extra money goes depends largely on the retailer's price position in the market, where more value-driven companies are likely to apply funds to keep prices lower and \"proclaim that to the marketplace,\" he said.\nThe tariff refund situation has been further complicated for companies depending on whether they are the importer of record for the products, which determines who gets the refunds, Eshelman said. Much of what's sold in stores isn't necessarily imported by the retailer, or U.S. manufacturers may be the ones receiving rebates for raw materials.\n\"There's also just the reality of record-keeping internal to retailers and whether or not they easily have a way to attribute the rebate directly back to a product that was already sold,\" he said. \"It's not a simple task.\"\nPrice cuts\nSome retailers chose to explicitly say they were dedicating their extra cash to lowering prices on products for consumers.\nHome Depot saw its gross margin increase 0.3% in its fiscal second quarter compared with the prior year, driven by its tariff refund. The company said it received $730 million in tariff refunds during the period, using roughly $685 million of that money to reduce the cost of goods sold.\nChief Financial Officer Richard McPhail said on a call with analysts that those funds represent \"the vast majority\" of what the company was expecting to receive.\nWalmart took a similar route. CFO John David Rainey told CNBC last week that the company was eligible to receive roughly $2.9 billion in tariff refunds and has yet to get back just under $100 million of that total. Its gross profit for Walmart U.S. grew 1.6% from the boost.\nHe told CNBC that the company plans to use those funds to lower prices for consumers, and shoppers and investors will see the impact during its current fiscal third quarter.\nTJX Cos. also said it used its $331 million in tariff refunds to benefit its second-quarter cost of sales.\nEshelman said low-price operators likely have a \"strategic reason\" to apply refunds to prices, though enticing consumers with value has become harder in an increasingly crowded retail space.\n\"At the end of the day, a product is worth what somebody's willing to pay for it, and there is a lot of choice in this marketplace,\" Eshelman said.\nMargin boosts\nLowe's, on the other hand, said its tariff refund gave it an 11-cent boost to its earnings per share for the second quarter. CEO Marvin Ellison told CNBC the company received roughly $80 million in repayments and did not plan to use tariff dollars to lower prices, unlike some of its competitors.\n\"We feel strongly that we want to deliver strong profitability for our shareholders and make sure that we don't follow any aggressive pricing action,\" he said.\nEllison added on a call with analysts that the company took \"the right planned steps to drive profitability\" with its windfall.\nTarget also did not explicitly say whether the company was using its tariff refunds to cut prices, though the company said it lowered prices on more than 10,000 items in the second quarter. Still, the retailer said tariff refunds gave it a $752 million boost to net earnings, or $1.65 per share, and a $994 million pretax benefit to its second-quarter gross margin and operating income.\n\"We have, and will continue, to invest in price to ensure our guests are getting tremendous value each and every time they visit us at Target,\" CFO Jim Lee said on a call with reporters.\nKohl's CEO Michael Bender told CNBC on Wednesday that the company put $100 million of the refunds it has received into its gross margin in the second quarter and plans to use the rest to invest in deeper inventory.\n\"All of [the uses of the repayments] have to have a return, so we're not just going to be throwing money out and saying, 'I hope this works,' but we're very disciplined about it,\" Bender said.\nAlixPartners' Eshelman said the one-time tariff boosts are also going to have implications for future quarters, especially as retailers forecast a higher-than-expected tariff rate and Trump's tariff policies change by the day.\nWall Street and Main Street\nThe extra boosts to earnings this quarter meant that comparisons to last year's results were skewed in retailers' favor in many cases.\nBut on the other side of that coin, those windfalls will also set a higher bar for comparisons next year due to the inflated numbers this season.\n\"It's an unfair positive comparison to last year's quarter, and it's going to be an unfair negative comparison to next year's quarter,\" Eshelman said. \"I think investors need to just, where it's material, make that adjustment in their expectations.\"\nFor shoppers, Eshelman said it's likely consumers won't be able to quantify if the price cuts are truly proportionate to the refunds that the retailers received. Inflationary pressures like rising fuel prices, among other factors, can also affect those prices.\n\"How does a consumer know what percentage of a price increase was tariff-related versus diesel or fuel related?\" he said. \"How does a consumer know that the price went down commensurate with the level of rebate?\"\nStill, a silver lining from the tariff situation may be that retailers are catching on to needing to have more diverse and agile supply chains.\nAnd at the end of the day, Eshelman said, the tariff calculus comes down to how retailers want their core customer to perceive them.\n\"To me, a lot of this is marketing,\" he said. \"It's trying to create a price perception with consumers, which is an important part of any retailer's job, and I find it hard to untangle that.\"",

    "id": "icelanders-reject-reopening-talks-to-joi-cd5720fb",
    "title": "Icelanders reject reopening talks to join the EU despite Trump's Greenland threats",
    "titleJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Icelanders voted to reject resuming talks to join the European Union, as issues such as domestic control over fishing appeared to override geopolitical security concerns.\nBroadcaster RUV reported that 52.8% of voters rejected the government's push to reopen EU membership negotiations, while 47.2% voted in favor.\nThe question put to the Nordic nation of nearly 400,000 was whether Iceland should resume accession negotiations with the European Union.\nA majority \"yes\" vote would have led to a negotiated agreement being put to a second referendum for Icelanders to accept or reject.\nThe debate has taken on deeper significance in the wake of U.S. President Donald Trump's Arctic saber-rattling.\nBut in the end, concern over the potential loss of control over its fishing industry and an erosion of national identity won out over how Iceland might be affected by geopolitical rivalries.\n\"The 'No' side succeeded because it tapped into the most fundamental driver of Icelandic national identity: the demand for absolute self-governance. This is inextricably linked to control over natural resources and fisheries, which forms the very heart of the Icelandic understanding of sovereignty,\" said Eiríkur Bergmann, professor of politics at Iceland's Bifröst University.\nFishing's share of Iceland's broader economy has declined over the decades, even as seafood remains a major export industry.\nMarine products and farmed fish made up nearly 47% of the country's exports in the August 2025-July 2026 period, according to Statistics Iceland.\nBut production halved from a peak of 2.2 million tons in 1997 to 1.1 million tons in 2024, World Bank data show. Agriculture, forestry and fishing contributed 9.1% of Iceland's gross domestic product in 1995, but only 3.7% by 2025, as manufacturing and services grew in importance.\nGreenland or Iceland?\nThe U.S. president has long advocated for control over neighboring Greenland on national security grounds. Notably, Trump appeared to repeatedly mix up Greenland and Iceland during a special address at the World Economic Forum in Davos, Switzerland earlier in the year.\nIceland, a founding member of NATO, is the only ally without its own military forces. The country also sits astride the so-called GIUK Gap, a naval choke point between Greenland, Iceland and the U.K. that links the Arctic to the Atlantic Ocean.\nThe country applied to join the EU in 2009 in the aftermath of the global financial crisis. A euroskeptic government suspended negotiations in 2013, and the accession process was formally ended in 2015.\nIt's already deeply integrated into the European framework, partly through its membership of the European Economic Area, which gives the volcanic island access to the EU's single market without requiring full membership.\nIt's also a member of the Schengen Area, which allows passport-free travel between it and other participating European countries.\nAt the start of the year, Iceland's Foreign Minister Thorgerdur Gunnarsdottir said that deeper dialogue and collaboration with the EU would be a key factor in shoring up the country's interests.\n\"It is clear that the international system we have lived in since the end of World War II is in turmoil,\" Gunnarsdottir said in an article for Icelandic newspaper Visir, according to a Google translation.\n\"What is perhaps most striking about this referendum is that despite the profound geopolitical upheaval around us – including rapidly shifting security paradigms in the North Atlantic – these global realities never really filtered properly through into the public debate,\" Bifröst University's Bergmann said.\n\"The 'Yes' side lost because they ran a highly technical and, frankly, passionless campaign.\"\n—CNBC's Sam Meredith contributed to this story.",

    "titleJa": "スイスのレイブで銃乱射事件後、捜査員が女性（22）死亡、5人負傷",
    "summaryJa": "スイスのレイブで銃乱射事件後、捜査員が女性（22）死亡、5人負傷- 公開されました",
    "bodyOriginal": "Manhunt after shooting at Swiss rave kills woman, 22, and injures five\n- Published\nA manhunt is under way after a 22-year-old woman was killed and five others injured in a shooting at a rave in Switzerland.\nThe woman died at the scene in Aarau, police said. Those injured were four men and a woman aged between 24 and 27, all of whom are in hospital with injuries \"ranging from minor to severe\".\nOrganisers and performers said the shooting happened at a techno rave being held at a horse racing track in the town, which is located some 46km (29 miles) west of Zurich.\nA police spokesperson told Swiss media on Sunday afternoon that they had \"no concrete leads\", having earlier said the shooter's identity and motives were unclear.\nIt is unlikely that they are still in Aarau, spokesman Bernhard Graser told Swiss newspaper Blick, but there is \"no imminent danger\".\nThe force said it had received an initial report of shots fired at the Schachen race track at 02:30 local time (01:30 BST).\nA DJ who was due to perform until the scheduled end of the event at 02:00 said the incident occurred \"straight after our set\", in a post on social media.\nAnother performer, DJ Tekibo, said he had lost a friend in the incident. He wrote on Instagram that he was \"still trying to process what happened\".\nOlivier Grein, whose firm Agency Events AG organised the event, said the company was \"shaken\" and would do all it could to support police.\nAn eyewitness told Blick that he \"suddenly heard the gunshots\" minutes after the music stopped at 02:30, initially believing they were fireworks.\nHe said he was told to hide by a man and a woman, the latter of whom was then shot.\nOrganisers had expected up to 3,500 people to attend. Police asked witnesses to submit photographs and video from the scene.\nAn area around the racing track, the town's swimming pool and sports field has been cordoned off, with the public urged to stay away.\nA large contingent of officers has also been deployed beyond Aarau \"as a precaution\", Aargau Cantonal Police said.\nAn AFP journalist reported seeing armed officers deployed on the highway up to 30km (18 miles) from the site of the shooting.\nAarau, home to approximately 23,000 people, is less than 40km (25 miles) from the border with Germany, where local media reported police were supporting Swiss forces.\nImages from Aarau early on Sunday showed a heavy police presence in the area, with an armoured vehicle seen blocking a road. Armed police and officers in riot gear could be seen patrolling the streets.\nIn addition to police and fire officials, the regional disaster response unit (KKE) was deployed, according to broadcaster SRF.\nIt also reported that a Swiss Army helicopter could be seen surveying the area in the early hours.\nSwitzerland has one for the highest rates of gun ownership in Europe, although violent shootings are rare and tighter controls were introduced in recent years.",
    "bodyJa": "スイスのレイブで銃乱射事件後、捜査員が女性（22）死亡、5人負傷\n- 公開されました\nスイスのレイブ会場で銃撃があり、22歳の女性が死亡、5人が負傷したことを受け、捜査が進められている。\n警察によると、女性はアーラウの現場で死亡した。負傷したのは24歳から27歳の男性4人と女性1人で、全員が「軽傷から重傷まで」の負傷で入院している。\n主催者や出演者らによると、銃乱射事件はチューリヒから約46キロ西に位置する町の競馬場で開催されていたテクノレイブで起きたという。\n警察報道官は日曜午後、スイスのメディアに対し、「具体的な手がかりはない」と述べ、これまで銃撃犯の身元や動機は不明だと述べていた。\nベルンハルト・グレーザー報道官はスイスの新聞ブリックに対し、彼らがまだアーラウに滞在している可能性は低いが、「差し迫った危険はない」と語った。\n同部隊は、現地時間午前2時30分（BST午前1時30分）にシャッヘン競馬場で発砲されたという第一報を受け取ったと発表した。\nイベント終了予定の午前2時まで演奏する予定だったDJは、ソーシャルメディアへの投稿で、事件は「セットの直後」に起こったと述べた。\n別のパフォーマー、DJ Tekiboさんは、この事件で友人を失ったと語った。彼はインスタグラムに「何が起きたのかまだ整理中だ」と書いた。\nイベントを企画したエージェンシー・イベントAG社のオリビエ・グレイン氏は、同社は「動揺している」とし、警察を支援するために全力を尽くすと述べた。\n目撃者はブリックさんに、音楽が2時30分に止まった数分後に「突然銃声を聞いた」と語ったが、最初は花火だと思ったという。\n男性と女性に隠れるように言われ、後者は射殺されたと述べた。\n主催者は最大3,500人の参加者を予想していた。警察は目撃者に現場の写真とビデオの提出を求めた。\n競馬場、町のプール、競技場周辺は封鎖され、一般の人々には近づかないよう求められている。\nアールガウ州警察によると、「予防措置として」アーラウ以遠にも警官の大規模部隊が配備されている。\nAFP記者は、銃撃現場から最大30キロ（18マイル）の高速道路上に武装警官が配置されているのを目撃したと報告した。\n約2万3000人が暮らすアーラウは、ドイツとの国境から40キロ（25マイル）以内に位置しており、地元メディアは警察がスイス軍を支援していると報じた。\n日曜早朝にアーラウから配信された画像には、警察が現場に厳重に駐屯しており、装甲車両が道路を封鎖している様子が映っていた。武装警察や暴動鎮圧服を着た警官らが街路を巡回する姿も見られた。\n放送局SRFによると、警察と消防当局に加えて、地域災害対応部隊(KKE)も配備された。\nまた、早朝にはスイス軍のヘリコプターがその地域を調査しているのが見られたとも報じた。\nスイスは欧州で最も銃所持率が高い国だが、暴力的な銃撃事件はまれで、近年はより厳しい規制が導入されている。",

    "bodyOriginal": "Inflation data, earnings reports and tensions in the Middle East have been influencing the market. In this volatile backdrop, investors seeking income can bolster their portfolios by adding dividend-paying stocks.\nThe recommendations of top Wall Street analysts can help inform investors in their search for attractive stocks from the vast universe of dividend-paying companies. These experts assign ratings after analyzing a company's financials and ability to consistently pay dividends while also seeking capital appreciation.\nHere are three dividend-paying stocks that are highlighted by Wall Street's top pros, as tracked by TipRanks, a platform that ranks analysts based on their past performance.\nExxon Mobil\nIntegrated oil and gas giant Exxon Mobil has increased its dividends for 43 consecutive years. At a quarterly dividend of $1.03 per share (annualized dividend of $4.12), XOM stock offers a yield of 2.6%.\nIn his latest research report on energy players, Morgan Stanley analyst Devin McDermott reiterated a buy rating on Exxon Mobil stock and increased his price target to $177 from $168.\nThe analyst raised his free cash flow estimates to reflect Q2 guidance and the oil price strip, with the largest increase noted for integrated players due to higher refining margins. Notably, the five-star analyst raised his cash flow estimates by an average of 20% for the second half of 2026 and 7% for 2027.\nMcDermott highlighted that while pure-play refiners have rallied on stronger margins, integrated energy stocks have lagged, creating relative-value opportunities in major North American integrated producers, including Exxon Mobil, Suncor and Cenovus Energy.\nOverall, McDermott is bullish on Exxon Mobil, as he expects the company to deliver strong earnings and cash flow growth, driven by robust upstream volumes, high-value projects in Product Solutions, and more than $5 billion of additional structural cost savings.\n\"XOM's large global integrated operations and strong balance sheet (0.0x 2027 net leverage) make it a clear defensive play in an uncertain macro backdrop,\" said McDermott.\nMcDermott ranks No. 726 among more than 12,490 analysts tracked by TipRanks. His ratings have been profitable 59% of the time, delivering an average return of 9.80%. See Exxon Mobil Stock Buybacks on TipRanks.\nExpand Energy\nMoving on to natural gas producer Expand Energy. The company announced a quarterly base dividend of $0.575 per share to be paid on Sept. 3. At an annualized dividend of $2.30 per share, EXE offers a yield of about 2.3%.\nRecently, Goldman Sachs analyst Neil Mehta reaffirmed a buy rating on Expand Energy stock and increased his price target to $113 from $99. Mehta attributed his higher price target to cash flow improvement and a strong outlook for shareholder returns. He also cited the stock's attractive valuation, with an 11% free cash flow, or FCF, yield based on his 2027/2028 estimates compared with the peer average of 9%.\nThe five-star analyst expects Expand Energy to generate FCF per share of about $10 in FY28, up from the prior estimate of about $8 at his mid-cycle price forecast of $3.50/MMBtu Henry Hub. Mehta raised his FCF estimate to reflect an improved outlook for share repurchases, operational efficiencies, and gas pricing realizations.\nFurthermore, the analyst expects the recently announced $1.25 billion Twin Eagle acquisition to enhance the competitive positioning of the combined business to expand to premium markets and capture incremental deals in the power and LNG end markets.\nMehta ranks No. 449 among more than 12,490 analysts tracked by TipRanks. His ratings have been successful 64% of the time, delivering an average return of 12.1%. See Expand Energy Insider Trading on TipRanks.\nDiamondback Energy\nMehta is also bullish on Diamondback Energy, an independent oil and natural gas company focused on energy reserves that are primarily in the Permian Basin in West Texas. The company recently paid a base cash dividend of $1.10 per share for the second quarter of 2026. FANG stock offers a dividend yield of 2.2%.\nMehta increased his price target on FANG stock to $220 from $212 and reiterated a buy rating, citing the company's capital-efficient volume growth as oil prices remain high amid persistent supply disruption in the Middle East.\n\"We remain constructive on FANG, a high-quality, pure-play Permian Basin operator that continues to drive incremental capital efficiencies and strong well productivity relative to peers,\" said Mehta.\nAlso, the analyst said that the removal of a minimum return of capital commitment gives Diamondback more flexibility in taking capital allocation decisions amid high oil price volatility and macro uncertainty.\nMehta added that Diamondback sees a favorable environment for production growth, driven by the potential need for global inventory restocking. He highlighted that during Q2 2026, FANG's production volumes of 1,018 Mboe/d exceeded the high end of the company's guidance, driven by a stronger-than-expected natural gas output from Barnett development and improved downstream gas marketing.\nOverall, Mehta is optimistic about Diamondback's growth and sees more upside in the stock, given higher production estimates, solid productivity and a deepening position in the Barnett shale formation. See Diamondback Energy Financials on TipRanks.",

    "id": "whatsapp-chat-used-to-send-cash-for-crim-c748eaf9",
    "title": "WhatsApp chat used to send cash for crime and extremism",
    "titleJa": "WhatsApp チャットは犯罪や過激主義への現金送金に使用されていた",
    "summaryJa": "WhatsApp チャットは犯罪や過激主義への現金送金に使用されていた- 公開されました",
    "bodyOriginal": "WhatsApp chat used to send cash for crime and extremism\n- Published\nA WhatsApp group chat was used to send hundreds of millions of euros in cash around the world, funding organised crime and extremism with no paper trail, an investigation by European broadcasters has found.\nThe 532-member group chat, called \"Traders of Greater Europe\", was used to arrange cash transfers across borders for their clients, including to British cities such as Birmingham and London.\nIn one case, payments from Brussels went to militants from the Islamic State group (IS) in Syria.\nThe European Broadcasting Union (EBU) investigative journalism network, external, which includes the BBC, also found wider evidence of similar cash transfer systems being used in people smuggling and drug trafficking.\nThe group chat, which contained more than 82,000 messages sent between late February and December 2022, was first uncovered by Belgian investigating magistrate Vincent Guerra. An investigating magistrate is a judge who examines evidence in complex cases before trial and makes a recommendation about whether they should proceed.\nGuerra said the number of transactions was \"staggering\" and the network covered \"the entire planet\". The case began as an investigation into terror financing, but \"it became just a drop in the ocean of transactions\", he said.\nMembers of the group chat sent messages in Arabic to each other to set up cash payments using the ancient hawala transfer system. Hawala involves a network of trusted money brokers who can arrange for funds to be sent around the world without any electronic record or physical transport of bank notes.\nThe system involves an agreement between two brokers, known as hawaladars, in different locations. One of the hawaladars is paid a sum of cash and the other agrees to supply the same sum, minus commission, to the recipient. The hawaladars agree to settle up all their transactions between themselves at a later date.\nHawala transfers are frequently used for legitimate purposes, such as immigrant workers sending funds home to support their families in countries with limited access to banks.\nBut criminals can also take advantage of hawala transfers to avoid the Swift system used for most international money transfers, where banks typically flag large transactions outside the normal course of business and are required to report any suspicious activity.\nThe Great Traders of Europe group was reserved for transactions over €5,000 (£4,279) and payments were often much larger. There is no indication that all those participating in the group were involved in handling criminal funds.\nHawala is illegal in many countries, including most of the EU, but is legal in the UK as long as the brokers are registered with Revenue and Customs (HMRC).\nThe cache of WhatsApp messages was obtained by the EBU following a 2024 court case in Belgium which convicted six money launderers, including Abu Adam, the head of the network in Brussels, and his number two, Abu Ahmed.\nBelgian police had discovered evidence that the defendants had been sending money to IS, which was intended to help the wives of militants escape from detention camps in Syria. When they arrested Abu Adam, they discovered the Traders of Greater Europe group chat on his phone.\nGuerra said it was like \"hitting the jackpot\", uncovering the inner workings of a vast, underground system. The phone also contained 6,000 photos of €5 notes showing the serial numbers and 6,000 photos of identity cards. These details are often used as unique identifying codes in hawala transactions, and the total number of notes and ID cards suggest Abu Adam had processed at least 12,000 transactions, Guerra said.\n\"This isn't just amateur work; it's professional, and at a level we could never have imagined,\" he said. \"They're bankers with no government oversight.\"\nThe EBU also found further gangs across Europe using the hawala system for criminal activity. One former money launderer previously involved in European hawala networks, whom we are calling Frank, told the EBU he had been involved in transactions totalling several hundred million euros.\nHis first introduction to the hawala system had been at an office in a small town outside Rotterdam, he said. There, five or six messengers had arrived with money in about an hour and a half, transferring at least a million euros, he estimated.\n\"What I found out later is that it's not just about money. It's about the financing of terror. It's about drug trafficking. It's about prostitution and all sorts of other crap, to put it nicely,\" he said.\nCases in Austria have also revealed how the hawala system is bound up with people smuggling and violence.\nIn one case investigated by Austrian broadcaster ORF, part of the EBU network, Austrian police raided what they called \"the biggest hawala office in Vienna\". It was run from a kebab restaurant on a busy thoroughfare and which authorities say was used to make payments for people smuggling.\nTwo Syrian brothers who ran the operation were charged with human trafficking, as well as torturing and raping a courier who had lost €350,000 (£300,000), saying he had been robbed. They were convicted last year and sentenced to 18 and 8 years in prison respectively.\nAustrian police and Europol also recently dismantled another people-smuggling ring financed through hawala, which officials said had transported about 100,000 people into Europe over 18 months.\nGerald Tatzgern, who leads human-trafficking investigations at Austria's Criminal Intelligence Service, the BK, told ORF that torture was a reality of people smuggling and was also used to maximise profits.\nHe said: \"Videos of the torture are then sent to the families, saying that if they don't send another €1,000 or several thousand euros, then the person concerned - your son, your brother, your father - will suffer.\"\nPayments to stop the torture were demanded through the hawala system, he said.\nPolice commander and Europol liaison officer Quentin Mugg, who has led a number of money-laundering investigations, said the hawala system was \"the primary money-laundering channel for organised crime\".\n\"Whether the money comes from migrant smuggling, human trafficking, pimping, a grandmother's savings sent as a birthday present to her son, or a Malian working in France who wants to support his family, [the hawaladars] couldn't care less,\" he said. \"And they'll apply their rates.\"",
    "bodyJa": "WhatsApp チャットは犯罪や過激主義への現金送金に使用されていた\n- 公開されました\nWhatsAppのグループチャットを利用して世界中に数億ユーロの現金が送金され、紙面証拠なしで組織犯罪や過激主義に資金を提供していたことが欧州放送局の調査で判明した。\n「Traders of Greater Europe」と呼ばれる532人のメンバーからなるグループチャットは、バーミンガムやロンドンなど英国の都市を含む顧客のために国境を越えた現金送金を手配するために使用された。\nあるケースでは、ブリュッセルからの支払いがシリアの過激派組織「イスラム国」（IS）の武装勢力に送られた。\nBBCを含む外部の欧州放送連合（EBU）調査報道ネットワークも、同様の現金送金システムが密輸や麻薬密売に使用されている幅広い証拠を発見した。\nこのグループチャットには、2022年2月下旬から12月までに送信された8万2000件以上のメッセージが含まれており、ベルギーの捜査判事ヴィンセント・ゲラによって初めて明らかにされた。捜査判事は、裁判前に複雑な事件の証拠を調査し、続行すべきかどうかについて勧告を行う裁判官です。\nゲラ氏は、取引の数は「驚異的」であり、ネットワークは「地球全体」をカバーしていると語った。この事件はテロ資金供与の捜査として始まったが、「取引の大海の一滴に過ぎなくなった」と同氏は語った。\nグループチャットのメンバーは互いにアラビア語でメッセージを送信し、古代のハワラ送金システムを使って現金支払いを設定した。 Hawala には、紙幣の電子記録や物理的な輸送を一切行わずに、資金を世界中に送金できるように手配できる信頼できる資金ブローカーのネットワークが関与しています。\nこのシステムには、異なる場所にあるハワラダーとして知られる 2 つのブローカー間の契約が含まれます。ハワラダールの 1 人には現金が支払われ、もう 1 人は手数料を差し引いた同額を受取人に提供することに同意します。ハワラダールは、彼らの間のすべての取引を後日決済することに同意します。\nハワラ送金は、銀行へのアクセスが限られている国の家族を養うために移民労働者が本国に送金するなど、正当な目的で頻繁に使用されます。\nしかし、犯罪者はハワラ送金を利用して、ほとんどの国際送金に使用される Swift システムを回避することもできます。Swift システムでは通常、銀行は通常の業務外の大規模取引にフラグを立て、不審な行為があれば報告する必要があります。\nGreat Traders of Europe グループは 5,000 ユーロ (4,279 ポンド) を超える取引を対象としており、支払い額はそれよりも高額になることがよくありました。グループの参加者全員が犯罪資金の取り扱いに関与していた形跡はない。\nハワラは、EU の大部分を含む多くの国で違法ですが、仲介業者が歳入関税局 (HMRC) に登録されている限り、英国では合法です。\nWhatsAppメッセージのキャッシュは、ブリュッセルのネットワーク責任者アブ・アダム氏とナンバー2のアブ・アーメド氏を含むマネーロンダリング業者6人に有罪判決を下した2024年のベルギーの裁判を受けて、EBUによって入手された。\nベルギー警察は、被告らがシリアの強制収容所から過激派の妻らを逃亡させる目的でＩＳに送金していた証拠を発見した。アブ・アダムを逮捕したとき、彼らは彼の携帯電話で大ヨーロッパ貿易業者のグループチャットを発見した。\nゲラ氏は、これは広大な地下システムの内部構造を明らかにする「大当たり」のようだったと語った。この携帯電話には、シリアル番号が記載された5ユーロ紙幣の写真6,000枚と身分証明書の写真6,000枚も含まれていた。これらの詳細は、ハワラ取引における固有の識別コードとしてよく使用され、紙幣とIDカードの合計数から、アブ・アダムが少なくとも1万2000件の取引を処理したことが示唆されるとゲラ氏は述べた。\n「これは単なるアマチュアの仕事ではありません。プロの仕事であり、私たちが想像もできなかったレベルです」と彼は言いました。 「彼らは政府の監督を受けていない銀行家だ。」\nEBU はまた、ハワラ システムを犯罪行為に使用しているヨーロッパ全土のさらなるギャングも発見しました。以前ヨーロッパのハワラネットワークに関与していた元マネーロンダリング業者の一人（フランクと呼ぶ）は、総額数億ユーロの取引に関与していたとEBUに語った。\n彼が初めてハワラ システムに出会ったのは、ロッテルダム郊外の小さな町にあるオフィスだったという。そこには、約1時間半以内に5、6人のメッセンジャーがお金を持って到着し、少なくとも100万ユーロを送金したと同氏は推定した。\n「後で分かったのは、これはお金だけの問題ではないということだ。テロ資金供与の問題だ。麻薬密売の問題だ。良く言えば、売春やその他あらゆるがらくたの問題だ」と彼は語った。\nオーストリアでの事件は、ハワラ制度が人々の密入国や暴力とどのように結びついているのかも明らかにした。\nEBUネットワークの一部であるオーストリアの放送局ORFが調査したある事件では、オーストリア警察が「ウィーン最大のハワラ事務所」と呼ぶところを強制捜査した。交通量の多い大通りにあるケバブレストランが経営しており、当局は密入国者の支払いに使われていたとしている。\n作戦を実行したシリア人の兄弟２人は、人身売買のほか、強盗に遭ったとして35万ユーロ（約30万ポンド）を失った配達員を拷問し強姦した罪で起訴された。彼らは昨年有罪判決を受け、それぞれ懲役18年と懲役8年を言い渡された。\nオーストリア警察とユーロポールも最近、ハワラを通じて資金提供された別の人身密航組織を解体した。当局者は、この組織が18カ月間で約10万人を欧州に移送したと発表した。\nオーストリアの刑事情報局BKで人身売買捜査を指揮するジェラルド・タッツガーン氏はORFに対し、拷問は人身密航の現実であり、利益を最大化するためにも行われていると語った。\n同氏は、「その後、拷問のビデオが家族に送られ、さらに1000ユーロか数千ユーロを送金しなければ、関係者、つまりあなたの息子、あなたの兄弟、あなたの父親が苦しむことになると伝えられている」と語った。\n拷問を中止するための支払いはハワラシステムを通じて要求されたと彼は述べた。\n数多くのマネーロンダリング捜査を指揮してきた警察司令官兼ユーロポール連絡官のクエンティン・マグ氏は、ハワラシステムが「組織犯罪の主要なマネーロンダリング経路」であると述べた。\n「そのお金が移民の密航、人身売買、売春斡旋、息子への誕生日プレゼントとして送られた祖母の貯金、あるいは家族を養いたいフランスで働くマリ人から来ていようが、（ハワラダールたちは）まったく気にしていない」と同氏は語った。 「そして彼らは彼らの料金を適用するでしょう。」",

    "id": "iceland-eu-referendum-on-a-knife-edge-as-b9fb0268",
    "title": "Iceland EU referendum on a knife edge as counting continues",
    "titleJa": "アイスランドのEU住民投票、開票が続くナイフエッジ",
    "summaryJa": "アイスランドのEU住民投票、開票が続くナイフエッジ- 公開されました",
    "bodyOriginal": "Iceland EU referendum on a knife edge as counting continues\n- Published\nIceland's closely fought referendum on whether to resume membership talks with the European Union is going down to wire, with the result too close to call.\nBased on the first 153,197 votes counted of the 270,000 voters eligible, 50.1% rejected the government's proposal, while 49.9% said yes, public broadcaster RUV said, with just 435 votes splitting them.\nPrime Minister Kristrún Frostadóttir's centre-left government promised to hold a referendum by 2027, but brought it forward because of international tensions, including US President Donald Trump's threats against Greenland.\nHowever, debate in this island nation of almost 400,000 people centred more on its fishing industry rather than security concerns.\nAlready part of the EU's single market and Schengen border-free zone, EU membership would bring Iceland into the customs union and eventually the euro.\nIceland began its application to join the EU in 2009 in the wake of the 2008 financial crisis and the collapse of Iceland's banking system.\nIts application was already well advanced when a eurosceptic government came to power in 2013 and put talks on hold. Fishing rights was the biggest obstacle then - as it remains today.\nFish and marine industries account for almost 40% of Iceland's exports and many No voters feared they would cede some control of their lucrative fishing grounds under the EU's common fisheries policy.\nThe referendum campaign has fuelled debate about Iceland's place in the world, Frostadottir said after casting her ballot in the capital on Saturday.\n\"This is a great day, we've been waiting for this for years to be able to have a vote,\" Frostadottir said, adding that her government would continue its work regardless of the outcome.\nThe question on the ballot was: \"Should Iceland resume accession negotiations with the European Union?\"\nA Yes vote would not be a final decision on joining the EU, but a move towards an accession agreement, which would then have to be approved by a second referendum.\nEqually, the No vote would not rule out the chance of Iceland resuming talks in the future.\nWhile economic issues dominated the referendum campaigns, security concerns also featured.\nIceland is a founder member of Nato but it has no military and relies on its allies for defence.\nThe country has backed Ukraine during Russia's full-scale invasion and officials have been alarmed by Russia's increased maritime manoeuvres near the island.\nTrump's expressed interest in taking over Greenland has also raised concerns.",
    "bodyJa": "アイスランドのEU住民投票、開票が続くナイフエッジ\n- 公開されました\nアイスランドの欧州連合（EU）加盟交渉再開の是非を問う接戦となった住民投票は、決着が近すぎて決着がつかない状況となっている。\n公共放送RUVによると、有権者27万人のうち最初に集計された15万3197票に基づくと、50.1％が政府提案を拒否し、49.9％が賛成と答え、その差はわずか435票だったという。\nクリストルン・フロスタドッティル首相の中道左派政府は2027年までに住民投票を実施すると約束していたが、グリーンランドに対するドナルド・トランプ米大統領の脅迫など国際的な緊張を理由に実施を前倒しした。\nしかし、人口約40万人のこの島国での議論は、安全保障上の懸念よりも漁業に集中していた。\nすでにEUの単一市場およびシェンゲン国境フリーゾーンの一部となっているが、EU加盟によりアイスランドは関税同盟に加わり、最終的にはユーロに加わることになる。\nアイスランドは、2008年の金融危機とアイスランドの銀行システム崩壊を受けて、2009年にEUへの加盟申請を開始した。\n2013年にEU懐疑派の政府が政権を樹立し、交渉が保留されたとき、その適用はすでにかなり進んでいた。当時は漁業権が最大の障害でしたが、それは今でも変わりません。\nアイスランドの輸出のほぼ40％を水産・水産業が占めており、ノー派の多くの有権者は、EUの共通漁業政策のもとで、儲かる漁場の管理権の一部を譲り渡されるのではないかと懸念していた。\n土曜日に首都で投票したフロスタドッティル氏は、国民投票運動により、世界におけるアイスランドの地位についての議論が高まっていると述べた。\nフロスタドッティル氏は「今日は素晴らしい日だ。私たちは投票ができるよう何年もこの日を待っていた」と述べ、結果に関係なく政府は取り組みを続けると付け加えた。\n投票用紙の質問は「アイスランドは欧州連合との加盟交渉を再開すべきか？」だった。\n賛成票を投じてもEU加盟の最終決定ではなく、加盟合意に向けた動きとなり、その後2回目の国民投票で承認される必要がある。\n同様に、反対票が投じられたからといって、アイスランドが将来交渉を再開する可能性が排除されるわけではない。\n国民投票キャンペーンでは経済問題が大半を占めたが、安全保障への懸念も取り上げられた。\nアイスランドはNATO創設メンバーであるが、軍隊を持たず、防衛を同盟国に依存している。\n同国はロシアの全面侵攻中にウクライナを支援しており、当局者らはロシアが同島付近で海上行動を強めていることに警戒している。\nトランプ大統領がグリーンランド乗っ取りに関心を示したことも懸念を引き起こしている。",

    "id": "canada-installs-large-lake-ontario-sign-9ec0f626",
    "title": "Canada installs large Lake Ontario sign in latest jab at US",
    "titleJa": "カナダ、米国への最新の攻撃にオンタリオ湖の大きな看板を設置",
    "summaryJa": "カナダ、米国への最新の攻撃にオンタリオ湖の大きな看板を設置- 公開されました",
    "bodyOriginal": "Canada installs large Lake Ontario sign in latest jab at US\n- Published\nOntario Premier Doug Ford has hit back at Donald Trump by installing a large sign on Canada's shoreline with the message: \"Lake Ontario. Now and Always.\"\nThe US president signed an executive order on Thursday seeking to change its name to Lake America and has shared a series of AI-generated videos about the lake that straddles both countries.\n\"Long before President Trump, this lake was called Lake Ontario. Long after President Trump is gone, it will still be called Lake Ontario,\" Ford said.\nThe war of words was triggered after trade talks collapsed, with the US imposing new 50% tariffs on $20bn (C$28bn) of Canadian goods. Canada will implement \"dollar for dollar\" counter-tariffs next month.\nTrump said the decree was effective immediately as he signed the order to rename it Lake America.\nWhile he has broad discretion over how the US recognises landmarks, other countries are not required to follow. Canadian officials have dismissed Trump's move.\nOn Saturday, Trump also posted several AI-generated videos on social media, with one showing him kicking over a Lake Ontario sign and replacing it with one that says: \"Welcome to Lake America.\"\nAnother video depicted a flock of Canada geese sporting the US president's hair and holding rifles as they patrolled the shoreline of a newly named Lake America.\nFord said Trump's renaming of the lake was because he \"didn't like Ontario and Canada standing up for ourselves\".\nStanding in front of the newly unveiled Lake Ontario sign, Ford added: \"Just in case President Trump or anyone else forgets, we've set up this sign to remind them, it's Lake Ontario, now and forever.\"\nIt echoes Canadian Prime Minister Mark Carney's previous response to the row, insisting \"things must be called by their name, and this lake is called Lake Ontario - today and forever\".\nThe names of four of the Great Lakes - Ontario, Huron, Michigan and Erie - originate from indigenous words. Lake Superior was named after an anglicised French word. Lake Ontario, the smallest of the Great Lakes, borders both the Canadian province and the US state of New York.\nTrump's executive order gives the US Department of the Interior 30 days to update the name change with the Geographic Names Information Service - the official repository of domestic geographic names in the US.\nWhen Trump entered the White House in 2025, he signed a similar order that changed the Gulf of Mexico to the Gulf of America. Mexico has rejected the name change, arguing a single country cannot rename a shared body of international water.\nIt also led to a legal dispute between Mexico and tech giant Google, which renamed the gulf in its maps application.\nIn that case, Google Maps users in the US see \"Gulf of America\", while those in Mexico see the \"Gulf of Mexico\". Those in other countries see the \"Gulf of Mexico (Gulf of America)\".\nRelated topics\n- Published1 day ago\n- Published3 days ago",
    "bodyJa": "カナダ、米国への最新の攻撃にオンタリオ湖の大きな看板を設置\n- 公開されました\nオンタリオ州のダグ・フォード首相は、カナダの海岸線に「オンタリオ湖。今もこれからも」というメッセージを書いた大きな看板を設置し、ドナルド・トランプ氏に反撃した。\n米国大統領は木曜日、湖の名前をアメリカ湖に変更することを求める大統領令に署名し、両国にまたがるこの湖についてAIが生成した一連の動画を共有した。\nフォード氏は「トランプ大統領のずっと前から、この湖はオンタリオ湖と呼ばれていた。トランプ大統領がいなくなってもずっと後も、この湖はオンタリオ湖と呼ばれるだろう」と語った。\n舌戦は通商協議が決裂し、米国が200億ドル（280億カナダドル）のカナダ製品に新たに50％の関税を課したことを受けて始まった。カナダは来月、「ドルにはドル」対抗関税を導入する予定だ。\nトランプ大統領は、アメリカ湖の名前を変更する命令に署名したため、この命令は直ちに発効すると述べた。\n同氏は米国がランドマークをどのように認識するかについて広範な裁量権を持っているが、他国が従う必要はない。カナダ当局はトランプ大統領の動きを否定した。\n土曜日にはトランプ大統領もソーシャルメディアにAIが生成したいくつかの動画を投稿しており、そのうちの1つはオンタリオ湖の看板を蹴り倒し、「アメリカ湖へようこそ」と書かれたものに差し替える様子を映していた。\n別のビデオには、カナダガンの群れが米国大統領の髪を振りかざし、ライフルを構え、新たに命名されたアメリカ湖の湖畔を巡回する様子が映されていた。\nフォード氏は、トランプ大統領が湖の名前を変更したのは「オンタリオ州とカナダが自分たちのために立ち上がるのが気に入らない」ためだと述べた。\n新たに公開されたオンタリオ湖の標識の前に立ったフォード氏は、「トランプ大統領や他の誰かが忘れた場合に備えて、私たちはこの標識を設置して、今も永遠もオンタリオ湖であることを思い出させるためにこの標識を設置した」と付け加えた。\nこれは、この騒動に対するカナダのマーク・カーニー首相の以前の反応を反映し、「物事はその名前で呼ばれるべきであり、この湖は今日も永遠にオンタリオ湖と呼ばれる」と主張した。\n五大湖のうち 4 つであるオンタリオ湖、ヒューロン湖、ミシガン湖、エリー湖の名前は、先住民族の言葉に由来しています。スペリオル湖の名前は、英語化されたフランス語にちなんで付けられました。五大湖の中で最小のオンタリオ湖は、カナダの州と米国のニューヨーク州の両方に隣接しています。\nトランプ大統領の大統領令は、米国内務省に対し、米国国内の地理名の公式リポジトリである地理名情報サービスに名前の変更を更新するための30日間の猶予を与えている。\nトランプ大統領は2025年にホワイトハウスに入閣した際、メキシコ湾をアメリカ湾に変更する同様の命令に署名した。メキシコは、単一の国が共有する国際水域の名前を変更することはできないと主張し、名前変更を拒否した。\nまた、メキシコと、地図アプリケーションで湾の名前を変更したテクノロジー大手グーグルとの間の法的紛争にもつながった。\nこの場合、米国の Google マップ ユーザーには「アメリカ湾」が表示され、メキシコのユーザーには「メキシコ湾」が表示されます。他の国の人には「メキシコ湾（アメリカ湾）」が見えます。\n関連トピック\n- 1 日前に公開\n- 3 日前に公開",

    "id": "at-least-37-dead-and-hundreds-evacuated-0587307d",
    "title": "At least 37 dead and hundreds evacuated after strike on Kyiv weapons depot",
    "titleJa": "キエフ武器庫襲撃後、少なくとも37人が死亡、数百人が避難",
    "summaryJa": "キエフ武器庫襲撃後、少なくとも37人が死亡、数百人が避難- 公開されました",
    "bodyOriginal": "At least 37 dead and hundreds evacuated after strike on Kyiv weapons depot\n- Published\nThirty-seven people have died and almost 400 have been evacuated after a Russian drone strike hit a depot storing weapons for Ukraine's military near a residential area on the outskirts of Kyiv.\nThe strike caused shells, mines and drones to detonate late on Friday, triggering a blast that damaged nearby properties including a care home for the elderly and disabled, President Volodymyr Zelensky said.\nHe said the storage site \"definitely shouldn't have been there\" and that an investigation had been launched into \"terrible negligence on the part of those who stored explosive right next to people\".\nThe attack is the second to hit a munitions depot near Kyiv in recent months, prompting renewed anger.\nFour children are among the 42 people injured in Friday night's explosion, according to regional head Tymur Tkachenko, with a rescue operation ongoing at the site, in the Bucha district, on Saturday.\nRussia's Ministry of Defence said in a statement that its forces had targeted \"an ammunition depot\" in Myla, a village to the west of the Ukrainian capital, holding \"components and launch boosters for FP-1/FP-2 long-range unmanned aerial vehicles\".\nThe explosion damaged about 130 homes in the village.\n\"Everything is completely damaged,\" local resident Liubov Pavlenko, 45, told the BBC while inspecting her home around 200m from the ammunition warehouse.\n\"There are cracks all around the entire perimeter, and cracks around the windows. Basically, the structural integrity has been compromised,\" she added.\n\"I'm still kind of numb. I don't know… once I come around a little tomorrow, I'll probably have an even bigger breakdown.\"\nZelensky said the decision to store explosives in the village was \"absolutely unacceptable\", adding: \"Criminal proceedings have been opened on charges of official negligence.\"\nThe office of Ukraine's prosecutor general earlier said it was reviewing the \"legality of the placement and storage of explosive objects and materials\" near residential buildings in Myla.\nIt said the \"actions of officials who made the relevant decisions\" would also be investigated.\nHowever, Zelensky earlier stated that \"there are regulations in place - ammunition cannot be stored near homes or other residential areas\", adding \"appropriate conclusions will certainly be drawn\".\nHe referenced the strike on an ammunition warehouse in Vyshneve in July, which caused a secondary detonation that killed nine, injured dozens more and damaged more than 280 homes.\nFriday night's explosion has raised fresh questions about why munitions were being stored so close to people's homes, especially given the regularity of Russian aerial attacks.\n\"The authorities, the Ministry of Defence - why was this allowed at the depots, in a place where there used to be food?\" Borys Daniyluk, 61, said.\n\"Why were ammunition and weapons stored there, next to a populated village? There are no words, just emotions.\"\nUkrainian Prime Minister Sergiy Koretsky expressed regret that a \"lesson\" had not been learned following the explosion in Vyshneve.\nThe investigation into that incident revealed serious failings on the part of a state-owned company that had not complied with regulations regarding storage of explosives near residential buildings.\nZelensky indicated that the Myla depot had been operated by Ukraine's armed forces.\n\"In the fifth year of the full-scale invasion, making the same mistakes over and over is criminal negligence,\" Koretsky said on Telegram.\n\"Everyone responsible, without exception, must face severe punishment so that such situations never happen again.\"\nMeanwhile, Tkachenko said a 14-year-old was killed in a separate attack in the Boryspil district, while Kyiv Mayor Vitaliy Klitschko said a two-year-old had died after a Russian drone crashed in Obolonskyi.\nHe added that five people, including an 18-year-old girl, were injured in fresh strikes on the capital on Saturday morning. Five people have been killed across the country over the past day, according to local officials.\nZelensky reported further overnight strikes in Odesa, Dnipropetrovsk, Sumy and Zaporizhzhia, as the Ukrainian army said it had shot down 233 Russian drones.\nRussia and Ukraine have been intensifying their aerial attacks in recent months, with Kyiv focusing its operations on Russian economic targets.\nUkraine has for weeks struck sites belonging to Wildberries, the country's biggest online retailer, describing the firm as a legitimate target because it supplied components to the military, which Moscow denies.\nIn Russia, local officials said two people had been killed and 25 injured in strikes in the Belgorod and Rostov regions in the past 24 hours.\nThe Moscow-appointed governor of the occupied Ukrainian region of Zaphorizhzhia said four people were injured after a Ukrainian strike hit a shopping centre.\nRussian online retailer Ozon said one of its logistic centres had been hit in an overnight Ukrainian drone strike. It said it had also suspended operations at a second logistics centre and evacuate staff \"due to the danger in the area\".\nThe retailer's facilities in Krasnodar, Dagestan, Stavropol and Adygea were targeted in strikes earlier this week, resulting in several injuries and widespread damage.",
    "bodyJa": "キエフ武器庫襲撃後、少なくとも37人が死亡、数百人が避難\n- 公開されました\nキエフ郊外の住宅地近くにあるウクライナ軍の武器を保管する倉庫がロシアの無人機攻撃で攻撃され、37人が死亡、約400人が避難した。\nウォロディミル・ゼレンスキー大統領によると、この攻撃により金曜日遅くに砲弾、地雷、ドローンが爆発し、爆発が起こり、高齢者や障害者のためのケアホームを含む近隣の施設に被害を与えた。\n同氏は、保管場所は「間違いなくそこにあるべきではなかった」とし、「爆発物を人々のすぐ隣で保管していた者の重大な過失」について捜査が開始されたと述べた。\nキエフ近郊の弾薬庫への攻撃はここ数カ月で２度目で、新たな怒りを引き起こしている。\n地方長官ティムール・トカチェンコ氏によると、金曜日の夜の爆発で負傷した42人には子供4人が含まれており、土曜日にはブチャ地区の現場で救助活動が続いている。\nロシア国防省は声明で、ロシア軍がウクライナの首都の西にある村マイラにある「弾薬庫」を標的とし、「FP-1/FP-2長距離無人航空機の部品と発射ブースター」を保管していると述べた。\nこの爆発により、村の約130軒の家が被害を受けた。\n地元住民のリュボフ・パブレンコさん（４５）は、弾薬庫から約２００メートル離れた自宅を視察し、「すべてが完全に損傷している」とＢＢＣに語った。\n「周囲全体に亀裂があり、窓の周囲にも亀裂が入っている。基本的に、構造の完全性が損なわれている」と彼女は付け加えた。\n「まだ少し感覚が麻痺しているんです。わかりません…明日少し回復したら、おそらくさらに大きな故障になるでしょう。」\nゼレンスキー大統領は、村に爆発物を保管するという決定は「絶対に容認できない」と述べ、「公務上の過失の容疑で刑事手続きが開始された」と付け加えた。\nウクライナの検事総長事務所は先に、マイラの住宅付近での「爆発物や爆発物の設置と保管の合法性」を検討していると発表した。\n「関連決定を下した当局者の行動」も調査されると述べた。\nしかし、ゼレンスキー大統領は先に「規制が存在しており、住宅やその他の住宅地の近くに弾薬を保管することはできない」と述べ、「適切な結論が必ず導き出されるだろう」と付け加えた。\n同氏は、7月にヴィシネヴェの弾薬倉庫が襲撃され、二次爆発が発生して9人が死亡、数十人が負傷、280戸以上の家屋が被害を受けたことについて言及した。\n金曜日の夜の爆発は、特にロシアの空襲が定期的に行われていることを考えると、なぜ弾薬が人々の家の近くに保管されていたのかという新たな疑問を引き起こした。\n「当局、国防省、かつて食料があった場所でなぜこれが倉庫で許可されたのですか？」ボリス・ダニルクさん（61）は語った。\n「なぜ人口の多い村の隣に弾薬や武器が保管されていたのでしょうか？言葉はなく、感情だけが残っています。」\nウクライナのセルギイ・コレツキー首相は、ヴィシュネヴェでの爆発事故後に「教訓」が生かされていないことに遺憾の意を表明した。\nこの事件の調査では、住宅付近での爆発物の保管に関する規制を遵守していなかった国営企業側の重大な過失が明らかになった。\nゼレンスキー大統領は、マイラ倉庫はウクライナ軍によって運営されていたと示唆した。\nコレツキー氏はテレグラムで「本格的な侵攻５年目で同じ過ちを繰り返すのは刑事上の過失だ」と述べた。\n「このような事態が二度と起こらないよう、責任者全員が例外なく厳しい処罰を受けなければならない。」\n一方、トカチェンコ氏は、ボルィースピリ地区での別の攻撃で14歳が死亡したと述べ、キエフ市長のヴィタリー・クリチコは、ロシアの無人機がオボロンスキーに墜落し、２歳児が死亡したと述べた。\n同氏は、土曜朝に首都で新たな空爆があり、18歳の少女を含む5人が負傷したと付け加えた。地元当局者によると、この１日で全国で５人が死亡した。\nゼレンスキー大統領は、ウクライナ軍がロシアの無人機２３３機を撃墜したと発表したことを受け、オデッサ、ドニプロペトロウシク、スームィ、ザポリージャでもさらなる夜間攻撃を行ったと報告した。\nロシアとウクライナはここ数カ月、空爆を強化しており、キエフはロシアの経済目標に作戦を集中させている。\nウクライナは数週間にわたり、同国最大のオンライン小売業者であるワイルドベリーズ社のサイトを攻撃し、同社が軍に部品を供給していることから正当な標的であると主張しているが、ロシア政府はこれを否定している。\nロシアでは地元当局者が、ベルゴロド州とロストフ州でのストライキで過去２４時間に２人が死亡、２５人が負傷したと発表した。\nモスクワが任命したウクライナ占領地域ザフォリージャ州知事は、ウクライナによるショッピングセンターへの攻撃で4人が負傷したと発表した。\nロシアのオンライン小売業者オゾンは、一晩のウクライナの無人機攻撃で同社の物流センターの1つが被害を受けたと発表した。また、「地域の危険のため」第２物流センターの業務を停止し、従業員を避難させたと発表した。\nクラスノダール、ダゲスタン、スタヴロポリ、アディゲにあるこの小売店の施設は今週初めにストライキの標的となり、数名の負傷者と広範囲にわたる被害をもたらした。",

    "id": "former-ecuadorian-president-imprisoned-f-352344a6",
    "title": "Former Ecuadorian president imprisoned for corruption",
    "titleJa": "エクアドル元大統領、汚職で投獄",
    "summaryJa": "エクアドル元大統領、汚職で投獄- 公開されました",
    "bodyOriginal": "Former Ecuadorian president imprisoned for corruption\n- Published\nA former president of Ecuador has been sentenced to five years in prison after being found guilty of taking bribes.\nLenín Moreno insisted he had not taken money from a Chinese firm which secured a contract to build a hydroelectric plant in the Latin American nation.\nThe 73-year-old will serve his sentence under house arrest due to his age and disability, and has already indicated his intention to appeal against the verdict after a court in the capital, Quito, found him and 19 others guilty of corruption.\nMoreno, who was president between 2017 and 2021, is the third former Ecuadorian leader to be sentenced for corruption.\nProsecutors alleged that that Sinohydro, which is owned by the Chinese state, paid a total of $76.1m (£56.2m) through shell companies to people involved in the deal to secure the construction of the Coca Codo Sinclair hydroelectric dam.\nAmong those handed prison sentences were Moreno's wife, daughter and brother, as well as former plant managers, Sinohydro representatives and a Chinese ambassador to Ecuador.\nWhile Moreno himself was alleged to have received very little from the scheme, prosecutors said family members received tens of thousands of dollars.\nThose convicted of bribery will have to repay three times what they were given, while Moreno was barred from public office.\nHe denied involvement in the alleged bribery scheme and instead blamed another former president, Rafael Correa, under whom he served as vice-president and who was sentenced to eight years in prison in a separate bribery case in 2020.\nMoreno argued that Correa had signed off on the Coca Codo Sinclair project, and that he had launched an investigation into issues with the construction when he had assumed the presidency.\nThe Ecuadorian government launched legal proceedings against Sinohydro in 2021 due to cracks appearing in the dam and other technical failures. It reached a $400m settlement with the firm's owner earlier this year.\nThe BBC has approached Sinohydro and the Chinese embassy in Ecuador for comment.",
    "bodyJa": "エクアドル元大統領、汚職で投獄\n- 公開されました\nエクアドルの元大統領が収賄の罪で懲役５年の判決を受けた。\nレーニン・モレノ氏は、中南米の国に水力発電所を建設する契約を結んだ中国企業から資金は受け取っていないと主張した。\n73歳の同氏は、年齢と障害のため自宅軟禁下で刑に服する予定だが、首都キトの裁判所が同氏と他の19人に汚職の罪で有罪判決を下したことを受け、すでに判決に対して控訴する意向を示している。\n2017年から2021年まで大統領を務めたモレノ氏は、汚職で有罪判決を受けた元エクアドル指導者としては3人目となる。\n検察は、中国国家所有のシノハイドロ社が、コカ・コド・シンクレア水力発電ダムの建設を確保するために、ダミー会社を通じて取引関係者に総額7,610万ドル（5,620万ポンド）を支払ったと主張した。\n実刑判決を言い渡された人の中には、モレノ氏の妻、娘、兄弟のほか、元工場長、シノハイドロ社の代表者、駐エクアドル中国大使も含まれていた。\nモレノ氏自身はこの計画からごくわずかしか受け取っていないとされるが、検察当局は家族が数万ドルを受け取ったと述べた。\n贈収賄で有罪判決を受けた者は与えられた額の３倍を返済しなければならないが、モレノ氏は公職から追放された。\n同氏は贈収賄疑惑への関与を否定し、その代わりに、自身が副大統領を務め、2020年に別の贈収賄事件で懲役8年の判決を受けた別の元大統領ラファエル・コレア氏を非難した。\nモレノ氏は、コレア氏がコカ・コド・シンクレア計画に同意し、大統領就任時に建設問題の調査を開始したと主張した。\nエクアドル政府は、ダムに亀裂が発生したことやその他の技術的欠陥を理由に、2021年にシノハイドロ社に対する訴訟を開始した。今年初めに同社のオーナーと4億ドルの和解に達した。\nBBCはシノハイドロと在エクアドル中国大使館にコメントを求めた。",

    "title": "Norway's new king remembers 'my dear father' in first speech",
    "titleJa": "ノルウェーの新国王、第一演説で「親愛なる父」を思い出す",
    "summaryJa": "ノルウェーの新国王、第一演説で「親愛なる父」を思い出す- 公開されました",
    "bodyOriginal": "Norway's new king remembers 'my dear father' in first speech\n- Published\nKing Haakon VIII of Norway has paid warm tribute to his late father, Harald V, in his first speech to the nation since taking the throne.\n\"Thank you for being such a good dad,\" he said in an at-times emotional televised address, seated at a desk in Norway's royal palace, beside a picture of the late king, two lit candles and a bowl of white roses.\nHarald, 89, who was seen as a moderniser and \"people's king\" during his 35-year reign, died in hospital on Friday morning after being treated for a rare blood condition.\n\"Now it is my turn,\" his 53-year-old son said, adding that a \"major task\" awaited him and that he wished to be \"present and attentive\" going forward.\nWho is Norway's new King Haakon VIII?\n- Published1 day ago\nNorway mourns King Harald as Haakon VIII ascends throne\n- Published1 day ago\nOslo mayor calls off wedding ceremony after death of Norway's king\n- Published1 day ago\nHaakon stressed national unity in the speech, saying the royal family believed in a \"society built on law and justice, where everyone is of equal value\".\nHe said Harald had been a good father to himself and his sister, Princess Märtha Louise, as well as a \"warm and funny grandfather\" to his six grandchildren and a \"loving and caring husband\" to his widow, Queen Sonja.\nThe new king appeared to choke back tears as he noted that Saturday would have been their 58th wedding anniversary.\nHarald brought the family together \"with a natural authority\", of which he might not have been aware himself, his son recalled.\nHe had \"always stayed true\" to his \"values and commitments\", the new king stressed.\n\"He constantly reminded us in the family that each of us must do things in our own way. Find our own style. Be ourselves,\" Haakon said.\nHe also remarked on the \"powerful and moving experience\" of seeing thousands of Norwegians gather outside the royal palace in the capital Oslo with \"flowers, tributes and candles\".\n\"We are in mourning, yet at the same time it brings comfort and strength that so many are grieving together with us,\" he said.\nNorwegians have been laying flowers outside the royal palace in Oslo since news broke that Harald had died on Friday. A national period of mourning has been declared, with no date yet given for his funeral.\nAmong them was Norway's Prime Minister, Jonas Gahr Støre, who laid flowers outside the palace and signed a book of condolences after greeting the new king, said the country was \"united in grief and gratitude\".\nHaakon will swear an oath of allegiance in parliament on Tuesday and will later participate in a consecration service with his wife, Queen Mette-Marit - a stripped-down version of a coronation, which Norway no longer holds.\nHe assumes his new role at a difficult time, as the royal family has faced health challenges and scandals this year.\nMette-Marit came under scrutiny when it was revealed that she had had a three-year friendship with the late convicted sex offender Jeffrey Epstein, for which she publicly apologised.\nShe later received a lung transplant, after suffering from pulmonary fibrosis since 2018. Doctors will not declare her stable until next year, meaning her husband must balance his new official duties with her care.\nHer son from a previous relationship, Marius Borg Høiby, was convicted in June of rape and other offences and sentenced to four years in prison. He is appealing.\nHøiby is not a member of the royal family, but was raised with them since he was four years old, when Haakon married his mother.\nHaakon's sister, Märtha Louise, has also courted controversy for remarrying an American self-styled shaman in 2024, their business activities ultimately leading her to step back from royal duties.\nWithout directly referencing these controversies, Haakon said during his speech: \"Our family has experienced the importance of standing together in order to remain steadfast both within ourselves and for one another even during difficult times.\"\nHe said he, along with Mette-Marit and Crown Princess Ingrid Alexandra, would \"always strive to understand the life situations of different people\".\nHe added: \"No one who lives in this country knows what we will face together, but what we do know is that we will stand by one another through both good days and difficult ones.\"\nAlthough Harald remained popular until his death, a poll for newspaper Aftenposten earlier this year suggested that support for the monarchy had dropped from 72% in 2024 to 54%.\nHowever, Norwegian royal experts told the BBC that the new king, while facing questions about the turbulence surrounding his family, was respected, hard-working and, they believed, able to move forward despite the challenges.",
    "bodyJa": "ノルウェーの新国王、第一演説で「親愛なる父」を思い出す\n- 公開されました\nノルウェー国王ホーコン8世は、即位後初めて国民に向けた演説で亡き父ハーラル5世に温かい敬意を表した。\n「良い父親でいてくれてありがとう」と、ノルウェー王宮の机に座り、亡き国王の写真、火のついた2本のろうそく、白いバラのボウルの横に座り、時に感情を揺さぶるテレビ演説で語った。\n35年間の治世中、近代化者であり「人民の王」とみなされていた89歳のハラルド氏が、まれな血液疾患の治療を受けた後、金曜朝に病院で死去した。\n53歳の息子は「今度は私の番だ」と語り、「重大な任務」が彼を待っており、今後は「立ち会って注意深く」いたいと付け加えた。\nノルウェーの新国王ホーコン 8 世とは誰ですか?\n- 1 日前に公開\nノルウェー、ハーコン8世の即位に伴いハーラル王を追悼\n- 1 日前に公開\nノルウェー国王死去を受け、オスロ市長が結婚式を中止\n- 1 日前に公開\nホーコン氏は演説で国民の団結を強調し、王室は「法と正義に基づいて構築され、誰もが平等な価値を持つ社会」を信じていると述べた。\n同氏は、ハラルド氏は自身と妹のマーサ・ルイーズ王女にとって良き父親であり、6人の孫にとっては「温かくて面白い祖父」であり、未亡人のソーニャ王妃にとっては「愛情深く思いやりのある夫」だったと述べた。\n新国王は土曜日が二人の58回目の結婚記念日だったと述べ、涙をこらえているようだった。\nハラルドさんは、自分でも気づいていなかったかもしれないが、「自然な権威で」家族を団結させたと息子は回想した。\n新国王は自身の「価値観と公約」に「常に忠実であった」と強調した。\n「彼は家族の中で、私たち一人ひとりが自分のやり方で物事を行わなければならないことを常に思い出させてくれました。自分のスタイルを見つけて、自分らしくありなさい」とホーコンさんは語った。\n同氏はまた、首都オスロの王宮の外に数千人のノルウェー人が「花、賛辞、ろうそく」を持って集まるのを見た「力強く感動的な経験」についても述べた。\n「私たちは喪に服していますが、同時に、これほど多くの人が私たちとともに悲しんでいるということは慰めと力を与えてくれます」と彼は語った。\n金曜日にハラルドさんが亡くなったというニュースが流れて以来、ノルウェー人たちはオスロの王宮の外で献花を続けている。全国的な服喪期間が宣言されたが、葬儀の日程はまだ発表されていない。\nその中にはノルウェーのヨナス・ガール・ストア首相も含まれており、新国王に挨拶した後、宮殿の外に献花し、哀悼の書に署名し、国は「悲しみと感謝の気持ちで団結している」と述べた。\nホーコン氏は火曜日に議会で忠誠の誓いを立て、その後、妻のメッテ・マリット女王とともに聖別式に参加する予定だが、これはノルウェーではもう行われていない戴冠式の簡略版である。\n今年、王室が健康問題やスキャンダルに直面しているため、彼は困難な時期に新たな役職に就くことになる。\nメッテ・マリットさんは、有罪判決を受けた性犯罪者の故ジェフリー・エプスタインさんと3年間にわたる友人関係にあったことが明らかになり、厳しい視線を浴びたが、そのことについて公に謝罪した。\n彼女は2018年から肺線維症を患い、その後肺移植を受けた。医師は来年まで彼女の安定を宣言しないため、夫は新たな公務と彼女の介護のバランスをとらなければならないことになる。\n彼女の以前の交際相手との間にできた息子、マリウス・ボルグ・ホイビさんは、6月に強姦などの罪で有罪判決を受け、懲役4年の判決を受けた。彼は魅力的だ。\nホイビーは王室の一員ではないが、ホーコンが母親と結婚した4歳の頃から王室の一員として育てられた。\nホーコンの妹、マーサ・ルイーズも2024年に米国人の自称シャーマンと再婚して物議を醸しており、彼らのビジネス活動が最終的に彼女を王室の公務から退くことにつながった。\nホーコン氏はスピーチの中で、これらの論争には直接言及せず、「私たち家族は、困難な時期であっても自分自身とお互いのために毅然とした態度を保つために団結することの重要性を経験してきた」と述べた。\n同氏は、メッテ・マリット氏とイングリッド・アレクサンドラ皇太子妃とともに「さまざまな人々の生活状況を理解するよう常に努める」と述べた。\nさらに、「この国に住んでいる人は、私たちが一緒に何に直面するかは誰も知りませんが、私たちが知っているのは、良い日も困難な日もお互いに寄り添っていくということです」と付け加えた。\nハラルド氏は亡くなるまで人気があったが、今年初めのアフテンポステン紙の世論調査では、君主制への支持率が2024年の72％から54％に低下していることが示唆された。\nしかし、ノルウェー王室専門家らはBBCに対し、新国王は家族を取り巻く混乱について疑問に直面しながらも尊敬されており、勤勉であり、困難にもかかわらず前進できると信じていると語った。",
