    "id": "ai-giant-anthropic-valued-at-up-to-1-5tn-8adfe063",
    "title": "AI giant Anthropic valued at up to $1.5tn ahead of stock market debut",
    "titleJa": "AI giant Anthropic valued at up to $1.5tn ahead of stock market debut",
    "summaryJa": "The firm started just five years ago and is now one of the biggest names in artificial intelligence.",
    "bodyOriginal": "AI giant Anthropic valued at up to $1.5tn ahead of stock market debut\n- Published\nAnthropic has seen its value jump to as much as $1.5tn (£1.14tn) as its shares are set to start trading on the stock market on Thursday.\nThe artificial intelligence (AI) company behind the popular chatbot Claude said its shares will be priced at $83 each when it lists on the Nasdaq, a tech-focused stock exchange based in New York.\nThat will make it one of the most valuable companies in the world.\nAnthropic's stock market debut will make it the first US firm focused exclusively on AI to go public. It will also mark a crucial test for the fast-growing industry, which faces questions over whether the huge amounts of money being poured into the technology will be profitable.\nThe firm said earlier this month it would offer its shares for between $70 and $78 each, which valued the company at up to $1.3tn.\nBut demand for Anthropic's stock debut - commonly referred to as its initial public offering, or IPO - is very high, according to one early investor in the company who spoke with the BBC on condition of anonymity.\nThe person said shares were more than 10 times oversubscribed ahead of the public listing, meaning demand for Anthropic shares exceeded the number of shares available.\nIf that turns out to be the case, Anthropic's valuation could quickly blow past its target on Thursday when trading begins.\nCrucial test for AI\nDepending on how strong that demand is, Anthropic could even exceed the early market valuation of Elon Musk's SpaceX, which was the world's most highly valued stock debut when it went public with a value of $2.2tn in June.\nHowever, in the weeks that followed, SpaceX shares fell significantly in price.\nAs it stands, Anthropic's listing will see the firm raise more than $68bn from its initial investors. It is also expecting another $26bn from private placements. So the total amount the company will raise is expected to be $94bn.\nThe amount of cash Anthropic has raised from its listing is already more than SpaceX raised in June.\nOpenAI, the maker of ChatGPT and Anthropic's biggest AI rival, is expected to go public next year.\nUntil then, Anthropic will be the only public company in the US that is entirely focused on the technology, or one that was founded and built around AI tools and products. Its scope is different from tech giants like Google and Microsoft that also develop AI but are involved in other tech services.\nThe seven Anthropic founders who are about to become multi-billionaires\n- Published7 hours ago\nThere is excitement around Anthropic's listing, but also some concern from investors around its ability to generate revenue and profits going forward.\nYang Wang, a principle financial analyst with Counterpoint Research, said the central issue for Anthropic is whether its business \"can keep pace\" as hundreds of billions of dollars in financial obligations come due in the next couple of years.\n\"Nevertheless, it is not an everyday occurrence for public investors to gain direct exposure to a frontier-model developer with the potential to shape the next stage of productivity,\" Wang said.\nWhile nearly every other major tech company is pouring huge amounts of money into the technology and infrastructure required for their own AI tools, they are built around social media or online retail or online search. AI tools and applications are secondary.\n\"Anthropic going public gives us a whole new window into what AI demand looks like,\" Marta Norton, who heads strategy at investment firm Empower, told the BBC.\nRapid rise\nAnthropic was started by a group of co-founders, led by siblings Dario Amodei and Daniela Amodei, all of whom left their work at OpenAI to start a new AI firm.\nThe company has carved itself out in the ongoing AI race as more focused on building the technology with safety top of mind.\nIt refused to comply with a demand by the US Department of Defense that Anthropic's tools be used in an essentially unrestricted way.\nCEO Dario Amodei has been outspoken in his belief that AI tools may soon be so powerful that they present a threat to human existence.\nThe company has urged developers to slow the development of AI, arguing that advanced systems could pose \"catastrophic\" risks to humanity if they are not handled with appropriate safeguards.\nRival firm OpenAI has also voiced similar concerns about the technology's risks and delayed its plans to list on the stock market to address AI safety concerns.\nNonetheless, Anthropic is looking to grow quickly and gain more access to financing through the public markets in order to do so.\nNorton said Anthropic going public now, in a time of market volatility comes down to the simple fact that the company needs access to more money.\n\"AI is financially demanding,\" Norton said. \"The public markets open up the financial spigot a little bit more, and so the time has come.\"\nBut broader anxieties have started to grow about the AI industry's business model, which is reliant on expensive computer chips that are in short supply. The technology is also dependent on controversial data centres and funding such operations require deals with other tech companies.\nThe Federal Reserve Bank has expressed concern about the rapid growth of AI-related debt being financed through \"complex and opaque\" structures, according to minutes from its October meeting to discuss a potential rate rise.\nA few of the meeting's participants also noted that \"AI-related exposures were becoming increasingly concentrated among a small number of firms\".\nWith additional reporting by Rachel Clun\nRelated topics\n- Published9 hours ago\n- Published1 day ago",
    "bodyJa": "AI giant Anthropic valued at up to $1.5tn ahead of stock market debut\n- Published\nAnthropic has seen its value jump to as much as $1.5tn (£1.14tn) as its shares are set to start trading on the stock market on Thursday.\nThe artificial intelligence (AI) company behind the popular chatbot Claude said its shares will be priced at $83 each when it lists on the Nasdaq, a tech-focused stock exchange based in New York.\nThat will make it one of the most valuable companies in the world.\nAnthropic's stock market debut will make it the first US firm focused exclusively on AI to go public. It will also mark a crucial test for the fast-growing industry, which faces questions over whether the huge amounts of money being poured into the technology will be profitable.\nThe firm said earlier this month it would offer its shares for between $70 and $78 each, which valued the company at up to $1.3tn.\nBut demand for Anthropic's stock debut - commonly referred to as its initial public offering, or IPO - is very high, according to one early investor in the company who spoke with the BBC on condition of anonymity.\nThe person said shares were more than 10 times oversubscribed ahead of the public listing, meaning demand for Anthropic shares exceeded the number of shares available.\nIf that turns out to be the case, Anthropic's valuation could quickly blow past its target on Thursday when trading begins.\nCrucial test for AI\nDepending on how strong that demand is, Anthropic could even exceed the early market valuation of Elon Musk's SpaceX, which was the world's most highly valued stock debut when it went public with a value of $2.2tn in June.\nHowever, in the weeks that followed, SpaceX shares fell significantly in price.\nAs it stands, Anthropic's listing will see the firm raise more than $68bn from its initial investors. It is also expecting another $26bn from private placements. So the total amount the company will raise is expected to be $94bn.\nThe amount of cash Anthropic has raised from its listing is already more than SpaceX raised in June.\nOpenAI, the maker of ChatGPT and Anthropic's biggest AI rival, is expected to go public next year.\nUntil then, Anthropic will be the only public company in the US that is entirely focused on the technology, or one that was founded and built around AI tools and products. Its scope is different from tech giants like Google and Microsoft that also develop AI but are involved in other tech services.\nThe seven Anthropic founders who are about to become multi-billionaires\n- Published7 hours ago\nThere is excitement around Anthropic's listing, but also some concern from investors around its ability to generate revenue and profits going forward.\nYang Wang, a principle financial analyst with Counterpoint Research, said the central issue for Anthropic is whether its business \"can keep pace\" as hundreds of billions of dollars in financial obligations come due in the next couple of years.\n\"Nevertheless, it is not an everyday occurrence for public investors to gain direct exposure to a frontier-model developer with the potential to shape the next stage of productivity,\" Wang said.\nWhile nearly every other major tech company is pouring huge amounts of money into the technology and infrastructure required for their own AI tools, they are built around social media or online retail or online search. AI tools and applications are secondary.\n\"Anthropic going public gives us a whole new window into what AI demand looks like,\" Marta Norton, who heads strategy at investment firm Empower, told the BBC.\nRapid rise\nAnthropic was started by a group of co-founders, led by siblings Dario Amodei and Daniela Amodei, all of whom left their work at OpenAI to start a new AI firm.\nThe company has carved itself out in the ongoing AI race as more focused on building the technology with safety top of mind.\nIt refused to comply with a demand by the US Department of Defense that Anthropic's tools be used in an essentially unrestricted way.\nCEO Dario Amodei has been outspoken in his belief that AI tools may soon be so powerful that they present a threat to human existence.\nThe company has urged developers to slow the development of AI, arguing that advanced systems could pose \"catastrophic\" risks to humanity if they are not handled with appropriate safeguards.\nRival firm OpenAI has also voiced similar concerns about the technology's risks and delayed its plans to list on the stock market to address AI safety concerns.\nNonetheless, Anthropic is looking to grow quickly and gain more access to financing through the public markets in order to do so.\nNorton said Anthropic going public now, in a time of market volatility comes down to the simple fact that the company needs access to more money.\n\"AI is financially demanding,\" Norton said. \"The public markets open up the financial spigot a little bit more, and so the time has come.\"\nBut broader anxieties have started to grow about the AI industry's business model, which is reliant on expensive computer chips that are in short supply. The technology is also dependent on controversial data centres and funding such operations require deals with other tech companies.\nThe Federal Reserve Bank has expressed concern about the rapid growth of AI-related debt being financed through \"complex and opaque\" structures, according to minutes from its October meeting to discuss a potential rate rise.\nA few of the meeting's participants also noted that \"AI-related exposures were becoming increasingly concentrated among a small number of firms\".\nWith additional reporting by Rachel Clun\nRelated topics\n- Published9 hours ago\n- Published1 day ago",

    "title": "Crew unaware of risks before Mike Lynch's yacht Bayesian sank, say investigators",
    "titleJa": "Crew unaware of risks before Mike Lynch's yacht Bayesian sank, say investigators",
    "summaryJa": "The vessel sank off the coast of northern Sicily, killing seven people including British tech tycoon Mike Lynch.",
    "bodyOriginal": "Crew unaware of risks before Mike Lynch's yacht Bayesian sank, say investigators\n- Published\nThe crew of the Bayesian superyacht did not know about critical safety risks that left it vulnerable in powerful winds before it sank off the coast in northern Sicily, killing seven people, British investigators say.\nBritish tech tycoon Mike Lynch, 59, and his daughter Hannah, 18, were among seven people who died when the vessel sank on 19 August 2024.\nThe sinking of the Bayesian unfolded with \"extraordinary speed\" when a violent downburst of freak hurricane-force winds knocked it onto its side in less than 15 seconds, the UK's Marine Accident Investigation Branch (MAIB) final report said.\nSafety information provided to the crew did not identify this type of risk, the MAIB said.\n\"It was very dynamic, very quick,\" said MAIB principal inspector Simon Graves. \"The speed of events overtook the crew and prevented them from taking any other action.\"\nThe accident also led to the deaths of Morgan Stanley International bank chairman Jonathan Bloomer, 70, and his wife, Judy, 71; American lawyer Chris Morvillo, 59, and his wife Neda Morvillo, 57; and crew member Rick Thomas, 59.\nRob Loder, chief inspector of marine accidents said: \"Our thoughts remain with the families and loved ones of the seven who lost their lives, and with all those affected by the loss of Bayesian. This accident developed with extraordinary speed.\"\nFifteen survivors escaped from the 56-metre (184ft) luxury yacht and managed to get to a life raft that had been launched by a crew member.\nThe marine investigation found that the Bayesian \"had a vulnerability to high winds that was not recognised, because the yacht had never been assessed at anchor with its sails down\".\nIn addition, \"the extreme winds that night were also not explicitly forecast, so the crew had no warning of the risk\", Loder added.\nIn the early hours of 19 August 2024 the Bayesian was anchored outside of Porticello port, on the north coast of Sicily.\nWith thunderstorms rapidly coming in, wind speeds went from 8 knots to about 70 knots (80mph) within minutes. The weather forecast had only predicted gusts of up to 27 knots (31mph).\nThe MAIB report stated that with no sails set Bayesian was vulnerable to being knocked over in severe winds.\nIt also found that any knockdown - where the boat was suddenly tipped sideways - would be \"irrecoverable once the yacht passed the angle of vanishing stability\", assessed in the study as being 73 degrees. Once the vessel passed this angle it could not right itself.\nIn addition, the centreboard, which provides stability when a ship is under sail, was raised. The report said the centreboard was not needed when the Bayesian was using its motors and was rarely lowered at anchor. The way the boat was loaded, and the angle of the wind, also contributed to the accident.\nInspectors said a \"downburst of hurricane-force winds\" was the most likely cause of the ship keeling over.\nThey happen when cold, dense air plunges rapidly, sending out violent winds across the surface.\nThe MAIB said that none of risks were covered in the UK training syllabus, nor in published guidance available to crew.\nOnce the vessel was on its side, it rapidly filled with water and sank.\nAs it heeled over, five people were injured, either by falling or by items falling on them and a deckhand was thrown into the sea, the report said.\nAs water started entering the yacht, two of the guests \"used the furniture drawers as an improvised ladder to exit into the central alleyway\", then climbed along the internal walls to get into the saloon.\nThe MAIB's final report into the sinking, published on Thursday, appeared to contrast with recent reports from Italy, where prosecution experts have reportedly blamed errors by the crew rather than problems with the yacht.\nThe investigation was carried out alongside a criminal probe in Italy, where captain James Cutfield, chief engineer Tim Parker Eaton and deckhand Matthew Griffith are under investigation over potential charges of multiple manslaughter and culpable shipwreck.\nBritish investigators said that Italian prosecutors had restricted access to some witnesses and evidence.\n\"It is possible that the circumstances depicted in this report may alter following disclosure of evidence withheld by the Italian authorities,\" the report says.\nHowever, the MAIB's Graves said he was satisfied with the British investigation.\n\"We are content with our investigation, the investigation that we've undertaken, and the information we've used to feed into it.\"\nThe report also found that alcohol consumption had not contributed to the sinking.\nThe MAIB report makes seven recommendations to four agencies. It calls for new regulations to be set for single-hulled sailing vessels, and new rules around life rafts.\nIt also urges collaboration between the Met Office and its global counterpart to improve information-sharing of severe weather forecasts with mariners.\nThe Maritime and Coastguard Agency is also investigating the sinking.\nRelated topics\n- Published15 May 2025\n- Published21 June 2025\n- Published15 April 2025",

lo port, on the north coast of Sicily.\nWith thunderstorms rapidly coming in, wind speeds went from 8 knots to about 70 knots (80mph) within minutes. The weather forecast had only predicted gusts of up to 27 knots (31mph).\nThe MAIB report stated that with no sails set Bayesian was vulnerable to being knocked over in severe winds.\nIt also found that any knockdown - where the boat was suddenly tipped sideways - would be \"irrecoverable once the yacht passed the angle of vanishing stability\", assessed in the study as being 73 degrees. Once the vessel passed this angle it could not right itself.\nIn addition, the centreboard, which provides stability when a ship is under sail, was raised. The report said the centreboard was not needed when the Bayesian was using its motors and was rarely lowered at anchor. The way the boat was loaded, and the angle of the wind, also contributed to the accident.\nInspectors said a \"downburst of hurricane-force winds\" was the most likely cause of the ship keeling over.\nThey happen when cold, dense air plunges rapidly, sending out violent winds across the surface.\nThe MAIB said that none of risks were covered in the UK training syllabus, nor in published guidance available to crew.\nOnce the vessel was on its side, it rapidly filled with water and sank.\nAs it heeled over, five people were injured, either by falling or by items falling on them and a deckhand was thrown into the sea, the report said.\nAs water started entering the yacht, two of the guests \"used the furniture drawers as an improvised ladder to exit into the central alleyway\", then climbed along the internal walls to get into the saloon.\nThe MAIB's final report into the sinking, published on Thursday, appeared to contrast with recent reports from Italy, where prosecution experts have reportedly blamed errors by the crew rather than problems with the yacht.\nThe investigation was carried out alongside a criminal probe in Italy, where captain James Cutfield, chief engineer Tim Parker Eaton and deckhand Matthew Griffith are under investigation over potential charges of multiple manslaughter and culpable shipwreck.\nBritish investigators said that Italian prosecutors had restricted access to some witnesses and evidence.\n\"It is possible that the circumstances depicted in this report may alter following disclosure of evidence withheld by the Italian authorities,\" the report says.\nHowever, the MAIB's Graves said he was satisfied with the British investigation.\n\"We are content with our investigation, the investigation that we've undertaken, and the information we've used to feed into it.\"\nThe report also found that alcohol consumption had not contributed to the sinking.\nThe MAIB report makes seven recommendations to four agencies. It calls for new regulations to be set for single-hulled sailing vessels, and new rules around life rafts.\nIt also urges collaboration between the Met Office and its global counterpart to improve information-sharing of severe weather forecasts with mariners.\nThe Maritime and Coastguard Agency is also investigating the sinking.\nRelated topics\n- Published15 May 2025\n- Published21 June 2025\n- Published15 April 2025",

    "id": "mcdonald-s-sex-abuse-they-were-waiting-f-c300354a",
    "title": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'",
    "titleJa": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'",
    "summaryJa": "A former McDonald's worker calls on the firm to “change the way they treat younger employees” as a judge rules a legal case against the chain can go ahead.",
    "bodyOriginal": "McDonald's sex abuse: 'They were waiting for the younger girls to turn 18'\n- Published\nA former McDonald's worker who says a manager failed to protect her when she was being sexualised by customers, has called on the firm to “change the way they treat younger employees”.\nHope, who worked at a branch in the West Midlands in 2023, also told BBC News she saw older colleagues eyeing up 16- and 17-year-old workers, and talking about wanting to sleep with them when they turned 18.\nHope is one of hundreds of workers bringing a discrimination claim against McDonald's. This week, a judge ruled against McDonald's attempt to have their claims struck out, a move that Hope welcomed.\nMcDonald's said: \"Ensuring a safe, respectful and inclusive working environment across our restaurants and offices remains a fundamental priority.\"\nThe latest developments come after a BBC investigation in 2023 which heard that workers, some as young as 17, were being groped and harassed.\nLast year, McDonald's staff told us they still faced sexual abuse and harassment.\nHope, who is now 22, says that her branch of McDonalds had a very sexualised, \"toxic\" environment.\nShe spoke of a time a manager came up behind her and put his hands on her shoulders. From then on, whenever she saw him coming over, she says she \"moved quick\" to get away from him.\n\"I got the hell out of there,\" she says.\nAnother time, she says a manager failed to protect her when she says she was being sexualised and objectified by two customers on a night shift.\nHope says she told the manager what was happening, but he told her to \"just suck it up and deal with it\".\nHer main concern, however, was for the younger teenagers, who she says weren't being looked after.\n\"You could tell there were other staff members waiting for their 18th birthdays. That sort of like toxic culture where it's like, 'Oh, you know, it's not illegal now.' It was that feeling from quite a few of them,\" she says.\n\"And why would you? That is literally a child still.\"\nLegal action\nHundreds of current and former McDonald's employees are bringing a discrimination claim against the firm.\nThe fast-food chain had attempted to have the complaints thrown out but this week at the London Central Employment Tribunal, Judge Glennie ruled that 450 cases can go ahead and they are now expected to be heard at the Employment Tribunal in April.\nThe BBC understands that these relate to indirect discrimination, not sexual harassment.\nHope told us she was not taking part in the legal case for money, saying they didn't know if they were going to get anything.\nInstead, she said it was to try and \"change the way they treat younger employees\".\n\"It's going to change the way they treat allegations. It's going to shake up the whole internal process and make life easier for the kids who are now having their first jobs. And it's going to make it a lot safer, I think, as well. And that's something you can't put a price on, the safety of the young these days.''\nShe also accused McDonald's of trying to \"delay the inevitable\" by attempting to have the claims thrown out.\n\"And the judge quite rightly looked at them and said: 'No. We're not going to do that.'\"\nThe claims were presented by law firm Leigh Day, which is acting for the current and former employees.\nThe claims focus on the vulnerability of young or female workers in the workplace and follow allegations of widespread harassment and discrimination across McDonald's restaurants in the UK.\nLeigh Day partner Kiran Daurka told the BBC: \"We're really delighted that the judge has found that these claims can go forward to a full hearing. It's really important for access to justice that these cases are heard.\"\nA McDonald's spokesperson said they could not comment on the specifics of ongoing legal proceedings.\nIn a statement, they said the company had \"embedded an extensive set of robust and far-reaching initiatives\" as part of its \"steadfast commitment\" to its staff, adding that this work continues.\n\"Any form of harassment, discrimination or inappropriate behaviour is unacceptable and has no place in our restaurants or offices. We are confident that with the guidance and partnership of external experts, we and our franchisees have industry leading safeguarding measures in place,\" the spokesperson added.\n- Published18 July 2023",

commitment\" to its staff, adding that this work continues.\n\"Any form of harassment, discrimination or inappropriate behaviour is unacceptable and has no place in our restaurants or offices. We are confident that with the guidance and partnership of external experts, we and our franchisees have industry leading safeguarding measures in place,\" the spokesperson added.\n- Published18 July 2023",

    "id": "can-anthropic-s-record-breaking-ipo-stop-f1193f5f",
    "title": "Can Anthropic's record-breaking IPO stop the AI bubble bursting?",
    "titleJa": "Can Anthropic's record-breaking IPO stop the AI bubble bursting?",
    "summaryJa": "Anthropic's hotly anticipated IPO is expected to put it in the top 10 most valuable US companies, but the future is uncertain.",
    "bodyOriginal": "It was during November 2020 that somewhere in San Francisco, a woman called Daniela Amodei phoned a friend, asking for advice.\nDaniela oversaw safety and policy at OpenAI, one of the most talked-about AI companies in the world.\nBut Daniela and her brother Dario - who worked there too - had misgivings over safety levels at OpenAI and thought it could be time to walk away.\nSo she did what many do when we can't make a decision about something, she phoned a friend. The friend's reply was direct and to the point: \"You don't need to be on the phone with me. You already know the answer.\"\nThe Amodei siblings and a handful of other colleagues quit. Together, they set up a rival – Anthropic.\nSix years on and Anthropic, the maker of leading AI model Claude, has predicted revenues of $52bn in 2026 and $135bn in 2027, according to analyst estimates.\nIt is about to sell shares to the public for the first time in what's known as an Initial Public Offering or IPO, aiming for a valuation of an estimated $1.4tn (£1tn), which would propel it straight into the top 10 of the most valuable US companies.\nThe sale comes at a crucial time when many are wondering whether, amid increasing concern about the potential of AI, the industry's bubble is showing signs of bursting.\nWhere once investors were \"all in\" on a technological revolution to rival the railroads, the car, electricity and the internet, some are now hedging their bets, amid arguments that AI prices will be driven down as the technology becomes more common and concerns that a hefty wedge of the AI investment is tech giants investing in each other.\nShares in companies that supply the raw computing power behind AI, like Coreweave and Nebius, have seen their value cut in half while even the mighty Nvidia has lost its crown as the world's most valuable company with its shares down 30% - a staggering $2tn fall in value.\nSo could the Anthropic IPO reinflate the bubble or will it be remembered as the last gasp of a boom that is heading for a bust?\nA benchmark valuation\nAt an event last week, Anthropic CEO Dario Amodei told JPMorgan Chase's CEO Jamie Dimon that his guiding principle was to \"never let your company be worth a single dollar more than it's worth\".\nThe company is selling roughly $65bn worth of shares to the general public and a further $26bn on to other big tech companies. It is comfortably the single biggest money raising event in US corporate history.\nIt's an old adage that during a gold rush you should buy companies that sell the picks and shovels as opposed to those staking everything on striking gold. In AI's case that's the chip makers, the data centre builders, the energy providers. But Anthropic is arguably the gold itself and this IPO will see what value people put on it, according to Fiona Cincotta.\n\"I think the reason that this IPO is so important is basically it's the first ability for the public investors to access a pure play AI trade,\" she says, adding that previous offerings have been about \"other parts of the ecosystem, which are, the semiconductors, the chips, the, data centres. But this is the first time that we were actually able to access the AI provider.\"\nWhat a company is worth depends almost entirely on predicted future earnings.\nIt's that calculation that many think presents the sharpest needle to the AI bubble.\nWill current and future users of AI be prepared to pay enough to justify the trillions being spent on the chips, data centres, energy and employees, some of whom can command annual salaries of over $100m?\n\"AI is certainly in a financial bubble. While LLMs [large language models] offer genuine utility and are undoubtedly here to stay, the economics don't add up,\" said Gary Marcus, Professor Emeritus at New York University and author of Taming Silicon Valley, speaking earlier this year.\n\"[The] more companies build AI models, the [more the] technology becomes commoditised, eliminating meaningful competitive advantages and driving down prices.\"\nSo far, the growth rates in Anthropic revenue are extraordinary.\nBut these explosive growth rates hide a potential problem. Around a quarter of that revenue came from just a handful of companies, among them Google and Amazon.\nIt's also concentrated in the US which accounts for two-thirds of its revenue.\nThere is also the staggering network of circular financing found in the AI world. For example, Anthropic has agreements to buy or lease hundreds of billions of dollars worth of chips and computing power from a handful of companies including Broadcom, Google, Amazon. Many of those firms are also investors in Anthropic and major customers of its products.\nPublic doubts\nIt's not just some Wall Street investors questioning whether the AI boom is all it's cracked up to be. Out on Main Street, ordinary Americans have concerns too.\nWith the US driving so much of global AI growth, a growing public backlash against a technology that threatens to replace millions of jobs and hoover up vast amounts of energy and water became a factor in the recent midterm elections in the US.\nMany areas in the US have passed moratoriums on data centre development and many candidates deemed too close to big tech found that association a political liability rather than an asset. Many Democrat candidates publicly opposed data centre development and won.\nAdded to that, the Pied Piper of AI, chip maker Nvidia's CEO Jensen Huang, resigned last week after admitting to having been \"unfaithful\" to his wife after reports he had an affair with a suspected Chinese spy, Alice Huang.\nHuang's spectacular fall from grace and Nvidia's 30% fall in value from its peak have left AI investors looking for a new champion for the AI boom that has underpinned the US stock market and arguably much of its entire economy for the last two years.\nIf Anthropic – and its CEO are to be AI's new Pied Piper, he will be playing a different tune to the relentlessly upbeat, leather jacket-clad talisman Huang.\nWhile Huang wanted AI development to continue full throttle, Anthropic was built on misgivings over the levels of safety and responsibility the OpenAI leavers felt were being exercised over the development of society-changing technology.\nAmodei has warned that AI capabilities could enable biological weapon development, mass surveillance, authoritarianism and the replacement of millions of white-collar, tax-paying workers.\nHe has called for a slowdown in its development as its powers are growing at such an exponential rate that it could very soon elude any human oversight.\nThat said, his paternalistic overtures have been sceptically received by those who point out that the pace of Anthropic's development of new more powerful models has shown no sign of the slowdown he's advocating for the rest of the industry.\nHype and FOMO\nBut for all the concerns, just as with Elon Musk's SpaceX before it – the hype and the FOMO (fear of missing out) on an undoubtedly profound moment in technological and perhaps human development – means that buying interest is high.\nIt's reported that orders to buy shares exceed the number on offer by over six times.\nWith demand outstripping supply by such a margin, a first-day jump is likely given the oversubscription, but it doesn't tell you much about long-run return.\nUsing SpaceX as an example again, shares initially rose nearly 70% from its IPO sale price of $135 to $225. Shares in SpaceX are currently back to $145.\nThe Anthropic IPO could be wildly successful and blow a bit of fresh new air into what some maintain still looks a lot like a bubble.\nEileen Burbidge, founder of tech investors Passion Capital, is one of those who reject the notion that AI is a bubble about to burst.\n\"Maybe the growth of the bubble has slowed down a little bit, but actually I wouldn't be willing to say that it's about to burst yet,\" says Burbidge. \"I think this IPO could actually mean everyone could be off to the races again.\"\nFiona Cincotta believes Anthropic's IPO is about far more than just Anthropic. \"I think what's going to be really interesting here is I think it can actually be used as a valuation benchmark for the entire AI ecosystem,\" she says.\n\"That's why I don't think this is just going to affect the share price of Anthropic. I think this is going to have much wider implications across the whole AI trade.\"\nTwo things can be true at the same time. The Anthropic IPO could be wildly successful - FOMO is a powerful emotion in financial markets. But its probable success won't soothe the unease in some quarters that not every company, every investor and every citizen will think of AI as the answer to humanity's problems.\nLead image: Getty\nBBC InDepth is the home on the website and app for the best analysis, with fresh perspectives that challenge assumptions and deep reporting on the biggest issues of the day. Emma Barnett and John Simpson bring their pick of the most thought-provoking deep reads and analysis, every Saturday. Sign up for the newsletter here\nGet in touch\nAre you personally affected by the issues raised in this story?\nRelated topics\nMore from InDepth\n- Published11 October",

    "title": "Anthropic IPO: AI lab considers increasing the offering as investor demand surges, sources say",
    "titleJa": "Anthropic IPO: AI lab considers increasing the offering as investor demand surges, sources say",
    "summaryJa": "Anthropic stock is set to begin trading on the Nasdaq under the ticker symbol ANT on Thursday.",
    "bodyOriginal": "Anthropic is considering upsizing its initial public offering, people familiar with the details told CNBC, as the artificial intelligence lab weighs setting the price well above $80.\nThe company closed its order books and locked in total demand on Tuesday, setting the stage for the Claude creator's eagerly awaited Nasdaq listing. Institutional demand for the offering is around $400 billion, while retail demand is approaching $100 billion, according to the people, who asked not to be named because they were not authorized to speak publicly.\nThe orders are indications of interest and are not binding. All of the details are subject to change, and Anthropic will make final decisions Wednesday afternoon, the people said. Anthropic is expected to set its final IPO price after market close Wednesday.\nDemand for the offering is higher than it was for Elon Musk's SpaceX, even though the rocket maker had a bigger market offering. SpaceX debuted on the Nasdaq in June in by far the biggest IPO on record, ultimately raising $85.7 billion.\nThe AI lab said last week that it would offer 825 million shares in the IPO at a price range of between $70 and $78 per share, which would net up to $64.35 billion at the high end of that range.\nA representative for Anthropic declined to comment.\nAnthropic's listing is a major test for the AI industry, which has experienced a set of recent shocks, including a dramatic backlash that was felt at the polls in the midterm elections and last week's ouster of Nvidia CEO Jensen Huang. The market was already jittery on concerns that rising interest rates will make debt unaffordable for many data center developers and neoclouds.\nTech's biggest companies have significant exposure to Anthropic, as an investor, partner or customer. Amazon and Google both own stakes valued at over $100 billion, and a group of tech companies, including Google, Microsoft, Nvidia and Advanced Micro Devices agreed to collectively invest $26 billion in the IPO. Anthropic, meanwhile, is a buyer of costly systems from Nvidia, Google, Amazon and AMD.\n\"I think if we do this right, we can create an age of miracles where humanity is able to solve problems that have eluded us for millennia,\" Anthropic CEO Dario Amodei said in Anthropic's roadshow video. \"We have to make sure that all the risks, all the ways that things can go wrong with this technology, we very carefully address those risks as we bring the benefits and as we have a viable business at the same time.\"\nAmodei co-founded Anthropic alongside a handful of other researchers less than six years ago, after the group collectively defected from OpenAI. The company is best known for developing a family of AI models called Claude, and it primarily sells its products and services to other businesses.\nAnthropic has been racing to maintain an edge over OpenAI and Google in the enterprise market, and it experienced a period of explosive growth in 2026, driven largely by the popularity of its AI coding tool, Claude Code. OpenAI has confidentially filed for an IPO and has said a debut is likely in 2027.\nFor the nine months ended Sept. 30, Anthropic said, it generated $33.24 billion in revenue, up roughly 1,200% from the same period last year, according to its prospectus. The company reported a $104 billion net loss during the nine-month period, though most of that was due to the change in fair value of convertible notes and derivative liabilities. Anthropic lost $25.1 billion over the same stretch in 2025, the filing said.\nAnthropic said in an amended filing that its run-rate revenue was roughly $81 billion at the end of October, up $10 billion from the previous month.\nThe company has faced plenty of challenges during its meteoric rise over its positions on safety, regulation and national security, leading to two high-profile disputes with the U.S. government this year. Its prospectus included more than 90 pages of risk factors for investors to consider ahead of its IPO.\n\"Our aim is to help humankind chart a safe course through this technological evolution, open new frontiers of discovery, and bring forth an age of miracles,\" Anthropic's co-founders wrote in the company's prospectus. \"Everyone who owns our stock, whether an institution or an individual, becomes part of that effort.\"\nWATCH: The rise of Anthropic — and why safety is leading the AI arms race",

    "title": "Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show",
    "titleJa": "Fed officials expect more rate hikes, worry about AI impact on inflation, minutes show",
    "summaryJa": "The Federal Reserve on Wednesday released minutes from its October policy meeting at which it voted to hold its benchmark interest rate in a range between 3.75%-4%.",
    "bodyOriginal": "Federal Reserve officials expressed confidence in October that further interest rate increases will be needed to stem inflation, though they decided to hold off while gathering more information, according to meeting minutes released Wednesday.\nPolicymakers put artificial intelligence at the core of their discussions, indicating that demand associated with the technology would be \"a material source of inflation risk.\"\nMore broadly, officials said \"inflation pressures in the economy were broad based\" and would warrant action, with \"some\" policymakers advocating for a quarter percentage point hike at the meeting. A couple of participants even noted the possibility that a larger increase might be needed at the next policy meeting in December.\nThe meeting summary said \"almost all participants judged that, under their baseline outlooks for inflation and the labor market, further action to raise the target range for the federal funds rate … would likely be appropriate, in order to ensure a timely return of inflation to the 2 percent objective.\"\nIn a CNBC interview Wednesday, Fed Governor Christopher Waller reiterated his belief that the Federal Open Market Committee should consider a half-point hike in December.\nAI concern\nOfficials at the meeting expressed a high level of concern over AI, both as a source of inflation and financial instability.\nFed staff members who briefed participants noted \"that off-balance-sheet leasing commitments and circular financing arrangements among AI-related firms could amplify losses if returns on AI investment were to disappoint.\"\n\"Most participants observed that AI-related debt had grown rapidly and that much of this growth had taken place through complex and opaque financing structures,\" the minutes said. \"A few participants remarked that AI-related exposures were becoming increasingly concentrated among a small number of firms.\"\nOfficials said they still expect inflation to fall off sharply in 2027 and beyond as the impact from the current shocks wear off.\nUltimately, the FOMC voted 10-2 to keep its benchmark overnight borrowing rate locked in a range between 3.75%-4%. Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented in favor of a quarter-point increase.\nThose voting in favor of the hold \"pointed to benefits in accumulating additional information, which would help in determining the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal.\"\nSince the meeting, the inflation data has shown that the pace of price increases remains well above target.\nThe consumer price index in October rose 0.4% for all items and 0.3% for the core that excludes food and energy. Both readings were 0.1 percentage point higher than expected.\nWhile indicating concern over how stubborn inflation has been, most Fed officials who have spoken publicly advocated a patient approach.\nPotential 'shock' to markets\nHowever, Waller said Wednesday that the Fed may have to \"shock\" markets by approving a half-point hike in December. He is the only central banker to espouse that belief publicly, though St. Louis Fed President Alberto Musalem said he anticipates as much as a full percentage point move higher by the spring of 2027. As governor, Waller is a permanent FOMC voter; Musalem will not vote until 2028.\nChicago Fed President Austan Goolsbee said Friday on CNBC that the central bank risks losing its credibility if it doesn't act.\nAt the core of policymakers' concern is whether rising prices related to the Iran war and President Donald Trump's tariffs, in many cases temporary events that wouldn't prompt a response, are instead becoming more entrenched.\nMarkets are fully pricing in a quarter percentage point hike at the Dec. 8-9 meeting that includes low odds of a half-point move, according to the CME Group's FedWatch gauge. Futures traders also are pricing a solid likelihood of two more increases in 2027.",

nd beyond as the impact from the current shocks wear off.\nUltimately, the FOMC voted 10-2 to keep its benchmark overnight borrowing rate locked in a range between 3.75%-4%. Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented in favor of a quarter-point increase.\nThose voting in favor of the hold \"pointed to benefits in accumulating additional information, which would help in determining the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal.\"\nSince the meeting, the inflation data has shown that the pace of price increases remains well above target.\nThe consumer price index in October rose 0.4% for all items and 0.3% for the core that excludes food and energy. Both readings were 0.1 percentage point higher than expected.\nWhile indicating concern over how stubborn inflation has been, most Fed officials who have spoken publicly advocated a patient approach.\nPotential 'shock' to markets\nHowever, Waller said Wednesday that the Fed may have to \"shock\" markets by approving a half-point hike in December. He is the only central banker to espouse that belief publicly, though St. Louis Fed President Alberto Musalem said he anticipates as much as a full percentage point move higher by the spring of 2027. As governor, Waller is a permanent FOMC voter; Musalem will not vote until 2028.\nChicago Fed President Austan Goolsbee said Friday on CNBC that the central bank risks losing its credibility if it doesn't act.\nAt the core of policymakers' concern is whether rising prices related to the Iran war and President Donald Trump's tariffs, in many cases temporary events that wouldn't prompt a response, are instead becoming more entrenched.\nMarkets are fully pricing in a quarter percentage point hike at the Dec. 8-9 meeting that includes low odds of a half-point move, according to the CME Group's FedWatch gauge. Futures traders also are pricing a solid likelihood of two more increases in 2027.",

    "id": "nvidia-interim-ceo-kress-tells-employees-30a4a985",
    "title": "Nvidia interim CEO Kress tells employees ‘let’s move forward’ at first all-hands meeting since Jensen Huang exit",
    "titleJa": "Nvidia interim CEO Kress tells employees ‘let’s move forward’ at first all-hands meeting since Jensen Huang exit",
    "summaryJa": "Nvidia's interim CEO Colette Kress urges staff forward and offers pay raises after Jensen Huang exit.",
    "bodyOriginal": "Interim Nvidia CEO Colette Kress told employees \"let's move forward\" on Wednesday during the company's first all-hands meeting since founder Jensen Huang resigned, according to an attendee who spoke to CNBC on the condition of anonymity.\nKress was joined by newly appointed board chair Harvey Jones and hyperscale and high-performance computing head Ian Buck. Several other senior members of Nvidia's executive team spoke, including long-time company veteran Jeff Fisher, senior vice president of GPU engineering Jonah Alben, executive vice president in charge of Operations Debora Shoquist and co-founder Chris Malachowsky, according to a person familiar with the matter.\nKress opened with the message about moving forward, and also brought up pay raises for employees, according to the attendee. Jones then pivoted to a discussion about the search for the next CEO, the attendee added. The meeting lasted about an hour and was in person as well as streamed on Microsoft Teams.\nThe general sentiment swirling in the room, according to the attendee, is that employees want Huang to come back. Employees have spoken up on X in recent days to call for the return of Huang as CEO, and one senior employee reportedly sent a letter to the board warning Nvidia would lose \"irreplaceable talent\" if it doesn't consider reinstating Huang.\nBut another person familiar with the matter disagreed, saying that employees welcomed the remarks from leadership as well as the visibility into company leadership.\n\"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" Jones said during the earnings call on Tuesday.\nDespite recent turmoil, Wednesday's meeting was not out of the ordinary. Nvidia typically holds all-hands the morning after quarterly earnings reports, according to a former employee who spoke to CNBC on the condition of anonymity. Kress recapped Tuesday's earnings report, calling it a \"great quarter,\" according to one person familiar with the matter.\nIn past meetings, Huang took time to answer questions submitted by employees, according to the former employee.\nOn Tuesday, Huang said he would be \"honored to answer these calls and return as CEO.\"\nNvidia shares were down 2% on Wednesday, a day after the company reported third-quarter earnings that topped Wall Street expectations and gave no signal that the company was going to slow its growth. Still, Nvidia faced several downgrades from Wall Street on Wednesday, including from Bernstein and Evercore.\nWATCH: The rise, reinvention and uncertain future of Nvidia without Jensen Huang",
    "bodyJa": "Interim Nvidia CEO Colette Kress told employees \"let's move forward\" on Wednesday during the company's first all-hands meeting since founder Jensen Huang resigned, according to an attendee who spoke to CNBC on the condition of anonymity.\nKress was joined by newly appointed board chair Harvey Jones and hyperscale and high-performance computing head Ian Buck. Several other senior members of Nvidia's executive team spoke, including long-time company veteran Jeff Fisher, senior vice president of GPU engineering Jonah Alben, executive vice president in charge of Operations Debora Shoquist and co-founder Chris Malachowsky, according to a person familiar with the matter.\nKress opened with the message about moving forward, and also brought up pay raises for employees, according to the attendee. Jones then pivoted to a discussion about the search for the next CEO, the attendee added. The meeting lasted about an hour and was in person as well as streamed on Microsoft Teams.\nThe general sentiment swirling in the room, according to the attendee, is that employees want Huang to come back. Employees have spoken up on X in recent days to call for the return of Huang as CEO, and one senior employee reportedly sent a letter to the board warning Nvidia would lose \"irreplaceable talent\" if it doesn't consider reinstating Huang.\nBut another person familiar with the matter disagreed, saying that employees welcomed the remarks from leadership as well as the visibility into company leadership.\n\"The Nvidia board unanimously accepted his resignation and does not intend to reinstate Jensen as CEO,\" Jones said during the earnings call on Tuesday.\nDespite recent turmoil, Wednesday's meeting was not out of the ordinary. Nvidia typically holds all-hands the morning after quarterly earnings reports, according to a former employee who spoke to CNBC on the condition of anonymity. Kress recapped Tuesday's earnings report, calling it a \"great quarter,\" according to one person familiar with the matter.\nIn past meetings, Huang took time to answer questions submitted by employees, according to the former employee.\nOn Tuesday, Huang said he would be \"honored to answer these calls and return as CEO.\"\nNvidia shares were down 2% on Wednesday, a day after the company reported third-quarter earnings that topped Wall Street expectations and gave no signal that the company was going to slow its growth. Still, Nvidia faced several downgrades from Wall Street on Wednesday, including from Bernstein and Evercore.\nWATCH: The rise, reinvention and uncertain future of Nvidia without Jensen Huang",

    "title": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO",
    "titleJa": "One of AI's most notorious 'doomers' stands to make billions in Anthropic's IPO",
    "summaryJa": "An Estonian tech billionaire famous for his stance that AI could end humanity is expected to be one of the biggest winners in Anthropic's upcoming IPO.",
    "bodyOriginal": "An Estonian tech billionaire famous for his stance that AI could end humanity is expected to be one of the biggest winners in Anthropic's upcoming IPO.\nJaan Tallinn co-founded Skype and later sold it to eBay. He led Anthropic's first funding round, a $124 million Series A, five years ago — well before the company's Claude chatbot was on the market and took Wall Street and Silicon Valley by storm.\nAnthropic is set to list on the Nasdaq Thursday under the ticker symbol ANT in what could be the largest IPO of all time, and the first public debut for an AI lab.\nTallinn's exact holdings haven't been disclosed. But given Anthropic's expected debut valuation of roughly $1.4 trillion, the return on his initial investment could be well into the tens of billions. His exact return would depend on the level of dilution in subsequent funding rounds and whether he sold any shares along the way.\nAnthropic's earliest backers connected with the company through philanthropic circles worried about AI's existential risk. They're sometimes described as \"doomers.\"\nIn 2020, Tallinn told CNBC that there's a one-in-six chance that humans won't survive this century, referencing a book from Oxford professor Toby Ord. Tallinn also described a runaway AI scenario where a model is left working overnight and \"the world is no longer there in the morning.\"\nWhile he continued to work in tech, Tallinn co-founded the Cambridge Centre for the Study of Existential Risk and the Future of Life Institute, known for one of the first public calls to pause AI. Despite high-profile signatories, including Elon Musk and Apple co-founder Steve Wozniak, the institute's \"Pause Giant AI Experiments\" letter in 2023 had little effect on the industry.\nTallinn's view on AI was influenced by researcher Eliezer Yudkowsky, who co-authored the 2025 book \"If Anyone Builds It, Everyone Dies,\" about the catastrophic risk of AI without proper checks, according to a person familiar with the matter.\nTallinn, who has an estimated net worth of omore than $10 billion, later crossed paths with Anthropic CEO Dario Amodei, who had defected from OpenAI with his eventual co-founders, citing views that Sam Altman's company wasn't taking AI safety seriously enough.\nAmodei and Tallinn overlapped in the effective altruism community, according to people who know both of them. Effective altruism, sometimes known as EA, is a philosophy that aims to use data and evidence to maximize philanthropic impact. While there's no official membership, its Silicon Valley network ended up generating much of Anthropic's early venture capital money, according to multiple people.\nBefore AI was all the rage\nTallinn's early bet was that bankrolling a safety-conscious AI company was one of the best ways to keep a lid on the risk, these people said. Tallinn also invested in DeepMind, which was later acquired by Google.\nOne person, who asked not to be named, said that at the time of Tallinn's investment, there was no expectation that Anthropic \"would be a profitable undertaking.\" Venture investors hadn't yet gone all-in on AI, and it was \"before the era of putting AI in your pitch deck,\" said the person, who asked not to be named in order to speak candidly on the matter.\nTallinn declined to be interviewed for this story.\nAnthropic's first round in 2021 also included Facebook co-founder Dustin Moskovitz, who founded Open Philanthropy — now known as Coefficient Giving — which is deeply rooted in effective altruism. The charity was co-founded by Holden Karnofsky, husband of Anthropic co-founder Daniela Amodei. Karnofsky also started GiveWell, also largely tied to effective altruism.\nFormer FTX CEO Sam Bankman-Fried, another known effective altruist, backed Anthropic in its early days alongside Tallinn. Bankman-Fried participated in the Series B in 2022 through his now-defunct hedge fund Alameda Research. The former CEO was convicted of fraud in 2023 and sentenced to 25 years in prison. His stake was sold in bankruptcy auction at a fraction of the company's current valuation.\nTallinn's early investment initially put Anthropic's price tag at $461 million, according to Pitchbook. It has ballooned in value since, and last raised money at a $965 billion valuation in private markets. The lab has raised money from tech giants Amazon, Alphabet, Microsoft and Nvidia, and plans to sell $26 billion worth of shares to a group of tech companies at the IPO price.\nAnthropic's early investors and some in the safety community aren't overwhelmingly cheering the IPO. Many worry behind the scenes that AI safety will take a backseat to Anthropic's commercial success and wider shareholder base, according to a person close to the group.\nMany in the AI safety community \"are opposed to the IPO,\" this person said.\nOthers point to Anthropic's unique corporate structure that gives the founders broad discretion and control of the company through a single super-voting share. The co-founders will be sole members of \"Founder LLC,\" which will hold 50.1% of the voting power. But Anthropic is also built as a public benefit corporation, meaning it has a dual mandate beyond just a duty to shareholders. It has to serve the best interests of its \"company purpose\" to facilitate the \"responsible development and maintenance of advanced AI for the long-term benefit of humanity.\"",

is stake was sold in bankruptcy auction at a fraction of the company's current valuation.\nTallinn's early investment initially put Anthropic's price tag at $461 million, according to Pitchbook. It has ballooned in value since, and last raised money at a $965 billion valuation in private markets. The lab has raised money from tech giants Amazon, Alphabet, Microsoft and Nvidia, and plans to sell $26 billion worth of shares to a group of tech companies at the IPO price.\nAnthropic's early investors and some in the safety community aren't overwhelmingly cheering the IPO. Many worry behind the scenes that AI safety will take a backseat to Anthropic's commercial success and wider shareholder base, according to a person close to the group.\nMany in the AI safety community \"are opposed to the IPO,\" this person said.\nOthers point to Anthropic's unique corporate structure that gives the founders broad discretion and control of the company through a single super-voting share. The co-founders will be sole members of \"Founder LLC,\" which will hold 50.1% of the voting power. But Anthropic is also built as a public benefit corporation, meaning it has a dual mandate beyond just a duty to shareholders. It has to serve the best interests of its \"company purpose\" to facilitate the \"responsible development and maintenance of advanced AI for the long-term benefit of humanity.\"",

    "id": "investigators-make-progress-in-hunt-for-1b47eb2b",
    "title": "Investigators make progress in hunt for cause of FAA ground stop",
    "titleJa": "Investigators make progress in hunt for cause of FAA ground stop",
    "summaryJa": "Engineers and analysts are still searching for the root cause of the issue, which led to a four-hour ground stop on Friday.",
    "bodyOriginal": "Engineers and analysts searching for the root cause of the technical issues behind Friday's nationwide ground stop by the Federal Aviation Administration have been able to replicate the situation that was overwhelming parts of the air traffic system, people familiar with the investigation told CNBC.\nWhile replicating the issue in a lab in Florida is progress, those investigating the matter have yet to determine exactly why two routers in question failed, according to the people, who requested anonymity to talk about an ongoing situation. Finding the root cause is critical to the FAA determining if there may be an issue with other routers that form the backbone of communications for the national air transportation network.\nThe ground stop lasted for more than four hours Friday, marking the longest halt to U.S. flight departures since 9/11.\nTransportation Secretary Sean Duffy and FAA Administrator Bryan Bedford have said there is no indication the routers failed due to a cyberattack.\nThe incident in question happened shortly after L3Harris Technologies, the primary contractor supporting the FAA telecommunications network, installed a new router at a facility in El Dorado, Arkansas.\nL3Harris said that it, in partnership with other tech companies, has completed more than 70% of the planned airspace communications conversion from legacy copper wires to a fiber-optic system.\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" the statement said. \"L3Harris takes the nationwide ground stop and its impact on travelers, airlines and air traffic operations seriously.\"\nInvestigators said within eight minutes of its installation, the router began to transmit too much data within the FAA network.\nThat surge of data, 1,000 connection attempts every four to five seconds, destabilized aircraft communications and radar feeds, Duffy said.\nSince the ground stop, Duffy has increased the amount of money he wants to upgrade the national air traffic system. After originally asking for $30 billion to build a digital network that will incorporate artificial intelligence, Duffy has now asked Congress for $50 billion.",
    "bodyJa": "Engineers and analysts searching for the root cause of the technical issues behind Friday's nationwide ground stop by the Federal Aviation Administration have been able to replicate the situation that was overwhelming parts of the air traffic system, people familiar with the investigation told CNBC.\nWhile replicating the issue in a lab in Florida is progress, those investigating the matter have yet to determine exactly why two routers in question failed, according to the people, who requested anonymity to talk about an ongoing situation. Finding the root cause is critical to the FAA determining if there may be an issue with other routers that form the backbone of communications for the national air transportation network.\nThe ground stop lasted for more than four hours Friday, marking the longest halt to U.S. flight departures since 9/11.\nTransportation Secretary Sean Duffy and FAA Administrator Bryan Bedford have said there is no indication the routers failed due to a cyberattack.\nThe incident in question happened shortly after L3Harris Technologies, the primary contractor supporting the FAA telecommunications network, installed a new router at a facility in El Dorado, Arkansas.\nL3Harris said that it, in partnership with other tech companies, has completed more than 70% of the planned airspace communications conversion from legacy copper wires to a fiber-optic system.\n\"We are supporting the FAA in its investigation to understand the conditions that led to the Nov. 13 ground stop of our nation's air travel,\" the statement said. \"L3Harris takes the nationwide ground stop and its impact on travelers, airlines and air traffic operations seriously.\"\nInvestigators said within eight minutes of its installation, the router began to transmit too much data within the FAA network.\nThat surge of data, 1,000 connection attempts every four to five seconds, destabilized aircraft communications and radar feeds, Duffy said.\nSince the ground stop, Duffy has increased the amount of money he wants to upgrade the national air traffic system. After originally asking for $30 billion to build a digital network that will incorporate artificial intelligence, Duffy has now asked Congress for $50 billion.",

    "id": "the-seven-anthropic-founders-who-are-abo-847fc3b7",
    "title": "The seven Anthropic founders who are about to become multi-billionaires",
    "titleJa": "The seven Anthropic founders who are about to become multi-billionaires",
    "summaryJa": "The AI company behind Claude is about to sell its shares on the US stock market - making its founders very rich.",
    "bodyOriginal": "The seven Anthropic founders who are about to become multi-billionaires\n- Published\nIn the space of just five years, Anthropic has gone from unknown start-up to tech giant, worth more than a trillion dollars.\nThe company behind the AI platform Claude was formed by seven people who left rival OpenAI in 2021 and, in a matter of hours, will become multi-billionaires - on paper at least.\nAnthropic is floating the business on the US stock exchange and will sell its shares at between $70 - $78 each.\nIf they go for the highest price, the founders' shareholdings will be worth at least $18.5bn each.\nSo, who are these people, all in their thirties and forties, who are about to become incredibly wealthy?\nDario Amodei\nIn 2020, Dario Amodei was working for OpenAI, the firm that brought generative artificial intelligence to a mainstream audience, when it launched Chat-GPT.\nHe decided he wanted to do things his own way, and left, taking his sister Daniela, and five colleagues with him.\nAmodei grew up in San Francisco, impressing school friends not just with his academic prowess but also his speed on the running track, and his preoccupation with philosophical and technological questions including the potential of machines to gain consciousness and human longevity.\nInitially he studied physics at Princeton and Stanford. But following his father's death from hepatitis C, he switched to biology and biomedical sciences.\nAmodei did stints at the Chinese tech giant Baidu and Google before joining OpenAI.\nBut he began to worry that some people within the company were putting profit before safety, prompting the decision to jump ship.\nNow 43, he is Anthropic's chief executive, and the person who, in his sister's words, makes the company \"ambitious\".\nDaniela Amodei\nDario and Daniela Amodei, were close growing up and later shared a flat together in San Francisco with other friends. She followed him into OpenAI and joined him when he left to found Anthropic.\nShe and her brother have always genuinely liked each other, she says, but the only thing she ever did first, was when he followed her in becoming vegetarian.\nAmodei studied English Literature at the University of California Santa Cruz, going on to work for Democrat representative Matt Cartwright.\nShe has also worked at financial services platform Stripe, where she was head of risk operations.\nThe 39-year-old is president of Anthropic, manages the executive team, and leads the firm's research, engineering, product, governance and commercial work.\nTom Brown\nTom Brown, now 39, followed the Amodei siblings when they left to found their new venture.\nHe led GPT-3 engineering at OpenAI, and prior to that was at Google on its DeepMind project.\nBrown established his entrepreneurial credentials co-founding an app called \"Grouper\" that helps set up drinks between groups of friends.\nHe has supported US President Donald Trump's stance on datacentres, arguing that they are \"an enormous source of prosperity\".\nNow as chief compute officer at Anthropic he is responsible for how the company secures and uses its computing resources.\nJack Clark\nJack Clark, is another arts graduate among the original start-up's founding members and the only one who is not from North America.\nOriginally from Brighton in the UK, he studied English Literature and Creative Writing at the University of East Anglia and became a technology journalist, writing for publications including ZDNet UK, The Register, and Bloomberg.\nHe was caught up in the excitement of artificial intelligence and joined OpenAI, where he worked initially in communications, later becoming its policy director.\nNow, 37, Clark is head of public benefit at Anthropic. He also leads the Anthropic Institute, an AI think tank.\nJared Kaplan\nJared Kaplan, 42, is chief science officer at Anthropic, and heads its technical research. He is also an associate professor at Johns Hopkins University in Baltimore.\nHe holds a PhD in physics from Harvard University.\nHis work on scaling laws - which describe mathematical patterns that show that bigger AI models trained on more data tend to be more consistent - has helped provide AI firms with a framework for predicting AI behaviour, according to Anthropic.\nChris Olah\nChris Olah is described as \"interpretability research lead\" primarily focused on how AI models work with each other.\nBut according to the New York Times, Olah has spent much of the last year convening meetings with faith leaders from across the religious spectrum.\nDescribed by the newspaper as \"boyish\" but with \"the zeal of an evangelist\" the 34-year-old is reportedly exploring the relationship between morality and AI.\nHe previously led interoperability research at OpenAI, and prior to that was a research scientist at Google Brain.\nThe Canadian left the University of Toronto early, but later secured a Thiel Fellowship of $100,000, which is a scholarship to help gifted people move into research without a degree.\nSam McCandlish\nSam McCandlish, 36, takes less of a public-facing role than the other founders, but like them will own around 1.6% of the company after its shares go on sale. As a result he too will see his stake crystallise into a hugely valuable asset.\nMcCandlish is Anthropic's chief architect, and helps shape and implement the company's policy designed to mitigate the risks of AI. Prior to this he worked on safety at OpenAI.\nHe has a physics PhD from Stanford, and maths and physics degree from Brandeis University outside Boston.",
    "bodyJa": "The seven Anthropic founders who are about to become multi-billionaires\n- Published\nIn the space of just five years, Anthropic has gone from unknown start-up to tech giant, worth more than a trillion dollars.\nThe company behind the AI platform Claude was formed by seven people who left rival OpenAI in 2021 and, in a matter of hours, will become multi-billionaires - on paper at least.\nAnthropic is floating the business on the US stock exchange and will sell its shares at between $70 - $78 each.\nIf they go for the highest price, the founders' shareholdings will be worth at least $18.5bn each.\nSo, who are these people, all in their thirties and forties, who are about to become incredibly wealthy?\nDario Amodei\nIn 2020, Dario Amodei was working for OpenAI, the firm that brought generative artificial intelligence to a mainstream audience, when it launched Chat-GPT.\nHe decided he wanted to do things his own way, and left, taking his sister Daniela, and five colleagues with him.\nAmodei grew up in San Francisco, impressing school friends not just with his academic prowess but also his speed on the running track, and his preoccupation with philosophical and technological questions including the potential of machines to gain consciousness and human longevity.\nInitially he studied physics at Princeton and Stanford. But following his father's death from hepatitis C, he switched to biology and biomedical sciences.\nAmodei did stints at the Chinese tech giant Baidu and Google before joining OpenAI.\nBut he began to worry that some people within the company were putting profit before safety, prompting the decision to jump ship.\nNow 43, he is Anthropic's chief executive, and the person who, in his sister's words, makes the company \"ambitious\".\nDaniela Amodei\nDario and Daniela Amodei, were close growing up and later shared a flat together in San Francisco with other friends. She followed him into OpenAI and joined him when he left to found Anthropic.\nShe and her brother have always genuinely liked each other, she says, but the only thing she ever did first, was when he followed her in becoming vegetarian.\nAmodei studied English Literature at the University of California Santa Cruz, going on to work for Democrat representative Matt Cartwright.\nShe has also worked at financial services platform Stripe, where she was head of risk operations.\nThe 39-year-old is president of Anthropic, manages the executive team, and leads the firm's research, engineering, product, governance and commercial work.\nTom Brown\nTom Brown, now 39, followed the Amodei siblings when they left to found their new venture.\nHe led GPT-3 engineering at OpenAI, and prior to that was at Google on its DeepMind project.\nBrown established his entrepreneurial credentials co-founding an app called \"Grouper\" that helps set up drinks between groups of friends.\nHe has supported US President Donald Trump's stance on datacentres, arguing that they are \"an enormous source of prosperity\".\nNow as chief compute officer at Anthropic he is responsible for how the company secures and uses its computing resources.\nJack Clark\nJack Clark, is another arts graduate among the original start-up's founding members and the only one who is not from North America.\nOriginally from Brighton in the UK, he studied English Literature and Creative Writing at the University of East Anglia and became a technology journalist, writing for publications including ZDNet UK, The Register, and Bloomberg.\nHe was caught up in the excitement of artificial intelligence and joined OpenAI, where he worked initially in communications, later becoming its policy director.\nNow, 37, Clark is head of public benefit at Anthropic. He also leads the Anthropic Institute, an AI think tank.\nJared Kaplan\nJared Kaplan, 42, is chief science officer at Anthropic, and heads its technical research. He is also an associate professor at Johns Hopkins University in Baltimore.\nHe holds a PhD in physics from Harvard University.\nHis work on scaling laws - which describe mathematical patterns that show that bigger AI models trained on more data tend to be more consistent - has helped provide AI firms with a framework for predicting AI behaviour, according to Anthropic.\nChris Olah\nChris Olah is described as \"interpretability research lead\" primarily focused on how AI models work with each other.\nBut according to the New York Times, Olah has spent much of the last year convening meetings with faith leaders from across the religious spectrum.\nDescribed by the newspaper as \"boyish\" but with \"the zeal of an evangelist\" the 34-year-old is reportedly exploring the relationship between morality and AI.\nHe previously led interoperability research at OpenAI, and prior to that was a research scientist at Google Brain.\nThe Canadian left the University of Toronto early, but later secured a Thiel Fellowship of $100,000, which is a scholarship to help gifted people move into research without a degree.\nSam McCandlish\nSam McCandlish, 36, takes less of a public-facing role than the other founders, but like them will own around 1.6% of the company after its shares go on sale. As a result he too will see his stake crystallise into a hugely valuable asset.\nMcCandlish is Anthropic's chief architect, and helps shape and implement the company's policy designed to mitigate the risks of AI. Prior to this he worked on safety at OpenAI.\nHe has a physics PhD from Stanford, and maths and physics degree from Brandeis University outside Boston.",
