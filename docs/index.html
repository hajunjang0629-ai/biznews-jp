    "title": "CoreWeave beats on revenue and lifts guidance, easing AI slowdown concerns",
    "titleJa": "CoreWeave beats on revenue and lifts guidance, easing AI slowdown concerns",
    "summaryJa": "CoreWeave's stock has been hammered heading into the neocloud's Q3 earnings report.",
    "bodyOriginal": "CoreWeave reported better-than-expected quarterly revenue and lifted its 2026 guidance on Tuesday, showing that demand for artificial intelligence infrastructure remains strong despite concerns of a market slowdown. The stock advanced in extended trading.\nThe earnings announcement lands at a particularly volatile moment for CoreWeave and its neocloud peers, as the market sours on the AI trade and as Nvidia CEO Jensen Huang, the central figure in the global buildout, faces a scandal tied to an affair with an alleged Chinese spy.\nHere's how the company performed relative to LSEG consensus:\n- Loss per share: 95 cents adjusted vs. $1.16 expected\n- Revenue: $3.66 billion vs. $3.55 billion expected\nCoreWeave's revenue soared 168% from about $1.36 billion a year earlier, according to a statement. The company recorded a net loss of $709 million, or $1.27 per share, compared to a net loss of $110 million a year earlier. Adjusted earnings exclude stock-based compensation.\nExecutives pushed up their forecast for 2026. They now see $1.275 billion to $1.375 billion in adjusted operating income on $13 billion to $13.3 billion in revenue. Analysts surveyed by Visible Alpha were looking for $1.07 billion in adjusted operating income, and analysts polled by LSEG had expected $12.86 billion in 2026 revenue.\nIn August, CoreWeave's 2026 guidance included $960 million to $1.15 billion in adjusted operating income and $12.4 billion to $13.2 billion in revenue.\nCoreWeave has lost over 40% of its value in the past month, as investors rotate out of companies most closely tied to AI infrastructure. Rising interest rates have pushed lenders out of the market, raising concerns about ongoing access to capital. Some CoreWeave bond yields recently topped 16%.\n\"The business can execute well and still face a tougher financing environment,\" Joe Tigay, portfolio manager at Equity Armor Investments, wrote in an email. \"Strong demand is encouraging; the cost and availability of capital remain critical.\"\nCoreWeave will get most the capital it needs for 2027 through clients pre-payments and financing from hardware partners, and the company will raise \"a limited amount\" as well, CEO Mike Intrator told analysts on a conference call.\nThe company plans to raise new debt tied to a set of contracts in the weeks to come, said Nitin Agrawal, its finance chief.\n\"At current yields, we do not intend to issue additional parent-level unsecured debt through 2027,\" he said. \"By contrast, the asset-level secured debt market has remained stable, with our loans continuing to trade around par value.\" In all, he said he projects under $5 billion in parent-level debt financing through 2027.\nFellow neocloud Nebius, whose stock is down by a similar amount, is scheduled to report earnings on Thursday. Nebius shares got a small boost from CoreWeave's results.\nBoth companies and several other providers of cloud-based graphics processing units are particularly reliant on Nvidia, which provides GPUs as well as necessary capital to the whole ecosystem. Nvidia shares have dropped nearly 10% to start the week as the Huang affair raises pressure on the company in Washington, D.C. Nvidia's board said on Tuesday that it hired Wachtell, Lipton, Rosen & Katz to investigate Huang and determine whether national security or company secrets were compromised.\nCoreWeave investors are also looking toward next week, when key customer Anthropic is scheduled to debut on the Nasdaq. In its updated IPO prospectus on Tuesday, Anthropic indicated that it could be valued at around $1.4 trillion after its share sale. Anthropic has signed deals for the construction of entire data centers that will meet its needs. \"We see that we're going to have long-term relationships with the AI labs,\" said Intrator, a CoreWeave co-founder.\nDuring the quarter, CoreWeave said it would establish its first data centers in Asia and announced the Forge service for running and evaluating AI models.\nManagement still anticipates 1.85 gigawatts in active power by the end of 2026. CoreWeave is targeting $37 billion to $39 billion in full-year capital expenditures, which would imply 155% growth at the middle of the range. Analysts polled by Visible Alpha were looking for $37.69 billion.\nCoreWeave owed almost $47 billion in debt at the end of the third quarter, according to the statement. Like its bigger cloud rivals such as Amazon and Oracle, CoreWeave is rushing to bolster computing capacity for clients. But last week, voters in the U.S., where CoreWeave derives most of its revenue, rejected dozens of initiatives on data center development.\n\"If data center construction across the sector were to slow, installed compute becomes scarcer, and the knock-on effect is that GPU pricing may stay higher for longer,\" Intrator said.\nHe said the company does not expect risks to deliveries in 2027 based on construction at permitted locations.\n\"We could sell all of the capacity that we have to current buyers that are in the queue. We are choosing not to,\" Intrator said. We're choosing to be patient. We're choosing to bring the infrastructure to market when it is further along, because we believe that that will result in better economic output for the outstanding infrastructure that we have.\"\nMeanwhile, demand remains robust, with the company now sitting on a $132.5 billion revenue backlog, up from $104 billion as of June.\n\"Should we choose to focus only on our committed backlog, we would expect capex for 2027 to remain in line with our 2026 capex investment, while revenue and EBITDA grow significantly,\" Agrawal said.\nWATCH: Cramer's Mad Dash: CoreWeave",

    "title": "Nvidia hires major US law firm to investigate alleged Chinese spy affair",
    "titleJa": "Nvidia hires major US law firm to investigate alleged Chinese spy affair",
    "summaryJa": "The appointment was made after it emerged Jensen Huang had an affair with a woman believed to be a spy for China.",
    "bodyOriginal": "Nvidia hires major US law firm to investigate alleged Chinese spy affair\n- Published\nNvidia has hired one of the largest law firms in the US to investigate the affair between its own chief executive and an alleged Chinese spy.\nJensen Huang, who co-founded the tech company, has admitted to having a romantic relationship outside of his marriage. The woman, Alice Huang, is alleged to be a spy for Beijing.\nNvidia said on Tuesday that it had hired New York law firm Wachtell, Lipton, Rosen & Katz, and that its attorney Joon Kim would lead \"a thorough and independent investigation\". The FBI is also conducting its own probe.\nThe company's share price has fallen almost to a yearly low, with $500bn (£375bn) wiped of its stock market value since Friday.\nNvidia is widely considered one of the most important companies behind the artificial intelligence (AI) boom given it is the sole manufacturer of a crucial computer chip required for successfully operating AI tools.\nIt is the world's second most valuable company after Apple and its chips have become a matter of national security for US officials keen to win the AI race.\nAlice Huang was an executive at a Singaporean company Megaspeed, which has been a customer of Nvidia.\nThe company had been suspected of helping divert Nvidia chips to China, a concern that Nvidia has said was investigated and debunked.\nNvidia has also maintained the US government did not inform the firm that Megaspeed posed an intelligence concern.\nAccording to the New York Times, Secretary of State Marco Rubio sent a memo to top officials in Washington in spring of this year warning that the Jensen Huang was in a close relationship with a Chinese spy.\nBeijing has rejected claims that Jensen Huang has been targeted, with its foreign ministry saying the allegations were \"intended to smear and malign China\".\nUS President Donald Trump said Monday that he had spoken to Jensen Huang and that the Nvidia boss told him \"I had no idea she was a spy.\" Trump said he believed the him.\nHowever, the relationship has drawn more political attention. Congressional leaders of the House Committee on Foreign Affairs have asked Jensen Huang to appear next week for a closed door briefing.\nThe Nvidia boss has yet to say whether he will attend, a person familiar with the committee's demand told the BBC.\nThe committee has the authority to subpoena Jensen Huang, effectively forcing him to appear before the committee, if deemed necessary.\nWhen announcing on Sunday that it would investigate the affair, Nvidia's board said it had no reason to believe the company's secrets or national security were compromised.\nIt added that a committee of independent directors would oversee the probe.\nWhat we know so far about Jensen Huang's affair with suspected Chinese spy\n- Published1 hour ago\nJoon Kim, who will lead Nvidia's investigation, is a former US Attorney for New York's Southern District and spent several years working as a government attorney focused on fraud and other criminal acts.\nWachtell is one of the largest law firms in the US and has several notable clients in the tech industry. Among them are OpenAI and Salesforce.\nThe investigation will likely be treated as urgent, according to sources familiar with the matter, as Jensen Huang's public image is tightly intertwined with Nvidia.\nHe has become a key public figure in the development on AI, arguing the technology is a \"new industrial revolution\" and is on par with the advent of electricity.\nIt is unclear, however, if Wachtell will be able to interview Alice Huang, who is also known as Huang Le, and is not related to Jensen Huang.\nA spokesperson for Nvidia declined to comment on Tuesday when asked if Jensen Huang had retained any additional of his own legal representation amid the company investigation and the separate one launched by the FBI.\n- Published14 hours ago",

    "summaryJa": "Tuesday was the deadline for provisional ballots to be resolved in Mississippi, and the deadline for the receipt of mail-in absentee ballots.",
    "bodyOriginal": "Democratic nominee Scott Colom added slightly to his narrow lead over incumbent Sen. Cindy Hyde-Smith in the Mississippi Senate election as two key ballot deadlines hit Tuesday.\nColom, a local district attorney, as of 4:30 p.m. ET, was ahead of Hyde-Smith by 2,607 votes, out of 953,547 votes counted, with an estimated 97% of the votes in, according to the Associated Press. That's a margin of just 0.27 percentage points.\nIndependent candidate Ty Pinkins had 20,034 votes.\nTuesday is the deadline for resolving affidavit or provisional ballots, which are cast by voters whose eligibility is disputed or unclear on Election Day. It is also the deadline for the receipt of mail-in absentee ballots that are postmarked by Election Day, Nov. 3.\nMississippi is one of just two states whose Senate election has not been called. Alaska is the other.\nDemocrats so far have flipped seven Senate seats held by Republicans going into the election. That gives Democrats a new majority in the Senate of at least 54 seats in the 100-member chamber come January.\nAlaska before Election Day was viewed as possibly key to the question of whether Republicans would retain their narrow majority in the Senate.\nMississippi, which has not elected a Democratic senator since the segregationist John Stennis in 1982, was on few political analysts' radar as a possible pickup for Democrats. If Colom wins his race, he would be the first Black senator from Mississippi since the post-Civil War Reconstruction Era.\nIn Alaska, Democratic nominee Mary Peltola is ahead by just 2,517 votes over incumbent Republican Sen. Dan Sullivan, with 218,641 total votes counted, a margin of 1.1 percentage points.\nPeltola has 48.6% of the total vote. If neither she nor Sullivan gets more than 50% of the total vote, the race will go to a ranked-choice round, in which the two other candidates, Gerald Heikes and another candidate named Dan Sullivan, will be eliminated, and the second choices of voters who made them their first choice will be allocated between Peltola and the incumbent.",

    "title": "Rep. Jim Jordan, Sen. John Thune elected GOP leaders in Congress",
    "titleJa": "Rep. Jim Jordan, Sen. John Thune elected GOP leaders in Congress",
    "summaryJa": "House Speaker Mike Johnson, R-La., announced the day after Election Day he would not run for minority leader in the 120th Congress.",
    "bodyOriginal": "Republican lawmakers on Tuesday picked Rep. Jim Jordan of Ohio and Sen. John Thune of South Dakota to serve as their respective House and Senate minority leaders in the next Congress.\nJordan, the House Judiciary Committee chairman, was elected in a 106-73 vote, sources told MS NOW on condition of anonymity to discuss the private meeting. He beat Rep. Steve Scalise, R-La., the current House majority leader.\nA two-decade House veteran and committed supporter of President Donald Trump, Jordan will take on the leadership role just as Republicans relinquish power, following blowout Democratic victories in last week's midterm election.\nHouse Speaker Mike Johnson, R-La., announced the day after Election Day that he would not run for minority leader in the 120th Congress.\nThune, in a statement, said he \"appreciated the opportunity to have an open, honest, and transparent conversation with my colleagues today, and I am honored to have their continued trust and support to lead the Senate Republican Conference in the 120th Congress.\"\n\"I'm proud of what this Republican team has accomplished together, and we remain united in our commitment to advancing conservative priorities, working with President Trump and our colleagues in the House, and holding the line against Democrats' efforts to enact their far-left, liberal agenda,\" Thune said in the statement.\n\"We have important work ahead of us, and I look forward to serving alongside my colleagues on behalf of the American people,\" he said.",

    "title": "White House vows to press ahead with tariffs despite midterm backlash over rising prices",
    "titleJa": "White House vows to press ahead with tariffs despite midterm backlash over rising prices",
    "summaryJa": "Business executives warned at a Washington summit of rising costs and shifting supply chains as polls showed growing opposition to Trump's tariffs.",
    "bodyOriginal": "One week after voters punished Republicans over rising prices in the midterm elections, President Donald Trump's White House signaled it would stay the course on tariffs, even as his former top economic advisor warned that Americans are footing the bill.\nJim Goyer, Trump's director of White House Office of Public Liaison, defended tariffs as a tool to rebuild U.S. manufacturing, secure supply chains and protect national security during an address Tuesday at the B20 summit, a gathering of global business leaders in Washington hosted by the U.S. Chamber of Commerce.\n\"And we are just getting started,\" Goyer said. \"Our ambition is to continue this pace for the remainder of the president's term in office.\"\nBut Gary Cohn, who served as Trump's chief economic advisor during his first administration, offered a sharply different assessment during an onstage interview later Tuesday.\n\"Tariffs are a consumption tax on the U.S. consumer,\" Cohn said, arguing that the duties are raising prices and forcing Americans to reconsider purchases.\nThe divide exposed a growing dilemma for Trump. His trade agenda is reshaping global commerce – and driving up costs for voters. Companies are adapting to the chaos, but the old trading system isn't coming back.\n\"President Trump has disrupted that system in a way that we're not likely to return to,\" Kevin Brady, a former Republican congressman who helped lead the B20 summit, said during a discussion with U.S. Chamber CEO Suzanne Clark.\nThe political backlash was evident in the Nov. 3 election. Roughly two-thirds of voters said Trump's policies contributed to inflation, according to the CNBC Voter Poll. Nearly nine in 10 said the cost of living was a major or crucial factor in their vote.\nA separate Reuters/Ipsos poll released Tuesday found 62% of Americans supported repealing Trump's tariffs, while just 21% approved of his handling of the cost of living.\n\"Last week, American voters sent a clear message about the cost of living and their economic security,\" Clark said in her keynote address.\nThe pressure intensified Tuesday as new government data showed consumer prices rose 0.4% in October, exceeding economists' expectations. Annual inflation reached 3.7% in September, the latest available year-over-year figure and well above the Federal Reserve's 2% target.\nTariffs are not the only factor driving higher prices. The war with Iran has pushed energy costs sharply higher, while housing, healthcare and other household expenses continue to strain consumers.\nBut research has found Trump's import duties have added to those pressures. A Federal Reserve Bank of New York study estimated that about 26% of tariff increases were passed through to consumer prices, with some effects taking nine to 12 months to work through supply chains.\nCohn, now vice chairman of IBM, argued that while tariffs generate revenue for the U.S., those gains come at consumers' expense.\n\"You're looking at one side of the equation. You're looking at the credit side of the balance sheet,\" Cohn said, describing how he would respond to Trump's defense of tariff revenue. \"There's the debit side of the balance sheet, which is every hardworking American who happened to pay the tariff through some product that they bought.\"\nStill, Cohn saw room for a bipartisan trade deal. He suggested Trump and the incoming Democratic Congress could make protections against China and unfair trade practices permanent while rolling back tariffs on Canada, leaving less for future presidents to undo.\nFor businesses, the shift is already underway. UPS CEO Carol Tomé said customers are moving production and sourcing closer to home as global supply chains become more regional.\n\"Supply chains are diversifying. Supply chains are regionalizing,\" Tomé said during a panel discussion moderated by CNBC's Morgan Brennan.\nSeparately, UPS is opening a new $80 million-plus air hub in the Philippines in October to expand its Asian network and improve connections across more than 1,100 global trade lanes.\nOther executives, like Jim Fitterling, executive chairman of chemicals giant Dow, defended Trump's tariffs despite their costs. Fitterling acknowledged they can drive up prices but argued they are necessary to combat unfair competition and protect U.S. manufacturing.\nDemocrats plan to challenge Trump's tariffs when they take control of Congress in January, but his veto power and broad trade authority could make them difficult to overturn.",

    "id": "pete-hegseth-decries-impeachment-push-de-237fcbcf",
    "title": "Pete Hegseth decries impeachment push, defends Iran war handling",
    "titleJa": "Pete Hegseth decries impeachment push, defends Iran war handling",
    "summaryJa": "GOP Rep. Thomas Massie, who has clashed with President Donald Trump, kicked off the Hegseth impeachment fight days after a blue-wave midterm election.",
    "bodyOriginal": "Secretary of Defense Pete Hegseth on Tuesday railed against the Republican congressman who introduced articles of impeachment against him and aggressively defended his leadership in the Iran war and other military operations.\n\"What one disgruntled and defeated congressman is attempting is not oversight, and it's not accountability. It's a political spectacle, a personal manifesto driven by ego and resentment,\" Hegseth said a day after Rep. Thomas Massie, R-Ky., put forward the eight impeachment articles.\n\"It's a farce, and it's a stunt, and everybody knows it,\" Hegseth said during his first Pentagon news conference in six months.\nThe articles accuse Hegseth of waging war in contravention of Congress, carrying out extrajudicial killings tied to boat strikes in the Caribbean against purported drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a military veteran.\nMassie, a libertarian who lost his Republican primary in May after clashing with President Donald Trump, kicked off the impeachment battle less than a week after a blue-wave midterm that will flip House and Senate control to Democrats.\nRep. Hakeem Jeffries, D-N.Y., who is poised to be speaker of the House in the next Congress, on Sunday said Democrats are a \"hard yes\" on impeaching Hegseth. He reiterated his support on Monday in a press conference.\nThe House is set to vote Tuesday on a procedural motion related to the impeachment resolution. If it passes, the measure will proceed to a debate and vote. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\nHegseth accused Massie of performing a \"stunt\" that sends dangerous signals to America's enemies.\n\"It puts a target on the backs of American warriors by signaling that Congress will undermine their missions in real time,\" Hegseth said. \"This is not patriotism. This is sabotage.\"\nTrump piled on, writing in a Truth Social post right after Hegseth's presser ended that the Pentagon chief \"gets an 'A' PLUS, PLUS, PLUS for his defense against a disgruntled, angry, defeated, former Congressman, Thomas Massie, a TOTAL LOSER!\"\nTrump, who was impeached twice during his first presidential term, said Monday that he would stand by Hegseth even if the House impeaches him.\nRepublicans hold a slim 218-214 majority in the House, but it is unclear if the rest of the GOP conference will be able to band together to defeat Massie's impeachment resolution. Some Republicans, notably including Vice President JD Vance, have directly blamed their midterm losses on the Iran war, which continues to see intermittent fighting amid an uneasy stalemate.\nIf Hegseth is impeached, the Senate would be tasked with holding a trial and voting on whether to remove him from office. A two-thirds majority is required for conviction and removal. No U.S. Cabinet secretary has ever been removed by the Senate, though two have been impeached.\n— CNBC's Garrett Downs contributed reporting.",
    "bodyJa": "Secretary of Defense Pete Hegseth on Tuesday railed against the Republican congressman who introduced articles of impeachment against him and aggressively defended his leadership in the Iran war and other military operations.\n\"What one disgruntled and defeated congressman is attempting is not oversight, and it's not accountability. It's a political spectacle, a personal manifesto driven by ego and resentment,\" Hegseth said a day after Rep. Thomas Massie, R-Ky., put forward the eight impeachment articles.\n\"It's a farce, and it's a stunt, and everybody knows it,\" Hegseth said during his first Pentagon news conference in six months.\nThe articles accuse Hegseth of waging war in contravention of Congress, carrying out extrajudicial killings tied to boat strikes in the Caribbean against purported drug smugglers and suppressing free speech by targeting Sen. Mark Kelly, D-Ariz., a military veteran.\nMassie, a libertarian who lost his Republican primary in May after clashing with President Donald Trump, kicked off the impeachment battle less than a week after a blue-wave midterm that will flip House and Senate control to Democrats.\nRep. Hakeem Jeffries, D-N.Y., who is poised to be speaker of the House in the next Congress, on Sunday said Democrats are a \"hard yes\" on impeaching Hegseth. He reiterated his support on Monday in a press conference.\nThe House is set to vote Tuesday on a procedural motion related to the impeachment resolution. If it passes, the measure will proceed to a debate and vote. Impeachment resolutions are privileged, meaning the House must act on them, table them or vote to refer them to committee within two legislative days.\nHegseth accused Massie of performing a \"stunt\" that sends dangerous signals to America's enemies.\n\"It puts a target on the backs of American warriors by signaling that Congress will undermine their missions in real time,\" Hegseth said. \"This is not patriotism. This is sabotage.\"\nTrump piled on, writing in a Truth Social post right after Hegseth's presser ended that the Pentagon chief \"gets an 'A' PLUS, PLUS, PLUS for his defense against a disgruntled, angry, defeated, former Congressman, Thomas Massie, a TOTAL LOSER!\"\nTrump, who was impeached twice during his first presidential term, said Monday that he would stand by Hegseth even if the House impeaches him.\nRepublicans hold a slim 218-214 majority in the House, but it is unclear if the rest of the GOP conference will be able to band together to defeat Massie's impeachment resolution. Some Republicans, notably including Vice President JD Vance, have directly blamed their midterm losses on the Iran war, which continues to see intermittent fighting amid an uneasy stalemate.\nIf Hegseth is impeached, the Senate would be tasked with holding a trial and voting on whether to remove him from office. A two-thirds majority is required for conviction and removal. No U.S. Cabinet secretary has ever been removed by the Senate, though two have been impeached.\n— CNBC's Garrett Downs contributed reporting.",

    "id": "jensen-huang-s-affair-with-alleged-chine-df20b141",
    "title": "Jensen Huang's affair with alleged Chinese spy further complicates Nvidia’s China problem",
    "titleJa": "Jensen Huang's affair with alleged Chinese spy further complicates Nvidia’s China problem",
    "summaryJa": "The allegations against Jensen Huang have brought new attention to the Nvidia CEO's potential influence over U.S. policy on chip sales to China.",
    "bodyOriginal": "Following Nvidia CEO Jensen Huang's admission on Sunday to an extramarital affair with alleged Chinese spy Alice Huang, the chipmaker's relationship to China is about to come under intense scrutiny in Washington, D.C.\nSince October 2022, when the Biden administration announced sweeping controls to limit China's ability to obtain advanced U.S. chips, Nvidia has seen its business diminish in the world's second-largest economy. Months after an even stricter set of rules was implemented by the Trump administration, Huang said in October 2025, \"We are 100% out of China.\"\nThe recent allegations against Huang, while throwing the chipmaker into crisis, have also brought attention to the Nvidia CEO's potential influence over U.S. policy on chip sales to China, where its business once flourished. Of particular interest is whether restricted Nvidia chips have reached Chinese companies through customers like Singapore-based Megaspeed, the company linked to Alice Huang.\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\nJensen Huang has been closely aligned with President Donald Trump during his second administration, helping advise the White House on artificial intelligence safety regulations, while also pushing for looser restrictions on selling AI chips to China. In December, Trump said Nvidia would be allowed to ship its H200 chips to China, provided the U.S. got a 25% cut of sales. In March, Huang told reporters that Nvidia had \"received purchase orders, and we're in the process of restarting our manufacturing.\"\nHuang was a last-minute addition to the roster of tech executives who joined Trump on a trip to China in May, after the president was briefed on intelligence concerns, according to the Times.\n\"In 35 years, I haven't seen a chip CEO with this much direct influence on export policy,\" said Patrick Moorhead, CEO at Moor Insights & Strategy, in an email.\nSince last week's midterm elections that included sweeping victories across the country for Democrats, the mood in Washington has changed. Three House committees have requested closed-door briefings with the Nvidia CEO about his relationship with Megaspeed.\nDemocratic lawmakers, who are about to take power in the House and Senate, have said publicly that Congress will investigate and seek answers. Trump said Monday that he was \"amazed\" by the allegations and that Huang told him he \"had no idea that she was a spy.\" The FBI is now looking into the issue, Trump said at a White House briefing.\n'Turbulent month or so'\nIt's been a long four years for Nvidia in China.\nBefore the initial export controls in 2022, China made up nearly a quarter of Nvidia's revenue. Nvidia responded to the Biden-era restrictions by redesigning some of its products to comply with the new regulations.\n\"It was a turbulent month or so as the company went upside down to re-engineer\" the products, Huang told CNBC in a 2023 interview. Still, he was confident the company could continue selling chips to China. \"I think we're going to be just fine in the ability to serve the customers there,\" he said.\nAfter the Biden administration tightened export restrictions again, Nvidia redesigned another AI graphics processing unit for China, the H20. Following reports that Chinese model developer DeepSeek was using restricted Nvidia chips, the Trump administration limited sales of H20. Nvidia revealed it would incur $5.5 billion in costs related to canceled orders for the redesigned chip.\nHowever, despite saying in its forecasts that \"we're assuming 0% for China,\" the company maintained business in the region. In the last fiscal year, Nvidia reported that about 9% of its revenue came from China, including Hong Kong, although that includes revenue from segments outside of restricted data center chips, such as gaming, auto and industrial. Nvidia's China revenue was 8% in the most recent quarter.\nA report in May from short seller Culper Research alleged Nvidia's China exposure was much higher. The firm said that more than 20% of Nvidia's fiscal 2026 compute revenue was driven by China, supported by \"illegal GPU diversion and Southeast Asian intermediaries,\" according to the report.\nA loophole allows Chinese companies to rent Nvidia GPUs in data centers, even when they're restricted from buying them outright. For example, a Chinese company could lease Nvidia computing power in Europe by renting server capacity from a non-Chinese neocloud or data center operator that's exempt from export controls.\nNvidia didn't respond to a request for comment for this story.\nMegaspeed, an Nvidia customer based in Singapore, has been accused of diverting its own supply of Nvidia's restricted AI chips to Chinese companies. Megaspeed denies wrongdoing and said inspections found no evidence of violations.\nIn 2025, Nvidia changed the way it reported regional sales to categorize by customer headquarters, instead of by where the products were billed. Nvidia also stopped reporting Singapore sales during the same period.\n\"Whether Blackwell chips reached China is a Megaspeed question that predates this week,\" said Moorhead, pointing to Bloomberg reporting in December 2025 that found Megaspeed had imported 50,000 more Nvidia chips than Nvidia tallied in its data centers.\nIn 2025, a House Select Committee opened an investigation into whether China's DeepSeek operates on Nvidia's chips.\nA separate investigation by the U.S. Commerce Department was centered on Megaspeed. That probe was abruptly transferred to the Justice Department, the Times reported, following an email from Nvidia's general counsel to the Commerce Department seeking information about the investigation.\nThe restrictions aren't just coming from the U.S. China has continued to limit the amount of Nvidia chips it will allow into the country, keeping Nvidia's China sales numbers down. The U.S. has licensed H200 sales to Alibaba, Tencent, ByteDance and other Chinese companies, but Beijing hasn't approved large-scale imports, Moorhead told CNBC. Nvidia said H200 shipments to China made up less than 1% of data center revenue for the quarter that ended in July.\nMoorhead expects more export control legislation to pass as a result of the latest turmoil. Proposals could allow Congress oversight of chip export licenses or require chipmakers to install security mechanisms to track the location of chips to determine if they've found their way to China.\n\"Every China license now gets read through this story,\" Moorhead said. \"Jensen has been Nvidia's lead voice on China, and that voice is weaker.\"\n— CNBC's Kif Leswing and Seema Mody contributed reporting to this report.\nCorrection: Three House committees have requested closed-door briefings with the Nvidia CEO about his relationship with Megaspeed. An earlier version misstated the time element.\nWATCH: Nvidia CEO Jensen Huang On How His Big Bet On A.I. Is Finally Paying Off",
    "bodyJa": "Following Nvidia CEO Jensen Huang's admission on Sunday to an extramarital affair with alleged Chinese spy Alice Huang, the chipmaker's relationship to China is about to come under intense scrutiny in Washington, D.C.\nSince October 2022, when the Biden administration announced sweeping controls to limit China's ability to obtain advanced U.S. chips, Nvidia has seen its business diminish in the world's second-largest economy. Months after an even stricter set of rules was implemented by the Trump administration, Huang said in October 2025, \"We are 100% out of China.\"\nThe recent allegations against Huang, while throwing the chipmaker into crisis, have also brought attention to the Nvidia CEO's potential influence over U.S. policy on chip sales to China, where its business once flourished. Of particular interest is whether restricted Nvidia chips have reached Chinese companies through customers like Singapore-based Megaspeed, the company linked to Alice Huang.\nThe New York Times first reported that the Chinese businesswoman was a spy for China's Ministry of State Security, according to people briefed on the intelligence circulated in a memo among the Trump administration in the spring. China has called the allegation a smear.\nJensen Huang has been closely aligned with President Donald Trump during his second administration, helping advise the White House on artificial intelligence safety regulations, while also pushing for looser restrictions on selling AI chips to China. In December, Trump said Nvidia would be allowed to ship its H200 chips to China, provided the U.S. got a 25% cut of sales. In March, Huang told reporters that Nvidia had \"received purchase orders, and we're in the process of restarting our manufacturing.\"\nHuang was a last-minute addition to the roster of tech executives who joined Trump on a trip to China in May, after the president was briefed on intelligence concerns, according to the Times.\n\"In 35 years, I haven't seen a chip CEO with this much direct influence on export policy,\" said Patrick Moorhead, CEO at Moor Insights & Strategy, in an email.\nSince last week's midterm elections that included sweeping victories across the country for Democrats, the mood in Washington has changed. Three House committees have requested closed-door briefings with the Nvidia CEO about his relationship with Megaspeed.\nDemocratic lawmakers, who are about to take power in the House and Senate, have said publicly that Congress will investigate and seek answers. Trump said Monday that he was \"amazed\" by the allegations and that Huang told him he \"had no idea that she was a spy.\" The FBI is now looking into the issue, Trump said at a White House briefing.\n'Turbulent month or so'\nIt's been a long four years for Nvidia in China.\nBefore the initial export controls in 2022, China made up nearly a quarter of Nvidia's revenue. Nvidia responded to the Biden-era restrictions by redesigning some of its products to comply with the new regulations.\n\"It was a turbulent month or so as the company went upside down to re-engineer\" the products, Huang told CNBC in a 2023 interview. Still, he was confident the company could continue selling chips to China. \"I think we're going to be just fine in the ability to serve the customers there,\" he said.\nAfter the Biden administration tightened export restrictions again, Nvidia redesigned another AI graphics processing unit for China, the H20. Following reports that Chinese model developer DeepSeek was using restricted Nvidia chips, the Trump administration limited sales of H20. Nvidia revealed it would incur $5.5 billion in costs related to canceled orders for the redesigned chip.\nHowever, despite saying in its forecasts that \"we're assuming 0% for China,\" the company maintained business in the region. In the last fiscal year, Nvidia reported that about 9% of its revenue came from China, including Hong Kong, although that includes revenue from segments outside of restricted data center chips, such as gaming, auto and industrial. Nvidia's China revenue was 8% in the most recent quarter.\nA report in May from short seller Culper Research alleged Nvidia's China exposure was much higher. The firm said that more than 20% of Nvidia's fiscal 2026 compute revenue was driven by China, supported by \"illegal GPU diversion and Southeast Asian intermediaries,\" according to the report.\nA loophole allows Chinese companies to rent Nvidia GPUs in data centers, even when they're restricted from buying them outright. For example, a Chinese company could lease Nvidia computing power in Europe by renting server capacity from a non-Chinese neocloud or data center operator that's exempt from export controls.\nNvidia didn't respond to a request for comment for this story.\nMegaspeed, an Nvidia customer based in Singapore, has been accused of diverting its own supply of Nvidia's restricted AI chips to Chinese companies. Megaspeed denies wrongdoing and said inspections found no evidence of violations.\nIn 2025, Nvidia changed the way it reported regional sales to categorize by customer headquarters, instead of by where the products were billed. Nvidia also stopped reporting Singapore sales during the same period.\n\"Whether Blackwell chips reached China is a Megaspeed question that predates this week,\" said Moorhead, pointing to Bloomberg reporting in December 2025 that found Megaspeed had imported 50,000 more Nvidia chips than Nvidia tallied in its data centers.\nIn 2025, a House Select Committee opened an investigation into whether China's DeepSeek operates on Nvidia's chips.\nA separate investigation by the U.S. Commerce Department was centered on Megaspeed. That probe was abruptly transferred to the Justice Department, the Times reported, following an email from Nvidia's general counsel to the Commerce Department seeking information about the investigation.\nThe restrictions aren't just coming from the U.S. China has continued to limit the amount of Nvidia chips it will allow into the country, keeping Nvidia's China sales numbers down. The U.S. has licensed H200 sales to Alibaba, Tencent, ByteDance and other Chinese companies, but Beijing hasn't approved large-scale imports, Moorhead told CNBC. Nvidia said H200 shipments to China made up less than 1% of data center revenue for the quarter that ended in July.\nMoorhead expects more export control legislation to pass as a result of the latest turmoil. Proposals could allow Congress oversight of chip export licenses or require chipmakers to install security mechanisms to track the location of chips to determine if they've found their way to China.\n\"Every China license now gets read through this story,\" Moorhead said. \"Jensen has been Nvidia's lead voice on China, and that voice is weaker.\"\n— CNBC's Kif Leswing and Seema Mody contributed reporting to this report.\nCorrection: Three House committees have requested closed-door briefings with the Nvidia CEO about his relationship with Megaspeed. An earlier version misstated the time element.\nWATCH: Nvidia CEO Jensen Huang On How His Big Bet On A.I. Is Finally Paying Off",

    "title": "Consumer prices rose 0.4% in October, more than expected, complicating Fed's inflation fight",
    "titleJa": "Consumer prices rose 0.4% in October, more than expected, complicating Fed's inflation fight",
    "summaryJa": "The report comes at a critical juncture for the Federal Reserve as it considers its next move regarding interest rates.",
    "bodyOriginal": "Costs for goods and services rose more than expected in October, providing fresh warning signs for the Federal Reserve in its fight to lower inflation.\nThe consumer price index, a broad gauge of costs across the U.S. economy, increased a seasonally adjusted 0.4% for the month, the Bureau of Labor Statistics reported Tuesday. Economists surveyed by Dow Jones had been looking for a 0.3% increase.\nStripping out volatile food and energy, so-called core CPI increased 0.3% against the forecast for a 0.2% gain.\nThe headline CPI had increased 0.6% in September while core was up 0.3%.\nThe BLS did not estimate a yearly rate. The government shutdown last year prevented the bureau from collecting sufficient data in October 2025, so there is no comparable figure to use. However, the report did include annual figures for some individual items where it was able to collect data.\nStock market futures drifted lower following the release while Treasury yields jumped. Traders fully priced in a quarter percentage point increase when the Fed next meets Dec. 8-9 and put odds of a half-point hike at 13.6%, according to the CME Group's FedWatch tool.\nThe report comes at a critical juncture for the Federal Reserve as it considers its next move regarding interest rates. At its October meeting, central bank officials voted 10-2 to keep their benchmark rate in a range between 3.75%-4% while awaiting incoming data.\n\"This was the report the market could least afford to see,\" said Karen Manna, fixed income investment strategist at Federated Hermes. \"A hotter inflation print raises fresh questions about whether the Fed has done enough to contain price pressures and reinforces the risk that interest rates need to move higher and stay there for longer.\"\nThough gasoline prices have been falling in recent weeks, the energy index rose 0.7% and the gasoline index was up 1%. The natural gas index, though, was off 0.8%.\nFood costs accelerated 0.5%, pushed higher by increases of 1% for snacks, 0.9% for beef and 0.5% for meats, poultry, fish and eggs. Transportation services jumped 0.8%. New vehicle prices increased 0.2% but used cars and trucks fell 1.2%.\nShelter costs were higher by 0.3%, which the BLS said accounted for more than 30% of the headline increase.\nApparel, a tariff-sensitive sector, rose just 0.1%. Medical care commodities prices increased 0.5%. Airline fares accelerated 0.4%.\nMarkets already had been expecting the Fed to hike its benchmark borrowing rate next month, but the inflation data may have sealed the deal.\nSpeaking Tuesday morning in London ahead of the CPI release, Governor Christopher Waller said a hot inflation report could push him toward advocating for a half-point increase in December. Waller added that it's important the Fed follow through on expectations for a hike.\nDespite the moderating gas prices recently, Fed officials have expressed concern that the impacts from the Iran war and President Donald Trump's tariffs are becoming embedded in the economy. Inflation has been running above the Fed's 2% target for some 5½ years.\nIn addition to tariffs and the war, inflation has been pressured by hyperscaler spending in the artificial intelligence buildout. Electricity prices rose 0.9%, a potential complication from the AI story.\nConsumers, though, continue to spend — retail sales rose 0.8% in September, according to the Commerce Department — and businesses are still raising prices.\nA net 37% of businesses responding to the October National Federation of Independent Business survey reported that they plan to raise prices in the next three months, the highest level since July 2022.",

    "id": "sales-of-tinned-food-and-bottled-water-j-5ee036fb",
    "title": "Sales of tinned food and bottled water  jump after 'Be Ready' campaign launch",
    "titleJa": "Sales of tinned food and bottled water  jump after 'Be Ready' campaign launch",
    "summaryJa": "Sales of essential goods such as hand sanitiser soar after the government called on households to be prepared for emergencies.",
    "bodyOriginal": "Sales of tinned food and bottled water jump after 'Be Ready' campaign launch\n- Published\nSales of essential goods such as bottled water and canned food soared in the 10 days following the launch of the government's \"Be Ready\" emergency preparedness campaign on 22 October, research indicates.\nHand sanitiser sales were up 83%, sales of bottled water rose 67% and tinned and jarred goods climbed 37%, according to data from retail research firm Worldpanel by Numerator.\nThe government's public awareness campaign encouraged people to stock up in case of disruption to essential services by severe weather or cyberattacks.\nHowever, Worldpanel said that while households were stockpiling essentials, they were not panic buying.\nThe government campaign encouraged people to keep three days-worth of food and water in their homes.\nWet wipes, a torch and cash were also recommended.\nAfter the campaign launch, the equivalent of an extra 400,000 people per day bought tinned meat, Worldpanel said, although the typical amount remained at 500g, which suggests a gradual stocking-up.\n\"Shoppers clearly took notice of the 'Be Ready' campaign, but this wasn't panic buying, with less than a third of households buying bottled water in October,\" said Fraser McKevitt, head of retail and consumer insight at Worldpanel by Numerator.\n\"Growth came from more people adding the recommended items on the government's checklist to their weekly shop, not from shoppers piling their trolleys high, which is very much in line with what the government wanted households to do,\" he said.\nSales of tinned and jarred goods rose from £58.2m in the 10 days to 2 November 2025 to £79.5m over the same period in 2026.\nBottled water sales jumped from £13.6m to £22.8m compared with a year earlier and hand sanitiser sales climbed from £497,000 to £908,000.\nFurther evidence of stockpiling came from food firm Princes on Tuesday, which said demand for tinned tuna, meat and vegetables had risen following the government's campaign.\nPrinces interim chief executive Giuseppe Mastrolia said the jump in demand \"further reinforces the relevance of our core categories in providing affordable, nutritious and convenient food solutions\".\nThe \"Be Ready\" campaign warns that severe weather and cyber attacks could disrupt essential services, and British households need to make sure they have what they need - for example, bottled water, and long-life food that doesn't need to be kept in the fridge such as dried fruit and nuts.\nPrime Minister Andy Burnham has said everyone should have \"those supplies in the house to get you through those moments\".\nGet in touch\nHave you been stockpiling? If so, what have you been buying?\n- Published23 October",
    "bodyJa": "Sales of tinned food and bottled water jump after 'Be Ready' campaign launch\n- Published\nSales of essential goods such as bottled water and canned food soared in the 10 days following the launch of the government's \"Be Ready\" emergency preparedness campaign on 22 October, research indicates.\nHand sanitiser sales were up 83%, sales of bottled water rose 67% and tinned and jarred goods climbed 37%, according to data from retail research firm Worldpanel by Numerator.\nThe government's public awareness campaign encouraged people to stock up in case of disruption to essential services by severe weather or cyberattacks.\nHowever, Worldpanel said that while households were stockpiling essentials, they were not panic buying.\nThe government campaign encouraged people to keep three days-worth of food and water in their homes.\nWet wipes, a torch and cash were also recommended.\nAfter the campaign launch, the equivalent of an extra 400,000 people per day bought tinned meat, Worldpanel said, although the typical amount remained at 500g, which suggests a gradual stocking-up.\n\"Shoppers clearly took notice of the 'Be Ready' campaign, but this wasn't panic buying, with less than a third of households buying bottled water in October,\" said Fraser McKevitt, head of retail and consumer insight at Worldpanel by Numerator.\n\"Growth came from more people adding the recommended items on the government's checklist to their weekly shop, not from shoppers piling their trolleys high, which is very much in line with what the government wanted households to do,\" he said.\nSales of tinned and jarred goods rose from £58.2m in the 10 days to 2 November 2025 to £79.5m over the same period in 2026.\nBottled water sales jumped from £13.6m to £22.8m compared with a year earlier and hand sanitiser sales climbed from £497,000 to £908,000.\nFurther evidence of stockpiling came from food firm Princes on Tuesday, which said demand for tinned tuna, meat and vegetables had risen following the government's campaign.\nPrinces interim chief executive Giuseppe Mastrolia said the jump in demand \"further reinforces the relevance of our core categories in providing affordable, nutritious and convenient food solutions\".\nThe \"Be Ready\" campaign warns that severe weather and cyber attacks could disrupt essential services, and British households need to make sure they have what they need - for example, bottled water, and long-life food that doesn't need to be kept in the fridge such as dried fruit and nuts.\nPrime Minister Andy Burnham has said everyone should have \"those supplies in the house to get you through those moments\".\nGet in touch\nHave you been stockpiling? If so, what have you been buying?\n- Published23 October",

    "title": "Anthropic heads for $1.3 trillion valuation in major stock market listing",
    "titleJa": "Anthropic heads for $1.3 trillion valuation in major stock market listing",
    "summaryJa": "The AI company behind the Claude chatbot will offer its shares at between $70 and $78.",
    "bodyOriginal": "Anthropic heads for $1.3 trillion valuation in major stock market listing\n- Published\nAnthropic, the AI company behind the Claude chatbot, could be valued at $1.3 trillion (£1 trillion) when it lists its shares for sale on New York's Nasdaq stock exchange.\nThe loss-making company says it will offer its shares for between $70 and $78 each and plans to raise up to $64bn when it floats this month.\nThis would value Anthropic at between $1.1tn and $1.3tn which, although large, is below the $2tn some analysts had predicted weeks ago.\nIt is floating at a volatile time for AI firms. After last week's US midterm elections, the Nasdaq fell sharply on concerns a Democrat-led Congress could slow development of AI and the buildout of data centres.\nThere are also wider fears over the billions of dollars being spent on AI and whether it will pay off.\nIn its most recent results for the six months to the end of June, Anthropic's revenues jumped to $16.2bn from $1.1bn in the same period last year.\nHowever, its pre-tax loss jumped to $80.7bn from $12.9bn.\nFiona Cincotta, a senior market analyst at City Index, said the $64bn Anthropic wants to raise is \"fairly bullish\" within \"the volatility [and] concerns towards AI that we've seen in sort of particularly last week\".\nShe told Reuters: \"It's showing that they are still sort of upbeat about the outlook as far as AI is concerned and that obviously that they think that the demand is going to be there.\"\nAt $1.3tn, Anthropic's possible valuation is below SpaceX, Elon Musk's rocket, satellite and artificial intelligence company, which listed its shares in June and was valued at nearly $1.8tn.\nAnthropic is just five years old. It was co-founded in 2021 by brother and sister Dario and Daniela Amodei along with five others - all of whom worked at OpenAI, the rival AI giant behind ChatGPT.\nRelated topics\n- Published4 days ago\n- Published26 October",
    "bodyJa": "Anthropic heads for $1.3 trillion valuation in major stock market listing\n- Published\nAnthropic, the AI company behind the Claude chatbot, could be valued at $1.3 trillion (£1 trillion) when it lists its shares for sale on New York's Nasdaq stock exchange.\nThe loss-making company says it will offer its shares for between $70 and $78 each and plans to raise up to $64bn when it floats this month.\nThis would value Anthropic at between $1.1tn and $1.3tn which, although large, is below the $2tn some analysts had predicted weeks ago.\nIt is floating at a volatile time for AI firms. After last week's US midterm elections, the Nasdaq fell sharply on concerns a Democrat-led Congress could slow development of AI and the buildout of data centres.\nThere are also wider fears over the billions of dollars being spent on AI and whether it will pay off.\nIn its most recent results for the six months to the end of June, Anthropic's revenues jumped to $16.2bn from $1.1bn in the same period last year.\nHowever, its pre-tax loss jumped to $80.7bn from $12.9bn.\nFiona Cincotta, a senior market analyst at City Index, said the $64bn Anthropic wants to raise is \"fairly bullish\" within \"the volatility [and] concerns towards AI that we've seen in sort of particularly last week\".\nShe told Reuters: \"It's showing that they are still sort of upbeat about the outlook as far as AI is concerned and that obviously that they think that the demand is going to be there.\"\nAt $1.3tn, Anthropic's possible valuation is below SpaceX, Elon Musk's rocket, satellite and artificial intelligence company, which listed its shares in June and was valued at nearly $1.8tn.\nAnthropic is just five years old. It was co-founded in 2021 by brother and sister Dario and Daniela Amodei along with five others - all of whom worked at OpenAI, the rival AI giant behind ChatGPT.\nRelated topics\n- Published4 days ago\n- Published26 October",

    "id": "us-inflation-higher-than-expected-in-oct-6f43a6d2",
    "title": "US inflation higher than expected in October - here's what is happening with prices",
    "titleJa": "US inflation higher than expected in October - here's what is happening with prices",
    "summaryJa": "Prices rose by 0.4% over the month, driven by increases in shelter, food and energy costs.",
    "bodyOriginal": "US inflation higher than expected in October - here's what is happening with prices\n- Published\nUS inflation rose at a faster-than-expected pace in October, according to official figures.\nPrices rose by 0.4% in the month, which was lower than the 0.6% increase in September.\nHowever, analysts had expected prices to rise by 0.3%, and the higher-than-expected pace could add to arguments for the Federal Reserve to raise interest rates at its next meeting in December.\nThe new figures come a week after the midterm elections which were fought over cost-of-living pressures across the US.\nWhat is inflation?\nInflation is the rate at which the price of products or services increases over time.\nFor example, if a bottle of milk costs $1 but rises to $1.10 a year later, then annual inflation for bottled milk is 10%.\nOfficials from the Bureau of Labor Statistics measure inflation through the consumer price index (CPI).\nIt tracks the price changes of hundreds of day-to-day items including fresh food, gasoline and medical services to work out the overall level of inflation in the US economy.\nThe bureau updates this so-called basket of goods over time as peoples' spending and lifestyle habits change.\nWhat causes inflation?\nThere are several factors that can cause inflation to rise.\nIf demand for a product outstrips its supply, that can lead to producers raising prices - the craze for Labubu dolls in recent years and the high resale prices are an example.\nHigher incomes can also lead to higher demand, for example, which in turn pushes up prices.\nSupply can also affect inflation. If supply of a product is reduced, but demand remains constant, that can cause prices to rise. A good example of this is crude oil, which is used to make gasoline and diesel.\nBefore the US-Israel war with Iran began, it was trading at just over $70 a barrel, but when the conflict constricted crude supplies, the price quickly rose and is currently over $100.\nWhat is the current rate of inflation?\nOver the month of October, prices rose by 0.4%, driven by increases in housing, food and energy costs.\nHowever, the pace of energy price rises, at 0.7% in October, was much lower than the 5.2% increase seen in September.\nWhile the Bureau of Labor Statistics would normally provide figures for the 12-month change in prices, it did not collect data in October 2025 so it could not provide that estimate.\nFor the 12 months to September, inflation was 3.7%.\nHow have tariffs affected inflation?\nSince coming into office for the second time, President Donald Trump has introduced tariffs on most US trading partners around the world.\nWhile most of the additional global levies were outlawed by the Supreme Court in February, the president immediately announced a new 10% global tariff to replace them.\nTrump argued the tariffs would increase America's tax earnings, boost manufacturing and encourage people to buy US-made goods, but the higher import taxes have also had an impact on inflation, according to research from the Federal Reserve Bank of New York.\nHigher tariffs - which are levies that businesses pay on the goods they import - directly raise prices for US companies unless the overseas firms they are buying from lower prices to absorb some of the cost.\nIn response to the new tariffs, the New York Fed found exporters reduced prices very little, meaning US-based businesses ended up absorbing nearly 90% of the cost of the added tax.\nIndirectly, higher tariffs also affected the prices of locally made goods, as many US producers rely on parts or materials from overseas.\nOverall, the Fed found that every percentage point increase in average tariffs led to nearly a 0.25% price increase for consumer goods after one year.\nHas inflation been worse lately?\nWhile inflation is currently above where the US Federal Reserve would like - it has a target of 2% - it has been much higher in previous years.\nDuring the Covid pandemic, issues such as supply chain disruption started pushing inflation up.\nAdditionally, in early 2022 when Russia launched its full-scale invasion of Ukraine, oil prices surged over $100 a barrel.\nBoth of these factors helped to drive inflation to a peak of about 9%.\nCan inflation ever go down?\nIt's important to note that if inflation is rising at a slower rate, that does not mean prices are going down - it simply means prices are rising at a slower pace.\nA bit of inflation is considered good for an economy as the Federal Reserve's target rate illustrates.\nMany central banks consider inflation of about 2% or a little higher to be stable, and at a level that doesn't impact people's purchasing decisions.\nMuch below that, people can delay spending if they expect price rises to slow further, or to fall. That can lead to businesses reducing wages, or reducing the number of workers to cope with lower demand.\nRelated topics\n- Published14 October\n- Published12 October",
    "bodyJa": "US inflation higher than expected in October - here's what is happening with prices\n- Published\nUS inflation rose at a faster-than-expected pace in October, according to official figures.\nPrices rose by 0.4% in the month, which was lower than the 0.6% increase in September.\nHowever, analysts had expected prices to rise by 0.3%, and the higher-than-expected pace could add to arguments for the Federal Reserve to raise interest rates at its next meeting in December.\nThe new figures come a week after the midterm elections which were fought over cost-of-living pressures across the US.\nWhat is inflation?\nInflation is the rate at which the price of products or services increases over time.\nFor example, if a bottle of milk costs $1 but rises to $1.10 a year later, then annual inflation for bottled milk is 10%.\nOfficials from the Bureau of Labor Statistics measure inflation through the consumer price index (CPI).\nIt tracks the price changes of hundreds of day-to-day items including fresh food, gasoline and medical services to work out the overall level of inflation in the US economy.\nThe bureau updates this so-called basket of goods over time as peoples' spending and lifestyle habits change.\nWhat causes inflation?\nThere are several factors that can cause inflation to rise.\nIf demand for a product outstrips its supply, that can lead to producers raising prices - the craze for Labubu dolls in recent years and the high resale prices are an example.\nHigher incomes can also lead to higher demand, for example, which in turn pushes up prices.\nSupply can also affect inflation. If supply of a product is reduced, but demand remains constant, that can cause prices to rise. A good example of this is crude oil, which is used to make gasoline and diesel.\nBefore the US-Israel war with Iran began, it was trading at just over $70 a barrel, but when the conflict constricted crude supplies, the price quickly rose and is currently over $100.\nWhat is the current rate of inflation?\nOver the month of October, prices rose by 0.4%, driven by increases in housing, food and energy costs.\nHowever, the pace of energy price rises, at 0.7% in October, was much lower than the 5.2% increase seen in September.\nWhile the Bureau of Labor Statistics would normally provide figures for the 12-month change in prices, it did not collect data in October 2025 so it could not provide that estimate.\nFor the 12 months to September, inflation was 3.7%.\nHow have tariffs affected inflation?\nSince coming into office for the second time, President Donald Trump has introduced tariffs on most US trading partners around the world.\nWhile most of the additional global levies were outlawed by the Supreme Court in February, the president immediately announced a new 10% global tariff to replace them.\nTrump argued the tariffs would increase America's tax earnings, boost manufacturing and encourage people to buy US-made goods, but the higher import taxes have also had an impact on inflation, according to research from the Federal Reserve Bank of New York.\nHigher tariffs - which are levies that businesses pay on the goods they import - directly raise prices for US companies unless the overseas firms they are buying from lower prices to absorb some of the cost.\nIn response to the new tariffs, the New York Fed found exporters reduced prices very little, meaning US-based businesses ended up absorbing nearly 90% of the cost of the added tax.\nIndirectly, higher tariffs also affected the prices of locally made goods, as many US producers rely on parts or materials from overseas.\nOverall, the Fed found that every percentage point increase in average tariffs led to nearly a 0.25% price increase for consumer goods after one year.\nHas inflation been worse lately?\nWhile inflation is currently above where the US Federal Reserve would like - it has a target of 2% - it has been much higher in previous years.\nDuring the Covid pandemic, issues such as supply chain disruption started pushing inflation up.\nAdditionally, in early 2022 when Russia launched its full-scale invasion of Ukraine, oil prices surged over $100 a barrel.\nBoth of these factors helped to drive inflation to a peak of about 9%.\nCan inflation ever go down?\nIt's important to note that if inflation is rising at a slower rate, that does not mean prices are going down - it simply means prices are rising at a slower pace.\nA bit of inflation is considered good for an economy as the Federal Reserve's target rate illustrates.\nMany central banks consider inflation of about 2% or a little higher to be stable, and at a level that doesn't impact people's purchasing decisions.\nMuch below that, people can delay spending if they expect price rises to slow further, or to fall. That can lead to businesses reducing wages, or reducing the number of workers to cope with lower demand.\nRelated topics\n- Published14 October\n- Published12 October",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";

  main.innerHTML = `

    </div>`;
  renderCategories();
  renderArticles();

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `

        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>

  }
  container.innerHTML = html;

    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>

        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>

      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>

    <section>

      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>

        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
