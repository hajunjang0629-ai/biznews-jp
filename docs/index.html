    "id": "elon-musk-starts-spending-his-midterm-el-5adcd179",
    "title": "Elon Musk starts spending his midterm election millions, revealing his key Senate targets",
    "titleJa": "イーロン・マスク氏、中間選挙で数百万ドルを使い始め、上院の主要目標を明らかに",
    "summaryJa": "イーロン・マスク率いるスーパーPACは、共和党の最も重要な選挙激戦区の一部に最初の中間資金をつぎ込み、上院7選挙区と激戦の少数の下院選挙区に80万ドル以上を費やしていると、連邦選挙委員会が新たに明らかにした。アメリカPACによる支出は、テスラとスペースXの最高経営責任者（CEO）が政治活動をどこに向けているのかをこれまでで最も明確に示している。かつて民主党を支持していた富豪が今年11月、共和党の選出を支援する取り組みに同グループに最大1億2000万ドルの支出を許可したと伝えられている。",
    "bodyOriginal": "Elon Musk's super PAC is putting its first midterm money behind some of the GOP's most important election battlegrounds, spending more than $800,000 across seven Senate races and a handful of competitive House districts, according to a new Federal Election Commission disclosure.\nThe spending by America PAC offers the clearest look yet at where the Tesla and SpaceX CEO is directing his political operation, after the billionaire who previously supported Democrats reportedly authorized the group to spend as much as $120 million on an effort to help elect Republicans this November.\nNearly 90% of the $800,475 disclosed Wednesday night went toward Senate races, with the largest share — more than $247,000 — spent in Texas to support Republican Attorney General Ken Paxton and oppose Democrat James Talarico in an increasingly competitive contest.\nPaxton has struggled to keep pace with Talarico's spending. As of Aug. 20, Talarico's campaign had spent more than $25 million on advertising since the general election began in late May, compared with just $119,000 by Paxton's campaign, according to AdImpact data cited by the Texas Tribune.\nAmerica PAC had been increasingly targeting Talarico on social media before the newly disclosed expenditures.\nThe group also spent about $170,000 in Maine, where Republican Sen. Susan Collins is seeking reelection, and nearly $106,000 in Ohio to support Republican Sen. Jon Husted. The PAC disclosed another $91,459 in New Hampshire, $54,600 in Iowa, $25,605 in Michigan and $17,235 in Alaska.\nThe expenditures were made between Aug. 18 and Aug. 31, with the disclosure also listing two expenditures scheduled for Sept. 10. All were categorized as printing expenses, indicating the money was being used for mail advertising.\nAmerica PAC spent much less on House races, which are usually cheaper than statewide races, directing nearly $90,000 across eight contests. The spending benefited Republican Reps. Derrick Van Orden of Wisconsin, Mike Lawler of New York, Jen Kiggans of Virginia, Tom Kean Jr. of New Jersey, and Scott Perry, Rob Bresnahan and Ryan Mackenzie of Pennsylvania, as well as Republican Scott Singer, who is challenging Democratic Rep. Jared Moskowitz in Florida.\nThe spending was disclosed days after House Speaker Mike Johnson, R-La., reportedly met with Musk in Texas while campaigning for Republicans in competitive congressional races. Johnson later told House Republican leaders about the meeting but did not say whether Musk had made any commitments about midterm spending.\n\"He's made public a lot of what he's doing,\" Johnson said to CBS News when asked about Musk's plans. \"I'm not going to talk about our conversation on that point, but we're going to win the midterms.\"\nJohnson did not immediately respond to a request for comment from CNBC.\nMusk spent hundreds of millions of dollars supporting President Donald Trump and other Republican candidates in 2024, including more than $239 million given to America PAC. But he later appeared ready to retreat from that level of political involvement after joining the Trump administration to lead the Department of Government Efficiency, then having a public falling out with the president.\nAsked last year whether he intended to continue spending at the same pace, Musk said he planned to spend \"a lot less\" on politics.\n\"I think I've done enough,\" Musk said.\nBut Musk has since repaired his relationship with Trump and Republican leaders. The New York Times reported in July that Musk had authorized America PAC to spend up to $120 million on a field program aimed at electing Republicans this November.\nThe latest expenditures are still just a fraction of that potential commitment.\nThey also come before America PAC has disclosed the latest influx of money financing its midterm push. FEC data covering the 2025-26 election cycle through June 30 show America PAC had raised $50.3 million and spent $52.3 million, leaving it with about $274,000 in cash on hand.",
    "bodyJa": "イーロン・マスク率いるスーパーPACは、共和党の最も重要な選挙激戦区の一部に最初の中間資金をつぎ込み、上院7選挙区と激戦の少数の下院選挙区に80万ドル以上を費やしていると、連邦選挙委員会が新たに明らかにした。\nアメリカPACによる支出は、テスラとスペースXの最高経営責任者（CEO）が政治活動をどこに向けているのかをこれまでで最も明確に示している。かつて民主党を支持していた富豪が今年11月、共和党の選出を支援する取り組みに同グループに最大1億2000万ドルの支出を許可したと伝えられている。\n水曜日の夜に明らかにされた80万475ドルのほぼ90％は上院選挙に充てられ、最大の24万7000ドル以上がテキサス州で共和党のケン・パクストン司法長官を支援し、激化する選挙戦で民主党のジェームズ・タラリコ氏に対抗するために使われた。\nパクストンはタラリコの支出に追いつくのに苦労している。テキサス・トリビューンが引用したアドインパクトのデータによると、総選挙が始まった5月下旬以来、タラリコ陣営は8月20日の時点で2500万ドル以上を広告費に費やしているのに対し、パクストン陣営はわずか11万9000ドルだった。\nアメリカPACは、新たに明らかになった支出の前から、ソーシャルメディア上でタラリコを標的にする動きが増えていた。\n同グループはまた、共和党のスーザン・コリンズ上院議員が再選を目指しているメイン州で約17万ドル、オハイオ州で共和党のジョン・ハステッド上院議員を支援するために約10万6,000ドルを支出した。 PACは、ニューハンプシャー州でさらに9万1,459ドル、アイオワ州で5万4,605ドル、ミシガン州で2万5,605ドル、アラスカ州で1万7,235ドルを明らかにした。\n支出は8月18日から8月31日の間に行われ、開示には9月10日に予定されている2件の支出も記載されている。いずれも印刷費に分類されており、その資金が郵便広告に使われていたことが示されている。\nアメリカPACは、通常は州全体のレースよりも安価な下院レースへの支出を大幅に抑え、8つのコンテストで9万ドル近くを支出した。この支出は、ウィスコンシン州のデリック・ヴァン・オーデン議員、ニューヨーク州のマイク・ローラー議員、バージニア州のジェン・キガンズ議員、ニュージャージー州のトム・キーン・ジュニア議員、ペンシルベニア州のスコット・ペリー議員、ロブ・ブレスナハン議員、ライアン・マッケンジー議員に加え、フロリダ州で民主党のジャレッド・モスコウィッツ議員に対抗している共和党のスコット・シンガー議員にも恩恵をもたらした。\nこの支出は、マイク・ジョンソン下院議長（共和党、ルイジアナ州）が、議会選挙で共和党の選挙運動を行っていた際にテキサス州でマスク氏と会談したと報じられた数日後に明らかになった。ジョンソン氏はその後、下院共和党指導部らに会談について伝えたが、マスク氏が中期支出について何らかの約束をしたかどうかについては言及しなかった。\nマスク氏の計画について尋ねられたジョンソン氏はCBSニュースに対し、「彼は自分のやっていることの多くを公表している」と語った。 「その点に関する私たちの会話について話すつもりはありませんが、私たちは中間選挙で勝つつもりです。」\nジョンソン氏はCNBCからのコメント要請にすぐには応じなかった。\nマスク氏は2024年にドナルド・トランプ大統領と他の共和党候補者を支援するために数億ドルを費やし、その中にはアメリカPACに寄付された2億3,900万ドル以上が含まれている。しかしその後、トランプ政権に加わって政府効率省を率い、その後大統領と国民の間で不和が生じた後、同氏はそのレベルの政治的関与から撤退する用意ができているように見えた。\nマスク氏は昨年、同じペースで支出を続けるつもりかとの質問に対し、政治への支出を「大幅に減らす」つもりだと答えた。\n「十分なことをやったと思う」とマスク氏は語った。\nしかしマスク氏はその後、トランプ氏や共和党指導部との関係を修復した。ニューヨーク・タイムズは7月、マスク氏がアメリカPACに今年11月の共和党議員選出を目的とした野外プログラムに最大1億2000万ドルを支出する権限を与えたと報じた。\n最近の支出は、その潜在的な約束のほんの一部にすぎません。\nこれらはまた、アメリカPACが中期的な推進に資金を提供する最新の資金流入を明らかにする前に行われた。 6月30日までの2025～26年の選挙サイクルを対象としたFECデータによると、アメリカPACは5,030万ドルを調達し、5,230万ドルを支出し、手元現金は約27万4,000ドルとなっている。",

    "title": "Leon Black sues House Oversight over Epstein probe subpoenas, won't appear Thursday",
    "titleJa": "レオン・ブラック氏、エプスタイン捜査の召喚状をめぐって下院監視を訴える、木曜には出廷しない",
    "summaryJa": "アポロ・グローバル・マネジメントの元最高経営責任者（CEO）レオン・ブラック氏は木曜日、下院監視・政府改革委員会に対し、悪名高い性犯罪者ジェフリー・エプスタインとの関係捜査の一環として、自身が締結していた複数の機密保持契約に対する召喚状の差し止めと、同氏からの更なる証言の差し止めを求めて訴訟を起こした。ブラック氏は召喚状に従って木曜午前に監視委員会に出頭する予定だったが、これを拒否した。",
    "bodyOriginal": "Former Apollo Global Management CEO Leon Black sued the House Oversight and Government Reform Committee on Thursday, seeking to block subpoenas for multiple nondisclosure agreements he was a party to and for further testimony from him as part of a probe of his and others' ties to notorious sex offender Jeffrey Epstein.\nBlack was due to appear before the Oversight committee on Thursday morning pursuant to a subpoena but refused to do so.\nThe committee instead held a closed-door session with an empty chair set aside for the missing billionaire.\nDemocrats on the panel called on it to formally hold Black in contempt \"immediately.\"\nOne of the Democrats, Rep. Robert Garcia of California, said that \"Black made women sign strict non-disclosure agreements ... to keep them quiet.\"\nCommittee Chairman Rep. James Comer, R-Ky., said if it were up to him, \"I would hold him in contempt right now.\" But Comer added that he wanted to discuss the issue with the panel's lawyers to avoid harming its chances of obtaining the NDAs.\n\"I'm very disappointed,\" Comer said. \"This is unacceptable.\"\n\"We need those non-disclosure agreements.\"\nBlack's attorneys say the NDAs sought by the committee have nothing to do with his dealings with Epstein, and that Black had no knowledge of crimes that led to the financial advisor's arrest on federal child sex trafficking charges in 2019.\nThe panel issued the subpoenas on June 26, right after Black refused to answer questions about the NDAs and walked out of an interview when he appeared for a closed-door session.\n\"The Committee is on a fishing expedition that oversteps its authority,\" one of the lawyers, Susan Estrich, said in a statement. \"This is no longer about finding the truth about Epstein. It is about trying to destroy Mr. Black.\"\nEstrich noted that Black had previously voluntarily appeared before the committee and said he also gave the panel \"the only confidentiality agreement that Jeffrey Epstein knew about as part of Mr. Black's cooperation with the Committee's efforts to ferret out the truth about Epstein.\"\n\"Mr. Black never abused a woman,\" Estrich said. \"He never was with an underage woman. He never engaged in sex trafficking. He never paid Epstein for access to women. He was never blackmailed by Epstein.\"\nBlack's lawsuit in U.S. District Court in Washington claims the two subpoenas issued to Black are \"invalid to the extent they exceed\" the committee's \"delegated authority in seeking private information that bears no legitimate connection to OGR's legislative purpose.\"\n\"Additionally, the subpoenas would also expose women who value their privacy, who have no known or public connection to Epstein, who bargained for confidentiality and have refused to release it, and who have no ability to protect themselves and their privacy before the Committee,\" the suit says.\nBlack stepped down as Apollo CEO in March 2021, months earlier than originally planned, two months after the firm revealed he had paid Epstein $158 million for tax and estate planning advice from 2012 through 2017 despite knowing that the financial advisor had pleaded guilty in 2008 to soliciting prostitution from an underage girl in Florida.\nBlack testified to the House committee in June that, \"The tax work was responsible for billions of dollars in savings.\"\nBlack also said then that Epstein duped him out of more than $60 million in financial advisory fees by falsely claiming that they were tax-deductible.\nEpstein, 66, killed himself in a federal jail in New York in August 2019, weeks after his arrest on federal charges.\nComer, in a statement Thursday, said, \"It's a shame Leon Black is hiding behind litigation rather than provide answers to the American people.\"\n\"Our investigation is examining how the federal government for decades failed survivors of Jeffery Epstein and Ghislaine Maxwell's crimes and how Mr. Epstein sought to curry favor with influential individuals to avoid scrutiny,\" Comer said.\n\"Mr. Black's testimony is crucial to our investigation as he was one of Mr. Epstein's fee paying clients and has several nondisclosure agreements.\"\nGarcia, the ranking Democrat on the panel, said in a statement, \"By refusing to testify today, Leon Black is now defying two Congressional subpoenas.\"\nGarcia said Black had paid millions of dollars to women he had sexual relationships with, \"some of whom were also connected to Epstein.\"\n\"He also paid $62.5 million to the U.S. Virgin Islands to avoid Epstein-related claims against him. Black's name is mentioned hundreds of times in the Epstein files.\"\n\"He funded Epstein's abuse and trafficking of women. Multiple women have also accused Black of sexual assault,\" Garcia said. \"His connections to Epstein and his unwillingness to cooperate are unacceptable. We must hold him in contempt immediately.\"",
    "bodyJa": "アポロ・グローバル・マネジメントの元最高経営責任者（CEO）レオン・ブラック氏は木曜日、下院監視・政府改革委員会に対し、悪名高い性犯罪者ジェフリー・エプスタインとの関係捜査の一環として、自身が締結していた複数の機密保持契約に対する召喚状の差し止めと、同氏からの更なる証言の差し止めを求めて訴訟を起こした。\nブラック氏は召喚状に従って木曜午前に監視委員会に出頭する予定だったが、これを拒否した。\n委員会は代わりに、行方不明の億万長者のために空の椅子を用意して非公開で会議を開催した。\n委員会の民主党議員らは、黒人を「直ちに」正式に侮辱罪に定めるよう委員会に求めた。\n民主党員の一人、カリフォルニア州選出のロバート・ガルシア下院議員は、「黒人は女性たちに口を閉ざすため、厳格な機密保持契約に署名させた」と述べた。\n委員長のジェームズ・カマー下院議員（共和党、ケンタッキー州）は、もし自分次第なら「今すぐ彼を軽蔑するだろう」と述べた。しかしカマー氏は、NDAを取得するチャンスを損なうことを避けるために、この問題についてパネルの弁護士と話し合っていきたいと付け加えた。\nカマーさんは「とても残念だ」と語った。 「これは容認できません。」\n「私たちには機密保持契約が必要です。」\nブラック氏の弁護士は、同委員会が求めた秘密保持契約はエプスタイン氏との取引とは何の関係もなく、ブラック氏は2019年に連邦児童性的人身売買容疑で財務顧問が逮捕された原因となった犯罪について知識がなかったと主張している。\n委員会は6月26日に召喚状を発行したが、それはブラック氏が秘密保持契約に関する質問に答えることを拒否し、非公開セッションに出廷した際にインタビューから立ち去った直後だった。\n弁護士の一人、スーザン・エストリッチ氏は声明で「委員会は権限を超えた漁業遠征を行っている」と述べた。 「これはもはやエプスタインに関する真実を見つけることではありません。それはブラック氏を潰そうとすることです。」\nエストリッチ氏は、ブラック氏が以前に自発的に委員会に出頭したことを指摘し、「エプスタイン氏に関する真実を探る委員会の取り組みに対するブラック氏の協力の一環として、ジェフリー・エプスタイン氏が知っていた唯一の秘密保持契約」も委員会に渡したと述べた。\n「ブラック氏は女性を虐待したことは一度もなかった」とエストリッチ氏は語った。 「彼は未成年の女性と付き合ったことは一度もなかった。性的人身売買に関わったこともなかった。女性との接触のためにエプスタインにお金を払ったこともなかった。エプスタインから脅迫されたこともなかった。」\nワシントン連邦地方裁判所でのブラック氏の訴訟では、ブラック氏に発行された2件の召喚状は、委員会の「OGRの立法目的と正当な関連性のない個人情報を求める委任された権限」を「超える限り無効」であると主張している。\n「さらに、召喚状はプライバシーを重視する女性、エプスタインとの公知の関係も公的関係も持た​​ない女性、機密保持を求めて秘密の公開を拒否した女性、そして委員会の前で自分自身とプライバシーを守る能力のない女性も摘発することになる」と訴状は述べている。\nブラック氏は当初の計画より数カ月早く、2021年3月にアポロのCEOを辞任した。その2カ月後、エプスタイン氏は2008年にフロリダ州で未成年の少女に売春を斡旋した罪で有罪を認めていたことを知っていたにもかかわらず、2012年から2017年にかけて税金と財産計画のアドバイスとしてエプスタイン氏に1億5,800万ドルを支払ったと同社が明らかにした。\nブラック氏は６月、下院委員会で「税務業務のおかげで数十億ドルの節約ができた」と証言した。\nブラックはまた、エプスタインが6000万ドル以上の金融顧問料を税金控除の対象であると偽って騙し取ったと当時も述べた。\n66歳のエプスタイン被告は、連邦容疑で逮捕されてから数週間後の2019年8月、ニューヨークの連邦刑務所で自殺した。\nカマー氏は木曜の声明で、「レオン・ブラック氏が米国民に答えを示さず、訴訟の陰に隠れているのは残念だ」と述べた。\n「我々の捜査は、連邦政府がジェフリー・エプスタイン氏とギスレーヌ・マクスウェル氏の犯罪の生存者たちを何十年にもわたってどのように失敗させてきたのか、そしてエプスタイン氏が監視を避けるためにどのように影響力のある人物の好意を集めようとしたのかを調査している」とカマー氏は述べた。\n「ブラック氏の証言は我々の捜査にとって極めて重要である。なぜなら彼はエプスタイン氏の報酬を支払っている顧客の一人であり、いくつかの機密保持契約を結んでいるからである。」\n委員会の民主党有力議員ガルシア氏は声明で、「レオン・ブラック氏はきょう証言を拒否することで、議会からの２件の召喚状に反抗していることになる」と述べた。\nガルシア氏は、ブラック氏が性的関係を持った女性たちに数百万ドルを支払ったと述べ、「その中にはエプスタイン氏と関係のある女性もいた」と述べた。\n「彼はまた、エプスタイン関連の自分に対する請求を避けるために、米領バージン諸島に6,250万ドルを支払った。ブラックの名前はエプスタインのファイルの中で何百回も言及されている。」\nガルシア氏は「エプスタイン氏の虐待と女性の人身売買に資金を提供していた。複数の女性もブラック氏を性的暴行で告発している」と述べた。 「彼のエプスタインとの関係や協力への消極性は容認できない。我々は直ちに彼を軽蔑しなければならない。」",

    "id": "hugging-face-approached-nvidia-s-huang-w-b83b7bfb",
    "title": "Hugging Face approached Nvidia’s Huang weeks ahead of $12.9B acquisition, CEO tells CNBC",
    "titleJa": "ハグ・フェイスは129億ドルの買収に先立ってNvidiaのフアン氏にアプローチしたとCEOがCNBCに語る",
    "summaryJa": "Nvidia は、チップメーカーがハードウェアを超えて AI スタックのさらに上位に進む中、オープンソースの人工知能プラットフォーム Hugging Face を 129 億ドルで買収することに正式に同意しました。The Informationが先週報じて以来予想されていたこの提携により、Hugging Faceは「AIエコシステム全体のオープンプラットフォームであり続ける」とNVIDIAのCEO、ジェンセン・ファン氏は木曜日のブログ投稿で述べた。",
    "bodyOriginal": "Nvidia has officially agreed to buy open-source artificial intelligence platform Hugging Face for $12.9 billion, as the chipmaker moves beyond hardware and further up the AI stack.\nWith the deal, which has been expected since The Information reported on it last week, Hugging Face will \"remain an open platform for the entire AI ecosystem,\" Nvidia CEO Jensen Huang wrote in a blog post on Thursday.\n\"Together, we will scale Hugging Face's platform, strengthen its infrastructure and expand access to AI for developers and institutions worldwide,\" Huang wrote.\nHugging Face CEO Clément Delangue told CNBC on Thursday that the company approached Huang over the summer about a deal, \"and a few weeks later, here we are.\"\n\"During the summer, I think we realized that Hugging Face and open source AI in general was at the turning point, and that it needed more, more resources, more scale, more visibility,\" he told CNBC's Becky Quick on \"Squawk Box.\"\nDelangue said he approached first because Nvidia was \"a perfect home\" for his company, adding that discussions went quite fast to get a deal done.\nThe acquisition marks Nvidia's second biggest on record, following the $20 billion purchase of assets from chipmaker Groq in December. Prior to that, its largest deal was the purchase of Israeli chipmaker Mellanox for almost $7 billion in 2019.\nNvidia has become the world's most valuable company due to the insatiable demand for its graphics processing units, which have powered the generative AI boom. Hugging Face marks a big bet on a popular AI platform, as Nvidia continues to show that it's more than just a chip company.\nHugging Face was recently at the center of a hacking incident that raised concerns about the rapid evolution of powerful AI and cybersecurity tools.\nDelangue, a proponent of open-source models, blamed engineering mistakes for the recent attack on Hugging Face and said his company used an Nvidia version of a Chinese open model to resolve it.\nClement told CNBC on Thursday that the breach proved the importance of open models and the need for his company to \"double down\" on the proliferation of open source AI.\nHuang said that the open source environment can give defenders an \"asymmetric advantage\" over attackers.\n\"When I say asymmetric capability, there are way more people who are protecting than there are people who are attacking,\" he explained. \"And so, the benefit of having the community come together with open models, so that they can collaborate all transparently with each other, gives the defenders an asymmetric advantage.\"\nWATCH: Huang says 'We're at the beginning of an industrial revolution'",
    "bodyJa": "Nvidia は、チップメーカーがハードウェアを超えて AI スタックのさらに上位に進む中、オープンソースの人工知能プラットフォーム Hugging Face を 129 億ドルで買収することに正式に同意しました。\nThe Informationが先週報じて以来予想されていたこの提携により、Hugging Faceは「AIエコシステム全体のオープンプラットフォームであり続ける」とNVIDIAのCEO、ジェンセン・ファン氏は木曜日のブログ投稿で述べた。\n「我々は共にHugging Faceのプラットフォームを拡大し、そのインフラストラクチャを強化し、世界中の開発者や機関のAIへのアクセスを拡大していきます」とHuang氏は書いている。\nハギング・フェイスの最高経営責任者（CEO）クレマン・ドゥラング氏は木曜日、CNBCに対し、同社は夏の間にフアン氏に取引について打診し、「そして数週間後、ここに至った」と語った。\n同氏はCNBCのベッキー・クイック番組「Squawk Box」で、「夏の間、私たちはHugging FaceとオープンソースAI全般が転換点にあり、より多くのリソース、より多くの規模、より多くの可視性が必要であることに気づいたと思う」と語った。\nデラング氏は、NVIDIA が彼の会社にとって「完璧な本拠地」だったため、最初にアプローチしたと述べ、取引成立までの交渉は非常に迅速に進んだと付け加えた。\nこの買収は、12月にチップメーカーGroqから200億ドルで資産を買収したことに続く、NVIDIAにとって史上2番目に大きい買収となる。それ以前の最大の取引は、2019年にイスラエルのチップメーカーMellanoxを約70億ドルで買収したことだった。\nNvidia は、生成 AI ブームの原動力となったグラフィックス プロセッシング ユニットに対する飽くなき需要により、世界で最も価値のある企業になりました。 Nvidia が単なるチップ会社ではないことを示し続ける中、Hugging Face は人気の AI プラットフォームへの大きな賭けを意味します。\nハグ・フェイスは最近、強力なAIおよびサイバーセキュリティ・ツールの急速な進化に対する懸念を引き起こしたハッキン​​グ事件の中心人物となった。\nオープンソース モデルの支持者であるデラング氏は、Hugging Face に対する最近の攻撃についてエンジニアリング上のミスを非難し、彼の会社はそれを解決するために中国のオープン モデルの Nvidia バージョンを使用したと述べた。\nクレメント氏は木曜日、CNBCに対し、今回の侵害はオープンモデルの重要性と、同社がオープンソースAIの普及に「倍増」する必要性を証明したと語った。\nHuang氏は、オープンソース環境により、防御側が攻撃側に対して「非対称的な優位性」を得ることができると述べた。\n「非対称的な能力と言うとき、攻撃している人よりも守っている人の方がはるかに多いのです」と彼は説明した。 「そのため、コミュニティがオープン モデルで連携することで、相互に透過的に連携できるため、防御側に非対称的な利点がもたらされます。」\n注目：フアン氏は「私たちは産業革命の始まりにいる」と語る",

    "id": "households-warned-gas-price-spike-could-35cb7ae3",
    "title": "Households warned gas price spike could pile fresh pressure on energy bills",
    "titleJa": "家庭は、ガス価格の高騰により光熱費に新たな圧力がかかる可能性があると警告した",
    "summaryJa": "家庭は、ガス価格の高騰により光熱費に新たな圧力がかかる可能性があると警告した- 公開されました",
    "bodyOriginal": "Households warned gas price spike could pile fresh pressure on energy bills\n- Published\nHouseholds across the UK are being warned to brace for higher energy bills this winter as European countries scramble to replenish their natural gas stores before the weather dips.\nWholesale natural gas prices are already at three-year highs, which could lead to increased energy bills for businesses and consumers.\nEurope, which delayed its summer stockpiling due to high wholesale costs sparked by the Iran war, had been gambling the conflict would end before winter and prices would in turn fall.\nStorage levels are significantly lower than usual for this time of year, with countries facing the prospect of rushing to buy gas now or paying potentially higher prices when the winter comes.\nThe European benchmark natural gas price topped €75/MWh on Wednesday, its highest level since late 2022, the tail end of a spike caused by Russia's invasion of Ukraine. Natural gas prices in the UK this week topped 185p per therm, also the highest since late 2022.\nThe price has jumped in the past week amid a return to hostilities between the US and Iran, with analysts fearing the renewed fighting will keep the key Strait of Hormuz closed even longer. Typically, around a fifth of the world's oil and liquefied natural gas (LNG) is transported through the waterway.\nHamad Hussain, senior climate and commodities economist at Capital Economics, said he did not expect the waterway to begin reopening until early 2027.\nEven then, there will be a lag before energy is flowing freely through the strait and pressure on energy prices are eased.\n\"The risks to gas prices are definitely tilted towards the upside,\" Hussain told the BBC, warning that the gas price would top €80 by the end of this year.\nHussain recalled interviews with gas storage operators at the outbreak of the US-Israeli war in Iran saying they would wait three to four months for the crisis to ease before stocking up.\n\"We are about six months into the strait being effectively closed and that obviously has not happened,\" he added.\nHigher wholesale gas prices feed through to household energy bills by helping determine regulator Ofgem's price cap.\nThe energy price cap rose in July, and will increase by 4% in October, leaving a typical household paying £1,723. But analysts at the energy consultancy Cornwall Insight have forecast domestic energy prices could rise a further 9% in the new year, bringing renewed concern to households during the coldest months.\nDr Craig Lowrey, principal consultant at Cornwall Insight, told the BBC on Thursday a fresh increase in wholesale prices would \"increase pressure on our January price cap forecast\".\nHowever, he cautioned that there was \"plenty of time to go\" and a fall in wholesale prices could ease the pressure.\nThe Department for Energy Security and Net Zero (DESNZ) said gas prices are determined on international markets, dismissing criticism of the UK's own low levels of storage.\nThe boss of British Gas owner Centrica, Chris O'Shea, has repeatedly called for support from the government to expand its Rough storage facility in the North Sea, warning it has been unviable to fill it up and that it will close next year without a deal.\n\"We have almost no gas in storage in the UK for the coming winter and this is a huge concern as energy security is national security,\" he said on LinkedIn, external last week.\nA DESNZ spokesman said: \"We remain open to discussing proposals on all gas storage sites, as long as it provides value for money for taxpayers.\"\nThe department also pointed to Prime Minister Andy Burnham's pledge to cut VAT from energy bills from October, as well as government action to reduce Britain's reliance on natural gas altogether.\nÁngel Talavera, chief European economist at Oxford Economics, said there is a \"glass half full, and a glass half empty\" picture unfolding.\nOn one hand, wholesale gas prices are significantly lower than during the crisis which followed Russia's full-scale invasion of Ukraine.\nOn the other, households and businesses will still face significantly higher energy bills than usual over the coming months.\n\"It's serious, but not catastrophic,\" he told the BBC, adding \"something would have to dramatically change to lower prices\".\nHe pointed to a reduction in demand for natural gas in general as a result of the shift towards renewables, but said the overall picture depends hugely on the winter weather.\n\"If you have a warmer winter than average, that will be great for demand,\" he said. But he warned a colder than average winter would have the opposite effect, driving up demand for energy and pushing up prices.\nIt is not known how the developing El Niño over the Pacific Ocean will impact Britain's winter. The so-called Big Freeze of winter 2009-10 was, at the time, the coldest in three decades - and this coincided with an El Niño.\nHowever, 2006-07 was also an El Niño winter and that was unseasonably warm.\nTalavera said gas prices could come down if the weather helps reduce demand and the Strait of Hormuz reopens sooner than expected.\nBut, at the moment, \"the weather machine remains our main hope\".\nIt comes as a recent spike in the UK government's borrowing costs eased. After a sharp uptick on Tuesday, which took the yield on a 10-year bond - or gilt - to the highest level since 2008, it fell back slightly on Thursday.\nYields are hovering around 5.15%, however, which would still represent a post-2008 peak were it not for Tuesday's jump.\nRelated topics\n- Published26 August\n- Published14 July",
    "bodyJa": "家庭は、ガス価格の高騰により光熱費に新たな圧力がかかる可能性があると警告した\n- 公開されました\nヨーロッパ諸国が天候が悪化する前に天然ガス貯蔵量を補充しようと躍起になっているため、英国全土の家庭はこの冬の光熱費の高騰に備えるよう警告されている。\n天然ガスの卸売価格はすでに3年ぶりの高値にあり、企業や消費者のエネルギー料金の増加につながる可能性がある。\n欧州諸国は、イラン戦争に端を発した卸売コストの高騰を理由に夏の備蓄を遅らせたが、冬までに紛争が終結し、価格が下落することに賭けていた。\nこの時期の貯蔵レベルは例年よりも大幅に低く、各国は今すぐにガソリンの購入を急ぐか、冬が来ると潜在的に高い価格を支払う可能性があるという見通しに直面している。\n欧州の基準となる天然ガス価格は水曜日、1MWhあたり75ユーロを突破し、ロシアのウクライナ侵攻による高騰の末期である2022年後半以来の高水準となった。英国の天然ガス価格は今週、１サーム当たり１８５ペンスを突破し、これも２０２２年後半以来の高値となった。\n米国とイランの間の敵対行為の再開を背景に、価格は過去1週間で急騰しており、アナリストらは戦闘の再開により重要なホルムズ海峡の閉鎖がさらに長引くのではないかと懸念している。通常、世界の石油と液化天然ガス (LNG) の約 5 分の 1 は水路を通って輸送されます。\nキャピタル・エコノミクスのシニア気候・商品エコノミスト、ハマド・フセイン氏は、水路の再開は２０２７年初頭までは開始されないとの見通しを示した。\nそれでも、エネルギーが海峡を自由に流れ、エネルギー価格への圧力が緩和されるまでには時間がかかるだろう。\nフセイン氏はBBCに対し、「ガソリン価格に対するリスクは間違いなく上値に傾いている」と語り、ガソリン価格は今年末までに80ユーロを超えるだろうと警告した。\nフセイン氏は、イランで米・イスラエル戦争が勃発した際のガス貯蔵業者らへのインタビューで、危機が緩和するまで3～4カ月待ってから備蓄すると述べたことを思い出した。\n「海峡が事実上閉鎖されてから約半年が経つが、明らかにそれは起こっていない」と同氏は付け加えた。\nガス卸売価格の高騰は、規制当局のOfgemの価格上限の決定に寄与することで、家庭の光熱費に反映される。\nエネルギー価格の上限は7月に上昇し、10月には4%上昇し、一般家庭の支払い額は1,723ポンドとなる。しかし、エネルギーコンサルタント会社コーンウォール・インサイトのアナリストらは、国内のエネルギー価格は新年にさらに９％上昇する可能性があり、最も寒い時期に家計に新たな懸念をもたらす可能性があると予想している。\nコーンウォール・インサイトの主席コンサルタント、クレイグ・ローリー博士は木曜日、BBCに対し、卸売価格の新たな上昇は「1月の価格上限予測への圧力が高まる」と語った。\nただ、「まだ時間は十分にある」とし、卸売物価の下落により圧力が緩和される可能性があると警告した。\nエネルギー安全保障・ネットゼロ省（DESNZ）は、ガス価格は国際市場で決定されると述べ、英国自身の貯蔵レベルの低さへの批判を一蹴した。\n英国ガス所有者セントリカのボス、クリス・オシェア氏は、北海のラフ貯蔵施設を拡張するための政府の支援を繰り返し求め、同施設を満杯にするのは不可能であり、合意なく来年閉鎖すると警告した。\n同氏は先週、外部リンクトインで「来冬に備えて英国の貯蔵ガスはほとんどない。エネルギー安全保障は国家安全保障であるため、これは大きな懸念だ」と語った。\nDESNZの広報担当者は、「納税者にとってコストに見合った価値がある限り、すべてのガス貯蔵施設に関する提案について議論する用意がある」と述べた。\n同省はまた、アンディ・バーナム首相が10月から光熱費から付加価値税を削減するとの公約や、英国の天然ガスへの依存を完全に削減する政府の措置を指摘した。\nオックスフォード・エコノミクスの首席欧州エコノミスト、アンヘル・タラベラ氏は、「グラスに半分が入っていて、半分が空」の状況が展開していると述べた。\n一方で、ガスの卸売価格は、ロシアによるウクライナへの全面侵攻に伴う危機時よりも大幅に下がっている。\n一方で、家庭や企業は今後数カ月間、通常よりも大幅に高い光熱費に直面することになるだろう。\n同氏はBBCに対し「深刻ではあるが、壊滅的なものではない」と述べ、「価格を下げるためには何かを劇的に変える必要があるだろう」と付け加えた。\n同氏は、再生可能エネルギーへの移行の結果として天然ガス需要が全般的に減少していると指摘したが、全体像は冬の天候に大きく左右されると述べた。\n同氏は「冬が例年より暖かければ、需要にとっては素晴らしいことになるだろう」と述べた。しかし同氏は、例年より寒い冬は逆効果となり、エネルギー需要が高まり、価格が上昇すると警告した。\n太平洋上で進行中のエルニーニョが英国の冬にどのような影響を与えるかは不明だ。 2009 年から 2010 年の冬のいわゆる大凍結は、当時、ここ 30 年間で最も寒かったが、これはエルニーニョと重なった。\nしかし、2006 年から 2007 年にかけてはエルニーニョの冬でもあり、季節外れの暖かさでした。\nタラベラ氏は、天候により需要が減り、ホルムズ海峡が予想よりも早く再開すれば、ガソリン価格は下落する可能性があると述べた。\nしかし、現時点では「気象観測機械が依然として我々の主な希望である」。\n最近の英国政府の借り入れコストの高騰が緩和されたことを受けてのことだ。火曜日に10年債利回りが急上昇し、2008年以来の高水準となったが、木曜日には若干下落した。\nしかし、利回りは５．１５％付近で推移しているが、火曜日の上昇がなければ依然として２００８年以降のピークを示していただろう。\n関連トピック\n- 8 月 26 日発行\n- 7 月 14 日発行",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
