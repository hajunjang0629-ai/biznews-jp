    "summaryJa": "The triple lock guarantees that the state pension is not overtaken by inflation or wage increases.",
    "bodyOriginal": "What is the triple lock and why are people talking about it?\n- Published\nThe prime minister has announced plans to scrap the existing triple lock arrangement for the state pension in order to help fund a new plan for social care.\nThe triple lock currently guarantees that the state pension goes up each year in line with either inflation, wage increases, or 2.5% – whichever is the highest.\nAndy Burnham said he would honour the pledge given in Labour's 2024 manifesto to keep the triple lock unchanged in the current Parliament.\nHowever, the PM said that from April 2030 the arrangement will change, with the state pension rising every year at least by inflation or 2.5%.\nThe link to rises in yearly average earnings, which is the factor currently setting the rise under the triple lock, will be gone on an annual basis and instead be reflected over time.\nWhat is the state pension and how much is it?\nThe state pension is a payment made every four weeks by the government, to people who have reached the qualifying age and have paid enough National Insurance (NI) contributions.\nSince 6 April 2026:\nthe new flat-rate state pension for those who reached state pension age after April 2016 is £241.30 a week, or £12,547.60 a year\nthe old basic state pension for those who reached state pension age before April 2016 is £184.90 a week, or £9,614.80 a year\nMany people on the old basic state pension may also receive the additional state pension, external.\nIn general, you need 35 years of qualifying contributions to get a full state pension.\nSome people may have gaps in their NI record if, for example, they have lived abroad or taken time off to care for children.\nIt is possible to make voluntary payments to boost your contribution history. Since April 2025, you have only been able to make payments for the previous six years.\nData suggested that the state pension will increase in April 2027, meaning:\nthe flat-rate state pension for those who reached state pension age after April 2016 will likely be £250.70 a week, or £13,036.40 a year, up £488 on now\nthe old basic state pension for those who reached state pension age before April 2016 will likely be £192.10 a week, or £9,989.20 a year, up £374.40 on now\nThe government will confirm the rise, possibly in October's Budget.\nHow does the state pension 'triple lock' work?\nUnder the triple lock system, the state pension increases each April in line with whichever of three measures is the highest:\ninflation in the September of the previous year, using a measure called the Consumer Prices Index (CPI)\nthe average increase in total wages, including bonuses, across the UK for May to July of the previous year\nor 2.5%\nThe rise in wages of 3.9% is likely to determine the April 2027 state pension increase.\nThe triple lock was introduced by the Conservative-Liberal Democrat coalition government in 2010.\nIt was designed to ensure the value of the state pension wasn't overtaken by the increase in the cost of living or the incomes of working people.\nThe Labour government has previously said it would keep the triple lock until the end of the current Parliament.\nBut since that commitment, there has been intense debate over the cost of the triple lock and whether it is justified.\nIn July 2025, the government's official forecaster said the cost of the triple lock guarantee was set to be three times higher by the end of the decade than was originally anticipated when it began.\nThe Office for Budget Responsibility (OBR) said the annual cost is set to reach £15.5bn by 2030.\nIt said the cost of the state pension has risen steadily over the past eight decades, and now equates to £138bn, or around half the total amount the government spent on benefits.\nIn July, the influential Institute for Fiscal Studies (IFS) think-tank suggested that the triple lock should be scrapped as part of a wider pensions overhaul.\nWhat has Andy Burnham said about the future of the triple lock?\nAt his speech to the Labour Party conference, Burnham announced a plan to end the existing triple lock from 2030, which would see the annual link to earnings growth removed.\n\"The state pension will continue to rise every year at least by prices or 2.5%,\" he said.\n\"And it will hold its value relative to earnings over time so that pensioners will always share in the rising prosperity of the nation.\n\"But this change will generate significant savings which we will use to build up our national care service.\"\nThe IFS called the proposed change a \"great improvement\", saying Burnham had \"neutered the worst element of the triple lock\".\n\"State pensions will still rise, but more sustainably,\" said Jonathan Cribb, deputy director at the IFS.\nHowever, he warned that \"we should not expect this reform to save enough that it could fund universal social care in the next parliament\".\nWill state pensioners pay income tax?\nThe expected increase in April 2027 would take the flat-rate state pension above the personal allowance of £12,570 and so liable to pay about £91 next year in income tax.\nThe Labour government – when Rachel Reeves was chancellor – pledged that pensioners who rely solely on the state pension would not be required to complete a tax return, nor be chased to pay.\nIn his speech to the Labour Party conference, Burnham reiterated that low-income pensioners would not have to pay income tax in this Parliament.\nThe majority of pensioners are already income taxpayers owing to the addition of other pension income, on top of the state pension.\nWhat is the state pension age and how is it changing?\nAlmost 13 million people currently receive the state pension.\nMen and women born between 6 October 1954 and 5 April1960 start receiving their pension at the age of 66.\nBut for people born after this date, the state pension age is increasing in two phases:\na gradual rise to 67 for those born on, or after, 5 April 1960\na gradual rise to 68 between 2044 and 2046 for those born on, or after, 5 April 1977\nThe rise from 66 to 67 began in April 2026.\nThe first affected are those born between 6 April and 5 May 1960, who will have to wait an extra month.\nThe increase is expected to save the Treasury about £10bn a year by 2030.\nBut charities have warned that it will disproportionately affect areas of the UK where life expectancy is lower, and those on lower incomes.\nA government review is considering whether to delay the second phase, which would currently take the state pension age to 68 between 2044 and 2046.\nFuture pensioners to be worse off, government warns\n- Published21 July 2025\nWhat is pension credit and how much is it worth?\nDepending on their overall income, those above retirement age may also be entitled to pension credit, external in addition to the basic state pension.\nPension credit increased by 4.8% in April 2026.\nIf your income is above the stated limits, you may still be eligible for pension credit if you have a disability or care for someone.\nAnyone who qualifies for pension credit may also be entitled to other financial support, including housing benefit, a reduction in council tax, help with heating costs and the warm home discount scheme.\nRelated topics\n- Published16 September 2025",
    "bodyJa": "What is the triple lock and why are people talking about it?\n- Published\nThe prime minister has announced plans to scrap the existing triple lock arrangement for the state pension in order to help fund a new plan for social care.\nThe triple lock currently guarantees that the state pension goes up each year in line with either inflation, wage increases, or 2.5% – whichever is the highest.\nAndy Burnham said he would honour the pledge given in Labour's 2024 manifesto to keep the triple lock unchanged in the current Parliament.\nHowever, the PM said that from April 2030 the arrangement will change, with the state pension rising every year at least by inflation or 2.5%.\nThe link to rises in yearly average earnings, which is the factor currently setting the rise under the triple lock, will be gone on an annual basis and instead be reflected over time.\nWhat is the state pension and how much is it?\nThe state pension is a payment made every four weeks by the government, to people who have reached the qualifying age and have paid enough National Insurance (NI) contributions.\nSince 6 April 2026:\nthe new flat-rate state pension for those who reached state pension age after April 2016 is £241.30 a week, or £12,547.60 a year\nthe old basic state pension for those who reached state pension age before April 2016 is £184.90 a week, or £9,614.80 a year\nMany people on the old basic state pension may also receive the additional state pension, external.\nIn general, you need 35 years of qualifying contributions to get a full state pension.\nSome people may have gaps in their NI record if, for example, they have lived abroad or taken time off to care for children.\nIt is possible to make voluntary payments to boost your contribution history. Since April 2025, you have only been able to make payments for the previous six years.\nData suggested that the state pension will increase in April 2027, meaning:\nthe flat-rate state pension for those who reached state pension age after April 2016 will likely be £250.70 a week, or £13,036.40 a year, up £488 on now\nthe old basic state pension for those who reached state pension age before April 2016 will likely be £192.10 a week, or £9,989.20 a year, up £374.40 on now\nThe government will confirm the rise, possibly in October's Budget.\nHow does the state pension 'triple lock' work?\nUnder the triple lock system, the state pension increases each April in line with whichever of three measures is the highest:\ninflation in the September of the previous year, using a measure called the Consumer Prices Index (CPI)\nthe average increase in total wages, including bonuses, across the UK for May to July of the previous year\nor 2.5%\nThe rise in wages of 3.9% is likely to determine the April 2027 state pension increase.\nThe triple lock was introduced by the Conservative-Liberal Democrat coalition government in 2010.\nIt was designed to ensure the value of the state pension wasn't overtaken by the increase in the cost of living or the incomes of working people.\nThe Labour government has previously said it would keep the triple lock until the end of the current Parliament.\nBut since that commitment, there has been intense debate over the cost of the triple lock and whether it is justified.\nIn July 2025, the government's official forecaster said the cost of the triple lock guarantee was set to be three times higher by the end of the decade than was originally anticipated when it began.\nThe Office for Budget Responsibility (OBR) said the annual cost is set to reach £15.5bn by 2030.\nIt said the cost of the state pension has risen steadily over the past eight decades, and now equates to £138bn, or around half the total amount the government spent on benefits.\nIn July, the influential Institute for Fiscal Studies (IFS) think-tank suggested that the triple lock should be scrapped as part of a wider pensions overhaul.\nWhat has Andy Burnham said about the future of the triple lock?\nAt his speech to the Labour Party conference, Burnham announced a plan to end the existing triple lock from 2030, which would see the annual link to earnings growth removed.\n\"The state pension will continue to rise every year at least by prices or 2.5%,\" he said.\n\"And it will hold its value relative to earnings over time so that pensioners will always share in the rising prosperity of the nation.\n\"But this change will generate significant savings which we will use to build up our national care service.\"\nThe IFS called the proposed change a \"great improvement\", saying Burnham had \"neutered the worst element of the triple lock\".\n\"State pensions will still rise, but more sustainably,\" said Jonathan Cribb, deputy director at the IFS.\nHowever, he warned that \"we should not expect this reform to save enough that it could fund universal social care in the next parliament\".\nWill state pensioners pay income tax?\nThe expected increase in April 2027 would take the flat-rate state pension above the personal allowance of £12,570 and so liable to pay about £91 next year in income tax.\nThe Labour government – when Rachel Reeves was chancellor – pledged that pensioners who rely solely on the state pension would not be required to complete a tax return, nor be chased to pay.\nIn his speech to the Labour Party conference, Burnham reiterated that low-income pensioners would not have to pay income tax in this Parliament.\nThe majority of pensioners are already income taxpayers owing to the addition of other pension income, on top of the state pension.\nWhat is the state pension age and how is it changing?\nAlmost 13 million people currently receive the state pension.\nMen and women born between 6 October 1954 and 5 April1960 start receiving their pension at the age of 66.\nBut for people born after this date, the state pension age is increasing in two phases:\na gradual rise to 67 for those born on, or after, 5 April 1960\na gradual rise to 68 between 2044 and 2046 for those born on, or after, 5 April 1977\nThe rise from 66 to 67 began in April 2026.\nThe first affected are those born between 6 April and 5 May 1960, who will have to wait an extra month.\nThe increase is expected to save the Treasury about £10bn a year by 2030.\nBut charities have warned that it will disproportionately affect areas of the UK where life expectancy is lower, and those on lower incomes.\nA government review is considering whether to delay the second phase, which would currently take the state pension age to 68 between 2044 and 2046.\nFuture pensioners to be worse off, government warns\n- Published21 July 2025\nWhat is pension credit and how much is it worth?\nDepending on their overall income, those above retirement age may also be entitled to pension credit, external in addition to the basic state pension.\nPension credit increased by 4.8% in April 2026.\nIf your income is above the stated limits, you may still be eligible for pension credit if you have a disability or care for someone.\nAnyone who qualifies for pension credit may also be entitled to other financial support, including housing benefit, a reduction in council tax, help with heating costs and the warm home discount scheme.\nRelated topics\n- Published16 September 2025",

ar by 2040.\nThe prime minister was repeatedly advised that bond markets would show some appreciation for a UK government capable of taking tough decisions. Former chancellor Rachel Reeves might have imagined the same reward for her decision to scrap the winter fuel allowance, which was one of her first acts and later reversed.\nPart of the UK premium in bond markets has been an understandable perception that UK politics cannot have long-term debates. And the triple lock is only one of the debates started by today's speech – with significant further moves on energy and post-Brexit policy expected – that the prime minister and chancellor need the markets as well as the country to get behind.\nGet in touch\nWhat are your views on the triple lock?\nRelated topics\n- Published6 hours ago\n- Published18 minutes ago\n- Published6 hours ago",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>

    <section>

  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");

    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});
