    "bodyOriginal": "Shares of Nvidia fell more than 9% in after-hours trading on Wednesday after The Wall Street Journal reported that the company's board is preparing to oust CEO Jensen Huang.\nThe news landed minutes after The New York Times reported that Huang had an extramarital relationship with another executive at the company. Nvidia's board is preparing to meet as soon as Wednesday to determine Huang's future at the company, according to the Journal.\nThe alleged relationship was with Kimberly Powell, vice president of health care at Nvidia, according to the Times' report. Powell's bio on the Nvidia website says she's \"responsible for the company's worldwide healthcare business, including hardware and software platforms for accelerated computing, AI, and visualization that power the ecosystem of medical imaging, life sciences, drug discovery, and healthcare analytics.\"\nHuang and Powell were reportedly captured on camera being affectionate with one another at a hotel in San Jose, California in March, according to the Times.\nNvidia and Powell did not immediately respond to CNBC's request for comment. Heller, the crisis PR firm Huang reportedly hired as early as last year, did not immediately respond to CNBC's request for comment.\nThe report comes days after Huang admitted to an affair with a woman who is believed by U.S. intelligence of being a Chinese spy. The CEO was romantically involved with Alice Huang, according to The Financial Times, who U.S. intelligence officials believe is a spy for China's Ministry of State Security, The New York Times reported.\nNvidia's board of directors has opened an independent investigation and hired the law firm Wachtell, Lipton, Rosen & Katz to look into the spying allegations.\n\"I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did,\" Huang wrote in the message to Nvidia staff on Sunday. \"I am deeply sorry.\"\nMost of Huang's Nvidia shares are co-owned with his wife, Lori Huang, and are held in trusts. About 800 million shares are held by those trusts. Huang holds about 70 million shares on his own and has limited economic control over the company.\nRumors of an affair between Huang and Powell have circulated for years, in part because Powell lacks a background in health or science, according to a former employee who asked not to be named because of the sensitivity of the matter.\nHealthcare is a smaller business at Nvidia. The company makes chips for medical devices and MRI machines, but they are a minor in comparison to the revenue generated from its advanced AI systems and graphics processing units, or GPUs. In recent appearances, including at the company's annual GTC conference, Powell has spoken about how Nvidia's AI technology can help accelerate drug discovery, assist providers and improve clinical efficiency. Powell has been leading the group since 2017.\nNvidia's stock was down 7% this week prior to the after-hours drop on Wednesday and is on pace for its sixth straight weekly slide, reflecting broad concern on the sustainability of the artificial intelligence buildout. The AI infrastructure trade was hit particularly hard last week after the midterm elections, as Democrats won sweeping majorities in both houses of Congress, and dozens of ballot measures past that could make building data centers more difficult.\nHuang has become synonymous with the AI industry, and he is often referred to by his first name ,\"Jensen,\" by customers and rivals. Nvidia has been one of the primary beneficiaries of the AI boom since its chips are used to train models and run large AI workloads.\n—CNBC's Lora Kolodny and Kif Leswing contributed to this report\nWATCH: Jensen Huang said to have had relationship with Nvidia executive who reports to him: New York Times",

ang, and are held in trusts. About 800 million shares are held by those trusts. Huang holds about 70 million shares on his own and has limited economic control over the company.\nRumors of an affair between Huang and Powell have circulated for years, in part because Powell lacks a background in health or science, according to a former employee who asked not to be named because of the sensitivity of the matter.\nHealthcare is a smaller business at Nvidia. The company makes chips for medical devices and MRI machines, but they are a minor in comparison to the revenue generated from its advanced AI systems and graphics processing units, or GPUs. In recent appearances, including at the company's annual GTC conference, Powell has spoken about how Nvidia's AI technology can help accelerate drug discovery, assist providers and improve clinical efficiency. Powell has been leading the group since 2017.\nNvidia's stock was down 7% this week prior to the after-hours drop on Wednesday and is on pace for its sixth straight weekly slide, reflecting broad concern on the sustainability of the artificial intelligence buildout. The AI infrastructure trade was hit particularly hard last week after the midterm elections, as Democrats won sweeping majorities in both houses of Congress, and dozens of ballot measures past that could make building data centers more difficult.\nHuang has become synonymous with the AI industry, and he is often referred to by his first name ,\"Jensen,\" by customers and rivals. Nvidia has been one of the primary beneficiaries of the AI boom since its chips are used to train models and run large AI workloads.\n—CNBC's Lora Kolodny and Kif Leswing contributed to this report\nWATCH: Jensen Huang said to have had relationship with Nvidia executive who reports to him: New York Times",

    "title": "From Paris to DC - why offices are being turned into apartments",
    "titleJa": "From Paris to DC - why offices are being turned into apartments",
    "summaryJa": "From Paris to DC - why offices are being turned into apartments- Published",
    "bodyOriginal": "From Paris to DC - why offices are being turned into apartments\n- Published\nWhen Roland Cubin walks you round what will eventually be a new Parisian apartment you have to use your imagination.\n\"Here you will be in the kitchen, and here is the bathroom,\" says the deputy CEO of French real estate company Groupama Immobilier.\nIt all sounds appealing, an upmarket flat in the west of Paris, but presently the space doesn't look like one at all. That's because it's currently a corner of one floor of a nine-storey office building called Le Diamant, where 1,800 people work.\nGroupama Immobilier intends to convert the entire building into apartments. It should be the first of many such office-to-apartments conversions in the surrounding area.\nWe are in La Défense, the purpose-built, business district of the French capital, where the city has congregated its modern skyscrapers.\nMirroring a similar trend in places such as New York, Washington DC and London; Paris La Défense, the public development authority that runs the area, has unveiled plans to turn up to a fifth of the office buildings into housing.\nCubin leads us into what is currently a conference room in the centre of the building. It has no windows, which is indicative of a big challenge when turning offices into apartments – what to do with the large amount of space in the middle of every floor that doesn't get any natural light.\n\"There won't be any rooms there. Just access,\" says Roland Cubin, in reference to lifts and stairs.\nOther issues include the need for more plumbing, and ceilings that can be too low.\nDespite these challenges, there is a simple reason why there are plans for so many conversions – demand for offices in La Défense and across Paris has plummeted since the Covid-19 pandemic and the growth of homeworking.\n\"La Défense has a vacancy rate of 14-15% which is higher than it used to be,\" says Pierre-Yves Guice, CEO of Paris La Défense.\nHe adds that another reason for the conversion programme is the need to transform the business district from a place where the only thing people do is work.\n\"To retain companies in France and in Western Europe we need to diversify these office landscapes of the last century, because no-one wants to work in such an environment any longer,\" says Guice.\nLudovic Delaisse, CEO of the French arm of the Canadian real estate business Colliers, says that demand for office space in Paris has fallen by almost a third over the past five to six years.\nHe adds that office high rises will continue to be needed, but that cities need to make sure that leisure time can be enjoyed around them, such as having restaurants, bars, cinemas and gyms on their doorstep.\n\"People like the idea of grouping together in a centre of expertise [for work] - in tech hubs, for example. The challenge for La Défense is to be a place where you want to be, that you want to see when you leave work in the evening.\"\nInspiration for La Défense can come from Washington DC and New York City, where tax cuts for property developers are fuelling the largest amount of office to apartment conversions in the US. Like in Paris, this is in response to falling demand for office space since the pandemic.\nA report last year, external found that 8,310 converted flats were in the pipeline in New York, and 6,533 in Washington.\nIn third place was Los Angeles on 4,322, followed by Chicago on 3,606.\n\"We set a goal of introducing 15,000 new residents downtown by 2028 and we are now on track to doing that,\" says Washington DC's deputy mayor for planning and development Nina Albert.\nShe says that while \"there may be one or two pretty significant building demolitions… the majority are office conversions\".\nAs in Paris, they've faced technical challenges. They've sometimes solved the natural light problem in the middle of office buildings by creating atriums – light sinks in other words – in the middle of them.\nAlbert adds that about \"hundreds of millions of dollars of private investment\" has flooded into the sector.\nIn addition to tax cuts, the DC Department of Buildings, part of the Council of the District of Columbia, has eased planning restrictions to make it easier for office conversion schemes to gain official approval in the US capital. It's a similar case in New York City.\nIn the UK, there are also tax cuts and eased planning rules, external for converting offices into apartments. This has led to a continuing boom in conversions. A report last year by property firm Knight Frank said that the number of such projects in London were 60% higher , externalthan pre-Covid levels.\nBack in Paris, Cubin hopes that French authorities follow these examples and reduce both taxes and rules regarding conversions.\n\"Just how the government deals with the tax question will decide whether France will be able to convert 2% of its vacant offices or 18 to 23%,\" he says.\n\"And at the moment, when you transform a building in a way that changes its function, it is classed not as an old building that's been changed but as a new building with all the regulatory demands that go with that regarding car parking spaces, wheelchair access, fire safety and so on.\"\n- Published15 October\n- Published8 October",

    "title": "Scott Colom wins Mississippi Senate election over incumbent Republican Hyde-Smith",
    "titleJa": "Scott Colom wins Mississippi Senate election over incumbent Republican Hyde-Smith",
    "summaryJa": "Scott Colom will be the first Democrat elected to the Senate from the state since 1982, and Mississippi's first Black senator since Reconstruction.",
    "bodyOriginal": "Democratic nominee Scott Colom won the Mississippi Senate election over Republican incumbent Sen. Cindy Hyde-Smith, the Associated Press reported Wednesday.\nColom, a local district attorney, will be the first Black senator from Mississippi since the post-Civil War Reconstruction Era.\nHis projected victory — which was not considered likely by national analysts before Election Day — is the latest in a series of stunning wins by Democrats this midterm cycle.\nTwo sources close to Colom's campaign said Hyde-Smith called him late Wednesday afternoon to concede.\n\"While this is not the outcome we worked for, or hoped for, I respect the decision of Mississippi voters,\" Hyde-Smith said in a video posted on X.\n\"I want to congratulate Scott Colom and wish him well as he takes on the tremendous responsibility of representing our great state,\" Hyde-Smith said.\nDemocrats now will have a majority of at least 55 seats in the Senate, having flipped at least eight seats from Republicans.\nAlaska is the only remaining Senate election to be called. In that state, Democratic nominee Mary Peltola, a former House member, has a narrow lead over Sen. Dan Sullivan, the Republican incumbent.\n\"Blue Mississippi is here,\" Senate Minority Leader Chuck Schumer, D-N.Y., said in a post on X.\n\"Scott Colom is the only person who could've gotten this done. I knew it from the moment I met him,\" Schumer wrote.\nIn addition to the Senate, Democrats have won more than enough seats to take control of the House of Representatives when the next Congress begins in January.\nThis is breaking news. Please refresh for updates.",
    "bodyJa": "Democratic nominee Scott Colom won the Mississippi Senate election over Republican incumbent Sen. Cindy Hyde-Smith, the Associated Press reported Wednesday.\nColom, a local district attorney, will be the first Black senator from Mississippi since the post-Civil War Reconstruction Era.\nHis projected victory — which was not considered likely by national analysts before Election Day — is the latest in a series of stunning wins by Democrats this midterm cycle.\nTwo sources close to Colom's campaign said Hyde-Smith called him late Wednesday afternoon to concede.\n\"While this is not the outcome we worked for, or hoped for, I respect the decision of Mississippi voters,\" Hyde-Smith said in a video posted on X.\n\"I want to congratulate Scott Colom and wish him well as he takes on the tremendous responsibility of representing our great state,\" Hyde-Smith said.\nDemocrats now will have a majority of at least 55 seats in the Senate, having flipped at least eight seats from Republicans.\nAlaska is the only remaining Senate election to be called. In that state, Democratic nominee Mary Peltola, a former House member, has a narrow lead over Sen. Dan Sullivan, the Republican incumbent.\n\"Blue Mississippi is here,\" Senate Minority Leader Chuck Schumer, D-N.Y., said in a post on X.\n\"Scott Colom is the only person who could've gotten this done. I knew it from the moment I met him,\" Schumer wrote.\nIn addition to the Senate, Democrats have won more than enough seats to take control of the House of Representatives when the next Congress begins in January.\nThis is breaking news. Please refresh for updates.",

    "id": "some-under-25s-should-get-less-benefits-256c3baf",
    "title": "Some under-25s should get less benefits, Milburn review to say",
    "titleJa": "Some under-25s should get less benefits, Milburn review to say",
    "summaryJa": "The proposed radical overhaul of the welfare system would move under-25s off the main sickness benefits.",
    "bodyOriginal": "Some under-25s should get less benefits, Milburn review to say\n- Published\nSome young people could see reductions to the benefits they are entitled to, under a radical overhaul of the system to be recommended by a government-commissioned review.\nAlan Milburn's year-long report, which will be published on Tuesday, will recommend moving under-25s off the main sickness and disability benefits, the Times reported, external.\nMilburn, a former Labour health secretary, has been tasked by the government with helping reduce the one in eight 18- to 24-year-olds in the UK who are not in education, employment or training - or \"Neet\".\nHe said on Wednesday night that his plans would not be \"pain-free\" and would affect both existing and new claimants.\nHis report is expected to recommend that under-25s are no longer able to claim the health element of universal credit or personal independence payment (Pip).\nInstead, they would receive an allowance on the same basic rate as universal credit.\nSome could be eligible for a new \"additional cost allowance\" to cover day-to-day costs related to their conditions.\nBut many claimants would receive less under the plans, which the government is set to take forward into legislation in the new year.\nMilburn, a Labour MP from 1992 to 2010, is also expected to recommend an investment of billions into more employment support for young people, including work placements, job subsidies and one-to-one personal advisers.\nThose with more severe disabilities and unable to work would get a new benefit paid at a higher rate.\nSpeaking to the Times about his report, Milburn said: \"Candidly, it could mean that some people will get less financial support at the beginning of their benefit claim than under the current system.\n\"But actually, for young people, there's a different debate that we've got to resolve, which is whether the priority is their longer-term life chances or just their immediate shorter-term finances.\n\"I think what the current system does [is] it prioritises the latter over the former. I believe that's the wrong choice and it needs to be the other way around.\"\nJust under one million young people in the UK are Neets, data from the Office for National Statistics (ONS) from April to June suggests. This was a rise of 3% on the same period last year.\nMilburn's recommendations are likely to be backed by Prime Minister Andy Burnham but could prove controversial among Labour MPs, who opposed welfare reform under his predecessor Sir Keir Starmer.\nThe reforms would represent a radical overhaul of Britain's welfare system, at a time when there is heavy political pressure for the UK to find the money to spend more on defence.\nIf Milburn's recommendations were approved, it could take almost a decade for the British state to see monetary savings.\nThe new system \"will need significant investment\" and would involve \"rebuilding the system from scratch,\" Milburn added.\nHe said that currently \"you've got hundreds of thousands of young people stuck in a benefit system that is trapping them in poverty, giving them no prospect of prosperity or a job\".\nHis new proposed system would involve an element of carrot and stick, where young people could lose some of their benefits if they did not engage with the extra work support options.\n\"A deal isn't a deal unless there are potential consequences,\" Milburn said. \"Entitlements and responsibilities are two sides of the same coin.\"\nA government spokesperson said: \"We will always ensure there is a safety net for the most vulnerable and those who are unable to work.\n\"But the prime minister has been clear that we need a wholesale change in the way we support young people to grow up in this country, where we invest in their success rather than paying for failure.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

nk what the current system does [is] it prioritises the latter over the former. I believe that's the wrong choice and it needs to be the other way around.\"\nJust under one million young people in the UK are Neets, data from the Office for National Statistics (ONS) from April to June suggests. This was a rise of 3% on the same period last year.\nMilburn's recommendations are likely to be backed by Prime Minister Andy Burnham but could prove controversial among Labour MPs, who opposed welfare reform under his predecessor Sir Keir Starmer.\nThe reforms would represent a radical overhaul of Britain's welfare system, at a time when there is heavy political pressure for the UK to find the money to spend more on defence.\nIf Milburn's recommendations were approved, it could take almost a decade for the British state to see monetary savings.\nThe new system \"will need significant investment\" and would involve \"rebuilding the system from scratch,\" Milburn added.\nHe said that currently \"you've got hundreds of thousands of young people stuck in a benefit system that is trapping them in poverty, giving them no prospect of prosperity or a job\".\nHis new proposed system would involve an element of carrot and stick, where young people could lose some of their benefits if they did not engage with the extra work support options.\n\"A deal isn't a deal unless there are potential consequences,\" Milburn said. \"Entitlements and responsibilities are two sides of the same coin.\"\nA government spokesperson said: \"We will always ensure there is a safety net for the most vulnerable and those who are unable to work.\n\"But the prime minister has been clear that we need a wholesale change in the way we support young people to grow up in this country, where we invest in their success rather than paying for failure.\"\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "id": "feds-arrest-top-official-of-healthcare-c-4b0c484f",
    "title": "Feds arrest top official of healthcare company, alleging illegal drug importation",
    "titleJa": "Feds arrest top official of healthcare company, alleging illegal drug importation",
    "summaryJa": "U.S. officials are accusing two top officials of a Canadian company of operating a scheme to illegally import prescription drugs, court records show.",
    "bodyOriginal": "U.S. authorities are accusing the two top officials of a Canadian company of operating a long-running scheme to illegally import prescription drugs into the U.S., according to court records filed Tuesday.\nJohn Thomas Howard, treasurer and a director of the company, CANARX, was arrested Sunday on smuggling and conspiracy charges, according to the records.\nBob Howard, his brother, who is president and a director of CANARX, is also wanted in the federal investigation, according to an affidavit from Dustin Dobbs, a special agent with the Food and Drug Administration's Office of Criminal Investigations. He has not yet been taken into custody.\nBesides conspiracy and smuggling, the arrest warrant said John Thomas Howard was charged with introducing misbranded drugs into interstate commerce and illegal drug importation. No plea has been filed.\nCANARX was featured in a CNBC investigation last year that revealed how the company and others known as alternative funding programs, or AFPs, are becoming more pervasive around the U.S. as drug costs skyrocket. The investigation found these companies have penetrated the country's healthcare system by offering high-cost specialty drugs at more affordable prices through private and public employers. In some cases, employers are requiring their staff to use an AFP.\nAFPs often obtain the medications overseas and ship them directly to patients, a practice that federal authorities have said is illegal and poses safety risks. CNBC traced the trail of drugs from abroad to the U.S. via a supply chain that the pharmaceutical companies producing the medications have not authorized.\nOn its website, CANARX, founded in 2002 and based in Windsor, Ontario, Canada, described its business as the first international prescription provider for the U.S. and the safest such program in the industry. The company said it sources its medications from Canada, the United Kingdom, Australia and New Zealand.\nBut the affidavit said that the FDA's investigation found \"there is probable cause to believe that (CANARX) illegally imported or caused the illegal importation of prescription drugs into the United States ….\"\nThe affidavit does not specify which medications the agency believes were illegally imported. The criminal complaint covers the period from Feb. 22, 2017, through April 15, 2026.\nThe company's general counsel, Joseph Morris, told CNBC in a statement: \"The Howards deny all the charges against them, will defend vigorously, and expect to be vindicated in court.\"\nThe company has been under FDA scrutiny for several years. In 2023, the agency seized medication being shipped by CANARX that it says was potentially misbranded and counterfeit, according to an email sent to a patient that was obtained by CNBC.\nAnd in 2019, the FDA sent a warning letter to the company, saying it was operating \"in a manner that substitutes the FDA-approved drugs prescribed by the U.S. healthcare provider with unapproved drugs.\" Morris, in response to that warning, argued CANARX was not misleading patients, but agreed for the company to stop importing drugs that need to be administered by a doctor.\nIn an interview as part of the CNBC investigation, Morris said last year that the medicines shipped to U.S. patients come from highly regulated countries. He said CANARX was operating legally.\nThe central question for AFPs is the legality of importing prescription drugs into the U.S. for personal use. The FDA allows Americans to import medications for individual use in some cases if the drug is not available domestically. That is the basis on which the AFPs built their models for shipping medicines directly to patients.\nBut an FDA spokesperson told CNBC last year that \"in most circumstances, a person cannot import prescription drugs from other countries into the U.S. ... as substitutes for FDA-approved drugs.\"\nIn a separate civil lawsuit that is pending, Gilead Sciences accused CANARX and other companies of illegally importing Biktarvy, its medication to treat HIV.\nIn a statement to CNBC on Wednesday, a Gilead spokesperson said the company \"has taken strong legal action to protect patients and the integrity of the U.S. medicines supply chain. We welcome the government's efforts to hold accountable those whose conduct may put patients at risk.\"\nCANARX has not responded to the Gilead lawsuit.\n— CNBC's Paige Tortorelli and Melissa Lee contributed to this report",

    "title": "Jensen Huang affair in D.C.: Resignation calls and moves to tighten Nvidia China exports",
    "titleJa": "Jensen Huang affair in D.C.: Resignation calls and moves to tighten Nvidia China exports",
    "summaryJa": "Huang was notably opposed to strict export controls on AI chips to China, which ruffled feathers with congressional China hawks.",
    "bodyOriginal": "Members of Congress are calling on Nvidia CEO Jensen Huang to resign, and momentum is building to subpoena the executive, whose company is a leader in advanced artificial intelligence chips.\nSenate banking committee member Kevin Cramer, R-N.D., doubled down Wednesday on his call for Huang to resign, and a key Democratic House oversight panel member and House Republican piled on.\n\"As a matter of his own conscience, he should resign,\" Cramer told CNBC, in response to revelations that Huang had an affair with an alleged Chinese spy as the chipmaker he co-founded was given permission from the U.S. government to sell its technology to China.\nHuang, who leads a company that's been a chief beneficiary of the artificial intelligence boom, on Sunday admitted to having an affair with a woman whom news outlets have reported U.S. intelligence concluded was a Chinese spy. The revelation is sending shockwaves through Washington, with lawmakers now fearing that U.S. AI dominance could be at risk.\n\"What bothers me at the end of it is what we don't know is what she knows about him that can be utilized,\" Cramer said, referring to Alice Huang and Jensen Huang, who are not related. \"This is a guy that's right now so vulnerable to extortion, blackmail. I just don't think, as a national security matter, we can run the risk.\"\nCramer's comments come on the deadline set by a trio of House lawmakers who requested Huang to testify before their committees on Nov. 18.\nSubpoena power\nGOP Reps. Brian Mast, chair of the House Foreign Affairs Committee; John Moolenaar, chair of the Permanent Select Committee on China; and Rick Crawford, who leads the House intelligence panel, called for Huang to appear in a Nov. 4 letter. Congress members in the majority party also have subpoena power, should they choose to use it.\nMast and Moolenaar told reporters on Wednesday afternoon that they had not yet heard from Huang and that they were giving him until the end of the day to respond.\nAsked whether the committees were considering subpoenaing Huang if he doesn't agree to appear, Mast said \"yes.\"\nMoolenaar, when asked the same question, said \"all three committees have subpoena power, and I know all three committees have a very serious interest in getting to the bottom of this and having transparency around this.\"\n\"We are going to continue to pursue this,\" Moolenaar said.\nThe lawmakers are far from alone in their criticism, concern and outright shock over the affair. And the scrutiny is only expected to intensify with Democrats poised to take over both chambers of Congress in January. Huang has been close with President Donald Trump during the president's second term, traveling on Air Force One to China in May.\n\"Jensen Huang should resign from Nvidia,\" Rep. Suhas Subramanyam, D-Va., a member of the House Oversight Committee, told CNBC. Subramanyam is the top Democrat on the panel's Subcommittee on Military and Foreign Affairs.\n\"I didn't agree with his sentiment that there's no downside to exporting chips to China,\" he said. \"But I never thought that he might be having an affair with a Chinese spy who was helping smuggle chips into China at an alarming rate.\"\nRep. Don Bacon, R-Neb., who is retiring from Congress after sometimes bucking Trump, also said the CEO should step down.\n\"From the little I know, yes.\" Bacon told CNBC in response to whether Huang should resign. \"I mean, he allowed himself to get compromised by the Chinese government. Not good.\"\nExport controls\nHuang was notably opposed to strict export controls on AI chips to China, which ruffled feathers with China hawks on Capitol Hill.\nDemocrats are widely expected to launch myriad investigations into the White House and industry when they assume control of both chambers of Congress in January. Nvidia is now likely to be at the center of those probes.\n\"There's two parts to this investigation that [need] to happen somewhere immediately,\" Subramanyam said. \"One is what was going on with Nvidia and China, and two is why the administration did nothing about it even though they appeared to have known, and what the administration knew, and what influence the money from Nvidia and Jensen Huang had on this administration, essentially staying silent.\"\nRep. Jay Obernolte, R-Calif., co-chair of the House AI task force, said Tuesday he hopes that the Huang scandal can avoid becoming a distraction in talks about imposing export controls on advanced AI chips.\nThe situation may give Congress additional ammunition as it tries to pass a suite of bills in this year's National Defense Authorization Act to tighten export controls on advanced AI chips.\nCongress has still not passed the annual defense bill, which is a top priority for lawmakers in the lame-duck session.\nThose bills include the AI Overwatch Act, the MATCH Act and the Chip Security Act — all of which are aimed at preventing U.S. chip technology from falling into adversarial hands.\nSens. Elizabeth Warren, D-Mass., and Jim Banks, R-Ind., in a statement following the revelation of Huang's affair, urged their colleagues to include the AI Overwatch Act. Warren, the incoming Senate banking committee chair, sponsored the bill in the Senate with Banks.\n\"Huang's confirmation of a relationship with a suspected spy for China's intelligence service makes these national security concerns even more urgent and raises important questions NVIDIA must answer about the extent to which these activities were related,\" the senators said. \"It is time for Congress to take decisive action to pass key bills like the AI Overwatch Act in the NDAA that will cut off pathways through which China accesses advanced chips.\"\nAnd Subramanyam warned that what Nvidia does now — and whether Huang remains atop the company — could affect its relationship with Washington and whether lawmakers crack down.\n\"If Nvidia finds out that he knew about what was going on and does nothing about it, then Nvidia is making a choice and us as regulators and as watchdogs need to defend the American people,\" he said.",

    "id": "canada-s-ambassador-warns-trump-tariffs-73d819bd",
    "title": "Canada’s ambassador warns Trump tariffs are driving up costs, threatening U.S. investment",
    "titleJa": "Canada’s ambassador warns Trump tariffs are driving up costs, threatening U.S. investment",
    "summaryJa": "U.S.-Canada trade tensions persist as Trump's tariffs drive up costs, threaten investment and complicate negotiations between the two countries.",
    "bodyOriginal": "Canada's ambassador to the U.S. warned Wednesday that President Donald Trump's tariffs are driving up investment costs and discouraging business expansion, as new Federal Reserve research points to more price hikes for American consumers next year.\n\"Uncertainty increases your cost of capital,\" Ambassador Mark Wiseman said at the B20 summit, a gathering of global business leaders in Washington hosted by the U.S. Chamber of Commerce.\n\"If you're going to build a new plant, add a new ship, spend money on R&D, the more certainty you have, the more likely you're going to do that,\" said Wiseman, a former BlackRock executive who became Canada's ambassador in February.\nHis warning comes as Washington and Ottawa struggle to resolve a tariff quarrel affecting one of the U.S.'s largest trading relationships. The two countries exchanged roughly $570 billion in goods during the first nine months of 2026, according to U.S. Census Bureau data. That's an increase from the same period in 2025, the first year of Trump's second term, but lower than the comparable nine months during the previous three years, when Joe Biden was president.\nU.S. customs duties calculated on imports from Canada reached $10 billion in 2025, compared with $400 million in 2024, according to the Congressional Research Service.\nAn October study by New York Fed researchers found that nearly 90% of tariff costs were passed on to U.S. importers, with about a quarter of tariff increases eventually reaching consumer goods prices and further price pressures expected in 2027.\nThe findings come as Labor Department data showed consumer prices rose a higher-than-expected 0.4% in October, adding to inflation concerns after Republicans' sweeping midterm losses.\nTrump has defended his tariffs as necessary to protect U.S. manufacturers and workers, accusing Canada of discriminatory trade practices that disadvantage U.S. exporters.\nThe two governments have resumed negotiations after talks collapsed in August, with discussions focused on reducing tariffs on Canadian steel and automobiles. Trump has imposed duties of up to 50% on certain Canadian products, prompting retaliatory measures targeting billions of dollars in U.S. exports.\nWiseman called for the removal of tariffs imposed under Sections 232 and 338 of U.S. trade law, saying a resolution would help businesses make long-term investment decisions.\n\"The sooner, the better,\" he said.\nThe political stakes have shifted following the midterms, with Democrats preparing to challenge Trump's tariffs when they take control of Congress in January.\nStill, Canadian Prime Minister Mark Carney said Tuesday that the Trump administration remains Canada's principal negotiating partner.\n\"We've had comprehensive free trade with the United States since 1988,\" Wiseman said, describing Canada's objective as returning \"as close as we can to free trade\" while creating the certainty businesses need.\nEuropean ambassadors echoed those concerns at the B20 summit. Germany's ambassador to the U.S., Jens Hanefeld, said businesses could adapt to tariffs but struggled with an \"ever-changing regulatory environment\" that forced companies to spend more on lawyers to navigate shifting trade rules.\nSpeaking on the same panel, France's ambassador, Aurélien Lechevallier, urged greater cooperation on AI and energy rather than continued trade disputes.\n\"We've spent, I think, a lot of time the last years working and dealing with regulations, tariffs,\" he said. \"Businesses are eager to do more business.\"",

n August, with discussions focused on reducing tariffs on Canadian steel and automobiles. Trump has imposed duties of up to 50% on certain Canadian products, prompting retaliatory measures targeting billions of dollars in U.S. exports.\nWiseman called for the removal of tariffs imposed under Sections 232 and 338 of U.S. trade law, saying a resolution would help businesses make long-term investment decisions.\n\"The sooner, the better,\" he said.\nThe political stakes have shifted following the midterms, with Democrats preparing to challenge Trump's tariffs when they take control of Congress in January.\nStill, Canadian Prime Minister Mark Carney said Tuesday that the Trump administration remains Canada's principal negotiating partner.\n\"We've had comprehensive free trade with the United States since 1988,\" Wiseman said, describing Canada's objective as returning \"as close as we can to free trade\" while creating the certainty businesses need.\nEuropean ambassadors echoed those concerns at the B20 summit. Germany's ambassador to the U.S., Jens Hanefeld, said businesses could adapt to tariffs but struggled with an \"ever-changing regulatory environment\" that forced companies to spend more on lawyers to navigate shifting trade rules.\nSpeaking on the same panel, France's ambassador, Aurélien Lechevallier, urged greater cooperation on AI and energy rather than continued trade disputes.\n\"We've spent, I think, a lot of time the last years working and dealing with regulations, tariffs,\" he said. \"Businesses are eager to do more business.\"",

    "id": "not-the-answer-labour-mps-speak-out-aga-ebfc5c6d",
    "title": "'Not the answer': Labour MPs speak out against Rosebank as decision looms",
    "titleJa": "'Not the answer': Labour MPs speak out against Rosebank as decision looms",
    "summaryJa": "There is a growing expectation among senior Labour figures that drilling in the oil field will be given the green light.",
    "bodyOriginal": "'Not the answer': Labour MPs speak out against Rosebank as decision looms\n- Published\nSome Labour MPs have called on the government to reject the Rosebank oil field, saying it is \"incompatible\" with the UK's climate commitments.\nThere is a growing expectation among senior Labour figures that drilling in the oil field off the north-west coast of Shetland will be given the go-ahead.\nPrime Minister Andy Burnham said on Wednesday that a decision would be \"taken in due course\" while Energy Secretary Miatta Fahnbulleh stressed that affordability of energy bills was her \"overriding objective\".\nBut in a sign of the division within the party, more than a dozen Labour MPs expressed concerns in Parliament about approving it. Others expressed support, pointing to economic benefits.\nSupportive Labour MPs said some other parts of the world emitted far more greenhouse gases than the UK and warned of relying on imports. Reports have suggested that Chancellor John Healey is in favour of approval.\nSeparately, it is understood some Labour backbenchers have organised a letter opposing Rosebank - intended for Burnham, but not yet sent - which more than 60 out of about 400 Labour MPs have indicated they support.\nOne signatory told the BBC that approving Rosebank \"would not create new jobs, would bring minimal money into the Treasury and be bad for the climate\".\n\"The government's central aim is to tackle the cost of living crisis, and drilling for more oil at Rosebank isn't the answer,\" the MP said.\nWednesday's Westminster Hall - a type of parliamentary debate where backbench MPs raise topical issues but do not vote - was organised by Green MP Carla Denyer.\nLabour MP for Sheffield Central Abtisam Mohamed told the debate: \"Rosebank fails on every test.\n\"It will not benefit taxpayers who will shoulder the vast majority of the development costs, it will not strengthen our energy security because most of the oil will be sold on international markets, and it will not reduce energy bills for our constituents, who will remain exposed to volatile fossil fuel prices.\"\nRichard Burgon, a former frontbencher on the left of the party, said: \"Rosebank is not compatible with our climate targets - it's dangerous to pretend otherwise.\"\nThe UK is committed to reaching net zero by 2050 and wants to limit global warming to no more than 1.5C above the pre-industrial period.\nThe UK government has always insisted that Rosebank is a quasi-judicial decision, formally resting with Fahnbulleh. She green-lit production in the Jackdaw gas field in the North Sea last month, but Rosebank hangs in the balance.\nLabour's manifesto upon entering power in 2024 pledged not to \"issue new licences to explore new fields\".\nLicences for both Jackdaw and Rosebank were granted by the then Conservative UK government in 2022 and 2023 respectively.\nBut the Court of Session in Edinburgh ruled last year that the government had made the approvals unlawfully, leaving the current Labour government to make a fresh decision on whether to give the go-ahead.\nConservative leader Kemi Badenoch sought to tease at Labour divisions on the issue during Prime Minister's Questions on Wednesday.\nDemand for fossil fuels\nDuring the debate, Labour MP Anna Gelderd said: \"We live in an unprecedented era where our energy security is more vital than ever, in which jobs and wealth must be protected and economic opportunities seized - on both of these points, Rosebank fails.\"\nLabour MP Julia Buckley said she had received opposition to Rosebank from her constituents in \"regularly flooded Shrewsbury\" and said fossil fuels \"belong in the past, not the future\".\nShe urged Fahnbulleh to \"reject the oil licence in favour of renewables\", adding: \"Please don't add further to our climate emergency.\"\nOther Labour MPs expressed their support, including recently departed veterans minister Al Carns, who warned that Britain would continue to need fossil fuels for decades and importing more would be a mistake.\n\"Refusing to produce it here does nothing on its own to eliminate that demand - it simply increases our reliance on imports which can carry their own environmental cost,\" he added.\nThose representing communities with ties to the oil and gas industry, including Jonathan Brash, the Labour MP for Hartlepool, stressed the benefits of approving Rosebank for British jobs.\nSpeaking to BBC Radio 5 Live, Labour MP Bill Esterson, chair of Energy Security and Net Zero Committee, said \"the economics of it (Rosebank) are that you should carry on with it\" and \"there's an element of energy security\" by approving it.\nEnergy minister Michael Shanks told the debate the government would take a \"pragmatic approach\" to a clean energy transition, stressing it was \"not a turn off the taps government, but nor can we justifiably be a drill every last drop government either\".\n\"This government will not make decisions for this country which are not compatible with our climate obligations,\" he added.\nRosebank: Life on the oil field at the centre of a political storm\n- Published25 October\nAction on energy costs is my overriding aim, says Fahnbulleh\n- Published2 days ago\nPolitical battle intensifies within Labour over Rosebank oil field\n- Published26 October\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",
    "bodyJa": "'Not the answer': Labour MPs speak out against Rosebank as decision looms\n- Published\nSome Labour MPs have called on the government to reject the Rosebank oil field, saying it is \"incompatible\" with the UK's climate commitments.\nThere is a growing expectation among senior Labour figures that drilling in the oil field off the north-west coast of Shetland will be given the go-ahead.\nPrime Minister Andy Burnham said on Wednesday that a decision would be \"taken in due course\" while Energy Secretary Miatta Fahnbulleh stressed that affordability of energy bills was her \"overriding objective\".\nBut in a sign of the division within the party, more than a dozen Labour MPs expressed concerns in Parliament about approving it. Others expressed support, pointing to economic benefits.\nSupportive Labour MPs said some other parts of the world emitted far more greenhouse gases than the UK and warned of relying on imports. Reports have suggested that Chancellor John Healey is in favour of approval.\nSeparately, it is understood some Labour backbenchers have organised a letter opposing Rosebank - intended for Burnham, but not yet sent - which more than 60 out of about 400 Labour MPs have indicated they support.\nOne signatory told the BBC that approving Rosebank \"would not create new jobs, would bring minimal money into the Treasury and be bad for the climate\".\n\"The government's central aim is to tackle the cost of living crisis, and drilling for more oil at Rosebank isn't the answer,\" the MP said.\nWednesday's Westminster Hall - a type of parliamentary debate where backbench MPs raise topical issues but do not vote - was organised by Green MP Carla Denyer.\nLabour MP for Sheffield Central Abtisam Mohamed told the debate: \"Rosebank fails on every test.\n\"It will not benefit taxpayers who will shoulder the vast majority of the development costs, it will not strengthen our energy security because most of the oil will be sold on international markets, and it will not reduce energy bills for our constituents, who will remain exposed to volatile fossil fuel prices.\"\nRichard Burgon, a former frontbencher on the left of the party, said: \"Rosebank is not compatible with our climate targets - it's dangerous to pretend otherwise.\"\nThe UK is committed to reaching net zero by 2050 and wants to limit global warming to no more than 1.5C above the pre-industrial period.\nThe UK government has always insisted that Rosebank is a quasi-judicial decision, formally resting with Fahnbulleh. She green-lit production in the Jackdaw gas field in the North Sea last month, but Rosebank hangs in the balance.\nLabour's manifesto upon entering power in 2024 pledged not to \"issue new licences to explore new fields\".\nLicences for both Jackdaw and Rosebank were granted by the then Conservative UK government in 2022 and 2023 respectively.\nBut the Court of Session in Edinburgh ruled last year that the government had made the approvals unlawfully, leaving the current Labour government to make a fresh decision on whether to give the go-ahead.\nConservative leader Kemi Badenoch sought to tease at Labour divisions on the issue during Prime Minister's Questions on Wednesday.\nDemand for fossil fuels\nDuring the debate, Labour MP Anna Gelderd said: \"We live in an unprecedented era where our energy security is more vital than ever, in which jobs and wealth must be protected and economic opportunities seized - on both of these points, Rosebank fails.\"\nLabour MP Julia Buckley said she had received opposition to Rosebank from her constituents in \"regularly flooded Shrewsbury\" and said fossil fuels \"belong in the past, not the future\".\nShe urged Fahnbulleh to \"reject the oil licence in favour of renewables\", adding: \"Please don't add further to our climate emergency.\"\nOther Labour MPs expressed their support, including recently departed veterans minister Al Carns, who warned that Britain would continue to need fossil fuels for decades and importing more would be a mistake.\n\"Refusing to produce it here does nothing on its own to eliminate that demand - it simply increases our reliance on imports which can carry their own environmental cost,\" he added.\nThose representing communities with ties to the oil and gas industry, including Jonathan Brash, the Labour MP for Hartlepool, stressed the benefits of approving Rosebank for British jobs.\nSpeaking to BBC Radio 5 Live, Labour MP Bill Esterson, chair of Energy Security and Net Zero Committee, said \"the economics of it (Rosebank) are that you should carry on with it\" and \"there's an element of energy security\" by approving it.\nEnergy minister Michael Shanks told the debate the government would take a \"pragmatic approach\" to a clean energy transition, stressing it was \"not a turn off the taps government, but nor can we justifiably be a drill every last drop government either\".\n\"This government will not make decisions for this country which are not compatible with our climate obligations,\" he added.\nRosebank: Life on the oil field at the centre of a political storm\n- Published25 October\nAction on energy costs is my overriding aim, says Fahnbulleh\n- Published2 days ago\nPolitical battle intensifies within Labour over Rosebank oil field\n- Published26 October\nSign up for our Politics Essential newsletter to keep up with the inner workings of Westminster and beyond.",

    "id": "fed-s-goolsbee-calls-inflation-report-bo-158b6c8a",
    "title": "Fed's Goolsbee calls inflation report 'borderline disturbing' as central bank weighs more hikes",
    "titleJa": "Fed's Goolsbee calls inflation report 'borderline disturbing' as central bank weighs more hikes",
    "summaryJa": "The consumer price index rose more than expected in October, raising alarm among Federal Reserve officials.",
    "bodyOriginal": "Chicago Federal Reserve President Austan Goolsbee called the latest inflation data \"borderline disturbing.\"\n\"It's another distressing report — borderline disturbing,\" Goolsbee said in an interview with PBS Tuesday.\n\"We have got a real inflation issue on our hands that has been developing,\" Goolsbee said, according to a transcript of his remarks. \"We're going to have to deal with that.\"\nThe consumer price index rose 0.4% on a seasonally adjusted basis in October, according to the Bureau of Labor Statistics' Tuesday release. That was higher than economists had predicted.\nGoolsbee said he had not seen drivers of prices like tariffs fade over time like he hoped. He also said continuously high inflation on services concerned him.\nAnd the Chicago Fed chief said lofty prices are a top issue for many people he meets.\n\"It's on everyone's mind,\" Goolsbee said. \"It's on business mind. It's on nonprofits' minds. It's on ordinary consumers' mind.\"\nThe inflation report landed at a critical juncture for the Federal Reserve, as it considers its next interest-rate move — and the moves it may have to make beyond that if the numbers continue to come in hot.\nGoolsbee's comments came on the heels of remarks from other Fed officials Tuesday who said the rate-setting Federal Open Market Committee may need to act more decisively to rein in inflation.\nWhen it raises or lowers rates, the Fed typically moves them by a quarter-percentage point. But Fed Governor Christopher Waller said in London early Tuesday that a hot inflation report could push him toward advocating for an outsized half-point increase in December, and specifically said such a hike should be on the table if core CPI was \"around 0.3.\" Hours later, that's exactly what happened.\nDallas Fed President Lorie Logan, speaking Tuesday after the inflation report, said she sees a need for two additional quarter-point increases, and said \"it may be possible to move more rapidly this winter than the FOMC has moved so far this fall.\"\nThe rate-setting committee raised rates by a quarter point in September, to a range of 3.75%-4%, before voting to hold them steady in October.\nAfter years of higher-than-preferred price growth, Goolsbee said the possibility of consumers and businesses beginning to expect hot inflation is a \"major concern.\" If that does happen, he said it can make the process of cooling inflation \"much more painful.\"\nBut Goolsbee didn't specify whether he thought the Fed should hike rates at its December policy gathering as a result of these concerns.\n\"I'm not a fan of being very specific and tying our hands at the next meeting or meetings in the future,\" Goolsbee said.\nWaller, Logan and Paulson are voting members of the FOMC this year, which means they will cast votes on whether to raise rates at the committee's final meeting of the year in December. Goolsbee will be a voting member next year.\nIn the wake of the inflation report and the remarks from the various Fed officials, Fed funds futures are now unanimously expecting a rate hike at the December meeting, according to CME's FedWatch tool.\nNow the question is about whether the central bank will raise rates by a quarter or half percentage point. The Fed funds futures currently put the odds of a half-point hike at the upcoming December meeting at 15%.\nOdds of rates reaching 4.25%-4.5% by the January meeting — the equivalent of either a single half-point rise or two quarter-point hikes — are now at 60%, with a 10% chance of rates hitting 4.5%-4.75% by then.",

    "id": "nvidia-shares-rebound-4-as-huang-faces-s-253f9380",
    "title": "Nvidia shares rebound 4% as Huang faces scrutiny ahead of earnings",
    "titleJa": "Nvidia shares rebound 4% as Huang faces scrutiny ahead of earnings",
    "summaryJa": "Investors are assessing whether CEO Jensen Huang's affair will have spillover effects on Nvidia's business.",
    "bodyOriginal": "Nvidia's stock rose premarket on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\nShares had closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang's affair with an alleged Chinese spy. They fell 4.3% Monday.\nShares were 3.8% higher in premarket trading as of 8:37 a.m. ET.\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\nIn a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that further problems might arise as the news develops. \"What else has Jensen done?\" he said.\n\"It's not good for Nvidia. It's not good for Jensen Huang. It's certainly not good for the AI trade,\" Blank told CNBC's \"Squawk Box Europe\" on Wednesday.\nMorgan Stanley on Wednesday removed Nvidia as a top pick after shares dropped more than 25% since it was named on the list on Oct. 2. Huang's leadership is \"crucial\" to the company's strategic direction, analysts said in a Wednesday note.\n— CNBC's Michael Bloom helped contribute to this report.",
    "bodyJa": "Nvidia's stock rose premarket on Wednesday, after falling for two days amid the scandal that has rocked the world's most valuable tech company.\nShares had closed down 5.47% on Tuesday as more details were revealed about the impact of CEO Jensen Huang's affair with an alleged Chinese spy. They fell 4.3% Monday.\nShares were 3.8% higher in premarket trading as of 8:37 a.m. ET.\nOn Tuesday, Nvidia announced it had hired law firm Wachtell, Lipton, Rosen & Katz to investigate whether company secrets or national security were compromised.\nHuang tried to project \"business as usual\" as he returned to the office on Monday, people familiar with the matter told CNBC. The CEO was also in the office on Tuesday, conducting meetings, ahead of the company's quarterly earnings on Nov. 17.\nInvestors are assessing whether the matter will have damaging spillover effects on the business.\nIn a Tuesday note, Bank of America said it saw three scenarios with differing investment outcomes. In one scenario, the impact is contained with leadership continuity, and in another, prolonged uncertainty pressures valuation before earnings.\nIn the final scenario, the impact is escalated, with \"adverse findings, leadership disruption or tighter restrictions requiring earnings reassessment,\" BofA research analyst Vivek Arya said in the note.\nZacks' Chief Equity Strategist John Blank said the selloff reflected two concerns: that the U.S. might impose further restrictions in the wake of the affair and that further problems might arise as the news develops. \"What else has Jensen done?\" he said.\n\"It's not good for Nvidia. It's not good for Jensen Huang. It's certainly not good for the AI trade,\" Blank told CNBC's \"Squawk Box Europe\" on Wednesday.\nMorgan Stanley on Wednesday removed Nvidia as a top pick after shares dropped more than 25% since it was named on the list on Oct. 2. Huang's leadership is \"crucial\" to the company's strategic direction, analysts said in a Wednesday note.\n— CNBC's Michael Bloom helped contribute to this report.",

    "id": "how-democrats-could-snarl-trump-administ-1ed2819b",
    "title": "How Democrats could snarl Trump administration stakes in private sector companies",
    "titleJa": "How Democrats could snarl Trump administration stakes in private sector companies",
    "summaryJa": "The Trump administration had established some form of equity position in 41 companies as of November, according to the CATO Institute's tally.",
    "bodyOriginal": "With Republicans in charge of the White House and Congress, President Donald Trump has embedded the federal government in private sector companies' affairs in unprecedented ways. That could change once Trump's Democratic adversaries take over the House and Senate following the blue-wave midterm.\nDemocrats, planning to root out alleged corruption involving Trump, his family and their business associates, have signaled they will closely scrutinize companies that have curried the president's favor.\nTheir investigations may extend to Intel and the dozens of other companies that have clinched equity stakes with the government during Trump's second term. Democratic lawmakers in July asked law firm Skadden Arps for details about its involvement in the Intel deal.\nThe dynamic could affect how Trump approaches relationships with private sector companies, after spending two years involving the government in their affairs through stock agreements or, in the case of U.S. Steel, acquiring a \"golden share\" when the company was acquired by Nippon Steel.\nThe golden share, which allows a holder to outvote other shareholders, was negotiated as part of the June 2025 deal. The highly unusual arrangement gives Trump veto power over several key areas of the steelmaker's business, including those related to employee salaries, capital investment and even the company name.\nIn a unique twist, the company's amended charter specifies that after Trump leaves office, the veto power passes not to his successor, but to the Treasury and Commerce Departments as representatives of the U.S. government.\nU.S. Steel CEO David Burritt is scheduled to speak Wednesday with CNBC's Megan Cassella about what's next for U.S. industry at the B20 summit hosted by the U.S. Chamber of Commerce.\nThe U.S. Steel intervention turned out to be just the beginning of the U.S. government taking stakes in companies, a highly unusual move stateside. A month after acquiring the golden share, the Trump administration agreed to a $400 million stock deal with rare-earths company MP Materials. The month after that, Trump announced the U.S. would take a 10% stake in chipmaker Intel.\nBy January, one year into Trump's second term as president, the administration had established some form of equity position in 14 companies, according to the CATO Institute's tracker. That number skyrocketed to 41 by November, including nine such announcements in May alone, the tracker shows. The holdings include both publicly traded and privately held companies, and CATO tracks deals that are closed as well as others that have been made public but are still being negotiated.\nFollowing Republicans' decisive defeat in the Nov. 3 midterm election, the federal government has not revealed any new stock positions. But Trump, entering lame-duck status and on the verge of losing political power over Congress, could keep trying to steer his government to forge more equity deals with companies, said Indiana University associate professor Sarah Bauerle Danzman, who researches the intersection of national security and investment policy.\n\"He might feel he has less to lose,\" Bauerle Danzman, who is also a senior fellow at the Atlantic Council, told CNBC.\nWhite House spokesman Matthew Middleton told CNBC in a statement, \"Through voluntary equity investments in willing companies, the Trump Administration has partnered with the private sector to rebuild America's industrial base and bring critical production back home.\"\n\"Moving forward, the President is willing to work with anyone to advance solutions that strengthen our economy and put more money back in the pockets of American workers,\" Middleton said.\nBut Trump's so-far unimpeded efforts may face sudden resistance once Democrats take majority control of the House and Senate in January.\nDemocratic lawmakers are openly gearing up to score wins against Trump and his associates as they vow to crack down on alleged rampant government corruption.\nThose probes are expected to center on tech giants like Apple, Meta Platforms and Elon Musk's companies, whose executives have spent millions cozying up to the administration. Democrats are also poised to dig into potential conflicts related to the bevy of critical-minerals deals Trump has struck. Lawmakers of both parties are also looking at Nvidia CEO Jensen Huang, the close Trump ally engulfed in scandal after admitting an extramarital affair with a suspected Chinese spy.\nThe administration's equity interventions could become a target in that mission, said Bauerle Danzman, predicting that Democrats might seek to boost oversight efforts even if they don't try to cancel the existing stock arrangements.\nThe next Congress could try to ensure the government is taking stakes that are \"forwarding genuine national security priorities\" and that do not provide \"special favors to political and family connections,\" she said.\n\"The story there is more about kind of tying these issues to ones of accountability and anti-corruption, as opposed to necessarily cost,\" Bauerle Danzman said.\nIt's also not clear how strongly Republicans would try to defend Trump's golden share or his government's equity stakes should they become a Democratic target.\nConservatives traditionally espouse free markets and denounce excessive government meddling in the private sector. Republicans, including Trump, spent much of the midterm campaign warning that Democrats aim to destroy the U.S. capitalist system and impose economy-killing big-government socialism.\nSome Republicans have criticized the Trump administration's corporate interventions, but the moves have received little pushback from the president's party overall.\nBut in the wake of a crushing electoral defeat, some Republicans \"might feel emboldened and actually join with the Democrats\" in trying to clamp down on Trump, Bauerle Danzman said.",
    "bodyJa": "With Republicans in charge of the White House and Congress, President Donald Trump has embedded the federal government in private sector companies' affairs in unprecedented ways. That could change once Trump's Democratic adversaries take over the House and Senate following the blue-wave midterm.\nDemocrats, planning to root out alleged corruption involving Trump, his family and their business associates, have signaled they will closely scrutinize companies that have curried the president's favor.\nTheir investigations may extend to Intel and the dozens of other companies that have clinched equity stakes with the government during Trump's second term. Democratic lawmakers in July asked law firm Skadden Arps for details about its involvement in the Intel deal.\nThe dynamic could affect how Trump approaches relationships with private sector companies, after spending two years involving the government in their affairs through stock agreements or, in the case of U.S. Steel, acquiring a \"golden share\" when the company was acquired by Nippon Steel.\nThe golden share, which allows a holder to outvote other shareholders, was negotiated as part of the June 2025 deal. The highly unusual arrangement gives Trump veto power over several key areas of the steelmaker's business, including those related to employee salaries, capital investment and even the company name.\nIn a unique twist, the company's amended charter specifies that after Trump leaves office, the veto power passes not to his successor, but to the Treasury and Commerce Departments as representatives of the U.S. government.\nU.S. Steel CEO David Burritt is scheduled to speak Wednesday with CNBC's Megan Cassella about what's next for U.S. industry at the B20 summit hosted by the U.S. Chamber of Commerce.\nThe U.S. Steel intervention turned out to be just the beginning of the U.S. government taking stakes in companies, a highly unusual move stateside. A month after acquiring the golden share, the Trump administration agreed to a $400 million stock deal with rare-earths company MP Materials. The month after that, Trump announced the U.S. would take a 10% stake in chipmaker Intel.\nBy January, one year into Trump's second term as president, the administration had established some form of equity position in 14 companies, according to the CATO Institute's tracker. That number skyrocketed to 41 by November, including nine such announcements in May alone, the tracker shows. The holdings include both publicly traded and privately held companies, and CATO tracks deals that are closed as well as others that have been made public but are still being negotiated.\nFollowing Republicans' decisive defeat in the Nov. 3 midterm election, the federal government has not revealed any new stock positions. But Trump, entering lame-duck status and on the verge of losing political power over Congress, could keep trying to steer his government to forge more equity deals with companies, said Indiana University associate professor Sarah Bauerle Danzman, who researches the intersection of national security and investment policy.\n\"He might feel he has less to lose,\" Bauerle Danzman, who is also a senior fellow at the Atlantic Council, told CNBC.\nWhite House spokesman Matthew Middleton told CNBC in a statement, \"Through voluntary equity investments in willing companies, the Trump Administration has partnered with the private sector to rebuild America's industrial base and bring critical production back home.\"\n\"Moving forward, the President is willing to work with anyone to advance solutions that strengthen our economy and put more money back in the pockets of American workers,\" Middleton said.\nBut Trump's so-far unimpeded efforts may face sudden resistance once Democrats take majority control of the House and Senate in January.\nDemocratic lawmakers are openly gearing up to score wins against Trump and his associates as they vow to crack down on alleged rampant government corruption.\nThose probes are expected to center on tech giants like Apple, Meta Platforms and Elon Musk's companies, whose executives have spent millions cozying up to the administration. Democrats are also poised to dig into potential conflicts related to the bevy of critical-minerals deals Trump has struck. Lawmakers of both parties are also looking at Nvidia CEO Jensen Huang, the close Trump ally engulfed in scandal after admitting an extramarital affair with a suspected Chinese spy.\nThe administration's equity interventions could become a target in that mission, said Bauerle Danzman, predicting that Democrats might seek to boost oversight efforts even if they don't try to cancel the existing stock arrangements.\nThe next Congress could try to ensure the government is taking stakes that are \"forwarding genuine national security priorities\" and that do not provide \"special favors to political and family connections,\" she said.\n\"The story there is more about kind of tying these issues to ones of accountability and anti-corruption, as opposed to necessarily cost,\" Bauerle Danzman said.\nIt's also not clear how strongly Republicans would try to defend Trump's golden share or his government's equity stakes should they become a Democratic target.\nConservatives traditionally espouse free markets and denounce excessive government meddling in the private sector. Republicans, including Trump, spent much of the midterm campaign warning that Democrats aim to destroy the U.S. capitalist system and impose economy-killing big-government socialism.\nSome Republicans have criticized the Trump administration's corporate interventions, but the moves have received little pushback from the president's party overall.\nBut in the wake of a crushing electoral defeat, some Republicans \"might feel emboldened and actually join with the Democrats\" in trying to clamp down on Trump, Bauerle Danzman said.",

    "titleJa": "CoreWeave stock pops 15% after outlook raise eases AI slowdown concerns",
    "summaryJa": "Neoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade.",
    "bodyOriginal": "CoreWeave shares jumped 15% in premarket trading Wednesday after the neocloud posted quarterly earnings that beat estimates and raised its guidance for the year.\nNeoclouds such as CoreWeave, Nebius and IREN have come under scrutiny this month as investors assessed the sustainability of the AI trade. CoreWeave, in particular, sparked alarm when spreads on its CDS widened past 11%, generally viewed as a distress level, as investors have to pay up for protection against default.\nRevenue jumped 168% to $3.7 billion in the third quarter, the company said in a Tuesday statement.\nThe three months to Sept. 30 marked a \"breakout quarter\" for CoreWeave, CEO Michael Intrator said, adding that growth was supported by multiple sources of funding, including financing backed by customer contracts and around $9 billion in customer prepayments and deposits.\nShares were 15.3% higher as of 8:30 a.m. ET. Other neclouds were also higher in premarket trading, with Nebius up 13.4%, Applied Digital up 9.8% and Iren up 7.9%.\nCoreWeave expects $1.275 billion to $1.375 billion in adjusted operating income on $13 billion to $13.3 billion in revenue. Analysts surveyed by Visible Alpha were looking for $1.07 billion in adjusted operating income, and analysts polled by LSEG had expected $12.86 billion in 2026 revenue.\nThe neocloud has done well to allay concerns about financing by moving away from unsecured bond financing, Zacks Chief Equity Strategist John Blank told CNBC's \"Squawk Box Europe.\"\n\"It might be the bottom for CoreWeave,\" Blank said Wednesday. \"But the shares are so beaten up, you have to believe at this point there's more value on the upside than the down.\"\nTune in at 9:50 a.m. ET as CoreWeave CO Michael Intrator joins CNBC TV to discuss the company's earnings. Watch in real time on CNBC+ or the CNBC Pro stream.\n— CNBC's Jordan Novet contributed to this report.",

    "id": "zelenskyy-warns-ukraine-is-not-real-esta-ad98a9d5",
    "title": "Zelenskyy warns Ukraine is 'not real estate' as experts say a Russia peace deal remains elusive",
    "titleJa": "Zelenskyy warns Ukraine is 'not real estate' as experts say a Russia peace deal remains elusive",
    "summaryJa": "President Zelenskyy warned Tuesday that his country \"was not real estate,\" as a second and final day of U.S.-brokered peace talks got underway.",
    "bodyOriginal": "Ukrainian President Volodymyr Zelenskyy warned Tuesday that his country \"was not real estate,\" as a second and final day of U.S.-brokered peace talks got underway.\nSpeaking to reporters in Denmark late Tuesday, Zelenskyy said he was \"happy\" with what he was hearing from the peace talks in Abu Dhabi between Russian and Ukrainian representatives, but said he had been clear with U.S. envoys Steve Witkoff and Jared Kushner that \"this is a country of our nation, it is not real estate.\"\nHis comments come amid discussions on the future borders of Ukraine and post-war security guarantees, issues where the countries remain far apart.\n\"I don't have any expectations of major progress towards settlement,\" Mykola Bielieskov, senior analyst at Ukrainian NGO Come Back Alive, told CNBC Tuesday.\nBielieskov would welcome another round of exchanges of prisoners of war, \"otherwise there is no room for compromise.\"\nFollowing Tuesday's talks, the first since February, Kushner said he was \"encouraged by the constructive discussions.\"\n\"We are working to end this devastating war and establish the security arrangements necessary for a sovereign, secure, and prosperous Ukraine and lasting peace across Europe,\" he wrote on X.\nOpening the meeting, Kushner said he had almost daily conversations with both sides and had narrowed the gaps between them. \"I think we have some good ideas on how to bridge it.\"\nAccording to Bielieskov, Ukraine could accept a ceasefire along the current front lines, but would never formally recognize Russian sovereignty over occupied territory. He argued that Zelenskyy has neither the legal authority nor public support to surrender Ukrainian land, even if Kyiv acknowledges it cannot reclaim those territories militarily in the near term.\nRussia's demands for additional territory, restrictions on NATO membership and limits on Ukraine's armed forces remain fundamental obstacles to a deal, he added.\nMaximilian Hess at political risk firm Enmetena Advisory told CNBC's Dan Murphy on Wednesday that little has been achieved in the latest round of meetings.\nWhile Zelenskyy has urged leaders to speak directly, Hess said it's unlikely the Ukrainian leader will be willing to meet with Putin without meaningful concessions from Russia, given the risk of domestic backlash.\nHe argued that Putin could use a potential meeting with Trump and Xi Jinping in China to seek further U.S. sanctions relief, weaken Washington's support for Ukraine, and deepen divisions within the West.",
    "bodyJa": "Ukrainian President Volodymyr Zelenskyy warned Tuesday that his country \"was not real estate,\" as a second and final day of U.S.-brokered peace talks got underway.\nSpeaking to reporters in Denmark late Tuesday, Zelenskyy said he was \"happy\" with what he was hearing from the peace talks in Abu Dhabi between Russian and Ukrainian representatives, but said he had been clear with U.S. envoys Steve Witkoff and Jared Kushner that \"this is a country of our nation, it is not real estate.\"\nHis comments come amid discussions on the future borders of Ukraine and post-war security guarantees, issues where the countries remain far apart.\n\"I don't have any expectations of major progress towards settlement,\" Mykola Bielieskov, senior analyst at Ukrainian NGO Come Back Alive, told CNBC Tuesday.\nBielieskov would welcome another round of exchanges of prisoners of war, \"otherwise there is no room for compromise.\"\nFollowing Tuesday's talks, the first since February, Kushner said he was \"encouraged by the constructive discussions.\"\n\"We are working to end this devastating war and establish the security arrangements necessary for a sovereign, secure, and prosperous Ukraine and lasting peace across Europe,\" he wrote on X.\nOpening the meeting, Kushner said he had almost daily conversations with both sides and had narrowed the gaps between them. \"I think we have some good ideas on how to bridge it.\"\nAccording to Bielieskov, Ukraine could accept a ceasefire along the current front lines, but would never formally recognize Russian sovereignty over occupied territory. He argued that Zelenskyy has neither the legal authority nor public support to surrender Ukrainian land, even if Kyiv acknowledges it cannot reclaim those territories militarily in the near term.\nRussia's demands for additional territory, restrictions on NATO membership and limits on Ukraine's armed forces remain fundamental obstacles to a deal, he added.\nMaximilian Hess at political risk firm Enmetena Advisory told CNBC's Dan Murphy on Wednesday that little has been achieved in the latest round of meetings.\nWhile Zelenskyy has urged leaders to speak directly, Hess said it's unlikely the Ukrainian leader will be willing to meet with Putin without meaningful concessions from Russia, given the risk of domestic backlash.\nHe argued that Putin could use a potential meeting with Trump and Xi Jinping in China to seek further U.S. sanctions relief, weaken Washington's support for Ukraine, and deepen divisions within the West.",
