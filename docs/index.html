    "titleJa": "Typical energy bill forecast to go up by £443 a year from January as inflation rate rises again",
    "summaryJa": "Energy bills are expected to jump by 26% a year for a typical household as UK inflation hits its highest rate for a year.",
    "bodyOriginal": "Typical energy bill forecast to go up by £443 a year from January as inflation rate rises again\n- Published\nGas and electricity bills for a typical household are forecast to jump by £443 a year from January as the inflation rate rose to its highest level in a year.\nA typical annual bill is predicted to rise by 26% in the new year, according to consultancy Cornwall Insight, ahead of the official announcement next week.\nSome households will get a £100 payment to help with the rising cost of living, a policy which was announced in the Budget.\nPrices rose 3.6% in the year to October, up from 3.5% in September mainly because of higher petrol and diesel prices, official figures show.\nInflation has been driven higher in recent months as the US-Israel war with Iran has driven up the cost of energy and fuel.\nIn response to prices surging, the Bank of England raised interest rates for the first time in three years earlier this month, in a bid to slow inflation to its target of 2%.\nInterest rates increased from 3.75% to 4%, and the Bank signalled a further rise could be likely unless the conflict in the Middle East is resolved.\nHigher interest rates lift the cost of borrowing for some mortgages, loans and credit cards, but can also lead to a better return on savings.\nEmma Reynolds, chief secretary to the Treasury, said the government was providing help for households with energy costs.\nVAT has been cut on electricity bills to zero until next July and the government will also hand £100 to 20 million homes in January.\nBut with annual household energy bills forecast to reach £2,166, Cornwall Insight's retail markets principal, Craig Lowrey, said that \"ultimately this support can only chip away at the edges of a bill that continues to be pushed up by events in the Middle East\".\nEnergy Secretary Miatta Fahnbulleh, said: \"Affordability is my number one priority, and I will continue driving towards cheap, clean power.\"\n'Wear more layers'\nSophie, who manages a cafe in Brighton, told the BBC she watches her smart meter at home \"like a hawk\".\n\"I'm very conscious of the cost of energy, and it is having an impact on how we function in the home as a family,\" she said.\n\"I try to cook using the oven a lot less than I used to. We haven't got the heating on yet in our household. We're just like 'wear more layers'. We've got electric blankets on the sofa.\"\nHeating bills, chocolate and cat food: What the inflation figures mean for you\n- Published7 hours ago\nShadow chancellor, Andrew Griffith, said four successive rises in the inflation rate was down to the UK's \"soaring energy costs\" and Labour's decision to \"hike taxes and employment costs\".\nGrant Fitzner, chief economist at the ONS, said fuel prices were \"once again a major contributor\" to the increase in the inflation rate in October.\nRising energy prices can lead to more expensive food and staples for consumers if businesses pass on higher costs.\nEarlier this month, the Bank of England said there had been \"limited evidence\" of this, with some firms absorbing cost increases and accepting lower profit margins.\nBut Fitzner said on Wednesday: \"Annual costs of both raw materials and goods leaving factories continue to climb, driven by higher crude oil and petrol prices, respectively.\"\nPetrol prices rose by 5.2p per litre between September and October, the ONS said, with the average price last month hitting 174.7p per litre - the highest since August 2022.\nDiesel prices, meanwhile, reached the highest price since records began 30 years ago, averaging 199.5p per litre in October.\nBut the ONS said price inflation in restaurants and cafes had slowed last month, and that prices had fallen on average for hotels.\nAnd food price inflation rose by 0.9%, the slowest pace in five years.\nCore inflation, which strips out energy and food costs, and services inflation were little changed on last month. The figure is closely watched by the Bank of England when setting interest rates.\nIt could mean the Bank opts to hold off on a further rate rise in December, though policymakers believe inflation could peak at 4.9% in the middle of next year and not return to 2% until 2028.\nIn an \"adverse scenario\", where the US-Iran war could escalate further and send oil prices higher, inflation could reach 6.2% in 2027, it has suggested.\nA spokesperson for the Bank said it decided to raise rates two weeks ago to \"limit how much higher energy costs affect other prices, and will continue to set interest rates to make sure inflation returns to the 2% target and stays there\".\nAdditional reporting by Raphael Sheridan, economics producer\nGet in touch\nHow is the rising cost of living affecting your quality of life?",

manages a cafe in Brighton, told the BBC she watches her smart meter at home \"like a hawk\".\n\"I'm very conscious of the cost of energy, and it is having an impact on how we function in the home as a family,\" she said.\n\"I try to cook using the oven a lot less than I used to. We haven't got the heating on yet in our household. We're just like 'wear more layers'. We've got electric blankets on the sofa.\"\nHeating bills, chocolate and cat food: What the inflation figures mean for you\n- Published7 hours ago\nShadow chancellor, Andrew Griffith, said four successive rises in the inflation rate was down to the UK's \"soaring energy costs\" and Labour's decision to \"hike taxes and employment costs\".\nGrant Fitzner, chief economist at the ONS, said fuel prices were \"once again a major contributor\" to the increase in the inflation rate in October.\nRising energy prices can lead to more expensive food and staples for consumers if businesses pass on higher costs.\nEarlier this month, the Bank of England said there had been \"limited evidence\" of this, with some firms absorbing cost increases and accepting lower profit margins.\nBut Fitzner said on Wednesday: \"Annual costs of both raw materials and goods leaving factories continue to climb, driven by higher crude oil and petrol prices, respectively.\"\nPetrol prices rose by 5.2p per litre between September and October, the ONS said, with the average price last month hitting 174.7p per litre - the highest since August 2022.\nDiesel prices, meanwhile, reached the highest price since records began 30 years ago, averaging 199.5p per litre in October.\nBut the ONS said price inflation in restaurants and cafes had slowed last month, and that prices had fallen on average for hotels.\nAnd food price inflation rose by 0.9%, the slowest pace in five years.\nCore inflation, which strips out energy and food costs, and services inflation were little changed on last month. The figure is closely watched by the Bank of England when     "id": "heating-bills-chocolate-and-cat-food-wha-74807bab",
    "title": "Heating bills, chocolate and cat food: What the inflation figures mean for you",
    "titleJa": "Heating bills, chocolate and cat food: What the inflation figures mean for you",
    "summaryJa": "Prices are rising at their fastest pace for a year in the UK, and higher energy costs are on the way.",
    "bodyOriginal": "Heating bills, chocolate and cat food: What the inflation figures mean for you\n- Published\nNobody will be celebrating the fact that prices in the UK are rising at the fastest pace for a year.\nAdd to that an expectation of higher household energy bills and sharpening price increases and things look grim for everyone.\nBut there are some signs of hope that may take the edge off the rising cost of living. Here's how.\nEnergy bills forecast to rise by 26%\nThat headline is not missing a decimal point. The latest prediction for the increase in domestic energy prices in the new year is, indeed, 26%.\nMillions of homes in England, Scotland and Wales are on tariffs affected by regulator Ofgem's price cap, which is set every three months. The next change for January will be officially announced next Wednesday, 25 November.\nEnergy consultancy Cornwall Insight, which has a good track record with its predictions, suggests that a household using a typical amount of gas and electricity will pay £2,166 a year - that's an increase of £443 from current levels.\nNot all energy use for the year is between January and March, but a big chunk is owing to the cold, dark days and nights.\nHow much you pay depends on your use, with heavy users of gas likely to be the hardest hit.\nThe government has promised a £100 payment for people living in homes in council tax bands A to D in England to help cover winter energy costs. Other nations are planning similar support.\nThe latest inflation data shows that government assistance can have an impact on the general rate of inflation, external, as recorded by the Office for National Statistics (ONS).\nDomestic energy prices rose by nearly 4% in October, but this was offset in inflationary terms by a cut in VAT on electricity bills.\nSupermarkets limit price rises\nWhile the rate of inflation in general was 3.6% in the year to October, food prices only went up by 0.9%.\nSo why the difference?\nIt is partly the result of intense competition between the supermarkets. Like many retailers, they are facing higher costs but are not passing that onto their customers in full.\nThere may be some scars from the recent cost-of-living spike here. Shoppers suffered a period during the big rise in inflation in 2022-23 when food prices rocketed.\nThose higher prices are embedded. While food prices overall aren't coming down now, they aren't rising anywhere near as fast as back then.\nThe detail here is very interesting. Take chocolate: world cocoa prices are down since 2024, and now chocolate prices are falling - down 2.9%, according to the latest data.\nBut the ONS has also pointed to cat food as one, albeit small, driver of the faster rate of rising prices.\nShould high energy and fuel costs - which are driving the rising rate of inflation - persist, there are questions over whether the cost of producing and transporting food also goes up, and the chances of that higher cost being passed on to consumers are greater.\nEconomists have been closely studying whether there are any signs of those so-called second-round effects - where an initial price shock spreads to wages, services and broader consumer prices. So far, there are relatively few.\nFood is, of course, a necessity.\nIf prices rise then it takes a bigger chunk of people's income and so has a deeper impact on those whose finances are already stretched, so the latest data on food prices is good news for many people.\nThe cost of borrowing money\nOne set of economists who will consider whether there is evidence of second-round effects are the nine people who set interest rates, which heavily influences the cost of borrowing money - such as mortgages - as well as the returns people get on savings.\nThe Bank of England's Monetary Policy Committee meets again in December and, after that, in February.\nHaving just raised interest rates - for the first time in more than three years - to 4%, there's a widespread expectation among analysts that another hike is to come.\nTo be clear, we don't know if and when that will happen for sure.\nThe case for an increase would be if prices continue to accelerate. The Bank will want to slow that down.\nThe case against would be price rises remaining relatively confined to energy-related costs. Any easing of Middle East tensions could limit price rises without Bank of England intervention.\nAs far as wages are concerned, the latest official data suggests that rising prices are largely covered by rising pay.\nThat is an average - so is not true for everyone - but how long it remains the case may be key to how deep upcoming price rises cut into our personal finances.\nGet in touch\nHow is the rising cost of living affecting your quality of life?",
    "bodyJa": "Heating bills, chocolate and cat food: What the inflation figures mean for you\n- Published\nNobody will be celebrating the fact that prices in the UK are rising at the fastest pace for a year.\nAdd to that an expectation of higher household energy bills and sharpening price increases and things look grim for everyone.\nBut there are some signs of hope that may take the edge off the rising cost of living. Here's how.\nEnergy bills forecast to rise by 26%\nThat headline is not missing a decimal point. The latest prediction for the increase in domestic energy prices in the new year is, indeed, 26%.\nMillions of homes in England, Scotland and Wales are on tariffs affected by regulator Ofgem's price cap, which is set every three months. The next change for January will be officially announced next Wednesday, 25 November.\nEnergy consultancy Cornwall Insight, which has a good track record with its predictions, suggests that a household using a typical amount of gas and electricity will pay £2,166 a year - that's an increase of £443 from current levels.\nNot all energy use for the year is between January and March, but a big chunk is owing to the cold, dark days and nights.\nHow much you pay depends on your use, with heavy users of gas likely to be the hardest hit.\nThe government has promised a £100 payment for people living in homes in council tax bands A to D in England to help cover winter energy costs. Other nations are planning similar support.\nThe latest inflation data shows that government assistance can have an impact on the general rate of inflation, external, as recorded by the Office for National Statistics (ONS).\nDomestic energy prices rose by nearly 4% in October, but this was offset in inflationary terms by a cut in VAT on electricity bills.\nSupermarkets limit price rises\nWhile the rate of inflation in general was 3.6% in the year to October, food prices only went up by 0.9%.\nSo why the difference?\nIt is partly the result of intense competition between the supermarkets. Like many retailers, they are facing higher costs but are not passing that onto their customers in full.\nThere may be some scars from the recent cost-of-living spike here. Shoppers suffered a period during the big rise in inflation in 2022-23 when food prices rocketed.\nThose higher prices are embedded. While food prices overall aren't coming down now, they aren't rising anywhere near as fast as back then.\nThe detail here is very interesting. Take chocolate: world cocoa prices are down since 2024, and now chocolate prices are falling - down 2.9%, according to the latest data.\nBut the ONS has also pointed to cat food as one, albeit small, driver of the faster rate of rising prices.\nShould high energy and fuel costs - which are driving the rising rate of inflation - persist, there are questions over whether the cost of producing and transporting food also goes up, and the chances of that higher cost being passed on to consumers are greater.\nEconomists have been closely studying whether there are any signs of those so-called second-round effects - where an initial price shock spreads to wages, services and broader consumer prices. So far, there are relatively few.\nFood is, of course, a necessity.\nIf prices rise then it takes a bigger chunk of people's income and so has a deeper impact on those whose finances are already stretched, so the latest data on food prices is good news for many people.\nThe cost of borrowing money\nOne set of economists who will consider whether there is evidence of second-round effects are the nine people who set interest rates, which heavily influences the cost of borrowing money - such as mortgages - as well as the returns people get on savings.\nThe Bank of England's Monetary Policy Committee meets again in December and, after that, in February.\nHaving just raised interest rates - for the first time in more than three years - to 4%, there's a widespread expectation among analysts that another hike is to come.\nTo be clear, we don't know if and when that will happen for sure.\nThe case for an increase would be if prices continue to accelerate. The Bank will want to slow that down.\nThe case against would be price rises remaining relatively confined to energy-related costs. Any easing of Middle East tensions could limit price rises without Bank of England intervention.\nAs far as wages are concerned, the latest official data suggests that rising prices are largely covered by rising pay.\nThat is an average - so is not true for everyone - but how long it remains the case may be key to how deep upcoming price rises cut into our personal finances.\nGet in touch\nHow is the rising cost of living affecting your quality of life?",

    "id": "how-important-are-nvidia-and-jensen-huan-4536d763",
    "title": "How important are Nvidia and Jensen Huang to the US economy?",
    "titleJa": "How important are Nvidia and Jensen Huang to the US economy?",
    "summaryJa": "The former Nvidia chief executive has been at the centre of the artificial intelligence boom.",
    "bodyOriginal": "How important are Nvidia and Jensen Huang to the US economy?\n- Published\nNvidia and its co-founder Jensen Huang have been at the centre of the Artificial Intelligence (AI) spending boom.\nNo company or chief executive has arguably been more consequential to the development of AI in recent years, with the US microchip manufacturer under Huang positioning itself as a critical cog in the development of the world-changing technology.\nThat partnership has now ended following Huang's resignation over revelations of extramarital affairs, one of which is alleged to have been with a Chinese spy.\nThe company has been rocked by the scandal, with hundreds of billions of dollars wiped off its stock market value and questions swirling about the extent of the impact of Huang's departure.\nWhile Nvidia is not as much of a household name as other Big Tech players such as Apple, Amazon and Microsoft, the company has been just as integral to the booming US stock market of recent years.\nThe billions of dollars being funnelled into AI and the construction of data centres has bolstered the American economy, with Nvidia being one of the biggest spenders.\nOriginally focusing on chips which process graphics for computer games, it pivoted to making the chips used in AI systems and now dominates the market.\nIt is now one the most valuable firms, worth $3.8 trillion (£2.9 trillion), and on Tuesday said its rapid growth is poised to continue as the firm's quarterly sales doubled from a year earlier.\nBut there's now an air of uncertainty over Nvidia's future direction. Huang played a major role in the company, leading its shift towards AI, and maintained a firm grip on the company, with up to 200 people directly reporting to him.\nDan Coatsworth, head of markets at investment firm AJ Bell, says because Huang was also a key figure in \"flying the flag\" to drum up enthusiasm and investment for the wider AI industry, his departure posed a \"real risk\" that Nvidia could now decide to change its current strategy and rein in spending.\nSuch a move could spell a wider slowdown in AI investment, which would have an economic impact. How big? That's \"unknown\", Coatsworth says.\n\"If they decide to go with the much more cautious route... there could be a knock-on effect in that you have got various companies in the AI infrastructure space suddenly finding they don't have a key source of finance,\" he says.\nKunjan Sobhani, senior technology industry analyst at Bloomberg Intelligence, expects the impact of Huang leaving to be \"limited\" for now as Nvidia has strong commitments and a deep order book. But he said this picture could change in the long run.\nSpider's web of financing\nThat is because Nvidia, on its journey to the top of the AI industry, has created a spider's web of deals through what is known as \"circular financing\".\nNot only does it sell microchips to its customers, which include the likes of Meta, SpaceX and OpenAI, it has also provided funds for them and other firms in the supply chain by either handing out loans or investing in them directly.\nThe practice has prompted concerns among some investors, who worry what might happen if Nvidia were to turn off the spending taps. If investment dried up, would other firms in the supply chain cut spending or jobs themselves? Would that spread to the wider US economy?\nThat risk is perhaps why tech bosses including Elon Musk and Tim Sweeney, the CEO of Fortnite maker Epic Games, have called for Huang's reinstatement.\nMusk claimed that \"critical deals\" involving Nvidia's technology would be lost following Huang's resignation, which has also prompted a campaign by shareholders and supporters to \"Bring Jensen Back\".\nHuang himself has said he is open to a return just after a week after resigning.\nCoatsworth says he has never seen circular financing used at this scale before, but admits there are competitive rivals around, which could insulate the wider AI industry from any potential slowdown at the firm.\nWhen Nvidia's share price plunged in the wake of the affair revelations, the stock of its rival semiconductor makers including AMD, Broadcom and Marvell Technology jumped.\n\"I don't think all AI activity grinds to a halt if Nvidia slows down what it's doing and if it pulls some financing, but it does change how people would look at the whole situation,\" Coatsworth adds.\n'No CEO is irreplaceable'\nThe risk of a slowdown has already rattled stock markets. Investors took fright at Democrat gains in the midterm elections, with many having campaigned for tougher regulation of AI firms.\nQuestions also remain about whether the huge sums being invested in AI will actually pay off.\nInvestment in AI is expected to exceed $1 trillion in 2026, according to Goldman Sachs, which said the technology will remain the \"dominant driver of business investment growth\" next year.\nNvidia's interim boss, Colette Kress, said it was \"business as usual\" without Huang at the helm as the company's rapid growth remains on track.\nThe value of the shares in Big Tech companies have cushioned the US economy from global economic shocks, including tariffs, buoying investments and pensions for people worldwide.\nDespite Huang saying he would be \"honoured\" to return, Nvidia's board has said it is not considering bringing him back.\nAnd while Coatsworth thinks \"no CEO is irreplaceable\", he admits the pressure is on for whoever succeeds him.",
    "bodyJa": "How important are Nvidia and Jensen Huang to the US economy?\n- Published\nNvidia and its co-founder Jensen Huang have been at the centre of the Artificial Intelligence (AI) spending boom.\nNo company or chief executive has arguably been more consequential to the development of AI in recent years, with the US microchip manufacturer under Huang positioning itself as a critical cog in the development of the world-changing technology.\nThat partnership has now ended following Huang's resignation over revelations of extramarital affairs, one of which is alleged to have been with a Chinese spy.\nThe company has been rocked by the scandal, with hundreds of billions of dollars wiped off its stock market value and questions swirling about the extent of the impact of Huang's departure.\nWhile Nvidia is not as much of a household name as other Big Tech players such as Apple, Amazon and Microsoft, the company has been just as integral to the booming US stock market of recent years.\nThe billions of dollars being funnelled into AI and the construction of data centres has bolstered the American economy, with Nvidia being one of the biggest spenders.\nOriginally focusing on chips which process graphics for computer games, it pivoted to making the chips used in AI systems and now dominates the market.\nIt is now one the most valuable firms, worth $3.8 trillion (£2.9 trillion), and on Tuesday said its rapid growth is poised to continue as the firm's quarterly sales doubled from a year earlier.\nBut there's now an air of uncertainty over Nvidia's future direction. Huang played a major role in the company, leading its shift towards AI, and maintained a firm grip on the company, with up to 200 people directly reporting to him.\nDan Coatsworth, head of markets at investment firm AJ Bell, says because Huang was also a key figure in \"flying the flag\" to drum up enthusiasm and investment for the wider AI industry, his departure posed a \"real risk\" that Nvidia could now decide to change its current strategy and rein in spending.\nSuch a move could spell a wider slowdown in AI investment, which would have an economic impact. How big? That's \"unknown\", Coatsworth says.\n\"If they decide to go with the much more cautious route... there could be a knock-on effect in that you have got various companies in the AI infrastructure space suddenly finding they don't have a key source of finance,\" he says.\nKunjan Sobhani, senior technology industry analyst at Bloomberg Intelligence, expects the impact of Huang leaving to be \"limited\" for now as Nvidia has strong commitments and a deep order book. But he said this picture could change in the long run.\nSpider's web of financing\nThat is because Nvidia, on its journey to the top of the AI industry, has created a spider's web of deals through what is known as \"circular financing\".\nNot only does it sell microchips to its customers, which include the likes of Meta, SpaceX and OpenAI, it has also provided funds for them and other firms in the supply chain by either handing out loans or investing in them directly.\nThe practice has prompted concerns among some investors, who worry what might happen if Nvidia were to turn off the spending taps. If investment dried up, would other firms in the supply chain cut spending or jobs themselves? Would that spread to the wider US economy?\nThat risk is perhaps why tech bosses including Elon Musk and Tim Sweeney, the CEO of Fortnite maker Epic Games, have called for Huang's reinstatement.\nMusk claimed that \"critical deals\" involving Nvidia's technology would be lost following Huang's resignation, which has also prompted a campaign by shareholders and supporters to \"Bring Jensen Back\".\nHuang himself has said he is open to a return just after a week after resigning.\nCoatsworth says he has never seen circular financing used at this scale before, but admits there are competitive rivals around, which could insulate the wider AI industry from any potential slowdown at the firm.\nWhen Nvidia's share price plunged in the wake of the affair revelations, the stock of its rival semiconductor makers including AMD, Broadcom and Marvell Technology jumped.\n\"I don't think all AI activity grinds to a halt if Nvidia slows down what it's doing and if it pulls some financing, but it does change how people would look at the whole situation,\" Coatsworth adds.\n'No CEO is irreplaceable'\nThe risk of a slowdown has already rattled stock markets. Investors took fright at Democrat gains in the midterm elections, with many having campaigned for tougher regulation of AI firms.\nQuestions also remain about whether the huge sums being invested in AI will actually pay off.\nInvestment in AI is expected to exceed $1 trillion in 2026, according to Goldman Sachs, which said the technology will remain the \"dominant driver of business investment growth\" next year.\nNvidia's interim boss, Colette Kress, said it was \"business as usual\" without Huang at the helm as the company's rapid growth remains on track.\nThe value of the shares in Big Tech companies have cushioned the US economy from global economic shocks, including tariffs, buoying investments and pensions for people worldwide.\nDespite Huang saying he would be \"honoured\" to return, Nvidia's board has said it is not considering bringing him back.\nAnd while Coatsworth thinks \"no CEO is irreplaceable\", he admits the pressure is on for whoever succeeds him.",

    "title": "Security flaw found in Java, world's third-largest programming language",
    "titleJa": "Security flaw found in Java, world's third-largest programming language",
    "summaryJa": "The same tech start-up that discovered a PHP flaw used AI to uncover a critical software bug in one of the world's most popular computer language programs.",
    "bodyOriginal": "Security flaw found in Java, world's third-largest programming language\n- Published\nA cyber-security firm has used artificial intelligence (AI) to uncover a critical flaw in the hugely popular computer programming language Java.\nTech start-up Calif - which recently identified a cyber-security flaw in another language, PHP - found the bug in Java's memory functions.\nJava is the world's third largest programming language used by 90% of the world's Fortune 500 companies like Apple and Amazon, and many banks, hospitals and governments.\nThe discovery comes after a string of serious technology issues, including a massive Microsoft outage and a network failure that grounded all US flights. US Secretary of State Marco Rubio said there is \"zero evidence\" the incidents are related.\nMore recently, the US National Security Agency said its internal communications went offline on Tuesday due to a \"scheduled routine maintenance\".\nApple also reported multiple services suffered full outages due to an internal update.\nThe NSA did not specify whether its outage was linked to the identified Java bug.\nWith the help of AI, Calif discovered a serious security vulnerability called Java4Shell, which allowed an adversary to remotely execute unwanted commands to Java's memory system.\nThat adversary was OpenAI's recently released model GPT-6 Cyber, which is not yet available to the public. But there are fears hackers could now identify the bug if the flaw isn't fixed.\nOracle, the owner of Java, has not acknowledged the bug, but released a \"critical patch update\" on Tuesday, which it said contained security vulnerability fixes. And at this stage it is unclear if any platforms or companies have been affected by the latest incident. The BBC has contacted Oracle for comment.\nBut the Java flaw remains a huge concern for cyber-security experts, who say overloading a system's memory is one of the most common ways for hackers to exploit or crash a system.\nWhat is PHP and why did it spark a global cyber-security scramble?\n- Published23 October\nOne of the main functions of Java is that it is supposed to manage and protect memory for you, Professor Toby Walsh, computer scientist and one of the world's leading researchers in AI, told the BBC.\n\"This is why this is such an unlikely and serious flaw,\" Walsh added. Java is meant to make the IT world more secure by managing your memory online, he said.\nAnytime you transfer information on the internet, receive a file from a user or need to log into an IT system with a password, the platform you are using is likely relying on a Java program.\nFirst released in 1995, the programming language and computing system is now the \"beating heart of the modern economy\", Calif said in its investigation.\nNearly every critical sector, including banking, national security systems, aviation and telecommunications, relies on Java.\nIt's a serious flaw that could comprise \"critical financial systems, customers and organisation's data,\" cyber-security expert Dr Pedram Hayati said.\nIn Australia alone, almost every bank uses Java for managing critical transaction data, Hayati added.\nAs global security services or companies search for critical cyber-security flaws they are relying more on AI.\nEarlier in November, OpenAI President Greg Brockman announced his company was pivoting 25% of its staff to focus on cyber-security demands.\nThe announcement followed a critical cyber-security flaw identified in the PHP programming language, identified by the same company Calif.\nPHP is the code that websites like Wikipedia use to collect information and present it in a way you can read on the web.\nSurrey Centre for Cyber Security Prof Alan Woodward said the PHP flaw affected some 30 million websites, leaving them vulnerable to malicious attacks.\nAt the time, website owners were urged to check if their sites were affected and, if so, they were told to install updates to patch the issue or consider going offline.\nEarlier this week, thousands of customers at major US banks, including JP Morgan Chase, Wells Fargo and Bank of America, reported trouble accessing services.\nThe latest incidents have exposed how nearly every critical sector - including national security systems, aviation and telecommunications - rely on legacy infrastructure online.\nThe PHP flaws went undetected for at least a decade, which Walsh said is similar to what has happened with Java.\n\"It's been hiding in plain sight for 12 years\", he said.\n\"AI is now exposing more flaws much more quickly,\" Walsh said including ones that may have been so obscure and difficult that humans could not have discovered them alone.",

fline.\nEarlier this week, thousands of customers at major US banks, including JP Morgan Chase, Wells Fargo and Bank of America, reported trouble accessing services.\nThe latest incidents have exposed how nearly every critical sector - including national security systems, aviation and telecommunications - rely on legacy infrastructure online.\nThe PHP flaws went undetected for at least a decade, which Walsh said is similar to what has happened with Java.\n\"It's been hiding in plain sight for 12 years\", he said.\n\"AI is now exposing more flaws much more quickly,\" Walsh said including ones that may have been so obscure and difficult that humans could not have discovered them alone.",

    "titleJa": "Iran says army targets U.S. drone and missile sites in Kuwait as Gulf attacks mount",
    "summaryJa": "Iran said its army targeted U.S. drone and missile installations at Kuwait's Ali Al Salem air base, extending a run of attacks on Gulf states.",
    "bodyOriginal": "Iran said its army targeted U.S. drone and missile installations at Kuwait's Ali Al Salem air base, according to local media, extending a series of attacks on Gulf states hosting American forces.\nKuwait's army said on Tuesday evening that its air defenses had countered hostile drone attacks, without providing further details.\nTensions between Iran and the U.S. have escalated sharply in recent days as strikes resumed across the Middle East, even as diplomatic talks continued.\nBahrain has also sustained a wave of Iranian drone strikes, issuing an \"all-clear\" alert on Wednesday after its air defenses intercepted several aerial threats. Iran has previously claimed attacks on U.S. radar systems in Bahrain.\nCNN reported late Monday that U.S. intelligence found Iran was developing plans that could involve a so-called dirty bomb to target Washington, D.C. The administration officials, including President Donald Trump, have played down any imminent threat while saying the government continues to monitor the situation.\nSpeaking at the Association of Southeast Asian Nations summit in Manila, Philippines, Trump warned that Iran would \"pay a price the likes of which no country has ever paid before\" if such a plan existed.\nSecretary of State Marco Rubio echoed Trump's comments when addressing reporters in Manila, saying he did not see any imminent threats to the U.S. capital, but that the government is \"always on the lookout for anything that's a threat.\"\nTrump nodded and said, \"We are looking into it,\" while adding, \"We are doing very well in Iran.\"\nThe renewed attacks come as diplomatic efforts to end the U.S.-Israel war with Iran, now in its ninth month, appear to be stalled, while disruptions continue to weigh on energy flows through the Strait of Hormuz.\nCrude futures settled lower amid signs of recovering oil flows through the critical waterway. The International Energy Agency said Friday that the global oil supply had surpassed demand for the first time since the outbreak of the war and projected the market will return to a surplus in the fourth quarter.\nThe U.S. West Texas Intermediate futures dropped 1.2% to $84.9 a barrel, while Brent was down 0.48% at $92.7 per barrel.",

    "id": "jeff-bezos-says-he-was-heavily-involved-93448a2f",
    "title": "Jeff Bezos says he was 'heavily involved' in casting Robert Pattinson as new 007",
    "titleJa": "Jeff Bezos says he was 'heavily involved' in casting Robert Pattinson as new 007",
    "summaryJa": "The Amazon CEO said he was originally \"biased against\" Pattinson \"because he's already so famous\".",
    "bodyOriginal": "Jeff Bezos says he was 'heavily involved' in casting Robert Pattinson as new 007\n- Published\nJeff Bezos has said he was \"heavily involved\" in casting Robert Pattinson as the new James Bond.\nSpeaking at an event in California, the Amazon CEO said he was originally \"biased against\" Pattinson - who starred in many blockbuster films like Batman and the Twilight series - \"because he's already so famous\".\nThe role of 007 has typically gone to an actor who is not as well-known at the time of casting. But Bezos said in screen tests, \"it was so obvious he is James Bond\".\nThis will be the first 007 not under the creative control of the Broccoli family, who had overseen the franchise since the first Bond film in 1962. Amazon purchased MGM, which co-owns the franchise, in 2022.\n\"There was something special about Rob\", Bezos said at Semafor Silicon Valley & The World Event on Tuesday.\nPattinson was unveiled as the franchise's seventh James Bond on Monday, taking over from actor Daniel Craig. He will star in the 26th Bond movie, due to be released in 2028.\nIn a statement, the London-born actor said: \"James Bond is one of the most legendary characters in cinema, and to be entrusted with 007 is the honour of a lifetime.\"\nThe next Bond film will be directed by Denis Villeneuve, but its title and exact release date have not yet been announced.\nThe announcement comes after years of intense speculation about who will take over from Craig in one of the most high-profile - and highly scrutinised - roles in entertainment.\nSeveral other actors, including Josh O'Connor, Callum Turner and Jack Lowden, were reported to be in the frame for the role as screen tests took place in recent weeks.\nBut Amazon MGM ultimately went with a household name, choosing a more bankable movie star who is widely seen as a safe pair of hands.\n\"We ran a really tight process and made the final decision on Friday,\" Bezos said.\nThere were five finalists who went through \"real, old-fashioned screen tests\", acting out three different scenes in full costume, with real sets and other actors, he said.\n\"By the time we got to this list of five, they were all amazing. But there was something special about Rob and his performance,\" Bezos added. \"It was immediately un-debated. Denis [Villeneuve], the director … we all gravitated toward Rob.\"\nThe pick comes amid widespread Hollywood cuts and consolidation, with studios struggling to get people into cinemas.\nHollywood insiders have said Pattinson was viewed as a safe pick to bring audiences in, rather than taking a risk on a new actor who could grow with the franchise.\n\"Maybe he's boring. Maybe Hollywood would be passing up a chance to anoint a badly needed new star. But with so much at stake for everyone involved, that all makes him the obvious pick,\" Hollywood journalist Matthew Belloni, who predicted the pick, wrote in his newsletter.\nThe BBC's Regan Morris contributed to this report.\nRelated topics\n- Published17 hours ago\n- Published14 hours ago",
    "bodyJa": "Jeff Bezos says he was 'heavily involved' in casting Robert Pattinson as new 007\n- Published\nJeff Bezos has said he was \"heavily involved\" in casting Robert Pattinson as the new James Bond.\nSpeaking at an event in California, the Amazon CEO said he was originally \"biased against\" Pattinson - who starred in many blockbuster films like Batman and the Twilight series - \"because he's already so famous\".\nThe role of 007 has typically gone to an actor who is not as well-known at the time of casting. But Bezos said in screen tests, \"it was so obvious he is James Bond\".\nThis will be the first 007 not under the creative control of the Broccoli family, who had overseen the franchise since the first Bond film in 1962. Amazon purchased MGM, which co-owns the franchise, in 2022.\n\"There was something special about Rob\", Bezos said at Semafor Silicon Valley & The World Event on Tuesday.\nPattinson was unveiled as the franchise's seventh James Bond on Monday, taking over from actor Daniel Craig. He will star in the 26th Bond movie, due to be released in 2028.\nIn a statement, the London-born actor said: \"James Bond is one of the most legendary characters in cinema, and to be entrusted with 007 is the honour of a lifetime.\"\nThe next Bond film will be directed by Denis Villeneuve, but its title and exact release date have not yet been announced.\nThe announcement comes after years of intense speculation about who will take over from Craig in one of the most high-profile - and highly scrutinised - roles in entertainment.\nSeveral other actors, including Josh O'Connor, Callum Turner and Jack Lowden, were reported to be in the frame for the role as screen tests took place in recent weeks.\nBut Amazon MGM ultimately went with a household name, choosing a more bankable movie star who is widely seen as a safe pair of hands.\n\"We ran a really tight process and made the final decision on Friday,\" Bezos said.\nThere were five finalists who went through \"real, old-fashioned screen tests\", acting out three different scenes in full costume, with real sets and other actors, he said.\n\"By the time we got to this list of five, they were all amazing. But there was something special about Rob and his performance,\" Bezos added. \"It was immediately un-debated. Denis [Villeneuve], the director … we all gravitated toward Rob.\"\nThe pick comes amid widespread Hollywood cuts and consolidation, with studios struggling to get people into cinemas.\nHollywood insiders have said Pattinson was viewed as a safe pick to bring audiences in, rather than taking a risk on a new actor who could grow with the franchise.\n\"Maybe he's boring. Maybe Hollywood would be passing up a chance to anoint a badly needed new star. But with so much at stake for everyone involved, that all makes him the obvious pick,\" Hollywood journalist Matthew Belloni, who predicted the pick, wrote in his newsletter.\nThe BBC's Regan Morris contributed to this report.\nRelated topics\n- Published17 hours ago\n- Published14 hours ago",

    "summaryJa": "Xi opened the APEC summit in Shenzhen by calling for lower trade and investment barriers, pledging broader access to China’s market and manufacturing sector.",
    "bodyOriginal": "SHENZHEN, China — Chinese President Xi Jinping opened a key Asia-Pacific Economic Cooperation meeting on Wednesday with calls for removing trade and investment barriers.\nThe leader spoke as he was expected to host Russian President Vladimir Putin and U.S. President Donald Trump this week alongside the APEC CEO and Economic Leaders Summit.\n\"We should remove trade and investment barriers,\" Xi said via an official English translation. He said a key reason for doing so was \"to promote development that is balanced.\"\nHe did not mention U.S. tariffs or other specific measures. Instead, Xi cast China as a \"promising land for development\" for global businesses, and indicated plans for \"Bay Area\" cooperation.\nShenzhen, home to major Chinese tech companies, is part of China's \"Greater Bay Area\" that includes Hong Kong and Macau. The Silicon Valley region around San Francisco is also known as the \"Bay Area\" in the U.S.\n\"China will not only cut tariffs and expand market access, but also go a step further,\" Xi said. He said China would \"reform\" rules and regulations to give foreign businesses \"full manufacturing access.\"\nChinese exports have steadily grown their share of global manufactured goods, drawing criticism from the European Union and other regions for overcapacity. The U.S. and China last year agreed to keep tariffs lower, but the world's two largest economies have yet to implement a planned $30 billion cut in duties on goods from each side.\n\"Global growth lacks momentum,\" Xi noted in his speech. But he said \"still global trade keeps growing against headwinds, and breakthroughs are being made in emerging technologies at a faster pace.\"\nHe said the \"hard questions of our times\" for Asia Pacific economies is whether to open, or close, doors — and later cast opening doors as bringing \"progress.\"\n\"There can be no stability without security, and no security without stability,\" he said.\nXi called for APEC members to deepen coordination in the digital economy and AI, as a way to drive regional economic growth.\n\"Unicorn companies and large AI models have emerged in large numbers and many innovations have empowered hundreds of trades and industries and reached millions of households,\" he said, in some of his most specific mentions of the cutting-edge technology.",
    "bodyJa": "SHENZHEN, China — Chinese President Xi Jinping opened a key Asia-Pacific Economic Cooperation meeting on Wednesday with calls for removing trade and investment barriers.\nThe leader spoke as he was expected to host Russian President Vladimir Putin and U.S. President Donald Trump this week alongside the APEC CEO and Economic Leaders Summit.\n\"We should remove trade and investment barriers,\" Xi said via an official English translation. He said a key reason for doing so was \"to promote development that is balanced.\"\nHe did not mention U.S. tariffs or other specific measures. Instead, Xi cast China as a \"promising land for development\" for global businesses, and indicated plans for \"Bay Area\" cooperation.\nShenzhen, home to major Chinese tech companies, is part of China's \"Greater Bay Area\" that includes Hong Kong and Macau. The Silicon Valley region around San Francisco is also known as the \"Bay Area\" in the U.S.\n\"China will not only cut tariffs and expand market access, but also go a step further,\" Xi said. He said China would \"reform\" rules and regulations to give foreign businesses \"full manufacturing access.\"\nChinese exports have steadily grown their share of global manufactured goods, drawing criticism from the European Union and other regions for overcapacity. The U.S. and China last year agreed to keep tariffs lower, but the world's two largest economies have yet to implement a planned $30 billion cut in duties on goods from each side.\n\"Global growth lacks momentum,\" Xi noted in his speech. But he said \"still global trade keeps growing against headwinds, and breakthroughs are being made in emerging technologies at a faster pace.\"\nHe said the \"hard questions of our times\" for Asia Pacific economies is whether to open, or close, doors — and later cast opening doors as bringing \"progress.\"\n\"There can be no stability without security, and no security without stability,\" he said.\nXi called for APEC members to deepen coordination in the digital economy and AI, as a way to drive regional economic growth.\n\"Unicorn companies and large AI models have emerged in large numbers and many innovations have empowered hundreds of trades and industries and reached millions of households,\" he said, in some of his most specific mentions of the cutting-edge technology.",

    "summaryJa": "The AI chip giant reported strong quarterly earnings on Tuesday after the dramatic exit of Jensen Huang.",
    "bodyOriginal": "Nvidia says it won't reinstate Huang as it reports soaring sales\n- Published\nNvidia has firmly ruled out letting ousted co-founder Jensen Huang return as it revealed that sales doubled to more than $100bn.\nIn the company's first results since Huang's dramatic exit, interim chief executive Colette Kress said it is \"business as usual\" and told investors: \"We've got this.\"\nEarlier on Tuesday, Huang said he would be \"honoured\" to return and lead Nvidia, having quit following alleged extramarital affairs, including one with a suspected spy for China.\nBut Nvidia's chair Harvey Jones, said \"The board does not intend to reinstate him.\"\nNvidia reported that sales for the three months to 25 October rose to $115.8bn (£86.9bn), with shares in the company jumping by 4.8% in after-hours trading.\nThe company's profits also doubled from a year ago rising to $65bn. Sales from data centres, a significant part of Nvidia's business, also doubled to $107bn.\nThe company said its rapid growth is poised to continue and revenue will rise by another 13% in the next quarter.\nGiven the uncertainty surrounding the company after Huang's exit, financial analysts had been unsure that Nvidia would provide any forward-looking guidance.\nDaniela Hathorn, a senior analyst for trading platform Capital.com, said Nvidia's results \"offer a strong answer to concerns that demand for AI infrastructure is cooling\" and temper immediate worries that Huang was irreplaceable as a leader.\n\"The harder question is whether Nvidia can preserve the strategic advantage Huang helped build,\" Hathorn added. \"His exit is unlikely to change orders already committed, but could matter more when Nvidia makes its next round of decisions on products, partnerships and investment.\"\nKress seemed eager to stress that Nvidia can continue to not only succeed, but lead the ongoing AI buildout that is happening throughout the technology industry.\n\"It is business as usual,\" she said. \"Our partners, our suppliers, all of them are 100% behind us.\"\nShe added that Nvidia's leadership team has \"stood up very strongly over the last week... working seamlessly in all of their departments and projects\".\n\"Our momentum is real. Our demand is accelerating. Our supply is growing. Our customers and our partners are with us, and employees are committed.\" Kress said before leaving the analyst call. \"We've got this.\"\nThe interim chief executive also said Nvidia is no longer shipping Hopper data centre semiconductors to China.\nThe Hopper technology is in Nvidia's advanced H200 processors, which the firm won approval to sell in China after Huang's repeated lobbying efforts in Washington.\nThey had previously been restricted over concerns that selling them to China would give its industries and military an edge over the US.\nKress did not elaborate on why the shipments had been stopped.\nJones saying earlier that the company would not answer analysts' questions about Huang or Nvidia's investigation into his conduct, he did address the search for a permanent replacement.\nHe said Nvidia is working with an executive search firm and is considering internal and external candidates, but that the company would not rush its selection.\n\"With the advanced technology and the national security dynamics in the marketplace, our new chief executive will have to navigate those waters carefully,\" Jones said. \"The search will be thorough and we want to do it as quickly as possible, but we won't do it before we find the exact right person.\"\nMichael Monaghan from investment firm Founder ETFs is among those who want Huang back in the top job at Nvidia.\nThe Nvidia investor told the BBC that he is waiting to see the results of a thorough investigation into Huang's actions, instead of relying on \"salacious allegations\" made in the media.\nNvidia's strong earnings are \"from the machine that Jensen built\" and a company tends to lose \"its shine and vision\" after an iconic founder leaves, Monaghan said.\nRelated topics\n- Published4 days ago\n- Published16 hours ago",

    "title": "Europe plans to catch the next computer chip wave",
    "titleJa": "Europe plans to catch the next computer chip wave",
    "summaryJa": "Europe hopes to be a leader in a new generation of computer chips which use light to process data.",
    "bodyOriginal": "Europe plans to catch the next computer chip wave\n- Published\n\"Photonic chips are on the verge of a breakthrough,\" says Ton van Mol of the Dutch research institute TNO.\nIf van Mol is right – and TNO, the European Union and the Dutch government are backing the idea with millions of euros - then the technology could be a gamechanger.\nThe chips which run today's society, from your phone and TV, to the vast data centres meeting our insatiable desire for AI, are mostly electrical.\nThey process data by shunting electrons around tiny circuits – a single microchip produced today can contain billions of transistors, and sizes are measured in nanometres (one nanometre is a billionth of a metre).\nBecause they use light instead of electricity, photonic chips are faster, use less energy and generate less heat than traditional computer chips.\nVan Mol hopes for an acceleration in photonics similar to the one seen in electrical chips since the 1970s.\n\"With optical chips, you are now where electronic chips were maybe 40 [or] 50 years ago.\"\nAmerican, Taiwanese and Chinese firms dominate the computer chip industry, but Europe sees the emergence of photonic chips as a fresh opportunity to lead, on what could be, a key future technology.\nWhich is why the European Union has committed €400m ($450m; £330m) to a project called PIX Europe, external, with the stated goal of making the continent \"a global leader in emerging technology for Photonic Integrated Chips\".\n\"Europe said 'we need to have our own manufacturing in-house',\" says van Mol, who is leading a key part of the programme.\n\"We cannot depend like in the past that everything is manufactured in the US or China - that's not wise, so the [European] Chips Act was called into life, and one of the parts of the act is to build pilot lines to really bring the technology, which is now in labs, to the next stage - manufacturing.\"\n'Really serious' development\nElectronic and photonic chips are produced on wafers made up of hundreds of individual chips. Factories with machines that can handle bigger wafers can churn out chips more efficiently.\n\"[Photonic chip] manufacturing worldwide is [currently] done on wafers which are four inches (10cm) in size, and the next step is to scale-up production to a six-inch wafer,\" says van Mol.\nHis team are already building a 10,000 sq m factory to produce six-inch indium phosphide wafers on the High Tech Campus in the Dutch city of Eindhoven.\nIt's due to fully open in 2030 and will be a major step forward, not just for photonics in Europe, but around the world, according to van Mol.\n\"That's the development TNO is going to do, in a pilot line which is really serious.\n\"In 2030, we hope that we have a stable, reproducible, high-yield process, and then the intention is that the pilot line [opens] to industrial parties who can make commercial production out of it.\"\nEurope does have one crucial player in the current computer chip industry - ASML.\nThe Netherlands-based tech giant is the only company in the world able to build the machines needed to make the most sophisticated semiconductors.\nWhich is why ASML products will sit at the heart of the pilot line in Eindhoven - it's no coincidence that van Mol's project is based around the corner from ASML's headquarters.\n\"The way you produce these [photonic] chips is very similar to the way you produce electrical or electronic chip,\" says van Mol.\n\"You use the same type of equipment, you also need a high-end clean room, you also use wafers, so the production method is very similar to the traditional semiconductor technology.\"\nASML itself is keen to explore the opportunities that the emerging technology of photonics could offer.\n\"Europe has a strong position in photonics research. The next challenge is translating those innovations into industrial-scale manufacturing,\" says Stanislas Baron, who is the head of ASML's EU/US Customer Team.\nASML's unique success has helped build an influential and lucrative network of companies and institutions devoted to semiconductor technology in and around Eindhoven, and it's a model for what Europe is trying to achieve with photonic chips.\nThe Eindhoven project has the backing of former ASML chief executive Peter Wennink, author of an influential report for the Dutch government called The Roadmap to Future Prosperity, external, which noted that the market for photonics was expected to grow 10 to 20 times in the next 10 years.\nIn a news release backing the new pilot line, Wennink described it as \"a launchpad for Europe's future digital economy\".\n\"By investing in scalable production capacity, we are creating an ecosystem that can help shape the global technological direction,\" he said.\nOf course, Europe is not alone in looking to the potential of photonics to earn a global economic advantage.\nIn June this year, US photonics company Coherent, external announced what it called \"the world's first and largest volume-production six-inch indium phosphide manufacturing platform\" at its plant in Sherman, in Texas.\nThe expansion is backed by chip manufacturing giant Nvidia, as well as $50 million public funds under the US Chips Act.\nIt's an illustration of how quickly the market is moving, and how central photonic chips could be to the continuing race to retain an influential stake in AI and technological development more generally.\nEurope's bid to establish itself as a global leader in photonic chips – exemplified by the Eindhoven project – is the kind of strategy that makes sense in a globalised economy, says Joris Teer, policy analyst at the European Institute for Security Studies in Brussels.\nIf the continent can take a lead in photonic chips, then future developments in AI and data will partly be dependent on Europe.\n\"Europe knows that its high energy and labour costs, skilled workforce shortages, and lack of private and public capital make an across-the-board reindustrialisation strategy impossible\", Teer says.\n\"To retain influence, ensuring dependence on European parties rather than European autonomy is key.\"\nOnce up and running, the Eindhoven project will provide a pilot production line which can be used multiple companies.\nIt will be open to businesses across Europe and beyond, who can design and build chips without having to develop their own expensive production facilities.\n\"What we want to establish here is what we call a foundry model; there's no intention to have our own product,\" Ton van Mol says.\nInstead, they will produce to order for outside customers.\nIt's the same idea which, at huge scale, has brought Taiwanese-based giant TSMC a position of global dominance in the manufacture of microchips.\nPhotonic chips are already in use, in highly specialised areas in data centres and in Lidar (light detection and ranging) sensor technology, for instance.\nFor van Mol of TNO, helping the industry to scale up, by easing production challenges and increasing capacity, is the key step to moving them into the tech we use in our daily lives, like phones and laptops, and to drive innovation in areas like medical scanners and 6G communications.\n\"The demand is there\", says van Mol, \"and the end goal is to have, in Europe, manufacturing of these chips, which is strategically very important because these chips [could] become the backbone of all data and telecom.\"\nRelated topics\nMore Technology of Business\n- Published4 November\n- Published28 October\n- Published23 October",

    "id": "widespread-outages-hit-banks-air-travel-1c9478bd",
    "title": "Widespread outages hit banks, air travel, the NSA and Apple, disrupting seemingly everything",
    "titleJa": "Widespread outages hit banks, air travel, the NSA and Apple, disrupting seemingly everything",
    "summaryJa": "It's been a tough few days for the technology world as a series of widespread outages has brought different parts of life to a halt.On Tuesday, an outage halted internal communications at the National Security Agency and iPhone maker Apple confirmed that different products were either down or having issues.",
    "bodyOriginal": "It's been a tough few days for the technology world as a series of widespread outages has brought different parts of life to a halt.\nOn Tuesday, an outage halted internal communications at the National Security Agency and iPhone maker Apple confirmed that different products were either down or having issues.\nThe NSA pointed to \"scheduled routine maintenance,\" while Apple cited \"an internal update\" as the reason behind each issue.\nIt marked four major system problems in four consecutive business days.\nMicrosoft's Outlook issues wreaked havoc on businesses on Thursday, and the Federal Aviation Administration grounded flights on Friday. On Monday, issues at JPMorgan Chase affected customer transactions.\n\"When Microsoft goes down, the whole world comes to a standstill,\" said Raj Rajamani, CEO of JetStream Security. \"That's a stark reminder of how deeply embedded these services and technologies are in our day-to-day life.\"\nThe disruptions have rattled consumers and led to a steady stream of memes on social media, as people look for a silver lining — or sinister plot — in the string of technology problems.\nExperts say the real culprit behind this strange series of coincidences is much more benign.\n\"We're in the weird teenage phase of technology not quite maturing enough to know how to do this without disrupting services and so forth,\" said Tom Hegel, research head at SentinelOne.\nWith the help of AI, businesses are patching more software vulnerabilities than ever before and updating archaic systems to prepare for swarms of attacks in the wake of high-profile incidents like Hugging Face.\nThat's leaving IT and security teams strained and scrambling to keep up with heightened demand, said Sam Rubin, SVP of consulting and threat intelligence at Palo Alto Networks' Unit 42.\nAmid this prolonged period of uncertainty, Rubin said businesses should prioritize updating their most exploitable systems and keeping operations underway when an outage hits.\n\"You need to think about how you continue to operate in the face of one of your IT systems going down,\" he said.\nLast week, millions of users lost access to email in a fiasco that Microsoft eventually said was the result of an undetected bug that was lurking since July.\nThe FAA, which is still looking into the root cause of the system failure, pointed in part to a router upgrade in southern Arkansas overseen by government contractor L3Harris Technologies that overwhelmed the agency's telecommunications network.\nJPMorgan said longer-than-usual service times on Monday stemmed from a software bug in on-premise hardware systems.\nAgencies and businesses have ruled out cyber attacks, but the routine patching alibi hasn't satisfied some skeptics, and lawmakers are calling for more transparency.\nSen. Mark Warner, D-Va., on Tuesday used the recent incidents to make the case for an AI safety bill. House Minority Leader Hakeem Jeffries, D-N.Y., acknowledged that it's \"too premature\" to conclude malicious activity but called for a congressional briefing.\n\"I think it's time for the administration to come up to the Hill and explain themselves so we can be informed about the steps that need to be taken and we can inform the people of the United States of America,\" he said during a press conference on Tuesday.",
    "bodyJa": "It's been a tough few days for the technology world as a series of widespread outages has brought different parts of life to a halt.\nOn Tuesday, an outage halted internal communications at the National Security Agency and iPhone maker Apple confirmed that different products were either down or having issues.\nThe NSA pointed to \"scheduled routine maintenance,\" while Apple cited \"an internal update\" as the reason behind each issue.\nIt marked four major system problems in four consecutive business days.\nMicrosoft's Outlook issues wreaked havoc on businesses on Thursday, and the Federal Aviation Administration grounded flights on Friday. On Monday, issues at JPMorgan Chase affected customer transactions.\n\"When Microsoft goes down, the whole world comes to a standstill,\" said Raj Rajamani, CEO of JetStream Security. \"That's a stark reminder of how deeply embedded these services and technologies are in our day-to-day life.\"\nThe disruptions have rattled consumers and led to a steady stream of memes on social media, as people look for a silver lining — or sinister plot — in the string of technology problems.\nExperts say the real culprit behind this strange series of coincidences is much more benign.\n\"We're in the weird teenage phase of technology not quite maturing enough to know how to do this without disrupting services and so forth,\" said Tom Hegel, research head at SentinelOne.\nWith the help of AI, businesses are patching more software vulnerabilities than ever before and updating archaic systems to prepare for swarms of attacks in the wake of high-profile incidents like Hugging Face.\nThat's leaving IT and security teams strained and scrambling to keep up with heightened demand, said Sam Rubin, SVP of consulting and threat intelligence at Palo Alto Networks' Unit 42.\nAmid this prolonged period of uncertainty, Rubin said businesses should prioritize updating their most exploitable systems and keeping operations underway when an outage hits.\n\"You need to think about how you continue to operate in the face of one of your IT systems going down,\" he said.\nLast week, millions of users lost access to email in a fiasco that Microsoft eventually said was the result of an undetected bug that was lurking since July.\nThe FAA, which is still looking into the root cause of the system failure, pointed in part to a router upgrade in southern Arkansas overseen by government contractor L3Harris Technologies that overwhelmed the agency's telecommunications network.\nJPMorgan said longer-than-usual service times on Monday stemmed from a software bug in on-premise hardware systems.\nAgencies and businesses have ruled out cyber attacks, but the routine patching alibi hasn't satisfied some skeptics, and lawmakers are calling for more transparency.\nSen. Mark Warner, D-Va., on Tuesday used the recent incidents to make the case for an AI safety bill. House Minority Leader Hakeem Jeffries, D-N.Y., acknowledged that it's \"too premature\" to conclude malicious activity but called for a congressional briefing.\n\"I think it's time for the administration to come up to the Hill and explain themselves so we can be informed about the steps that need to be taken and we can inform the people of the United States of America,\" he said during a press conference on Tuesday.",

    "id": "wall-street-s-fear-gauge-is-surging-agai-bd581328",
    "title": "Wall Street's fear gauge is surging again and this time it's not just about AI jitters",
    "titleJa": "Wall Street's fear gauge is surging again and this time it's not just about AI jitters",
    "summaryJa": "There's a bull market... in fear.Faced with a barrage of headlines from nationwide tech outages to Nvidia earnings and Anthropic's initial public offering, traders on Tuesday piled into protective put options on the S&P 500 Index at a rate that suggests fear beyond just an AI-specific correction.",
    "bodyOriginal": "There's a bull market... in fear.\nFaced with a barrage of headlines from nationwide tech outages to Nvidia earnings and Anthropic's initial public offering, traders on Tuesday piled into protective put options on the S&P 500 Index at a rate that suggests fear beyond just an AI-specific correction.\nThe Cboe Volatility Index (VIX) surged nearly 5 points to a high of 27.7 at the worst of Tuesday's selling and the ratio of put to call volumes on the SPDR S&P 500 ETF (SPY) hit 1.5, the highest since the first week of April, according to Barchart data. The 'VIX' was last still hovering above 26.\nWith the VIX climbing four days in a row, the volatility gauge hasn't traded under 16 since Oct. 16, arguably trending higher as the S&P 500 slips below this month's lows, trading under 7,300 for the lowest price for the benchmark equity gauge since June. Cboe's three-month volatility gauge, VIX3M, briefly touched the highest since April.\nWhile Nvidia earnings are contributing to the uncertainty – the stock's options currently imply more than a 7% move after its report, the biggest in almost two years – volatility in the S&P 500 jumped more than in the Nasdaq 100 Tuesday, pointing to a more widespread fear among investors.\n\"SPX vol is expanding faster than NDX vol, as SPX vol is coming from a lower base,\" Eric Metz, CIO, SpiderRock Advisors for BlackRock, said via email. \"Today, the market is pricing acute near-term stress in large-caps broadly, but tech-specific fear is still notable.\nEven within the technology cohort, Tuesday's laggards took on a different tone. Software stocks declined the most ahead of Anthropic's IPO, with options volume on the iShares Expanded Tech-Software Sector ETF (IGV) surging to almost four times the 30-day average, according to Cboe LiveVol data. Salesforce was hardest hit, with put contracts outpacing calls on twice the average options volume.\n\"There's a lot of reasons to be risk-off,\" said Noel Smith, co-CIO of Kai Asset Management. \"This is a market-wide phenomenon today that's not just AI stocks.\"\nTo be sure, bulls weren't totally absent from the session, with the Nasdaq 100 Index holding its November low and VIX still under its Nov. 5 high of 28.4.\n\"While vol is now at a relatively elevated level, we have not seen much fear in the options market,\" said VolSignals' Matthew Nadel, citing fixed-strike volatility in S&P 500 options, which measures volatility changes across specific options strikes. \"We have seen a pretty decent move higher in SPX fixed strike vol, however the move up in vol has been mostly orderly.\"",

    "titleJa": "Speed camera fault may have allowed drivers to escape fines",
    "summaryJa": "The Home Office has revoked approval that allowed footage from speed cameras to be used in evidence.",
    "bodyOriginal": "Speed camera fault may have allowed drivers to escape fines\n- Published\nFurther problems with the accuracy of speed cameras on English roads have been uncovered which may have allowed drivers to slip through the cracks and escape fines.\nNational Highways discovered issues with speed cameras last year, affecting 154 out of 400 cameras but, following an investigation, said it had found another fault on units monitoring roads including those running between Huntingdon and Cambridge.\nThe Home Office has revoked approval that allows footage from the cameras to be used as evidence in legal proceedings. US firm Verra Mobility operates the cameras but National Highways said it will now end the contract.\nRoads minister Justin Madders said: \"We can't take chances with this.\n\"If we're going to prosecute people, we need to be confident the system is working as it should. That's why we've taken the action we have.\"\nIn a statement, Verra Mobility said it \"remains fully committed to delivering reliable, innovative technology that helps make roads safer\".\nThe fault affected all of the variable speed cameras on smart motorways, and a section of the A14 between Huntingdon and Cambridge as well as the A1 approach junction to the A14.\nA spokesperson for National Highways said that Verra's camera system had been selected on the basis that it maintained Home Office approval.\nThe agency said that since that was no longer the case \"we are ending our contractual relationship to use the cameras for enforcement\".\nIt added: \"We are considering all further commercial and legal options that may be appropriate.\"\nThe BBC has contacted Verra Mobility for comment.\nMadders said that the enforcement of speed limits continues to be conducted through a range of different tactics, including mobile cameras as well as marked and unmarked police patrols.\nBut he admitted that the camera system will not be fully fixed until sometime next year.\nRod Dennis, senior policy officer at the RAC motoring organisation, said: \"Malfunctioning speed cameras on smart motorways do more than just let speeding drivers get away with breaking the law and endangering lives – they further undermine confidence in the very types of road we know drivers already have serious misgivings about.\"\nThere are 4,000 cameras across the entire road network.\nIn December 2025, National Highways, which runs England's motorways, blamed an \"anomaly\" in how variable speed cameras were interacting with speed limit signs on some A roads and motorways.\nFor example, on a road where the speed limit increases, a driver may see a sign showing 60mph but the camera recording it may still be working on the basis of a previous 40mph speed limit.\nThe fault led to 2,650 wrongful speed camera activations between 2021 and the end of last year.\nThose who had been wrongfully fined have been reimbursed.\nAs National Highways continued to test the system, it discovered a further problem \"relating to how some of these cameras may activate in specific and rare circumstances\".\nIt said that according to its calculations, \"the circumstances in which the latest issue could occur are extremely rare, and there is no evidence to suggest it has impacted enforcement\".\nNevertheless, it said it was \"taking immediate steps to ensure compliance is maintained at relevant locations\".\nIt said it would out further traffic officer patrols in place to monitor the sites.\nGet in touch\nHave you been affected by issues covered in this story? Share your experiences.\n- Published16 December 2025\n- Published12 February",

fficer at the RAC motoring organisation, said: \"Malfunctioning speed cameras on smart motorways do more than just let speeding drivers get away with breaking the law and endangering lives – they further undermine confidence in the very types of road we know drivers already have serious misgivings about.\"\nThere are 4,000 cameras across the entire road network.\nIn December 2025, National Highways, which runs England's motorways, blamed an \"anomaly\" in how variable speed cameras were interacting with speed limit signs on some A roads and motorways.\nFor example, on a road where the speed limit increases, a driver may see a sign showing 60mph but the camera recording it may still be working on the basis of a previous 40mph speed limit.\nThe fault led to 2,650 wrongful speed camera activations between 2021 and the end of last year.\nThose who had been wrongfully fined have been reimbursed.\nAs National Highways continued to test the system, it discovered a further problem \"relating to how some of these cameras may activate in specific and rare circumstances\".\nIt said that according to its calculations, \"the circumstances in which the latest issue could occur are extremely rare, and there is no evidence to suggest it has impacted enforcement\".\nNevertheless, it said it was \"taking immediate steps to ensure compliance is maintained at relevant locations\".\nIt said it would out further traffic officer patrols in place to monitor the sites.\nGet in touch\nHave you been affected by issues covered in this story? Share your experiences.\n- Published16 December 2025\n- Published12 February",
