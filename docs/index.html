    "id": "france-is-flashing-euro-crisis-signals-t-159dffae",
    "title": "France is flashing euro crisis signals. This time, the fault lines are different",
    "titleJa": "France is flashing euro crisis signals. This time, the fault lines are different",
    "summaryJa": "French borrowing costs have surged as debt and political risks mount, raising questions over whether the stress could spread across the euro zone.",
    "bodyOriginal": "As France's economic and political woes mount, investors are asking whether the country's debt problems risk contaminating the rest of the euro zone.\nMarkets are flashing alarm bells over the euro zone's second-biggest economy. The euro has remained under pressure, falling almost 5% against the dollar since the start of the year.\nFrance's benchmark borrowing cost, the yield on its 10-year bond, rose above 5% for the first time since 2002 this week before moving sharply higher.\nMeanwhile, the spread between French and German 10-year bond yields — a closely watched metric of distress — reached more than 170 basis points on Thursday for the first time since the euro zone debt crisis of the early 2010s. The cost of insuring the French government against default, as measured by credit default swaps, is also the highest since that period.\nEuro zone contagion\nThe big concern is fragmentation, when countries that share a currency face sharply different borrowing costs, compounding market stress and risking spiraling debt repayments for the worst-impacted countries.\nAs the euro zone sovereign debt crisis of the early 2010s showed, market stress in one country can spread rapidly through economies that share a currency and a central bank but retain separate fiscal systems. The crisis began in Greece before spreading to countries including Portugal, Ireland, Italy and Spain.\nGovernments were expected to rescue struggling banks, which held large amounts of sovereign debt, creating a vicious cycle.\nThe crisis only eased after rescue programs tied to sweeping austerity measures, and ECB President Mario Draghi pledged in 2012 to do \"whatever it takes\" to preserve the euro.\nEconomists are warning that a new vicious cycle is being created — not only in France but in big economies from the U.S. to the U.K. — as investor concern over rising government debt pushes up yields and interest costs, which in turn add to the debt burden.\nA slowdown in bond purchases raises \"the specter that the government will be forced into default because it simply doesn't have the cash to pay interest and principal on its debt,\" Nobel laureate Paul Krugman wrote in a blog on Oct. 8.\n\"Fear of default then leads to even more capital flight, which increases fears of default and the interest rate,\" he said.\nFrance's debt risks\nFrance in particular has one of the highest deficit-to-GDP ratios in the 21-nation euro area and a growing national debt pile. Its economy has slowed to a crawl, with the government cutting its 2026 growth forecast to just 0.5%.\nThose fiscal strains come as political volatility and social unrest raise doubts about the government's ability to deliver measures aimed at stabilizing the public finances.\n\"We are deep into French crisis territory,\" Carsten Brzeski, ING's global head of macro research and chief euro zone economist, said by email.\n\"There is no risk of an imminent liquidity issue for the French government but the lack of trust of bond markets and the ongoing crisis should finally bring a high sense of urgency to Paris.\"\nJohn Stopford, head of multi-asset income at Ninety One, said France has gone from being a core or semi-core European country for fixed income investors to increasingly being considered on the periphery, which he labeled \"bizarre\" given the history of France in relation to the EU and its economic power in the continent.\n\"We as investors, have just chosen for the time being to pretty much avoid all of the non-core countries in Europe – it's too fluid a situation with too much uncertainty to really want to get involved,\" Stopford said on a call.\nWhy 2026 is different\nNonetheless, analysts CNBC spoke to broadly agreed that reforms meant that even if the market is behaving in similar ways to the post-financial crisis period, the contagion risk remained limited this time around.\nNinety One's Stopford said spreads would likely need to be trading \"in the 200s\" before the situation is broadly perceived as a genuine crisis — but, he added, that the situation in France \"doesn't look great.\"\n\"French spreads are now wider than they were at the peak of the peripheral crisis of the early 2010s, but they're still much narrower than the extreme levels that we saw in Spain, Italy, Greece and Ireland back then, so... I think the market's assumption is that things will need to get worse before we get to a point where EU institutions start to look to try and limit further damage,\" he told CNBC.\nBlackRock strategists noted the current environment is \"materially different\" to the one that preceded the 2011 to 2012 euro zone debt crisis, with the region now better equipped to weather financial stress, but they added that \"further volatility and spillovers remain possible.\"\n\"The French bond sell-off illustrates how competition for capital is reshaping fixed income markets amid a global rate reset,\" they wrote. \"Rising government borrowing and AI-related investment are pushing up financing costs, exposing borrowers with deteriorating fundamentals to greater scrutiny.\"\nGeorge Lagarias, chief economist at Forvis Mazars, said France was already in a debt crisis, citing its debt-to-GDP ratio of 119% at the end of the second quarter of 2026 — close to Greece's of 128% in late 2009.\nA spillover would mean a wider French-German yield spread followed by higher credit default swap prices – the cost of insuring debt, he said.\n\"Italy, Spain, would see higher borrowing costs, and have to curtail fiscal expenditures, possibly raising political backlash in their own countries,\" he told CNBC. \"The European periphery would come under tremendous pressure, even if their finances are in much better order than a few years ago.\"\nHowever, Lagarias said crucial structural differences minimize the risk of a wider spillover akin to the early 2010s, which he estimated at 10% to 20%.\n\"Greece had a very bad trade deficit. France also has a trade deficit, but the numbers are much more benign,\" he said by email.\nHe added that the Insee, France's national statistics body, was \"not likely to lie about the deficit\" and contrasted this with Greece.\nIn 2009, Greece sharply revised its projected budget deficit from 3.7% of GDP in the spring to 12.5% by October, undermining confidence in the reliability of its public finances and helping accelerate the crisis.\n\"[French] debt levels are worrying but known. Markets can deal with known risks. They hate surprises,\" Lagarias added. \"What sunk Greece was a deficit that was suddenly revealed to be five-fold versus the official estimate. This catalysed a crisis.\"\nAlex Everett, investment director for rates management at Aberdeen Investments, agreed that the current environment should be treated \"primarily as French risk rather than a systemic euro-area risk.\"\n\"Compared to the early 2010s, the Eurozone has stronger banks, greater integration and numerous tools designed to limit the risk of sovereign fragmentation,\" he said. \"I anticipate contagion to be short-lived.\"",

numbers are much more benign,\" he said by email.\nHe added that the Insee, France's national statistics body, was \"not likely to lie about the deficit\" and contrasted this with Greece.\nIn 2009, Greece sharply revised its projected budget deficit from 3.7% of GDP in the spring to 12.5% by October, undermining confidence in the reliability of its public finances and helping accelerate the crisis.\n\"[French] debt levels are worrying but known. Markets can deal with known risks. They hate surprises,\" Lagarias added. \"What sunk Greece was a deficit that was suddenly revealed to be five-fold versus the official estimate. This catalysed a crisis.\"\nAlex Everett, investment director for rates management at Aberdeen Investments, agreed that the current environment should be treated \"primarily as French risk rather than a systemic euro-area risk.\"\n\"Compared to the early 2010s, the Eurozone has stronger banks, greater integration and numerous tools designed to limit the risk of sovereign fragmentation,\" he said. \"I anticipate contagion to be short-lived.\"",

    "title": "U.S. oil holds above $100, Brent at five-month high as Iran says it’s prepared for warfare",

    "summaryJa": "U.S. President Donald Trump accused Iran on Thursday of trying to manipulate the oil market.",
    "bodyOriginal": "Crude oil futures ticked higher on Friday, with global benchmark Brent crude hovering at a five-month high.\nBy 6:51 a.m. ET, front-month Brent crude oil futures were 1.1% higher at $114.49 per barrel. U.S. West Texas Intermediate crude futures were up 1.6% to trade at $101.04 a barrel.\nBrent futures were on track for a weekly rise of 3.3%, putting the contracts on course for their third consecutive week of gains. They were also trading at their highest since early May.\nWTI futures were on track for a weekly decline of 1.1%, putting the contracts on course to snap two consecutive weeks of gains.\nTraders are continuing to monitor developments in the Middle East.\nOn Thursday, U.S. President Donald Trump accused Iran of lying about attacks on ships transiting the Strait of Hormuz.\n\"Iran is doing everything they can to drive up the price of Oil prior to the U.S. Midterm Election,\" he wrote on Truth Social. \"They are even making up fake hits, mines, and everything else, because more Oil is coming through the Hormuz Strait now than it did even prior to the beginning of the Conflict.\"\nIran's Islamic Revolution Guards Corps said Thursday that four vessels had been struck and caught fire in the Persian Gulf, according to the Iranian state-affiliated Tasnim news agency, while a further three had struck mines in the Strait of Hormuz.\nSeparately, Iran's army chief was reported to have said the country's military is fully prepared for \"asymmetric warfare\" after strengthening its capabilities.\nIn Saudi Arabia, oil giant Saudi Aramco reportedly told staff to evacuate its Dhahran headquarters and work remotely following a series of attacks by Iran-backed Houthi rebels, Reuters reported.\nThe Houthis have launched strikes on Saudi airports and some Aramco offices in recent weeks, resulting in multiple fatalities.",

    "id": "earnings-limit-of-up-to-140k-for-first-t-56333c4f",
    "title": "Earnings limit of up to £140K for first-time buyers loan scheme",
    "titleJa": "Earnings limit of up to £140K for first-time buyers loan scheme",
    "summaryJa": "The Your First Home scheme will offer government-backed loans for those buying new-builds in England.",
    "bodyOriginal": "Earnings limit of up to £140K for first-time buyers loan scheme\n- Published\nThe government is expected to allow households earning up to £110,000 to apply for its new loan scheme to help first-time buyers in England.\nAs first reported by The Times, external, a higher earnings limit of £140,000 is expected to apply to those purchasing properties in London.\nThe Your First Home scheme will offer government-backed equity loans worth 20% of new-build properties purchased from participating developers.\nThe loans, which will also be subject to an initial interest-free period, are designed to help people buy a home with deposits as low as 2.5%.\nPrevious schemes to help first-time buyers did not restrict eligibility by income but faced criticism for stoking house prices by allowing relatively wealthy households to borrow more.\nUnveiling the Your First Home Scheme at last month's Labour conference, Prime Minister Andy Burnham said it would focus on those who \"really need support\".\nDetails of the changes, including salary caps, are due to be confirmed at next week's Budget.\nThe Times reported that ministers had initially decided to set the earnings limits at £90,000 for homes outside outside London and £110,000 in the capital, before concluding this would deny access to too many middle-earning couples, such as teachers and nurses.\nThe government has also argued that the scheme will help to boost housebuilding, after ministers conceded they are set to miss a target to build 1.5 million homes in England by the next election.\nHelp to Buy\nLabour has said the scheme will be funded by within existing government budgets, but is yet to provide details of which other areas will see their spending cut.\nDevelopers taking part in the scheme will also be asked to contribute towards running costs.\nLike the Help to Buy scheme launched under the Conservative-Liberal Democrat coalition government, the scheme will use equity loans, which are linked to changes in the value of properties they are used to purchase.\nThat scheme, which initially ran between 2013 and 2021, enabled all home purchasers to put down a 5% deposit on a newly built home worth up to £600,000.\nUp to 20% of the cost of the home was funded by a shared equity loan, which was interest-free for the first five years.\nA second version of that scheme, which ran from 2021 to 2023, restricted access to first-time buyers and applied regional-level price caps to the properties could be bought under the programme.\nRelated topics\n- Published27 September\n- Published15 April",

he value of properties they are used to purchase.\nThat scheme, which initially ran between 2013 and 2021, enabled all home purchasers to put down a 5% deposit on a newly built home worth up to £600,000.\nUp to 20% of the cost of the home was funded by a shared equity loan, which was interest-free for the first five years.\nA second version of that scheme, which ran from 2021 to 2023, restricted access to first-time buyers and applied regional-level price caps to the properties could be bought under the programme.\nRelated topics\n- Published27 September\n- Published15 April",

    "title": "Democratic socialist set to become D.C. mayor — and face Trump's pushback",
    "titleJa": "Democratic socialist set to become D.C. mayor — and face Trump's pushback",
    "summaryJa": "Following Zohran Mamdani's election as New York City mayor, another democratic socialist is set to become mayor of Washington, D.C.",
    "bodyOriginal": "Zohran Mamdani famously brought democratic socialism to the largest U.S. city when he became New York's mayor. Now another member of the Democratic Party's progressive flank is poised to lead Washington, D.C.\nJaneese Lewis George, a member of the Democratic Socialists of America and a city council member, is set to become the next mayor of the nation's capital, which has been led for more than a decade by Democratic Mayor Muriel Bowser. Lewis George defeated moderate Democrat Kenyan McDuffie in the June Democratic primary and will face off against independent and Green Party candidates in November in an election that is all but decided in the overwhelmingly Democratic city.\nAs she prepares to take office, looming questions remain about how much she will be able to accomplish in a city that's home to the federal government, which has significant authority over its governance, and whether her leadership will be primarily symbolic under the larger government's thumb.\nHer supporters, however, hope she will stand up to President Donald Trump, as she pledged she would do during her campaign. Trump has previously federalized the city's police department and has deployed thousands of National Guard troops for the past 14 months across Washington, with plans to keep them in place until his term ends in 2029.\n\"Myself and basically every other D.C. resident I know, we don't take kindly to threats from the federal government on our ability to self-govern,\" said Kurtis Hagans, chair of the Metro DC Democratic Socialists of America chapter. \"I'm going to be happy if she's showing a willingness to fight for us.\"\nLewis George is part of a larger swell of democratic socialists gaining power on local and federal levels. In Seattle, Katie Wilson became mayor last year in a close win over incumbent Democrat Bruce Harrell. In Los Angeles, Nithya Raman is leading in a tight runoff for mayor against incumbent Democrat Karen Bass.\nThere are also several democratic socialists running for Congress this election cycle. In Michigan, the far-left Abdul El-Sayed is challenging former Rep. Mike Rogers. El-Sayed has rejected the DSA label, though many of his positions align with the organization's goals.\nLewis George's campaign declined CNBC's requests for an interview.\nLewis George's agenda as Washington mayor\nOne goal of the DSA is universal childcare, which Lewis George has campaigned on, and Hagans said he hopes to see her deliver.\nLewis George also wants to focus on affordable housing and lowering utility costs, her website says.\nAdditionally, she supports a new business activity tax, or BAT, though she told The Washington Sun that she doesn't support tax hikes on working- or middle-class families.\nHer BAT proposal would target unincorporated partnerships such as law offices, lobbying shops and other firms that are based in Washington but whose owners live outside the city and who, under federal tax law, can avoid paying the district's business franchise tax. It would exempt the first $200,000 of economic activity from taxation.\nAccording to the DC Fiscal Policy Institute, a 2% BAT policy could raise about $500 million in additional revenue for the city annually. Lewis George said during the Democratic mayoral primary debate that revenue from the BAT could help fund her policy goals.\nThe D.C. City Council in July ordered a feasibility report on implementing a BAT. This month, the council held a nine-hour hearing to debate tax proposals, including the BAT, as the council attempts to mitigate budget shortfalls for fiscal year 2028.\nProponents of the tax said at the hearing it would make taxation fairer across the city's business community, and Lewis George has previously said it closes a tax \"loophole.\"\nMalcom Fox, executive director of Opportunity DC, an independent expenditure group that has supported moderate candidates including McDuffie and says it supports reducing the cost of living and doing business in Washington, said the BAT would hurt the city by raising taxes on small businesses.\n\"It's a self-defeatist approach that is punishing the small businesses we need to bring our economy back,\" Fox said.\nCongress, Trump ready to limit mayor's power\nIn light of the potential BAT and other tax proposals, Republicans in Congress are preparing to limit the city — and Lewis George's — authority.\nThis summer, Rep. James Comer, R-Ky., introduced a bill that would effectively allow Congress to block tax increases the city approves. The D.C. Taxing Authority Review Act advanced out of the House Oversight and Government Reform Committee, which Comer chairs, on July 22.\n\"Radical DC Democrats want to solve their spending problem by reaching deeper into taxpayers' pockets and driving further on the path to socialism. Let's be clear: higher taxes will not fix the financial mess they created,\" Comer said in a press release.\nLewis George responded to the legislation on X by encouraging Congress to reject the bill.\n\"Let the people of D.C. govern D.C.,\" she said.\nThe next step would be for the proposal to go to a full House vote, though it is unclear if that will happen. Ankit Jain, a District of Columbia shadow senator, told CNBC he thinks the odds of the bill surviving both chambers of Congress are slim.\nLewis George will also have to fight Trump, who in August 2025 seized control of Washington's police department, a move Bowser's critics said she complied with too easily.\nTrump said his federal takeover of city police, as well as the deployment of hundreds of National Guard soldiers, was meant to crack down on crime, despite violent crime having fallen in the city from earlier peaks. Trump used Section 740 of the 1973 Home Rule Act, which allows a president to take control of Washington's police for emergency situations for 30 days, unless Congress grants an extension.\nTrump has repeatedly threatened to federalize the city again and called Lewis George a \"communist\" in June.\nOn a local level, D.C. Chamber of Commerce President and Chief Executive Chinyere Hubbard said the group looks forward to working with Lewis George.\n\"Janeese Lewis George has said that as mayor, she really wants to create a thriving economy that works for everyone to ensure good-paying jobs, and we share that goal at the chamber,\" Hubbard said. \"It doesn't matter how someone's labeled or anything, but whether they implement policies.\"\nThe bounds of authority as D.C. mayor\nDavid Barker, a political science professor at American University, said he thinks Lewis George's mayorship will be more symbolic than anything else, noting the Washington mayor, like mayors in general, has limited power.\n\"What is the mayor going to do? They can't actually pass any kind of legislation that's going to massively increase some minimum wage or massively increase tax rates on residents and redistribute it or anything like that,\" Barker said. \"They're gonna, you know, fix some potholes and stuff and put up lights.\"\nHowever, Lewis George's willingness to say no to Trump, unlike Bowser, will have an impact on Washington residents, said Nick Cosgrove, co-chair of the Young Democratic Socialists for America chapter at the University of Maryland.\nCosgrove also noted that, being in Washington, she will have less executive power than other mayors.\n\"Even in a best case, I don't think she's going to be the Mamdani in D.C.,\" he said. Mamdani has become well-known for quickly advancing his policy goals, including rolling out initiatives such as a pied-à-terre tax and free childcare for low-income children.\n\"But I do think that she's going to be a vast improvement over Mayor Bowser,\" Cosgrove added, referring to Lewis George's pledge to say no to Trump.\nBowser's office declined to comment.\nNadia Brown, a professor of government at Georgetown University, said Bowser has had to learn when to work with Trump and when to fight him.\n\"I think Janeese Lewis George is going to have to thread that needle as well,\" Brown said.",

ve to thread that needle as well,\" Brown said.",

    "id": "corruption-is-voters-top-issue-ahead-of-0f57dc69",
    "title": "Corruption is voters' top issue ahead of midterm election, CNBC survey shows",
    "titleJa": "Corruption is voters' top issue ahead of midterm election, CNBC survey shows",
    "summaryJa": "Democrats have worked to contrast economic hardship with President Trump's surging net worth and his family's lucrative business dealings.",
    "bodyOriginal": "Voters are now more concerned about government corruption than any other issue, including high grocery and gas prices, according to the final CNBC All-America Economic Survey before the Nov. 3 midterm election.\nThe finding follows a monthslong messaging effort by Democrats to link widespread economic dissatisfaction with what they allege is rampant corruption by President Donald Trump and his Republican allies.\nCNBC's survey of 1,000 registered U.S. voters found 36% of respondents pointing to government corruption as one of the most important issues facing the country right now. The cost of food and groceries came second with 34%, followed by protecting democracy and the price of gas, which garnered 23% each.\nThe nationwide poll, which gauged attitudes about the economy, Trump, Congress, artificial intelligence, the Iran war and more, was conducted Oct. 14-18. It was co-led by Democratic pollster Hart Research Associates and Republican pollster Public Opinion Strategies, and carries a margin of error of plus or minus 3.1 percentage points.\nRead the full survey results here.\nTo be sure, the question asking voters to name their top concerns lists several economy- and cost-related topics separately, subdividing an issue that might otherwise rank higher if lumped into a single category.\nBut the results nevertheless align with other recent polls showing corruption has shot to the top of voters' list of pressing worries.\nA Fox News poll published last week found 60% of registered voters are extremely concerned about government corruption, surpassing concerns about inflation and high prices. A Washington Post-ABC News-Ipsos poll released Sunday found some two-thirds of respondents think Trump is using the presidency to enrich himself, up 10 percentage points since September 2025. Gallup recently found perceptions of government corruption in the U.S. have hit multi-decade highs. And an August poll from Reuters/Ipsos found nearly 7 in 10 Americans believe Trump's businesses influence his presidential decisions.\nRepublicans have also tried to seize on growing anti-corruption sentiment. The Trump administration has launched a task force led by Vice President JD Vance aimed at cracking down on fraud, while the president frequently accuses his Democratic enemies of crookery.\n\"I just want to say that from day one of my administration, we've waged an unprecedented war on corruption and fraud, and will not let our country be looted and plundered by thieves and pirates and foreign fraudsters and basically scum,\" Trump said Tuesday while unveiling a new reward program for whistleblowers.\nBut with Republicans in charge of the federal government — and as high costs linked to Trump's tariffs and the Iran war have put the GOP on defense — Democrats have been able to cast blame more directly.\n\"Americans have spent well over $100 BILLION extra on gas because Trump chose to go to war with Iran,\" Sen. Mark Warner, D-Va., said Wednesday on X. \"His ego-fueled decisions cost you thousands.\"\nTheir arguments often spotlight Trump, attempting to draw a contrast between Americans' widely felt financial struggles with the president's surging net worth, his family's lucrative business dealings and his focus on pricey construction projects.\nOther Democratic candidates have widened the scope of the message, delivering a pitch that the system itself is broken.\n\"The problem is that the people's elected representatives don't represent the people. They represent the donors and special interests,\" Sen. Jon Ossoff, D-Ga., said in an April campaign video. \"Corruption is why things don't work for ordinary people.\"\nHouse Minority Leader Hakeem Jeffries, D-N.Y., has hammered the claim that Republicans have betrayed their vow to bring down costs.\n\"The wealthy and well-connected are cashing in. What are Republicans doing to lower costs for everyone else? Absolutely nothing,\" Jeffries wrote Friday.\nRhetoric and results\nDemocrats' push appears to be resonating with voters, even as large swaths remain skeptical of both parties.\nRespondents to the CNBC survey gave Democrats a 4-point edge over Republicans, 35% to 31%, when asked which party would do a better job dealing with government corruption.\nBut that gap grew to 17 points in Democrats' favor among voters who said corruption was their most important issue.\nAnd independents, by a 15-point margin, said Democrats would address corruption better than Republicans – though 41% of those respondents think neither party would do a good job.\nThe apparent rise in concern about corruption is welcome news to critics of the president who have long lamented that Americans have become numb to scandal in the Trump era.\nThat shift is taking place because voters are feeling the impact of inflation and connecting it to what they see in Washington, said Brian Lemek, executive of the Democrat-backing political action committee Defend the Vote, in an interview.\n\"It's the only thing people are talking about right now,\" said Lemek, whose group briefed candidates on the issue in June.\nVoters are \"looking at the reality that their costs are high\" and \"making the connection between this corrupt and broken system and their high costs,\" he said.\nAdditionally, survey respondents overwhelmingly opposed the idea of elected officials, including the president and members of Congress, personally owning or trading stocks in individual companies that have contracts with the federal government. That should not be allowed, 93% of voters said in the poll.\nA similar proportion – 89% – said that companies owned, or invested in, by a sitting president's immediate family members should not be allowed to receive contracts from the federal government.\n\"This definitely ties back to the corruption issues that we've been talking about,\" said Alicia Simmons of Hart Research Associates.",

    "bodyOriginal": "Volvo Cars said Friday it plans to cut 2,500 jobs after a sharp decline in its Chinese market weighed on third-quarter earnings.\nThe Swedish automaker reported an operating loss of 5.6 billion Swedish kronor ($563.7 million) in the third quarter, down from an operating profit of 6.4 billion Swedish kronor in the previous period.\nThe company, which is owned by China's Geely Holding, cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"\nVolvo Cars shares were last down around 27%.\n\"It's really a lot about the Chinese market, of course, where the change has come faster than we thought, and really now we can see that selling global cars developed in Europe and China will not work, and then this is affecting all the Western players in China,\" Volvo Cars CEO Håkan Samuelsson told CNBC on \"Squawk Box Europe,\" on Friday.\nChinese consumers are now looking for \"domestic alternatives,\" which have become stronger and more competitive, the CEO said. \"We need a new strategy in China... it has to be a more regional structure, a more empowered region, and we need regionally adapted cars.\"\nHe added that costs must be competitive and that Volvo Cars needs to share some platforms with its Chinese parent company Geely, and develop key software in China that includes infotainment and driver-assistance systems. \"If you don't have that, I think you cannot sell cars in China.\"\nVolvo Cars' revenues in China fell almost 50% year-on-year as premium brands faced \"hypercompetition\" from new Chinese rivals, which also put severe pressure on pricing, the company said.\nMeanwhile, in the U.S., the automaker cited negative effects from tariffs and fewer customer incentives to buy electric cars, putting pressure on profit margins.\nVolvo Cars said it is looking to cut 5 billion Swedish kronor in costs and will eliminate 2,500 jobs globally, with 2,000 of those jobs based in Sweden.\n\"It is really a consequence of this development, our long-range strategy,\" Samuelsson told CNBC. \"We will have more empowered, stronger regions, and then of course you cannot keep the same resources on the corporate central level. So we need a leaner central administration.\"",
    "bodyJa": "Volvo Cars said Friday it plans to cut 2,500 jobs after a sharp decline in its Chinese market weighed on third-quarter earnings.\nThe Swedish automaker reported an operating loss of 5.6 billion Swedish kronor ($563.7 million) in the third quarter, down from an operating profit of 6.4 billion Swedish kronor in the previous period.\nThe company, which is owned by China's Geely Holding, cited a deteriorating environment led by \"tougher\" market conditions in China and the U.S., which \"negatively affected free cash flow.\"\nVolvo Cars shares were last down around 27%.\n\"It's really a lot about the Chinese market, of course, where the change has come faster than we thought, and really now we can see that selling global cars developed in Europe and China will not work, and then this is affecting all the Western players in China,\" Volvo Cars CEO Håkan Samuelsson told CNBC on \"Squawk Box Europe,\" on Friday.\nChinese consumers are now looking for \"domestic alternatives,\" which have become stronger and more competitive, the CEO said. \"We need a new strategy in China... it has to be a more regional structure, a more empowered region, and we need regionally adapted cars.\"\nHe added that costs must be competitive and that Volvo Cars needs to share some platforms with its Chinese parent company Geely, and develop key software in China that includes infotainment and driver-assistance systems. \"If you don't have that, I think you cannot sell cars in China.\"\nVolvo Cars' revenues in China fell almost 50% year-on-year as premium brands faced \"hypercompetition\" from new Chinese rivals, which also put severe pressure on pricing, the company said.\nMeanwhile, in the U.S., the automaker cited negative effects from tariffs and fewer customer incentives to buy electric cars, putting pressure on profit margins.\nVolvo Cars said it is looking to cut 5 billion Swedish kronor in costs and will eliminate 2,500 jobs globally, with 2,000 of those jobs based in Sweden.     "titleJa": "The Indian workers filming their work to train AI",
    "summaryJa": "Indian workers are being paid to film themselves at work and the footage is used to train AI.",
    "bodyOriginal": "The Indian workers filming their work to train AI\n- Published\nMohammed Ashim has been cutting hair and trimming beards for four years in Bengaluru.\nBut recently the 22-year old has been strapping a camera to his head to record his work.\nThe camera only records his hands and fingers - his client's faces are blurred out.\n\"The routine is simple, but you have to be disciplined about how you move. The operations team taught me that my hands always have to stay cleanly inside the frame, the lighting has to be sharp, and I can't tilt my head too abruptly while working.\"\nHe wears the camera for five or six hours a day.\n\"It's good money, but honestly, the feeling of doing something this futuristic is what keeps me excited. I never imagined my razor techniques would be useful to a global tech company,\" says Ashim.\nHe is one of hundreds of thousands of workers across the world paid to record their activities.\nAshim's footage is collected by a local company, which might have hundreds of people filming their work.\nThat video is then sold on to technology companies and research organisations who use it to train artificial intelligence - in particular so-called physical AI, a type of artificial intelligence that can control robots in the real world.\nRashdan Technologies collects and processes such human generated data.\n\"Every robotics company, every frontier AI lab, has a specific kind of data they want: industrial tasks, agriculture, household chores, small business work like pottery, garment-making, embroidery, candle-making. We go wherever the task is,\" says co-founder and CEO Shahil Baig.\nHis company pays $5 to $10 (£3.74; £7.47) for eight to 10 hours of recorded work.\n\"For a lot of these people, that's meaningful,\" Baig says.\nMaking sure workers give their consent and are comfortable with the process is important, he says.\n\"We record hands, not faces, and where multi-camera rigs do capture more of the body or environment, we blur faces out. No names, no contact details, nothing that identifies them personally goes into what we hand off.\"\nBut his customers are getting more demanding.\n\"Now clients are asking for four to six cameras rigged around a person's head to cover the entire scene, not just the hands.\n\"Getting someone to agree to one small camera is one conversation. Getting them to agree to wearing what's effectively a five-camera headset is a completely different, and harder, one. We pay more for that tier of data collection because of what we're asking of people.\"\nAnd the industry is becoming more crowded, Agarwal expects dozens more competitors to emerge in India this year.\nWhy is such data so important?\nIf you want robots to navigate the real world, they can't just be trained inside computer simulations, argues Manish Agarwal, the founder of Humyn Labs, which collects and processes human-generated data.\nMost of that data comes from video, but sometimes collectors wear hardware on their hands and fingers to capture physical contact.\n\"Physical tasks require high-quality signals involving limb movements, fingers, wrists, elbows, shoulders and dynamic force application. For example: applying the correct grip force so a plastic bottle doesn't crumble versus a steel glass,\" he says.\nAnd until recently, that data was not available.\n\"There is no existing internet archive of embodied human activity - no dataset of a kitchen being cleaned, or a car being assembled by hands that know exactly how much force to apply. That data has to be captured from scratch, in the real world, across diverse environments,\" says Agarwal, whose company has bases in Bangalore and San Francisco.\nAt the moment his firm has 96,000 data collectors across countries in Latin America and Southeast Asia.\nHumyn Labs filters the thousands of hours of video supplied by those collectors, selecting the most useful content. It's then labelled so the AI knows what it is looking at and packaged in a format that can be used by clients.\n\"You need to source across a variety of factories, a variety of tasks, in different geographies because if you want to build deployment for US factories or US houses, you'd want environments that are a proxy for that. Residential houses in India may not be the right context for building a robotics use case for the US.\"\nBut are workers collecting data for machines that will one day do their jobs?\nAt the moment it's too early to tell says Bino Paul, senior professor at the School of Management and Labour Studies at the Tata Institute of Social Sciences (TISS) in Mumbai.\nFor some workers AI might be a useful tool, but robots could automate other jobs, he says.\nThe problem is that, if machines do start to take over, there will be little workers can do about.\n\"By the time workers realise what they have participated in, things may have gone too far,\" he says.\nLike many others, he wants governments to regulate AI.\n\"AI cannot be viewed merely as a technical system. We need to develop a socio-technical system in which ethics is upheld through human agency, ensuring that AI delivers beneficence rather than maleficence.\"\n'This is survival'\nDespite concerns over where AI is heading, money is still being poured into its development.\nSome of that trickles down to workers in India, where there is no shortage of workers prepared to wear a camera for a few dollars a day.\nMohammed Arman has been working in the textiles industry in Bangalore for 10 years.\n\"Garments stitching and cutting. I know this work so well I could probably do it with my eyes closed. Cloth, thread, needle, machine after 10 years, your hands just know what to do before your mind even tells them,\" he says.\nHe has recently started wearing a head-mounted camera that records his work.\n\"For me, it's simple. This is survival. I have a family back home in Bihar, and every rupee I send back matters. If someone offers me extra money to wear a camera while I do the exact same work I've been doing for 10 years, I'm not going to say no.\n\"It doesn't cost me anything. I'm already doing the stitching, already doing the cutting. Now I just get paid a little more for it,\" he says.\nWhile there is demand for such footage it will be collected somewhere.\n\"India's current role in this industry is largely as a supplier of raw material - people strap on cameras, record themselves doing ordinary tasks, and that footage gets shipped off to labs abroad,\" Agarwal says.\nBut he argues the value of that kind of work will quickly become eroded, as more companies compete for collection contracts.\n\"India can't afford to stay a footage supplier. It needs to move up the value chain: from recording raw video to owning the pipeline that turns that video into something usable - cleaning it, structuring it, validating it, and ultimately setting the standards for what counts as high-quality training data,\" he says.\nFor some people collecting data is attractive part time work.\nScience teacher Jolly Arifur was looking for work she could do from home that would fit around her young son.\n\"For the past seven months, I strapped a rig-mounted camera on my head while doing my routine domestic work scrubbing, cooking, sweeping tile floors, and folding laundry.\"\nArifur, who lives in Guntakal, Anantapur, fits the recording work around her teaching.\n\"I get paid two to three dollars per hour. If I record three to five hours a day, that's a good amount in hand it's become an extra source of income for me, on top of teaching. I'm managing both honestly, fantastically.\"\nMore Technology of Business\n- Published18 September\n- Published16 September\n- Published11 September",

    "id": "sk-hynix-shares-rebound-after-initial-dr-77a8fec7",
    "title": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans",
    "titleJa": "SK Hynix shares rebound after initial drop on scrapped Solidigm IPO plans",
    "summaryJa": "SK Hynix shares rebound after an inital drop in early trading, following halted review of Solidigm IPO plans in the U.S.",
    "bodyOriginal": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\nThe stock reversed earlier losses to trade 3.2% higher.\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\nThe company also said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.\nThe decision also follows regulatory scrutiny in South Korea.\nThe country's financial regulator said Monday that a potential U.S. listing of Solidigm could violate South Korean rules restricting dual listings, according to Reuters.\nFinancial Supervisory Service Governor Lee Chan-jin said regulators were examining whether the IPO would require a review under the country's rules designed to protect minority shareholders.\nSK Hynix said Solidigm's investment needs remain unchanged and that it would continue exploring alternative financing options to support the subsidiary's growth and enhance shareholder value.\nThe announcement comes as U.S. technology stocks face pressure amid worries over AI spending.The tech-heavy Nasdaq Composite slid 2.6% on Thursday, its worst session since June, while Nvidia fell 4.4% and Advanced Micro Devices dropped 8.1%.\nAmid a sell-off in memory stocks, Nvidia CEO Jensen Huang told CNBC Thursday that he does not expect an oversupply of memory chips by 2029, despite concerns over weakening demand.\nAI data center stocks have also come under pressure amid growing concerns over financing risks and the pace of AI infrastructure expansion. Shares of CoreWeave plunged 10% on Thursday, extending their monthly decline to 36%, while Australia's NextDC tumbled nearly 40% on Wednesday after cutting its earnings forecast.",
    "bodyJa": "Shares of South Korean chipmaker SK Hynix rebounded on Friday after falling as much as 3% earlier in the session, following the company's decision to halt a review of a potential U.S. initial public offering for its subsidiary Solidigm.\nThe stock reversed earlier losses to trade 3.2% higher.\n\"Solidigm will halt its review of potential pre-IPO and IPO options,\" the company said in the statement after assessing recent capital market conditions and share price trends, while also exploring various funding options to finance a new U.S. semiconductor fabrication plant amid growing demand for AI memory.\nThe chip manufacturer said an IPO could have helped fund Solidigm's expansion while providing greater financial flexibility for shareholder returns, including dividends, share buybacks and share cancellations.\nHowever, financial market volatility had increased and contributed to a broader correction in semiconductor stocks, prompting SK Hynix to reassess whether an IPO would benefit existing shareholders.\nThe company also said that Solidigm's existing production facilities had limited capacity to meet rising AI-driven memory demand, underscoring the need for additional manufacturing capacity in the U.S.\nThe decision also follows regulatory scrutiny in South Korea.\nThe country's financial regulator said Monday that a potential U.S. listing of Solidigm could violate South Korean rules restricting dual listings, according to Reuters.\nFinancial Supervisory Service Governor Lee Chan-jin said regulators were examining whether the IPO would require a review under the country's rules designed to protect minority shareholders.\nSK Hynix said Solidigm's investment needs remain unchanged and that it would continue exploring alternative financing options to support the subsidiary's growth and enhance shareholder value.\nThe announcement comes as U.S. technology stocks face pressure amid worries over AI spending.The tech-heavy Nasdaq Composite slid 2.6% on Thursday, its worst session since June, while Nvidia fell 4.4% and Advanced Micro Devices dropped 8.1%.\nAmid a sell-off in memory stocks, Nvidia CEO Jensen Huang told CNBC Thursday that he does not expect an oversupply of memory chips by 2029, despite concerns over weakening demand.\nAI data center stocks have also come under pressure amid growing concerns over financing risks and the pace of AI infrastructure expansion. Shares of CoreWeave plunged 10% on Thursday, extending their monthly decline to 36%, while Australia's NextDC tumbled nearly 40% on Wednesday after cutting its earnings forecast.",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';

  const [featured, ...rest] = filtered;
  let html = "";

    html += `

        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
