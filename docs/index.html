    "title": "I climbed the career ladder and got my dream job at 30 - then I hit burnout",
    "titleJa": "キャリアのはしごを登り、30歳で夢の仕事に就いたが、その後燃え尽き症候群に陥った",
    "summaryJa": "キャリアのはしごを登り、30歳で夢の仕事に就いたが、その後燃え尽き症候群に陥った- 公開されました",
    "bodyOriginal": "I climbed the career ladder and got my dream job at 30 - then I hit burnout\n- Published\nJo Hooper spent her 20s trying to climb the career ladder, quickly rising through the ranks with promotions and pay rises.\n\"I loved being good at it,\" said Jo, a former communications professional.\nBut just after she landed her dream role at 30, Jo struggled with burnout and had to take time off work.\nBurnout, external is recognised by the World Health Organization (WHO) as a state of physical and emotional exhaustion.\nRecent statistics show 22 million working days, external were lost in Britain because of work-related stress in 2024-25.\nJo, now 39 and based in Penarth in the Vale of Glamorgan, said: \"I wanted to be a head of communications by the time I was 30, which I did by doing all things you'd expect, working long hours, saying yes to everything including mad things like taking my boss's kids to school.\"\n\"I genuinely thought these were all good opportunities, and I was going to grab them with both hands,\" said Jo.\n\"I remember being in the bathroom crying, hyperventilating, but I never thought 'this isn't sustainable', never thought 'I can't do this any more'.\n\"I just thought I needed to change job and I'd be fine. I thought the fix was being in a different organisation but the way I behaved, what I thought was expected of me, was the same everywhere.\"\nJo hit burnout a year into her management role, and it led to two breakdowns within a year.\n\"I definitely think it was a case of being forced to stop by my body and mind,\" she said.\n\"I found it really difficult to make decisions, like my brain was working slower. I remember feeling like someone had flipped a switch and my brain had just broken.\"\nThe charity Mental Health UK reports that two in five, external young workers aged 18 to 24 took time off due to poor mental health caused by stress in 2025.\nHowever, there have been concerns raised about how people are signed off work.\nEarlier this year, hundreds of GPs told the BBC they had never refused to sign a patient off work for mental health issues.\nOlympic athlete Laviai Nielsen recently told the BBC she realised she had burnout too late, after the 2024 Paris Olympics, while Green Party MP Carla Denyer announced in May she would be taking a leave of absence due to burnout.\nDr Jill Williams, a psychologist and business coach in north Wales, specialises in working with people affected by burnout.\nShe said: \"It's actually perfectionists or those who go the extra mile who are more likely to experience this.\n\"The same traits that get you promoted will be the same ones that burn you out, unfortunately.\"\nPublic Health Wales' Amy Davies said the phrase burnout could be used interchangeably for stress, but said the two were different things.\n\"Stress can feel like drowning, but burnout can feel like having nothing left to swim with,\" she said.\nBoth experts have helped BBC News bust burnout myths and misconceptions.\nIs burnout always work-related?\n\"It's not necessarily just work, we can see it an awful lot in carers and students, any situation where there is long-term stress,\" said Williams.\nAs it is caused by prolonged, unmanaged stress, it can stem from any persistent, demanding role or responsibility.\nIs burnout different from depression or anxiety?\nBurnout and depression are distinct conditions, and the WHO does not consider burnout to be a mental health condition or illness.\n\"If burnout experiences are unaddressed it may lead to those conditions developing,\" said Davies.\nWill a holiday fix burnout?\n\"Sometimes it can be helpful, but it also needs to come with changes to the context that's causing the distress,\" said Davies.\n\"For many people rest is necessary, but it's not always enough. If you go back to work and your attitude to work is the same, then you're going to have the same result, so something needs to change,\" added Williams.\nJo ended up leaving her career after she realised it was not sustainable. She was diagnosed with anxiety and depression.\n\"I've learnt the hard way that rest doesn't fix burnout, and it certainly didn't fix the breakdown for me. Actually changing the things that burnt you out or broke you down is the only way to get over it.\n\"Now I'm a woman on a mission to convince others to work less, because I spent 10 years not doing that, and it nearly broke me.\"\nJo does public speaking and coaching to support business owners and employers to help others avoid reaching burnout.\n\"I'm in control, I run my business, I get to decide how it works, I get to decide what I do and who I work with, and that's a huge part of the process for me,\" she said.\n\"I detest this optimisation culture of trying to be as productive as possible. Feeling like we constantly have to optimise ourselves and productivity is just forcing us into working more and living less... I think it just needs to get in the bin.\"\nSome workforces have raised concerns about staff members leaving jobs due to burnout, including midwifery and teaching.\nHannah Leonard, from the Royal College of Midwives union, said: \"Midwives do an extraordinary job, and they deserve to feel pride in their profession, not burnt out within a few years of qualifying\".\nNeil Butler from the teaching union NASUWT said: \"Changes must be made to bring back the joy into teaching. While it is a relentless grind we will continue to lose good teachers from classrooms in Wales.\"\nLaura Doel from Trade Union Congress Cymru, said: \"Our research shows that stress is the number one risk at work, higher than traditional dangers like exposure to chemicals, working at height and unsafe machinery.\"\nShe said actions by employers who offer wellbeing measures are welcomed, but tackling the root cause of stress such as \"low pay, insecure contract and impossible workloads\" was key.\nA spokesperson for the Health and Safety Executive, Britain's national regulator for workplace health and safety, said: \"Employers have a legal duty to protect workers from risk factors that cause work-related stress by assessing and properly managing key areas of the work.\"\nThe Welsh government said it was working with employers and trade unions to reduce pressures, support staff wellbeing and ensure appropriate mental health support was available.\nIf you or someone you know has been affected by the issues raised in this story, information about available help and support can be found via BBC Action Line.\nRelated topics\nMore top stories\n- Published1 day ago\n- Published1 day ago\n- Published3 hours ago",
    "bodyJa": "キャリアのはしごを登り、30歳で夢の仕事に就いたが、その後燃え尽き症候群に陥った\n- 公開されました\nジョー・フーパーは、キャリアのはしごを登ろうと 20 代を過ごし、昇進と昇給で急速に階級を上げました。\n「私はそれが得意でした」と、元コミュニケーションの専門家であるジョーは言いました。\nしかし、30歳で夢の役を獲得した直後、ジョーは燃え尽き症候群に苦しみ、仕事を休まなければならなかった。\n燃え尽き症候群は、世界保健機関 (WHO) によって身体的および精神的な疲労の状態として認識されています。\n最近の統計によると、英国では2024年から2025年にかけて仕事関連のストレスにより2,200万労働日が失われている。\n現在39歳で、グラモーガンの谷のペナースに拠点を置くジョーは、「30歳までにコミュニケーション部門の責任者になりたかった。そのためには、皆さんが期待するすべてのことを実行し、長時間労働し、上司の子供たちを学校に連れて行くなどのおかしなことも含め、すべてにイエスと答えた」と語った。\n「すべて良いチャンスだと心から思ったので、両手で掴むつもりだった」とジョーは語った。\n「バスルームで泣きながら過呼吸になったのを覚えていますが、『これは持続可能ではない』と思ったことは一度もありませんし、『もうこれ以上できない』と思ったこともありませんでした。\n「転職する必要があるし、大丈夫だと思っていたんです。修正するには別の組織が必要だと思ったが、私の振る舞い方、私に期待されていると思っていたことはどこでも同じだった。」\nジョーは管理職に就いてから 1 年で燃え尽き症候群に陥り、1 年以内に 2 回の故障につながりました。\n「間違いなく、体と心に無理を強いられたのだと思います」と彼女は語った。\n「脳の働きが遅くなったように、意思決定をするのが本当に難しいと感じました。誰かがスイッチを入れて、脳が壊れてしまったような感覚を覚えています。」\n慈善団体メンタルヘルス UK の報告によると、2025 年には 18 ～ 24 歳の社外の若い従業員の 5 人に 2 人がストレスによるメンタルヘルス不良のため休暇をとりました。\nしかし、人々が仕事をどのように承認されるかについて懸念が提起されています。\n今年初め、数百人の一般医がBBCに対し、精神的健康上の問題を理由に患者の仕事を休むことを拒否したことは一度もないと語った。\nオリンピック選手のラヴィアイ・ニールセン氏は最近BBCに対し、2024年パリオリンピック後に燃え尽き症候群に気づくのが遅すぎたと語った一方、緑の党のカーラ・デニエ議員は5月に燃え尽き症候群のため休暇を取ると発表した。\nウェールズ北部の心理学者兼ビジネスコーチであるジル・ウィリアムズ博士は、燃え尽き症候群に悩む人々への協力を専門としています。\n彼女は、「実際、このようなことを経験する可能性が高いのは、完璧主義者や余分な努力をする人です。\n「残念なことに、あなたを昇進させる同じ特性は、あなたを燃え尽きさせるものでもあります。」\nウェールズ公衆衛生局のエイミー・デイビス氏は、燃え尽き症候群という言葉はストレスと同じ意味で使われる可能性があるが、この2つは別のものだと述べた。\n「ストレスは溺れるように感じますが、燃え尽き症候群は泳ぐものが何もなくなったように感じます」と彼女は言いました。\n両専門家は、BBC ニュースが燃え尽き症候群に関する神話や誤解を打ち破るのに貢献してくれました。\n燃え尽き症候群は常に仕事に関連しているのでしょうか?\n「これは必ずしも仕事だけではありません。介護者や学生、長期的なストレスがかかるあらゆる状況で非常に多く見られます」とウィリアムズ氏は言う。\nこれは長期にわたる管理されていないストレスによって引き起こされるため、持続的で厳しい役割や責任から生じる可能性があります。\n燃え尽き症候群はうつ病や不安症とは違いますか?\n燃え尽き症候群とうつ病は別個の状態であり、WHO は燃え尽き症候群を精神的健康状態や病気とはみなしていません。\n「燃え尽き症候群の経験に対処しないと、そのような症状が進行する可能性があります」とデイビス氏は言う。\n休暇を取れば燃え尽き症候群は治るでしょうか？\n「時には役立つこともありますが、苦痛を引き起こしている状況を変える必要もあります」とデイビス氏は言う。\n「多くの人にとって休息は必要ですが、それだけでは必ずしも十分ではありません。仕事に戻っても、仕事に対する姿勢が同じであれば、結果は同じでしょう。ですから、何かを変える必要があります」とウィリアムズ氏は付け加えた。\nジョーさんは、それが持続可能ではないと悟り、キャリアを辞めることになりました。彼女は不安症とうつ病と診断されました。\n「休んでも燃え尽き症候群は治らないということを、私は苦労して学びました。もちろん、休んでも燃え尽き症候群は治りませんでした。燃え尽き症候群や衰弱の原因となったものを実際に変えることが、それを乗り越える唯一の方法なのです。」\n「今、私は女性として、他の人たちに仕事を減らすよう説得するという使命を担っています。なぜなら、10年間そうせずに過ごしてきたからです。そのせいで心が折れそうになったのです。」\nジョーは、他の人が燃え尽き症候群に陥るのを避けるために、経営者や雇用主をサポートするために人前で講演したりコーチングを行っています。\n「私は自分のビジネスをコントロールし、自分のビジネスを経営し、それがどのように機能するかを決めることができ、何をするか、誰と働くかを決めることができます。それが私にとってプロセスの大きな部分を占めています」と彼女は語った。\n「私は、可能な限り生産性を高めようとするこの最適化の文化が大嫌いです。自分自身と生産性を常に最適化する必要があると感じると、私たちはより多く働き、より少ない生活を強いられるだけです...それはゴミ箱に捨てるべきだと思います。」\n一部の労働者は、助産師や教師などのスタッフが燃え尽き症候群で離職するのではないかと懸念を表明している。\n英国王立助産師大学組合のハンナ・レナード氏は、「助産師は並外れた仕事をしている。彼らは資格を得てから数年で燃え尽きてしまうのではなく、自分の職業に誇りを感じるのが当然だ」と語った。\n教組NASUWTのニール・バトラー氏は、「教育に喜びを取り戻すためには変化を起こさなければならない。容赦ない苦労ではあるが、ウェールズの教室からは優秀な教師を失い続けるだろう。」と語った。\n労働組合会議CymruのLaura Doel氏は、「私たちの調査によると、職場での最大のリスクはストレスであり、化学物質への暴露、高所での作業、危険な機械などの従来の危険よりも高い」と述べた。\n同氏は、福利厚生措置を提供する雇用主の行動は歓迎されるが、「低賃金、不安定な契約、不可能な仕事量」といったストレスの根本原因に取り組むことが鍵だと述べた。\n英国の職場の健康と安全に関する国家規制当局である健康安全執行局の報道官は、「雇用主には、仕事の主要な分野を評価し、適切に管理することによって、仕事関連のストレスを引き起こす危険因子から労働者を守る法的義務がある」と述べた。\nウェールズ政府は、雇用主や労働組合と協力してプレッシャーを軽減し、職員の健康を支援し、適切なメンタルヘルス支援が確実に受けられるように取り組んでいると述べた。\nあなたまたはあなたの知り合いがこの記事で提起された問題の影響を受けている場合は、利用可能なヘルプとサポートに関する情報を BBC Action Line で見つけることができます。\n関連トピック\nその他のトップ記事\n- 1 日前に公開\n- 1 日前に公開\n- 3 時間前に公開",

    "summaryJa": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",
    "bodyOriginal": "Shein shares fall in long-awaited stock market debut\n- Published\nShares in fast-fashion giant Shein fell in their highly anticipated stock market debut on Tuesday as the firm listed in Hong Kong after a long quest to go public.\nIt comes after failed attempts to list in the US and UK, as concerns were raised over issues including Shein's labour practices and its environmental impact.\nOnce estimated to be worth nearly $100bn (£74bn), Shein is now valued at around a quarter of that figure, as the firm faces other challenges like heated competition and trade tensions.\nShein became hugely popular, especially among younger people, due to its ability to source the very latest fashions at ultra-low prices through a vast network of factories in China.\nAt a ceremony to celebrate the listing, chief financial officer Leigh Gui said the company's model of selling large numbers of small orders with rapid payment options now reaches about 160 markets worldwide.\n\"Let global consumers enjoy the sound of fashion,\" he said after a gong was struck to mark the start of trading.\nOn Monday, Shein priced its shares at HK$48.56 each, raising 13.6 billion Hong Kong dollars ($1.7bn; £1.3bn) from the listing.\nThat gave the company a stock market valuation of $26.3bn.\nShein's shares fell by as much as 10% in early trading before the losses eased. At lunchtime, they were around 3.5% lower at just under 47 Hong Kong dollars each.\nThe disappointing debut suggests the market is not convinced that Shein's growth can make a \"comeback\", said Charu Chanana, chief investment strategist at investment bank Saxo.\nShein has more than 273 million active customers who placed a total of more than a billion orders in the year to the end of March 2026, the firm said in a filing ahead of the listing.\nBut Shein now faces higher costs, regulatory scrutiny and more competition, while investors are increasingly drawn towards technology companies, Chanana said.\nFor customers, the slump in Shein's shares is a sign that the firm's cheap prices are \"becoming harder to sustain\", which may lead to higher prices, she added.\nA benchmark for fast fashion\nThe listing marks the largest new share sale in Hong Kong so far this year, which is being seen as a test of investor appetite for the fast fashion industry.\nIt is a rare \"standalone\" e-commerce firm that can be assessed on its own merits, fashion industry analyst Louise Deglise-Favre from research firm GlobalData.\nShares in rivals Asos and Boohoo have been battered in recent years as they face regulatory scrutiny and fierce competition.\n\"Investors have learned to be sceptical,\" while concerns over sustainability and ethical issues add to the complexity of Shein's share sale, Deglise-Favre said.\nThe rise and rise of fashion giant Shein\n- Published7 June 2024\nThe truth behind your $12 dress: Inside the Chinese factories fuelling Shein's success\n- Published12 January 2025\nShein was founded in China in 2008 and is now headquartered in Singapore.\nThe firm's long road to the stock market highlights the geopolitical pressures and regulatory scrutiny faced by Chinese companies with global ambitions.\nThe company once looked set for one of the largest stock market debuts ever by a Chinese firm, with Wall Street in its sights.\nIts business had surged during the Covid-19 pandemic as people, stuck at home, turned to online retailers.\nShoppers shared clips of themselves trying on large numbers of its garments, a trend called Shein Hauls, boosting the company's online presence.\nAn initial public offering (IPO) in the US - by far Shein's largest market - would have offered it a chance to further increase its global profile and tap into Western financing.\nBut the firm faced resistance from US lawmakers, who objected to the planned listing over concerns of forced labour in Shein's factories. In response to such allegations, the company has said it takes a \"zero-tolerance policy for forced labour\".\nIt has also been accused of copying other designers' ideas. Shein has said \"it takes all claims of infringement seriously\" and that it respects the rights of all designers.\nShein also explored the possibility of making its stock market debut in London but faced similar opposition.\nThe BBC has contacted Shein for further comment.\n'Only realistic path'\nIn 2025, Shein shifted its attention to Hong Kong, with Chinese authorities approving the move in July this year.\n\"Shein ran out of venues that could take it,\" said Ashley Dudarenok, founder of Chinese market research firm ChoZan.\nThe company attempted to \"look less Chinese\" by shifting its headquarters to Singapore ahead of its IPO bid, but it never won political backing abroad nor assurances from Beijing, she added.\n\"For Chinese companies increasingly shut out of Western exchanges, Hong Kong is fast becoming the only realistic path to market,\" Deglise-Favre said.\nThe move also coincided with Shein's publicity-shy founder Xu Yangtian making a rare public appearance during a major business conference in February.\nXu took to a stage in Guangdong, home to many of China's garment factories, to re-affirm his company's ties to Beijing.\nHe pledged investments in China's clothing industry, adding that the \"nourishment\" from the country has been \"inseparable\" from Shein's success.\nHeadwinds ahead\nTrade tensions and regulatory concerns mean Shein is navigating a very different landscape to when it first started exploring a potential IPO.\nIn July, it reported a $99m quarterly loss as its sales slowed after the US struck down an import duty exemption on small packages.\nThe exemption, known as the de minimis rule, had helped Shein and rival Temu grow rapidly as it allowed packages worth less than $800 to enter the US without incurring import duties.\nSimilarly, the European Union has imposed a €3 (£2.57; $3.50) tax on low-value imports.\nThe Iran war has also hit demand, raised costs and caused delays to deliveries in some markets, Shein has said.\nIts rivals are feeling the pressure too. In August, Temu-owner PDD reported lower-than-expected quarterly revenue.\nShein is also being investigated by US and European regulators over its business practices.\nThe company also needs to find ways to stand out from its rivals, that are now also using predictive technology to make their websites more appealing to shoppers, said Jason Hsu from Rayliant Global Advisors.\n\"Shein is not longer a unique player,\" Hsu said.\nDespite these challenges some analysts still see strong potential for Shein.\nInvestors will be scrutinising whether the company can navigate these issues, such as shifting logistics out of China to avoid the US and EU's import fees, Deglise-Favre said.\nThe slump in the firm's valuation shows \"genuine deterioration\", but it is still backed by a \"formidable supply chain\" and a global reach, she added.\nPeople are still buying the company's goods, but costs have weighed on its business and have shown that its business model does not generate profits in the way it once did, said Dudarenok.\nAs a listed company, Shein will need to \"prove its margins still work in a world of tighter regulation, tariffs and more expensive customer acquisition,\" she added.\nRelated topics\n- Published29 August 2025\n- Published1 August 2025",
    "bodyJa": "待望の株式市場デビューでシャイン株が下落\n- 公開されました\nファストファッション大手のシャインの株価は、株式公開を目指した長い努力を経て香港に上場したため、火曜日の待望の株式市場デビューで下落した。\nシェイン氏の労働慣行や環境への影響などの問題を巡る懸念が高まり、米国と英国での上場計画が失敗に終わったことを受けてのことだ。\nかつては1,000億ドル（740億ポンド）近くの価値があると推定されていたシェインの価値は、競争激化や貿易摩擦など他の課題に直面しているため、現在はその4分の1程度となっている。\nShein は、中国の膨大な工場ネットワークを通じて最新のファッションを超低価格で入手できるため、特に若者の間で絶大な人気を博しました。\n上場を祝う式典でリー・グイ最高財務責任者（ＣＦＯ）は、迅速な支払いオプションを備えた大量の小口注文を販売する同社のモデルは現在、世界約１６０の市場に広がっていると述べた。\n取引開始のゴングが鳴らされた後、同氏は「世界の消費者にファッションの音を楽しんでもらいましょう」と述べた。\n月曜日、Sheinは自社株の価格を1株あたり48.56香港ドルに設定し、上場により136億香港ドル（17億ドル、13億ポンド）を調達した。\nこれにより、同社の株式市場評価額は263億ドルとなった。\nシャイン株は損失が和らぐ前に取引序盤で最大１０％下落した。ランチタイムでは約3.5％安となり、それぞれ47香港ドル弱となった。\n投資銀行サクソのチーフ投資ストラテジスト、チャル・チャナナ氏は、期待外れのデビューは市場がシェイン氏の成長で「復活」できると確信していないことを示唆していると述べた。\nSheinには2億7,300万人以上のアクティブな顧客がおり、2026年3月末までの1年間に合計10億件以上の注文があったと同社は上場に先立って提出した書類で述べた。\nしかし、シェインは現在、コスト高、規制当局の監視、競争激化に直面している一方、投資家はテクノロジー企業にますます惹かれているとチャナナ氏は語った。\n顧客にとって、シャイン株の低迷は同社の低価格を「維持するのが難しくなっている」ことの表れであり、それが価格上昇につながる可能性があると同氏は付け加えた。\nファストファッションのベンチマーク\n今回の上場は香港における今年これまでで最大の新株売却額となり、ファストファッション業界に対する投資家の意欲を試すものとみられている。\n調査会社グローバルデータのファッション業界アナリスト、ルイーズ・ドグリーズ・ファーブル氏は、同社は独自のメリットで評価できる稀な「独立型」電子商取引企業だ、と語る。\nライバルのエイソスとブーフーの株価は近年、規制当局の監視と熾烈な競争に直面してボロボロになっている。\nデグリーズ・ファーブル氏は、持続可能性や倫理問題に対する懸念がシャイン株売却の複雑さを増す一方、「投資家は懐疑的になることを学んだ」と述べた。\nファッション界の巨人Sheinの隆盛と台頭\n- 2024 年 6 月 7 日公開\nあなたの 12 ドルのドレスの背後にある真実: Shein の成功を促進する中国の工場の内部\n- 2025 年 1 月 12 日公開\nShein は 2008 年に中国で設立され、現在はシンガポールに本社を置いています。\n同社の株式市場への長い道のりは、世界的な野心を抱く中国企業が直面する地政学的な圧力と規制の監視を浮き彫りにしている。\n同社はかつて、ウォール街を視野に入れ、中国企業としては史上最大規模の株式市場デビューを目指していた。\n新型コロナウイルス感染症（Covid-19）のパンデミック中に、家に閉じこもった人々がオンライン小売業者に目を向けたため、同社の事業は急増した。\n買い物客が自社の衣類を大量に試着するクリップを共有し、これは「Shein Hauls」と呼ばれるトレンドであり、同社のオンラインでの存在感を高めた。\nシェインにとってこれまでのところ最大の市場である米国での新規株式公開（IPO）は、シェインの世界的な知名度をさらに高め、西側の資金調達を活用する機会を提供していただろう。\nしかし同社は、シェインの工場での強制労働への懸念を理由に上場計画に反対した米議員らの抵抗に直面した。このような申し立てに対し、同社は「強制労働を一切容認しない方針」をとっていると述べた。\n他のデザイナーのアイデアをコピーしたとして非難されている。シェイン氏は「侵害に関するすべての申し立てを真剣に受け止め」ており、すべてのデザイナーの権利を尊重していると述べた。\nシェイン氏はロンドンで株式市場にデビューする可能性も模索したが、同様の反対に直面した。\nBBCはさらなるコメントを求めてシェイン氏に連絡を取った。\n「唯一現実的な道」\n2025年、シェイン氏は香港に関心を移し、中国当局は今年7月にこの動きを承認した。\nError 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.",

let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});

  </script>
</body>
</html>
