    "id": "cornell-frat-house-rape-accuser-under-si-30afddef",
    "title": "Cornell frat house rape accuser 'under siege' online, says lawyer",
    "titleJa": "Cornell frat house rape accuser 'under siege' online, says lawyer",
    "summaryJa": "A lawyer for Jane Doe says she is \"not doing well\" amid attempts to uncover her identity.",
    "bodyOriginal": "Cornell frat house rape accuser 'under siege' online, says lawyer\n- Published\nThe lawyer for the woman who alleges she was raped at a Cornell University fraternity house says she is \"not doing well\" as she finds herself \"under siege\" from online sleuths seeking to identity her.\nThomas Giuffra said the woman known in legal documents as Jane Doe was \"incapable of consent\" because she was \"completely, grossly intoxicated\" when she turned up at the home where she says the assault took place.\nThe woman alleges she was assaulted by seven men at the campus in Ithaca, New York, in 2024.\nNo charges were initially filed in the case. It has reopened since she filed a civil lawsuit that thrust the claims into the national spotlight, reigniting the possibility of criminal charges.\nIn an interview on Friday with CNN, Giuffra said: \"She's under siege on social media where people are trying to identify her.\"\nHe said that postings have \"incorrectly\" identified other woman as Doe.\nIn an interview with CBS, the BBC's US partner, Giuffra argued that his client, aged 20 at the time, was unable to provide consent because she was intoxicated when she arrived at the fraternity house.\nGiuffra said she had been pressured into taking the drug ketamine before she was allegedly raped.\nHis comments came as New York Governor Kathy Hochul appointed the state's top prosecutor, Attorney General Letitia James, to take over the investigation.\nAt a news conference on Friday, Hochul said she had \"lost faith\" in the county prosecutor's ability to oversee the case.\n\"This young woman had already endured something that is utterly unspeakable, and then at every turn she was failed by people and institutions with an obligation to protect her,\" Hochul said.\nShe also vowed to close a \"loophole\" of state law that makes it difficult to press rape charges if an alleged victim voluntarily consumes alcohol or drugs.\nDuring an interview with investigators, Doe told campus police investigators: \"I was a sex doll for all intents and purposes, which is sad but, unfortunately, something I'm not used to, or something that I haven't experienced before.\"\nShe also said that she \"felt like bait\" as the attackers were \"like lions around me\", according to records from the school's disciplinary investigation, obtained by US media.\nSocial media feeds are filled with women trying to shield the Cornell accuser's identity by posting videos of themselves under the title \"I am Jane Doe\".\nAs well as seeking to complicate internet searches for her name, the messages of solidarity included clips of women detailing their own experiences of sexual assault.\nEfforts to rally round Jane Doe gathered pace after a political commentator vowed to unmask her, arguing it was unfair for her to remain anonymous while the men are publicly named despite not being charged with a crime.\nOnline sleuths have also tried to locate the addresses of the so-called Cornell Seven, leading to at least one case of mistaken identity.\nAn active-duty US Marine Corps sergeant who had the same name as one of the men was incorrectly served the woman's lawsuit, leading to a torrent of abuse and threats, according to the Free Press, external.",
    "bodyJa": "Cornell frat house rape accuser 'under siege' online, says lawyer\n- Published\nThe lawyer for the woman who alleges she was raped at a Cornell University fraternity house says she is \"not doing well\" as she finds herself \"under siege\" from online sleuths seeking to identity her.\nThomas Giuffra said the woman known in legal documents as Jane Doe was \"incapable of consent\" because she was \"completely, grossly intoxicated\" when she turned up at the home where she says the assault took place.\nThe woman alleges she was assaulted by seven men at the campus in Ithaca, New York, in 2024.\nNo charges were initially filed in the case. It has reopened since she filed a civil lawsuit that thrust the claims into the national spotlight, reigniting the possibility of criminal charges.\nIn an interview on Friday with CNN, Giuffra said: \"She's under siege on social media where people are trying to identify her.\"\nHe said that postings have \"incorrectly\" identified other woman as Doe.\nIn an interview with CBS, the BBC's US partner, Giuffra argued that his client, aged 20 at the time, was unable to provide consent because she was intoxicated when she arrived at the fraternity house.\nGiuffra said she had been pressured into taking the drug ketamine before she was allegedly raped.\nHis comments came as New York Governor Kathy Hochul appointed the state's top prosecutor, Attorney General Letitia James, to take over the investigation.\nAt a news conference on Friday, Hochul said she had \"lost faith\" in the county prosecutor's ability to oversee the case.\n\"This young woman had already endured something that is utterly unspeakable, and then at every turn she was failed by people and institutions with an obligation to protect her,\" Hochul said.\nShe also vowed to close a \"loophole\" of state law that makes it difficult to press rape charges if an alleged victim voluntarily consumes alcohol or drugs.\nDuring an interview with investigators, Doe told campus police investigators: \"I was a sex doll for all intents and purposes, which is sad but, unfortunately, something I'm not used to, or something that I haven't experienced before.\"\nShe also said that she \"felt like bait\" as the attackers were \"like lions around me\", according to records from the school's disciplinary investigation, obtained by US media.\nSocial media feeds are filled with women trying to shield the Cornell accuser's identity by posting videos of themselves under the title \"I am Jane Doe\".\nAs well as seeking to complicate internet searches for her name, the messages of solidarity included clips of women detailing their own experiences of sexual assault.\nEfforts to rally round Jane Doe gathered pace after a political commentator vowed to unmask her, arguing it was unfair for her to remain anonymous while the men are publicly named despite not being charged with a crime.\nOnline sleuths have also tried to locate the addresses of the so-called Cornell Seven, leading to at least one case of mistaken identity.\nAn active-duty US Marine Corps sergeant who had the same name as one of the men was incorrectly served the woman's lawsuit, leading to a torrent of abuse and threats, according to the Free Press, external.",

    "id": "cerebras-stock-hits-post-ipo-low-tumblin-6cf737d0",
    "title": "Cerebras stock hits post-IPO low, tumbling 20% for the week on Nvidia pressure and lockup expiration",
    "titleJa": "Cerebras stock hits post-IPO low, tumbling 20% for the week on Nvidia pressure and lockup expiration",
    "summaryJa": "Cerebras shares hit an all-time low due to pressure from chip giant Nvidia, plus a post-lockup selloff.",
    "bodyOriginal": "Cerebras stock plummeted nearly 20% this week to its lowest price since the company's monster IPO in May, after a report that chip giant Nvidia will power a crucial piece of OpenAI's latest model.\nResearch firm SemiAnalysis posted on X on Wednesday that OpenAI will power its \"Ultrafast\" mode for GPT-6.1 Sol with Nvidia graphics processing units instead of Cerebras hardware. Cerebras shares are now down by more than half since their initial pop that followed the company's debut on the Nasdaq.\nThe stock, which closed on Friday at $166.43, was also under pressure this week due to the expiration of post-IPO restrictions on some insider shares.\nHowever, it rose almost 3% in extended trading on Friday after OpenAI CEO Sam Altman responded to the \"speculation about our partnership with Cerebras.\"\n\"Cerebras is a close partner, and we have a deep engagement pushing on the frontiers of speed,\" Altman wrote in a post on X.\nStill, it's been a brutal stretch for Cerebras, which closed at a $95 billion market cap on the first day of trading, just shy of joining the ranks of Meta, Alibaba and now SpaceX, which closed their initial day with valuations over $100 billion.\nCerebras' market cap now sits at just over $39 billion.\nInvestors were excited by the prospect of an alternative to Nvidia to power AI. Cerebras makes dinner plate-sized ASICs, or a custom microchip built for inference workloads, and leases them from inside its own data centers as a cloud service. In January, Cerebras struck a deal worth over $10 billion with OpenAI to supply it with 750 megawatts of computing power through 2028.\nLosing OpenAI inference to Nvidia has put a damper on that exuberance. According to McKinsey, inference is set to surpass training as the most dominant workload in AI data centers by the end of the decade.\nMeanwhile, as more time passes from the IPO, additional shares will hit the market. According to the company's prospectus, up to 19.4 million shares held by directors, officers, non-executive employees, and non-employee holders unlocked on Wednesday. That's equal to 8% of total shares outstanding.\nPrior to that, up to 14.6 million shares have been unlocked for sale every two weeks since Aug. 19.\nCEO Andrew Feldman and CTO Sean Lie, both minted billionaires by the IPO process, sold over $240 million of Class A shares between Aug. 20 and Sept. 25 under trading plans adopted shortly after the IPO. Other executives have also sold shares valued in the millions.\nWATCH: CNBC’s full interview with Cerebras Systems CEO Andrew Feldman",

    "bodyOriginal": "Riot police clash with students as education protests rage in France\n- Published\nRiot police have clashed with protesters as thousands of students demonstrating over education standards disrupted more than 700 schools in France.\nFires have burned in the streets as high school pupils and others objected to a lack of teachers, overcrowded classrooms and run-down buildings. Interior Minister Laurent Nuñez said 1,747 people were arrested on Friday.\nThe protests began last week in the capital Paris and have spread across the country, with cities including Montpellier, Nantes and Marseille affected.\nFrench Justice Minister Gérald Darmanin said things had \"gone from high-school student demonstrations to a public order disturbance\".\nSchool protests send shivers down French government's spine\n- Published16 hours ago\nDarmanin said that 735 of France's 3,700 schools were now affected \"one way or another\" by the violent protests.\nAnnouncing the arrests late on Friday, Nuñez told France's TF1 television network: \"We are sliding into riot and urban violence, and we are using all intermediate means to put an end to it.\"\nMeanwhile, Education Minister Édouard Geffray said the movement had been hijacked by non-students.\nHe told French broadcaster BFMTV that teachers had said \"the people in front of me were not my students\".\nEarlier on Friday, a 17-year-old was arrested on suspicion of attempted homicide after protests in Belfort, north-eastern France, where a police officer was targeted.\nBBC Verify has now authenticated two videos that show the man, who was later identified as an officer by a minister, being beaten up.\nIn the graphic footage, a group of young men are seen chasing him. The officer falls to the ground, and is subsequently punched and kicked multiple times in the head.\nAt least 65 staff members have been injured in the unrest, the education ministry said.\nIn the Paris suburb of Pantin police charged at protesters and made arrests after projectiles where thrown at officers.\nMeanwhile, in Strasbourg tear gas was deployed as police feared conditions would become more hostile, according to the Reuters news agency.\nRubbish bins have also been set on fire in Rennes and Paris.\n\"As far as we're concerned, we've won - our school is closed this morning,\" Lola, a 16-year-old protester, told the AFP news agency on Friday.\nShe said police actions had made things worse.\n\"It makes us even angrier - the police have no right to hit us or use tear gas on us,\" she added.\nPolice published pictures of some of the items they had seized from demonstrators, including petrol bombs, an axe and so-called mortar fireworks.\n\"Significant damage\" had been done to school facilities, the education ministry said, after attacks on school gates, entrances and fences.\nNelson Mandela high school in Nantes suffered more than €2m (£1.7m) damage, according to the regional government, after fire destroyed its glass entrance and some areas inside the school.\nThe blockades and protests started last week before spreading to hundreds of schools across the country.\nStudents say school hours are too long, classrooms too hot and too many members of staff are off work.\nIt comes at a crucial time for French President Emmanuel Macron, six months before next year's presidential election.\nBudget cuts planned, which will impact on education funding, have infuriated the young protesters.\nParents have also been worried that their children have become caught up in a wave of violence and unrest.\nAt the Claude Monet school in southern Paris, 53-year-old Anya was looking for her son.\n\"We banned him from coming. I hope he isn't here, but he did leave the house,\" she told AFP. \"We're afraid the situation might escalate.\"\nDarmanin said prosecutors had been asked to hold parents liable for damage caused by their children and \"pay for repairs\".\nMany French unions have given their support to the protesting students.\nEducation union SNEP-FSU, public services union SNUEP-FSU and Solidaires have all called for members to support them.\nSolidaires Trade Union Federation said in a statement: \"Let's not let them fire on our children.\n\"Secondary school pupils have the freedom of assembly, association and demonstration.\"",

function formatDate(iso) {
  return new Date(iso).toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function getCategories() {
  const cats = new Set(ARTICLES.map((a) => a.category));
  return ["すべて", ...cats];
}

function getArticleById(id) {
  return ARTICLES.find((a) => a.id === id);
}

function getArticlesByCategory(category) {
  if (!category || category === "すべて") return ARTICLES;
  return ARTICLES.filter((a) => a.category === category);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function paragraphs(text) {
  return text.split("\n\n").filter(Boolean);
}


let activeCategory = "すべて";

function navigate(hash) {
  if (hash) location.hash = hash;
  else {
    history.pushState(null, "", location.pathname + location.search);
    location.hash = "";
  }
  render();
  window.scrollTo(0, 0);
}

function updateMobileBar(show) {
  const bar = document.getElementById("mobile-back-bar");
  document.body.classList.toggle("has-mobile-bar", show);
  if (bar) bar.classList.toggle("hidden", !show);
}

function getRoute() {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("article/")) {
    return { page: "article", id: decodeURIComponent(h.slice(8)) };
  }
  return { page: "home" };
}

function renderHome() {
  document.title = "BizNews JP | ビジネスニュース和訳";
  updateMobileBar(false);
  const main = document.getElementById("app");
  main.className = "main-content";
  main.innerHTML = `
    <section>
      <h1 class="page-title">ビジネスニュース</h1>
      <p class="page-desc">世界の主要メディアから厳選。要約と全文和訳付き。</p>
    </section>
    <div class="category-bar" id="category-bar" role="tablist" aria-label="カテゴリ"></div>
    <div id="articles-container"></div>
    <div class="info-box">
      <strong>記事の読み方：</strong>
      各記事を開くと、まず全文の要約（日本語）が表示されます。その下に和訳全文を掲載しています。原文は折りたたみで確認できます。
    </div>`;
  renderCategories();
  renderArticles();
}

function renderCategories() {
  const bar = document.getElementById("category-bar");
  if (!bar) return;
  const categories = getCategories();
  bar.innerHTML = categories
    .map(
      (cat) =>
        `<button type="button" class="cat-btn${cat === activeCategory ? " active" : ""}" data-category="${escapeHtml(cat)}" role="tab">${escapeHtml(cat)}</button>`
    )
    .join("");
  bar.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      renderCategories();
      renderArticles();
    });
  });
}

function renderArticles() {
  const container = document.getElementById("articles-container");
  if (!container) return;
  const filtered = getArticlesByCategory(activeCategory);
  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;padding:3rem 0">該当する記事がありません。</p>';
    return;
  }
  const [featured, ...rest] = filtered;
  let html = "";
  if (featured) {
    html += `
      <a href="#article/${encodeURIComponent(featured.id)}" class="featured-card" style="margin-bottom:0.75rem;display:block">
        <div class="featured-img-wrap">
          <img src="${featured.imageUrl}" alt="${escapeHtml(featured.titleJa)}" loading="lazy" />
          <div class="featured-overlay"></div>
          <div class="featured-overlay-text">
            <span class="badge">${escapeHtml(featured.category)}</span>
            <h2 class="featured-title">${escapeHtml(featured.titleJa)}</h2>
          </div>
        </div>
        <div class="card-body">
          <p class="card-summary">${escapeHtml(featured.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(featured.source)}</span><span>·</span>
            <span>${formatDate(featured.publishedAt)}</span><span>·</span>
            <span>${featured.readTime}分で読める</span>
          </div>
        </div>
      </a>`;
  }
  if (rest.length) {
    html += '<div class="articles-list">' + rest.map((a) => `
      <a href="#article/${encodeURIComponent(a.id)}" class="article-card">
        <div class="card-thumb"><img src="${a.imageUrl}" alt="${escapeHtml(a.titleJa)}" loading="lazy" /></div>
        <div class="card-content">
          <span class="badge badge-light">${escapeHtml(a.category)}</span>
          <h3 class="card-title">${escapeHtml(a.titleJa)}</h3>
          <p class="card-summary" style="-webkit-line-clamp:2;margin-top:0.25rem">${escapeHtml(a.summaryJa)}</p>
          <div class="card-meta">
            <span>${escapeHtml(a.source)}</span><span>·</span>
            <span>${formatDate(a.publishedAt)}</span>
          </div>
        </div>
      </a>`).join("") + "</div>";
  }
  container.innerHTML = html;
}

function renderArticlePage(id) {
  const article = getArticleById(id);
  const main = document.getElementById("app");
  main.className = "main-content article-detail";
  if (!article) {
    document.title = "記事が見つかりません | BizNews JP";
    updateMobileBar(false);
    main.innerHTML = `
      <div class="not-found">
        <h1>記事が見つかりません</h1>
        <p>お探しの記事は存在しないか、削除された可能性があります。</p>
        <a href="#" class="btn-primary" onclick="navigate('');return false;">トップに戻る</a>
      </div>`;
    return;
  }
  updateMobileBar(true);
  document.title = article.titleJa + " | BizNews JP";
  const parasJa = paragraphs(article.bodyJa).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  const parasEn = paragraphs(article.bodyOriginal).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
  main.innerHTML = `
    <a href="#" class="back-link" onclick="navigate('');return false;">← 記事一覧に戻る</a>
    <div class="article-hero"><img src="${article.imageUrl}" alt="${escapeHtml(article.titleJa)}" /></div>
    <header class="article-header">
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem">
        <span class="badge">${escapeHtml(article.category)}</span>
        <span style="font-size:0.75rem;color:#94a3b8">${escapeHtml(article.source)}</span>
      </div>
      <h1 class="article-h1">${escapeHtml(article.titleJa)}</h1>
      <p class="article-title-en">${escapeHtml(article.title)}</p>
      <div class="card-meta">
        <time datetime="${article.publishedAt}">${formatDate(article.publishedAt)}</time>
        <span>·</span><span>約${article.readTime}分で読める</span>
      </div>
    </header>
    <section>
      <div class="section-heading"><div class="section-bar"></div><h2>要約</h2></div>
      <div class="summary-box"><p>${escapeHtml(article.summaryJa)}</p></div>
    </section>
    <section>
      <div class="section-heading"><div class="section-bar gray"></div><h2>和訳全文</h2></div>
      <div class="translation-box">${parasJa}</div>
    </section>
    <section>
      <button type="button" class="toggle-btn" id="toggle-original" aria-expanded="false">
        <span>原文（英語）を表示する</span><span class="arrow">▼</span>
      </button>
      <div class="original-box hidden" id="original-box">${parasEn}</div>
    </section>
    <p class="source-line">出典：<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.source)}</a></p>`;
  const toggleBtn = document.getElementById("toggle-original");
  const originalBox = document.getElementById("original-box");
  toggleBtn.addEventListener("click", () => {
    const isHidden = originalBox.classList.toggle("hidden");
    const isOpen = !isHidden;
    toggleBtn.classList.toggle("open", isOpen);
    toggleBtn.setAttribute("aria-expanded", String(isOpen));
    toggleBtn.querySelector("span").textContent = isOpen ? "原文（英語）を隠す" : "原文（英語）を表示する";
  });
}

function render() {
  const route = getRoute();
  if (route.page === "article") renderArticlePage(route.id);
  else renderHome();
}

window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
document.addEventListener("DOMContentLoaded", () => {
  const backBtn = document.getElementById("mobile-back-btn");
  if (backBtn) backBtn.addEventListener("click", () => navigate(""));
  render();
});
